  intermediate_record:
    path: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest-epoch2.yaml
    sha256: 6e6eb5659c5576bda12398203d9c6ecf0466550303f7dbbda5b5b28214c06928
    role: The EXECUTOR's own epoch-2 record and the authority for every epoch-2 measurement, verdict, deviation and anomaly. It is not the superseding_path only because it inherits the multi-invocation shape that the run schema's one-command fields cannot express; manifest_v2.yaml adds those fields over both epochs and points back here for the values. Hash-pinned so all three records stay bound.
  registered: '2026-09-16'
  supersession_kind: terminal_run_result
  defect: 'Epoch 1''s manifest records NO TERMINAL OUTCOME: status incomplete_interrupted with result.valid null, because the executor subagent stopped mid-measurement on a monthly model-quota exhaustion and the Coordinator authored the manifest from the artifacts already on disk. Four of the seven acceptance criteria were NOT_EVALUABLE at that point. It also carries a defect of its own, recorded separately as CORR-20260916-b35a05: it sets hypothesis_id H-ICPERF-2c57cc where the frozen contract says null and warns against exactly that category error, since an instrument-acceptance run tests no hypothesis. Both are properties of a record that is immutable and stays so.'
  notes: 'THE RUN WAS RESUMED, NOT RERUN. Epoch 2 executed the remaining phases on a non-Opus binding under the same frozen contract and the same code tree, verified byte-identical against TASK-20260913-f8bdec''s frozen hashes, and composed the terminal state: all seven criteria now carry verdicts, hypothesis_id is correctly null, and the superseding record names in `supersedes.relation` exactly which phases epoch 1 still owns (A4, A5, A6, C-NOWRITE, C-BYTE part 1, C-PROBE, C-SUMREG, C-LOAD). Epoch 1''s manifest is therefore the authoritative record of those phases and is not replaced, edited or regenerated; this registration routes SCHEMA validation to the composed record without asserting that epoch 1''s observations were superseded as measurements. Both files stay hash-pinned and both remain in the tree. Archived under TASK-20260915-7da7f1 across two commits, for reasons recorded in that archive''s receipt-scope-note.json. A CONCURRENT SESSION REPAIRED THE SAME SIX SCHEMA ERRORS WITHIN THE HOUR by editing the epoch-1 manifest IN PLACE (commit 3dc30bfcf), which broke that archive''s content binding; the file was restored to its archived bytes and the reconciliation -- including a provenance error each session made, in opposite directions, about where epoch 1''s commands are recorded -- is CORR-20260916-5166fe.'
