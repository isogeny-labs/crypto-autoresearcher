name: Groebner comparison protocol
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['groebner_compare/**', '.github/workflows/groebner-comparison.yml']
  pull_request_target:
    branches: [main]
    types: [closed]
    paths: ['groebner_compare/**', '.github/workflows/groebner-comparison.yml']
# Supersede obsolete open-PR checks, and retain a distinct check for each merge.
concurrency:
  group: groebner-comparison-${{ github.event.action == 'closed' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  protocol:
    if: ${{ (github.event.action != 'closed' || github.event.pull_request.merged) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - run: python -m pip install pycryptosat==5.16.0
      - run: python -m unittest groebner_compare.test_protocol groebner_compare.test_research groebner_compare.test_relation_metrics -v
      - run: python -m groebner_compare.runner groebner_compare/smoke.json --output /tmp/groebner-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boolean-protocol-smoke
          path: /tmp/groebner-smoke
  m5gb-bridge:
    if: ${{ (github.event.action != 'closed' || github.event.pull_request.merged) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/manschga/M5GB.git /tmp/m5gb-upstream
      - run: git -C /tmp/m5gb-upstream checkout 2d063f748e8a16ac5a1d74641c79725df29f67ac
      - run: python -m groebner_compare.build_m5gb /tmp/m5gb-upstream /tmp/m5gb-bridge
      - name: Check original M5GB basis against independent Boolean certificate
        env:
          M5GB_BINARY: /tmp/m5gb-bridge
        run: python -m unittest groebner_compare.test_research.SolverTrials.test_upstream_m5gb_basis -v
  julia-adapter:
    if: ${{ (github.event.action != 'closed' || github.event.pull_request.merged) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Resolve adapter dependencies (not benchmark evidence)
        run: julia --project=.ci-julia -e 'using Pkg; Pkg.add(["Groebner", "AbstractAlgebra", "JSON3"]); Pkg.status()'
      - name: Check real learn, apply, support rejection, and fresh solve
        env:
          TEST_GROEBNER_JULIA: '1'
        run: python -m unittest groebner_compare.test_protocol.ProtocolTests.test_julia_adapter -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-adapter-environment
          path: .ci-julia/*toml
  polybori-adapter:
    if: ${{ (github.event.action != 'closed' || github.event.pull_request.merged) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: sagemath/sagemath:10.6
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Check real PolyBoRi output against original Boolean equations
        env:
          TEST_GROEBNER_SAGE: '1'
        run: sage -python -m unittest groebner_compare.test_protocol.ProtocolTests.test_polybori_adapter -v
