name: lean-verification
# Keep both existing check contexts available for branch protection and merge
# queues. Only positively identified irrelevant inputs skip the costly steps.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [closed]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
# A newer revision of an open PR supersedes the older check. A merged PR runs
# against its main commit, while direct bot commits do not start this gate.
concurrency:
  group: lean-${{ github.event.action == 'closed' && github.sha || github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
jobs:
  changes:
    if: ${{ (github.event.action != 'closed' || github.event.pull_request.merged) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.scope.outputs.formal_workspace }}
      kernel: ${{ steps.scope.outputs.formal_kernel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts
      - id: scope
        run: python3 .github/scripts/ci_scope.py

  kernel-controls:
    needs: changes
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged) &&
      !github.event.pull_request.draft &&
      (!cancelled())
    env:
      SCOPE_RESULT: ${{ needs.changes.result }}
      RUN_KERNEL: ${{ needs.changes.outputs.kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a complete CI scope decision
        run: |
          [ "$SCOPE_RESULT" = success ] || exit 1
          [ "$RUN_KERNEL" = true ] || [ "$RUN_KERNEL" = false ] || exit 1
      - name: Scope excludes formal kernel controls
        if: env.RUN_KERNEL == 'false'
        run: echo "No formal harness input changed; check completed without checkout or Lean setup."
      - uses: actions/checkout@v4
        if: env.RUN_KERNEL == 'true'
        with:
          sparse-checkout: |
            formal
            orchestration
            tools
            tests
            harness
            src
            agents
            evals
      - uses: actions/setup-python@v5
        if: env.RUN_KERNEL == 'true'
        with:
          python-version: '3.11'
      # Installs the package itself so the dependency set lives in
      # pyproject.toml rather than being duplicated per workflow. The
      # research-loop extra carries pydantic, which
      # tests/test_mathcode_formalizer.py needs transitively via
      # orchestration.formal.pipeline -> orchestration.routing.models; without
      # it pytest aborts at COLLECTION, so no Lean control test runs at all.
      - run: python -m pip install -e '.[research-loop,dev]'
        if: env.RUN_KERNEL == 'true'
      - name: Materialize formal target source documents
        if: env.RUN_KERNEL == 'true'
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path, PurePosixPath
          import yaml
          patterns = ["/*.md", "/*.py", "/*.toml", "/*.txt", "/.python-version", "/Makefile"]
          patterns += [f"/{p}/" for p in ("formal", "orchestration", "tools", "tests", "harness", "src", "agents", "evals")]
          for spec in sorted(Path("formal/targets").glob("*.yaml")):
              source = yaml.safe_load(spec.read_text())["source"]
              p = PurePosixPath(source)
              if p.is_absolute() or ".." in p.parts or any(c in source for c in "\n\r"):
                  raise SystemExit(f"Invalid target source path in {spec}: {source!r}")
              literal = re.sub(r"([\\*?\[\]!# ])", r"\\\1", source)
              patterns.append("/" + literal)
          subprocess.run(["git", "sparse-checkout", "set", "--no-cone", "--stdin"],
                         input="\n".join(patterns) + "\n", text=True, check=True)
          for spec in sorted(Path("formal/targets").glob("*.yaml")):
              source = yaml.safe_load(spec.read_text())["source"]
              if not Path(source).is_file():
                  raise SystemExit(f"Missing target source in {spec}: {source}")
          PY
      - name: Prefetch pinned control toolchain
        if: env.RUN_KERNEL == 'true'
        run: bash tools/prefetch_pinned_lean.sh formal/smoke/lean-toolchain
      - uses: leanprover/lean-action@v1
        if: env.RUN_KERNEL == 'true'
        with:
          lake-package-directory: formal/smoke
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Require real Lean before tests (no skipped proof controls)
        if: env.RUN_KERNEL == 'true'
        run: |
          command -v lake
          cd formal/smoke
          lake env lean --version
      - name: Verify positive and negative controls through the harness
        if: env.RUN_KERNEL == 'true'
        run: |
          python -m pytest tests/test_lean_live.py tests/test_formal_research_lane.py \
            tests/test_formal_verification_session.py \
            tests/test_formal_targets.py tests/test_formal_frontier_integration.py \
            tests/test_mathcode_formalizer.py tests/test_lean_dependency_pins.py -q --junitxml=lean-controls.xml
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_KERNEL == 'true'
        with:
          name: lean-controls
          path: lean-controls.xml

  # The job above builds formal/smoke -- a pinned, dependency-free control
  # project -- and never formal/, where theorem files live. That is what it is
  # for: it is fast and it proves the harness's Lean plumbing works. It is NOT
  # a proof gate, and for a while it was the only Lean job, so the lane's first
  # machine-checked theorem reached main with no CI having built it.
  #
  # This job is the proof gate. It costs a Mathlib cache fetch (minutes, not
  # the hours a from-source Mathlib build would take), which is why it is
  # separate: kernel-controls stays fast and still gates every PR that touches
  # the harness, while this one gates the mathematics.
  formal-workspace:
    name: formal workspace (lake build + axiom audit)
    needs: changes
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged) &&
      !github.event.pull_request.draft &&
      (!cancelled())
    env:
      BUILD_WORKSPACE: ${{ needs.changes.outputs.workspace }}
      SCOPE_RESULT: ${{ needs.changes.result }}
    runs-on: ubuntu-latest
    # Hosted run 40046183587 spent ~20 min restoring/building Mathlib and then
    # reached only target 21/84 before the 25 min job limit cancelled the audit.
    # Keep enough time for the entire non-vacuous per-target proof gate.
    timeout-minutes: 90
    steps:
      - name: Require a complete CI scope decision
        run: |
          [ "$SCOPE_RESULT" = success ] || exit 1
          [ "$BUILD_WORKSPACE" = true ] || [ "$BUILD_WORKSPACE" = false ] || exit 1
      - name: Scope excludes proof workspace
        if: env.BUILD_WORKSPACE == 'false'
        run: echo "Only smoke controls, tests or formal documentation changed; no proof workspace input changed."
      - uses: actions/checkout@v4
        if: env.BUILD_WORKSPACE == 'true'
        with:
          sparse-checkout: |
            formal
            orchestration
            tools
            tests
            harness
            src
            agents
            evals
      # Mathlib's oleans are several GB extracted. The runner has room, but not
      # so much of it that the preinstalled toolchains are worth keeping.
      - name: Reclaim disk before fetching Mathlib
        if: env.BUILD_WORKSPACE == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /
      - uses: actions/setup-python@v5
        if: env.BUILD_WORKSPACE == 'true'
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[research-loop,dev]'
        if: env.BUILD_WORKSPACE == 'true'
      - name: Materialize formal target source documents
        if: env.BUILD_WORKSPACE == 'true'
        run: |
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path, PurePosixPath
          import yaml
          patterns = ["/*.md", "/*.py", "/*.toml", "/*.txt", "/.python-version", "/Makefile"]
          patterns += [f"/{p}/" for p in ("formal", "orchestration", "tools", "tests", "harness", "src", "agents", "evals")]
          for spec in sorted(Path("formal/targets").glob("*.yaml")):
              source = yaml.safe_load(spec.read_text())["source"]
              p = PurePosixPath(source)
              if p.is_absolute() or ".." in p.parts or any(c in source for c in "\n\r"):
                  raise SystemExit(f"Invalid target source path in {spec}: {source!r}")
              literal = re.sub(r"([\\*?\[\]!# ])", r"\\\1", source)
              patterns.append("/" + literal)
          subprocess.run(["git", "sparse-checkout", "set", "--no-cone", "--stdin"],
                         input="\n".join(patterns) + "\n", text=True, check=True)
          for spec in sorted(Path("formal/targets").glob("*.yaml")):
              source = yaml.safe_load(spec.read_text())["source"]
              if not Path(source).is_file():
                  raise SystemExit(f"Missing target source in {spec}: {source}")
          PY
      # CryptoResearch.lean is derived from the directory and gitignored, so it
      # does not exist in a fresh checkout and lake cannot build the library
      # without it. `formal verify` regenerates it too; doing it here as well
      # keeps the cache fetch below from being the step that discovers it.
      - name: Generate the workspace root module
        if: env.BUILD_WORKSPACE == 'true'
        run: python3 tools/rebuild_formal_root.py --workspace formal
      - name: Prefetch pinned proof toolchains
        if: env.BUILD_WORKSPACE == 'true'
        run: |
          bash tools/prefetch_pinned_lean.sh formal/lean-toolchain
          bash tools/prefetch_pinned_lean.sh formal/scoped-obstructions/lean-toolchain
      - uses: leanprover/lean-action@v1
        if: env.BUILD_WORKSPACE == 'true'
        with:
          lake-package-directory: formal
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      # Explicit rather than lean-action's use-mathlib-cache, to mirror
      # formal/setup.sh step for step: whatever CI does here is what a
      # contributor reproduces locally.
      - name: Restore pinned Mathlib dependencies
        if: env.BUILD_WORKSPACE == 'true'
        uses: actions/cache@v4
        with:
          path: formal/.lake/packages
          key: mathlib-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}
      - name: Fetch prebuilt Mathlib oleans
        if: env.BUILD_WORKSPACE == 'true'
        working-directory: formal
        run: lake exe cache get
      - name: Verify actual installed dependency source pins before proof checks
        if: env.BUILD_WORKSPACE == 'true'
        run: python3 tools/check_lean_dependency_pins.py --workspace formal --artifact-out formal-receipts/dependency-pins-before.json
      # setup.sh's next step, and its own step here on purpose: when lake fails
      # this prints lake's error where someone triaging a red build will read
      # it, instead of only inside the verifier's receipt artifact.
      - name: Build the workspace
        if: env.BUILD_WORKSPACE == 'true'
        working-directory: formal
        run: lake build
      # The gate: forbidden-construct scan, lake build, project axiom audit,
      # and a per-theorem audit confirming the named theorem was in what got
      # audited. Exit 3 means the toolchain fell over and is reported as
      # infrastructure, never as a proof that failed to check.
      - name: Machine-check every discharged formal target
        if: env.BUILD_WORKSPACE == 'true'
        run: python3 tools/verify_formal_targets.py --artifact-dir formal-receipts --min-verified 66
      - name: Verify installed dependency source pins after proof checks
        if: env.BUILD_WORKSPACE == 'true'
        run: python3 tools/check_lean_dependency_pins.py --workspace formal --artifact-out formal-receipts/dependency-pins-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-verification-receipts
          path: formal-receipts
