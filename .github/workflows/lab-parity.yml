name: lab-parity
# artifact-store: no-pull (parity reads only its tracked lock and named input files)

# The cross-repository contract (docs/lab-contract.md): every skill resolves on
# both agent surfaces, and every shared file matches docs/shared-code.lock.json.
# A copy edited on one side fails here until the owner change lands and the lock
# is updated everywhere.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-parity-${{ github.event.action == 'closed' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    name: "${{ github.event_name == 'pull_request_target' && 'post-merge / ' || '' }}parity"
    if: ${{ (github.event.action != 'closed' || github.event.pull_request.merged) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Both complete skill surfaces, their plugin targets, and every file
          # this repository checks in shared-code.lock.json. A new lock entry
          # outside this list fails the input guard until included here.
          sparse-checkout: |
            /.agents/skills/
            /.claude/skills/
            /plugins/
            /tools/check_skills_parity.py
            /tools/check_lab_parity.py
            /tools/curve_identity.py
            /tools/task_card.py
            /tools/artifacts/artifacts.py
            /tools/research_wip.py
            /docs/shared-code.lock.json
            /docs/curve-identities.md
            /docs/lab-contract.md
            /docs/research-wip-policy.json
            /docs/research-wip.md
            /tools/benchrec.py
            /tools/test_benchrec.py
            /.claude/hooks/benchrec-hook.sh
            /docs/benchmark-records.md
            /tools/pcc/pcc.py
            /tools/pcc/test_pcc.py
            /docs/SABOTAGE_RESISTANCE.md
            /scripts/kb_usage_report.py
            /scripts/test_kb_usage_report.py
      - name: Unlock research vault (AES-256)
        shell: bash
        env:
          KEY: ${{ secrets.KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${KEY:-}" ]; then
            echo "vault: KEY is unavailable; refusing to run on ciphertext" >&2
            exit 1
          fi
          tool="$RUNNER_TEMP/cavault.py"
          git show "HEAD:tools/vault/vaultctl.py" > "$tool"
          py=python3
          if ! "$py" -c 'from cryptography.hazmat.primitives.ciphers.aead import AESSIV; c=AESSIV(bytes(64)); assert c.decrypt(c.encrypt(b"", None), None) == b""' >/dev/null 2>&1; then
            venv="$RUNNER_TEMP/cavault-venv"
            if "$py" -m venv "$venv" >/dev/null 2>&1; then
              py="$venv/bin/python"
              "$py" -m pip install --quiet --disable-pip-version-check 'cryptography>=46'
            else
              "$py" -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=46'
            fi
          fi
          "$py" "$tool" install-key --quiet
          "$py" "$tool" setup --quiet --script "$tool"
          "$py" "$tool" unlock --quiet
      - name: Require complete parity inputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          surfaces = ('.agents/skills', '.claude/skills')
          tracked = set(filter(None, subprocess.check_output(
              ['git', 'ls-files', '-z', '--', *surfaces], text=True).split('\0')))
          for surface in surfaces:
              if not any(p.startswith(surface + '/') for p in tracked):
                  raise SystemExit(f'Missing tracked skill surface: {surface}')
          lock = json.loads(Path('docs/shared-code.lock.json').read_text())
          paths = tracked | {entry['path'] for entry in lock['files']
                             if 'crypto-autoresearcher' in entry['repos']}
          missing = sorted(p for p in paths if not Path(p).exists())
          if missing:
              raise SystemExit('Parity inputs absent from checkout: ' + ', '.join(missing))
          print(f'Parity inputs present: {len(tracked)} skill paths, {len(paths - tracked)} shared files')
          PY
      - name: Skills surfaces
        run: python3 tools/check_skills_parity.py
      - name: Shared-code lock
        run: python3 tools/check_lab_parity.py --repo crypto-autoresearcher

  protocol-controls:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/task_card.py
            /tools/test_task_card.py
            /tools/benchrec.py
            /tools/test_benchrec.py
            /tools/pcc/pcc.py
            /tools/pcc/test_pcc.py
            /tools/vault/
      - name: Unlock research vault (AES-256)
        shell: bash
        env:
          KEY: ${{ secrets.KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${KEY:-}" ]; then
            echo "vault: KEY is unavailable; refusing to run on ciphertext" >&2
            exit 1
          fi
          tool="$RUNNER_TEMP/cavault.py"
          git show "HEAD:tools/vault/vaultctl.py" > "$tool"
          py=python3
          if ! "$py" -c 'from cryptography.hazmat.primitives.ciphers.aead import AESSIV; c=AESSIV(bytes(64)); assert c.decrypt(c.encrypt(b"", None), None) == b""' >/dev/null 2>&1; then
            venv="$RUNNER_TEMP/cavault-venv"
            if "$py" -m venv "$venv" >/dev/null 2>&1; then
              py="$venv/bin/python"
              "$py" -m pip install --quiet --disable-pip-version-check 'cryptography>=46'
            else
              "$py" -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=46'
            fi
          fi
          "$py" "$tool" install-key --quiet
          "$py" "$tool" setup --quiet --script "$tool"
          "$py" "$tool" unlock --quiet
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install the task card YAML parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Original owner detached-step and relay controls
        env:
          GIT_NO_LAZY_FETCH: '1'
        run: python3 -m unittest discover -s tools -p test_task_card.py -v
      - name: Benchmark record schema and immutable-custody controls
        env:
          GIT_NO_LAZY_FETCH: '1'
        run: python3 -m unittest discover -s tools -p test_benchrec.py -v
      - name: Canonical owner PCC admission controls
        env:
          GIT_NO_LAZY_FETCH: '1'
        run: python3 -m unittest discover -s tools/pcc -p test_pcc.py -v
