name: bench-records
# artifact-store: no-pull (scoped report hydration runs below, after credentials)

# docs/benchmark-records.md: every benchmark run leaves a bench.record/v1 file
# in Git with its raw data hashed and located in S3, and regenerates the
# progress report. This fails a pull request that adds a benchmark entry
# without a record, carries a malformed, open or edited record, cites a raw
# object that is not in S3, or leaves the progress report stale. It runs no
# experiment. With the artifact-store credentials it first copies raw files
# that are in Git into the content-addressed store, so a small raw file
# reaches S3 from the PR itself; without them the S3 check fails closed.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-records-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  records:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Unlock research vault (AES-256)
        shell: bash
        env:
          KEY: ${{ secrets.KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${KEY:-}" ]; then
            echo "vault: KEY is unavailable; refusing to run on ciphertext" >&2
            exit 1
          fi
          tool="$RUNNER_TEMP/cavault.py"
          git show "HEAD:tools/vault/vaultctl.py" > "$tool"
          py=python3
          if ! "$py" -c 'import cryptography' >/dev/null 2>&1; then
            venv="$RUNNER_TEMP/cavault-venv"
            if "$py" -m venv "$venv" >/dev/null 2>&1; then
              py="$venv/bin/python"
              "$py" -m pip install --quiet --disable-pip-version-check 'cryptography>=42'
            else
              "$py" -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=42'
            fi
          fi
          "$py" "$tool" install-key --quiet
          "$py" "$tool" setup --quiet --script "$tool"
          "$py" "$tool" unlock --quiet
      - name: Tool tests
        run: python3 -m unittest tools/test_benchrec.py tools/test_hydrate_bench_validations.py
      - name: Configure S3 credentials
        if: ${{ env.KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.ARTIFACTS_AWS_REGION || 'us-east-2' }}
      - name: Hydrate reports named by benchmark records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          config_path = Path('.benchrec.json')
          config = json.loads(config_path.read_text()) if config_path.exists() else {}
          records = Path(config.get('records_dir', 'benchmarks/records'))
          paths = set()
          for record in sorted(records.glob('*.json')):
              reports = json.loads(record.read_text()).get('reports', {})
              if reports.get('pdf'):
                  paths.add(reports['pdf'])
              paths.update(reports.get('svg', []))
              paths.update(reports.get('png', []))
          if paths:
              subprocess.run([sys.executable, 'tools/artifacts/artifacts.py', 'pull', *sorted(paths)], check=True)
          PY
      - name: Restore lossless logical validation files
        run: python3 tools/hydrate_bench_validations.py
      - name: Copy raw files that are in Git into the store
        if: ${{ env.KEY_ID != '' && github.event_name == 'pull_request' }}
        run: |
          set -e
          base="origin/${{ github.base_ref }}"
          records_dir="$(python3 -c 'import json,pathlib;c=pathlib.Path(".benchrec.json");print((json.loads(c.read_text()) if c.exists() else {}).get("records_dir","benchmarks/records"))')"
          for r in $(git diff --name-only --diff-filter=ACMR "$(git merge-base "$base" HEAD)...HEAD" -- "$records_dir"); do
            [ -f "$r" ] && python3 tools/benchrec.py upload "$r" || true
          done
      - name: Records complete, raw data in S3, progress report current
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 tools/benchrec.py check --base "origin/${{ github.base_ref }}" --verify-s3
          else
            python3 tools/benchrec.py check --verify-s3
          fi
