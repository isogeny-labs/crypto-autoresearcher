name: curvesmash-verifier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'orchestration/verification.py'
      - 'orchestration/cli.py'
      - 'config/curvesmash/**'
      - 'tests/test_verification.py'
      - 'pyproject.toml'
      - '.github/workflows/curvesmash-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curvesmash-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-integration:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            orchestration
            config
            tests
            tools
            src
            harness
      - name: Unlock research vault (AES-256)
        shell: bash
        env:
          KEY: ${{ secrets.KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${KEY:-}" ]; then
            echo "vault: KEY is unavailable; refusing to run on ciphertext" >&2
            exit 1
          fi
          tool="$RUNNER_TEMP/cavault.py"
          git show "HEAD:tools/vault/vaultctl.py" > "$tool"
          py=python3
          if ! "$py" -c 'import cryptography' >/dev/null 2>&1; then
            venv="$RUNNER_TEMP/cavault-venv"
            if "$py" -m venv "$venv" >/dev/null 2>&1; then
              py="$venv/bin/python"
              "$py" -m pip install --quiet --disable-pip-version-check 'cryptography>=42'
            else
              "$py" -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=42'
            fi
          fi
          "$py" "$tool" install-key --quiet
          "$py" "$tool" setup --quiet --script "$tool"
          "$py" "$tool" unlock --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the immutable verifier and test dependencies
        run: python -m pip install -e '.[dev,verifier]'
      - name: Require the optional backend in this integration job
        run: python -c 'from llm_verifier.artifacts import implementation; print(implementation()["content_sha256"])'
      - name: Exercise real snapshots and phase validation without inference or Docker
        run: python -m pytest -q tests/test_verification.py
