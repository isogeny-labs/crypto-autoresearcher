name: curvesmash-verifier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'orchestration/verification.py'
      - 'orchestration/cli.py'
      - 'config/curvesmash/**'
      - 'tests/test_verification.py'
      - 'pyproject.toml'
      - '.github/workflows/curvesmash-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curvesmash-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-integration:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            orchestration
            config
            tests
            tools
            src
            harness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the immutable verifier and test dependencies
        run: python -m pip install -e '.[dev,verifier]'
      - name: Require the optional backend in this integration job
        run: python -c 'from llm_verifier.artifacts import implementation; print(implementation()["content_sha256"])'
      - name: Exercise real snapshots and phase validation without inference or Docker
        run: python -m pytest -q tests/test_verification.py
