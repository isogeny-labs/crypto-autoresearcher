# artifact-store: no-pull (ingests new papers and tracked literature records, not stored report PDFs)
name: daily-literature

on:
  schedule:
    # Off the hour; GitHub schedules are best effort and run on default branch.
    - cron: "37 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: daily-literature
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 30 min batch wait + room to run unfinished papers synchronously.
    timeout-minutes: 80
    env:
      LITERATURE_BUCKET: ${{ vars.LITERATURE_S3_BUCKET }}
      LITERATURE_ROLE: ${{ vars.LITERATURE_S3_ROLE_ARN }}
      AWS_REGION: ${{ vars.LITERATURE_AWS_REGION || 'us-west-2' }}
      LITERATURE_MODEL: ${{ vars.LITERATURE_MODEL || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
          token: ${{ secrets.LITERATURE_PR_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check configuration
        run: |
          if [ -z "$LITERATURE_BUCKET" ] || [ -z "$LITERATURE_ROLE" ]; then
            echo "::error::Set repository variables LITERATURE_S3_BUCKET and LITERATURE_S3_ROLE_ARN; see docs/daily-literature-ingest.md"
            exit 1
          fi

      - name: Install small ingestion dependencies
        run: python3 -m pip install 'PyYAML>=6.0,<7' 'boto3>=1.34,<2' 'PyMuPDF>=1.25,<2'

      # Keep old unreviewed entries on one bot branch; merge main into it, never
      # replace or rebase research records. Only derived indexes may be rebuilt
      # after a merge conflict. Fail on any substantive conflict.
      - name: Prepare review branch
        shell: bash
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin automation/literature-daily >/dev/null; then
            git fetch origin automation/literature-daily
            git switch -c automation/literature-daily --track origin/automation/literature-daily
            git diff --name-only origin/main...HEAD | while IFS= read -r path; do
              case "$path" in
                knowledge/literature/KN-LIT-*.md|knowledge/SOURCES.md|knowledge/sources.json) ;;
                *) echo "::error::Unexpected file on automation branch: $path"; exit 1 ;;
              esac
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git merge --no-edit origin/main; then
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ -z "$conflicts" ]; then exit 1; fi
              while IFS= read -r path; do
                case "$path" in
                  knowledge/SOURCES.md|knowledge/sources.json)
                    git restore --source=origin/main --worktree --staged -- "$path" ;;
                  *) git merge --abort
                     echo "::error::Substantive merge conflict: $path"; exit 1 ;;
                esac
              done <<< "$conflicts"
              git commit --no-edit
            fi
          else
            git switch -c automation/literature-daily
          fi

      - name: Assume paper archive role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.LITERATURE_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check feeds, archive new PDFs, write KN-LIT drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 tools/daily_literature_ingest.py \
            --days 7 --max-new 20 --bucket "$LITERATURE_BUCKET" \
            --delivery batch --batch-wait-seconds 1800 \
            --batch-registry "$RUNNER_TEMP/literature-batches" \
            --report "$RUNNER_TEMP/daily-literature.json"

      - name: Rebuild and validate derived knowledge
        run: |
          python3 tools/build_source_index.py
          python3 tools/build_knowledge_index.py --verify-corpus
          python3 tools/build_source_index.py --check
          git diff --check

      - name: Publish review branch and PR
        env:
          GH_TOKEN: ${{ secrets.LITERATURE_PR_TOKEN || github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- knowledge/literature/KN-LIT-*.md knowledge/SOURCES.md knowledge/sources.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "knowledge: queue recent crypto papers for review"
          fi
          # A zero-change run creates no branch or PR. Existing pending entries
          # stay on this branch even when they leave the 7-day feed window.
          if git diff --quiet origin/main HEAD; then
            echo "No pending literature changes"
            exit 0
          fi
          git push --set-upstream origin HEAD:refs/heads/automation/literature-daily
          pr=$(gh pr list --base main --head automation/literature-daily \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            cat > "$RUNNER_TEMP/daily-literature-pr.md" <<'EOF'
          Automated intake of recent IACR ePrint and arXiv attack/speedup candidates.

          Each KN-LIT record is **reported** and based on source metadata and
          machine-distilled PDF text, with short excerpts checked literally
          against extracted PDF pages. The PDF is stored in S3 with a SHA-256
          receipt. A curator must inspect it and supersede the draft before
          using any specific claim as reviewed literature.

          See `docs/daily-literature-ingest.md` for filtering, provenance,
          deduplication, limits and the daily workflow's AWS permissions.
          EOF
            gh pr create --base main --head automation/literature-daily \
              --title "knowledge: review newly released crypto papers" \
              --body-file "$RUNNER_TEMP/daily-literature-pr.md"
          else
            echo "Updated existing literature PR #$pr"
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ['RUNNER_TEMP']) / 'daily-literature.json').read_text())
          print(f"## Daily literature intake\n\n{r['checked']} matching feed papers; "
                f"{len(r['existing'])} known; {len(r['added'])} new drafts.\n")
          for item in r['added']:
              print(f"- {item['record_id']}: {item['url']} → {item['pdf']['uri']}")
          PY
