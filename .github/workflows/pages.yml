# Publish the research dashboard to GitHub Pages.
#
# The site is a SNAPSHOT of one commit, rebuilt on every push to main so it
# tracks the merges that actually change the corpus. `data/meta.json` carries
# the sha and build time, the page shows both, and every record links to its
# source at that sha -- a static page that implied freshness would mislead on
# exactly the point that matters.
#
# ONE-TIME SETUP: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Until that is set, this workflow builds and then fails at
# the deploy step with "Get Pages site failed".
name: pages

on:
  push:
    branches: [main]
    # The dashboard reads these and nothing else. A push that touches only
    # docs or another campaign's tooling does not need a 125 MB redeploy.
    paths:
      - 'ledger/**'
      - 'experiments/**'
      - 'knowledge/**'
      - 'ui/**'
      - 'orchestration/research-priority.yaml'
      - 'tools/ecc_priority.py'
      - 'tools/curve_identity.py'
      - '.github/workflows/pages.yml'
  # A safety net: `paths` above can miss a change that reaches the corpus
  # through a path nobody predicted, which is how the generated-artifact
  # globs in .gitignore kept growing.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  # Build (never deploy) on a pull request that changes the dashboard itself.
  # Deliberately NOT the corpus paths above: a research PR cannot break the
  # build, and paying two minutes on every one of them is the coupling this
  # repository has spent real effort removing. Without this, a workflow or
  # builder mistake would first surface AFTER merge, on main, with the
  # published page as the thing that breaks.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ui/**'
      - 'tests/test_ui_index.py'
      - 'tests/test_ui_client.cjs'
      - 'tests/test_ui_ops.py'
      - 'tests/test_ui_benchmarks.py'
      - 'tests/test_curve_identity.py'
      - 'tools/curve_identity.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

# Merges to main arrive in bursts. Publish the newest and drop the ones it
# supersedes, but never interrupt a deploy that is already uploading. A PR
# build is a check, not a publication, so it gets its own group and its
# superseded runs are cancelled.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The dashboard reads commit times from history: most of this corpus
          # declares no date of its own, and `ui/gitdates.py` supplies one per
          # record. The default depth-1 checkout has a single commit, under
          # which every record would appear committed at the same instant --
          # so the builder refuses to emit dates at all on a shallow clone,
          # and this is what keeps them available.
          fetch-depth: 0
          filter: blob:none
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments knowledge

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PyYAML is the dashboard's only runtime dependency; pytest is here to
      # run its tests, below. Neither the package nor its optional extras is
      # installed -- the dashboard deliberately does not need them.
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0' 'pytest>=8.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check reader interactions without a browser service
        run: |
          npm ci --prefix ui --ignore-scripts --no-audit --no-fund
          npm test --prefix ui

      - name: Check the UI against its own tests
        run: python -m pytest tests/test_ui_index.py tests/test_ui_ops.py tests/test_ui_benchmarks.py tests/test_curve_identity.py -q

      # PR previews validate the static reader without AWS credentials.
      # The operations panel reports unavailable in this preview.
      - name: Build the static site for review
        if: github.event_name == 'pull_request'
        run: python -m ui.build --out site --report site-report.json

      # Only a publishing build reads CloudWatch. Keep these credentials out
      # of the PR build step, which executes code from the proposed branch.
      - name: Build the static site for publication
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        run: python -m ui.build --out site --report site-report.json

      # A build that produced no records would deploy an empty dashboard over
      # a working one. Fail here instead.
      - name: Verify the build is not empty
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path('site-report.json').read_text())
          problems = []
          if report['records'] < 100:
              problems.append(f"only {report['records']} records indexed")
          for required in ('index.html', 'app.js', 'app.css',
                           'data/meta.json', 'data/index.json', 'data/overview.json',
                           'data/goals.json', 'data/experiments.json',
                           'data/findings.json', 'data/integrity.json', 'data/ops.json',
                           'data/progress.json', 'data/comparisons.json'):
              if not Path('site', required).is_file():
                  problems.append(f'missing {required}')
          # GitHub Pages publishes at most 1 GB.
          if report['bytes'] > 900e6:
              problems.append(f"{report['megabytes']} MB exceeds the 1 GB Pages limit")
          if problems:
              print('BUILD REJECTED: ' + '; '.join(problems), file=sys.stderr)
              raise SystemExit(1)
          summary = (
              f"| records | {report['records']} |\n"
              f"| files | {report['files']} |\n"
              f"| size | {report['megabytes']} MB |\n"
              f"| build | {report['seconds']} s |\n"
              f"| unparseable ledger records | {report['unparseable']} |\n")
          Path('summary.md').write_text(
              '### Dashboard snapshot\n\n| | |\n| --- | --- |\n' + summary)
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # A pull request stops here: it has proved the site builds, and
      # uploading 125 MB it will never publish is waste.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    timeout-minutes: 5
    needs: build
    if: >-
      !github.event.pull_request.draft &&
      (github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    # Scoped to this job: the build needs neither, and a token that can
    # publish the site should not be live while arbitrary branch code runs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
