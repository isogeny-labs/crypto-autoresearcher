name: polynomial-solver-ml

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tasks/polynomial_solver_ml/**'
      - '.github/workflows/polynomial-solver-ml.yml'
  pull_request_target:
    branches: [main]
    types: [closed]
    paths:
      - 'tasks/polynomial_solver_ml/**'
      - '.github/workflows/polynomial-solver-ml.yml'
  workflow_dispatch:

# Supersede obsolete open-PR checks, and retain a distinct check for each merge.
concurrency:
  group: polynomial-solver-ml-${{ github.event.action == 'closed' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  software-benchmark:
    name: "${{ github.event_name == 'pull_request_target' && 'post-merge / ' || '' }}software-benchmark"
    if: ${{ (github.event.action != 'closed' || github.event.pull_request.merged) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Unlock research vault (AES-256)
        shell: bash
        env:
          KEY: ${{ secrets.KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${KEY:-}" ]; then
            echo "vault: KEY is unavailable; refusing to run on ciphertext" >&2
            exit 1
          fi
          tool="$RUNNER_TEMP/cavault.py"
          git show "HEAD:tools/vault/vaultctl.py" > "$tool"
          py=python3
          if ! "$py" -c 'import cryptography' >/dev/null 2>&1; then
            venv="$RUNNER_TEMP/cavault-venv"
            if "$py" -m venv "$venv" >/dev/null 2>&1; then
              py="$venv/bin/python"
              "$py" -m pip install --quiet --disable-pip-version-check 'cryptography>=42'
            else
              "$py" -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=42'
            fi
          fi
          "$py" "$tool" install-key --quiet
          "$py" "$tool" setup --quiet --script "$tool"
          "$py" "$tool" unlock --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install task dependencies
        run: python -m pip install -r tasks/polynomial_solver_ml/environment/requirements.txt
      - name: Test roots, learners and artifact integrity
        run: python -m pytest -q tasks/polynomial_solver_ml/tests --junitxml=runs/polynomial_ml/tests.xml
      - name: Generate, train, evaluate and verify the quick profile
        run: python tasks/polynomial_solver_ml/run_local.py run --profile quick --output runs/polynomial_ml/ci
      - name: Preserve complete or partial software run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polynomial-solver-ml-run
          path: runs/polynomial_ml/
          if-no-files-found: warn
          retention-days: 14
