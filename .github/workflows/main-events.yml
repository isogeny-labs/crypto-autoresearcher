name: main-events

# Publish a durable, write-once record of every merge to `main`.
#
# THIS IS DELIBERATELY NOT A NOTIFICATION, because a notification cannot work
# here. Agent sessions are ephemeral, and at the moment a merge lands most of the
# sessions that will care about it do not exist yet. The available MCP
# subscription (`subscribe_pr_activity`) is per-pull-request, single-consumer and
# bound to one live session: it cannot fan out to N runners and cannot reach a
# session created tomorrow.
#
# So the event is written where any future session can find it, rather than
# pushed at sessions that are not there. One file per merge, under
# coordination/events/main/, so concurrent merges never touch the same bytes.

on:
  push:
    branches: [main]
    # Without this the job's own commit retriggers the job, forever.
    paths-ignore:
      - "coordination/events/**"
      # main-health's cache commit is derived state too; a digest of it would
      # only tell readers that nothing research-relevant changed.
      - "coordination/portfolio_health/**"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to digest (default: the current HEAD of main)"
        required: false

permissions:
  contents: write

concurrency:
  # Serialise: two merges landing together would otherwise race on the push,
  # and the loser would be dropped rather than retried.
  group: main-events
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 coordination

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Write the merge digest
        id: digest
        run: |
          SHA="${{ inputs.commit || github.sha }}"
          SHORT=$(git rev-parse --short=12 "$SHA")
          OUT="coordination/events/main/${SHORT}.yaml"
          if [ -f "$OUT" ]; then
            echo "digest already exists for $SHORT; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/merge_digest.py --commit "$SHA" --out "$OUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          {
            echo "## Merge digest"
            echo
            echo '```yaml'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit it
        if: steps.digest.outputs.changed == 'true'
        run: |
          git config user.name "main-events"
          git config user.email "noreply@anthropic.com"
          git add "${{ steps.digest.outputs.out }}"
          git commit -m "events: digest ${{ github.sha }}

          Generated by tools/merge_digest.py. Write-once; one file per merge.
          This commit changes only coordination/events/, which the workflow
          trigger ignores, so it does not retrigger itself."
          # Rebase onto whatever landed while we were working. Safe here and
          # ONLY here: this job's commit touches a path no research branch
          # writes, so it carries no archive receipt to invalidate.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "::warning::could not publish the digest after 3 attempts"
          exit 0
