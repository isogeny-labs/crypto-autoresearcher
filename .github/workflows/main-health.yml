name: main-health

# The absolute sweep, moved OFF the pull-request path.
#
# `validate.yml` used to run the parseability check absolutely on every PR. That
# made one campaign's broken artifact every other campaign's failure: six
# truncated JSON run records from a single AES batch red-lighted PRs whose diffs
# touched none of them and which could not have repaired them without fabricating
# run output. With 115 open branches that coupling was the dominant CI failure.
#
# Absolute checking is still necessary to find breakage after a PR merges to
# main. The merged-PR event starts that sweep without rerunning it for the
# cache-only PR merges. Generated data is retained as a run artifact for review.

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

# At most one sweep runs and one waits: a newer trigger replaces the waiting one. Not
# cancel-in-progress, because a sweep files and closes issues and should finish what it starts.
concurrency:
  group: main-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scope:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_sweep: ${{ steps.scope.outputs.run_sweep }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /tools/publish_portfolio_health.py
      - name: Avoid a sweep caused only by publishing its previous cache
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "run_sweep=true" >> "$GITHUB_OUTPUT"
          else
            cache_only=$(python3 tools/publish_portfolio_health.py --cache-only-merge)
            case "$cache_only" in
              true) echo "run_sweep=false" >> "$GITHUB_OUTPUT" ;;
              false) echo "run_sweep=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "Invalid health scope result" >&2; exit 1 ;;
            esac
          fi

  absolute-sweep:
    needs: scope
    if: ${{ needs.scope.outputs.run_sweep == 'true' }}
    # The complete dispatch-queue census took 16m20s on the first hosted run;
    # that run finished its artifact upload at 21m34s and was then cancelled
    # by the former 20-minute limit. Keep the full census and allow headroom.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 coordination
          python3 tools/artifacts/artifacts.py verify coordination

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Conflict markers, parseability, across every tracked file
        id: hygiene
        run: python3 tools/check_merge_hygiene.py --absolute

      # REPORTED, NOT FATAL, and the count is why. 61 of 101 queues already fail
      # to render on main -- historical archives bound knowledge entries and goal
      # records that have since been legitimately superseded, so their declared
      # path hashes no longer match. Failing the job on that would put main
      # permanently red and recreate precisely the cross-campaign coupling this
      # workflow exists to remove. The number is surfaced so it can be driven
      # down deliberately, by the campaigns that own the archives.
      - name: Dispatch queue render census
        if: always()
        run: |
          fail=0; total=0
          for q in $(git ls-files 'coordination/goals/*/batches/*/dispatch_queue.json'); do
            total=$((total+1))
            d=$(mktemp -d)
            python3 tools/research_dispatch.py "$q" \
              --output "$d/plan.json" --report "$d/plan.md" >/dev/null 2>&1 \
              || { echo "does not render: $q"; fail=$((fail+1)); }
            rm -rf "$d"
          done
          echo "queues failing to render: $fail of $total" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$fail of $total dispatch queues do not render"

      - name: Knowledge corpus builds
        if: always()
        run: python3 tools/build_knowledge_index.py --verify-corpus

      - name: Ledger indexes build
        if: always()
        run: python3 tools/build_ledger_index.py --check-builds

      # The portfolio-health sweep costs two to three minutes and ~200 KB per
      # Coordinator wake when every session recomputes it. Compute it once here,
      # commit the compact summary, and let sessions read the file
      # (tools/portfolio_health_cache.py --show). Derived state, like the merge
      # digests: never edited by hand, stale means "re-sweep", never "error".
      - name: Refresh the portfolio health cache
        if: always()
        id: health_cache
        run: |
          python3 tools/portfolio_health_cache.py >/dev/null
          if git diff --quiet -- coordination/portfolio_health/latest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          python3 tools/portfolio_health_cache.py --show >> "$GITHUB_STEP_SUMMARY" || true

      # Keep the generated bytes even if branch publication or PR creation
      # fails. A failed generation must never upload the old checked-in cache.
      - name: Retain the generated portfolio health cache
        id: health_archive
        if: always() && steps.health_cache.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-health-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: coordination/portfolio_health/latest.json
          if-no-files-found: error

      - name: Open or update the main-health issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "main is failing the absolute health sweep";
            const body = [
              "`main-health` failed on commit `" + context.sha.slice(0, 12) + "`.",
              "",
              "This is breakage **already on `main`**, not a pull request's fault.",
              "It no longer blocks other campaigns' PRs, which is the point — but it",
              "does need the owning campaign to repair or supersede the artifact.",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                context.repo.repo + "/actions/runs/" + context.runId,
              "",
              "Reproduce locally:",
              "```sh",
              "python3 tools/check_merge_hygiene.py --absolute",
              "```",
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "main-health",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["main-health"],
              });
            }
