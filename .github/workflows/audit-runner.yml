name: audit-runner
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/audit_process.py'
      - 'tools/test_audit_process.py'
      - 'tools/test_audit_manifest_schema.py'
      - 'schemas/run-manifest.schema.json'
      - '.github/workflows/audit-runner.yml'
  workflow_dispatch:
# One run per pull request (or per branch on push): a newer push cancels the run it
# supersedes, so the shared runner pool is not spent on commits nobody will look at.
concurrency:
  group: audit-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  linux-resource-controls:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unlock research vault (AES-256)
        shell: bash
        env:
          KEY: ${{ secrets.KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${KEY:-}" ]; then
            echo "vault: KEY is unavailable; refusing to run on ciphertext" >&2
            exit 1
          fi
          tool="$RUNNER_TEMP/cavault.py"
          git show "HEAD:tools/vault/vaultctl.py" > "$tool"
          py=python3
          if ! "$py" -c 'import cryptography' >/dev/null 2>&1; then
            venv="$RUNNER_TEMP/cavault-venv"
            if "$py" -m venv "$venv" >/dev/null 2>&1; then
              py="$venv/bin/python"
              "$py" -m pip install --quiet --disable-pip-version-check 'cryptography>=42'
            else
              "$py" -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=42'
            fi
          fi
          "$py" "$tool" install-key --quiet
          "$py" "$tool" setup --quiet --script "$tool"
          "$py" "$tool" unlock --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python -m unittest tools.test_audit_process tools.test_audit_manifest_schema -v
