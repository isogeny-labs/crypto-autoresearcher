name: PEXT n7 Lean proof
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - experiments/EXP-PEXT-212d5c/implementation/lean/**
      - .github/workflows/pext-n7-lean.yml
  pull_request_target:
    branches: [main]
    types: [closed]
    paths:
      - experiments/EXP-PEXT-212d5c/implementation/lean/**
      - .github/workflows/pext-n7-lean.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-build:
    name: "${{ github.event_name == 'pull_request_target' && 'post-merge / ' || '' }}kernel-build"
    if: ${{ (github.event.action != 'closed' || github.event.pull_request.merged) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/EXP-PEXT-212d5c/implementation/lean
            tools/artifacts
            .artifacts
      - name: Unlock research vault (AES-256)
        shell: bash
        env:
          KEY: ${{ secrets.KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${KEY:-}" ]; then
            echo "vault: KEY is unavailable; refusing to run on ciphertext" >&2
            exit 1
          fi
          tool="$RUNNER_TEMP/cavault.py"
          git show "HEAD:tools/vault/vaultctl.py" > "$tool"
          py=python3
          if ! "$py" -c 'import cryptography' >/dev/null 2>&1; then
            venv="$RUNNER_TEMP/cavault-venv"
            if "$py" -m venv "$venv" >/dev/null 2>&1; then
              py="$venv/bin/python"
              "$py" -m pip install --quiet --disable-pip-version-check 'cryptography>=42'
            else
              "$py" -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=42'
            fi
          fi
          "$py" "$tool" install-key --quiet
          "$py" "$tool" setup --quiet --script "$tool"
          "$py" "$tool" unlock --quiet
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 experiments
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: experiments/EXP-PEXT-212d5c/implementation/lean
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Build pinned finite proofs and audit axioms
        shell: bash
        working-directory: experiments/EXP-PEXT-212d5c/implementation/lean
        run: |
          set -euo pipefail
          lake build CoverCensusN7 2>&1 | tee lean-build.log
          python3 - <<'PY'
          import re
          from pathlib import Path

          log = Path('lean-build.log').read_text()
          pattern = re.compile(r"'([^']+)' (?:depends on axioms: \[([^]]*)\]|does not depend on any axioms)")
          actual = {name: {a.strip() for a in (axioms or '').split(',') if a.strip()}
                    for name, axioms in pattern.findall(log)}
          expected = {
              'Orbit.period_three_or_twentyone', 'Orbit.period_two_or_fourteen',
              'Rot7.span_sizes', 'Rot7.weight4_dim3', 'Rot7.weight4_dim3_or_6',
              'Spectrum.split_floor', 'Spectrum.z2_floor', 'Spectrum.odd_support',
          }
          if set(actual) != expected:
              raise SystemExit(f'Expected {len(expected)} axiom reports; found {sorted(actual)}')
          allowed = {'propext', 'Quot.sound'}
          unexpected = {name: sorted(axioms - allowed) for name, axioms in actual.items()
                        if axioms - allowed}
          if unexpected:
              raise SystemExit(f'Unexpected axioms: {unexpected}')
          print(f'Kernel build and axiom audit passed for {len(actual)} theorem constants')
          PY
