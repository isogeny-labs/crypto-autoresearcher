# artifact-store: no-pull (reviews tracked source and pull-request diffs, not stored report bytes)
name: claude-pr-review

# Agentic review of every pull request.
#
# Advisory only: this job posts findings and never approves, blocks, edits, or
# changes research state — the Coordinator alone does that (AGENTS.md).
# The review contract lives in REVIEW.md, not here, so this job and Anthropic's
# managed Code Review service cannot drift apart. Edit REVIEW.md to change what
# gets flagged; edit this file only to change how the job runs.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

# A rapid series of pushes should produce one review of the final state, not a
# queue of reviews of superseded diffs.
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    timeout-minutes: 15
    # Draft PRs are reviewed once they are marked ready. `@claude review` still
    # forces a review on a draft on demand.
    if: >-
      !github.event.pull_request.draft &&
      (github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    env:
      # Keep this advisory job green when the optional direct-review service is
      # not configured. The step below makes the omission explicit in the log;
      # it does not treat the absence of a review as an approval.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Only a configured review needs the repository: without the key this job
      # just reports the omission, and a full-history checkout cost ~90 s.
      - uses: actions/checkout@v6
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          fetch-depth: 0 # full history so "did this record already exist?" resolves
          filter: blob:none
      - name: Report unavailable review service
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: |
          echo "Claude PR review skipped: ANTHROPIC_API_KEY is not configured."
          echo "This advisory job cannot approve, block, edit, or change research state."

      - name: Review pull request
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE REF: ${{ github.event.pull_request.base.ref }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Read REVIEW.md at the repository root and follow it exactly. It is
            the review contract and outranks your default review behavior. It
            cites AGENTS.md, docs/claims-and-verification.md, and
            docs/evidence-and-reproducibility.md — read those for any rule you
            are about to apply.

            Review only this pull request's diff against BASE REF. Post each
            finding as an inline comment on the line it concerns, then one
            top-level summary comment in the shape REVIEW.md specifies.

            You have read-only access and no research authority. Do not edit a
            file, push a commit, approve the PR, or request changes.
          # Pinned to Sonnet. Without --model, Claude Code would pick up
          # .claude/settings.json, which sets claude-opus-5-5 for interactive
          # research sessions, and review every PR on Opus. Override with the
          # CLAUDE_REVIEW_MODEL repository variable.
          claude_args: |
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Read,Grep,Glob"
