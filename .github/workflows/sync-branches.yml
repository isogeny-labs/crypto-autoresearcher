name: sync-branches

# Propagating `main` into open research branches should not consume agent
# attention, and while it did the branches drifted: 115 open, the median 26-55
# behind, and 41 past 500 behind — the point at which nobody merges them again.
#
# Runs in REPORT mode on a schedule. `--apply` is available on demand and is
# deliberately not the default: pushing into a branch an agent is mid-batch on
# turns its next push into a non-fast-forward, which is the interference this is
# meant to reduce. tools/sync_open_branches.py additionally refuses any branch
# committed to within --idle-minutes.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually merge and push (otherwise report only)"
        type: boolean
        default: false
      idle_minutes:
        description: "Only touch branches idle at least this long"
        default: "120"
      limit:
        description: "Process at most N candidate branches"
        default: "25"

# Never two syncs at once (both would merge and push the same branches); a newer trigger
# replaces a waiting one. Not cancel-in-progress, so a sync is never cut off mid-push.
concurrency:
  group: sync-branches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Unlock research vault (AES-256)
        shell: bash
        env:
          KEY: ${{ secrets.KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          set +x
          umask 077
          if [ -z "${KEY:-}" ]; then
            echo "vault: KEY is unavailable; refusing to run on ciphertext" >&2
            exit 1
          fi
          tool="$RUNNER_TEMP/cavault.py"
          git show "HEAD:tools/vault/vaultctl.py" > "$tool"
          py=python3
          if ! "$py" -c 'import cryptography' >/dev/null 2>&1; then
            venv="$RUNNER_TEMP/cavault-venv"
            if "$py" -m venv "$venv" >/dev/null 2>&1; then
              py="$venv/bin/python"
              "$py" -m pip install --quiet --disable-pip-version-check 'cryptography>=42'
            else
              "$py" -m pip install --quiet --disable-pip-version-check --break-system-packages 'cryptography>=42'
            fi
          fi
          "$py" "$tool" install-key --quiet
          "$py" "$tool" setup --quiet --script "$tool"
          "$py" "$tool" unlock --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Sync open branches
        run: |
          python3 tools/sync_open_branches.py \
            --idle-minutes "${{ inputs.idle_minutes || '120' }}" \
            --limit "${{ inputs.limit || '25' }}" \
            --json sync-report.json \
            ${{ (inputs.apply == true) && '--apply' || '' }} \
            | tee sync-report.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Branch sync"
            echo
            echo '```'
            tail -c 60000 sync-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: |
            sync-report.json
            sync-report.txt
