title: The trace morphism forces a linear equation (first fall degree 2 for S_3)
claim: The Weil descent to F_2 of S_3 on ordinary binary curves has first fall degree 2 because a group
  morphism E → F_2 (the trace of x) yields a linear polynomial after descent; low first fall degree is
  structural, and the heuristic tying first fall degree to degree of regularity is unsafe for these systems.
  First fall degree of Weil descents is bounded independently of n under the Hodges–Petit–Schlather conditions.
