title: Naive Semaev index calculus over prime fields cannot beat generic methods
claim: Yokoyama-Yasuda-Takahashi-Kogure show that, under stated statistical assumptions (a heuristic, not an unconditional
  proof), Semaev's naive index calculus over F_p costs at least as much as generic algorithms. Algebraic factor
  bases (Petit-Kosters-Messeng; Amadori-Pintore-Sala; Kudo et al.) are reported to work only at small parameters,
  and McGuire-Mueller's Groebner-free variant is reported to remain worse than rho. All sources were read only in
  abstract.
