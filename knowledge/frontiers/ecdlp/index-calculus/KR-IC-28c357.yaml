title: Leading-form degree of regularity is presentation-dependent; one-hot grouping forces at most G+1
claim: >-
  Scoped as in the lab's sources: for the two-summand Boolean-digit Semaev system the accepted
  result is d_reg(grouped, raw S3) = s+1 (even s; s+2 at odd s, reviewer-derived) against
  s + ceil((s+2)/2) for the bit presentation (Caminata-Gorla Def. 1.4 convention); the accepted
  general statement is the UPPER bound d_reg <= G+1 (DEC-20261029-0857a9). Equality G+1 for any
  Boolean system is the producer's own Section D (unreviewed, elementary, derived by hand with no
  Lean). The local quotient keeps dimension 4^s in both presentations, so a lower d_reg here is a
  regrading, not lower solving cost. Do not use leading-form d_reg as a progress metric; use last
  fall degree and measured solver work.
status: heuristic
