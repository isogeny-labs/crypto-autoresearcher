title: Last fall degree and solving degree of Weil descent systems
claim: The last fall degree of Weil-descended systems is bounded independently of the extension degree
  under stated conditions (Huang–Kosters–Yeo; Huang–Kosters–Yang–Yeo), and solving degree, last fall degree
  and degree of regularity are related but distinct invariants (Caminata–Gorla; Caminata–Ceria–Gorla;
  Semaev–Tenti). Semi-regular (Bardet–Faugère–Salvy) predictions do not describe descended summation systems.
