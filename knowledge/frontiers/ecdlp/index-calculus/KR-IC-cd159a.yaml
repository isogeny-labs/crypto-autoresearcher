id: KR-IC-cd159a
area: index-calculus
kind: known_negative
title: Conditional height and probability obstruction for classic xedni
claim: >-
  Jacobson–Koblitz–Silverman–Stein–Teske derive one-attempt success below C0/p
  for classic fixed-arity xedni under their selected-lift
  height/discriminant hypothesis, Lang's canonical-height conjecture, an
  approximate random-image/sampling model, and the correspondence from an
  algorithmic lift to a useful scalar relation. A linear-in-p repeated-trial
  obstruction additionally needs bounded cofactor and a history-uniform
  adaptive-hazard bridge. This is a strong conditional implication, not an
  unconditional theorem that every characteristic-zero lifting algorithm fails.
status: proven
sources:
- ref: KN-LIT-020
  locator: abstract
  verification_state: abstract_read
- ref: KN-LIT-021
  locator: §4, Lemma 4.1, Theorem 4.1, §5-6, notes 7-8
  verification_state: full_text_read
forecloses:
- classic fixed-arity xedni under the JKSST height hypotheses
- bounded-coefficient rational lifts satisfying the JKSST selected-lift comparison
- repeated xedni trials with a history-uniform O(1/p) useful-success hazard
- treating the conditional C0/p bound as premise-free
internal:
- ref: GOAL-ICLIFT-001
  relation: applies
  note: exact-counting closure applies to its frozen function-field family, not every lift family
