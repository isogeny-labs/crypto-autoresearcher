id: KR-IC-58213c
area: index-calculus
kind: known_bound
title: Last fall degree of zero-dimensional Weil descent systems; solving degree vs. last fall degree
claim: For a zero-dimensional, radical system F over F_{q^n} in m variables, with at most s solutions over the algebraic
  closure and a coordinate whose projection is injective on its zeros, the last fall degree of its Weil descent
  to F_q with field equations adjoined is bounded by a function of q, m, s, deg F and the last fall degree of F,
  independent of n (Huang-Kosters-Yang-Yeo Thm 1.1; univariate case Huang-Kosters-Yeo Main Theorem 1, which gives
  deterministic solving in time polynomial in (n+d)^d). Both papers state that this does not apply to summation-polynomial
  systems, which are not zero-dimensional before field equations are added; whether their last fall degree depends
  on n is left open there. For degree-compatible term orders, solving degree = max(last fall degree, max reduced
  Groebner basis degree) (Caminata-Gorla Thm 3.1), so a last-fall bound alone does not bound the solving degree.
  Abstract-level sources report that semi-regular (Bardet-Faugere-Salvy) predictions do not describe descended summation
  systems (Semaev-Tenti; Caminata-Ceria-Gorla).
