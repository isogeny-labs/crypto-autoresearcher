title: Isogenous curves are equally hard; isogeny walks do not find weak curves
claim: Over a finite field, curves are isogenous iff they have the same number of points (Tate). Weaknesses fixed
  by the group order (anomalous, small embedding degree, smooth order) are therefore shared across an isogeny class,
  and walking the class cannot reach a curve that has such a weakness when the start curve lacks it. Separately,
  JMV prove polynomial-time random self-reducibility of ECDLP among curves in an isogeny class with (nearly) the
  same endomorphism ring, assuming the Generalized Riemann Hypothesis. Without GRH, or between curves whose endomorphism
  rings differ (different volcano levels), JMV establish no reduction; Galbraith (KN-LIT-ca35e0) treats transfer
  across levels.
