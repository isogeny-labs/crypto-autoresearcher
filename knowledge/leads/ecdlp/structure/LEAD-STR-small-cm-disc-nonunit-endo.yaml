id: LEAD-STR-small-cm-disc-nonunit-endo
family: structure
title: Small |D_0| or a cheap non-unit endomorphism beyond the automorphism constant
mechanism: >-
  Curves with small CM discriminant (D = -7, -8, -11, ...) or a short CM relation carry cheap
  endomorphisms of small degree. The hope is that these cheap maps give rho equivalence classes,
  a smaller crater to search, or another speedup beyond sqrt(|Aut|), even though only D_0
  = -3, -4 add units.
disposition: open_next_step
obstruction:
  kind: cost_model
  statement: >-
    Label note 2026-10-31: the orbit-size bound below is an elementary theorem, but the load-bearing
    clause (the net factor) is a cost-model estimate never measured at the equality case; this PR designs
    that measurement (IDEA-20261031-6610ed).
    A non-unit alpha of norm n acting as lambda on G has orbit size h = ord_N(lambda) with
    n^h >= (sqrt N - 1)^2, so h >= log N / log n (IDEA-20260901-6b63a4, an elementary proof).
    A rho class of size h costs about h evaluations of alpha to canonicalise, so the net factor
    is at most sqrt(h)/kappa with kappa about h times c(alpha) (IDEA-20260826-506ba2). On
    deployed curves |D_K| is large (endosweep). Only the units of D_0 in {-3, -4} give finite
    orbits at O(1) cost, and those are an isogeny-class invariant (DECOMPOSITION.md T4). Scope:
    ordinary prime-field curves, prime-order G.
  revisit_when: >-
    Someone constructs a prime-field curve where a norm-2 or norm-3 endomorphism has eigenvalue
    order near log_n N (the equality case, a prime-field Koblitz analogue) and a canonical
    orbit representative costs o(h) maps. Findings file NEW LEAD 1.
next_action:
  step: >-
    Freeze IDEA-20261031-6610ed's three-arm equality-case panel: negation rho, full alpha-class
    canonicalisation and x-only/batched canonicalisation, for h=16..32 and N about 2^20..2^32
    with at least 200 planted instances per cell. Include matched j=0 positive, generic-D null
    and matched-rho controls; record iterations, complete counted cost, kappa per step, exact
    identities and seeds, and verify every eigenvalue order and map.
  discriminates: >-
    The expected 1/sqrt(h) iteration saving validates the class walk only. Total counted cost
    below 0.9 of negation rho at h>=16 advances the sought o(h) canonicaliser. Cost at least
    negation rho at every tested h, with the iteration saving confirmed, discharges only this
    equality-case candidate and representative rules. Missing iteration saving is an invalid
    implementation; no bounded panel closes other nonunit maps or a future sublinear canonicaliser.
best_measured: >-
  The D=-7 equality construction is designed but unrun: h=19 and h=23 are the certified exact
  equality cases found by its design probes, with Velu alpha=[lambda] checked on 10/10 points.
  Separately, merged R7.3 endomorphism-mixed walks cost 1.22x and 1.79x plain rho on bounded
  crater/floor panels; those panels do not instantiate the proposed equality-case family.
