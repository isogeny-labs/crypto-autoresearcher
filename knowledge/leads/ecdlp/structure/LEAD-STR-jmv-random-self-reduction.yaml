id: LEAD-STR-jmv-random-self-reduction
family: structure
title: Jao-Miller-Venkatesan isogeny-expander random self-reduction within a level
mechanism: >-
  JMV (2005) shows, under GRH, that dlog on curves with the same endomorphism ring is randomly
  self-reducible via short horizontal isogeny walks. The lane asked for its concrete constants
  and field-operation cost and whether it gives any attack or level-dependent hardness.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    JMV is a hardness-equivalence (average equals worst case within a level), not a speedup.
    The program re-derived its cost as a stated deterministic model (KN-FIND-f293c6, EV-JMV-05a150).
    The required eigenvalue separation is vacuous at q=2^256 for delta <= 0.5 and non-vacuous
    only at delta=2.0. The modelled reduction falls below rho only above 192 bits there. It
    moves no ECDLP cost. Point-level Elkies-walk self-reduction (IDEA-20260807-631e80) is
    the same mechanism.
  revisit_when: >-
    A use of the self-reduction as a subroutine of an attack (not a hardness proof) is proposed
    with a cost below rho.
best_measured: >-
  cost model only: vacuous at q=2^256 for delta<=0.5; modelled crossover vs sqrt(n) at 192
  bits for delta=2.0, C=1.0
evidence:
- repo: crypto-autoresearcher
  path: knowledge/findings/KN-FIND-f293c6.md
  note: JMV branch-(a) GRH bound evaluated as a cost model at q=2^64..2^512
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-JMV-05a150.yaml
  note: strong, supports H-JMV-002 (model-level)
- repo: crypto
  path: RESEARCH_ISOGENY_FIBERS_ECDLP.md
  note: section 0.5, JMV and Galbraith-Hess-Smart bound no concrete cost
