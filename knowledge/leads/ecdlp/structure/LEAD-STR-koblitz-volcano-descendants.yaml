id: LEAD-STR-koblitz-volcano-descendants
family: structure
title: Curves below a binary Koblitz curve in its volcano (ECC2K-130, K-163, K-283, m=37..83)
mechanism: >-
  Descend from a Koblitz curve (D_K = -7, End = Z[tau]) through conductor primes to floor
  curves. A floor curve might give a cheaper rho or IC than the crater with its Frobenius
  orbits. The NIST K-163 and K-283 conductor floors are the deployed instances.
disposition: open_next_step
obstruction:
  kind: measured
  statement: >-
    At m=37 and m=41, with negation, every level costs the same (KW p=0.76, each level within
    ±3% of the crater by TOST). Only the crater has a cheap non-trivial endomorphism (tau,
    degree 2), worth 6.36x steps [6.20, 6.53], and no curve beats crater plus Frobenius (Holm
    p=1.0 on 127 and 91 curves). Below the crater the least non-integer endomorphism degree
    is 121,046 (ECC2K-130 floor) or 73,324,526 (m=83 floor), so using it makes rho 45x to
    3,000x slower. At m=83 IC floor yield differs by at most 0.014%, and Frobenius atlases
    cost 137-513x the best chart.
  revisit_when: >-
    An explicit K-163 / K-283 floor map is persisted (problems/koblitz-vertical-isogeny-maps-not-persisted.md)
    and a floor factor base beats the crater tau-orbit base in charged S. Or the m=51 replication
    passes its A/A gate and shows a level effect.
best_measured: >-
  m=41: crater+tau 6.36x fewer steps [6.20, 6.53]; all lower levels within ±3% of crater (TOST)
next_action: {from_revisit_when: true}
evidence:
