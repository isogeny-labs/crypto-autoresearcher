id: LEAD-STR-p192-class-cm-relations
family: structure
title: P-192 isogeny class, smooth principal CM relations and loops
mechanism: >-
  Search the valid P-192 isogeny class for short smooth principal CM relations (closed loops)
  that give a cheap non-scalar endomorphism or a cheap way to navigate the class, then charge
  it fully to see whether it signals a weakness.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Any CM relation is an endomorphism and acts as a scalar on the prime-order subgroup (H-ENDO-001).
    A cheap one gives only GLV-type scalar multiplication (LEAD-STR-glv-gls-isogeny-loop-scalar-mult),
    and its orbits are too large for rho classes. Navigation of the class is generic-cost
    neutral (T1). Measured: all 103 emitted relations in the L <= 2^48 box are scalar (census
    not provably complete), and the crypto P-192 weak-curve review found no structural weakness
    or speedup.
  revisit_when: A non-isogeny-invariant weakness is found in any class (would make navigation
    matter).
best_measured: >-
  103/103 emitted CM relations verified scalar in the L<=2^48 box (EV-SCURVE-8e5c70, inconclusive
  on completeness)
evidence:
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-SCURVE-8e5c70.yaml
  note: relations verified scalar; exact set identity not bindable
- repo: crypto
  path: research/p192-weak-curve-20261006/REPORT.md
  note: no P-192 structural weakness or speedup found
