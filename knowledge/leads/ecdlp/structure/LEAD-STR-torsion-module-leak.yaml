id: LEAD-STR-torsion-module-leak
family: structure
title: l-torsion (l != N) as a Galois/End module leaking k or attack cost
mechanism: >-
  Division-polynomial factorisation, Elkies/Atkin split patterns, torsion translates and resolvents
  at primes l != N might carry information about the secret k or about which stage of an attack
  is cheap. The TORS lane proposed point-dependent statistics such as the Legendre symbol
  of psi_l(x(kP)).
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    Any statistic of the curve alone is k-independent by construction. Any homomorphic invariant
    from the prime-order group G to an l-primary group (l != N) is trivial (coprimality, IDEA-20260807-6eab6a).
    A non-homomorphic point statistic is a function of the encoding of Q. Using it is index
    calculus or a generic query, and partial information about k on the point costs more than
    it saves, by sqrt(M) (IDEA-20260811-8cf53a). Toy checks agree: the psi_5 factor-degree
    multiset does not change with k (H-TORS-3bed8a). Scope: prime-order G, any l != N.
  revisit_when: >-
    A point-dependent l-torsion statistic computable in o(sqrt N) correlates with k beyond
    a k-resampled null at matched curve.
next_action: {from_revisit_when: true}
