id: LEAD-STR-secp256k1-cm-class-audit
family: structure
title: secp256k1 CM structure (D=-3, j=0, h=1) and its isogeny class
mechanism: >-
  secp256k1 has j=0, CM by Z[zeta_3], six automorphisms and sextic twists. Its Frobenius conductor
  is large, so volcanoes sit below it. The audit asked whether its CM, twists, class structure
  or genus-2 gluings give any route beyond the known sqrt 6 rho factor.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    The crater for D=-3 has one vertex (h=1), and secp256k1 is it. It already carries the
    maximal unit group (order 6). Every other curve in the class is lower in some volcano
    with fewer units, so by T1 and the automorphism-only rho ceiling no class member is cheaper
    for generic attack. The sextic twists have different orders and are not isogenous. The
    only ECDLP lever is the sqrt 6 constant (KR-RHO-0528e7). Genus-2 gluing and cover threads
    in the audit belong to the transfer/covers family.
  revisit_when: >-
    An IC method on j=0 curves beats rho with the sqrt 6 discount (see LEAD-STR-special-j-ic-semaev).
