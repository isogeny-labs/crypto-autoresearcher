id: LEAD-STR-glv-gls-isogeny-loop-scalar-mult
family: structure
title: >-
  GLV/GLS and isogeny-loop endomorphisms, neighbour-model routing (known-scalar multiplication)
mechanism: >-
  Cheap endomorphisms from CM, from isogeny loops on the crater (Koshelev-Sanso) or from a
  cheaper a=-3 model on an isogenous neighbour speed up variable-base k*P. Several ENDO hypotheses
  sit under GOAL-ENDO-001 and could be mistaken for ECDLP progress.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    These speed up known-scalar multiplication only. A rho step is one group addition, and
    a non-unit loop endomorphism acts as lambda of multiplicative order about r, so its orbits
    are the whole group and it cannot form rho classes (RESEARCH_ISOGENY_LOOP_GLV.md §4.2).
    On random challenge curves the cheapest loop costs 20-93x the doublings it would save
    (h about sqrt q). On Koblitz curves the only loop is tau. Measured scalar-multiplication
    gains (chain GLV-2 1.52x, neighbour a=-3 route 3.07% one-shot on BADA55-VPR-224) are real
    and outside ECDLP cost.
  revisit_when: >-
    An ECDLP algorithm whose dominant cost is variable-base scalar multiplication, not additions,
    is in use. IC relation sampling with fresh aP+bQ per candidate would qualify if not done
    incrementally.
best_measured: >-
  chain GLV-2 counted 1.525/1.521/1.492x over width-w NAF (Bandersnatch, Tom-384, CP6-782;
  scalar mult, not ECDLP)
next_action: {from_revisit_when: true}
