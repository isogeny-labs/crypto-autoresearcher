id: LEAD-STR-safecurves-parameter-audit
family: structure
title: >-
  SafeCurves-style parameter audits (twist security, completeness, ladder, cofactor, transfer
  rows)
mechanism: >-
  Re-derive the SafeCurves criteria (rho cost, transfer, CM discriminant, twist security,
  ladder, completeness, indistinguishability) for 20 named curves. Weak rows such as Anomalous
  show known transfer attacks, and per-curve implementation surfaces (invalid curve, singular
  companion, cofactor) belong here too.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    The criteria and verdicts are published (SafeCurves). The program's replications reproduce
    them, for example Ed448 base-point certificates and P-192 x-only singular-companion recovery
    on an unchecked low-level multiplier (EV-SCURVE-44f051, an implementation weakness, not
    ECDLP). The deliberately weak rows fall to known transfers (KR-RHO-53c89f). Most SCURVE
    hypotheses are Stage-0 arithmetic identities with no ECDLP content.
  revisit_when: >-
    A deployed row is found to violate a criterion that bears on ECDLP cost (rho size, transfer,
    CM), not only on implementation safety.
evidence:
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-SCURVE-e1ce7f.yaml
  note: RFC 7748/8032 re-transcription and Ed448 base-point certificates replicated
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-SCURVE-44f051.yaml
  note: implementation-weak low-level surface on P-192, no structural ECDLP weakness
ledger_refs:
- H-SCURVE-d5f25f
- H-SCURVE-01f984
- H-SCURVE-a8507f
- IDEA-20260829-f89a3a
- EV-SCURVE-e1ce7f
- EV-SCURVE-44f051
- DEC-20261006-af8214
- GOAL-SCURVE-137bd9
- DEC-20261026-3e3a74
- CORR-20261026-c94668
known_results:
- KR-RHO-53c89f
- KR-RHO-825bca
forecloses:
- SafeCurves audit finds an ECDLP weakness in Curve25519
- twist security breaks the discrete log
- anomalous or MOV-weak standard curve
- invalid-curve attack as an ECDLP speedup
areas:
- SCURVE
last_reviewed: '2026-10-29'
