id: LEAD-STR-class-representative-ic-selection
family: structure
title: >-
  Choose the isogenous curve or isomorphic model that minimises charged index-calculus cost
mechanism: >-
  Generic cost is class-invariant, but IC with a small-abscissa factor base is not: its relation
  yield depends on which set of points the coordinates call "small". You can transport the
  instance to the crater (one Velu evaluation per target) or rescale to an isomorphic model
  whose small-abscissa base gives more relations. This includes the heavy-tail screen for
  a rare good curve in a class, and the large-prime conductor-gap crater/floor comparisons.
disposition: open_next_step
next_action:
  step: >-
    Run a preregistered ecbench IC study with three arms. (a) Floor instance solved on the
    floor. (b) Floor instance carried by verified 2-isogeny to the crater and solved there,
    transport charged. (c) Crater instance on the best of K isomorphic models, selected on
    calibration targets and measured on held-out targets. Use l=2 depth-3 volcanoes at 24-32
    bits. Report charged S with the §5a 0/0.1/1 GAE band and the gap to matched rho as the
    distance remaining.
  discriminates: >-
    If (b) beats (a) by about 4% S net of transport, and (c) beats the default model on held-out
    targets, then representative selection is a measured IC improvement, a success under the
    iterative criterion. It is constant-factor only: IC/rho is 17-170x here. If held-out gains
    vanish, the 7.2% model effect and the 5.8% l=2 yield effect are factor-base sampling noise
    or a selection artifact, and the lead closes as measured.
best_measured: >-
  l=2 IC yield floor/crater 0.942 [0.928, 0.956], S floor/crater 1.045 [1.023, 1.067] at 24-bit;
  IC/matched rho 17-170x remaining (v2.1)
