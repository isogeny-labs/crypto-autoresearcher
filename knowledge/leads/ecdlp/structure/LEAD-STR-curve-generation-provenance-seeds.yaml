id: LEAD-STR-curve-generation-provenance-seeds
family: structure
title: Manipulated generation of standard curves (NIST P-curve seeds, Brainpool, BN, rigidity)
mechanism: >-
  If a standard curve's seed or generation procedure was ground, the designer could have selected
  a curve in a secret weak class. The program regenerated the NIST seeds (drand48 stream,
  1997-98) and audited the eleven skipped candidates against the ten published ones. It also
  audited verifiability and rigidity of other families.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    All ten NIST prime-field seeds are explained (about 30 bits of freedom per curve). Every
    public weak-class screen run on all 21 published and omitted classes found no anomaly
    and no rule separating them: exact CM field, class number <= 2000 (Kimura list), conductor,
    embedding degree, twist factors, invalid-curve surface, rational isogenies of odd degree
    <= 10,000, the ANSI A.3.2 gates, and 21 preregistered features. So a hidden weak class
    would need density at least about 2^-30 among prime-order curves and be invisible to all
    of these. The published-low small-prime split count (Elkies primes <= 691) does not
    replicate on 42 held-out unpublished draft-eligible curves under a test frozen before
    data (p = 0.29). Its one surviving outlier, prime239v1, has a genuinely low
    L(1, chi_{D_K}) (0.246, 0.25th percentile of the prime-order null, lowest of 61;
    GRH-conditional Euler product to 1e8). That is the same anomaly restated by a 1/l
    weighting, not independent evidence: P(min of 61 <= 0.25%) ~ 0.14, |D_K| ~ 2^241,
    h within 2x of the null median. No ECDLP method depends on L(1, chi) or h. The skip
    rule itself is historical and has no bearing on ECDLP.
  revisit_when: >-
    The historical generator code or logs are recovered, or a new publicly testable weak class
    of density at least 2^-30 is named.
