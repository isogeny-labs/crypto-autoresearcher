id: LEAD-STR-isogeny-walk-weak-neighbour
family: structure
title: Walk or construct isogenies from a deployed curve to find a weak neighbour
mechanism: >-
  Enumerate small- and large-degree isogenies from P-256, P-192, P-224 or secp256k1 (millions
  of models, degrees up to 2^44497-1) and screen each neighbour for a known weakness (anomalous,
  small embedding degree, small |D|, structure screens). The isogeny-degree records (ISOU)
  also belong here.
disposition: closed_obstructed
obstruction:
  kind: literature
  statement: >-
    Transfer weaknesses (MOV embedding degree, anomalous trace, CM field, group order) are
    isogeny-class invariants, so no neighbour can be weaker by them (KR-RHO-53c89f, KR-RHO-817bf8,
    DECOMPOSITION.md T4). Isogenous curves are equally hard for generic methods. Reproduced:
    the P-256 million-model walk found no structural-screen hit, and P-192 / P-224 large-degree
    isogenies found no weakness. A huge-degree self-isogeny of secp256k1 is an endomorphism,
    so it acts as a scalar on G.
  revisit_when: >-
    A weakness that is not an isogeny-class invariant is exhibited (see LEAD-STR-class-representative-ic-selection,
    where only constant-factor IC variation is measured).
best_measured: >-
  secp256k1 compact known-CM self-isogeny of prime degree 2^44497-1 constructed and replayed
  (capability, not ECDLP)
evidence:
