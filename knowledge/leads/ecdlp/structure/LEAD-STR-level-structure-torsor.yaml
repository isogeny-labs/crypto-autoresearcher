id: LEAD-STR-level-structure-torsor
family: structure
title: Level-structure and modular-curve reformulation of the ECDLP (pairs (E,P) as points of X_1(N),
  diamond-operator torsor)
mechanism: 'The pair (E,P) is an F_p-point of X_1(N); (E,Q) with Q = kP has the same image in X_0(N),
  so the DLP is the diamond-operator coordinate k of a torsor under (Z/N)^*/{+-1}. The hope is that modular
  units, diamond eigenfunctions, Hecke operators or monodromy words on the level structure separate the
  fibre points and expose k. Expected outcome: closure. Three forced values decide most of the lens before
  any compute (IDEA-20260806-0c9de1): F1, rationality trivialises the torsor in the correct group scheme;
  F2, the diamond action is free except at extra automorphisms, so the fibre coordinate is exactly the
  secret; F3, Eichler-Shimura pins only the already-known diamond <p>, and Hecke operators act compatibly
  with forced zeros. What is not yet proved is that separating functions (modular units, diamond eigenfunctions)
  have degree growing with N over F_p when N is comparable to p: the Kim-Sarnak-type gonality bound is
  a characteristic-0 statement and specialisation can only lower gonality (proof obligation PO-1 of the
  design).'
disposition: open_next_step
