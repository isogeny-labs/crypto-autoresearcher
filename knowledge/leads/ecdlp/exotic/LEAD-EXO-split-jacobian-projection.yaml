id: LEAD-EXO-split-jacobian-projection
family: exotic
title: Split-Jacobian projected smoothness and the pair (P,Q) as a genus-2 divisor
mechanism: >-
  Embed E into a split abelian surface / genus-2 Jacobian (gluing, Poincare factor) or encode
  (P,Q) as one Mumford divisor, hoping that projected divisors are smooth more often than
  points of E so that genus-2 index calculus applies to the elliptic factor.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    Cross-genus Poincare-factor embedding cannot beat Pollard rho on the embedded elliptic
    factor because the Hasse-Weil order inflation of the ambient Jacobian outweighs genus-2
    IC savings (KN-FIND-61347e); the IDEA-002 projected-smoothness counting gate finds no
    route with lambda,mu <= 0.45 and its projected endpoint fails the known-log interface.
  revisit_when: >-
    A same-field embedding whose ambient group order is O(N) rather than inflated, or a projection
    with a known-log interface, is constructed.
next_action: {from_revisit_when: true}
evidence:
- repo: crypto-autoresearcher
  path: knowledge/findings/KN-FIND-61347e.md
  note: Hasse-Weil order-inflation closure for cross-genus embedding
- repo: crypto-autoresearcher
  path: ideas/artifacts/ECDLP-IDEA-002/p1546_projected_smoothness_counting_gate.md
  note: No route passes lambda,mu <= 0.45
- repo: crypto-autoresearcher
