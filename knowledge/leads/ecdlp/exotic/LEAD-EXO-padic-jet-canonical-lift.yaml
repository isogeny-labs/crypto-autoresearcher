id: LEAD-EXO-padic-jet-canonical-lift
family: exotic
title: Prime-to-p jets, canonical/Teichmuller lifts and p-adic formal-group digits
mechanism: >-
  Lift points to F_p[eps]/eps^2, Z/p^2 or E(Q_p) (dual-number jets, canonical prime-to-p torsion
  lifts, Teichmuller or Serre-Tate lifts) and read a formal-group logarithm or valuation digit
  that is linear in the scalar, extending the anomalous (Smart/Satoh-Araki) channel to non-anomalous
  curves.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    For gcd(n,p)=1 the prime-to-p torsion lifts uniquely (finite etale) with zero formal defect
    and multiplication by l is invertible on every native jet, formal and p-typical target,
    so every additive order-l image is zero (IDEA-004 gate, independently verified); jet oracles
    are GGM-simulable with O(1) overhead (KN-FIND-002). The digit identity d(mS^)=m*d(S^)
    holds only on the HARD global lift (1360/1360 exact, KN-FIND-85845f), whose cost is the
    lift itself; the computable Teichmuller-style contrast reads as chance under a resolution-matched
    repaired test (KN-FIND-e8cfdc); IDEA-436 D1 valuation profile collapses to the +/- fibre
    indicator (KN-FIND-1ba0fe). Scope: ordinary prime-field curves, toy primes 10-14 bits
    for the measured parts.
  revisit_when: >-
    A computable non-homomorphic local section shows above-chance scalar information against
    a matched null at a resolution that could detect a 3x effect, or a succinct manipulation
    of the hard lift T^=mS^ without its coordinates (RQ-ECDLP-c1b7b1 first clause) is exhibited.
best_measured: >-
  Teichmuller contrast digit linearity at chance (power>=0.90 for a 3x effect, alpha=0.01);
  hard-lift digit identity exact 1360/1360 but hard-lift cost unbounded (toy p 10-14 bits)
next_action: {from_revisit_when: true}
