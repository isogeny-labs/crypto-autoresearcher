id: LEAD-EXO-low-degree-query-lower-bound
family: exotic
title: >-
  A query lower bound for solvers that also test low-degree polynomial conditions on point
  coordinates (generic group model plus degree-D tests)
mechanism: >-
  LEAD-EXO-augmented-oracle-ggm closes every named oracle that the generic group model can
  simulate, and reopens when a publicly computable oracle that it cannot simulate appears.
  Polynomial tests on coordinates are candidates. This lead proposes a lower bound for the
  low-degree part of that class rather than oracle by oracle. Model: the solver holds
  encodings of group elements, may add and compare them, and may also ask whether
  f(coordinates of X_1..X_t) = 0 for any f of degree at most D, with no auxiliary variables.
  Scope of the model, stated per oracle family: small-x membership x(P) < B is a degree-B
  condition in this model, so it enters only at D about B, where the bound below is weaker
  than sqrt(N) for any useful B; the Legendre symbol of x has degree (p-1)/2; with auxiliary
  variables small-x membership drops to degree 2 with about log B extra unknowns, and a bound
  for that model would have to depend on their number (not proposed here). So this lead does
  not address index calculus on small-x bases. It targets genuinely low-degree statistics
  (low-degree curves through tuples of points, cross-ratios, bounded-degree relations among
  coordinates of related points). Conjecture H1 (numbered heuristic, unproven): with T
  queries, success probability is at most O(T^2/N) + O(T D p^(-1/2) polylog p), so T is
  Omega(min(sqrt N, sqrt p / D)) for D = p^(o(1)). The single-point case is the counting
  behind LEAD-ICP-algebraic-membership-factor-base (a degree-d locus holds O(d) points); the
  risk is joint equidistribution of adaptively chosen tuples ((a_i + b_i k)P), which would
  need character-sum bounds along multiples of a point (Kohel-Shparlinski type, citation
  recalled and unverified). A proof would turn the low-degree families of
  LEAD-EXO-coordinate-statistic-leakage into a theorem in scope; a failure of the
  multi-point step would name the first low-degree coordinate test worth measuring.
  Desk step (a), 2026-11-04 (report ecdlp-leads-desk-20261104): H1 as written is false
  whenever a rank condition holds. A test's power is governed by the pulled-back degree
  Delta = sum_i (2 d_x,i + 3 d_y,i) b_i^2, not by D, and large multipliers b_i cost only
  O(log N) group operations. If the degree-<=D polynomials in the coordinates of t encodings
  [b_i]Q have full rank N on E(F_p), interpolation in free local work makes each test answer
  "k in S?" for any S, and binary search finds k with O(t log N) + log2 N queries. Full rank is
  proved for the F_p^* analogue, observed at p = 101 (t = 4, D = 3, rank 102 of 102), and not
  reached at p = 211 for the same (t, D) (161 of 222). Proved restatement H1': Pr[success] <=
  (C(T_g+2,2) + sum_j (Delta_j + t_j) + 1)/N, which is meaningful only for small multipliers.
  Kohel-Shparlinski verified (ANTS-IV, LNCS 1838, 2000, pp. 395-404); it covers t = 1 only.
disposition: open_next_step
next_action:
  step: >-
    Replace the planned bias check, which cannot refute H1 at t = 2. Compute exactly the rank
    r(t, D, b) of the evaluation matrix of degree-<=D monomials on the N points of
    ([b_1]R, ..., [b_t]R), for p from 2^8 to 2^14, with (t, D) chosen so that C(2t+D, D)/N
    spans [1/4, 4]. Use random pairwise-coprime b_i and arithmetic-progression b_i. Controls:
    shifts b_i = 1 (rank <= 2Dt + 1), a uniformly random point set (expected min(N, #monomials)),
    and the multiplicative analogue (full rank, proved). Report the attack's local work
    (about N^omega field operations).
  discriminates: >-
    Rank near min(N, #monomials - t) for random b_i confirms the attack, and the row is
    restated to H1' (proved) with a model note that query bounds must charge Delta or
    restrict local work. A rank that stays O~(T^2 + T D sqrt p) would be an unexpected
    structural result worth its own note. Neither outcome is an attack-cost claim, because
    the attack spends exponential local work.
