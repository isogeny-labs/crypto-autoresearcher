id: LEAD-EXO-global-lift-height
family: exotic
title: Height-compressing global lifts (Q, number fields, function fields / elliptic surfaces)
mechanism: >-
  Lift E/F_p and the factor base to a curve over Q, a special number field (SNFS/Solinas/cyclotomic)
  or an elliptic surface over F_p(t), find short Mordell-Weil relations there, and reduce
  them back. A lift whose relations stay short (bounded height) would give relations for free;
  xedni calculus is the classical instance.
disposition: open_next_step
next_action:
  step: >-
    Pursue both live branches: run IDEA-20261009-581f5d to time
    T_section(d,chi,p) for a bounded-height section through a prescribed fibre
    point on E1 surfaces at the Gaussian-heuristic degree across >=3 primes
    with a random-system Groebner control; for characteristic-zero xedni,
    select one explicit lift family and formalize its selected-lift-to-height,
    subgroup, useful-relation, cofactor, and adaptive-hazard interfaces.
  discriminates: >-
    T > p^(1/2) poly(log p) for every admitted solver with d_reg equal
    to the random-system value obstructs only the tested function-field
    mechanism; T <= p^0.45 at matched d on >=3 primes, or d_reg systematically
    below random, keeps that branch live. The Q-lift branch inherits JKSST's
    C0/p conclusion only if every named interface is composed uniformly;
    a failed bridge keeps the uncovered lift mechanism open.
best_measured: >-
  xedni exponent 3 for the named family (EV-XEDN-001, contradicts alpha<1/2); short MW relations
  with max|coeff|=1 exist on non-isotrivial surfaces at p<=31 (EV-XEDN-002..006) but no decomposition
  step yet
