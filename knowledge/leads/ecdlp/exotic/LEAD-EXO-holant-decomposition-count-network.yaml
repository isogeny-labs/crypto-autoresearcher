id: LEAD-EXO-holant-decomposition-count-network
family: exotic
title: Holant / holographic view of the decomposition-count tensor network over F_p, and its transfer-matrix
  spectrum
mechanism: 'Write the number of m-term decompositions of a target R over a factor base FB as a closed
  tensor network over the alphabet F_p: a chain of ternary tensors T[x,y,z] = [S_3(x,y,z) = 0], whose
  internal bonds carry x-coordinates of partial sums, with the indicator vector of FB on each leaf. Holant
  theory asks whether a basis change on the bond spaces (a holographic transformation) makes such a counting
  network cheap to contract. Contracting one leaf gives the transfer matrix M[y,y''] = #{x in FB : S_3(x,y,y'')
  = 0}. On the F_p alphabet M splits into an E(F_p) block and a quadratic-twist block. For odd #E the
  E block is the symmetrised quotient by negation of the Cayley graph of E(F_p) with connection set {+-F
  : x(F) in FB}, with the vertex O deleted, because O has no x-coordinate. Its eigenvalues are the zeros
  of sum_j 1/(lambda_j - mu), where lambda_j are the character sums, plus any degenerate lambda_j. Its
  eigenvectors are Green functions sum_j cos(2 pi j log P / n)/(lambda_j - mu), not single characters,
  but they are still explicit functions of the discrete logarithm. For even #E the 2-torsion rows differ
  by a factor 2 (report 2026-11-03). So a basis that diagonalises M already encodes the answer, and the
  open question is whether any cheaper basis lowers the tensor rank of T. This differs from LEAD-ICE-gag-contraction-planner,
  which asks which presentation of the same system is cheapest for a Groebner solver, and from LEAD-EXO-hashed-factor-base-tensor-ecdl,
  which contracts a Boolean encoding by #SAT. Numbered heuristics. H1 (derivation and red-team review
  2026-11-03, replacing the scouting version): T and M are public, so building or transforming them costs
  0 group queries. If entries are indexed by group labels, an entry costs at most 4 group queries and
  Shoup''s bound applies, but that class cannot change basis on the F_p alphabet. A holographic basis
  change needs x(R) of instance points as field elements, and an x-coordinate oracle is not GGM-simulable
  with o(sqrt n) queries on any curve: two queries and free local work give the logarithm. So the GGM
  excludes no basis change, and step (b) is the test. H2: the Cai-Chen complex-weighted #CSP dichotomy
  is stated for a fixed finite domain; here the domain F_p grows with the instance, so it gives no closure.'
disposition: closed_dominated
best_measured: 'QTT rank of M, interleaved digits, p = 1021: x-labelling 1024 (the ceiling), random relabelling
  1023-1024, discrete-log labelling 109-121 (structure statistic, not a cost)'
