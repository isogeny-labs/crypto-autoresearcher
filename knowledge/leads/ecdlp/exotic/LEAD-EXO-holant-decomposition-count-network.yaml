obstruction:
  kind: measured
  statement: 'Scope: contraction of the Semaev decomposition-count network through basis changes of the
    F_p bond alphabet. (a) Invertible bond-wise basis changes cannot lower flattening or CP ranks (GL-invariance;
    holant-step-b-qtt-20261104, invariance.py). (b) The GGM excludes no basis change: field-indexed access
    is a coordinate oracle (holant-h1-ggm-lemma-20261103). (c) Measured with controls: the digit-QTT rank
    of the transfer matrix M in x-labelling equals that of random relabellings at p <= 2^10 (HOLANT-STEPB-QTT-20261104,
    NULL), and anomalous curves are no different (ANOMALOUS-QTT-20261104, NULL; 63 vs 63 curves at p <=
    127). (d) In discrete-log order M is Toeplitz-plus-Hankel in the factor base''s log set, and its QTT
    rank tracks that set''s digit complexity (round-2 check D3, E-block model, one curve per size: a log-AP
    factor base gives rank 12-18, small-x and random-log bases 47-120). The branch therefore reduces to
    the digit/Fourier structure of log(FB), the object of LEAD-EXO-dl-character-sum-pseudorandom, which
    measures it directly (consistent with random against a negation-matched null, HPSEUDO-SYMNULL-20261104).
    Owner decision 2026-11-04 in session. Scope note (owner decision 2026-11-04; WEAKCLASS-20261104, WEAKCLASS-I1-20261104,
    PAIRED-ANOMALY-20261104): the character-sum instrument does not detect anomalous or small-embedding-degree
    curves (36 curves per class, p <= 2^14, no detected shift (minimum detectable shift about 0.13 in
    u at 50% power)). It is sensitive to factor-base symmetry: zeta-stable sets sit low (p < 1e-5). The
    digit-QTT instrument shows no detection at p ~ 2^10, where it is rank-saturated. A NULL from these
    statistics therefore excludes structure of their own type only, not an easy discrete logarithm.'
  revisit_when: A contraction model that is not a tensor train over F_p digits (e.g. a contraction over
    another factorisation of the alphabet or a non-linear transfer), or an x-describable factor base whose
    log set has low digit complexity without known logs, or a measured excess in the dominating character-sum
    row.
