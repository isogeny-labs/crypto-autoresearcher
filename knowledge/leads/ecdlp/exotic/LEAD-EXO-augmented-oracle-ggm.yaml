id: LEAD-EXO-augmented-oracle-ggm
family: exotic
title: 'Label-valued augmented oracles (endomorphism image, label halving, incidence over a label factor
  base, label-valued net) and public-data oracles: Shoup-GGM simulability'
mechanism: 'Give the solver an extra oracle whose answers are group labels (endomorphism image, label
  halving, incidence over a label factor base, label-valued net) or public data with no instance input,
  and hope it supplies sub-birthday information. Split 2026-11-04 (owner decision in session; red-team
  review docs/reports/leads-round2-20261104/augmented-oracle-review.md): coordinate-revealing oracles
  moved to LEAD-EXO-coordinate-revealing-oracles.'
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: 'Scope: oracles whose input and output are group labels (or bits fixed by group relations
    among labelled elements), and public-data oracles with no instance input. Model: Shoup''s GGM (opaque
    labels, queries counted, local work free). Each in-scope oracle has an explicit generic simulator:
    endomorphism image acts on the prime-order group as a public scalar lambda, Theta(log N) group operations
    (the End_{F_p}(E) = Z premise of KN-FIND-b7e091 is false, EV-ECDLP-048824 CC-2; the eigenvalue argument
    replaces it); label halving is [(N+1)/2], Theta(log N); incidence CHECK over a factor base given as
    labels is m-1 additions and one equality, O(m); incidence SEARCH over such a base is label meet-in-the-middle,
    O(B^ceil(m/2)), so at yield-admissible B the per-query bound is vacuous (H-ECDLP-5a484e) but the total-cost
    bound holds; a label-valued net sigma(aP+bQ) is double-and-add, Theta(log N). An algorithm that touches
    the instance only through these and the group oracle is generic, so Omega(sqrt N'') group operations,
    N'' the largest prime factor of N (KN-TECH-005). Public-data oracles (x0 -> factor-base membership,
    O_y(x0), a full-point oracle on an index space, "is P in phi(E)?") take no instance input; their recorded
    dispositions are model-free (H-ECDLP-cd7072, H-ECDLP-5cb5d0, H-ECDLP-29400c). NOT in scope: any oracle
    returning coordinates or coordinate predicates of instance points (x, y, full point, x-valued halving,
    field-valued jet and net, C_t, degree-D tests); see LEAD-EXO-coordinate-revealing-oracles. Measured,
    toy 7-8 bits, m = 3, one strategy, strength preliminary (CORR-20261026-c94668): x-membership-filtered
    MITM gives Y_A = Y_B in 40/40 cells (EV-ECDLP-fd61e4); B/A field operations 0.0557, attributable to
    the split (EV-ECDLP-7367e2); B/C candidates verified 3.754 (EV-ECDLP-284817). Measurements, not a
    bound. Derivation tier: the simulators are the REV-20260727-002 derivation (EV-GGM-002) and holant
    REDTEAM F1, not yet ratified by the rule-12 round routed in DEC-20260831-a9716f.'
  revisit_when: An in-scope oracle is redefined to return field data about instance points or to test
    their membership in a coordinate-defined set (it then moves to LEAD-EXO-coordinate-revealing-oracles),
    or the routed review-breakthrough round corrects a simulator stated here.
best_measured: 'toy 7-8 bits, m = 3: Y_A = Y_B (40/40 cells); B/A field ops 0.0557 (split); B/C candidates
  3.754 (all preliminary)'
