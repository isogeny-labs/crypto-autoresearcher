mechanism: Lange and Winterhof (COCOON 2002; LNCS 2003, doi 10.1007/3-540-44828-4_7) prove that polynomials
  interpolating the ECDL and ECDH maps on large subsets have high degree. That could turn the measured
  coordinate-statistic census and the advice-table lanes into a proof-kind closure for bounded-degree
  statistics and advice.
