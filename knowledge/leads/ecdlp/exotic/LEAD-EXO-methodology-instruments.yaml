id: LEAD-EXO-methodology-instruments
family: exotic
title: >-
  Program methodology: instrument calibration, nulls, findings promotion (not a cost mechanism)
mechanism: >-
  Records that test the program's own instruments (label-permutation nulls, planted-signal
  controls, detection floors, solving-degree meters), its findings-promotion gate and its
  record integrity. They decide whether other leads' negatives and positives are trustworthy;
  they cannot by themselves make ECDLP cheaper.
disposition: open_next_step
next_action:
  step: >-
    Inject the three planted-signal families of IDEA-20260807-efc8de into the real pipeline
    and replay mechanism screens against synthetic positives with equal generic-operation
    budgets. Before treating coordinate skill as non-generic, regress abstract-group invariants
    (subgroup/coset, order and automorphism orbit) and compare the residual with the existing
    permutation null; do not use a random-encoding gap by itself as a certifier.
  discriminates: >-
    A screen that misses a matched planted positive invalidates only negative claims that rely on
    that screen. A high detection rate calibrates that instrument; it does not license blanket
    closure. MP-ml_empirical-6 exactly refutes the unequal-budget random-encoding twin certifier.
