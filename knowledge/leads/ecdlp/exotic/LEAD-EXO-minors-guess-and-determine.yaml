id: LEAD-EXO-minors-guess-and-determine
family: exotic
title: Minors-based and guess-and-determine ECDLP attacks (Mahalanobis line) - charged cost versus matched
  rho at toy size
mechanism: A published line (Mahalanobis and Mallick, Abdullah-Mahalanobis-Mallick, 'Minors solve the
  ECDLP', and a 2026 guess-and-determine variant) searches for a zero minor of a matrix built from the
  curve and the two points, using a hyperplane-arrangement poset or guessed entries to fix the scalar.
  The recorded claims are an order-2^50 toy solve and no complexity bound; the latest paper says it is
  no security risk. The program has never charged its cost against matched rho.
disposition: open_next_step
next_action:
  step: Read the full texts of arXiv:1703.07544, 2005.05039, 2310.04132 and 2607.09814 first (the draft
    design reconstructs the algorithm from abstract pages only, as a zero n x n minor of a Riemann-Roch
    evaluation matrix with n - 1 guessed columns and a cofactor scan for the last). Then freeze the design,
    implement the algorithm as the papers state it at toy group orders (20 to 40 bit, six sizes), charge
    every minor or determinant evaluation and linear-algebra step in the counted unit, and run it on the
    same planted instances as matched negation rho; fit the scaling exponent with an interval.
  discriminates: A fitted exponent whose upper 95% bound is at or above 1/2 with a constant above rho's
    closes the lead with a measured obstruction, but only for the reconstructed algorithm; a loss on a
    mis-specified reconstruction does not close the papers. An upper bound below 1/2, or minors beating
    rho at 32 bits or more, is a real lead and goes to independent replication before any claim.
