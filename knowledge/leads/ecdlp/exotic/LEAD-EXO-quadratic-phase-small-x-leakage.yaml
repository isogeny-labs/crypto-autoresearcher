id: LEAD-EXO-quadratic-phase-small-x-leakage
family: exotic
title: >-
  Quadratic-phase (Gowers U^3-type) correlation of the small-x predicate in discrete-log order,
  beyond the linear character sums of H-PSEUDO
mechanism: >-
  LEAD-EXO-dl-character-sum-pseudorandom tests linear phases e(k l / N) of the small-x set in log
  order. A set can be Fourier-flat and still correlate with a quadratic phase e(alpha l^2 / N).
  Relation yield is a complexity-1 count governed by linear structure, so this is a direct leakage
  lead, not a yield lead. Exploitation path (memo derivation, numbered heuristic): a heavy quadratic
  coefficient alpha* of f = 1_S - B/N makes g(r) = 1_S([r]Q) correlate with e(alpha* k^2 r^2 / N).
  Because the factor base is negation-closed, g is even. Substituting u = r^2 on quadratic
  residues gives a linear phase in u, and chosen-query sparse Fourier search (Akavia-Goldwasser-
  Safra / Kushilevitz-Mansour, recalled) would recover k^2, hence k up to sign. No completion
  argument through group characters bounds quadratic phases in log l, and no bound is known here.
disposition: open_next_step
next_action:
  step: >-
    At N in {2^14, 2^16}, 3 curves each with the frozen small-x factor base rule, compute
    Q = max over (alpha, beta) of |sum_l f(l) e((alpha l^2 + beta l)/N)| / sqrt(B) by one FFT per
    alpha. Use 30 negation-closed random sets per size as the null (the symmetric-null lesson of
    check D1, report leads-round2-20261104). The positive control is a planted negation-closed set
    {l : alpha0 l^2 mod N in [0, B)}, which must spike at alpha0.
  discriminates: >-
    Q inside the symmetric null's 5-95% band on at least 5 of 6 curves closes degree-2 phase
    leakage at toy scale, with H-PSEUDO's scale caveat. Q above the null maximum on at least 2 of
    3 curves at both sizes, at an alpha* stable across curves, would be the first non-linear
    Fourier bias on record and goes to review-breakthrough.
