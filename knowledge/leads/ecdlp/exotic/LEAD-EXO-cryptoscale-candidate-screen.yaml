id: LEAD-EXO-cryptoscale-candidate-screen
family: exotic
title: GOAL-CRYPTO-001 discovery screen for a reproducible non-generic crypto-size algorithm
mechanism: >-
  Screen literature and representation families (compact target-label common factors, defect-scaled
  hyperplane-signature zero-minor routes, corner-coefficient induction, KN-OPEN gates) through
  Gate A/B admission for any candidate that could beat rho on cryptographic prime-field ECDLP.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    Thirteen screening batches returned FINAL_NO_CANDIDATE / NO_ADMISSIBLE_NEXT_MECHANISM
    over the checked source set (EV-CRYPTO-010..013); the hyperplane-signature zero-minor
    route is not sub-rho under its own pinned model at d=1 (KN-FIND-3d6f78, EV-CRYPTO-ad7fa2
    replicated). Scale reached: the recorded source set, zero-compute admission sheets; no
    crypto-size run.
  revisit_when: >-
    An externally sourced candidate with an explicit constructor arrives, or the screen's
    own sensitivity audit (IDEA-20260805-9430e9) shows it could not have admitted a known
    positive.
