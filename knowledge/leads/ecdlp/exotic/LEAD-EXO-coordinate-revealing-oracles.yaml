id: LEAD-EXO-coordinate-revealing-oracles
family: exotic
title: 'Coordinate-revealing oracles (x, y, full point, x-valued halving, field-valued jet and net, threshold
  C_t, degree-D coordinate tests): the GGM gives no bound'
mechanism: Give the solver coordinates, or functions or predicates of coordinates, of instance points
  and hope they supply sub-birthday information or guided decomposition. Split from LEAD-EXO-augmented-oracle-ggm
  on 2026-11-04 (owner decision in session).
disposition: open_next_step
next_action:
  step: 'The GGM gives no bound for this class. Two x-queries plus free local work give log_P Q up to
    sign on any curve, so x, y, full point, x-valued halving and field-valued jet and net have simulation
    overhead Theta(sqrt N'') (holant-h1-ggm-lemma-20261103 Lemma 3; KN-FIND-194294), and C_t and degree-D
    tests are non-simulable (KN-FIND-982fdf; ecdlp-leads-desk-20261104 low-degree-desk §1). The open question
    is time-bounded advantage from coordinate access on prime-order prime-field curves, i.e. index calculus
    itself (KN-OPEN-001). Concrete steps: (1) zero-compute, OPENED 2026-11-05 as BATCH-9f090a (DEC-20261105-c5fcb6; review pending): the review-breakthrough round routed
    by DEC-20260831-a9716f with this per-oracle table as subject, in Shoup''s model, separating label-valued
    from field-valued readings and CHECK from SEARCH, and record a finding that supersedes the x, jet
    and net verdicts of KN-FIND-002 and KN-FIND-b7e091; (2) literature, DONE 2026-11-05 (docs/reports/round5-desk-20261105/chw-reading.md):
    KN-LIT-7606''s body has no elliptic-curve theorem (its Section 5.3 lists EC as not yet modelled). Its Theorem
    3.2 proof only fixes the labelling on a fixed delta-fraction and randomises the rest, so, by a reading not
    stated by the authors ([pcc:unverified]), coordinate access confined to a fixed set such as a coordinate-defined
    factor base of B <= sqrt q points gives no advantage (T = Omega(min(sqrt q, 1/delta)) = generic). Index calculus
    reads coordinates of instance-derived points, delta = 1, and the bound is vacuous, so no query-model closure
    exists for full coordinate access; (3) bit-valued low-degree tests proceed under
    LEAD-EXO-low-degree-query-lower-bound (rank computation); (4) field-valued x/y/full-point access is
    pursued as prime-field index calculus in the ic-prime and ic-engine rows (e.g. LEAD-ICE-semaev-yield-model-coset-typing,
    which already holds H-XOR-YIELD), priced against matched rho under the boundary-table-ratio rule.'
  discriminates: Settled for step (2). Fixed-set coordinate access (a coordinate-defined factor base,
    coordinates of a fixed delta-fraction) is bounded by CHW's proof at the generic sqrt N for delta <= 1/sqrt N
    (reading, [pcc:unverified]). Full coordinate access, which index calculus needs, has no query-model closure,
    so this class is decided only by time-bounded index-calculus measurements against matched rho (step 4) and
    by the review round on step (1).
best_measured: 'toy 7-8 bits, m = 3, x-membership-filtered Semaev MITM: Y_A = Y_B; split-attributable
  constant-factor saving B/A 0.0557 (preliminary). Not a bound.'
