id: LEAD-EXO-lattes-xline-dynamics
family: exotic
title: Lattes-map dynamics on the x-line (forward orbits, iterated preimage trees, postcritical and multiplier
  data) as ECDLP structure
mechanism: The multiplication maps act on the x-line as rational maps phi_d with x([d]R) = phi_d(x(R));
  on CM curves every endomorphism alpha gives a Lattes map phi_alpha of degree N(alpha). The hope is that
  the dynamics of phi (periodic points, iterated preimage trees of x(Q), postcritical sets, multiplier
  spectra) separates Q = kP from a random point of the same curve, or yields an orbit quotient beyond
  the automorphism constant.
disposition: closed_obstructed
obstruction:
  kind: proof
  statement: '(a) Every forward iterate is a group operation (phi_d(x(R)) = x([d]R)), so any forward-dynamics
    algorithm is simulable in the generic group model and Shoup''s N^(1/2) bound applies (KN-FIND-002
    pattern). (b) The phi_alpha-orbit of x(Q) is the coset of <lambda> in (Z/N)^* acting on k, of length
    ord_N(lambda) >= log N / log N(alpha), so orbit quotients give sqrt|Aut| for units and nothing for
    non-units (LEAD-STR-small-cm-disc-nonunit-endo, LEAD-STR-automorphism-quotient-rho). (c) The roots
    of phi_d^(n)(x) - x(Q) are x(Q_n + T) with Q_n = d^(-n) Q rational and T in E[d^n], so the F_p factorisation
    pattern of the preimage tree is the Frobenius orbit structure on E[d^n], which does not depend on
    k (the LEAD-STR-torsion-module-leak argument; H-TORS-3bed8a measured the analogue for psi_5); a source-faithful
    quotient of the tree has N^(1-o(1)) leaves. (d) Postcritical sets and multiplier spectra are curve
    constants. Part (c) holds for P of prime order N with d coprime to N: a probe on a cyclic Z/1008 curve
    at p = 1009 with d = 3 shows the multiset does depend on k when d divides the order of P ([1,1,1,3,3]
    for 3 | k, [3,3,3] otherwise). Part (c) is an argument backed by a measured analogue; the k-independence
    check designed in this PR is the measured test of it. Scope: ordinary prime-field curves, prime-order
    G.'
  revisit_when: Any dependence on k of the F_p-factorisation multiset of phi_d^(n)(x) - x(kP) at a matched
    curve, or a postcritical or multiplier invariant that is not a curve constant.
