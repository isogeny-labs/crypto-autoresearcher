id: LEAD-EXO-ml-learned-models
family: exotic
title: Machine learning / neural and RL approaches to ECDLP and its subroutines
mechanism: >-
  Learn a predictor of log bits, a latent linearisation of the group law, a solver branching
  policy, an isogeny-class walk policy (RL) or a curve-hardness predictor, and use it to prune
  search or pick cheaper presentations.
disposition: open_next_step
next_action:
  step: >-
    Run a learnability control on toy prime-order groups: train a model to predict a log bit
    from coordinates, with a planted-structure positive control (a known homomorphic leak)
    and a random-relabelling null, at N up to 2^24; in parallel execute the frozen ec_hardness_predictor
    phases 0-3.
  discriminates: >-
    Detecting the planted leak but staying at chance on the curve closes direct learned DL
    prediction at that scale (consistent with IDEA-20260806-94676a: an exact latent linearisation
    IS the log); above-null accuracy on the curve that survives the null is a new statistic
    for LEAD-EXO-coordinate-statistic-leakage.
best_measured: >-
  learned WDSat branching policy: 16,097 conflicts vs paper default 3,092 on 8 heldout targets
  (worse; cryptanalysis ideas_learning_20261018)
