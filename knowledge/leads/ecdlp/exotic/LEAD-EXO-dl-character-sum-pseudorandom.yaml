id: LEAD-EXO-dl-character-sum-pseudorandom
family: exotic
title: Additive-character bias of the discrete log on structured factor bases (H-PSEUDO)
mechanism: >-
  If max_k |sum_{P in F} e(2 pi i k DL(P)/N)| over the small-x set F were well above sqrt(B),
  the factor base would have super-random additive yield; by the Betti-yield duality (KN-FIND-9d2f56)
  exactly this is what a sub-rho combinatorial IC needs.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    Measured the character-sum constant against a matched random null at 2^20-2^26 (EV-ECDLP-f83a17):
    R = C_EC/C_null is flat at about 1.28-1.34, i.e. the curve behaves like a random set up
    to a constant; all six standard analytic proof routes are closed (KN-FIND-e7a3b1), so
    neither a proof nor a measured bias exists. EXP7 Fourier flatness (8-14 bit) found no
    candidate predicate. Desk check 2026-11-04 (report leads-round2-20261104, check D1): the
    constant offset is explained by negation symmetry. The run code keys the factor base by (x, y),
    so F = -F and its character sums are real, while the null is an asymmetric uniform B-subset.
    Negation-closed random sets with no curve structure give R = 1.29 (N ~ 2^17) and 1.31
    (N ~ 2^20) against the same null. Matched to the recorded rung parameters, R against a
    negation-closed null is 1.01-1.03 +- 0.03 at the 2^20 rung and 0.96-1.02 across rungs
    (validator recomputation). So the measured excess is explained by a null mismatch, within
    about +-0.03-0.05; no curve-specific excess is visible.
  revisit_when: >-
    R trends upward with p beyond 2^30 on a negation-matched null (the 2026-11-04 check shows the
    asymmetric null inflates R by about 1.3), or a structured set other than small-x shows R
    growing with N. The full ladder should be re-read against a negation-closed null.
best_measured: R = C_EC/C_null ~ 1.28-1.34, flat across 2^20..2^26 (EV-ECDLP-f83a17, toy)
