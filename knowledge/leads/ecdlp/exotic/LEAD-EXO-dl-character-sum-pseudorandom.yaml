id: LEAD-EXO-dl-character-sum-pseudorandom
family: exotic
title: Additive-character bias of the discrete log on structured factor bases (H-PSEUDO)
mechanism: >-
  If max_k |sum_{P in F} e(2 pi i k DL(P)/N)| over the small-x set F were well above sqrt(B),
  the factor base would have super-random additive yield; by the Betti-yield duality (KN-FIND-9d2f56)
  exactly this is what a sub-rho combinatorial IC needs.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    Measured the character-sum constant against a matched random null at 2^20-2^26 (EV-ECDLP-f83a17):
    R = C_EC/C_null is flat at about 1.28-1.34, i.e. the curve behaves like a random set up
    to a constant; all six standard analytic proof routes are closed (KN-FIND-e7a3b1), so
    neither a proof nor a measured bias exists. EXP7 Fourier flatness (8-14 bit) found no
    candidate predicate. Re-read 2026-11-04 against a negation-matched null (frozen protocol
    HPSEUDO-SYMNULL-20261104, report hpseudo-symnull-20261104): EXPLAINED. The run code keys the
    factor base by (x, y), so F = -F and its character sums are real, while the recorded null
    was an asymmetric uniform subset. Against negation-closed nulls at each curve's own N, R is
    1.040 [0.999, 1.092] and 0.993 [0.972, 1.017] on out-of-sample curves at 2^20 and 2^22, and
    0.974-1.012 on the R_mean curves at all four rungs. The recorded R ~ 1.3 is a null mismatch,
    and the small-x set behaves as a random negation-closed set with no constant offset.
  revisit_when: >-
    R measured against a negation-matched null exceeds 1 beyond its CI and trends upward with p
    beyond 2^30, or a structured set other than small-x shows such growth. Any comparison of a
    negation-closed factor base with an asymmetric null must be re-read first.
best_measured: >-
  R against a negation-matched null 0.97-1.04 at 2^20..2^26 (HPSEUDO-SYMNULL-20261104); the recorded
  R ~ 1.28-1.34 (EV-ECDLP-f83a17) was against an asymmetric null
