id: LEAD-EXO-torsor-deck-period
family: exotic
title: Torsor, deck-orbit, cubical/biextension and scalar-orbit elliptic-period descent
mechanism: >-
  Place the instance on a G_m/G_a-torsor or a Galois cover over E (cubical lifts, biextensions,
  theta structures, level-N linearisation) and use deck-group orbits or an elliptic period
  of the scalar orbit as a public label that routes the target to a small fibre.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    For a generically Galois cover every rational deck-invariant factors through the quotient;
    a transitive fibre-orbit label is base data; a connected nontrivial cover has no rational
    section, so a rational target-compatible selector is a missing section or trivialization
    (IDEA-010 gate, independently verified). The cubical/biextension lift lands on the invertible
    side of the recognizable/invertible duality, i.e. computing its label costs the log (IDEA-20260920-376b00).
  revisit_when: >-
    A rational, target-compatible selector or section of a nontrivial cover (or a non-Galois
    cover escaping the quotient argument) is exhibited.
next_action: {from_revisit_when: true}
