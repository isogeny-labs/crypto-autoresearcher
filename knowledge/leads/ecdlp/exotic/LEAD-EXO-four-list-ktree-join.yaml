id: LEAD-EXO-four-list-ktree-join
family: exotic
title: Wagner k-tree / four-list joins with cheap sum-compatible filters
mechanism: >-
  Run a Wagner-style k-list tree (or representation-technique subset-sum) on E(F_p) using
  a cheap filter h with h(P+Q)=f(h(P),h(Q)) often enough, or an output-sensitive partial verifier,
  aiming at N^(1/3+o(1)) end-to-end. Signed-y and Boolean-success cascades are the program's
  concrete instances.
disposition: open_next_step
next_action:
  step: >-
    Pursue either independent successor. (a) Measure the relative bucket variance W of the O2
    agreement kernel (H-ECDLP-2ade73; IDEA-20260904-f7d47d second moment) on the covered families
    across N and fit its decay against 1/sqrt(N); EXP-ECDLP-5cad48 ran many stages without ever
    assigning a W class. (b) Build a coordinate-visible bucket generator for exact ECCp-131 whose
    qualifying pairs can be enumerated in O(B + output), or another proved subquadratic bound,
    then freeze the same train/held-out/independent-null/random-base controls used by the simple-bit
    screen. Learned multibit hashes and algebraic bucket generators remain eligible.
  discriminates: >-
    SMALL-W supports a proof attempt for a bucket-selected level-1 bound; a fitted exponent is
    not that proof. LARGE-W rejects that second-moment proof route and motivates inspection of
    the heavy buckets, but does not by itself exhibit an attack. Neither outcome closes j=2,
    higher tree levels, uncovered filter families, or KN-OPEN-91d4f6 without the missing theorem.
    For the ECCp-131 successor, promotion requires a held-out lower enrichment ratio above one,
    no matched-random-base explanation, and the promised subquadratic generator. Another bounded
    null rejects only the frozen predicate family, base sizes and curve; a post-add signal that
    first enumerates all Theta(B^2) sums is not a qualifying Wagner filter.
best_measured: >-
  At p=65539, M=40, M*max_c pi_c=1.084 versus 1.082 for the SHA null and M*delta=1.002;
  the excess decays over the toy ladder. This shows no attack signal, but j=2 remains unproved,
  not refuted, and no tree row is closed. On exact 131-bit ECCp-131, the frozen representation-filter
  sweep evaluated 3,450 simple 1--8-bit coordinate configurations in each of six small-x/random-base
  cells at B=64,128,256. All recorded held-out Wilson lower ratios were below one
  (0.6093--0.7783); the two positive
  small-x point estimates were post-add filters requiring all Theta(B^2) pair sums. This is an exact
  counted null for that finite family, not for learned, algebraic or other coordinate-visible
  buckets; local clocks are invalid and the retained export-shape/interval-label deviations do
  not support a performance claim.
