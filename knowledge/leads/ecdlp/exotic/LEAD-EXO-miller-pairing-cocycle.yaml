id: LEAD-EXO-miller-pairing-cocycle
family: exotic
title: Miller functions, S-unit descent and pairing-free Miller cocycles on prime-order curves
mechanism: >-
  Use Miller functions f_{N,P}, their S-unit supports, generalized-Jacobian extension classes
  or a partial pairing "return cycle" to map points to a multiplicative group without a small
  embedding degree. When gcd(N,p-1)=1 the N-th root U(R)=f(R)^(1/N) is a canonical primitive
  of the Miller cocycle and is computable from R; if U(kP) exposed k through a cheap closed
  form, the DLP would move to F_p^*.
disposition: open_next_step
next_action:
  step: >-
    Verify IDEA-20261017-e3a6f1 claims K1 (Weil-reciprocity cocycle, U unique primitive) and
    K2 (U(kP)=c*r_k*C^(k/N), r_k=psi_{k-1}/psi_k) exactly on toy prime-order curves with gcd(N,p-1)=1,
    then measure whether k can be recovered from U(kP) in fewer than sqrt(N) group operations
    once r_k is charged.
  discriminates: >-
    If K2 holds and r_k needs k (division-polynomial values), the primitive collapses into
    the closed elliptic-net lead and this lead closes as obstructed; if r_k can be removed
    or batched without k, it is the first pairing-free homomorphic exit and goes to a charged
    rho comparison.
