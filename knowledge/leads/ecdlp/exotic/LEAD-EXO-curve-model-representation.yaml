id: LEAD-EXO-curve-model-representation
family: exotic
title: >-
  Alternative curve models and point representations (Edwards, Hessian, Montgomery, Kummer,
  x-only)
mechanism: >-
  Change the model or coordinate (Edwards, Hessian, Jacobi, Montgomery, Kummer line, theta
  coordinates, twist cosets) so that summation polynomials, membership tests or collision
  arithmetic become cheaper.
disposition: open_next_step
obstruction:
  kind: measured
  statement: >-
    Model-native PDP solving degree is invariant (d_reg = 2) between Weierstrass Semaev and
    twisted Edwards at m=2 and m=3, with Edwards a constant factor larger (EV-REP-001, EV-REP-002
    replicated); the Kummer line is Bezout-optimal among coordinates E -> P^1 and the model
    lever is capped by a one-line degree argument (IDEA-20260905-d0fee4, IDEA-20260913-11d3cb,
    proposals). Exponent lever closed; at most constant factors (Hessian coordinate factor
    <= 2) remain.
  revisit_when: >-
    A coordinate E -> P^1 with summation-polynomial degree below the Kummer degree is exhibited
    (would refute the Bezout claim), or a constant-factor model gain is wanted inside an IC
    engine (then it belongs to ic-prime).
best_measured: d_reg = 2 for both models at m = 2, 3 (EV-REP-002, replicated, toy)
next_action: {from_revisit_when: true}
