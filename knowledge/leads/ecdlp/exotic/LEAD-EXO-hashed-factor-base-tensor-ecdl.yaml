id: LEAD-EXO-hashed-factor-base-tensor-ecdl
family: exotic
title: >-
  Hashed-factor-base ECDL with a compact low-degree Boolean encoding and exact tensor
  contraction (Akshima et al., Bochum v0.2), conditional on the openai/math #k-SAT result
mechanism: >-
  Akshima et al., "A Subexponential Time Algorithm for Elliptic Curve Discrete Logarithm"
  (Bochum v0.2, pinned 1ee44e56), hash-select a factor base and encode relation finding as a
  compact low-degree Boolean system (ripple arithmetic, Fourier integer products, affine
  hashes, cofactor clearing). They solve it by exact tensor contraction with the recursive
  counting backend of the openai/math ETH preprint (KN-LIT-caa51d, Appendix D.1/D.4), then
  collect N + 1 relations and do linear algebra. The claimed subexponential bound is conditional
  on that unverified preprint. The program has an independent native implementation in crypto
  and cryptanalysis (identical sources), checked on small curves only.
disposition: open_next_step
next_action:
  step: >-
    Two steps, either first. (a) Independent audit of correctness and of the complexity proof
    (crypto problems/hashed-ecdl-tensor-backend.md). It must check whether the obstruction
    recorded in LEAD-ICB-decomposition-encoding-and-sat applies to this encoding: there the
    #SAT exponent outgrows enumeration once the CNF has omega(l sqrt(log l)) variables.
    (b) Freeze a successor that exercises the recursive kernel (`root_u > 0`), fully prices the
    native work and obtains complete verified native-source/native-width cells against the matched
    rho-neg-v2 reference. Use independent measurement seeds or multiple rounds, and bind raw
    sessions, source commit, build flags and rebuilt binaries in a gate-shaped custody receipt.
  discriminates: >-
    An audit that finds the encoding's variable count makes the counting bound lose to
    enumeration or rho closes only this exact encoding/backend under that proved cost model.
    A clean audit leaves the claim conditional on the preprint. A fully charged recursive-kernel
    cell below matched rho would be the first evidence for the claimed mechanism. A worse bounded
    successor scopes only that backend and scale; exhaustion, incomplete cells or missing custody
    remain unknown rather than mathematical negatives.
best_measured: >-
  Counted-S v2 ran: receipt validation passed and all 416 executions replayed (306 verified,
  110 exhausted). Across fp10..fp16, complete tensor-m2 cells cost 4,318--1,206,158x matched rho;
  the three complete native cells cost 495.6--2,801.5x. Native-source and native-width produced
  0/64 verified executions and remain unknown. Every row used finite fallback (`root_u=0`), so the
  recursive kernel was unexercised; native counts are lower bounds, one-round shared-seed A/A is
  vacuous for noise, and original binary-to-commit custody remains incomplete.
