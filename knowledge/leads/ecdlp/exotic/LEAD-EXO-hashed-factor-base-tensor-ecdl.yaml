id: LEAD-EXO-hashed-factor-base-tensor-ecdl
family: exotic
title: >-
  Hashed-factor-base ECDL with a compact low-degree Boolean encoding and exact tensor
  contraction (Akshima et al., Bochum v0.2), conditional on the openai/math #k-SAT result
mechanism: >-
  Akshima et al., "A Subexponential Time Algorithm for Elliptic Curve Discrete Logarithm"
  (Bochum v0.2, pinned 1ee44e56), hash-select a factor base and encode relation finding as a
  compact low-degree Boolean system (ripple arithmetic, Fourier integer products, affine
  hashes, cofactor clearing). They solve it by exact tensor contraction with the recursive
  counting backend of the openai/math ETH preprint (KN-LIT-caa51d, Appendix D.1/D.4), then
  collect N + 1 relations and do linear algebra. The claimed subexponential bound is conditional
  on that unverified preprint. The program has an independent native implementation in crypto
  and cryptanalysis (identical sources), checked on small curves only.
disposition: open_next_step
next_action:
  step: >-
    Two steps, either first. (a) Independent audit of correctness and of the complexity proof
    (crypto problems/hashed-ecdl-tensor-backend.md). It must check whether the obstruction
    recorded in LEAD-ICB-decomposition-encoding-and-sat applies to this encoding: there the
    #SAT exponent outgrows enumeration once the CNF has omega(l sqrt(log l)) variables.
    (b) Run the frozen 84-case comparison panel (crypto research/hashed_ecdl_speed_20261029,
    cryptanalysis docs/hashed-ecdl-panel.md). It is blocked on checkpoint transport and native
    execution access. Price it in ecbench's counted unit against matched rho on the same toy
    curves.
  discriminates: >-
    An audit that finds the encoding's variable count makes the counting bound lose to
    enumeration or rho (as for descended Semaev systems) closes the lead with that cost model.
    A clean audit leaves the claim conditional on the preprint. A measured counted-cost slope
    below rho's on toy curves, with controls, would be the first evidence of a gain. No result
    either way exists yet.
best_measured: >-
  none: 34 native correctness tests pass and certificate parity holds. Matched profiling and
  performance runs are blocked. ECC2K-130 and ECCp-131 attempts exceed their exact-leaf budget
  without a relation; no runtime, S or S/rho figure.
