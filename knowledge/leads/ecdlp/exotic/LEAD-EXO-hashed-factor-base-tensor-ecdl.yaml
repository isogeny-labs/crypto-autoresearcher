  note: >-
    L06: plain tree-decomposition DP on the school CNF loses to enumeration at b <= 16 (MMD+ lower
    bound 15..51 against enumeration 2..10.7, on a Python structural model of the Rust encoder, not
    a graph dump). Treewidth of the dense gate graph is the wrong proxy for D.1 (black-box vertices,
    Hermite interpolation); the Fourier arm is dense-arity only and the structured transform-word
    cut was effectively not run. Not a closure of the tensor route.
- repo: crypto
  path: research/ic_prime_eth_leads_20261031/leads/L09/table2.json
  note: >-
    L09 BTN census tool, 34 rows: no encoding is D.1-admitted (margin -16.1..-16.3 bits of log2
    lambda; D.1 needs lambda >= 2^85). With D.1 constant 1, s/sqrt(log2 s) is at least 37x the
    enumeration exponent, but s is for the one-constraint-per-vertex partition (an upper bound on
    the best legal partition), so this is a harness constant with a downgraded yardstick until a
    cut-minimising clustering column exists.
- repo: crypto-autoresearcher
  path: docs/reports/ic-prime-eth-leads-20261102/clustering_closure.md
  note: >-
    Desk note 2026-11-02: the clustering loophole is closed by non-admission outright (no row
    reaches the D.1 threshold) and conditionally by steps 3-5 if admission were granted (closure for
    b < 2^36 is m = 3 specific; m = 4: b < 2^16; m >= 4 by no_crossover with c >= 1). Not shown: an
    unconditional bound for clustered graphs with deterministic hidden circuits.
- repo: crypto-autoresearcher
