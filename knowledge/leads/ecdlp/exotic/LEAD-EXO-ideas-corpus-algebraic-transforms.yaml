id: LEAD-EXO-ideas-corpus-algebraic-transforms
family: exotic
title: 'ECDLP-IDEA breakthrough corpus: algebraic-geometric transforms awaiting constructors'
mechanism: >-
  The ideas/ECDLP-IDEA-* corpus (about 436 generated ideas: spinor-matchgate addition transform,
  block-Krylov transition intersection, Cremona-shrunk toric decomposition, aggregate complement-divisor
  compression, x-only nonfaithful signed lifts, conormal-polar blowups, ramification-break
  digits, and many more) proposes representation changes whose payoff depends on an explicit
  constructor or theorem not yet supplied.
disposition: open_blocked
next_action:
  step: >-
    For each of the 15 active registry rows, supply the named constructor or theorem the deferred/independent
    audits ask for, then run its zero-compute contract preflight; start with IDEA-012 (finite-deck
    weighted endpoint, REVISE_SCOPED_REDUCTION) whose missing pieces are listed.
  discriminates: >-
    A constructor that passes its preflight becomes its own lead with an experiment; a theorem-level
    no-go moves the idea to rejected with a cited obstruction.
  blocked_by: >-
    Theorem-deferred constructors unsupplied (ideas/deferred/README.md); no experiment from
    the corpus has ever run (ideas/README.md).
