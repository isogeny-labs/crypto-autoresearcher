id: LEAD-EXO-coordinate-statistic-leakage
family: exotic
title: >-
  Coordinate-statistic hunts: bias of x/y, slopes, bits, cross-ratios and trace functions
  under the group law
mechanism: >-
  Search for a cheap coordinate statistic (Legendre/cubic residue, low bits, digit sums, chord/tangent
  slopes, cross-ratios, trace-function sheaves) whose behaviour under P -> P+Q or P -> 2P
  is non-random and concentrates on a cheaply decidable subset, so a coordinate distinguisher
  leaks into key recovery (RQ-ECDLP-4fcbd3, the CRYPTO census).
disposition: open_next_step
next_action:
  step: >-
    Measure the digit-character family (IDEA-20260921-1ec106), the one natural candidate the
    census never measured, for (lambda, PGL_2-stability) against a PGL_2-orbit-matched null
    at the census sizes.
  discriminates: >-
    A stable statistic with lambda above the random level would be the first census survivor
    and feeds LEAD-EXO-hnp-advice-leakage. Random-level lambda rejects only the registered
    digit-character family and tested sizes; it cannot close learned multibit hashes, algebraic
    coordinate buckets, larger scales or statistics outside the census without a separate bound.
best_measured: >-
  Census: every structured additive set statistic is PGL_2-unstable and every stable multiplicative
  coset statistic sits at the random level (EV-ECDLP-81f4d4, recorded strong, lowered to preliminary
  by CORR-20261026-c94668). On exact ECCp-131, 3,450 simple 1--8-bit coordinate predicates per
  cell across six B/base cells had recorded held-out Wilson lower enrichment ratios
  0.6093--0.7783; the two
  positive small-x point estimates were post-add and Theta(B^2). This scopes only that frozen
  family at B=64,128,256.
