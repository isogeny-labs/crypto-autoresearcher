id: LEAD-EXO-elliptic-net-eds
family: exotic
title: Elliptic nets / elliptic divisibility sequences as a relation or annihilator source
mechanism: >-
  Re-encode kP through the Shipsey/Stange elliptic net W(a,b) (division-polynomial values)
  and use the two-parameter Somos identities, short annihilators or EDS periods as an exact
  multiplicative relation supply. If net-value collisions or a short annihilator of a target-translated
  block arrived below the birthday bound, index calculus on net exponents would beat BSGS/rho.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    Somos identities hold for every k, so net relations encode the group law on one k-fibre
    and not k (KN-FIND-002: net oracle GGM-simulable with O(log N) overhead); standard Hankel
    displacement rank of translated x-blocks is tautological and consecutive blocks have linear
    complexity >= (M-2)/3 (IDEA-006 gate). Measured at toy prime fields p in {101,431,1601},
    n <= 1607: collision statistics are random-oracle-equivalent and the charged k-recovery
    exponent is 1.97-2.80 against BSGS 1.17-1.32 at identical accounting, with the sieve/BSGS
    gap growing (24x -> 135x).
  revisit_when: >-
    Someone supplies a target-specific NONLINEAR locator outside the closed Hankel/translated-block
    classes, or a rank>=2 net whose relations are k-specific (the NC2 permuted-net asymmetry
    in EV-NET-001 is unexplained).
best_measured: >-
  charged k-recovery exponent 1.97-2.80 vs BSGS 1.17-1.32; sieve/BSGS op ratio 24.2 -> 134.7
  for p 101 -> 1601 (EV-NET-001, toy)
next_action: {from_revisit_when: true}
