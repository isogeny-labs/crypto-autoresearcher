id: LEAD-EXO-elliptic-code-list-decoding
family: exotic
title: Guruswami-Sudan list decoding of elliptic codes as a point-decomposition oracle (Zhang-Liu,
  KN-LIT-643)
mechanism: 'Cheng: min-weight codewords of C_L(D, kO), with D the factor base, are the k-subsets
  of D summing to a prescribed point. Decode ev(a) for a in L(M O) with Guruswami-Sudan (agreement
  sqrt(nk), genus 1). An agreement set of size M with all zeros in D is a weight-M relation.'
disposition: open_next_step
next_action:
  step: 'Paper: the counting bound C(B,M) p^(k-M-1) >= 1 with M = sqrt(Bk), for B = p^beta and beta
    < 1. Toy: p ~ 2^16, B ~ 2^8, run GS (or an equivalent brute force) for k from 2 to B and count
    non-empty lists.'
  discriminates: 'Predicted: hits only near k ~ B (the code is the whole space), giving closed_obstructed
    with kind proof; this also closes ISD on elliptic codes as SO-TABLE. Non-empty lists at k <<
    B in the toy would refute the bound and reopen the lead as a decomposition oracle.'
