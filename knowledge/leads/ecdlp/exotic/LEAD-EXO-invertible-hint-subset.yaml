id: LEAD-EXO-invertible-hint-subset
family: exotic
title: >-
  The invertible half: dense, cheaply recognizable AND cheaply invertible subsets of E(F_p)
mechanism: >-
  Find D subset E(F_p) with |D| >= n^alpha (alpha > 1/2) whose membership is decidable from
  coordinates and whose logs are computable from coordinates (a "hint family"), e.g. a low-degree
  polynomial agreeing with log_g on the small-x set. Random self-reduction into D would then
  beat the square-root bound; failing that, a provable recognizable/invertible duality would
  close the lane.
disposition: open_next_step
next_action:
  step: >-
    First obtain and read the theorem statements of Lange-Winterhof (COCOON 2002, LNCS 2387,
    pp. 137-143; AAECC 2003, LNCS 2643, pp. 51-60) and Kiltz-Winterhof (Bull. Austral. Math.
    Soc. 69 (2004) 305-315). They bound the degree (and, for Kiltz-Winterhof, the weight) of
    polynomials interpolating the ECDL and DH maps. It is not yet known whether any of them covers agreement
    on a subset of size n^alpha. Then measure A(1) and A(d) (maximal agreement of degree-d polynomials with the log graph Gamma_E)
    on the toy ladder of H-ECDLP-f6a43a against the random-labelling null; the cell was never
    measured (claim expired, EV-ECDLP-924941).
  discriminates: >-
    A(d) at the random-labelling level for all d closes the algebraic-omega model of the invertible
    half; an excess growing with n is the first measured hint family and goes to a charged
    comparison.
evidence:
- repo: crypto-autoresearcher
  path: docs/reports/leads-round2-20261104/amendments-literature.md
  note: >-
    Literature check 2026-11-04 (scouting amendment A2), abstract level only, because the theorems
    were not reached. Lange-Winterhof (COCOON 2002) and its AAECC 2003 follow-up give degree lower
    bounds for polynomials interpolating the ECDL and ECDH maps, and Kiltz-Winterhof (2004) gives degree
    and weight bounds for bivariate DH polynomials. These concern full interpolation, not
    agreement on a dense subset, so they do not by themselves decide A(d).
