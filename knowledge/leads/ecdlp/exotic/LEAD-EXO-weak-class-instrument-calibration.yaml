id: LEAD-EXO-weak-class-instrument-calibration
family: exotic
title: >-
  Natural weak curve classes (anomalous, MNT small embedding degree, j = 0 with a stable factor
  base) as positive controls for the numeric structure instruments: a detect-or-blind table
mechanism: >-
  Most null or exhausted structure rows rest on numeric instruments that have not been run on
  curves whose discrete logarithm is known to be easy. The one exception so far is QTT on
  anomalous curves, cited below. Synthetic planted signals
  (LEAD-EXO-methodology-instruments) test detection of a signal of the instrument's own type, not
  sensitivity to real cryptanalytic weakness. This lead runs natural weak classes through each
  instrument: (A) anomalous, #E = p (Smart, polynomial time); (B) prime-order curves with embedding
  degree k in {3, 4, 6} (MOV, subexponential); (C) j = 0 with a zeta-stable factor base; and (D)
  ordinary prime-order curves as the reference. The instruments are (i) the digit-QTT rank of the
  decomposition transfer matrix (holant step b), (ii) the character-sum maximum against a
  negation-symmetric null (see report leads-round2-20261104, check D1), (iii) the low-degree
  evaluation rank with multipliers free of short relations (check D2), and (iv) the m = 2 x-keyed
  decomposition yield against a random factor base. The QTT x anomalous cell is already measured
  (report anomalous-qtt-20261104: no difference from ordinary curves at p <= 127).
disposition: open_next_step
next_action:
  step: >-
    Done 2026-11-04 (frozen protocols WEAKCLASS-20261104 and WEAKCLASS-I1-20261104; reports
    weakclass-20261104 and weakclass-i1-20261104). At p <= 2^14 all three numeric instruments are
    BLIND to anomalous, small-embedding-degree (k = 3-6) and j = 0 (zeta-stable factor base)
    curves, with valid controls: the character sum (after rerunning with a calibrated A/A gate),
    the m = 2 log-sumset yield, and the QTT complexity of the transfer matrix (p ~ 2^10). The I1 null
    of negation-closed random sets is calibrated on 90 fresh ordinary curves. Next: add the scope
    note "blind to Smart- and MOV-weak classes" to the rows whose NULLs rest on these instruments.
  discriminates: >-
    A NULL from these instruments excludes only structure of the statistic's own type, not an
    easy DLP. An instrument that detects a weak class would be the first with natural dynamic
    range. None does at these sizes.
best_measured: >-
  BLIND x 9 cells (3 instruments x 3 weak classes), controls valid, p <= 2^14
