id: LEAD-EXO-weak-class-instrument-calibration
family: exotic
title: 'Natural weak curve classes (anomalous, MNT small embedding degree, j = 0 with a stable factor
  base) as positive controls for the numeric structure instruments: a detect-or-blind table'
mechanism: 'Most null or exhausted structure rows rest on numeric instruments that have not been run on
  curves whose discrete logarithm is known to be easy. The one exception so far is QTT on anomalous curves,
  cited below. Synthetic planted signals (LEAD-EXO-methodology-instruments) test detection of a signal
  of the instrument''s own type, not sensitivity to real cryptanalytic weakness. This lead runs natural
  weak classes through each instrument: (A) anomalous, #E = p (Smart, polynomial time); (B) prime-order
  curves with embedding degree k in {3, 4, 6} (MOV, subexponential); (C) j = 0 with a zeta-stable factor
  base; and (D) ordinary prime-order curves as the reference. The instruments are (i) the digit-QTT rank
  of the decomposition transfer matrix (holant step b), (ii) the character-sum maximum against a negation-symmetric
  null (see report leads-round2-20261104, check D1), (iii) the low-degree evaluation rank with multipliers
  free of short relations (check D2), and (iv) the m = 2 x-keyed decomposition yield against a random
  factor base. The QTT x anomalous cell is already measured (report anomalous-qtt-20261104: no difference
  from ordinary curves at p <= 127).'
disposition: open_next_step
next_action:
  step: 'Done 2026-11-04 (WEAKCLASS-20261104, WEAKCLASS-I1-20261104, PAIRED-ANOMALY-20261104). No instrument
    detects anomalous or small-embedding-degree curves. With 36 curves per class the character sum shows
    no shift for them (p ~ 0.85) but detects the zeta-stable factor base of the j = 0 class (mean u 0.23,
    p < 1e-5), a factor-base symmetry effect. The paired-curve anomaly did not replicate (108 vs 108,
    p = 0.65), so the pairing baseline stands. Scope notes are added to the H-PSEUDO, holant and quadratic-phase
    rows. Remaining, optional: a larger-p calibration with a non-saturated QTT size, and natural weak
    classes for the sumset yield at more curves per class.'
  discriminates: An instrument that separates Smart- or MOV-weak classes from ordinary curves would be
    the first with natural dynamic range for DLP ease. None does at these sizes. Factor-base symmetry
    is detectable.
best_measured: no detection of anomalous / small-k curves (36 per class, p <= 2^14); zeta-stable FB detected
  by the character sum (p < 1e-5)
