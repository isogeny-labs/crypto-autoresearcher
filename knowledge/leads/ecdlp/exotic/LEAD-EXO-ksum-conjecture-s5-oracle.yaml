id: LEAD-EXO-ksum-conjecture-s5-oracle
family: exotic
title: 'Fine-grained obstruction: the prime-field S_5 / 4-SUM oracle on a pseudorandom implicit set
  under the k-SUM conjecture'
mechanism: 'Tier X on prime fields needs a 4-SUM oracle on S_B = {P : x(P) < p^(1/5)} running in
  time much less than sqrt(|S_B|). Measured nulls (coincidence harvest kappa_rel ~ 1, character-sum
  R ~ 1.3 flat) say S_B has no additive structure. Under the k-SUM conjecture, structureless k-SUM
  needs n^ceil(k/2). The one known escape, Chan-Lewenstein clustered 3SUM, needs the additive energy
  those measurements exclude. Distinct from LEAD-ICP-generic-table-decomposition, which measured
  and closed a concrete k-sum table; this row is the conjecture-level bound that would cover any
  such oracle.'
disposition: open_next_step
next_action:
  step: Write the reduction as a cost_model/literature obstruction, conditional on the k-SUM conjecture,
    citing the two measured nulls, and record the Kane-Lovett-Moran caveat (near-linear linear-decision-tree
    complexity, so no Shoup-style proof).
  discriminates: A clean reduction closes the whole free-S_5-oracle class at conjecture level in
    one row instead of per oracle. A gap in the reduction, such as S_B being only weakly pseudorandom
    or a non-k-SUM route to the relation, would name the exact property a new oracle must exploit.
