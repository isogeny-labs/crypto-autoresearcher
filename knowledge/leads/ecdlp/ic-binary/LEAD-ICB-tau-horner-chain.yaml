id: LEAD-ICB-tau-horner-chain
family: ic-binary
oracle_class: generic
oracle_class_note: "tau-Horner ordering gives a constant m! yield on the table chain (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  tau-Horner decomposition chain on Koblitz curves (R = tau^{m-1}P_1 + ... + P_m over one
  base)
mechanism: >-
  Decompose a target as a tau-adic Horner sum of base points, so ordered tuples become distinct
  relations: the claim is m! times the distinct-relation yield of the plain chain at unchanged
  descended shape, a constant m! saving on relation collection.
disposition: open_next_step
next_action:
  step: >-
    Run IDEA-20261018-f2cd4d: cost per distinct relation of the plain, symmetry-broken and
    tau-Horner chains at matched core size on toy Koblitz n in {17, 19, 23}, m in {2, 3},
    with a size-matched ordinary-curve null.
  discriminates: >-
    Horner cheaper per distinct relation than the symmetry-broken chain is a constant m! advance
    for the collection stage; equal cost means the Horner m! is the symmetry-breaking m! relabelled
    (accounting, not an improvement), and the lead closes.
