id: LEAD-ICB-composite-degree-c2pnb
family: ic-binary
title: >-
  Composite-degree ANSI X9.62 binary curves (c2pnb176/208/272/304/368): Gaudry-Diem n = 4
  with a pi_16 orbit base
mechanism: >-
  These curves live over F_{2^{16k}}, so an intermediate subfield exists: fixed-n Gaudry-Diem
  decomposition with double large primes has an exponent below rho. The question is whether
  the per-trial cost and memory let it beat matched rho at the deployed sizes.
disposition: open_next_step
next_action:
  step: >-
    Run the C1 toy ladder (NEXT-STEPS item 6): E over F_{2^4} lifted to F_{2^{4k}}, k in {5,
    7, 9, 11, 13}, about 2e4 decompositions, to pin c_trial, the solving degree and per-worker
    memory; pair it with the primitive-prime c2tnb null ladder (H-BINSTD-e241a8).
  discriminates: >-
    c_trial <= 2^27 at extrapolation keeps the mesh area-time win at c2pnb304w1 and c2pnb368w1,
    the first standardized binary row below rho under a memory-charged metric; c_trial > 2^27
    makes the lane dominated on every metric and closes it.
best_measured: >-
  Cost model only: time-only below rho on all five rows for c_trial in [2^15.5, 2^32.5]; loses
  under time x memory vs vOW on every row; mesh area-time win only at 304w1/368w1 for c_trial
  <= 2^27. The F_{2^16}-rational base is structurally empty in G.
