id: LEAD-ICB-frobenius-orbit-factor-base
family: ic-binary
title: >-
  Frobenius/endomorphism-invariant factor bases and orbit columns on Koblitz and subfield
  curves, beyond the trivial orbit saving
mechanism: >-
  A factor base closed under the q-power Frobenius (or a CM automorphism phi) folds every
  orbit into one column: relations needed drop by n and linear algebra by n^2. The hope was
  a second gain in the decomposition step itself, or a cheaper descended system, on top of
  the orbit fold. It is the incumbent structure of every Koblitz IC row on the leaderboard
  (compact-orbit base).
disposition: closed_obstructed
obstruction:
  kind: proof
  statement: >-
    For E/F_q attacked over F_{q^n}, the base {x(P) in V} is pi-stable exactly when V is sigma-stable,
    the stable subspaces form an arithmetic lattice fixed by the factorisation of X^n-1 over
    F_q, and the gain is exactly n on relations (n^2 on LA) and never more (H-FROB-6774fb
    supported, DEC-20260923-e6cd5d; the tau-factor-base pilot finds the per-attempt decomposition
    probability at matched |FB| equal to the birthday value for orbit-union, normal-basis
    and polynomial bases, n = 11..23). At prime n with ord_n(2) = n-1 (131, 163) the usable
    stable dimensions are empty (H-BINSTD-b1f016 replicated). Rho gets the matching sqrt(2n)
    from the same automorphisms, so the matched gap is unchanged. Prime-field phi-stable bases
    (EQIC) are bounded by the eigenvalue-subgroup order (at most 6) and measured +4% Ir at
    order 6 on j = 0. Scope: Koblitz/subfield curves over F_{2^n}, n prime, toy to n = 61
    measured; ECC2K-130 by structure.
  revisit_when: >-
    A Frobenius-stable base whose per-attempt decomposition probability exceeds the birthday
    value at matched |FB| (a second gain in the decomposition step), or a stable non-subspace
    base with membership degree far below its size (see LEAD-ICB-nonlinear-frob-stable-bases).
    Re-checked 2026-10-28 (fb-koblitz-orbit, local toy scale, n = 15 and 31, four resolved
    cells): the best Frobenius-stable subspace base beats the cost-model-picked non-stable base
    by D = 4.73 bits [3.44, 6.10] only through the orbit credit (log2 n = 3.91 and 4.95, an
    accounting identity); priced as a generic base D_nofold = 0.56 bits [-0.51, 1.52], interval
    contains 0. Consistent with the closure; nothing reopens it. Gap to matched rho (formula)
    stays 22.6..33.0 bits for the stable arm: distance remaining. Protocol frozen by timestamp
    only (stored hash matches no text we hold, body edited before any measured data).
best_measured: >-
  Compact-orbit IC / signed-Frobenius rho in counted S: 2.96x [2.55, 3.24] at n = 13 rising
  to 18.2x [15.7, 21.6] at n = 41; slope of ln(IC/rho) 0.165 [0.117, 0.213] per ln r (model
  1/6). Distance remaining, not a verdict.
