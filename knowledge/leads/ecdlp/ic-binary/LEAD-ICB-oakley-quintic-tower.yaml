id: LEAD-ICB-oakley-quintic-tower
family: ic-binary
oracle_class: algebraic
oracle_class_note: "Gaudry-Diem n = 5 subfield base solved by Groebner or SAT (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  Gaudry-Diem n = 5 point decomposition on the Oakley EC2N curves over F_{2^155} and F_{2^185}
mechanism: >-
  Both RFC 2409 groups are quintic extensions (155 = 5*31, 185 = 5*37), so the subfield base
  V = F_{2^p} gives a fixed-n = 5 decomposition whose cost is one q-independent Groebner constant
  K_5 plus a SAT arm priced at q^4.
disposition: open_next_step
next_action:
  step: >-
    Execute the approved Oakley ladder contracts (EXP-OAKLEY-2c0552, -4276c4, -7f73ef have
    trial plans and no runs): chained S_3 vs S_6 on identical instance bytes at n = 5, the
    SAT arm on E/F_{2^{5p}} with V = F_{2^p}, and the measured K_5; price both against the
    GHS genus-16 route at the same cells.
  discriminates: >-
    Direct n = 5 decomposition below the GHS price makes it the better route to the two Oakley
    groups; above it, the lane is dominated by the GHS transfer (transfer family) and closes.
best_measured: >-
  None measured. Formula only, other family: GHS genus-16 transfer prices +1.1 bits (group
  3) and +10.9 bits (group 4) of advantage after the 2026-10-11 correction.
