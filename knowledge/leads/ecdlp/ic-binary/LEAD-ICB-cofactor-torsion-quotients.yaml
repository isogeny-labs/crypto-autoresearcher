id: LEAD-ICB-cofactor-torsion-quotients
family: ic-binary
title: >-
  Spending the cofactor and 2-torsion of binary curves: quotient labels, k-tree filters, 2-torsion
  translation quotients of the factor base
mechanism: >-
  Use E -> E/2E -> E/4E coset labels on legs, homomorphic cofactor quotients or sum-compatible
  filters (Wagner k-tree) to prune decomposition candidates, or fold the factor base by 2-torsion
  translation.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    On ECC2K-130 gcd(4, l) = 1, so every full-translation homomorphic cofactor quotient reduces
    to the order-l projection rho already uses (Sylow coprimality). On the prime-order subgroup
    <P>, Theorem C excludes every nontrivial exact sum-compatible quotient/filter for M>=2.
    On the full group E(F_{2^n}), by contrast, the exact gain is bounded by the cofactor h and
    can attain 2 via trace or 4 via one halving; that full-group gain does not transfer to <P>.
    The corrected iota-stable classification (V_d = b^{1/4} F_{2^d}) empties the (subspace base,
    2-torsion quotient) cell on every prime-degree standardized curve, and the production
    2-torsion census adds 0 relations. FGHR solve symmetrisation is a separate engine constant.
  revisit_when: >-
    A curve with a large smooth cofactor, or a non-homomorphic sum-compatible filter with
    more than log2(cofactor) bits.
best_measured: '2-torsion census: 0 additional relations (improve-2 item 02).'
next_action:
  step: >-
    Execute the KN-OPEN-91d4f6 single-bucket-gain ladder on the prime-order subgroup and the
    full-group cofactor controls with matched SHA nulls and equal operation budgets. Measure
    max-bucket gain, not bucket-averaged agreement, and keep tree levels separate.
  discriminates: >-
    Unbounded subgroup gain advances a non-homomorphic approximate-filter branch. A universal
    characteristic-2 bound with degenerate cases classified can close that exact class. Null
    toy cells, the constant trace on the subgroup, or a full-group cofactor gain do not close it.
