id: LEAD-ICB-koblitz-setup-phase-cost
family: ic-binary
title: >-
  Cutting the reusable set-up of the one-target Koblitz pipeline (Table A), where 98.5-99.7%
  of S sits
mechanism: >-
  In Table A the target-independent set-up (pair table, relation rank, linear algebra) is
  98.5-99.7% of S and the descent at most 1.4%. Constant levers already measured outside the
  board (per-size K retune, production free relations, orbit fast path, cache-blocked pair-table
  build) attack exactly that phase. It cannot change the exponent, but every verified cut
  shrinks the distance to rho.
disposition: open_next_step
next_action:
  step: >-
    Port the S3 root-index build and the rank finder from the cryptanalysis n = 83 producers
    (experiments/koblitz-n83-indexbuild2-20261020, koblitz-n83-rankfinder-20261021) into the
    Rust `ic price` pipeline (estimated 3-5 days; rule v4 README, follow-ups), then re-run
    the rule-v4 paired panel on a host where the heavy-compute lock is honoured.
  discriminates: >-
    A paired cold ratio below 1 at >= 4 of 6 sizes is a Table A baseline improvement; no movement
    means the n = 83 levers are specific to the S3 pipeline's cost profile.
best_measured: >-
  Rule v4 (2026-10-24, 32 pairs a size, 16 held-out seeds): recipe v4/v3 cold 0.953 [0.904,
  0.998] at n57 (the only separated size), 0.963-1.013 elsewhere; verdict PARTIAL (1 of 6),
  a null result for the board. Production free relations are a net loss in this pipeline (cold
  +5-9%); K retune did not confirm on fresh seeds. cryptanalysis n = 83 ratchet: cold IC /
  tuned rho 3.92 (wall time, one host class).
