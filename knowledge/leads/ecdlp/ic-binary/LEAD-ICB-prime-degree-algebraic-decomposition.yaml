id: LEAD-ICB-prime-degree-algebraic-decomposition
family: ic-binary
title: >-
  Bounded-degree algebraic decomposition (Weil-descended S_{m+1} on subspace bases) at prime
  extension degree: ECC2K-130, NIST K/B, sect571
mechanism: >-
  The only non-generic oracle on binary curves restricts x_i to an F_2-subspace and solves
  the Weil-descended S_{m+1} system algebraically. Relation collection beats rho only if a
  failed attempt costs 2^{alpha l} with alpha < m/2 - 1, which needs refutation at a degree
  that does not grow with n. Engines (F4, closure, SAT) belong to the ic-engine family; this
  lead is the pipeline consequence for the standardized prime-degree curves.
disposition: open_blocked
next_action:
  step: >-
    Measure the F4 / degree-4 closure refutation degree at (m, l) = (4, 5) and (4, 6), and
    m = 5 with |V| = 8, plus the conversion K (rho steps per column touch) on the same host;
    price n = 131 in one unit.
  discriminates: >-
    Degree staying at 4 makes the modelled m = 4 price about +9.8 bits over rho at n = 131
    (median K), the closest any ECC2K-130 or sect571 route has come, and justifies an n =
    131 cost table; degree >= 5-6 puts it at +21 to +112 bits and closes the lane by measured
    scaling.
  blocked_by: >-
    Memory: (4,5), (4,6), (13,4) and (13,5) exceeded the 3 GB cap (msolve segfaults at 1.6-1.8
    GB RSS); the m = 5, |V| = 8, D = 4 cell (~112k columns) and the (15,5) degree-7 XL cell
    (110-120 GB) need a 32-128 GB host; no 131-bit rho walk exists to measure K at n = 131
    (IDEA-20261015-c6f017).
best_measured: >-
  F4 refutes at degree 4 through (11,4) and (15,5) where XL reads 5 to >= 7 (48/48 paired
  draws); modelled n = 131 m = 4 price +7.6 bits before K, +9.78 at median K 4.48 [3.96, 16.77]
  (model, not measurement); measured SAT/enumeration extrapolates 50-150 bits over budget.
