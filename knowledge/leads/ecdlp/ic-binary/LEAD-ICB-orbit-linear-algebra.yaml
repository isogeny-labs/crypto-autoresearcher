id: LEAD-ICB-orbit-linear-algebra
family: ic-binary
oracle_class: engineering
oracle_class_note: "linear algebra phase of the orbit-folded matrix, independent of the oracle (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  Linear algebra of the orbit-folded relation matrix (equivariant blocks, sparse filters,
  Wiedemann, CADO-style merge)
mechanism: >-
  Exploit the F_r[Z/n]-module structure of the Frobenius-folded relation matrix and sparse
  methods (filtering, block Wiedemann/Lanczos) to cut the linear-algebra phase.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    Linear algebra is 0.0-2.7% of S in every Table A-C row, so no LA speed-up moves the board:
    the CADO-style filter is 2.48-10.4x faster on the phase alone and 1.93x faster than CADO-NFS
    at 262,144 columns, sparse-cado in ic.pipeline spends 0.25-0.72x the LA wall at identical
    S. The ECC2K-130 F_r[Z/131] structure is exhausted by the orbit quotient (ord_131(r) =
    1 leaves only the lambda-eigenblock live). Scale reached: 262,144 columns.
  revisit_when: >-
    Factor bases of 10^6+ columns or a large-prime arm that makes linear algebra a material
    share of S.
best_measured: >-
  LA engine 10.40x [9.99, 11.06] at 262,144 columns (phase only); 0 rows of Tables A-C move.
