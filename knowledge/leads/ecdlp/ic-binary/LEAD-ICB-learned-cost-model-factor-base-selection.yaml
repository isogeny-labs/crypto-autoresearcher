id: LEAD-ICB-learned-cost-model-factor-base-selection
family: ic-binary
oracle_class: algebraic
oracle_class_note: "selects the subspace of the descended algebraic system (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  Learned (gated, log-linear) cost model that selects the factor-base subspace at fixed dimension
  on binary and Koblitz toy fields, and its transfer across curves
mechanism: >-
  Fit a log-linear model of per-relation cost on structural features of V (predicted exact
  yield, solving degree, trace and product-space statistics), gate it by the structural yield
  test (finite expected tuples), and pick the cheapest predicted base from a pool. Unlike the
  subspace-choice lead (named geometric properties vs a random base), the comparator here is
  the hand rule (lowest expected solving degree first), and the effect is a stage-level and
  small end-to-end cost reduction per relation, not a yield change.
disposition: open_next_step
next_action:
  step: >-
    Extend the frozen gated ridge beyond the measured range with the same protocol and nulls:
    l >= 6 and n >= 43 on Koblitz and ordinary binary curves, priced end to end (linear algebra,
    descent, verified logs) and against the matched rho band of AGENTS.md 5a, on the native
    ecbench isolab-eks route that confirmed n = 17 and 19 (K1, l = 3): next K1 n = 23 with 8 targets
    (frozen 2026-11-06, experiments/fb-cost-model-k1-n23-eks), giving the gap-to-rho slope over
    n = 17, 19, 23; then ordinary a2 = 1 curves (cofactor 2 at n = 21) and l = 4 natively.
  discriminates: >-
    A gain that is flat or growing in n and l after pricing the full solve is the first
    measured, scale-surviving improvement of the binary baseline from factor-base choice, and
    its gap to matched rho is then the distance remaining. A gain that shrinks with n, as the
    greedy and coset gains did (1.18x to 1.000x), places this lead with LEAD-ICB-factor-base-subspace-choice
    as exhausted_at_scale. Measured so far: end-to-end gain 0.93 bits [0.36, 1.48] at 9 cells, 47%
    of the stage gain; stage gain 1.82 bits at l <= 4, 1.13 at l = 5 (smaller with l). On ordinary
    curves the fresh-curve confirmation at l = 4 (n = 19, 23) gave only +0.43 [0.15, 0.74], NOT
    CONFIRMED against 0.5 x in-family (1.08): the hand rule already sits near the pool best there
    (regret 0.44 bits), so the headroom, not the model, is small. At l = 4 on ordinary curves the complete-DLP check
    (4 differing cells, n = 19) is a null with the sign reversed (-0.45 [-0.98, +0.04] bits at 0 GAE), so
    the end-to-end gain is shown at l = 3 only. These are small constants, not yet a trend in n.
best_measured: >-
  Stage: gated ridge vs gated hand rule 1.82 bits/relation [1.36, 2.26] (l <= 4, 13 cells),
  1.13 [0.45, 1.62] at l = 5; cross-curve (no refit, frozen) +1.84 [0.95, 2.68] on a2 = 1 Koblitz
  and +0.92 [0.54, 1.34] on ordinary curves, the latter NOT CONFIRMED on 16 fresh ordinary curves
  at l = 4 (+0.43 [0.15, 0.74] < 1.08 threshold); end to end 0.93 bits [0.36, 1.48] less counted
  cost per verified DLP (9 cells, toy n <= 41) and, on ordinary/K1 curves at n = 19, l = 3,
  log2(rule/ridge) = +1.49 [0.78, 2.20] at 0 GAE, +1.66 at 0.1 and 1 GAE (section 5a band holds).
  Gap to matched rho (ridge pick, n = 19, l = 3): 6.7 / 15.9 / 17.7 bits at 0 / 0.1 / 1 GAE.
  At l = 4 on ordinary curves the end-to-end gain is NOT shown (experiments/fb-cost-model-e2e-l4,
  complete DLPs, 4 cells where the picks differ, n = 19, 1 workload seed x 3 verified targets):
  log2(hand rule / ridge) = -0.45 [-0.98, +0.04] at 0 GAE and -0.19 [-0.73, +0.32] at 0.1 and 1 GAE
  (null, point estimate negative; the stage gain on those cells was +0.73 bits per relation, in 3 of
  4 cells the ridge pick needed more queries). Both picks stay above rho: ridge by 6.1 / 23.6 / 25.4
  bits at 0 / 0.1 / 1 GAE, hand rule by 5.6 / 23.4 / 25.2; rho < IC at every weight, the two IC picks
  not separated. So the end-to-end gain holds at l = 3 (ordinary/K1, n = 19) and Koblitz toy cells
  but not at l = 4 on ordinary curves; the n = 23 cells were dropped by the 150 s pilot rule and a
  second seed was not run. Native confirmation on isolab-eks (2026-11-05, experiments/fb-cost-model-curves-eks,
  ecbench ic.pipeline with explicit binary-subspace bases, K1 a2 = 1 Koblitz, l = 3, EKS Spot via the AWS bridge,
  frozen PROTOCOL_NATIVE.md, independently validated 2026-11-06 with VALIDATION.json, 160 of 160 replays
  reproduced on a second CPU): log2(S_rule / S_ridge) in counted complete-DLP cost, full section 5a band (F4
  word XORs charged at w), = +1.83 / +0.80 / +0.80 bits at n = 17 and +0.96 / +2.47 / +2.47 at n = 19 at
  0 / 0.1 / 1 GAE, every CI lower end above 0 (bitop/v1: +1.76, +1.58); CONFIRMED at both N, 4 targets x 5
  rounds each, 192 of 192 records verified. Ridge pick behind rho.signed_frobenius_strong by 1.8 / 14.8 / 17.7
  bits (n = 17) and 3.3 / 15.1 / 17.9 (n = 19); the producer's first "about 9 bits, identical across the band"
  was a pinned-calibration point and was corrected. Wall time not L2-certified, n = 19 targets 1-3 fresh draws.
  The size of R depends on how word XORs are priced; its sign does not. K1 has cofactor-2 prime order only at
  n = 17, 19, 23 below 37, so n = 23 is the next native point (frozen 2026-11-06).
  Toy scale; the EKS run carries ecbench replays, independent validator report and VALIDATION.json in place; not a speedup over rho.
