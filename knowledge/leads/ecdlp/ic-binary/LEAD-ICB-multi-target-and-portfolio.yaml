id: LEAD-ICB-multi-target-and-portfolio
family: ic-binary
title: >-
  Batch IC and IC/rho portfolios: amortising the set-up over many targets, restart portfolios
mechanism: >-
  IC pays its set-up once, so per-target cost after set-up falls as 1/L while batch rho falls
  as 1/sqrt(L); a restart portfolio of IC and rho could exploit heavy tails.
disposition: open_next_step
obstruction:
  kind: theorem
  statement: >-
    The multi-instance generic bound (L logarithms cost >~ sqrt(L r/|Aut|)) covers generic-oracle
    IC including its set-up, and batch rho (Kuhn-Struik) attains it; the L^-1 amortisation
    applies only to the online part after a set-up that obeys the same bound. A restart portfolio
    IC + rho cannot beat pure rho when IC cost is concentrated at a floor ratio >= 1 (H-BINSTD-32867d
    supported). The four-target union column is a rare-event linearisation, not a batch speed-up.
    Measured: Table C (32 targets) stays 3.62-14.9x above batch rho.
  revisit_when: >-
    A non-generic oracle (then amortisation matters), or IC attempt costs that are heavy-tailed
    with median within about two orders of magnitude of rho.
best_measured: >-
  Table C per target, 32 targets: 3.62x (n41) to 14.9x (n19) above batch rho (reference from
  a different session, S20, at the canonical step).
next_action: {from_revisit_when: true}
