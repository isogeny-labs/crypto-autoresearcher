id: LEAD-ICB-factor-base-subspace-choice
family: ic-binary
title: >-
  Choice of the factor-base subspace V at fixed dimension (geometric progression, dim(V.V),
  trace rank, cosets, greedy coverage, HW pools, trace-parity window)
mechanism: >-
  Pick V so that the descended system is sparser (small product space V.V, low trace rank)
  or so that coverage of targets is higher (greedy, cosets, Hamming-weight pools), lowering
  cost per relation at the same |F|.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    Measured with nulls up to n = 41 and r = 2^39: greedy coverage 1.18x at r = 2^13 shrinking
    to 1.0000 at r = 2^39; coset/random 1.020 [0.959, 1.083]; geometric-progression vs random
    at matched dim(V.V) weakened and replicated (EV-BINSTD-78ca0d, EV-BINSTD-b176df); repeated
    Spearman catalog tests of dim(V.V) or trace rank against N_var inconclusive (distinct-value
    floors not met); normal-basis vs polynomial-basis HW pools give no yield change at n =
    17 (scoped support of H1). The Weil bound is vacuous for abscissa density at every IC
    dimension l <= 66 at n = 131. All effects are constants that vanish with size.
  revisit_when: >-
    A property of V that predicts N_var or yield with a null-controlled effect that grows
    with n at n >= 31.
best_measured: >-
  Greedy base 1.18x fewer expected trials at r = 2^13, 1.000x at r = 2^39; coset/random 1.020
  [0.959, 1.083].
