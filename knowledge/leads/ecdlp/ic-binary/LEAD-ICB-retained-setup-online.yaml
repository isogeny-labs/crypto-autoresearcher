id: LEAD-ICB-retained-setup-online
family: ic-binary
oracle_class: generic
oracle_class_note: "online descent against a retained table (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  Retained-setup online IC on Koblitz curves (n = 61, 71, 73, 83): online ratio after an uncharged
  precomputation
mechanism: >-
  Precompute the factor-base table and relation logs once, then answer each new target with
  the descent only. Online-only ratios against rho looked large (13.9x at n61, 18.5x and 54.1x
  at N83).
disposition: closed_dominated
obstruction:
  kind: measured
  statement: >-
    Dominated by Bernstein-Lange preprocessing rho (generic family): at equal or smaller advice
    it is 53-317x faster online than IC at n61, and precomputed-table rho wins every matched
    N83 pair (K3300: 3.74x time-matched, 40.6x memory-matched; K600: 81.5-215x time-matched,
    396x memory-matched). The published online wins used rho with an empty distinguished-point
    table; the validation sweep (2026-10-20, sweep-B rows 104.1, 108.1, 110.1) marked them
    contradicted. Theorem side: the IC table sits 2^25-2^27 above the CGK S*T^2 line that
    preprocessing rho attains.
  revisit_when: >-
    An online IC whose S*T^2 lies at or below r/|Aut| (a non-generic oracle), or advice shared
    across many curves that preprocessing rho cannot share.
best_measured: >-
  None admitted: every online IC/rho win is superseded; precomputed rho / IC online is 3.74x-396x
  in rho's favour at N83.
evidence:
