id: LEAD-ICB-cofactor-projected-ladder-base
family: ic-binary
title: >-
  Cofactor-projected factor base ([h]P into the prime-order subgroup) on the random-binary
  ladder rows with cofactor h > 1
mechanism: >-
  The random-binary ladder rows build the factor base from raw curve points with no projection
  into the prime-order subgroup, so a fraction 1 - 1/h of every negation-folded pair table can
  never match a subgroup target (measured class-zero fraction 0.50, 0.50, 0.17 at h = 2, 2, 6).
  Replacing each base point P by [h]P (arm B) keeps the oracle, the table and the walk
  untouched and raises the exact yield ceiling by about h. Arm C (subgroup-only base chosen by a
  trace or order test) is dominated by B at h = 6, 8 because its [r]P test is charged.
disposition: open_next_step
next_action:
  step: >-
    Land the three primary rows through the validation gate (independent replay certificate on a
    second host, validator report recomputing S, the paired ratios and the section 5a band, and a
    VALIDATION.json naming the matched negation rho), then measure the m = 3 rows on the projected
    base with the --base-arms option already in place.
  discriminates: >-
    The gate decides whether the 1.29x, 1.58x and 3.36x rows may enter the leaderboard as Table B
    recipes. The m = 3 rows decide whether the same h-fold yield ceiling lifts three-summand
    probes, which would extend the gain beyond the m = 2 ladder.
best_measured: >-
  S(A')/S(B) = 1.29 (1.12, 1.52) at f2m15 (h = 2), 1.58 (1.35, 1.82) at f2m21 (h = 2),
  3.36 (2.80, 4.02) at f2m27 (h = 6), paired per repeat, twenty repeats, 95 percent bootstrap;
  class engineering; B stays 6.1x, 11.5x and 14.4x above the matched rho (distance remaining).
