id: LEAD-ICB-ecc2k130-jacobian-carrier
family: ic-binary
title: >-
  ECC2K-130 via a Jacobian carrying the trace-zero abelian variety A (Torelli rarity heuristic)
mechanism: >-
  If the 130-dimensional trace-zero part A of Res(E) were isogenous to an evaluable Jacobian
  of genus 130-300, plane/hyperelliptic IC there would cost about 2^37.2, 23.6 bits below
  rho. The closure rests on a codimension heuristic (8,128), not a theorem. Shares scope with
  the transfer family.
disposition: open_next_step
next_action:
  step: >-
    Run the toy ladder at the first faithful rungs n = 11 and n = 13 (2 primitive mod n, A
    simple, no small magic number), sampling curves of genus dim A to dim A + 2 over F_2 and
    testing whether the target polynomial divides P_C.
  discriminates: >-
    Carriers at genus <= dim A + 2 on a faithful rung reopen a constructive search toward
    n = 131; none confirms rarity where Weil-restriction structure is absent, closing the
    route with data rather than a dimension count.
best_measured: >-
  n = 5: no carrier through genus 8 (heuristic predicts ~0.42 classes, low power); n = 7:
  1,536 genus-7 hyperelliptic carriers (mass 0.5), from Weil-restriction structure that n
  = 131 lacks.
