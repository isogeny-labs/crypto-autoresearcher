id: LEAD-ICB-frobenius-search-symmetry
family: ic-binary
title: >-
  Frobenius as a symmetry of the decomposition search: orbit CNF encodings, conjugate attempts,
  equivariant elimination
mechanism: >-
  Use x -> x^2 (or tau) as a symmetry inside one decomposition search: symmetry-breaking clauses,
  orbit-quotient encodings, treating the n conjugates of a target as one attempt, or Faugere-Svartz
  character blocks in F4, to divide per-attempt cost by up to n.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    The absolute Frobenius is an equivariance between conjugate target instances, not a per-instance
    search symmetry (H-BINSTD-74b002 supported, replicated); fixed-target tau-orbit CNF clauses
    are unsound (H-BINSTD-c3d68f, replicated); sound orbit encodings cost >= 0.95x the plain
    single-instance search at n = 17, 23, 31; on a non-stable V the n conjugates of a target
    are n attempts over n conjugate bases (Proposition T); the k conjugates of a relation
    are one row in the orbit basis. Equivariant elimination is a constant only: 44-73x against
    a naive kernel is 2-3x against gf2_elim; whole-oracle 5.1x/15.5x at n = 11/13, of which
    fall-row augmentation alone gives 11.6x, and it does not apply to the production pipeline
    systems (regresses 0.29-0.59x there).
  revisit_when: >-
    A genuine stabilizer of a single target R in the descended system (not a conjugation),
    or an equivariant elimination that applies to the production compact-orbit pipeline.
best_measured: >-
  Equivariant oracle TRADES: 15.5x [15.1, 15.9] whole-oracle CPU at n = 13 (equivariance adds
  1.34x over fall-row augmentation); not applicable in production.
next_action: {from_revisit_when: true}
