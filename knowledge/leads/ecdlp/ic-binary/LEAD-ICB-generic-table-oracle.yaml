id: LEAD-ICB-generic-table-oracle
family: ic-binary
title: >-
  Generic decomposition oracles for Koblitz IC: pair tables, compact-orbit 4-sum, MITM and
  enumeration, cap-locus arity, known-log pools
mechanism: >-
  Decide whether a target is an m-sum of factor-base points by table lookup, pair tables or
  meet-in-the-middle, collect relations, solve the orbit-folded matrix and descend. This is
  the production pipeline behind every Table A and Table C row; engineering it (K, arity,
  table layout) is how the baseline has improved.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Every oracle built from group operations and membership tests makes IC a generic-group
    algorithm with advice: Shoup T >= sqrt(r/|Aut|) and Corrigan-Gibbs-Kogan S*T^2 >~ r/|Aut|
    apply, so with |Aut| = 2n no 4-, 5- or 6-sum table can beat sqrt(r/2n) in total work;
    the balanced generic-IC cost is ~ r^{2/3}/n^{4/3} against rho r^{1/2}. Measured: rungs
    sit 2^25-2^27 above the generic line; ln(IC/rho) grows 0.165 [0.117, 0.213] per ln r.
    Target-dependent and walk-carried bases are known-log pools (H-BINSTD-1447cf). At ECC2K-130
    this route needs K* ~ 4e11 columns and ~8e9 core-years. Scope: all binary and Koblitz
    curves, one target, setup charged.
  revisit_when: >-
    An oracle that is not generic (algebraic restriction on the unknowns with membership degree
    far below |F|), which is LEAD-ICB-prime-degree-algebraic-decomposition; constant-factor
    engineering of this pipeline remains valid baseline work (LEAD-ICB-koblitz-setup-phase-cost).
best_measured: >-
  Table A one-target S_IC/S_rho 5.23x (n47) to 21.0x (n61) as published; 9.13x to 41.1x against
  rho at the canonical step (validation sweep A). Frontier campaign: compact orbit 3.8-15x
  signed-Frobenius rho at w = 0.
