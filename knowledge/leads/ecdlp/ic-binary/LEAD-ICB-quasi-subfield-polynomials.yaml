id: LEAD-ICB-quasi-subfield-polynomials
family: ic-binary
title: >-
  Quasi-subfield-polynomial factor bases (Huang-Kosters-Petit-Yeo-Yun; Euler-Petit) at prime
  extension degree, ECC2K-130
mechanism: >-
  Roots of X^{2^{n0}} - lambda(X) with small deg lambda give a subspace-like base without
  an intermediate field, so the summation system could keep low degree at prime n where Frobenius-stable
  subspaces do not exist.
disposition: open_next_step
obstruction:
  kind: theorem
  statement: >-
    Euler-Petit Theorem 1: every linearized QSP has beta >= 3/4, so under the HKPYY cost model
    the exponent is >= 0.93, i.e. >= 2^122 at n = 131 against rho 2^60.9; for F_2-coefficient
    lambda only X^2 + X (n0 = 1) and L_Phi131 (n0 = 130) exist at n = 131 (Prop. 2), and multiplicative
    QSPs give |V| = 264 or p + 1, beta >= 1.02. The crypto census also shows Lemma 4.1 tight
    (the n mod n0 term cannot be removed; witnesses at n = 7). Measured at toy n = 31, k =
    15: QSP bases yield 0.214 against 0.204-0.230 for random subspaces (no gain).
  revisit_when: >-
    A non-linearized or correspondence-defined QSP family (IDEA-20260916-a17f43) whose root
    count escapes the Frobenius-injection bound, or an exhaustive search past n = 47 finding
    log2(deg lambda) < n0^2/n at prime n.
best_measured: >-
  Toy n = 31: QSP-base relation yield 0.214 vs random 0.204-0.230 (no improvement); n = 131
  cost model >= 2^122.
next_action: {from_revisit_when: true}
