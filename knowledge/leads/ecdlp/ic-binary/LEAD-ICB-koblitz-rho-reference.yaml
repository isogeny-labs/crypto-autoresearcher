id: LEAD-ICB-koblitz-rho-reference
family: ic-binary
title: >-
  The matched Koblitz rho reference for binary IC rows: step pricing, signed-Frobenius canonicalisation,
  a 131-bit walk
mechanism: >-
  Every gap in this family divides by a rho reference. Table A divides by rho as built (32
  lanes, 9.7-11.8 units a step) while the canonical step costs 4.6-5.4 and the IC arm gets
  the 1,024-lane batched unit; normal-basis canonicalisation makes signed-Frobenius rho 4.1x
  cheaper (cryptanalysis); and no 131-bit walk exists, so no ECC2K-130 lane has a matched
  rho. Strengthening the reference is accounting, not an IC improvement, but it fixes the
  distance remaining.
disposition: open_next_step
next_action:
  step: >-
    Run the strong rho fixture and ParallelRho on the same Table A targets in the same process
    and price the stronger one at the canonical step (the rule-v4 validator found the strong
    fixture needs 0.845 +- 0.08 of ParallelRho's steps, and admissibility failed at 4 of 6
    sizes); then build the 131-bit signed-Frobenius walk.
  discriminates: >-
    Settles strongest_available for Table A's rho_reference (the only missing piece of a VALIDATION.json
    for rule v4); a stronger reference widens the gap.
best_measured: >-
  Rule v4, rho at the canonical step in the same process: IC/rho 9.9x (n47) to 43.5x (n61),
  1.76-1.94x the as-built gap Table A shows; section 5a band 17.9-65.7. Not validated: strongest_available
  unresolved.
