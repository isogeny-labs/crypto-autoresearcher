id: LEAD-ICB-nonlinear-frob-stable-bases
family: ic-binary
title: >-
  Non-subspace Frobenius-stable factor bases at prime n: trace-spectrum, Hamming ball, multiplicative
  subgroup, tau-adic, algebraic-group (Couveignes-Lercier) points
mechanism: >-
  Prime n with 2 primitive leaves no Frobenius-stable F_2-subspace of useful dimension, but
  non-linear stable sets exist: V_E = {x : Tr(x^e) = 0, e in E}, Hamming balls in a normal
  basis, multiplicative subgroups x^d = 1, tau-adic patterns over an orbit-union base, and
  F_2-rational points of low-dimensional algebraic groups or Jacobians. If one keeps the n-fold
  orbit gain with a membership system no costlier than a subspace, it restores the Koblitz
  lever at n = 131.
disposition: open_next_step
next_action:
  step: >-
    Trace-spectrum V_E is closed (10-12x, 2026-10-28). The Hamming ball B_3 replication
    (experiments/fb-koblitz-hamming, 2026-10-29, T = 16 per workload, 8 matched random subspaces)
    is not decided under this rule, pointing below the band. The stability-vs-sparsity test
    (experiments/fb-koblitz-hamming-v2, 2026-10-29, T = 32, w = 2..4) found per-attempt cost
    unaffected by stability (normal vs random-basis ball D = +0.20 bits, hierarchical CI
    [-0.05, +0.45]; gated verdict inconclusive, null gate failed) but exact relation yield P_sys
    higher for the stable ball in all 8 units at w = 2 (x1.76, 48 bases per class). Next: a
    frozen run with 20+ normal and 20+ random bases per class at w = 2 (n = 17, 19), cost per
    relation (conflicts / P_sys) as the pre-stated primary; then a solver cost run at
    intermediate n (41-47), where only encoding size is known. A conflict price at n = 131
    is not measured. In parallel finish the dimension-5/6 Weil-polynomial census over F_2
    for 131 | #A (H-FROB-ff99bf hit an impediment at dims 5-6; H-BINSTD-944a66 has preliminary
    support) and read the Couveignes-Lercier primary source.
  discriminates: >-
    If non-stable (polynomial-basis, random-basis) balls of the same weight are as cheap as the
    normal-basis ball, the saving is sparsity, not Frobenius stability, and it carries no n-fold
    orbit gain, so the Koblitz lever is not restored. If only the stable ball is cheap and the
    cost stays within [0.5, 2] of (or below) the subspace arm at larger n, the n-fold gain at
    prime n is kept and justifies an n = 131 price; cost above 2x closes the non-linear stable
    lane. A census with no dimension-5/6 abelian variety having 131 | #A closes the
    Couveignes-Lercier route at g <= 6.
best_measured: >-
  Matched-|F| per-attempt cost (CryptoMiniSat conflicts substituting for WDSat; local toy scale,
  2026-10-28/29): trace-spectrum V_E costs R = 10.2 [8.6, 11.8] (RC-1, n = 17), 11.6 [8.3, 15.4]
  (Koblitz n = 19) and 12.5 [10.7, 14.4] (Koblitz n = 17, a2 = 1) times a random subspace, above
  the 2x band, so the trace-spectrum branch closes by this lead's rule. Hamming ball B_3 against
  the mean of 8 matched random subspaces (fb-koblitz-hamming, T = 16 per workload, W1): R = 0.27
  [0.13, 0.46] and 0.32 [0.14, 0.55] at n = 19 (Koblitz a2 = 0, 1), 0.43 [0.20, 0.76] (RC-1) and
  0.29 [0.11, 0.54] (Koblitz a2 = 1) at n = 17; pooled post hoc T = 32: 0.27-0.39 at n = 19. Point
  estimates are 0.20-0.52 in all 8 measurements, i.e. below the [0.5, 2] band, but the interval
  excludes 0.5 in only 3 of 8, so the verdict is NOT DECIDED under the lead's rule, pointing
  below the band (the earlier n = 19 value 1.10 came from a single noisy subspace denominator).
  The saving sits in the satisfiable stratum (SAT targets about 5x cheaper, UNSAT targets the
  same cost); stability and sparsity are confounded (only the normal-basis B_3 was run; a second
  normal basis gave 3 of 4 cells consistent, RC-1 differing 2.9x). Separated in fb-koblitz-hamming-v2:
  per-attempt cost is a sparsity effect (random-basis balls R = 0.22-0.40), but the stable ball's
  exact yield is higher at w = 2 (x1.76 in 8 of 8 units), so a per-relation stability benefit
  (-0.66 bits at w = 2, post hoc, unit CI [-1.10, -0.24]) is open. Planted +2.5-4x extra cost is
  detected. Encoding size at n = 131 (no solver price): |B_6| = 2^32.6; Sinz counter 780 aux
  variables and 1,684 clauses per block, totalizer 485 and 1,817, against 98 native XORs for a
  33-dimensional subspace; under 10% variables over the m = 2 core, so size is no obstacle. This
  is a per-attempt ratio only: no orbit credit applied, no complete-DLP, no rho comparison, not
  an improvement over the index-calculus baseline. Earlier: cyclotomic-sparse bases yield-neutral
  at n = 23 (effects -0.49%..+0.65%, positive control p = 0.001), cost ratio 0.88-1.12 vs
  compact; orbit-union buys exactly log2(n) bits (7.03 at n = 131); tau-adic base is a
  Gamma_w-orbit quotient that reaches rho only at w >= 13.
