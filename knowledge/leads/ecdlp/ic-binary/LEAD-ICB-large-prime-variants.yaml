id: LEAD-ICB-large-prime-variants
family: ic-binary
title: >-
  Single and double large-prime relation collection for binary and Koblitz IC (free-leg, GTTD
  on subspace bases)
mechanism: >-
  Accept decompositions with one or two points outside the base and combine partial relations
  through cycles in a large-prime graph, trading more linear algebra for fewer full decompositions;
  in the Gaudry-Theriault-Thome-Diem setting it lowers the exponent to q^{2-2/n}. On prime-degree
  binary subspace bases the free-leg form is a birthday search in the large base.
disposition: open_next_step
next_action:
  step: >-
    Combine the double-large-prime collector with the aimed m = 3 collection of the Table A/C
    recipe (the 7.03x and 11.5x rows at n = 53 and 61, in their own unit), the one place a large-prime
    gain could move a leaderboard row; the plain-pipeline measurement of 2026-10-29 (best_measured)
    is a component result only. Separately, Stage 0 of EXP-BINSTD-e066d8 (zero-compute arithmetic of
    the KN-FIND-aa2efc free-oracle floors) is still unrun.
  discriminates: >-
    A paired counted-S ratio below 1 against the aimed recipe at equal envelope, holding across the
    section 5a band, is a constant advance on a leaderboard recipe; a ratio at or above 1, or one that
    loses at weight 1, closes the large-prime line for the Koblitz compact-orbit pipeline.
best_measured: >-
  UNQUALIFIED source observations quoted from crypto PR #2850, source 83c289cd14df49507e9e97bed61d8158d3521515.
  This atlas entry is not an independently qualified speedup or attack-cost claim;
  a matching claims/*.json record and its required independent verification remain needed.
  Classic compact-orbit m = 3 Frobenius pair-table pipeline, ecbench counted S, 2026-10-29 (crypto
  PR #2850, 612 replays reproduced). n = 53: best plain table 6.38 (440 columns), best two-large-prime arm
  3.86 (lp2-k40-c10), paired 0.604 [0.599, 0.610] over 16 workloads, 0.604 / 0.635 / 0.730 at weights
  0 / 0.1 / 1. n = 61: best plain 7.62 (880 columns), lp2-k60-c10 4.26, paired 0.559 [0.535, 0.578] over 3
  workloads, 0.559 / 0.623 / 0.831. One large prime is worse than plain (1.47 to 1.73x). Rho stays
  ahead at every weight (arm over rho 30 to 35 at n = 53, 47 to 64 at n = 61). Constant, not exponent;
  other 2LP arms lose at weight 1.
