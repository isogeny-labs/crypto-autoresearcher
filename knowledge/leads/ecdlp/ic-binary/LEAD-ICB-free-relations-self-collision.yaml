id: LEAD-ICB-free-relations-self-collision
family: ic-binary
title: Free relations from self-collisions in the pair-root table (no-probe relations)
mechanism: >-
  Two pair-states of the compact-orbit table with the same canonical root abscissa are a four-term
  relation among factor-base points, found by one sort of an existing table; the prediction
  was ~11,000 relations at n61/K600 and a free rank stage.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    The relations exist but are highly correlated: homogeneous rank 49 from 588 verified rows
    at n61/K600, 746 at K1200, 1,197 at K1500, and 6 at n83/K600; rank grows about K^4, so
    a free rank stage needs K ~ 1,500-2,050 at n61 and ~2,600 at n83 (36 GB), where scan plus
    K^2 linear algebra exceed the guided rank stage. In production (n <= 63, default on) it
    is a constant 0.957-0.960x of the complete solve; the 2-torsion census adds 0 relations.
    Scale reached: n = 41-83, K <= 1,500.
  revisit_when: >-
    A wide-path (n > 63) harvest is implemented, or a table structure yields independent rows
    faster than K^4.
best_measured: >-
  Production free relations 0.960x [0.946, 0.976] pooled counted (n = 41, 53, 61); 49 independent
  free relations at n61/K600 (8.2% of the 599 needed). Rule v4 (2026-10-24): in the `ic price`
  pair-table pipeline the harvest is correct (6,187 relations, 0 rejected) but a net loss,
  cold +5-9% at every size.
