- repo: crypto-autoresearcher
  path: knowledge/literature/KN-LIT-caa51d.md
  note: >-
    openai/math ETH disproof (#k-SAT in 2^{n/(log n)^{1/2+o(1)}}, unverified) does not meet
    revisit_when: with N = omega(l sqrt(log l)) CNF variables (Tseitin multiplications,
    Theta(l^2)) its exponent outgrows m*l, so it loses to enumeration at every l; no
    constant-locality structure in descended summation polynomials
- repo: crypto
  path: research/ic_prime_eth_leads_20261031/leads/L01/raw/slopes.json
  note: >-
    L01 char-2 Fourier gadget as a WDSat encoding (finished l = 5..7 runs): gadget slope about 2.58
    bits of conflicts per window bit against the ladder bar 0.5 (m = 3) and 3.16 [2.95, 3.44] for
    the standard encoding; conflict ratio gadget/standard about 1.2 at l = 7 with CPU 3x worse. The
    earlier ratio fall fits a constant padding floor (about 11k conflicts), not a slope change:
    constant_only, no gain. The census constants (0.026..0.074 of 1100n) count XOR-layer wires only
    and omit about 48k internal ANDs at n = 131; they must be restated before use.
- repo: crypto
  path: research/ic_prime_eth_leads_20261031/leads/L11/analysis.md
  note: >-
    L11 prime multiplier encodings in pure CDCL: propagation-complete (pc) against schoolbook,
    paired geometric-mean ratio of median conflicts 0.78 [0.67, 0.92] at b = 9 only (one prime,
    reverses at b = 6 where pc is 1.15x worse, b >= 12 cap-saturated, Karatsuba tested at one
    recursion level). A weak provisional preference; no slope measured.
- repo: crypto
  path: research/ic_prime_eth_leads_20261031/leads/L09/table2.json
  note: >-
    L09 BTN census tool and table (harness constant; yardstick downgraded, see LEAD-EXO-hashed-
    factor-base-tensor-ecdl).
- repo: crypto-autoresearcher
  path: docs/reports/ic-prime-eth-leads-20261102/rebuild_IcTensorRoute_20261102.txt
  note: >-
    Lean rebuild log (IcTensorRoute.lean, rebuilt 2026-11-02, standard axioms, no sorry). Covers only
    the stated cost-model arithmetic: the ladder rule, solver-saving floor and E(m) balance are
    necessary conditions for the relation phase; E(m) itself is a hypothesis and PrimePdpEncoding
    rho_floor was not rebuilt.
