id: LEAD-ICB-decomposition-encoding-and-sat
family: ic-binary
title: >-
  Decomposition-oracle encodings and SAT/enumeration solving of binary PDP: SAT/XOR, Karabina,
  S_m symmetrisation, chained vs direct S_4, Nagao, basis and reduction-polynomial choice,
  trace replay
mechanism: >-
  Re-present the point-decomposition system (symmetric coordinates, chained S_3 vs direct
  S_4, Nagao cosets, normal vs polynomial basis, field polynomial) and solve it with SAT/XOR
  or enumeration, hoping the per-attempt cost grows slower than exhaustive search.
disposition: open_next_step
obstruction:
  kind: measured
  statement: >-
    Every SAT or enumeration method measured has per-attempt UNSAT cost 2^{alpha l} with alpha
    ~ m (WDSat 2.9985 bits per unit l at m = 3, reproducing 2^{3l}/3!; alpha 4.09-4.33 at
    m = 4, l = 3..5), while beating rho needs alpha < m/2 - 1; at m = 3, 4 the measured families
    extrapolate 50-150 bits above budget at n = 131. Ladders n = 11..31: no arm grows slower
    than the enumeration floor (m = 3 slopes 0.53-0.58 vs floor 0.21; m = 4 wide chain 0.805
    vs 0.333). Encoding levers are constants: S_m symmetrisation saturates product spaces
    at m >= 5 at balanced l (H-BINSTD-770ec3 supported), closure outcomes are basis-invariant
    (Proposition B), reduction-polynomial weight is a constant confound, Nagao coset yield
    weakened vs chained S_3, trace replay is a constant at most.
  revisit_when: >-
    A solver or presentation whose UNSAT cost grows by fewer than m/2 - 1 bits per unit l
    at m >= 3 (then it becomes LEAD-ICB-prime-degree-algebraic-decomposition).
best_measured: >-
  Cheapest m = 3 arm / enumeration floor 3.0e2 (n = 13) to 3.8e4 (n = 31); m = 4 wide chain
  / floor 5.5e2 (n = 11) to 3.1e4 (n = 23).
next_action: {from_revisit_when: true}
