id: LEAD-RHO-dp-multitarget-precomputation
family: generic
title: >-
  Distinguished points, multi-target batching and Bernstein-Lange precomputation (incumbent
  controls)
mechanism: >-
  van Oorschot-Wiener DPs give linear parallel speedup with small memory; solving L targets
  with a shared DP table costs ~sqrt(2Ln); a precomputed table of ~l^{1/3} DPs gives l^{1/3}
  online cost. These are the incumbents every 'advice' or batch comparison must beat.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Known (KR-RHO-6239aa, KR-RHO-7d93f6, KR-RHO-46c2c6, KR-RHO-ea34b8) and reproduced as controls:
    at equal or smaller advice Bernstein-Lange rho solves a fresh Koblitz target 50-500x faster
    online than compact-orbit IC at n = 41, 53, 61 (09-equal-advice); precomputed rho is faster
    in every matched N83 pair (3.74x-395x); lazy DP test 0.998 [0.995, 1.001]; Kuhn-Struik
    is the repository's multi-target margin rule. T^2 S = Theta(C^2 N) bounds many-collision
    tradeoffs.
  revisit_when: >-
    A table or batch scheme that beats the Bernstein-Lange l^{1/3}/l^{2/3} tradeoff or the
    sqrt(2Ln) batch law (variants are LEAD-RHO-advice-table-variants).
best_measured: >-
  BL rho 50-500x faster online than IC at equal advice (n = 41-61); precomputed rho beats
  IC in every N83 matched pair
