id: LEAD-RHO-non-automorphism-equivalence
family: generic
title: 'Equivalence classes larger than Aut(E): quotients by subgroups H of (Z/N)^*'
mechanism: >-
  Rho could walk on classes {[h]P : h in H} for a subgroup H of (Z/N)^* larger than the automorphism
  group. The gain would be sqrt(|H|) if a class representative (or an H-invariant of the encoding)
  were cheap; for scalar multipliers that are not automorphisms every canonicalisation costs
  a scalar multiplication.
disposition: open_unexamined
next_action:
  step: >-
    Prove or refute H-EWALK-29cb90's per-step canonicalisation bound: show that for h = |H|
    > 6 on ordinary prime-field curves any canonicaliser costs Omega(log h) group operations
    per step (charged gain <= 1), and search the encoding for a non-constant H-invariant at
    h ~ N^{1/3} on toy curves (exhaustive at N < 2^20).
  discriminates: >-
    A cost bound closes the lead as closed_obstructed (cost_model); a cheap invariant at any
    h > 6 would be a new constant-or-better lead and a non-generic structure worth a full
    experiment.
