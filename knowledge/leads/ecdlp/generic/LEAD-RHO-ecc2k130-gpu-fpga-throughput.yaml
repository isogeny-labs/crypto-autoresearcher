id: LEAD-RHO-ecc2k130-gpu-fpga-throughput
family: generic
title: >-
  ECC2K-130 kernel throughput on GPU and FPGA (iterations per second per device and per watt)
mechanism: >-
  At fixed iterations, solve cost is set by updates per second: bitsliced normal-basis arithmetic,
  native carry-less products, batch inversion geometry, shared-memory sigma tables. FPGAs
  lay the same bit operations out in space.
disposition: open_next_step
next_action:
  step: >-
    Build and pair TABLE_PHASE_POPC (phase via popc planes, CHEAPER-SELECTION.md) against
    the 15.88 B/s sigma-table control on one RTX PRO 6000, with identical sorted DP corpora
    and the 300-report re-walk gate.
  discriminates: >-
    A promoted gain moves the ALU-bound kernel (91% ALU busy, speed of light 27.4 B/s for
    its CLMADs) toward the 26 B/s goal; a null with the ALU pipe saturated leaves only logic-instruction
    cuts and FPGA as levers.
best_measured: >-
  15.884 B updates/s per RTX PRO 6000 (sigma-table, paired 1.0239 vs 15.514); G7 RTX PRO 4500
  12.50 B/s; FPGA VU47P estimated 5-12 B/s, level per solve, 2-5x per watt
