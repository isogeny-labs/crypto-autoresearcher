id: LEAD-RHO-automorphism-class-walks
family: generic
title: 'Rho on automorphism/Frobenius orbits: sqrt(2m) on Koblitz, order-4/6 maps on j=1728/j=0'
mechanism: >-
  An efficiently computable automorphism group of order A lets rho walk on orbits and divides
  the expected steps by sqrt(A): signed Frobenius on Koblitz curves (A = 2m), GLV automorphisms
  of order 4 or 6 on j=1728 and j=0 prime curves. The cost is a per-step canonicalisation.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Known (KR-RHO-037e22, KR-RHO-482ed3, KR-RHO-0528e7) and reproduced: rho.signed_frobenius_strong
    1.089 [0.927, 1.261] x sqrt(pi/4n) on Koblitz curves log2 r 32.1-47.2 (medium tier, 144
    runs); strong-rho steps/ideal 0.99, 0.92, 0.94 at n = 41, 53, 61; j=0 crater rho.cubic/rho.negation
    0.573 [0.562, 0.585] against theory 0.577 (volcano census). The ceiling is sqrt|Aut| and
    the program sits on it. E41 Stage 0 on fresh seeds measured steps/ideal 1.027 ± 0.023
    for order 6 and 1.038 ± 0.023 for order 24 over 512 walks per order, with no order-24-specific
    cause visible above 0.1%; the apparent E34 shortfall did not reproduce, while the registered
    full E41 fix/reference run remains unrun.
  revisit_when: >-
    A curve family with a larger efficiently computable automorphism group is found, or a
    medium-tier run shows a shortfall >5% from the sqrt(A) ceiling.
best_measured: >-
  rho.signed_frobenius_strong 1.089 [0.927, 1.261] x sqrt(pi/4n), log2 r 32.1-47.2 (ECBND1h05a2ea918f3c);
  j=0 cubic/negation 0.573 vs 0.577; E41 Stage 0 order-6/order-24 steps/ideal 1.027 ±
  0.023 / 1.038 ± 0.023 over 512 walks per order, with the full registered run pending
