id: LEAD-RHO-advice-table-variants
family: generic
title: >-
  Variants of the advice table: batch-reselected, batch-grown, basin-instrumented and transported
  tables
mechanism: >-
  Re-select or grow a Bernstein-Lange table from the batch's own solved walks, measure coverage
  as exact basin sizes, or carry a table across isogenous curves, hoping to match a static
  table with less precomputation or reuse one table on many curves.
disposition: open_next_step
next_action:
  step: >-
    Replicate EV-ECDLP-f6b3f5's re-scoped support (T_sel in {0.65T, 0.75T}) on an elliptic-curve
    walk at N = 2^30 with an independent implementation, and repair fixture_gate_v2 for the
    basin instrument (EV-ECDLP-31e91c failed the comparability gate).
  discriminates: >-
    Replicated S1_v2 at both T_sel on a curve makes the reselected table a measured precomputation
    saving (constant level); failure confirms EV-ECDLP-60e266's contradiction and closes the
    variant.
best_measured: >-
  T/2 reselected table short of static by -0.064 [-0.080, -0.049] at 2^24 (contradicted);
  S1_v2 met at 3 of 4 cells at T_sel 0.65-0.75T (toy, preliminary)
