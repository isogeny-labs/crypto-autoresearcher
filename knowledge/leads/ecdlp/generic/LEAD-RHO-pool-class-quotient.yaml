id: LEAD-RHO-pool-class-quotient
family: generic
title: >-
  Distributed pool v2 walk has no class quotient: add negation (sqrt 2) and Frobenius (sqrt
  2m)
mechanism: >-
  ecc-challenges' generic v2 worker walks plain rho, so a solve expects sqrt(pi n/2) steps
  on all 23 non-ECC2K-130 campaigns. A negation-map walk saves sqrt(2) on every curve and
  signed Frobenius saves sqrt(2m) on ECC2K-163/238/358; both are established and reproduced
  in crypto.
disposition: open_next_step
next_action:
  step: >-
    Before enabling the negation-class walk (ecc-challenges PR #56, default off): run a few
    hundred thousand trail starts on a real campaign curve at production DP density to measure
    the trap rate, test the CUDA path on a GPU, then canary it; design the Koblitz Frobenius
    class walk (a further sqrt(m)) per docs/negation-walk.md.
  discriminates: >-
    A trap rate near zero at production density lets the walk replace v2 while v2 progress
    is below about 0.40 E; traps would need a stronger escape before enabling.
best_measured: >-
  Negation-class walk B3 (CPU, toy curves 2^23-2^34.5, 8,600 planted solves): 0.700 [0.673,
  0.728] of v2's steps (1/sqrt2 = 0.707), 0/1,800 trapped trails, about 6% per-step overhead
  (net time about 0.744); shipped variant is a post-hoc amendment.
