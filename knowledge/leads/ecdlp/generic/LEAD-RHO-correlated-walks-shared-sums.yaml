id: LEAD-RHO-correlated-walks-shared-sums
family: generic
title: 'Correlated walks: one shared index sequence or shared precomputed sums across walks'
mechanism: >-
  Let all parallel walks follow one index sequence, or step by precomputed sums R_i + R_j,
  so that table work is shared and each addition advances more than one step.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    With a shared index sequence every walk adds the same R_i at every step, so pairwise differences
    P_i - P_j are invariant and two walks can never meet unless they started equal; measured
    0.073x [0.070, 0.076] (176/1000 censored, a lower bound on the loss). A pair table still
    costs one addition per step: 1.027 [0.982, 1.073]. Changing the representative rule per
    epoch breaks walk determinism: 0.83x [0.79, 0.87], worse than no negation map. Scope:
    any parallel rho.
  revisit_when: >-
    A sharing scheme that keeps walks a deterministic function of the point while saving additions
    (not just table lookups).
best_measured: >-
  shared index 0.073x; pair table 1.027x; per-epoch rule 0.83x (rho_walk_leads, N ~ 2^35.6)
next_action: {from_revisit_when: true}
evidence:
- repo: crypto
  path: research/rho_walk_leads_20261014/README.md
  note: leads 3 and 4 tables with bootstrap intervals
known_results:
- KR-RHO-6239aa
forecloses:
- walks share one index sequence
- shared precomputed sums across walks
- pair table R_i + R_j steps
- per-epoch class rule rotation
areas:
- RHO
last_reviewed: '2026-11-01'
