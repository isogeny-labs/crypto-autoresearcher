id: LEAD-ICP-coincidence-harvest-structured-base
family: ic-prime
title: >-
  Harvesting x-key / pair-sum coincidences of structured bases (label-GAP, window, log-GAP)
  and escaping conservation by target preselection
mechanism: >-
  The mitm engine already computes table-table, table-base and search-search x-key collisions;
  if a structured base carried more pair-sum coincidences than a random base (relation excess
  kappa > 1), harvesting them would be free relations. A companion idea attempts only targets
  whose representation x(R) predicts decomposability, since conservation binds only over the
  whole group.
disposition: open_next_step
next_action:
  step: >-
    Preserve EXP-PFDR-2d36f9 v1 as O-INVALID: its 16-bit theta=0.30 target was unreachable
    and its plant/A-A calibration was not independent. Preserve the v2 selftest and refused
    pilot exactly. Obtain Coordinator authorization for a fresh immutable pilot RUN id with
    the same trial identity, seeds and parameters, then run the remaining four dependency-gated
    trials without moving HEAD during a trial. This repair changes provenance handling only;
    FAM-1 arms remain deferred.
  discriminates: >-
    A control-valid v2 reading can test whether kappa_rel grows at the registered break-even
    rate; a growing excess must then be priced end to end against matched rho. Another invalid,
    censored or infrastructure outcome remains neutral. A bounded null reading can exhaust only
    the tested family, h and scale with an explicit larger-scale revisit condition.
best_measured: >-
  EXP-PFDR-2d36f9 v1 is O-INVALID and neutral. EXP-PFDR-ada71b has 1/6 output-validated
  trials (selftest: 126/126 kernel/brute-force checks agree), one pilot refused as invalid_output
  after a commit/provenance mismatch, and four dependency-blocked/unlaunched trials; it has no
  scientific kappa reading. Earlier valid evidence:
  EXP-PFDR-bb0d26 (reviewed; H-PFDR-727bfc supported, EV-PFDR-07d608 preliminary after DEC-20261029-8d9b43; KN-FIND-c81e5b: 44 of 45 cells within 5% of a uniform label set): all 44 powered toy cells null, max |kappa
  - 1| = 0.041, max |z| = 3.13, no cell flagged, planted kappa >= 1.29 recovered at z >= 21.9
  (20-28 bits, n <= 4096); EXP-PFDR-ca5e01 O-MIXED: 63 null / 16 intermediate / 11 underpowered cells, kappa in [0.889,
  1.103], planted kappa ~2.6 recovered; kappa_rel 0.998 (small_x TT m = 4, 30-32 bits)
