id: LEAD-ICP-coincidence-harvest-structured-base
family: ic-prime
title: >-
  Harvesting x-key / pair-sum coincidences of structured bases (label-GAP, window, log-GAP)
  and escaping conservation by target preselection
mechanism: >-
  The mitm engine already computes table-table, table-base and search-search x-key collisions;
  if a structured base carried more pair-sum coincidences than a random base (relation excess
  kappa > 1), harvesting them would be free relations. A companion idea attempts only targets
  whose representation x(R) predicts decomposability, since conservation binds only over the
  whole group.
disposition: open_next_step
next_action:
  step: >-
    Run the break-even growth ladder (IDEA-20261018-a0830c): measure kappa_rel for the best
    FAM-1 geometry at 3+ rungs from 16 to 32 bits with planted positive controls, and require
    growth of 2^(8 delta*) per rung. The log-GAP validation EXP-PFDR-bb0d26 has run (five
    trials, DEC-20261022-9aec2b records observations only). Its review is complete:
    DEC-20261029-01405d records support and H-PFDR-727bfc is supported (KN-FIND-c81e5b).
    The second round, DEC-20261029-8d9b43, concurs but grades EV-PFDR-07d608 preliminary,
    not strong (correction CORR-A not yet written); EV-PFDR-28183c is preliminary. The ladder
    is designed as EXP-PFDR-2d36f9 (H-PFDR-ed7ccf, DEC-20261031-e8e84b): six log-GAP lines
    at 16-32 bits, FAM-1 arms deferred, not yet approvable (implementation, trial plan,
    queue and handoff missing).
  discriminates: >-
    kappa constant in N (as observed so far) closes the family as sub-break-even by law (exhausted_at_scale);
    kappa growing at or above the break-even rate is the first structural relation source
    on F_p and must then be priced end to end against matched rho. Side evidence 2026-10-28
    (different statistic, mean yield and collision count, not kappa_rel): fb-prime-transfer found
    additive and multiplicative energy of the abscissa set do not predict the collision count at
    cofactor 1, and fb-prime-learned-2p24 found no structured family above random by more than
    0.0003 bits at N up to 2^26. This does not run the kappa_rel ladder; the next_action stands.
best_measured: >-
  EXP-PFDR-bb0d26 (reviewed; H-PFDR-727bfc supported, EV-PFDR-07d608 preliminary after DEC-20261029-8d9b43; KN-FIND-c81e5b: 44 of 45 cells within 5% of a uniform label set): all 44 powered toy cells null, max |kappa
  - 1| = 0.041, max |z| = 3.13, no cell flagged, planted kappa >= 1.29 recovered at z >= 21.9
  (20-28 bits, n <= 4096); EXP-PFDR-ca5e01 O-MIXED: 63 null / 16 intermediate / 11 underpowered cells, kappa in [0.889,
  1.103], planted kappa ~2.6 recovered; kappa_rel 0.998 (small_x TT m = 4, 30-32 bits)
