id: LEAD-ICP-construction-normal-form
family: ic-prime
oracle_class: not_applicable
oracle_class_note: "normal form and instrument calibration, produces no relations (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  Normal form and calibrated instruments for proposed prime-field attack systems (dedup, result
  classes, estimator bias, dynamic range)
mechanism: >-
  A decidable normal form (base, nvars, degree sequence, Groebner signature, oracle) quotients
  the many proposed prime-field systems into distinct constructions, and instruments (single-cell
  exponent estimator, descent detectors) must show unbiasedness and dynamic range before their
  nulls count. It makes ECDLP cheaper only indirectly, by stopping re-proposal and false nulls.
disposition: open_unexamined
next_action:
  step: >-
    Compute the H-PFDR-6189d0 normal form over every PFDR/PATH proposal and hypothesis, and
    run the H-PATH-7fdef7 estimator-bias check on the sealed 8-32-bit prime fixtures.
  discriminates: >-
    A quotient much smaller than the record count lets the atlas mark duplicates mechanically;
    a biased single-cell estimator invalidates any exponent claim that used it.
