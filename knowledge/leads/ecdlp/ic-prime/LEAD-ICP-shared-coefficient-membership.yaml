id: LEAD-ICP-shared-coefficient-membership
family: ic-prime
title: Shared divisor-coefficient circuits for high-degree implicit factor-base membership
mechanism: >-
  Represent a five-point relation by a norm A^2-B^2f=(X-r)U from L(6O), and enforce all root
  memberships through one shared quotient-ring or Graeffe coefficient tower. The base and
  function-first viewpoint are known. The question is complete solving work with the same
  high-degree implicit membership and unchanged yield, including chart and root recovery costs.
  Arity-two theorem cells are component evidence only: if a PDP costs 2^(e s) at s=log2(p)/m,
  reusable setup costs 2^(a s), and collection needs Theta(2^s) natural queries, the strict
  gates are a<m/2 and e<m/2-1; the latter is impossible at m=2.
disposition: open_next_step
next_action:
  step: >-
    Prove chart correspondence. Freeze k=3,4 censuses only after checking at least five usable
    distinct x; compare per-root PKM, symmetric, quotient and Graeffe circuits. Use k=2 only as
    a deliberate empty squarefree-chart negative control, with repeated roots in a separate arm;
    never cite an m=2 cell as exponent-changing. Route any solver-slope claim through the
    source-bound m=3 protocol hardened in cryptanalysis PR #1347: natural-only complete-panel
    e<0.5, reusable setup a<1.5, signed lifts, compact field ranges and checked explanations/UNSAT
    proofs. Retain explicit rationality circuits when the shared construction reaches arity at
    least four, and do not inherit the unadmitted one-hot s=15..27 continuation.
  discriminates: A cheaper shared proof/solve circuit beyond permutation constants, versus algebraic degree merely
    hidden in auxiliary coefficients or excluded charts.
