id: LEAD-ICP-shared-coefficient-membership
family: ic-prime
title: Shared divisor-coefficient circuits for high-degree implicit factor-base membership
mechanism: >-
  Represent a five-point relation by a norm A^2-B^2f=(X-r)U from L(6O), and enforce all root
  memberships through one shared quotient-ring or Graeffe coefficient tower. The base and
  function-first viewpoint are known. The question is complete solving work with the same
  high-degree implicit membership and unchanged yield, including chart and root recovery costs.
  Arity-two theorem cells are component evidence only: if a PDP costs 2^(e s) at s=log2(p)/m,
  reusable setup costs 2^(a s), and collection needs Theta(2^s) natural queries, the strict
  gates are a<m/2 and e<m/2-1; the latter is impossible at m=2. For the normalized finite-target
  chart, affine elimination of chart.A0 now has an independently derived exact reconstruction
  and a conditional non-increase theorem for highest-part degree of regularity; strict
  complete-chart regularity and solver work remain unproved.
disposition: open_next_step
next_action:
  step: >-
    Treat the reviewed finite-target chart.A0 elimination as a presentation theorem only: it
    removes one projected field coefficient, keeps U and every other auxiliary, and requires
    every nonzero substituted row. Next perform the authenticated original/projected complete
    model comparison with affine reconstruction and a common signed-output/fiber map, then
    determine regularity for the complete retained-row chart with all interval, rationality,
    stratum and surviving field equations. Measure solving degree, matrix/search work, pruning
    and runtime separately; the four-variable diagnostic is only a control. Preserve both the
    original 106-cell coordinate cohort and distinct six-cell coefficient cohort. Freeze k=3,4
    censuses only after checking at least five usable distinct x; compare per-root PKM, symmetric,
    quotient and Graeffe circuits. Use k=2 only as an empty squarefree-chart negative control,
    with repeated roots separate. Route any solver-slope claim through the source-bound m=3
    protocol hardened in cryptanalysis PR #1347, with natural-only e<0.5, reusable-setup a<1.5,
    signed lifts, compact field ranges and checked explanations/UNSAT proofs.
  discriminates: >-
    Strict regularity reduction on the complete retained-row chart plus lower fully charged
    proof/solve work would advance the shared circuit. Non-strictness or no work reduction leaves
    only an exact representation simplification. The diagnostic 2p to p+1 thresholds do not
    transfer to the complete chart without its own analysis.
