title: Shared divisor-coefficient circuits for high-degree implicit factor-base membership
mechanism: Represent a five-point relation by a norm A^2-B^2f=(X-r)U from L(6O), and enforce all root memberships
  through one shared quotient-ring or Graeffe coefficient tower. The base and function-first viewpoint are known.
  The question is complete solving work with the same high-degree implicit membership and unchanged yield, including
  chart and root recovery costs.
