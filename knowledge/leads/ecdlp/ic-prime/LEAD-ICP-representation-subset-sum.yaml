id: LEAD-ICP-representation-subset-sum
family: ic-prime
title: >-
  Representation technique (Howgrave-Graham-Joux style) on the base-B digit subset-sum form
  of ECDLP
mechanism: >-
  Write k in base B so that Q = sum_j [d_j B^{j-1}] P is a structured subset-sum over the
  group, and use many representations of the solution to filter partial sums, as for knapsacks.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    The method uses only group operations and equality of encodings, so it is a generic algorithm
    and is bounded below by T >~ sqrt(N) (Shoup) and S*T^2 >~ N with advice; the filter step
    has no non-generic handle on E(F_p) (KR-RHO-5b1c0a records the same failure over F_{p^2}).
    Scope: representation/filter variants on a prime-order group whose filter observes only
    generic group operations and equality of encodings. Coordinate-reading predicates, algebraic
    bucket generators and other non-generic handles are outside this theorem.
  revisit_when: >-
    A filter predicate that reads non-generic coordinate structure has a measured held-out bias
    and a subquadratic qualifying-pair generator. The exact ECCp-131 simple-bit screen did not
    qualify, but it tested only its frozen 1--8-bit source/combiner family at B=64,128,256.
