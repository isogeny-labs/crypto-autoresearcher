id: LEAD-ICP-representation-subset-sum
family: ic-prime
title: >-
  Representation technique (Howgrave-Graham-Joux style) on the base-B digit subset-sum form
  of ECDLP
mechanism: >-
  Write k in base B so that Q = sum_j [d_j B^{j-1}] P is a structured subset-sum over the
  group, and use many representations of the solution to filter partial sums, as for knapsacks.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    The method uses only group operations and equality of encodings, so it is a generic algorithm
    and is bounded below by T >~ sqrt(N) (Shoup) and S*T^2 >~ N with advice; the filter step
    has no non-generic handle on E(F_p) (KR-RHO-5b1c0a records the same failure over F_{p^2}).
    Scope: any representation/filter variant on a prime-order group.
  revisit_when: A filter predicate that reads non-generic coordinate structure with a measured
    bias.
evidence:
- repo: crypto-autoresearcher
  path: ledger/hypotheses/H-PFDR-673eed.yaml
  note: localises the failure at the filter, not the counting; proposed, unrun
- repo: crypto
  path: RESEARCH_PRIME_FIELD_BREAKTHROUGH_PROGRAM.md
  note: 'section 0: black-box methods obey the generic bounds'
- repo: crypto
  path: problems/representation-join-fast-backend-and-pipeline.md
  note: "representation join reference evaluates every candidate pair, odd quadratic fields 3 < p <= 101 only; not wired into the collector"
