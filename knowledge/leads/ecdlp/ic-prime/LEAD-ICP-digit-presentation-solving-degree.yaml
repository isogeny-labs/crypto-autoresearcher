id: LEAD-ICP-digit-presentation-solving-degree
family: ic-prime
title: >-
  Digit (base-B) presentation of prime-field Semaev systems as a Weil-descent analogue - first/last
  fall degree, staircase and representation tricks
mechanism: >-
  Writing each unknown in s bounded digits gives an F_p analogue of Weil descent, so that
  the Semaev system might have a solving degree bounded independently of p (as first-fall-degree
  heuristics give over F_{2^n}). Variants: p-independence of graded Macaulay invariants, adaptive
  connected-staircase search, valuation-semigroup presentations, finite-state carry circuits,
  commutator border reduction, and comparisons with the binary chained-Semaev twin. For solver
  measurements, Boolean quotient equations remove carry semantics from the field model but do
  not make pure-CNF multiplication free: general F_p multiplication still costs Theta(log^2 p)
  gates. The theorem-bearing candidates are therefore hybrid CDCL(T)/F_p and native QF_FF, with
  pure CNF retained as an encoding-cost control.
disposition: open_next_step
next_action:
  step: >-
    First implement and freeze the owned m = 3 hybrid exponent screen in cryptanalysis PR #1343:
    CaDiCaL plus an F_p external theory, with cvc5 QF_FF as the independent route, exact
    two-window enumeration and curve-free support-matched nulls. Run every s = 6..14 only after
    exhaustive tiny-cell and explanation-certificate replay; the strict necessary gate is a
    corrected upper 95 percent interval e < 0.5. Use m = 2 only for exact correctness and
    negative controls. The certified degree-growth and adaptive-staircase arms remain mechanism
    diagnostics, not substitutes for the complete counted solver slope.
  discriminates: >-
    A fully counted hybrid slope with corrected upper interval below 0.5 advances the m = 3 PDP
    mechanism to a separately frozen 40--80-bit continuation, while a corrected lower interval
    at least 0.5 stops it. Growing d_lf or curve/null collision still diagnoses why it fails,
    but favorable algebraic degree alone does not satisfy the gate. A complete index-calculus
    win remains separately constrained by linear algebra, whose current bridge first admits
    m >= 4.
best_measured: >-
  d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1, curve-independent and reproduced by a curve-free
  block-factored null (EV-PFDR-1394a4); sigma > 1 at every tested s (EV-PFDR-99c699); no syzygy
  beyond Koszul (EV-PFDR-e67f06); no source-bound CDCL(T)/F_p slope measurement exists
