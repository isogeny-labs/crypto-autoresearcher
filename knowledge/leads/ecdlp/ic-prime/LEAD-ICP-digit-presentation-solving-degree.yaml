id: LEAD-ICP-digit-presentation-solving-degree
family: ic-prime
title: >-
  Digit (base-B) presentation of prime-field Semaev systems as a Weil-descent analogue - first/last
  fall degree, staircase and representation tricks
mechanism: >-
  Writing each unknown in s bounded digits gives an F_p analogue of Weil descent, so that
  the Semaev system might have a solving degree bounded independently of p (as first-fall-degree
  heuristics give over F_{2^n}). Variants: p-independence of graded Macaulay invariants, adaptive
  connected-staircase search, valuation-semigroup presentations, finite-state carry circuits,
  commutator border reduction, and comparisons with the binary chained-Semaev twin. For solver
  measurements, Boolean quotient equations remove carry semantics from the field model but do
  not make pure-CNF multiplication free. The selected schoolbook control has Theta((log p)^2)
  gates by construction, not as a universal lower bound. The proof-eligible candidate is hybrid
  CDCL(T)/F_p; native QF_FF is a SAT/model diagnostic at inspected cvc5 source because its
  finite-field theory exposes no proof checker.
disposition: open_next_step
next_action:
  step: >-
    Continue the owned m=3 implementation after merged cryptanalysis PR #1347: build the
    source-bound CaDiCaL F_p trail theory and independent explanation/UNSAT-proof replay on the
    landed native development oracle. Freeze every s=6..14 only after the typed exporter,
    cold/setup/online ledger, natural-only complete-panel analysis and power source exist. The
    necessary upper-interval gates are e<0.5 for natural queries and a<1.5 for reusable setup.
    In parallel at development scope, establish exact signed-model-set equivalence for a compact
    selector before proposing any s=15..27 continuation. Use m=2 only for exact correctness and
    negative controls.
  discriminates: >-
    A complete verified natural panel whose query and setup upper intervals satisfy e<0.5 and
    a<1.5 advances the frozen bundle only to a continuation proposal; one-hot s=15..27 remains
    unadmitted. Either lower interval at or above its boundary on the same valid panel stops it;
    any natural censoring is inconclusive. Growing d_lf or curve/null collision remains mechanism
    evidence, but favorable algebraic degree alone does not satisfy the gate. Linear algebra and
    the remaining complete index-calculus stages stay separate.
best_measured: >-
  d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1, curve-independent and reproduced by a curve-free
  block-factored null (EV-PFDR-1394a4); sigma > 1 at every tested s (EV-PFDR-99c699); no syzygy
  beyond Koszul (EV-PFDR-e67f06); no source-bound CDCL(T)/F_p slope measurement exists
