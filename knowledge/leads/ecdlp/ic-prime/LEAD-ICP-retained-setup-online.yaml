id: LEAD-ICP-retained-setup-online
family: ic-prime
oracle_class: generic
oracle_class_note: "online table probes against a retained pair or root table (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  Retained-setup online IC (compact orbit n61, dense K1798 root table n83, orbit-folded m
  = 2) as a per-target win
mechanism: >-
  Keep the factor base, logs and dense root table after one solve so that each new target
  costs only a geometric number of table probes; the online ratio against rho looked like
  13.9x (n61) and 18.5x (n83).
disposition: closed_dominated
obstruction:
  kind: measured
  statement: >-
    The online ratios compared against rho with an empty distinguished-point table. Bernstein-Lange
    preprocessing rho with equal or smaller advice is 53-317x faster online than IC at n =
    41/53/61, and precomputed-table rho wins every N83 matched pair; orbit-folded m = 2 Koblitz
    IC is BSGS on the quotient and sits on the BL r/P law. Scope: retained-advice, many-target
    accounting on these curves.
  revisit_when: An IC online row that beats BL preprocessing rho at equal advice bytes and
    equal setup.
best_measured: >-
  superseded: rho/IC 13.9x (n61) and 18.528x (n83) were against empty-table rho; BL at equal
  advice 53-317x faster online than IC
