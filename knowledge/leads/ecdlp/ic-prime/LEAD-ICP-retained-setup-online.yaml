    L12 incremental prefix search (clause retention across the N attempts of one seed) is retained-
    setup/advice, not a new mechanism: inc/fresh conflicts 0.025 [0.014, 0.040] (m = 2, b = 12, N =
    171) and 0.201 [0.153, 0.248] (m = 3, b = 12, N = 256), but the retained solver fills a
