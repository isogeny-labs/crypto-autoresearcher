id: LEAD-ICP-gfp5-rho-reference-audit
family: ic-prime
oracle_class: not_applicable
oracle_class_note: "rho reference and parameter audit (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  Rho ruler and SafeCurves-style parameter audit for EcGFp5/EcMasFp5 (affine F_{p^5} rho cost,
  inversion paths, partition, multi-instance, interval kangaroo)
mechanism: >-
  Establish the matched rho reference and parameter facts for the deployed F_{p^5} curves:
  per-step cost, norm-based inversion, whether a walk reading one base-field coefficient mixes,
  multi-instance pooling and protocol-conditional interval methods.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    The generic costs are the published ones (rho ~ 2^160 per key; Kuhn-Struik / BL for many
    keys; kangaroo for narrow intervals). The program's certificate-bearing audit reproduced
    both orders and twist securities (EcGFp5 twist 120.66 bits; EcMasFp5 101.9321 vs self-reported
    101.93, |delta| 0.0021). Nothing here can make ECDLP cheaper than rho; remaining items
    are instrument constants.
  revisit_when: >-
    A deployment with narrow nonce intervals or many keys on one curve, or a walk-mixing defect
    measured in the F_{p^5} backend.
best_measured: EcMasFp5 twist rho security 101.9321 bits reproduced (EV-GFPN-ba8e4d)
