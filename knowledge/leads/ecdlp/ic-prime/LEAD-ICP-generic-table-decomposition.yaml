id: LEAD-ICP-generic-table-decomposition
family: ic-prime
title: >-
  Enumeration, subtraction and meet-in-the-middle pair-table decomposition for prime-field
  Semaev IC (arity 2 to 7)
mechanism: >-
  Over F_p the roots of S_3/S_4 are exactly x(R -/+ F_i) matched against x(F_j +/- F_k), so
  the point-decomposition problem becomes a batched subtraction plus a table lookup (folded,
  walked targets; mitm tables of h-fold signed sums). With a factor base of size B and arity
  m this trades B^{m-1} advice for (m!/2^m) p / B^{m-1} work per relation, and was the hope
  for moving the Table B prime ladder toward rho.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Any decomposition oracle that enumerates or table-looks-up factor-base elements is a generic
    time/memory trade-off and obeys S*T^2 >~ N (Corrigan-Gibbs--Kogan) and T >~ sqrt(N) (Shoup);
    with linear algebra included the two-term model gives m = 2 >= 3 (pT_dec)^{2/3} and m
    = 3 only ties rho even with T_dec = O(1). Measured on generated prime-order E/F_p, 12-32
    bits: exhaustive IC exponent 0.99 (m = 2) and 1.01 (m = 3), mitm 0.67 / 0.75 / 0.60 at
    m = 3/4/5 (4/7 at m = 7) against rho 0.50 [0.48, 0.52]; Table B gap to matched rho widens
    from 5.47x at log2 r = 11.9 to 13.5x at 23.4. Scope: any generic (enumeration/table) decomposition
    over F_p.
  revisit_when: >-
    A non-generic decomposition oracle exists with per-attempt cost T_dec << p^{1/4} at arity
    m = 4 (an S_5 oracle at B ~ p^{1/5}), or a decomposition test sub-linear in |F|.
best_measured: >-
  S_IC/S_rho = 5.47x (log2 r = 11.9) to 13.5x (log2 r = 23.4), Table B prime ladder, now rendered
  validated with caveats (pricing_ok False); FRONTIER fitted exponent 0.841 [0.646, 0.953] (fit version 2,
  frontier ECFR1hbd02e945e867) for folded mitm m = 2; bitop/v1 ic-pair-rule 0.646 [0.629, 0.659]
  vs rho-neg 0.504 [0.449, 0.575] at 33-40 bits. Progress-fidelity status of the next item:
  UNQUALIFIED in this repository - quoted from crypto, same-host replay only, no claims/*.json
  record (AGENTS.md 'Mandatory progress-fidelity gate'). Quoted: generic-decomposition track
  k-sum table (one probe a target, ic.ksum k = 4 then 5, crypto #2808 and #2852): at 40 bits
  (icv1-fp40-tm924137-0ecaaeb9) S 11.56 (k = 4) -> 8.51 (k = 5), 9.7x rho-neg and 7.6x bsgs-neg
  at w = 0; k = 5 below k = 4 across the band at 24-48 bits; 36-48-bit exponent 0.547 [0.543,
  0.554] vs 0.565 [0.560, 0.571], against the generic optimum k/(2k-1) = 5/9. Still above BSGS
  at every size (10.6x at 48 bits), as the S*T^2 obstruction predicts. Different curves from
  Table B, so not ranked against its incumbent.
