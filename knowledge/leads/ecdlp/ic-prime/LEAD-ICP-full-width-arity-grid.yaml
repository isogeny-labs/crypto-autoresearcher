id: LEAD-ICP-full-width-arity-grid
family: ic-prime
title: >-
  Full-width complete-solve IC arity grid (m = 2..8) at 50-63-bit subgroups - prime coset/small-x
  bases, Koblitz orbit and ordinary-binary bases
mechanism: >-
  Measure the IC boundary where it has never been measured: complete solves at 2^50-2^63 with
  certified fixtures and explicit coset bases (380/475 points, quadratic coset lifts), so
  the distance to matched rho is known at the sizes the leaderboard extrapolates to.
disposition: open_blocked
next_action:
  step: >-
    Freeze a fresh-ID successor whose plan, launcher and checker agree on every required
    top-level output. First pass the standard supervisor on no-science canned-success and
    censored fixtures with missing/changed-artifact controls. Only then run the approved
    63-bit three-base m = 2..8 solver-to-certificate panel (H-ICPERF-05021b), followed by
    the k11 ordinary-binary matched bases, under a new prospective execution record.
  discriminates: >-
    A fixture pass repairs only the output contract. Uncensored, output-validated cells with
    accepted solver certificates would give the first measured 63-bit per-arity boundary.
    Timeout censoring, invalid output or a monitor failure remains operational evidence and
    cannot confirm a writability boundary or rank factor bases.
  blocked_by: >-
    problems/icperf-prime63-m2-output-contract-mismatch.md and
    problems/full-width-ic-arity-grid-unmeasured.md
best_measured: >-
  Prime complete-solve arity ladder stops at 32 bits and m = 7. The reviewed prime63 m = 2
  attempt is invalid_output: all three positive calls were timeout-censored and no accepted
  solver response or certificate exists (EV-ICPERF-3f4a4e). The k11 evidence likewise has
  censored planted calls and no natural-yield reading.
