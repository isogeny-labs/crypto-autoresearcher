id: LEAD-ICP-gfp5-symmetrized-gaudry
family: ic-prime
title: >-
  Symmetrization-aware Gaudry/Diem decomposition on EcGFp5/EcMasFp5 (n = 5) using rational
  2-torsion ((Z/2)^4 x| S_5) and side dichotomy
mechanism: >-
  EcGFp5's rational 2-torsion allows FGHR/FHJRV symmetrization, predicted to cut the ideal
  degree from ~2^20 to ~2^9 and so lower the design note's >= 2^142 Gaudry floor; the side
  dichotomy says every F_q-rational root of the descended system is an all-E or all-twist
  decomposition.
disposition: closed_dominated
obstruction:
  kind: measured
  statement: >-
    The F_p-rational (Z/2)^4 x| S_5 quotient of KN-OPEN-9b4a2b (6 unknowns, degrees
    8,8,8,8,8,2) was solved completely at m = 5 with msolve 0.6.5 (grevlex F4 plus
    rational parametrisation) at p' = 4111, 262231 and 33554371. That is 3 primes over
    13 bits, on a frozen protocol (crypto research/ecgfp5_quotient_solve_20261101).
    D = 2^16 in every cell, which confirms the law D = 2^{(m-1)^2}. The planted point
    was recovered every time. Peak RSS was 4.7-6.5 GiB.
    Whole-solve per-system cost was c_cyc = 2^46.30 / 2^46.56 / 2^46.63 (CPU-s x 2.8 GHz,
    band [c/4, 4c]). That meets the frozen G1 CLOSE threshold c_cyc >= 2^46 in every
    cell, but only by 0.30-0.63 bits.
    F4 alone cost 2^44.72-2^45.29, which would sit in G1's not_measured band. About
    two-thirds of c is the rational parametrisation.
    Five solver probes at p' = 4111 gave no improvement against the bar
    W0_F4_CPU / 1.5 = 6,900 s:
    - weighted F4 W = (2,2,2,2,2,1) finished with D = 2^21 and 1.16x the CPU;
    - weighted (1,1,1,1,1,2) and (1,2,3,4,5,5) hit the wall cap;
    - Singular sba F5a hit its cap;
    - Singular sba F5b was stopped by the owner past the bar.
    Grevlex already shows no degree fall on this system, which removes the mechanism
    weighted orders exploit.
    The ideal-degree drop the mechanism predicted is real (2^20 -> 2^16 against the
    S_5-symmetrised system). The per-system cost at this D still dominates the
    symmetrized Gaudry route against rho under the program's G1 model.
  revisit_when: >-
    Any of the following reopens the lead:
    - a finish cheaper than msolve's rational parametrisation (FGLM to a lex eliminant, or
      the eliminant only) brings whole-solve c_cyc to <= 2^38 (G1 PROMOTE) on >= 3 primes;
    - a matrix-F5/GVW-style F4 (e.g. FGb) or another solver lowers F4 CPU below W0/1.5 on
      the same system;
    - a further rational symmetry or construction gives D < 2^16 at m = 5.
    Note: the closure margin is under one bit, so a constant-factor finish change alone
    could move the verdict to not_measured. H-GFPN-6cc6aa (degree-4 Macaulay rank against
    a cofactor-1 null) remains untested.
best_measured: >-
  Quotient at m = 5, msolve 0.6.5, 4 threads: D = 2^16 at p' = 4111 / 262231 / 33554371,
  planted point recovered; whole-solve c_cyc 2^46.30 / 2^46.56 / 2^46.63 (F4 alone
  2^44.72 / 2^45.05 / 2^45.29); max RSS 4.68 / 6.47 / 6.41 GiB; G1 CLOSE at every prime.
  Supersedes H-GFPN-9a29be's memory_exhausted m = 5 cells (EV-GFPN-fc5950).
