id: LEAD-ICP-gfp5-symmetrized-gaudry
family: ic-prime
title: >-
  Symmetrization-aware Gaudry/Diem decomposition on EcGFp5/EcMasFp5 (n = 5) using rational
  2-torsion ((Z/2)^4 x| S_5) and side dichotomy
mechanism: >-
  EcGFp5's rational 2-torsion allows FGHR/FHJRV symmetrization, predicted to cut the ideal
  degree from ~2^20 to ~2^9 and so lower the design note's >= 2^142 Gaudry floor; the side
  dichotomy says every F_q-rational root of the descended system is an all-E or all-twist
  decomposition.
disposition: open_next_step
next_action:
  step: >-
    Freeze and run one u=x/y m=5 cell at p'=4111 under W0's solver, host and envelope.
    Advance it to a three-prime run if either the F4 CPU is at most 6,900 s or the whole-solve
    CPU is at most 31,004 s; these are alternative bars, not a conjunction. Independently run
    the S_5 arm at m=5 on the quotient's own targets at at least three primes spanning 12 bits,
    and keep the unrun H-GFPN-6cc6aa degree-4 Macaulay-rank test as a separate branch.
  discriminates: >-
    One u-cell decides only whether that representation merits the three-prime follow-up.
    The same-target S_5 arm measures the orbit non-freeness gap without comparing D to the
    constant 2^20; the Macaulay test answers a different rank question. A memory/time stop is
    not measured, and none of these toy per-system outcomes is an end-to-end security claim.
best_measured: >-
  m=5 quotient, D=2^16 and planted point recovered at three primes; block-Wiedemann whole-solve
  c_cyc 2^45.43 / 2^45.58 / 2^45.84, 1.72--1.97x below W0 but 7.43--7.84 bits above PROMOTE;
  G1 bands straddle CLOSE
