id: LEAD-ICP-extension-field-embedding
family: ic-prime
title: Embedding E(F_p) into E(F_{p^n}) to buy a subfield factor base
mechanism: >-
  Viewing the prime-field instance inside E(F_{p^n}) makes x in F_p an algebraic (subfield)
  factor-base condition, so Gaudry/Diem Weil-descent decomposition applies.
disposition: open_next_step
obstruction:
  kind: cost_model
  statement: >-
    Gaudry's cost on E(F_{p^n}) is O~(p^{2-2/n}) against the original sqrt(p): p at n = 2
    and p^{4/3} at n = 3; the embedding enlarges the problem faster than the subfield helps.
    Scope: any fixed n.
  revisit_when: >-
    A decomposition over F_{p^n} with exponent below 1/(2n) in |E(F_{p^n})|, i.e. far beyond
    Gaudry/Diem.
next_action: {from_revisit_when: true}
evidence:
- repo: crypto
  path: RESEARCH_PRIME_FIELD_BREAKTHROUGH_PROGRAM.md
  note: section 4.6 embedding into an extension
