id: LEAD-ICP-pkm-tower-algebraic-oracle
family: ic-prime
title: >-
  PKM tower and APS partitioned factor bases solved algebraically over F_p (summation-polynomial
  systems with low-degree auxiliary membership; first and last fall degree)
mechanism: >-
  Petit-Kosters-Messeng (PKC 2016) take F = {P : x(P) in V} with V the split zero set of a
  composition L_t o ... o L_1 of low-degree maps (Kummer, Dickson/torus, 2-isogeny towers),
  keeping one auxiliary variable per level so every membership equation has low degree; Amadori-Pintore-Sala
  partition the base and join partial S_3 systems. The tower quotient R = F_p[y,u]/T has a
  square-free normal form, so the Huang-Kosters-Yeo fall degrees are defined over F_p (prime_fall_degree
  DERIVED D1-D2). If the solving degree stayed bounded as N = m*t grows, each decomposition
  would cost poly(N); with the linear-algebra floor r^{2/(m+1)} only m >= 4 can beat rho
  (RESEARCH_PKM_TOWER_ORACLE section 3.7). It is the prime-field route that meets the owner's
  2026-10-24 index-calculus criterion (relations from solving summation-polynomial systems over
  an algebraically defined factor base, no table collisions) with low-degree membership; the
  naive small-abscissa base with the dense F_V = prod(x - c) also counts, tentatively (crypto
  research/prime_ic_program_20261029/DECISIONS.md D1), but gives a Groebner solver no low-degree
  structure.
disposition: open_blocked
next_action:
  step: >-
    Run the preregistered prime fall-degree study (crypto research/prime_fall_degree_20261027,
    stages g4, hky-A, d-A, cap-A, then hky-C, hky-B, d-B) on a dedicated host with multiply-add
    counts kept: stage A must first reproduce the session-reported Kummer m = 2 d_F medians
    3,4,4,4,4,5,5,5,5,6 at t = 1..10, then score t >= 11 against the Amendment-6 C-step prediction
    d_F = 4 + floor((t-2)/4) registered before those rows existed. After it, the m >= 4 F4 cells
    (m = 4, N = 20, projected 240-380 GB) and the published-IC reference arm priced as cold
    whole-solve S in GAE. ic_sweeper section 2.5 proposed a standard-base FGHR-symmetrised
    S_{m+1} + msolve arm, but FGHR's 2-torsion invariants need rational 2-torsion and every
    Table B prime curve has odd order; the prep in crypto
    research/prime_ic_program_20261029/reference_arm therefore specifies Semaev's naive
    small-abscissa system <S_{m+1}, F_V(x_i)> solved by a pinned msolve -P 1 (not implemented),
    with PKM's tower base on pkm-semaev as its phase-2 arm.
  discriminates: >-
    d_F growing with t at or above the C-step (as every measured D so far: m = 2 reads 4 -> 6
    to N = 20, m = 3 reads 5..7 to N = 18, m = 4 reads 6, 7, 7 to N = 16) confirms the pre-registered
    H0 (solving degree linear in N) for Kummer/Dickson/torus/isogeny towers and moves the lead
    to exhausted_at_scale at the reached N; d_F flat in t at m >= 4 against the shape-matched
    null would be the first bounded-degree prime-field decomposition and goes to Stage B (end
    to end against matched rho with the section 5a band).
  blocked_by: >-
    Route and custody: isolab.eks.request/v1 accepts only ecbench specs, so the frozen isolab/LAUNCH.md
    jobs (pkm_tower_pilot) need the harness-host isolab_k8s_run route (crypto docs/session-logs/2026-10-28.md);
    the raw stage A/C runs, TABLE.md and draft RESULTS.md exist only in the owner's Mac worktree
    (RESTART.md); m = 3 N = 21 and m = 4 N = 20 need 130-380 GB hosts. Problem records: crypto-autoresearcher
    problems/pkm-isogeny-chain-factor-base-no-fast-decomposition.md, crypto problems/mixed-fiber-pkm-full-solver.md
    and problems/aps-single-relation-complete-cost.md.
best_measured: >-
  F4 solving degree D grows with N on every tower family (m = 2: 3 4 4 4 4 5 5 5 5 6 for N = 2..20;
  m = 3: 5 6 6 7 at N = 6..15; m = 4: 6 7 at N = 8, 12; torus = split Dickson = Kummer, isogeny
  tower one higher), shape-matched null gives the same D (RESEARCH_PKM_TOWER_ORACLE section
  17, measured); derived ffd = 4 for Kummer m = 2 at every t and d_F <= 2t + 2 (DERIVED D3,
  D4); P-256 2-isogeny chain encoding 2x-654x slower than the dense encoding of the same set
  under Singular std, basis step 8x to >79x under msolve (EXP-ECDLP-f49f75, EXP-ECDLP-502ae2); no complete-cost
  or matched-rho row exists
