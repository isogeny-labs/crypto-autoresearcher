id: LEAD-ICP-char0-lifting-xedni-smoothness
family: ic-prime
title: >-
  Lifting to characteristic zero - classical xedni, prescribed rational lifts (Cheon 2-isogeny
  form) and smoothness of integer lifts of x
mechanism: >-
  Lift E and the factor-base or target points to E/Q so that rational relations reduce to
  free relations mod p (xedni), construct rational lifts of a prescribed finite-field pair
  that are dependent (Cheon-style 2-isogeny family), or treat integer lifts of x(kP) as smooth
  numbers as in F_p^* index calculus.
disposition: open_next_step
obstruction:
  kind: literature
  statement: >-
    JKSST's C0/p obstruction for classic fixed-arity xedni is conditional on
    its selected-lift height/discriminant and Lang premises, an approximate
    random-image/sampling model, and the reduction/useful-relation
    correspondence; cofactor and adaptive-hazard bridges are additionally
    needed for the repeated-trial conclusion. The program reproduced
    the p = 353 Cheon example and certified the two historical prescribed pairs
    independent modulo torsion under the signed-square lemma; bounded Xedni V2
    fitting found no certified dependencies among 20 pairs. Those are exact or
    finite negatives for the stated pairs and search, not a theorem excluding
    every prescribed lift. H-PFDR-e0988d shows that the naive integer-x lift
    lacks a compositional identity because the x-line addition law is two-valued;
    it does not exclude a different relation-preserving statistic.
  revisit_when: >-
    implement and freeze the bounded H-XEDN-4a5b50 search and either certify an
    exact dependent prescribed lift with all setup/certificate costs charged or
    exhaust only its declared finite domain; in parallel, an integer-lift route
    must supply an exact compositional relation identity and a sub-rho yield/cost
    bound rather than smoothness alone
best_measured: >-
  p = 353 example reproduced; 2/2 historical pairs certified independent; Xedni V2 curve-fitting
  0 certified dependencies among 20 bounded pairs
next_action: {from_revisit_when: true}
