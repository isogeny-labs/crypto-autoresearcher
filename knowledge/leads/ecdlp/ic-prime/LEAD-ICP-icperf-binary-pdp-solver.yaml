id: LEAD-ICP-icperf-binary-pdp-solver
family: ic-prime
oracle_class: algebraic
oracle_class_note: "SAT or Groebner solver on the Weil-descended PDP with membership encoded (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  Solver choice for the Weil-descended binary PDP (WDSat/CDCL+XOR vs Groebner/F4/BRiAl, side-constrained
  cores) on the ICPERF boundary
mechanism: >-
  The relation phase of binary IC is a Boolean PDP; SAT solvers with XOR reasoning were reported
  to beat Groebner by a wide gap on Trimoska's S_4 instances, and adding E-membership per
  block could shrink UNSAT leaves ~8x. A structural gap would lower the measured boundary
  cost per relation.
disposition: open_next_step
next_action:
  step: >-
    Run H-ICPERF-c9380d: a Boolean-native Groebner column (BRiAl) with parseable d_solv and
    an RSS watchdog on l in {5, 6}, with WDSat installed on the runner and the side-classified
    exhaustive table as ground truth.
  discriminates: >-
    A >= 10x SAT-over-Groebner gap on every cell makes the gap structural and fixes the solver
    for the boundary table; any l = 6 cell below that threshold marks the reported gap as
    an engine-availability artifact. Either way no arm has yet grown slower than the pair-table
    MITM floor.
best_measured: >-
  EV-ICPERF-390707: five unverified SAT answers are quadratic-twist decompositions, instrument
  not invalidated, gap direction reproduced (moderate); m = 3 F4/F6/SAT slopes 0.53-0.58 vs
  MITM floor 0.207
