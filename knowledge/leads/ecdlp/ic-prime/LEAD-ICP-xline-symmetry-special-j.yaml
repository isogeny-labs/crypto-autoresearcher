id: LEAD-ICP-xline-symmetry-special-j
family: ic-prime
oracle_class: structural
oracle_class_note: "x-line automorphisms and special-j rank drops (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: >-
  x-line symmetry groups, automorphism folding and summation-polynomial degeneration at special
  j
mechanism: >-
  The Mobius group preserving the branch set of the x-line has order 4/8/12 (twice Aut), and
  Macaulay ranks of the summation system can only drop on special loci of (a, b). If a special-j
  or special coefficient locus dropped rank for an elliptic reason (not a coefficient-block
  vanishing), its curves would have cheaper decomposition; symmetry folding divides the base
  by 2, 3 or 6.
disposition: open_unexamined
next_action:
  step: >-
    Compute degree-d Macaulay ranks of the digit or chained S_4 system at j = 0, j = 1728
    and on the predicted degeneration points of the j-line against generic curves and against
    a coefficient-block vanishing null of the same support, at three toy primes (H-PFDR-df0127,
    H-PFDR-6b9f1a).
  discriminates: >-
    A rank drop beyond the block-vanishing null is an elliptic special locus worth a cost
    study (still only for special curves); no excess confirms that symmetry gives only the
    known constant factor (negation 2, j = 0 orbit 3) and closes the lead.
