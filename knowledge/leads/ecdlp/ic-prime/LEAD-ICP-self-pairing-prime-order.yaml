id: LEAD-ICP-self-pairing-prime-order
family: ic-prime
oracle_class: transfer
oracle_class_note: "pairing-based map to a target group (R1, crypto research/prime_ic_program_20261029/DECISIONS.md)"
title: Nondegenerate self-pairings or bilinear maps on a prime-order E(F_p) subgroup
mechanism: >-
  A bilinear map b with b(P, P) nontrivial would turn ECDLP into a DLP in the target group
  (MOV-like), so residual self-pairing cells (H-PAIR) were re-examined for prime-order curves.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    On a cyclic group of prime order N every bilinear map is determined by h = b(P, P), so
    the space of self-pairings is one-dimensional, and Galois equivariance puts t_N(P, P)
    in mu_N intersected with the base field, trivial above embedding degree 1. Scope: prime-order
    subgroups of E(F_p) with embedding degree > 1.
  revisit_when: Embedding degree 1 or non-cyclic N-torsion over the base field (a transfer-family
    case).
