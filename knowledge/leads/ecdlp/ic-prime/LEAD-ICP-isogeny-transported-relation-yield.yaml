id: LEAD-ICP-isogeny-transported-relation-yield
family: ic-prime
title: >-
  Isogeny-transported or volcano-level factor bases and the arity-3 relation oracle (crater
  vs floor)
mechanism: >-
  Carry a factor base along isogenies (crater to floor, conductor gap) on P29/P37 curves and
  compare arity-3 relation yield against native and random bases, in case some stratum of
  the volcano has a better-yielding base or cheaper decomposition.
disposition: open_blocked
next_action:
  step: >-
    Repair and independently review the transport simulator: specify fixed versus at-most-m
    decompositions, retain identity and kernel points, enumerate and filter every lift, and either
    prove adaptive-path challenge independence or narrow to a non-adaptive model. Charge lift
    filtering, path evaluation, base construction and scaling parameters. In parallel, finish the
    17 missing EXP-ECTD arms and run the surviving R7.3 branch with the repository LineOracle /
    F_{p^2} zeta-fold and a genuinely level-dependent IC oracle on matched crater/floor levels.
  discriminates: >-
    A corrected simulator exits the proof gap only when it returns exactly the original
    decompositions under the stated arity and adaptive model with complete costs. Transported/native
    ratios within the A/A band confirm conservation only for the frozen maps, bases and sizes.
    A LineOracle or level-dependent coverage, useful-rank, variance or cost separation that grows
    with scale is an opportunity to price. Null toy cells do not close other bases, paths or strata,
    and the 17 infrastructure-lost arms remain unmeasured.
  blocked_by: problems/prime-field-arity3-relation-oracle.md
best_measured: >-
  Earlier counted IC floor/crater diagnostics were 0.975 [0.603,1.451] at ell=8209 and 1.127
  [0.922,1.342] at ell=131101. Merged R7.3 found post-automorphism conductor effects 1.0018
  [0.9986,1.0050] and 0.9997 [0.9966,1.0030], h=2,3 relation-yield factor 0.9998
  [0.9993,1.0004], and base/image census equality in 120/120 checks. Its endomorphism-mixed walk
  cost 1.22x plain rho on the crater and 1.79x on the floor, while the best strategy's level ratio
  was 0.9999 [0.9945,1.0055]. LineOracle/F_{p^2} zeta-fold and level-dependent IC were not run.
