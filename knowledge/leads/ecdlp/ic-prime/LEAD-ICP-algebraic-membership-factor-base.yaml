id: LEAD-ICP-algebraic-membership-factor-base
family: ic-prime
title: >-
  Factor bases with low-degree algebraic membership over F_p (subgroup, coset, Dickson, j=0
  orbit, images of low-degree maps, character-constant sets)
mechanism: >-
  Over F_{q^n} the subfield makes membership x^q = x low degree after Weil restriction. Over
  F_p one would need a size-B subset cut out by equations of degree << B that survive substitution
  into S_{m+1} (multiplicative subgroups x^B = 1, cosets, Dickson images, x = g(t)), or a
  structured base whose multiplicative characters bias x(P +/- Q) and so raise yield.
disposition: open_next_step
obstruction:
  kind: theorem
  statement: >-
    A target-independent algebraic locus of degree d yields O(d) usable points, so a size-B
    algebraic base has description degree >= B/3 and membership polynomial prod(x - v) of
    degree B (bounded-degree factor-base theorem, IDEA-20260801-021); mean per-target yield
    is binomial(B+m-1, m)/N for every base of size B (KN-FIND-007 conservation; coverage gain
    <= 1.582, constant in N). Measured: subgroup, small_x and random bases within 7 % at 32
    bits; exact mean-yield ratio 1.000000 for six geometries at N ~ 2^14..2^18 (EV-FBG-001);
    msolve on subgroup bases grows deg^{4.4} at m = 3. Scope: prime-order E/F_p, any base
    of size B.
  revisit_when: >-
    KN-OPEN-020 is answered positively (a size-B set with sub-B-degree membership surviving
    substitution), or a base raises coverage or variance with an excess that grows with N.
    Extra measurements 2026-10-28 (local toy scale, cofactor-1 a = -3 curves, N 2^13..2^26): the
    families subgroup (msub), coset (mcoset), cubes, quadratic-character sets, and (fb-prime-learned-2p24)
    Dickson images and rational-map images all sit within 0.0003 bits of a size-matched random
    base at m = 2, and a learned selector has 0.0011 bits of headroom: consistent with the
    conservation law; the 'Dickson / image of a low-degree map' phrases in forecloses are now
    tried, not only argued.
best_measured: >-
  mean-yield ratio vs matched random 1.000000 at N ~ 2^14..2^18 (EV-FBG-001); subgroup vs
  random within 7 % at 32 bits
next_action: {from_revisit_when: true}
