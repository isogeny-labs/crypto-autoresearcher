id: LEAD-ICP-prime-ic-constant-engineering
family: ic-prime
title: Constant-factor engineering of the prime-field IC pipeline (native arithmetic, batching, pair-table build, generator,
  LA filter, planner)
mechanism: Montgomery u64 fields, simultaneous inversion, blocked pair-table construction, a fixed-window repeated-base generator
  for aP+bQ, CADO-style filtering and an automatic stage planner lower the constant of each Table B phase (relations 68-93
  % of S, factor base 5-30 %). Each verified gain is an improvement over the current IC baseline under the owner's success
  criterion even though the exponent is fixed.
disposition: open_next_step
next_action:
  step: 'The section 13 second-host replay of the 20-bit holdout is done (crypto research/prime_base_oracle_tuning_20261029/second-host,
    commits 1e7b2b7ed2 and b06122f732): all 1,008 original records were reproduced exactly on isolab-eks, and the row was
    promoted to the leaderboard. N > 45 at 20 bits was tested on a fresh holdout by crypto XP-20261029-p20-large-n (PR #2823,
    session ECBS1h33c033ce9c88): n64/inc 1.001 [0.979, 1.022] at w = 0, 0.967 at w = 0.1, 0.834 at w = 1, unresolved inside
    the band, so N 45 stays. The 20-bit baseline on main is N 45 with targets=walk; stride-renew (crypto PR #2826, validated
    VAL-20261029-4aed57, srenew/walk 0.842 at w = 0) replaces it once merged. Still open: file a claims/*.json record from
    the matched per-pair measurements (AGENTS.md progress-fidelity gate; until then the figure is unqualified here); the random-base
    control, which needs a prime-random factor-base builder that does not exist yet (the stride-7919 control already gives
    0.809 vs 0.818). Reranked at the XP-20261029-packed-filter P32 verdict (DEC-20261029-5eb8e6 (E)) and again at its evidence
    review (DEC-20261030-04fe6d (5)): neither 20-bit residual is admitted while PR #2826 is unmerged; if one is admitted later,
    the deferred guard at 20 bits comes before a single challenger N 54. The rerank fires when #2826 merges or closes, a 20-bit
    deferred-guard result lands, or the owner asks. The other open constant is the hash-table floor of the relation trial
    (guard insert plus oracle probe, about 137 ns of a ~318 ns trial at the 16-32 lane knee; with the lane round''s demand-read
    touch of both maps it is about 168 ns at 28 bits and 188 ns at 32 bits, about 53 % of the trial, derived in crypto research/prime_ic_program_20261029/hashtable_prefetch
    from PR #2806''s TSC split converted at 2.1 GHz). The hash-table floor was attacked first with a one-bit-per-slot membership
    filter in front of the packed pair table (crypto XP-20261029-packed-filter, `mitm-prime-blocked:m=2,filter=1`, opt-in;
    branch claude/ic-packed-filter-20261029; REVIEW-P32, DEC-20261030-04fe6d): a validated whole-solve wall component speed-up
    at 32 bits only, a regression at 24 bits, and 28 bits undecidable, with no 28-bit successor (DEC-20261029-5eb8e6 (B)).
    At 32 bits the filter cut target_PDP by 25.9 % but that phase is 29 % of the solve wall, and target_query (56 %) is untouched
    (descriptive phase sums), so further work on the probe side is bounded by the PDP share. Still open on this item: software
    prefetch, or a compact lane layout (crypto research/prime_ic_program_20261029/hashtable_prefetch, uncompiled layout=lines
    patch and draft protocol). Scope note: under the owner criterion of 2026-10-24 these pair-table pipelines are the prime-table
    track (reference only, never ranked against the algebraic track; docs/ic/SWEEPER.md), so a gain here improves the reference
    baseline, not a counted algebraic IC row. Pending: crypto research/prime_ic_program_20261029/DECISIONS.md R1 (Option C,
    delegated, confirmed when its PR merges) makes these pipelines a counted generic-decomposition track, so a verified gain
    would count there, labelled generic, never as algebraic progress.'
  discriminates: A second-host replay that reproduces the 20-bit holdout keeps 0.818 [0.773, 0.866] (w = 0) as the new prime-field
    pair-table (generic-track under DECISIONS.md R1) baseline at 20 bits and lets the leaderboard section follow; a failed
    replay demotes it. A prefetchable or compact table with a paired relation-phase ratio whose interval is below 1 across
    the section 5a band is a measured constant improvement; an interval spanning 1 closes the item.
best_measured: 'Progress-fidelity status: UNQUALIFIED in this repository - quoted from crypto''s study, no claims/*.json record
  yet (AGENTS.md ''Mandatory progress-fidelity gate''); second-host replay reproduced all 1,008 records (crypto second-host/README.md:
  0.836 [0.806, 0.866] at w = 0 over 240 pairs). Quoted: factor-base size at 20 bits (crypto PR #2811, prime_base_oracle_tuning_20261029):
  prime-abscissa N 32 -> 45 with the incumbent mitm oracle, holdout sel/inc 0.818 [0.773, 0.866] at w = 0, 0.798 [0.752, 0.847]
  at w = 0.1, 0.726 [0.677, 0.778] at w = 1 (96 pairs; second-host 240-pair replay 0.836 [0.806, 0.866] at w = 0, 0.746 [0.714,
  0.779] at w = 1); gap to matched rho.negation 9.47x -> 7.75x [6.92, 8.70] at w = 0 and 12.88x -> 9.35x at w = 1; 24 and
  28 bits (N 162 -> 115, 407 -> 288) fall at w = 0 but rise 13-19 % at w = 1 (relabelling, incumbent kept); 32 bits null by
  construction. Earlier: wide target batching closed (64/256/1024 lanes do not beat 16, knee 16-48); fixed-window aP+bQ generator
  1.161 [1.127, 1.198] over 54 toy solves (EV-ICPERF-92c130); planner weight rules withdrawn out of sample (ic-planner/4).
  On other curves (not ranked against the 7.75x above), the generic-track k-sum table of crypto #2808/#2852 reaches 9.7x rho-neg
  at 40 bits (UNQUALIFIED, same-host; see LEAD-ICP-generic-table-decomposition); a same-session comparison on the 20-bit holdout
  and Table B curves is the open check. Table B prime rows 5.47x-13.5x matched rho now render validated with caveats (validation
  sweep: pricing_ok False). Packed-table membership filter (crypto XP-20261029-packed-filter; UNQUALIFIED in this repository,
  no claims/*.json record; validated in crypto by TASK-20261029-654f73, validation/validator-report.json sha256 df9624c2…7a6a):
  at 32 bits, corrected whole-solve wall per charged GAE dgbf/dgb 0.9601 [0.9569, 0.9633] (-3.99 %), identical charged GAE,
  bitop/v1 +0.301 %, S'' dgbf/dgb 1.0 / 1.0505 / 1.3586 at w = 0 / 0.1 / 1 (no counted improvement; the filter''s bit sets
  make dgbf costlier at w > 0); one session, c8a.2xlarge, two curves, not replicated. 24 bits: regression 1.0032 [1.0006,
  1.0058]; 28 bits undecidable. Distance to matched rho.negation, counted S'' of dgbf at w = 0 / 0.1 / 1: 12.12 / 12.24 /
  12.82 (24 bits), 21.04 / 21.12 / 21.44 (28 bits, descriptive), 31.47 / 31.50 / 31.63 (32 bits); different curves per size.'
