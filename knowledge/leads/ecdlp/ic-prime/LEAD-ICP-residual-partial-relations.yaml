id: LEAD-ICP-residual-partial-relations
family: ic-prime
title: Crediting residuals as partial relations (single/double large prime) in prime-field
  IC
mechanism: >-
  At m = 2 the signed-sum sweep computes 2B residual x-coordinates x(R +/- P_v) per target
  and keeps only those landing in F. Residuals that miss F are partial relations with one
  unknown; pairing them by collision (large-prime variation) changes the relation-collection
  charge from Theta(N) to about N^{(1+beta)/2} with B = N^beta (H-PFDR-cb9606), which would
  lower the IC baseline exponent though not below rho.
disposition: open_next_step
obstruction:
  kind: measured
  statement: >-
    The single-large-prime residual sweep was built and run (oracle residual-sweep inside ic.pipeline,
    39 sessions at 20-44 bits, 7,716 cross-binary replays identical). It is a birthday collision
    search, not an index calculus with a better exponent: slope of log2 S against log2 r at fixed
    base is -0.025 [-0.034, -0.017] (B=2), -0.014 [-0.020, -0.009] (B=8), -0.017 [-0.021, -0.013]
    (B=128), the same as rho.negation (-0.010), bsgs.negation (-0.007) and kangaroo (-0.023); the
    planner-tuned pair-table incumbent grows +0.071 [+0.069, +0.074]. Collision rows found equal the
    birthday count N^2/(r 2^k) in every variant (observed/predicted 0.7-1.2); the base contributes
    nothing (strided pseudo-random base 1.03x [1.00, 1.07] of the smallest-abscissa base); memory
    grows as sqrt(rB) and is not in S (375k stored residuals at B=2, 36 bits, against 103k baby
    steps for BSGS and 4.2M table entries for the incumbent). Distinguished-point variants k=2/4/6
    cost 1.44x/2.57x/5.01x in S and never reach rho's constant memory. S is 2.28 (B=2) to 11.89
    (B=128) at 36 bits against 42.2 for the tuned incumbent and 1.29 for rho.negation. Scope:
    prime-order E/F_p, single large prime at m = 2, 20-44 bits. The on-main studies
    ic_prime_residual_lp_20261026 and ic_planner_exhaustive_20261026 reach the same reading
    (rho's exponent, curve-free null identical, Lean KeyedInvariance); the PR #2783/#2807 directories
    cited below were not on crypto main at 7ffaab06b when this row was reviewed.
  revisit_when: >-
    a double-large-prime or graph-cycle variant is shown to lower the fitted exponent below the
    generic-search slopes at a fixed base, or the owner decides the sweep is listed as its own
    labelled arm (open owner decision: no leaderboard row, relabelling a generic search is not an
    improvement of the IC baseline).
former_next_action:
  step: >-
    Add a single-large-prime residual table to the prime mitm m = 2 engine and run a paired
    complete-solve ladder 16-32 bits against the current folded/walked recipe with matched
    rho, counting table memory; fit the relation-phase exponent.
  discriminates: >-
    A fitted exponent near (1+beta)/2 with total S below the incumbent is a measured IC-baseline
    improvement (distance to rho shrinks but stays > 1 by S*T^2); an exponent unchanged, or
    a gain erased by linear algebra as in the F_{p^4} double-large-prime arm, closes the variant.
best_measured: >-
  prime field (crypto PR #2783, #2807): S 2.28 / 3.85 / 11.89 at 36 bits for B = 2 / 8 / 128 vs 42.2
  tuned pair-table, 1.29 rho.negation; exponent flat (-0.025 [-0.034, -0.017]) like the generic
  searches;   F_{p^4} analogue: double large primes cut LA exponent 0.495 -> 0.420 [0.405, 0.440] but
  whole solve 2.31x [2.10, 2.62] costlier at measured sizes; no prime-field measurement
next_action: {from_revisit_when: true}
