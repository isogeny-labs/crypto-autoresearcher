id: LEAD-ICP-gfp5-oa-sdhp-jv
family: ic-prime
title: >-
  Joux-Vitse oracle-assisted static DH and (n-1)-point decomposition on E(F_{p^5}), p = 2^64
  - 2^32 + 1
mechanism: >-
  With a static-DH oracle, the Gaudry/Joux-Vitse factor base x in F_p needs ~p/2 learning
  queries and about 24 p C_pdp4 work, far below rho for the protocol model; the (n-1)-point
  variant for full ECDLP is expected to cost more than rho and is to be closed by arithmetic.
disposition: open_next_step
next_action:
  step: >-
    Freeze the JV/Granger sources, measure C_pdp4 at toy p' and project to p = 2^64 (H-GFPN-3366ea),
    and file the JV (n-1) full-ECDLP closure arithmetic (goal criterion C5).
  discriminates: >-
    A measured C_pdp4 gives the concrete OA-SDH cost for both deployed curves (a protocol-level,
    not ECDLP, weakness); the closure arithmetic removes JV (n-1) from the ECDLP budget unless
    it unexpectedly falls below 2^160.
