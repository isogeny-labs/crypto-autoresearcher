id: LEAD-ICP-icperf-writability-boundary
family: ic-prime
title: >-
  Writability of the descended system - arity forced to m >= 4 and the ANF too large to write
  inside the rho budget below n ~ 300
mechanism: >-
  Chained-S_3 or unchained S_{m+1} descended systems at the viable arity, and their Macaulay
  or block-Wiedemann memory, decide whether binary IC can even be attempted at ECC2K-130 /
  K-163 scale.
disposition: open_next_step
obstruction:
  kind: cost_model
  statement: >-
    At the best viable arity the descended ANF exceeds the whole per-decomposition rho budget
    by +6.3 bits (n = 233), +18.8 (283), +24.2 (113), +25.6 (127), +40.8 (ECC2K-130) and +37.4
    (K-163); the cost is paid before any solver runs. Scope: standardised binary curves with
    n <= 283, unchained descended ANF; the crossover is inside (283, 409].
  revisit_when: >-
    n >= 409, or a representation (e.g. chained S_3 at m = 5, 6, ~2^31-2^33 monomials) whose
    written size plus solve fits under the rho budget with memory charged.
best_measured: 'ANF size minus rho budget: +40.8 bits at ECC2K-130, -4.9 bits at n = 409 (m
  = 4)'
next_action: {from_revisit_when: true}
evidence:
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-ICPERF-784b25.yaml
  note: 'headline: too large to write down below n ~ 300; crossover (283, 409]'
