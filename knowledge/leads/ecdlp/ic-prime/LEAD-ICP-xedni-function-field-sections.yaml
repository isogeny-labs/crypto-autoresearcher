id: LEAD-ICP-xedni-function-field-sections
family: ic-prime
title: >-
  Function-field xedni - Mordell-Weil sections of elliptic surfaces over F_p(t) as a relation
  source
mechanism: >-
  Replace number-field lifting by integral sections of rational elliptic surfaces y^2 = x^3
  + a(t)x + b(t); specialising t gives points on E/F_p and Mordell-Weil relations among sections
  specialise to free relations. It helps only if the lift probability decays slower than p^{-1/2}
  and relation coefficients stay bounded.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    Exact closed form for the frozen family (deg b = 6, monic quadratic x): P_lift(p) = (1
    - 2/p + p^-3)/(2p^3), limiting exponent alpha = 3 exactly (constant 1/2), checked against
    596,268,874 enumerated slots with zero disagreements; a parameter count forces exactly
    four free prescribed sections and re-derives alpha = 3 from dimension (IDEA-20260805-d426f9).
    alpha = 3 is far above the 1/2 a viable relation source needs. The four coefficient-bound
    goals (max|coeff| = 1) measured an observable forced by norm-2 / E_8 lattice structure,
    so they neither support nor threaten the lead. Scope: rational elliptic surfaces with
    the frozen section shapes.
  revisit_when: >-
    A surface family with a dimension surplus (more free section parameters than prescribed
    conditions, e.g. explicit high-rank K3 fibrations) whose measured lift exponent is below
    1/2.
best_measured: >-
  P_lift ~ p^-3 / 2 exactly (alpha = 3); max|coeff| = 1 at p in {7, 13, 19, 31} across four
  families (forced value)
next_action: {from_revisit_when: true}
