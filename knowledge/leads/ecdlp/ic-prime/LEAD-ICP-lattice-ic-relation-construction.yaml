id: LEAD-ICP-lattice-ic-relation-construction
family: ic-prime
title: >-
  Lattice index calculus - ideal/quaternion lattices, isogeny-adjoint witnesses and Newton-shift
  certificates as relation constructors on prime cyclic subgroups
mechanism: >-
  Build relations from short vectors of public lattices attached to the curve (ideal lattices,
  quaternion orders, isogeny transport denominators, Newton shifts of small-window decompositions)
  rather than from point decomposition, with finite-field certification of each component.
disposition: open_blocked
next_action:
  step: >-
    Deliver the admitted polynomial successor: one pipeline on an explicit prime cyclic subgroup
    (F43/F97/F101 fixtures plus the rank-two F25 negative control) that certifies density,
    valid roots/points, independent rank and complete cost for a relation, then the four-track
    review.
  discriminates: >-
    A certified pipeline with relation density above the matched decomposition rate opens
    a measurable lead; failure to certify density or rank on the toy fixtures closes these
    proposals.
  blocked_by: problems/lattice-index-calculus-relation-construction-not-demonstrated.md
