id: LEAD-TRF-global-lift-small-height
family: transfer
title: >-
  Global lifts to E(Q) or E(K) with small canonical height (xedni, SNFS / cyclotomic / Solinas
  number fields, rational 2-torsion lifts)
mechanism: >-
  Lift (E, P, Q) to a curve over Q or a number field and hope the relation between the lifts
  is a short Mordell-Weil relation, readable from heights or a rank deficiency (Silverman's
  xedni calculus and its number-field / SNFS variants).
disposition: open_next_step
obstruction:
  kind: literature
  statement: >-
    JKSST Theorem 4.1 derives the classic fixed-arity C0/p bound only under a
    uniform selected-point height/global-minimal-discriminant comparison,
    Lang's conjecture, an approximate random-image/sampling model, and the
    good-reduction/subgroup/useful-relation correspondence. Bounded cofactor and
    a history-uniform adaptive-hazard bridge are additionally needed for the
    full waiting-time conclusion. The program's rank 0-11 and Q(2^{1/3}) panels
    retain their finite measured scope (CZLIFT round 2026-10-23: H-CZLIFT-9a32e9,
    -cb95b8, -27a184 weakened; two run sets inadmissible). Together these obstruct
    the historical construction under its complete premise chain and the tested
    families; they do not cover every selected-lift rule over Q or bounded-degree K.
  revisit_when: >-
    one explicit prime-field lift family either composes the selected-lift,
    minimal-discriminant height, Mordell-Weil packing, good-reduction/subgroup,
    nonzero-denominator, bounded-cofactor, and adaptive-hazard bridges, or
    falsifies one of them; alternatively, an exact dependent-lift finder
    (RQ-XEDN-3bfe2e) hits prescribed residues with every setup and certificate
    cost charged below p^{1/2}
best_measured: >-
  toy: small points reduce like uniform points; xedni dependence never seen within relation
  bound 6 (planted dependence detected)
next_action: {from_revisit_when: true}
