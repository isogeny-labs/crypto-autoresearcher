id: LEAD-TRF-mov-small-embedding-degree
family: transfer
title: MOV / Frey-Rueck pairing transfer of the ECDLP to F_{p^k}^* for small embedding degree
  k
mechanism: >-
  The Weil or Tate pairing with an independent N-torsion point maps <P> injectively into mu_N
  in F_{p^k}^*, where k = ord_N(p) is the embedding degree; the DLP then falls to finite-field
  index calculus / (ex)TNFS, subexponential in p^k. It helps only when k is small (supersingular
  k<=6, pairing-friendly families, CM constructions).
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    k = ord_N(p) is a function of (N, p) alone, hence an isogeny-class invariant (no walk
    lowers it), and for random prime-field curves it is of size ~N (Balasubramanian-Koblitz);
    the transfer is a curve check, not an ECDLP algorithm. Scope: ordinary and supersingular
    curves over any finite field; the target-field cost is a separate lead (LEAD-TRF-pairing-target-field-recost).
  revisit_when: >-
    a deployed curve is found with small k (an audit hit), or a construction yields a subgroup
    of prime order N with k << log-size where finite-field DLP beats rho
best_measured: no ECDLP row; scoping lane RQ-PAIR-21313f has toy pairing checks specified,
  zero runs
