id: LEAD-TRF-odd-char-descent-smith-quartic
family: transfer
title: >-
  Odd-characteristic Weil descent onto genus 3, then Smith's isogeny to a plane quartic and
  Diem's q^{4/3} attack
mechanism: >-
  Descend E/F_{q^3} to a genus-3 hyperelliptic curve over F_q, map it by Smith's (Z/2)^3 isogeny
  to a non-hyperelliptic plane quartic, and run Diem's double-large-prime index calculus at
  O~(q^{4/3}) instead of rho's q^{3/2}.
disposition: open_blocked
next_action:
  step: >-
    Implement Smith's Props. 2 and 4 / the trigonal construction and test F_q-rationality
    and non-degeneracy on the odd-characteristic genus-3 descents already enumerated.
  discriminates: >-
    Rational, non-degenerate Smith images give an executable q^{4/3} route on that class (then
    measure against matched rho with the isogeny walk charged); failure closes the pipeline.
    The characteristic-2 version is already closed (Smith excludes char 2, 3).
  blocked_by: >-
    crypto problems/ghs-to-smith-pipeline-characteristic-mismatch.md (Smith construction not
    implemented)
best_measured: >-
  toy plane-quartic IC on the GHS quartic: S = 6.5e5 to 3.8e7 ops/sqrt(l) at q = 5..11 (correctness
  only, 90/90)
