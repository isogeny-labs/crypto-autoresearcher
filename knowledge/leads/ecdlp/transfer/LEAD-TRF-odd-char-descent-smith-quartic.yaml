id: LEAD-TRF-odd-char-descent-smith-quartic
family: transfer
title: >-
  Odd-characteristic Weil descent onto genus 3, then Smith's isogeny to a plane quartic and
  Diem's q^{4/3} attack
mechanism: >-
  Descend E/F_{q^3} to a genus-3 hyperelliptic curve over F_q, map it by Smith's (Z/2)^3 isogeny
  to a non-hyperelliptic plane quartic, and run Diem's double-large-prime index calculus at
  O~(q^{4/3}) instead of rho's q^{3/2}.
disposition: open_blocked
next_action:
  step: >-
    Start from a completed Joux--Vitse descended model with a passing rational tractable subgroup,
    construct its Smith trigonal quotient and executable maps, and check smoothness, actual kernel,
    dual composition and equality of L-polynomials. Then source-verify a mapped one-target solve
    against matched rho with every transfer cost charged. Treat N4-v2 as a separate direct route
    unless a certified overlap is first constructed: Joux--Vitse uses (m,r)=(3,5), whereas the
    measured N4-v2 family is m=2 only.
  discriminates: >-
    A checked quotient and source-verified solve gives an executable route on that exact class.
    Failure of quotient/map construction on a frozen cohort is a bounded negative for that cohort,
    not a theorem about all odd-characteristic descents. The direct m=2 N4-v2 cost cannot rank the
    distinct (3,5) Joux--Vitse composition. Smith's stated construction remains exactly unavailable
    in characteristics 2 and 3.
  blocked_by: >-
    crypto problems/odd-isogeny-quartic-transfer-execution.md (quotient/map construction and
    Smith-negative holdout remain incomplete)
best_measured: >-
  Proposition 2/4 testing is complete on the p=7..31 Joux--Vitse descent cohort: every descended H
  has a rational tractable subgroup and 0.53--0.61 have `full_success`. The quotient/map composition
  is still unconstructed. Separately, on its direct m=2 non-hyperelliptic GHS-weak family, N4-v2's
  double-large-prime arm is below negation rho from q=991 and reaches 0.004--0.005x at the top toy
  sizes; this is not a cost comparison for the (3,5) Joux--Vitse route.
