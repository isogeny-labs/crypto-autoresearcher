id: LEAD-TRF-jv-sieve-fp6-weak-class
family: transfer
title: >-
  Joux-Vitse cover-and-decomposition sieve on the weak class of E(F_{p^6}) (genus-3 cover),
  with the isogeny walk into the class
mechanism: >-
  Curves over F_{p^6} with full rational 2-torsion whose class contains a weak curve admit
  a genus-3 cover over F_{p^2}; the JV sieve collects relations there at a cost that, in the
  historical runs, fell far below a strong rho on the same instances.
disposition: open_next_step
next_action:
  step: >-
    Freeze a paired line-search-on-sieve protocol on V2's p in {1009,1511,1823}, seeds 17-32,
    --stop 64 sparse instances. Require the plain arm to reproduce V2 exactly; pre-register the
    search size or the chi(h) table rule and charge it in full; emit F_p additions and pair
    selection; price both arms in bitop/v1 against matched strong rho across the section 5a
    band; charge the isogeny walk into the weak class; and produce VALIDATION.json. Freeze the
    positive-control tolerance and rho A/A rule before data.
  discriminates: >-
    Ratios below one across the 0/0.1/1 band with controls accepted would validate the weak-class
    transfer row and show whether line selection improves the actual sieve frontier. A null or
    loss rejects only that frozen search rule, not the base sieve, a large-prime arm, another
    F_p subline or a differently charged search. The red-team n=4096 pilot is exploratory and
    unfrozen; it is not evidence for this discriminator.
best_measured: >-
  historical, comparison withheld: sieve/strong-rho S ratio 0.0042 [0.0032, 0.0058] at log2
  l = 63.0 (p = 1823); e2e incl. walk 0.011 x pooled rho at p = 1511
