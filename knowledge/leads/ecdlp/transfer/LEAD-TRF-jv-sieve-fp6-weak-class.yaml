id: LEAD-TRF-jv-sieve-fp6-weak-class
family: transfer
title: >-
  Joux-Vitse cover-and-decomposition sieve on the weak class of E(F_{p^6}) (genus-3 cover),
  with the isogeny walk into the class
mechanism: >-
  Curves over F_{p^6} with full rational 2-torsion whose class contains a weak curve admit
  a genus-3 cover over F_{p^2}; the JV sieve collects relations there at a cost that, in the
  historical runs, fell far below a strong rho on the same instances.
disposition: open_next_step
next_action:
  step: >-
    Freeze numeric acceptance tolerances for the positive control (R0 S) and the rho A/A rule,
    then re-run the paired sieve vs strong-rho panel at p in {1009, 1511, 1823} with the corrected
    hash accounting, the F4/linear-algebra additions emitted, and the isogeny walk into the
    weak class charged, producing VALIDATION.json.
  discriminates: >-
    Ratios below one across the 0/0.1/1 GAE band with controls accepted would make this the
    program's first validated sub-rho transfer row (weak class only, not prime order); ratios
    that move above one once the walk and hashes are charged would close it as an accounting
    artefact.
best_measured: >-
  historical, comparison withheld: sieve/strong-rho S ratio 0.0042 [0.0032, 0.0058] at log2
  l = 63.0 (p = 1823); e2e incl. walk 0.011 x pooled rho at p = 1511
