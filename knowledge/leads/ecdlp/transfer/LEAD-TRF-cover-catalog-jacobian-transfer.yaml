id: LEAD-TRF-cover-catalog-jacobian-transfer
family: transfer
title: >-
  Catalogued cover maps (1,940 prime quadratic pullbacks, 160 binary cubic pullbacks): executable
  pushforward and subgroup recovery
mechanism: >-
  The cover catalog lists explicit maps H -> E; executable Jacobian arithmetic, norm maps
  and subgroup certificates would let any future destination algorithm on H be tested as an
  ECDLP transfer on the named 2,100-map family cohort and its 664 linked EC1 representations
  (530 prime-family and 134 binary-family bindings).
disposition: open_blocked
next_action:
  step: >-
    Independently check the implemented arbitrary-class binary norm, replay representative
    independence, the group law and phi_* phi^* = [3] over all 160 exact binary catalog rows,
    and retain explicit unsupported cases. Mirror the generalized path in cryptanalysis.
    Separately build the still-missing even-degree odd-characteristic Mumford/map backend.
  discriminates: >-
    Agreement with an independent divisor-map oracle and all-row replay admits the binary map
    boundary; a checked counterexample narrows or rejects only that implementation. Resource or
    mirror failures are operational and do not refute the norm or the transfer lead.
  blocked_by: >-
    crypto problems/prime-cover-balanced-jacobian-and-induced-maps-missing.md;
    problems/binary-cover-arbitrary-jacobian-norm-missing.md (independent/cross-repo evidence);
    problems/catalog-cover-subgroup-certificates-incomplete.md
best_measured: >-
  The named cohorts contain 1,940 prime quadratic plus 160 binary cubic maps and 530 plus 134
  linked EC1 bindings. The arbitrary reduced-class binary norm is implemented for checked
  fields/models and exercised on the exhaustive GF(8) fixture plus a pinned n=83 image, but its
  independent oracle and 160-row replay remain open; the prime balanced-Jacobian backend remains
  missing.
