id: LEAD-TRF-teske-secret-isogeny-trapdoor
family: transfer
title: >-
  Teske-style trapdoor on ordinary prime-field curves: a secret isogeny to an endpoint with
  a non-invariant ECDLP weakness
mechanism: >-
  Teske's binary trapdoor hides a GHS-weak curve behind a secret isogeny. Over F_p, the analogue
  needs a weakness that varies inside one isogeny class (Semaev/factor-base yield, Macaulay
  degrees, conductor level) and is not publicly recognisable.
disposition: open_next_step
next_action:
  step: >-
    Re-run the approved 20-arm panel EXP-ECTD-0cf008 (H-ECTD-e88346: crater/floor pairs with
    conductor steps 8209 and 131101, native vs random factor bases, verified arity-3 relation
    occupancy); every trial of run-20261016T0409Z died with psutil_import_missing. ALSO (merged
    from LEAD-STR-secret-isogeny-trapdoor): Discharge the proof obligation in IDEA-20260805-4243e6
    / IDEA-20260808-5ee6b4. It claims the class has about h(O) = p^{1/2+o(1)} members, so
    a secret path holds at most (1/2) log2 p bits. Enumerating or walking the class costs
    about sqrt(N), so the trapdoor holder's advantage over public rho is capped at zero exponent.
    Write it as a reviewed derivation that names its cost model for testing endpoint weakness
    (c_test).
  discriminates: >-
    Both floor/crater ratios beyond 20% with 99% intervals excluding one would be the first
    non-invariant meter and reopen trapdoor costing; ratios consistent with one, as the isogeny-fibre
    pullback theorem predicts, close the IC-meter half at toy scale.
best_measured: >-
  40-bit N: five classes homogeneous (EV-ECTD-8c098d, weaken); vertical screen meter constant
  (0,0,0,14,2), invalid
