id: LEAD-TRF-function-field-xedni-lift
family: transfer
title: >-
  Function-field xedni: lift relations to sections of elliptic surfaces y^2 = x^3 + a(t)x
  + b(t) over F_p(t)
mechanism: >-
  Replace Q by F_p(t): fibre points become values of low-degree integral sections of a rational
  elliptic surface, where heights are degrees and the Mordell-Weil lattice is E8-like; if
  a target point lies on a low-degree section with probability p^{-alpha}, alpha < 1/2, sections
  give an ECDLP relation source.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    Exact closed form for the frozen family: P_lift(p) = (1 - 2/p + p^{-3})/(2 p^3), so alpha
    = 3 (finite-size exponents 2.986-2.997); relation coefficients stay at max|coeff| = 1
    but later audits show that value is forced by the lattice (norm-2 vectors at support 3),
    so the coefficient census carried no discriminating power. Scope: deg b <= 10, deg a <=
    4, sections deg x <= 3, p <= 31.
  revisit_when: >-
    a section shape with prescribed-fibre lift probability exponent below 1/2, derived before
    measurement
best_measured: >-
  P_lift exponent alpha = 3 exactly (H-XEDN-001 rejected_scoped); max|coeff| = 1 at p in {7,13,19,31}
next_action: {from_revisit_when: true}
evidence:
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-XEDN-001.yaml
  note: exact closed form for P_lift, contradicts alpha < 1/2
