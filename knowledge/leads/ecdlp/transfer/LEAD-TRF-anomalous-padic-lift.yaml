id: LEAD-TRF-anomalous-padic-lift
family: transfer
title: Smart / Satoh-Araki / Semaev p-adic lift for anomalous (trace one) curves
mechanism: >-
  When #E(F_p) = p, lifting to E(Q_p) and applying the formal logarithm turns the ECDLP into
  a linear problem in Z_p (polynomial time). The lift must be a random (non-canonical) one:
  on the Serre-Tate canonical lift the attack degenerates.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Works exactly on trace-one curves, which are an isogeny-class invariant (#E = p) and absent
    from generic or standard curves. The program reproduced it (Smart certificate p = 771853
    in EXP-IT-001) and re-derived the canonical-lift degeneracy (H-CZLIFT-889c9d supported, toy, KN-FIND-3c7e19).
  revisit_when: 'never for generic curves; only as a positive control or for a curve with
    #E = p'
best_measured: >-
  Smart certificate at p = 771853: C_special 157 vs matched rho 779 (ratio 0.202), positive
  control only
