id: LEAD-TRF-cm-canonical-lift-heights
family: transfer
title: >-
  Serre-Tate canonical lift with CM: does the CM order shrink the heights of lifted points
  enough for xedni to bite?
mechanism: >-
  The canonical lift of an ordinary curve is a CM curve whose Mordell-Weil group is an O-module;
  CM might halve the needed points, pin the rank by an L-value or give a structured family
  of lifts, changing the specific height quantity that kills xedni.
disposition: closed_obstructed
obstruction:
  kind: cost_model
  statement: >-
    As corrected by CORR-20260810-930c42 and DEC-20260810-3110d5, lane L9
    closes only ordinary prime-field Serre-Tate/global CM models, fixed arity
    2..9 with absolute C0, and its twelve enumerated mechanisms. Four
    target-independent point-lifting routes choose a p^{o(1)} output set S
    before Q, so Pr[Q in red(S)] <= |S|/N = p^{-1+o(1)}; every CM coefficient-set
    enlargement in scope is a function of fixed C0 and arity, leaving the
    instance-count exponent 1 versus rho's 1/2. For generic |D|, writing the
    canonical lift through the Hilbert/ring class polynomial has degree
    |D|^{1/2+o(1)}, a separate rho-scale setup/space gate. This does not cover
    the target-dependent arbitrary set-section, growing arity or C0,
    non-enumerated lift families, or the false universal norm-form-gap claim.
  revisit_when: >-
    a target-dependent CM point section with fully charged sub-rho construction
    cost, a growing-arity/C0 regime that changes the instance-count exponent,
    a mechanism outside the twelve audited L9 families, or a superseding
    decision showing that the target-independence/constant-coefficient argument
    fails in its declared scope
best_measured: one run (EXP-CANL-96b0ad, doubling-denominator check); no attack metric
