id: LEAD-TRF-odd-prime-ghs-cover-floor
family: transfer
title: Odd-characteristic GHS cover genus floors at prime extension degree and their isogeny-class reach
mechanism: >-
  Enumerate Frobenius-orbit branch configurations and cyclic F_2 modules for
  E/F_(q^n), odd q and prime n, to find low-genus Weil-descent covers; then
  test which elliptic isogeny classes contain a curve with such a cover.
disposition: open_next_step
next_action:
  step: >-
    Run the approved n=7 EXP-PEXT-212d5c plan with its Lean finite lemmas,
    exhaustive placement spectrum, q=3 stratified controls and q=3,5,7
    census; independently check the stated 2-torsion floors and account for
    isogeny-walk cost before any attack-cost claim.
  discriminates: >-
    A kernel-checked finite lemma and controlled census would establish the
    genus floor within the stated GHS cover construction. A counterexample
    changes that floor. Either outcome leaves generic n and an efficient
    isogeny-class transfer unproved.
