id: LEAD-TRF-odd-prime-ghs-cover-floor
family: transfer
title: Odd-characteristic GHS cover genus floors at prime extension degree and their isogeny-class reach
mechanism: >-
  Enumerate Frobenius-orbit branch configurations and cyclic F_2 modules for
  E/F_(q^n), odd q and prime n, to find low-genus Weil-descent covers; then
  test which elliptic isogeny classes contain a curve with such a cover.
disposition: open_next_step
next_action:
  step: >-
    Run the approved n=7 EXP-PEXT-212d5c plan only after the ready command repair is claimed
    and a checkpoint-upload credential is configured; every prior stop preceded validated
    output. Per DEC-20261031-dcfdee, run EXP-PEXT-0b2c75 alone and apart from, or only after,
    212d5c; it remains unrun.
    Independently check the finite torsion lemmas and charge isogeny-walk cost before any
    attack-cost inference.
  discriminates: >-
    A kernel-checked finite lemma and controlled census would establish the
    genus floor within the stated GHS cover construction. A counterexample
    changes that floor. The 4-torsion experiment can refute its candidate law but a clean
    finite grid is not a proof. Either outcome leaves generic n and an efficient
    isogeny-class transfer unproved; approval, refusal or an unrun arm is neutral.
