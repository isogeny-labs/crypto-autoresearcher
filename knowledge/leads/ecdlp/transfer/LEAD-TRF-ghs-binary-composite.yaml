id: LEAD-TRF-ghs-binary-composite
family: transfer
title: >-
  GHS / generalized GHS Weil descent (with Galbraith-Hess-Smart isogeny walks) for curves
  over F_{2^N}, N composite
mechanism: >-
  Weil descent maps E(F_{q^n}) into the Jacobian of a hyperelliptic (or general) curve of
  small genus over F_q, where index calculus is subexponential; isogeny walks move a curve
  into the vulnerable part of its class. Weak for N = 5l, 210, partially 3l, 6l, 7l, 8l.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Menezes-Teske-Weng / Menezes-Teske: N prime is not weak; all NIST/SEC binary curves use
    prime N, and subfield curves are not weakened. Composite-N standards (Oakley Groups 3/4,
    ANSI c2pnb*) are known literature cases; the program re-derived magic numbers and genera
    exactly (jacobian_transfer_scan) and densities on toy fields, but never ran a higher-genus
    GHS solve.
  revisit_when: >-
    an end-to-end measured row is wanted for Oakley Group 3/4 or c2pnb176w1 (needs a genus-15
    / genus-127 Jacobian IC solver)
best_measured: >-
  formula only: Oakley Group 4 log2 ratio +10.9 (formula_advantage), Oakley Group 3 +1.1 (marginal);
  no measured GHS solve
