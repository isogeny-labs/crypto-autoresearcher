id: LEAD-TRF-jv-nagao-genus2-cover-decomp
family: transfer
title: >-
  Nagao decomposition on the genus-3 JV cover of E(F_{p^6}) over F_{p^2}
  (examples/jv_cover.rs), with F4 and sparse-FGLM engineering
mechanism: >-
  Each relation is one Nagao decomposition test solved by F4 then a linear stage; engineering
  (sparse FGLM, F5 signatures, large-prime variation) lowers the per-test cost and S/rho.
disposition: closed_dominated
obstruction:
  kind: measured
  statement: >-
    On nine weak-class instances at p in {1301,1451,1601}, a fully charged best-of-65536
    factor-base-line search lowers the Nagao-only arm by 1.705x, but the arm remains 83-100x
    costlier than the in-tree JV sieve (21-25x against the sieve's additions/lookups-inclusive
    S+). In the like-for-like U2 multiplication unit it remains 1.900/1.585/1.318x rho. The
    apparent U1 crossing prices a schoolbook rho and omits the cover's F_p additions, so it is
    a lower bound and is not rankable under the complete-cost rule. This is domination of the
    measured Nagao arm, not a lower bound on every cover or decomposition successor.
  revisit_when: >-
    the sieve row fails validation, a large-prime variation for the Nagao route is built, or
    another fully charged mechanism closes the measured 83-100x frontier gap
best_measured: >-
  The validated best-line panel lowers the Nagao-only arm to 0.5865 [0.530,0.650] of its plain
  cost, a 1.705x gain, on all nine weak-class cells. It is still 83-100x costlier than the JV
  sieve; U2/rho is 1.900/1.585/1.318 at p=1301/1451/1601. U1 is an incomplete lower-bound
  comparison because F_p additions are not emitted.
