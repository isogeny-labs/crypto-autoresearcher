id: LEAD-TRF-miller-cocycle-nonhom-transfer
family: transfer
title: >-
  Non-homomorphic transfers into F_p^* when the pairing is trivial: Miller-cocycle primitive
  U, zeta-defect, generalized Jacobians
mechanism: >-
  With gcd(N, p-1) = 1 the Tate pairing is trivial, but the Miller function f_{N,P} yields
  a canonical map U(R) = f(R)^{1/N} whose coboundary is the line-function cocycle; if log
  U(kP) carried structure in k (prefix sums of log(x_P - x_{iP})) it would be a cheap non-homomorphic
  transfer into F_p^*.
disposition: open_unexamined
next_action:
  step: >-
    Test H1 of IDEA-20261017-e3a6f1 at toy size: equidistribution of ell(k) = log_g U(kP)
    in Z/(p-1), Smart-ratio success and correlation with characters of Z/N, on special and
    matched random p, with planted-structure positive control.
  discriminates: >-
    Equidistribution at the 1/p rate closes the lead (a non-homomorphic map of this kind is
    a hash); any character correlation would be the first one-point transfer signal and needs
    the full cost accounting.
