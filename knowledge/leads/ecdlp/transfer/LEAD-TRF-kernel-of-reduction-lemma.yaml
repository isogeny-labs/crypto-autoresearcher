id: LEAD-TRF-kernel-of-reduction-lemma
family: transfer
title: Kernel-of-reduction lemma - a short kernel vector of a lift to characteristic zero is a discrete
  log, in any ring and rank
mechanism: Let L be a finitely generated group of global points (E(Q), E(K), E(F_p(t)) or the span of
  an explicit family) with reduction or specialisation homomorphism red onto G = Z/N, and K = ker(red).
  A lift of the ECDLP wants short vectors of K or of the coset red^(-1)(Q). The lemma states that for
  any rank at least 2 a kernel vector of prescribed support on two coordinates whose images are P and
  Q returns k in O(1) calls, so finding it is DL-hard; lattice reduction cannot find K without the logs
  because K is defined by them.
disposition: open_next_step
next_action:
  step: Write the lemma with the p-adic formal-group channel of anomalous curves excluded explicitly,
    then run the designed test. The Z arm replicates the kernel-height floor of EV-CZLIFT-376eee over
    the whole seven-curve ladder (the 0.91 figure comes from the rank-4 curve 234446a1; the floor does
    not bind on 37a1 or 389a1). The F_p(t) arm reads the kernel floor at a prescribed fibre, not as a
    minimum over fibres (h = 2 + 2(s.O) makes the minimum over fibres at least 4 by theorem), with an
    omega-equivariant random-homomorphism control because the real map is equivariant for p = 1 mod 3.
  discriminates: 'Expected: the floor is not inherited at a prescribed fibre and the lattice-index scaling
    (p^(2/r)) is, which means the coverage excess is ring-specific and useless to an attacker in both
    rings; this collapses the revisit_when clauses of five leads into one obstruction. A kernel vector
    found below meet-in-the-middle without the discrete log, in any ring, is a real lead.'
