id: LEAD-TRF-small-genus-cover-general
family: transfer
title: >-
  Find small-genus GHS/Kummer covers beyond the Joux-Vitse weak class (other configurations
  over F_{q^3}, F_{p^k} with k = 6, 10, 14)
mechanism: >-
  If curves outside the JV class, or over other extension degrees, had covers of genus <=
  3 (or genus g with q^{2-2/g} below rho), the cover attack would extend to more of the curve
  population.
disposition: open_next_step
obstruction:
  kind: proof
  statement: >-
    Riemann-Hurwitz census g = 1 - 2^m + 2^{m-2} R: among 2-torsion Kummer covers of E/F_{q^3}
    only the JV configuration gives g <= 3 (others g in {1, 7, 9, 13}); for E/GF(p^k) with
    F_p(j) = GF(p^k) every GHS cover has genus >= 9, 49, 41 at k = 6, 10, 14, which repriced
    247 of 846 cover_descent rows down to marginal/boundary. Scope: Kummer/GHS covers of the
    x-line in odd characteristic.
  revisit_when: >-
    a non-Kummer cover family (Hess Artin-Schreier analogue, non-x-line function) is constructed
    in odd characteristic
best_measured: >-
  genus floors 9 / 49 / 41 at k = 6 / 10 / 14; 599 of 846 cover_descent rows remain formula_advantage
  at the floor
next_action: {from_revisit_when: true}
