id: LEAD-TRF-second-torsion-direction
family: transfer
title: >-
  Reach a second N-torsion direction: nonequivariant trace-zero transfer, Kani/Robert graph
  kernels, Richelot gluing of E with E'
mechanism: >-
  Move the rational N-torsion line into a Frobenius-nontrivial direction (trace-zero variety
  T_k(E)) or build an (N,N) graph kernel in E x E' to embed into a principally polarised surface
  (Castryck-Decru / Robert machinery), then decompose or walk there.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Balasubramanian-Koblitz: for N || #E(F_p), N != p, E(F_{p^k})[N] is larger than the rational
    line iff N | p^k - 1, i.e. the embedding degree divides k. Hence for the embedding degree not dividing k,
    T_k(E)[N] = 0 (trace acts as [k] on the rational line), and an F_p-rational graph-type
    (N,N) kernel exists only when k_emb = 1; both reduce to MOV. Scope: ordinary and supersingular
    curves over F_p, prime N.
  revisit_when: >-
    a non-group-theoretic correspondence (not a homomorphism on N-torsion) with verified scalar
    compatibility is exhibited
