id: LEAD-TRF-prime-field-isogeny-to-weak
family: transfer
title: >-
  Isogeny transfer of a prime-field ECDLP to a weaker curve (anomalous, low embedding degree,
  descent-friendly) in the same class
mechanism: >-
  A coprime-degree isogeny transports logs exactly; if a short path led from a generic curve
  to a special one, the special-curve attack plus the path cost could beat rho.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Tate: ordinary curves over F_p are F_p-isogenous iff they have the same #E(F_p); trace
    one and k = ord_N(p) are functions of #E and p, and prime fields admit no GHS descent,
    so the special set inside a generic class is empty at every size (EV-IT-511f3d). Scope:
    prime fields, ordinary or supersingular classes. Over composite-degree binary fields descent
    weakness is NOT class-invariant (see LEAD-TRF-ghs-binary-composite).
  revisit_when: >-
    a prime-field weakness is found that is not a function of (#E, p) (that is the ECTD lead)
best_measured: rho_special = 0 at 20 (exhaustive), 24 and 28 bits (EXP-IT-001)
