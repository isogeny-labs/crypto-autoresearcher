id: LEAD-TRF-weil-restriction-jacobian-class
family: transfer
title: Genus-n Jacobians in the isogeny class of a Weil-restricted elliptic curve
mechanism: >-
  Search for a genus-n curve C/F_q whose Jacobian is isogenous to
  Res_(F_(q^n)/F_q) E, including classes missed by the explicit GHS x-line
  cover. Existence alone supplies no computable DLP transfer.
disposition: open_next_step
next_action:
  step: >-
    Design and run the proposed n=2 control and exhaustive n=3 point-count
    census for q=2,3, with fixed-seed higher-q samples, then require an
    explicit F_q-isogeny of controlled degree before pricing any DLP route.
  discriminates: >-
    A missing irreducible {t,-t} class refutes the stated genus-3 existence
    prediction. Complete hits support that bounded claim only; they do not
    establish a transfer map, its cost, or the general-prime density heuristic.
best_measured: 'none: proposal only; no n=3 class census or transfer map validated'
