id: LEAD-ICE-quadratised-chain-representation
family: ic-engine
title: >-
  Quadratised chain representations of the binary point decomposition (line norm form mu = e2,
  generic w = x_a x_b, implied trace equations) against the cubic chained S_3 system
mechanism: >-
  Per merge P_a + P_b = U of a chained decomposition, the line through P_a, P_b, -U gives
  e1 = lambda^2 + lambda + a, e2 = mu, e3 = mu^2 + b. Keeping mu = e2 as an auxiliary turns
  the cubic S_3(x_a, x_b, x_U) into two quadratic equations, so the Weil-descended chain has
  degree 2 at every m instead of 3; lambda adds the trace equation Tr(x_a + x_b + x_U + a) = 0.
  The claim to test is that this geometric quadratisation (or the explicit trace equations)
  lowers the refutation degree beyond what a structureless quadratisation w = x_a x_b gives.
disposition: open_next_step
next_action:
  step: >-
    Four-arm refutation (closure) degree cell on identical draws at (m, l) = (3, 5), (4, 5),
    (4, 6) on toy binary curves n in {17, 19, 23}: chained S_3 (cubic), generic quadratisation
    w = x_a x_b (confound control), mu = e2 quadratisation, and chained S_3 plus the implied
    linear trace equations; unsatisfiable and planted-satisfiable draws in every arm, systems
    exported by research/representation_leads_20261109/derive (protocol drafted there).
  discriminates: >-
    mu = e2 or the trace equations closing at a lower degree than the generic quadratisation on
    the unsatisfiable draws is a representation effect worth pricing at m >= 5; equal closure
    degree means the geometric form is a relabelled generic degree reduction and the lead closes.
