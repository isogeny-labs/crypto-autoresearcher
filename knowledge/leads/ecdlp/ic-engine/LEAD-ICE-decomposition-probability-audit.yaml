id: LEAD-ICE-decomposition-probability-audit
family: ic-engine
title: >-
  Decomposition probability P(decomp) vs factor-base size, charged p_solve, and learned decomposability
  predictors
mechanism: >-
  Index calculus consumes expected charged cost per accepted relation, so P(decomp) must be
  measured as an exact integer ratio with failures charged, not a sampled scalar. The mean
  is fixed by yield conservation; only the per-target distribution, clustering and charging
  remain. Learned predictors (GNN, symbolic regression, learned search policy) were tried
  as instruments.
disposition: open_next_step
next_action:
  step: >-
    Run BATCH-79a580 (three F-2 28-bit fixtures with P-5 yields, nine F-1 fixtures as control)
    for EXP-RELN-dc761f, reporting the exact count vector c_D and its variance against a size-matched
    random base.
  discriminates: >-
    A target-conditional variance beyond the random-base null names a clustering effect worth
    a targeted collector; no excess confirms KN-FIND-007 to second order and retires the P(decomp)
    lane. Learned predictors: inconclusive x3 at N <= 2^20; the N >= 2^24 reopening test was
    run 2026-10-28 (fb-prime-learned-2p24, local toy scale) and FAILED for a = -3 cofactor-1
    prime curves at rho = 1/16, m = 2 and 3, N = 2^24..2^26: held-out gain over a size-matched
    random base +0.00001 bits [-0.00022, +0.00021] (A/A seed +0.00031 [+0.00009, +0.00057]),
    oracle headroom 0.0011 bits, so there is nothing to select (mean yield is size-only).
    Learned predictors reopen now only for what that test did not cover: rho = 1/4 and 1,
    N > 2^26, other curve shapes or cofactors > 1 (positive control only), or a per-target
    (not mean-yield) statistic. The per-target variance batch BATCH-79a580 is a different
    statistic and is unchanged.
