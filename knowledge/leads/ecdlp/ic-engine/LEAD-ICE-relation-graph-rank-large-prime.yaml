id: LEAD-ICE-relation-graph-rank-large-prime
family: ic-engine
title: >-
  Relation-stage rank accounting, large-prime / cycle-basis enrichment and rank-aware collection
mechanism: >-
  Count independent rather than raw relations, harvest one or two large primes and enrich
  by the graphic-matroid cycle basis, select generators by rank feedback, and stop adaptively
  on the 2-core. These lower the relations needed or the cost per informative row, a constant
  or mid-exponent effect on the relation phase.
disposition: open_next_step
next_action:
  step: >-
    Extend the honest 2LP summation-multigraph run (EXP-RELN-c5a377 v4 exact-x generator,
    B = ceil(p^(1/5)), B2 = ceil(p^(2/5))) to larger p with rank-qualified rows and a
    rewire / Erdos-Renyi null, reporting edge density
    delta against the 1/4 supercritical threshold and whole-solve S against matched rho.
  discriminates: >-
    delta > 1/4 with a whole-solve S drop beyond the null is a priced relation-phase gain
    (as in the genus-3 2LP study). Delta below 1/4 exhausts only the frozen exact-x generator,
    B/B2 schedule and reached sizes. Full-column-rank gains are not a substitute for
    the first dependency needed by the tested single-target formulation.
best_measured: >-
  The honest 2LP study is inconclusive at 9/9 toy cells. In the post-hoc MP-ml_empirical-6
  fixed-weight toy, forced-coverage rank steering delays first dependency (0.886B versus
  0.514B at m = 2 and none before full rank at m = 3); that refutes only that policy.
