id: LEAD-ICE-semaev-yield-model-coset-typing
family: ic-engine
title: Semaev yield model (eq. 11, the m! factor) and coset-typed / trace-parity factor bases
mechanism: >-
  Semaev's constant 1.6986 is carried by the m! symmetry of the yield model; coset-typed bases
  (Nagao-style disjoint shifts) trade m! for a typed domain and could raise yield per query
  without raising degree. Eq. (11) overstates decomposition probability; trace-parity confinement
  explains the whole low-degree-window yield deficit.
disposition: open_next_step
next_action:
  step: >-
    Run the in-regime coset-typed solver-degree conservation test (IDEA-20260918-c05e71):
    matched (n, m, k) typed and untyped chains, exact yield plus degree-4 closure refutation
    rate, against random affine-shift nulls (IDEA-20261006-839ced).
  discriminates: >-
    Typed yield near the finite-k cap at unchanged closure degree is a constant-factor (m!)
    gain to price; a degree rise that cancels the yield gain conserves cost and closes the
    coset-typing route.
