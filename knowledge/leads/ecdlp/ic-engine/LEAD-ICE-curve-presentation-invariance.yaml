id: LEAD-ICE-curve-presentation-invariance
family: ic-engine
title: >-
  Does decomposition difficulty change across an isogeny class, curve model or special j (transport
  to an easier presentation)?
mechanism: >-
  Move one ECDLP instance by Velu isogeny, change of model (Weierstrass, Edwards, Montgomery,
  Hessian) or to a special-j / small-height curve, and look for a presentation whose Semaev
  system has lower first-fall / solving degree or higher yield. Mean length-2 yield and factor-base
  decomposition probability are class invariants; the within-class variance claim was rejected
  at scope. The first registered Groebner-degree edge run completed as a degenerate unit ideal
  and therefore gives no information about a nontrivial presentation.
disposition: open_next_step
next_action:
  step: >-
    Freeze a certified successor edge whose native and codomain decomposition ideals are
    non-unit, so it satisfies EXP-DREG-c3e8c9's prerequisite that excludes
    `degenerate-unit-ideal`. Then compare its native, Velu-graph-eliminated and frozen
    random-enrichment ideals, and add one special-model curve against a generic classmate.
  discriminates: >-
    A drop beyond random enrichment and beyond a GL(N,F_2) coordinate change is a transport
    effect to price. A registered no-drop result would close only the frozen presentations,
    edges and toy scale. Another unit ideal remains non-informative. The existing finite
    witnesses refute the simulator lemma as written, not every corrected transport theorem
    and not the presentation lead.
best_measured: >-
  Binary Koblitz m=3 (PinX3, 2^(l+1) eliminations per probe; not an attack, overall about 2^(2n/3),
  worse than rho), 32 curves x 32 geometric V, 2000 probes per cell, two-way crossed random effects,
  curve-bootstrap 95% CI, preregistered H0 if every metric's upper bound < 0.05. n=31 a2=0 l=10:
  work/call ICC_curve 0.000 [0, 0.001], yield 0.006 [0, 0.020]. n=23 a2=1 l=8: work/call 0.005
  [0, 0.022], yield 0.015 [0, 0.039]. H0 in both classes. Detection limit (parametric power
  simulation): ICC 0.20 found with p about 0.99, ICC 0.10 only p about 0.42. Scoped to geometric
  V and these two classes; not a proof. RUN-DREG-826fb8 used one F_4 edge and eight Boolean
  variables: domain and codomain ranks were both [0,1,9,40,114], but both Groebner bases were
  {1}. Its registered label is `degenerate-unit-ideal`, so it supplies no nontrivial-instance
  information. Separately, the R6.8 identity-deleting/arbitrary-lift transport simulator has
  exact finite counterexamples and its closure claim was withdrawn.
