id: LEAD-ICE-curve-presentation-invariance
family: ic-engine
title: >-
  Does decomposition difficulty change across an isogeny class, curve model or special j (transport
  to an easier presentation)?
mechanism: >-
  Move one ECDLP instance by Velu isogeny, change of model (Weierstrass, Edwards, Montgomery,
  Hessian) or to a special-j / small-height curve, and look for a presentation whose Semaev
  system has lower first-fall / solving degree or higher yield. Mean length-2 yield and factor-base
  decomposition probability are class invariants; the within-class variance claim was rejected
  at scope; Groebner-degree transport on certified Velu edges is specified but never run.
disposition: open_next_step
next_action:
  step: >-
    Execute EXP-DREG-dd668d (spec frozen, runs/ empty): last-fall and grevlex solving degree
    of the native, Velu-graph-eliminated and random-enrichment ideals on certified toy edges
    (H-DREG-c44a0d, H-DREG-1d0e5d), plus one special-model curve vs a generic classmate (IDEA-20260922-fac3e7).
  discriminates: >-
    A drop beyond random enrichment and beyond a GL(N,F_2) coordinate change is a transport
    effect to price (including the transport cost); no drop closes isogeny/model transport
    of Groebner difficulty at toy scale, consistent with the mean-invariance identity.
best_measured: >-
  Binary Koblitz m=3 (PinX3, 2^(l+1) eliminations per probe; not an attack, overall about 2^(2n/3),
  worse than rho), 32 curves x 32 geometric V, 2000 probes per cell, two-way crossed random effects,
  curve-bootstrap 95% CI, preregistered H0 if every metric's upper bound < 0.05. n=31 a2=0 l=10:
  work/call ICC_curve 0.000 [0, 0.001], yield 0.006 [0, 0.020]. n=23 a2=1 l=8: work/call 0.005
  [0, 0.022], yield 0.015 [0, 0.039]. H0 in both classes. Detection limit (parametric power
  simulation): ICC 0.20 found with p about 0.99, ICC 0.10 only p about 0.42. Scoped to geometric
  V and these two classes; not a proof.
