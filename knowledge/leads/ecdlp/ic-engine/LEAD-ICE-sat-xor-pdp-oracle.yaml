id: LEAD-ICE-sat-xor-pdp-oracle
family: ic-engine
title: SAT / native-XOR (CryptoMiniSat, WDSat) point-decomposition oracle with honest pricing
mechanism: >-
  Encode the descended S_3 / S_4 system as CNF-XOR and let a CDCL solver with Gaussian elimination
  find decompositions; the literature reports up to 300x over Magma F4 on the PDP step. Recorded
  group-operation S on n = 17 Koblitz is below strong rho, but SAT conflicts and propagations
  are unpriced, and a derived identity says the pdp CNF-XOR model is a complete enumerator
  of V^m mod S_m with no above-leaf pruning.
disposition: open_next_step
next_action:
  step: >-
    Carry the admitted n=17 price band into a fresh PROTOCOL-4: emit propagations, freeze a
    usable n=23 per-curve base and conflict budget, retain w in {0,0.1,1}, and measure the
    l-ladder/cross-size comparison before fitting alpha(m) at m in {3,4,5}
    (H-SATIC-5c526c). A calibrated point may augment but never replace the mandatory band.
  discriminates: >-
    The n=17,m=2 arm is already not sub-rho across the mandatory band. A control-valid larger
    cell can order only that measured arm when the same direction holds at every band weight;
    a crossing leaves it unresolved. Conflict scaling can support or refute a stated exponent
    model, but no finite cell, budget exit or missing propagation count closes SAT/XOR PDP in
    other arities, presentations or solver models.
best_measured: >-
  n=17,m=2 native-XOR SAT / strong-rho = 0.854, 7.34 and 51.0 at w=0,0.1,1,
  crossing at w*=1/458=2^-8.84; 40/40 pairs verified. Propagations are unrecorded, so the
  true positive-price cost is no smaller; the pair is unresolved inside (0,0.1).
