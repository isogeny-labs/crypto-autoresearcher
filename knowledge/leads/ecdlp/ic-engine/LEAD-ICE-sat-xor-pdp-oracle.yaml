  note: >-
    L04 (prime field, m = 3, s = 4..7, 3 curves x 32 targets): exhaustive minimal strong-backdoor
    search with a cap-bounded finite-domain filtering propagator and F_p root finding. Offset (m-1)s
    - B* is 1..3 (cap 2), 3..5 (cap 4), 5..7 (cap 8), i.e. 2*log2(cap) - 1: enumeration moved inside
    the propagator. Supportable: no sub-(m-1)s backdoor under cap-bounded window-branching
    propagation at s <= 7. The propagator is not Gaussian elimination over slope/t variables, B* is
    identical across the 32 targets of a curve (effective n = 3 per cell), and the m = 4 cap-2 upper
    bound fails, so it does not close the ring-linear propagator question (never run) or exponent
    hopes for SAT.
