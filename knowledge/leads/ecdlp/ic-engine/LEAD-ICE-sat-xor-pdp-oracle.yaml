id: LEAD-ICE-sat-xor-pdp-oracle
family: ic-engine
title: SAT / native-XOR (CryptoMiniSat, WDSat) point-decomposition oracle with honest pricing
mechanism: >-
  Encode the descended S_3 / S_4 system as CNF-XOR and let a CDCL solver with Gaussian elimination
  find decompositions; the literature reports up to 300x over Magma F4 on the PDP step. Recorded
  group-operation S on n = 17 Koblitz is below strong rho, but SAT conflicts and propagations
  are unpriced, and a derived identity says the pdp CNF-XOR model is a complete enumerator
  of V^m mod S_m with no above-leaf pruning.
disposition: open_next_step
next_action:
  step: >-
    Calibrate ns per conflict and per propagation against ns per group addition on the count-qualified-main
    hardware, reprice the native-XOR SAT arm of ecbench_sat_pdp at 0, 0.1 and 1 GAE per solver
    op, and fit alpha(m) of the conflict count at m in {3,4,5} (H-SATIC-5c526c).
  discriminates: >-
    Priced S/rho below 1 across the band would be a sub-rho toy row to send through the validation
    gate; above 1 with conflicts tracking 2^(ml)/m! confirms SAT is enumeration at a constant
    and closes the lead as dominated by the pair table.
best_measured: >-
  native-XOR SAT S/rho 0.854 lower bound, conflicts unpriced, n = 17 Koblitz, 40/40 verified
  (ecbench_sat_pdp count-qualified-main)
