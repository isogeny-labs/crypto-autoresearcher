id: LEAD-ICE-hybrid-guess-determine-l7
family: ic-engine
title: >-
  One-variable specialisation priced as hybrid guess-and-determine on the l = 7 descent cells
mechanism: >-
  dreg_closure_specialise shows that fixing one variable usually brings an l = 7 draw from
  closure degree 5 back to degree 4. The ECC2K-130 m = 4 row depends on that degree (+7.6
  bits over rho at degree 4, +10.3 at degree 5, closed at 6 or more). No study has priced
  the 2^k guessing factor against the degree-5 closure. Crossbred was tried only at m = 2
  and 3 with n = 7 or 9.
disposition: open_next_step
next_action:
  step: >-
    Run the registered stretch cell E8, (m, n, l) = (3, 22, 8): find k* (fixed variables under
    rule R1 until every branch refutes at degree 4), about 10-12 GB and 25 locked minutes
    per branch.
  discriminates: >-
    k* equal to its l = 7 value (<= 2) keeps the constant-k reading alive (ECC2K-130 m = 4
    row +8.43 bits over rho against +10.32 at degree 5); one more guess per l moves it to
    S_lin (+30.7 to +58.3 bits) and closes this lead.
best_measured: >-
  (m, l) = (3, 7), 10 of 10 UNSAT draws refute at degree 4 with k* <= 2 (five at k = 1, five
  at k = 2); hybrid cost 1/116 to 1/3,400 of the projected degree-5 closure. Implied m = 4
  row: +8.43 bits (constant k) or +30.7 to +58.3 (k growing with l); never below the +7.62
  floor.
