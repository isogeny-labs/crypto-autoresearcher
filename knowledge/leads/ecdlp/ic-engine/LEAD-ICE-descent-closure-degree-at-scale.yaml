id: LEAD-ICE-descent-closure-degree-at-scale
family: ic-engine
title: >-
  Does the MutantXL/F4 closure (refutation) degree of descended S_3/S_4 chains stay at 4 as
  l and n grow?
mechanism: >-
  If the solving degree of the Weil-descended decomposition system stays constant (Semaev
  Assumption 1, Petit-Quisquater FFD), each PDP query is polynomial and binary IC becomes
  subexponential. Measured: closure degree 3-4 where XL needs 5-7, flat through (m,l) = (4,6)
  at N = 54, but the degree rises at l = 7 at m = 3. The surviving rule (degree rises at l
  = 7) sets the ECC2K-130 m = 4 price.
disposition: open_blocked
next_action:
  step: >-
    For n=47 random00, use the exact affine trace slice of Proposition 2.5b: the pinned
    subspace has trace-one basis elements, so one Boolean variable can be eliminated without
    changing degree-five closure membership or nonmembership. On that sliced system obtain
    either a checked primal degree-five derivation (or independently replay the retained
    degree-five relation) and transfer it to the original system, proving exact LFD=5 with the
    checked D4 equality, or obtain a checked dual/nonmembership certificate and transfer it,
    proving LFD>=6. The existing unsliced verify_primal_witness.py route remains valid. Do not
    treat projection_kills_one in an over-approximating quotient as either result. In parallel,
    run the frozen dreg_closure C1 and A2/B1/B2 cells on qualified high-memory or sparse
    closure machinery, then (m,l) = (4,7), with satisfiable controls.
  discriminates: >-
    Degree 4 at l = 7 for m = 4 restores the "4, constant" row (2^68.43, still +7.6 bits over
    rho); degree 5 confirms the +10.32-bit optimistic bracket for that cell. An accepted
    degree-five certificate would establish only the registered n = 47 lower bound. Degree
    >= 6 refutes a <=5 claim at the tested cell; it does not prove universal growth or close
    other arities, presentations or sparse solvers. Trace slicing is an exact equivalent
    presentation, not an observed degree or cost improvement. Refusal, timeout, interruption
    and missing output remain non-mathematical.
  blocked_by: >-
    missing checked D5 row provenance or a positive D5 non-membership certificate for n=47
    random00 on either the original or exact trace-sliced presentation, plus memory for C1
    (169 GB cap; 217 GB projection in
    crypto:research/dreg_closure_m4l6_20261018/RESULTS.md)
best_measured: >-
  closure degree 4 through (m,l) = (4,6), N = 54; (3,7) degree-5 closure capped at 169 GB;
  n=47 random00 has checked D4 rank/kernel equality and LFD>=5. Its D5 continuation completed
  at relation rank 187,583/187,583 but ended projection_kills_one without a valid D5 certificate;
  therefore exact LFD=5 versus LFD>=6 remains open;
  ECC2K-130 m = 4 optimistic +10.32 bits over rho (+12.48 with K), derived
