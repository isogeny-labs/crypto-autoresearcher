id: LEAD-ICE-semaev-chain-cost-model
family: ic-engine
title: Chain length t, merge-tree topology and memory charging in Semaev's charged cost
mechanism: >-
  Re-optimising Semaev 2015's cost over chain length t < m, over binary merge-tree topologies,
  or with memory charged against van Oorschot-Wiener was proposed to move the crossover with
  rho. Every binary merge tree has the same auxiliary and equation counts, and t = m is optimal
  under the paper's own model.
disposition: open_next_step
obstruction:
  kind: cost_model
  statement: >-
    Under Semaev 2015's cost model at n in [250, 600], t* = m* at every n under all three
    solving-cost readings, replicated by an independent optimiser (EV-SEMBIN-1d36a3); N =
    (t-2)n + tk is invariant over merge topologies, so charged cost is topology-blind (factor
    <= ~4 from sigma_top); the n = 409 storage indeterminacy is an artefact of the vOW operating
    point (EV-SEMBIN-4125ec).
  revisit_when: >-
    A solver whose degree (not variable count) depends on topology, e.g. the transfer-matrix
    dynamic-programming Groebner variant (IDEA-20261016-7a138a), shows a topology-dependent
    closure degree on measured cells.
best_measured: t* = m* at every n in [250, 600] (EV-SEMBIN-1d36a3, replicated)
next_action: {from_revisit_when: true}
