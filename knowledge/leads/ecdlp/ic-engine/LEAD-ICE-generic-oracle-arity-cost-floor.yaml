- repo: crypto-autoresearcher
  path: docs/reports/leads-round2-20261104/amendments-literature.md
  note: >-
    Literature check 2026-11-04 (scouting amendment A1). Golovnev-Guo-Horel-Park-Vaikuntanathan
    (STOC 2020, pp. 294-307): 3SUM-Indexing over an explicit list in a group with |G| <= N^c,
    with unbounded preprocessing. The only unconditional bound is non-adaptive,
    S = Omega~(N^(1+1/T)), and S^3 T = O~(N^6) refutes the strong conjecture. Kane-Lovett-Moran
    (STOC 2018) rule out query-model proofs. 3SUM-Indexing is Goldstein-Kopelowitz-Lewenstein-Porat
    (WADS 2017). This is context for the oracle-class scope, not an extension of the obstruction.
