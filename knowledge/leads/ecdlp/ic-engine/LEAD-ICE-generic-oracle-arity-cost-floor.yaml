id: LEAD-ICE-generic-oracle-arity-cost-floor
family: ic-engine
title: Fixed-arity ENUM / MITM decomposition-oracle cost floor and the open free-oracle bridge
mechanism: >-
  The frozen fixed-arity model combines mean decomposition yield, B useful relations,
  B^2 linear algebra and an oracle cost B^k. It gives an exact obstruction for its ENUM,
  MITM and MITM_CAPPED classes. A FREE control, growing arity, actual oracle output/rank
  semantics and the uniform model-to-algorithm bridge are separate branches which the
  model does not establish and which remain pursued.
disposition: open_next_step
next_action:
  step: >-
    Preserve the authored and source-archived complete-real-model correction, and run only its
    authorized infrastructure recovery verifier TASK-20261101-caeb64. If machine verification
    succeeds, complete custody/gating under TASK-20261101-48eac4 and the affected-joint semantic
    review before relying on the correction. Separately bind one concrete free- or growing-arity
    candidate to an executable oracle with exact output semantics, yield tails, useful-rank
    stopping, setup, memory, m!-uniformity and complete charged cost.
  discriminates: >-
    A semantically accepted corrected formal model settles only its algebra. A verified candidate with
    complete sub-rho cost would advance the open bridge; a failure closes only that implementation
    and tested schedule. No finite timeout, bounded cell, or model mismatch closes free oracles,
    growing arity, coordinate-reading oracles or the model-to-algorithm bridge.
obstruction:
  kind: cost_model
  statement: >-
    Exact closed subclaim: for ENUM, MITM and MITM_CAPPED in the frozen fixed-arity binary
    model, the replicated v2 census has zero in-domain sub-rho cells (EV-SEMBIN-b6d042).
    In the reviewed real model, the machine-checked declaration mitm_never_sub_generic proves
    costAll(m,beta,k) > 1/2 when m >= 2, beta > 0 and k >= m/2. The independent 2026-11-01
    review also disproved the bundled blanket-attainment and literal pointwise-threshold wording.
    Neither result supplies an algorithm, the yield/rank hypotheses, a growing-arity uniformity
    theorem, or a FREE-oracle/model-to-PFSE bridge. The FREE control has sub-VOW model cells.
  revisit_when: >-
    Revisit the exact ENUM/MITM obstruction if a measured oracle violates one of its yield,
    useful-rank, linear-algebra or B^k-cost premises. Coordinate-reading oracles are tracked by
    LEAD-ICE-descent-closure-degree-at-scale; free and growing-arity schedules remain open here.
    Also: a data-structure or fine-grained bound for kSUM-Indexing
    over an implicitly given set in a group with |G| much larger than any polynomial in the set
    size (outside the |G| <= N^c regime of Golovnev et al., STOC 2020) would extend the wall to
    RAM-model oracles; none is known (literature check 2026-11-04).
best_measured: >-
  Scoped fixed-arity evidence: zero sub-rho ENUM/MITM/MITM_CAPPED cells in EV-SEMBIN-b6d042;
  at m = 3 the ECC2K-130 FREE control costs 2^68.58 versus rho 2^60.81, while the same FREE
  model has 7,850 sub-VOW cells elsewhere and therefore supplies no universal obstruction. The
  additive complete-real-model source is archived, but its first formal receipt has
  verification=null after a 1,800-second build timeout; that is infrastructure evidence only.
