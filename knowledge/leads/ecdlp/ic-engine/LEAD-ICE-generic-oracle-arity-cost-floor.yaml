id: LEAD-ICE-generic-oracle-arity-cost-floor
family: ic-engine
title: Generic (enumerative / MITM / free) decomposition oracles cannot reach rho at any arity
mechanism: >-
  Treat the oracle as an abstract m-SUM search or charge it nothing, and ask whether any arity
  m or base size puts point-decomposition IC below rho. The product law relations x targets
  x oracle = m 2^n is independent of dim V, and the store any sub-rho cell needs costs as
  much as rho's whole walk.
disposition: closed_obstructed
obstruction:
  kind: cost_model
  statement: >-
    For oracles of class ENUM, MITM and MITM_CAPPED on binary curves of prime degree n, the
    replicated v2 cost model has zero in-domain sub-rho cells (EV-SEMBIN-b6d042); on ECC2K-130
    a free oracle at m = 3 still costs 2^68.58 against rho's 2^60.81 (KN-FIND-aa2efc); in-model,
    structured generic-group bounds (CHW 2026/384) and non-adaptive time-space bounds (DKM
    2025/783) give the same wall. Scope: oracles that do not read curve coordinates algebraically;
    the FREE control does have sub-VOW cells, so the obstruction is the oracle class, not
    IC.
  revisit_when: >-
    An oracle that reads coordinates with per-query cost polynomial in n at fixed degree (see
    LEAD-ICE-descent-closure-degree-at-scale) is measured, or a non-generic yield exceeds
    C(B+m-1,m)/N on average. Also: a data-structure or fine-grained bound for kSUM-Indexing
    over an implicitly given set in a group with |G| much larger than any polynomial in the set
    size (outside the |G| <= N^c regime of Golovnev et al., STOC 2020) would extend the wall to
    RAM-model oracles; none is known (literature check 2026-11-04).
best_measured: 'free oracle at m = 3 on ECC2K-130: 2^68.58 vs rho 2^60.81 (KN-FIND-aa2efc)'
evidence:
- repo: crypto-autoresearcher
  path: docs/reports/leads-round2-20261104/amendments-literature.md
  note: >-
    Literature check 2026-11-04 (scouting amendment A1). Golovnev-Guo-Horel-Park-Vaikuntanathan
    (STOC 2020, pp. 294-307): 3SUM-Indexing over an explicit list in a group with |G| <= N^c,
    with unbounded preprocessing. The only unconditional bound is non-adaptive,
    S = Omega~(N^(1+1/T)), and S^3 T = O~(N^6) refutes the strong conjecture. Kane-Lovett-Moran
    (STOC 2018) rule out query-model proofs. 3SUM-Indexing is Goldstein-Kopelowitz-Lewenstein-Porat
    (WADS 2017). This is context for the oracle-class scope, not an extension of the obstruction.
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-SEMBIN-b6d042.yaml
  note: >-
    conditional model-level: zero sub-rho for ENUM/MITM/MITM_CAPPED; FREE has 7,850 cells
    below VOW
- repo: crypto-autoresearcher
