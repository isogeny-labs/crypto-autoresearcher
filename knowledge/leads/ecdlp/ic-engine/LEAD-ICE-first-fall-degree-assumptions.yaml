id: LEAD-ICE-first-fall-degree-assumptions
family: ic-engine
title: >-
  First-fall-degree / Assumption-1 arguments for subexponential binary ECDLP (Semaev 2015,
  Nagao, Petit-Quisquater)
mechanism: >-
  Subexponential claims rest on d_F4 <= 4 (Semaev Assumption 1) or a bounded first fall degree
  invariant under coset shifts (Nagao Prop. 5). The program reproduced Semaev's cells, separated
  four degree notions, showed the fake first fall degree does not bound the true one (Nagao
  Lemma 4 false over F_2) and that FFD can be raised by a linear recombination; the S_3 degree-2
  trace fall lacks a proof that the residual is a new nonzero class.
disposition: open_blocked
next_action:
  step: >-
    The uniform degree-two bridge is refuted in the reviewed finite Boolean model (n = n' = 4,
    x_R = 1: no new class at degree 2, one at degree 3; 2026-10-25 correction, KR-IC-139da0), and the
    corrected-parity replay (68/12) supersedes the fall_profile table. Next: read Kosters-Yeo Sec. 4
    and Hodges-Petit-Schlather in full to record their exact first-fall definition and hypotheses,
    then state, and attempt in Lean, a scoped first-fall theorem under hypotheses the counterexample
    does not violate.
  discriminates: >-
    If the sources' definition or hypotheses exclude the finite counterexample, the reported
    first-fall-2 mechanism stands in that scope and the FFD route keeps its premise there; if they do
    not, the reported uniform first fall at degree 2 is false and the FFD route loses its last uniform
    premise. The at-scale degree question itself lives in LEAD-ICE-descent-closure-degree-at-scale.
  blocked_by: problems/semaev-degree-two-fall-nonzero-bridge.md (crypto-autoresearcher)
