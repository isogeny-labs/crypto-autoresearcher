id: LEAD-ICE-charged-toy-ic-exponent-vs-rho
family: ic-engine
title: One fully charged toy-scale index-calculus exponent vs matched rho (GOAL-ICEX-001 /
  G7)
mechanism: >-
  Aggregate SDEG/MONO/RELN outputs into one complete-cost IC exponent with a matched rho measured
  on the same instances, censoring charged and failures included. Audits found the four-size
  exponent unidentifiable and the 1/2 comparison mis-specified, and enumerative membership,
  not IC itself, is the bottleneck; the non-enumerative oracle is approved but unbuilt.
disposition: open_blocked
next_action:
  step: >-
    Build the EXP-ICEX-153c34 backend (G1 membership, O5 oracle, S/G/X/V counters, admission-refusing
    driver) and pass S0 gates G0-1..G0-6 on smoke curves, then fit the crossover order log
    l* (IDEA-20260805-4d31bc) rather than a ratio exponent.
  discriminates: >-
    A measured crossover with both arms on the same instances fixes the distance to rho in
    one unit-invariant number; an empty crossover across the reachable range turns the lane
    into an exhausted_at_scale record with the reached size.
  blocked_by: >-
    EXP-ICEX-153c34 backend unbuilt; dispatch gated on the C-7 host-load gate (GOAL-ICEX-001
    next_action)
best_measured: >-
  no IC arm beats rho at any band weight, none has a fitted exponent below rho's (ic_frontier_campaign_20261015);
  Table A 5.23x at log2 r 36.6
