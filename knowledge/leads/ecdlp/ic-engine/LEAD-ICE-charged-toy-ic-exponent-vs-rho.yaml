id: LEAD-ICE-charged-toy-ic-exponent-vs-rho
family: ic-engine
title: One fully charged toy-scale index-calculus exponent vs matched rho (GOAL-ICEX-001 /
  G7)
mechanism: >-
  Aggregate SDEG/MONO/RELN outputs into one complete-cost IC exponent with a matched rho measured
  on the same instances, censoring charged and failures included. Audits found the four-size
  exponent unidentifiable and the 1/2 comparison mis-specified, and enumerative membership,
  not IC itself, is the bottleneck; the non-enumerative oracle is approved but unbuilt.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    E32 completed the charged handover ladder on eleven sizes through group order about
    2^42.4. The registered IC arm remained behind its strongest matched rho at every tested
    row and weight; at the top it was about 1.5e3 times behind (best row 1.14e3). The fitted
    distance slope is -0.243 +/- 0.04 and the fitted crossover is 2^85.5
    [2^79.2, 2^94.3] at zero GAE, roughly 43 extrapolated bits beyond the largest measured
    size. No crossover was measured. E27 separately made the matched walk about 1.45x cheaper,
    increasing the recorded distance. This exhausts only this implementation and reached
    range; it is not a lower bound on non-enumerative or representation-dependent oracles.
    Under the atlas invariant, `exhausted_at_scale` remains in the pursuit queue at its
    explicit revisit condition.
  revisit_when: >-
    A validated non-enumerative oracle changes the IC exponent or a charged run reaches a
    materially larger order where the fitted handover can be tested rather than extrapolated.
best_measured: >-
  E32: no crossover through log2 order 42.4; fitted crossover log2 n* = 85.5
  [79.2, 94.3] at zero GAE; about 1.5e3x distance at the top measured size.
