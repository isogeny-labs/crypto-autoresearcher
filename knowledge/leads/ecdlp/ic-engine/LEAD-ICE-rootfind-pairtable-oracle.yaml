id: LEAD-ICE-rootfind-pairtable-oracle
family: ic-engine
title: Root-finding / pair-table decomposition oracle in place of a Groebner solve
mechanism: >-
  The S_3 root in the last variable is x(R -/+ F_i), so an m = 2 decomposition is one batched
  inversion plus table probes (prime) or one pair-sum lookup (binary); m = 3 is |F| lookups.
  It is exact and complete like enumeration and replaces Macaulay row reduction. Every Table B
  row (prime and random-binary) records a pair-table variant, mitm_m2_negfold_walk or
  mitm_m2_negfold_walk_balanced, and Table A records koblitz_one_target (crypto
  docs/ic/leaderboard.json, board[*].best.variant); root finding and pair tables together are
  the incumbent table oracles. It moves the constant, never the p/|F| exponent.
disposition: open_blocked
next_action:
  step: >-
    Price every native primitive of the rootfind-negfold m = 2 arm and of matched strong rho
    (table canonicalisation, inversions) at 0, 0.1 and 1 GAE/op, replay on a second host (L2+),
    and re-run the 17-bit Koblitz and 20-bit prime cold sessions.
  discriminates: >-
    If the cold complete IC / strong-rho ratio stays above 1 across the band, the pair-table
    engine is exhausted at toy scale and only a degree-bounded algebraic oracle (LEAD-ICE-descent-closure-
    degree-at-scale) can change the slope; if it falls below 1 across the band at two sizes,
    it is the first validated sub-rho cold row and goes to the IC leaderboard gate. Scope
    (owner criterion 2026-10-24, docs/ic/SWEEPER.md): prime-table pipelines are reference only
    and rootfind-subtract is the unclassified track until the owner rules whether solving the
    univariate S_3 per base point counts as solving a summation-polynomial system; neither is
    ranked against the algebraic track. Pending: crypto
    research/prime_ic_program_20261029/DECISIONS.md R1 (2026-10-29, delegated, confirmed when its
    PR merges) adopts Option C of ruling/README.md, a counted generic-decomposition track holding
    rootfind-*, subtract, mitm and the pair tables, labelled "generic: bounded by sqrt(r); cannot
    beat rho"; AGENTS.md and SWEEPER.md still carry the 2026-10-24 wording.
  blocked_by: >-
    problems/rootfinding-complete-cost-calibration.md (crypto); native work unpriced, L0 only,
    same-host replay
best_measured: >-
  cold complete IC about 1.54x strong rho, 17-bit Koblitz, L0, natives unpriced (ecbench_rootfind_vs_rho_20261014);
  prime Table B 5.47x-13.5x rho at 9.7-23.4 bits
