id: LEAD-ICE-prime-field-semaev-solving-degree
family: ic-engine
title: Groebner solving degree / eliminants of prime-field S_3 / S_4 decomposition systems
mechanism: >-
  Over F_p there is no Weil descent; the system in x-coordinates of an interval or random
  base has degree growing with the base, and the hope was a certificate-backed solving-degree
  law, an eliminant or subresultant route, or a structured base whose membership is low degree.
  Measured serial-S_3 eliminant exponent stays far above the sub-rho gate.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Naive Semaev IC over prime fields cannot beat generic methods (KR-IC-401ebf). The program
    reproduced it: at balanced L = q^(1/5) on ordinary toy curves, beta_work(B1) = 0.797 on
    interval and random bases and 0.647 on subgroup bases against the 0.30 sub-rho threshold,
    36/36 cells, 105/105 FGLM checks (EV-SDEG-4a1c3d, strong); in ecbench the root-finding/pair-table
    oracle dominates any prime-field Groebner arm.
  revisit_when: >-
    A prime-field factor base whose membership equation has bounded degree independent of
    p (the base-d digit-map / PFDR descent, IDEA-20260830-84cdb7) produces a measured solving
    degree that stays flat across >= 3 field sizes.
best_measured: >-
  beta_work 0.797 (interval/random) and 0.647 (subgroup) vs 0.30 sub-rho gate, toy prime fields
  (EV-SDEG-4a1c3d)
