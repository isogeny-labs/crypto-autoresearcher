id: LEAD-ICE-chained-semaev-dreg-vs-semiregular
family: ic-engine
title: >-
  Degree of regularity of the Boolean chained Semaev system (m = 3, t = 3) against a semi-regular
  null
mechanism: >-
  GOAL-DREG-001 measures exact GF(2) Macaulay ranks of the descended chained S_3 system and
  asks whether d_reg(n) departs from the semi-regular prediction; a non-generic departure
  would make the solving degree, and so the per-query cost, lower than generic models predict.
  Committed n = 12 deficits exist (7,110 against one null, 17,947 genuine against the restricted
  null), but which null is the right control is still contested.
disposition: open_next_step
next_action:
  step: >-
    Re-run item C1 (n = 15, D = 6, seeds as frozen) with a streaming native Macaulay builder
    (IDEA-20260828-770aa4) under the lane's memory floor, with the block-matched / topology-matched
    null (IDEA-20260805-f49efb, IDEA-20260808-11b8c7) as a co-arm.
  discriminates: >-
    A deficit that survives the shape-matched null and grows with n is a real d_reg departure
    worth pricing; a deficit absorbed by the matched null reclassifies the n = 12 numbers
    as support artefacts and closes the departure question at toy scale.
best_measured: >-
  n = 12, D = 6 deficit_genuine 17,947 vs restricted null (EV-DREG-008, preliminary); n =
  15 D = 6 runs failed at 11.7-12.2 GiB
