<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360"><rect width="820" height="360" fill="white"/><rect x="15" y="10" width="790" height="65" rx="6" fill="#eef4f8" stroke="#536779"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="35" font-size="16">Odd diagonal: span(V V) equals the full field</text><text x="30" y="59" font-size="13">The trace bilinear form rules out a nonzero product annihilator</text></g><path d="M410 75v18l-5 -5m5 5l5 -5" fill="none" stroke="#536779"/><rect x="15" y="98" width="790" height="65" rx="6" fill="#eef4f8" stroke="#536779"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="123" font-size="16">Nonexceptional W2 has only the affine trace relation</text><text x="30" y="147" font-size="13">Containing 1 excludes the rank-one exception automatically</text></g><path d="M410 163v18l-5 -5m5 5l5 -5" fill="none" stroke="#536779"/><rect x="15" y="186" width="790" height="65" rx="6" fill="#eef4f8" stroke="#536779"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="211" font-size="16">Known two-point ideal needs 2k-1 affine generators</text><text x="30" y="235" font-size="13">At least one is missing from W2: LFD is at least three</text></g><path d="M410 251v18l-5 -5m5 5l5 -5" fill="none" stroke="#536779"/><rect x="15" y="274" width="790" height="65" rx="6" fill="#eef4f8" stroke="#536779"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="299" font-size="16">Fixed F8 control attains three</text><text x="30" y="323" font-size="13">Rank-five lower witness; cap-three upper identities; no search</text></g></svg>