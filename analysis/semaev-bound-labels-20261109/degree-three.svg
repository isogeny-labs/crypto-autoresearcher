<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360"><rect width="820" height="360" fill="white"/><rect x="15" y="10" width="790" height="65" rx="6" fill="#eef4f8" stroke="#536779"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="35" font-size="16">Two-point Semaev family splits into unique-zero branches</text><text x="30" y="59" font-size="13">If h is the branch LFD, h &lt;= original LFD &lt;= h+1</text></g><path d="M410 75v18l-5 -5m5 5l5 -5" fill="none" stroke="#536779"/><rect x="15" y="98" width="790" height="65" rx="6" fill="#eef4f8" stroke="#536779"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="123" font-size="16">Full W3 requires repeated low-degree feedback</text><text x="30" y="147" font-size="13">A one-pass cubic matrix does not certify saturation</text></g><path d="M410 163v18l-5 -5m5 5l5 -5" fill="none" stroke="#536779"/><rect x="15" y="186" width="790" height="65" rx="6" fill="#eef4f8" stroke="#536779"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="211" font-size="16">W2 dimensions alone cannot force growth</text><text x="30" y="235" font-size="13">A non-Semaev family shares the profile and always has LFD3</text></g><path d="M410 251v18l-5 -5m5 5l5 -5" fill="none" stroke="#536779"/><rect x="15" y="274" width="790" height="65" rx="6" fill="#eef4f8" stroke="#536779"/><g font-family="sans-serif" fill="#172b4d"><text x="30" y="299" font-size="16">SAT export and supplied witness checked</text><text x="30" y="323" font-size="13">1770 variables; 5610 clauses; direct lower-bound bridge gives 3</text></g></svg>