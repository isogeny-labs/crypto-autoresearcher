<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="220" viewBox="0 0 1040 220" role="img" aria-labelledby="title desc">
  <title id="title">Streamed certificate custody control</title>
  <desc id="desc">A native bounded exporter streams a certificate to an S3 object; one full S3 readback is hashed and passed to the independent checker.</desc>
  <style>text{font:16px sans-serif;fill:#16263a}.small{font-size:13px;fill:#42536b}.box{fill:#eaf2fb;stroke:#3669a1;stroke-width:2}.ok{fill:#e5f6ed;stroke:#358057;stroke-width:2}.line{stroke:#42668e;stroke-width:3;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#42668e"/></marker></defs>
  <rect class="box" x="20" y="45" width="210" height="105" rx="9"/><text x="42" y="79">Bounded exporter</text><text class="small" x="42" y="108">native fixture, 1,040 bytes</text><text class="small" x="42" y="131">candidate status required</text>
  <line class="line" x1="230" y1="98" x2="285" y2="98"/><text class="small" x="236" y="77">stream</text>
  <rect class="box" x="290" y="45" width="205" height="105" rx="9"/><text x="321" y="79">S3 run object</text><text class="small" x="311" y="108">no local certificate file</text><text class="small" x="311" y="131">length checked</text>
  <line class="line" x1="495" y1="98" x2="550" y2="98"/><text class="small" x="503" y="77">GET</text>
  <rect class="ok" x="555" y="45" width="205" height="105" rx="9"/><text x="579" y="79">Full SHA-256 readback</text><text class="small" x="579" y="108">matches producer stream</text><text class="small" x="579" y="131">same bytes feed checker</text>
  <line class="line" x1="760" y1="98" x2="815" y2="98"/>
  <rect class="ok" x="820" y="45" width="200" height="105" rx="9"/><text x="845" y="79">Independent checker</text><text class="small" x="845" y="108">W5 codimension at least 3</text><text class="small" x="845" y="131">fixture only</text>
  <text class="small" x="21" y="190">Control object: native-fixture-0-s3-v4; output hash 7cf2d46d96fe...e82d73; no n51 D5 trial in this run.</text>
</svg>
