<svg xmlns="http://www.w3.org/2000/svg" width="900" height="215" viewBox="0 0 900 215" role="img" aria-label="Four cloud preflight attempts and their outcomes">
<style>text{font:15px sans-serif;fill:#18243a}.small{font-size:12px}.fail{fill:#ffe6e2;stroke:#b13d30;stroke-width:2}.pass{fill:#e3f5e9;stroke:#287b4b;stroke-width:2}.arrow{stroke:#687789;stroke-width:2;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#687789"/></marker></defs>
<text x="18" y="25">Pinned EKS image preflight: bootstrap repairs and native qualification</text>
<rect class="fail" x="15" y="52" width="205" height="112" rx="8"/><text x="30" y="82">1. Artifact bucket</text><text class="small" x="30" y="107">HeadObject 403</text><text class="small" x="30" y="132">Native fixture not reached</text>
<line class="arrow" x1="221" y1="107" x2="237" y2="107"/>
<rect class="fail" x="240" y="52" width="205" height="112" rx="8"/><text x="255" y="82">2. Public bundle</text><text class="small" x="255" y="107">Missing output directory</text><text class="small" x="255" y="132">Native fixture not reached</text>
<line class="arrow" x1="446" y1="107" x2="462" y2="107"/>
<rect class="fail" x="465" y="52" width="205" height="112" rx="8"/><text x="480" y="82">3. Exact download</text><text class="small" x="480" y="107">No tar executable</text><text class="small" x="480" y="132">Native fixture not reached</text>
<line class="arrow" x1="671" y1="107" x2="687" y2="107"/>
<rect class="pass" x="690" y="52" width="195" height="112" rx="8"/><text x="705" y="82">4. Qualified</text><text class="small" x="705" y="107">1,040 B S3 readback</text><text class="small" x="705" y="132">Checker codim 3</text>
<text class="small" x="17" y="194">All four Jobs: 2 CPU, 2 GiB, 900 s, zero retries. The successful run has one native fixture (n=1).</text>
</svg>
