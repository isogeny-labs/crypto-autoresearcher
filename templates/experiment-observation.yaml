# Copy into a NEW report directory as observation.yaml; never into a sealed run.
# This valid empty scaffold records a snapshot with no measurements yet.
# Replace the prose and populate only facts supported by saved evidence.
schema: crypto.autoresearch.experiment_observation.v1
report_kind: progress_snapshot # run_observations | reanalysis | progress_snapshot
question: Replace with the observable question; no predicted anomaly is required.
scope: Replace with the actual instance domain, parameter range and exclusions.
method:
  description: No experiment or analysis is recorded in this scaffold yet.
  command: null # Exact executed command, or null with an entry in missing.
  parameters: {}
  seeds: null # [] means explicitly seedless; null means not recorded here.
  sampling_unit: Not yet specified.
  stopping_rule: null
# Copy existing immutable IDs; use [] when this report has no recorded runs.
# runs entries: {experiment_id, run_id, native_status, evidence: [{artifact, selector}]}
runs: []
# Evidence selector: JSON Pointer, CSV predicate, line range or whole-file scope.
# Every observation includes id, description, kind, value, unit, sample,
# uncertainty and evidence. See the complete saved-data example in examples/.
observations: []
# Each control names its observation_ids, matching and limitations.
controls: []
# Each pattern links observation_ids and reference_ids (observation/control IDs),
# states uncertainty and alternative_explanations. [] is a complete valid result.
patterns: []
limitations:
  - This is an unfilled presentation scaffold, not an experiment result.
missing:
  - field: /method/command
    reason: No execution is recorded in this scaffold.
  - field: /method/seeds
    reason: No execution is recorded in this scaffold.
  - field: /method/stopping_rule
    reason: No execution is recorded in this scaffold.
# Entries: {question, method, control, status: proposed}; they grant no authority.
next_checks: []
# Entries: {id, path, commit, sha256}; path is repository-relative, commit is full.
artifacts: []
