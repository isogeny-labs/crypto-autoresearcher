# Registry of harness mechanisms (harness review I7, 2026-11-10).
# Each mechanism has a one-number use_metric (a shell command run from the repo
# root) and 30 days: review_by = added_on + 30 days. A mechanism past review_by
# with no measured use becomes optional and its text moves to docs/.
# `python3 tools/mechanism_review.py` runs the metrics; `--overdue` lists them.
# status: measured (the metric is a use or effect count and was > 0 when set),
# unmeasured, retired. AGENTS.md section entries count the files that cite the
# heading: a citation count, not an effect, hence unmeasured.
# The 30-day clock starts at registry entry (added_on), not at the mechanism's
# own introduction. Edit only by adding entries or changing status.
mechanisms:
- id: bus-pointers
  name: Agent bus pointer messages
  owner_doc: docs/inter-agent-messaging.md
  use_metric: ls coordination/bus/receipts | wc -l
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: handoff-returns
  name: Handoff returns (archived_by set)
  owner_doc: AGENTS.md
  use_metric: grep -l '^  archived_by:' ledger/handoffs/*.yaml | wc -l
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: challenge-loop
  name: Challenge research loop
  owner_doc: docs/challenge-research-loop.md
  use_metric: python3 -c "import json,glob; print(sum(json.load(open(f)).get('completed_actions',0) for f in glob.glob('coordination/pilots/*/summary.json')))"
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: tune-skill
  name: Tune-skill self-improvement loop
  owner_doc: docs/self-improvement-loop.md
  use_metric: 'python3 tools/self_improve.py plan | python3 -c "import sys,re; print(sum(int(x) for x in re.findall(r''\"outcomes\": (\d+)'', sys.stdin.read())))"'
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: throughput-autopilot
  name: Throughput autopilot
  owner_doc: docs/research-throughput-autopilot.md
  use_metric: grep -rli autopilot coordination/sessions/receipts | wc -l
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: weekly-evals
  name: Weekly eval workflow (results present)
  owner_doc: .github/workflows/weekly-evals.yml
  use_metric: ls evals/results 2>/dev/null | wc -l
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: session-receipts-usage
  name: Session receipts with provider usage
  owner_doc: tools/session_receipt.py
  use_metric: python3 tools/session_receipt.py summary | sed -n 's/.*provider usage known for \([0-9]*\).*/\1/p' | head -1
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: instruction-budget
  name: Instruction-budget check (always-loaded headroom, words)
  owner_doc: tools/check_instruction_budget.py
  use_metric: python3 tools/check_instruction_budget.py | sed -n 's/.*always loaded \([0-9]*\) words.*/\1/p' | awk '{print 6000-$1}'
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: pcc-canary
  name: pcc canary (cases ok)
  owner_doc: AGENTS.md
  use_metric: python3 tools/pcc/pcc.py canary | grep -c '^ok'
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: approval-capacity-cap
  name: 'Approval-capacity cap (receipts refused_capacity: times it bound)'
  owner_doc: AGENTS.md
  use_metric: grep -rl 'refused_capacity' coordination/sessions/receipts | wc -l
  added_on: '2026-11-10'
  review_by: '2026-12-10'
  status: unmeasured
- id: experiment-wip-cap
  name: 'Per-goal approved-unrun WIP cap (tools/experiment_wip.py, PR #3180; contracts it reports over the cap)'
