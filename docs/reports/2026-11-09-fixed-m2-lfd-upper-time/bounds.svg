<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450"><rect width="760" height="450" fill="white"/><g font-family="sans-serif" fill="#172b4d"><rect x="35" y="10" width="690" height="66" rx="7" fill="#eaf3fb" stroke="#526778"/><text x="52" y="35" font-size="18">General normalized binary m=2, dim(V)=k</text><text x="52" y="59" font-size="16">Set s=X+Y; every fibre is affine in X</text><path d="M380 76v19l-5 -5m5 5l5 -5" stroke="#526778" fill="none"/><rect x="35" y="98" width="690" height="66" rx="7" fill="#eaf3fb" stroke="#526778"/><text x="52" y="123" font-size="18">Quartic homogeneous map, leading coefficient 1</text><text x="52" y="147" font-size="16">At most four solutions; at most two free bits per fibre</text><path d="M380 164v19l-5 -5m5 5l5 -5" stroke="#526778" fill="none"/><rect x="35" y="186" width="690" height="66" rx="7" fill="#eaf3fb" stroke="#526778"/><text x="52" y="211" font-size="18">Selector/free-bit normal forms</text><text x="52" y="235" font-size="16">Degree at most k+2; multiplication reduces at cap k+3</text><path d="M380 252v19l-5 -5m5 5l5 -5" stroke="#526778" fill="none"/><rect x="35" y="274" width="690" height="66" rx="7" fill="#eaf3fb" stroke="#526778"/><text x="52" y="299" font-size="18">All ideal consequences controlled</text><text x="52" y="323" font-size="16">LFD ≤ k+3 for SAT and UNSAT</text><path d="M380 340v19l-5 -5m5 5l5 -5" stroke="#526778" fill="none"/><rect x="35" y="362" width="690" height="66" rx="7" fill="#eaf3fb" stroke="#526778"/><text x="52" y="387" font-size="18">Structured subfamily: V=H, [K:H]=2, z outside H</text><text x="52" y="411" font-size="16">At most four total points; stronger LFD ≤ 3</text></g></svg>