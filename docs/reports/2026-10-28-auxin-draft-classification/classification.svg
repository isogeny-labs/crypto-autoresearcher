<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="310" viewBox="0 0 1060 310" role="img" aria-label="Hash-bound AUXIN draft classification: matching copies remain non-executable; changed copy or approval retains schema error">
  <rect width="1060" height="310" fill="white"/>
  <text x="28" y="36" font-family="sans-serif" font-size="22" font-weight="bold">AUXIN successor contract: source-bound draft classification</text>
  <rect x="28" y="74" width="265" height="94" rx="8" fill="#eef3fa" stroke="#315f9e" stroke-width="2"/>
  <text x="43" y="102" font-family="sans-serif" font-size="16">Placed specification</text>
  <text x="43" y="128" font-family="monospace" font-size="13">EXP-AUXIN-339fb0</text>
  <text x="43" y="150" font-family="sans-serif" font-size="13">status: draft</text>
  <rect x="28" y="192" width="265" height="76" rx="8" fill="#eef3fa" stroke="#315f9e" stroke-width="2"/>
  <text x="43" y="221" font-family="sans-serif" font-size="16">Design-stage source copy</text>
  <text x="43" y="246" font-family="monospace" font-size="13">same SHA-256</text>
  <path d="M 293 121 H 379 M 293 230 H 337 V 121 H 379" fill="none" stroke="#315f9e" stroke-width="2"/>
  <polygon points="379,121 369,115 369,127" fill="#315f9e"/>
  <rect x="379" y="74" width="310" height="94" rx="8" fill="#eef8ee" stroke="#387a47" stroke-width="2"/>
  <text x="397" y="101" font-family="sans-serif" font-size="16">Exact path + both hashes + draft fields</text>
  <text x="397" y="129" font-family="sans-serif" font-size="14">Visible advisory; reference alias</text>
  <text x="397" y="151" font-family="sans-serif" font-size="14">No experiment ID registration</text>
  <path d="M 689 121 H 752" fill="none" stroke="#387a47" stroke-width="2"/>
  <polygon points="752,121 742,115 742,127" fill="#387a47"/>
  <rect x="752" y="74" width="278" height="94" rx="8" fill="#f4f4f4" stroke="#666" stroke-width="2"/>
  <text x="770" y="104" font-family="sans-serif" font-size="16">Design draft only</text>
  <text x="770" y="132" font-family="sans-serif" font-size="14">No run authorization</text>
  <text x="28" y="296" font-family="sans-serif" font-size="14" fill="#a23a4a">Changed copy, path, ID, status, or approver → ordinary schema error; no draft admission.</text>
</svg>
