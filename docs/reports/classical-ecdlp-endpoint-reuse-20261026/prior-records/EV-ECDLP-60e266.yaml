  proof_status_note: >-
    The strongest checkable refutation artifact the result admits
    (docs/claims-and-verification.md, "Refutation artifacts") is a
    DERIVATION NOTE, not a universal proof: the red team's F-J3-1 argument.
    (1) Coverage of any stored set is the sum of its entries' exact basin
    sizes over N (disjointness; contract definition; enforced as S4 and
    re-verified by the validator, check (ix)); hence any T/2-entry table's
    single-walk coverage is at most the exact top-T/2 basin share. (2) On
    the exactly enumerated basins of RUN-013..017 (2^24, a = 1/4) the
    top-T/2 share (summary top_share_by_t['128']) is BELOW the STATIC(T)
    exact coverage (summary fixture.static_T_exact_coverage) in 5/5 seeds
    (-0.0129, -0.0084, -0.0362, -0.0168, -0.0222) and in 5/5 seeds of
    RUN-001..005 (2^20; -0.0141, -0.0035, -0.0534, -0.0199, -0.0230). (3)
    Per-target success at fixed k = 4 independent uniform restarts is
    monotone in single-walk coverage, so ORACLE(T/2) cannot reach STATIC(T)
    on these instances; the ORACLE arm confirms it (eps_ss(8T) 0.714 vs
    0.740 at 2^24, per seed -0.035, -0.012, 0.000, -0.039, -0.041). Step
    (2) is read directly from the snapshot-committed run records (commit
    840df8a5, before this decision) by a one-line comparison the red team
    names; the worked files j3_disjointness.json and j3_oracle_floor.json
    are the note and are bound in the same ledger commit as this record.
    Labelled `derivation`, never "proved": it is exact for the tested seeds
    at the tested (N, a, r, k, cap, walk) and says nothing about other
    parameters, other walks, or cryptographic N. The empirical S1 failure
    (CI-separated at both N and on the curve) is the observation the
    derivation explains; the record is not empirical-only.

  scope:
    instrument: >-
      Generic keyed random function f(x) = mix64(x XOR K) mod N with a
      64-bit mixer and an independently keyed DP predicate of density
      1/W (contract class); exact basins by full enumeration at N <= 2^24,
      sampled walks at 2^30; walks capped at 8W; the vectorised walker
      agreed with the exact basin tables on every online start (executor
      identity checks).
    N_grid: [1048576, 16777216, 1073741824]
    N_grid_note: 2^20 (Stage G, gates and information-only cells), 2^24 (Stage 1, exact), 2^30 (Stage 2, sampled)
    T_grid: [64, 256, 1024]
    a: [0.25, 0.5]
    a_note: a = 1/4 is the claim cell (W = 128 at 2^24, W = 512 at 2^30); a = 1/2 is the contract's differential cell
    r_pool_ratio: [2, 4, 8]
    r_note: r = 2 is the claim cell; r in {4, 8} are the S5 mechanism sweep (RSWEEP-STATIC arms)
    k_walks_per_target: 4
    cap: 8W
    walk_classes:
      - keyed random function (generic)
      - r-adding walk with r = 32 known scalars on the curve arm
    T_sel_grid: [T/4, T/2, 3T/4, T]
    U_grid: [T, 2T, 4T, 8T, 16T]
    round_length: R = T (sweep R in {T/4, T, 4T} at 2^24 seed 1 only)
    phi_grid: [0, 0.1, 0.25, 0.5, 1]
    pool_caps: [uncapped, 4T, 2T]
    bracket: LOWER (only walks of SOLVED targets enter the pool; UPPER reported as S6 control)
    seeds:
      generic: "s in {1, 2, 3, 4, 5} per (N, a); target 100+s, PHI 200+s, NULL-A 300+s, tie-break 400+s; precomputation restarts default_rng(s) (executor D8)"
      curve: "s in {1, 2, 3}; curve-search seed 1000"
    curves:
      - id: TOY-P24-1ca86fe9187c
        p: 16777199
        a: 819
        b: 471
        N: 16782071
        arms_run: "STATIC(T), STATIC(T/2), RESEL-L(T), RESEL-L(T/2), NULL-A(T/2), RHO at a = 1/4, U = 8T, 3 seeds; control (m) tested for STATIC(T) and RESEL-L(T/2)"
    targets: uniform, independent, non-adaptive; 2048 targets per curve seed
    solver: >-
      experiments/EXP-ECDLP-612fb1/source (instrument.py, run_generic.py,
      run_curve.py, analysis.py, verify_certificate.py; hashes pinned per
      manifest; commit 72736e3586283b52311480940803020440b9671a; one code
      path for all arms with arm selection by configuration, confirmed by
      the validator's leak grep)
    budget_used: >-
      37 of 48 runs, 0.14 of 12 CPU-hours, max wall 85.8 s of 3600 per run,
      max peak RSS 2.03 GB of 8 GB, 1 worker (execution report).
    statistics: stratified-by-seed paired BCa bootstrap, 2000 resamples (RUN-ECDLP-612fb1-037, analysis.py class Boot)
    transfer_assumption: >-
      Nothing here transfers beyond the grid above. The agreement of 2^24
      and 2^30 in sign and magnitude (rho_T(8T) 0.654 vs 0.688) is the only
      N-independence evidence and covers two toy N; any statement about
      other N, other (a, r, k), other walks, skewed targets, or
      cryptographic sizes is an assumption, not a result.

