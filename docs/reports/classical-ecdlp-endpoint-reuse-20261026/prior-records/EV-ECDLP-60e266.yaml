  type: empirical
  direction: weakens
  direction_note: >-
    Weakens H-ECDLP-37dc01 AS STATED: its headline clause (C1), "the
    LOWER-bracket re-selected T/2 table reaches the static T table's
    steady-state per-target success within CI by U = 8T" (contract S1), is
    CONTRADICTED with CI at the pre-registered effect size at both generic
    N and on the curve, and the red team's derivation from the exact basins
    shows the clause was infeasible on this instrument at a = 1/4 before any
    re-selection ran (obstruction block below). The record does NOT weaken
    the mechanism clauses (C2)-(C5): the re-selected table moves toward the
    exact oracle (S4 met, hit-rate trajectory 0.298 -> 0.370 at 2^24), the
    gain shrinks with r and decays with phi (S5, S3 met), the early-batch
    penalty is as predicted (C5), and the UPPER-LOWER gap is below 0.05
    (S6 met). The direction is therefore "weakens" on the effect claim with
    the mechanism supported at toy scale within this single batch; both
    readings are scoped below.
  strength: preliminary
  strength_note: >-
    One execution batch: 5 seeds at each of N = 2^24 and N = 2^30 (a = 1/4)
    plus 3 seeds on one toy curve, all under one implementation; the run
    set was independently validated (J1 HOLDS_WITH_FINDINGS, every check
    (i)-(x) PASS, all 19850 certificates re-verified) and its load-bearing
    quantities blind re-derived (J2 HOLDS_WITH_FINDINGS, agreement at the
    seed-spread level), and it was red-teamed (J3 BROKEN on the claim, J4
    BROKEN narrowly on the criterion). The two N and the curve agree in
    sign and magnitude and every CI is tight, but no second run set under
    an independent implementation exists, so the strength is `preliminary`,
    not `replicated`; the amendment-and-rerun named in DEC-20260906-1f5b71
    is the replication owed before any further hypothesis transition.
  claim_tier: toy
  claim_tier_note: >-
