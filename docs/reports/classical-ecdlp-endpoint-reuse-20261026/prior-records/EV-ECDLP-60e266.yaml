  obstruction:
    statement: >-
      On the keyed-random-function instrument at a = T W^2 / N = 1/4 with
      cap 8W, the exact top-T/2 basin share is smaller than the static
      Bernstein-Lange T table's exact coverage at pool ratio r = 2 -- in
      10 of 10 exactly enumerated instances (5 seeds at N = 2^20, 5 at
      N = 2^24) -- so, by disjointness of basins, no table of T/2 stored
      distinguished points, however selected, reaches the static T table's
      single-walk coverage or (at fixed k) its per-target success. The
      fixed-advice ceiling of re-selection at a = 1/4 is therefore the
      oracle advice ratio rho_ORACLE of about 0.55, above the pre-registered
      model asymptote 0.51 and inside the pre-registered band [0.45, 0.65];
      measured rho_T sits between that floor and 1.0 with CIs excluding
      1.0, and the reduction is bought with working storage at the online
      site that exceeds STATIC(T)'s advice on every re-selected cell.
    quantity: >-
      (i) exact top-T/2 basin share minus STATIC(T) exact coverage, per
      seed (fraction of N); (ii) rho_ORACLE = T_sel/T at which the exact
      ORACLE(T_sel) matches STATIC(T) (dimensionless); (iii) rho_T(U)
      steady-state and cumulative (dimensionless); (iv) S_peak/T entries
      at the online site (dimensionless ratio of entry counts); (v)
      early-batch penalty (per-target success difference over the first
      10% of 8T targets).
    value: >-
      (i) 2^24 a = 1/4: -0.0129, -0.0084, -0.0362, -0.0168, -0.0222
      (top-T/2 share 0.255-0.287, mean 0.271; STATIC(T) exact coverage
      0.264-0.304, mean 0.291); 2^20: -0.0141, -0.0035, -0.0534, -0.0199,
      -0.0230; negative in 10/10 seeds (exact enumeration, no sampling
      error). Confirmed on per-target success by the ORACLE arm:
      ORACLE(T/2) eps_ss(8T) 0.714 vs STATIC(T) 0.740 at 2^24 (per seed
      -0.035, -0.012, 0.000, -0.039, -0.041), at 16T 0.731 vs 0.747 (5/5
