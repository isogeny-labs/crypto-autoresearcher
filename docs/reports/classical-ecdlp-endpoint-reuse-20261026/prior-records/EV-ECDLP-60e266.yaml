    (not a field; labelled toy by the contract's own ceiling) and one toy
    prime-order curve at p about 2^24. Constant-factor statements under the
    Corrigan-Gibbs-Kogan S T^2 = Omega~(eps N) ceiling (KN-LIT-013); no
    exponent is claimed or approached.
