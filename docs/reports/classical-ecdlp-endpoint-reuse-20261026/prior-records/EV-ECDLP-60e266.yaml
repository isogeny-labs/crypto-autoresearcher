  inference: >-
    At claim_tier toy on the tested grid (generic keyed random function at
    N in {2^24, 2^30}, a = 1/4, r = 2, k = 4, cap 8W, LOWER bracket, U up
    to 16T; and TOY-P24-1ca86fe9187c at a = 1/4, U = 8T for the two arms
    under control (m)), the LOWER-bracket re-selected T/2 table does NOT
    reach the static T table by U = 8T nor by 16T: difference -0.064
    [-0.080, -0.049] at 2^24, -0.076 [-0.083, -0.068] at 2^30, -0.049
    [-0.071, -0.029] on the curve (RUN-ECDLP-612fb1-037 over RUN-013..017,
    RUN-023..027, RUN-34/35/36). Claim (C1) of H-ECDLP-37dc01 is
    CONTRADICTED with CI at the pre-registered effect size, and its premise
    -- the coincidence C_max(1/8) = 0.27 = p_static -- fails by 0.02 with
    zero margin: the measured top-T/2 share reproduces C_max(1/8) (0.271)
    while the measured static rate is 0.289, so the exact top-T/2 basin
    share lies below STATIC(T)'s exact coverage in 10/10 exact seeds and no
    T/2 table can reach static T on this instrument at a = 1/4 (derivation
    above). What IS measured is a smaller fixed-advice reduction bounded
    below by the oracle floor: rho_T(8T) = 0.654 [0.620, 0.700] (2^24) and
    0.688 [0.664, 0.706] (2^30) steady-state, 0.747 / 0.766 on the RQ's
    cumulative epsilon; rho_T(16T) = 0.619 [0.584, 0.663] and 0.632
    [0.607, 0.648]; rho_ORACLE about 0.55 (2^24). That reduction is bought
    with working storage of 8.7-8.9 T entries uncapped (2.6 T at CAP(2T),
    retention about 1.0), an early-batch penalty of 0.13-0.15, and no
    cumulative break-even within 16T; under RQ-ECDLP-78dbc5's fewer_DP
    definition it is a TRADEOFF POINT on the (P, S, L, epsilon, U) frontier
    (advice 0.65-0.69 T at working storage 2.6-8.9 T), not an improvement,
    and "fewer stored DPs" survives on no cell once entries at the online
    site are counted (every re-selected cell holds more than STATIC(T)'s
    1 T). The mechanism clauses are SUPPORTED at toy scale within this
    batch: the re-selected full-T table converges toward the exact oracle
    (0.298 -> 0.370 against a top-T share of about 0.39, never exceeding
    it), equalling the r = 8 static table at r = 2 precomputation; the gain
    shrinks with r (0.094 -> 0.048 -> 0.014) and decays with phi; NULL-B
    and PHI(0) are bit-identical to STATIC and rule 5 does not fire. The
    honest constant this batch delivers is the pair (rho_T about 0.65-0.69
    at S_peak 2.6-8.9 T; rho_ORACLE about 0.55), read once per seed from
    exact basins.

  boundaries:
    - >-
      Every sentence above is scoped to the grid in `scope`: the generic
      keyed-random-function instrument at N in {2^20 (gates), 2^24, 2^30},
      T = N^{1/3} in {64, 256, 1024}, a = 1/4 (claim cell) and 1/2
      (differential), r in {2, 4, 8}, k = 4, cap 8W, R = T, LOWER bracket,
      U <= 16T, uniform independent targets, 5 seeds; and one toy curve at
      a = 1/4, U = 8T, 3 seeds, two arms. Nothing is claimed at any other
      (a, r, k), N, walk, target distribution, or round length.
    - >-
      claim_tier toy. No exponent moves and none is claimed; the online
      1/3, advice 1/3 and precomputation 2/3 exponents are unchanged and
      the Corrigan-Gibbs-Kogan S T^2 = Omega~(eps N) ceiling (KN-LIT-013)
      and multi-instance line are respected by construction (no relations
      stored). No cryptographic N; no deployed curve; no scheme is named.
    - >-
      The curve-scoped sentence is confined to TOY-P24-1ca86fe9187c at
      a = 1/4, U = 8T, and to the two arms control (m) tested (STATIC(T),
      RESEL-L(T/2)); every other statement is about the random-function
      instrument.
    - >-
      The obstruction is claimed over the exact seeds tested (10/10 at 2^20
      and 2^24, a = 1/4) and, through the ORACLE arm, at 2^30 sampled; it
      is a statement about THIS instrument class at a = 1/4, r = 2, not an
      impossibility result for re-selection at other (a, r) or for
      growth-type tables (IDEA-20260906-a3d6ae), which store advice beyond
      T and are outside this contract.
    - >-
      Steady-state eps_ss (targets in [6T, 8T)) is the contract's quantity;
      the RQ's epsilon is cumulative. Both are reported; the cumulative
      reading is 0.09-0.11 worse in rho_T at 8T.
    - >-
      The fixture G2 (1.705 / 1.727 vs 1.79 within 0.18; P 1.243 / 1.246 in
      [1.05, 1.40]) makes the instrument comparable to Bernstein-Lange's
      Section 4 case study at the contract's tolerance; the validator's J2
      places all three instruments 0.06-0.11 below 1.79 at theta = 1/128
      (an O(theta) residual), which is inside this contract's band and is
      load-bearing only for EXP-ECDLP-869870's 0.10 band (EV-ECDLP-31e91c).
    - >-
      The HEUR-BLT-7 regression was scored by the executor against the
      contract's r_eff formula; the red team shows the formula overcounts
      admitted evidence by about 1.7x. The heuristic's falsification
      condition did not fire, but its tolerance is met marginally and the
      restatement with the admitted-walk count is owed to the amendment.
    - >-
      Model independence between producers and reviewers was NOT obtained
      (all self-report claude-fable-5-1); session and implementation
      independence were. Every number in this record was recomputed from
      raw records by at least one reviewer under its own code; no
      conclusion rests on two records merely agreeing.

  unresolved_confounds:
    - >-
      J3 / F-J3-1: the pre-registered S1 was infeasible by ceiling on this
      instrument at a = 1/4, so its failure is a ceiling failure of the
      claim, not a mechanism failure; the contract gated G1 on "STATIC(T)
      below the top-T share" but never on the inequality the T/2 claim
      needed. Whether any (a, r) exists at which top-T_sel share >= STATIC(T)
      coverage is untested (the a-scan on 2^20 exact basins costs seconds
      and is the first item under the amendment).
    - >-
      J4 / F-J4-1: S1's absolute tolerance (point >= -0.03, CI upper >= 0)
      and the crossing metrics' absolute 0.02 margin carry no non-vacuity
      guard -- on the affine-xorshift keyed bijection (every table at 3-5%,
      RHO at 0) the pipeline reports S1_met true, U_ss = U* = 2T. This does
      not change the outcome on the real object (S1 failed by 0.064-0.076
      against a dynamic range of 0.74) but the criterion cannot be evidence
      for a positive outcome until amended.
    - >-
      J4 / F-J4-2: S2's positive form ("NULL-A within CI of zero at every
      round") is unsatisfiable by the null's design, so the composite
      S1-S4 could never have accepted on any object; the one-sided rule 5
      is the operative artifact test. A shape-matched null for this
      mechanism does not exist (the signal IS which entries receive
      evidence); PHI decay is the stronger control and it passed.
    - >-
      J4 / F-J4-4: the snapshot analysis.py raises TypeError at G1
      aggregation on a no-tail object (fit_cutoff None) instead of scoring
      G1 FAILED; on the real object G1 fitted and the defect did not fire,
      but the analysis needs the None-guard and the bijection negative
      fixture before it can be trusted to report a gate failure.
    - >-
      J3 / F-J3-2: the execution report's rho_T lines quote rho_T without
      S_peak on the same line; the honest headline is the frontier tuple
      (T_sel/T, S_peak/T, P/sqrt(NT), L, eps_ss, eps_cum, U, penalty) and
      this record quotes it so. CAP(2T) holds 2.6 T, not 2 T (cap applied
