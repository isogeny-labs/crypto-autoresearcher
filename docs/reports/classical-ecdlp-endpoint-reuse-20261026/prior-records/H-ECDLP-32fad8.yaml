hypothesis:
  id: H-ECDLP-32fad8
  id_allocation_provenance: >-
    Pre-minted by the orchestrating session and verified free in origin/main
    before this design; relayed in the in-session design handoff for
    RQ-ECDLP-78dbc5 on 2026-09-08. Not derived by scanning state.
  question_id: RQ-ECDLP-78dbc5
  proposal_id: IDEA-20260906-a3d6ae
  derived_from_idea: IDEA-20260906-a3d6ae
  goal_id: null
  goal_id_note: >-
    Not bound to a GOAL record. RQ-ECDLP-78dbc5 is itself unbound (its
    goal_id_note names GOAL-ECDLP-001 as the umbrella candidate); binding is
    a separate Coordinator decision and is not made by this record.
  added: '2026-09-08'
  specified_at: '2026-09-08'
  specified_by: coordinator
  proposed_by: idea-generator
  status: specified

  title: >-
    THE BATCH-GROWN TABLE WITH RELATION-GRAPH ACCOUNTING: precompute only
    T_0 < T_BL selected entries, let the U targets' own terminal
    distinguished points (solved or not) join the table as (point,
    affine-in-unknowns scalar) entries, resolve targets through a weighted
    union-find of relations, and measure the recurrence T_0(U) at fixed
    per-target budget L and success epsilon -- predicted to fall linearly in
    U with slope set by the below-threshold basin mass, reaching T_0 = 0
    (pure Kuhn-Struik / Fouque-Joux-Mavromati) at U of order N/(k W^2).

  statement: >-
    (A) SETTING (U > 1, one table, one group). Targets Q_1..Q_U are
    processed sequentially; target u runs at most k online walks from
    Q_u + [c]P, each ending at a DP d after about W steps, so the per-target
    budget is L <= k W group operations. Outcomes of a walk at d:
      (i)   d in the precomputed table X_0 (known log): u is SOLVED,
            certificate [k_u]P == Q_u checked;
      (ii)  d is a batch entry owned by an already-solved target: u SOLVED;
      (iii) d is a batch entry owned by an unsolved target v: the walks give
            (a_u + b_u k_u) = (a_v + b_v k_v) mod N, a RELATION; u and v are
            merged in a weighted union-find over Z/N and u stops walking;
      (iv)  d is new: d is stored with (a_u, b_u, u) and u walks again (up
            to k).
    Whenever a component's root becomes solved, every member is solved and
    certified. At the end of the batch, unresolved components are failures.
    This composes Bernstein-Lange (KN-LIT-3060), Kuhn-Struik reuse of
    earlier walks' DPs (retrieved), and the Fouque-Joux-Mavromati relation
    graph (retrieved). NOTHING in the composition is new; the new content is
    the QUANTITY it asks for and the accounting rule that makes the quantity
    honest.
    (B) THE QUANTITY. T_0(U; L, epsilon): the smallest precomputed table
    (built with the same selection rule and the same P per entry as the
    U = 1 baseline) such that the batch of U targets achieves per-target
    success at least epsilon at budget L, averaged over the batch and ALSO
    reported for the first 10% of targets (who see the smallest table).
    Report the ratio T_0(U)/T_BL(1) with a bootstrap CI over seeds, and the
    peak stored set S_peak (precomputed + batch entries) beside it, because
    a batch that stores its DPs is trading online memory for precomputed
    entries and the RQ definition requires that to be shown on the
    (P, S, L, epsilon, U) frontier rather than hidden.
    (C) THE MODEL PREDICTION (H1, H2 of IDEA-20260906-aed829, plus H4). The
    precomputed selected table covers the basins above a size threshold
    x*_0 W^2 with coverage C_sel(T_0). Every batch walk is a fresh uniform
    start, so after m batch walks the union of the batch's stored basins
    (which live below the threshold) covers
      C_batch(m) = (2 pi)^{-1/2} * integral_0^{x*_0} x^{-1/2} (1 - e^{-a_m x}) e^{-x/2} dx,
      a_m = m W^2 / N,
    and the known-set coverage seen by the next target is C_sel + C_batch(m).
    Two brackets follow for the solved fraction: LOWER = only outcomes
    (i)-(ii) count at the time of the hit; UPPER = any hit on a known DP
    counts (as if all pendings resolve). The measured solved fraction must
    lie between them; the gap is the deferred-resolution loss, predicted
    small while C_sel >= 0.2 (most components touch the table within k
    walks) and large as T_0 -> 0, where the batch is pure Kuhn-Struik and
    resolution is the whole game. Consequences stated as predictions:
    (C1) T_0(U) decreases in U; in the linear regime U k W^2 / N <= 1 the
    slope dT_0/dU is about -beta k with beta = (mean basin of a stored batch
    DP)/(mean basin of a precomputed selected entry), i.e. beta about 0.886
    x-bar_batch / x-bar_sel, predicted in [0.3, 0.7] at a = 1/4, r = 2;
    (C2) T_0(U) reaches 0 at U_0 of order N/(k W^2) times a constant of
    order 1-3 for epsilon = 0.9, which at T_BL = N^{1/3}, a = 1/4, k = 4 is
    U_0 of order T_BL to 3 T_BL; (C3) the first-10% success is strictly
    below the batch average and is the binding constraint whenever the batch
    is not re-run. GENERIC, CONSTANT-FACTOR: no exponent moves; the
    per-target cost at U >= U_0 matches the known Kuhn-Struik / FJM
    sqrt(2 U N)/U per target only in order of magnitude and the record
    claims nothing beyond the measured T_0(U) curve.
    (D) WHAT IS NOT CLAIMED. No exponent moves: online 1/3, advice 1/3,
    precomputation 2/3 in N are unchanged at U = 1, and the Kuhn-Struik 1/2
    with U-amortisation is unchanged at U >= U_0. The mechanism is generic
    and constant-factor. The record sits relative to the Corrigan-Gibbs-
    Kogan multi-instance line S T^2/M + T^2 = O(MN) (Theorem 11, read by the
    coordinator 2026-09-06; see structural_ingredients) and to the single-
    instance ceiling S T^2 = Omega~(eps N) (KN-LIT-013); it does not claim
    to move either. Every conclusion is claim_tier toy and scoped to the
    tested (N, a, r, k, cap, walk, solver) grid.

  mechanism: >-
    STEP 1. Build X_0 with T_0 entries by the count rule at r = 2, a = 1/4
    (Bernstein-Lange point), P charged; also with the length rule of
    IDEA-20260906-05ffb8 as a second arm.
    STEP 2. Draw U targets with seeded known logs (for certification only;
    never read by the solver). Process sequentially with the four outcomes
    of claim (A); weighted union-find with path compression storing, per
    node, the affine relation to its root.
    STEP 3. Record per target: number of walks used, group operations,
    outcome type, time-of-resolution (immediately, later in the batch, or
    never); certificate check at resolution.
    STEP 4. Sweep T_0 in T_BL * {0, 1/8, 1/4, 1/2, 3/4, 1} and U in
    {1, 8, 64, 512, 4096, 32768} at N in {2^24, 2^27, 2^30}, k in {2, 4, 8};
    interpolate T_0(U) at epsilon in {0.8, 0.9} for the batch average and
    for the first-10% slice.
    STEP 5. Two memory arms: UNCAPPED (all batch DPs stored) and CAPPED
    (S_peak <= T_BL; once full, new batch DPs are stored only if a relation
    can be recorded, otherwise dropped), so the frontier point is reported
    at equal peak memory as well.
    STEP 6. Controls and nulls below; every solved log certified by an
    independent scalar multiplication on the curve arm.

  assumptions:
    - >-
      Basin model of IDEA-20260906-aed829 (H1, H2). The batch coverage law
      in claim (C) is a derivation of this record, not a cited result.
    - >-
      Kuhn-Struik's sqrt(2 L N) figure is relayed from a WebFetch summary of
      the SAC 2001 PDF and is used only as the T_0 = 0 comparator; the
      summary tool's reliability is limited and the figure must be re-read.
    - >-
      Corrigan-Gibbs-Kogan's multi-DL preprocessing lower bound and attack
      were read by the coordinator at the level of Theorem 8 (multi-instance
      lower bound) and Theorem 11 (matching algorithm) on 2026-09-06
      (scratchpad cgk.txt lines 1100-1137 and 1415-1427; recorded in
      H-ECDLP-37dc01 structural_ingredients). The full paper is not re-read
      in this session; the single-instance bound is from the abstract
      (KN-LIT-013). The record does not claim to be inside or outside the
      full multi-DL attack beyond the committed reading.
    - >-
      Targets are independent uniform; the batch is non-adaptive; no target
      is a live key (RQ constraint).
    - >-
      Group operations are counted, never timed. A walk step is one group
      operation; restart scalar multiplications, table lookups and
      certificate checks are counted separately and excluded from L, as the
      paper excludes its randomisation and double-check multiplications.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: >-
        U = 1 (or T_0 = T_BL, U = 1): the record IS the static
        Bernstein-Lange selected table at N/T = 2, and that slice must
        reproduce the published 1.79 (l/T)^{1/2} within 10% under the
        instrument (EXP-ECDLP-1de2ec gate G2).
      reproduction_check: >-
        Frozen regression fixture: scaled main-computation cost at
        (a, r) = (1/4, 2) against 1.79 and precomputation against 1.17-1.24
        (lT)^{1/2}; the a = 1/2 cells against Table 4.1's 1.62.
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor reduction of precomputed entries at fixed
        (P, L, epsilon, U) on the tested grid, claim_tier toy; nothing
        about exponents.
      nearby_object_control: >-
        The static T_BL table (U = 1 baseline) and the pure Kuhn-Struik
        T_0 = 0 arm (P = 0 comparator), both measured in the same contract.
    proof_obligations: []
    not_applicable_reason: >-
      Empirical composition hypothesis; no theorem, bound or reduction is
      claimed. The only proof-shaped content (the basin-partition identity
      and the closed forms) is carried by IDEA-20260906-aed829 /
      IDEA-20260906-ac100b and by H-ECDLP-3550b8; the fields above that are
      filled are the baseline embedding and the ceiling, which are cheap
      pre-compute audits and are enforced as gates in the contract.

  rerandomization: >-
    Every online walk starts at Q_u + [c]P for an independent uniform scalar
    c (the paper's h g^y), so the k walks of a target are k independent
    uniform starts in the group and the table's hit probability is the basin
    mass of its entries regardless of the target; a hit at DP d with
    accumulated walk scalar s gives log Q_u = log d - c - s, pulled back to
    the input instance and certified by [k_u]P == Q_u. No mixing-time claim
    is made beyond Teske's empirical r-adding-walk heuristic (r >= 20
    behaves as a random walk at the level of the rho constant; KN-LIT-012);
    the generic-versus-curve transfer check in EXP-ECDLP-1de2ec is the only
    statement made about the walk's randomness, and it is a measurement.

  asymptotic_claim:
    problem: >-
      Batch discrete logarithm in a prime-order group with group-specific
      precomputed advice (the Bernstein-Lange / Corrigan-Gibbs-Kogan
      preprocessing model), U uniform targets against one table.
    prior_best: >-
      Bernstein-Lange selected table at N/T = 2: online 1.79 (N/T)^{1/2}
      per logarithm after 1.24 (NT)^{1/2} precomputation with T = N^{1/3}
      entries (retrieved primary text); at N/T = 8: 1.38 after 15.7 (a = 1/2,
      Table 4.1). Generic ceiling S T^2 = Omega~(eps N) (KN-LIT-013), tight;
      multi-instance S T^2/M + T^2 = Theta~(MN) (CGK Theorems 8 and 11, read
      by the coordinator 2026-09-06). Kuhn-Struik batch rho at about
      sqrt(2 U N) total (retrieved summary).
    time_exponent: >-
      ONLINE 1/3 in N per target at T_BL = N^{1/3} with L = k W fixed;
      UNCHANGED. PRECOMPUTATION 2/3 in N at U = 1, falling to 0 at
      U >= U_0; the record targets the constant of that fall.
    memory_exponent: >-
      Precomputed 1/3 in N at U = 1, falling with U; peak stored entries
      up to 1/3 (CAPPED arm) or growing with U (UNCAPPED arm, reported).
    hidden_cofactor: >-
      None claimed hidden; the honest overheads are the batch's working
      storage (reported as S_peak, capped arms priced), the union-find
      (O(U alpha(U))), the restart scalar multiplications O(k log N) per
      target (counted separately), and the early-batch penalty (reported,
      not hidden).
    claim_kind: constant_factor

  heuristic_assumptions:
    - id: HEUR-BGT-1
      formal_statement: >-
        BATCH COVERAGE LAW (H4 of IDEA-20260906-a3d6ae). The union of the
        basins of the DPs reached by m independent uniform-start batch
        walks, restricted to basins of size below x*_0 W^2, covers
        C_batch(m) = (2 pi)^{-1/2} * integral_0^{x*_0} x^{-1/2} (1 - e^{-a_m x}) e^{-x/2} dx,
        a_m = m W^2 / N, with relative error at most 10% for N >= 2^24,
        a_m <= 16.
      random_model_justification: >-
        Follows from HEUR-BLT-1 and HEUR-BLT-2 of H-ECDLP-3550b8 (inherited
        from IDEA-20260906-aed829) by the same integration as the unselected
        law (B1), truncated at the selection threshold; imitates the
        coupon-collector / size-biased coverage of a random partition by
        random samples.
      supporting_results:
        - >-
          The size-biased sampling identity of HEUR-BLT-2 (exact given the
          basin partition; Bernstein-Lange primary text lines 469-472,
          retrieved).
        - >-
          The unselected law (B1) of IDEA-20260906-aed829 (UNVERIFIED
          derivation of this batch; cited as a model number only).
      validation_experiment_ids: [EXP-ECDLP-1de2ec]
      falsification_condition: >-
        At N = 2^24 with exact basins, the measured below-threshold coverage
        of m in T_BL * {1/4 .. 16} batch walks after a selected table at
        a = 1/4, r = 2 differs from the integral by more than 10% in 3 or
        more of 5 seeds, or the largest below-threshold basin stored exceeds
        the threshold x*_0 W^2 in any seed (which audits the selection).
    - id: HEUR-BLT-1
      formal_statement: >-
        Inherited from H-ECDLP-3550b8: the DP-truncated functional graph of
        the walk has the law of a uniformly random function on N points
        truncated at an independent Bernoulli(theta) marking, up to o(1)
        relative error in every statistic used here, for N in [2^20, 2^30]
        and W <= N^{1/3}.
      random_model_justification: As in H-ECDLP-3550b8.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-869870, EXP-ECDLP-612fb1]
      falsification_condition: As in H-ECDLP-3550b8.
    - id: HEUR-BLT-2
      formal_statement: >-
        Inherited from H-ECDLP-3550b8: a uniform-start walk lands in the
        basin of DP d with probability |B(d)|/N independently across walks.
      random_model_justification: As in H-ECDLP-3550b8.
      supporting_results: []
      validation_experiment_ids: [EXP-ECDLP-869870, EXP-ECDLP-612fb1]
      falsification_condition: As in H-ECDLP-3550b8.

  structural_ingredients:
    - description: >-
        Pool-and-select table construction with the weight "total length of
        all walks reaching the point plus 4W per walk", walks capped at 8W,
        pool of N/T DISTINCT distinguished points, and the published
        constants 1.79 / 1.24 (Section 4) and Table 4.1.
      citation: >-
        Bernstein-Lange, Computing small discrete logarithms faster,
        INDOCRYPT 2012; cr.yp.to/dlog/cuberoot-20120919.pdf; eprint 2012/458
        (KN-LIT-3060 for the abstract-level constants)
      provenance: retrieved
      verified_by: >-
        coordinator full read 2026-09-06 (scratchpad bl2012.txt; lines
        458-486, 631-668, 672-741 re-read during the H-ECDLP-37dc01 design)
      role: selection rule, baseline frontier, regression fixture
    - description: >-
        Reuse of the distinguished points of solved instances as a resource
        for later instances (the precedent for admitting batch DPs to the
        table); the iteration function must be independent of the targets.
      citation: >-
        Kuhn-Struik, Random walks revisited, SAC 2001, LNCS 2259; and
        Hitchcock-Montague-Carter-Dawson, IJIS 3, 2004, as quoted in the
        Bernstein-Lange interlude (primary text lines 491-522)
      provenance: retrieved
      verified_by: >-
        idea-generator WebFetch summary 2026-09-06 (hedged); the interlude
        passage read by the coordinator in bl2012.txt
      role: precedent for the batch-DP source; target-independent walk requirement
    - description: >-
        Relation graph among users; all keys recovered when the graph
        connects; O~(sqrt(N L)) for L users.
      citation: >-
        Fouque-Joux-Mavromati, Multi-user collisions: applications to
        discrete logarithm, Even-Mansour and PRINCE, ASIACRYPT 2014
        (eprint 2013/761)
      provenance: retrieved
      verified_by: >-
        WebSearch summary 2026-09-06 (not opened); the relation-graph
        structure is the resolution mechanism adopted here
      role: resolution structure (union-find over relations)
    - description: >-
        Generic preprocessing lower bound S T^2 = Omega~(eps N) for the
        single-instance case (tight), and the multi-instance lower bound
        S T^2/M + T^2 = Omega~(eps^{1/M} N M) (Theorem 8) with the matching
        algorithm O~(S) advice, O~(T) online time, S T^2/M + T^2 = O(MN)
        (Theorem 11).
      citation: >-
        Corrigan-Gibbs and Kogan, The discrete-logarithm problem with
        preprocessing, EUROCRYPT 2018, eprint 2017/1113 (KN-LIT-013 for the
        single-instance bound)
      provenance: internal
      verified_by: >-
        coordinator read of scratchpad cgk.txt lines 1100-1137 (Theorem 8)
        and 1415-1427 (Theorem 11) on 2026-09-06, recorded in
        H-ECDLP-37dc01 structural_ingredients; the single-instance bound is
        from the ePrint abstract (KN-LIT-013, kb). The full paper is not
        re-read in this session.
      role: frontier placement; the multi-instance line the record is positioned against
    - description: >-
        Basin partition of the DP-truncated functional graph, the Borel
        (Poisson Galton-Watson) basin-size law and the closed forms (B1)-(B3)
        including C_max(a) and the oracle constant 1.28 at a = 1/4.
      citation: IDEA-20260906-aed829 (and the derivation record IDEA-20260906-ac100b)
      provenance: internal
      verified_by: >-
        NOT VERIFIED; derivations of this batch pending a validator; used as
        model predictions only
      role: distribution law and ceiling
    - description: >-
        Distinguished-point parallel collision search and Teske's r-adding
        walk heuristic.
      citation: KN-LIT-012 (van Oorschot-Wiener 1999; Teske 2001 noted there)
      provenance: kb
      verified_by: KN-LIT-012 record read by the coordinator 2026-09-06
      role: DP method; walk-randomness heuristic

  reduction_chain:
    core_problem: >-
      Batch discrete logarithm of U uniform targets in a prime-order group
      with a fixed-size precomputed table (advice) and a fixed per-target
      online walk budget, where the table may grow during the batch with
      the targets' own terminal DPs and relations are resolved by a
      weighted union-find.
    corollaries: []

  predictions:
    - metric: >-
        T_0(U)/T_BL(1) at epsilon = 0.9, k = 4, a = 1/4, r = 2, batch
        average (C1)
      direction: lower
      minimum_effect: >-
        Below 0.75 with CI excluding 1.0 by U = T_BL/2, and below 0.25 by
        U = 4 T_BL; predicted shape: linear in U with slope about
        -beta k / T_BL, beta in [0.3, 0.7], then a tail to 0.
    - metric: >-
        T_0(U)/T_BL(1) for the FIRST 10% of targets at the same epsilon
        (C3, the binding constraint for a non-repeatable batch)
      direction: lower
      minimum_effect: >-
        Strictly above the batch-average ratio at every U (CI-separated
        for U >= T_BL), and above 0.5 until U >= 4 T_BL; this is the
        binding number for a non-repeatable batch.
    - metric: >-
        measured solved fraction relative to the LOWER and UPPER brackets
        of claim (C) (C2, the deferred-resolution loss)
      direction: different
      minimum_effect: >-
        Inside the brackets at every cell; the gap (UPPER - measured) below
        0.05 when C_sel >= 0.2 and growing as T_0 -> 0.
    - metric: >-
        peak stored entries S_peak in the UNCAPPED arm
      direction: higher
      minimum_effect: >-
        Grows with U as the number of new-DP outcomes, predicted about
        U k (1 - C_known) integrated; the CAPPED arm at S_peak = T_BL must
        still show T_0(U)/T_BL below 0.75 by U = 2 T_BL (a weaker but
        frontier-honest claim).
    - metric: >-
        T_0(U) under NULL 1 (union-find disabled) and at phi = 0
      direction: different
      minimum_effect: Equal to T_BL within CI at every U.
    - metric: >-
        T_0 = 0 arm per-target cost at U = 32768
      direction: different
      minimum_effect: >-
        Within a factor 2 of sqrt(2 N / U) group operations per target
        (Kuhn-Struik order), reported as the P = 0 comparator; a larger
        deviation flags a bookkeeping problem, not a finding.

  test_boundary:
    instances: >-
      Generic instrument: keyed random function on [0, N) at N = 2^24
      (pilot) and N in {2^24, 2^27, 2^30} (full sweep), exact basins at
      2^24. Certified arm: one toy prime-order short-Weierstrass curve over
      F_p with p about 2^24 and prime group order N about 2^24, found by
      search over small (a, b) with point counting, r-adding walk with
      r = 32 and known scalars.
    parameters: >-
      T_BL = N^{1/3} rounded to {64, 256, 1024} at N = {2^20, 2^24, 2^30};
      W = sqrt(a N / T_BL) with a = 1/4 (headline) and a = 1/2 (second
      point); r = 2 (headline) and r in {2, 4, 8} (sweep); k = 4 (headline)
      and k in {2, 4, 8} (sweep); cap 8W; T_0 in {T_BL, T_BL/2, 0} (pilot)
      and T_BL * {0, 1/8, 1/4, 1/2, 3/4, 1} (full sweep); U in
      {1, 512, 4096} (pilot) and {1, 8, 64, 512, 4096, 32768} (full sweep);
      epsilon in {0.8, 0.9}; 3 seeds (pilot), 5 seeds (full sweep); memory
      arms UNCAPPED and CAPPED (S_peak <= T_BL).
    implementation: >-
      Counted group operations only; single implementation for all arms
      with the arm selected by configuration so that controls differ from
      the treatment in exactly the declared way; the U = 1 baseline arm
      must equal the static Bernstein-Lange table bit-for-bit under the same
      seeds; every curve-arm solve certified by an independent scalar
      multiplication and by equality with the seeded logarithm.
    budget:
      total_cpu_hours: 2
      maximum_runs: 24
      maximum_memory_gb: 4
      wall_clock_seconds_per_run: 3600
    out_of_scope: >-
      Cryptographic sizes; skewed or adaptive target distributions;
      multi-curve settings (RQ-MTGT-2cabee); any table that stores
      unsolved walks or relations beyond the declared batch-DP entries
      (the growth-type comparator is this record itself); any statement
      about exponents.

  distinguishable_outcomes:
    - outcome: >-
        Stage 0 gate passed (CGK multi-DL composition read; the resolution
        structure is already CGK's/Kuhn-Struik's/FJM's, the charged T_0(U)
        recurrence is not stated in CGK per the committed reading); the
        pilot separates "the batch supplies coverage" from "the batch
        supplies only pending relations that never resolve"; T_0(U)/T_BL
        falls below 0.75 with CI by U = T_BL/2 and below 0.25 by U = 4 T_BL;
        the first-10% slice is strictly above the batch average; the solved
        fraction is inside the LOWER/UPPER brackets; NULL 1 is at T_BL
        within CI; the T_0 = 0 arm is within a factor 2 of Kuhn-Struik.
      means: >-
        EFFECT AND MECHANISM supported at toy scale on the tested grid: a
        constant-factor precomputed-entry reduction toward 0 at fixed
        (P, L, epsilon) for batches of order 4 T_BL, bought with online
        memory that is on the record. Nothing about exponents; positioned
        relative to the CGK multi-instance line.
    - outcome: >-
        As above but the first-10% slice matches the batch average within
        CI at U >= T_BL while the batch average falls.
      means: >-
        An effect without the claimed mechanism: the growth is not what
        drives the gain; something else (e.g. a static-table effect) is
        being measured. The effect clause is supported, the mechanism clause
        is inconclusive; no mechanism claim is promoted and the first-10%
        binding constraint is reported as the open question.
    - outcome: >-
        T_0(U)/T_BL is not below 1 with CI at U = 4 T_BL, k = 4, with the
        pilot gates passed and nulls clean.
      means: >-
        REJECTED IN THE STATED REGIME: the batch's own DPs do not substitute
        for precomputed entries at this budget. The obstruction quantity is
        T_0(4 T_BL)/T_BL with its CI over the stated scope; the full-T_BL
        arm's residual effect (if any) is reported beside it.
    - outcome: >-
        NULL 1 (union-find disabled) shows a T_0 reduction, or the measured
        solved fraction falls below the LOWER bracket.
      means: >-
        INSTRUMENT ARTIFACT OR LEAK. The run set is invalid; nothing is
        reported as evidence for or against the hypothesis.
    - outcome: >-
        The CAPPED arm shows no reduction while the UNCAPPED arm does.
      means: >-
        The gain is a memory trade, to be reported as a frontier point on
        the (P, S, L, epsilon, U) axis and not as a T reduction; the
        record is re-priced at S_peak.
    - outcome: >-
        Any run ends by timeout, crash, memory exhaustion or dependency
        failure.
      means: >-
        Infrastructure signal only (AGENTS.md rule 5); never evidence.

  falsification_conditions:
    - >-
      T_0(U)/T_BL is not below 1 with CI at U = 4 T_BL, k = 4: the batch's
      own DPs do not substitute for precomputed entries at this budget;
      the record is rejected in its stated regime (explanation B of the
      report).
    - >-
      The measured solved fraction falls below the LOWER bracket: the
      accounting or the union-find is wrong; invalid run set.
    - >-
      NULL 1 shows a T_0 reduction: lookups are leaking; invalid.
    - >-
      The first-10% slice matches the batch average within CI at U >= T_BL:
      the growth is not what drives the gain; a mechanism claim is
      withdrawn.
    - >-
      The CAPPED arm shows no reduction while the UNCAPPED does: the gain
      is a memory trade, to be reported as a frontier point and not as a T
      reduction.

  interpretation_limits:
    - >-
      Toy scale, claim_tier toy. Generic; constant-factor; the exponent 1/3
      (or the Kuhn-Struik 1/2 with U-amortisation) does not move.
      Extrapolation beyond the tested N is an assumption stated per evidence
      record, never a result.
    - >-
      The reduction is in PRECOMPUTED entries at fixed per-target L and
      epsilon; it is bought with online memory in the UNCAPPED arm and the
      CAPPED arm is the frontier-honest version. S_peak is reported beside
      T_0 on every cell (RQ-ECDLP-78dbc5 definition of fewer_DP).
    - >-
      Applies to a non-adaptive batch of independent targets on one curve;
      says nothing about multi-curve settings (RQ-MTGT-2cabee).
    - >-
      The generic instrument certifies nothing (kind: none); only the curve
      arm carries discrete_log certificates, and only its cells may be
      quoted as solved logarithms.
    - >-
      The record is positioned relative to the CGK multi-instance line
      S T^2/M + T^2 = O(MN) (Theorem 11) and the single-instance ceiling
      S T^2 = Omega~(eps N) (KN-LIT-013); it does not claim to move either.
      The resolution structure is already CGK's (and Kuhn-Struik's and
      FJM's); the charged T_0(U) recurrence with a selected table is not
      stated in CGK per the committed reading.

