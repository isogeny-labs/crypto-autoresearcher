  inference: >-
    ON THE TESTED CELLS ONLY -- the frozen v2 splitmix64 keyed-random-function
    instrument with an independently keyed DP predicate, exact basins,
    N in {2^20, 2^24}, T in {64, 256}, T_sel = floor(T/2), r in {2, 4, 8},
    a in {1/16, 1/8, 3/16, 1/4}, seeds {1..5}, claim tier TOY:
    (1) AT a = 1/16, r = 2, N = 2^24 THE G3 CEILING PREDICATE PASSES 5/5, and
    the round's only independent implementation agrees on the verdict AND on
    all five per-seed signs. This is the most robust result in the batch: it
    survived a proves-too-much control (blind band 1.7% of the PASS headroom),
    a 20-seed extension (20/20 seeds positive, 15504/15504 draws PASS), and a
    halving-loss null the Red Team built (NULL_T returns 0/5, margin collapses
    +0.020565 -> -0.000626).
    (2) AT a = 1/8, r = 2, N = 2^24 THE VERDICT IS PASS UNDER BOTH READINGS BUT
    THE CELL IS MARGINAL AND THE TWO READINGS DISAGREE AT SEED 2. Producer
    5/5, independent implementation 4/5 with an opposite sign at seed 2 and a
    +0.00026 margin at seed 3. READ THE PAIRING CAVEAT IN
    `j2_seed_pairing_caveat` BELOW BEFORE QUOTING THAT DISAGREEMENT: the two
    readings use DIFFERENT instrument families, so the seed index is a label of
    each implementation's own draw and not a shared object, and this is a
    difference between two independent 5-draw samples rather than two answers to
    one determinate question. The Red Team independently measured this cell as
    roughly FOUR TIMES LESS ROBUST than a = 1/16 on two unrelated statistics:
    verdict headroom 0.005128 against 0.017438, and NULL_A ratio 0.0888 against
    0.3599. a = 1/8 IS NOT ESTABLISHED BY THIS ROUND AND MUST NOT BE QUOTED
    ALONGSIDE a = 1/16 AS THOUGH IT WERE.
    (3) THE KNOWN-FALSE OBJECTS BEHAVED AS REQUIRED. 10 of 10 returned G3 FAIL;
    the interpretation stopping condition was NOT engaged. EV-ECDLP-60e266's
    standing obstruction at a = 1/4 is CORROBORATED, at four times the seed
    count (0/20 seeds, 0/15504 draws), and is neither reopened nor weakened.
    (4) THE EFFECT IS ATTRIBUTED, NOT MERELY OBSERVED. The Red Team's NULL_T
    localises the PASS to BASIN-SIZE TAIL CONCENTRATION rather than to any
    property of the w(d) estimator, and the frozen controls did not reach that
