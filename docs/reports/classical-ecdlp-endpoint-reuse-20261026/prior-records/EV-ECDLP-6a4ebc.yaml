    - "NONE ARE MADE BY THIS RECORD, and none may be read into it. The Red Team's own transfer audit reports transfer_assumptions_made_by_this_report as `none` and cells_not_run as empty."
    - "WHAT WOULD HAVE TO BE TRUE FOR ANY TRANSFER, named because a later reader will want it: estimator_loss(T, r = 2) must stay near 0.099 as T grows. It is measured at exactly TWO T points, T = 64 and T = 256 -- 2 bits of T -- and any transfer of the a-crossing rests on that flatness continuing over roughly 77 further bits of T. TWO POINTS DO NOT CARRY A TREND AND THIS RECORD DOES NOT READ ONE."
    - "THE SCALE GAP, IN ORDERS OF MAGNITUDE. Tested N spans 2^20 -> 2^24: a factor of 16, about 1.2 orders of magnitude. A cryptographically relevant group order is about 2^256 -- another ~70 orders of magnitude, with T = N^(1/3) moving from 256 to about 2^85, roughly 25 orders of magnitude in T. The batch's entire N-dependence evidence is TWO points: the pooled a = 1/8 margin is +0.004724 at N = 2^20 and +0.006933 at N = 2^24. It did not shrink. That is not a trend."
