  # =====================================================================
  # 7. OBSTRUCTION -- MEASURED, WITH A GENUINE RESOURCE CHECK
  # =====================================================================
  obstruction:
    statement: >-
      ESTIMATOR-LOSS SATURATION. The coverage that the realistic w(d) selection
      gives up against a full-table oracle SATURATES near 0.099 for EVERY
      a >= 1/8 at BOTH tested N, while the halving loss tracks TopShare(T) and
      GROWS with a. This is a claim about the OBJECT -- the basin-size
      distribution under this instrument -- not about any attempt: G3 is
      feasible exactly where TopShare(T) is small enough that roughly a third of
      it sits under that ~0.099 ceiling, and the crossing lies between
      TopShare(T) = 0.271 (a = 1/8, PASS) and 0.339 (a = 3/16, FAIL). It is what
      obstructs G3 feasibility at a >= 3/16 under this instrument at
      T_sel = T/2, r = 2 -- and, IF the saturation persists in T, what would
      obstruct any transfer of the a-crossing to larger parameters.
    quantity: "estimator_loss = TopShare(T) - StaticCov(T, r)"
    value: >-
      Dimensionless coverage fraction of N (exact single-walk hit probability).
      At N = 2^24, T = 256, r = 2, five frozen seeds -- mean, sd, min, max:
      a = 1/16: 0.086427, sd 0.005424, [0.080709, 0.093891];
      a = 1/8 : 0.099115, sd 0.002594, [0.095507, 0.102094];
      a = 3/16: 0.098247, sd 0.010995, [0.088372, 0.111361];
      a = 1/4 : 0.099258, sd 0.011700, [0.084919, 0.112768].
      At N = 2^20, T = 64, r = 2, five frozen seeds -- mean only:
      a = 1/16: 0.080968; a = 1/8: 0.095537; a = 3/16: 0.103840; a = 1/4: 0.099049.
      ERROR BARS: sample standard deviation over the five frozen seeds, quoted
      above. WITH n = 5 THESE ARE INDICATIVE ONLY. The Red Team's 20-seed
      extension covers the MARGIN, not the DECOMPOSITION, so no tighter interval
      is quoted than the data supports.
    measured_by:
      - RUN-ECDLP-612fb1-v3-g3x24-s1
      - RUN-ECDLP-612fb1-v3-g3x24-s2
      - RUN-ECDLP-612fb1-v3-g3x24-s3
      - RUN-ECDLP-612fb1-v3-g3x24-s4
      - RUN-ECDLP-612fb1-v3-g3x24-s5
      - RUN-ECDLP-612fb1-v3-rep20-s1
      - RUN-ECDLP-612fb1-v3-rep20-s2
      - RUN-ECDLP-612fb1-v3-rep20-s3
      - RUN-ECDLP-612fb1-v3-rep20-s4
      - RUN-ECDLP-612fb1-v3-rep20-s5
    measured_by_note: "recomputed by the Red Team (TASK-20260907-ee1ca7) from each measurement run's own raw-result.json. The decomposition is ARITHMETIC on quantities the runs already record and introduces NO new measurement."
    scope: >-
      The frozen v2 splitmix64 instrument with an independently keyed DP
      predicate, exact basins, T in {64, 256}, T_sel = T/2, r = 2,
      N in {2^20, 2^24}, five seeds. NOTHING OUTSIDE THAT. In particular this is
      not claimed for any group, any curve, any other selection weight, or any T
      beyond the two measured.
    resource_check:
      examined: true
      reading: >-
        YES, AND THE ASSET READING IS THE MORE INTERESTING OBJECT. A ~0.099
        saturating estimator loss that is nearly INDEPENDENT of a and of N is
        much more than the boolean it was reduced to. If it is genuinely a
        CONSTANT OF THE w(d) ESTIMATOR rather than a parameter-dependent
        quantity, then it is a REUSABLE BUDGET: it says how much coverage ANY
        w(d)-selected table gives up, and it converts the feasibility question
        at any (a, T) into a single arithmetic test -- "is the halving loss
        below the constant?". THAT WOULD MAKE THE CROSSING PREDICTABLE RATHER
        THAN MEASURABLE-ONLY, and would let a successor predict the crossing a
        at parameters too large to measure directly. The same saturation that
        kills a >= 3/16 is the hypothesis of that successor.
      what_would_have_to_be_true: >-
        estimator_loss(T, r = 2) must stay near 0.099 as T grows. IT IS MEASURED
        AT EXACTLY TWO T POINTS (T = 64 and T = 256; remarkably flat there --
        0.099049 -> 0.099258 at a = 1/4). This is the same quantity as the Red
        Team's open objection O7, and THE SAME EXPERIMENT TESTS BOTH: the asset
        reading and the transfer claim stand or fall together. One T-sweep at
        fixed N = 2^24, T in {64, 128, 256, 512, 1024}, r = 2, five seeds,
        reporting estimator_loss and halving_loss SEPARATELY rather than the
        boolean, resolves both. Exact basins already cost ~0.46 GiB and ~24 s
        per seed and are computed ONCE PER SEED regardless of T, so the marginal
        cost is one extra sort per (T, seed): minutes, not hours.
      spawned_ids: []
      spawned_ids_note: >-
        No IDEA-* or H-* record is minted by this evidence record -- minting is
        not this record's act. The resource reading is carried as the RANK 1
        next action of DEC-20260907-6d9427 and of the BATCH-8f3e86 checkpoint
        shard, so it is scheduled work rather than a note. It is also visible to
        tools/obstruction_registry.py from this block at every rerank.
      recorded_as_a_resource_not_a_verdict: true

