  direction_note: >-
    DELIBERATELY `neutral`, and the reason is the single most important line in
    this record. G3 is a CEILING predicate: it compares the exact coverage of
    the BEST POSSIBLE T_sel-entry table against the exact coverage of a
    REALISTICALLY-SELECTED T-entry table. Clause (C1) of H-ECDLP-37dc01 is a
    MECHANISM claim about an online LOWER-bracket re-selection procedure
    reaching a steady state by U = 8T. ZERO ONLINE ARMS RAN IN THIS BATCH. A
    G3 PASS therefore removes a NECESSARY PRECONDITION blocker at the tested
    cell; it is not evidence that any online procedure attains the ceiling at
    any batch size U. DEC-20260907-9b1b02 recorded this exact slide once
    already for EXP-ECDLP-6ac801 and the v3 amendment's Section 9 restates it.
    Recording `supports` here would license a later reader to quote "evidence
    supports H-ECDLP-37dc01", which this round does not establish. The full
    directional content -- what moved which way, and by how much -- is in
    `inference` and `observations` and is not hidden by this field.
