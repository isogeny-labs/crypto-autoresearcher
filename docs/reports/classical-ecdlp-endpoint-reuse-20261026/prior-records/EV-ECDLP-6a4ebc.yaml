      detail: "The contract asks for a BCa 95% bootstrap CI 'stratified by seed'. Each cell holds exactly ONE margin per seed, so resampling WITHIN a seed stratum is degenerate -- it returns that seed's single value every time and yields a zero-width interval. The Executor took THE SEED as the resampling unit and resampled the five seed-level values, recording the choice in three places rather than resolving it silently."
      blast_radius: "CI ENDPOINTS ONLY. No margin, pass_count or verdict depends on it; those are computed from the per-seed margins directly and never from the bootstrap. The per-seed margins are retained in every run's raw-result.json, so any other CI can be recomputed without re-running anything."
      status: "RATIFIED FOR THIS BATCH'S CI ENDPOINTS by DEC-20260907-6d9427 procedure deviation PD-2. A different resampling unit requires a further versioned protocol_amendment."
      disambiguation: "The Executor's OWN unexpected_observations U2 is a DIFFERENT item -- the near-boundary seed-2 margin of -5.525e-05 at the known-false object a = 3/16. It is carried at OBS-7 and is not suppressed."
