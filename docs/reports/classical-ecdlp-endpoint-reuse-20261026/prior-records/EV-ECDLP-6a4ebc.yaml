    N_values_pow2: ['2^20', '2^24']
    T: {'2^20': 64, '2^24': 256}
    T_note: "T = round(N^(1/3)), frozen by specification.v2.yaml; the frozen values are used, not recomputed."
    T_sel: {'2^20': 32, '2^24': 128}
    T_sel_note: "T_sel = floor(T/2) EXACTLY. This is the quantity under test and no other T_sel was run."
    a_values: [0.0625, 0.125, 0.1875, 0.25]
    a_values_note: >-
      a = T*W^2/N. a in {1/16, 1/8} are the PRIMARY cells; a in {3/16, 1/4} are
      the KNOWN-FALSE proves-too-much controls of Section 6, where a PASS would
      have been a stopping condition for interpretation.
    r_values: [2, 4, 8]
    r_note: "r = 2 is the primary cell; r in {4, 8} are the Section 5 decay control."
    seeds: [1, 2, 3, 4, 5]
    seeds_note: >-
      Five, exactly, declared in the frozen amendment before execution and never
      chosen after seeing an outcome. Seed policy is v2's, unchanged: walk-key
      seed s; precomputation restart stream s; tie-break stream 400 + s;
      NULL_A_G3 relabelling stream 300 + s. Bootstrap resampling generator
      seeded 20260907 (STAGE 3C only).
    walk_and_cap:
      description: >-
        A walk iterates the keyed map from a uniform start until it meets a
        distinguished point. cap = ceil(8*W) steps; a walk reaching the cap
        without meeting a DP is a MISS, is CHARGED cap steps, and contributes
        no DP.
      W_and_cap_at_2_24: {a_1_16: {W: 64.000000, theta: 0.015625000, cap: 512}, a_1_8: {W: 90.509668, theta: 0.011048544, cap: 725}, a_3_16: {W: 110.851252, theta: 0.009021100, cap: 887}, a_1_4: {W: 128.000000, theta: 0.007812500, cap: 1024}}
