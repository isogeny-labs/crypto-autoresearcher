      evaluated by this item and are neither met nor falsified by it.
    budget_actuals: "eleven runs, all completed_valid, zero failed_infrastructure, zero completed_invalid; 4-core, 15 GB container. Exact basins at 2^24 cost ~0.46 GiB and ~24 s per seed (Red Team's measurement, j6_cost_scope_audit.md)."

