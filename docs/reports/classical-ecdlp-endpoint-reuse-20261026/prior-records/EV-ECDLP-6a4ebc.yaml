    (3) VALIDATOR J3's BITWISE AGREEMENT IS STRUCTURALLY FORCED and cannot
    raise strength: source_v3/g3_predicate.py and source_v2/run_ascan.py call
    the same frozen instrument, so identity is the expected result of correct
