      lane reached this framing WITHOUT ACCESS TO THIS ROUND, and this round's
      Validator reached its P2 disclosure without access to that lane. The
      convergence is corroboration of the caveat, not an echo.
    how_it_changes_this_record: >-
      IT RAISES CONFIDENCE IN THE VERDICT AND LOWERS CONFIDENCE IN NOTHING.
      Before this fetch, the honest reading was that a = 1/8 had one independent
      reading and it dissented at a draw. The committed cross-lane picture is
      better than that: THREE readings of the cell -- two independent
      implementations at 4/5 and the frozen-instrument production arm at 5/5 --
      all returning verdict PASS at the >= 4/5 bar, with every one of the fifteen
      draws but two lying above zero and both exceptions within 0.003 of it. That
      is what a small POSITIVE population margin with instrument-family variance
      straddling zero looks like.
    how_it_does_NOT_change_this_record: >-
      FOUR WAYS, EACH LOAD-BEARING.
      (i) STRENGTH STAYS `preliminary`. EV-ECDLP-6783b8 independently assigned
      itself `preliminary` on the same cell for the same reason, and two
      preliminary samples are not a replication tier; they are two samples.
      (ii) THE DECISION VERB STAYS `replicate`. If anything the concordance
      confirms `replicate` was the right verb: replication is precisely what is
      accruing, and it is not yet complete.
      (iii) RESIDUAL R3 IS STILL NOT DISCHARGED BY THIS BATCH. Another lane's
      independent implementation is not this batch's third angle, and this
      record may not borrow it to discharge its own contract's obligation.
      (iv) IT LICENSES NO PROMOTION. a = 1/8 remains a CEILING result with an
      oracle TopShare(T_sel), zero online arms, and the same uncharged Theta(N)
      basin cost. Concordance about a ceiling is still only about the ceiling.
    a_reader_must_not_conclude: >-
      That "the a = 1/8 disagreement is resolved". It is BETTER CHARACTERISED,
      not resolved: three five-draw samples at a cell whose margin is within
      0.012 of zero under every reading is a small sample of a borderline
      quantity, and the successor's larger-seed arm is still owed.
    provenance: >-
      All statements in this block are read directly from
      `git show origin/main:ledger/evidence/EV-ECDLP-6783b8.yaml` and
      `git show origin/main:ledger/hypotheses/H-ECDLP-37dc01.yaml` during this
      archive (provenance: internal). Nothing here is recalled, and no number is
      restated from memory.

