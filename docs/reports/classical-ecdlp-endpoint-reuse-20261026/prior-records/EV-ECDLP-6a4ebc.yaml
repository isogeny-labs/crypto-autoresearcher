  # ---------------------------------------------------------------------
  # 4a. HOW THE J2 DISAGREEMENT MUST BE READ -- A PAIRING CAVEAT THIS
  #     COORDINATOR ADDS, WITH THE VALIDATOR'S OWN WORDS SUPPORTING IT
  # ---------------------------------------------------------------------
  j2_seed_pairing_caveat:
    the_caveat: >-
      THE SEED INDEX IS NOT A SHARED OBJECT ACROSS THE TWO READINGS, so
      "producer +0.005128 at seed 2, validator -0.002952 at seed 2" is NOT two
      computations of one determinate number returning two answers. Section 3 of
      the v3 amendment fixes the seeds {1..5} but leaves the INSTRUMENT FAMILY to
      the implementer under reading P2. The producer used the frozen v2
      splitmix64 keyed map with a keyed DP predicate; the Validator's sealed
      implementation used, by its own disclosure
      (j2_seal_manifest.yaml `iii_instrument_family_reading_P2`), a uniformly
      random function on Z_N drawn from numpy PCG64 with an INDEPENDENT
      Bernoulli(theta) DP marking -- explicitly "NOT a permutation and NOT
      mix64". Two different random-function families indexed by the same integer
      label produce two INDEPENDENT draws, not the same draw twice.
    what_therefore_survives_unchanged: >-
      THE J2 VERDICT AND EVERYTHING THIS RECORD CONCLUDES FROM IT. The Validator
      did not claim an implementation error and said so explicitly -- "I have no
      evidence of an implementation error in either direction, and I am not
      asserting one" -- and stated the finding in exactly the terms the caveat
      supports: "the a = 1/8 PASS IS NOT ROBUST TO THE INSTRUMENT FAMILY, while
      the a = 1/16 PASS IS". The frozen review_plan predicted this mechanism in
      advance, in its own words: "a different random-function family can plausibly
      flip a seed's SIGN there without any implementation error at all." So the
      caveat SHARPENS the finding rather than softening it; it removes only an
      over-reading the wording invites.
    what_it_changes: >-
      ONE THING, AND IT MATTERS FOR ANY SUCCESSOR. The right comparison at a = 1/8
      is DISTRIBUTIONAL, not seed-paired: two independent five-draw samples, one
      returning 5/5 positive and one returning 4/5 with a narrowly negative draw.
      A successor that seeks to "resolve seed 2" is chasing a label. What is
      actually open is the SIGN OF THE POPULATION MARGIN at this cell, and the
      instrument-family variance around it, which is answered by more draws and
      more families -- not by re-running seed 2.
    why_this_is_the_coordinator_s_call_and_not_an_override: >-
      The Validator owned joint J2 and this Coordinator does not re-litigate its
      verdict, which stands as `breaks`. What is composed here is the READING of
      that verdict against a fact the Validator itself put on the record (its own
      disclosed choice iii) and against a second lane's independently-reached
      identical framing (see `cross_lane_concordance` below). Composing owned
      joint reports is this role's job; re-scoring them is not.

