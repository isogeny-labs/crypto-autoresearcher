  tested_scope:
    instrument: >-
      The FROZEN v2 instrument of EXP-ECDLP-612fb1, unmodified: a splitmix64
      keyed pseudorandom iteration map on Z_N with an INDEPENDENTLY keyed
      Bernoulli(theta) distinguished-point predicate. Exact basins, computed by
      full enumeration. STAGE 3B imports source_v2/instrument.py unchanged (a
      requirement of the amendment's Section 3, and the fact that defeats
      residual R3 -- see `independence_limitations`).
