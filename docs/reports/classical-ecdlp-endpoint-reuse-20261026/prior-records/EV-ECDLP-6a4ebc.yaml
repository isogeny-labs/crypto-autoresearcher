      source: "experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml g3_predicate.exact_parameter_table_for_this_item (provenance: internal, read in full by this authorship)"
    solver: >-
      NONE. No discrete logarithm is solved anywhere in this batch and no solver
      is exercised. The measured objects are two exact coverage fractions per
      (cell, seed): TopShare_s(T_sel), the exact coverage of the T_sel largest
      basins (an ORACLE, computable only with exact basin sizes), and
      StaticCov_s(T, r), the exact coverage of the T entries a REALISTIC pool
      procedure selects by w(d) = S_d + 4*W*h_d from POOL EVIDENCE ONLY with a
      seeded ascending tie-break. margin_s := TopShare_s(T_sel) - StaticCov_s(T, r).
    predicate: >-
      g3_s := [margin_s >= 0]; G3 PASSES at a cell iff pass_count >= 4 of 5.
      The >= 4-of-5 threshold is v2's own frozen rule, reused verbatim.
    online_arms_run: 0
    online_arms_note: >-
