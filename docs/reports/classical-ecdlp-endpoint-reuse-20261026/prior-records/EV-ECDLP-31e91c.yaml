  inference: >-
    No inference about H-ECDLP-3550b8 is licensed by this batch. The
    instrument's blocking comparability gate at N = 2^24 FAILED under
    the frozen contract -- on one of seven cost cells by 0.0005 ((1, 8):
    1.6005 vs 1.50, tolerance 0.10) and on four of seven precomputation
    cells by 14.6-20.9% (tolerance 12%) -- so by invalidation rule 3 the
    2^24, 2^30 and curve cells are invalid-for-interpretation as not
    comparable to the paper, and by the success criterion's own text
    nothing downstream (V2-V5, M1-M5) is scored. This is an instrument-
    comparability outcome, never a negative about the basin model
    (contract falsification text; AGENTS.md rule 5 analogue). What the
    batch nevertheless leaves on the record, labelled: the 2^30 gate
    passes as measured on all fourteen numbers; the headline (1/4, N/T = 2)
    cell passes at 2^24 (1.708 vs 1.79) but the validator's blind
    re-derivation places every instrument of this class 0.06-0.11 below
    1.79 at theta = 1/128, so that pass is band-edge and not stable under
    re-keying; the exact global top-T share tracks C_max(a) to within
    0.3-2.4% at every (N, a) (ratios 0.976-1.008); the survival slopes
    read -0.58 to -0.65 under the declared estimator against the
    asymptotic -0.5 while the exact finite-theta Borel law reads -0.60 to
    -0.63 under the same estimator; the relabelling null sits within 1.96
    seed-sd of the unselected control at every exact cell but one; the
    published-weight-over-generated-oracle ratio is non-monotone in r (dip
    at r = 4) in every cell; and the fixture cost cells drift beyond the
    2^30 CI under a linear-in-theta trend fitted through the capped-mass-
    inflated 2^20 point. Every curve-arm solve is certified (404028
    emitted = passed, 144000 independently re-verified). The instrument is
    not validated in this batch; the successor cell is a re-keyed 2^24
    fixture (>= 8 keys per instrument, murmur3 and splitmix64) under a
    versioned amendment that states the O(theta) correction or gates at
    2^30, after which V1-V5 can be scored.

  boundaries:
    - >-
      Scoped to the grid in `scope`; the criterion's cells (2^24 exact,
      2^30 sampled, curve) carry the rule-3 label and NO V or M verdict is
      recorded; the 2^20 and 2^22 cells are report-only by the contract's
      own text.
    - >-
      claim_tier toy; constant-factor measurements under KN-LIT-013; no
      exponent; no cryptographic N; the contract's own falsification text
      forbids extrapolation when constants drift, and they do on the
      fixture cost cells as fitted.
    - >-
      The exact global top-T share is a measurement that stands regardless
      of the Borel model (contract interpretation clause), but its use as a
      SCORED M3 verdict waits for a validated instrument; this record
      quotes it as an observation only.
    - >-
      The executor's walk projection (top bits of mix64) is a different
      projection of the contract's class from the literal "mod N"
      (validator J1-F4); disclosed, carried to the amendment, not a defect.
    - >-
      The 869870 and 612fb1 instruments are two implementations of one
      class; their 2^24 headline fixtures (1.708 / 1.705) agree with each
      other and with the validator's sealed 1.68-1.73 within seed spread.
      That agreement is about the fixture quantity, not a validation of
      either package's other numbers.
    - >-
      Model independence between producer and reviewers was not obtained
      (all self-report claude-fable-5-1); session and implementation
      independence were; the validator's J2 supplies the only instrument
      of a different implementation.

  unresolved_confounds:
    - >-
      J2-F1: whether the (1/4, 2) cell at 2^24 passes the 0.10 band is a
      property of the key and mixer draw, not of the instrument class;
      an 8-key re-run on this package's own instrument has not been done.
    - >-
      Whether the (1, 8) cost miss (+0.1005, boot95 [1.471, 1.734]) is an
      O(theta) residual, a seed-spread excursion (3 of 5 seeds would be
      needed to tell), or the count-plus-length weight's behaviour at
      N/T = 8 is untested; the (1, 8) precomputation residual (+14.6%) and
      the (B4) MODELED 40.0 vs PUBLISHED 36.9 (+8.4% by the model alone)
      say part of the precomputation excess is the model's own O(theta)
      form, disclosed in the contract's (B4) note.
    - >-
      The survival-slope band (0.10 around -0.5) was set against the
      asymptotic form while the estimator reads the finite-theta law at
      -0.60 to -0.63; the band, the estimator and the reference value
      need re-stating together before M1 can be scored.
    - >-
      The r = 4 dip in C_rule/C_oracle in every cell is unexplained (pool
      construction vs weight behaviour).
    - >-
      J1-F1: the 2^30 and curve stages ran before any gate verdict existed
      in a run record; the labelling is correct and nothing needs
      re-scoring, but a later batch must evaluate and record the gate in
      its own run record before launching the next stage.
    - >-
      The Pollard-rho-no-table control on the curve arm was not executed;
      the curve cells are invalid-for-interpretation in any case.

