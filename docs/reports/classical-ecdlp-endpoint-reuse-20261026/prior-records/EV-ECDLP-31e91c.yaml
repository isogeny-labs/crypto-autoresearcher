  scope:
    instrument: >-
      Generic keyed random function; the executor's walk is f(x) = top
      log2N bits of mix64(x XOR K) rather than the contract's "mod N" (a
      different projection of the same class; validator J1-F4, disclosed
      in IMPLEMENTATION.md item 1); DP predicate hash64(x) < 2^64 / W with
      an independent key; exact basins by enumeration at N <= 2^24 with
      cycle mass and capped mass reported; sampled coverage (M = 40000
      online walks per (seed, a), shared across every table) at 2^30.
    N_grid: [1048576, 4194304, 16777216, 1073741824]
    T_grid: [64, 128, 256, 1024]
    a: [0.125, 0.25, 0.5, 1.0]
    r_pool_ratio: [1, 2, 4, 8, 16]
    r_note: N/T = r distinct-DP pool with the paper's procedure (every generating walk charged; at r = 1 the paper's duplicate-discard procedure)
    caps: [8W, 20W]
    selection_rules: [published_weight, count_only, unselected, generated_oracle, global_oracle]
    nulls_and_decay: relabelling null (statistic permuted among generated DPs before selection, stream 300+s); sigma-noise decay sigma in {0, 0.5, 1, 2, 4, 8}
    fixture_cells: "(a, N/T) in {(1/4, 2), (1/2, 1), (1/2, 2), (1/2, 8), (1, 1), (1, 2), (1, 8)} against PUBLISHED cost 1.79 / 2.14 / 1.62 / 1.38 / 2.01 / 1.62 / 1.50 (tolerance 0.10) and PUBLISHED precomputation 1.24 / 0.85 / 1.90 / 15.7 / 1.34 / 3.66 / 36.9 (tolerance 12%), gated at N >= 2^24, report-only at 2^20 and 2^22"
    seeds: "s in {1..5} at 2^20, 2^22, 2^24; {1, 2, 3} at 2^30 and on the curve; online 100+s, generation 200+s (unnamed by the contract, declared), relabelling 300+s, tie 400+s, noise 500+s, bootstrap 600+s; curve-search seed 1000"
    curves:
      - id: TOY-P24-a6ee37f9
        p: 16999627
        a: 515
        b: 258
        N: 16999109
        arms_run: exact basins of the r-adding walk at r_walk in {16, 32}, a in {1/4, 1/2}, 3 seeds, certified online walks
    solver: >-
      experiments/EXP-ECDLP-869870/source (instrument.py, run_generic_exact.py,
