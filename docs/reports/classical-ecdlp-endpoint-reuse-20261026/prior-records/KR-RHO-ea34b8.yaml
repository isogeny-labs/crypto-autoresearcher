title: 'Precomputation: l^{1/3} online after l^{2/3} tables, and the lower bound'
claim: 'Bernstein–Lange: a precomputed table of about l^{1/3} distinguished points (≈1.2·l^{2/3} precomputation)
  gives ≈1.77·l^{1/3} online work per discrete log, with tables selected by walk usefulness; Corrigan-Gibbs–Kogan
  prove S·T² = Ω̃(εN) for preprocessing algorithms, which this meets.'
