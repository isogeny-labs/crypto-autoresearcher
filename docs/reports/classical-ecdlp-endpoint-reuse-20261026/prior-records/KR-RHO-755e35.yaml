id: KR-RHO-755e35
area: generic-rho
kind: textbook_fact
title: Isogenous curves are equally hard; isogeny walks do not find weak curves
claim: Over a finite field, curves are isogenous iff they have the same number of points (Tate), and ECDLP
  is random-self-reducible across an isogeny class under JMV's conditions; walking the isogeny class cannot
  reach a curve with a different group structure class of weakness (anomalous, small embedding degree,
  smooth order), because those invariants are shared.
status: proven
