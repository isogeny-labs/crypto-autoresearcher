  falsification_conditions:
  - 'A non-constant torsor coordinate at k > 1, or a non-zero tangent component at N != p: (T2) wrong; the class
    reopens with a computable homomorphism.'
  - '(T3) fails symbolically: the net residue is not a coordinate; the net carries something the point does not.'
  - 'The k = 1 or N = p known-false objects come out constant or zero: instrument blind; nothing reported.'
  - 'Stage 4 asymmetry vanishes on C but persists on W: torsor part carries k-dependence; escalate to independent
    review.'
  confounders:
