      exact_difference: '727-005 classifies every efficiently computable NONTRIVIAL homomorphism (exit map) psi
        : G -> H(F_p) into a connected commutative algebraic group by Chevalley-Barsotti into E1 unipotent (F_p^+,
        needs N = p), E2 toric (F_{p^k}^*, needs N | p^k - 1) and E3 abelian-variety, each at exponent at least
        1/2, and notes that a nontrivial psi must be injective so N | |H(F_p)|. This record''s torsor coordinates
        are homomorphisms into F_p^* (the k = 1 slice of E2) and into F_p (E1); 727-005''s divisibility precondition
        is exactly what fails on a standardised curve (k > 1, N != p), and the difference is that this record does
        not classify a nontrivial exit map but shows four specific R3 constructions (nets, cubical torsor, Miller
        ratio, dual-number tangent) ARE exit maps into those two targets and are therefore the TRIVIAL homomorphism
        - the degenerate case 727-005 excludes by hypothesis. What is added is the identification of the torsor
        family as E1/E2 exit maps and the forced 0-bit value; nothing about E3 or about exponents.'
    - record: H-NET-001 / EV-NET-001
