        at toy p without deriving why. (T2)-(T3) supply the mechanism; EV-NET-001's unresolved 0.52-0.70x asymmetry
        is predicted to be a coordinate-part effect and is the one measurement queued.
    - record: H-JET-001 / EV-JETB-001
      exact_difference: 'EV-JETB-001 found the tangent screen equals the zeroth-order test exactly. (T2) with A
        = F_p is the reason: the canonical lift''s tangent component is the zero homomorphism.'
    - record: IDEA-20260806-0c9de1
      exact_difference: 0c9de1's F1 trivialises a torsor by a rational point; this record trivialises torsor COORDINATES
        by a coprime-order argument (a different hypothesis) covering A = F_p^* and A = F_p.
    - record: KN-FIND-ffe1df Theorem C and IDEA-20260807-df906f
      exact_difference: Those prove exactly-propagating maps on Z/N are injective or constant; this record uses
        the special case of homomorphisms into a group of coprime order, where constant is forced, and applies it
