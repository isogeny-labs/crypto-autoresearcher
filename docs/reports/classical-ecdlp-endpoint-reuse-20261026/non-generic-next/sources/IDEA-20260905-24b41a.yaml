      controls. STAGE 4 (hour): rerun EV-NET-001''s asymmetry statistic on W and on C separately.'
    controls:
    - 'PGL_2 battery of IDEA-20260807-4fc635 applied to the coordinate part C(v): all algebraic metrics invariant.'
    - 'Translation-conjugate null: the net of (P, Q) versus the net of (P, Q + R) with retargeting gives identical
      Stage 2-3 values.'
    - Matched random prime-order curve at the same p with k > 1.
    - Identity, random-label and generic-group (relabelled Z/nZ) controls of IDEA-20260802-002.
