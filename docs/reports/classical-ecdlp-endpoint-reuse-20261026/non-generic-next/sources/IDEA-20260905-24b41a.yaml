      a NON-constant homomorphism (the Tate self-pairing), and an anomalous toy curve (N = p) where the tangent
      component must be non-zero (Smart). A pipeline reporting constant there is blind.'
    required_metrics:
    - symbolic pass or fail of (T3)
    - distribution of t(R) over G per curve (one class when k > 1, N classes when k = 1)
    - tangent component per R (0 when N != p, non-zero when N = p)
    - (L, b) of t(R) and of C(v) with all controls
