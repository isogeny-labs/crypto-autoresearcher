idea:
  id: IDEA-20261017-e3a6f1
  question_id: RQ-ECDLP-002
  added: '2026-10-17'
  title: >-
    The Miller cocycle has a canonical primitive U: E(F_p)[N] -> F_p^* exactly when N does not divide p-1: a
    non-homomorphic transfer into F_p^* (cheap to log) whose defect is line/vertical at P
  class: representation
  claim: >-
    E/F_p, P of prime order N, gcd(N,p-1)=1 (no pairing), f=f_{N,P} Miller function (div N(P)-N(O), monic at
    O), T(R)=f(R), U(R)=T(R)^(1/N) (the N-th root is unique in F_p^*). (K1, Weil reciprocity)
    U(R)U(S)/U(R+S)=+-g_{R,S}(P), g=line(R,S)/vertical(R+S): U is the unique primitive of this multiplicative
    cocycle with U(O)=1, since Hom(Z/N,F_p^*)=1. (K2, from the Weierstrass sigma function, unreviewed)
    U(kP)=c*r_k*C^(k/N), r_k=psi_{k-1}(P)/psi_k(P) the divisibility-sequence ratio, c,C in F_p^* constants of
    P; so ell(k)=log_g U(kP) in Z/(p-1) is a prefix sum of -log_g(x_P-x_{iP}) plus a drift. (K3) H1: ell is
    equidistributed in Z/(p-1), has Smart-ratio success 1/p and is uncorrelated with characters of Z/N, on
    special and matched random p alike. The Tate pairing is trivial here (IDEA-20261009-c8433d); U is the
    unreduced value made canonical by an N-th root.
  mechanism: >-
    PAIR: representation = F_p^*-valued canonical quasi-homomorphism U (R2, transfer); Sigma = translation by
    S, acting on U only through the explicit defect g_{R,S}(P). TRICHOTOMY: coordinate-dependent. LOSSY TEST:
    the graph R->(R,U(R)) is a subgroup isomorphic to E(F_p)[N], a change of coordinates and not proposed; U
    alone is lossy by collisions. PRICE: one Miller loop plus one exponentiation per value; a log in F_p^*
    is feasible at 256 bit for ANY p (general NFS), so the special form is a covariate, not the lever. By
    KN-FIND-ffe1df Theorem C no lossy object propagates under translation; no collision gain claimed.
    R2; attack stage touched: none (control on the transfer door).
  novelty_status: unverified
