  question_id: RQ-CZLIFT-b9f765
  added: '2026-10-16'
  title: >-
    The zeta-defect Z: a lift-free canonical quasi-homomorphism on E(F_p)[n]
    whose carry is a division-polynomial log-derivative (Fermat quotient, elliptic)
  class: representation
  claim: >-
    y^2=x^3+ax+b/F_p, G=<P> odd order n prime to p, chord slope lam(R,S)=(y_R-y_S)/(x_R-x_S)
    (tangent at R=S). lam is a cocycle on G (zeta addition law); Hom(G,F_p)=0, so it has
    a UNIQUE primitive Z: Z(R+S)=Z(R)+Z(S)+lam(R,S), Z(R)=-(1/n)*sum_{S!=O,-R} lam(R,S)
    (canonical splitting of the universal vector extension over F_p; no lift).
    (K1) Z(R)=-(1/n^2)[y*f_n''(x)/f_n'(x)+(3x^2+a)/(2y)], f_n the division polynomial,
    O(log n) via jets in F_p[e]/(e^3). (K2) odd d: Z(dP)=d*Z(P)+g_d(P), g_d=(2y_P/d)f_d'(x_P)/f_d(x_P),
    so Z's Smart ratio equals d iff g_d(P)=0. (K3) conjecture: the first-digit shift of the torsion
    section under a curve-lift change, kA,kB, lies in span{x^i y^j, x^i y^j Z}, i+2j<=3.
    (K4) anomalous control (n=p, Z cannot exist): W(R)=sum_{k=1}^{p-2} lam(R,kR) is additive,
    W(dP)=d*W(P): Smart's attack in char p. (K5) On non-anomalous toy curves Z's ratio success
    is within 4 sd of 1/p and its DL-spectrum is white.
  mechanism: >-
    PAIR: representation = fibre coordinate of the lift to the universal vector extension (R2);
    Sigma = translation by S, acting on Z only through the carry lam(R,S). TRICHOTOMY:
    coordinate-dependent. LOSSY TEST: the graph R->(R,Z(R)) is a subgroup ~G, a change of
    coordinates, not proposed; Z alone is F_p-valued, lossy by collisions. PRICE: ~6 scalar
    multiplications per Z; tracking Z on an affine walk is free (lam is computed anyway) but by
    Theorem C no lossy object propagates under translation, no collision gain claimed.
