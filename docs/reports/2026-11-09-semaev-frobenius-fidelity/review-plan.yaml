  claim_under_review: |
    Let p be prime, q = p^e, and K a field of characteristic p. Let
    R = K[x_1,...,x_M], I_q = (x_i^q - x_i : i), and phi(a) = a^q on K.
    For every polynomial g in R, g^q is congruent to the coefficientwise
    Frobenius twist g^phi modulo I_q.
  interpretation_under_review: >-
    The source note calls this a structural mechanism for Frobenius-conjugate
    redundancy in Weil-descended Semaev systems. Review whether the named
    theorem itself covers that interpretation, and separate the adjacent
    free-degree-fall corollary and any solver or complexity inference.
