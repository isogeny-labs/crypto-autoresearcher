<text x="55" y="617" class="small">The 87 files outside this receipt may have other gates; inspect each claim and its source.</text>
<text x="55" y="641" class="small">The receipt binds 90 unchanged archive files and seven fresh native files. It leaves</text>
<text x="55" y="661" class="small">exhaustive theorem audit, semantic fidelity, and historical execution open.</text>
<text x="55" y="700" class="small">Sources: crypto 192e5eec; cryptanalysis d3673ee; auto researcher 7a40243d.</text>
<text x="55" y="723" class="small">Exact trees, file paths, Git blob IDs, and receipt partition are in manifest.json and inventories.</text>
