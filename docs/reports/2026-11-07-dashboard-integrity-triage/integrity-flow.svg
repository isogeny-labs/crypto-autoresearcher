<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Dashboard integrity diagnostic classification">
  <defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#183149}.h{font-weight:bold;font-size:17px}.t{font-size:13px}.s{font-size:11px}.b{fill:#f2f7fb;stroke:#416781;stroke-width:2}.a{fill:#fff4e3;stroke:#ae7019;stroke-width:2}</style></defs>
  <rect width="960" height="300" fill="white"/>
  <text x="25" y="30" class="h">Published dashboard integrity: raw diagnostics and review boundary</text>
  <rect x="25" y="56" width="280" height="176" rx="8" class="b"/>
  <text x="40" y="84" class="h">Committed source</text>
  <text x="40" y="115" class="t">29,068 indexed records</text>
  <text x="40" y="141" class="t">24 exact YAML parse errors</text>
  <text x="40" y="167" class="t">e23868a6 snapshot</text>
  <text x="40" y="209" class="s">SHA-pinned local and public payload</text>
  <path d="M307 145H341" stroke="#416781" stroke-width="3"/>
  <path d="M341 145l-9-6v12z" fill="#416781"/>
  <rect x="350" y="56" width="265" height="176" rx="8" class="b"/>
  <text x="365" y="84" class="h">Index diagnostics</text>
  <text x="365" y="115" class="t">258 duplicate IDs</text>
  <text x="365" y="141" class="t">1,048 unresolved citations</text>
  <text x="365" y="167" class="t">358 ID/path mismatches</text>
  <text x="365" y="209" class="s">Counters do not decide authority</text>
  <path d="M617 145H650" stroke="#416781" stroke-width="3"/>
  <path d="M650 145l-9-6v12z" fill="#416781"/>
  <rect x="660" y="56" width="275" height="176" rx="8" class="a"/>
  <text x="675" y="84" class="h">Needed review</text>
  <text x="675" y="115" class="t">228 stored supersessions</text>
  <text x="675" y="141" class="t">11 existing experiment dirs</text>
  <text x="675" y="167" class="t">Remaining cases unresolved</text>
  <text x="675" y="209" class="s">Preserve immutable correction history</text>
  <text x="25" y="271" class="t">A dashboard diagnostic is not an experiment verdict or a reason to edit historical records in place.</text>
</svg>
