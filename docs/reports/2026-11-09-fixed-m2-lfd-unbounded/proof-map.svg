<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550"><rect width="760" height="550" fill="white"/><g font-family="sans-serif" fill="#172b4d"><rect x="65" y="15" width="630" height="67" rx="7" fill="#edf6ee" stroke="#536779"/><text x="85" y="41" font-size="19">Existing degree-4 certificates</text><text x="85" y="65" font-size="15">Finite controls; no extrapolation</text><path d="M380 82v18l-5 -5m5 5l5 -5" stroke="#536779" fill="none"/><rect x="65" y="103" width="630" height="67" rx="7" fill="#edf6ee" stroke="#536779"/><text x="85" y="129" font-size="19">Exclude automatic amplification</text><text x="85" y="153" font-size="15">Subfield UNSAT LFD ≤ 3; copies do not add</text><path d="M380 170v18l-5 -5m5 5l5 -5" stroke="#536779" fill="none"/><rect x="65" y="191" width="630" height="67" rx="7" fill="#fff4dc" stroke="#536779"/><text x="85" y="217" font-size="19">Construct a uniform vector quotient</text><text x="85" y="241" font-size="15">Growing depth; rank at least D</text><path d="M380 258v18l-5 -5m5 5l5 -5" stroke="#536779" fill="none"/><rect x="65" y="279" width="630" height="67" rx="7" fill="#fff4dc" stroke="#536779"/><text x="85" y="305" font-size="19">Prove every generator and kernel identity</text><text x="85" y="329" font-size="15">Actual field tensor; strict closure</text><path d="M380 346v18l-5 -5m5 5l5 -5" stroke="#536779" fill="none"/><rect x="65" y="367" width="630" height="67" rx="7" fill="#fff4dc" stroke="#536779"/><text x="85" y="393" font-size="19">Add UNSAT or SAT consequence bridge</text><text x="85" y="417" font-size="15">Needed for a true LFD lower bound</text><path d="M380 434v18l-5 -5m5 5l5 -5" stroke="#536779" fill="none"/><rect x="65" y="455" width="630" height="67" rx="7" fill="#fff4dc" stroke="#536779"/><text x="85" y="481" font-size="19">Obtain D(n) → infinity</text><text x="85" y="505" font-size="15">OPEN: no infinite construction yet</text></g></svg>