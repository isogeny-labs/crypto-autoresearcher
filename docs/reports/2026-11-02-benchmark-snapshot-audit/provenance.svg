<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-label="Benchmark source to public dashboard provenance">
  <rect width="960" height="460" fill="#fff"/>
  <style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#142336}.title{font-size:22px;font-weight:bold}.head{font-size:16px;font-weight:bold}.body{font-size:13px}.box{fill:#e9f1fc;stroke:#4071ad;stroke-width:2}.pass{fill:#e8f6eb;stroke:#36844c;stroke-width:2}.same{fill:#fff4df;stroke:#bd832e;stroke-width:2}.arrow{stroke:#475b70;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475b70"/></marker></defs>
  <text x="25" y="35" class="title">Nine-row benchmark snapshot: source to public site</text>
