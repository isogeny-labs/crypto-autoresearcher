  <text x="42" y="133" class="body">source commit 5ab7d5b</text>
  <text x="42" y="157" class="body">9 N13 rows, 7 source files</text>
  <rect x="345" y="80" width="265" height="115" rx="10" class="pass"/>
  <text x="362" y="108" class="head">Pinned UI snapshot</text>
  <text x="362" y="133" class="body">catalog SHA and 9 receipts agree</text>
  <text x="362" y="157" class="body">SHA-256 4cc3b31a…568ae5e</text>
  <rect x="665" y="80" width="270" height="115" rx="10" class="pass"/>
  <text x="682" y="108" class="head">Public Pages build</text>
