<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="R35a evidence chain and remaining exact-degree obligations">
  <style>
    text { font-family: DejaVu Sans, sans-serif; fill: #13273b; }
    .head { font-size: 22px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .detail { font-size: 15px; }
    .box { fill: #eef6fa; stroke: #206a89; stroke-width: 2; rx: 12; }
    .verified { fill: #eaf6ec; stroke: #30844a; stroke-width: 2; rx: 12; }
    .pending { fill: #fff7e7; stroke: #bd7c18; stroke-width: 2; stroke-dasharray: 7 5; rx: 12; }
    .line { stroke: #206a89; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#206a89"/></marker></defs>
  <text class="head" x="24" y="34">R35a: verified degree-4 certificate, exact-degree gates separate</text>
  <rect class="box" x="24" y="67" width="276" height="111"/>
  <text class="label" x="42" y="96">Public release bytes</text>
  <text class="detail" x="42" y="123">3 assets, tracked SHA-256</text>
  <text class="detail" x="42" y="148">44,830,496-byte certificate</text>
  <path class="line" d="M300 122 H351"/>
  <rect class="verified" x="352" y="67" width="286" height="111"/>
  <text class="label" x="370" y="96">Pinned independent checker</text>
  <text class="detail" x="370" y="123">C0-C3 pass; 35 equations</text>
  <text class="detail" x="370" y="148">36 variables, 66,712 monomials</text>
  <path class="line" d="M638 122 H689"/>
  <rect class="verified" x="690" y="67" width="286" height="111"/>
  <text class="label" x="708" y="96">Certified conclusion</text>
  <text class="detail" x="708" y="123">1 ∉ W₄</text>
  <text class="detail" x="708" y="148">codim W₄ ≥ 5,287</text>
  <rect class="pending" x="24" y="225" width="952" height="111"/>
  <text class="label" x="42" y="257">Separate evidence needed for exact d_F</text>
  <text class="detail" x="42" y="285">Independent unsatisfiability check + both restricted degree-4 refutations + Boolean-to-polynomial closure bridge</text>
  <text class="detail" x="42" y="310">The archived receipt records d_ref_exact = null; dual-certificate acceptance does not prove an exact W₄ dimension.</text>
</svg>
