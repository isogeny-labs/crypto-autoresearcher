  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Four fresh correction reviewers receive no sibling report or verdict.
      They may read the immutable original producer commit, the corrected
      commit, target/source material, this plan, and hosted machine metadata.
      The already sealed blind mathematical derivation is not used as a review
      input and is not repeated because the theorem statements did not change.
  proves_too_much:
    objects:
      - >-
        A correction that changes a public declaration type, drops a premise,
        or weakens a conclusion fails even if Lean accepts it.
      - >-
        A correction containing sorry, admit, an added axiom, unsafe proof
        escape, or an unaudited replacement declaration fails even if nearby
        examples compile.
      - >-
        A successful module build without the target verifier and named
        axiom-audit receipt remains machine-incomplete.
      - >-
        None of these proof repairs may be promoted into an ECDLP, ROM/QROM,
        hash-to-curve, or computational-binding result absent from the types.
    failure_signature: >-
      The correction review fails if it checks only textual plausibility or a
      nearby example, overlooks a public type delta, accepts a forbidden trust
      escape, treats a partial build as a target receipt, or broadens the
      finite claims into an unmodeled security conclusion.
  blind_rederivation:
    required: false
  review_output:
    verdicts: [holds, breaks, inconclusive]
    required:
      - Exact joint ID, bound commits and file hashes, declaration-type delta, proof replay, machine status, and scoped verdict
