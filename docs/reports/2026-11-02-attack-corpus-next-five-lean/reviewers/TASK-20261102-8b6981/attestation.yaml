    section: "3.2"
    findings:
      - Step 1 uses 2 <= r <= 9 and an r-by-10 cubic evaluation matrix.
      - Step 2 explicitly requires matrix rank r.
      - Remark 2 derives distinctness from rank r, never rank from distinctness.
      - Remark 4 identifies rank r as a coefficient-lifting premise.
      - Nonsingularity of the selected kernel cubic is a separate requirement.
    false_suggestion_check: >-
      No false suggestion was found in the bound source note. Any claim that
      JKSST inferred full rank from distinctness would reverse Remark 2 and is
      rejected by this review.
    nonimplications:
      - The square r=10 Lean guardrail is not JKSST's rectangular r<=9 premise.
      - The reducible singular witness is not an elliptic cubic.
      - No JKSST erratum, refutation, success-probability result, or ECDLP attack follows.

