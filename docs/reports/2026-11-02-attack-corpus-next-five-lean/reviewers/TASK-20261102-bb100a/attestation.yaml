  mathematical_controls:
    - item: 1
      weakened_or_removed_premise: >-
        Marginal one-shot counts were substituted for the history recurrence,
        and separately epsilon <= 1 was removed.
      result: >-
        Same-size success sets give both a forever-failing outcome and no such
        outcome; with epsilon=2, S=(1,0,0,...) satisfies the recurrence but
        violates the proposed q^2 bound.
    - item: 2
      weakened_or_removed_premise: det(M) != 0 was replaced by distinct points.
      result: >-
        The ten points (1,i,0), i=0,...,9, have rank at most four and admit the
        nonzero vanishing cubic z^3; nine unrestricted rows also retain a
        nonzero kernel even at full row rank.
    - item: 3
      weakened_or_removed_premise: bijectivity of multiplication by h on S was removed.
      result: >-
        For K=S=Z/2Z and h=2, K is killed but S is killed too, so the image is
        a singleton rather than the intended target.
    - item: 4
      weakened_or_removed_premise: >-
        The nonzero challenge premise was removed, and separately the field
        premise was weakened to the ring Z/4Z.
      result: >-
        Zero challenge permits one transcript for distinct keys; nonzero
        c=2 over Z/4Z also admits X=0 and X=2 for one fixed equation. Fixed-key
        uniqueness was additionally checked not to imply unforgeability.
    - item: 5
      weakened_or_removed_premise: >-
        Injectivity of a |-> aG was removed, and separately alpha != 0 was removed.
      result: >-
        With G=H=0 the kernel is all of F^2 and the recovery denominator may
        vanish; with alpha=0 the arbitrary-message blinder formula is undefined
        and different-message equivocation does not follow.
  computational_nonimplication: >-
