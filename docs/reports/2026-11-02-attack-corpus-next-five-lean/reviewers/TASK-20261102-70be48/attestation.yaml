  controls:
    - id: same_marginals_different_history
      result: >-
        With epsilon=1/2 the complementary history has S=(1,1/2,0,...),
        so the recurrence and n=2 geometric bound require 1/4<=0; extending
        S_n=0 for n>=2 makes the N=3 tail claim 7/8<=3/4. All are false despite
        identical one-shot counts.
    - id: correlated_persistent_failure
      result: >-
        Outcome false fails every natural-numbered correlated trial, while the
        Bool one-shot success count remains one for each trial.
    - id: epsilon_zero
      result: >-
        q=1; the recurrence propagates S_n>=1 and the finite-tail inequality is
        0<=0 for every N.
    - id: epsilon_one_and_N_zero
      result: >-
        q=0; n=0 and N=0 are exact equalities, and for positive indices the
        conclusions reduce to stated nonnegativity plus the S_0 term.
    - id: probability_semantics_proves_too_much
      result: >-
        S_n=2^n with epsilon=1/2 satisfies the typed algebraic premises while
        not being a survival-probability sequence, so expectation or probability
        semantics cannot be inferred from the theorem type.
    - id: jksst_boundary
      result: >-
        The reviewed type contains no xedni sampler, height/discriminant premise,
        Lang input, conditional-event law, independence premise, or expected-time
        identification and therefore neither proves nor refutes JKSST Theorem 4.1.
