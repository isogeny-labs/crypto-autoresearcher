<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Prime-field index-calculus arity and solver correction</title>
  <desc id="desc">Arity two cannot pass the rho crossover, arity three measures a strict exponent threshold, and arity four or higher retains rationality and linear-algebra accounting. The prime-field solver routes are hybrid CDCL(T) and QF_FF, with pure CNF only a cost control.</desc>
  <rect width="1200" height="430" rx="24" fill="#0b1220"/>
  <text x="55" y="50" fill="#e5eefc" font-family="sans-serif" font-size="28" font-weight="700">Corrected decision path</text>
  <text x="55" y="82" fill="#9fb3cc" font-family="sans-serif" font-size="17">Necessary PDP collection gate: e &lt; m/2 - 1</text>

  <rect x="55" y="115" width="310" height="150" rx="18" fill="#301b2b" stroke="#f472b6" stroke-width="2"/>
  <text x="80" y="153" fill="#f9a8d4" font-family="sans-serif" font-size="22" font-weight="700">m = 2</text>
  <text x="80" y="187" fill="#fce7f3" font-family="sans-serif" font-size="18">Gate: e &lt; 0</text>
  <text x="80" y="218" fill="#fce7f3" font-family="sans-serif" font-size="16">Impossible for nonnegative work</text>
  <text x="80" y="244" fill="#f9a8d4" font-family="sans-serif" font-size="15">Component theorem / control only</text>

  <path d="M365 190 L435 190" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="435" y="105" width="330" height="170" rx="18" fill="#102d3b" stroke="#38bdf8" stroke-width="3"/>
  <text x="460" y="145" fill="#7dd3fc" font-family="sans-serif" font-size="22" font-weight="700">m = 3 — measure</text>
  <text x="460" y="180" fill="#e0f2fe" font-family="sans-serif" font-size="18">Strict gate: upper CI(e) &lt; 0.5</text>
  <text x="460" y="212" fill="#e0f2fe" font-family="sans-serif" font-size="16">s = 6..14, then frozen s = 15..27</text>
  <text x="460" y="241" fill="#7dd3fc" font-family="sans-serif" font-size="15">PDP exponent screen, not attack claim</text>

  <path d="M765 190 L835 190" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="835" y="115" width="310" height="150" rx="18" fill="#183024" stroke="#4ade80" stroke-width="2"/>
  <text x="860" y="153" fill="#86efac" font-family="sans-serif" font-size="22" font-weight="700">m ≥ 4</text>
  <text x="860" y="187" fill="#dcfce7" font-family="sans-serif" font-size="17">Retain rationality circuits</text>
  <text x="860" y="218" fill="#dcfce7" font-family="sans-serif" font-size="16">Charge linear algebra separately</text>
  <text x="860" y="244" fill="#86efac" font-family="sans-serif" font-size="15">Complete-cost boundary remains</text>

  <rect x="55" y="310" width="1090" height="75" rx="16" fill="#111c31" stroke="#64748b"/>
  <text x="80" y="340" fill="#e5eefc" font-family="sans-serif" font-size="18" font-weight="700">Prime-field solver contract</text>
  <text x="80" y="369" fill="#bae6fd" font-family="sans-serif" font-size="16">CaDiCaL + F_p external theory</text>
  <text x="390" y="369" fill="#c4b5fd" font-family="sans-serif" font-size="16">cvc5 QF_FF independent route</text>
  <text x="715" y="369" fill="#fda4af" font-family="sans-serif" font-size="16">pure CNF = log²(p) multiplication-cost control</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>
</svg>
