<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ECDLP lead pursuit audit</title>
  <desc id="desc">Of 160 reconciled leads, 21 narrowly scoped mechanisms are obstructed and 139 remain pursued. Family totals are also shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1324"/>
      <stop offset="1" stop-color="#17233d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 18px; font-weight: 400; fill: #aebbd2; }
      .big { font-size: 64px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 650; fill: #f8fafc; }
      .small { font-size: 15px; font-weight: 400; fill: #bdc8dc; }
      .family { font-size: 17px; font-weight: 600; fill: #e8eef8; }
      .count { font-size: 16px; font-weight: 650; fill: #f8fafc; }
    </style>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text class="title" x="64" y="70">ECDLP lead pursuit audit</text>
  <text class="subtitle" x="64" y="103">160-lead reconciled atlas · only scoped mechanism-wide obstruction exits</text>

  <g filter="url(#shadow)">
    <rect x="64" y="142" width="702" height="236" rx="20" fill="#111d33" stroke="#32425f"/>
    <rect x="790" y="142" width="346" height="236" rx="20" fill="#111d33" stroke="#32425f"/>
  </g>
  <text class="big" x="112" y="242" fill="#52d6a5">139</text>
  <text class="label" x="112" y="278">pursued</text>
  <text class="small" x="112" y="307">next action or explicit revisit trigger</text>
  <text class="big" x="490" y="242" fill="#ff9f6e">21</text>
  <text class="label" x="490" y="278">scoped obstruction</text>
  <text class="small" x="490" y="307">exact stated mechanism only</text>
  <rect x="112" y="331" width="606" height="18" rx="9" fill="#263752"/>
  <rect x="112" y="331" width="526" height="18" rx="9" fill="#52d6a5"/>
  <rect x="638" y="331" width="80" height="18" rx="9" fill="#ff9f6e"/>

  <text class="label" x="832" y="197">Queue rule</text>
  <text class="small" x="832" y="235">bounded null ≠ disproof</text>
  <text class="small" x="832" y="267">dominance ≠ disproof</text>
  <text class="small" x="832" y="299">timeout / OOM ≠ disproof</text>
  <text class="small" x="832" y="331">known route stays reference-live</text>

  <text class="label" x="64" y="435">Family accounting</text>
  <text class="small" x="920" y="435">pursued</text>
  <text class="small" x="1041" y="435">obstructed</text>

  <g transform="translate(64 468)">
    <text class="family" x="0" y="22">Binary IC</text>
    <rect x="290" y="3" width="690" height="24" rx="12" fill="#263752"/>
    <rect x="290" y="3" width="630" height="24" rx="12" fill="#52d6a5"/>
    <rect x="920" y="3" width="60" height="24" rx="12" fill="#ff9f6e"/>
    <text class="count" x="996" y="22">21 / 2</text>
  </g>
  <g transform="translate(64 525)">
    <text class="family" x="0" y="22">IC engines</text>
    <rect x="290" y="3" width="600" height="24" rx="12" fill="#263752"/>
    <rect x="290" y="3" width="540" height="24" rx="12" fill="#52d6a5"/>
    <rect x="830" y="3" width="60" height="24" rx="12" fill="#ff9f6e"/>
    <text class="count" x="906" y="22">18 / 2</text>
  </g>
  <g transform="translate(64 582)">
    <text class="family" x="0" y="22">Prime IC</text>
    <rect x="290" y="3" width="780" height="24" rx="12" fill="#263752"/>
    <rect x="290" y="3" width="693" height="24" rx="12" fill="#52d6a5"/>
    <rect x="983" y="3" width="87" height="24" rx="12" fill="#ff9f6e"/>
    <text class="count" x="1086" y="22">24 / 3</text>
  </g>
  <g transform="translate(64 639)">
    <text class="family" x="0" y="22">Generic + transfer + structure + exotic</text>
    <rect x="520" y="3" width="550" height="24" rx="12" fill="#263752"/>
    <rect x="520" y="3" width="464" height="24" rx="12" fill="#52d6a5"/>
    <rect x="984" y="3" width="86" height="24" rx="12" fill="#ff9f6e"/>
    <text class="count" x="1086" y="22">76 / 14</text>
  </g>

  <line x1="64" y1="700" x2="1136" y2="700" stroke="#32425f"/>
  <circle cx="76" cy="727" r="6" fill="#52d6a5"/>
  <text class="small" x="91" y="733">pursue until disproven</text>
  <circle cx="300" cy="727" r="6" fill="#ff9f6e"/>
  <text class="small" x="315" y="733">preserve the exact obstruction scope</text>
</svg>
