<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="title desc">
<title id="title">Historical search counts and two unreviewed structural continuations</title>
<desc id="desc">Historical complete-model callbacks fall from 1768 to 886 while PC calls remain 1954. Two dashed proposed paths lead to active-support source auditing and complete signed interval-chart auditing. Neither establishes cost or ECDLP advantage.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#66798a" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="958" height="524" rx="12" fill="#ffffff" stroke="#cbd5df"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b3a">
<text x="22" y="28" font-size="19" font-weight="bold">Historical motivation; proposed next mechanisms</text>
<text x="22" y="49" font-size="12">RUN-PSEARCH-c61489 · 48 ordinary rows per strategy · A/A repeat excluded · event counts, not time</text>
<text x="22" y="74" font-size="14" font-weight="bold">Complete-model callbacks</text><text x="505" y="74" font-size="14" font-weight="bold">Polynomial-calculus calls</text>
<g stroke="#d3dce5" stroke-width="1"><path d="M127 84V145 M275 84V145 M423 84V145 M610 84V145 M758 84V145 M906 84V145"/></g>
<text x="22" y="103" font-size="12">Model-only</text><rect x="127" y="88" width="261.664" height="19" fill="#476986"/><text x="395" y="103" font-size="12">1768</text>
<text x="22" y="133" font-size="12">Partial-prefix</text><rect x="127" y="118" width="131.128" height="19" fill="#2a8c87"/><text x="265" y="133" font-size="12">886</text>
<text x="505" y="103" font-size="12">Model-only</text><rect x="610" y="88" width="289.192" height="19" fill="#476986"/><text x="905" y="103" font-size="12">1954</text>
<text x="505" y="133" font-size="12">Partial-prefix</text><rect x="610" y="118" width="289.192" height="19" fill="#2a8c87"/><text x="905" y="133" font-size="12">1954</text>
<g font-size="11" text-anchor="middle"><text x="127" y="159">0</text><text x="275" y="159">1000</text><text x="423" y="159">2000</text><text x="610" y="159">0</text><text x="758" y="159">1000</text><text x="906" y="159">2000</text></g>
<text x="22" y="180" font-size="12">Recorded coefficient arithmetic also unchanged. Descriptive finite totals; no uncertainty estimate or cost ratio.</text>
<path d="M20 193H940" stroke="#d3dce5"/>
<rect x="22" y="211" width="442" height="106" rx="8" fill="#edf6f5" stroke="#2a8c87" stroke-dasharray="7 4"/>
<text x="38" y="237" font-size="16" font-weight="bold">1 · Cold active-support search</text>
<text x="38" y="258" font-size="12">IDEA-20261030-b6f05e · source-specific, unreviewed</text>
<text x="38" y="280" font-size="14">Inactive-mask blocks → identical empty-block FIFO</text>
<text x="38" y="302" font-size="13">Proposed: preserve baseline-successful certificates.</text>
<rect x="496" y="211" width="442" height="106" rx="8" fill="#f2f1fb" stroke="#7565a0" stroke-dasharray="7 4"/>
<text x="512" y="237" font-size="16" font-weight="bold">2 · Complete signed interval charts</text>
<text x="512" y="258" font-size="12">IDEA-20261030-a62c58 · representation, unreviewed</text>
<text x="512" y="280" font-size="14">Exact-pole norm + idempotents + nilpotence</text>
<text x="512" y="302" font-size="13">Proposed: retain signs, repeats and exceptional charts.</text>
<path d="M243 320V344 M717 320V344" stroke="#66798a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="22" y="352" width="442" height="91" rx="8" fill="#fafcfd" stroke="#8ba0b1" stroke-dasharray="7 4"/>
<text x="38" y="376" font-size="14" font-weight="bold">Required next discrimination</text><text x="38" y="398" font-size="13">Audit cold simulation; then admitted exact controls.</text><text x="38" y="420" font-size="13">Warm reuse / event bookkeeping are separate factors.</text>
<rect x="496" y="352" width="442" height="91" rx="8" fill="#fafcfd" stroke="#8ba0b1" stroke-dasharray="7 4"/>
<text x="512" y="376" font-size="14" font-weight="bold">Required next discrimination</text><text x="512" y="398" font-size="13">Audit full correspondence and signed recovery.</text><text x="512" y="420" font-size="13">Raw highest-part obstruction defeats syntax → degree.</text>
