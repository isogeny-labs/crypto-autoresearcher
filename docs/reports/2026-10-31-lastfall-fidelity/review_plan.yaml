schema: lastfall.formal_review_plan/v1
review_plan:
  claim_under_review: >-
    THM-FALLDEG-INVARIANTS1-THM-2-8: assuming the last fall degree is finite
    and F has a degree fall, d_F is the largest d_f over ideal elements with
    d_f > deg(f). The target note additionally says a per-degree Macaulay rank
    profile is d_F itself rather than a proxy.
  coordinator_prior: >-
    The Lean IsGreatest statement appears faithful to the conditional
    invariant theorem. Its proof and V definition still need independent
    checking. The target note likely overstates what a finite measured rank
    profile alone establishes: the theorem identifies the global maximum of
    all falls, while a finite profile needs a separate row-space bridge and a
    bound excluding later falls. The current hosted receipt is machine evidence
    but does not complete semantic review or a fresh isolated build.
  joints:
    - joint: >-
        The source theorem, Definition 1.5, finiteness and degree-fall
        assumptions match the producer's quoted mathematical claim.
      assigned_to: T-1105
      attack_plan: >-
        Read the cited full primary source and the bound source note; compare
        each quantifier, finite/infinite case, closure condition, and maximum
        assertion. Work the empty-F and no-fall edge cases to see whether an
        unstated exception has been absorbed.
      breaking_artifact: A line-cited source mismatch or a concrete edge case.
    - joint: >-
        The pinned Lean declaration and its dependencies express and prove the
        mathematical invariant theorem without unapproved axioms or vacuous
        assumptions.
      assigned_to: T-1106
      attack_plan: >-
        Check the elaborated named declaration, V as an sInf of submodules,
        degreeFall's empty-set guard, total-degree closure and IsGreatest's
        membership/bound fields. Try weakening hfin or hfall and test whether
        the claimed conclusion can still be produced. Inspect the exact
        hosted receipt but classify it as historical until a fresh pinned
        build and transitive axiom audit can run with exclusive memory.
      breaking_artifact: An elaborated-type or axiom mismatch, false control,
        or a reproducible failed proof gate.
    - joint: >-
        A measured finite per-degree Macaulay rank profile supports the
        claimed d_F inference under explicitly checked bridge and cutoff
        conditions.
      assigned_to: T-1107
      attack_plan: >-
        From only the mathematical definitions, independently derive the
        relation between d_F and all degree falls. Then compare two systems
        whose low-degree profiles agree but whose falls occur at different
        later degrees, such as {x^D, x^D+x} and
        {x^(D+1), x^(D+1)+x}; determine exactly what a profile up to D-1 can
        establish. Do not read producer code, note, proof, or receipts.
      breaking_artifact: A worked counterexample to a finite-profile exactness
        claim, or a derivation of the missing cutoff condition.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - F = empty set, where hfall fails and there is no greatest fall degree.
      - F = {x}, where hfall should fail despite a nonempty lastFallSet.
      - A finite rank profile ending below a later generator degree.
    failure_signature: >-
      The theorem must not apply to either no-fall system; a finite profile
      cannot certify that no later degree fall exists without an independent
      bound.
    assigned_to: T-1107
  blind_rederivation:
    required: true
    quantity: >-
      Given V_{F,i}, d_f and d_F as in Definition 1.5, determine whether
      d_F equals a greatest fall degree under nonempty/finite hypotheses,
      and what degrees a finite profile can certify.
    parameters: >-
      Arbitrary field k, finite-variable polynomial ring k[x_1,...,x_n],
      subset F, natural-number degree budgets, and systems
      {x^D, x^D+x} and {x^(D+1), x^(D+1)+x} for D >= 2.
    blind_from:
      - formal/CryptoResearch/FallDegree/LastFall.lean
      - formal/targets/lastfall-is-max-degree-fall.yaml
      - research/THM_FALLDEG_INVARIANTS1.md
      - docs/reports/2026-10-31-hosted-formal-receipts/
      - docs/reports/2026-10-31-lastfall-fidelity/source/
      - docs/reports/2026-10-31-lastfall-fidelity/lean/
    assigned_to: T-1107
  procedure_deviations: []
