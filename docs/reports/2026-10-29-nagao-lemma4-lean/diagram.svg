<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Liberation Sans, sans-serif" font-size="12">
<title>Lemma 4 inside form: what the Lean file proves and what it assumes</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="760" height="330" fill="#fff"/>
<rect x="10" y="20" width="200" height="110" fill="#fdf1d8" stroke="#a66b00" stroke-dasharray="6 3"/>
<text x="20" y="40" font-weight="bold">Source (not formalized)</text>
<text x="20" y="60">Nagao 2015/984 Defs 5, 6</text>
<text x="20" y="76">Lemma 4: d_F &lt;= d'_F</text>
<text x="20" y="92">equality reading of cond. (1)</text>
<text x="20" y="112" fill="#a66b00">unformalized transcription</text>
<rect x="280" y="20" width="230" height="110" fill="#e4f0ff" stroke="#1d4f91"/>
<text x="290" y="40" font-weight="bold">Finite F_2 model (Lean)</text>
<text x="290" y="60">Poly = list of exponent vectors</text>
<text x="290" y="76">FallAt / FirstFall (conds 1-3)</text>
<text x="290" y="92">Lemma4Inside S := d_F &lt;= d'_F</text>
<text x="290" y="112">cofactors: deg &lt;= D, multilinear if fake</text>
<line x1="210" y1="75" x2="278" y2="75" stroke="#a66b00" stroke-dasharray="6 3" marker-end="url(#a)"/>
<text x="214" y="68" font-size="10" fill="#a66b00">assumed</text>
<rect x="560" y="20" width="190" height="110" fill="#e6f5e6" stroke="#2a7a2a"/>
<text x="570" y="40" font-weight="bold">Python certificates</text>
<text x="570" y="60">lemma4_inside_form.py (B)</text>
<text x="570" y="76">recheck.py (A)</text>
<text x="570" y="92">same definitions, same domain</text>
<text x="570" y="112" fill="#a66b00">agreement, not a bridge proof</text>
<line x1="560" y1="75" x2="512" y2="75" stroke="#a66b00" stroke-dasharray="6 3" marker-end="url(#a)"/>
<line x1="395" y1="130" x2="395" y2="170" stroke="#333" marker-end="url(#a)"/>
<text x="402" y="155" font-size="11">kernel `decide`, no native_decide</text>
<rect x="30" y="175" width="330" height="130" fill="#e6f5e6" stroke="#2a7a2a"/>
<text x="40" y="195" font-weight="bold">Witness A  F_2[X,Y]  (not multilinear)</text>
<text x="40" y="215">f1 = X^2 Y,  f2 = X Y + X,  S = {f1,f2} u S_fe</text>
<text x="40" y="235">d'_F = 2 : g = (XY, X)           [no fall at D=1]</text>
<text x="40" y="251">d_F  = 3 : g = (0, X, Y, 0)      [none at D=1,2]</text>
<text x="40" y="275" font-weight="bold">lemma4_inside_false_A : not Lemma4Inside</text>
<text x="40" y="291" fill="#555">3 &gt; 2</text>
<rect x="400" y="175" width="340" height="130" fill="#e6f5e6" stroke="#2a7a2a"/>
<text x="410" y="195" font-weight="bold">Witness B  F_2[X1,X2,X3]  (multilinear)</text>
<text x="410" y="215">f1 = X1X2 + X3,  f2 = X1X3 + X2, S = F u S_fe</text>
<text x="410" y="235">d'_F = 2 : g = (1, X1+1)         [none at D=1]</text>
<text x="410" y="251">d_F  = 3 : g = (1, X1+1, X3, 0, 0) [none at D=1,2]</text>
<text x="410" y="275" font-weight="bold">lemma4_inside_false_B : not Lemma4Inside</text>
<text x="410" y="291" fill="#555">3 &gt; 2   (p=2, N&lt;=3 only; nothing on Prop. 5)</text>
</svg>
