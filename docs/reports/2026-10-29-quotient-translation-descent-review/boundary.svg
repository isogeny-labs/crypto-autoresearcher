<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">What translation_commutes_iff_two_torsion proves, and what remains prose</title>
  <desc id="desc">Left box, Lean-checked: in any additive commutative group, tau_T commutes with iota_S for all P iff 2T = 0. Right, prose only: elliptic curve instantiation, every degree-2 map is a quotient by some iota_S, descent iff commutation, and the summation-polynomial corollary.</desc>
  <rect width="1000" height="430" fill="#f8fafc"/>
  <text x="32" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">THM_QUOTIENT_DESCENT1 · claim boundary of the Lean theorem</text>
  <rect x="32" y="76" width="400" height="250" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="52" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#14532d">Lean-checked (axioms: [propext])</text>
  <text x="52" y="142" font-family="DejaVu Sans Mono,monospace" font-size="14" fill="#14532d">[AddCommGroup E] (S T : E) :</text>
  <text x="52" y="166" font-family="DejaVu Sans Mono,monospace" font-size="14" fill="#14532d">(∀ P, -(P+S)+T = -(P+T+S))</text>
  <text x="52" y="190" font-family="DejaVu Sans Mono,monospace" font-size="14" fill="#14532d">  ↔ 2 • T = 0</text>
  <text x="52" y="230" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#14532d">τ_T ∘ ι_S = ι_S ∘ τ_T  ⟺  T is 2-torsion</text>
  <text x="52" y="254" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#14532d">for every S (no hypothesis on S)</text>
  <text x="52" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#166534">fidelity to target claim: faithful_scoped</text>
  <rect x="520" y="76" width="448" height="250" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="540" y="108" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#78350f">Prose only (not formalized)</text>
  <text x="540" y="142" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#78350f">1. E = E(k̄) of an elliptic curve</text>
  <text x="540" y="170" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#78350f">2. ι_S is an involution morphism of the curve</text>
  <text x="540" y="198" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#78350f">3. every degree-2 E → P¹ is E/⟨ι_S⟩</text>
  <text x="540" y="226" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#78350f">4. τ_T descends ⟺ τ_T commutes with ι_S</text>
  <text x="540" y="254" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#78350f">5. Corollary: acting group ≤ 4^(m−1)·m!</text>
  <text x="540" y="294" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#92400e">needed for the Lemma as titled ("descends")</text>
  <line x1="436" y1="200" x2="514" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="32" y="368" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#334155">Machine: hosted lean-verification run 40760275078 (head d75b7d47), 87/87 verified, theorem sha256 359a5ced… = reviewed main.</text>
  <text x="32" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#334155">Controls: equivalence on 422,500 (S, T) pairs in Z/a × Z/b, a, b ≤ 12; mutants T = 0, 2S = 0, τ_S for ι_S all refuted.</text>
</svg>
