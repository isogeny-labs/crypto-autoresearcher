review_plan:
  status: prospective_before_reviewer_dispatch
  source_commit: 6a0eb9665191e35690b4ff5ebd91c63561e09ec4
  claim_id: THM-SEMAEV-FALL1-LEMMA-3
  task_id: TASK-20260916-b55948
  claim_under_review: >-
    For a Weierstrass curve over a finite field, a declared finite F_q-spanning
    family V, arbitrary finite tuple of affine curve points, and target R, the
    predicate that every point is on the curve, every x-coordinate lies in V,
    and the group sum equals R is total and decidable. The source also motivates
    checking a producer's decomposition certificate independently of its script.
  immutable_inputs:
    claim_source: research/THM_SEMAEV_FALL1.md
    claim_source_sha256: 11b61f4f4bdaed0c323ec852f19fc4c0a7ff3972715bfe637604fb675db7fee4
    target: formal/targets/semaev-decomposition-certificate.yaml
    target_sha256: 3a8dc16449c2615c85c93bc92a3137435f1a367fb97a18729e6da6304554d7e6
    theorem: formal/CryptoResearch/Semaev/Certificate.lean
    theorem_sha256: aa022e4829eefc2cbe9ac05cbeb39f81e9e3eaa8147e2e41e9d718f11976bd89
    theorem_name: CryptoResearch.Semaev.decidable_validDecomposition
    supplemental_raw_theorem: CryptoResearch.Semaev.validRawDecomposition_iff_curve_span_sum
    lean_toolchain: leanprover/lean4:v4.35.0
    mathlib_revision: cfc55fc58714a59dc06e6e79edc6d1d95140d3c2
