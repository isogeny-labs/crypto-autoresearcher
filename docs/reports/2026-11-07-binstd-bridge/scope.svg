    <text x="871" y="185" font-size="12" fill="#58657c">Complete Lean classification</text>
    <text x="871" y="205" font-size="12" fill="#58657c">still requires bridges at left</text>
    <text x="28" y="270" font-size="13" fill="#526075">Green: exact mask equalities passed pinned target build and axiom query. Amber: unproved links. No performance data changed.</text>
