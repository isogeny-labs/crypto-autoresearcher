    <text x="321" y="127" font-size="17" font-weight="bold" fill="#785213">OPEN FIELD BRIDGE</text>
    <text x="321" y="157" font-size="14" fill="#594622">Modulus irreducibility</text>
    <text x="321" y="179" font-size="14" fill="#594622">Runner field ↔ canonical GF</text>
    <text x="321" y="205" font-size="12" fill="#856f48">XOR remainder correspondence</text>
    <path d="M551 165 H574" stroke="#506279" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="578" y="99" width="245" height="132" rx="12" fill="#fff2cf" stroke="#b8841c" stroke-width="2"/>
    <text x="596" y="127" font-size="17" font-weight="bold" fill="#785213">OPEN MODULE BRIDGE</text>
    <text x="596" y="157" font-size="14" fill="#594622">Runner Frobenius action</text>
    <text x="596" y="179" font-size="14" fill="#594622">Factor-kernel subspaces</text>
    <text x="596" y="205" font-size="12" fill="#856f48">Classify all invariant subspaces</text>
    <path d="M826 165 H849" stroke="#506279" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="853" y="99" width="239" height="132" rx="12" fill="#e7eaf2" stroke="#66758f" stroke-width="2"/>
    <text x="871" y="127" font-size="17" font-weight="bold" fill="#384761">ARCHIVED TABLE</text>
