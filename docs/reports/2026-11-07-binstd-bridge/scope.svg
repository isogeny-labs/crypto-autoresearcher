<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">BINSTD n=17 proof boundary</title>
  <desc id="desc">Archived bitmasks decode to exact polynomials; modulus field construction, runner Frobenius correspondence, and invariant-subspace classification remain open.</desc>
  <rect width="1120" height="300" fill="#f7f9fc"/>
