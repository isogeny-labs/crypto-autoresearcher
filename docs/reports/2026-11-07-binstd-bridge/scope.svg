  <text x="28" y="65" font-family="sans-serif" font-size="14" fill="#40516a">EXP-BINSTD-8bdf86 · current-main base 5b81052 · 2026-11-07</text>
  <g font-family="sans-serif">
    <rect x="28" y="99" width="245" height="132" rx="12" fill="#d6f1e1" stroke="#258455" stroke-width="2"/>
