      measured: Earlier same curves/targets with different Minisat complete-model instrument; native invalid_output
        remains unchanged.
    - path: research/prime_sat_prefix_search_20261030/software-integrity.json
      measured: Fixed synthetic positive/negative/callback controls already observed; no EC run of new same-backend
        partial versus model-only strategy.
    sample_status: partially_in_sample
    overlap: Public input cells overlap historical engineering work; synthetic controls are in-sample calibration.
      No ordinary EC result from this new callback comparison has been observed.
    decisive_scope: Only the new CaDiCaL ordinary EC same-backend strategy pairs; exclude all synthetic controls
      and historical encoding performance quantities from predictive support. This is finite mechanism evidence,
      not held-out input-distribution generalization.
