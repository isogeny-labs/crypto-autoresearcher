  controls:
    aa:
      present: true
      comparison: C-AA
      not_applicable_reason: null
    positive:
      present: true
      arm: positive_controls
      expected_detection: Each partial strategy certifies prefix0 depth1 while assigned_count1<n2 on b0*b1-1
        over F5; all three constant1 empty-clause cases return checked UNSAT. Exact model sets retained.
      not_applicable_reason: null
    negative:
      present: true
      arm: negative_controls
      null_population:
        description: b0*b1=0 over F5 has no inconsistent proper prefix; all strategies retain models0,1,2.
          Three supplied false multiplier/prefix/model mutations must be rejected.
        generator: Fixed public polynomial, matched to positive control except constant term; no outcome selection.
        n: 3
        why_n: One solver execution per strategy; three additional deterministic verifier mutations are not
          independent samples.
        matched_on:
        - field
        - variable count
        - monomial product
        - native engine
        - PC limits
        - prefix schedule
      not_applicable_reason: null
  independent_variables: &id001
  - name: theory_call_timing
    levels:
    - model_only
    - partial_prefix
  - name: encoding
    levels:
    - quartic
    - membership
    - quadratic
    - quadratic_aa
  metrics:
    primary:
    - id: underlying_present
      name: underlying present
      unit: integer
      kind: exact
      definition: Raw completed or censored records physically present in the bundle.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: verification_pass
      name: verification pass
      unit: integer
      kind: exact
      definition: 1 only if actual native output_validated and checker valid; not a formal execution proof.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: search_complete
      name: search complete
      unit: integer
      kind: exact
      definition: Number explicitly complete; separate from package validity.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: search_censored
      name: search censored
      unit: integer
      kind: exact
      definition: Number explicitly censored, never UNSAT.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: phase_search_events_model_checks
      name: phase search events model checks
      unit: integer
      kind: exact
      definition: Calls to complete-model theory validation inside the native propagator; eligible ordinary
        pairs only decide C-SEARCH.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: phase_search_events_partial_refutations
      name: phase search events partial refutations
      unit: integer
      kind: exact
      definition: Learned checked prefix identities triggered with assigned_count<n; all emitted records individually
        checked.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    secondary:
    - id: models_found
      name: models found
      unit: integer
      kind: exact
      definition: Verified returned projected models; not all auxiliary roots.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: phase_search_events_pc_calls
      name: phase search events pc calls
      unit: integer
      kind: exact
      definition: Every bounded PC attempt, including UNKNOWN and capped calls.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: underlying_missing
      name: underlying missing
      unit: integer
      kind: exact
      definition: Planned subexecutions without an artifact; never silently omitted.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: reference_models
      name: reference models
      unit: integer
      kind: exact
      definition: Complete reference projected-pair count; each of12 references charged once.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
    - id: mutation_checks_pass
      name: mutation checks pass
      unit: integer
      kind: exact
      definition: Three supplied false certificates/prefix/model rejected; not solver samples.
      source: Frozen export_results.py extraction from named raw phases/results; full primitive keys retained
        in measurements.counted
      aggregation: per_row
      resolution: one integer
      uncertainty: none_exact
  scale_relevance:
    tier: toy
    justification: Fixed p17/p97 and two small digit widths; no extrapolation.
    correspondence: null
  replication:
    seeds:
    - 0
    independent_instances: 12
  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_workers: 1
    maximum_runs: 1
  stopping_rules:
  - One serial run:144 ordinary search executions,9 solver controls and12 references; no outcome-selected targets/scaling
    or automatic reruns.
  - PC caps degree2/256 admitted rows/512 calls; rows+1 attempted marker retained. PC exhaustion disables PC
    only; checked constant-inverse leaf fallback remains. Native20k decisions and20k conflicts per solve, at
    most2^(2s)+1 solves; budget None result is censored.
  - Child120s or global7200s watchdog retains partials; absent required final artifacts makes native aggregate
    incomplete/invalid, never negative mathematics. Controls must complete; censored A/A is inconclusive.
  invalidation_rules:
  - Wrong source/config/native ABI, invalid identity/model/reference, reference-guided search, missing/duplicate/unplanned
    row, changed callback/backend policy, false partial label, failed required control, complete A/A mismatch
    or omitted costs invalidates the affected observation.
  - A native-budget censored full-output row is retained and nondecisive; process timeout missing final artifacts
    prevents valid aggregate completion.
  success_criterion: 'C-SOUND and C-SEARCH: exact checks, all48 eligible pairs and at least one joint partial-proof/fewer-model-check
    signature. This is finite mechanism observation only.'
  falsification_criterion: 'C-SEARCH: no joint signature among all48 completed eligible pairs is negative only
    for this tested instrument. Any incomplete pair is inconclusive; an invalid certificate/reference fails
    C-SOUND.'
  decision_impact:
    on_positive: After independent review, separately admit a larger/held-out comparison against complementary-point
      baseline; no status promotion here.
    on_negative: Rerank this schedule/window below alternatives, preserving shared-coefficient and other search
      directions.
    on_inconclusive: Retain exact missing/censored/invalid records and diagnose before any additive replay.
  variable_ledger:
    independent: *id001
    factors:
    - name: public_inputs
      treatment: fixed
      how: Same frozen curve/digit/target rule and exact inputs within every matched comparison; all encodings
        retained.
    - name: encoding
      treatment: crossed
      how: All four encodings in every input; compare strategies within an encoding only.
    - name: theory_call_timing
      treatment: crossed
      how: Only candidate permits calls with assigned_count<n on eligible contiguous prefix.
    - name: backend_and_policy
      treatment: fixed
      how: Same installed native ABI, seed0, nonlazy callbacks, false-first lowest variable decision and external
        proof/projection clause delivery.
    - name: limits_and_cache
      treatment: fixed
      how: Same PC degree2/256row admission/512call caps; UNKNOWN caches once; checked full-leaf fallback.
        Native per-call decision/conflict caps fixed.
    - name: fresh_process_identity
      treatment: measured
      how: Every arm a fresh child process; A/A repeats identical candidate with a new slot/output identity.
    - name: order
      treatment: fixed
      how: Controls first; rotate strategy order by cell+encoding index modulo3; reference runs last.
    - name: accounting
      treatment: fixed
      how: Same named counter definitions and phase boundaries; no cross-unit pricing. Parent startup wall,
        callback serialization and fsync are not a complete counter model.
    - name: reference_visibility
      treatment: fixed
      how: Reference producer runs after all search/control rows; no oracle-dependent clauses or selection.
    - name: host_environment
      treatment: measured
      how: Native environment plus child ABI/Python fingerprint, host CPU/kernel/load/resource context; no
        timed primary metric.
    - name: analyst
      treatment: fixed
      how: Frozen unmasked extraction; independent review with protocol/source/raw access but no producer interpretation
        before independent recomputation.
    - name: preemption
      treatment: measured
      how: Partial journals preserved; no scientific resume/retry. Missing required final artifacts prevents
        native valid completion.
    comparisons:
    - id: C-SOUND
      arms:
      - model_only
      - partial_prefix
      - partial_prefix_aa
      - reference
      differs_in: []
      design: absolute
      threshold: All declared finite certificate/model/completeness checks pass; no full-model auxiliary census
        is asserted.
    - id: C-SEARCH
      arms:
      - model_only
      - partial_prefix
      differs_in:
      - theory_call_timing
      design: one_factor
    - id: C-AA
      arms:
      - partial_prefix
      - partial_prefix_aa
      differs_in:
      - fresh_process_identity
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P-CALLBACK
    first_recorded_in: coordination/prime_sat_prefix_search_20261030/ranked-action.md
    written_at: '2026-10-30'
    data_seen:
