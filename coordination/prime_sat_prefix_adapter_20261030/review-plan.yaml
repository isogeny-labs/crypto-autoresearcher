review_plan:
  recorded_at: '2026-10-30T01:33:44+00:00'
  claim_under_review: Arithmetic validation and projected-model completeness for the exact existing LSB-prefix transcript
    interface, implemented additively and tested only on the fixed software fixtures.
  coordinator_prior: The sparse cover adapter should match the old verifier on the valid fixed legacy transcripts,
    but parsing aliases, range-CNF equivalence, post-closure malformed items and projection-fiber/censoring semantics
    are plausible failure points. No result has been observed.
  joints:
  - joint: canonical_schema
    assigned_to: TASK-20261030-8e7037
    attack_plan: Use malformed masks, int/string aliases, bool/float/coefficient errors and wrong multiplier shape,
      including after a global closing prefix; reject all supplied invalid records before coverage.
  - joint: prefix_identity
    assigned_to: TASK-20261030-8e7037
    attack_plan: Independently multiply/restrict fixed polynomials and nonconstant multipliers; corrupt a coefficient
      or restriction prefix and require rejection despite syntactically valid clauses.
  - joint: model_fiber_scope
    assigned_to: TASK-20261030-8e7037
    attack_plan: Check each returned assignment, domain and polynomial equation; reject duplicate projections/out-of-range
      models; independently enumerate the tiny multi-auxiliary fiber and distinguish projected from full-model completeness.
  - joint: exact_domain
    assigned_to: TASK-20261030-8e7037
    attack_plan: Decode full auxiliary clauses independently and attack missing, duplicate, below-bound and projected/partial
      clauses. Verify cardinality reasoning and empty-bound case without trusting arbitrary CNF.
  - joint: coverage_and_censoring
    assigned_to: TASK-20261030-8e7037
    attack_plan: Prove each fixed cover/gap against a separate tiny oracle; require complete claims with holes to
      fail and censored-covered reports to remain censored. Large n256 constant refutation must not enumerate.
  - joint: legacy_integration
    assigned_to: TASK-20261030-8e7037
    attack_plan: Execute the fixed p5 four-arm wrappers and direct old verify_search comparison on handmade leaf
      transcripts. Check reconstructed curve witnesses and separated construction costs; forbid solver/search/refute/census/reference
      entry points.
  - joint: actual_execution_custody
    assigned_to: TASK-20261030-8e7037
    attack_plan: Run own fixed suite, retain all attempts/counters/source hashes, ensure original sources unchanged
      and producer new tests/results unseen; do not substitute a source audit for execution.
  blindness:
    mutual: true
    lifted_for: []
    rationale: Review may read frozen old targets and new adapter but not producer new assertions/results/README;
      independent fixed assertion and oracle authorship is the objective.
  proves_too_much:
    objects:
    - Arbitrary CNF treated as an upper auxiliary range
    - Algebraically invalid exclusion hiding behind a full cover
    - Duplicate projection counted as new model
    - Censored transcript relabeled complete
    - Model fiber assumed to consist entirely of roots
    - Coverage gap relabeled arithmetic SAT
    - Malformed item hidden after empty-domain or global refutation
    - Old source-only pass substituted for actual adapter execution
    failure_signature: The exact named invalid inputs/claims must be rejected, censored status retained, all submitted
      arithmetic identities/models checked before coverage, and only projected completeness accepted after actual
      tests.
  blind_rederivation:
    required: true
    assigned_to: TASK-20261030-8e7037
    quantity: Independently authored fixed transcript assertions, Boolean polynomial identity calculations, tiny
      projected-model/fiber/domain oracles and actual wrapper equivalence tests. No new blind theorem round.
    blind_from:
    - research/prime_sat_prefix_adapter_20261030/test_adapter.py
    - research/prime_sat_prefix_adapter_20261030/producer-results.json
    - research/prime_sat_prefix_adapter_20261030/README.md
    - coordination/prime_sat_prefix_adapter_20261030/producer-snapshot-receipt.json
    - Parent/producer outcomes or mathematical conversation beyond initial contract; purely administrative identity/schema/ownership
      exchanges permitted
  review_output:
