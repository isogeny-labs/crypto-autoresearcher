    - research/prime_sat_prefix_adapter_20261030/TASK-20261030-8e7037/independent-results.json
    - research/prime_sat_prefix_adapter_20261030/TASK-20261030-8e7037/review.md
    - research/prime_sat_prefix_adapter_20261030/TASK-20261030-8e7037/attestation.yaml
    verdicts:
