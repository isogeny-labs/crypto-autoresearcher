  independent_variables: &id001
  - name: cold_refuter
    levels:
    - baseline
    - active_support
  metrics:
    primary:
    - id: complete_worker_wall_ns
      name: complete_worker_wall_ns
      unit: nanosecond
      kind: timed
      definition: External supervisor monotonic timestamp immediately before fresh worker process creation
        through wait4/reap after its final artifacts are closed/fsynced; entire descendant CPU and peak simultaneous
        RSS require verified instrumentation, not a sum of ru_maxrss.
      source: /measurement/child_tree/wall_ns
      aggregation: paired_ratio
      resolution: integer nanoseconds
      uncertainty: paired_bootstrap_ci95
    secondary:
    - id: peak_simultaneous_rss_bytes
      name: peak_simultaneous_rss_bytes
      unit: byte
      kind: counted
      definition: Actual child-tree simultaneous peak with sampled resolution; unavailable remains null, never
        max-child falsely labeled.
      source: /measurement/child_tree/peak_rss_bytes
      aggregation: per_row
      resolution: one declared unit
      uncertainty: none_exact
    - id: attempted_rows
      name: attempted_rows
      unit: attempted insertion
      kind: counted
      definition: Per cold residual including over-cap final attempt; diagnostic batch raw list, no unlike-unit
        sum.
      source: /residuals/*/result/attempted_rows
      aggregation: per_row
      resolution: one declared unit
      uncertainty: none_exact
    - id: complete
      name: complete
      unit: Boolean
      kind: exact
      definition: Actual complete verified projected result; censored stays censored.
      source: /result/complete
      aggregation: per_row
      resolution: one declared unit
      uncertainty: none_exact
    - id: support_term_visits
      name: support_term_visits
      unit: term visit
      kind: counted
      definition: Every eager support input term across all generators, including zero-mod-p, above-degree
        and early-stop cases.
      source: /refuter_diagnostics/calls/*/support_setup/input_terms_scanned
      aggregation: per_row
      resolution: one declared unit
      uncertainty: none_exact
    - id: construction_passes
      name: construction_passes
      unit: build invocation
      kind: counted
      definition: Separate actual search and verifier builds; no cached replacement.
      source: /phase_costs/construction_search and construction_verification
      aggregation: per_row
      resolution: one declared unit
      uncertainty: none_exact
    - id: artifact_bytes
      name: artifact_bytes
      unit: byte
      kind: counted
      definition: Actual bytes written including partial snapshots and final artifacts; cumulative I/O separate
        from final size.
      source: /phase_costs/serialization
      aggregation: per_row
      resolution: one declared unit
      uncertainty: none_exact
  seeds:
  - 0
  repetitions: 10
  budget:
    maximum_memory_gb: 8
    maximum_workers: 1
    maximum_runs: 1
  variable_ledger:
    independent: *id001
    factors:
    - name: cold_refuter
      treatment: crossed
      how: Only original-variable versus eager-cleaned-active multiplication; common input validation and private
        bridge in both.
    - name: encoding_and_strategy
      treatment: crossed
      how: All four encodings and three callback strategies are fixed strata; no comparison confounds them.
    - name: inputs
      treatment: fixed
      how: Same twelve public non-witness-selected cases; no new-distribution claim.
    - name: source_abi_threads_limits
      treatment: fixed
      how: Exact committed source/image/ABI, one worker/thread, native seed0 and inherited limits.
    - name: order
      treatment: randomized
      how: Frozen seeded balanced Latin alias orders and counterbalanced workload schedule per round.
    - name: host
      treatment: measured
      how: 'Actual L2/tierB evidence: affinity, SMT, NUMA, governor/frequency, kernel, steal, foreignbusy,
        cgroups, node/Pod/image identity.'
    - name: cold_setup
      treatment: fixed
      how: Fresh process/private module, no warm basis/state; all setup/deepcopy/I/O in boundary.
    - name: fresh_alias
      treatment: randomized
      how: A/A differs only slot/output identity and order; same exact algorithm/input.
    - name: reference
      treatment: fixed
      how: Runs after search; full signed/projected checking, source/setup cost charged once each input/round.
    - name: observer_and_memory
      treatment: fixed
      how: Same measurement instrumentation and child-tree boundaries; overhead/precision retained.
    - name: spot_failure
      treatment: measured
      how: No restore/retry; partials retained, full-panel timing ineligible on any missing/censored row.
    - name: analyst
      treatment: fixed
      how: Frozen executable analysis, no manual removal; independent reviewer recomputes before producer interpretation.
    comparisons:
    - id: C-EXACT
      arms:
      - whole_baseline
      - whole_active
      - residual_baseline
      - residual_active
      - reference
      differs_in: []
      design: absolute
      threshold: All specified arithmetic/coverage/certificate/control assertions hold.
    - id: C-COST
      arms:
      - whole_baseline
      - whole_active
      differs_in:
      - cold_refuter
      design: one_factor
    - id: C-AA
      arms:
      - whole_baseline
      - whole_baseline_aa
      differs_in:
      - fresh_alias
      design: aa
    - id: C-AA-ACTIVE
      arms:
      - whole_active
      - whole_active_aa
      differs_in:
