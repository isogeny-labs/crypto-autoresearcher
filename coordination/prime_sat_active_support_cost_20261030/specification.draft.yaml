    kind: invalidation
    preregistered: true
  invalidation_rules:
  - Any missing required identity/model/reference check, failed positive/negative control, undeclared source
    change or non-L2 measured row invalidates confirmatory cost interpretation.
  - Warmups are excluded prospectively from timed inference but retained in flow and total study cost.
  - Censored A/A is inconclusive, never equality; modeled/injected isolation is invalid.
  success_criterion: Require the entire measured whole panel and controls valid, complete, exact signed/projected
    equality and true L2. For each round sum wall across144 fixed strata separately per alias. Primary ratio
    is mean baseline alias totals divided by mean active alias totals. Use10000 paired round-block bootstrap
    draws. Compare lower95percent ratio limit to max(1.10, baseline-AA and active-AA upper95percent larger/smaller
    ratio limits). Passing is a finite-panel cost signature only. Upper limit<=1 or complete precise failure
    of threshold is no qualifying gain; overlapping/AA/censoring/insufficient precision is inconclusive. Residual
    batches diagnose exact certificates/counters and separately retained panel cost; no additional confirmatory
    tests.
  falsification_criterion:
  - Any missing required identity/model/reference check, failed positive/negative control, undeclared source
    change or non-L2 measured row invalidates confirmatory cost interpretation.
  - Warmups are excluded prospectively from timed inference but retained in flow and total study cost.
  - Censored A/A is inconclusive, never equality; modeled/injected isolation is invalid.
