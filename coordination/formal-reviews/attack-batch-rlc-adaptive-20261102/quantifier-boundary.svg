<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390">
  <rect width="960" height="390" fill="#fffdf9"/>
  <text x="36" y="43" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold" fill="#202b40">Adaptive cancellation versus a fixed error pair</text>
  <text x="36" y="73" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#4b5563">The quantifier order changes the mathematical object being bounded.</text>
  <rect x="34" y="105" width="420" height="210" rx="12" fill="#eaf4ff" stroke="#3973a7" stroke-width="2"/>
  <text x="55" y="139" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#17476d">Challenge-dependent pair</text>
  <text x="55" y="172" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#202b40">For every field F and every challenge ρ:</text>
  <text x="55" y="207" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#202b40">e₀(ρ) = −ρ;  e₁(ρ) = 1 ≠ 0</text>
  <text x="55" y="242" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#202b40">e₀(ρ) + ρ · e₁(ρ) = 0</text>
  <text x="55" y="281" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#17476d">Every challenge cancels this changing pair.</text>
  <rect x="506" y="105" width="420" height="210" rx="12" fill="#eef8ef" stroke="#45855b" stroke-width="2"/>
  <text x="527" y="139" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" fill="#275b36">Pair fixed before challenge</text>
  <text x="527" y="172" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#202b40">For finite field F and fixed (a,b) ≠ (0,0):</text>
  <text x="527" y="207" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#202b40">R = {ρ ∈ F | a + ρ · b = 0}</text>
  <text x="527" y="242" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#202b40">|R| ≤ 1</text>
  <text x="527" y="281" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#275b36">Zero roots if b = 0; one root if b ≠ 0.</text>
  <line x1="455" y1="210" x2="505" y2="210" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="36" y="349" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#4b5563">Scope: scalar field identity and root count. Protocol binding, sampling, and transcript behavior require separate bridges.</text>
</svg>
