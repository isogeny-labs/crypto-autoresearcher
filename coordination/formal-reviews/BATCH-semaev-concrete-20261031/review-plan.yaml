review_plan:
  status: frozen_before_reviewer_dispatch
  source_commit: ad91212179e737d829076ca593d608261590ba89
  target: formal/targets/semaev-s3-concrete-first-fall-20261023.yaml
  named_theorem: CryptoResearch.Semaev.ConcreteFirstFallWitness.concreteNewFall
  claim_under_review: >-
    In the archived n=4, n'=4, seed-32201, draw-1 Boolean S3 system over
    F2[X]/(X^4+X+1), with x_R=1, basis [9,3,2,12] and a6=1, the explicit
    comboMask vector belongs to the degree-three row span, has Boolean degree
    at most two, and lies outside the degree-two row span. The claim is one
    finite witness; it does not assert generic first-fall degree or attack cost.
  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      The exact finite linear-algebra witness is likely reproducible: the
      producer supplies a Lean proof, a source-binding checker, and a second
      Boolean derivation. The important possible failures are a mismatch
      between archived equations and Lean rows, an incorrect parity rule, or
      a claim wider than the one finite theorem.
    uncertainty: >-
      The archived draw and source-to-Lean bridge have not received the
      independent human semantic review required by the formal target. A
      fresh exact-source named build and transitive axiom audit remain due.
  literature_checked_before_plan:
    - source: inputs/SEMAEV-2015-310/paper_fulltext.md
      note: >-
        Section 4.5 states a first-fall definition and a broader Assumption 1
        for Boolean S3 systems. Its generic claim and F4 cost discussion are
        outside this single-draw certificate.
    - source: docs/reports/2026-10-23-semaev-concrete-witness/report.md
      note: >-
        Producer's 23-row finite witness, source-binding and independent
        replay receipts, and explicit pending semantic review.
    - source: docs/reports/2026-10-22-semaev-first-fall-replay/evidence/draws.json
      note: Frozen draw and component-equation commitment.
  immutable_inputs: input-bindings.json
  joints:
    - joint: J1 archived equations and source-to-Lean representation
      owner: T-1060
      attack_plan: >-
        Recheck the archived draw identity and canonical equation hash; derive
        Boolean component equations from the stated S3 formula, field
        arithmetic and basis. Audit the row-order and XOR parity bridge to
        the literal Lean lists. Try an equation mutation and the archived
        set-product bug control. Report exact reads and raw computations.
      breaking_artifact: >-
        A divergent component equation, row, selected-row index, coefficient
        bit, or a mutation accepted by the source-binding check.
    - joint: J2 exact Lean theorem, axioms and semantic boundary
      owner: T-1061
      attack_plan: >-
        On an immutable exact-source copy, build the named module with pinned
        Lake dependencies, print the elaborated type and axioms, and run the
        complete-source gate. Check lowDegreePartThree, rowSpaceTwo, row
        ordering, separator and membership definitions for circularity or
        vacuity. Test wrong name, omitted module, unapproved axiom and one
        altered separator. Do not infer archive custody from kernel acceptance.
      breaking_artifact: >-
        A failed exact-source build, unsafe axiom, weaker elaborated type,
        vacuous span, or false nearby proposition still accepted.
    - joint: J3 blind finite Boolean derivation
      owner: T-1062
      attack_plan: >-
        Read only blind-input.yaml and governance before freezing results.
        Independently derive all four ANFs, degree-two and degree-three
        compatible row spaces, a new low-degree class, and a separating
        functional. Verify degree and nonmembership without using the
        producer's comboMask, witness, checker or reports. Attest every read.
      breaking_artifact: >-
        No new class, a different rank or separator conclusion, or a
        purported witness lying in the degree-two span.
  blindness:
    mutual: true
    lift_only_after_all_reports_frozen: true
  proves_too_much:
    objects:
      - Change one archived Boolean component monomial and require source binding to fail.
      - Multiply one equation with a mask where duplicate monomials cancel over F2; a set union implementation must fail.
      - Replace the separator coordinate 192 with a coordinate that does not annihilate every degree-two row.
      - Apply the finite witness to a different draw or to generic n without new premises; this must be refused.
  blind_rederivation:
    required: true
    input: blind-input.yaml
    forbidden_until_freeze:
      - formal/CryptoResearch/Semaev/
      - docs/reports/2026-10-22-semaev-first-fall-replay/
      - docs/reports/2026-10-23-semaev-concrete-witness/
      - coordination/formal-reviews/BATCH-semaev-concrete-20261031/review-plan.yaml
      - coordination/formal-reviews/BATCH-semaev-concrete-20261031/input-bindings.json
      - sibling reports and receipts
  publication_rule: >-
    This plan is an input to review, not a theorem verdict. Publish and pin it
    before dispatch. No validated_scoped conclusion without fresh machine
    checks, independent semantic fidelity, controls, and attestations.
