schema: crypto.autoresearch.blind_arithmetic_problem.v1
question: >-
  For natural-number target, tau, and open hit counts, determine whether the
  strict tau/open band below 5/4 follows from the assumptions below. Derive
  the result independently, then evaluate the ordered pairs. Freeze your
  derivation and source-read list before seeing any producer proof, source
  finding, archived run or sibling report.
parameters:
  band_numerator: 5
  band_denominator: 4
  ordered_pairs_tau_open: [[16, 40], [40, 40], [20, 40], [40, 40]]
assumptions:
  - targets is a positive natural number
  - openHits equals targets
  - tauHits is a natural number at most targets
requested_statement: 4 * tauHits < 5 * openHits
nearby_controls:
  - {targets: 0, openHits: 0, tauHits: 0, removed_assumption: targets_positive}
  - {targets: 40, openHits: 32, tauHits: 40, removed_assumption: open_saturated}
  - {targets: 40, openHits: 40, tauHits: 51, removed_assumption: tau_bounded}
