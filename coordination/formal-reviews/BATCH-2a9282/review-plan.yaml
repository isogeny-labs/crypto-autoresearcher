review_plan:
  batch_id: BATCH-2a9282
  producer_commit: 8d7fc59238ce0230c4ec3b32ef43519356ffb2dd
  review_base_commit: 4021c67d6d0067cae7bd478a79b6ee0f09e9f6ae
  pre_review_plan: coordination/formal-reviews/BATCH-2a9282/pre-review-plan.md
  pre_review_plan_sha256: e1f44d1b4811b84be007e9209224e9a43b448083c0acccc8996b8322c16d2054
  input_bindings: coordination/formal-reviews/BATCH-2a9282/input-bindings.json
  claim_under_review: >-
    KN-FIND-48f0ae reports that the open arm reached all 40 targets in each
    archived BINSTD n=17, ell=8/9 Stage-1 cell. Given that observation and a
    tau hit count bounded by 40, the frozen 1.25 tau/open band cannot be met.
    The named Lean theorem states the conditional Nat inequality
    4*tauHits < 5*openHits; a second theorem uses the four recorded pairs.
    This review distinguishes arithmetic proof from archived run authenticity.
  coordinator_prior:
    recorded_before_reviewers: true
    expectation: >-
      The conditional arithmetic appears valid and the four committed
      aggregate rows agree with its literals. The run output, EC arithmetic,
      and fresh exact-head Lean verification have not yet been independently
      established. This prior was preserved verbatim in pre-review-plan.md
      before this batch or any reviewer was dispatched.
    uncertainty: >-
      Whether the named elaborated Lean declarations match the finding's
      quantifiers, whether the archived digest chain and run controls bind the
      observed counts, and whether a fresh pinned build and axiom audit pass.
  joints:
    - id: J1
      joint: Blind arithmetic and assumption boundary
      assigned_to: TASK-20261030-9a823c
      attack_plan: >-
        From blind-input.yaml only, derive the 1.25 ratio inequality and all
        four instantiated cases. Try zero targets, unsaturated open hits,
        tau hits above targets, and equality at the band. Freeze the derivation
        and source-read attestation before seeing the producer theorem or
        any sibling report.
      breaking_artifact: >-
        An explicit natural-number counterexample under all stated hypotheses,
        a denominator or quantifier gap, or a precise missing assumption.
    - id: J2
      joint: Archived counts and execution-source binding
      assigned_to: TASK-20261030-7fa8d0
      attack_plan: >-
        Recompute all four hit counts, ratios and digest links from the pinned
        matrices, raw results and execution receipts. Compare seeds, ell values,
        target counts and summary claims. Independently rerun the archived
        checker negative control and state exactly what its pass accepts.
        Mutate one matrix or swap one ell while retaining a stale digest.
      breaking_artifact: >-
        A first inconsistent row or digest, a source summary that cannot be
        reproduced, or an archived checker success on fabricated measurement
        content that defeats execution authentication.
    - id: J3
      joint: Named Lean declarations, machine gate and semantic fidelity
      assigned_to: TASK-20261030-cde42c
      attack_plan: >-
        Build the named theorem module from an isolated immutable copy on the
        pinned Lean and Mathlib revisions; print elaborated types and axioms
        for both declarations; run the complete-source formal gate and fresh
        independent kernel checker if available. Compare each hypothesis and
        quantifier to the source finding. Test a wrong theorem name, an omitted
        module and an unapproved axiom. Do not infer run authenticity from a
        passing Lean build.
      breaking_artifact: >-
        A source or pin mismatch, missing or axiom-dependent declaration,
        omitted source module, or an exact clause of the finding not implied
        by the elaborated theorem.
  blindness:
    mutual: true
    lifted_for: []
  proves_too_much:
    objects:
      - 'targets=0, openHits=0, tauHits=0: 0 < 0 is false without targets_pos.'
      - 'targets=40, openHits=32, tauHits=40: 160 < 160 is false without open_saturated.'
      - 'targets=40, openHits=40, tauHits=51: 204 < 200 is false without tau_bounded.'
    failure_signature: >-
      A proof that claims the same strict inequality on any of these objects
      without the excluded assumption proves too much. Passing the controls
      is not evidence that the historical hit counts were measured correctly.
    assigned_to: TASK-20261030-9a823c
  blind_rederivation:
    required: true
    quantity: >-
      Derive the exact 5/4 ceiling and evaluate the four ordered hit pairs
      from the stated natural-number assumptions alone.
    parameters: coordination/formal-reviews/BATCH-2a9282/blind-input.yaml
    blind_from:
      - coordination/formal-reviews/BATCH-2a9282/pre-review-plan.md
      - coordination/formal-reviews/BATCH-2a9282/review-plan.yaml
      - coordination/formal-reviews/BATCH-2a9282/input-bindings.json
      - coordination/formal-reviews/BATCH-2a9282/controls/
