      - knowledge/findings/KN-FIND-48f0ae.md
      - experiments/EXP-BINSTD-8bdf86/
      - coordination/formal-reviews/BATCH-2a9282/reviews/
    assigned_to: TASK-20261030-9a823c
  procedure_deviations: []
