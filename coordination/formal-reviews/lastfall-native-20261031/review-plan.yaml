review_plan:
  claim_under_review: >-
    The pinned target claims that, for a field k, polynomial ring R, and F subset R,
    if d_F is finite and F has a degree fall, then d_F is the maximum d_f over
    f in (F) with d_f greater than deg f. The accompanying note distinguishes
    this global invariant from a finite measured Macaulay rank profile, which
    needs a checked V_{F,i} bridge and a bound excluding later falls.
  coordinator_prior: >-
    The earlier T-1105/T-1106/T-1107 reports suggest the conditional invariant
    theorem is faithful, while finite rank data does not certify its global
    value. Those reports failed the native TASK-ID independence gate and are
    historical inputs only. This prospective round must rederive its own
    evidence; a hosted Lean run on this head is pending and is not a verdict.
  joints:
    - joint: The source theorem and Definition 1.5 match the target's quantifiers and both nonvacuity hypotheses.
      assigned_to: TASK-20261031-f7242f
      attack_plan: >-
        Read the primary paper body and pinned target, restate both implications
        using V_{F,i}, and test empty F, F={x}, and an actual fall example.
        Record exact source page and any missing finite or existence condition.
      breaking_artifact: A line-cited source mismatch or explicit edge-case counterexample.
    - joint: The exact Lean declaration proves the conditional invariant theorem with its claimed assumptions and no unapproved axioms.
      assigned_to: TASK-20261031-43dc46
      attack_plan: >-
        Inspect the elaborated type, V construction, degreeFall guard and
        IsGreatest fields. Check source coverage, current-head hosted build,
        named target result and transitive axiom audit. Try removing hfin and
        hfall; distinguish elaboration failures from counterexamples.
      breaking_artifact: A type, axiom, source-coverage or control failure with raw logs.
    - joint: A finite per-degree Macaulay profile establishes only its checked bounded consequences unless closure and cutoff are supplied.
      assigned_to: TASK-20261031-9a6bc2
      attack_plan: >-
        From blind-input.yaml alone, derive d_F and degree-fall behavior of
        G_D={x^D,x^D+x} and H_D={x^(D+1),x^(D+1)+x} for D>=2.
        Determine what the common prefix below D can establish and identify
        the exact missing bridge needed for a measured profile.
      breaking_artifact: A checked later-fall counterexample or a derivation of a valid cutoff.
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - F is empty, so no degree fall exists.
      - F={x}, so hfall should fail.
      - A profile truncated below the degree of a later generator.
    failure_signature: >-
      The target theorem must not apply without hfall, and a truncated profile
      must not be promoted to an exact global d_F.
    assigned_to: TASK-20261031-9a6bc2
  blind_rederivation:
    required: true
    quantity: The relation between d_F, all degree falls and a finite profile cutoff.
    parameters: Arbitrary field k, R=k[x], D>=2, G_D and H_D as in blind-input.yaml.
    assigned_to: TASK-20261031-9a6bc2
    blind_from:
