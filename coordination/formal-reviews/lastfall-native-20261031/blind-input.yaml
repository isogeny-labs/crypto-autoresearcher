schema: formal-blind-input/v1
field: arbitrary field k
ring: R = k[x]
definitions:
  - V_{F,i} is the smallest k-vector space containing generators of degree at most i and closed under multiplication without exceeding degree i.
  - d_f is the least i such that f lies in V_{F,i}, when that least i exists.
  - d_F is the least d such that every f in (F) lies in V_{F,max(d,deg f)}, when finite.
question: Determine what a finite profile through degree D-1 proves about d_F and later falls.
systems:
  G_D: [x^D, x^D+x]
  H_D: [x^(D+1), x^(D+1)+x]
parameter: D >= 2
