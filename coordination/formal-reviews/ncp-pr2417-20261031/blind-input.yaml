schema: crypto.autoresearch.blind_review_input.v1
task_id: TASK-20261031-f9c13a
question: For words over translation letters t_i and a negation letter nu, what is
  the least length realizing a specified sign e and integer signed-count vector a?
definitions:
- A word is a finite left-to-right list of t_i (i in Fin B) and nu.
- e is (-1) raised to the number of nu letters.
- Each occurrence of t_i contributes (-1) raised to the number of nu letters to its
  right to coordinate a_i.
- B is any finite natural number, including zero; a has integer coordinates.
required_cases:
- B=0, e=+1 and e=-1, a=empty, budgets 0 and 1
- B=2, a=(-1,2), e=+1 and e=-1, budgets 4 and 5
- An independently chosen mixed-sign vector
output: State the derived formula only after recording the reasoning and raw small-case
  enumeration.
