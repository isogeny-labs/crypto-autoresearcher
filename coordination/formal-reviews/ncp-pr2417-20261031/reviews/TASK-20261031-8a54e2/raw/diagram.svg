<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#40566c"/></marker></defs>
  <rect width="1000" height="590" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#152c43">
    <text x="40" y="40" font-size="25" font-weight="bold">Two algebra maps distinguish the witness</text>
    <text x="40" y="70" font-size="16">J2 source calculation; integer coefficients; any n and selected i : Fin B</text>
    <rect x="40" y="175" width="285" height="128" rx="12" fill="#e9eff8" stroke="#40566c"/>
    <text x="62" y="208" font-size="19">Free algebra A = Z&lt;t_i, v&gt;</text>
    <text x="62" y="242" font-size="20" font-weight="bold">w = (v t_i)^2 - 1</text>
    <text x="62" y="276" font-size="16">C = ideal of all xy - yx</text>
    <path d="M325 195 L610 130" stroke="#40566c" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <text x="370" y="133" font-size="17">all generators map to 0</text>
    <rect x="630" y="90" width="320" height="110" rx="12" fill="#edf7f1" stroke="#307557"/>
    <text x="650" y="122" font-size="20">Integer-valued algebra map</text>
    <text x="650" y="153" font-size="21" font-weight="bold">a(C) = 0; a(w) = -1</text>
    <text x="650" y="181" font-size="16">Therefore w is outside C.</text>
    <path d="M325 270 L610 319" stroke="#40566c" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <text x="370" y="350" font-size="17">v maps to N; t_i to T_s</text>
    <rect x="630" y="265" width="320" height="120" rx="12" fill="#edf7f1" stroke="#307557"/>
    <text x="650" y="298" font-size="20">Group algebra Z[Aff(Z/n)]</text>
    <text x="650" y="331" font-size="21" font-weight="bold">rho(w) = 0</text>
    <text x="650" y="361" font-size="16">(N T_s)^2 = identity</text>
    <path d="M790 385 L790 445" stroke="#a45631" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <text x="40" y="427" font-size="18" font-weight="bold">Historical target boundary, n = 3</text>
    <text x="40" y="459" font-size="17">q = sum translations - sum translated reflections</text>
    <text x="40" y="489" font-size="17">Six distinct basis elements: q is nonzero.</text>
    <text x="40" y="519" font-size="17">Each orbit sum is the sum of all three points.</text>
    <rect x="630" y="455" width="320" height="88" rx="12" fill="#fff0e6" stroke="#a45631"/>
    <text x="650" y="487" font-size="20">Operators on Z[Z/3]</text>
    <text x="650" y="520" font-size="18" font-weight="bold">q acts as the zero matrix</text>
    <text x="40" y="569" font-size="14">TASK-20261031-8a54e2 | raw/controls.json | Fresh Lean replay remains unperformed.</text>
