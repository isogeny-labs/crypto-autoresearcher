  - No scientific trials, cloud jobs, local Lean/Cargo build, or new instances without
    resource ownership and budget admission.
  archived_by: TASK-20261031-a56440
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    delivery: interactive
    deadline_seconds: null
  budget: {}
  completion_gate:
  - New review_attestation with complete sources_read and joint verdict.
  - Raw checks and false-case control outcomes retained under own TASK path.
  - Archive through the assigned archival task.
  return_format: Review report, raw checks, read attestation and exact artifact hashes.
  id: TASK-20261031-f17d2a
  objective: Pin archive and source at ad91212179e737d829076ca593d608261590ba89; recompute
    the four component equations and ordered parity rows, compare Lean literals and
    witness indexing, test source mutation and XOR-vs-set control.
  uncertainty_reduced: J1 archive equations and source-to-Lean representation
  inputs:
  - coordination/formal-reviews/BATCH-016711/review-plan.yaml
  - coordination/formal-reviews/BATCH-016711/input-bindings.json
  - formal/targets/semaev-s3-concrete-first-fall-20261023.yaml
  deliverables:
  - Own-joint review report
  - Raw derivation/control output
  - review_attestation
  artifact_paths:
  - coordination/formal-reviews/BATCH-016711/reviews/TASK-20261031-f17d2a/
  review_plan:
    status: prospective_before_reviewer_dispatch
    source_commit: ad91212179e737d829076ca593d608261590ba89
    target: formal/targets/semaev-s3-concrete-first-fall-20261023.yaml
    named_theorem: CryptoResearch.Semaev.ConcreteFirstFallWitness.concreteNewFall
    claim_under_review: For the one archived n=4, n'=4, seed-32201, draw-1 Boolean
      S3 system, the explicit witness vector selected from degree-three compatible
      rows belongs to their span, has Boolean degree at most two, and lies outside
      the degree-two compatible-row span. This is one finite certificate, not a generic
      first-fall or attack-cost statement.
    coordinator_prior:
      recorded_before_reviewers: true
      expectation: The exact finite Boolean witness is likely reproducible from the
        frozen card. Earlier reviews found a matching archive-to-Lean bridge, a named
        machine receipt and a distinct blind separator, but their batch plan failed
        the independence checker. This prospective round tests those joints again
        under a valid plan; the earlier results are prior evidence, not outputs of
        this round.
      uncertainty: Whether a new source reviewer finds a custody or row-order mismatch,
        whether a new Lean reviewer agrees with the exact elaborated statement and
        axioms, and whether a fresh blind reviewer derives an independent class without
        seeing the previous reports or producer implementation.
    immutable_inputs: input-bindings.json
    joints:
    - joint: J1 archive equations and source-to-Lean representation
      assigned_to: TASK-20261031-f17d2a
      attack_plan: At the pinned source tree, independently bind the one archived
        draw, derive its four component equations, recompute ordered degree-two and
        degree-three compatible rows with XOR parity, and compare the literal Lean
        equation lists and witness indexing. Test a changed archived component and
        a duplicate-monomial set-union error. Attest exact reads. Do not read any
        J2/J3 report from this round or the earlier round until your result is frozen.
      breaking_artifact: A byte/hash mismatch, equation or row-order divergence, witness-index
        discrepancy, or a mutation accepted by the purported binding check.
    - joint: J2 exact Lean theorem, axioms and semantic boundary
      assigned_to: TASK-20261031-4870db
      attack_plan: Independently compare the elaborated type, row-space definitions,
        module and verifier hashes, pinned toolchain and named hosted receipt to the
        exact source claim. Check for vacuity, circular premises and hidden generic
        transfer. Reproduce a false separator control with a low-memory computation.
        Use hosted proof evidence if the local host lacks exclusive build capacity;
        never describe it as a local build. Attest exact reads. Do not read J1/J3
        reports from this or the earlier round until your judgment is frozen.
      breaking_artifact: A weaker theorem, extra premise, unsupported source bridge,
        unsafe axiom, vacuous definition or a false nearby statement still accepted.
    - joint: J3 blind finite Boolean re-derivation
      assigned_to: TASK-20261031-068004
      attack_plan: Before freeze, read only blind-input.yaml and governance. Derive
        all four component ANFs, the degree-two and degree-three compatible row spaces
        and ranks, and decide if a new degree-at-most-two class exists. If one exists,
        give an explicit row combination and a separating functional with raw values.
        Test duplicate-monomial XOR parity and a mutated component. Freeze code, raw
        output and read attestation before any source or sibling comparison. Do not
        read the review plan itself.
      breaking_artifact: No new class, a different rank or degree result, a proposed
        witness in the lower row span, or a negative control that does not fail.
    blindness:
      mutual: true
      lifted_for: []
      lift_only_after_all_reports_frozen: true
    proves_too_much:
      objects:
      - A changed archived Boolean component monomial.
      - A multiplication with duplicate monomials that cancel in F2.
      - A separator coordinate changed so it fails to annihilate a degree-two row.
      - The finite witness applied to another draw or generic n without new binding
        premises.
      failure_signature: A sound review must reject the changed component against
        its source binding, use XOR rather than set union for duplicate monomials,
        exhibit a degree-two row on which the altered separator is nonzero, and refuse
        transfer of the certificate to an unbound draw or generic parameter.
      assigned_to: TASK-20261031-4870db
    blind_rederivation:
      required: true
      quantity: Four Boolean component ANFs, compatible row counts and ranks at degrees
        two and three, an explicit degree-at-most-two class outside the lower span
        if one exists, and an independently derived separating functional.
      parameters: coordination/formal-reviews/BATCH-016711/blind-input.yaml
      blind_from:
      - coordination/formal-reviews/BATCH-016711/review-plan.yaml
      - coordination/formal-reviews/BATCH-016711/input-bindings.json
      - coordination/formal-reviews/BATCH-016711/reviews/
      - coordination/formal-reviews/BATCH-semaev-concrete-20261031/
      - formal/CryptoResearch/Semaev/
      - formal/targets/semaev-s3-
      - docs/reports/2026-10-22-semaev-first-fall-replay/
      - docs/reports/2026-10-23-semaev-concrete-witness/
      - problems/semaev-concrete-review-independence-plan-invalid.md
      assigned_to: TASK-20261031-068004
    procedure_deviations: []
    publication_rule: This plan asserts no review result. Freeze it before reviewer
      dispatch. Do not assign a complete validated_scoped verdict unless the composed
      independence checker passes and the source, Lean, blind, controls and external
      execution boundaries have been reconciled in a graph/PDF report.
