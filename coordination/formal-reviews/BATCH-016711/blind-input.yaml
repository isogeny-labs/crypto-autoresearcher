blind_input:
  field: F2[X]/(X^4+X+1)
  representation: 4-bit polynomial coefficients, low bit first
  basis_for_each_variable: [9, 3, 2, 12]
  variables: [x1, x2]
  fixed_xR: 1
  a6: 1
  formula: S3(x1,x2,xR) = (x1*x2 + x1*xR + x2*xR)^2 + x1*x2*xR + a6
  boolean_encoding: >-
    Eight bits select basis elements of x1 then x2. Squarefree monomial
    mask j is the product of selected bits; coefficients and row sums are in F2.
  compatible_rows: >-
    For each of four component equations in component order, multiply by
    each Boolean monomial mask 0..255, reduce x_i^2=x_i with XOR parity, and
    retain a row when every nonzero output monomial has degree at most D.
  requested_derivation: >-
    Derive the four component ANFs, ranks at D=2 and D=3, and decide whether
    the D=3 span contains a degree-at-most-two vector outside the D=2 span.
    If so, provide a row combination and a linear separator with raw values.
  negative_controls:
    - Show a multiplication where equal monomials cancel in F2.
    - Mutate one component equation and show how the derived rows change.
