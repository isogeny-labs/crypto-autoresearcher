  cluster: 12 LIFT
  type: barrier
  claim_tier: toy
  dependencies: []
  draft_file: coordination/goals31/drafts/cluster_12_lift_G31-002.md
deferrals:
- id: DEF-G31-01
  title: Large-prime / partial-relation scope note for G30-014
  classification: scope-note
  reason: >-
    The large-prime audit claim was refuted against the trunk — LEAD-ICP-residual-partial-relations,
    LEAD-ICB-large-prime-variants and LEAD-ICE-relation-graph-rank-large-prime are open and the
    Gaudry–Thomé–Thériault–Diem paper is ingested twice (KN-LIT-92caf4 read at source). The one
    surviving grain is metrological: G30-014's enumerator counts pure smoothness only.
  routed_to: >-
    G30-014 draft, activation-time scope paragraph ("law covers pure smoothness; extrapolation to
    deployed single/double large-prime variants is unproven pending LEAD-ICP-residual-partial-relations").
    No new goal; no ledger record.
- id: DEF-G31-02
  title: Odd-characteristic Semaev polynomial census and Patault–Plesis ingest
  classification: ingest-plus-control
  reason: >-
    Patault–Plesis (2023) has zero corpus hits, but the audit's premise is inverted: odd-characteristic
    S_3 is the easy resultant case; characteristic 2 is where 3-summation was the bottleneck. The real
    gap is independent validation of the m=4 system that G30-006 consumes from G30-026.
  routed_to: >-
    (a) one literature-ingest task for Patault–Plesis; (b) a self-certifying S_m control inside G30-026's
    gap-2 module — sample P_1..P_{m-1}, compute the sum's x-coordinate by the group law, require
    S_m to vanish on-relation and not vanish off-relation. S_4 published over a ~2^31 prime field remains
    a standalone-publishable item for later scoping, not a goal.
- id: DEF-G31-03
  title: Diem non-existence / correspondence-obstruction literature mining
  classification: literature-task
  reason: >-
    KN-LIT-003 and KN-LIT-65f76d digest Diem's DLP I/II one-sidedly (positive subexponentiality only);
    no entry covers the cohomological/correspondence non-existence side. This is a reading task, not an
    experiment, and its likely outcome is a hypothesis-mismatch verdict rather than a barrier.
  routed_to: >-
    One focused digest pass (DLP II plus the correspondences/L-functions material), output as a new
    KN-LIT entry with an explicit "does not apply to fixed prime fields / arbitrary correspondence
    engines" scope line; may feed a TRANSFER-family closure note if the hypotheses match.
- id: DEF-G31-04
  title: Activate the secant-rank digest (KN-LIT-1861) as G31-001 provenance
  classification: knowledge-link
  reason: >-
    The paper is ingested but carries only a boilerplate "background mathematics" relevance note and has
    zero backlinks; G31-001 is the first goal to actually use its object.
  routed_to: >-
    A knowledge supersede/annotation pass at activation time (never an in-place edit of the existing entry):
    add the G31-001 link and the q ∈ C^s \ C^2 secant-rank statement as the source of the rank statistic.
