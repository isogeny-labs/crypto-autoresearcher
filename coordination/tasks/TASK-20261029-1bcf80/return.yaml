        test_an_uncommitted_second_execution_is_a_chain_of_its_own
        (append-only history audits clean: test_an_append_only_history_is_one_chain_and_audits_clean)
    sum_drift_fixture: >-
      The synthetic driver takes the mean of 45 floats from random.Random(2),
      where the large terms cancel. A strict left fold (CPython 3.11 sum)
      gives -0.26666666666668687 and a Neumaier sum (CPython 3.12+ sum) gives
      -0.26666666666666544. That is 386 ulps, relative 8.0e-14. Real
      python3.11 and python3.13 give these same two values.
      test_the_real_3_11_versus_3_13_drift records under python3.11, replays
      under 3.13, and ran here (it is not skipped when both interpreters are
      present). The PFDR pair from DEC-20261029-5554ee (416 ulps) is also
      checked: it fails the exact compare and passes under rel_tol 1e-9,
      abs_tol 1e-12.
