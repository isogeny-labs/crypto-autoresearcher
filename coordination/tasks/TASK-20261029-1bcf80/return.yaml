    gate_coverage:
      float_drift_without_tolerance_is_a_mismatch: tests/test_runbook_audit_tolerance.py::test_float_drift_without_tolerance_is_a_mismatch_finding
      float_drift_with_tolerance_is_matched_within_tolerance: >-
