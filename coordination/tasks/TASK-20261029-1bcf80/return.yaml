        test_a_resume_behind_a_ref_that_extends_it_is_accepted
        (refusal of an unrelated ref journal: test_a_resume_is_refused_when_a_ref_holds_an_unrelated_journal)
      two_unrelated_journal_chains_give_an_audit_finding: >-
