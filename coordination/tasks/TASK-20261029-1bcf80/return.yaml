  changes:
    C-1: >-
      replay.compare items in fields mode take an optional tolerance
      {rel_tol, abs_tol}. Lint checks that each value is finite and
      non-negative, that no other keys appear, and that bytes mode carries no
      tolerance. `audit --float-tolerance rel_tol=R,abs_tol=A` (or
      audit(float_tolerance=...)) applies to every fields pointer the runbook
      gives no tolerance. audit.json records it as float_tolerance with
      source audit_option. compare_tolerant keeps the old _same verdict when
      the values are exactly equal. Otherwise the structure must match (key
      sets, list lengths and order) and so must the leaf types, so int versus
      float is a mismatch. Non-float leaves must be equal, and float leaves
      must agree under math.isclose. Each replay has a result: matched,
      matched_within_tolerance or mismatch. `matched` stays true only for an
      exact match. Each compared pointer records its result, the tolerance
      and its source, the number of differing float leaves, and the largest
      absolute and relative difference. replay_results counts the outcomes.
      Only a mismatch is a finding. With no tolerance the result is the exact
      verdict, so a float drift stays a finding. The audit schema moved to
      crypto.autoresearch.runbook_audit.v2, because `matched: false` no
      longer always means a mismatch (C-5).
    C-2: >-
      Each replay records the interpreter its argv[0] runs, probed under the
      replay environment: sys.version, executable and platform version.
      audit.json also records audit_interpreter and replay_interpreters. When
      the unit's manifest.yaml has /run/environment/python_version and it
      differs, the replay carries an environment_drift note naming both
      versions, collected in the top-level environment_drift. The note does
      not change the result. When the runbook pins environment.python and the
      interpreter's major.minor differs, the unit is reported not_covered and
      not replayed.
    C-3: >-
      Runner.run calls session_id_collisions before anything else. It finds
      <session_dir>/journal.jsonl on every refs/heads and refs/remotes ref
      (for-each-ref plus a single cat-file --batch-check; read-only, no
      fetch). With no local journal, any hit refuses as an impediment naming
      the ref and the blob, and nothing is written. With a local journal,
      each ref's journal must be a byte prefix or an extension of it. If the
      blob ids are equal the contents are not read. Outside a git work tree
      root the check is a no-op.
    C-4: >-
      audit calls journal_chain_findings. It takes every distinct
      journal.jsonl blob at the session path in git log --all --full-history,
      plus the working-tree journal. A blob that is a byte prefix of another
      joins its chain. Each maximal blob heads one chain. More than one chain
      gives one finding per chain, naming the blob, first commit, first entry
      time and owner. audit.json lists them all as journal_chains. A journal
      with more than one session_started entry is also a finding.
    C-5: >-
      The new audit.json fields are additive. The schema id is bumped as
      described under C-1, and committed v1 audits are untouched. The default
      verdict did not loosen. Every test from before the change passes
      unchanged.
    C-6: >-
      All tests use synthetic sessions in temporary directories and temporary
      git repositories. No trial ran and no real session was audited.
