  discrepancies:
    - id: D1
      severity: moderate
      title: >-
        The MDE test in analyze.py (and check.py) carries a 3-fold variance
        inflation that the frozen text excludes; it changes the recorded powered
        cells and Holm-adjusted p-values, not the classification
      frozen_text: >-
        specification.yaml lines 166-171 and 471-475: powered only if the MDE
        "computed from the MEASURED null standard deviations, MDE = 3.61 *
        rms_j sd_j / sqrt(n) ... with no inflation factor, is <= 0.25 percent
        (delta / 2) for EVERY arm". The spec's own worked case (line 461,
        N = 2^18, sigma 0.27 percent, n = 8, MDE 0.35 percent) is the
        no-inflation arithmetic (3.61 x 0.27 / sqrt 8 = 0.345).
      code: >-
        analyze.py line 44 VAR_INFLATION = 3.0 and lines 218-220 mde() =
        Z_MDE * sqrt(3.0) * 1.0025 * sigma / sqrt(n); check.py lines 560-561
        repeats 1.0025 * sqrt(3) * 3.61 * sd / sqrt(n). Inherited from an
        earlier draft of the resolution_delta derivation (test_cmfb.py line 417
        still comments "3-fold variance"). Frozen with the code at adef9cd65e
        and bound by hash in the trial plan, so it is a spec-versus-code
        inconsistency present at freeze, not a post-approval edit (I11 does
        not fire).
      numbers:
        mde_percent_frozen_text: {C16: "FAM 0.767, N-A 0.759, N-B 0.885 (not powered)", C20: "FAM 0.140, N-A 0.154, N-B 0.141 (all <= 0.25, powered)", C24: "FAM 0.037, N-A 0.037, N-B 0.033 (powered)"}
        mde_percent_as_recorded: {C16: "1.332 / 1.318 / 1.537", C20: "0.243 / 0.268 / 0.245 (N-A fails 0.25)", C24: "0.065 / 0.063 / 0.057"}
        powered_cells: {recorded: [C24], frozen_text: [C20, C24]}
        holm_adjusted_p: {recorded: "FAM C24 0.0936, N-A C24 0.9691, N-B C24 0.1589", frozen_text: "FAM C24 0.1872, N-B C24 0.3972, all other four 1.0"}
      effect_on_outcome: >-
        Classification NULL_AT_RESOLUTION under both readings (M7); no Holm
        rejection under either; growth not assessable under both. What changes
        is the scope the null covers: cells C24 only as recorded, C20 and C24 by
        the frozen text; the recorded departure is in the conservative
        direction (fewer powered cells), so it cannot have produced a spurious
        null reading from a cell the frozen text excludes.
      voids_anything: >-
        No by the contract's mechanical rules: I1..I11 evaluate as the
        producer's checker defines them (I9 is defined as agreement with
        check.py's recomputation, which shares the constant). A reviewer may
        read I9 literally ("any table in t8 differs from its recomputation")
        and treat the powered and holm_p fields as a disagreement with the
        frozen formula; that reading would make R1 fire. My determination is
        that it should not, because the decision output is identical under both
        formulas, but the choice is the Coordinator's and is recorded here so
        it is not made silently.
      suggested_resolution: >-
        Quote the powered set and Holm values from this report next to the
        recorded ones, or have the Coordinator record an amendment/clarification
        stating which formula governs. Nothing under runs/ is to be edited.
    - id: D2
      severity: low
      title: >-
        The I10 variance flag fires in all 9 arm-cells because analyze.py
        compares against the superseded occupancy formula, not the frozen
        1.4/sqrt(N)
      question_answers:
        which_formula_does_the_frozen_spec_require: >-
          sigma_rel(N) = 1.4 / sqrt(N), accepted band 0.75x to 1.33x of it:
          specification.yaml lines 389-392 (controls), 408 (secondary metric),
          424-429 (preregistered_prediction.formula: the occupancy value
          "underestimates the real spread by a factor 2.4 to 2.75 ... the
          constant 1.4 replaces the earlier draft constant"), 518-519 (tail
          checks), 994 (I10) and 1026 (pre-freeze disclosure).
        what_the_code_does: >-
          analyze.py lines 387 and 407-409 compute count.sigma_rel_formula
          (count.py line 149): sqrt(e^-mu (1 - (1 + mu) e^-mu)) / ((1 - e^-mu)
          sqrt N), about 0.49/sqrt(N) at mu near 1.04, i.e. the superseded draft
          constant. SIGMA_BAND (0.75, 1.33) is right; the centre is wrong.
        code_defect_or_legitimate_signal: >-
          Code defect (false positive). The recorded measured/formula ratios
          2.39..2.77 are the 2.4..2.75 the spec says the draft formula
          underestimates by. Against the frozen 1.4/sqrt(N) the arm-cell rms of
          the measured null sd gives ratios FAM 0.878 / 0.896 / 0.940, N-A 0.815
          / 0.896 / 0.925, N-B 0.842 / 0.945 / 0.971 (C16 / C20 / C24): 0 of 9
          arm-cells outside [0.75, 1.33]. Member level: 106 of 107 members inside
          the band (range 0.739..1.029, mean 0.915); one member is outside, N-A
          C16 index 3 (N = 19081) at 0.739, 1.5 percent below the band edge and
          within the 5 percent sampling error of a standard deviation estimated
          from 200 draws; it sits in the underpowered, excluded C16 cell. There
          is no legitimate variance signal. (The ratios trend from 0.84 at C16
          to 0.94 at C24: the constant 1.4 is slightly high at small N; this is
          not a flag condition.)
        voids_anything: >-
          No. The spec makes I10 "a flag, reviewer decides, not an automatic
          void" (line 994, and controls line 391-392). In the code,
          sigma_flag_I10 is not in the rules dict, not in void, and not read by
          classify(); the MDE and powered tests use the measured sd only, never
          the formula; check.py does not evaluate I10. The defect is confined to
          three reporting fields in all 9 rows of RUN-CMFB-2010d3
          (sigma_rel_rms_formula, sigma_ratio, sigma_flag_I10). Those recorded
          fields should not be quoted; the validator's recomputed ratios above
          replace them. The second I10 clause (a scan beyond p) does not occur:
          max W/p = 0.0066.
        producer_disclosure: >-
          Disclosed in report.typ section 1.6 with an approximate rescaling
          (x 0.35, giving 0.84..0.97); my exact values are 0.815..0.971.
    - id: D3
      severity: informational
      title: FAM C16 interval equals T at its lower end
      evidence: >-
        With n = 4 and block length 3 the moving-block bootstrap has only two
        block starts and four possible resample means (-0.17419, -0.16147,
        -0.04668, -0.03396 percent), so the 95 percent interval is degenerate and
        T is one of its ends (derived by enumeration). C16 is UNDERPOWERED by
        member count and enters no conclusion under either reading of D1.
    - id: D4
      severity: informational
      title: Stream-id convention for contrasts and slope
      evidence: >-
        The spec's implementation_conventions write rng(seed, cell, arm, stream,
        0) for the bootstrap streams, the code uses SeedSequence [seed, cell
        code, arm code, 0, stream]. They coincide for stream 0 (the CI and the
        randomization test, the decision-bearing ones); they differ for the
        contrast streams 1..3, which are descriptive. Recomputing under both
        orders changes the 99 percent contrast ends by <= 0.003 percentage
        points and no interval excludes 0.
    - id: D5
      severity: informational
      title: Independence of the checker
      evidence: >-
        check.py recomputes tables without importing driver or analyze code,
        but it shares the sqrt(3) factor of D1 and does not evaluate I10, so
        its pass is not evidence on D1 or D2. My recomputation (own code from
        the spec text) is what establishes the other items.

