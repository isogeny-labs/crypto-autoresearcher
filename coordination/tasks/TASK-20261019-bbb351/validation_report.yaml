  metric_recomputations:
    - id: M1
      quantity: FAM sieve, member counts per cell, member lists
      method: own trial-division primality (no Miller-Rabin), odd t in 3..2600
      result: >-
        27 members; C16 4, C20 10, C24 13 (t = 103 117 141 187; 253 357 407 441
        463 637 733 747 813 901; 1211 1253 1281 1407 1517 1547 1561 1611 1841
        1863 2091 2233 2497). Equal to RUN-CMFB-2373be and to the measured FAM
        member lists; no subset needed (all M_c <= 16). Rule P1 not applied
        (M16 = 4 < 8, M20 = 10 >= 8). Bateman-Horn (secondary heuristic H3)
        recomputed with own code: expected 3.1146 / 8.0113 / 14.4151, c_odd
        4.651291, equal to the recorded values.
      script: repro/ind_instances.py, repro/ind_controls.py
    - id: M2
      quantity: Curve, twist and instance validity (rule I4) on all 131 measured and control curves
      method: >-
        validator-owned arithmetic (indlib.py): primality of p and N by trial
        division, Hasse, band, N odd (so f has no root), [N]P = O on 3 own
        points, j = -96^3 test, trace identity 4p = a^2 + 19 b^2 and
        N = p + 1 - a, family formulas, d-twist chart and twist-selection rule
        (including that the d = 1 chart's smallest-x point is or is not killed
        by N exactly as the recorded d implies), N-A parity, b != a + 2, not a
        family prime, theta-stratum angle window 0.20..0.25, N-B coefficient
        range, no repeated prime per arm and cell, control curves disjoint from
        N-B curves, p mod 120.
      result: 0 failures in 131 curves; arm x cell counts equal the quotas (FAM 4/10/13, N-A 8/16/16 with u/theta split 4+4, 8+8, 8+8, N-B 8/16/16, N-B-ctrl 8 per cell).
      script: repro/ind_instances.py
    - id: M3
      quantity: Labelling (rule I5)
      method: >-
        rebuilt the small-x base from (A, B, p) with own square-root code
        (Cipolla), checked labels[0] = 1, distinct classes, window W, and
        [l(Q)] g == Q for every base point (B points, or B+1 on planted control
        curves) with own scalar multiplication.
      result: 0 failures in 131 curves; max window W/p = 0.0066 (I10 second clause, no scan beyond p); member scan ratio W/B 1.72..2.59, mean 2.02.
      script: repro/ind_instances.py
    - id: M4
      quantity: m = 3 coverage of every counted base (member base, 200 matched random bases, planted bases)
      method: >-
        validator-owned counter (indlib.cov_prefix_scatter: all multisets
        i <= j <= k enumerated with k = the maximum index, a different
        enumeration order from the producer's tail slices), random bases
        regenerated from the spec's stream recipe (seed 7005, SeedSequence
        [seed, cell code, arm code, member index, k + 1]), labels taken from the
        record. Cross-checked by a second validator algorithm (FFT support of
        1_S * 1_S * 1_S over Z_N) on 615 bases, and by the producer's two
        second code paths (count.coverage_by_set, count.coverage_by_sort) plus
        count.count_coverage on 112 C16 bases. The counters were first
        self-tested against literal itertools enumeration on 126 small cases.
      result: >-
        C16 (smallest cell, p in (2^14, 2^18]): 28 items (20 measured members
        + 8 planted-control curves) x 201 bases = 5628 recounted, 0 mismatches
        with member_seen / random_seen. C20: 50 items x 201 = 10050, 0
        mismatches. C24: 53 items x 201 = 10653, 0 mismatches (all 200 random
        bases of every C24 member and control curve). Total 26331 of 26331
        bases in the run, 0 mismatches. FFT cross-check 588 (C16: member base
        plus random bases 1..20 of every item) + 13 (C20) + 14 (C24) = 615
        bases, 0 mismatches.
        Producer second paths on C16: 112 of 112 equal the recorded values.
      script: repro/ind_cov.py, repro/ind_cov24full.py, repro/ind_secondpaths.py, repro/ind_selftest.py
      logs: repro/logs/ind_cov_C16.out, ind_cov_C20.out, ind_cov_C24_full200.out, ind_cov_C24_member_plus3.out, ind_cov_C24_extra20.out, ind_secondpaths.out, ind_selftest.out
    - id: M5
      quantity: Exact yield identity M0 (enumerated sums == binomial(B+2,3), histogram total == binomial(B+2,3), histogram nonzero == seen[] count)
      method: >-
        base size B = smallest integer with B^3 >= 6N recomputed per curve; my
        enumeration count compared with comb(B+2,3) (comb(B+3,3) for planted
        bases) on every recounted base; recorded loop and histogram failure
        counters summed; 186 of the recorded full histograms (60 at C16, 126 at
        C20: member, random 1, random 2 of every measured member) recomputed by
        np.bincount and compared on (total, nonzero, collisions, max c).
      result: >-
        26331 of 26331 enumeration counts equal binomial; recorded
        loop_failures + hist_failures = 0 on 131 x 201 bases; 186 of 186
        histograms equal (total = binomial, nonzero = seen, collisions and max c
        equal). Brute-force counter cases: see C4.
      not_verified: >-
        The 135 recorded C24 full histograms were not recomputed by me (their
        integers satisfy total = binomial and nonzero = seen, and the producer's
        check.py re-executed ok); C24 identity rests on loop counters plus my
        enumeration counts for all C24 bases.
      note: >-
        M0 is an instrument self-consistency identity (it counts multisets);
        it cannot detect a wrong base, only a wrong enumerator.
    - id: M6
      quantity: T(arm, cell), 95 percent moving-block bootstrap interval, two-sided randomization p for the 9 arm-cells
      method: >-
        own implementation from the spec text (block bootstrap L = 3 for FAM
        and 1 otherwise, 5000 resamples, percentile 95; randomization 20000
        draws, p = (1 + #{|T*| >= |T_obs|}) / 20001), seeds 7006 / 7007 with
        SeedSequence [seed, cell, arm, 0, 0].
      result: >-
        All 9 rows equal the recorded values to 1e-12 (T, both interval ends, p,
        n). C24: FAM T = -0.02243 percent, interval [-0.0381, -0.0060], p
        0.03120; N-A -0.00040 [-0.0237, +0.0267] p 0.96905; N-B +0.01607
        [-0.0012, +0.0346] p 0.07945. C20: FAM -0.02960 [-0.0741, +0.0482] p
        0.44078; N-A -0.00851 [-0.0612, +0.0389] p 0.84301; N-B +0.01016
        [-0.0384, +0.0570] p 0.79526. C16 (n 4/8/8): -0.17419 / -0.08487 /
        -0.00941. The C24 randomization p-values move by less than 0.005 over 5
        alternative streams (FAM 0.0291..0.0321, N-A 0.9673..0.9702, N-B
        0.0754..0.0809) and the C24 interval ends by less than 0.001
        percentage points, so the numbers are not RNG artifacts.
      script: repro/ind_stats.py
    - id: M7
      quantity: Holm family and the mechanical decision rule
      result: >-
        With the powered set the code used ({C24}): raw p 0.03120 / 0.96905 /
        0.07945 give Holm-adjusted 0.0936 / 0.9691 / 0.1589 (equal to
        recorded); none <= 0.05; all three intervals inside +-0.5 percent;
        rules R0 (8 valid trials), R1 (I1..I9 and gates), R2 (a powered cell
        exists) do not fire; R3 matches: NULL_AT_RESOLUTION, no
        holm_rejection_below_delta, no lead tier, growth not assessable (1
        powered cell). Equal to the recorded classification. With the powered
        set the frozen text defines ({C20, C24}, see D1): six tests, Holm
        adjusted 0.1872 (FAM C24), 0.3972 (N-B C24), 1.0 for the other four; no
        rejection, all six intervals inside +-0.5 percent, R3 again:
        NULL_AT_RESOLUTION.
      script: repro/ind_stats.py
    - id: M8
      quantity: Contrasts (99 percent) and scan-efficiency branch
      result: >-
        Recorded C24 contrasts FAM-N-A, FAM-N-A(theta), N-A-N-B equal my
        recomputation under the producer's stream order; all three intervals
        include 0. Under the literal spec stream order [seed, cell, arm,
        stream, 0] (see D4) the intervals differ by <= 0.003 percentage points
        and still include 0; the C20 contrasts (not in the recorded output)
        include 0 too. Pools FAM/N-A: |R - 2| <= 0.0047 < max(0.02, 3 se) in all
        6; all N-B pools inside [1.98, 2.02]; branch none, as recorded.
      script: repro/ind_stats.py, repro/ind_controls.py
    - id: M9
      quantity: From-scratch rebuild of all eight trials
      method: >-
        driver.py run for t1..t8 with the plan's argv into a scratch directory
        outside the repository (same host, python 3.13.16, numpy 2.5.3, HEAD
        c6a2f13fdb, tree clean), t8 reading the scratch t1..t7; compared with
        the recorded raw-result.json and manifests.
      result: >-
        0 differences in every raw-result.json outside timings and
        peak_rss_bytes (8 of 8); manifests agree on seeds, ids, source_sha256
        and result summaries; t8 classification NULL_AT_RESOLUTION again.
        Measured seconds per triple differ (13.3..14.9 ns recorded, 14.3..19.8
        ns in the rebuild under CPU contention from my own concurrent jobs), as
        expected for timings.
      limitation: >-
        Same code, same host: shows determinism and absence of hidden state,
        not correctness (M4 and the controls supply that).
      script: repro/rerun.sh, repro/cmp_rerun.py
    - id: M10
      quantity: Re-execution of the producer's checker
      result: >-
        check.py exits 0 and prints "check: ok" on all 8 run directories
        (read-only; PYTHONDONTWRITEBYTECODE=1).
      limitation: >-
        check.py shares the MDE constant of D1 (it re-implements the same
        sqrt(3) * 1.0025 factor at check.py lines 560-561) and does not
        evaluate I10, so it could not catch D1 or D2.

  control_checks:
    - id: C1
      control: qr_window positive control (residuosity of f(x), not Legendre of x)
      frozen_requirement: R_pool in [1.98, 2.02] on every N-B pool (spec controls, I6)
      result: pass
      evidence: >-
        All 107 per-curve scans (S = min(131072, floor(p/2))) recomputed with
        my own vectorised Euler criterion: L, V, V_lift, zero equal the recorded
        values for 107 of 107 curves; every lifted y recorded as verified.
        Pools (R_pool, se): N-B C16 1.99403 (0.00395), C20 2.00085 (0.00138),
        C24 1.99800 (0.00138): inside the band; FAM 1.99707 / 2.00043 /
        2.00060 and N-A 1.99526 / 1.99916 / 1.99949 with |R - 2| <= 1.3 se. The
        statistic is the identity R = 2 / (1 + chi-sum / S), so the control
        verifies the instrument's density measurement and that the lab-note
        Legendre(x) definition does not give a gain; it cannot detect a
        structure of the base.
      script: repro/ind_controls.py
    - id: C2
      control: Legendre(x) negative control
      frozen_requirement: R_wrong in [0.96, 1.04] on every N-B pool
      result: pass (N-B 0.99968 / 0.99989 / 0.99943; all 9 pools 0.9970 to 1.0006, recomputed equal)
    - id: C3
      control: Full-period point-count identity
      result: >-
        pass; 15 curves (2 per arm per cell with p <= 2^20, 1 per arm above) by
        my own Euler scan of all of F_p (a different method from the producer's
        table of squares): #{x : f(x) nonzero square} = (N-1)/2, no root of f,
        sum chi(f) = N - p - 1 = -trace, 15 of 15 (largest p = 32,766,353).
    - id: C4
      control: Brute-force counter check, 60 cases
      result: >-
        pass; the 60 recorded cases are exactly the frozen grid N in {211, 307,
        401, 503, 1009} x B in {5, 8, 13, 20} x {random classes, {1..B}, random
        coset}; for each, my literal itertools enumeration gives the same full
        c(r) vector, coverage and total as my bincount histogram, my counter and
        the record (0 failures); kinds verified structurally.
    - id: C5
      control: Curve/twist validity and labelling (I4, I5)
      result: pass, see M2 and M3 (131 curves; the t2 labelling check on 36 members and the 64-triple checks are recorded ok, and [l]g = Q holds for all base points of all 131 curves by my code)
    - id: C6
      control: Parallel determinism (verify_determinism, 4 workers vs serial)
      result: pass as recorded (6 items, K 20); independently supported by M9 (8 of 8 trials reproduce bit-identically).
    - id: C7
      control: Planted-relation sensitivity gate (I7)
      frozen_requirement: >-
        per cell at least 7 of 8 curves with rank p = (1 + k)/201 <= 0.01 (k
        counts random bases with coverage >= planted), pooled planted ratio
        within max(0.10 percent, 3 se) of the Poisson-law known value, pooled
        two-sided randomization p <= 0.001
      result: pass in all three cells, recomputed from the raw coverages
      evidence:
        C16: "detected 7/8 (k = 0 6 1 0 0 0 0 0; the detected curve with k = 1 has rank p 0.00995, and the miss has k = 6); pooled ratio 1.02667 vs known 1.03035, diff 0.368 percent, tolerance 0.842; p 5.0e-5"
        C20: "detected 8/8 (k = 0 on all); pooled 1.01091 vs known 1.01247, diff 0.156 percent against tolerance 0.173 (margin 0.017 percentage points); p 5.0e-5"
        C24: "detected 8/8; pooled 1.00525 vs known 1.00521, diff 0.005 percent, tolerance 0.100; p 5.0e-5"
      notes:
        - >-
          Margins are thin at C16 (exactly the minimum 7 of 8, one detected
          curve at the k <= 1 boundary) and at C20 (0.156 against 0.173 percent).
          The frozen spec's pre_freeze_disclosure states in advance that these
          numbers were seen in a pre-freeze smoke test on the same seeds, that
          the official t3 is deterministic and would reproduce them, and that
          its pass is therefore "not independent evidence of sensitivity beyond
          what was already seen". Confirmed: the official numbers equal the
          disclosed ones. The gate thresholds were not changed (spec text).
        - >-
          Observed planted excess falls with B as the Poisson law predicts
          (+2.67 percent at B about 50, +1.09 at B about 135, +0.525 at B about
          330, against known +3.04, +1.25, +0.52): the signal decays with the
          parameter that should destroy it, as a real planted effect must. At
          C16 and C20 the observed pooled excess sits 0.37 and 0.16 percentage
          points below the Poisson-law value (consistent with the exact
          coverage lying below 1 - exp(-mu) at small N); it is inside the
          frozen tolerance.
    - id: C8
      control: Null objects and matched nulls
      result: >-
        pass as designed: the member base is compared with its own 200 matched
        random bases (the exact random model of B distinct classes with signs;
        random_distinct_failures = 0 on all 131 items, and my regenerated bases
        reproduce the recorded coverages exactly, M4) and with two independent
        arm populations (N-A crater-type non-family, N-B random curves). The
        null spread shrinks as 1/sqrt(N): measured relative sd times sqrt(N) is
