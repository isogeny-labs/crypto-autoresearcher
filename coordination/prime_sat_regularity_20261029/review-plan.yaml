review_plan:
  claim_under_review: A precise generating-system degree-of-regularity theorem for the two-summand prime-field
    S3 Boolean encoding, plus an algebra-only tensor lemma and an explicit nonzero-predicate construction
    boundary.
  coordinator_prior: Plausible but unverified derivation; exact threshold, affine ideal equivalence and
    applicability remain open until independent review. No scientific status or persistent-goal completion
    is authorized.
  joints:
  - joint: definition_and_generators
    assigned_to: TASK-20261029-160be6
    attack_plan: Reconstruct the polynomial ring, explicit generator lists and highest-part ideal. Check
      that the claimed invariant is Definition1.4, and separate it from the associated graded ideal, solving
      degree and last fall degree.
  - joint: block_lefschetz_and_characteristic
    assigned_to: TASK-20261029-160be6
    attack_plan: Derive weighted SLP using a diagonal automorphism and Theorem2.7. Attack zero weights,
      characteristic<=s, and erroneous application of a single ms-variable bound.
  - joint: tensor_exact_threshold
    assigned_to: TASK-20261029-160be6
    attack_plan: Derive graded component ranks and the first total degree of complete vanishing. Exhibit
      an explicit nonzero preceding-degree component; check all floor/ceiling parities and e=1,e=s boundaries.
  - joint: membership_top_degree_kill
    assigned_to: TASK-20261029-160be6
    attack_plan: For any nonzero homogeneous squarefree block form, show or refute that complement multiplication
      generates the full block-top monomial; handle zero and constant1 predicates separately. Derive the
      m-block upper bound without assuming exact augmented equality.
  - joint: s3_top_and_affine_equivalence
    assigned_to: TASK-20261029-160be6
    attack_plan: Recompute the quartic highest part and any Boolean multilinear reduction. Reprove the
      rational two-summand lift including equal abscissas and target-coordinate exceptions. Prove equal
      Boolean solution sets and ideals; reject an unproved m>2 extension.
  - joint: nonzero_membership_window_bridge
    assigned_to: TASK-20261029-160be6
    attack_plan: Prove the nonresidue density and existence argument from point counting for odd-prime-order
      E/F_p; include the Hasse estimate, expected sampling versus deterministic scan cost, digit-window
      injectivity and all-invalid constant1 case. Never silently replace a fixed base.
  - joint: cost_and_claim_boundary
    assigned_to: TASK-20261029-160be6
    attack_plan: Account for membership construction and storage, and distinguish this generator-dependent
      invariant reduction from algorithmic complexity. No scalar recovery, solver speedup, higher-summand
      transfer, formal proof, or broad goal completion follows.
  blindness:
    lifted_for:
    - Comparison phase only, after an independently written and hash-recorded blind rederivation.
    rationale: The reviewer first derives the threshold and predicate consequence independently; later
      access is necessary to identify precise gaps in the producer proof.
    initial_allowed:
    - coordination/prime_sat_regularity_20261029/blind-review-brief.md
    - coordination/prime_sat_regularity_20261029/source-notes.md
    initial_forbidden:
    - research/prime_sat_regularity_20261029/proof.md
    - research/prime_sat_regularity_20261029/proof-status.json
    - research/prime_sat_regularity_20261029/diagram.svg
    - research/prime_sat_regularity_20261029/report.typ
    - research/prime_sat_regularity_20261029/report.pdf
    - coordination/prime_sat_regularity_20261029/records/ledger/handoffs/TASK-20261029-5a92e3.yaml
    - Parent and producer conversation
  proves_too_much:
    objects:
    - 'Characteristic2, s=2: the square of z1+z2 vanishes, so the characteristic-free Lefschetz claim
      must fail.'
    - 'A zero linear-form weight: diagonal rescaling and the claimed full rank cannot be assumed.'
    - 'e=0: product generator1 kills the ring; the positive-e formula is inapplicable. e>s: each relevant
      block power can vanish.'
    - 'An identically zero membership polynomial: no strict reduction is warranted. Constant1 predicate:
      the system is trivial UNSAT and must be labeled separately.'
    - 'A rational target with t=0, singular curve or characteristic2/3: the two-summand lift proof cannot
      divide by2t or inherit the stated hypotheses.'
    - 'More than two summands over an extension: rational abscissas may permit nonrational ordinate cancellation;
      do not infer individual rational membership.'
    - 'A fixed existing digit window with zero membership predicate: new-window selection does not solve
      this unchanged fixed problem.'
    failure_signature: The proof must reject each violated hypothesis or explicitly handle its exceptional
      conclusion. If it proves the same nontrivial bound/equivalence unchanged on a known-false object,
      mark the corresponding joint breaks.
  blind_rederivation:
    required: true
    quantity: Exact baseline Hilbert vanishing threshold and an upper bound with nonzero block predicates,
      then the m=2 S3 affine equivalence and applicability conditions.
    assigned_to: TASK-20261029-160be6
    blind_from:
    - research/prime_sat_regularity_20261029/proof.md
    - research/prime_sat_regularity_20261029/proof-status.json
    - research/prime_sat_regularity_20261029/diagram.svg
    - research/prime_sat_regularity_20261029/report.typ
    - research/prime_sat_regularity_20261029/report.pdf
    - coordination/prime_sat_regularity_20261029/records/ledger/handoffs/TASK-20261029-5a92e3.yaml
    - Producer/parent conversation
  review_output:
    path: research/prime_sat_regularity_20261029/review.md
    verdicts:
    - holds
    - breaks
    - inconclusive
    required:
    - Per-joint verdict and derivation/counterexample
    - Immutable proof and source identities
    - Blind derivation hash and reveal point
    - Producer independence attestation
    - Known-false controls addressed
    - Unresolved assumptions and cost/goal boundaries
    proof_assistant_verified: false
  budget:
    maximum_runs: 0
    scientific_runs: 0
  promotion: No hypothesis promotion or persistent-goal completion in this review task.
