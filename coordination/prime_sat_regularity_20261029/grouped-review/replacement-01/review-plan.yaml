review_plan:
  recorded_at: '2026-10-29T18:33:27.520811+00:00'
  claim_under_review: Independent blind derivation of grouped-indicator model equivalence, generating-system regularity
    bounds and any justified solving-degree corollary.
  coordinator_prior: The local representation appears sound and may lower a generator-dependent degree bound,
    but every count, equivalence, baseline comparison and transfer remains unreviewed. No runtime advantage, novelty
    or general ECDLP result is presumed.
  joints:
  - joint: local_models
    assigned_to: TASK-20261029-f78b3b
    attack_plan: Derive all solutions of the local indicator equations over the stated field. Check the zero word,
      pairwise exclusions, arbitrary characteristic and empty/partial groups.
  - joint: bijection_and_ideals
    assigned_to: TASK-20261029-f78b3b
    attack_plan: Construct the bit projection and assignment-indicator inverse. Prove both compositions on solutions
      and explain quotient-ring isomorphism; never assert equal ideals across different ambient rings.
  - joint: representation_counts
    assigned_to: TASK-20261029-f78b3b
    attack_plan: Derive exact variable/equation counts for arbitrary actual group widths and the two-bit specialization.
      Audit digit0 and shortened final groups; distinguish expanded polynomial representation from its circuit.
  - joint: hilbert_series
    assigned_to: TASK-20261029-f78b3b
    attack_plan: Compute the Hilbert series of the ideal of highest parts of local constraints alone. Prove a
      normal-monomial basis and its total dimension; show what changes on adjoining substituted constraints.
  - joint: regularity_bound
    assigned_to: TASK-20261029-f78b3b
    attack_plan: From the normal monomials derive the exact threshold for local constraints and a valid upper
      bound for the full explicit generating system. Independently determine whether the full bound is sharp by
      proving nonvanishing or exhibiting a counterexample. Distinguish raw substituted S3 from a version reduced
      using local indicator relations; equal affine ideals do not guarantee equal generating-system regularity.
      Test absence of pairwise products.
  - joint: baseline_comparison
    assigned_to: TASK-20261029-f78b3b
    attack_plan: Independently derive the original bit-encoded fixed-target S3 baseline under its characteristic
      and nonzero-weight hypotheses, or explicitly leave strict comparison unresolved. Distinguish unchanged affine
      solution problem from changed parameterization and variable count.
  - joint: solving_degree_transfer
    assigned_to: TASK-20261029-f78b3b
    attack_plan: Read Salizzoni Definition2.5 and Proposition3.10 in full. Derive only the applicable degree-compatible
      mutant-closure solving-degree upper bound, checking maximum input degree and every small-width boundary.
      No strict comparison of actual solving degrees follows from two upper bounds.
  - joint: cost_and_scope
    assigned_to: TASK-20261029-f78b3b
    attack_plan: Account for local constraints, projection/reconstruction, group-width dependence, expanded quartic
      term growth and matrix widths. Reject uncharged exponential-width choices, circuit-auxiliary transfer and
      runtime/ECDLP conclusions.
  blindness:
    mutual: true
    lifted_for: []
    rationale: One fresh reviewer remains blind throughout; Coordinator later compares independently written mathematics
      with the sealed producer package.
  proves_too_much:
    objects:
    - 'Omit pairwise products within a group: multi-indicator solutions and surviving same-group monomials must
      invalidate the corresponding equivalence/threshold argument.'
    - 'Require at least one nonzero indicator with no digit0 variable: the original zero word is lost.'
    - 'Add arbitrary auxiliary circuit variables without their own graded proof: the original highest-part bound
      does not automatically transfer.'
    - 'Use characteristic at most s or a zero original bit weight: the claimed original-bit Lefschetz baseline
      requires renewed justification even when the indicator bound remains valid.'
    - 'Add a constant1 equation: the full system is UNSAT and a local-ring upper bound is not an exact full-system
      value.'
    - 'Allow group width to grow with s: representation size cannot be called uniformly linear.'
    - 'Read a mutant-closure solving-degree upper bound as a theorem for every plain Macaulay truncation or as
      a strict actual runtime advantage: this conclusion must be rejected.'
    failure_signature: Identify the violated hypothesis or changed conclusion explicitly. An argument giving unchanged
      equivalence, exact threshold or performance conclusions on these objects fails its corresponding joint.
  blind_rederivation:
    required: true
    assigned_to: TASK-20261029-f78b3b
    quantity: Model bijection and quotient-ring statement, exact representation counts, local Hilbert series/threshold,
      full-system regularity upper bound, original baseline when justified, and applicable solving-degree upper
