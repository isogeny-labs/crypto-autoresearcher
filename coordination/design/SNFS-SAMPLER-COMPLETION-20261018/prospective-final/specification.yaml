  execution_authorized: true
  designed_at: '2026-10-18'
  objective: Collect the complete finite support classifications and uncapped fixed-input
    search traces, preserving all ordinary outcomes, classifications, failures and
    censoring without scientific verdicts.
  lineage:
  - EXP-ECDLP-4c6a09
  - RUN-ECDLP-e89532
  - H-ECDLP-4da36f
  inputs:
    catalog_degrees:
    - 3
    - 7
    - 8
    - 12
    catalog_patterns: 3232
    fixed_inputs: 7
    fresh_search_seeds_per_input: 12
    fresh_search_jobs: 84
    legacy_seed_controls: 11
    same_seed_replays: 7
    search_jobs: 102
    work_ladder:
    - 300
    - 1000
    - 3000
    - 10000
    - 30000
    - 100000
    denominators:
    - 1
    - 2
    - 3
    - 4
    auxiliary_primes: Exact fixed archived lists in panel.json; do not select new
      primes from the outputs.
    input_selection: All four archived inputs with seed-1/3 overlap plus lexicographically
      first archived seed-1 random_g input for each degree 7,8,12. Selection uses
      input identity, not measured outputs.
    seed_record: Every job carries its exact input ID, search seed string, seed role
      and replay link in panel.json. Distinct labels are not a proof of statistical
      independence of measured outputs.
    trace_policy: Retain every emitted unique-point, checkpoint and shell event without
      an 8-point cap. Distinguish before_candidate checkpoint from after_search_end
      final snapshot.
  controls:
  - Exact rational factorization and proof-enabled primality are recorded separately
    from the original modular irreducibility screen; unresolved screening is not relabeled
    Q-reducible.
  - Eleven exact legacy-seed controls retain the fixed archived input identities;
    changes in instrumentation are explicitly recorded.
  - Seven same-input/same-search-seed replays require identical discrete event/content
    fields; timing is retained separately.
  - Every observed point/residue and support record is checked under the separate
    checker; discrepancies preserve original output as invalid/censored rather than
    silently replacing it.
  metrics:
    primary:
    - catalog rows and exact QQ factorization classes by degree
    - source-screen classifications and unresolved cases by degree
    - per-input/job attempted work, distinct points, distinct residues and missing
      reductions at each checkpoint and final snapshot
    - full uncapped point/checkpoint/shell event streams
    - seed-role and same-seed replay field comparisons
    secondary:
    - literal per-trial elapsed time and environment
    - raw artifact lengths and SHA-256
    - failure/censoring records and incomplete cells
  preregistered_prediction: null
  prediction_note: Descriptive study; no desired distribution, attack advantage, anomaly
    or usefulness outcome is asserted.
  budget:
    enforcement: advisory
    maximum_runs: 2
    maximum_memory_gb: 4
  stopping_rules:
  - Finish exactly the 3232 prescribed coefficient patterns.
  - Finish exactly the 102 fixed manifest jobs and six work thresholds; do not add
    inputs/seeds or stop selectively from outputs.
  - No cap on retained point/checkpoint/shell traces. A process/resource failure is
    retained as operational censoring, not a scientific outcome.
  invalidation_rules:
  - Missing or duplicated expected input/job IDs, mismatched source/input hashes,
    changed fixed parameters, incomplete archive contents or checker mismatch invalidates
    measurement integrity.
  - A crash, memory failure or external interruption is an operational failure; preserve
    every available artifact and identify unfinished units.
  success_criterion: 'Technical completion only: both fixed trial workloads finish,
    every declared raw artifact is retained, and all identity/schema/integrity checks
    pass. All resulting classifications/counts remain observations.'
  falsification_criterion: Technical completion is not established when fixed units
    are missing, provenance differs, output is incomplete or the independent integrity
    checker fails; this does not decide a scientific hypothesis.
  decision_impact:
    on_positive: Archive and present complete observations using the observation sidecar,
      exact denominators and stated limitations. Interpretation remains with the owner.
    on_negative: Archive partial/failed/censored observations and the exact integrity
      defect; prepare a new correction or retry contract where required, without selecting
      favorable outcomes.
