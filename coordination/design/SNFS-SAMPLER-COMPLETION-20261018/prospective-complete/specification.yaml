  pending_inputs: []
  assigned_to: executor
  approval_basis: Standing authorization; prospective exact bytes only. This preview
    does not itself approve execution.
  scope_note: Fresh instrument and immutable run identities; no alteration of frozen
    G3 protocol, original run or official hypothesis conclusions.
  variable_ledger:
    independent:
    - name: support_degree
      levels:
      - 3
      - 7
      - 8
      - 12
    - name: support_coefficients
      levels: All 3232 fixed coefficient patterns in coefficients.json
    - name: input_identity
      levels: Seven exact archived inputs in panel.json; no matched between-input
        causal comparison
    - name: search_seed
      levels: Exact manifest seed strings and roles
    - name: work_rung
      levels:
      - 300
      - 1000
      - 3000
      - 10000
      - 30000
      - 100000
    factors:
    - name: support_selection
      treatment: fixed
      how: Complete frozen coefficients.json support; no outcome-dependent filtering.
    - name: input_selection
      treatment: fixed
      how: Four archived overlapping seed inputs plus lexicographic seed1 random_g
        input for each larger degree; no output-based selection.
    - name: denominators
      treatment: fixed
      how: Exactly [1,2,3,4] in every panel job.
    - name: auxiliary_primes
      treatment: fixed
      how: Exact archived list retained per input; between-input lists may differ
        and are recorded.
    - name: source_runtime
      treatment: fixed
      how: Exact plan source/input hashes and runtime-bindings.json; wrapper and checker
        enforce external hashes.
    - name: checkpoint_phase
      treatment: fixed
      how: Emit literal before_candidate and after_search_end phases; never equate
        them.
    - name: instrumentation
      treatment: fixed
      how: Complete uncapped emitted traces; legacy comparisons explicitly retain
        instrumentation differences.
    - name: replay_execution
      treatment: measured
      how: Same exact input/search-seed work rerun at a separate execution position;
        literal timing/order recorded, discrete content compared separately.
    - name: censoring
      treatment: fixed
      how: Finite workload and 4096MiB protection; retain every partial artifact and
        failure, no result-dependent stop.
    - name: host_load
      treatment: measured
      how: Literal environment/timing recorded per trial; host/load not controlled
        and no causal timing comparison asserted.
    comparisons:
    - id: C-support-census
      design: absolute
      arms:
      - complete finite support
      differs_in: []
      reference: Exactly 3232 fixed pattern IDs; no statistical sampling uncertainty
        for census classifications.
    - id: C-fixed-input-seeds
      design: one_factor
      arms:
      - fresh seed jobs grouped within each exact input
      differs_in:
      - search_seed
      note: Descriptive conditional distribution only; no independence proof or advantage
        criterion.
    - id: C-aa-replay
      design: aa
      arms:
      - original fresh job
      - exact same-input same-seed replay
      differs_in:
      - replay_execution
      note: Discrete content identity check; timing spread is descriptive and confounded
        by host load.
    - id: C-legacy-instrument
      design: confounded
      arms:
      - archived legacy observations
      - new legacy-seed controls
      differs_in:
      - instrumentation
      reason: Historical cap and instrumentation differ; legacy comparison is descriptive
        and cannot carry scientific or timing criteria.
    crosses_map: false
    map_note: No ECDLP transfer claim. Residue computations are arithmetic observations
      checked directly, not a security reduction.
  prediction_provenance:
  - prediction: NONE-descriptive
    first_recorded_in: coordination/design/SNFS-SAMPLER-COMPLETION-20261018/prospective-complete/specification.yaml
