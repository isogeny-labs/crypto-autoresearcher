    - path: research/snfs_sampler_variation_20261018/data/within-input-groups.json
      measured: Archived fixed-input overlap groups used for deterministic input selection.
    sample_status: partially_in_sample
    overlap: All input identities are archived; legacy seed controls overlap historical
      inputs/seeds. Fresh-seed jobs and exact same-seed replay pairs are new. No numerical
      scientific prediction or hypothesis criterion is asserted.
