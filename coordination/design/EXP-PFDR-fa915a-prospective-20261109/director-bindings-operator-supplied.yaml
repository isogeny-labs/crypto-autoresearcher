schema_version: '2.0'
notes: PFDR native experiment-director compile attempt only; operator-supplied and
  unprobed. No API inference or external backend use.
bindings:
  openai-gpt6:
    director-runbook:
      model: gpt-6-sol
      provenance: operator-supplied
      last_probed: null
      capabilities:
        max_reasoning_effort: max
        tool_use: true
        structured_output: true
        context_tokens: 180000
        max_output_tokens: 32000
      request:
        max_tokens: 32000
        reasoning:
          mode: openai_effort
          effort_map:
            high: high
            xhigh: xhigh
            max: max
