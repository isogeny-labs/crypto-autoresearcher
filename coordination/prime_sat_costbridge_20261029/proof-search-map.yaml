proof_search_map:
  bottleneck: Whether a generator-dependent degree drop supplies a useful solver-cost test once the best exact
    two-summand search baseline and representation costs are present.
  baseline_reproduction: Construct complementary-point enumeration on exactly the same finite affine coordinate
    domains and target as the S3 instance; prove full ordered projected-set equality, including x=r, coincident
    points, zero ordinates and Q=infinity exclusions.
  observable_identifiability: Local Hilbert-series prefixes and ambient monomial capacities do not identify actual
    elimination work. Same local domain can support constant-one, zero, or varying added equations with different
    solving behavior; no runtime inference is identified by the counts alone.
  quantifier_order: For every prime p>3, nonsingular public curve, finite rational R with nonzero ordinate and
    supplied finite distinct domains, the deterministic all-mode method exhausts exactly the ordered domain solutions.
    Cost depends explicitly on each domain representation and supplied/constructed square-root setup. Even-s monomial
    comparison additionally requires the accepted p>s and nonzero weights; no randomized target selection or witness-dependent
    domain.
  method_ceiling: At most exact combinatorial capacity comparisons, correctness/completeness, and an explicit
    upper-cost expression; no lower bound on solver work, unknown-scalar recovery or general ECDLP advantage.
  nearby_object_controls:
  - Constant-one versus absent added equations share local domain but have different solving burden.
  - Wrongly charge all-model output against first-witness cost.
  - Drop x=r linear branch, zero square root or one sign.
  - Claim expected constant nonsquare search for a deterministic scan.
  - Use duplicate coordinate labels or noninjective bit maps without output multiplicity charges.
  - Treat two upper solving-degree bounds as an ordering of actual solving degrees.
  construction_transform: Representation/reduction chain with separate encoding, rational completeness, witness
    reconstruction, certificate completeness, setup/query/output and cost-loss obligations.
  literature_and_prior_proof_inputs:
  - research/prime_sat_regularity_20261029/proof.md
  - research/prime_sat_regularity_20261029/grouped-proof.md
  - ledger/decisions/DEC-20261029-ce5c57.yaml
  - ledger/decisions/DEC-20261029-0857a9.yaml
  - coordination/prime_sat_costbridge_20261029/source-review.md
  scientific_runs: 0
