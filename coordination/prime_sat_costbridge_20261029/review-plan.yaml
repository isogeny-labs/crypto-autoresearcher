review_plan:
  recorded_at: '2026-10-29T19:24:53.522912+00:00'
  claim_under_review: Exact cost-bridge quantities and certified complementary-point reference for future grouped-versus-bit
    comparisons.
  coordinator_prior: A lower generator degree alone may not improve usable basis inventory; the complementary-point
    baseline is likely a necessary stronger reference. Exact accounting and exceptions may overturn a proposed
    transfer. No solver advantage is presumed.
  joints:
  - joint: normal_prefix_counts
    assigned_to: TASK-20261029-58d7a7
    attack_plan: Derive coefficient sums and exact small-s boundaries at regularity, one below and mutant caps.
      Check strict versus weak comparisons and saturation without trusting producer prose.
  - joint: ambient_and_actual_work
    assigned_to: TASK-20261029-58d7a7
    attack_plan: Derive ambient monomial capacities separately and refute treating either inventory as necessary
      actual rows/columns/work. Test constant-one and absent extra equations sharing the same local domain.
  - joint: rational_completeness
    assigned_to: TASK-20261029-58d7a7
    attack_plan: Derive the S3 quadratic and discriminant from the supplied equation/target identity; handle x=r
      linear branch, zero radicand, both signs and Q=infinity. Algebraic-closure equivalence alone is insufficient.
  - joint: complementary_reference
    assigned_to: TASK-20261029-58d7a7
    attack_plan: Prove one-domain lift enumeration plus Q=R-P is sound and complete for ordered domain solutions;
      inspect code for hidden y-field scans, pair loops or exceptional omissions.
  - joint: certificate_checker
    assigned_to: TASK-20261029-58d7a7
    attack_plan: Independently derive complete second roots from lift-status certificates; audit exact D1 coverage,
      Euler/root checks, D2 membership and separate witness group verification. Check missing/duplicate/exceptional
      mutations. If the shared-nonsquare option is implemented, prove its implication, check global Euler certification
      and nonzero per-row witness, and reject corrupted Z/w without hiding extra certificate-generation roots.
  - joint: cost_and_setup
    assigned_to: TASK-20261029-58d7a7
    attack_plan: Account for square roots, nonsquare search, membership setup, representation, inversion/group
      work, arithmetic bits, output and verification. Refute expected-constant deterministic nonsquare search.
  - joint: mode_and_software_scope
    assigned_to: TASK-20261029-58d7a7
    attack_plan: Distinguish first-witness validation from complete all-mode enumeration, inspect fixed integrity
      tests and reject false completeness. Do not convert software fixtures into comparative scientific evidence.
  - joint: decision_boundary
    assigned_to: TASK-20261029-58d7a7
    attack_plan: State exactly what changes a future solver test; retain scalar-extraction/general ECDLP gaps,
      no closure, no actual performance inference and no inherited validity of arbitrary auxiliary encodings.
  blindness:
    mutual: true
    lifted_for: []
    rationale: One fresh reviewer independently derives counts/completeness/costs and audits allowed implementation
      source, without new producer conclusions or test results; Coordinator later compares sealed derivations.
  proves_too_much:
    objects:
    - Constant-one versus absent added equations share local domain but have different solving burden.
    - Wrongly charge all-model output against first-witness cost.
    - Drop x=r linear branch, zero square root or one sign.
    - Claim expected constant nonsquare search for a deterministic scan.
    - Use duplicate coordinate labels or noninjective bit maps without output multiplicity charges.
    - Treat two upper solving-degree bounds as an ordering of actual solving degrees.
    - Remove an x=r root or one D1 lift record but still claim complete enumeration.
    - Use a composite modulus or target t=0 under the original theorem premises.
    failure_signature: Identify the lost premise or invalid claimed conclusion; the proposed bridge must not certify
      these overextensions.
  blind_rederivation:
    required: true
    assigned_to: TASK-20261029-58d7a7
    quantity: Local/ambient inventory comparisons, rational S3 completeness, complementary-point resource expression
      and output-mode distinction. These derivations must be sealed before the first read of any newly produced
      implementation/test source; source correctness is audited afterward.
    blind_from:
