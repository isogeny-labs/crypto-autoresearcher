      sources. Independently derive all mathematical quantities and cost expressions before reading any new implementation
      or test-source file.
    seal_before_code:
      artifact: research/prime_sat_costbridge_20261029/TASK-20261029-58d7a7/precode-derivation.md
      requirements:
      - Write the complete derivation or exact unresolved obstructions, then leave that file unchanged.
      - Obtain an actually observed clock value at sealing and compute the exact SHA256 of the just-written file.
      - Record actual phase-one reads as literal strings; do not hash or inspect producer implementation files
        before this seal.
    phase_2: Only after the pre-code seal, inspect the three explicitly permitted code/test sources. Record their
      actual read order and hashes, audit against the sealed derivation, and write the final review and attestation.
      No scientific or software runs.
    post_code_changes: Do not rewrite precode-derivation.md. Label any new or corrected mathematical reasoning
      learned after code access as post-code; do not describe it as part of the blind derivation.
