  coordinator_prior: 'Recorded before the round, without numbers. I expect the round to find that (a)
    the oracles that reveal coordinates of instance points (jet as field data, x-valued variants) are
    not Shoup-GGM-simulable, so no exponent-1/2 closure follows for them from Shoup''s bound; (b) label-valued
