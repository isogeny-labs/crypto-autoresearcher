      statement: 'A k-dependent field-valued answer to a fixed label-expressible query is not simulable with o(sqrt N_prime) calls; if O(1) answers fix log Q up to poly(log N) candidates, overhead is Theta(sqrt N_prime).'
    - id: prop_A
