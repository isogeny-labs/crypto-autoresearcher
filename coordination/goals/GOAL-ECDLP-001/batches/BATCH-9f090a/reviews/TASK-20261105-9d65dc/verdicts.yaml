      statement: 'Unit-cost fixed-arity-m incidence SEARCH solves DLP with O(m N^{1/(m+1)}) group ops + calls (m=1 is BSGS); lower bound Omega(N_prime^{1/(2 ceil(m/2)+2)}).'
    - id: prop_B
      tag: proved_here
      statement: 'Subset-form incidence SEARCH ("which subsets sum to Q") with FB {[2^i]G} returns bits of k in one call; not simulable with o(sqrt N_prime) overhead.'

