blind_statement:
  id: BS-BATCH-7c689b-J5
  task_id: TASK-20261103-7fc24f
  written_at: '2026-11-03T22:30:00Z'
  purpose: Parameters for a blind re-derivation. Contains inputs only; no output of any producer program.
  definitions:
    S3: S3(x1,x2,x3) = (x1-x2)^2*x3^2 - 2*((x1+x2)*(x1*x2+a) + 2*b)*x3 + ((x1*x2-a)^2 - 4*b*(x1+x2)), for y^2 = x^3 + a*x + b (Semaev's third summation polynomial).
    S4_exact: S4(x1,x2,x3,x4) = Res_t( S3(x1,x2,t), S3(x3,x4,t) ), computed over Z[a,b] with a, b substituted as integers, then expanded.
    S4_legacy: Same resultant, but the right-hand factor is S3 with the substitutions x1 -> x3, then x2 -> x4, then x3 -> t applied one after another (sequentially, not simultaneously), so the x3 introduced
      by the first substitution is replaced by t in the third.
    s4_support: Number of nonzero terms of the expanded S4 as a polynomial in x1, x2, x3, x4 over F_p (coefficients reduced mod p).
    fib_system: Ideal in F_p[x1,x2,x3] generated by S4(x1,x2,x3,Rx) (S4 with x4 := Rx) and f_V(x_i) = prod_{v in V} (x_i - v) for i = 1, 2, 3.
    fib_quantities: 'Reduced Groebner basis of that ideal for grevlex with x1 > x2 > x3 over F_p: its number of elements (groebner_basis_size) and the maximum total degree of its elements (groebner_basis_max_degree);
      and whether the ideal is the unit ideal.'
  icinv:
    p: 4001
    note: Each curve has a gauge twin (u^4 a, u^6 b) mod p; both are records. 2 sets x 138 curves x 2 = 552 records.
