review_plan:
  schema: crypto.autoresearch.custody_review_plan.v1
  goal_id: GOAL-RELN-001
  batch_id: BATCH-0834cb
  frozen_before_review: true
  claim_under_review: 'Only prospective successor custody: exact preservation and native archive of19
    historical inputs. No mathematical, empirical, historical execution-admission or approval claim.'
  coordinator_prior: Custody may be representable at fresh C2, but original C is not natively archived
    on main and missing alias is unresolved. Treat this as a hypothesis to attack, not an acceptance finding.
  source_bindings: coordination/goals/GOAL-RELN-001/batches/BATCH-0834cb/source-bindings.json
  reviewer_task_id: TASK-20261028-43b2e0
  role_contract: agents/validator.md
  blindness:
    lifted_for:
    - TASK-20261028-43b2e0
    rationale: Source-aware administrative custody audit requires receipts, claims and producer mapping.
      Independent fresh session and direct Git-object checks remain mandatory; no blind scientific rederivation
      is claimed.
  blind_rederivation:
    required: false
    rationale: No mathematical quantity or scientific result is being reviewed; historical programs are
      never executed. Independently recompute byte hashes and native archive predicates.
  joints:
  - joint: J1-exact-source-identity
    assigned_to: TASK-20261028-43b2e0
    attack_plan: Read19 Git blobs directly; recompute SHA256/OID/sizes and compare C2 destinations, both
      receipt versions separately. Reject changed, omitted or duplicate-mapped bytes.
  - joint: J2-claim-release-and-alias
    assigned_to: TASK-20261028-43b2e0
    attack_plan: Inspect eight claims/releases and source lane. Verify producer epoch1 refusal/epoch2
      completion, validator/archive releases; test missing GOAL- alias at both commits. Never equate canonical
      bytes with existence at missing alias.
  - joint: J3-native-successor-archive
    assigned_to: TASK-20261028-43b2e0
    attack_plan: Independently run native verifier for C2 ancestry/parent/message/scope31/hash union and
      source completed release. Reject old C retroactive binding or receipt/queue self-reference.
  - joint: J4-scope-and-limitations
    assigned_to: TASK-20261028-43b2e0
    attack_plan: Check exclusions, no scientific execution/new approval, old source immutability, historical
      model/independence not recertified, full panel and NA-2 hold unchanged; report all unavailable objects/interfaces
      inconclusive.
  proves_too_much:
    objects:
    - In-memory copy of a declared hash with one nibble changed
    - Assertion that missing GOAL- alias exists because canonical content matches
    - Assertion that backfilled receipt bytes were at original C
    failure_signature: Each known-false custody assertion must be rejected; any acceptance makes relevant
      joint breaks. Never write a fabricated source/alias or modify actual historical bytes.
  verdict_vocabulary:
  - holds
  - breaks
  - inconclusive
  admission_gate: Exact independent serving and native runtime/session admission are unverified; P/A publication,
    completed releases and frozen C2 checks also required.
  scientific_runs: 0
  artifact_policy: Check new output sizes before commit; stop for explicit authorized storage route if
    threshold exceeded.
