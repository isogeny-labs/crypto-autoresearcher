schema_version: '1.0'
defaults:
  backend: nistseed-current-app
  backend_fallback_order:
    - nistseed-current-app
model_tiers:
  gpt-6.1-sol: frontier
bindings:
  nistseed-current-app:
    coordinator-orchestration-code:
      model: gpt-6.1-sol
      provenance: operator-supplied
      capabilities:
        max_reasoning_effort: max
        tool_use: true
        structured_output: true
        context_tokens: 180000
        max_output_tokens: 32000
      request:
        max_tokens: 32000
        reasoning:
          mode: openai_effort
          effort_map:
            high: high
            xhigh: xhigh
            max: max
    executor-implementation:
      model: gpt-6.1-sol
      provenance: operator-supplied
      capabilities:
        max_reasoning_effort: max
        tool_use: true
        structured_output: true
        context_tokens: 180000
        max_output_tokens: 32000
      request:
        max_tokens: 32000
        reasoning:
          mode: openai_effort
          effort_map:
            medium: medium
            high: high
            xhigh: xhigh
            max: max
    review-adversarial:
      model: gpt-6.1-sol
      provenance: operator-supplied
      capabilities:
        max_reasoning_effort: max
        tool_use: true
        structured_output: true
        context_tokens: 180000
        max_output_tokens: 32000
      request:
        max_tokens: 32000
        reasoning:
          mode: openai_effort
          effort_map:
            xhigh: xhigh
            max: max
