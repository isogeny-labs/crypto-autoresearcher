schema_version: '1.0'
governance:
  forbidden_provider_substrings:
  - bedrock
  reason: Amazon Bedrock is disabled by operator cost policy.
wire_protocols:
  anthropic_messages:
    path: /v1/messages
    auth:
      style: header
      header: x-api-key
    static_headers:
      anthropic-version: '2023-06-01'
    models_path: /v1/models
    batches_path: /v1/messages/batches
    count_tokens_path: /v1/messages/count_tokens
    system_field: system
    max_tokens_field: max_tokens
  openai_chat:
    path: /chat/completions
    auth:
      style: bearer
      header: Authorization
    static_headers: {}
    models_path: /models
    system_field: message
    max_tokens_field: max_tokens
backends:
  anthropic:
    display_name: Anthropic Messages API
    wire: anthropic_messages
    base_url: https://api.anthropic.com
    base_url_env: ANTHROPIC_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
    supports_models_probe: true
    supports_message_batches: true
  anthropic-fable:
    display_name: Anthropic Messages API (Fable Coordinator)
    wire: anthropic_messages
    base_url: https://api.anthropic.com
    base_url_env: ANTHROPIC_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
    supports_models_probe: true
    supports_message_batches: true
  anthropic-mythos:
    display_name: Anthropic Messages API (Mythos Coordinator)
    wire: anthropic_messages
    base_url: https://api.anthropic.com
    base_url_env: ANTHROPIC_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
    supports_models_probe: true
    supports_message_batches: true
  zai:
    display_name: Z.ai open platform (GLM), OpenAI-compatible
    wire: openai_chat
    base_url: https://api.z.ai/api/paas/v4
    base_url_env: ZAI_BASE_URL
    api_key_env: ZAI_API_KEY
    supports_models_probe: true
    notes: "Mainland-China deployments use https://open.bigmodel.cn/api/paas/v4 \u2014\
      \ set ZAI_BASE_URL rather than editing this file."
  zai-glm53:
    display_name: Z.ai open platform (GLM-5.3 Coordinator)
    wire: openai_chat
    base_url: https://api.z.ai/api/paas/v4
    base_url_env: ZAI_BASE_URL
    api_key_env: ZAI_API_KEY
    supports_models_probe: true
  zai-anthropic:
    display_name: Z.ai (GLM) via its Anthropic-compatible endpoint
    wire: anthropic_messages
    base_url: https://api.z.ai/api/anthropic
    base_url_env: ZAI_ANTHROPIC_BASE_URL
    api_key_env: ZAI_API_KEY
    supports_models_probe: false
    notes: 'Same models as `zai`, spoken in the Anthropic wire format. This is the
      backend to point the `claude_code` runtime at: it lets an Anthropic-protocol
      CLI drive GLM without any Anthropic account.'
  fireworks:
    display_name: Fireworks AI (open-weight models), OpenAI-compatible
    wire: openai_chat
    base_url: https://api.fireworks.ai/inference/v1
    base_url_env: FIREWORKS_BASE_URL
    api_key_env: FIREWORKS_API_KEY
    supports_models_probe: true
    notes: "Serves open-weight models (GLM, Kimi, DeepSeek, Qwen, Llama and similar)\
      \ \u2014 not Anthropic's or OpenAI's proprietary models. Model ids take the\
      \ canonical form `accounts/fireworks/models/<name>`; short slugs are also accepted.\
      \ Probe before binding: `adapter models --backend fireworks`."
  fireworks-anthropic:
    display_name: Fireworks AI via its Anthropic-compatible endpoint
    wire: anthropic_messages
    base_url: https://api.fireworks.ai/inference
    base_url_env: FIREWORKS_ANTHROPIC_BASE_URL
    api_key_env: FIREWORKS_API_KEY
    auth:
      style: header
      header: X-Fireworks-Api-Key
    supports_models_probe: false
    notes: "Same open-weight models as `fireworks`, spoken in the Anthropic wire format\
      \ \u2014 the backend to point an Anthropic-protocol CLI at. It does NOT provide\
      \ access to Claude models."
  openai:
    display_name: OpenAI Responses/Chat-compatible API
    wire: openai_chat
    base_url: https://api.openai.com/v1
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    supports_models_probe: true
    max_tokens_param: max_completion_tokens
  openai-gpt6:
    display_name: OpenAI API (GPT-6 Coordinator)
    wire: openai_chat
    base_url: https://api.openai.com/v1
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    supports_models_probe: true
    max_tokens_param: max_completion_tokens
  openai-gpt61:
    display_name: OpenAI API (GPT-6.1 Coordinator)
    wire: openai_chat
    base_url: https://api.openai.com/v1
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    supports_models_probe: true
    max_tokens_param: max_completion_tokens
  openrouter:
    display_name: OpenRouter (multi-vendor gateway)
    wire: openai_chat
    base_url: https://openrouter.ai/api/v1
    base_url_env: OPENROUTER_BASE_URL
    api_key_env: OPENROUTER_API_KEY
    supports_models_probe: true
    notes: Useful as a single-credential path to several vendors. Model ids are namespaced
      (`vendor/model`), so its binding table differs from a direct vendor backend
      even when the underlying model is identical.
  abliteration:
    display_name: Abliteration.ai (OpenAI-compatible)
    wire: openai_chat
    base_url: https://api.abliteration.ai/v1
    base_url_env: ABLIT_BASE_URL
    api_key_env: ABLIT_API_KEY
    supports_models_probe: true
    notes: 'Serves the vendor''s published ids (`abliterated-model`, `abliterated-model-large`,
      `abliterated-model-large-v2`). These are refusal-reduced open-weight derivatives,
      not Anthropic or OpenAI proprietary models. Chat Completions takes `reasoning_effort`.
      `abliterated-model-large-v2` collapses that ladder to three modes (low, high,
      max): xhigh and max are the same mode. Select this backend with AUTORESEARCH_BACKEND;
      it is not in the fallback order.'
  abliteration-anthropic:
    display_name: Abliteration.ai via its Anthropic-compatible endpoint
    wire: anthropic_messages
    base_url: https://api.abliteration.ai
    base_url_env: ABLIT_ANTHROPIC_BASE_URL
    api_key_env: ABLIT_API_KEY
    supports_models_probe: true
    notes: Same models as `abliteration`, spoken as Anthropic Messages. Effort is
      sent as `output_config.effort` (the vendor's native control). A thinking budget
      would be remapped by the provider to an undisclosed effort, so bindings on this
      backend do not use `anthropic_thinking`. This does NOT provide Claude. The endpoint
      accepts `x-api-key`, which is this wire's default, so a separate auth override
      is unnecessary.
  local:
    display_name: Self-hosted OpenAI-compatible server (vLLM, SGLang, Ollama)
    wire: openai_chat
    base_url: http://localhost:8000/v1
    base_url_env: LOCAL_LLM_BASE_URL
    api_key_env: LOCAL_LLM_API_KEY
    api_key_optional: true
    supports_models_probe: true
    notes: 'For air-gapped or reproducibility-critical review runs: a pinned local
      weight set is the only configuration in which `resolved_model_id` is stable
      across time.'
  nistseed-current-app:
    display_name: 'Current app provider: task-local catalogue validation; first-party
      collaboration delivery separately recorded'
    wire: openai_chat
    base_url: http://127.0.0.1:8317/v1
    api_key_env: NISTSEED_CURRENT_APP_MODEL_KEY
    supports_models_probe: true
runtimes:
  claude_code:
    display_name: Claude Code (CLI, subagents in .claude/agents/)
    wire: anthropic_messages
    role_binding: .claude/agents/<role>.md
    tool_loop: builtin
    env:
      base_url: ANTHROPIC_BASE_URL
      api_key: ANTHROPIC_AUTH_TOKEN
      model: ANTHROPIC_MODEL
      small_model: ANTHROPIC_SMALL_FAST_MODEL
    compatible_backends:
    - anthropic
    - anthropic-fable
    - anthropic-mythos
    - zai-anthropic
    - fireworks-anthropic
    - abliteration-anthropic
    notes: The session model is the project default in .claude/settings.json, or the
      env below for a per-policy launch. Subagents inherit it, except the roles in
      roles.yaml runtime_model_pins, whose files name their policy's binding on this
      backend (checked by tools/check_runtime_bindings.py).
  codex_cli:
    display_name: OpenAI Codex CLI / any OpenAI-protocol agent CLI
    wire: openai_chat
    role_binding: .codex/agents/<role>.toml
    tool_loop: builtin
    env:
      base_url: OPENAI_BASE_URL
      api_key: OPENAI_API_KEY
      model: OPENAI_MODEL
    compatible_backends:
    - openai
    - openai-gpt6
    - openai-gpt61
    - zai
    - zai-glm53
    - fireworks
    - openrouter
    - abliteration
    - local
    notes: "This runtime previously bound roles by convention \u2014 a session read\
      \ AGENTS.md and agents/<role>.md and was trusted to behave. Nothing checked\
      \ it, and a convention is not a binding. The role files are now generated by\
      \ `tools/generate_runtime_agents.py` and verified by `tools/check_runtime_bindings.py`,\
      \ and `.codex/config.toml` registers them. AGENTS.md and the role contract are\
      \ still required reading: the generated file grants the tool surface and points\
      \ at them. Codex always exposes a shell, so a role whose contract excludes `run_commands`\
      \ is prompt-restrained here, not harness-restrained \u2014 `check_runtime_bindings.py\
      \ --list` prints these as OVER-GRANT."
  opencode:
    display_name: OpenCode (CLI, agents in .opencode/agent/)
    wire: openai_chat
    role_binding: .opencode/agent/<role>.md
    tool_loop: builtin
    env:
      base_url: OPENAI_BASE_URL
      api_key: OPENAI_API_KEY
      model: OPENAI_MODEL
    compatible_backends:
    - openai
    - openai-gpt6
    - openai-gpt61
    - zai
    - zai-glm53
    - fireworks
    - openrouter
    - abliteration
    - local
    - anthropic
    - anthropic-fable
    - anthropic-mythos
    notes: 'Of the CLI runtimes this is the one with real per-role enforcement: its
      `permission` block denies a tool outright rather than asking the model not to
      use it, so the generated bindings withhold `bash` from the Coordinator and the
      Idea Generator instead of merely instructing them. Model routing is NOT taken
      from the env vars above the way the other runtimes take it: OpenCode resolves
      providers through its own `opencode.json` `provider:` block, so point that at
      the backend and record the resolved model in the run manifest as usual. The
      env names are listed for the OpenAI-compatible case only. `anthropic` is listed
      because OpenCode ships a native Anthropic provider of its own, so the wire mismatch
      the other two CLI runtimes would hit does not arise.'
  api_direct:
    display_name: This repository's own runtime (orchestration.agent, LangGraph)
    wire: any
    role_binding: agents/<role>.md
    tool_loop: langgraph
    env: {}
    compatible_backends:
    - anthropic
    - zai
    - zai-anthropic
    - fireworks
    - fireworks-anthropic
    - openai
    - openrouter
    - abliteration
    - abliteration-anthropic
    - local
    notes: Executes a role against any backend above, with the tool surface derived
      from orchestration/roles.yaml and the task's write_scope enforced by the tools
      rather than merely requested of the model. State is checkpointed per task id,
      so a long run resumes instead of restarting. Requires requirements-agent.txt;
      the adapter core does not. Roles needing a capability this runtime lacks (web_search)
      are refused outright rather than run with a reduced tool surface -- `tools/check_runtime_bindings.py
      --list` shows which.
defaults:
  backend: nistseed-current-app
  backend_env: AUTORESEARCH_BACKEND
  runtime: claude_code
  runtime_env: AUTORESEARCH_RUNTIME
  request_timeout_seconds: 600
  max_retries: 3
  batch:
    expected_latency_seconds: 3600
    max_latency_seconds: 86400
    urgent_priority: 90
    deadline_slack_seconds: 1800
    registry_dir: coordination/inference-batches
    poll_interval_seconds: 60
