schema_version: '1.0'
defaults:
  backend: nistseed-current-app
  backend_fallback_order:
  - nistseed-current-app
model_tiers:
  claude-mythos-5: frontier
  claude-fable-5-1: frontier
  gpt-6-sol: frontier
  gpt-6.1-sol: frontier
  claude-opus-5-5: core
  gpt-5.6-sol: core
  gpt-5.6-terra: core
  glm-5.2: core
  glm-5.3: core
  accounts/fireworks/models/glm-5p3: core
  accounts/fireworks/models/qwen3p8-2p4t-a95b: core
  claude-sonnet-5-5: director
  claude-haiku-5-5: mechanical
  gpt-5.6-luna: mechanical
  qwen3.8-27b: mechanical
  abliterated-model-large-v2: core
  abliterated-model: director
tier_exempt_backends:
  local: A single local model on the operator's own hardware; it is the whole point
    of the backend that one model serves every role.
  abliteration: Operator-run research models with no tier ladder; every resolution
    records the tier gap.
  abliteration-anthropic: Same models as `abliteration`, Anthropic wire format.
bindings:
  nistseed-current-app:
    coordinator-orchestration-code:
      model: gpt-6.1-sol
      provenance: operator-supplied
      last_probed: '2026-10-27'
      capabilities:
        max_reasoning_effort: max
        tool_use: true
        structured_output: true
        context_tokens: 180000
        max_output_tokens: 32000
      request:
        max_tokens: 32000
        reasoning:
          mode: openai_effort
          effort_map:
            high: high
            xhigh: xhigh
            max: max
