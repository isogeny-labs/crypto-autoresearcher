schema: crypto.autoresearch.pfdr_independent_validation_plan/v1
recorded_at: '2026-11-09'
authority: DEC-20261109-6e0798
purpose: Determine whether the invalid pilot's immutable raw rows can supply a newly derived, prospective design-calibration input under a new contract.
scope:
  source_run: RUN-PFDR-1e5d2b
  source_experiment: EXP-PFDR-7c7c95
  receipt_status: invalid_output
  scientific_status: no conclusion
  original_plan_sha256: ad2ef87c68721f70765e8821805a2e3749a00580d2ac26e76b96bab263424814
  launch_authority_commit: 95ff8c4f46738b620eb1ce2f01a4bb987c894268
