proof_search_map:
  status: prospective scaffold, not a derived theorem
  bottleneck: Can returned joint shifts be certified in one localized integral ideal and safely specialized
    with all denominator/pivot/rank/height charges, instead of adding per-block reach or discarding coefficient
    height?
  baseline_embedding:
    parameter_slice: Suppress F2,F3 to recover the principal (N,F1)^mu construction; retain all coordinate
      scaling explicitly. Contrast disjoint-variable ideals with shared h1,h2, not three independently
      counted moduli.
    reproduction_check: Manual algebra/source derivation against exact archived principal budget K=t*d-q
      (archived N is rowcount d here, distinct from formalmodulus N), plus cited single-block proof; no
      runtime computation.
  observation_collision:
    observable: Newton support, row count or generic fraction-field span alone
    distinct_preimage_search: Manually attack (N,c*x) over Q(c)[N,x], then c(p)=p,N=p,x=1. Determine why
      generic division byc cannot justify specialized integer vanishing; also use already archived F101
      same-support F1+1 and signed-lift controls as known boundaries, not new tests.
  constructive_transforms:
  - transform: stronger_invariant
    proposed_object: Explicit localized-ring ideal-power membership witnesses for each retained row and
      certified layer/quotient ranks; identify syzygies and p-adic cancellation before any jointgain assertion.
    predicted_gain: A checkable validity condition or precise missing lemma; no exponent gain predicted.
  - transform: specialization_pack
    proposed_object: Separate denominator/unit, leading-term/pivot/rank, coefficient-height and uniform
      multiplicity/bad-prime certificates.
    predicted_gain: Prevents invalid family transfer and specifies exact finite native evidence needed,
      without running it.
  quantifier_order: For each fixed finite multiplicity and returned symbolic trace, construct an explicit
    localization/witness and bad-specialization condition BEFORE quantifying over integer parameter/prime
    specializations. Uniform family/multiplicity or random-growing-coefficient statements need new uniform
    bounds, not finite-trace existence. Producer writes formal forall/exists order and identifies each
    nonuniform dependence.
  method_ceiling:
    strongest_certifiable_claim: Conditional joint algebra/specialization/height statement and exact unresolved
      assumptions; no numerical reach, root recovery or IC complexity result from symbolic rank/ideal
      membership alone.
    nearby_object_control: Generic unitc versus c(p)=p; repeated/linearly dependent relations versus independent
      generators; equal support with corrupt coefficient; fixed O(1) parameters versus parameters growing
      withp.
  proof_obligations:
  - claim: Localized membership and modular divisibility of actual abstract row witnesses
    responsibility: correctness
  - claim: Specialization preserves denominator units and separately degree/leadingterm/pivots/rank/span
    responsibility: interface
  - claim: Cleared-denominator or modular-inverse coefficient heights and multiplicity dependence are
      charged
    responsibility: size
  - claim: Joint ideal layer dimensions include dependencies/syzygies; no sum-of-singleblock shortcut
    responsibility: scope
  - claim: Lemma7 assumptions/suitability/Heuristics1–2/growth conditions remain explicit; final extraction
      excluded
    responsibility: success_probability
  not_applicable_reason: No compute/search in this task; the map is nevertheless frozen before mathematical
    producer work.
