schema: joint-localized-certificate-design/v1
task_id: TASK-20261030-6394ed
status: design_only_no_instance_packet
proof_status: derivation
scientific_calls: 0
checker_implemented_or_run: false
object_binding:
  protocol: ../../research-protocol.json
  coefficient_ring: 'A0=Z[a,b,q,c1,c2,c3,c4,d1,d2]'
  coefficient_fraction_field: 'K=Q(a,b,q,c1,c2,c3,c4,d1,d2)'
  unknown_order: [z1, z2, z3, z4, h1, h2]
  formal_ring: 'A0[N,z1,z2,z3,z4,h1,h2]; N independent of all coefficient parameters'
  input_polynomial: 'S(A,B,C)=(A-B)^2*C^2-2*((A+B)*(A*B+a)+2*b)*C+(A*B-a)^2-4*b*(A+B)'
  relations:
    - 'F1=S(c1+z1,c2+z2,d1+h1)'
    - 'F2=S(c3+z3,c4+z4,d2+h2)'
    - 'F3=S(d1+h1,d2+h2,q)'
  ideals: 'I=(F1,F2,F3); J_mu=(N,I)^mu; J_infinity=0'
  bound_coordinates: [X, X, X, X, Y, Y]
  mandatory_instance_fields:
    - exact input bytes and hashes
    - positive integer mu
    - ordered explicit distinct monomial list M with six coordinates and hash
    - separately declared bound-induced term order and actual integer weights
    - optional auxiliary-order membership proofs, never substituted for trace parity
    - actual symbolic and integer row encodings with all formal N coefficients
universal_global_ideal_control:
  status: proved_manually_for_exact_object
  auxiliary_x_weights: [2, 2, 2, 2, 1, 1]
  leading_monomials: [z1^2*z2^2, z3^2*z4^2, h1^2*h2^2]
  leading_coefficients: [1, 1, 1]
  proof_refs: [joint-certificate.md#1a-lemma-u-a-universal-monic-control-for-this-exact-object]
  certificate_family: 'G_j={F^beta : beta in N^3, |beta|=j}'
  proof:
    - 'F_i-t_i over A0[t][x] are monic with pairwise coprime leading monomials.'
    - 'Their S-pairs have lower-leading standard representations by the product criterion.'
    - 'B0 is free over A0[t], t_i acting by F_i, on monomials divisible by no leading m_i.'
    - 'The distinct triangular leading terms of F^beta*w establish each product ideal-power basis.'
  consequences:
    - 'Every A0[x]/I^j is free over A0 and this description survives any coefficient base change.'
    - 'Over Z_(p), I^j is p-saturated for every integral parameter fiber and prime p.'
  does_not_certify: clipped intersections, rank minors, bound-order trace, actual native span, heights of that trace
fixed_clipped_flag_packet:
  status: missing_for_actual_cells
  quantifiers: 'forall fixed finite mu,M exists nonzero Delta and finite identities; forall c0,p with p not dividing Delta(c0), identities survive'
  localization: 'A=A0[1/Delta]; every coefficient and inverse in this ring'
  for_each_j_1_through_mu:
    global_basis:
      required: 'Use proved auxiliary G_j family, or supply another monic basis with two-way ideal identities and all descending S-pair reductions.'
    remainders:
      required: 'For each m in M, m=sum u_mg*g+R_jm; every monomial of R_jm standard for G_j'
      matrix: 'T_j columns are R_jm in union U_j of standard remainder monomials'
    kernel_and_nested_flag:
      ranks: 'd>=r_1>=...>=r_mu>=0, r_j=dimension_K ker T_j'
      shared_matrix: 'B in GL_d(A), columns v_i in M coordinates; provide B inverse'
      identities: ['T_j*B=[0,C_j]', 'L_j*C_j=identity_(d-r_j)']
      accepted_consequence: 'H_j=I^j intersect V=span_A(v_1,...,v_rj), universally after allowed base change'
  rejection_conditions:
    - membership-only vectors presented as a complete kernel
    - arbitrary coefficient-field rank without left-inverse or unit-minor witness
    - lost remainder monomials or unrecorded outside-domain columns
    - domain recomputed after specialization without equality with fixed M
    - global ideal flatness used as proof of clipped base change
row_membership_and_span:
  membership:
    required_identity: 'd_i(c)*g_i=P_i=sum_(a+|beta|=mu) W_(i,a,beta)*N^a*F^beta in Z[c,N,x]'
    denominator_condition: 'p not dividing d_i(c0) for unscaled rational interpretation; integral P_i itself needs no inverse'
    support: 'Full actual row support lies in declared M'
    closure: 'Every row operation/normal-form change carries propagated identities; no inversion of nonunit polynomial in N'
  formal_span:
    required: 'Both inclusions between actual returned A[N]-module and exact flag module, with transformation identities'
    flag_basis: 'N^lambda_i*v_i where lambda_i=mu-max({j:i<=r_j} union {0})'
    formal_N_order: 'q_N=mu*d-sum_j r_j'
  integer_span:
    required: 'Complete integer membership and reverse span, or exact finite index m of selected rows in full lattice'
    warning: 'Rational equality does not prove p-local equality; p-local equality does not prove global integer equality'
    saturation_option: 'If raw integer rows lie in full lattice and have equal localization at p, their prime-to-p saturation equals the full p-primary integer lattice.'
    saturation_cost: 'Require actual saturation or congruence-preimage identities, output basis heights, input bit lengths and construction/verification cost; no unavoidable denominator penalty asserted.'
specialization:
  exact_index_bridge_modulus: 'N0=p with p prime; no exact full determinant formula claimed for arbitrary multiple N0'
  algebra_checks:
    - integer parameter tuple c0
    - p does not divide Delta(c0), every needed denominator and all explicit inverse/minor certificates
    - actual remainder and flag identities after specialization
    - actual bound-order leading terms, degrees, coefficient comparisons, pivots and branch decisions when trace equality claimed
    - actual chosen integral representatives and all support/domain columns
  derived_layer_statements:
    colon: '((p,I)^t:p)=(p,I)^(t-1), using global power saturation'
    clipped_recursion: 'L_t=H_t+p*L_(t-1), additionally using clipped base change'
    p_layers: 'dimension image(p^-a*(L_mu intersect p^a V) -> V/pV)=r_(mu-a)'
    full_integer_index: '[Z^M:L_Z]=p^(mu*d-sum_j r_j) because p^mu Z^M subset L_Z'
    usable_budget: 'K_full=sum_j r_j; no r_j is evaluated in this task'
    selected_rows: 'det_scaled=m*p^q_N*product_e X^(e1+...+e4)*Y^(e5+e6)'
  group_checks_separate:
    - p greater than 3 and nonzero 4*a^3+27*b^2 mod p
    - injective bounded windows or explicit deduplication and revised density
    - compatible F_p y-lifts, signs, exceptional cases, subgroup and target equality
height_ledger:
  input_bound: 'H=max(1,absolute values of all nine parameters); norm1(F_i(c0,x))<=28*(H+1)^4'
  per_cleared_row_fields: [d_i, P_i, integral_W_witnesses, norm1_P_i, degree_c_P_i, degree_N_P_i, support_size, monomial_degrees]
  evaluation_bound: 'norm1(P_i(c0,N0,x))<=norm1(P_i)*H^degree_c_P_i*max(1,abs(N0))^degree_N_P_i'
  denominator_clearing: 'Charge actual determinant/index change and sum log abs(d_i(c0)); a p-unit can have growing real size'
  modular_inverse_mode:
    modulus: 'Q=abs(N0)^mu; gcd(d_i(c0),N0)=1'
    identity: 'u_i*d_i(c0)=1 mod Q; centered coefficient representatives of u_i*P_i'
    coefficient_bound: 'absolute coefficient <=Q/2'
    membership_reason: 'Coefficient reduction differs by N0^mu times an integer polynomial'
    caution: 'Recompute actual leading terms, span and determinant; congruence alone does not preserve them'
  products:
    target_multiplicity: mu*k
    norm_bound: product of norms of k certified base rows
    reduction_modulus: 'N0^(mu*k), not merely N0^mu'
    combinations: 'Charge sum of absolute combination coefficients times product norms'
  growing_packet_obligation:
    - uniform number/encoding size of packet entries
    - uniform degrees and logarithmic coefficient norms
    - denominator/minor height and degree, and coverage of good specialization locus
    - domain/support size, transformations and construction/verification cost
    - selected full integer index and actual row coefficient sizes
controls:
  nonunit: 'Generic (N,c*x)=(N,x), but c=p,N=p,x=1 rejects normalized x; cleared p*x valid'
  rank: '[[1,1],[1,1+c]] at c=p has denominator1 and rational rank2, residue rank1'
  clipping: 'I=(x+c*y),V=span{x}: global monic free quotient, generic intersection0, at c=0 intersection span{x}'
  dependent: 'Repeating any relation leaves I and all its powers/intersections unchanged'
  corrupt: 'Same-support F1+1 must match original object and exact witnesses, not a support fingerprint'
  signed: 'x-only Semaev zero does not verify a specified signed subgroup relation'
acceptance_ceiling:
  finite: algebraic membership/layers/span/height for explicitly certified finite instance only
  uniform: requires the separate explicit growing-packet obligations
  excluded: numerical reach, heuristic discharge, actual lattice reduction, root extraction, random-target yield, relation independence, IC improvement, family closure
next_checker_design:
  implementation_status: absent
  prospective_steps:
    - Bind object/rings/order/M/rows and all inputs by hashes.
    - Check global auxiliary proof family and exact monic reductions or alternative basis identities.
    - Check finite remainder matrices, B inverse, zero heads and left-inverse tails.
    - Check both symbolic span directions and complete row ideal witnesses.
    - Specialize, checking p-units and actual trace branches separately.
    - Verify actual integer membership/span or index, height ledger and weighted determinant.
    - Preserve unresolved heuristic/extraction/group/cost obligations without state promotion.
