schema_version: '1.0'
notes:
- Task-scoped prospective native Executor binding; model/capability assertions reused
  conservatively from the committed same-model coordinator binding.
- Executor policy/authority remains executor-implementation and may_change_official_state:false.
  No API probe or actual task invocation is claimed.
- Select only by explicit AUTORESEARCH_BINDINGS_OVERLAY for this packet; do not install
  as a shared default.
bindings:
  openai-gpt61:
    executor-implementation:
      model: gpt-6.1-sol
      provenance: operator-supplied
      last_probed: null
      capabilities:
        max_reasoning_effort: max
        tool_use: true
        structured_output: true
        context_tokens: 180000
        max_output_tokens: 32000
      request:
        max_tokens: 32000
        reasoning:
          mode: openai_effort
          effort_map:
            high: high
            xhigh: xhigh
            max: max
