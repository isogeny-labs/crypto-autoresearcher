  order_certification:
    result: PASS
    requirement: N prime, N in the Hasse interval, N*P = O for 4 seeded random points per curve
    bits_32: 8 curves (seeds 6900000..6900007), all pass
    bits_28: 4 curves (seeds 6900100..6900103), all pass
    observed_margins: >-
      |N - (p + 1)| stayed inside 2*sqrt(p) on every curve (largest 32-bit margin 121619 against
      radius 125864; largest 28-bit margin not binding). Each curve recorded points_ok = 4.
    generator: vendor/curve.py generate_prime_order_curve via ec.generate_prime_order_curve(bits, seed)
    note: >-
      generate_prime_order_curve already certifies a unique BSGS multiple in Hasse that is prime and
      > 4*sqrt(p); run.py.certify_curve re-checks N prime, the Hasse bound and N*P = O on four seeded
      points and records the certificate in every census record and in selftest.json.

  paircount_key_bound:
    result: PASS
    formula: x*p + y <= (p-1)*p + (p-1) = p^2 - 1 < 2^64
    max_p_checked: 3700232981
    bound_at_max_p: 13691724113680146360
    two_to_64: 18446744073709551616
    bound_lt_2_64: true
    p_lt_2_32: true
    reviewed_fix: >-
      The ca5e01 kernel rejected p >= 2^31 and could shift a 64-bit value by 64 in the key-width scan.
      The copy accepts p < 2^32 and computes the key width with a loop capped at 63, defaulting to 64
      only when the bound needs it. Both changes are recorded in the file header; the counting
      convention (exclude Q = -P and P = Q, count binom(m_s, 2) per s != O) is unchanged. The kernel
      selftest passes at p near 2^32 (9 base types, brute recounted).

