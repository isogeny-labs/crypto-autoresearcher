system:
  curve_equation: y^2 = x^3 + a*x + b over F_p
  field_conditions: p prime, p>3, 4*a^3+27*b^2 nonzero modulo p
  summation_polynomial: S(A,B,C)=(A-B)^2*C^2-2*((A+B)*(A*B+a)+2*b)*C+(A*B-a)^2-4*b*(A+B)
  variables_order: [z1, z2, z3, z4, h1, h2]
  affine_coordinates:
    x1: c1+z1
    x2: c2+z2
    x3: c3+z3
    x4: c4+z4
    u: d1+h1
    v: d2+h2
    target: q
  equations_mod_p:
    - F1=S(c1+z1,c2+z2,d1+h1)
    - F2=S(c3+z3,c4+z4,d2+h2)
    - F3=S(d1+h1,d2+h2,q)
  integer_bounds: '|z_i|<X=ceil(p^beta), |h_j|<Y=ceil(p^gamma); exact integer X,Y must be recorded in any finite trial'
  window_semantics: integer deviations mapped modulo p; windows are injective only if 2*X-1<=p and 2*Y-1<=p; otherwise deduplicate and recompute density
  sign_semantics: S3 is an x-coordinate necessary relation with sign/extension-field ambiguity; verify F_p y-lifts, compatible signs, finite group additions, subgroup membership and target equality separately
  exceptional_cases: identity coordinates, equal/opposite points, tangent additions and zero denominators must be classified; do not divide by A-B indiscriminately
  weighted_ray: beta=delta, gamma=r*delta
  normalization:
    log_p_box_volume: 4*beta+2*gamma plus finite constant factors
    volume_per_equation: (4*beta+2*gamma)/3; descriptive conversion only
    determinant_for_archived_triangular_rows: sum_i(s_i*beta_i)<K=t*N-qmod
    finite_first_vector_condition: sum_i(s_i*beta_i)<K-N*log_p(sqrt(N)*2^((N-1)/4)) for the specified square triangular lattice and LLL delta=3/4
    restriction: rectangular, dependent or nonmonic cuso bases need their own exact covolume and divisibility audit; no automatic reuse of triangular formula
symbolic_interface:
  coefficient_field_first_panel: QQ; all a,b,q,c_i,d_j fixed integers
  ring: QQ[z1,z2,z3,z4,h1,h2] with declared generator order; cuso creates p as its first additional variable
  problem: SymbolicCoppersmithProblem([F1,F2,F3], bounds=[1,1,1,1,r,r], int_rels=[], modulus_name='p', divisor_bound=1, relation_modulus_degrees=[1,1,1], mod_mult_modulus_degree=1)
  call: get_asymptotic_bounds(problem,bounds_guess,monomial_vertices,precompute_multiplicity=mu,tshifts_to_include=[False,False,False,False,False,False],skip_reduce=False)
  bounds_guess: '[1/20,1/20,1/20,1/20,r/20,r/20] using Sage QQ rationals'
  internal_weight_order: wdeglex; round(1000*(1,bounds_guess)); record actual weights, including p first
  monomial_domain: E=union of exact nonzero supports of F1,F2,F3 in six-variable order; M_mu=conv({0} union {mu*e:e in E}) intersect Z_nonnegative^6
  vertex_encoding: pass tuples (0,mu*e1,...,mu*e6), including all-zero tuple, to monomial_vertices; leading zero is the symbolic modulus exponent
  domain_distinction: cuso fills integral points of convex hull; this is not the archived discrete Minkowski support; internal M_bar closure must also be retained
  ideal: J=(p,F1,F2,F3)^mu, J_inf=(0); p is a formal modulus variable over QQ, never a finite-field element in this symbolic computation
  output: delta_star, tau_cuso, coprime_condition; record exact serialization, construction statistics and conditions
  tau_cuso: all t-shifts disabled, so returned tuple is zeros; not an attack-cost exponent
  algorithmic_caveat: polynomial.py interpolates polytope statistics; limit.py takes leading-term ratios. Enabling t-shifts would invoke constrained floating minimization and requires a new finite plan.
  optimality_scope: README describes a span guarantee within a stated construction; its theorem applicability and specialization hypotheses remain independently unverified here. No global shift, bound, runtime or extraction optimality asserted.
applicability_obligations:
  - id: A-fixed
    status: input_bound
    obligation: fixed integer coefficient fixture has O(1) coefficient heights as p grows; rational symbolic algebra still creates denominators
  - id: A-growing
    status: unresolved_transfer
    obligation: random curve coefficients, targets and window centers typically grow with p; bound specialized numerator/denominator heights and prove any discarded coefficient losses subexponential, or explicitly charge them. Fixed-center results do not settle this.
  - id: A-denom
    status: unresolved_per_specialization
    obligation: retain all cuso coprime_condition entries and all introduced denominators/leading coefficients; after clearing denominators require gcd(D(p,a,b,q,c,d),p)=1, preserve degrees/pivots and check specialized ideal/span certificates. Exceptional parameter zeros are exclusions with measured frequency, never silently discarded.
  - id: A-modulus
    status: interface_identified
    obligation: common known prime p with relation degrees one; no unknown-divisor model and no characteristic-p Groebner computation substituted for QQ symbolic preprocessing
  - id: A-paper
    status: unresolved_review
    obligation: independent reviewer retrieves full Ryan theorem/Algorithm3/Lemma7 and states exact hypotheses and guarantee; README's span claim and heuristic symbolic output do not certify recovery
  - id: A-cost
    status: identified_unmeasured
    obligation: ideal powers, both J_inf and J Groebner calls, closure/echelon work, polytope enumeration and interpolation are charged; later lattice construction, reduction, extraction, verification and failures also charged
  - id: A-extract
    status: unresolved_not_in_first_panel
    obligation: several short integer-vanishing equations must be algebraically independent enough for a zero-dimensional or otherwise tractable extraction system; verify all bounded candidates against original modular equations and group conditions. One small vector or Jacobian rank alone is insufficient.
  - id: A-baseline
    status: unresolved
    obligation: reproduce and freeze measured IC baseline at matched curves/subgroups/seeds/resources and complete verified DLP success; current study has no such measurement. Rho remains a separate reference.
  - id: A-gap
    status: unreconciled
    obligation: historical 0.8408 and 8/9 normalization/gap cannot be reused as validated thresholds
  - id: A-gap-rank
    status: separate_followup
    obligation: rank>=2 GAP substitution x=c+sum_j(s_j*z_j) changes variable count, coefficient height, carries, injectivity and multiplicities; requires a separately frozen domain/collision/transfer contract
