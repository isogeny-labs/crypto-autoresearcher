question: What weighted symbolic shift construction and heuristic bound does the pinned implementation produce for the actual shared-variable joint system within a fixed domain, and what resources and specialization conditions does it require?
inputs:
  applicability: applicability.yaml
  input_commit: 295b244f1de08797f3b0ce0f925ef20625a337c9
  cuso_commit: fb2747d2105a8e48499bf10a3a717cf80c14d079
  calibration: research/joint_smallroot_reach_20261024/readiness-20261025/cuso-univariate-readiness.log
  calibration_manifest: research/joint_smallroot_reach_20261024/readiness-20261025/manifest.json
first_joint_workload:
  fixture_id: fixed-affine-integer-v1
  a: 2
  b: 3
  q: 5
  centers: {c1: 11, c2: 13, c3: 17, c4: 19, d1: 23, d2: 29}
  meaning: algebraic fixture only; no planted root, subgroup identity or random-instance claim
  rays_r: [2, 4]
  precompute_multiplicities: [1, 2]
  t_shift_mask: [false, false, false, false, false, false]
  skip_reduce: false
  delta_domain: 0<delta<1/r; finite integer injection additionally required before any root trial
  coordinate_orders:
    A: [z1, z2, z3, z4, h1, h2]
    AA: [z1, z2, z3, z4, h1, h2]
  domain: exact M_mu and ideal in applicability.yaml; AA repeats exactly the same serialized input, order, options, weights and domain in a fresh cold process
  bounds_guess: delta0=1/20 with gamma=r/20
  main_cells: '(r,mu)=(2,1),(2,2),(4,1),(4,2); lexicographic (r,mu) order'
  per_cell_call_order: [F1_single, F2_single, F3_single, joint_A, joint_AA, nearby_A]
  mechanical_case_ids: 'J-r{r}-mu{mu}-{arm}, Cartesian product of the four ordered main_cells and six ordered per_cell_call_order values; exactly 4*6=24 distinct case IDs, each once; joint_AA is included in the six, not an additional repeat'
  symbolic_calls: 24
  replication: one independent cold process for each call; joint_AA is an identical-input repeat of joint_A; one pair is a descriptive A/A diagnostic, not a confidence interval
  excluded_representation_followup: reversed generator order requires a separately frozen representation-sensitivity arm; not included in these 24 calls or their identical-input noise floor
  single_blocks: same coefficients and centers; project to each block's active variables and ray weights; same mu and same domain rule for that block; F3 has two unknowns because q is fixed
  nearby_object: replace every nonzero coefficient of each expanded Fi with 1+(int(SHA256('nearby-v1|'+j+'|'+comma_join(e)),16) mod 19), j=1,2,3; retain exact support, centers-label, bounds and domain. No elliptic-group interpretation is assigned.
  nearby_purpose: tests coefficient dependence and prevents interpreting a support signature alone as an elliptic decomposition oracle; equality of bounds is not presumed
controls:
  - id: U-archive
    design: read_only_calibration_binding
    specification: bind already completed documented univariate example and printed 1/3; compare pinned source and Sage/dependency versions before admitting panel. Do not rerun it merely to create another calibration result; a mismatch requires additive protocol correction.
    limitation: previous calibration has no timing or peak RSS and says nothing about joint correctness
  - id: D-sign
    design: exact_arithmetic_instrument_control
    specification: use existing tests/test_joint_smallroot_reach.py fixture E:y^2=x^3+2x+3 over F_101, P=(1,39), T=(3,6), R=(41,15). Independently verify P+T=R; enumerate all eight sign triples (sP,sT,sR) in {-1,1}^3, retaining the same three x-coordinates, and classify whether sP*P+sT*T+sR*R=O separately from S3 vanishing. For one full tree use leaves P,T,P,T, internal nodes R,R and target 2R computed by exact group doubling, never root search; centers are (1,3,1,3,41,41) and deviations zero. Verify each modular equation and every constructed shift's p^mu divisibility. Record target and exceptional denominators.
    corrupted_control: replace F1 by F1+1 at the same planted tree; it must fail the congruence and row-divisibility validation. Reject any extraction oracle that reports success without original-equation/group verification.
    limitation: public repeated-point toy fixture only; not random subgroup data or evidence of extraction success
  - id: C-blocks
    design: confounded
    specification: report joint delta_star beside minimum projected-block delta_star on each ray; blocks are references, not a proof of joint equivalence
  - id: C-aa-repeat
    design: aa
    specification: identical serialized joint inputs, generator order, coefficients, options, weights and domain in a fresh cold process; record exact-bound equality and absolute resource spread; one pair gives no confidence interval
  - id: C-nearby
    design: one_factor
    specification: joint_A versus nearby_A changes coefficients only, holding expanded supports and domain fixed
variable_ledger:
  independent:
    - {name: internal_to_leaf_ray_r, levels: [2, 4]}
    - {name: precompute_multiplicity, levels: [1, 2]}
  factors:
    - {name: coefficient_regime, treatment: fixed, value: fixed QQ integers; no growing or generic coefficient field}
    - {name: field_semantics, treatment: fixed, value: characteristic-zero symbolic p ideal; D-sign is a separate F_101 control}
    - {name: presentation_and_arity, treatment: fixed, value: four leaves, two internals, three chained S3 equations; singles explicitly separate references}
    - {name: centers_target_curve, treatment: fixed, value: first_joint_workload fixture in every primary joint arm}
    - {name: support_and_domain, treatment: fixed, value: exact convex integer M_mu for each mu; same set across AA and nearby}
    - {name: solver_build_and_flags, treatment: fixed, value: pinned cuso, Sage10.9; complete lock and launcher hashes missing}
    - {name: variable_order, treatment: fixed, value: z1,z2,z3,z4,h1,h2 in joint_A and joint_AA; projected active order in single references}
    - {name: cold_process_replica, treatment: crossed, value: A and AA fresh-process repeats with identical inputs}
    - {name: coefficient_replacement, treatment: crossed, value: original and deterministic nearby in C-nearby only}
    - {name: randomness_and_seeds, treatment: fixed, value: no stochastic sampler; nearby-v1 SHA256 encoding UTF-8 ASCII with decimal j and e, commas without spaces}
    - {name: symmetry_and_extraction, treatment: fixed, value: no symmetry quotient, no extraction or lattice reduction in first panel}
    - {name: host_load, treatment: measured, value: host identity, CPU model, load, free memory and cgroup limits per process}
    - {name: resource_and_censoring_limits, treatment: fixed, value: same watchdog and memory guard for all calls}
    - {name: field_basis_factor_base_subgroup_sampling, treatment: fixed, value: not instantiated in symbolic panel; no random-target conclusions}
  comparisons:
    - {id: C-grid, arms: [joint_A_r2_mu1, joint_A_r2_mu2, joint_A_r4_mu1, joint_A_r4_mu2], differs_in: [internal_to_leaf_ray_r, precompute_multiplicity], design: factorial}
    - {id: C-blocks, arms: [joint_A, projected_single_blocks], differs_in: [system_presentation, shared_constraints, variable_count, monomial_domain], design: confounded, reason: references differ in several structural factors; no causal speedup or tightness inference}
    - {id: C-aa-repeat, arms: [joint_A, joint_AA], differs_in: [cold_process_replica], design: aa}
    - {id: C-nearby, arms: [joint_A, nearby_A], differs_in: [coefficient_replacement], design: one_factor}
  crosses_map: true
prediction_provenance:
  - prediction: P-instrument
    first_recorded_in: TASK-20261025-b7e32e/experiment-contract-preview.yaml
    written_at: '2026-10-25'
    data_seen:
      - {path: research/joint_smallroot_reach_20261024/artifacts/finite-audit.json, measured: exact finite structural counts on unshifted a2,b3,q5 fixture; not cuso}
      - {path: research/joint_smallroot_reach_20261024/independent-review.md, measured: exact determinant/divisibility checks; not joint extraction}
      - {path: research/joint_smallroot_reach_20261024/readiness-20261025/manifest.json, measured: documented univariate printed 1/3; no time/RSS}
