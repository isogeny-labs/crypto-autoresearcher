    sample_status: in_sample
    overlap: same archived example; calibration only, no success or falsification criterion
transfer_obligations:
  - map: xi=ci+zi and internals u=d1+h1,v=d2+h2 modulo p
    kind: coordinate_change
    source: bounded deviations
    destination: affine windows in curve x-coordinates
    preserves: [modular polynomial zeros via exact substitution, field after lawful specialization]
    changes: [integer coefficient heights, supports, term order, interpretation of integer bounds]
    controls:
      - {kind: coordinate_isomorphism, comparison: D-sign}
      - {kind: matched_random, comparison: C-nearby}
    assessment: preview_obligations_below; formal transfer-template assessment still missing before approval
    obligations:
      - verify exact substitution and inverse deviations on the declared finite windows
      - prove injectivity or measure multiplicity and change density accounting
      - C-nearby is a deterministic pseudorandom coefficient object of matched support/dimension, not random subgroup control; broader group-transfer inference remains barred
      - certify denominator specialization, finite-field y-lifts/signs and subgroup identity before group claims
primary_observables:
  - delta_star exact rational or precise failure classification, ray-capped beta_star and gamma_star, uncapped value retained
  - V=4*beta_star+2*gamma_star and V/3; no reuse of historical gap
  - S1 count, M_mu size, M_bar closure size, supports, leading terms, per-coordinate exponent sums and modulus powers
  - returned coprime conditions, denominator and coefficient-height maxima with exact objects retained
secondary_observables:
  - per-phase wall_seconds, cpu_seconds, peak_rss_bytes for ideal generation, J_inf/J Groebner, monomial enumeration, closure/echelon, polytope statistics, interpolation and limit
  - total cold process time and process-tree/cgroup peak memory, cumulative failed-call cost, AA absolute spread
  - reduction_status=not_requested and extraction_status=not_requested; no fabricated zero times or success rates
resource_protection:
  concurrency: 1
  memory_max_bytes: 8589934592
  admission: require host available memory >=12GiB and a functioning process-tree/cgroup guard before start; otherwise infrastructure-not-started, no smaller substituted panel
  wall_watchdog_seconds_per_call: 1800
  watchdog_reason: checkpoints a potentially explosive six-variable Groebner/polytope process; no mathematical negative or campaign spending cap
  process_policy: terminate full process tree on guard, preserve phase and artifacts; no automatic retry or parameter escalation
stopping_and_retention:
  - run D-sign before symbolic calls; a failed exact control invalidates instrument and stops remaining calls
  - execute all 24 prescribed calls unless integrity/control failure or host protection stops batch; a per-cell algorithm error is retained and remaining cells proceed only after guard is verified healthy
  - record every requested cell as complete, failed, censored or not_started with reason; never silently replace missing cells
  - retain stdout/stderr, exceptions, input hashes, environment, timestamps, intermediate checkpoints, serialized ideals/shifts/conditions and raw metric rows; follow artifact-store size policy
  - no post-result tuning, extra multiplicities, t-shifts, generic parameters, GAP substitutions, reduction, roots or random targets without separately archived amendment/contract
decision_impact:
  complete: all controls and exact-input audits pass and 24 calls accounted for; independent reviewers inspect domain/normalization and specializations before a separate reduction/extraction implementation is ranked
  scoped_null: equal/low joint bounds are observations within this fixed family and two rays; cannot close optimal shifts, generic coefficients, GAPs or the lead
  apparent_joint_difference: report delta_joint minus block reference with AA spread; any difference <=AA spread is representation-sensitive; even larger difference is only a family-specific heuristic symbolic observation pending review
  inconclusive: timeout, OOM, interpolation failure, denominator exception or order sensitivity identifies a construction/interface obstruction; preserve all costs, then design the smallest separately frozen diagnostic
  invalid: failed modular/sign/corruption control or input/domain mismatch voids affected comparisons and requires implementation repair before any scientific inference
success_criteria:
  - C-grid with P-instrument is complete only when every requested cell has exact input binding and a classified retained result, and all completed cells pass domain, serialization and denominator audits; this establishes measurement integrity only
falsification_criteria:
  - C-grid with P-instrument fails instrument acceptance when a purported complete cell lacks its exact source/domain/conditions or violates the original modular equation control; no mathematical hypothesis is refuted
complete_cost_followup:
  model: lambda=p^(4*beta+2*gamma-3); C=max(3-3*beta-2*gamma+tau_attack,2*beta) only under independently uniform windows, usable rank and bounded extractor success, subgroup order Theta(p), and charged attempt/setup costs
  IC_reference: frozen measured current prime-field IC baseline not reproduced here; baseline identifiers, registered curve/subgroup identities and seeds must be bound before comparative execution
  rho_reference: separate matched rho/vOW reference; cB=1/2 is a modeled asymptotic benchmark, never the measured IC baseline
  required_costs: cold and reused setup with reuse count; Groebner/shift construction; reduction; extraction; misses; duplicates; signs; relation verification/yield/rank; sparse linear algebra; final DLP verification; time and peak memory; all failed attempts
  independent_validation: matched baseline/candidate verified DLP and relation certificates at multiple fixed sizes, independent replay and progress-fidelity/measured-bound records before any IC advantage claim
missing_readiness_gates:
  - official IDs, exact launcher/adapter source and complete environment lock; this task implements none
  - frozen finite trialplan, supervisor, executor handoff and queue covering every raw/intermediate/failure artifact and lawful lane
  - formal transfer assessment and full theorem/normalization/coefficient-height independent review
  - exact prospective final bytes and committed input/source hashes in preapproval packet; experiment_preapproval reports approvable:true
  - Director compile-mode runbook and task card with LINT OK; approval binds runbook_sha256; CARD OK after approval
  - Coordinator approval decision under standing authorization, then verified isolated snapshot archive, committed/pushed publication and execution_state:ready before dispatch
  - current lane/live claim and resource guards rechecked at execution; only /run executes the approved plan
next_action: Executor-implementation prepares the finite adapter/launcher, exact trialplan and supervisor packet described here without executing it; then return for independent review and prospective preapproval.
