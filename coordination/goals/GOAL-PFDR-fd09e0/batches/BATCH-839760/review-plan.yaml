prior_recorded_before_new_data: The frozen v2 protocol asks whether any of six structured lines shows a verified
  positive break-even growth exponent at bits 16,20,24,28,32 under original controls; prior valid selftest supports
  the instrument only. Two prior pilots remain invalid_output and supply no admissible design or scientific reading.
  No new metrics have been read by this plan.
claims_in_scope:
- The five new stage receipts match the prospectively frozen EXP-PFDR-fa915a source, plan, protocol and launch authority,
  including corrected pilot and four dependents.
- The new pilot independently yields the preregistered sizing and plant design from its own valid 960-row grid;
  no old invalid data are used.
- Final per-line slopes, intervals, controls and replication, if present, are recomputable under the unchanged frozen
  rules.
one_owner_and_independence:
  review_owner: A fresh independent Validator session, separate from producer and Coordinator design, reads only
    archived producer artifacts and frozen plan/protocol after snapshot commit.
  model_policy: Resolve review-adversarial at dispatch and report actual native model and effort. Existing operator-supplied
    gpt-6-sol/xhigh binding is unprobed; model_verified must remain false unless an actual probe verifies it. No
    API inference or vendor identity is inferred.
  coordinator: Coordinator alone records official scientific status after reviewer report and ledger archive.
joint_obligations:
- joint: custody
  independent_check: Verify every receipt/artifact SHA, exact published source bytes, launch commit vs manifest,
    plan hypothesis/experiment/task/approval IDs, protocol canonical hash and all six arm instrument SHA flags.
    Count three historical receipts and at most five fresh IDs; do not relabel invalid attempts.
- joint: pilot admission
  independent_check: Recompute complete pilot row-key grid, curve identities and prime-order certificates at a bounded
    sample, size n_curves and gamma/plant design from valid new pilot rows. Compare design.json to independent derivation
    and ensure all dependent inputs_from point only to new pilot. Reject historical derivative paths.
- joint: counts and controls
  independent_check: Nonce-select bounded raw rows for independent kernel recount, recompute null means/variance,
    structured and plant counts, A/A z calibration, positive and negative controls, invalid/empty cells, and identical
    seed/curve pairing.
- joint: analysis and replication
  independent_check: From raw rows rederive per-rung kappa, log2 N, five-rung slopes, 2000 fixed-seed bootstrap
    intervals and line classes; independently verify analyze-main flags, census-rep ALIVE-only selection and final
    replication rule. State omitted or unreplayed work explicitly.
- joint: claim scope
  independent_check: Compare any proposed reading to all six preregistered lines and controls, historical v1 diagnosis
    and the exact criterion. Do not promote a scoped finding into a larger attack-cost or curve claim.
worked_attacks:
- Mutate a generated pilot hypothesis_id, run_id, plan SHA, source SHA, seed/curve identity, timing or command field
  in zero-science fixtures; complete_manifest must refuse before science.
- Present an old invalid pilot design.json or post-hoc derivative as census input; check both plan path and SHA
  binding reject it.
- Remove, duplicate or reorder pilot row keys and alter a curve order certificate; the independent grid/certificate
  check must detect the defect.
- Change one null count, plant internal count, or denominator M; recomputed controls/derived design must disagree.
- Show a proposed positive rule on a matched A/A null and infeasible plant; a rule that marks these positive proves
  too much and cannot support a claim.
proves_too_much_control: Apply the identical slope/interval and decision implementation to null A/A, positive plant
  gamma lines, negative gamma=0 and Z/N checks. A procedure that accepts the null A/A as a structured effect, ignores
  a failed positive control or reports infeasible plants as null is invalid as a claim reader.
decision_rule: If any required run is invalid, incomplete, missing a published receipt or lacks the pilot design
  admission, return the exact defects to Executor and hold dependent stages; no scientific verdict. A valid full
  set then goes to independent evidence review and a separate Coordinator decision. No review report alone changes
  status.
limits:
  scientific_runs_authorized_by_this_plan: 0
  review_retry: A failed or incomplete review is preserved and a fresh bounded review task/decision is needed; never
    rewrite a report.
  budget: Independent metadata/raw-row review and nonce replay must be finite and separately resource-bound in the
    Validator handoff; it cannot launch new study trials.
