red_team_report:
  id: RT-20261029-fa71c4
  task_id: TASK-20261029-11526b
  claim_under_review: >-
    The EXP-PFDR-bb0d26 toy reading (RUN-PFDR-089edc analysis.json: O-NULL / SUPPORT_SCOPED; 44 cells null, 1
    invalid) and the conclusion drawn from it in specification.yaml decision_impact.on_positive: a move of
    H-PFDR-727bfc to supported at the toy scope, "a scoped closure of label-describable rank <= 3 log-GAP bases at
    the toy sizes tested", and "the implicit-membership route of KN-OPEN-020 for the unknown-sharing base of
    IDEA-20261017-bbc53e is then not opened by a label predicate at these sizes". Attacked on joints J3a and J3b only.
  objections:
  - id: OBJ-1
    joint: J3a
    text: >-
      The design's power sentence is false for the frozen flag rule. The rule is |kappa-1| >= 0.10 AND |z| > 4.
      4 sigma_kappa <= 0.067 at every powered cell, so the effect-size conjunct binds and the probability of flagging
      a true +-10% departure is 0.50 at all 44 cells. 0.95 is reached only at |delta| >= 0.100 to 0.130 per cell
      (worst b24-r1-n256). PTM-2 at f = 0.10 confirms this: 25 of 64 realizations flagged, 0 of 8 at b20-r2-n4096 and
      b24-r1-n4096 where kappa_true is 1.096 and 1.0998. The cause is the decision threshold sitting on the
      alternative boundary, not sample size; the z conjunct alone has power >= 0.971 at 10% everywhere. This is the
      plan's J3a breaking artifact, produced at every cell (power-table.json, ptm-results.json).
  - id: OBJ-2
    joint: J3a
    text: >-
      The shortfall in OBJ-1 does not create a place for a 10% departure to hide in the null reading. The probability
      that a +-10% departure is read null is <= 0.0033 at every cell (worst b24-r1-n256, empirical sigma). None of the
      64 PTM-2 at 0.10 realizations was read null. Each null cell excludes |kappa - 1| > x_c with x_c <= 0.0743
      (b28-r1-n256), x_c <= 0.0052 for n >= 2048, and x_c <= 0.0012 at n = 4096. The effect sizes each cell excludes
      are tabulated per cell in power-table.json.
  - id: OBJ-3
    joint: J3b
    text: >-
      Proves too much: PTM-4a (a uniform subset of L, i.e. inside the label-predicate set chi(f(x)) = 1) and PTM-4c
      (inverse-interval sets, membership decided by one inversion and one comparison at every p) are label-describable,
      and the frozen instrument reads both null at all 8 tested cells. The sentences "scoped closure of
      label-describable rank <= 3 log-GAP bases" and "the implicit-membership route of KN-OPEN-020 ... is then not
      opened by a label predicate at these sizes" therefore do not follow from O-NULL. The same holds for the idea's
      "No label predicate of low complexity can therefore describe a log-GAP base" and for the hypothesis's first
      falsification condition. The observable kappa has no separator for label-describability (observation-fiber
      attack).
  - id: OBJ-4
    joint: J3b
    text: >-
      The wording covers objects that were not tested. The unknown-sharing base of IDEA-20261017-bbc53e is a union of
      many rank-1 progressions over independent points, not a rank <= 3 box. Folded boxes are not covered: every valid
      set had zero duplicate skips, and the 4 relation-degenerate tuples were excluded. Structured base points, ranks
      above 3, and j = 0 or j = 1728 curves (rejected by the generator; secp256k1 is j = 0) are also untested,
      together with the contract's listed limits (scope-and-wording.md section 5).
  - id: OBJ-5
    joint: J3b
    text: >-
      O-NULL establishes the operationalised H1 (a 5% equivalence margin), not the literal "labels behave as
      independent uniform elements". The frozen null class reads known structured objects as null at enormous
      significance. The PTM-3 substitute deficits are null at kappa 0.990 (z -466) and 0.954 (z -534). PTM-4b and
      PTM-4c are null at dense cells with z -27.2, -15.1, +14.6 and +18.8.
  - id: OBJ-6
    joint: J3b
    text: >-
      The recalled citation behind the "about p^(1/2)" threshold is misattributed. Ahmadi-Shparlinski PEMS 53 (2010)
      pairs x(aP) + x(bP) with x(abP), and for a prime-order curve its nontrivial ranges start near q^(9/10) or
      q^(15/16). The label-sum against group-sum dichotomy with a q^(1/2) range is Shparlinski FFA 2008 (read only in
      the restatement of arXiv:1302.4210). Even that is a sumset lower bound and gives no kappa = 1 anchor at any n.
      The role of the citation is scope only, so the null reading does not depend on it.
  required_controls:
  - >-
    Any statement about label predicates or membership needs a measurement that separates label-describable from
    non-describable sets (it would fail on PTM-4a and PTM-4c). The pair-sum count is not one; keep the narrowed
    sentence.
  - >-
    To resolve the unexpected cell-level heterogeneity (OBS-2) would take a pre-registered replication-only amendment
    on fresh base points for the b20-r3 cells (n 256 to 2048), b24-r1-n2048 and the b28 n = 256 cells, with the sum of
    z^2 and the split-half correlation as primary statistics. This is a scientific trial and was not run here.
  - >-
    For the cryptographic direction the relevant quantity is the absolute structural coincidence count per set as p
    grows at fixed small n. If structure exists, kappa - 1 = c/mu rises with bits. The tightest current per-set bound
    is 0.09 to 0.19 at b28 n = 256; a p-scaling series at n = 256 (bits 28 to 36) is the cheapest discriminating
    control. Not run here.
  counterexample_or_mutation: >-
    PTM-4c: x-label sets cut out by a polynomial-time label predicate (x^-1 - t mod p < K_n) read null at every
    tested cell. This defeats the label-predicate inference. PTM-3 at k = n is a known-false deficit set (kappa 0.954,
    z -534) that the frozen classifier reads null; this defeats "labels behave as independent uniform elements" as a
    reading of O-NULL.
  baseline_comparison: >-
    No cost, attack, relation path or speedup is claimed, so Pollard rho and BSGS do not apply. The matched baseline for
    the statistic is the uniform label-set null on the same curve (C2), and it was used. Its correctness as a reference
    was confirmed by an independent implementation: 80 fresh uniform sets give mean z 0.136 +- 0.112, sd 0.964
    (null-object-control.json). dominated_by reads 'n/a (no result claimed); rho dominates any attack reading (checked
    KR-RHO-7d93f6)'. That is a justified entry, not an unchecked null.
  heuristic_challenges:
  - >-
    H1's justification is a recalled pointer with no proven bound on x(cP) at any tested size. The "rigorous bound plus
    classical distribution theorem" shape of docs/claims-and-verification.md is unmet; record it as an obstruction of
    the heuristic.
  - >-
    Random-model transfer was tested further than the contract required. Per-curve PIT and dispersion are consistent
    with exchangeability (overall chi-square p 0.45; dispersion z vs LOO nulls has mean -0.19, sd 0.85). At the cell
    level, gap z is more dispersed than the matched null (OBS-2).
  - >-
    The literal H1 (independent uniform labels) is stronger than its operationalisation (|kappa-1| < 0.05). Records
    should state the operationalised form as what was not contradicted (OBJ-5).
  cost_model_challenges:
  - >-
    None applies (no cost claim). The design sized power in relative kappa. The quantity a cryptographic transfer would
    need, absolute structural coincidences per set, has sensitivity 0.09 to 0.19 per set at best and grows with n
    (regime-table.json).
  reduction_and_scope_challenges:
  - 'Failing sentences F1-F6 and the narrowed replacements: outputs/scope-and-wording.md section 2.'
  - 'Untested objects the wording covers: scope-and-wording.md section 5 (OBJ-4).'
  - 'Quantifier: "every toy cell" / "45 cells" is 44 of 45; b20-r3-n4096 is invalid and not assessable.'
  - >-
    Supported without a replication block is consistent with the frozen rule and with precedent (H-SEMBIN-97ea23). It
    rests on one main seed block, and the design leaves a false null unconfirmed by construction; the guard against
    that is the null class (OBJ-2), not replication. KN-FIND promotion requires replicated or strong evidence
    (docs/task-lifecycle.md).
  proof_architecture_challenges:
  - >-
    Observation-fiber attack: with kappa ~ 1 held fixed, PTM-4a, PTM-4c and the log-GAP sets lie in one fiber. No
    separator for label-describability exists in the observable.
  - >-
    Nearby-object attack: label-describable sets with random-like pair-sum energy are the nearest objects for which
    "not label-describable" is false. The argument goes through on them unchanged.
  - >-
    Boundary attack on the flag rule: at high-count cells the rule is a deterministic threshold at kappa = 1.10. A
    departure at 1.0998 is never flagged and one at 1.1001 always is (PTM-2 at 0.10 at b24-r1-n4096 and b28-r3-n4096).
  narrowest_supported_statement: >-
    On generated prime-order ordinary toy curves E/F_p with p of 20, 24 and 28 bits (main seed block 8,100,000 + c;
    j != 0, 1728), for x-label sets of rank r <= 3 log-GAPs built as specified (independent uniformly random base
    points, one representative per +-c, lexicographic half-box fill, injective boxes), of size 256 <= n <= 4096, the
    pooled nontrivial pair-sum coincidence count matches that of uniform label sets of the same size on the same curves
    within the measured per-cell 95% interval at each of the 44 assessable cells (|kappa - 1| <= x_c, x_c <= 0.0743
    everywhere, <= 0.0052 for n >= 2048; b20-r3-n4096 not assessable). It says nothing about label-describability or
    membership predicates, other statistics or set shapes, larger n or p, or any standardized curve.
  next_concrete_action: >-
    At composition, adopt the narrowed statement above as the only supported sentence. Carry the per-cell x_c and the
    absolute per-set excess bounds (power-table.json, regime-table.json) in the obstruction block. Record F1-F6 of
    scope-and-wording.md as not supported, correct the design's power sentence and the p^(1/2) attribution, and log
    OBS-1 to OBS-4 as unexpected observations.
  artifact_paths:
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/report.yaml
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/outputs/
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/scripts/

findings:
  J3a:
    verdict: breaks
    basis: >-
      Power clause: breaks at all 44 powered cells, structurally (OBJ-1). The flag rule detects a true +-10% departure
      with probability 0.50 everywhere, against the design's > 0.95. What the null reading excludes is unaffected
      (OBJ-2): every cell excludes |kappa-1| > x_c with x_c <= 0.0743, and a +-10% departure is read null with
      probability <= 0.0033.
      Calibration clause: holds. z_cal has mean -0.268 over 44 cells (two-sided p 0.076 if independent). Replicate 0 is
      exchangeable with replicates 1..19: job-level mid-rank z is -1.56 against a range of -1.65 to +1.80 for the other
      replicates, and k = 0 ranks 2nd of 20 per-k means. The LOO z scale is 1.03 (880 values); independently drawn
      uniform sets give mean z 0.14 +- 0.11. A bias of -0.27 would change neither flag tail by more than 5.4e-9 and
      would shift kappa_hat by < 0.0045.
      Tail clause: holds. P(max |z| >= 3.13 over 44 cells) is 0.074 independent, 0.073 under the estimated cross-cell
      correlation (rho_resid 0.0006 pooled), and 0.10 with the bias.
      Sub-threshold clause: not broken by the plan's criterion, since no Stouffer or inverse-variance stratum reaches
      |z| > 3 (max 2.78 at bits 20, r 3). The heterogeneity recorded as OBS-2 is real but tiny, sign-mixed and not
      coherent across halves.
      Pre-committed mapping note: the shortfall is general but concerns only the falsification branch (flagging). The
      effect size each cell excludes is x_c. How to compose a general but structural flag-power break is the
      Coordinator's decision.
    items:
      power_and_mde: >-
        power-table.json: 44 cells. delta_min (z only) 0.0001 to 0.0668. Effective flag threshold 0.10 everywhere.
        Flag power at +-10% is 0.50. delta_95 is 0.1000 to 0.1302. V/M is 0.914 to 1.089 (counts are Poisson-like;
        no over-dispersion). Bootstrap sd over null sd is 0.73 to 1.17. Cells with power < 0.95 at 10%: all 44.
        Cells with delta_min > 0.10: none.
      equivalence_bounds: >-
        power-table.json /cells[]/equivalence_bound_recorded_ci (reviewer bootstrap agrees). Max 0.0743 (b28-r1-n256);
        <= 0.0052 for n >= 2048; <= 0.0012 at n = 4096. The b20-r3-n4096 cell is not assessable.
      calibration: calibration-loo.json; null-object-control.json
      tail: >-
        tail-and-correlation.json. The largest-|z| cell b24-r1-n2048 (kappa - 1 = -0.0011, -201 coincidences per set
        out of 181k) has its deficit spread across curves: 76% are below their null mean, the halves give z -1.76 and
        -2.65, and dropping any one curve leaves z in -3.50 to -2.96. It is not mirrored at the other 14 r = 1 cells
        (Stouffer +0.61). Familywise p is 0.074, so a real effect is not established. If it is real, it is a 0.1%-scale
        effect that the 5% margin ignores by design, comparable to the significant 0.16% to 0.24% deviations of the
        PTM-4b and PTM-4c objects that the frozen class also reads null.
      pooled: >-
        pooled-strata.json: no stratum reaches |z| > 3. Overall Q is 70.1 on 43 df (p 0.0056, I2 0.39). The even/odd
        A/A z has sd 0.94 and max 3.24 (b24-r1-n256). null_mean_over_formula ranges 0.9951 to 1.0077 with no anomalies.
        omnibus-null-controls.json and split-half.json hold the matched-null checks.
  J3b:
    verdict: breaks
    basis: >-
      The instrument has no sensitivity defect at any tested cell. PTM-1 is flagged (+) at all 44 powered cells. It
      reaches O-STRUCT through the even/odd pseudo-replication in both the reviewer classifier and the producer's
      analyze_records, which also correctly refuses O-STRUCT without replication (O-PENDING-REPLICATION); this closes
      gap G-5 on known-false objects. PTM-2 at 1.15 (16/16), PTM-3 where it exists (6/6, negative sign) and PTM-5
      (16/16) are all flagged with the correct sign.
      The inference proves too much (OBJ-3): label-describable PTM-4a and PTM-4c read null at all 8 cells. The two
      label-predicate sentences of decision_impact.on_positive, the idea's claim and the first falsification condition
      therefore fail. The wording also covers untested objects (OBJ-4), and O-NULL is a 5% equivalence statement
      (OBJ-5).
      No near-degenerate stratum exists: no ok job in any r >= 2 cell has a duplicate skip, so nothing near-degenerate
      is pooled away. The valid data cover injective boxes only.
      By the pre-committed mapping this is "J3b breaks only on wording": the narrowed statement survives.
    items:
      ptm_results: ptm-results.json, ptm1-results.json, ptm-cells/*.json; table in scope-and-wording.md section 3
      regime: >-
        regime-table.json; scope-and-wording.md section 4. E[C] per set ranges 2.7 to 4.6e7, against 2^-211 at
        p = 2^256 and n = 4096; the cryptographic regime is not covered. n/sqrt(p) ranges 0.018 to 4.6, with 10 cells
        above sqrt(p). The absolute per-set sensitivity is 0.09 to 0.19 at best.
      untested_objects: scope-and-wording.md section 5
      near_degenerate: near-degenerate.json, degenerate-relations.json; scope-and-wording.md section 7
      promotion_gates: >-
        scope-and-wording.md section 8. The four asymptotic gates do not apply (asymptotic_claim null). The exemplar
        checklist classifies the hypothesis as non-target-class. The heuristic-validation obligations apply, and the
        rigorous-plus-classical justification is unmet.
      supported_without_replication: scope-and-wording.md section 9
      wording: scope-and-wording.md sections 1 and 2

unexpected_observations:
- id: OBS-1
  text: >-
    b20-r3-n4096 has 4 degenerate curves of 50, where an exact group model of independent uniform base points predicts
    0.73 (Monte Carlo) to 0.89 (overlap count); Poisson p is 0.007 to 0.013. Each degenerate job carries one generic
    short relation, rebuilt bit-exactly ((5,2,-14), (13,9,-8), (1,-11,5), (4,-8,3)), with no P_i = +-P_j. Recorded,
    not explained, and not evidence about H1.
- id: OBS-2
  text: >-
    Cell-to-cell dispersion of gap z exceeds the matched null. The sum of z^2 over 44 cells is 71.4, against 46.6 +- 8.4
    for the 20 null replicates (above all 20). The b20-r3 stratum rank-location z is 3.28, against a maximum over
    strata of <= 3.05 for every null replicate. The even/odd correlation across cells is 0.30 (Fisher p 0.047, above
    all 20 null replicates). The effect is not coherent across halves: the excess sum of z^2 sits in the even curves
    (68.8 vs 42.5), and the b20-r3 excess appears in the even half only (Stouffer 3.63 vs 0.29). Magnitudes are tiny:
    |kappa - 1| <= 0.015 at the cells driving it, and <= 0.0025 at every n >= 2048 cell.
- id: OBS-3
  text: >-
    b28-r1-n256, the most transfer-relevant cell, has its 95% interval excluding 1 (kappa 1.041, excess 0.11 [0.025,
    0.19] coincidences per set, z 2.52). The independent null-object control at that cell gives mean z -0.02, so the
    reference is not biased there. The observation is consistent with chance among 44 cells.
- id: OBS-4
  text: >-
    In the dense regime (b20, n = 4096, n/p ~ 0.006), a planted AP of internal fraction f yields kappa = 1 + 0.959 f,
    because the fill cannot land on AP labels and loses some 3+1 cross coincidences. This is a construction property
    of the planted arm; it lowers the plant's kappa slightly at that cell and does not affect any class.

resource_check:
  examined: true
  reading: >-
    Read in reverse, the measured obstruction (x-labels of box-structured point sets have uniform-like pair-sum
    collision counts at these sizes) is the hypothesis that collision-probability arguments need for sums of
    x-coordinates of structured point sets, e.g. extractor or hash constructions from x(aP) + x(bP) with (a, b) in a
    box. On that reading it is a positive resource at toy sizes. Provenance: recalled; no source located or read. It
    is a candidate for ranking only, not evidence, and changes no status.
  spawned_ids: []
  spawned_ids_note: not filed by the Red Team; the Coordinator may file it.

