validation_report:
  id: VAL-20261029-2e327b
  task_id: TASK-20261029-e54312
  scope: >-
    Joints J2a (execution integrity and reproducibility) and J2b (measurement fidelity) of review plan
    BATCH-924d2c-bb0d26-evidence-review, for the five runs of EXP-PFDR-bb0d26 at the Coordinator-committed snapshot
    820db6f6df. The run records were archived by TASK-20261022-207893 in commit e85a8dbe1a, and the working tree
    was clean.
  run_ids: [RUN-PFDR-e44a19, RUN-PFDR-4d8c71, RUN-PFDR-243425, RUN-PFDR-cd03e2, RUN-PFDR-089edc]
  verdict: passed
  verdict_meaning: >-
    The five run records pass the J2a and J2b checks. Within these joints they are admissible receipts. This
    verdict says nothing about H-PFDR-727bfc, the toy reading's inferential adequacy or the other joints. It
    authorises no status move or promotion.
  artifact_checks:
  - "digests (outputs/digests.json): 374 bindings, 0 failures. They cover every file of the five run directories against the execution-receipt artifact_sha256 (53 entries), the TASK-20261022-207893 ledger receipt and BATCH-8d6d84 dispatch_queue path_sha256 (58 files each, none missing or extra), the journal unit artifacts and receipt_sha256, and the implementation sources against trial-plan source_sha256 and input_sha256, every manifest code_sha256, environment.json source_sha256, the runbook and journal binds, the specification's declared sha256 values and the TASK-20261022-b6532d snapshot receipt. They also cover the spec, plan and runbook digests wherever bound, and the 17 receipt digests quoted by DEC-20261022-9aec2b."
  - "journal hash chain of RBS-PFDR-bb0d26 recomputed with reviewer code: 18 entries, seq, prev and hash all valid, tip 47f92d815113fa07878922f3ed9d45ddd7a6adbfbcf0920994e22af9efaa009f"
  - "run count and order (outputs/integrity-checks.json run_count_and_order, 38 checks, 0 failures): exactly the five planned run directories. The ids and order agree across the spec, the trial plan and journal attempt 2 (seq 11-15, all valid and output_validated). Attempt 1 recorded 5 not_run units with no run directory after the supervisor refused to launch (exit 2). Each trial started after the previous one finished. Every receipt has returncode 0 and check_returncode 0, and every timing is self-consistent."
  - "schema (159 checks, 0 failures): every manifest carries the artifact_schema.manifest fields. code_sha256 covers exactly the five .py and .c files under implementation/. python_version is 3.11.15 in all five, commit 48bd193abf with dirty false, and trial_plan_sha256 is 9b25b15b...9386. The raw-result, design.json, selftest.json, jobs-record and analysis keys are present. One schema note: see observations O-1."
  - "check.py re-run read-only on the five run directories under /usr/bin/python3.11 and /usr/bin/python3.13: exit 0 for all ten runs. Each stdout is byte-identical to the recorded check.stdout.log, and the experiment tree digest was unchanged before and after (outputs/checkpy-py311/, outputs/checkpy-py313/)."
  metric_recomputations:
  - "analyze-main and analyze-final replayed under CPython 3.11.17 (/usr/bin/python3.11 -B -I, run.py trial entry point): analysis-main.json, analysis.json, both flags.json, both raw-result.json and stdout are byte-identical to the record. The /cells table (cls, S, kappa, every float) is therefore identical too (outputs/replay-compare.json)."
  - "the same under CPython 3.13.17 with the declared tolerance (float leaves rel_tol 1e-9, abs_tol 1e-12; all else exact): matched_within_tolerance. Each analysis file has 479 float leaves that differ, with max rel 6.47e-11 (/cells/44/z, z = -0.0092) and max abs 4.77e-7 (/cells/9/V, value 2.4e9). The largest z difference is 9.7e-12. raw-result /summary has 2 differing float leaves (calibration mean and sd, rel 8.6e-14 and 4.6e-14). There are 0 non-float differences, and flags.json is byte-identical. This is interpreter drift as ruled in DEC-20261029-5554ee, not a fabrication signal."
  - "selftest replayed under 3.11.17 and under 3.13.17: selftest.json, design.json, raw-result.json and stdout byte-identical to RUN-PFDR-e44a19 in both"
  - "independent recomputation of analysis.json from the 6657 job records with reviewer code (integrity.py: exact rationals, explicit left-fold sums and a re-implemented bootstrap from the seeding convention): 672 floats compared, all 672 bit-identical. They cover S, M, V, kappa, z, z_cal, plant_kappa, plant_z, null_mean_over_formula, d_ratio, kappa_even, kappa_odd, ci95 and d_ci95 of the 44 complete cells, the calibration mean and sd, largest_abs_z and 9 slopes. Classes (44 null, 1 invalid), the calibration n and pass, fraction_valid, flagged_cells, outcome, headline, powered_cells and the anomaly lists all re-derive. The decisive powered comparison agrees in exact arithmetic."
  - "raw/summary agreement (25 checks, 0 failures): raw-result /summary of both analyze runs equals the analysis top-level fields, flags.json equals flagged_cells, and stdout.log restates them. The census /summary (jobs 6657, failed_infrastructure 0, degenerate 4) equals a recount of the jobs file. census-toy-rep has an empty jobs file and 0 counts after an empty flags.json, and the selftest summary agrees with selftest.json (79 of 79 pass) and design.json (45 cells)."
  - "J2b recount (outputs/recount-sample.json): 33 jobs pre-selected by the plan's hash rule, 27 of them with n >= 1024. Each was regenerated and recounted with disjoint code (no import of run.py, check.py, curve.py or labelsum.c). 462 field comparisons, 0 mismatches, covering p, a, b_coef, N, gap_meta, all 20 null_C and null_D, gap_C, gap_D, plant_m, plant_internal, plant_feasible, plant_C and plant_D."
  control_checks:
  - "C2 null arm: 20 null sets of every sampled job regenerated by reviewer code; counts equal"
  - "C3 planted arm: regenerated by disjoint code in all 33 sampled jobs. plant_m is found by a linear prefix scan with a pure-Python counter, where the driver bisects, and the m found is minimal. The float threshold and the exact rational threshold agree, and plant_internal equals the sort counter on the prefix."
  - "C6 checker replay: check.py census branch re-run under both interpreters, exit 0"
  - "C1 and C7 selftest: replayed byte-identically (79 checks, including 45 kernel-vs-brute, 12 scaling-identity and 3 builder-vs-slow)"
  - "kernel adversarial inputs (outputs/kernel-spotcheck.json): labelsum.c compiled as the driver does (gcc -O2 -std=c11). 31 cases and 77 sets agree with the reviewer counters and the closed forms. They include n-term APs at p near 2^20, below 2^28 (268435399) and 2^31 - 1 for n in {256, 1024, 4096}, with C = 5720333312 and D = 8189 at n = 4096; sets packed in [p - n, p), where every sum wraps; symmetric sets {x, -x}, where m_0 = n/2 is verified; random n = 4096 sets at 20, 24, 28 and 31 bits; 21 sets in one call; edge sizes 1 to 3; the whole field F_1009; and the hand set. Input guards: p = 2^31, a label >= p and n > 8192 all exit 2."
  heuristic_validation_checks:
  - "pre-registered prediction: P1, P2 and P-detect and their thresholds are in the frozen specification (approved 2026-10-22, sha256 e294b040...9820 bound by the trial plan), which predates the runs of 2026-10-23. The idea file named as first record was not read; that question is outside J2a and J2b."
  - "sample integrity: block offsets, the seed rule and n_curves are in the manifests, trial plan and design.json. All 6657 main records regenerate their curve from seed 8,100,000 + c, and the cell statistics recompute from the raw records (above)."
  - "null-object control: the matched null of the same shape (20 uniform label sets of the same n on the same curve) exists for every ok record and regenerates for the sampled jobs. Whether kappa behaves as it should as the structure-destroying parameter varies is inferential and belongs to other joints."
  - "correspondence: none used (direct sampling at toy scale; spec scale_relevance correspondence null)"
  - "scale binding: toy curves of 20, 24 and 28 bits with n up to 4096 are recorded. No transfer is claimed (spec R10)."
  cost_model_checks:
  - "not applicable: no cost table, unit or crossover is claimed (spec C8 not run, out_of_scope)"
  proof_architecture_checks:
  - "not applicable: heuristic-validation experiment; no proof, speedup or relation claimed (manifest certificate kind none)"
  limitations:
  - "The recount is a sample of 33 of the 6653 ok jobs. The other jobs are covered by structural checks: curve regeneration for all 6657 records, the identities C >= n(n-1)/2 - D and plant_C >= plant_internal, and gap_meta consistency for all records. They are also covered by check.py's own 4-job replay and the audit's 9-job recount. A defect confined to unsampled jobs would go undetected. The hash-ordered rule makes a targeted defect unlikely to be missed, but it does not bound a rare random one."
  - "My regeneration shares the seeding convention with run.py by necessity: the label strings and the RNG consumption order. A wrong-but-consistent convention would be reproduced. Only a blind re-derivation can test that, and it belongs to another joint. This task is not blind to run.py."
  - "Pair sums at 28 bits were counted with the sort counter only, because a histogram over [0, p) is too large. The sort counter was cross-validated by the histogram counter on all 22 sets of each of the 22 sampled jobs at 20 and 24 bits (including n = 4096), and by the dict counter in the kernel spot-check (n <= 1024)."
  - "The 3.11 replay used CPython 3.11.17, not the recorded 3.11.15. Byte identity shows that the patch level did not affect these outputs; it is not a general statement."
  - "The census was not replayed in this task. The analyze replays read the recorded jobs file, as the plan specifies. Measurement fidelity of the jobs file rests on the J2b recount and the structural checks."
  - "Exhaustive point counts were run on the 10 sampled curves at 20 bits and 2 at 24 bits. The other 18 sampled curves rest on PARI ellcard plus the prime-order certificate (N prime, Hasse bound, [N]P = O for 3 points), which is a proof given that N is prime."
  - "The bootstrap seed label and percentile convention come from run.py. The specification states only 'seeded per cell'. The interval reproduces under that convention; no other convention was tested."
  artifact_paths:
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-e54312/report.yaml
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-e54312/scripts/
