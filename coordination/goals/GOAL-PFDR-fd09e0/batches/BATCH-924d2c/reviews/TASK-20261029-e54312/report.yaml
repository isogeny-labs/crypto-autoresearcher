findings:
  J2a:
    verdict: holds
    basis: >-
      Under /usr/bin/python3.11 (CPython 3.11.17; recorded 3.11.15) the bound driver's trial entry point, reading
      the recorded census, reproduced the following byte for byte: analysis-main.json, analysis.json, both
      flags.json, both raw-result.json and stdout of analyze-main and analyze-final, and selftest.json, design.json,
      raw-result.json and stdout of the selftest. Every sha256 equals its receipt, so /cells (cls, S, kappa and every
      float) is identical. Under CPython 3.13.17 the analyze outputs are matched_within_tolerance (479 float leaves
      per analysis file, max rel 6.47e-11; 2 in /summary; 0 non-float differences). check.py exits 0 on all five
      runs under both interpreters. 374 digest bindings and the journal chain verify with 0 failures. 608 integrity
      checks pass with 0 failures. They establish exactly five runs in the planned order; complete schemas with
      python_version 3.11.15, commit 48bd193abf, dirty false and the frozen plan sha256 everywhere; every one of
      the 6657 main records in block main with c in [0, n_curves) and a curve that regenerates from seed
      8,100,000 + c; raw/summary agreement; and one consistent curve and set of arms per record and per
      (bits, c). An independent recomputation of all 672 analysis floats is bit-identical. Page 1 of the report
      contradicts nothing in analysis.json. No breaking artifact was found.
    attack_items:
    - {item: "(1) 3.11 replay", result: "byte-identical (9 files plus 3 stdout)", output: outputs/replay-compare.json}
    - {item: "(2) 3.13 replay", result: "matched_within_tolerance (rel_tol 1e-9, abs_tol 1e-12); selftest byte-identical", output: outputs/replay-compare.json}
    - {item: "(3) selftest replay", result: "selftest.json, design.json byte-identical", output: outputs/replay-py311/selftest/}
    - {item: "(4) check.py x5 x2", result: "exit 0 x10", output: "outputs/checkpy-py311/results.jsonl, outputs/checkpy-py313/results.jsonl"}
    - {item: "(5) digests", result: "374 bindings, 0 failures; chain valid", output: outputs/digests.json}
    - {item: "(6) count, order, schema, seeds, raw/summary, arms", result: "608 checks, 0 failures", output: outputs/integrity-checks.json}
    - {item: "(7) report page 1", result: "no contradiction; outcome and headline not stated on page 1 (O-2, O-3)", output: "outputs/report-page1.txt, outputs/report-page1-check.json"}
  J2b:
    verdict: holds
    basis: >-
      All 33 jobs that the plan's rule selected before any count was read (outputs/recount-selection.json, sha256
      b6ddb5ca...b346, written 2026-10-29T05:09:43Z) were regenerated by reviewer code that imports nothing of the
      producer: 27 jobs with n >= 1024, and the planted arm in every job. They match the record in all 462 field
      comparisons. The regenerated sets are identical under 3.11 and 3.13. labelsum.c agrees with the reviewer
      counters and with closed forms on every adversarial input, including wrap-around sums, primes just below
      2^28 and 2^31 and n = 4096, and it rejects out-of-range input. All 30 sampled curve orders certify: by
      exhaustive count on 12, by PARI ellcard on 30 and by the prime-order certificate on 30. All 1580 main
      curves also regenerate and PARI-certify. Each of the four degenerate records regenerates degenerate: the
      half-box H(3, 10) of 4630 vectors is exhausted, leaving 3566, 4006, 3030 and 2641 distinct labels against
      n = 4096. In each, a short relation explains every collision: u = (5, 2, -14), (13, 9, -8), (1, -11, 5) and
      (4, -8, 3) for c = 6, 30, 42 and 47. Each relation satisfies u.P = O, verified by scalar multiplication and
      by discrete logarithms. No breaking artifact was found.
    attack_items:
    - {item: "(1) 33-job recount", result: "462 comparisons, 0 mismatches", output: outputs/recount-sample.json}
    - {item: "(2) kernel adversarial inputs", result: "31 cases / 77 sets agree; 3 guards exit 2", output: outputs/kernel-spotcheck.json}
    - {item: "(3) curve orders", result: "30 of 30 certified (methods per curve listed); all 1580 PARI-certified", output: "outputs/curve-orders.json, outputs/curves-regenerated.json"}
    - {item: "(4) degenerate certificates", result: "4 of 4 genuinely degenerate, with exhaustion and relation certificates", output: outputs/degenerate-certificates.json}
  defects: []
  observations:
  - >-
    O-1 (schema, minor): the invalid cell b20-r3-n4096 in analysis-main.json and analysis.json omits 14 of the 23
    artifact_schema.analysis_json cells[] fields (S, M, V, kappa, ci95, z, plant_kappa, plant_z, plant_feasible_all,
    z_cal, d_ratio, null_mean_over_formula, kappa_even, kappa_odd); it neither carries them as null nor records them.
    It carries reason "fewer ok main-census records than n_curves" and curves 46. No reading, class or count is affected.
  - >-
    O-2 (report): the "Commit" on page 1 of reports/run-20261023T2211Z/report.pdf is 98ab449608, the
    session-start preflight commit (journal seq 0). It is not 48bd193abf, the commit in the five run manifests.
    git diff shows no change in implementation/, the spec, the trial plan or the runbook between the two, so the
    statement is accurate for the session start but is not the run commit.
  - >-
    O-3 (report, gap G-6): page 1 states the run ids in plan order, all five output_validated / valid, calibration
    n 44, mean -0.26757 and sd 0.97357, fraction_valid 0.977778, census jobs 6657 and 0, and the journal tip. All
