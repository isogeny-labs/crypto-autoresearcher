  verdict_basis: "Every load-bearing quantity of the toy reading is derivable from the specification, the hypothesis and the two job files, and none moves under any admissible reading of the frozen text. The 6657 main-census records match the closed-form design exactly (45 cells, 6657 planned keys, none missing or duplicated, block main only), and all 22 record-invariant checks pass with zero violations. The checks cover schema, prime p of the stated size, prime N with N*P = O on all 1580 distinct curves, one shared curve per (bits, c), the T rule, half-box bookkeeping including the position of the last vector, Cauchy-Schwarz and range bounds tying every recorded C to its D, and the plant feasibility rule. Under the frozen class order, 44 cells are null and one, b20-r3-n4096, is invalid: 4 of its 50 main curves (c = 6, 30, 42, 47) are degenerate, leaving 46 ok records. No cell is underpowered (min M = 3869.35 (77387/20, b28-r2-n256)), every plant is recovered (min plant_kappa 1.2885, min plant_z 21.9), and no cell meets the flag rule (max |kappa - 1| = 0.0414, max |z| = 3.131). The calibration gate over the 45 powered cells passes (mean -0.2716, population sd 0.9631); fraction_valid = 44/45; the flagged set is empty, so the frozen replication rule requires no replication records and the empty toy-rep-jobs.jsonl satisfies it. The reading is O-NULL at analyze-main and O-NULL at analyze-final, and the headline is SUPPORT_SCOPED. Over all 1536 combinations of the admissible resolutions enumerated, no class, gate result, fraction_valid, flagged set, reading or headline changes. The only change found comes from the inadmissible reading that counts degenerate records as present: fraction_valid becomes 45/45, while the reading and headline stay the same."
