      kappa = S/M; z = (S - M)/sqrt(V (1 + 1/20)); the 2000-resample curve-cluster bootstrap 95% interval of kappa;
      plant_kappa and plant_z the same way with the planted counts; plant feasibility on every curve; z_cal = replicate
      0 against replicates 1 to 19 with factor 1 + 1/19; powered (M >= 2500); the class by the frozen order. Across
