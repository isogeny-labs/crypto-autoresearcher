      unknown-sharing base of IDEA-20261017-bbc53e is then not opened by a label predicate at these sizes; the
      growth-in-n question stays with the EXP-PFDR-0b3699 lineage and the idea's real-curve prediction stays untested."

  coordinator_prior: >-
    Written 2026-10-29, before any reviewer of this round ran. It is conditioned on what I have already read: the
    producer's tool strings quoted in DEC-20261022-9aec2b; the audit reader's non-blind exact-rational re-derivation
    (AUD-20261029T012603Z-0b6353 audit-review.yaml), which agreed on every decision field, its 9 small-n job recounts
    and 1580 curve-order certificates; and the interpreter-drift ruling DEC-20261029-5554ee. Because that re-derivation
    read run.py, its agreement is weaker evidence than it looks: a wrong-but-self-consistent reading of the
    specification shared by run.py and a reader who saw run.py would agree with itself.
    J1 (blind re-derivation): I expect S to agree exactly as integers and M, V, kappa, z, z_cal and the plant
    statistics to agree within float tolerance, with all 45 classes, the calibration n and pass, fraction_valid, the
    empty flagged set, the reading and the headline reproduced: probability about 0.88. The most likely residual is a
    specification ambiguity resolved differently by a blind reader (variance divisor, which M decides "powered" for the
    calibration set, z_cal pooling, bootstrap seed and percentile convention); I expect such differences at float or
    interval-width level that flip no class, but put about 0.08 on a difference that flips a class or the reading, and
    about 0.04 on the blind reader being unable to complete for lack of a definition.
    J2a (replay and integrity): python3.11 replay byte-identical to the recorded analysis files and /summary: about
    0.85 (residual: a patch-level or library difference within 3.11, an environment signal, not fabrication); a
    toleranced compare under 3.13 matching every float leaf within rel 1e-9 / abs 1e-12 and every non-float leaf
    exactly: about 0.97; a digest, manifest, run-count, seed or raw/summary defect: about 0.03.
    J2b (measurement fidelity): kernel, curve orders and recounts including n >= 1024 and the planted arm regenerated
    by disjoint code all agree: about 0.92. My most likely defect is in the planted arm (never regenerated
    independently): about 0.05; a kernel defect at large n or near the modulus: about 0.03.
    J3a (power and statistics): at least one powered cell cannot detect a true 10% excess at |z| > 4 with probability
    >= 0.95 (P-detect not uniform over cells): about 0.25. The calibration mean of about -0.27 reflects a real negative
    bias of z under the null rather than chance: about 0.35, and I expect any such bias to change no class. A coherent
    sub-threshold signal (a pooled stratum by r, bits or n with |combined z| > 3): about 0.15. The largest |z| of about
    3.13 among 44 cells is consistent with chance once correlation and any z bias are accounted for: about 0.85.
    J3b (inference and scope): the decision_impact sentence that the implicit-membership route "is then not opened by
    a label predicate at these sizes" proves too much, because a set with kappa near 1 can still be label-describable
    (a uniform subset of the label universe is itself defined by a Legendre-symbol predicate), and must be narrowed to
    pair-sum additive structure of x-labels: about 0.75. The planted arm demonstrates sensitivity only near a 30%
    excess and never exercises the flag, replication and O-STRUCT path: about 0.9 (an observation about the control,
    not a run defect). Near-degenerate ok jobs (many duplicate skips) carry a hidden structure signal: about 0.10.
    Composite: support of H-PFDR-727bfc at the tested toy scope with narrowed wording about 0.55; analyzed with a
    refine next action (a power gap or an unresolved J1 class disagreement) about 0.30; inconclusive or returned to the
    Executor for a defect about 0.10; weaken about 0.05. Expected evidence strength below replicated (one main block;
    the frozen rule required no replication block because nothing was flagged), so a KN-FIND promotion is unlikely to
    be required; a KN-TECH on the instrument is a candidate. Concurrence with this prior is not proof. This prior is
    excluded from the blind owner's inputs (blind_from lists this file).
  prior_recorded_before_reports: true

  joints:
  - id: J1
    joint: >-
      J1 -- BLIND RE-DERIVATION OF THE READING. From the frozen specification, the hypothesis statement and the raw
      census job records alone, the per-cell quantities (n_curves, ok curves, S, M, V, kappa, z, curve-cluster bootstrap
      interval, plant_kappa, plant_z, plant feasibility, z_cal, powered, class), the calibration gate, fraction_valid,
      the flagged set, the replication census that the frozen rule requires, the toy reading at main and final stage
      and the headline are determined, and every cell's validity follows from the records under the frozen invalid
      rule.
    assigned_to: TASK-20261029-2c7b52
    attack_plan: >-
      Work in the prepared blind tree only. (1) Record invariants first: one record per (cell, block, c); block main
      only; c in [0, n_curves) of its cell; bits, r, n consistent with the cell id; p prime of the stated bit length;
      null_C and null_D of length 20; status in {ok, failed_infrastructure, degenerate}; for ok records gap_meta T is the
      least T with ((2T+1)^r - 1)/2 >= ceil(1.02 n) + 8 and enumerated - duplicate_skips - (Q = O skips if recorded)
      equals n; for degenerate records enumerated equals the full half-box. List every violation. (2) Re-derive n_curves
      per cell from the closed-form sizing rule (mu_ref = 3 binom(n,4)/p_ref, p_ref = 0.75 x 2^bits, clamp(ceil(1.5 x
      2500 / mu_ref), 50, 2000)). (3) Compute S, M, V exactly (Fraction), kappa, z = (S - M)/sqrt(V (1 + 1/20)) with
      high-precision square roots, plant_kappa and plant_z the same way, z_cal from replicate 0 against replicates 1 to
      19 with factor 1 + 1/19, using sample variances. (4) Draw your own curve-cluster bootstrap (2000 resamples,
      records sorted by curve index, percentiles 2.5 / 97.5) with a seed you declare before drawing; report the
      interval and its sensitivity to two percentile conventions. (5) Apply cell_classes in order, the calibration gate
      over powered cells, fraction_valid over 45, the flag rule, the replication rule against the actual content of
      toy-rep-jobs.jsonl, the toy reading and the headline. (6) Write an ambiguity table: every place the specification
      is underspecified (sample versus population variance; whether "powered" for the calibration set uses the main M;
      z_cal pooling; bootstrap seed; percentile interpolation; how a degenerate record enters "ok records"; whether a
      cell whose plant is infeasible on one curve is decided before or after power), the resolution taken, and for each
      alternative resolution whether any class, the gate, the reading or the headline changes. Where I think it breaks:
      the variance divisor and the calibration population are the two choices that could move the gate; the bootstrap
      convention could move a cell near an interval edge; a degenerate-versus-ok accounting error would move
      fraction_valid. Freeze every output before writing the report; never read a producer output to compare.
    breaking_artifact: >-
      A frozen, complete blind table plus an ambiguity table in which an admissible resolution of the frozen text
      changes a class, the calibration pass, fraction_valid, the flagged set, the reading or the headline; or a record
      invariant violation in the job records; or an exact statement of which load-bearing quantity cannot be derived
      from the statement and records alone. Agreement with the recorded values is established by the Coordinator at
      composition, not by the blind owner.
  - id: J2a
    joint: >-
      J2a -- EXECUTION INTEGRITY AND REPRODUCIBILITY. The five run records are complete, schema-complete and bound to the
      frozen sources, and the recorded analyze outputs are what the bound driver produces from the recorded census
      records under the recorded interpreter family (exactly under CPython 3.11; within the documented float tolerance
      under 3.13), with seeds, run count, raw/summary agreement and arm comparability as the contract states.
    assigned_to: TASK-20261029-e54312
    attack_plan: >-
      (1) Replay analyze-main and analyze-final under /usr/bin/python3.11 with -B -I, recording sys.version and
      sys.executable, reading the recorded census jobs files, writing only into the task's outputs/ (never under
      experiments/); either through the bound driver's trial entry point with a run directory inside outputs/ or
      in-process through the bound analyze path, stating which. Compare the produced analysis files byte for byte with
      runs/RUN-PFDR-243425/analysis-main.json and runs/RUN-PFDR-089edc/analysis.json, and raw-result /summary leaf by
      leaf. (2) Repeat under python3.13 and compare with a declared tolerance: float leaves rel_tol 1e-9 and abs_tol
      1e-12; ints, strings, bools, nulls, key sets and list lengths exact; label the result matched_within_tolerance,
      never matched. Do not treat the known 2-leaf calibration float difference as a fabrication signal and do not
      require a 3.13 exact match (DEC-20261029-5554ee). (3) Replay the selftest (the one unit the audit did not
      replay) under 3.11 into outputs/ and compare selftest.json and design.json. (4) Re-run check.py on each of the
      five run directories under both interpreters (read-only). (5) Recompute sha256 of every file in the five run
      directories and compare with each execution-receipt.json and with the TASK-20261022-207893 ledger receipt /
      BATCH-8d6d84 dispatch_queue path_sha256; recompute the implementation sources against trial-plan.json
      source_sha256 and manifest code_sha256; check trial_plan_sha256 and python_version in every manifest. (6) Check
      run count (exactly the five planned run ids, in the planned order per the session journal), seeds (every main
      record has c in [0, n_curves) of its cell, block main, no replication or selftest block record in the main jobs
      file), raw/summary agreement (raw-result /summary against analysis top-level fields; flags.json against
      flagged_cells; census /summary counts against a recount of the jobs file), and arm comparability (gap, null and
      plant arms of one record on the same p, a, b_coef, N and n). (7) Check page 1 of
      reports/run-20261023T2211Z/report.pdf against analysis.json (run ids, outcome, headline, calibration) and note
      reports/run-20261022T1218Z/RENDER-BLOCKED.txt. Where I think it breaks: nowhere material; the 3.11 patch level of
      the host may differ from 3.11.15 and must be recorded, not assumed.
    breaking_artifact: >-
      A digest, manifest, run-count, seed, raw/summary or arm-comparability defect with its exact pointer; or a
      non-float leaf difference, or a float difference beyond the declared tolerance, between replay and record under
      either interpreter, with the interpreter recorded; or a report page-1 statement that contradicts analysis.json.
  - id: J2b
    joint: >-
      J2b -- MEASUREMENT FIDELITY. The counts in the job records are the exact counts C and D of the sets the contract
      defines on the curves it defines: the kernel counts correctly at every tested n including n >= 1024, the curve
      orders are as recorded, the log-GAP, null and planted sets regenerate as recorded, and the four degenerate jobs
      are genuinely degenerate.
    assigned_to: TASK-20261029-e54312
    attack_plan: >-
      (1) Sample, by a rule fixed here and not after looking: for every (bits, r) and every n in {1024, 2048, 4096},
      the ok record whose curve index c comes first in the order of sha256("BATCH-924d2c|J2b|" + cell + "|" + str(c));
      plus the same rule for n in {256, 512} at one r per bits (r = bits mod 3 + 1); 33 jobs. For each, regenerate the
      curve, the base points and the gap, null (all 20) and planted sets from the seeding convention (read run.py
      and vendor/curve.py for RNG consumption order only), with your own builder and group-law code, and count C and
      D with your own pair-sum counter that does not call labelsum.c; compare gap_C, gap_D, null_C, null_D,
      plant_m, plant_internal, plant_C, plant_D, plant_feasible and gap_meta field by field. (2) Kernel adversarial
      inputs: compile labelsum.c as the driver does and run it on an arithmetic progression of length n (closed-form C),
      a symmetric set {x, -x} (m_0 = n/2), sets packed in [p - n, p) (wrap-around sums), p just below 2^28 and just
      below 2^31, and random sets at n = 4096, against your counter. (3) Curve orders: on 10 curves per bits, verify
      #E(F_p) = N by an independent method (exhaustive Legendre-symbol point count at 20 bits and on 2 curves at 24
      bits; at 28 bits sympy or pari if installed, else N prime with N > 4 sqrt(p), Hasse bound and [N]P = O for 3 random
      points). (4) The four degenerate records: regenerate their base points and either exhibit a certificate of
      exhaustion (a short relation vector v in [-2T, 2T]^r with v . (P_1..P_r) = O, or the full list of duplicate label
      collisions) or report the regenerated set when it does not exhaust. Where I think it breaks: the planted arm
      (fill and AP ordering, the m search) is the least independently checked object in the run set.
    breaking_artifact: >-
      Any count, label, gap_meta or plant field that differs from the record for a regenerated job; a kernel output that
      differs from an independent count; a curve order that does not certify; a degenerate record that regenerates
      non-degenerate. Each with the exact job key and both values.
  - id: J3a
    joint: >-
      J3a -- POWER AND STATISTICAL SUFFICIENCY OF THE NULL. The null reading is informative: at every powered cell the
      instrument could have detected the P-detect alternative (|kappa - 1| >= 0.10 at |z| > 4), the z statistic is
      calibrated under the null, the largest |z| is consistent with chance, and no coherent sub-threshold departure is
      pooled away by cell-wise testing.
    assigned_to: TASK-20261029-11526b
    attack_plan: >-
      From the recorded analysis.json cells and the main jobs file (non-blind): (1) per powered cell, the minimum
      detectable effect delta_min = 4 sqrt(V (1 + 1/20)) / M and the normal-approximation power at a true 10% excess and
      10% deficit; list every cell where power < 0.95 or delta_min > 0.10; compare with the design claim (power above
      0.95 under Poisson variance) and the measured over-dispersion V / M. (2) The equivalence bound each null cell
      actually establishes (max |ci95 - 1|), so the claim can be stated as "no effect larger than x at cell c". (3)
      Calibration: compute leave-one-out z for every replicate k = 0..19 against the other 19 in every powered cell
      (20 times the calibration draws); estimate the mean and sd of z under the null per cell and pooled; decide
      whether the recorded mean of about -0.27 is chance or a systematic bias (for example skewed counts at small-mean
      cells) and what that bias does to the gap z and to the flag rule's two tails. (4) Tail: the probability of a
      largest |z| >= 3.13 among 44 cells under independence (Sidak) and under the estimated cross-cell correlation
      (cells at one bits share curves; estimate the correlation of per-curve standardized residuals across cells), with
      and without the estimated null bias. (5) Pooled signal: Stouffer and inverse-variance pooled kappa by r, by bits
      and by n, and their heterogeneity; the even/odd A/A (kappa_even, kappa_odd); the null_mean_over_formula ratios.
      Where I think it breaks: the small-M cells at bits 28 and n = 256 (largest relative sd) and any over-dispersed large
      cell may be underpowered at 10%; the calibration mean is the most likely real bias.
    breaking_artifact: >-
      A named powered cell where the frozen flag rule could not detect a 10% departure with probability >= 0.95; a
      demonstrated null bias of z that changes the flag rule's error rates materially; a pooled stratum with |combined
      z| > 3; or a tail probability for the largest |z| below 0.01 after correlation. Each with the computation and
      inputs by pointer.
  - id: J3b
    joint: >-
      J3b -- INFERENCE AND SCOPE. The conclusion drawn from the reading (decision_impact.on_positive: a scoped closure
      of label-describable rank <= 3 log-GAP bases at the toy sizes, the implicit-membership route of KN-OPEN-020 not
      opened by a label predicate at these sizes) follows from an O-NULL reading at the tested scope and does not prove
      too much; the scope statement (toy bits 20, 24, 28; n 256 to 4096; x-labels; this box shape and fill; these seed
      blocks; no transfer) is complete; and the excluded degenerate curves and near-degenerate ok jobs do not hide
      structure.
    assigned_to: TASK-20261029-11526b
    attack_plan: >-
      Run the proves-too-much objects below and read the inference against them. Then: (1) state for each cell n^2/p,
      E[C] per set and n relative to sqrt(p) (the recalled Ahmadi-Shparlinski threshold), and say which regime the
      reading covers and that the cryptographic regime (E[C] far below 1) is not covered; (2) list every object the
      wording could be read to cover and is not tested (translated or other-shaped boxes, both lifts, y-labels, other
      models, non-log-GAP bases, h >= 3, n above 4096, p above 2^28, standardized curves); (3) per job, compare gap_C /
      mean(null_C) for ok jobs in the top decile of duplicate_skips against the rest within each (bits, r), and state
      what the 4 degenerate jobs (a short group relation among the base points, if J2b-independent reasoning confirms
      it) imply for the invalid cell; (4) state whether the four asymptotic promotion gates and the exemplar-claim
      checklist apply (asymptotic_claim is null; no exponent is claimed) and which heuristic-validation obligations do
      apply; (5) state whether the hypothesis can move to supported on this run set without a replication block, given
      the frozen rule required none. Where I think it breaks: the "not opened by a label predicate" sentence.
    breaking_artifact: >-
      A known-false object on which the frozen instrument or the inference returns the null conclusion, with the
      exact sentence of the inference it defeats and the narrowed sentence that survives; an untested object the
      wording covers; a near-degenerate stratum with a departure the pooled kappa hides.

  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      Three fresh independent sessions; none reads another's report, scripts or outputs in this round, and none of them
      is the producer session, the audit reader of AUD-20261029T012603Z-0b6353 or this Coordinator. The blind owner
      (TASK-20261029-2c7b52) additionally reads none of the producer's implementation or outputs, no decision or
      audit that quotes them, not this plan and not its siblings' cards. TASK-20261029-e54312 and TASK-20261029-11526b
      are not blind to the producer: they read the run records, the audit and the decisions, which is what their
      joints require. Blindness is lifted only by a later Coordinator composition, never within the round.
    git_history_rule: >-
      No reviewer uses git history to read another reviewer's work. The blind owner runs in a tree without .git
      (blind_input_route), so commit messages that state the producer's values (which exist on main) cannot reach it.
  proves_too_much:
    assigned_to: TASK-20261029-11526b
    objects:
    - >-
      PTM-1 planted label AP routed through the full frozen classifier: in memory, replace gap_C by plant_C in the
      recorded main records of every powered cell and apply the frozen cell_classes, flag rule and reading (own code, or
      the bound analyze path in-process with outputs in the task's own directory). Known false: these sets are
      additively structured. Then use the even-index curves as discovery and the odd-index curves as a
      pseudo-replication (no new curves; the replication seed block is never touched) and apply the replication rule.
    - >-
      PTM-2 boundary-excess label sets: genuine sets of n labels, a label AP of m labels plus uniform fill with m sized
      so the AP's internal count is about 0.10 and about 0.15 of that curve's null mean, built on main-block curves of at
      least one cell per bits at n = 256 and n = 4096 and of the lowest-power cells found under J3a; count exactly; apply
      the frozen flag rule per cell. Known false: kappa_true is about 1.10 and 1.15.
    - >-
      PTM-3 deficit sets: from a uniform (n + k)-subset of the label universe, greedily remove the k labels in most
      coincidences until n remain, with k chosen so kappa_true is about 0.85; same cells as PTM-2. Known false: kappa
      well below 1.
    - >-
      PTM-4 structured objects with random-like additive energy: (a) a uniform n-subset of the label universe L (its
      membership is decided by a label predicate, the Legendre symbol of f(x)); (b) a geometric progression x_0 g^k
      intersected with L, n terms, g of large multiplicative order in F_p^*. Known false for the inference "kappa near 1
      implies no label predicate decides membership": both are label-describable, and their kappa is measured, not
      assumed.
    - >-
      PTM-5 interval object: a uniform n-subset of the labels of L inside a short interval of F_p. Known false: interval
      sets are additively structured; the instrument must read an excess.
    failure_signature: >-
      PTM-1, PTM-2 (at 1.15), PTM-3 and PTM-5 must be flagged, with the correct sign, at every powered cell tested, and
      PTM-1 must reach O-STRUCT through the pseudo-replication; at 1.10 the flag rate across tested cells must be at
      least the 0.95 the design claims, or the shortfall localizes the cells where a 10% departure of H1 can hide. On
      PTM-4 the instrument is expected to read null; the inference passes only if it refuses to conclude anything about
      label-describability or membership predicates from a null and is narrowed to "the x-label pair-sum coincidence
      count of these log-GAP label sets matches a uniform label set within the measured interval at the tested cells".
      An inference that still concludes "not opened by a label predicate" after PTM-4 has proved too much. An
      instrument that reads null on PTM-1, PTM-2 at 1.15, PTM-3 or PTM-5 has a sensitivity defect that voids the null
      at that cell.
