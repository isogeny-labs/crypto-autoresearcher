  - id: G-3
    gap: >-
      ledger/hypotheses/H-PFDR-727bfc.yaml reads status specified and approval_decision null, while the official status
      by decision record is approved (DEC-20261022-f1efde status_transitions; observed in DEC-20261029-5554ee
