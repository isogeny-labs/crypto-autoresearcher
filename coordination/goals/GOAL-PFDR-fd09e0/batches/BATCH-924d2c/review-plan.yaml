  frozen_outcome_rule:
    source: experiments/EXP-PFDR-bb0d26/specification.yaml /experiment/inputs (cell_classes, calibration_gate, replication_rule, toy_reading_rules, headline); never adjusted after a run
    cell_classes_first_match: >-
      invalid: fewer ok main-census records than n_curves (failed_infrastructure or degenerate), or the design missing;
      inconclusive_underpowered: M < 2500; inconclusive_plant_not_recovered: not (plant feasible on every curve and
      plant_kappa >= 1.15 and plant_z > 4); flagged: |kappa - 1| >= 0.10 and |z| > 4; null: |kappa - 1| < 0.05 and the
      bootstrap 95% interval inside [0.90, 1.10]; intermediate: otherwise. Valid cells: null, flagged, intermediate.
    calibration_gate: 'over powered cells: population sd of z_cal in [0.75, 1.25] and |mean of z_cal| <= 0.35'
    replication_rule: >-
      every flagged cell is re-run on the replication block with its n_curves; it survives iff the replication kappa
      deviates in the same sign, |z| > 3 and |kappa - 1| >= 0.05
    toy_reading_first_match: >-
      O-INVALID: calibration gate fails, or fewer than 50% of the 45 cells are valid; O-STRUCT: at least one flagged
      cell survives replication; O-PENDING-REPLICATION: a flagged cell has no complete replication records (at
      analyze-final read as O-MIXED pending repair); O-NULL: every valid cell is null and at least 80% of the 45 cells
      are valid; O-MIXED: otherwise
    headline_first_match: 'FALSIFY_SCOPED: O-STRUCT; NOT_EVIDENCE: O-INVALID; SUPPORT_SCOPED: O-NULL; INCONCLUSIVE: otherwise'
    decision_impact_on_positive: >-
