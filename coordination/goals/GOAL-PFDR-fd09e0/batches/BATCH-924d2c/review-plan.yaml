  - id: G-6
    gap: >-
      Page 1 of reports/run-20261023T2211Z/report.pdf was not machine-checked (DEC-20261022-9aec2b report.limitation);
      reports/run-20261022T1218Z carries RENDER-BLOCKED.txt. J2a checks page 1.
  export_ruling:
    ruling: excused for this round; not required to be produced before or during the round
    reasons:
    - >-
      An experiment.export/v1 bundle binds a frozen experiment.protocol/v1 record by hash (docs/experiment-protocol.md
      section 5; the checker recomputes the frozen protocol hash). EXP-PFDR-bb0d26 was designed, frozen and approved on
      2026-10-22 in the specification shape and has no protocol.json. Writing one now would present a protocol
      composed after the data as frozen before it, which the no-outcome-after-observation rule forbids; an export
      without it would fail check-export by construction.
    - >-
      The owner rule (AGENTS.md "Experiment protocol, export and review", owner 2026-10-22) is dated the same day as the
      design and approval; the records do not establish which came first within the day, and the ruling does not depend
      on it. At the base commit only one experiment in the corpus (EXP-ECDLP-a9b6a5) carries export.json and
      protocol.json, so the shape was not yet in operational use for specification-shaped experiments.
    - >-
      review-evidence makes a FAILING export an invalid run set; it does not make an absent one invalid. The data an
      export would package (run rows, seeds, statuses, hashes) are read directly by this round from the hash-bound run
      packages, and J2a verifies their digests.
    consequence: >-
      Recorded, not waived silently: the evidence record EV-PFDR-28183c names G-1 among its limitations, and the
      composing decision DEC-20261029-8d9b43 carries a non-blocking next action to package a protocol-less export only
      if tools/experiment_protocol.py admits a specification-bound export, else to record that impediment. No export,
      protocol or review-run record is written by any task of this round.

  composition_rule:
    by: coordinator (re-dispatched after all three reports return); never by a reviewer
    steps:
    - Verify each report's custody (report.yaml present, artifact inventory hashes) and run python3 tools/check_review_independence.py --batch coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c; a FAIL blocks composition and is recorded.
    - Compare the J1 blind table with the recorded analysis.json cells and top-level fields (integers exact; floats within rel 1e-9 / abs 1e-12; ci95 by class outcome, since the bootstrap seed is unspecified). Every disagreement is localized to one of the two implementations, never averaged.
    - 'Validity first: a J2a or J2b break that is material (count, kernel, digest, missing artifact, non-float replay difference) returns the run set to the Executor with the concrete defects; no interpretation follows.'
    - Write experiments/EXP-PFDR-bb0d26/analysis.md as Observation / Comparison / Inference / Limitation, then EV-PFDR-28183c (direction, strength, claim_tier, obstruction block with resource_check, confound_assessment per comparison of the variable ledger), then DEC-20261029-8d9b43 with knowledge_promotion filled.
    pre_committed_mapping:
    - 'All five joints hold: support of H-PFDR-727bfc at the tested toy scope, worded as the narrowest statement PTM-4 allows.'
    - 'J3b breaks only on wording (proves too much): support of the narrowed statement; the broader sentence is recorded as not supported.'
    - 'J3a breaks at some cells (power shortfall at 10%): those cells are reported with the effect size they exclude; if the shortfall is general the decision is refine (analyzed, not supported) with a next action naming the cells and curves needed.'
    - 'J1 disagreement that flips a class or the reading: inconclusive until localized; no support.'
    - 'J2a or J2b material break: invalid run set returned to the Executor; no status change beyond what the defect allows.'
    - 'A pooled sub-threshold departure (J3a) or a near-degenerate departure (J3b): replicate or refine, never support of the uniform-null statement for the affected stratum.'
    hypothesis_update_rule: >-
      If a transition is decided, ledger/hypotheses/H-PFDR-727bfc.yaml is edited in place as precedent does (for
      example H-SEMBIN-97ea23): status set to the decided state; a status_history list appended with backfilled entries
      for approved (ref DEC-20261022-f1efde), running (RUN ids, ref DEC-20261022-9aec2b) and analyzed, and the decided
      entry with ref DEC-20261029-8d9b43; status_note replaced; approval_decision filled with DEC-20261022-f1efde (the
      stale null observed in DEC-20261029-5554ee). No other field is touched. If no transition is decided the file is
      not staged.
    promotion_gates_note: >-
      H-PFDR-727bfc has asymptotic_claim null and claims no exponent, so the four asymptotic-complexity promotion gates do
      not apply; the heuristic-validation obligations do (scale stated, no transfer, heuristic H1 named with its
      validation experiment). J3b confirms or breaks this reading.
  report_contract:
    path_per_reviewer: coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/<TASK-ID>/
    files:
    - report.yaml (required; top-level review_attestation block plus findings per owned joint)
    - scripts/ (every script run, invoked with python3 -I or the named interpreter)
    - outputs/ (every computed table, replay output and log the findings cite)
    attestation: >-
      review_attestation: task_id; joints_owned (exact plan ids); sources_read (every path actually read, repo-relative,
      complete); read_sibling_reports false; blind_from_respected true (TASK-20261029-2c7b52 only); verdicts as a
      mapping from each owned joint id to holds | breaks | inconclusive; procedure_deviations; inference binding
      (backend, model, effort) as served. Plus an artifact inventory (path and sha256 of every file in the directory).
    verdict_meaning: >-
      holds, breaks or inconclusive on the owned joint only; never a verdict on the whole claim or on H-PFDR-727bfc.
      A missing input, route or computation is inconclusive, never holds.

  reserved_ids:
    evidence: EV-PFDR-28183c
    decision: DEC-20261029-8d9b43
    note: Reserved for the composition step; neither is written at opening.
