review_plan:
  round_id: REVIEW-PATH-20261029-3ac467
  opened_by: TASK-20261023-111e6a
  decision: DEC-20261029-71d757
  claim_under_review: >-
    As the producer stated it (IDEA-20261023-f15270 derivation_lemmas, report.md
    section 4): L1 ordered conservation, sum_R T_A(R) = B^n; L2 the convention ratio of
    means B^n/C(B+n-1,n) = n!/prod_{i=0}^{n-1}(1+i/B), between n! exp(-n(n-1)/(2B)) and
    n!, with T_A(R) = sum over multisets mu with sum R of n!/prod(m_j!), and the baseline
    slice C(q+n-1,n)/q^n = (1/n!) prod_{i<n}(1+i/q); L3 for 2R != O, T_S(R) = sum over
    ordered tuples with sum R of 2^j, j the number of 2-torsion entries, so T_S = T_A
    when no such entry; L4 T_M(R) - T_X(R) supported on x-multisets with a double root
    at x(R), with the n = 2 known answers T_A(O) = B and T_M(O) = (B+t2)/2, and the
    cancellation-free count as the coefficient of z^n in
    ((1+z)/(1-z))^((B-t2)/2) (1+z)^t2; L5 coverage c <= min(1, mu_M), c >= mu^2/E[T^2],
    so no base of size B exceeds rate C(B+n-1,n)/N, and the Poisson-null ceilings
    log2(mu/(1-exp(-mu))) at mu = 1/n! equal 0.346, 0.119, 0.030, 0.006 for n = 2..5;
    L6 given T1, the generic complete-split probability of S_{n+1} is
    2^{1-n}(1 + O(n/sqrt Q)) = 1/|G| for G = (Z/2)^{m-2} regular, 1 on the factor-base
    locus, so exact over proxy is 2^{n-1}; L8 2^{n-1} = q^{Theta(1)} forces
    n = Theta(log q), and a genuine 2^{n-1} gain in the rate 1/n! would change
    log_q(1/rate) by the relative amount ln 2/(ln n - 1), tending to 0.
  coordinator_prior: >-
    Recorded before any report. L1, L2 and L5: hold, probability about 0.9 each; L2's
    bracket and the baseline slice are elementary. L3: holds, about 0.85; the most
    likely defect is the 2^j bookkeeping when 2R = O is excluded but t2 > 0. L4: about
    0.75; the most likely break in the whole round is here, in the double-root
    accounting or the (1+z)^t2 factor of the cancellation-free generating function. L6:
    holds, about 0.85, but I expect the error term to come out sharper than stated: with
    the x_i independent, P(chi = +1) = 1/2 + delta with |delta| <= 1/sqrt Q, the
    first-order terms cancel in p_plus^n + p_minus^n, and the relative error is
    O(n^2/Q). A sharper term is a refinement, not a break; a different leading value is
    a break. L8: holds qualitatively, about 0.8; the exact relative-change expression may
    differ, which I would read as a refinement if the conclusion (no exponent-class
    change) stands. Overall about 0.6 that every joint holds as stated, about 0.85 that
    no joint breaks in a way that changes a provisional value of EXP-MONO-1a1be2.
  joints:
    - id: J1
      joint: conservation and the convention ratio of means (L1, L2, baseline slice)
      assigned_to: TASK-20261029-3ac467
      attack_plan: >-
        Card Q1. Derive sum_R T_A and sum_R T_M from the definitions for an arbitrary
        finite abelian group and symmetric subset; derive their ratio and its two-sided
        bound in B; specialise to B = q, N = q^n. Corroborate by brute force on two
        groups of your own choice (one cyclic, one not) with a symmetric subset that
        contains a 2-torsion element. I expect any break in the lower bound of the
        bracket, not in the ratio.
      breaking_artifact: a group, subset and n where the derived ratio or bracket fails, with the script and its output
    - id: J2
      joint: sign-class and x-multiset conventions, n = 2 known answers, cancellation-free count (L3, L4)
      assigned_to: TASK-20261029-3ac467
      attack_plan: >-
        Card Q2. Build the map from (ordered x-tuple, sign vector) to ordered point
        tuples yourself and count its fibres with 2-torsion entries present; derive
        T_S - T_A. Derive T_M - T_X from root multiplicities. Derive the n = 2 counts at
        the identity. Derive the generating function of multisets with no pair summing
        to O, with 2-torsion present. Corroborate by brute force on two small curves of
        your own over a prime field and one over F_{p^2}, at least one with t2 = 3. I
        expect a break, if any, in the 2-torsion handling.
      breaking_artifact: a curve, base, n and target where a derived identity fails, with the script and output
    - id: J3
      joint: the coverage cap and its Cauchy-Schwarz floor, and the Poisson-null ceiling table (L5)
      assigned_to: TASK-20261029-3ac467
      attack_plan: >-
        Card Q3. Derive the best upper bound on coverage from the first moment and a
        lower bound from the second; decide whether any base of size B can exceed the
        bound; compute mu/(1 - exp(-mu)) at mu = 1/n!, n = 2..5, to three decimals in
        log2. Then apply the bound to object O1 of the card. I expect this joint to hold.
      breaking_artifact: a base whose coverage exceeds the derived cap, or a ceiling value that differs in the third decimal
    - id: J4
      joint: the generic complete-split probability and the proxy ratio (L6, given the premise KN-FIND-bdcd60 (3) over F_Q)
      attack_plan: >-
        Card Q4. From the Frobenius rule as a premise, derive the probability that the
        fibre splits completely for x_i independent and uniform in F_Q, with its error
        term in Q and n, and its value on the locus x_i = x(P_i), P_i in E(F_Q); derive
        the ratio of the exact incidence count to a model that multiplies each fibre's
        root count by that probability. Corroborate numerically over F_{p^2} and F_{p^3}
        with your own S_3, S_4 by resultants. I expect the error term to be the place a
        disagreement appears; see the prior.
      assigned_to: TASK-20261029-3ac467
      breaking_artifact: a leading value other than the producer's, or a field and n where the numeric frequency is many SE from the derived one
    - id: J5
      joint: the quantifier and exponent-class statement (L8)
      assigned_to: TASK-20261029-3ac467
      attack_plan: >-
        Card Q5. With n = c log2 q, derive the order of log_q(n!) and of log_q(2^{n-1}),
        and the relative change in log_q(1/rate) caused by multiplying the rate 1/n! by
        2^{n-1}; state whether that change is an exponent-class change. I expect the
        qualitative answer to hold and the constant to be the only possible disagreement.
      breaking_artifact: a regime of (n, q) in which a 2^{n-1} rate factor changes the exponent class
  blindness:
    mutual: true
    lifted_for: []
    rationale: null
  proves_too_much:
    objects:
      - O1 a structured base of the same size as a matched random base (KN-FIND-007 measured a Sidon base at 1.1071 times matched random coverage over F_p)
      - O2 tuples on the factor-base locus, x_i = x(P_i) with P_i in E(F_Q)
      - O3 a non-symmetric base (one point per +- pair, so D != -D)
      - O4 n = 1
    failure_signature: >-
      O1: an argument that concludes no base can beat a matched random base in coverage
      proves too much; a correct cap allows coverage up to min(1, mu), above
      1 - exp(-mu). O2: an argument that yields the generic split probability on the
      locus proves too much; a correct one gives 1 there because every chi(f(x_i)) is +1.
      O3: an argument that yields T_S = T_A without using D = -D proves too much. O4: an
      argument that produces any factor other than 1 between conventions at n = 1 proves
      too much.
    assigned_to: TASK-20261029-3ac467
