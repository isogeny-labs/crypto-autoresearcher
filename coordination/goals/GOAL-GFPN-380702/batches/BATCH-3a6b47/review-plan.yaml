review_plan:
  claim_under_review: The archived producer/custodian records four returned R2-r5 packages and a report, 771
    bound source paths. G3 raw run_status is failed, failure_class infrastructure_error and gate_pass false;
    the original report records checker PASS, whereas the archived isolated checker output is FAIL. G4 was
    launched after failed G3. These exact source claims are reviewed for custody and frozen gate correspondence
    only, not scientific validity.
  coordinator_prior: Exact custody and a procedural no-go are archived. Future independent checker/package
    replay is required to test correspondence with recorded outputs; environment unavailability may leave it
    inconclusive. G3 infrastructure status, checker discrepancy, G4 sequencing and R2b-r5 no-go remain preserved
    regardless of replay outcome. Agreement with the prior is not scientific confirmation.
  joints:
  - joint: Independent checker/package replay and custody
    assigned_to: TASK-20261027-3bdae9
    attack_plan: Independently reconstruct and hash-check the four frozen package inventories, then perform
      the four exact unchanged r5 checker invocations under verification_replay, including its frozen environment/protocol
      and preservation limits. Retain full commands/stdout/stderr/exits and compare with historical report
      and isolated outputs. Missing route/environment, input or timeout must remain failed/inconclusive; static
      reading cannot replace this mandated replay.
    breaking_artifact: A precise path/hash or replay discrepancy, unchanged checker FAIL, or exact environment/route
      unavailability; no source-only PASS substitutes for a replay.
  - joint: G3 comparator infrastructure and diagnostic scope
    assigned_to: TASK-20261027-bbcdb9
    attack_plan: Read pinned raw G3 manifest and archived diagnostic command/output/environment hashes. Distinguish
      the historical report PASS, raw failed/gate=false, later isolated FAIL and empty-directory sufficiency
      control. Attempt to derive original directory presence from these sources; report it unknown if unsupported.
      No scratch replay or environment provisioning.
    breaking_artifact: An unsupported transfer from diagnostic sufficiency to original-run state or mathematical
      negative.
  - joint: G4 sequencing and frozen admission
    assigned_to: TASK-20261027-f8177e
    attack_plan: Compare pinned G3/G4 timestamps/manifests, frozen DP-2/DP-3/DP-4/RB-4 predicates and completed
      producer release; locate the earliest failing admission predicate. Check the already archived eleven
      not_attempted slots without creating directories.
    breaking_artifact: A post-failed-gate package accepted as satisfying frozen post-gate admission, or a no-go
      slot incorrectly treated as an observed trial.
  - joint: Blind admission-predicate reconstruction
    assigned_to: TASK-20261027-db7bda
    attack_plan: From frozen handoff/trial-plan predicates and raw manifests alone, independently produce a
      predicate truth table for DP-2/DP-3/DP-4 and G1-G4; cite exact fields and unknowns without reading producer
      report, implementation, prior interpretation or sibling reports. No program replay.
    breaking_artifact: A contradiction between independently derived raw-field predicate vector and producer/procedural
      narrative, or insufficient raw fields to derive a cell.
  blindness:
    mutual: true
    lifted_for: []
    rationale: Four fresh independent sessions; no sibling reports.
  proves_too_much:
    objects:
    - A package launched after raw G3 failed/gate_pass=false is labeled as satisfying frozen post-gate admission.
    - A custody receipt is substituted silently for the missing literal old Phase-B receipt.
    - Adding an empty certificates directory in a later scratch diagnostic proves it existed in the original
      run.
    failure_signature: All three inferences must be refused or explicitly unresolved; any acceptance invalidates
      the applicable joint.
    assigned_to: TASK-20261027-f8177e
  blind_rederivation:
    required: true
    quantity: DP-2/DP-3/DP-4 and G1-G4 admission truth table from exact frozen predicates and source-bound
      raw manifest fields, retaining unknown cells.
    parameters:
      checked_head: 27256e880ee2f7838b5aba2eaf193826148d2934
      raw_run_ids:
      - RUN-GFPN-4d1ac0
      - RUN-GFPN-d98707
      - RUN-GFPN-347fde
      - RUN-GFPN-0037fb
      predicate_handoff: ledger/handoffs/TASK-20260925-23c435.yaml
      trial_plan: experiments/EXP-GFPN-05ff43/trial-plan-v2-r5.json
    blind_from:
    - experiments/EXP-GFPN-05ff43/execution-report-v2-r5.yaml
    - experiments/EXP-GFPN-05ff43/implementation-v2-r5/
    - experiments/EXP-GFPN-05ff43/reports/review-DEC-20261011-94aad3/
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20261010-0fda2f/content-first-receipt.json
    - ledger/decisions/DEC-20261011-94aad3.yaml
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-3a6b47/reviews/TASK-20261027-3bdae9/
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-3a6b47/reviews/TASK-20261027-bbcdb9/
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-3a6b47/reviews/TASK-20261027-f8177e/
    assigned_to: TASK-20261027-db7bda
  procedure_deviations: []
  scope_boundary: Administrative routing preparation now; future independent review includes mandatory bounded
    checker/package replay owned solely by TASK-20261027-3bdae9, plus the other frozen source/gate joints.
    maximum_runs:0 prohibits new scientific trials; it does not prohibit the exact verification_replay declared
    by that future review card. No replay now, new producer/solver run, scientific status transition, new EV
    record, protocol amendment or launch permission.
  dispatch_gate: All four review cards stay blocked until source/envelope snapshot and publication verify,
    an exact review-adversarial/xhigh model and fresh independent sessions are admitted, frozen source hashes
    pass, and the checker owner has the exact frozen replay environment/route admitted. No checker/package
    replay runs during packet preparation.
  verification_replay:
    owner_task_id: TASK-20261027-3bdae9
    purpose: Mandatory bounded independent checker/package replay required by DEC-20261011-94aad3; verification
      of existing frozen packages, zero new scientific trials.
    execution_state: not_started; card remains blocked
    source_commit: 27256e880ee2f7838b5aba2eaf193826148d2934
    entrypoint: experiments/EXP-GFPN-05ff43/implementation-v2-r5/r5_check_run.py
    code_and_protocol_bindings: coordination/goals/GOAL-GFPN-380702/batches/BATCH-3a6b47/source-bindings.json
    package_bindings: Existing completed custody receipt provides all 771 original path/blob/SHA256 bindings;
      use only its four named package trees and recorded raw files.
    ordered_package_ids:
    - RUN-GFPN-4d1ac0
    - RUN-GFPN-d98707
    - RUN-GFPN-347fde
    - RUN-GFPN-0037fb
    command_template:
    - <admitted_exact_python_executable>
    - -B
    - experiments/EXP-GFPN-05ff43/implementation-v2-r5/r5_check_run.py
    - <absolute_own_scope>/replay-workspace/experiments/EXP-GFPN-05ff43/runs/<RUN-ID>
    working_directory: <absolute_own_scope>/replay-workspace, preserving original repository-relative code,
      amendment, plan and package layout. No imports from mutable live source.
    environment:
      profile_source: experiments/EXP-GFPN-05ff43/reports/review-DEC-20261011-94aad3/diagnostic.json
      archived_checker_python_executable: /Users/adamburan/.pyenv/versions/3.12.8/bin/python3
      required_python_version: 3.12.8
      required_python_flint_version: 0.9.0
      recorded_PYTHONPATH: /private/tmp/gfpn-flint
      PYTHONDONTWRITEBYTECODE: '1'
      original_producer_python_version: 3.11.15 per pinned package environment.json; distinct from archived
        checker profile, never silently substituted.
      route_gate: Before unblocking, Coordinator must bind and verify exact interpreter/dependency bytes, versions,
        frozen checker/protocol hashes and runnable route matching this archived checker profile. Historical
        absolute paths are not assumed available here. Any relocation requires an explicit recorded exact-byte
        route binding; no silent local Python, library, protocol or checker substitution. Missing or unverifiable
        environment means unavailable/inconclusive; do not install/provision or weaken the target.
    limits:
      maximum_new_scientific_trials: 0
      maximum_top_level_checker_invocations: 4
      maximum_seconds_per_invocation: 300
      aggregate_wall_clock_seconds: 1200
      maximum_memory_gb: 2
      concurrency: 1
      nested_processes: Only unchanged frozen-checker subprocesses and certificate verification invoked by
        the exact r5 entrypoint. No producer, driver, solver, comparator generation, new random/sample input
        or missing-artifact regeneration.
    preservation: Materialize byte-identical scratch copies only under this task write_scope; verify before
      and after against frozen source hashes. Never add missing certificates/ directories, fill artifacts,
      repair files or change originals. The G3 absence is a verification input, not a repair request. No extra
      diagnostic variants are authorized.
    outputs:
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-3a6b47/reviews/TASK-20261027-3bdae9/replay-results.json
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-3a6b47/reviews/TASK-20261027-3bdae9/replay.stdout.txt
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-3a6b47/reviews/TASK-20261027-3bdae9/replay.stderr.txt
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-3a6b47/reviews/TASK-20261027-3bdae9/replay-environment.json
    outcome_rules:
      completed: Retain all four exact commands, environment hashes/versions, input/output hashes, stdout,
        stderr, exit codes and comparison with archived outputs. Exit zero does not cure raw gate=false or
        sequencing no-go.
      checker_failure: Record failed checker result verbatim, identify source-bound discrepancy; do not erase
        or retry with changed artifacts/environment. A correct reproduction of historical FAIL is not a scientific
        negative.
      unavailable_or_timeout: Record per-package not_attempted/unavailable/timeout and a failed or inconclusive
        joint with exact missing route/dependency/resource; no holds/PASS based solely on source reading. No
        automatic repair or retry.
