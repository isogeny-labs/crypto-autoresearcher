<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460">
<rect width="1100" height="460" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b40}.head{font-size:24px;font-weight:bold}.title{font-size:18px;font-weight:bold}.body{font-size:15px}.small{font-size:13px}</style>
<text x="25" y="35" class="head">Proposed classical constructor screen — no experiment executed</text>
<rect x="25" y="65" width="310" height="170" rx="12" fill="#eef4fb" stroke="#708da9"/>
<text x="42" y="94" class="title">Public Miller primitive</text><text x="42" y="122" class="body">Binary D recurrence; Z(R) = −D_r(R)/r</text><text x="42" y="149" class="body">Existing zeta / cocycle prior art</text><text x="42" y="176" class="body">O(log r) charged group/field work</text><text x="42" y="203" class="body">No scalar truth or orbit table</text>
<path d="M336 150 L376 150" stroke="#708da9" stroke-width="3"/><polygon points="376,150 364,143 364,157" fill="#708da9"/>
<rect x="380" y="65" width="325" height="170" rx="12" fill="#fff4e9" stroke="#ba8c52"/>
<text x="397" y="94" class="title">x-sensitive branch selector</text><text x="397" y="122" class="body">c = Z(P)/y(P)</text><text x="397" y="149" class="body">g = Z + cy[α + βc(x − x(P))]</text><text x="397" y="176" class="body">H = (1 − χ(g(R)/g(P)))/2</text><text x="397" y="203" class="body">40 fixed public α, β templates</text>
<path d="M706 150 L746 150" stroke="#ba8c52" stroke-width="3"/><polygon points="746,150 734,143 734,157" fill="#ba8c52"/>
<rect x="750" y="65" width="325" height="170" rx="12" fill="#edf6f1" stroke="#5a9781"/>
<text x="767" y="94" class="title">Fixed F11 acceptance screen</text><text x="767" y="122" class="body">12 generators × 13 points × 40 arms</text><text x="767" y="149" class="body">6,240 planned cases before controls</text><text x="767" y="176" class="body">Exact two-pulse law + exceptions</text><text x="767" y="203" class="body">Undefined is retained as failure</text>
<rect x="25" y="265" width="1050" height="96" rx="12" fill="#f8ebec" stroke="#ad6970"/>
<text x="42" y="294" class="title">Derived guard against repeating the simpler decoder</text><text x="42" y="321" class="body">On F11, 5P and 6P have the same Z/y = 8 but opposite χ(y) signs. Every y·F(Z/y) character rule fails.</text><text x="42" y="345" class="small">β = 0 is a known-false control; this local obstruction does not cover x-sensitive or general coordinate circuits.</text>
<text x="25" y="398" class="body">Finite success advances one circuit to an ordering-proof question. Failure resolves only the frozen template.</text><text x="25" y="426" class="small">No fresh cohort, uniform ordering proof, complexity advantage, novelty verdict or scientific status transition is supplied.</text>
</svg>