<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#23445d"/></marker></defs><rect width="1000" height="540" fill="#fff"/><g font-family="DejaVu Sans,sans-serif" fill="#18384d"><text x="32" y="38" font-size="24" font-weight="bold">J-native-coverage: source accounting, zero native runs</text><text x="32" y="67" font-size="16">Source A fe01ccd83283 | TASK-20261027-c524d5 | Static derivation only</text><g stroke="#23445d" stroke-width="2" fill="#eaf4fb"><rect x="30" y="100" width="270" height="105" rx="8"/><rect x="350" y="100" width="270" height="105" rx="8"/><rect x="670" y="100" width="300" height="105" rx="8"/></g><g font-size="18"><text x="48" y="131">Fresh validation Ops</text><text x="48" y="160">base rP + every rQ</text><text x="48" y="187">V = (m+1) h(r)</text><text x="368" y="131">Fresh Table Ops: setup</text><text x="368" y="160">build + fill, snapshot S</text><text x="368" y="187">rho setup is zero</text><text x="688" y="131">Target delta C_i - C_(i-1)</text><text x="688" y="160">solve + internal checks</text><text x="688" y="187">+ wrapper verification</text></g><path d="M620 152H666" stroke="#23445d" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="236" width="940" height="45" rx="7" fill="#dceede"/><text x="52" y="265" font-size="20">Full-native group invocations = V + S + sum(target deltas) = V + C_final</text><g font-size="17"><text x="45" y="323">C op / dbl / batch</text><text x="373" y="323">C mul / verify / membership</text><text x="45" y="351">adapter op: once per lane</text><text x="373" y="351">Ops.scalar: binary add / double</text></g><g fill="none" stroke="#23445d" stroke-width="2" marker-end="url(#a)"><path d="M245 339L710 395"/><path d="M610 339L760 395"/></g><rect x="650" y="395" width="320" height="66" rx="8" fill="#eaf4fb" stroke="#23445d" stroke-width="2"/><text x="668" y="423" font-size="18">Ops.add entry: increment once</text><text x="668" y="449" font-size="17">then identity / inverse / double</text><text x="32" y="416" font-size="16">Assignment of O or a first fixed-base term: zero adds.</text><text x="32" y="444" font-size="16">Scalar/field diagnostics are nested; never add to total.</text><text x="32" y="497" font-size="17" fill="#8b3d22">No replay, past-count qualification, clock or advantage follows from this diagram.</text><text x="32" y="524" font-size="14">Assumes complete cell records, one worker and no uint64 wrap. All source hashes in review.json.</text></g></svg>