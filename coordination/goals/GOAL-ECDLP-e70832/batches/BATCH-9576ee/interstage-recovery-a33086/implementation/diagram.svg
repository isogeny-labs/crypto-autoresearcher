<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="300" viewBox="0 0 1050 300"><rect width="1050" height="300" fill="white"/><g font-family="sans-serif" fill="#172b40"><text x="28" y="32" font-size="21" font-weight="bold">Bounded receive choice at the stage boundary</text><rect x="28" y="60" width="300" height="136" rx="9" fill="#fff1e7" stroke="#bc6630"/><text x="45" y="91" font-size="18">OLD: no open arm</text><text x="45" y="125" font-size="18">server receive budget = 5 s</text><text x="45" y="157" font-size="15">Postprocessing may outlast it</text><path d="M340 124 H400" stroke="#314b63" stroke-width="3"/><rect x="412" y="60" width="590" height="136" rx="9" fill="#edf5ff" stroke="#386e9d"/><text x="432" y="91" font-size="18">NEW: every server receive uses quiet_timeout</text><text x="432" y="125" font-size="17">Existing finite frozen stage allowance + grace + 5 s</text><text x="432" y="157" font-size="15">Per-message monotonic deadline and framing retained</text><text x="28" y="236" font-size="16">Client coordination remains 5 s. No timeout is made infinite.</text><text x="28" y="269" font-size="15">Static implementation diagram; OLD/NEW behavioral controls belong to the independent review.</text></g></svg>