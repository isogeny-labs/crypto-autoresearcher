review_plan:
  recorded_at: '2026-10-30T17:18:15.496721+00:00'
  claim_under_review: For every valid cold input and fixed limits, if the bound baseline refute routine returns
    refuted, the specified active-only routine returns the identical ordered multiplier-certificate vector at
    no more insertion attempts and within the same row cap.
  coordinator_prior: Standard restriction is sound; the exact cold source simulation appears plausible but cap
    ordering, certificates or interleaving may break it. No cost, PC completeness, degree or ECDLP improvement
    is presumed. This is a local identity/source audit, not breakthrough/closure review.
  joints:
  - joint: algebraic_identity
    assigned_to: TASK-20261030-94b46f
    attack_plan: Derive absent-variable specialization and lifting of exact ordered multiplier identities in the
      Boolean quotient. Attack a proposed fixing of inactive model bits rather than keeping them free.
  - joint: source_invariant
    assigned_to: TASK-20261030-94b46f
    attack_plan: Find and prove the invariant needed for the actual OR-monomial arithmetic, normalization and
      exact pivot lookup. Try cancellation, zero rows and certificates with several nonzero generator components;
      do not assume a division-based pivot rule.
  - joint: ordered_simulation
    assigned_to: TASK-20261030-94b46f
    attack_plan: Derive or break the implication of identical successful ordered certificates for the literal
      generator order, FIFO and original active-index order. Attack irrelevant queued rows interleaved with useful
      rows, duplicate/dependent generators and equal leading degrees.
  - joint: cap_semantics
    assigned_to: TASK-20261030-94b46f
    attack_plan: Audit attempted++ before cleaning/degree checks, overflowing attempts, early generator refutation,
      row_cap0, degree_cap0, zero/constant and above-cap generators. Establish exact quantifier and attempt-count
      comparison or show a breaking artifact.
  - joint: negative_controls
    assigned_to: TASK-20261030-94b46f
    attack_plan: Work all-active and empty-support cases, mixed-mask warm start, reordered active variables, cross-pivot
      alternatives and support computed from only accepted rows. Separate premise violation from a valid-input
      counterexample. Reject the claim that the selected strategy is complete degree-D PC.
  - joint: model_and_cost_scope
    assigned_to: TASK-20261030-94b46f
    attack_plan: Prove inactive variables stay free and certificates lift to original labels. Audit why support
      extraction, all-active overhead, changed UNKNOWN outcomes and new learned clauses preclude unconditional
      whole-SAT/full-cost/degree/scalar inference.
  - joint: producer_comparison
    assigned_to: TASK-20261030-94b46f
    attack_plan: After mechanical unblind only, compare the unchanged sealed derivation against the producer notes
      line by line at these seven joints. List every difference, post-reveal correction and unresolved premise;
      no rewriting of the blind artifacts.
  blindness:
    mutual: true
    lifted_for: []
    rationale: One fresh nonproducer reviewer derives from exact claim and source first. Only a prospective native
      sealed-phase release permits producer-note comparison. No sibling or prior-review content.
  proves_too_much:
    objects:
    - 'All variables active: candidate must not be claimed universally cheaper after support extraction.'
    - 'Empty support/all zero generators: no refutation; a nonzero constant obeys ordinary cap semantics.'
    - 'Inactive Boolean bits fixed to zero in returned models: would lose valid free extensions.'
    - 'Mixed-mask warm start, divisibility-based pivot reduction, changed variable/generator order or adaptive
      policies: original cold simulation must not automatically transfer.'
    - UNKNOWN interpreted as proof of non-refutability or equality of whole SAT trajectories.
    - Fewer possible monomials interpreted as lower actual regularity, full cost or a general ECDLP exponent.
    failure_signature: Identify each violated premise/invalid conclusion; supply a symbolic counterexample or
      exact missing obligation where possible. No numerical execution.
