  proves_too_much:
    objects:
    - C=0 gives both unit quotients and dreg0; no strictness below0. Nonzero finite C is an explicit strictness
      premise.
    - b=0 with v=0 in a nonzero finite graded C retains C[q]/q^2; supply a concrete graded-ring equality control,
      labeled an algebraic control rather than a realized chart.
    - b=0 with a quotient C/(v) that kills the highest surviving component provides a contrasting strict control;
      do not claim it is an actual chart without source evidence.
    - a!=0 raw substitution versus appended R distinguishes row-list representation from merely reducing variable
      count.
    - a=0 makes R duplicate N1; prove its outcome independently instead of applying the a!=0 raw-equality argument.
    - Omitting surviving field rows, coefficients outside F_p, ordinary-redundant row deletion, and Boolean x=y+z
      without transformed idempotence must show the missing premises.
    - Constant B=1 makes zero/linear strata literal unit-ideal cases; identity targets, k0, identity k1 and k!=2
      have no theorem under this construction.
    - A generic arbitrary H involving q or A0 invalidates the source-separation premise; explicitly show why a source-aware
      check is load-bearing.
    - Adding auxiliary rows may change C and its Hilbert degrees; no diagnostic2p or p+1 threshold may be carried
      over. No semiregularity or solving-degree equality assumption.
    failure_signature: Reject unsupported uniform strictness, loss of q projection, dependence hidden in H, uncharged
      row deletion or transfer to bit/solver metrics.
