<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310"><rect width="1100" height="310" fill="#f1f6fa"/><g font-family="serif" fill="#16334a"><text x="25" y="34" font-size="23" font-weight="bold">Signed recovery from verified norm roots — unreviewed derivation</text><text x="25" y="62" font-size="17">First recover U; add the finite target coordinate r to the norm support, even outside the interval.</text></g><g fill="white" stroke="#507d98" stroke-width="2"><rect x="25" y="87" width="335" height="120" rx="9"/><rect x="382" y="87" width="335" height="120" rx="9"/><rect x="739" y="87" width="335" height="120" rx="9"/></g><g font-family="serif" fill="#16334a" font-size="18" text-anchor="middle"><text x="192" y="116">Nonbranch, q &gt; 0</text><text x="192" y="145">beta = -A₀(alpha)/B₀(alpha)</text><text x="192" y="176">Orders g+q and g; no square root</text><text x="550" y="116">Nonbranch, q = 0</text><text x="550" y="145">Balanced pair: orders g and g</text><text x="550" y="176">Known target y or checked sqrt</text><text x="907" y="116">Branch: f(alpha) = 0</text><text x="907" y="145">Order min(2 v(A), 2 v(B)+1)</text><text x="907" y="176">One rational two-torsion point</text></g><g font-family="serif" fill="#16334a" font-size="18"><text x="25" y="241">Then subtract exactly -R; verify residual multiplicities, base membership and group sum.</text><text x="25" y="277">Conditional simplification: extra rationality tests only need gcd(A,B) support. Keep every gcd stratum.</text></g></svg>
