research_goal:
  id: GOAL-PFDR-fd09e0
  title: 'Prime-field point decomposition: is any representation or factor-base definition simultaneously
    low-degree and useful, and is the degree-versus-yield tradeoff exponent-relevant (host goal for RQ-PFDR-ae2fba)'
  objective: 'Host RQ-PFDR-ae2fba, which had no goal, and build its decision target: a per-representation
    table for prime-field ECDLP (E/F_p, no Weil descent) whose degree column (first-fall degree, solving
    degree or its lower bound, Macaulay deficit against a support-matched semi-regular null) and yield
    column (decomposition probability, coincidence structure, per-relation cost against a matched random
    base) are measured on the same base, with growth arms in log2 p, and a decision on whether any representation
    shows a degree deficit or yield advantage that grows with p (alive: feeds a costed relation-collection
    contract with the matched Pollard rho control) or whether every effect is constant or tracked by its
    null (scoped kill of the representation channel at the tested scale). The first batch measures one
    yield-side premise: whether label-structured factor bases (windows and rank-d label GAPs) carry pair-level
    group-additive excess below the proven range p^(2/3) (EXP-PFDR-ca5e01, H1 of IDEA-20261017-077f12),
    the quantity IDEA-20261017-bbc53e translates into an exponent shift of the table-table family. Scope
    discipline: public toy curves only, no deployed target, no private key, and no claim about the security
    of any deployed curve in either direction; every cell states its curves, p, base, instrument and budget.'
