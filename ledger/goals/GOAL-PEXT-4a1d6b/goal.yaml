research_goal:
  id: GOAL-PEXT-4a1d6b
  title: >-
    Prime-degree extension descent: what governs the minimum genus of GHS-type covers of E/F_{q^n} for n
    prime, across characteristics (host goal for RQ-PEXT-7c3e91; first batch: the genus floor at n = 7)
  objective: >-
    Understand the mechanism, not build an attack. For E over K = F_{q^n} with n prime, where no field lies
    strictly between F_q and K, establish how Weil restriction and GHS-type covers behave: which
    F_q-structures and which curves (by 2-torsion Galois type, 2-adic valuation of #E(K), j in a subfield or
    not, isogeny class) admit a low-genus cover, why the floor grows with n, and which algebraic quantity
    governs the minimum in odd characteristic and in characteristic 2. The working hypothesis to be tested,
    not assumed, is that the admissible span dimensions m are those of cyclic submodules of
    F_2[x]/(x^n - 1), so that the multiplicative order of 2 mod n, together with the 2-torsion type, sets the
    spectrum and the floor. The first batch extends the existing n = 3 and n = 5 cover censuses and floor
    derivations (aburan28/crypto research/ghs_cubic_cover_census_20261012, ghs_cover_census_n5_20261013,
    odd_char_descent_genus3_20261014, cover_descent_genus_floor_20261015) to n = 7, the first prime where
    x^n - 1 has more than two irreducible factors over F_2 (IDEA-20261024-b58e07). Every result is an exact
    structural statement at toy scale with its claim boundary; nothing is claimed about any deployed curve,
    any key or any cost.
