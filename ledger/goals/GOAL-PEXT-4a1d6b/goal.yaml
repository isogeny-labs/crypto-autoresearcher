  scope_boundary:
    owns: >-
      The general structural theory of descent and covers at prime extension degree n, in every
      characteristic: genus spectra and floors of GHS-type covers by class, the governing invariant, the
      cross-characteristic comparison, and the toy-scale exact censuses and proofs that establish them.
    not_owned:
      GOAL-GFPN-380702: >-
        EcGFp5 / EcMasFp5 over the Goldilocks F_{p^5} at deployed parameters, including its odd-char n = 5
        cover audit (IDEA-20260920-10547b) and its excluded arms (coset bases, torsion quotients,
        Sarkar-Singh, linear-invariance pruning, GRUMPY/FROB/QSP, finite-field-DLP analogy). This goal does
        not reopen any of them and runs nothing on those curves; a general n = 5 floor proved here may be
        cited there by that goal's Coordinator.
      GOAL-ECDLP2M-001: >-
        Characteristic-2 index calculus and descent cost on binary extension fields (relation search, linear
        algebra, descent, solver work, standardized binary curves via its OAKLEY, CERTBIN and NISTBIN areas).
        This goal's characteristic-2 arm computes cover genus and magic numbers at toy n only, as a
        structural control, and prices nothing.
      GOAL-FROB-6333a9: >-
        Frobenius-stable factor bases and WDSat search at n = 41 / 43. Not touched.
      GOAL-SEMBIN-fcb7a2: Nagao's programme and first-fall degree. Not touched.
      GOAL-SEMBIN-5078bc: Semaev 2015 Assumption 1, d_F4 and yield. Not touched.
      GOAL-PFDR-fd09e0: >-
        Prime-field point decomposition with no Weil descent. Disjoint: here n >= 3 is prime and the
        descent is the object.
  claim_boundary: >-
    Toy fields only (q^n up to about 2^22 for censuses; symbolic statements for larger n). A floor is
    reported as derived (paper proof, finite steps kernel-checked where feasible), measured (exact census,
    coverage stated) or open. A genus count does not establish that the cover descends to F_q with a
    transfer injective on the large prime subgroup; that stays open unless separately checked. No attack,
    no speedup, no cost, nothing about any deployed or standardized curve.
  decision_targets:
  - >-
    n = 7 floor table by class (E(K)[2] = 0, Z/2 with #E(K) = 2 mod 4, Z/2 with 4 | #E(K), (Z/2)^2; j in
    F_q or not), each entry derived, measured or open, with attaining structures.
  - >-
    Whether the n = 7 spectrum is m in {1, 3, 4, 6, 7} and whether the floor equals the Lemma D0 bound
    g = n = 7, attained only by split 2-torsion via (m, r) = (3, 7).
  - >-
    Whether one invariant (the factorisation of x^n - 1 over F_2 with the 2-torsion type) explains n = 3,
    5, 7 in odd characteristic and the published characteristic-2 n = 7 genus-7 family; if yes, a general-n
    spectrum lemma; if no, the counterexample and the invariant it points to.
  completion_criteria:
  - >-
    A committed Coordinator decision, after independent review, records the n = 7 floor table of
    RQ-PEXT-7c3e91 with every cell derived, measured (coverage stated) or listed open with its impediment.
  - >-
    A committed Coordinator decision, after independent review, states whether the governing-invariant
    hypothesis holds at n = 3, 5, 7 in odd characteristic and against the characteristic-2 n = 7 control,
    scoped to the tested q, construction and coverage, with any counterexample certificate archived.
  - >-
    Design intake, a proposal, an approved but unrun contract or tooling readiness never satisfies a
    criterion above. Each needs a derivation or an exact measurement with its scope stated.
