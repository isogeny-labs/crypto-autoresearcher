    then snapshot, then an independent round on a review_plan written before any reviewer runs.

    (4) DEFERRED with its arithmetic recorded, not dropped: the odd-characteristic (p >= 3) nearby-object
    control. Sized under TASK-20260913-74b33c and found largely out of reach -- at p = 3 the descended
    generators have total degree 4 with no Frobenius drop and Proposition 2's bound is D = 3p+1 = 10,
    which at (n,m,k) = (9,3,3) needs 7.5 TB by the same accounting that fits p = 2 in 1.5 GB. It
