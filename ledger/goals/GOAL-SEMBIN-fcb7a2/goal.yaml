    AMENDED 2026-09-16 UNDER DEC-20260916-88ac73, SUPERSEDING THE 2026-09-15 WORDING. That wording
    ranked first a zero-compute independent read of the Proposition 5 quantifier question. THAT READ IS
    DONE AND IT OVERTURNED THIS RECORD'S PREMISE. The prior text is superseded rather than deleted:
    it said the source leaves the referent undecided, and the reader found the source decides it.

    WHAT THE READ SETTLED. Proposition 5 bounds the TRUE first fall degree d_F of Definition 5, applied
    to EQS4 = G union S_fe with the field equations INSIDE the generating set, at a stated confidence
    near 0.85-0.9. The argument this record missed: Lemma 6's statement is in d_F and its proof
    (paper_fulltext.md :580-583) bounds the FAKE quantity and converts by Lemma 4, so a d_F statement
    proved through a d'_F bound is this paper's CONVENTION, and footnote 6 deferring Proposition 5 to a
    fake-degree argument says nothing about the statement's referent. Independently: Proposition 5 feeds
    Proposition 6's exponent 4w through Lemma 2 and Assumption 1, both written in d_F. Full account and
    the Coordinator's independent recheck of the supporting algebra: CORR-20260916-96f47d.

    WHAT THAT CHANGES. A measured d'_F > 4 does NOT refute Proposition 5 (Lemma 4 runs d_F <= d'_F, so
    d_F <= 4 < d'_F is consistent); it refutes the paper's ONLY justification at that instance, leaving
    the proposition unproven there. A measured d'_F <= 4 confirms at that instance, conditional on
    Lemma 4 -- which this paper asserts without proof -- and instance-level only. DEC-20260913-8d19e5
    item (d)'s "one-directional refuter" is superseded; the earlier draft head's "confirms, never
    refutes" had the directions right. The both-consequences reporting rule is RETAINED with its basis
    restated: the operative reading is primary and the alternative is a recorded ~0.1-0.15 residual,
    not a co-equal branch.

    STATUS OF THE RANKED LIST BELOW, appended 2026-09-16 under DEC-20260916-6ce039 and
    CORR-20260916-402547. ITEM (1) IS DONE: H-SEMBIN-a7e721 is authored and approved,
    EXP-SEMBIN-4fa22c is frozen at v1 and approved, both DC-1..DC-4 live in the contract's
    success_criterion block as S-1..S-4, and the both-consequences rule is S-5. Both identifier
    reservations are discharged. THE ITEM IS THEREFORE STRUCK FROM THE RANKING AND NOT FROM THE
    RECORD, and its text is retained below unaltered so the constraints it imposed stay readable.

    AND IT IS NOT PROGRESS AGAINST ANY COMPLETION CRITERION. All four of this goal's criteria
    require a committed decision on the evidence of run records or of a read record, and no run
    record exists. Criterion 4 remains the only one MET, by DEC-20260913-8d19e5. What today's work
    changed is REACHABILITY, not status. DEC-20260916-6ce039 claimed to discharge "completion
    criterion 2" and that claim is WITHDRAWN by CORR-20260916-402547: the label came from
    DEC-20260916-88ac73's own work-item checklist and corresponds to no criterion this goal carries.
    The sentence at the end of this field -- that authoring, freezing and approving are not progress
    -- was the accurate record and the decisions were not.

    THE RANKING NOW LEADS WITH ITEM (3): open the campaign's first batch under a new batch id and
    dispatch an executor for EXP-SEMBIN-4fa22c. The executor's FIRST deliverable is the contract's
    own observation-collision audit -- a `search_knowledge` pass for an existing measured first fall
    degree at these parameters -- BEFORE any implementation, because a collision either reframes the
    run as a replication or hands the campaign a disagreement worth more than the run. Item (2)
    remains second and unchanged.

    Ranked work, in the order their answers unblock each other:

    (1) DONE 2026-09-16 (see the status note above). Text retained: author H-SEMBIN-a7e721 and freeze
    EXP-SEMBIN-4fa22c under those reserved identifiers,
    with DESIGN CONSTRAINTS DC-1 THROUGH DC-4 of DEC-20260916-88ac73 written into the contract's
    SUCCESS CRITERIA rather than its prose. DC-1 is the one that changes the campaign: a Boolean-ring
    Macaulay instrument is STRUCTURALLY UNABLE to exhibit d_F > 4, because degree drops produced purely
    by X^2 -> X count toward d_F and are invisible to d'_F, so the instrument may not be described as
    able to refute Proposition 5 and its reachable claim is about the JUSTIFICATION. DC-2: the contract
    declares its convention on condition (1) (the frozen text reads ">= dF" at :401 and :439, which
    taken literally degenerates both quantities and would make Assumption 1 false) and on trivial
    Koszul falls (with S_fe inside, the literal true d_F of any cubic system union S_fe at p = 2 is
    <= 5, so Proposition 5's bound of 4 sits one degree below a trivial ceiling). DC-3: the instance
    includes the coset shifts v_i, which are what distinguishes EQS4 from EQS2. DC-4: the generators are
    the reduced degree-3 descents, since the representative is irrelevant to d'_F and not to d_F.
    Carry forward unchanged from the superseded wording: the both-consequences rule, the Example 1
    fixture (paper_fulltext.md :431-444, supplied verbatim by the frozen text and reproducible by the
    instrument), and the strict-null control (the descent of EQS4 at v = 0 equal coefficient-for-
    coefficient to the descent of EQS2, an identity under Definition 4 rather than an approximation).
    Designing is not approving: the contract sits at approved_by null until a committed Coordinator
    decision approves it under the standing user authorization.

    (2) THEN, zero-compute: read Nagao 2013/549's Lemma 3 and Semaev 2015/310 for the two residuals --
    whether the upstream Lemma 3 supports the INSIDE form of Lemma 4 (whose LITERAL form, field
    equations outside, is verified FALSE by an exhaustively-checked two-polynomial counterexample over
    F_2), and what Semaev's argument delivers as against what his statement says. Both are already
    frozen in inputs/ with sha256 sidecars, and the blind reader was barred from both by design. Ranked
    behind (1) because neither answer can change DC-1, which is the constraint that shapes the
    contract; they bear on how conditional a confirmation is, which the contract records as a
    dependency.

