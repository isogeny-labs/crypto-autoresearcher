  completion_criteria:
  - A committed Coordinator decision reports the RQ-PFDR-ae2fba per-representation table, degree column
    and yield column measured on the same base with growth arms in log2 p, for every representation this
    goal admits, or lists each unreached cell with its impediment. A half-cell (degree without yield on
    the same base, or the reverse) does not satisfy this criterion.
  - A committed Coordinator decision states whether any representation shows a degree deficit or a yield
    or coincidence advantage that grows with p, scoped to the tested curves, p, bases, instruments and
    budget, with the matched null and, for any cost reading, the matched Pollard rho control on the same
    curves.
  - A committed Coordinator decision, after independent review, records the reading of the pair-level
    random model for label-structured bases (H1 of IDEA-20261017-077f12, H-PFDR-011a4b) at its tested
    scope, and its consequence for the delta of IDEA-20261017-bbc53e.
  - Tooling readiness, design intake, an assembled ideation batch or an approved but unrun contract never
    satisfies any criterion above. Each requires a measurement or a derivation with its scope stated.
