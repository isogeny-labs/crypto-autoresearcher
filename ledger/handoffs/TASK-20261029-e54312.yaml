  completion_gate:
  - interpreters.json records sys.version and sys.executable of every interpreter used and the manifest python_version it is compared against.
  - replay-compare.json gives, per replayed unit and interpreter, byte equality of the analysis files and a leaf-by-leaf result (exact or matched_within_tolerance with the tolerance, or the differing pointers with both values).
  - digests.json covers every file of the five run directories and every implementation source; integrity-checks.json covers run count, order, schema, seeds, raw/summary and arm comparability with counts of checks and failures.
  - recount-sample.json lists the 33 sampled job keys with the selection hash order and a field-by-field result; degenerate-certificates.json covers all four degenerate records; kernel-spotcheck.json and curve-orders.json state inputs, method and result.
  - report.yaml carries a top-level review_attestation with task_id TASK-20261029-e54312, joints_owned [J2a, J2b], sources_read (repo-relative, complete), read_sibling_reports false, verdicts {J2a, J2b each holds|breaks|inconclusive}, procedure_deviations and the served inference binding, plus the artifact inventory.
  - No verdict on the whole claim, no status change, no commit, no file outside the write_scope.
  state: queued
