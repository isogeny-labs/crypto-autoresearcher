  objective: >-
    Validate execution integrity, reproducibility and measurement fidelity of the five EXP-PFDR-bb0d26 runs: replay
    analyze-main and analyze-final (and the selftest) under CPython 3.11 with the interpreter recorded and under 3.13
    with a declared float tolerance; verify digests, manifests, run count, seeds, raw/summary agreement and arm
    comparability; spot-check the kernel and curve orders; recount a pre-registered sample of jobs including n >= 1024
    and the planted arm with disjoint code; certify the four degenerate jobs. Report verdicts on J2a and J2b only.
  uncertainty_reduced: >-
    Whether the recorded run records are what the bound code produces from the recorded inputs on the recorded
    interpreter family, and whether the recorded counts are the exact counts of the sets the contract defines. It does
    not decide the hypothesis.
