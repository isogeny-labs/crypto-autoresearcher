    - ledger/handoffs/TASK-20261106-0c8aee.yaml
    - ledger/handoffs/TASK-20261106-4c4831.yaml
    - ledger/handoffs/TASK-20261106-5c1258.yaml
    - ledger/handoffs/TASK-20261106-7c2b01.yaml
