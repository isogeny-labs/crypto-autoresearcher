    - >-
      LA-1 The queue comes first, in its own commit:
      coordination/goals/GOAL-PATH-001/batches/BATCH-69d9a2/dispatch_queue.json only. Push it
      and render it with python3 tools/research_dispatch.py <queue> --ready-only, which must
      pass (OC-1). Record python3 tools/goal_lanes.py lanes GOAL-PATH-001. Then run python3
      tools/goal_lanes.py open-lane GOAL-PATH-001 BATCH-69d9a2 --queue <queue> --decision
      DEC-20261106-843cf7 --objective "EXP-MONO-1a1be2 pre-approval fixes (165da2 findings,
      DEV-1 substitute) and focused re-review; zero runs" --as <addr> --publish. The queue is
      never staged by an archive. No commit message or PR text states a lemma value,
      formula, prediction value, KAT value or prior (PD-1).
    - >-
      LA-2 Before staging, merge origin/main into the working branch; never rebase. Record
      base_commit_checked and merge_outcome. A conflict inside a record stops the archive.
      If origin/main changed ledger/goals/GOAL-PATH-001.yaml, any file under
      experiments/EXP-MONO-1a1be2/, or added a record citing EXP-MONO-1a1be2 or
      H-MONO-23d347, stop and report to a fresh act (spare DEC-20261106-720ace).
    - >-
      LA-3 Goal-head check, mechanical (OC-3). Against the base, the diff of
      ledger/goals/GOAL-PATH-001.yaml may contain only the following:
      - current_batch_id changed from BATCH-8517aa to BATCH-69d9a2;
      - dispatch_queue_path changed to the BATCH-69d9a2 queue path;
      - new keys current_batch_id_before_BATCH-69d9a2,
        dispatch_queue_path_before_BATCH-69d9a2, current_batch_note_2026_11_06,
        open_batches_note_2026_11_06 and next_action_2026_11_06 (under 1,000 characters);
      - one item appended to batch_checkpoints (BATCH-8517aa);
      - one item appended to open_batches (BATCH-69d9a2);
      - one item appended to impediments (IMP-PATH-20261106-1).
      Every other line is byte-identical, including whitespace: check that
      "latest_verified_commit: 67c2e5bf27c3b014e25829554130199d7918ae2b" is unchanged, and
      that the file parses with yaml.safe_load. status stays active. Record the base sha256.
      Any other changed line is a scope finding: stop and report; never hand-repair it in
      this archive. Do not run tools/shard_goal.py.
    - >-
      LA-4 Queue and card check. Each of the six handoffs parses with a non-empty
      objective, deliverables and completion_gate. The queue's embedded handoffs agree with
      the ledger cards on id, role, write_scope, artifact_paths and archived_by. The write
      scope of 4c4831 is disjoint from every expected path of this archive.
    - >-
      LA-5 Identifier check (OC-4). Run python3 tools/allocate_id.py --check on
      DEC-20261106-843cf7, DEC-20261106-720ace, BATCH-69d9a2 and the six TASK ids. Record
      each output.
    - >-
      LA-6 ECC and focus (OC-2). Run python3 tools/ecc_priority.py --classify on RQ-MONO-001
      and GOAL-PATH-001, and --budget-violations, then python3 tools/autoresearch_focus.py
      for GOAL-PATH-001. Record all outputs verbatim. Stop if not ECC or if there is a budget
      violation.
    - >-
      LA-7 Contract and bytes check (OC-5). experiments/EXP-MONO-1a1be2/specification.yaml
      has sha256 d81a85b36961647d6d6caccdf988d5650a7376fa581173f9761ab3ed594bc373 and is
      review_required. The seven CODE_FILES and code/tests/test_kat.py equal the per-file
      hashes in the 7083a8 receipt, and launcher.code_sha256() equals
      e12fe0f3f07dc79bc093d70174cf05dff7ab3fc90f04711f903a56565cb4fd38. The two 165da2 files
      equal the 49716d path_sha256 (code_review.md 4c77c235...c101; review_attestation.yaml
      01d5f958...c0cf). There is no runs/ entry, no approval.lock and no selftest-receipts/.
    - >-
      LA-8 Decision report. Confirm that the six report files exist as specified in
      DEC-20261106-843cf7 visual_report, that report.pdf was opened and every page
      inspected, and that every figure-data.json value names its code_review.md source. If
      no renderer installs, report.pdf is absent, the blocker is stated in report.typ, and
      the receipt records the deviation with fourteen expected paths.
    - >-
      LA-9 Stage exactly the fifteen expected paths, one by one. git add -A, git add . and
      directory adds are forbidden. Run tools/validate_ledger.py and
      tools/check_merge_hygiene.py before committing (OC-6). Record pre-existing errors as
      pre-existing.
    - >-
      LA-10 Input pins. Record in the receipt the sha256 of every file in the inputs list of
      TASK-20261106-4c4831, under input_pins_TASK-20261106-4c4831, at their bytes in the
      merged tree.
    - >-
      LA-11 binding_mode content_at_commit. The commit message names TASK-20261106-0c8aee
      and every record_id literally. It states that nothing is approved, that
      EXP-MONO-1a1be2 stays review_required, that the 165da2 findings are dispositioned
      (counts only), and that there are zero runs. Verify the receipt with
      tools/research_dispatch.py. Push, refresh or open the PR against main ready for review
      naming every record id, and enable auto-merge (gh pr merge <n> --auto --merge).
    - >-
      LA-12 After verification and push, close the lane: python3 tools/goal_lanes.py
      close-lane GOAL-PATH-001 BATCH-8517aa --outcome archived --decision
      DEC-20261106-843cf7 --ledger-commit <this commit> --as <addr> --publish. In a later
      commit, append a tasks_state_revisions entry to the BATCH-8517aa queue recording the
      composition and the lane closure.
    - >-
      LA-13 Release with --outcome completed and --artifact <path>=<sha256> for both
      artifact paths. If any OC fails, stop before staging: nothing in DEC-20261106-843cf7
      takes effect, and a fresh act uses spare DEC-20261106-720ace. Never amend, rebase or
      force-push. Zero runs.
