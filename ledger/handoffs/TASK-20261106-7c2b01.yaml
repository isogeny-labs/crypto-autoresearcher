# Focused independent RE-REVIEW of the EXP-MONO-1a1be2 fixes at the TASK-20261106-5c1258
# commit (blocker B8 of DEC-20261106-843cf7). Validator, review-adversarial, fresh
# independent session. An instrument review, not a claim-changing round, so it has no
# review_plan. Blindness is lifted on purpose: it reads the 165da2 findings it verifies.
# Zero experiment runs.
handoff:
  id: TASK-20261106-7c2b01
  from: coordinator
  to: validator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-69d9a2
  authorized_by: DEC-20261106-843cf7
  objective: >-
    Verify, at the verified 5c1258 commit, that every must-fix of DEC-20261106-843cf7
    (F-1, N-1 to N-5, DEV-1 via FX-16) is closed, that the fixes regress nothing the 165da2
    review found holding, and that the changed code introduces no new defect that would let
    an invalid cell pass as valid or route an instrument defect into a scientific reading.
    Classify each item as closed, not closed or new finding (blocking or non-blocking), and
    give a reproduction for each.
  uncertainty_reduced: >-
    Whether blocker B8 clears: is the instrument the approval will bind free of the 165da2
    defects and of new ones? Nothing about the mathematics.
  inputs:
    - ledger/handoffs/TASK-20261106-7c2b01.yaml
    - ledger/decisions/DEC-20261106-843cf7.yaml
    - coordination/goals/GOAL-PATH-001/review/TASK-20261105-165da2/code_review.md
    - experiments/EXP-MONO-1a1be2/specification.yaml
    - experiments/EXP-MONO-1a1be2/code/
    - experiments/EXP-MONO-1a1be2/implementation/fix-report-4c4831.md
    - experiments/EXP-MONO-1a1be2/implementation/mutant-check-4c4831.json
    - experiments/EXP-MONO-1a1be2/implementation/kat-log-4c4831.json
    - coordination/goals/GOAL-PATH-001/batches/BATCH-69d9a2/archives/TASK-20261106-5c1258/snapshot-receipt.json
    - agents/validator.md
  inputs_note: >-
    Your context is: the decision's code_review_composition, dev1_decision,
    approval_lock_binding_v2 and specification_additions_for_v2; the 165da2 report (read in
    full; blindness.lifted_for: fix verification needs the defect list and repros, with the
    rationale in DEC-20261106-843cf7 batch.review); the 4c4831 card's FX items; and the
    code. Treat the producer's fix report as a claim to check, not as evidence. You may not
    read the producer's session, nor any other file under coordination/goals/GOAL-PATH-001/review/.
  constraints:
    - >-
      RR-1 Byte checks. The commit is clean. These files equal their 72f51766a6 hashes:
      fqn.py, curves.py, semaev.py, kernel.c, make_trial_plan.py, throughput_calibration.py,
      and the specification. Recompute code_sha256 and the test-file hashes, and compare
      them with the 5c1258 receipt. Regenerate the trial plan and confirm its sha256 is
      9ccbe614...fb4a.
    - >-
      RR-2 F-1. Re-run every 165da2 CR-1 refusal scenario (S1 to S15) against the new gate,
      and attack the self-test with each of the following:
      - the hostile root pyproject plus conftest;
      - PYTEST_ADDOPTS -k and PYTEST_PLUGINS in the environment;
      - an installed or path-visible pytest plugin that deselects items;
      - a test file replaced after the lock;
      - one extra skip; one missing item;
      - the 165da2 hand-written receipt;
      - a launcher-written receipt with one env_key field changed;
      - a receipt outside selftest-receipts/;
      - an edited junit.xml;
      - a receipt from a lock with a different sha256.
      Each must refuse with no runs/ entry. Do at least one self-test run inside a FULL
      repository checkout (not sparse), so that the real root conftest is present, and
      confirm the collected count equals EXPECTED_KAT_ITEMS. Confirm that a stubbed
      contract-mode package carries the gate and startup_selftest blocks and the copies,
      and that run_cell(kat=False) without a gate raises.
    - >-
      RR-3 N-1. In a scratch extract, apply the 165da2 M5 edit yourself (kernel.c p_idx, two
      lines). Confirm that the full test_kat.py suite now fails, and on which new items.
      Confirm the vacuity guards are real: at (41, 6) and (29, 7), count the index values of
      at least 2^32 and the nonzero target counts. Re-apply M3 (kernel e_mul, n >= 4) as a
      control, and confirm it is still killed.
    - >-
      RR-4 N-2 and N-5. For each FX-8 and FX-11 item, run its test against the 72f51766a6
      code (it must fail) and against the 5c1258 code (it must pass). Then build one attack
      of your own per item that is not the producer's test. Examples: a recount differ in a
      different array; a STOP-F2 sentinel planted by hand, and arm-A refused while arm-B
      runs; an encoded or symlinked run id; a stray module under a different name.
    - >-
      RR-5 N-3, N-4, DEV-1.
      - Confirm that lambda follows the counted value and that the flag and the withheld
        reading appear on a fabricated mismatch.
      - Confirm that KAT-mode packages omit the four keys.
      - For FX-16, read test_kat_extended.py and kat-log-4c4831.json, and confirm the
        following: q'' follows the rule, and the disjointness test exists; m = 3 at n = 2;
        s = 50; the membership method does not call the kernel; the vacuity guard holds; it
        ran in full. Re-run FX-16 yourself if budget allows. Otherwise re-run it on a
        stated random subset of at least 10 of its 50 targets, with the same
        independent-method rule.
    - >-
      RR-6 Regression. The baseline: the full test_kat.py suite on the committed bytes,
      run under the FX-3 command; record the counts. Spot-check the 165da2 CR-2 seed audit,
      the CR-4 residual withholding in KAT mode and the CR-5 KAT refusal on all 96 (pair,
      arm) combinations; all must still hold.
    - >-
      RR-7 New-code read. Read every changed line of launcher.py and counters.py. Look for
      defects that would let an invalid cell pass as valid or misroute a defect into F7 or
      F8. Examples: a validity status that can be valid while a reason is present; a
      receipt check that compares a field to itself; a skip set that depends on the cwd; a
      sentinel path outside runs/.
    - >-
      RR-8 Zero experiment cells. Every gate call uses a cell id not in the plan, or a
      scratch experiment root. Scratch files stay outside the repository. Write only the
      declared paths. Do not commit. Put no prediction value in any message. Never Bedrock.
  deliverables:
    - "fix_review.md: per RR item, the commands, the outcome, and a table with one row per must-fix (F-1, N-1 to N-5, DEV-1): closed or not closed, with the evidence. New findings carry severity (blocking: could let an invalid cell pass or misroute an instrument defect into a scientific reading; non-blocking: everything else) and a reproduction. Terminal verdict for B8: passed only if every must-fix is closed and no new blocking finding exists."
    - "review_attestation.yaml: task_id, ordered sources_read with extent, the commit reviewed, blindness lifted_for and its rationale, findings summary, verdict, inference fields (requested policy, resolved model, fallback_used, independent_session and its basis), runs_launched 0"
  artifact_paths:
    - coordination/goals/GOAL-PATH-001/review/TASK-20261106-7c2b01/fix_review.md
    - coordination/goals/GOAL-PATH-001/review/TASK-20261106-7c2b01/review_attestation.yaml
  write_scope:
    - coordination/goals/GOAL-PATH-001/review/TASK-20261106-7c2b01
  archived_by: TASK-20261106-649ebb
  inference:
    policy: review-adversarial
    reasoning_effort: null
    reasoning_effort_note: null means the policy default; never below the review floor.
    fallback_allowed: true
    fallback_note: Backend or model substitution only, recorded as fallback_used. Never a cheaper policy, never degraded, never Bedrock.
    degraded_allowed: false
    independent_session_required: true
    independence_note: "A fresh session. Not the session of TASK-20261106-4c4831, TASK-20261105-ac5ad6, TASK-20261029-a97206 or the PR #2707 author, and not the TASK-20261105-165da2 session (fresh eyes on the fixes)."
    delivery: interactive
  budget:
    wall_clock_seconds: 14400
    memory_gb: 16
    maximum_runs: 0
  dispatch_preconditions:
    - {id: VP-1, text: "archived_by TASK-20261106-649ebb is bound."}
    - {id: VP-2, text: "TASK-20261106-5c1258 is completed and verified, and its commit is pushed."}
    - {id: VP-3, text: "A FULL (non-sparse) worktree checked out at the 5c1258 commit is available for RR-2; scratch extracts are used for every mutant."}
    - {id: VP-4, text: "Claim after git fetch: python3 tools/goal_lanes.py claim coordination/goals/GOAL-PATH-001/batches/BATCH-69d9a2/dispatch_queue.json TASK-20261106-7c2b01 --as <addr> --ttl-minutes 300 --publish. Release with two --artifact <path>=<sha256> digests."}
    - {id: VP-5, text: "Fresh validator session satisfying independence_note; the resolved model id contains no 'bedrock'."}
  completion_gate:
    - fix_review.md addresses RR-1 to RR-7, each with its commands and outcome. Its must-fix table covers F-1, N-1 to N-5 and DEV-1, and it gives a terminal B8 verdict.
    - M5 is confirmed killed by the reviewer's own mutant run (RR-3).
    - review_attestation.yaml parses and names the commit reviewed.
    - Zero experiment cells; nothing is written outside write_scope.
  return_format: The two artifact paths with sha256, the B8 verdict, the count of must-fix items closed and not closed, new findings by severity, and the commit reviewed.
  review_plan: null
  review_required: false
  review_required_note: FALSE. This IS the independent re-review of the instrument; it changes no claim.
  runs_launched: 0
