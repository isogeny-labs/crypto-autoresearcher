# Independent code review of the final EXP-MONO-1a1be2 instrument at the
# TASK-20261105-7083a8 commit (blocker B8 of DEC-20261105-f0b7c7). Validator,
# review-adversarial, fresh session. This is an instrument review, not a claim-changing
# round, so it has no review_plan. Zero experiment runs.
handoff:
  id: TASK-20261105-165da2
  from: coordinator
  to: validator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-8517aa
  authorized_by: DEC-20261105-f0b7c7
  objective: >-
    Review the EXP-MONO-1a1be2 code at the verified 7083a8 commit for defects that would
    let an invalid cell pass as valid, or route an instrument defect into a scientific
    reading. Classify each finding as blocking or non-blocking with a reproduction.
  uncertainty_reduced: >-
    Whether the instrument the approval will bind by code_sha256 is free of the kind of
    defect PR #2707 found after the first snapshot. Nothing about the mathematics.
  inputs:
    - ledger/handoffs/TASK-20261105-165da2.yaml
    - experiments/EXP-MONO-1a1be2/specification.yaml
    - experiments/EXP-MONO-1a1be2/code/
    - experiments/EXP-MONO-1a1be2/implementation/kat-report.md
    - experiments/EXP-MONO-1a1be2/implementation/kat-report-ac5ad6.md
    - experiments/EXP-MONO-1a1be2/implementation/throughput-calibration.json
    - ledger/decisions/DEC-20261105-f0b7c7.yaml
    - agents/validator.md
  inputs_note: >-
    Your context is the specification (seeds, arms, controls, invalidation rules), the
    decision's predictions_to_freeze definitions, f1_decision and approval_lock_binding,
    and the code. The review reports under coordination/goals/GOAL-PATH-001/review/ are
    not inputs.
  constraints:
    - >-
      CR-1 Launcher gate. Attempt to start a contract cell under each of these
      conditions: a missing lock; an empty lock; a non-object lock; a null approved_by; a
      wrong specification, code or plan hash; a specification status other than
      approved; omitting --plan. Confirm that each one refuses with no runs/ entry.
      Confirm that code_sha256 covers every file a cell executes. If a module the
      launcher imports is outside CODE_FILES, that is a finding.
    - CR-2 Seeds and plan. Check that every seed string matches the specification's rules, including the A/A replicates (C-aa-baseseed, C-aa-tupleseed) and that tuple_seed_aa is actually consumed by B1. Check that the plan regenerates deterministically and that no seed is reused across roles.
    - >-
      CR-3 KAT strength. In a scratch copy outside the repository, inject a defect into
      the degree-n reduction or the inversion loop for n >= 4 only, in Python and in
      kernel.c separately, and confirm that at least one widened KAT fails. Do the same
      for one large-q path (a 64-bit overflow-style truncation). A mutant that survives is
      a finding.
    - CR-4 Residuals. Check that vii, viii and ix in counters.exhaustive_cell implement the definitions in DEC-20261105-f0b7c7 predictions_to_freeze, including the target set each one ranges over and C_sym's use of the base's own B, t2 and |X|. Check that KAT mode withholds them.
    - CR-5 Discipline. No KAT asserts a predicted value or a cross-convention identity. The KAT refusal covers every arm-A, arm-B and arm-C (q, n) pair. throughput_calibration.py records no count, statistic or residual and never calls launcher cell.
    - CR-6 Arm C. The target sampler follows the specification's rule and the excluded set S. lambda = (N_cf - m_S)/(N - |S|) uses exact rationals. The cdf.json keys match the specification's required artifacts.
    - CR-7 Run zero experiment cells. Unit and KAT invocations and scratch mutants are allowed, and every scratch file stays outside the repository. Write only the declared paths. Do not commit. Put no finding detail that states a prediction value in any message. Never Bedrock.
  deliverables:
    - "code_review.md: per CR item, what was tried (commands), the outcome, and findings with severity (blocking: could let an invalid cell pass or misroute an instrument defect into a scientific reading; non-blocking: everything else) and a reproduction"
    - "review_attestation.yaml: task_id, ordered sources_read, the commit reviewed, findings summary (counts by severity), inference fields (requested policy, resolved model, fallback_used, independent_session), runs_launched 0"
  artifact_paths:
    - coordination/goals/GOAL-PATH-001/review/TASK-20261105-165da2/code_review.md
    - coordination/goals/GOAL-PATH-001/review/TASK-20261105-165da2/review_attestation.yaml
  write_scope:
    - coordination/goals/GOAL-PATH-001/review/TASK-20261105-165da2
  archived_by: TASK-20261105-49716d
  inference:
    policy: review-adversarial
    reasoning_effort: null
    reasoning_effort_note: null means the policy default; never below the review floor.
    fallback_allowed: true
    fallback_note: Backend or model substitution only, recorded as fallback_used. Never a cheaper policy, never degraded, never Bedrock.
    degraded_allowed: false
    independent_session_required: true
    independence_note: "Not the session of TASK-20261105-ac5ad6, TASK-20261029-a97206, or the PR #2707 author."
    delivery: interactive
  budget:
    wall_clock_seconds: 10800
    memory_gb: 8
    maximum_runs: 0
  dispatch_preconditions:
    - {id: VP-1, text: "archived_by TASK-20261105-49716d is bound."}
    - {id: VP-2, text: "TASK-20261105-7083a8 is completed and verified, and its commit is pushed."}
    - {id: VP-3, text: "Worktree checked out at the 7083a8 commit."}
    - {id: VP-4, text: "Claim after git fetch: python3 tools/goal_lanes.py claim coordination/goals/GOAL-PATH-001/batches/BATCH-8517aa/dispatch_queue.json TASK-20261105-165da2 --as <addr> --ttl-minutes 240 --publish. Release with two --artifact <path>=<sha256> digests."}
    - {id: VP-5, text: "Fresh validator session; the resolved model id contains no 'bedrock'."}
  completion_gate:
    - code_review.md addresses CR-1 to CR-6, each with its commands and outcome, and lists every finding with severity and reproduction.
    - review_attestation.yaml parses and names the commit reviewed.
    - Zero experiment cells; nothing written outside write_scope.
  return_format: The two artifact paths with sha256, the count of blocking and non-blocking findings, and the commit reviewed.
  review_plan: null
  review_required: false
  review_required_note: FALSE. This IS the independent review of the instrument; it changes no claim.
  runs_launched: 0
