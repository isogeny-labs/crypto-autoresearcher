# Focused independent RE-REVIEW of the second EXP-MONO-1a1be2 fix round and the DEV-1 cell, at the
# TASK-20261106-dfd0ed commit (blocker B8; DEC-20261106-475620). Validator, review-adversarial,
# fresh independent session. An instrument review, not a claim-changing round, so it has no
# review_plan. Blindness is lifted on purpose: it reads the 165da2 and 7c2b01 reports whose
# findings and repros it verifies. Zero experiment runs.
handoff:
  id: TASK-20261106-941825
  from: coordinator
  to: validator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-a8825c
  authorized_by: DEC-20261106-475620
  objective: >-
    Verify at the verified dfd0ed commit that every must-fix is closed: those of
    DEC-20261106-475620 (N-5 item 5, NF-1 to NF-7 and the receipt clash, via HX-2 to HX-9) and
    DEV-1 (the FX-16 cell, via 96fee7). Verify too that nothing the 165da2 and 7c2b01 reviews
    found holding has regressed, and that the changed code adds no defect that would let an
    invalid cell pass as valid or route an instrument defect into a scientific reading. Classify
    each item as closed, not closed or new finding (blocking or non-blocking), with a
    reproduction for each, and give a terminal B8 verdict.
  uncertainty_reduced: >-
    Whether blocker B8 clears: whether the instrument the approval will bind executes only its
    hashed bytes, records what it executed, and guards the large-Q arm-C path on the executing
    host, and whether the DEV-1 cell ran as specified. Nothing about the mathematics.
  inputs:
    - ledger/handoffs/TASK-20261106-941825.yaml
    - ledger/decisions/DEC-20261106-475620.yaml
    - ledger/decisions/DEC-20261106-843cf7.yaml
    - coordination/goals/GOAL-PATH-001/review/TASK-20261105-165da2/code_review.md
    - coordination/goals/GOAL-PATH-001/review/TASK-20261106-7c2b01/fix_review.md
    - experiments/EXP-MONO-1a1be2/specification.yaml
    - experiments/EXP-MONO-1a1be2/code/
    - experiments/EXP-MONO-1a1be2/implementation/fix-report-2b7223.md
    - experiments/EXP-MONO-1a1be2/implementation/mutant-check-2b7223.json
    - experiments/EXP-MONO-1a1be2/implementation/kat-log-2b7223.json
    - experiments/EXP-MONO-1a1be2/implementation/dev1-report-96fee7.md
    - experiments/EXP-MONO-1a1be2/implementation/dev1-kat-log-96fee7.json
    - experiments/EXP-MONO-1a1be2/implementation/dev1-junit-96fee7.xml
    - coordination/goals/GOAL-PATH-001/batches/BATCH-a8825c/archives/TASK-20261106-dfd0ed/snapshot-receipt.json
    - agents/validator.md
  inputs_note: >-
    Your context consists of: the decision's re_review_composition, dev1_decision_v2, V2-5,
    V2-6 and approval_records_v2_1; DEC-20261106-843cf7's approval_lock_binding_v2 and
    specification_additions_for_v2; the 165da2 code_review.md and the 7c2b01 fix_review.md,
    read in full (blindness.lifted_for: fix verification needs both defect lists and their
    repros; rationale in DEC-20261106-475620 batch.review); the 2b7223 and 96fee7 cards; and
    the code. Treat the producers' reports and logs as claims to check, not as evidence. Do not
    read either review_attestation.yaml, any other file under
    coordination/goals/GOAL-PATH-001/review/, or any producer session.
  constraints:
    - >-
      RR-1 Byte checks. The commit is clean. These files equal their 9a0b5955 hashes: fqn.py,
      curves.py, semaev.py, counters.py, kernel.c, make_trial_plan.py, throughput_calibration.py,
      tests/test_kat_extended.py and the specification. Recompute code_sha256, the test-file
      hashes and the CODE_TREE_ALLOWLIST sha256, and compare them with the dfd0ed receipt.
      Confirm that the allow-list equals the committed code/ tree. Regenerate the trial plan and
      confirm sha256 9ccbe614...fb4a.
    - >-
      RR-2 Executed-code integrity (N-5 item 5 and NF-1). Re-run the 7c2b01 repros N5-Y
      (code/yaml.pyc), N5-P (code/pytest.pyc) and NF-1 (code/__pycache__/counters.cpython-<tag>.pyc
      with matching mtime and size). Also RUN the pytest rewrite-cache variant
      (tests/__pycache__/test_kat.cpython-<tag>-pytest-<ver>.pyc), which 7c2b01 checked only by
      inspection. Each must refuse with no runs/ entry. Then build at least four attacks of your
      own that are not the producer's tests. Examples:
      - a package directory code/yaml/ with __init__.py;
      - a .pth or zip-importable file in code/;
      - a symlink replacing an allow-listed file;
      - a planted bytecode file whose source mtime is forged;
      - a module planted by a stubbed cell after the pre-gate scan, which the post-cell scan
        must turn into validity invalid;
      - a PYTHONPYCACHEPREFIX or PYTHONSAFEPATH override in the parent environment.
      Each must refuse or invalidate. Confirm that a clean extract passes (positive control),
      that the code_tree block and module_origins appear in a stubbed contract-mode package,
      and that pytest's resolved __file__ lies outside code/.
    - >-
      RR-3 Mutants, each your own edit in a scratch extract, run under the full start-up suite.
      - M6 (counters.arm_c_cell S_idx uint32 truncation, the 7c2b01 edit): it must now be
        KILLED, and you report the failing items.
      - M5 and M3 controls: both must still be killed.
      Confirm the HX-6 vacuity guards are real by an independent recount: at (41, 6) and
      (29, 7), the S keys of at least 2^32 and their nonzero truth, on both bases. Report the
      m_S values observed.
    - >-
      RR-4 NF-2, NF-3, NF-4, NF-6, NF-7 and the receipt clash. For each HX-3 to HX-9 item, run
      its test against the 9a0b5955 code (it must fail) and the dfd0ed code (it must pass).
      Then re-run your predecessor's own attacks, which must now void, invalidate or refuse as
      specified: cdf_top_N, cdf_top_s, recount_missing_convention, the F2 edges (a) to (d), the
      forged GateResult, RID-runs-symlink and rss_children. Add at least one new attack per
      item.
    - >-
      RR-5 DEV-1. Read dev1-report-96fee7.md, dev1-kat-log-96fee7.json and the junit, and
      confirm all of the following:
      - the outcome is passed;
      - the recorded per-file hashes and code_sha256 equal the dfd0ed committed bytes;
      - test_kat_extended.py is unmodified (79894702...06b5);
      - q'' = 10,007, m = 3, n = 2, s = 50, and the line base was used;
      - 50 pairs are recorded and all are equal, the guard holds, and the multiset count equals
        C(B + 2, 3);
      - the projection was measured first and the cell finished within the watchdog;
      - .resume was pushed per the report.
      Then, independently and without calling the kernel, compute the membership counts on
      the FULL line base for at least 10 of the 50 logged targets, your own random choice from
      a stated seed, with a method you write (a pair-sum table, about 500 s per the 4c4831
      measurement). Compare them with the logged kernel counts. Optionally repeat the 7c2b01
      sub-base check on the final bytes. Do not re-run the full kernel pass.
    - >-
      RR-6 Regression.
      - Baseline: the full test_kat.py suite on the committed bytes under
        launcher.run_selftest_suite; record the counts.
      - Do at least one self-test inside a FULL repository checkout (not sparse), read-only, and
        confirm the collected count equals EXPECTED_KAT_ITEMS. If that checkout's code/ holds
        stray ignored files, the gate must refuse. Report this; do not clean it.
      - Re-run every 165da2 CR-1 scenario and the 7c2b01 RR-2 S, A and R tables. All must
        refuse as before, and the P1 and P2 positive controls must pass.
      - Spot-check CR-2 seeds, CR-4 residual withholding and the CR-5 KAT refusal on all 96
        (pair, arm) combinations.
    - >-
      RR-7 New-code read. Read every line of the new launcher.py and the changed tests. Look for
      defects that would let an invalid cell pass as valid or misroute a defect into F7 or F8.
      Examples: an allow-list that follows symlinks or is computed from the tree it checks; a
      post-cell scan whose result is not wired into validity; a pycache prefix set after a local
      import; a module_origins check that compares a path to itself; an F2 sentinel check
      reachable only by the CLI.
    - >-
      RR-8 Zero experiment cells. Every gate call uses a scratch experiment root with a
      synthetic KAT-field plan. Scratch files stay outside the repository. Write only the
      declared paths. Do not commit. Put no prediction value in any message. Never Bedrock.
  deliverables:
    - "fix_review.md: per RR item, the commands, the outcome, and a table with one row per must-fix (N-5 item 5, NF-1 to NF-7, the receipt clash, DEV-1) plus the closed items of 7c2b01 (F-1, N-1 to N-4) as regression rows: closed or not closed, with the evidence. New findings carry a severity (blocking: could let an invalid cell pass, or misroute an instrument defect into a scientific reading; non-blocking: everything else) and a reproduction. Terminal verdict for B8: passed only if every must-fix is closed and no new blocking finding exists."
    - "review_attestation.yaml: task_id; ordered sources_read with extent; the commit reviewed; blindness lifted_for (both reports) and its rationale; findings summary; m6_killed_by_reviewer_run; dev1 membership cross-check result; verdict; inference fields (requested policy, resolved model, fallback_used, independent_session and its basis); procedure_deviations; runs_launched 0"
  artifact_paths:
    - coordination/goals/GOAL-PATH-001/review/TASK-20261106-941825/fix_review.md
    - coordination/goals/GOAL-PATH-001/review/TASK-20261106-941825/review_attestation.yaml
  write_scope:
    - coordination/goals/GOAL-PATH-001/review/TASK-20261106-941825
  archived_by: TASK-20261106-afbe9b
  inference:
    policy: review-adversarial
    reasoning_effort: null
    reasoning_effort_note: null means the policy default; never below the review floor.
    fallback_allowed: true
    fallback_note: Backend or model substitution only, recorded as fallback_used. Never a cheaper policy, never degraded, never Bedrock.
    degraded_allowed: false
    independent_session_required: true
    independence_note: "A fresh session. It must not be the session of any of: TASK-20261106-2b7223, TASK-20261106-96fee7, TASK-20261106-4c4831, TASK-20261105-ac5ad6, TASK-20261029-a97206, the PR #2707 author, or the reviewers TASK-20261105-165da2 and TASK-20261106-7c2b01. That keeps fresh eyes on the fixes and avoids self-review of the attacks it re-runs."
    delivery: interactive
  budget:
    wall_clock_seconds: 21600
    memory_gb: 16
    maximum_runs: 0
  dispatch_preconditions:
    - {id: VP-1, text: "archived_by TASK-20261106-afbe9b is bound."}
    - {id: VP-2, text: "TASK-20261106-dfd0ed is completed and verified, its commit is pushed, and its receipt records DEV-1 outcome passed (otherwise SA-9 stops the queue before this task)."}
    - {id: VP-3, text: "A FULL (non-sparse) checkout at or descending from the dfd0ed commit, with byte-identical experiment tree and root conftest.py and pyproject.toml, is available read-only for RR-6. Scratch extracts are used for every mutant and attack."}
    - {id: VP-4, text: "Claim after git fetch: python3 tools/goal_lanes.py claim coordination/goals/GOAL-PATH-001/batches/BATCH-a8825c/dispatch_queue.json TASK-20261106-941825 --as <addr> --ttl-minutes 420 --publish. Release with two --artifact <path>=<sha256> digests."}
    - {id: VP-5, text: "Fresh validator session satisfying independence_note; the resolved model id contains no 'bedrock'."}
  completion_gate:
    - fix_review.md addresses RR-1 to RR-7, each with its commands and outcome. Its must-fix table covers every row named in deliverables, and it gives a terminal B8 verdict.
    - M6 is confirmed killed, and M5 and M3 still killed, by the reviewer's own mutant runs.
    - The N5-Y, N5-P, NF-1 and rewrite-cache attacks were run by the reviewer, plus at least four of the reviewer's own.
    - The DEV-1 membership cross-check on at least 10 logged targets was computed by the reviewer without the kernel.
    - review_attestation.yaml parses and names the commit reviewed.
    - Zero experiment cells; nothing is written outside write_scope.
  return_format: The two artifact paths with sha256, the B8 verdict, the count of must-fix items closed and not closed, new findings by severity, whether M6 was killed, the DEV-1 cross-check outcome (agree or disagree, no values), and the commit reviewed.
  review_plan: null
  review_required: false
  review_required_note: FALSE. This IS the independent re-review of the instrument; it changes no claim.
  runs_launched: 0
