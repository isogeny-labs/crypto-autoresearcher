    - The new tests fail on the unmodified exporter.
    - No 284bc4 row carries unit `ratio` or the value 231.25, and no row combines 925 and 4.
    - git diff touches only the two declared files.
  return_format: Files changed, the new test names, old-code and new-code pytest outcomes, and anything the labelling left ambiguous.
  review_plan: null
  review_required: false
  review_required_note: A labelling change in an exporter; it changes no claim.
  runs_launched: 0
