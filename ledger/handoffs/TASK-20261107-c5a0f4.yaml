    Do not use scratchpad/dl-8b0d47-receipt/.
  - >-
    D-2 Before S2, read nothing beyond the check_job.py set: no records.jsonl content, audit,
    replay, run log, l2-gate content, compare output or arm statistic.
  - >-
    D-3 v3b changes launch_eks.sh section 3 only. Sections 1, 1b, 1c and 2, the class logic
    including the 42/43 accept branch, the manifests and the exit codes stay byte-identical to v3a
    (0fcdd67e...). Locator rule:
    (a) a non-empty result.json .results_uri is used as is;
    (b) otherwise, read the receipt at .receipt_uri. status.json .job.uid must equal result.json
        job_uid, and .job.job_name must equal the job name. Exactly one pod is allowed. Its uid is
        pod_uid, and its terminated exitCode is recorded;
    (c) the listing of runs/<job>/ must hold only launcher/ and that pod prefix;
    (d) after download, job-exit.json .pod_uid, .job_name and .exit_code must equal the located
        pod, the job name and the status exitCode.
    raw-result.json gains results_locator (launcher_result | receipt_status_pod_uid), job_uid and
    pod_uid. The new runbook's validity keeps the results_uri pattern.
  - >-
    D-4 reconcile_run.sh contains no launch-remote, CodeBuild or S3-write path. A grep in the
    fixture test proves it. It implements DEC-20261107-b74e2c ruling 3 R-1 to R-7: it starts from
    runs/RUN-ICPERF-8b0d47/job/launcher/result.json at sha256
    7c3d9954a561a7a0d07e498afe3ecdf5b8c53359cfa28abb578a67dc8a6d60e7; it runs the unchanged
    check_job.py; it writes {out}/reconcile-result.json naming run_id RUN-ICPERF-8b0d47 and trial_id
    T1. It writes nothing under runs/RUN-ICPERF-8b0d47/. run-summary.json is transported as is
    (ruling 5).
  - >-
    D-5 Offline fixtures (no AWS call), archived with their outputs. Positive cases:
      - T1's real receipt shape (state failed, exit_code 23, empty pod_uid and results_uri) with a
        synthetic job-exit 42 gives job_completed;
      - a succeeded-Job receipt with a non-empty results_uri gives the same outcome as v3a.
    Negative cases, each of which must NOT give job_completed or a reconcile pass:
      - 0 pods; 2 pods;
      - status job.uid != job_uid;
      - an extra pod prefix under runs/<job>/;
      - job-exit pod_uid mismatch; job_name mismatch;
      - container exitCode != job-exit exit_code;
      - missing receipt; empty SHA256SUMS;
      - run-summary.json unlisted, or listed at a digest other than e3b0c442....
    Also archive: bash -n of every script, --dry-run of v3b, and diff -u from v3a to v3b with a hunk
    list.
  - >-
    D-6 C1-AMENDMENT-2 follows the C1-AMENDMENT-1 procedure in isogeny-labs/crypto:
      - AMENDMENT-2.md;
      - protocol.json extensions.c1_amendment_2 with prior_freeze;
      - `experiment_protocol.py validate` with 0 findings, then `freeze --filed-before-affected-data`;
      - a byte-identical copy of protocol.json at inputs/protocol.json.
    Its content is DEC-20261107-b74e2c ruling 4 (i) to (iii). It changes no N, seed, curve, target,
    arm, weight, threshold, margin, accounting rule, decision mapping, request, instance, deadline,
    budget line or cap, and it says so. The crypto-repo change goes through its own Conductor task
    and its own ready-for-review PR.
  - >-
    D-7 The new session:
      - Use a new allocator-confirmed session id and a fresh allocator-confirmed run id for S2.
        RUN-ICPERF-5ffa79 is retired and never reused.
      - T1 is not a trial in the new plan.
      - S03 runs only if S02 passed (on_failure stop). No step retries a launch. The -r2 requests
        are not bound.
      - S04 runs analyze-c1.sh on {S02 out}/artifacts/session and on the S2 run's
        job/artifacts/session.
      - Keep the section 10 gate line in the card: S2 0.93108 + 0.93108 + 0 = 1.86216 <= 5.00.
      - New executor and snapshot handoffs are previews whose declared artifact paths cover only
        files that the session can produce, so that the d5ec1e partial-output refusal cannot recur
        (IMP-C1-d5ec1e-partial-output).
  - >-
