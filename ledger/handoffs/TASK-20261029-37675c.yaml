      outputs, the LA-7 validator and review-independence outputs, the hygiene and
      dispatcher outcomes, and both input-pin maps (LA-9).
    - One isolated commit, a pushed branch, an open or refreshed ready-for-review PR, lane BATCH-c53152 open and lane BATCH-7ca353 closed.
  artifact_paths:
    - coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/archives/TASK-20261029-37675c/ledger-receipt.json
    - ledger/decisions/DEC-20261029-71d757.yaml
  write_scope:
