# OPENING LEDGER ARCHIVE, GOAL-PATH-001, BATCH-c53152. Stages the outputs of
# TASK-20261023-111e6a (DEC-20261029-71d757, H-MONO-23d347, the review_required draft
# of EXP-MONO-1a1be2 with its transfer assessment, the review plan, six handoffs and
# the additive goal-head update carrying the BATCH-7ca353 checkpoint) in ONE isolated
# commit, ALONE. Executed by the shell-holding top-level session in the coordinator
# role. Zero runs. Ids reserved by the top-level session.
handoff:
  id: TASK-20261029-37675c
  from: coordinator
  to: coordinator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-c53152
  authorized_by: DEC-20261029-71d757 conditions OC-1 to OC-6 and NA-1
  objective: >-
    Commit and bind, in ONE isolated archive commit, exactly the thirteen expected
    paths after checking OC-1 to OC-6 of DEC-20261029-71d757, recording each in the
    receipt together with the input pins of TASK-20261029-3ac467 and
    TASK-20261029-a97206. Verify, push, open or refresh the PR ready for review, then
    close lane BATCH-7ca353. This task runs ALONE.
  uncertainty_reduced: >-
    None about the mathematics. It makes the design decision, the review_required
    contract draft, the review plan and the batch opening durable together, or none of
    them. It approves nothing.
  inputs:
    - ledger/decisions/DEC-20261029-71d757.yaml
    - ledger/goals/GOAL-PATH-001.yaml
    - ledger/hypotheses/H-MONO-23d347.yaml
    - experiments/EXP-MONO-1a1be2/specification.yaml
    - experiments/EXP-MONO-1a1be2/transfer-assessment.json
    - coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/review-plan.yaml
    - coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/dispatch_queue.json
    - ledger/handoffs/TASK-20261023-111e6a.yaml
    - ledger/handoffs/TASK-20261029-37675c.yaml
    - ledger/handoffs/TASK-20261029-3ac467.yaml
    - ledger/handoffs/TASK-20261029-a97206.yaml
    - ledger/handoffs/TASK-20261029-02a714.yaml
    - ledger/handoffs/TASK-20261029-fe6c9d.yaml
    - tools/research_dispatch.py
    - tools/validate_ledger.py
    - tools/check_merge_hygiene.py
    - tools/check_review_independence.py
    - tools/ecc_priority.py
    - tools/allocate_id.py
    - tools/goal_lanes.py
  constraints:
    - >-
      LA-1 The queue comes first, in its own commit:
      coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/dispatch_queue.json only.
      Push it and render it with python3 tools/research_dispatch.py <queue>
      --ready-only, which must pass (OC-1). The queue is never staged by an archive.
      Record python3 tools/goal_lanes.py lanes GOAL-PATH-001 first; any other session's
      open lane on GOAL-PATH-001 is recorded in the receipt. Then run python3
      tools/goal_lanes.py open-lane GOAL-PATH-001 BATCH-c53152 --queue
      coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/dispatch_queue.json
      --decision DEC-20261029-71d757 --objective "Design of IDEA-20261023-f15270:
      review_required contract, blind re-derivation, implementation; zero runs" --as
      <addr> --publish. The commit message of this and every later commit in the batch
      states no lemma value, formula or prior (review plan PD-1).
    - >-
      LA-2 Before staging, merge origin/main into the working branch, never rebase.
      Record base_commit_checked and merge_outcome. A conflict inside a record is never
      resolved by editing it: stop and report. If origin/main changed
      ledger/goals/GOAL-PATH-001.yaml, added any file under
      experiments/EXP-MONO-1a1be2/, or added a record citing IDEA-20261023-f15270, stop
      and report to a fresh Coordinator act (spare DEC-20261029-ae39de).
    - >-
      LA-3 Goal-head check, mechanical (OC-3). Against the base, the diff of
      ledger/goals/GOAL-PATH-001.yaml may contain only: current_batch_id changed from
      BATCH-7ca353 to BATCH-c53152; dispatch_queue_path changed from the BATCH-7ca353
      queue path to the BATCH-c53152 queue path; new keys
      current_batch_id_before_BATCH-c53152, dispatch_queue_path_before_BATCH-c53152,
      current_batch_note_2026_10_29, open_batches_note_2026_10_29, impediments and
      next_action_2026_10_29 (under 1,000 characters); one item appended to
      batch_checkpoints (BATCH-7ca353); one item appended to open_batches
      (BATCH-c53152). status stays active; next_action, next_action_2026_10_23 and the
      existing open_batches item are byte-identical. Record the base sha256 of the file.
      Any other changed or removed line is a scope finding: stop and report, do not
      repair. Do not run tools/shard_goal.py (DEC-20261029-71d757 OI-4).
    - >-
      LA-4 Queue and card check. Each of the six handoffs parses as YAML with a
      non-empty objective, deliverables and completion_gate. The queue's embedded
      handoffs agree with the ledger cards on id, role, write_scope, artifact_paths and
      archived_by. The write scopes of TASK-20261029-3ac467 and TASK-20261029-a97206 are
      disjoint from each other and from every expected path of this archive. A
      disagreement stops the archive.
    - >-
      LA-5 Identifier check (OC-4). Run python3 tools/allocate_id.py --check on
      DEC-20261029-71d757, BATCH-c53152, H-MONO-23d347, EXP-MONO-1a1be2,
      TASK-20261023-111e6a, TASK-20261029-37675c, TASK-20261029-3ac467,
      TASK-20261029-a97206, TASK-20261029-02a714 and TASK-20261029-fe6c9d; record each
      output. Expected: only this batch's own files reference them.
    - >-
      LA-6 ECC check (OC-2). Run python3 tools/ecc_priority.py --classify on
      RQ-MONO-001 and GOAL-PATH-001, and --budget-violations. Record outputs verbatim.
      If either is not ECC, or GOAL-PATH-001 has a budget violation, stop before staging
      and report to a fresh Coordinator act (spare DEC-20261029-ae39de).
    - >-
      LA-7 Contract-draft check (OC-5). Run tools/validate_ledger.py and record every
      message on experiments/EXP-MONO-1a1be2/specification.yaml and
      ledger/hypotheses/H-MONO-23d347.yaml. The specification must show status
      review_required, approved_by null, execution_authorized false and frozen false.
      Run python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-PATH-001/batches/BATCH-c53152 and record its output; at
      this point it must report the missing attestation of TASK-20261029-3ac467 and
      nothing about the plan's shape (prior, joints, attack plans, owners,
      proves_too_much, blind_from). A shape error stops the archive.
    - >-
      LA-8 Stage exactly the thirteen expected paths, one by one. git add -A, git add .
      and directory adds are forbidden. Generated indexes are rebuilt if needed and
      never staged. Run tools/validate_ledger.py and tools/check_merge_hygiene.py before
      committing (OC-6); stop on any new error attributable to a staged path; record
      pre-existing errors as pre-existing and do not repair them.
    - >-
      LA-9 Input pins. Before committing, record in the receipt the sha256 of every
      file in the inputs lists of TASK-20261029-3ac467 and TASK-20261029-a97206, under
      input_pins_TASK-20261029-3ac467 and input_pins_TASK-20261029-a97206 (staged inputs
      at their staged bytes, others at their bytes in the merged tree). The receipt is
      never edited after the commit.
    - >-
      LA-10 binding_mode content_at_commit: GOAL-PATH-001.yaml and the specification
      have a life after this archive. commit_sha, parent_sha and path_sha256 go into the
      queue's archive block in a later commit, with a tasks_state_revisions entry.
    - >-
      LA-11 The commit message names TASK-20261029-37675c and every archive record_id
      literally, states that nothing is approved and that EXP-MONO-1a1be2 is
      review_required, states zero runs, and states no lemma value, formula or prior.
      Verify the receipt with tools/research_dispatch.py. Push, open or refresh the PR
      against main ready for review (never a draft) naming every record id, and enable
      auto-merge where the base is main.
    - >-
      LA-12 After verification and push, close the predecessor lane: python3
      tools/goal_lanes.py close-lane GOAL-PATH-001 BATCH-7ca353 --outcome archived
      --decision DEC-20261029-71d757 --ledger-commit <this archive's commit> --as <addr>
      --publish. Record the lane file path in the release note.
    - >-
      LA-13 Release with --outcome completed and --artifact <path>=<64-hex sha256> for
      each of the two artifact paths, computed at release. Check the release JSON
      carries two non-empty digests and record them in the tasks_state_revisions entry.
    - >-
      LA-14 If any of OC-1 to OC-6 fails, stop before staging. Nothing in
      DEC-20261029-71d757 takes effect; do not edit or archive it; report to a fresh
      Coordinator act (spare DEC-20261029-ae39de). A failure is an integrity or
      procedure finding, not negative evidence. Never edit a staged file while staging;
      never amend, rebase or force-push. Lane BATCH-c53152 stays open. Zero runs.
  deliverables:
    - >-
      coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/archives/TASK-20261029-37675c/ledger-receipt.json
      with commit_sha (null inside the commit), parent_sha, base_commit_checked,
