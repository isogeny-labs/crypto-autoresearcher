    absolute argv[0], use `bash`, `-p`, record the refusal text, and state the PATH-resolved bash as a
    residual (A-2). Correct the prologue comment that calls BASH_ENV an unavoidable residual (A-3). The
    `python3 -I` check argv stays.
  - >-
    V-6 Regression. All existing 123 rt_regression.sh rows keep their v3c expected outcome; the legacy
    replay is unchanged. test_locator.sh passes in full with the checkout argument and 0 skips. New cases,
    each with its refusing exit status fixed as in the WANT_* tables:
      - the proxy pair: allowed loopback form passes; upper/lower mismatch refused; userinfo, a non-loopback host, a path or a newline refused;
      - NO_PROXY: mismatch refused; whitespace or a forbidden character refused;
      - AWS_CA_BUNDLE: allowed path passes with its sha256 recorded; another path, a symlink to the allowed file, a symlinked parent, a missing file, an empty file, and AWS_CA_BUNDLE without a proxy, each refused;
      - ca_bundle, role_arn, source_profile, credential_source, web_identity_token_file, sso_session and sso_start_url in ~/.aws/config, each refused;
      - missing or empty AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY refused; AWS_EC2_METADATA_DISABLED or PYTHONNOUSERSITE preset to another value refused;
      - a .pth file under $HOME/.local site-packages that writes a marker: it does not run inside aws (if PY-1 is applied);
      - the argv form: under `/bin/bash -p <script>`, BASH_ENV, ENV, an exported BASH_FUNC_aws%% and SHELLOPTS=xtrace with a PS4 command substitution each run no payload before line 1 (marker absent); the same cases under plain `bash <script>` are recorded as the pre-v3d control.
    Every case for launch_eks.sh is mirrored for reconcile_run.sh where the check exists in both.
    Then the E-4 table of v3c, plus a table of the new cases.
  - >-
    V-7 Mutation. Add one mutant to tests/mutate.py for every new check in V-3 and V-4, each edit
    matching exactly once. Re-run the full mutation_check.sh on frozen bytes (no edit while it runs).
