    ^http://(127\.0\.0\.1|localhost):[0-9]{1,5}/?$; the no-proxy value matches ^[A-Za-z0-9.,:*/_-]*$;
    AWS_CA_BUNDLE only with a proxy set, equal to an entry of K7_CA_BUNDLE_ALLOWED=(/root/.ccr/ca-bundle.crt)
    with `realpath -e` returning the same string, and a non-empty regular file; its sha256 is computed in
    phase 2; the K7_STATUS suffix is transport=[..] proxy=.. no_proxy=.. ca_bundle=.. ca_bundle_sha256=..
    after the unchanged prefix. Every refusal exits 2 before any AWS call.
  - >-
    V-4 Credentials, configuration and Python (R-3 CR-1, CR-2, CF-1, PY-1). Phase 2 refuses unless
    AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are set and non-empty. The exec adds the constants
    AWS_EC2_METADATA_DISABLED=true and PYTHONNOUSERSITE=1, and phase 2 admits each only with that value.
    K7_CFG_ALLOWED stays empty. The refused entry names add ca_bundle, role_arn, source_profile,
    credential_source, web_identity_token_file, sso_session and sso_start_url. PY-1 resolution: check
    locally where the first `aws` on PATH imports botocore from (no AWS call). If that is the user site,
    omit PYTHONNOUSERSITE and record it as a residual. Either way, record the evidence. Tests that run the
    scripts set literal dummy credential values (e.g. AKIDFAKE...), never real ones.
