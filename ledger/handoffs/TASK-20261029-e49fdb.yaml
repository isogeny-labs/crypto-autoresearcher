  constraints:
  - maximum_runs=0. No scientific VM/SDK invocation, fresh entropy/nonce, fresh curve/target
    sampling, old-cohort reanalysis, timing benchmark or scientific observation. Only
    disclosed existing F11/r13 and F23/r17 known-answer software fixtures and their
    deterministic negative mutations may execute. Abstract Z7/Z31 controls may be
    specified/hand-derived only in this source stage.
  - Outside delivery only, mirroring repository-relative assigned paths. Root alone
    applies canonical files and performs Git, claims, releases, publication, archives
    and credential use. Never merge or enable auto-merge. No scientific status change.
  - Read binding literature/observation rules, named prior reports and relevant primary
    sources before implementation. Record actual hashes/read depth/retrieval gaps.
    KB tools unavailable; bounded corpus absence asserts no novelty.
  - No coefficient/base/circuit/seed fitting, truth API, supplied scalar labels/orbit/log
    tables, all-r candidate gate or hidden solver fallback. Candidate-derived publicly
    verified scalars are legitimate outputs; do not claim no labels ever.
  - Fresh worker uses coordinate-point rejection/root/sign generation, never known-k
    generation. Public nonce can reproduce coordinates without supplying scalar labels.
    Candidate worker must finish all fresh candidate queries, seal/collect/quiesce,
    and obtain termination ACK before host-only independent log/orbit/BSGS/reference
    work begins.
  - No qualified timing or counter-advantage claim. Clocks wall_valid=false. Host
    and VM abstract counter backends are disclosed separately. Correct public equations
    and source audits do not constitute independent counter execution replay.
  - Preserve every failed, undefined, capped, empty interval, zero-success, incomplete
    and operational outcome. Source development success supplies no family closure,
    exponent, significance or scalar-ordering conclusion.
  - All planned interfaces/counts/seeds/exclusions/cost definitions must be frozen
    before any future data. Initial source batch is not scientific approval. Future
    scientific execution needs separate lawful batch, exact source-bound protocol/preapproval,
    standing-authorization decision/archive/checkpoint and run skill.
  - 'At most two producers concurrently: start after engine completes; verifier may
    still run. Read its interface only after it is delivered; do not modify engine/host
    scopes. Resolve schema issues by explicit request to their owners.'
  - Preserve observed Modal B2 app ap-EAHJ6SjvmeY99EQ2I47duh/image im-zz2zzbG7JE9xilcBO1QJMh,
    CPU2/12288MiB/runtime vm/network blocked/UID1000/GID1000/no supplementary groups/no
    secrets. No image build, UID1001 or private-k broker. No SDK/network/VM calls
    in development; mock transport with fixed F11/F23 outputs.
  - 'Worker manifest exact allowlist: curve.py,constructor.py,cohort.py,engine.py,worker_runtime.py
    only (or smaller justified closure). Host-source manifest separately covers controller/driver/host
    verification/references/postrun; host modules/oracle/BSGS code cannot enter staged
    worker tree. Refuse unlisted files, extra truth columns and environment/descriptor
    state.'
  - Driver creates at most one future scientific VM. Collect and hash candidate-only
    raw output/failure tree; preserve process exit, quiescence and termination ACK
    before host verifier starts. No automatic retries or host-VM feedback. Failure
    path retains partial records and cannot manufacture termination success.
  - Implement production data-directory layout plus run/check/plan-only and postrun
    entrypoints, unified experiment.export/v1, raw artifacts/cost vectors, per-curve
    six-cell paired results, two-panel summaries, exact source/protocol binding, report
    graph/PDF renderer and failure/zero/undefined/capped reports. This must be executable
    source, not a plan or empty exporter.
  - Read actual old preapproval packet/trial-plan, driver/controller, postrun v4 and
    tools/experiment_preapproval.py. Include all supervisor paths and trial artifacts
    in future source interface; never pad observed rows for unexecuted schedules.
    Test hash mismatch/path traversal/duplicate JSON/schema/early-host-verification
    mutants with mocks.
