  attack_plan: >-
    (1) Record invariants first: one record per (cell, block, c); block main only in the main file; c in [0, n_curves)
    of its cell; bits, r and n consistent with the cell id b<bits>-r<r>-n<n>; p prime of the stated bit length; null_C
    and null_D of length 20; status in {ok, failed_infrastructure, degenerate}; for ok records the recorded gap_meta T
    is the least T with ((2T+1)^r - 1)/2 >= ceil(1.02 n) + 8 and the enumeration bookkeeping (enumerated, duplicate
    skips, any Q = O skips) accounts for exactly n labels; for a degenerate record the enumeration covers the whole
    half-box. List every violation with its key. (2) Re-derive n_curves for all 45 cells from the closed-form sizing
    rule (mu_ref = 3 binom(n,4)/p_ref with p_ref = 0.75 x 2^bits; n_curves = clamp(ceil(1.5 x 2500 / mu_ref), 50,
    2000)). (3) For every cell compute exactly (fractions.Fraction) S, M and V, then kappa, z = (S - M)/sqrt(V (1 +
    1/20)) with decimal square roots at 50 or more digits, plant_kappa and plant_z the same way with the planted counts,
    plant feasibility on every curve, and z_cal (replicate 0 of each curve against replicates 1 to 19, variance factor
    1 + 1/19); use sample variances as the statement says and say so. (4) Draw your own curve-cluster bootstrap of kappa
    (2000 resamples; records sorted by curve index first; percentiles 2.5 and 97.5) with a seed you write down before
    drawing, and report the interval under two percentile conventions (nearest-rank and linear interpolation). (5) Apply
    the frozen cell_classes in order, then the calibration gate over powered cells (population sd, mean), fraction_valid
    over the 45 cells, the flag rule, the replication rule against the actual content of the replication jobs file
    (what must the replication census contain given your flagged set, and does the file satisfy that), the toy reading
    at main stage and at final stage, and the headline. (6) Write an ambiguity table: every place where the statement
    is underspecified, the resolution you took, and, for each admissible alternative, whether any class, the gate pass,
    fraction_valid, the flagged set, the reading or the headline changes. At least: sample versus population variance;
    which M decides "powered" for the calibration set; how z_cal is pooled over a cell's curves; the bootstrap seed and
    percentile convention; how a degenerate or failed record enters "ok records"; whether plant feasibility is decided
    before or after power. Where the Coordinator expects a break, if any: the variance divisor and the calibration
    population could move the gate; the bootstrap convention could move a cell near an interval edge; ok-record
    accounting could move fraction_valid.
