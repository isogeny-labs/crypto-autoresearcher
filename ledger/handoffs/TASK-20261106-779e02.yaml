# LEDGER ARCHIVE, GOAL-PATH-001, BATCH-a8825c. Stages DEC-20261106-475620 and the
# TASK-20261106-d5063d artifacts (seven handoffs, the additive goal-head update carrying the
# BATCH-69d9a2 checkpoint, the decision report) in ONE isolated commit, ALONE, then closes lane
# BATCH-69d9a2. Executed by the shell-holding top-level session in the coordinator role. Zero
# runs. Approves nothing.
handoff:
  id: TASK-20261106-779e02
  from: coordinator
  to: coordinator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-a8825c
  authorized_by: DEC-20261106-475620 conditions OC-1 to OC-6 and NA-1
  objective: >-
    Commit and bind, in ONE isolated ledger archive commit, exactly the seventeen expected
    paths after checking OC-1 to OC-6 of DEC-20261106-475620. Record each check in the receipt,
    together with the input pins of TASK-20261106-2b7223 and TASK-20261106-96fee7. Verify,
    push, refresh the ready-for-review PR with auto-merge, then close lane BATCH-69d9a2. Runs
    ALONE.
  uncertainty_reduced: >-
    None about the mathematics. It makes the re-review composition, the pre-data amendments
    and the batch opening durable together, or none of them.
  inputs:
    - ledger/decisions/DEC-20261106-475620.yaml
    - ledger/goals/GOAL-PATH-001.yaml
    - coordination/goals/GOAL-PATH-001/batches/BATCH-a8825c/dispatch_queue.json
    - coordination/goals/GOAL-PATH-001/batches/BATCH-69d9a2/dispatch_queue.json
    - coordination/goals/GOAL-PATH-001/batches/BATCH-69d9a2/archives/TASK-20261106-5c1258/snapshot-receipt.json
    - coordination/goals/GOAL-PATH-001/batches/BATCH-69d9a2/archives/TASK-20261106-649ebb/snapshot-receipt.json
    - ledger/handoffs/TASK-20261106-d5063d.yaml
    - ledger/handoffs/TASK-20261106-779e02.yaml
    - ledger/handoffs/TASK-20261106-2b7223.yaml
    - ledger/handoffs/TASK-20261106-96fee7.yaml
    - ledger/handoffs/TASK-20261106-dfd0ed.yaml
    - ledger/handoffs/TASK-20261106-941825.yaml
    - ledger/handoffs/TASK-20261106-afbe9b.yaml
    - experiments/EXP-MONO-1a1be2/reports/review-DEC-20261106-475620/
    - tools/research_dispatch.py
    - tools/validate_ledger.py
    - tools/check_merge_hygiene.py
    - tools/ecc_priority.py
    - tools/autoresearch_focus.py
    - tools/allocate_id.py
    - tools/goal_lanes.py
    - tools/artifacts/artifacts.py
  constraints:
    - >-
      LA-1 The queue comes first, in its own commit:
      coordination/goals/GOAL-PATH-001/batches/BATCH-a8825c/dispatch_queue.json only. Push it
      and render it with python3 tools/research_dispatch.py <queue> --ready-only, which must
      pass (OC-1). Record python3 tools/goal_lanes.py lanes GOAL-PATH-001. Then run python3
      tools/goal_lanes.py open-lane GOAL-PATH-001 BATCH-a8825c --queue <queue> --decision
      DEC-20261106-475620 --objective "EXP-MONO-1a1be2 second pre-approval fix round (7c2b01
      findings), DEV-1 cell and focused re-review; zero runs" --as <addr> --publish. The queue is
      never staged by an archive. No commit message or PR text states a lemma value, formula,
      prediction value, KAT value, timing or prior (PD-1).
    - >-
      LA-2 Before staging, merge origin/main into the working branch; never rebase. Record
      base_commit_checked and merge_outcome. A conflict inside a record stops the archive. If
      origin/main changed ledger/goals/GOAL-PATH-001.yaml or any file under
      experiments/EXP-MONO-1a1be2/, or added a record citing EXP-MONO-1a1be2 or H-MONO-23d347,
      stop and report to a fresh act (spare DEC-20261106-24d2a2).
    - >-
      LA-3 Goal-head check, mechanical (OC-3). Against the base, the diff of
      ledger/goals/GOAL-PATH-001.yaml may contain only the following:
      - current_batch_id changed from BATCH-69d9a2 to BATCH-a8825c;
      - dispatch_queue_path changed to the BATCH-a8825c queue path;
      - new keys current_batch_id_before_BATCH-a8825c, dispatch_queue_path_before_BATCH-a8825c,
        current_batch_note_2026_11_06_a8825c, open_batches_note_2026_11_06_a8825c and
        next_action_2026_11_06_a8825c (under 1,000 characters);
      - one item appended to batch_checkpoints (BATCH-69d9a2);
      - one item appended to open_batches (BATCH-a8825c);
      - one item appended to impediments (IMP-PATH-20261106-2).
      Every other line is byte-identical, including whitespace. Check that
      "latest_verified_commit: 67c2e5bf27c3b014e25829554130199d7918ae2b" is unchanged, and that
      the file parses with yaml.safe_load. status stays active. Record the base sha256. Any
      other changed line is a scope finding: stop and report, and never hand-repair it in this
      archive. Do not run tools/shard_goal.py.
    - >-
      LA-4 Queue and card check. Each of the seven handoffs parses with a non-empty objective,
      deliverables and completion_gate. The queue's embedded handoffs agree with the ledger
      cards on id, role, write_scope, artifact_paths and archived_by. The write scopes of
      2b7223 and 96fee7 are disjoint from each other and from every expected path of this
      archive. Every archive block in the queue carries commit_sha null, parent_sha null and
      path_sha256 {}.
    - >-
      LA-5 Identifier check (OC-4). Run python3 tools/allocate_id.py --check on
      DEC-20261106-475620, DEC-20261106-24d2a2, DEC-20261106-720ace, BATCH-a8825c and the seven
      TASK ids. Record each output.
    - >-
      LA-6 ECC and focus (OC-2). Run python3 tools/ecc_priority.py --classify on RQ-MONO-001 and
      GOAL-PATH-001, then --budget-violations, then python3 tools/autoresearch_focus.py for
      GOAL-PATH-001. Record all outputs verbatim. Stop if the work is not ECC or if there is a
      budget violation.
    - >-
      LA-7 Contract and bytes check (OC-5). experiments/EXP-MONO-1a1be2/specification.yaml has
      sha256 d81a85b36961647d6d6caccdf988d5650a7376fa581173f9761ab3ed594bc373 and is
      review_required. Every code/ and implementation/ path bound by the 5c1258 archive equals
      its path_sha256 there, and launcher.code_sha256() equals
      5e16c7577d9f0b8820369e2350530d2df52aa9e82aa35313eb1dcf2bdd1de1e3. The two 7c2b01 files
      equal the 649ebb path_sha256 (fix_review.md 52198231...2e1a; review_attestation.yaml
      50e14bb5...2c21). There is no runs/ entry, no approval.lock, no selftest-receipts/, and no
      __pycache__ or .pyc under code/ (git status --ignored --untracked-files=all).
    - >-
      LA-8 Decision report. Confirm the following:
      - the five source files exist as DEC-20261106-475620 visual_report specifies;
      - report.pdf was rendered, opened, and every page inspected;
      - tools/artifacts/artifacts.py push placed report.pdf in the artifact store, and
        .artifacts.json names its sha256 and bytes;
      - .gitignore carries the managed block;
      - every figure-data.json value names its source.
      If the push is refused, the refusal is stated in report.typ and the receipt, and the
      deviation is recorded with fifteen expected paths.
    - >-
      LA-9 Stage exactly the seventeen expected paths, one by one. git add -A, git add . and
      directory adds are forbidden; report.pdf is never git-added. Run tools/validate_ledger.py
      and tools/check_merge_hygiene.py before committing (OC-6). Record pre-existing errors as
      pre-existing.
    - >-
      LA-10 Input pins. In the merged tree, record in the receipt the sha256 of every file in
      the inputs list of TASK-20261106-2b7223, under input_pins_TASK-20261106-2b7223. Do the
      same for TASK-20261106-96fee7's frozen code files, under
      input_pins_TASK-20261106-96fee7_frozen.
    - >-
      LA-11 binding_mode content_at_commit. The commit message names TASK-20261106-779e02 and
      every record_id literally. It states that nothing is approved, that EXP-MONO-1a1be2 stays
      review_required, that the 7c2b01 findings are dispositioned (counts only), and that there
      are zero runs. Verify the receipt with tools/research_dispatch.py. Push, refresh or open
      the PR against main ready for review, naming every record id, and enable auto-merge (gh
      pr merge <n> --auto --merge).
    - >-
      LA-12 After verification and push, close the lane: python3 tools/goal_lanes.py close-lane
      GOAL-PATH-001 BATCH-69d9a2 --outcome archived --decision DEC-20261106-475620
      --ledger-commit <this commit> --as <addr> --publish. In a later commit, append a
      tasks_state_revisions entry to the BATCH-69d9a2 queue recording the composition and the
      lane closure.
    - >-
      LA-13 Release with --outcome completed and --artifact <path>=<sha256> for both artifact
      paths. If any OC fails, stop before staging: nothing in DEC-20261106-475620 takes effect,
      and a fresh act uses spare DEC-20261106-24d2a2. Never amend, rebase or force-push. Zero
      runs.
