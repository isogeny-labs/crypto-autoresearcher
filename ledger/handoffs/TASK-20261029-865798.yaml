  constraints:
  - maximum_runs=0. No scientific VM/SDK invocation, fresh entropy/nonce, fresh curve/target
    sampling, old-cohort reanalysis, timing benchmark or scientific observation. Only
    disclosed existing F11/r13 and F23/r17 known-answer software fixtures and their
    deterministic negative mutations may execute. Abstract Z7/Z31 controls may be
    specified/hand-derived only in this source stage.
  - Outside delivery only, mirroring repository-relative assigned paths. Root alone
    applies canonical files and performs Git, claims, releases, publication, archives
    and credential use. Never merge or enable auto-merge. No scientific status change.
  - Read binding literature/observation rules, named prior reports and relevant primary
    sources before implementation. Record actual hashes/read depth/retrieval gaps.
    KB tools unavailable; bounded corpus absence asserts no novelty.
  - No coefficient/base/circuit/seed fitting, truth API, supplied scalar labels/orbit/log
    tables, all-r candidate gate or hidden solver fallback. Candidate-derived publicly
    verified scalars are legitimate outputs; do not claim no labels ever.
  - Fresh worker uses coordinate-point rejection/root/sign generation, never known-k
    generation. Public nonce can reproduce coordinates without supplying scalar labels.
    Candidate worker must finish all fresh candidate queries, seal/collect/quiesce,
    and obtain termination ACK before host-only independent log/orbit/BSGS/reference
    work begins.
  - No qualified timing or counter-advantage claim. Clocks wall_valid=false. Host
    and VM abstract counter backends are disclosed separately. Correct public equations
    and source audits do not constitute independent counter execution replay.
  - Preserve every failed, undefined, capped, empty interval, zero-success, incomplete
    and operational outcome. Source development success supplies no family closure,
    exponent, significance or scalar-ordering conclusion.
  - All planned interfaces/counts/seeds/exclusions/cost definitions must be frozen
    before any future data. Initial source batch is not scientific approval. Future
    scientific execution needs separate lawful batch, exact source-bound protocol/preapproval,
    standing-authorization decision/archive/checkpoint and run skill.
  - 'Independence: do not read/import new engine/curve/constructor source or incremental
    prototype implementation. Derive arithmetic/interval/error geometry from public
    mathematical specification and supplied independent derivation. Old verifier source
    may be consulted; disclose any mathematical shared assumption.'
  - Host entrypoint must require verified sealed tree digest, complete collection,
    UID1000 quiescence and termination ACK before creating logs, full-orbit diagnostics,
    BSGS or truth-derived controls. Never stage host modules or derived label files
    to worker.
  - Independently verify domain/order/membership, all scheduled IDs/traces/undefineds/caps/lists/public
    equations, exact original/incremental equality, and per-trace error/erasure geometry.
    Keep failures distinct and validate broken upper bound, sign/scale/conversion,
    erasure/list truncation mutants on F11/F23 only.
  - 'Optional source-only diagnostic: from retained uniform-nonzero calibration response
    bank only, after worker termination and host log assignment, implement histogram/FFT
    estimates fhat(k)=((r-1)/(r*m))*sum F_i exp(-2pi*i*k*t_i/r), t=a^-1 log_P(R),
    duplicate draws retained, F in {+1,-1,0}, f(O)=0. No new VM predicate queries
    or learner/oracle advice. All non-DC coefficients are secondary descriptive outputs.
    Root-derived formula, sampling bound and numerical implementation require independent
    review before freeze; omit with explicit blocker if not ready.'
  - Working BSGS solves same public confirmation targets with explicit cold/warm setup;
    uniform-list reference uses independent uniform distinct nonzero guesses for measured
    M, with saturation M>=r-1, zero/duplicates/capped cells and full costs specified.
    Same public equations alone do not validate counter execution.
  - 'Implement host diagnostic exact-mask odd-anchor reference for one fixed primary
    arm: symmetric masks and defined anchors required, fair orientations on non-anchor
    +/- pairs, preserve holes and chart transport, support 2^(D-1), with-replacement
    draws and duplicate/tie counts; report degenerate or ineligible cells. This is
    descriptive, no exchangeability/p-value assertion. Freeze actual reference count
    before data.'
  - Perfect-half and broken-sign/conversion/order controls are checker-only. No host-generated
    advice returns to worker. Any all-r census is host diagnostic/common work after
    seal and never a free candidate API. SFT learner, dense-DFT advice, floor-carry
    optimization and fitting are excluded.
  deliverables: *id002
  artifact_paths: *id002
  archived_by: TASK-20261029-b039c4
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  budget:
    maximum_runs: 0
  completion_gate:
  - Host verifier has independent arithmetic and rejects absent/invalid seal or termination
    evidence before touching fresh labelled work.
  - F11/F23 known fixture logs demonstrate correct witnesses and negative mutants,
    exact list-count and uniform saturation semantics.
  - Document host versus VM counter definitions, independent replay gap and all-r
    diagnostic costs explicitly.
  return_format: Exact outside files/hashes, commands/return codes and fixture assertions
    actually observed, source provenance, defects and concrete remaining blockers.
    No scientific verdict or invented runtime/model receipt.
