    status: approved prospectively for the exact bounded review scope; mathematical findings remain unaccepted
    claim_under_review: Independently derive or refute the complete finite-k2 added-row highest-part regularity
      claims from equations and actual source, with all auxiliary constraints retained.
    coordinator_prior: The explicit added row appears to expose a lower-degree consequence while preserving the
      original ideals, addressing complete-chart strictness. The auxiliary independence, exact ideal equalities
      and nonzero-C boundary are load-bearing assertions to challenge; no acceptance is assumed.
    joints:
    - joint: source_separation
      assigned_to: TASK-20261102-bf48ac
      attack_plan: Derive actual finite-k2 normalization and norm/sign rows from source. Challenge the assertion
        that every other constant-stratum row is independent of both A0 and q in all three arms; include imported
        binding variables and every inverse/interval/rationality auxiliary. A hidden coefficient dependency breaks
        the claimed C factorization.
    - joint: original_quotient
      assigned_to: TASK-20261102-bf48ac
      attack_plan: Determine the full original highest-part ideal by both inclusions, with all field equations.
        Establish or refute the proposed C[q]/(q^2) quotient. Handle unit and nonzero finite C without assuming
        that the ordinary system is solvable.
    - joint: raw_equality
      assigned_to: TASK-20261102-bf48ac
      attack_plan: For literal original-X rows and a!=0, compare both highest ideals after only A0 substitution;
        distinguish polynomial-variable translation from recombination of coefficient rows. Challenge a=0 and both
        ordinate cases.
    - joint: added_row
      assigned_to: TASK-20261102-bf48ac
      attack_plan: Check R=N1+2aN2 as a polynomial identity before substitution, and separately check whether its
        top part belongs to the ORIGINAL top ideal. Show whether both ideals are unchanged; a=0 duplicates must
        be treated. Do not delete or replace any old nonzero row.
    - joint: reduced_quotient
      assigned_to: TASK-20261102-bf48ac
      attack_plan: For added-row then A0 substitution, derive the exact reduced highest ideal and both quotient-map
        directions for b!=0. Treat a=0 and a!=0 independently and include every transformed field row. q elimination
        is only a graded-ring calculation.
    - joint: strictness_boundaries
      assigned_to: TASK-20261102-bf48ac
      attack_plan: Independently establish the proposed dreg drop from exact graded support; cover b=0, C=0, a=0,
        impossible strata and special/identity charts. Construct equality and omitted-premise controls; no exact
        diagnostic threshold is inherited.
    - joint: solutions_projection
      assigned_to: TASK-20261102-bf48ac
      attack_plan: Prove ordinary-system solution reconstruction and corresponding auxiliary-fiber equality over
        extensions. Original projection is (A0,q), reduced projection is (q); q remains a system input. Map normalized
        A,B,U and signed output with both beta signs; state compiled-model and cost obligations.
    - joint: claim_boundary
      assigned_to: TASK-20261102-bf48ac
      attack_plan: Separate accepted one-pivot non-increase, literal raw-row equality, added-row strictness, diagnostic
        values, solving degree, compiler correctness and certified pruning. Give per-joint holds/breaks/inconclusive
        with exact proof or counterexample; no outcome is prewritten.
