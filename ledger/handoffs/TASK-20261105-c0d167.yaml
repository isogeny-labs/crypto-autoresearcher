# LEDGER ARCHIVE, GOAL-PATH-001, BATCH-8517aa. Stages DEC-20261105-f0b7c7 and the
# TASK-20261105-18a59d artifacts (six handoffs, the additive goal-head update carrying
# the BATCH-c53152 checkpoint, the decision report) in ONE isolated commit, ALONE, then
# closes lane BATCH-c53152. Executed by the shell-holding top-level session in the
# coordinator role. Zero runs. Approves nothing.
handoff:
  id: TASK-20261105-c0d167
  from: coordinator
  to: coordinator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-8517aa
  authorized_by: DEC-20261105-f0b7c7 conditions OC-1 to OC-6 and NA-1
  objective: >-
    Commit and bind, in ONE isolated ledger archive commit, exactly the fifteen expected
    paths after checking OC-1 to OC-6 of DEC-20261105-f0b7c7, recording each in the
    receipt together with the input pins of TASK-20261105-ac5ad6. Verify, push, open or
    refresh the PR ready for review with auto-merge, then close lane BATCH-c53152. Runs
    ALONE.
  uncertainty_reduced: >-
    None about the mathematics. It makes the composition, the cleared B3, the pinned
    predictions and the batch opening durable together, or none of them.
  inputs:
    - ledger/decisions/DEC-20261105-f0b7c7.yaml
    - ledger/goals/GOAL-PATH-001.yaml
    - coordination/goals/GOAL-PATH-001/batches/BATCH-8517aa/dispatch_queue.json
    - coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/dispatch_queue.json
    - ledger/handoffs/TASK-20261105-18a59d.yaml
    - ledger/handoffs/TASK-20261105-c0d167.yaml
    - ledger/handoffs/TASK-20261105-ac5ad6.yaml
    - ledger/handoffs/TASK-20261105-7083a8.yaml
    - ledger/handoffs/TASK-20261105-165da2.yaml
    - ledger/handoffs/TASK-20261105-49716d.yaml
    - experiments/EXP-MONO-1a1be2/reports/review-DEC-20261105-f0b7c7/
    - tools/research_dispatch.py
    - tools/validate_ledger.py
    - tools/check_merge_hygiene.py
    - tools/check_review_independence.py
    - tools/ecc_priority.py
    - tools/autoresearch_focus.py
    - tools/allocate_id.py
    - tools/goal_lanes.py
  constraints:
    - >-
      LA-1 The queue comes first, in its own commit:
      coordination/goals/GOAL-PATH-001/batches/BATCH-8517aa/dispatch_queue.json only. Push it
      and render it with python3 tools/research_dispatch.py <queue> --ready-only, which must
      pass (OC-1). Record python3 tools/goal_lanes.py lanes GOAL-PATH-001. Then run python3
      tools/goal_lanes.py open-lane GOAL-PATH-001 BATCH-8517aa --queue <queue> --decision
      DEC-20261105-f0b7c7 --objective "EXP-MONO-1a1be2 pre-approval: KAT widening,
      throughput, code review; zero runs" --as <addr> --publish. The queue is never staged
      by an archive. No commit message or PR text in this batch states a lemma value or
      formula (PD-1 still binds anything derived).
    - >-
      LA-2 Before staging, merge origin/main into the working branch, never rebase. Record
      base_commit_checked and merge_outcome. A conflict inside a record stops the archive.
      If origin/main changed ledger/goals/GOAL-PATH-001.yaml, changed any file under
      experiments/EXP-MONO-1a1be2/, or added a record citing EXP-MONO-1a1be2 or
      H-MONO-23d347, stop and report to a fresh act (spare DEC-20261105-c7974d).
    - >-
      LA-3 Goal-head check, mechanical (OC-3). Against the base, the diff of
      ledger/goals/GOAL-PATH-001.yaml may contain only the following:
      - current_batch_id changed from BATCH-c53152 to BATCH-8517aa;
      - dispatch_queue_path changed to the BATCH-8517aa queue path;
      - new keys current_batch_id_before_BATCH-8517aa,
        dispatch_queue_path_before_BATCH-8517aa, current_batch_note_2026_11_05,
        open_batches_note_2026_11_05 and next_action_2026_11_05 (under 1,000 characters);
      - one item appended to batch_checkpoints (BATCH-c53152);
      - one item appended to open_batches (BATCH-8517aa);
      - one item appended to impediments (IMP-PATH-20261105-1).
      status stays active. Every existing key and list item is byte-identical. Record the
      base sha256. Any other changed line is a scope finding: stop and report. Do not run
      tools/shard_goal.py.
    - >-
      LA-4 Queue and card check. Each of the six handoffs parses with a non-empty
      objective, deliverables and completion_gate. The queue's embedded handoffs agree with
      the ledger cards on id, role, write_scope, artifact_paths and archived_by. The write
      scope of ac5ad6 is disjoint from every expected path of this archive.
    - >-
      LA-5 Identifier check (OC-4). Run python3 tools/allocate_id.py --check on
      DEC-20261105-f0b7c7, DEC-20261105-c7974d, BATCH-8517aa and the six TASK ids. Record
      each output.
    - >-
      LA-6 ECC and focus (OC-2). Run python3 tools/ecc_priority.py --classify on RQ-MONO-001
      and GOAL-PATH-001, and --budget-violations, then python3 tools/autoresearch_focus.py
      for GOAL-PATH-001. Record all outputs verbatim. Stop if not ECC or if there is a budget
      violation.
    - >-
      LA-7 Contract and round check (OC-5). Check that
      experiments/EXP-MONO-1a1be2/specification.yaml has sha256 equal to
      d81a85b36961647d6d6caccdf988d5650a7376fa581173f9761ab3ed594bc373 and is
      review_required. Re-run python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-PATH-001/batches/BATCH-c53152 --reports
      coordination/goals/GOAL-PATH-001/review/TASK-20261029-3ac467, and record the output
      verbatim (expected PASS, with the history check UNCHECKABLE).
    - >-
      LA-8 Decision report. Confirm that the six report files exist as specified in
      DEC-20261105-f0b7c7 visual_report, that report.pdf was opened and every page
      inspected, and that figure-data.json values carry their computations.json step ids.
      If no renderer installed: report.pdf is absent, the blocker is stated in report.typ,
      and the receipt records the deviation with fourteen expected paths.
    - >-
      LA-9 Stage exactly the fifteen expected paths, one by one. git add -A, git add . and
      directory adds are forbidden. Run tools/validate_ledger.py and
      tools/check_merge_hygiene.py before committing (OC-6). Record pre-existing errors as
      pre-existing.
    - >-
      LA-10 Input pins. Record in the receipt the sha256 of every file in the inputs list
      of TASK-20261105-ac5ad6, under input_pins_TASK-20261105-ac5ad6, at their bytes in the
      merged tree. That includes the post-#2707 code at its main bytes.
    - >-
      LA-11 binding_mode content_at_commit. The commit message names TASK-20261105-c0d167
      and every record_id literally. It states that nothing is approved, that
      EXP-MONO-1a1be2 stays review_required, and that there are zero runs. It states no
      lemma value, formula, prediction value or prior. Verify the receipt with
      tools/research_dispatch.py. Push, open or refresh the PR against main ready for review
      naming every record id, and enable auto-merge (gh pr merge <n> --auto --merge).
    - >-
      LA-12 After verification and push, close the lane: python3 tools/goal_lanes.py
      close-lane GOAL-PATH-001 BATCH-c53152 --outcome archived --decision
      DEC-20261105-f0b7c7 --ledger-commit <this commit> --as <addr> --publish. Append a
      tasks_state_revisions entry to the BATCH-c53152 queue in a later commit, recording
      that the composition took place and the lane closed.
    - >-
      LA-13 Release with --outcome completed and --artifact <path>=<sha256> for both
      artifact paths. If any OC fails, stop before staging: nothing in DEC-20261105-f0b7c7
      takes effect, and a fresh act uses spare DEC-20261105-c7974d. Never amend, rebase or
      force-push. Zero runs.
