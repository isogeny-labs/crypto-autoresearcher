  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/outputs/pooled-strata.json
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/outputs/ptm-results.json
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/outputs/near-degenerate.json
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/outputs/scope-and-wording.md
  artifact_paths:
