  - experiments/EXP-PFDR-bb0d26/runs/RUN-PFDR-4d8c71/toy-main-jobs.jsonl
  - experiments/EXP-PFDR-bb0d26/runs/RUN-PFDR-cd03e2/toy-rep-jobs.jsonl
  - experiments/EXP-PFDR-bb0d26/runs/RUN-PFDR-e44a19/design.json
  - experiments/EXP-PFDR-bb0d26/implementation/
  - experiments/EXP-PFDR-bb0d26/audits/AUD-20261029T012603Z-0b6353/audit-review.yaml
  - ledger/decisions/DEC-20261022-f1efde.yaml
  - ledger/decisions/DEC-20261022-9aec2b.yaml
  - ledger/decisions/DEC-20261029-5554ee.yaml
  - ledger/proposals/IDEA-20261017-078074.yaml
  - ledger/proposals/IDEA-20261017-078074.notes.md
  - ledger/proposals/IDEA-20261017-bbc53e.yaml
  - knowledge/open-problems/KN-OPEN-020.md
