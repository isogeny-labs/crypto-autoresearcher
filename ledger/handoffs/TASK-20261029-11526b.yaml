handoff:
  id: TASK-20261029-11526b
  from: coordinator
  to: red-team
  role: red-team
  recorded_at: '2026-10-29'
  opened_by_decision: DEC-20261029-8b2734
  goal_id: GOAL-PFDR-fd09e0
  lane: BATCH-924d2c
  experiment_id: EXP-PFDR-bb0d26
  hypothesis_id: H-PFDR-727bfc
  joints_owned:
  - J3a
  - J3b
  owns_controls:
  - proves_too_much (PTM-1 to PTM-5 of the review plan)
  objective: >-
    Red-team the interpretation of the EXP-PFDR-bb0d26 toy reading: whether its null is powered and calibrated (J3a),
    and whether the conclusion drawn from it follows, is scoped, and survives the proves-too-much objects (J3b). Report
    verdicts on J3a and J3b only.
  uncertainty_reduced: >-
    How large an effect the null could hide at each powered cell, whether the z statistic and its tail behave as the
    contract assumes, whether a sub-threshold departure is pooled away, and which sentence of the intended conclusion
    the data actually license. It does not decide the hypothesis.
  review_plan: coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/review-plan.yaml
  review_plan_parts_for_this_task: >-
    claim_under_review, frozen_outcome_rule (including decision_impact_on_positive), joints J3a and J3b (attack_plan,
    breaking_artifact), proves_too_much (objects, failure_signature), gaps G-5, composition_rule.promotion_gates_note,
    report_contract
  inputs:
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/review-plan.yaml
  - experiments/EXP-PFDR-bb0d26/specification.yaml
  - ledger/hypotheses/H-PFDR-727bfc.yaml
