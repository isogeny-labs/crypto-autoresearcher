  - DP-5 of DEC-20261029-8b2734 (resume checkpoint first if the hooks gate the PTM computations as a run launcher)
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    delivery: interactive
  budget:
    wall_clock_seconds: 28800
    memory_gb: 4
    maximum_runs: 0
    maximum_workers: 2
  completion_gate:
  - power-table.json covers all 44 powered cells (and states the invalid cell as not assessable); calibration-loo.json, tail-and-correlation.json and pooled-strata.json state inputs by pointer, method and result.
  - ptm-results.json reports every PTM object with its cells, curves, construction parameters, measured kappa and z, the frozen classification it receives and pass or fail against the plan's failure_signature; an object that could not be built is reported as not built with the reason.
  - scope-and-wording.md gives the narrowest surviving conclusion sentence, the sentences that fail and the object that defeats each, the regime table, and the answers to J3b items (4) and (5).
  - report.yaml carries a top-level review_attestation with task_id TASK-20261029-11526b, joints_owned [J3a, J3b], sources_read (repo-relative, complete), read_sibling_reports false, verdicts {J3a, J3b each holds|breaks|inconclusive}, procedure_deviations and the served inference binding, plus the artifact inventory.
  - No verdict on the whole claim, no status change, no commit, no file outside the write_scope.
  state: queued
  return_format: >-
    report.yaml path and sha256; the J3a and J3b verdicts each with a one-paragraph basis; the cells (if any) where a 10%
    departure could hide; the PTM pass/fail table; the narrowest surviving conclusion sentence; the read-set
    attestation; every deviation.
