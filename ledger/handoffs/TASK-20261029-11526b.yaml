  - docs/target-result-profile.md
  - docs/claims-and-verification.md
  - docs/evidence-and-reproducibility.md
  - AGENTS.md
  - agents/red-team.md
  inputs_note: >-
    The implementation is readable for its seeding convention, its label universe test and the bound analyze path you
    may call in-process for PTM-1; do not treat it as correct, and prefer your own code for every count you rely on.
    The audit-review is an earlier screen, not a sibling of this round; its descriptive tail note and not_covered list
    are attack inputs, not conclusions.
  attack_plan_J3a: >-
    (1) Per powered cell: delta_min = 4 sqrt(V (1 + 1/20)) / M and the normal-approximation power of the flag rule at a
    true 10% excess and a 10% deficit; list every cell with power < 0.95 or delta_min > 0.10, against the contract's
    sample_size_justification and the measured over-dispersion V / M. (2) The equivalence bound each null cell actually
    establishes (max |ci95 - 1|), so the claim can be stated per cell as "no effect larger than x". (3) Calibration:
    leave-one-out z for every replicate k = 0..19 against the other 19 in every powered cell; estimate the null mean
    and sd of z per cell and pooled; decide whether the recorded calibration mean (about -0.27 over n 44) is chance or
    a systematic bias, and what a bias does to the gap z and to each tail of the flag rule. (4) Tail: the probability of
    a largest |z| >= 3.13 among 44 powered cells under independence (Sidak) and under the estimated cross-cell
    correlation (cells at one bits share curves; estimate from per-curve standardized residuals), with and without the
    estimated bias; say whether the largest-|z| cell (|kappa - 1| about 0.001 at a very high-count cell) indicates a real
    but tiny effect that the 5% margin by design ignores. (5) Pooled signal: Stouffer z and inverse-variance pooled
    kappa by r, by bits and by n, with heterogeneity; kappa_even against kappa_odd; null_mean_over_formula.
  attack_plan_J3b: >-
    Run PTM-1 to PTM-5 exactly as the plan's proves_too_much block states (even/odd split for the pseudo-replication;
    main-block curves only; no new seed block) and read decision_impact.on_positive against them sentence by sentence.
    Then: (1) for each cell give n^2/p, E[C] per set and n relative to sqrt(p), and state which regime the reading
    covers and that the cryptographic regime (E[C] far below 1) is not covered; (2) list every object the intended
    wording could be read to cover and that was not tested (translated or other-shaped boxes, both lifts, y-labels,
    other curve models, non-log-GAP bases, h >= 3, n above 4096, p above 2^28, standardized curves); (3) per job, compare
    gap_C / mean(null_C) for ok jobs in the top decile of duplicate_skips against the rest within each (bits, r), and
    say what the degenerate jobs (half-box exhausted) imply for the invalid cell and for curves with a short relation
    among the base points; (4) say whether the four asymptotic promotion gates and the exemplar-claim checklist of
    docs/target-result-profile.md apply (asymptotic_claim is null, no exponent is claimed) and which heuristic-validation
    obligations do; (5) say whether a move to supported on this run set is consistent with the rules given that the
    frozen rule required no replication block; (6) write the narrowest conclusion sentence that survives every PTM
    object, and the sentences that do not.
  constraints:
  - >-
    maximum_runs 0 scientific runs: the PTM sets and the statistics are checks on known-false objects and recorded data,
    not trials of H-PFDR-727bfc. Use only main-block curves of recorded jobs (seed 8,100,000 + c); never touch the
    replication block (8,200,000 + c), the selftest block or any other experiment's reserved seeds. Nothing is written
    under experiments/ and nothing gets a RUN id.
  - >-
    Use python -B; if you call the bound analyze path in-process, its outputs go to your outputs/ only. Build any kernel
    copy into your outputs/ or a scratch path, never into implementation/.
  - >-
    Do not read any sibling report of this round (TASK-20261029-2c7b52, TASK-20261029-e54312) or the blind owner's tree;
    read_sibling_reports must be false.
  - >-
    Report what the data and the objects show; do not repair, estimate or invent a missing value. A crash or timeout of
    your own computation is an infrastructure note, never a result.
  - >-
    Verdicts on J3a and J3b only, never on the whole claim or the hypothesis; no status change; no commit.
  deliverables:
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/report.yaml
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/scripts/
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/outputs/power-table.json
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/outputs/calibration-loo.json
