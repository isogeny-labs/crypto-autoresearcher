    credential value in the harness is a literal dummy. A proxy variable in a case points at a loopback
    port with no listener, or at a local stub you write that logs and refuses; no traffic leaves the
    container. You may call runbook.py's process-launch functions from a scratch Python harness on
    scratch argv, and `tools/runbook.py lint`. Nothing under any pod-uid prefix is read, real or copied,
    and scratchpad/dl-8b0d47-receipt/ is not opened.
  - >-
    RT-3 Do not edit any input. Write fixtures and scripts only under the review directory. Never write,
    move, replace or chmod anything under /root/.ccr. An attack on the CA pin uses scratch paths, or a copy
    of a script with K7_CA_BUNDLE_ALLOWED pointed at a scratch file, and says which. A break is reported
    with its reproducing fixture. It is never patched.
  - >-
    RT-4 Read no records.jsonl, audit, replay, run log, arm statistic or ratio, and no runs/ or
    runbook-sessions/ content.
  - >-
    RT-5 Confirm by your own runs:
      - (a) rt_regression.sh on v3d (every row PASS) and its legacy replay (the 9d2b6a verdicts reproduce
        on the v3b fixtures). test_locator.sh with the checkout argument (0 fail, 0 skip). And one fixture
        per 9d2b6a break class written by you, not copied from the ported suite: a blind re-derivation of
        the refusal.
      - (b) the K-4 to K-7 case rows; and at least these attacks on K-1 and K-2: a results_uri equal to the
        located prefix with a foreign pod_uid; a second pod prefix created between the receipt listing and
        the pod listing; a same-size replacement of a multipart object after the pod listing (state
        whether the S2 path refuses it or it remains the declared residual); a LastModified string format
        the pin comparison mis-orders; and objects.json entries with duplicate keys.
      - (c) mutation_check.sh, the full run, on frozen bytes (no edit while it runs), with the
        CAUGHT/SUBSUMED/SURVIVED table. Build the K2-nonempty and K4-type pair mutants yourself and show the
        pair is caught. Add at least one mutant of your own for each new v3d check (proxy pin, case-pair
        equality, NO_PROXY pin, CA path pin, CA realpath, CA without a proxy, ca_bundle and the other added
        configuration names, CR-1, CR-2, PY-1). A surviving mutant is a finding.
      - (d) at least these attacks on K-7 and the argv:
          - HTTPS_PROXY versus https_proxy precedence when they differ;
          - a proxy value with userinfo, an IPv6 or 0.0.0.0 loopback spelling, a trailing newline, or percent-encoding;
          - AWS_CA_BUNDLE as a symlink, as a hard link, or under a symlinked parent; a CA file swapped between the phase-2 hash and the CLI's read (TOCTOU; state whether it is a residual);
          - config ca_bundle when AWS_CA_BUNDLE is unset; the `[services ...]` or `s3 =` sub-sections and indented keys; entries in ~/.aws/credentials;
          - credentials missing or empty, so that the CLI falls back to files, the profile chain, a container endpoint or IMDS;
          - a .pth file or usercustomize under $HOME/.local, and other HOME-relative startup files that the aws CLI or its Python reads;
          - a shim (python3, bash, jq, sha256sum) in the trusted aws directory, which is the declared residual; confirm its reach;
          - the C1_ENV_PHASE=2 spoof and C1_ENV_DROPPED injection;
          - environment names that are not valid identifiers; BASH_FUNC_ names with odd suffixes;
          - BASH_ENV, ENV, SHELLOPTS=xtrace with a PS4 command substitution, BASHOPTS, GLOBIGNORE and CDPATH, run through `/bin/bash -p` exactly as runbook.py run_process and the trial supervisor launch S01, S02, S04 and T2;
          - whether runbook.py or the supervisor adds or keeps any variable on the way to argv;
          - the `#!/usr/bin/env bash` of launch-remote and validate-request under the reduced PATH.
  - >-
    RT-6 Do not stage, commit or push. Archive TASK-20261107-a9406e commits the review directory.
