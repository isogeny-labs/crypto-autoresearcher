  objective: >-
    Attack the v3d locator and environment joint, and report per question either a concrete break
    (an input, the observed output, and a fixture that reproduces it) or an argument why none exists.
    Questions:
    (a) Is every 9d2b6a break still refused on v3d? That means A01, A02, A03, A09a, A09b, A10, B12a,
        B12b, B14a and B14b, the crash paths B03, B04 and B15a to B15c, and C01, C02 and C04, each by your own
        fixture as well as by the ported suite.
    (b) Can you break K-1 (one locator rule) or K-2 (bytes bound to objects.json, the T1 receipt pins
        and the LastModified pin)? Do K-4 (strict job exit), K-5 (post-submission crashes, exit 5 with
        raw-result.json) and K-6 (receipt tightening) hold on the cases that name them?
    (c) Does the mutation check hold when re-run by you? Is every check in tests/mutate.py load-bearing,
        are the two SUBSUMED claims true, and is every new v3d check caught when removed?
    (d) Can a caller-controlled environment, file or argv defeat K-7 as v3d implements it? That means the
        prologue, the transport pins, the CA pin, the credential source, the configuration scan, and the
        `/bin/bash -p` argv as tools/runbook.py and the trial supervisor actually execute it.
  uncertainty_reduced: >-
    Whether the bytes that S02 and S03 will run can admit the wrong bytes, a forged S3 response, a
