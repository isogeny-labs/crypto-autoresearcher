  constraints:
  - >-
    RT-1 Independence. The reviewer is not the director session of TASK-20261107-d07e94 or
    TASK-20261107-5f7d2b, not the archiver of either, and did not author or edit any input. It runs in its
    own fresh session. If it is the 9d2b6a reviewer's session, it says so.
  - >-
    RT-2 Isolation. Zero AWS calls of any kind, read-only included, and zero launches. Never run
    launch_eks.sh, reconcile_run.sh, probe_s01.sh or `tools/runbook.py run` against real AWS or a real
    session. Run the scripts only under `env -i` with tests/fake-aws and fake-launch-remote, with a PATH
