    - >-
      The shared queue is built from the two queue.preview.json files. It has
      these top-level keys: schema crypto.autoresearch.dispatch_queue.v1,
      objective (one sentence covering both experiments), goal_id
      GOAL-ICPERF-e6b6a4, batch_id BATCH-38f344, max_concurrent 1,
      max_concurrent_basis (one executor at a time across both experiments;
