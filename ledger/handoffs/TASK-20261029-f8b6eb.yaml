      by TASK-20261029-f8b6eb under DEC-20261029-3bfa78, that it launches
      nothing, and that queued tasks have no execution authority until the
      approval decision is archived and execution_state is ready), and tasks.
      The per-experiment top-level keys experiment_id, task_id, approved_by
      and hypothesis_id are dropped. Each experiment stays identified by its
      own tasks and embedded handoffs. The tasks are the four existing tasks
      in this order: TASK-20261029-65798b, TASK-20261029-fe381b,
      TASK-20261029-f370f1, TASK-20261029-6b18a6. Each is byte-for-byte equal
      as parsed JSON, except for the embedded executor handoff's
      execution.trial_plan_sha256, which is set to the new trial-plan sha256.
      If validate_queue refuses the merged queue (for example, overlapping
      write scopes), stop and report the error. Do not change a task to make
      it pass.
    - >-
      Order of work, to avoid circularity: (1) edit both trial plans and
      record their new sha256; (2) write the shared queue; (3) update the
      runbook trial-plan binds; (4) run python3 tools/runbook.py lint on each
      runbook and write its stdout verbatim to runbook-lint.txt; (5) write the
      handoff previews and packets; (6) run the probe.
    - >-
      Each new packet.json differs from its original only in these fields:
      queue and preview.queue set to the shared queue path; lane_id
      BATCH-38f344; preview.handoff set to the new handoff.preview.yaml;
      execution_route.lint_receipt_sha256 set to the new receipt's sha256;
      source_ref origin/main. approval_decision_id, experiment_id, handoff,
      specification, trial_plan, preview.specification (the original
      TASK-20261029-038368 specification.preview.yaml) and
      preview.trial_plan stay the same.
    - >-
      Each new handoff.preview.yaml is the original preview with only
      execution.trial_plan_sha256 changed. Keep the first-line comment and
      update only its path wording if it names the old directory.
    - >-
      Run no trial and no runbook session. Do not run tools/runbook.py run.
      Do not create run directories or claims under the lane's batches
      directory. Running the unit tests is not required.
    - >-
      A tool crash or refusal is an infrastructure finding. Report it
      verbatim. Never work around it by editing bytes outside these
      constraints.
