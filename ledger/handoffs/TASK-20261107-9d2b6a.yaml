    (c) Can reconcile_run.sh submit anything (launch-remote, CodeBuild, kubectl, an
        isolab-eks-mcp write) or write to S3 or any AWS service, including through an environment
        variable, PATH, a sourced file or a fixture hook?
    (d) B-FILED-BEFORE-AFFECTED-DATA: is `filed_before_affected_data: true` in the protocol v3
        freeze truthful? S1's job output existed in S3 before C1-AMENDMENT-2 was filed. PD-1 read
        integrity counts only. State what 'affected data' means under the freeze semantics of
        experiment_protocol.py and docs/experiment-protocol.md, and whether the flag holds, holds
        only with the AMENDMENT-2 disclosure, or must be qualified.
  uncertainty_reduced: >-
    Whether the S1 reconciliation and the S2 launch can admit the wrong bytes, or spend, through the
    new locator. That is the load-bearing joint before approval DEC-20261107-7802ec.
