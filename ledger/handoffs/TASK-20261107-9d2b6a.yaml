  objective: >-
    Attack the committed locator joint and report, per question, either a concrete break (an
    input, the observed output, and a fixture that reproduces it) or an argument why none exists.
    Questions:
    (a) Can locate_results.sh, as used by launch_eks.sh v3b or by reconcile_run.sh, bind a foreign,
        stale or attacker-placed results prefix, or another job's or another attempt's pod?
    (b) Can v3b write outcome_class job_completed, or exit 0, without having downloaded this pod's
