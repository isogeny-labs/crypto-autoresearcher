  - 'Own J-math and J-radius: test identity/vertical/tangent and undefined continuation,
    missing seed chain, wrong recurrence sign, duplicate/omitted list words, strict
    upper interval, both equations, exact t0.e0 embedding and complete costs. Proves-too-much
    controls must fail where expected; no independent-bit assumption or family conclusion.'
