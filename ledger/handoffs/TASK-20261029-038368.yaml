# TASK-20261029-038368: design the version-2 successor contracts of the two
# ICPERF stage-0 instruments (EXP-ICPERF-e467a5, EXP-ICPERF-b2f2d0). Design
# only. No trial, no approval, no status move.
handoff:
  id: TASK-20261029-038368
  from: coordinator
  to: executor
  role: executor
  recorded_at: '2026-10-29'
  kind: amendment_design_package
  opened_by_decision: [DEC-20261029-9bc3ff, DEC-20261029-22e05b]
  goal_id: GOAL-ICPERF-e6b6a4
  hypothesis_ids: [H-ICPERF-2f52d1, H-ICPERF-5adc9b]
  predecessor_experiments: [EXP-ICPERF-e467a5, EXP-ICPERF-b2f2d0]
  objective: >-
    For each of the two stage-0 instruments, write a versioned
    protocol_amendment (version 1 to 2) and a complete version-2 successor
    contract at review_required. A successor is a new experiment id with its own
    specification, implementation, trial plan and runbook (new session id). It
    must be able to give the instrument cell its first valid observation. The
    success criterion of version 1 stays as frozen. Run no trial.
  uncertainty_reduced: >-
    Whether each stage-0 instrument can be made to produce a schema-valid,
    self-checking run whose runbook decides the frozen success criterion by
    itself. That is the precondition, in decision_impact.on_positive of both
    version-1 contracts, for any later amendment that binds host receipts or
    probe panels for IDEA-20261015-7a3c9e and IDEA-20261015-b41f68.
  rank_rationale: >-
    Ranked ahead of doing nothing. GOAL-ICPERF-e6b6a4 is ECC (tools/ecc_priority.py).
    The work is cheap: design only, two toy instruments, zero runs. After DEC-20261029-9bc3ff
    and DEC-20261029-22e05b it is the only lawful route to a valid observation of either
    gate. Both version-1 sessions are terminal, an unchanged rerun would be
    refused again (F2), and docs/runbook-execution.md requires an amended
    runbook with a new session id and a new approval.
  route_note: >-
    The Coordinator amends the top-level session's proposed reading here. A
    same-id amendment written only under amendments/** cannot reach
    tools/experiment_preapproval.py approvable true, for two reasons. The probe
    pins experiments/<EXP>/specification.yaml and trial-plan.json and refuses a
    canonical experiment that is already approved (tools/experiment_preapproval.py
    lines 207-210 and 226-231). A runbook's session directory is
    <runbook dir>/runbook-sessions/<id> (tools/runbook.py:280-285), while audit
    discovery globs experiments/*/runbook-sessions/* (tools/runbook.py:2156)
    and /run resolves experiments/<EXP-ID>/runbook.yaml (run SKILL.md). The
    version-2 contract is therefore a successor experiment that cites the same
    hypothesis. The amendment record lives in the predecessor's amendments/.
  inputs:
    - ledger/decisions/DEC-20261029-9bc3ff.yaml (specification_findings_for_the_amendment SF-1..SF-4; your context)
    - ledger/decisions/DEC-20261029-22e05b.yaml (findings_adopted F2..F5; your context)
    - experiments/EXP-ICPERF-e467a5/specification.yaml
    - experiments/EXP-ICPERF-e467a5/runbook.yaml
    - experiments/EXP-ICPERF-e467a5/trial-plan.json
    - experiments/EXP-ICPERF-e467a5/implementation/run.py
    - experiments/EXP-ICPERF-e467a5/implementation/check.py
    - experiments/EXP-ICPERF-e467a5/audits/AUD-20261029T011541Z-d57860/audit-review.yaml (specification_fidelity; your context)
    - experiments/EXP-ICPERF-b2f2d0/specification.yaml
    - experiments/EXP-ICPERF-b2f2d0/runbook.yaml
    - experiments/EXP-ICPERF-b2f2d0/trial-plan.json
    - experiments/EXP-ICPERF-b2f2d0/implementation/run.py
    - experiments/EXP-ICPERF-b2f2d0/implementation/check.py
    - experiments/EXP-ICPERF-b2f2d0/audits/AUD-20261029T011541Z-f9db07/audit-review-escalation.yaml (claims 1-4, findings F2-F5, control_discrimination; your context)
    - ledger/hypotheses/H-ICPERF-2f52d1.yaml
    - ledger/hypotheses/H-ICPERF-5adc9b.yaml
    - tools/experiment_execution.py (complete_manifest, manifest_schema_errors; read only)
    - tools/validate_ledger.py (check_run; read only)
    - templates/runbook.yaml
    - docs/runbook-execution.md
    - docs/experiment-protocol.md
    - docs/task-lifecycle.md ("Protocol amendments")
    - agents/experiment-director.md (Mode 1, steps 1-2; the runbook discipline you follow)
  constraints:
    - id: C-1
      text: >-
        Edit no existing file. That covers both version-1 specifications,
        trial plans, runbooks and implementation/ trees, every run, session,
        audit and report directory, and every hypothesis, decision and goal.
        Version 1 stays frozen and is never rerun.
    - id: C-2
      text: >-
        Run no trial. Do not call tools/runbook.py run, tools/experiment_execution.py
        run or /run. Unit tests of the new driver and checker in a scratch
        directory outside the repository are allowed. So are read-only calls of
        complete_manifest and check_run on a design-time manifest. Nothing is
        written under any runs/ or runbook-sessions/ directory.
    - id: C-3
      text: >-
        Allocate the two successor experiment ids with python3 tools/allocate_id.py
        --next experiment --area ICPERF, then --check. Allocate each successor's
        run id, and reserve one approval DEC id, one executor TASK id and one
        ledger-archive TASK id per successor, the same way. Record every id with
        its --check output in experiments/<predecessor>/amendments/AMD-20261029-v2/successor.yaml.
        A reservation writes no record and approves nothing.
    - id: C-4
      text: >-
        Keep each version-1 success_criterion and falsification_criterion
        verbatim. Encode them as runbook validity assertions on the exact
        preregistered integers and flags: 925, 4, true, true for e467a5, and
        2943, 289567, 28, true, true for b2f2d0. Any other change of criterion
        is out of scope. prediction_provenance must disclose that readers saw
        the invalid version-1 unit's raw values (data_seen), and that the
        integers came from run.py at design time.
    - id: C-5
      text: >-
        Controls must discriminate. For e467a5 (SF-1), label the
        r-change, A-change and BSGS comparisons as arithmetic-consistency
        checks, or replace them. Add at least one planted negative control that
        must fail: a perturbed price constant, or an online model whose
        precomputation is not states*c_state, must give a reduced ratio other
        than 925/4. Compute the probe count independently of the formula it is
        compared with. For b2f2d0 (F4), report the band flags as descriptive
        fields. Add a negative control that must fail the exact match, such as a
        wrong shift triple or the support-{0,...} reading. Each control states
        its pass and fail condition in the specification and has a runbook
        assertion.
    - id: C-6
      text: >-
        Close the specification gaps in text. For e467a5 (SF-3), state the BL
        online-time model and precomputation_steps = 525, and say that the
        factor 10 reads as bl_den. For b2f2d0 (F5), state the recurrence:
        xorshift32 left/right/left with shifts (13, 17, 5) mod 2^32,
        step-then-test, trials with support {1, 2, ...}, the stream continuing
        from the previous stop, and the seed not a tested state. State the
        triple as a definition. Any literature attribution is recalled
        provenance and a pointer only.
    - id: C-7
      text: >-
        The new run.py writes attack_claimed false in raw-result.json and the
        manifest (F2/SF-4). A design-time manifest, after complete_manifest,
        must give zero check_run errors. Every primary metric gets a runbook
        metric and a validity assertion. Bind the cells or inputs as
        spec_bindings. Replay compares integers and booleans exactly.
    - id: C-8
      text: >-
        Toy scope only. Use no host receipt, pointer chase, 8 GiB table or n=83
        figure, and no external computer-algebra system. Make no speedup or
        latency statement.
    - id: C-9
      text: >-
        Write only inside write_scope. Each successor directory is
        experiments/<successor id from successor.yaml>/ and holds no runs/,
        runbook-sessions/, reports/ or audits/. Hand the exact paths to
        TASK-20261029-c0d4cd, and commit nothing yourself.
  deliverables:
    - >-
      Per predecessor P in {EXP-ICPERF-e467a5, EXP-ICPERF-b2f2d0}:
      experiments/P/amendments/AMD-20261029-v2/protocol-amendment.yaml. It is a
      protocol_amendment record (docs/task-lifecycle.md) with version_from 1,
      version_to 2, the successor id, reason, changes, affected_runs (the
      invalid version-1 run) and confirmatory_status preserved, with
      approved_by null until the Coordinator decides.
    - experiments/P/amendments/AMD-20261029-v2/successor.yaml (allocated and reserved ids with their --check output)
    - >-
      Per successor S: experiments/S/specification.yaml (status review_required,
      version 2, frozen false, approved_by null, predecessor P, hypothesis_id
      unchanged, no outcome field), experiments/S/implementation/run.py,
      experiments/S/implementation/check.py,
      experiments/S/implementation/test_unit.py,
      experiments/S/implementation/unit-test-report.txt,
      experiments/S/trial-plan.json (freeze-filled with the reserved ids),
      experiments/S/runbook.yaml (new session id),
      experiments/S/runbook-lint.txt, and experiments/S/amendments/.gitkeep
    - >-
      Per successor S, the preapproval packet:
      coordination/design/TASK-20261029-038368/S/packet.json, the preview
      queue and executor-handoff preview files it names in the same directory,
      and preapproval-report.json, the verbatim probe output.
    - coordination/design/TASK-20261029-038368/return.yaml (execution_report form of agents/executor.md, with every value not taken from a version-1 specification listed as a specification_error for the Coordinator)
  artifact_paths:
    - experiments/EXP-ICPERF-e467a5/amendments/AMD-20261029-v2/protocol-amendment.yaml
    - experiments/EXP-ICPERF-e467a5/amendments/AMD-20261029-v2/successor.yaml
    - experiments/EXP-ICPERF-b2f2d0/amendments/AMD-20261029-v2/protocol-amendment.yaml
    - experiments/EXP-ICPERF-b2f2d0/amendments/AMD-20261029-v2/successor.yaml
    - coordination/design/TASK-20261029-038368/return.yaml
    - "experiments/<S1>/{specification.yaml, trial-plan.json, runbook.yaml, runbook-lint.txt, amendments/.gitkeep, implementation/run.py, implementation/check.py, implementation/test_unit.py, implementation/unit-test-report.txt}"
    - "experiments/<S2>/{same nine paths}"
    - "coordination/design/TASK-20261029-038368/<S1>/{packet.json, preapproval-report.json, queue.preview.json, handoff.preview.yaml}"
    - "coordination/design/TASK-20261029-038368/<S2>/{same four paths}"
  artifact_paths_note: >-
    <S1> and <S2> are the successor experiment ids of EXP-ICPERF-e467a5 and
    EXP-ICPERF-b2f2d0. They are written in the two successor.yaml files above,
    at exact paths. The archive TASK-20261029-c0d4cd expands the brace lists
    from those files, verifies them, and binds the expanded paths and their
    sha256. The ids cannot be known when this card is written, and the card is
    never edited to name them. This is a recorded procedure deviation from
    "exact artifact paths on the card".
  write_scope:
    - experiments/EXP-ICPERF-e467a5/amendments/**
    - experiments/EXP-ICPERF-b2f2d0/amendments/**
    - experiments/<S1>/** (excluding runs/, runbook-sessions/, reports/, audits/)
    - experiments/<S2>/** (excluding runs/, runbook-sessions/, reports/, audits/)
    - coordination/design/TASK-20261029-038368/**
  archived_by: TASK-20261029-c0d4cd
  depends_on: []
  dispatch_preconditions:
    - TASK-20261029-087ab5 committed and pushed, its receipt recorded, so this card and DEC-20261029-9bc3ff / -22e05b are committed inputs
    - if GOAL-ICPERF-e6b6a4 is being worked by another session, a lane claimed with tools/goal_lanes.py within max_concurrent 2 (machine headroom)
  review_required: false
  review_note: >-
    This is a design package, not a claim-changing result. The Coordinator
    checks it at the approval decision, and approval asserts nothing about
    either hypothesis.
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  policy_rationale: >-
    The package is mainly new driver and checker code (run.py, check.py, unit
    tests), which is the executor's implementation lane (agents/executor.md;
    precedent TASK-20261022-726d76). The experiment-director may write
    runbooks and cards only ("Nothing else", agents/experiment-director.md), so
    it cannot write the driver. One producer owns every byte the runbook and the
    probe bind, so the bound hashes come from one consistent package. The
    runbook follows the director's Mode 1 discipline (bind every byte,
    spec_bindings for every restated value, lint until LINT OK, never weaken an
    assertion).
  budget:
    maximum_runs: 0
  completion_gate:
    - Both protocol-amendment.yaml and successor.yaml files exist. successor.yaml records every allocated or reserved id with its allocate_id.py --check output.
    - Each successor specification is review_required, version 2, names its predecessor and hypothesis, carries the version-1 success and falsification criteria verbatim, and has no outcome field.
    - The unit tests pass. A design-time manifest passed through complete_manifest gives zero check_run errors, and raw-result.json and the manifest carry attack_claimed false.
    - Every planted negative control fails as specified in a unit test, and every positive assertion holds on the design-time output.
    - python3 tools/runbook.py lint experiments/<S>/runbook.yaml prints LINT OK for each successor, saved byte-for-byte as runbook-lint.txt, with a session id different from RBS-ICPERF-b7e41c and RBS-ICPERF-c4a91e.
    - >-
      python3 tools/experiment_preapproval.py --packet runs on each packet, and
      its output is saved verbatim as preapproval-report.json. approvable true
      is required. A blocker that only commit, push or lane opening can clear
      (bytes not committed at source_ref, lane not open) may remain. It is
      listed exactly, and the top-level session re-runs the probe after
      TASK-20261029-c0d4cd pushes. Any other blocker fails this gate.
    - No byte outside write_scope changed, and no runs/ or runbook-sessions/ directory was created.
  return_format: >-
    Paths and sha256 of every artifact; the two successor ids; both lint outputs
    verbatim; both probe reports verbatim; the unit-test summary; the list of
    specification_error items. No interpretation of either hypothesis.
  state: queued
