# TASK-20261029-c0d4cd: Coordinator archive of the returns of the three
# producer tasks opened by the LGN-9 rulings. Custody only: no approval, no
# status move, no scientific adjudication.
handoff:
  id: TASK-20261029-c0d4cd
  from: coordinator
  to: coordinator
  role: coordinator
  recorded_at: '2026-10-29'
  kind: archive
  opened_by_decision: [DEC-20261029-9bc3ff, DEC-20261029-22e05b, DEC-20261029-5554ee]
  goal_ids: [GOAL-ICPERF-e6b6a4]
  objective: >-
    Once TASK-20261029-038368, TASK-20261029-1bcf80 and TASK-20261029-583a07
    have returned, commit their exact declared artifacts. Record a receipt
    bound to git, and publish through a PR against main.
  uncertainty_reduced: >-
    Durable custody of the successor design packages and the two harness
    repairs. Without it, the successor approval cannot be probed at a pushed
    source_ref.
  inputs:
    - ledger/handoffs/TASK-20261029-038368.yaml
    - ledger/handoffs/TASK-20261029-1bcf80.yaml
    - ledger/handoffs/TASK-20261029-583a07.yaml
    - experiments/EXP-ICPERF-e467a5/amendments/AMD-20261029-v2/successor.yaml (expands <S1>)
    - experiments/EXP-ICPERF-b2f2d0/amendments/AMD-20261029-v2/successor.yaml (expands <S2>)
  constraints:
    - >-
      Run alone. Fetch and merge origin/main first (merge, never rebase), and
      record the base and the merge outcome. Stage only the producers' declared
      artifact paths, with <S1> and <S2> expanded from the two successor.yaml
      files. Refuse any path outside the producers' write scopes.
    - >-
      Keep failed or impeded returns as they are. If one producer is impeded,
      do not wait indefinitely and do not edit this card. Write a superseding
      archive card for the returned subset, under a new id from
      tools/allocate_id.py.
    - >-
      Approve nothing. After the push, the top-level session re-runs
      tools/experiment_preapproval.py on each successor packet at the pushed
      source_ref and records the output. Approval of either successor is a
      later Coordinator decision under its reserved DEC id. It requires
      approvable true and, after commit, execution_state ready from
      tools/newest_experiments.py.
    - >-
      Before commit, run python3 tools/validate_ledger.py and
      python3 tools/check_merge_hygiene.py --base origin/main. They must add
      no error over the main baseline.
  deliverables:
    - coordination/tasks/TASK-20261029-c0d4cd/archive-receipt.json
  artifact_paths:
    - artifact_paths of TASK-20261029-038368, expanded via the two successor.yaml files
    - artifact_paths of TASK-20261029-1bcf80
    - artifact_paths of TASK-20261029-583a07
    - coordination/tasks/TASK-20261029-c0d4cd/archive-receipt.json
  write_scope:
    - coordination/tasks/TASK-20261029-c0d4cd/**
  write_scope_note: >-
    This card stages the producers' files and writes only its own receipt
    directory.
  archived_by: TASK-20261029-c0d4cd
  depends_on:
    - TASK-20261029-038368
    - TASK-20261029-1bcf80
    - TASK-20261029-583a07
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  budget:
    maximum_runs: 0
  completion_gate:
    - >-
      The commit is reachable from main through a merge commit and contains
      exactly the expanded declared paths. The receipt records the commit,
      parent, base, merge outcome, every path with its path_sha256, and the
      record and task ids.
    - The successor preapproval re-probe outputs are recorded, both successor ids are named, and no approval is recorded by this task.
    - validate_ledger adds no error over the main baseline, check_merge_hygiene passes, and the PR is open against main with auto-merge enabled.
  return_format: The receipt, the PR number, both probe outputs, and one next Coordinator action (approval decision or recorded blockers).
  state: queued
