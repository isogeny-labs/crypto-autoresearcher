    - "implementation/kat-log-4c4831.json: raw outputs of the new KATs and the FX-16 cell (KAT fields only; under 64 KiB)"
    - "implementation/environment-4c4831.json: interpreter, libraries, pytest, compiler and flags, host, cores"
