      - dev1-heartbeat-bc7a76.jsonl: every heartbeat line of every attempt, prefixed with the
        attempt id. Under 64 KiB. If it would not fit, stop and report; never drop lines.
      - dev1-report-bc7a76.md: bytes verified, the command, the supervisor sha256, the
        projection per attempt, every classification, the outcome, the timings, the checkpoint
        pushes, the cumulative ledger and the scope findings.
      - environment-bc7a76.json: interpreter, libraries, pytest, compiler and flags, host,
        cores, memory, kernel release, and the container uptime at each launch.
    - >-
      LD-11 Host. The host is otherwise idle during an attempt. No test suite, mutant run,
      compile, review command or other experiment runs. Light ledger and text work and LD-7
