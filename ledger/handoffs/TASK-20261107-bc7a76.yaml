  constraints:
    - >-
      LD-1 Bytes. HEAD's experiments/EXP-MONO-1a1be2/code must equal the eleven per-file sha256
      of the dfd0ed archive (path_sha256 and sa6_code_binding; the 58546f input pins).
      tests/test_kat_extended.py must be
      79894702c2ee086aa33522233c7933281b4d217abab9dd39163e8f9503ed06b5, and code_sha256 must be
      5d5a607d59741b699065c02066d56a2883a34b44431da56c7bfd439b1f731464. Otherwise this card is
      void: stop and report.
      For EVERY attempt:
      - copy code/ into a fresh scratch directory outside the repository;
      - sha256 every file, run launcher.scan_problems (it must be empty) and
        launcher.code_sha256() (it must be equal);
      - write that before-record into the attempt's entry in dev1-attempts-bc7a76.json BEFORE
        the projection starts (DEC-20261106-24d2a2 OBS-1).
      After the attempt ends, whatever the outcome, re-hash the copy and the repository code/
      and write the after-record. Any mismatch is recorded and stops the task.
    - >-
      LD-2 Command. Use exactly the 96fee7 DX-2 command, as recorded in
      dev1-kat-log-96fee7.json "command", built by the copy's launcher._suite_argv and
      launcher.selftest_environment, with only the scratch paths changed:
