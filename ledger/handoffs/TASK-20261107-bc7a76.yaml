      outcome is stopped_projection: no retry, stop the task, and leave the decision to a fresh
      act. Never shrink the cell, use a subset of targets, or substitute another field.
    - >-
      LD-4 Supervisor. Before attempt 2, write ONE bash script,
      implementation/dev1-supervisor-bc7a76.sh. It is at most about 200 lines. It uses no
      network, never imports or edits experiment code, and never restarts the cell. Record its
      sha256. For each attempt, copy it into scratch and check the sha256 before use. Given a
      state directory and the LD-2 argv file, it does all of the following:
      (a) Writes state.json by atomic write (tmp then rename) before starting the child. It
          holds the attempt id, the task id, its own pid, its /proc/self/stat start time
          (field 22), its pgid, /proc/sys/kernel/random/boot_id, the /proc/1/stat start time,
          /proc/uptime, hostname, the launch UTC, the argv file's sha256, cwd, and the
          watchdog of 41,400 s.
      (b) Runs the argv as a child under "timeout --signal=TERM --kill-after=120 41400", with
          stdout and stderr to cell.out and cell.err in the state directory.
      (c) Appends one heartbeat line of at most 300 bytes every 600 s to heartbeat.jsonl. The
          line holds UTC, elapsed_s, the child pid and whether it is alive, boot_id, VmHWM_kB
          and VmRSS_kB of the pytest python process from /proc/<pid>/status, and loadavg. The
          first line is written at t = 0.
      (d) When the child exits, writes exit.json atomically. It holds rc, timeout_fired (rc 124,
          or 137 after --kill-after), end UTC, elapsed_s, junit_present, kat_log_present and the
          last VmHWM_kB.
      (e) Traps TERM, INT and HUP. On one, it signals the child's process group, waits for it,
          and writes exit.json with the signal name. KILL cannot be trapped; LD-8 handles it.
    - >-
      LD-5 Launch. Only after LD-6 succeeds. Launch from ONE short foreground harness command
      that returns within seconds:
      setsid nohup bash <scratch>/dev1-supervisor-bc7a76.sh <state dir> <argv file> </dev/null >><state dir>/supervisor.out 2>&1 &
      Never launch the cell or the supervisor as a harness background task, and never use the
      harness timeout parameter for them (DEC-20261106-24d2a2 ENV-1, CG-1). Within 120 s, confirm
      that state.json and the first heartbeat line exist. Record in the attempt entry the
      supervisor pid, its start time, the pgid, boot_id, the PID 1 start time and the uptime.
    - >-
      LD-6 Resume checkpoint, per attempt (CLAUDE.md, owner 2026-10-24). Before each launch, run
      scripts/checkpoint.sh init and fill .resume/RESUME.md for a reader without this
      conversation. It must hold:
      - goal GOAL-PATH-001, DEV-1, DEC-20261106-24d2a2 and the releasing act;
      - the copy path and its hashes, the state directory, and the argv file;
      - the supervisor pid and start time, boot_id, the PID 1 start time and the uptime;
      - the LD-7 re-attach procedure, the LD-8 classification and the LD-9 retry rule, with the
        attempts used and the attempts left;
      - how to collect (LD-10).
      scripts/checkpoint.sh gate must pass, then scripts/checkpoint.sh push must succeed. Push
      again at every terminal classification, at every retry decision and at collection. If no
      upload route works, do not launch: the outcome is stopped_infrastructure
      (no_checkpoint_route), with no retry. Never bypass a hook with CHECKPOINT_SKIP for a
      launch.
    - >-
      LD-7 State directory and re-attach.
      - The state directory lies outside the repository, on the path the top-level session has
        observed to survive a container restart, named in RESUME.md with the basis for the
        observation. If no such path is known, use the session scratchpad and record that a
        restart may delete it.
      - A check-in is ONE read-only command, with no sleep and no loop. It reads state.json, the
        last heartbeat line and exit.json if present; the current boot_id, PID 1 start time and
        uptime; and whether the supervisor pid is alive with the recorded start time.
      - Check in about every 60 minutes, and never through a harness background task or a
        polling loop. Any session can re-attach from RESUME.md alone.
      - Check-ins and the waiting between them may be carried by the top-level session.
        Classification under LD-8, retry decisions and collection are done by an executor
        session under this task: the launching one, or a re-dispatched one reading RESUME.md
        and this card.
    - >-
      LD-8 Classification. Mechanical, applied at every check-in. Restart evidence means any of
      the following: the current boot_id differs from the recorded one; the current PID 1 start
      time differs from the recorded one; or the uptime is shorter than the time elapsed since
      launch.
      - C1: exit.json present, rc 0, and junit shows three passed items -> completed. Outcome
        passed if the DX-6 passed criteria of the 96fee7 card hold, otherwise mismatch.
      - C2: exit.json present, rc nonzero, timeout not fired, and junit shows the cell item
        failed on an assertion (an unequal pair, the guard, or the multiset count) -> mismatch.
        Record it verbatim and never re-run it.
      - C3: exit.json present with timeout_fired -> stopped_infrastructure (watchdog). No retry.
      - C4: exit.json present with a signal name -> stopped_infrastructure (signalled). No retry.
      - C5: exit.json absent, restart evidence present, and the supervisor pid is not alive with
        its recorded start time -> stopped_infrastructure (container_restart). Retry per LD-9.
      - C6: exit.json absent, no restart evidence, and the supervisor dead or its start time
        changed -> stopped_infrastructure (unexplained_kill). No retry.
      - C7: exit.json absent, the supervisor alive, and the last heartbeat older than 1,800 s
        -> record the anomaly and keep waiting. The watchdog bounds the attempt.
      - C8: exit.json present, rc nonzero, and no assertion failure (a crash, a kernel error, or
        an OOM kill shown in cell.err, dmesg or the rc) -> stopped_infrastructure (crash or
        oom). No retry.
      - A state directory that has disappeared is C5 if restart evidence is present (compare with
        the values in RESUME.md), and otherwise C6.
      - Any state not listed: record it verbatim, stop, and do not retry.
      Every stop of type C3 to C8 is infrastructure, never a KAT outcome. An exit.json whose
      attempt id differs from the current attempt is stale and is ignored.
    - >-
      LD-9 Retries. Only after C5. At most maximum_attempts attempts run under this card
      (budget; the releasing act may lower it to 1 and may set a cumulative cap; it may raise
      nothing). Each retry:
      - starts again at LD-1 with a fresh copy, a fresh state directory, a fresh projection
        (LD-3) and a RESUME push (LD-6), under a new attempt id (attempt 1 is 96fee7; this card
        runs attempts 2 and up);
      - starts only if the remaining cumulative cap, where one is set, is at least 42,600 s.
      Never shrink, subset, substitute, resume partial work (none exists: the cell is atomic,
      DEC-20261106-24d2a2 checkpointability) or change the command. When every allowed attempt
      ends in C5, the outcome is stopped_infrastructure_retries_exhausted.
