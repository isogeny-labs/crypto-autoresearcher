# FX-16 cell (F_{10007^2}, m = 3, s = 50; code/tests/test_kat_extended.py) on the bytes bound in
# snapshot 5f6c092450 (code_sha256 5d5a607d), under a DETACHED supervisor with heartbeat, an exit
# record, restart detection, re-attach and a bounded retry on a container restart
# (DEC-20261106-24d2a2). KAT mode, non-contract: no contract curve is built and no predicted value
# is asserted. It is not an experiment run. Zero runs.
# STATE: BLOCKED. Only a committed Coordinator act that records the owner's answer to OQ-1
# releases it (BP-2). A message never does.
handoff:
  id: TASK-20261107-bc7a76
  from: coordinator
  to: executor
  goal_id: GOAL-PATH-001
  batch_id: BATCH-c077fd
  authorized_by: DEC-20261106-24d2a2 (dev1_rerun_decision; release is conditional on OQ-1, BP-2)
  objective: >-
    Run the FX-16 cell of code/tests/test_kat_extended.py in full and unmodified, on a verified
    copy of the dfd0ed-bound bytes. It runs the large-q E2 sampled counter at m = 3, s = 50, on
    the line base of the KAT curve over F_{10007^2}, against the independent membership method.
    The cell runs as a detached process under a recorded supervisor that survives the harness
    background-task cap. A container restart is detected, recorded and, within the attempt cap,
    retried with a fresh attempt. Record the outcome (passed, mismatch, or stopped with its
    cause) with the timing needed to read the kernel's m = 3 full-pass rate, and with
    cumulative DEV-1 wall accounting.
  uncertainty_reduced: >-
    Readiness blocker B1 (DEV-1): whether the compiled kernel's depth-3 multiset enumeration at
    n = 2 agrees with an independent method on sampled targets with nonzero counts. It also
    yields one measured full-pass (n = 2, m = 3) rate for the approval act's SC-3. Nothing about
    the mathematics.
