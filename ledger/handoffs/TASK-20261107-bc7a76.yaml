  inputs_note: >-
    Your context consists of the following:
    - DEC-20261106-24d2a2 outcome_composition_96fee7 and dev1_rerun_decision;
    - DEC-20261106-475620 dev1_decision_v2;
    - the 96fee7 card's DX-2, DX-3, DX-6 and DX-7, which this card keeps;
