# Blind re-derivation card. This is the ONLY card the re-deriver reads. It states
# quantities, definitions and parameters. It states no claim, no expected value and no
# prior. Every path under blind_from is blind throughout the task.
handoff:
  id: TASK-20261029-3ac467
  from: coordinator
  to: validator
  batch_id: BATCH-c53152
  goal_id: GOAL-PATH-001
  objective: >-
    From the definitions and parameters on this card alone, determine the quantities
    Q1 to Q5, each with a derivation and a corroborating computation of your own, apply
    them to the objects O1 to O4, and report a verdict on each joint you own.
  uncertainty_reduced: >-
    Whether the load-bearing quantities of this round come out the same when derived by
    a session that has read no prior derivation, report, implementation or contract of
    them.
  inputs:
    - ledger/handoffs/TASK-20261029-3ac467.yaml
    - AGENTS.md
    - agents/validator.md
    - docs/agent-runtime-core.md
    - templates/research-records.md
    - docs/claims-and-verification.md
    - knowledge/findings/KN-FIND-007.md
    - knowledge/findings/KN-FIND-4f0d84.md
    - knowledge/findings/KN-FIND-bdcd60.md
  inputs_note: >-
    A WHITELIST. Read only these paths, and record every path you read in
    sources_read. The three KN-FIND entries are premises you may use; read them in full
    if you wish. Do not search the repository, the ledger index, the batch directories,
    git history or the knowledge base beyond these paths.
  definitions:
    setting: >-
      E: y^2 = f(x) = x^3 + a x + b, nonsingular over F_Q, Q = q^n, q an odd prime above
      3, n >= 1. N = |E(F_Q)|. O the identity. chi the quadratic character of F_Q.
    base: >-
      D = {P in E(F_Q) minus {O} : x(P) in F_q}; D = -D. B = |D|.
      t2 = |D intersect E[2]|. X = x(D), so |X| = (B + t2)/2. For the general group
      questions, D is any symmetric subset (D = -D, O not in D) of a finite abelian
      group G of order N, and t2 = |D intersect G[2]|.
    decomposition: >-
      R = +-P_1 +- ... +- P_n with P_i in D. By Semaev's defining property this holds iff
      S_{n+1}(x(P_1), ..., x(P_n), x(R)) = 0, where S_m is the m-th summation polynomial
      (KN-FIND-4f0d84 gives its degree in the last variable). Write m = n + 1.
    counts_at_target_R:
      T_A: number of ordered tuples (P_1..P_n) in D^n with P_1 + ... + P_n = R
      T_M: number of size-n multisets of elements of D with sum R
      T_S: >-
        fix one lift l(x) in D for each x in X; T_S(R) is the number of pairs (ordered
        x-tuple xi in X^n, class [eps] of sign vectors in {+1,-1}^n modulo eps -> -eps)
        with sum_i eps_i l(xi_i) in {R, -R}
      T_X: number of size-n multisets of X having at least one sign class whose signed lift sum is in {R, -R}
    coverage: c = P(T_M(R) >= 1) for R uniform in the group (or over a stated target set); mu_M = E[T_M(R)]
    generic_tuple: x_1..x_n independent and uniform in F_Q; the fibre is the polynomial S_{n+1}(x_1..x_n, T) in T
    proxy_model: >-
      the model that treats each ordered x-tuple's fibre as splitting completely over F_Q
      with the generic complete-split probability, and its roots, when it splits, as
      uniform over the x-classes of the group
  questions:
    - id: Q1
      joint: J1
      text: >-
        For a finite abelian group G of order N and a symmetric subset D of size B,
        determine sum_R T_A(R) and sum_R T_M(R), the ratio of the all-target means of
        T_A and T_M as a function of n and B, a two-sided bound on that ratio in terms
        of n and B, and T_A(R) in terms of the multisets with sum R. Specialise the mean
        of T_M to B = q, N = q^n and give its limit as q grows at fixed n.
    - id: Q2
      joint: J2
      text: >-
        For R with 2R != O, determine T_S(R) in terms of ordered tuples with sum R,
        accounting for 2-torsion entries. Determine T_M(R) - T_X(R) in terms of the root
        multiplicity of x(R) in the fibre. At n = 2 determine T_A(O) and T_M(O) exactly.
        Determine the number of size-n multisets of D containing no two elements (equal
        or not) that sum to O, as a coefficient of a generating function in B, t2 and n.
    - id: Q3
      joint: J3
      text: >-
        Determine the best upper bound on c in terms of mu_M alone, and a lower bound on
        c in terms of mu_M and E[T_M^2]. Decide whether any symmetric base of size B can
        have coverage above that upper bound. Compute log2(mu/(1 - exp(-mu))) at
        mu = 1/n! for n = 2, 3, 4, 5 to three decimals.
    - id: Q4
      joint: J4
      text: >-
        Taking the Frobenius rule of KN-FIND-bdcd60 item (3) as a premise over F_Q,
        determine for a generic tuple the probability that the fibre splits completely
        over F_Q, as a leading value in n with its error term in Q and n; determine the
        same probability on tuples x_i = x(P_i) with P_i in E(F_Q); determine the ratio
        of the exact all-target mean of root hits to the mean under the proxy model.
    - id: Q5
      joint: J5
      text: >-
        Let n = c log2 q for a constant c > 0. Determine the order of log_q(n!) and of
        log_q(2^(n-1)) as q grows, and the relative change in log_q(1/rate) when a rate
        of 1/n! is multiplied by 2^(n-1). State whether that change alters the exponent
        class of 1/rate as a function of q.
  objects:
    - id: O1
      text: a structured symmetric base of the same size as a matched uniformly random symmetric base (for example a Sidon-type base, as in KN-FIND-007); apply Q3
    - id: O2
      text: tuples on the factor-base locus, x_i = x(P_i) with P_i in E(F_Q); apply Q4
    - id: O3
      text: a non-symmetric base containing one point from each +- pair; apply Q2
    - id: O4
      text: n = 1; apply Q1, Q2 and Q4 where meaningful
  constraints:
    - RD-1 Fresh independent session. Read only the whitelisted inputs. Every blind_from path is blind throughout, including after you finish.
    - RD-2 Work from the definitions. If a definition is ambiguous, state your reading and derive under it; do not look for another source.
    - RD-3 Corroborate each determination with your own computation on small cases of your own choosing (prime fields, F_{p^2}, F_{p^3}, small abstract groups), with your own implementations of the group law and of S_3, S_4 by resultants. Record every script and its raw output in computations.json. These computations are corroboration, not experiment runs.
    - RD-4 Where you cannot determine a quantity, say so and give the reason. Do not estimate a value you did not derive or compute.
    - RD-5 Report a verdict per joint you own (holds | breaks | inconclusive), meaning whether your own determination is complete and self-consistent and passes your corroboration; report what your derivation gives on each object O1 to O4. You cannot see any other derivation and must not guess one.
    - RD-6 Write only the three declared files. No computed value or conclusion in any message to any agent; return paths and verdict labels only.
    - RD-7 Zero experiment runs. Never select, configure or contact Amazon Bedrock.
  deliverables:
    - "blind_rederivation.md: for each of Q1 to Q5, the determination with its derivation and corroboration, or an explicit non-determination with reasons; the results on O1 to O4; the verdict per joint"
    - "computations.json: every script, command, library and version, seed and raw output relied on, as text"
    - "review_attestation.yaml: a top-level review_attestation mapping with task_id TASK-20261029-3ac467, joints_owned [J1, J2, J3, J4, J5], sources_read in order, read_sibling_reports false, blind_from_respected stated truthfully, verdict mapping per joint, and inference fields (requested policy, resolved model id, fallback_used, model_verified)"
  artifact_paths:
    - coordination/goals/GOAL-PATH-001/review/TASK-20261029-3ac467/blind_rederivation.md
    - coordination/goals/GOAL-PATH-001/review/TASK-20261029-3ac467/computations.json
    - coordination/goals/GOAL-PATH-001/review/TASK-20261029-3ac467/review_attestation.yaml
