# Focused independent HARDENING RE-REVIEW of the second EXP-MONO-1a1be2 fix round at the
# TASK-20261106-dfd0ed commit (blocker B8-H; DEC-20261106-24d2a2). Supersedes the never-dispatched
# TASK-20261106-941825, minus its DEV-1 joint (RR-5), which moves to a later DEV-1 verification.
# Validator, review-adversarial, fresh independent session. This is an instrument review, not a
# claim-changing round, so it has no review_plan. Blindness is lifted on purpose for the 165da2
# and 7c2b01 reports. Zero experiment runs.
handoff:
