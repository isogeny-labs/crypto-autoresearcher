  inputs_note: >-
    Your context consists of the following:
    - from DEC-20261106-24d2a2: outcome_composition_96fee7, review_placement (including
      b8_split), dev1_rerun_decision and approval_act_conditions_added;
    - from DEC-20261106-475620: re_review_composition, V2-5, V2-6 and approval_records_v2_1;
    - from DEC-20261106-843cf7: approval_lock_binding_v2 and specification_additions_for_v2;
    - the 165da2 code_review.md and the 7c2b01 fix_review.md, read in full. Blindness is lifted
      for these two because fix verification needs both defect lists and their repros, as
      DEC-20261106-475620 batch.review explains;
    - the 2b7223, 96fee7 and bc7a76 cards, and the code.
    Treat the producers' reports and logs as claims to check, not as evidence. Do not read
    either review_attestation.yaml, any other file under coordination/goals/GOAL-PATH-001/review/,
    or any producer session.
  constraints:
    - >-
      RR-1 Byte checks. The commit is clean. These files equal their 9a0b5955 hashes: fqn.py,
      curves.py, semaev.py, counters.py, kernel.c, make_trial_plan.py, throughput_calibration.py,
      tests/test_kat_extended.py and the specification. Recompute code_sha256, the test-file
      hashes and the CODE_TREE_ALLOWLIST sha256, and compare them with the dfd0ed receipt.
      Compute the allow-list sha256 both with and without a trailing newline, and say which
      matches the dfd0ed receipt (8a242ebc...6445) and which matches fix-report-2b7223.md
      (1832f855...11d1) (DEC-20261106-24d2a2 OBS-2). Confirm that the allow-list equals the
      committed code/ tree. Regenerate the trial plan and confirm sha256 9ccbe614...fb4a.
    - >-
      RR-2 Executed-code integrity (N-5 item 5 and NF-1). Re-run the 7c2b01 repros N5-Y
      (code/yaml.pyc), N5-P (code/pytest.pyc) and NF-1 (code/__pycache__/counters.cpython-<tag>.pyc
      with matching mtime and size). Also RUN the pytest rewrite-cache variant
      (tests/__pycache__/test_kat.cpython-<tag>-pytest-<ver>.pyc), which 7c2b01 checked only by
      inspection. Each must refuse with no runs/ entry. Then build at least four attacks of your
      own that are not the producer's tests. Examples:
      - a package directory code/yaml/ with __init__.py;
      - a .pth or zip-importable file in code/;
      - a symlink replacing an allow-listed file;
      - a planted bytecode file whose source mtime is forged;
      - a module planted by a stubbed cell after the pre-gate scan, which the post-cell scan
        must turn into validity invalid;
      - a PYTHONPYCACHEPREFIX or PYTHONSAFEPATH override in the parent environment.
      Each must refuse or invalidate. Confirm that a clean extract passes (positive control),
      that the code_tree block and module_origins appear in a stubbed contract-mode package,
      and that pytest's resolved __file__ lies outside code/.
    - >-
      RR-3 Mutants, each your own edit in a scratch extract, run under the full start-up suite.
      - M6 (counters.arm_c_cell S_idx uint32 truncation, the 7c2b01 edit): it must now be
        KILLED, and you report the failing items.
      - M5 and M3 controls: both must still be killed.
      Confirm the HX-6 vacuity guards are real by an independent recount: at (41, 6) and
      (29, 7), find the S keys of at least 2^32 and their nonzero truth, on both bases. Report
      the m_S values observed.
    - >-
      RR-4 NF-2, NF-3, NF-4, NF-6, NF-7 and the receipt clash. For each HX-3 to HX-9 item, run
      its test against the 9a0b5955 code (it must fail) and against the dfd0ed code (it must
      pass). Then re-run your predecessor's own attacks, which must now void, invalidate or
      refuse as specified: cdf_top_N, cdf_top_s, recount_missing_convention, the F2 edges (a) to
      (d), the forged GateResult, RID-runs-symlink and rss_children. Add at least one new attack
      per item.
    - >-
      RR-5H The DEV-1 attempt-1 record, NOT DEV-1 closure. Read dev1-report-96fee7.md,
      dev1-kat-log-96fee7.json, dev1-junit-96fee7.xml and environment-96fee7.json, and confirm
      all of the following:
      - the outcome is stopped_infrastructure;
      - the junit is a labelled placeholder, and no per-target pair, guard count or full-pass
        rate is presented as data;
      - the before, after and repo hashes equal the dfd0ed committed bytes;
      - test_kat_extended.py is unmodified (79894702...06b5);
      - the projection was measured before the cell by the 96fee7 DX-3 sub-base method, and its
        recorded modelled total follows from its recorded inputs. Recompute the arithmetic from
        the kat-log keys; do not re-run anything;
      - the cell was not shrunk and not restarted.
      Report any discrepancy as a finding. The DEV-1 row of the must-fix table reads "not run
      (open)" and does not count for B8-H.
    - >-
      RR-6 Regression.
      - Baseline: the full test_kat.py suite on the committed bytes under
        launcher.run_selftest_suite; record the counts.
      - Do at least one self-test inside a FULL repository checkout (not sparse), read-only, and
        confirm the collected count equals EXPECTED_KAT_ITEMS. If that checkout's code/ holds
        stray ignored files, the gate must refuse. Report this; do not clean it.
      - Re-run every 165da2 CR-1 scenario and the 7c2b01 RR-2 S, A and R tables. All must
        refuse as before, and the P1 and P2 positive controls must pass.
      - Spot-check CR-2 seeds, CR-4 residual withholding and the CR-5 KAT refusal on all 96
        (pair, arm) combinations.
    - >-
      RR-7 New-code read. Read every line of the new launcher.py and the changed tests. Look for
      defects that would let an invalid cell pass as valid, or misroute a defect into F7 or F8.
      Examples:
      - an allow-list that follows symlinks or is computed from the tree it checks;
      - a post-cell scan whose result is not wired into validity;
      - a pycache prefix set after a local import;
      - a module_origins check that compares a path to itself;
      - an F2 sentinel check reachable only by the CLI.
    - >-
      RR-8 Zero experiment cells. Every gate call uses a scratch experiment root with a
      synthetic KAT-field plan. Scratch files stay outside the repository. Write only the
      declared paths, and do not commit. Put no prediction value in any message. Never Bedrock.
      Never run test_kat_extended.py's cell item (that is DEV-1). Any single command you expect
      to exceed 6,000 s is launched detached (setsid nohup, as bc7a76 LD-5), never as a harness
      background task at its cap (DEC-20261106-24d2a2 ENV-1). A container restart that kills a
      review command is infrastructure: re-run that command and record it.
    - >-
      RR-9 Advisory red-team of the DEV-1 launch design. It is non-blocking for B8-H and goes to
      the releasing act. Read LD-1 to LD-12 of ledger/handoffs/TASK-20261107-bc7a76.yaml. Report
      every route you can construct by which a killed, restarted, partial, substituted or
      re-run cell could be recorded as passed or as mismatch, or by which the executed command
      or bytes could differ from the bound ones without a trace. Cover at least these:
      - kill -9 of the supervisor while the cell lives;
      - kill -9 of the cell while the supervisor lives;
      - PID reuse after a restart;
      - a container restart that leaves boot_id, the PID 1 start time or uptime unchanged;
      - a wall-clock jump;
      - a state directory on a path that does not survive a restart;
      - a stale exit.json from an earlier attempt;
      - junit present while the KAT log is absent.
      You may exercise the classification on a toy stub command (sleep, exit codes) in scratch.
      Never on the cell. Each route gets a severity (blocks release of bc7a76, or not) and a
      concrete fix.
