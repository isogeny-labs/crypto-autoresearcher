  from: coordinator
  to: validator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-c077fd
  authorized_by: DEC-20261106-24d2a2 (review_placement; supersedes TASK-20261106-941825)
  supersedes: TASK-20261106-941825 (cancelled; never dispatched)
  objective: >-
    At the verified dfd0ed commit 5f6c0924502a804271cc100937bf706021985ed6, verify that every
    hardening must-fix of DEC-20261106-475620 is closed: N-5 item 5, NF-1 to NF-7 and the
    receipt clash, via HX-2 to HX-9. Verify that nothing the 165da2 and 7c2b01 reviews found
    holding has regressed, and that the changed code adds no defect that would let an invalid
    cell pass as valid or route an instrument defect into a scientific reading. Classify each
    item as closed, not closed or new finding (blocking or non-blocking), with a reproduction for
    each, and give a terminal B8-H verdict. Also check that the 96fee7 stop record is honest
    (RR-5H), and red-team the bc7a76 launch design (RR-9, advisory).
  uncertainty_reduced: >-
    Whether blocker B8-H clears: whether the instrument the approval will bind executes only its
    hashed bytes, records what it executed, and guards the large-Q arm-C path on the executing
    host. Whether the DEV-1 re-attempt's launcher can misrecord a killed or restarted cell.
    Nothing about the mathematics.
  inputs:
    - ledger/handoffs/TASK-20261107-7db1de.yaml
    - ledger/decisions/DEC-20261106-24d2a2.yaml
    - ledger/decisions/DEC-20261106-475620.yaml
    - ledger/decisions/DEC-20261106-843cf7.yaml
    - ledger/handoffs/TASK-20261106-2b7223.yaml
    - ledger/handoffs/TASK-20261106-96fee7.yaml
    - ledger/handoffs/TASK-20261107-bc7a76.yaml
    - coordination/goals/GOAL-PATH-001/review/TASK-20261105-165da2/code_review.md
