# Second pre-approval FIX card for EXP-MONO-1a1be2 (review_required; NOT approved). It closes the
# TASK-20261106-7c2b01 findings N-5 item 5, NF-1 (blocking) and NF-2 to NF-7, and the receipt-id
# clash (DEC-20261106-475620). Each fix comes with a test that fails on the 9a0b5955146a code.
# For a KAT, the evidence is instead a scratch mutant it kills (M6). launcher.py, tests/test_kat.py
# and README.md change; every other code file is frozen. No contract cell is computed and no
# predicted value is asserted. The DEV-1 cell is NOT part of this card (TASK-20261106-96fee7).
# Zero runs.
handoff:
  id: TASK-20261106-2b7223
  from: coordinator
  to: executor
  goal_id: GOAL-PATH-001
  batch_id: BATCH-a8825c
  authorized_by: DEC-20261106-475620
  objective: >-
    Fix the EXP-MONO-1a1be2 launcher at its 9a0b5955146a bytes:
    (1) refuse any entry in code/ outside the committed tree, and make bytecode and path
        resolution unable to run unhashed code (N-5 item 5, NF-1);
    (2) compare every top-level cdf.json key, and carry m (NF-2);
    (3) void on a missing per-convention recount (NF-3);
    (4) close the F2 enforcement edges (NF-4);
    (5) add a start-up KAT on the large-Q arm-C S-set path that kills M6 (NF-5);
    (6) make launcher validity apply V2-1 and refuse a symlinked runs/ (NF-6);
    (7) attribute memory to the cell's own processes (NF-7);
    (8) make receipt ids collision-free.
    The trial plan stays byte-identical.
  uncertainty_reduced: >-
    Readiness blockers B1 (the M6 path) and B8: whether the instrument can refuse or invalidate
    every cell whose executed code is not the approved build, or whose records disagree, and
    whether its start-up suite can fail on the large-Q arm-C S-set path. Nothing about the
    mathematics.
