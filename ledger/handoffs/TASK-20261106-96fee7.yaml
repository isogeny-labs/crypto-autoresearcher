    - {id: DP-2, text: "TASK-20261106-2b7223 has a completed release with seven non-empty digests and no HX-1 scope-finding path."}
    - {id: DP-3, text: "Claim after git fetch: python3 tools/goal_lanes.py claim coordination/goals/GOAL-PATH-001/batches/BATCH-a8825c/dispatch_queue.json TASK-20261106-96fee7 --as <addr> --ttl-minutes 780 --publish. Release with --outcome completed and four --artifact <path>=<sha256> digests, whatever the DX-6 outcome."}
    - {id: DP-4, text: "The host is otherwise idle: no other BATCH-a8825c task and no other heavy job is live."}
  completion_gate:
    - All four artifact paths exist, and nothing outside them is modified.
    - The DX-1 byte checks passed before and after the cell, and the hashes are recorded.
    - The projection was measured and recorded first. The cell then either ran in full within 41,400 s with outcome passed or mismatch, or stopped with outcome stopped_projection or stopped_infrastructure; it was never shrunk.
    - .resume/RESUME.md was filled and pushed before the full cell.
    - No contract cell, no predicted value, zero experiment runs.
  return_format: The four artifact paths with sha256, the DX-6 outcome, the projection outcome (within or over 39,600 s, with no value), whether the byte checks held, and any scope finding. No KAT count or timing values in the message.
  review_plan: null
  review_required: false
  review_required_note: FALSE. An instrument KAT; it changes no claim. TASK-20261106-941825 re-reviews it before approval.
  runs_launched: 0
