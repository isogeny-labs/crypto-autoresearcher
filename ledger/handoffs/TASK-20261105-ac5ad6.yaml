    - "implementation/kat-log-ac5ad6.json: raw outputs of the new KATs as text (no residuals)"
    - "implementation/environment-ac5ad6.json: interpreter, libraries, compiler, flags, host, core count"
    - "implementation/throughput-calibration.json: KX-7 timings and projections per cell class"
    - "implementation/trial-plan.preview-ac5ad6.json: the regenerated plan (KX-8)"
  artifact_paths:
