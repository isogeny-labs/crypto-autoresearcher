    commit, its parent, the base origin/main commit and the exact paths with
    their sha256. Then push, open the PR against main naming the records, and
    enable auto-merge.
  uncertainty_reduced: >-
    Durable custody of the concurrency revision, the shared lane and the
    queue repair. Until these bytes are at origin/main, neither v2 probe can
    pass at source_ref origin/main. The cap change has no official effect
    before then.
