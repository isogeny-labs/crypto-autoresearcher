      rewrite another lane's entries. If main has meanwhile changed
      campaign_budget.max_concurrent, stop and return to the Coordinator. A
      conflict inside an immutable record becomes a superseding record under a
      new id.
    - >-
      Before commit, run python3 tools/validate_ledger.py and
      python3 tools/check_merge_hygiene.py --base origin/main. The package must
      add no error over the main baseline. Record any advisory, and never
      silence one.
    - >-
