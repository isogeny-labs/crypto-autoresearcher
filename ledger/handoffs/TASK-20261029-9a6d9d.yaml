      DP-1. TASK-20261029-f8b6eb has returned. The Coordinator has checked
      its return for validity against that card's completion gate and
      written the batch checkpoint
      ledger/goals/GOAL-ICPERF-e6b6a4/checkpoints/BATCH-38f344.yaml. If the
      repair returns incomplete, this archive does not run with its outputs.
      The Coordinator then decides a scoped successor.
    - >-
      DP-2. The lane file
      coordination/goals/GOAL-ICPERF-e6b6a4/lanes/BATCH-38f344.lane.json was
      written by tools/goal_lanes.py open-lane and has not been edited since.
  constraints:
    - >-
      Run alone in the worktree. Before committing, fetch origin/main and merge
      it into the branch (merge, never rebase). Record the base commit and the
      merge outcome in the receipt.
    - >-
      Stage only the declared artifact paths. The goal.yaml change is limited
      to the edits listed in DEC-20261029-3bfa78 goal_edits_in_this_archive:
      max_concurrent 2 -> 3, the rewritten max_concurrent_basis, one appended
