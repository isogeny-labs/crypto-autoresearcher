# HYPOTHESIS -- H-FNDSA-24cf2f, specified from IDEA-20261018-fd1f81. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-FNDSA-24cf2f
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  derived_from_idea: IDEA-20261018-fd1f81
  added: '2026-10-18'
  statement: >-
    Antrag (KN-LIT-2565) samples (f, g) so that |f(z)|^2 + |g(z)|^2 lies in an annulus at
    every embedding z. Gram of the rotation orbit in canonical coordinates is diagonal with
    those values, so by AM-GM a flat spectrum maximises the orbit covolume at a given norm:
    the dense sublattice is less dense. Claim: at n in {32, 64} and matched ||(f, g)||, the
    dense-sublattice transition modulus q* for Antrag-style keys is higher than for Falcon-accepted
    keys by at least 0.1 in log2 q, and keys with planted skewed spectra sit lower. Falsified
    if the shift is within the A/A noise.
  mechanism: >-
    Covolume of the rank-n orbit equals the product of sqrt(|f(z)|^2 + |g(z)|^2) over embeddings,
    up to a ring constant. Fixed sum (norm), product maximal when values equal. The fatigue
    event is driven by orbit density relative to q^n, so flattening the spectrum pushes the
    event to larger q, and conversely Falcon's rejection only on norms leaves spectral spread.
  assumptions:
  - The event location is a monotone function of orbit covolume at fixed n
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: The event location is a monotone function of orbit covolume at fixed
      n
    random_model_justification: Ducas-van Woerden analysis in KN-LIT-114 (as reported)
    supporting_results: []
    validation_experiment_ids:
    - EXP-FNDSA-fb188f
    falsification_condition: regress q* on log covolume across all keys
  predictions:
  - metric: log2 q*(Antrag) - log2 q*(Falcon)
    direction: higher
    minimum_effect: '>= 0.1'
  - metric: log2 q*(skewed) - log2 q*(Falcon)
    direction: lower
    minimum_effect: <= -0.1
  test_boundary:
    instances:
    - >-
      n in {32, 64}; ring x^n + 1; q on log2 grid step 0.25 around predicted q*; 20 keys per
      family per q; BKZ beta <= 30
    parameters:
      scale_tier: toy
      scale_justification: n <= 64; claim is direction of shift
    implementation: SageMath, fpylll BKZ 2.0, profile detector, certificate checker
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 40
      maximum_memory_gb: 8
      maximum_runs: 64
  distinguishable_outcomes:
  - <= 0 or within AA noise
  - '>= 0'
  falsification_conditions:
  - no shift between Antrag and Falcon families beyond noise
  - skewed family not lower
  interpretation_limits:
  - >-
    Scale and transfer: n <= 64; FN-DSA q = 12289 is far below fatigue at n = 512, so this
    is a direction-of-effect claim
  - Not a security statement for Antrag or FN-DSA
  status: specified
  proposed_by: idea-generator
