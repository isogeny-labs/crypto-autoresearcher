# HYPOTHESIS -- H-MLKEM-ad6acd, specified from IDEA-20261018-06ab73. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-ad6acd
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-06ab73
  added: '2026-10-18'
  statement: >-
    Storing the sieve database with b-bit quantized coordinates (plus exact recomputation
    for accepted reductions) at d=60-80 keeps time-to-saturation within 1.2x of full precision
    down to b=6 while reducing database bytes by >= 4x. This lowers the memory term of memory-charged
    cost models by a measured constant (>= 2 bits of memory) that current estimates do not
    account for. If time blows up by > 2x already at b=8, the memory constant is not compressible
    this way.
  mechanism: >-
    Sieves need inner products only accurately enough to decide whether a pair reduces; most
    pairs fail by a wide margin, so low precision suffices for the test, with exact arithmetic
    only for the rare successes. Memory-charged models price bytes, so the bytes per vector
    directly scale the memory cost and, under bandwidth charging, the access cost. The constant
    is implementation choice, not mathematics, and should be measured before being argued.
  assumptions:
  - Quantization error behaves as independent noise in inner products.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Quantization error behaves as independent noise in inner products.
    random_model_justification: Rounding analysis.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-23faa1
    falsification_condition: Measure false-negative rates vs prediction.
  predictions:
  - metric: time ratio b=6 / float32
    direction: lower
    minimum_effect: <= 1.2
  - metric: memory ratio float32 / b=6
    direction: higher
    minimum_effect: '>= 4'
  test_boundary:
    instances:
    - d in {60,70,80}; b in {32f,16,8,6,4,2}; 5 instances; 8 threads
    parameters:
      scale_tier: toy
      scale_justification: >-
        sieve dimensions 60-90 on a single node; transfer assumption: the per-dimension exponent
        of the measured quantity is extrapolated to beta~400-900 only as a conditional statement
        with the fit interval; no FIPS 203 security claim
    implementation: patched G6K or standalone C++ sieve, Python analysis
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 40
      maximum_memory_gb: 32
      maximum_runs: 200
  distinguishable_outcomes:
  - '>= 2'
  - < 2 (overheads dominate)
  falsification_conditions:
  - P1 time ratio >= 2 at b=8
  - null control differs (patch overhead)
  interpretation_limits:
  - >-
    d <= 80; precision needs may grow with d (fitted and reported); constant-only effect on
    cost models
  status: specified
  proposed_by: idea-generator
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open goal
    serves this question. The Coordinator must open a successor goal or rebind before dispatch.
