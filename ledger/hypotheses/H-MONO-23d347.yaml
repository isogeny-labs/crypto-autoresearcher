hypothesis:
  id: H-MONO-23d347
  question_id: RQ-MONO-001
  goal_id: GOAL-PATH-001
  idea_id: IDEA-20261023-f15270
  status: proposed
  statement: >-
    At the tested cells of EXP-MONO-1a1be2 (E/F_Q, Q = q^n, q an odd prime above 3,
    j(E) not in F_q; factor base D = {P != O : x(P) in F_q}; n = 2..5 exhaustive over
    every target on the declared q ladder, n = 2..7 target-sampled at Q of about 2^30
    to 2^32), the factor 2^{n-1} of the "compounding" clause is a proxy-correction
    factor and not a yield factor. Precisely: (H1) the per-target decomposition counts
    under the ordered (A), multiset (M), sign-class (S) and x-multiset (X) conventions
    satisfy exact identities whose ratios never track 2^{n-1} separably from n! for
    n >= 3 (EXP-MONO-1a1be2 P1, P2); (H2) the generic-target coverage of the line base
    relative to a matched random symmetric base shows no trend in n of slope 0.5 or
    more in log2 (P3); (H3, transfer T1) on squarefree full-degree fibres
    S_{n+1}(x_1..x_n, T) splits completely over F_Q exactly when all chi(f(x_i)) agree,
    so the factor-base locus splits with probability 1 and generic tuples with the
    frequency of the exact finite-Q comparator, whose limit is 2^{1-n} (P4, P5);
    (H4, HEUR-F-1) generic-target multiset counts follow Poisson(lambda) with lambda
    tied exactly to the conservation mean, within the stated tolerance (P6). Reading C
    (solve or sign-finding cost) is not addressed.
  mechanism: >-
    A double count plus a monodromy count (IDEA mechanism). Every ordered tuple of base
    points has one sum, so each convention's all-target mean is its universe size over N
    (KN-FIND-007), and conventions differ only by universe-size ratios [D: L1, L2]. The
    sign-class count equals the ordered count off 2-torsion [D: L3]; the x-multiset
    count differs from the multiset count only at multiple roots [D: L4]. Coverage, the
    relation rate per target, is capped by min(1, C(B+n-1,n)/N), which at B = q is the
    Gaudry-Diem 1/n! times prod_{i<n}(1 + i/q) [D: L5]. The 2^{n-1} is real in one
    place: under the regular action of (Z/2)^{m-2}, m = n + 1, a Chebotarev-split proxy
    multiplies by 2^{1-n} a fibre that on the factor-base locus splits with probability
    1, so exact over proxy is 2^{n-1} [D given T1: L6]. Even a genuine 2^{n-1} gain in
    the rate 1/n! would not change the exponent class, since 2^{n-1} = q^{Theta(1)}
    forces n = Theta(log q) [D: L8].
  assumptions:
    - The counted event is frozen as all four conventions per cell; a record reporting one convention is inadmissible (IDEA assumptions).
    - Conservation denominators are exact rationals; no null-model estimation step exists.
    - Curves are defined over F_Q with j(E) not in F_q, so the line base is not E(F_q).
    - The derivation lemmas L1 to L6 and L8 are taken as stated by the producer until the composed blind re-derivation (TASK-20261029-3ac467) returns; this hypothesis is not advanced on them before then.
  proof_search_map:
    bottleneck: >-
      The identification of the rate the clause modifies with the per-target relation
      rate (coverage), bounded by the exact multiset conservation mean (IDEA
      proof_search_map). If the clause means a per-attempt success or a cost term
      (reading C), the cap bounds attempts times success but not cost.
    baseline_embedding:
      parameter_slice: "B = q, N = q^n, m = n + 1: C(q+n-1,n)/q^n = (1/n!) prod_{i<n}(1 + i/q), the Joux-Vitse 1/n! (KN-LIT-673219 lines 329-349, kb); n = 1: all conventions equal"
      reproduction_check: symbolic (IDEA report section 4.2); the committed KN-FIND-007 144-cell identity and the n = 2 known answer of EXP-MONO-1a1be2 P2 (v) are the regression fixtures
    observation_collision:
      observable: per-target count under a convention, its all-target mean, and the trend in n of their ratios
      distinct_preimage_search: >-
        Six objects share a 2^{n-1} or 2^n trend: a true yield gain; half base versus
        signed base; fixing eps_1 = +1; R versus -R folding; raw fibre degree; proxy
        versus exact. All but the first leave every all-target mean unchanged and are
        separated from it only by the per-target distribution (coverage against the cap).
        n! and 2^{n-1} coincide at n = 2 and separate from n = 3 (IDEA).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: hold the all-target mean fixed and vary the base geometry; coverage separates the fibre's points (KN-FIND-007)
        predicted_gain: none on any attack axis
      - transform: representation_reduction
        proposed_object: conventions A, M, S, X as representations of one event with exact encoding maps (L2 to L4)
        predicted_gain: removes after-the-fact convention fitting
    quantifier_order: >-
      Clause: for the family {E/F_{q^n}} with n growing along some q(n), there exists
      f > 1 with rate(E, n) >= f^{n-1} rate_QR(E, n). Refuted-by-derivation form, pending
      re-derivation: for all n >= 2, q, E, bases D of size B and N, coverage(D) <=
      min(1, C(B+n-1,n)/N). The measurement is existential over the tested cells; a fixed
      q ladder with n <= 7 never enters n = Theta(log q) and decides only the premises.
    method_ceiling:
      strongest_certifiable_claim: >-
        [measured, if run] no compounding detected at n <= 5 on the tested q, the
        identities exact at the tested cells, T1 corroborated at the tested cells, and
        HEUR-F-1 within tolerance at the arm-C cells. Never "does not compound". The
        all-n statement is the derivation's, and only after the composed re-derivation.
      nearby_object_control: "n = 1 anchor cells (factor 2^0, all ratios 1) and the factor-base locus, where the 2^{n-1} proxy factor is true with slope 1 (P5)"
    proof_obligations:
      - {claim: "A/M mean ratio equals B^n/C(B+n-1,n) per cell with the actual B", responsibility: baseline}
      - {claim: "every exhaustive cell is enumerable at its declared size", responsibility: feasibility}
      - {claim: "no convention ratio tracks 2^{n-1} separably from n! for n >= 3", responsibility: strictness}
      - {claim: "coverage <= min(1, mu_M) and coverage >= mu^2/E[T^2]", responsibility: size}
      - {claim: "P2 identities in every exhaustive cell", responsibility: correctness}
      - {claim: "per-target law Poisson within tolerance on generic targets", responsibility: success_probability}
      - {claim: "T1 transfer of KN-FIND-4f0d84 and KN-FIND-bdcd60 (3) to F_Q", responsibility: interface}
      - {claim: "toy tier, n <= 7, no exponent, reading C undecided", responsibility: scope}
    not_applicable_reason: none
  asymptotic_claim: null
  asymptotic_claim_note: >-
    No complexity claim. The hypothesis concerns a dimensionless ratio against an exact
    denominator and moves no exponent in either direction. L8 states why a 2^{n-1}
    factor would not be an exponent-class change; it is a scope statement, not a claim
    of improvement, and it is under blind re-derivation.
  heuristic_assumptions:
    - id: HEUR-F-1
      formal_statement: >-
        For generic targets R uniform in E(F_Q) (not O, not in E[2], not a sum of n - 2l
        base points), T_M(R) is distributed as Poisson(lambda) up to total variation
        O(1/B) when B >> n^2, lambda = (N_cf - m_S)/(N - |S|).
      random_model_justification: sums of many weakly dependent incidence indicators with exact first moment
      supporting_results:
        - exact first moment (L1, L2 [D])
        - exact ordered second moment Var = N^-2 sum_{chi != 1} |S^(chi)|^{2n} (H-MONO-663fb4 (I2), any finite abelian group)
        - Chen-Stein Poisson approximation (recalled pointer only; no agent has read a source here)
      validation_experiment_ids: [EXP-MONO-1a1be2]
      falsification_condition: EXP-MONO-1a1be2 F8 (P6 outside tolerance on C-poisson)
    - id: HEUR-F-2
      formal_statement: A matched uniformly random symmetric base has generic-target coverage 1 - exp(-lambda).
      random_model_justification: the Poisson limit of HEUR-F-1; the bracket mu^2/E[T^2] <= c <= min(1, mu) is rigorous (L5 [D])
      supporting_results: [L5]
      validation_experiment_ids: [EXP-MONO-1a1be2]
      falsification_condition: matched-random coverage outside 3 SE of 1 - exp(-lambda) on arm-C cells (part of P6)
    - id: HEUR-F-3
      formal_statement: >-
        T1: KN-FIND-4f0d84 (root multiset and complete splitting on the factor-base
        locus) and KN-FIND-bdcd60 (3) (complete splitting iff all chi(f(x_i)) agree, on
        squarefree full-degree fibres) hold verbatim over F_Q, q an odd prime above 3.
      random_model_justification: not a random model; a transfer of derivations that use only the group law, Semaev's defining property and the Kummer group (producer's reading)
      supporting_results: [knowledge/findings/KN-FIND-4f0d84.md, knowledge/findings/KN-FIND-bdcd60.md]
      validation_experiment_ids: [EXP-MONO-1a1be2]
      falsification_condition: EXP-MONO-1a1be2 F3 or F4
    - id: HEUR-F-4
      formal_statement: Behaviour at n <= 7 and the tested q is indicative of the regime n = Theta(log q).
      random_model_justification: NOT SUPPORTED; no argument is offered
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: not testable at toy scale; every citation states the scale limit instead
