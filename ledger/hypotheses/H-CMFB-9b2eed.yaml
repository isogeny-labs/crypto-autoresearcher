# H-CMFB-9b2eed
# Family-level coverage / scan-efficiency test for the polynomial family
# p = 5t^2 + 19t + 19 (D = -19, crater-type members) against two matched null
# arms, at toy sizes only. Specifies IDEA-20261015-cba035 under
# RQ-CMFB-33610e. No pair-46-scale statement is made or implied anywhere in
# this record.
hypothesis:
  id: H-CMFB-9b2eed
  question_id: RQ-CMFB-33610e
  source_idea: IDEA-20261015-cba035
  added: '2026-10-15'
  status: analyzed
  status_history:
    - {status: specified, at: '2026-10-15', by: coordinator}
    - {status: approved, at: '2026-10-15', by: coordinator, decision: DEC-20261015-a8509d, note: 'Contract EXP-CMFB-cea1d2 approved and frozen; the hypothesis status field was left at specified at that time.'}
    - {status: analyzed, at: '2026-10-19', by: coordinator, decision: DEC-20261019-f33f3e, evidence: EV-CMFB-e3d1ec}
  status_note: >-
    Decision refine (DEC-20261019-f33f3e). EXP-CMFB-cea1d2 ran valid and complete;
    the recorded classification is NULL_AT_RESOLUTION. EV-CMFB-e3d1ec
    (direction supports, strength preliminary, claim tier toy) records that no
    coverage difference above delta = 0.5 percent was observed between the small-x
    liftable-window base and a matched random base over the tested instances; at
    C24 every 95 percent interval is inside +-0.04 percent. Held at analyzed, not
    supported: the frozen analysis code departs from the contract text in the MDE
    inflation factor (D1) and the I10 reference (D2), a superseding analysis is
    ordered, the evidence is one unreplicated pass at toy scale, and the red team
    shows that the contract's 'constant-only' and 'retire the channel' wording
    exceeds the measurement (the ceiling 1.582 is a theorem, KN-FIND-007; the
    CM structure was not tested; the signed convention was not tested). This note
    supersedes the status_rationale below, which describes the draft state at
    specification time and is kept unchanged. Not official until the ledger
    commit of the archive task is verified.
  statement: >-
    On prime-field curves y^2 = x^3 + A x + B over F_p of prime order N with
    2^14 < p <= 2^25, in each of three arms (FAM: crater-type members of the
    family p = 5t^2 + 19t + 19, N = 5t^2 + 18t + 20, t odd; N-A: crater-type
    j = -96^3 curves over other primes with 4p' = a^2 + 19 b^2 and
    b != a + 2; N-B: random prime-order curves), the small-x factor base
    (the first B = ceil((6N)^(1/3)) abscissae x = 0, 1, 2, ... for which
    f(x) = x^3 + A x + B is a nonzero square mod p, one canonical-sign point
    per abscissa) has the same exact m = 3 coverage as a matched random base.
    Quantified: for every arm a and every powered cell c (a cell with at
    least 8 FAM members), the mean over members of
    (coverage of the member's small-x base) / (mean coverage of 200 matched
    random bases of the same size) minus 1 lies inside delta = 0.5 percent
    (its 95 percent moving-block-bootstrap interval is inside +-0.5 percent
    and no arm-by-cell test is rejected by one Holm family at alpha = 0.05);
    the exact mean-yield ratio is 1 identically (integer identity, KN-FIND-007);
    and the qr_window scan-efficiency ratio, computed from the residuosity of
    f(x) and NOT from the Legendre symbol of x, is 2.0 +- 0.02 on generic
    curves. This is a null prediction. Three explanations of any departure
    are separated by the arm design: E1 twist/QR structure shared by all
    curves, E2 the D = -19 CM class (N-A against N-B), E3 the family
    polynomial / maximal Frobenius conductor (FAM against N-A).
  mechanism: >-
    Conservation (KN-FIND-007): for any base of B distinct group elements the
    total number of size-3 multiset decompositions over all targets is exactly
    binomial(B+2,3), so the mean yield is identical for every base and
    coverage obeys coverage <= min(1, mean). Only the multiplicity
    distribution (coverage) can differ between a structured and a random
    base, through repeated sums created by additive structure among the
    discrete logarithms of the base points. The small-x window selects points
    by a property of x in the curve's own integral Weierstrass chart, which
    is a property unrelated to the logarithm labelling unless the arithmetic
    of f(x) mod p (reciprocity with p mod small primes, the CM structure of
    the Frobenius, or the polynomial relation among p, N, t) couples the two.
    That coupling is exactly what E1, E2 and E3 would have to supply; the
    instrument is built to see an effect of known size (planted base) and to
    reproduce the known 2x scan efficiency (positive control) before any null
    is read.
  assumptions:
    - >-
      Heuristic H1 (null model): the small-x base of a prime-order curve is
      exchangeable with a random base of B distinct x-classes with random
      signs, as far as the exact m = 3 coverage is concerned. This is the
      hypothesis tested, and also the exchangeability on which the
      randomization test rests. Validation: 200 matched random draws per
      member, randomization p-values, moving-block bootstrap over members
      ordered by t, tail diagnostics.
    - >-
      Heuristic H2 (Poisson occupancy): coverage of a random base of size B
      is 1 - exp(-mu) with mu = binomial(B+2,3)/N, to within 0.03 percent at
      N >= 2^18 (recorded for EV-FBG-001: exact 0.6734 / 0.6594 / 0.6480
      against Poisson 0.6720 / 0.6589 / 0.6478 at 2^14 / 2^16 / 2^18), with
      per-draw relative standard deviation 1.4 / sqrt(N) (the
      independent-balls occupancy value is 2.4 to 2.75 times too small
      because pair-sum collisions correlate triples that share a pair;
      revised before freeze from shifted-seed smoke data). Used for the
      resolution derivation and for the planted known effect; checked
      against the measured null standard deviation (accepted band 0.75x to
      1.33x of the formula).
    - >-
      Heuristic H3 (Bateman-Horn member counts): the number of members with
      p and N prime in a cell follows the Bateman-Horn estimate with local
      factors computed from the roots of p(t)N(t) mod q. Recalled and
      unread; it only predicts power. A mismatch changes which cells are
      powered, never the reading of any measured outcome.
    - >-
      Curves with j = -96^3 over F_p, p split in Q(sqrt(-19)), have
      End = O_K (class number 1), so every FAM and N-A curve is crater-type;
      the Frobenius conductor is b with 4p = a^2 + 19 b^2. Standard CM theory,
      recalled and not re-derived here; the checkable parts (j-invariant,
      order, trace identity) are verified per curve by the run.
  predictions:
    - metric: >-
        exact mean-yield ratio, sum over r of c_D(r) divided by
        binomial(B+2,3), for every counted base in every arm
      direction: different
      minimum_effect: >-
        exactly 1 as an integer identity; any deviation voids the run
    - metric: >-
        arm-by-cell mean of (member coverage / mean coverage of 200 matched
        random bases) minus 1, for arms FAM, N-A, N-B in powered cells
      direction: higher
      minimum_effect: >-
        0 predicted. Detected only if Holm-rejected and above +0.5 percent;
        a material lead is at least +2.0 percent in the family with a
        positive size slope over at least 3 powered cells
    - metric: >-
        qr_window scan-efficiency ratio R = scanned candidates per point
        unfiltered over per point filtered by residuosity of f(x), pooled
        over generic (N-B) curves per cell
      direction: different
      minimum_effect: >-
        2.0 +- 0.02 predicted (positive control; outside the band voids the
        run)
    - metric: >-
        planted-relation base (small-x base with one extra abscissa, size
        B+1) against 200 random bases of size B, coverage ratio
      direction: higher
      minimum_effect: >-
        known excess of about +3.3, +1.3 and +0.5 percent on the control
        curves of the three cells (about 1.7 / B, computed from the Poisson
        law; +0.3 percent at 2^25); detection in at
        least 7 of 8 control curves per cell is required before any null is
        read
  test_boundary:
    instances:
      - "FAM: crater-type members with t odd, p = 5t^2+19t+19 and N = 5t^2+18t+20 both prime, 2^14 < p <= 2^25 (at most 16 per cell)"
      - "N-A: crater-type j = -96^3 curves, 4p' = a^2+19b^2 with a, b odd, b != a+2, N' = p'+1-a prime, same cell bands (16 per cell; 8 near the family trace angle)"
      - "N-B: random prime-order curves y^2 = x^3+Ax+B, |A|,|B| <= 1000, same cell bands (16 per cell)"
      - "N-B control curves: 8 per cell for the planted-relation sensitivity control"
    parameters:
      cells: "C16 = (2^14,2^18], C20 = (2^18,2^22], C24 = (2^22,2^25]; C28 not run"
      m: 3
      base_size: "B = smallest integer with B^3 >= 6N"
      matched_random_bases_per_member: 200
      resolution_delta: 0.005
      holm_alpha: 0.05
      minimum_members_per_arm_per_cell: 8
      slope_claim_requires: ">= 3 powered cells"
    implementation: >-
      experiments/EXP-CMFB-cea1d2 (specification.yaml, trial plan and
      implementation/ directory named under its launcher). Exact counting over
      the whole group Z_N with discrete logarithms obtained by baby-step
      giant-step on the curve itself; matched random bases generated directly
      in the logarithm labelling.
    budget:
      wall_clock_seconds_total: 7200
      maximum_memory_gb: 8
      maximum_workers: 4
      maximum_runs: 8
  distinguishable_outcomes:
    - >-
      INSTRUMENT_VOID: a control gate fails (integer yield identity, brute
      force counter check, curve or twist validity, labelling check,
      qr_window ratio outside 2.0 +- 0.02 on generic curves, Legendre(x)
      negative control not near 1.0, planted base not detected in at least 7
      of 8 curves per cell). No scientific reading is made.
    - >-
      NULL_AT_RESOLUTION: valid run set, at least one powered cell, no Holm
      rejection and every arm-by-cell 95 percent interval inside +-0.5
      percent. Reported as consistent with the null at resolution
      delta = 0.5 percent, never as no effect.
    - >-
      INCONCLUSIVE: no powered cell, or powered cells with no detected
      effect (no Holm rejection above +-0.5 percent) and an interval not
      inside +-0.5 percent (this includes a Holm rejection with an effect
      of at most 0.5 percent whose interval is not inside +-0.5 percent), or a
      rejection that cannot be
      attributed by the arm contrasts.
    - >-
      E1_LEAD: an excess is detected in N-B (generic curves), so the
      structure is not specific to D = -19 or to the family.
    - >-
      E2_LEAD: an excess is detected in N-A but not in N-B, and the N-A
      against N-B contrast excludes 0; the CM(-19) class matters.
    - >-
      E3_LEAD: an excess is detected in FAM but not in N-A or N-B, and the
      FAM against N-A contrast excludes 0; the family polynomial or maximal
      conductor matters. Material only at +2.0 percent with a positive slope
      over at least 3 powered cells.
    - >-
      DEFICIT_RECORDED: a detected deficit in any arm and no detected excess.
      Not an advantage and not a lead.
  falsification_conditions:
    - >-
      The prediction of no coverage effect is falsified (scoped) if, on a
      valid run set with all gates passed, a Holm-rejected arm-by-cell excess
      above +0.5 percent exists; the arm pattern then attributes it to E1,
      E2 or E3 under the pre-registered table, and it is a lead requiring
      independent replication, not a result.
    - >-
      The instrument is falsified (run void) if the integer yield identity
      fails anywhere, the qr_window ratio on generic curves leaves
      [1.98, 2.02], or the planted base is not seen.
    - >-
      A pooled FAM or N-A scan-efficiency ratio outside
      2.0 +- max(0.02, 3 standard errors) while the generic pool is inside
      the band is a scan-efficiency lead (E3 if FAM only, E2 if N-A also),
      secondary and outside the Holm family.
  interpretation_limits:
    - >-
      Coverage and scan efficiency only, of one explicitly defined small-x
      base, at m = 3, in the integral Weierstrass chart named by the
      contract. Solver cost, relation rank, linear algebra and descent are
      not measured; conservation makes yield vacuous (EV-FBG-001).
    - >-
      Toy sizes 2^14 < p <= 2^25 only. Nothing in this hypothesis or its
      experiment is evidence about the 53-bit pair p = 5947698030651343,
      about its floor curve, or about any prime of that size; there is no
      transfer argument from these sizes to 2^52.
    - >-
      Only crater-type (End = O_K) curves are constructed. The floor
      (End = Z[pi], conductor v) is not tested here.
    - >-
      A null reading is a statement at resolution 0.5 percent for the tested
      arms, cells, chart, base definition and counting convention
      (unsigned multisets, targets uniform over Z_N). It does not say that
      no factor base can beat a random one; a Sidon-type base reaches +10.7
      percent coverage (EV-FBG-001 red team).
    - >-
      An advantage in coverage is bounded: under one relation per target the
      cost gain is at most min(1,mu)/(1-exp(-mu)) <= 1.582, and under
      harvest-all it is zero (KN-FIND-007). A coverage lead is not an
      exponent result.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The small-x base is exchangeable with a random base of B distinct
        x-classes with random signs for the purpose of exact m = 3 coverage.
      validation_experiment_ids: [EXP-CMFB-cea1d2]
      falsification_condition: >-
        A Holm-rejected arm-by-cell excess above +0.5 percent on a valid run
        set.
    - id: H2
      statement: >-
        Coverage of a random base is 1 - exp(-mu) to within 0.03 percent at
        N >= 2^18 with relative standard deviation 1.4 / sqrt(N).
      validation_experiment_ids: [EXP-CMFB-cea1d2]
      falsification_condition: >-
        Planted known effect off by more than max(0.1 percent, 3 standard
        errors), or measured null standard deviation outside 0.75x to 1.33x
        of the formula (flagged for review, not a void by itself).
    - id: H3
      statement: >-
        Bateman-Horn member counts for p(t) and N(t) with t odd.
      validation_experiment_ids: [EXP-CMFB-cea1d2]
      falsification_condition: >-
        Exact sieve count per cell differing from the estimate by more than
        a factor of 2 (changes power only).
  power_and_growth_expectation: >-
    The exact sieve dry run gives FAM members C16 = 4, C20 = 10, C24 = 13.
    C16 is UNDERPOWERED (fewer than 8), so at most two cells (C20, C24) can
    be powered. A size slope needs at least 3 powered cells, so no slope
    claim and no MATERIAL lead (at least +2.0 percent with a positive slope)
    is possible in this hypothesis test; the best it can deliver is a null at
    resolution 0.5 percent or a sub-threshold level lead in at most two
    cells. Stated before the measurement trials, which have not been run on
    the real seeds.
  status_rationale: >-
    Specified under design-experiment step 3; the experiment contract
    experiments/EXP-CMFB-cea1d2/specification.yaml is a draft awaiting its
    launcher. No evidence exists.
  not_claimed: >-
    No exponent, no solver or relation-rank statement, no claim about the
    53-bit pair or its floor, no claim for p > 2^25, and no statement that
    structured bases cannot beat random bases.
  proposed_by: coordinator
