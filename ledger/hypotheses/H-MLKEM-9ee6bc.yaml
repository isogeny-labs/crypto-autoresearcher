# HYPOTHESIS -- H-MLKEM-9ee6bc, specified from IDEA-20261018-7ba702. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-9ee6bc
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-7ba702
  added: '2026-10-18'
  statement: >-
    Core-SVP charges one sieve at the final dimension. A G6K pump sieves progressively from
    small to full dimension and adds dimensions-for-free; the measured ratio C_prog of total
    pair tests to the final sieve's pair tests is in [3, 8] at d=60-90 and drifts by less
    than 1 bit across the range. The geometric-series prediction 1/(1-2^{-c}) with the measured
    per-dimension exponent c predicts C_prog within 1.5x. A drift > 1 bit or a miss > 2x falsifies
    the constant-overhead assumption.
  mechanism: >-
    Progressive sieving pays a sum over dimensions of per-dimension sieve costs; if each costs
    2^{c d'}, the sum is a geometric series dominated by the last term, so the overhead is
    a constant determined by c. But the realized c at small d (often near 0.35 not 0.292)
    and the extra cost of insertion and re-saturation may make the overhead grow or shrink.
    IDEA-20260821-41cd67 concerns the number of oracle calls R across BKZ; this is the cost
    inside one call.
  assumptions:
  - Pair tests are the dominant cost unit.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Pair tests are the dominant cost unit.
    random_model_justification: G6K profiling.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-af9133
    falsification_condition: Report wall-time ratio alongside.
  predictions:
  - metric: C_prog
    direction: different
    minimum_effect: in [3,8]
  - metric: '|C_prog measured / geometric prediction - 1|'
    direction: lower
    minimum_effect: <= 0.5
  test_boundary:
    instances:
    - d in {60,65,70,75,80,85,90}; f in {0,d4f}; step in {1,4,d}; 5 instances
    parameters:
      scale_tier: medium
      scale_justification: >-
        sieve dimensions 60-90 on a single node; transfer assumption: the per-dimension exponent
        of the measured quantity is extrapolated to beta~400-900 only as a conditional statement
        with the fit interval; no FIPS 203 security claim
    implementation: G6K with per-step counters, Python
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 120
      maximum_memory_gb: 64
      maximum_runs: 220
  distinguishable_outcomes:
