  predictions:
  - metric: minimum over roles of category margin under D=2^64, t = per-domain exposure
    direction: lower
    minimum_effect: '>= 4 bits below the category floor for at least one set'
  - metric: spread of log2 cost across t conventions (per-transcript vs per-tweak-domain)
