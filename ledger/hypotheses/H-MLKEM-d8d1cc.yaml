# HYPOTHESIS -- H-MLKEM-d8d1cc, specified from IDEA-20261018-02ad4a. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-d8d1cc
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-02ad4a
  added: '2026-10-18'
  statement: >-
    Across BKZ (fpylll) and sieving (G6K) measurements on ML-KEM- and ML-DSA-shaped lattices,
    run-to-run variability from basis randomisation, instance sampling and thread scheduling
    sets a minimum detectable effect (MDE at 80% power) of at least 0.3 bits for log-cost
    quantities at dims 60-100. Several calibration proposals in this RQ target effects at
    or below that size, so without the registry their outcomes cannot be distinguished from
    noise.
  mechanism: >-
    Every comparison needs an A/A noise floor, but each proposal measures it ad hoc and with
    few repeats. A dedicated registry with many repeats per nuisance factor provides variance
    components (instance vs basis vs scheduling) shared by both schemes' lanes, turning each
    proposal's minimum_effect into a checkable power statement.
  assumptions:
  - Op counts are deterministic given seeds
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Op counts are deterministic given seeds
    random_model_justification: fpylll and G6K deterministic modulo threading
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-aeb923
    falsification_condition: Determinism control
  predictions:
  - metric: mde_bits_dim80
    direction: higher
    minimum_effect: '>= 0.3 bits'
  - metric: basis_randomisation_share
    direction: higher
    minimum_effect: '>= 40% of variance'
  test_boundary:
    instances:
    - dims {60,80,100}; 10 instances x 5 basis seeds x 2 thread counts; shapes kem, dsa
    parameters:
      scale_tier: medium
      scale_justification: dims <= 100
    implementation: fpylll, G6K, statsmodels
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 80
      maximum_memory_gb: 32
      maximum_runs: 120
  distinguishable_outcomes:
  - < 0.1 bits
  - < 10%
  falsification_conditions:
  - MDE < 0.1 bits
  - Positive injected effect not detected
  interpretation_limits:
  - 'Scale limit: dims <= 100; variance scaling extrapolated; no security statement'
  - Tooling/control result
  status: specified
  proposed_by: idea-generator
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open goal
    serves this question. The Coordinator must open a successor goal or rebind before dispatch.
