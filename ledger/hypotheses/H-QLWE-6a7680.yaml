# HYPOTHESIS -- H-QLWE-6a7680, specified from IDEA-20261018-b16a07. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-QLWE-6a7680
  question_id: RQ-QLWE-1c4a3b
  goal_id: GOAL-QLWE-291164
  derived_from_idea: IDEA-20261018-b16a07
  added: '2026-10-18'
  statement: >-
    The quantum-frontier schema classifies rows as structure-blind or structure-dependent,
    but for quantum enumeration (KN-LIT-3072) the cost is a function of the classical enumeration
    tree size T (roughly sqrt(T) quantum steps). On BKZ-reduced bases of plain LWE, Ring-LWE
    (x^d+1) and Module-LWE (rank 2,4) embeddings of identical total dimension 40..70, the
    measured log2 T for the same pruning radius differs by less than 1 bit across structures,
    so the row is structure-blind by measurement.
  mechanism: >-
    If T depends only on the Gram-Schmidt profile, and the profile after BKZ is indistinguishable
    between structured and plain bases (the usual assumption), then quantum enumeration's
    exponent cannot see the ring. Measuring T exactly with fpylll node counts tests the classification
    instead of asserting it, and a planted-structure positive control shows the instrument
    detects a profile difference when one exists.
  assumptions:
  - Quantum backtracking cost is monotone in classical T
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Quantum backtracking cost is monotone in classical T
    random_model_justification: Montanaro's bound O(sqrt(T n)) (recalled via KN-LIT-3072)
    supporting_results: []
    validation_experiment_ids:
    - EXP-QLWE-2fdcf6
    falsification_condition: Report T, not quantum cost, as primary
  predictions:
  - metric: abs_delta_log2_T_ring_vs_plain
    direction: lower
    minimum_effect: < 1 bit at all dims
  - metric: delta_log2_T_planted_dense_sublattice
    direction: higher
    minimum_effect: '>= 3 bits'
  test_boundary:
    instances:
    - >-
      total dim n in {40,50,60,70}; q=3329; CBD eta=2; module ranks k in {1(ring),2,4} with
      d = n/k; plain LWE; 20 instances each; BKZ-20; enumeration block 40-60
    parameters:
      scale_tier: toy
      scale_justification: >-
        block dim <= 60; transfer: structure-blindness at small block extends if profile model
        holds
    implementation: fpylll 0.6.x, SageMath for ring construction, NumPy bootstrap
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 30
      maximum_memory_gb: 8
      maximum_runs: 40
  distinguishable_outcomes:
  - '>= 2 bits at some dim with CI excluding 0'
  - < 1 bit (instrument cannot see structure)
  falsification_conditions:
