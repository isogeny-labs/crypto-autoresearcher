# HYPOTHESIS -- H-MLDSA-0565ce, specified from IDEA-20261018-94b270. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-0565ce
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  derived_from_idea: IDEA-20261018-94b270
  added: '2026-10-18'
  statement: >-
    Under simulated Hamming-weight leakage of y coefficients with noise sigma, deterministic
    ML-DSA lets an attacker re-sign one message R times to average noise to sigma/sqrt(R)
    on the same y, then use z - y = c s1. For sigma in {2, 4, 8}, deterministic mode needs
    a total number of signatures at least 5 times smaller than hedged mode to recover s1 at
    ML-DSA-44 shapes; at sigma <= 0.5 the gap disappears (single-trace regime).
  mechanism: >-
    In hedged mode each signature uses a fresh y, so per-signature leakage must be combined
    across different y via c s1 (a vertical attack on the key); in deterministic mode the
    attacker gets repeated looks at the same y and can reduce y-noise first, then needs only
    a few distinct messages. The gap is a measurable cost of the deterministic option in a
    passive model, complementing the fault-based argument for hedging.
  assumptions:
  - per-coefficient posteriors can be combined independently
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
