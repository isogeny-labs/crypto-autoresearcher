    falsification_condition: measure normed secret norms
  predictions:
  - metric: log q_sub/log q_dsd
    direction: higher
    minimum_effect: '>= 1.05 in all cells'
  - metric: best subfield index
    direction: different
    minimum_effect: index 2 best among subfields
  test_boundary:
    instances:
    - n in {64, 128, 256}; beta in {20, 30}; q grid 0.25 log2; 10 instances per point
    parameters:
      scale_tier: toy
      scale_justification: n <= 256
    implementation: SageMath number fields, fpylll, certificate checker
    budget:
