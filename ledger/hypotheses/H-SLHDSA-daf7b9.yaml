# HYPOTHESIS -- H-SLHDSA-daf7b9, specified from IDEA-20261018-c21656. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-SLHDSA-daf7b9
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  derived_from_idea: IDEA-20261018-c21656
  added: '2026-10-18'
  statement: >-
    Upper hypertree layers sign deterministic roots, so caching the WOTS+ signatures of the
    top L layers and comparing on reuse detects any fault that changes a cached root. At reduced
    d in {3,4}, h in {9,12}, caching the top L layers detects 100% of grafting faults on those
    layers and 0% below, so the detection-versus-memory curve is a step function whose memory
    cost per layer is 2^{h' (L-1)} WOTS signatures; full protection at d=4 costs at least
    2^6 times more memory than protecting the top layer alone.
  mechanism: >-
    Determinism makes upper-layer signatures cacheable; any deviation is evidence of a fault.
    Lower layers vary per signature, so caching does not help there, but lower-layer keys
    are rarely reused, so faults there need many more signatures (see grafting idea). The
    frontier measures the residual forgery rate under realistic budgets.
  assumptions:
  - Faults are uniform over layers
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Faults are uniform over layers
    random_model_justification: modelling
    supporting_results: []
    validation_experiment_ids:
    - EXP-SLHDSA-37c329
    falsification_condition: per-layer breakdown
  predictions:
  - metric: detection rate on cached layers
    direction: higher
    minimum_effect: 100% of 10^4 faults
  - metric: residual forgery rate with L=1 at d=4 within 10^4 faulty signatures
    direction: lower
    minimum_effect: <= 0.1 of unprotected
  test_boundary:
    instances:
    - d in {3,4}; h in {9,12}; L in {0..d}; 10^4 faults per cell
    parameters:
      scale_tier: toy
      scale_justification: 'reduced d,h; transfer: step shape independent of n'
    implementation: Python toy signer with cache layer
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 4
      maximum_memory_gb: 4
      maximum_runs: 24
  distinguishable_outcomes:
  - any miss
  - above 0.5 of unprotected
  falsification_conditions:
  - any undetected fault on a cached layer
  - L=1 residual above 0.5 of unprotected
  interpretation_limits:
  - >-
    Toy tier: reduced n (hash output truncated to 12-32 bits) and reduced w, h, d, k, a; no
    statement transfers to a FIPS 205 parameter set without the stated transfer assumption
    and a separate crypto-tier certificate.
  - >-
    Assumes cache memory not faulted; a Rowhammer-style memory fault on the cache is out of
    model.
  status: specified
