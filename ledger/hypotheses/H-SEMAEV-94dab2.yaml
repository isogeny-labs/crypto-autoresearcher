  title: >-
    The legacy (x3-dropping) s4_expr changed the recorded outputs of the
    archived S4-consuming runs; a matched rerun that swaps only s4_expr
    measures by how much and whether each recorded conclusion moves
  statement: |
    THE DEFECT (established, not hypothesized). Before 2026-08-13,
    harness/semaev.py built the right-hand S3 of the S4 resultant with a
    sequential .subs({x1: x3, x2: x4, x3: t}), so x3 was renamed twice and
    the returned polynomial lacks x3 (degree 16, 227 terms over Z for
    y^2 = x^3 + 2x + 3, against the exact S4 of degree 12 and 439 terms).
    Every exposed archived run recorded the same semaev.py bytes
    (sha256 53a23952...): EXP-MTIC-001 (commit a2947025e2), EXP-FIB-001
    (1ba846482a, 53d3fed02f) and RUN-ICINV-e0cd8f-m3class (76a48ff3d8).
    THE CLAIM. Holding every other input fixed (the archived program, its
    frozen instances, targets, seeds and caps), replacing the legacy
    s4_expr by the repaired one changes the S4-dependent outputs of the
    exposed runs. The size of each change, and whether it moves the
    conclusion each run recorded, is the measured quantity. It is not
    asserted that any conclusion moves.
    THE EXPOSED RUNS (path analysis by the three surveys of this session and
    the audit note). S4 is called only by RUN-MTIC-007, -008, -010 (failed,
    superseded by -010b) and -010b; RUN-FIB-004 and -005, whose costs feed
    RUN-FIB-006C, -007's ratio and the -008 gate; and the m4 stage of
    RUN-ICINV-e0cd8f-m3class. RUN-MTIC-001..006, -009 and RUN-FIB-001..003
    never call S4 and are IMMUNE by import analysis; they are inputs here,
    not cells.
  mechanism: >-
    OBJECT: the outputs of an archived program as a function of one
    substituted function. OPERATION: run the unmodified archived program
    twice, concurrently, once with s4_expr from the exact legacy bytes and
    once with the current repaired s4_expr, everything else from the
    current tree; read the legacy arm against the archive (does the old
    result reproduce here?) and the repaired arm against the legacy arm (what
    did the defect change?). The legacy-versus-archive comparison separates
    a defect effect from environment drift (machine, Python, Singular
    version, wall-clock caps).
  assumptions:
  - >-
    Only s4_expr differs between the arms. The vendored legacy file and the
    current harness/semaev.py differ elsewhere only in build_factor_base's
    opt-in scope parameter, whose default is byte-identical
    (CORR-20260813-d9f0fa); the arms take build_factor_base and every other
    function from the current tree.
  - >-
    The archived programs (run_mtic.py, driver/*.py,
    exp_icinv_e0cd8f_m3class.py) are the committed files of today. They were
    untracked or dirty at their recorded run commits and were committed
    later, so their bytes at run time are not independently bound; the
    legacy-arm reproduction control is what tests that assumption.
  - >-
    The MTIC and FIB cells measure under wall-clock caps (60 s and 20 s per
    solve, 1500 s cumulative). Cap-truncated counts depend on host speed;
    the archive ran on macOS arm64, this rerun on Linux x86_64. Counts are
    therefore compared with a frozen tolerance and categorical outcomes
    exactly.
  predictions:
  - id: P1
    metric: ICINV m4 s4_support per record, repaired arm
    prediction: 439 on every record (the exact S4 support), against 227/225/210 archived
    basis: the 2026-10-18 audit recomputation on two curves; in sample (see prediction_provenance)
  - id: P2
    metric: ICINV m3class verdict CLASS-VARYING
    prediction: unchanged, because PRIMARY_FAMILIES contains no m4 field
    basis: code reading of harness/exp_icinv_e0cd8f_m3class.py
  - id: P3
    metric: MTIC and FIB categorical outcomes (regime, K*, resource_exhaustion, gates)
    prediction: none; no direction is predicted
    basis: no prior measurement of the repaired arm on these cells
  test_boundary: >-
    Toy tier only: the archived instances (16, 20 and 24-bit MTIC curves;
    C16-1, C16-2, C20-1, C20-2 FIB curves; the p = 4001 ICINV class and
    control set). sympy 1.14.0 Buchberger and Singular 4.4.1 as the
    archived programs call them. Nothing about cryptographic scale, other
    experiments, or other summation-polynomial constructions.
  falsification_criteria: >-
    Per cell, the claim is falsified for that cell if the repaired arm equals
    the legacy arm on every S4-dependent output the cell records (the defect
    was inert there). A cell whose legacy-arm reproduction control fails
    decides nothing about the defect: its contrast is reported as
    drift-confounded.
  interpretation_limits:
  - A changed number questions that archived number, never the hypothesis the archived run tested (H-MTIC-001, H-FIB-001, H-ICINV-d5e351 keep their status; only the Coordinator path changes them).
  - No speedup, cost, security or ECDLP claim; no improvement over any index-calculus baseline (AGENTS.md "Every improvement is a success" classes this as an accounting/integrity result).
  - Unchanged categorical outcomes under wall-clock caps establish that the cap still binds, not that S4 is irrelevant to cost.
