    direction: lower
    minimum_effect: < 1 s per message
  - metric: sparse recovery time vs w
    direction: different
    minimum_effect: within factor 4 of C(nl,w)4^w unit ops
  - metric: t1 = 0 rule recall on w >= 1
    direction: lower
    minimum_effect: 0 percent
  test_boundary:
