# HYPOTHESIS -- H-MLDSA-8cbde9, specified from IDEA-20261018-3e34f5. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-8cbde9
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  derived_from_idea: IDEA-20261018-3e34f5
  added: '2026-10-18'
  statement: >-
    Verify accepts any decodable pk. A crafted pk with t1 = 0 (or any key whose s1 is publicly
    recoverable) lets anyone forge: with t1 = 0, z = y drawn from the shrunken box and c =
    H(mu || HighBits(A y)) verify with h = 0; keys with s1 of Hamming weight w are recoverable
    from pk by search over C(n l, w) 5^w supports. Measured at real ML-DSA-44: universal forgery
    under t1 = 0 in under one second per message, sparse-s1 recovery time fitting C(nl,w)4^w
    within factor 4 for w <= 3, and a t1 = 0 rejection rule detects 0 percent of w >= 1 weak
    keys.
  mechanism: >-
    A malicious key owner can publish a key under which anyone can forge, then repudiate signatures;
    the verifier does not validate key provenance. Honest keys never have t1 = 0, so a check
    is free but narrow; the sparse class shows the boundary between cheaply detectable and
    search-detectable weak keys.
  assumptions:
  - honest t1 = 0 probability is negligible
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
