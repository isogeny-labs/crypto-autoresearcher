# HYPOTHESIS -- H-MLDSA-83e8f1, specified from IDEA-20261018-c5cccf. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-83e8f1
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  derived_from_idea: IDEA-20261018-c5cccf
  added: '2026-10-18'
  statement: >-
    A non-conforming hedged signer that retries rnd until the first k bits of c_tilde equal
    k bits of a covert payload produces valid signatures whose c_tilde is computationally
    indistinguishable from honest ones (without K), with expected signing cost 2^k times honest;
    leaking s1 (about 2^11 bits at ML-DSA-44 compressed) takes 2^11/k signatures. Measured:
    cost fits 2^k within 10 percent for k in {1..12}, and public uniformity tests on c_tilde
    have power at most their size over 10^6 signatures.
  mechanism: >-
    rnd is the only signer input the verifier cannot check; c_tilde is a hash output that
    depends on rnd through y, so rejection on k bits is a standard subliminal channel. The
    receiver needs only the public signatures. This makes 'hedged mode' a kleptographic surface
    measured in bits per signature per unit of work.
  assumptions:
  - c_tilde is pseudorandom without K
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
