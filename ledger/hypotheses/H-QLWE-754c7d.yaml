# HYPOTHESIS -- H-QLWE-754c7d, specified from IDEA-20261018-2f024b. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-QLWE-754c7d
  question_id: RQ-QLWE-d2d713
  goal_id: GOAL-QLWE-291164
  derived_from_idea: IDEA-20261018-2f024b
  added: '2026-10-18'
  statement: >-
    Using the BKSW reduction (KN-LIT-4706), map each LWE regime (n, q, alpha) to its eDCP
    parameters (group size, extrapolation width, effective fault rate) under three alpha normalisation
    conventions (alpha = sigma/q, sqrt(2 pi) sigma/q, and the inverse convention). For n in
    [64, 1024] and alpha from 1/n^2 to 1/sqrt(n), no regime with q = poly(n) lands at a fault
    rate below the tolerance measured for Kuperberg sieves at the matching group size; the
    convention choice shifts regime boundaries by at least a factor sqrt(n), explaining the
    corpus's unparsable alpha.
  mechanism: >-
    The reduction is a formula; composing it with a measured tolerance curve turns the route
    into an explicit feasibility map. Writing the three conventions side by side resolves
    the ambiguity KN-OPEN-8a5965 flags without adjudicating Simon's algorithm.
  assumptions:
  - BKSW fault rate is the dominant obstruction
  proof_search_map:
