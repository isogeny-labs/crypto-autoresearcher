  statement: >-
    NTRU lattices are proportional to symplectic lattices (KN-LIT-6918), and reduction that
    preserves the symplectic form only needs to reduce half the basis, recalled as about a
    2x LLL speedup. Claim: a symplectic BKZ variant gives a measured work speedup in [1.5,
    2.5]x for full BKZ-beta tours at dimension 128..220, and the block size at which the dense-sublattice
    event triggers is unchanged within +-2. Falsified if speedup < 1.2 or > 4, or if the event
    block size shifts by more than 4.
  mechanism: >-
    The symplectic form pairs basis vector i with 2n+1-i; reducing the first half determines
    the second via the dual. BKZ on the full basis does redundant work. The profile of a symplectic
    reduced basis is anti-symmetric around its midpoint, which may change how the dense-sublattice's
    projection appears in the middle of the profile.
