  falsification_conditions:
  - A validated P1 branch-type counterexample.
  - A valid connected geometric placement outside P2 spectrum.
  - An exhaustive admissible census contradicts P3, with all controls passing.
  interpretation_limits:
  - Branch configuration, actual E model, twist, T class, connectedness and descent are distinct reported fields.
  - Incomplete census is censored, never a minimum certificate.
  - Heuristic equidistribution H1 from the idea is descriptive and not an approval/success gate.
  - Type2 does not imply nonhyperelliptic without its separate predicate.
