  title: Degree-two quotient branch types and same-curve GHS genus minima, with coefficient-aware descent
  statement: UNREVIEWED CANDIDATE. For each actual E/K and T in E(K)/2E(K), the Frobenius branch types are
    (1,3) only for odd order; (1,1,2) at zero and (4) at nonzero for rational two-torsion rank one; (1,1,1,1)
    at zero and (2,2) at nonzero for rank two. The geometric nonzero-T genus spectrum is contained in {1,(n-1)*2^n+1}
    for type (4), and {1,2^(n-2)*(n-2)+1,2^(n-1)*(n-1)+1,(n-1)*2^n+1} for type (2,2), n=3,5,7. For n=3 and
    q=5,7,11 at least one actual K-isomorphism class has a smaller geometric branch-genus minimum after nonzero
    T is included; for n=5,q=3 none of the full baseline cohort gains a lower geometric minimum. This preserves
    the proposal prediction. Descent-admissible minima are separately descriptive, with no added falsification
    criterion. A branch tuple of Chao Type2 form has the shared length-six orbit pattern; compute separately
    whether the trace-zero Mobius hyperellipticity predicate holds. No equivalence with all nonzero-T curves
    is assumed.
  mechanism: Ramification of f_T is the E[2]-torsor [2]^{-1}(T). Translate classes are indexed by E(K)/2E(K).
    Cyclic branch incidence predicts geometric genus; full function-field square classes and Frobenius lift
    control descent separately.
  assumptions:
  - K=F_(q^n), odd q, n in {3,5,7}; nonsingular actual elliptic K-model with named origin.
  - Only separable degree-two quotient maps; PGL2(K)/PGL2(Fq) structures have explicit exhaustive representatives.
  - Geometric genus is not a descent or large-subgroup transfer certificate.
  proof_search_map:
    bottleneck: Existing x-line census omits other degree-two maps and cannot determine all-map same-curve
      minima.
    baseline_embedding:
      parameter_slice: T=O, n=3 q=5,7 and n=5 q=3 sibling fixtures; q=11 full same-method baseline computed
        prospectively
      reproduction_check: Exact model, twist, coverage and genus rows equal committed fixtures; not j-only
        aggregates.
    observation_collision:
      observable: branch cycle type and (m,r) are insufficient to identify curve/twist or coefficient-dependent
        descent
      distinct_preimage_search: Pair both coefficient square classes at fixed branch polynomial, and same-j
        nonisomorphic K-models; retain distinct rows until explicit K-isomorphism is certified.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Explicit same-curve f_T quotient quartic from actual rational T; factor conjugate branch
        polynomials over K instead of materializing K^4
      predicted_gain: Retains curve identity and all nonsplit branch types without a j-only reconstruction.
    quantifier_order: For each enumerated E/K isomorphism class, enumerate all T in E(K)/2E(K), then all projective
      Fq structures; no T or structure chosen after observing genus. Symbolic orbit statement quantifies over
      n=3,5,7 and all permitted placements, separately from finite census.
    method_ceiling:
      strongest_certifiable_claim: Exact finite genus/descent minima for covered K-isomorphism classes, plus
        independently reviewed orbit lemmas; no density extrapolation
      nearby_object_control: Odd-order curves have only T=O; both twists and special j remain separate; Type2
        hyperelliptic exceptions retained.
    proof_obligations:
    - claim: Derive Pic^2/T and involution P -> T-P classification with exceptional charts
      responsibility: correctness
    - claim: Prove or certify actual K-isomorphism and twist for each quotient, with explicit forward/inverse
        maps
      responsibility: interface
    - claim: Compute weighted branch incidence and constant square relations independently; demonstrate geometric
        connectedness before genus assignment
      responsibility: correctness
    - claim: Certify Frobenius lift of exact order n or an equivalent sufficient descent certificate, coefficient
        included
      responsibility: interface
    - claim: Exhaust all rational T quotient classes and all projective structures; preserve full cohorts and
        exceptional j
      responsibility: scope
    - claim: Separate Type2 root signature from hyperellipticity and admissible descent; independently check
        Mobius witnesses
      responsibility: correctness
