# HYPOTHESIS -- H-MLDSA-88e591, specified from IDEA-20261018-0eb5a3. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-88e591
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  derived_from_idea: IDEA-20261018-0eb5a3
  added: '2026-10-18'
  statement: >-
    If the low b bits of every mask coefficient y_j leak (for example from a table-indexed
    ExpandMask unpack), then z - y_low = 2^b y_high + c s1 gives c s1 mod 2^b exactly, and
    since c(1), the sum of tau signs, is congruent to tau mod 2, c is invertible in Z_{2^b}[X]/(X^n+1)
    whenever tau is odd (39 and 49 at ML-DSA-44/65), so ONE signature yields s1 mod 2^b; at
    b >= ceil(log2(2 eta + 1)) that is s1 itself. At ML-DSA-87 (tau = 60) c is never a unit
    mod 2 and one signature leaves a kernel. With with partial leakage (a fraction rho of
    coefficients) the remaining unknowns are finished with DDGR modular hints plus BKZ.
  mechanism: >-
    X^n + 1 = (X + 1)^n mod 2, so an element of Z_2[X]/(X^n+1) is a unit iff its value at
    X = 1 is odd, and Hensel lifting extends units to Z_{2^b}. c in B_tau has c(1) congruent
    to tau mod 2; tau = 39, 49, 60 at ML-DSA-44/65/87, so ML-DSA-87's c is NOT invertible
    mod 2 and needs a different finish (prediction P3). The z-bound rejection does not alter
    z = y + c s1 for accepted signatures, so the leak is exact through rejection. Partial
    leakage turns each known LSB into a modular hint on one linear form of s1, and DDGR's
    modular-hint integration predicts the remaining block size.
  assumptions:
  - DDGR modular-hint integration predicts the finishing BKZ block size for these hints
  proof_search_map:
