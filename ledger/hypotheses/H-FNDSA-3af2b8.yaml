# HYPOTHESIS -- H-FNDSA-3af2b8, specified from IDEA-20261018-cc5a57. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-FNDSA-3af2b8
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  derived_from_idea: IDEA-20261018-cc5a57
  added: '2026-10-18'
  statement: >-
    Detection is not recovery. For a planted defect of known functional form, the signature
    likelihood given the basis is computable up to normalisation at toy n. Claim: a gradient-based
    MLE over basis parameters recovers a secret direction to 10 degrees with at most one third
    of the signatures needed by second- and fourth-moment learners (the NTRUSign-attack family)
    at n in {8, 16, 32}, and reaches within 2x of the Cramer-Rao bound. Falsified if MLE needs
    at least as many signatures as the best moment method at any n.
  mechanism: >-
    Moment learners use only a few low-order statistics, which carry a fraction of the Fisher
    information when the defect is non-Gaussian (centre bias, truncation). MLE uses the full
    law. The surrogate is a smooth relaxation of the discrete Gaussian with planted defect,
    differentiable in the basis; Riemannian ascent on the orthogonal-like parameterisation
    avoids symmetry traps by multiple restarts.
  assumptions:
  - Surrogate likelihood is close to the true one
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Surrogate likelihood is close to the true one
    random_model_justification: none
    supporting_results: []
    validation_experiment_ids:
    - EXP-FNDSA-a7649a
    falsification_condition: compare surrogate and exact log-likelihood on enumerated support
      at n = 8
  predictions:
  - metric: N_theta(moment)/N_theta(MLE)
    direction: higher
    minimum_effect: '>= 3 at n = 16, 32'
  - metric: N_theta(MLE)/N_CR
    direction: lower
    minimum_effect: <= 2
  test_boundary:
    instances:
    - >-
      n in {8, 16, 32}; delta in {0, 1e-2, 1e-1, 0.3}; 10 keys; 20 restarts; up to 10^6 signatures
    parameters:
      scale_tier: toy
      scale_justification: n <= 32; transfer only as a ratio claim
    implementation: PyTorch surrogate, NumPy samplers, exact enumeration at n=8
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 30
      maximum_memory_gb: 8
      maximum_runs: 36
  distinguishable_outcomes:
  - <= 1 at any n
  - '> 5'
  falsification_conditions:
  - MLE no better than moment methods
  - MLE converges to the true basis under the null
  interpretation_limits:
  - >-
    Scale and transfer: n <= 32 and a known defect form; at deployed n the likelihood is intractable
    without this structure
  - assumes the attacker knows the defect family
  status: specified
