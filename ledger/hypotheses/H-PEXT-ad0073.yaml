    source: IDEA-20261024-3c71a9 prediction 1 and derivation table (5.1)
  - id: P2
    metric: '|E(K)[4]| on every unit, n = 5, S = (0,1,2,3), q = 1 mod 4 (q = 5, 9, 13, 17, 25, 29)'
    direction: equals
    minimum_effect: 4 if t = -1; 16 if t = +1 and b_1 b_2 = +1; 8 if t = +1 and b_1 b_2 = -1 (the pair rule "exactly one 4 per pair" is generic and non-discriminating)
    source: IDEA-20261024-3c71a9 predictions 2-3 and derivation table (5.1)
  - id: P3
    metric: '|E(K)[4]| on every unit, n = 7, S = (0,2,3,4), q = 3, 5, 7, 9'
    direction: equals
