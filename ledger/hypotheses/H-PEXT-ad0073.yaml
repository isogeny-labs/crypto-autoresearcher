  title: >-
    Candidate norm-character law for |E(K)[4]| on the four-of-n-conjugates branch-quadruple family (n = 5: the genus-5
    floor family; n = 7: S = (0,2,3,4)), tested as a refutable prediction on exact point counts
  statement: >-
    UNREVIEWED CANDIDATE, tested not proved. Let q be an odd prime power, n an odd prime, K = F_{q^n}, sigma the
    q-Frobenius, x in K \ F_q, S = (a_1, a_2, a_3, a_4) distinct residues mod n, e_i = sigma^{a_i} x, c in K*, and
    E_c the Jacobian (origin (e_4, 0)) of the quartic y^2 = c prod (z - e_i), realized as the monic cubic
    Y^2 = prod (X - alpha_i), alpha_i = -A/(e_4 - e_i), A = c prod_{i<=3} (e_4 - e_i) (derivation.md sections 1-2).
    With eps = chi_q(-1), t = chi_K(c) and b_k = chi_q(N_{K/F_q}(x - sigma^k x)) for 1 <= k <= (n-1)/2, the candidate
    law (L) of derivation.md (3.1), (3.2), (4.2) is: the signs s_ij = chi_K(alpha_i - alpha_j) equal
    s12 = t beta(a_2 - a_1) beta(a_4 - a_3), s13 = t beta(a_3 - a_1) beta(a_4 - a_2), s23 = t beta(a_3 - a_2) beta(a_4 - a_1)
    (beta(k) = b_k for k <= (n-1)/2, eps b_{n-k} otherwise); W_1, W_2, W_3 are halvable iff s12 = s13 = +1,
    eps s12 = s23 = +1, eps s13 = eps s23 = +1; and |E_c(K)[4]| = 4 + 4h, h the number of halvable W_i.
    Specializations fixed before any decisive run. (L5) n = 5, S = (0,1,2,3), the genus-5 minimum family of the
    sibling census (m, r) = (4, 5): with p = b_1 b_2, |E_c(K)[4]| is 8 on every unit when q = 3 mod 4, and when
    q = 1 mod 4 it is 4 for t = -1, 16 for (t, p) = (+1, +1) and 8 for (t, p) = (+1, -1) (derivation table (5.1)).
    (L7) n = 7, S = (0,2,3,4) (genus 7, (m, r) = (3, 7)): |E_c(K)[4]| = 4 (1 + I_1 + I_2 + I_3) with the
    indicators of derivation (7.1)-(7.2). The unit counted is the configuration: a PGL2(F_q)-orbit representative
    x of K \ F_q with a coefficient class c in {1, non-square}; class-level shares are not claimed. The experiment
    asks whether exact brute-force counts of |E_c(K)[4]| and of the signs on every unit contradict (L); a
    pass would not establish the theorem, its novelty, the class-level shares, or anything outside the tested cells.
  mechanism: >-
    chi_K = chi_q o N_{K/F_q} (n odd), so the square class of every difference e_i - e_j depends only on the
    norm bits b_k, eps and a common twist bit t; Bekker-Zarhin halving on the monic cubic then turns the three
    sign conditions into |E[4]| = 4 + 4h. The candidate shows why the genus-5 floor family cannot avoid a
    rational point of order 4 when -1 is a non-square in F_q. Nothing in the mechanism is claimed as independently
    reviewed (BATCH-68a56c review lanes are blocked by IMP-PEXT-BLIND-CONTRACT-INTERFACE-20261027 and
    IMP-PEXT-NORM-REVIEW-ADMISSION-20261027).
  derivations:
    written_at: '2026-10-27'
    written_before_any_decisive_run: true
    source: coordination/goals/GOAL-PEXT-4a1d6b/batches/BATCH-3e067e/tasks/TASK-20261027-e6b5bf/derivation.md
    status: unreviewed candidate (Coordinator intake, zero runs, no independent mathematical review)
    design_lane_algebra_check: >-
      experiments/EXP-PEXT-0b2c75/implementation/bitalgebra.py selfcheck (pure algebra on the written formulas, no
      field data): the generic predictor equals the literal n = 5 table (5.1) and the literal n = 7 formula (7.2) on
      every bit cell, h is invariant under all 24 orderings of every 4-subset of Z/5 and Z/7 (28,800 variants), h is
      never 2, and h <= 1 when eps = -1. This is internal consistency of the candidate formulas, not a proof of them.
    pair_rule_observation: >-
      Design-lane algebra from (3.1): at eps = +1 the three signs flip under the twist, so a pair has exactly one
      member with h = 0 for EVERY quartic with four K-rational branch points. The IDEA's "exactly one K-twist of each
      pair has |E(K)[4]| = 4 (share 1/2)" is therefore true off the family too and is NOT a discriminating prediction;
      the discriminating content at eps = +1 is which member (the non-square coefficient t = -1, because the family
      forces s12 = s13) and the split 16 iff t = +1 and p = +1 versus 8. At eps = -1 the discriminating content is
      |E(K)[4]| = 8 on every unit, while an unconstrained quartic has |E(K)[4]| = 4 about a quarter of the time.
  assumptions:
  - The Bekker-Zarhin halving criterion for a monic cubic (cited by the derivation as a source theorem; not re-verified here).
  - Distinct branch points and odd characteristic; the construction does not divide by 3 and includes characteristic 3 (q = 3, 9, 27).
  - The sibling genus formula g = 2^(m-2)(r-4)+1 identifies S words with their minimum genus; (m, r) is computed by the tool for every S used.
  proof_search_map:
    bottleneck: whether the sign bookkeeping (4.2) plus the halving test (3.1) reproduce exact group data on the whole family
    baseline_embedding:
      parameter_slice: n = 5, q = 3, the 20 genus-5 records of the sibling census (in-sample)
      reproduction_check: >-
        regression trial of EXP-PEXT-0b2c75: the family enumeration at q = 3 equals the 20 published records on (j, order,
        E2, E4) as multisets, and the tool's verbatim port of the sibling four_torsion method reproduces every published field
        of those records
    observation_collision:
      observable: (eps, t, b_1..b_h) -> |E(K)[4]|
      distinct_preimage_search: >-
        two units with equal bits and different |E(K)[4]| refute the law; the random off-family arm shows the same
        instrument can produce |E(K)[4]| = 4 at eps = -1
    constructive_transforms:
    - transform: constructive_enumeration
      proposed_object: every PGL2(F_q)-orbit of x in K \ F_q with both coefficient classes, for q up to 31 (n = 5) and 9 (n = 7)
      predicted_gain: exact tests of the law on all q^2 + 1 configurations per q instead of a sampled census
    quantifier_order: >-
      FOR ALL q in the tested lists, ALL units; no statement for untested q. The derivation is for all odd q; this
      experiment tests the listed cells only.
    method_ceiling:
      strongest_certifiable_claim: >-
        a clean pass is zero contradictions of the candidate on the enumerated cells; it is not a proof, not a review
        and not a novelty finding
      nearby_object_control: >-
        off-family random branch quadruples (same instrument, same fields) and the published off-family split records
        at q = 3, where |E(K)[4]| = 4 occurs
    proof_obligations:
    - claim: pointed quartic-to-cubic identification and extension at omitted points (intake obligation 1)
      responsibility: independent assessment (not discharged here; the experiment checks #C(K) = #E(K) on every unit)
    - claim: Bekker-Zarhin application and the count 4 + 4h (obligation 3)
      responsibility: independent assessment (not discharged here; checked against brute force on every unit)
    - claim: class shares and weighting (obligation 5/6)
      responsibility: open; not claimed
