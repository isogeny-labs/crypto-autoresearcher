  predictions:
  - id: P1
    metric: '|E(K)[4]| on every unit, n = 5, S = (0,1,2,3), q = 3 mod 4 (q = 7, 11, 19, 23, 27, 31; q = 3 reported as the in-sample control)'
    direction: equals
