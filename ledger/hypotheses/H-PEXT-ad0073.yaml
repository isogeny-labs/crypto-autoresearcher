    direction: equals
    minimum_effect: the generic (3.1) + (4.2) predictor
    source: derivation.md (4.2), generic in S; secondary
  - id: P5
    metric: observed signs chi_K(alpha_i - alpha_j) versus the (4.2) bit expressions
    direction: equals
