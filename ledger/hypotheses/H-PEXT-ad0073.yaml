  distinguishable_outcomes:
  - 'O-SUPPORT (support_scoped): instrument controls pass; P1, P2, P3, P4, P5, P6 have zero contradictions on the decisive cells; the off-family control discriminates. Reported as zero contradictions of an unreviewed candidate on the tested cells; no theorem, novelty or class-share claim.'
  - 'O-REFUTE (refute in scope): on a valid analysis, any decisive unit with |E(K)[4]| different from the prediction, or a sign mismatch, or a wrong (m, r, genus). The unit (q, n, S, orbit, t, bits) is the counterexample certificate; the derivation (or the identification of the family) is wrong at that step.'
  - 'O-PARTIAL (inconclusive): valid, no contradiction, but the off-family control does not discriminate, the (t, p) coverage is below 20 units per cell, or a required decisive arm is absent.'
  - 'O-INVALID (not evidence): any instrument counter nonzero (M1 != M2, #C(K) != #E(K), Hasse, chi_K != chi_q o N, E[2] != 4), a failed positive control, an A/A byte difference, or an orbit-count mismatch.'
  - 'not evidence: a timeout, memory kill or crash is failed_infrastructure (AGENTS.md rule 5).'
  falsification_conditions:
  - A unit at q = 3 mod 4 (n = 5, S = (0,1,2,3)) with |E(K)[4]| different from 8 refutes the Kummer bookkeeping (IDEA falsification 1, unadjusted).
  - A unit at q = 1 mod 4 off the table (5.1) refutes the u-flip / table. The pair rule alone cannot refute: it is generic (IDEA falsification 2 amended by the design-lane algebra, recorded above).
  - '|E(K)[4]| = 16 at q = 3 mod 4 is impossible by (3.1) and would indicate an enumeration error (invalid, not null), as in the IDEA.'
  - A unit of the n = 7 panels off (7.2) or the generic predictor refutes the n = 7 analogue.
  confounders:
  - Characteristic 3 at q = 3, 9, 27 (in-sample q = 3 is control only; q = 9, 27 are out-of-sample in characteristic 3; the other q are not).
  - j = 0 and 1728 are counted as units like any other (the full 2-torsion forces exactly the twist pair); special-j counts and distinct-class collisions are reported, not pooled away.
  - Multiple x-orbits can give the same K-isomorphism class (and Galois shifts give conjugate curves); the unit is the configuration, so class-level shares are not claimed.
  interpretation_limits:
  - Bounded q and n; no cost, no transfer claim, no claim about omitted q.
  - Zero contradictions would support the candidate on the tested cells only; the derivation stays unreviewed (obligations 1, 3 and 5 of the intake are not discharged).
  - For q >= 5 the identification of the explicit family with "the genus-5 curves of the GHS census" rests on the sibling lemma and the computed (m, r) = (4, 5); it is positively controlled at q = 3 only.
  - Novelty unverified (KN-LIT-bf1772 abstract only).
