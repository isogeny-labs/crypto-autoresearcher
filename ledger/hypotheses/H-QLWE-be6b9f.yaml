  statement: >-
    Luo Part III (KN-LIT-1742) claims the CVP distance from the log-embedding of a random
    short ring element to the log-unit lattice of Q(zeta_{2^k}) converges to a stated multiple
    of sqrt(n), and that the target lies inside the Voronoi cell of the origin for k >= 4,
    so Babai returns zero. Measured at k = 4..7 (n = 8..64) with exact unit lattices, the
    fraction of targets inside the origin's Voronoi cell is either >= 0.95 (claim reproduced
    at these sizes) or < 0.5 (claim fails as written), and this reading is the input Part
    IV's tower step relies on.
  mechanism: >-
    Part IV (KN-LIT-1743) builds on Parts I-III. If the Part III geometry is false at small
    conductors where it is asserted (k >= 4), the Part IV chain loses its premise before any
    quantum step. The log-unit lattice of 2-power cyclotomics has an explicit cyclotomic-unit
    basis of finite index (h+ = 1 known for small k), so exact CVP at rank n/2-1 <= 31 is
    feasible by enumeration.
