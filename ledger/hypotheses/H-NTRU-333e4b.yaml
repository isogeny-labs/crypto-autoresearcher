# HYPOTHESIS -- H-NTRU-333e4b, specified from IDEA-20261018-3eae51. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-NTRU-333e4b
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  derived_from_idea: IDEA-20261018-3eae51
  added: '2026-10-18'
  statement: >-
    On Z[x]/(x^p - x - 1) with fixed-weight ternary secrets and q below the fatigue point,
    Howgrave-Graham's hybrid (KN-LIT-2084) with a measured optimal guess dimension r beats
    plain primal BKZ in total measured work by at least 2x for p >= 89, and r grows linearly
    in p. Once q passes the measured dense-sublattice transition, the hybrid advantage falls
    to at most 1.2x. So distance from fatigue and hybrid distance are different coordinates
    and must both be reported.
  mechanism: >-
    Below fatigue the lattice behaves like LWE; guessing a sparse ternary tail via MITM removes
    dimensions at a combinatorial cost lower than BKZ's for those dimensions. Above fatigue
    the dense sublattice makes BKZ succeed at small block size, so the reduction half becomes
    cheap and guessing no longer pays.
  assumptions:
  - Babai nearest-plane success in the hybrid follows the standard probability model
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Babai nearest-plane success in the hybrid follows the standard probability
      model
    random_model_justification: Wunderer's analysis (recalled)
    supporting_results: []
    validation_experiment_ids:
    - EXP-NTRU-73f8dd
    falsification_condition: measure Babai success per guess directly
  predictions:
  - metric: work(primal)/work(hybrid best r) below transition
    direction: higher
    minimum_effect: '>= 2 at p >= 89'
  - metric: same ratio above transition
    direction: lower
    minimum_effect: <= 1.2
  test_boundary:
    instances:
    - >-
      p in {61, 73, 89, 101, 113}; q levels {0.5x, 1x, 2x measured q*}; r in 0..30; 10 instances
      per cell
    parameters:
      scale_tier: toy
      scale_justification: p <= 113; slopes transferred with CI only
    implementation: SageMath, fpylll BKZ 2.0, C MITM table, certificate checker
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 120
      maximum_memory_gb: 32
      maximum_runs: 150
  distinguishable_outcomes:
  - <= 1.2 at all p
  - '>= 2'
  falsification_conditions:
  - hybrid never beats primal by 2x below transition
  - hybrid advantage persists above transition
  interpretation_limits:
  - >-
    Scale and transfer: p <= 113; sntrup761 is far larger, so only slopes are transferred
    with stated CI
  - no claim about any deployed instance
  status: specified
  proposed_by: idea-generator
