# HYPOTHESIS -- H-MLKEM-486519, specified from IDEA-20261018-c8180f. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-486519
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-c8180f
  added: '2026-10-18'
  statement: >-
    On Kyber-shaped primal instances (module rank 2, ring degree 32-48, q=3329, CBD(2)), the
    empirical success probability P(beta) of progressive BKZ/G6K rises over a window of width
    >= 6 block sizes from 10% to 90%, and the Postlethwaite-Virdia probabilistic simulator
    predicts the median within 2 block sizes while the 2016 estimate is biased by >= 3. If
    the window is < 3 wide, the step-function convention is empirically adequate at this scale.
  mechanism: >-
    Core-SVP prices a single block size assumed to succeed. The success event depends on the
    projected norm of the planted vector, a random variable whose spread gives a smooth P(beta).
    The expected cost under a progressive strategy is a sum over P(beta) increments, which
    can be cheaper or dearer than the step convention. PV21 model this; the measurement checks
    it on module-structured, CBD instances rather than LWE with Gaussian error.
  assumptions:
  - Success is detected exactly when the planted vector is found.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Success is detected exactly when the planted vector is found.
    random_model_justification: Verification of A*s+e=t.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-38b27d
    falsification_condition: Built in.
  predictions:
  - metric: beta(90%) - beta(10%)
    direction: higher
    minimum_effect: '>= 6'
  - metric: '|median beta* - PV21 median|'
    direction: lower
    minimum_effect: <= 2
  test_boundary:
    instances:
    - (n,k) in {(32,2),(40,2)}; q=3329; CBD(2); 200 instances each; progressive step 1
    parameters:
      scale_tier: toy
      scale_justification: lattice dim <= 161; transfer of CDF shape conditional
    implementation: G6K, fpylll, PV21 simulator code (public), lattice-estimator
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 100
      maximum_memory_gb: 16
      maximum_runs: 1600
  distinguishable_outcomes:
  - < 3
  - '> 4'
  falsification_conditions:
  - P1 window < 3
  - positive control fails to reproduce PV21 (instrument invalid)
  interpretation_limits:
  - >-
    Lattice dim <= 160; FIPS beta ~ 400-900; the shape of P(beta) is the transferable object
    as a conditional
