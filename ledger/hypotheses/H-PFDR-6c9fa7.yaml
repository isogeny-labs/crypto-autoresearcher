  statement: Bounded-PC learning with certificate-producing finite-domain theory prunes
    before whole-block enumeration and halves charged search cost.
  mechanism: A learned theory prefix can exclude blocks earlier than enumeration;
    it pays only if the explanation construction is cheaper than the enumeration it
    replaces.
  assumptions:
  - User requests factor-base/SAT research; execution is not authorized here.
  - Implicit membership is not an asserted escape from KN-OPEN-020.
  predictions:
  - metric: charged_search_cost
    direction: lower
    minimum_effect: <=0.5x strongest control
  - metric: verified_model_count
    direction: different
    minimum_effect: exact agreement
  - metric: actual_solving_degree
    direction: different
    minimum_effect: reported, not asserted lower
  test_boundary:
    instances:
    - cells named in IDEA-20261029-8d82e6 and DESIGN.md
    parameters:
      instances: 6
      replicates: 1
      tests_in_family: 3
    implementation: Not built. The design names the harness and cells; no implementation
      is claimed ready.
    budget:
      preflight_seconds: 3600
      backend: local
  falsification_conditions:
  - Pruning begins only after all but one factor-base block is fixed.
  - Theory explanation construction costs as much as the pruned enumeration.
  - Invalid certificates, omitted finite domains, or gains only on planted/SAT inputs.
  interpretation_limits:
