  relation_to_existing_records:
    H-SEMBIN-a7e721 / EXP-SEMBIN-4fa22c: >-
      That contract measures the FAKE d'_F in the Boolean ring, and by its
      S-1 it cannot refute Proposition 5. This hypothesis measures no fall
      degree as its decisive quantity. It tests Assumption 1 through Groebner
      basis containment in W_4, a solving-degree statement whose failure is a
      counterexample certificate. The two share conventions (DC-3 shifts in
      the instance, DC-4 reduced multilinear generators, the grevlex order) and
      no result.
    H-SEMBIN-ce9e29: >-
      Stage-0 labels on a single S_3 over F_8. No chain, no Groebner basis, no
      Assumption 1. Not a duplicate.
    IDEA-20261006-8f4f02: >-
      This hypothesis keeps the idea's matched pair (v = 0 EQS2 against v != 0
      EQS4), its generic-random control and its breakthrough-adjacent
      interpretation limit. It replaces the idea's first disjunct, "Def. 5
      true FFD exceeds 4", which the padding derivation shows is impossible as
      printed, with the decisive quantity that remains: whether the degree-4
      closure contains the Groebner basis.
    LEAD-ICE-descent-closure-degree-at-scale: >-
      That row measures refutation degree of unsatisfiable chained S_3 with
      one common V (EQS1/EQS2 type, Semaev parameterisation). This hypothesis
      concerns Nagao's disjoint-coset EQS4 with satisfiable planted R,
      Groebner-basis containment rather than refutation, and Nagao's fixed-k
      regime (m = 4, k = 2) as well as m = 3. Its (3, 19, 7) stretch cell is
      the shifted, satisfiable analogue of that row's C1 cell. It does not
      execute that row's next action, which is unsatisfiable draws at degree 5
      on >= 250 GB.

  proof_search_map:
    bottleneck: >-
      Whether the shift-modified chained S_3 descent keeps a degree-<= 4
      route to its Groebner basis. This is the step whose failure removes
      Theorem 1's per-decomposition cost O((nm)^{4w}).
    baseline_embedding:
      parameter_slice: >-
        m = 2, v = 0, unsatisfiable x(2E) targets at n = 19, l = 10: the
        archived instances of RUN-CERTBIN-a3fc60 (EXP-CERTBIN-060020), on which
        W_4 contains 1 and M_4 does not (400/400 and 0/400 respectively).
      reproduction_check: >-
        Fixture F-3 of EXP-SEMBIN-cb5e25 re-runs the first 10 archived
        S3-PRIMARY instances through this contract's closure path. It must
        reproduce "1 in W_4" and "1 not in M_4" on all 10 before any EQS4
        instance counts.
    observation_collision:
      observable: >-
        Per instance: the boolean "GB contained in W_4", the solving-degree
        proxy D_solve, and the dims-by-degree series of W_D.
      distinct_preimage_search: >-
        The same "not contained" reading could come from a builder bug (wrong
        descent or shift), a closure bug (missed mutant products, early
        fixpoint), an unknown extra solution (multi-point Z), or a bounded
        budget. Each has a separating check: the descent is evaluated against
        field-side S_3 at random points; the PC-TRI control, the A/A
        re-encoding and the engine/reference oracle; Z is enumerated
        algebraically and brute-forced where N <= 20; censoring is never a
        reading. A search for existing GB-containment or solving-degree
        measurements on coset-shifted EQS4 is required before the first run
        (EXP-SEMBIN-cb5e25 proof_search_map).
    constructive_transforms: []
    quantifier_order: >-
      Assumption 1 (operational form) is FORALL m, n, k, shifts and
      satisfiable R: GB(EQS4) is contained in W_4. A counterexample is EXISTS
      one instance, which refutes the universal statement at that instance.
      The opposite outcome is FORALL tested instances in the frozen grid. It
      bounds nothing beyond the sampled cells and the sampling rule, and in
      particular not n >= 20 or m >= 5.
    method_ceiling:
      strongest_certifiable_claim: >-
        Instance-level: no degree-<= 4 linear-algebra Groebner computation
        (F4 under any selection strategy, XL, MutantXL) produces the Groebner
        basis of that EQS4 instance. Or, on the other side, such a computation
        exists at every tested instance. Nothing about algorithms that leave
        the linear-algebra closure model (SAT, exhaustive search,
        hybrid guessing), about cost, or about any deployed curve.
      nearby_object_control: >-
        The matched EQS2 arm (same curve and V, v = 0); NULL-SHUF (the
        instance's own monomial multiset shuffled across equations); NULL-PROF
        (profile-matched random planted system).
    proof_obligations:
      - claim: DER-1, Boolean W_D equals full-ring W_D with S_fe inside, intersected with multilinear polynomials, for D >= 2
        responsibility: correctness
      - claim: DER-2, every degree-<= D F4-type run lies in W_D
        responsibility: interface
      - claim: DER-3, GB containment is equivalent to (I cap B_{<=D} = W_D and d_GB <= D), which reduces to N linear forms when |Z| = 1
        responsibility: correctness
      - claim: DER-6, PC-TRI is provably contained in W_3
        responsibility: baseline
      - claim: the solution set Z is complete, by algebraic enumeration cross-checked by brute force where N <= 20
        responsibility: correctness
      - claim: an independent checker accepts each non-containment certificate
        responsibility: correctness
      - claim: the scope statement names cells, sampling rule, closure and budget
        responsibility: scope
    not_applicable_reason: >-
      constructive_transforms is empty because this is a counterexample
      search on a fixed published construction and proposes no new object.

