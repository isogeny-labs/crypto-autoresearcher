  test_boundary:
    instances:
      - >-
        m = 3, k = floor(n/3), n = 3..17 (N = n + 3k from 6 to 32), 5 seeds
        per cell
      - m = 4, k = 2 (Nagao's fixed-k regime), n = 8, 9, 10 (N = 24, 26, 28), 5 seeds per cell
      - stretch (m, n, k) = (3, 19, 7), N = 40, 5 EQS4 seeds, budget permitting
    parameters:
      characteristic: 2
      closure: W_D Boolean mutant closure, D = 2..D_max(N), D_max(N) = largest D in {4,5,6} with sum_{d<=D} C(N,d) <= 45000 (D = 4 always attempted)
      monomial_order: grevlex (degree-compatible), variables X_1 bits, ..., X_m bits, then U bits
      curves: random ordinary binary curves per (cell, seed), Koblitz B = 1 excluded
      field_basis: polynomial basis modulo the fixed lowest-weight irreducible per n
    implementation: >-
      experiments/EXP-SEMBIN-cb5e25/code/ on the shared engine
      src/crypto_autoresearcher/gf2/closure.py, cross-checked against
      src/crypto_autoresearcher/gf2/reference.py and the archived CERTBIN
      instances
    budget:
      wall_clock_seconds_total: 43200
      peak_rss_gb: 10
    outside_boundary: >-
      p >= 3; m >= 5; n >= 20 except the single stretch cell; unsatisfiable
      R; non-degree-compatible orders; any solver outside the linear-algebra
      closure model; any deployed or standardised curve; and every asymptotic
      statement.

  distinguishable_outcomes:
    - id: O-1
      reading: >-
        Counterexample: fixtures, PC-TRI and A/A valid, and >= 1 EQS4 or
        EQS4-U instance not contained in W_4 (Type-L: a linear form X_j + s_j
        missing, |Z| = 1; Type-G: |Z| > 1, d_GB <= 4, closure deficit), with a
        checker-accepted certificate. Supports the statement at those
        instances.
    - id: O-2
      reading: >-
        All contained, null discriminates: every decisive EQS4 and EQS4-U
        instance contained, and NULL-PROF not contained on >= 3 of 5
        uniqueness-verified seeds in >= 1 cell with N >= 18. Falsifies the
        statement at tested scope. This corroborates the conjunction only
        inside the grid and is breakthrough-adjacent (IDEA-20261006-8f4f02
        interpretation_limits).
    - id: O-3
      reading: >-
        All contained, null does not discriminate anywhere: inconclusive. The
        instrument never said "no" for the right reason.
    - id: O-4
      reading: >-
        Type-D only: the reduced GB of Z has degree > 4 on a multi-solution
        instance. Assumption 1 as printed fails by geometry of Z alone, with
        no closure content. Recorded as a separate claim. Neither supports nor
        falsifies the statement.
    - id: O-5
      reading: >-
        A fixture, PC-TRI or A/A check fails, the descent check fails, or Z
        enumeration disagrees with brute force: the run is invalid. Not
        evidence.
    - id: O-6
      reading: >-
        Budget or memory censoring before a cell completes: incomplete for
        that cell. A censored instance is never "not contained" (AGENTS.md
        core rule 5).

  falsification_conditions:
    - >-
      O-2: with every validity gate of EXP-SEMBIN-cb5e25 passed (fixtures
      F-1..F-6, C-PC, C-AA-ENC, the descent and Z checks), every decisive EQS4
      and EQS4-U instance has M-1 true, and C-NULL discriminates as stated in
      O-2. Scope: the cells actually completed.
    - >-
      A certificate that the independent checker rejects does not count
      toward O-1. If every candidate counterexample is rejected, the outcome
      is read from the remaining instances.

  interpretation_limits:
    - >-
      A counterexample refutes "Proposition 5 AND Assumption 1" at that
      instance only, effectively Assumption 1 there, since Proposition 5 holds
      trivially. Theorem 1 is a conditional ("under the first fall degree
      assumption", :828) and is not refuted as a conditional statement. What a
      counterexample removes is the claim that its hypothesis holds for EQS4,
      at that instance.
    - >-
      No outcome makes any statement about any deployed or standardised curve
      (sect163k1, B-163, K-233 and the like), about ECDLP security in either
      direction, or about cost. A W_4-contained instance shows that a
      degree-4 linear-algebra route exists. It measures no complexity, and no
      cost or speedup claim may be drawn without a separate claims/*.json
      under the progress-fidelity gate.
    - >-
      The all-contained outcome (O-2) corroborates the conjunction only at
      the tested cells and under the stated sampling rule. It is
      breakthrough-adjacent, is flagged as such, and requires
      review-breakthrough at max (AGENTS.md core rule 12), which is
      undegradable. If that tier cannot be served, the corroboration stays
      un-promoted and the goal records an impediment.
    - >-
      Transfer to larger n, to m >= 5, or to Nagao's asymptotic regime
      (k = C0, m ~ n/C0) is NOT assumed. A D_solve series over n is a
      confounded observation (n, k and N co-vary) and decides nothing.
    - >-
      Non-containment in W_4 rules out every degree-<= 4 linear-algebra
      computation (DER-2). Containment shows only that one exists. It does not
      show that a particular F4 implementation with a particular selection
      strategy stays inside degree 4.
    - >-
      Everything is at characteristic 2, under the equality reading of
      condition (1) for the d_F value reported, and under the ">="-reading
      derivation DER-5 for the trivial violation. Odd characteristic
      (Proposition 5's 3p + 1) is untouched.
    - >-
      A timeout, memory kill, crash or implementation failure is
      infrastructure signal and never a negative mathematical result.
