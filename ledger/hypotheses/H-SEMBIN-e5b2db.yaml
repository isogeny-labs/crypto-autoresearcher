# H-SEMBIN-e5b2db
# Counterexample search against the refutable content of Nagao ePrint
# 2015/984 Theorem 1 at p = 2: Proposition 5 AND Assumption 1, read as
# "every EQS4 instance is solved within degree 4". Tested by
# EXP-SEMBIN-cb5e25. Designed 2026-11-06 under GOAL-SEMBIN-fcb7a2.
hypothesis:
  id: H-SEMBIN-e5b2db
  question_id: RQ-SEMBIN-9e8f82
  goal_id: GOAL-SEMBIN-fcb7a2
  source_idea: IDEA-20261006-8f4f02
  experiment_ids: [EXP-SEMBIN-cb5e25]
  lead_atlas:
    primary: knowledge/leads/ecdlp/ic-engine/LEAD-ICE-first-fall-degree-assumptions.yaml
    related: knowledge/leads/ecdlp/ic-engine/LEAD-ICE-descent-closure-degree-at-scale.yaml
  added: '2026-11-06'
  status: specified
  proposed_by: coordinator

  statement: >-
    For Nagao EQS4(m, R) instances at p = 2 -- an ordinary binary curve
    E: y^2 + xy = x^3 + A x^2 + B over F_{2^n}; a k-dimensional
    polynomial-basis subspace V of F_{2^n}; pairwise-disjoint cosets
    V_i = V + v_i with every v_i outside V; the chained S_3 system of
    Definition 7 (S_3(X_1, X_2, U_1), ..., S_3(U_{m-2}, X_m, x(R))) Weil-descended
    to F_2 as in Definition 8, together with the field equations S_fe; and R
    planted as P_1 + ... + P_m with P_i drawn from Fb_i = {P : x(P) in V_i} --
    at least one instance of the frozen grid of EXP-SEMBIN-cb5e25 has a
    degree-4 mutant closure W_4(EQS4) that does NOT contain a
    degree-compatible Groebner basis of its ideal. On an instance with a unique
    F_2-solution s this means that some linear form X_j + s_j is not in W_4.
    Such an instance is a counterexample to the conjunction of Proposition 5 as
    printed and Assumption 1, that is, to the reading that every EQS4 instance
    is solved by an F4-type computation that never exceeds degree 4. The
    hypothesis is falsified, at the tested scope only, if W_4 contains the
    Groebner basis on every decisive instance while the null object shows that
    the instrument can return "not contained".

  why_this_and_not_proposition_5: >-
    Proposition 5 alone has no counterexample as printed.
    experiments/EXP-SEMBIN-cb5e25/derivations/koszul_padding_check.py (output
    .out beside it) checks that for any two quadratics f_1, f_2 over F_2 the
    multipliers g_1 = f_2 + 1 and g_2 = f_1 give max deg(g_i f_i) = 4 exactly
    and sum g_i f_i = f_1, which is nonzero of degree 2. EQS4 contains the
    field equations X_j^2 + X_j (Definition 8, paper_fulltext.md:709-713), so
    Definition 5 (:398-410) gives d_F(EQS4) <= 4 under the printed ">=" and
    under the equality reading of condition (1). This is the Koszul padding of
    KN-FIND-936151 section 3. The refutable content of Theorem 1 at p = 2 is
    therefore Assumption 1 (:416-417): every polynomial that appears in the F4
    computation has degree <= d_F. Combined with d_F <= 4, it predicts that
    every EQS4 instance is solved inside degree 4. This hypothesis tests that
    prediction.

  mechanism: >-
    The degree-D mutant closure W_D is the least GF(2)-subspace of the
    multilinear polynomials of degree <= D that contains every product t*f_i
    with deg <= D (Boolean-reduced) and is closed under g -> X_j g whenever
    deg g <= D - 1. It is exactly the set of polynomials that any degree-<= D
    linear-algebra Groebner computation can produce, whether F4 with any
    selection strategy, XL or MutantXL (derivations DER-1 and DER-2 of
    EXP-SEMBIN-cb5e25). So if W_4 does not contain the Groebner basis, every
    such computation must form a row of degree >= 5, and Assumption 1 with
    d_F <= 4 fails at that instance. The mechanism by which the program
    suspects a failure: the shifts v_i add lower-degree terms to the descended
    S_3 coordinates without changing their top forms. The chained S_3
    closure degree measured in the related lead rises at l = 7 for m = 3
    (crypto: research/dreg_closure_m4l6_20261018/RESULTS.md, as summarised in
    the lead row, which was not re-read here). Nagao's footnote 6 (:844),
    "the situation is the same as the Semaev's case", is an omitted proof and
    not an argument. The alternative mechanism is the one KN-FIND-5a8d3e and
    KN-FIND-c3a917 measured on m = 2 unshifted descents: S_3's convolution
    tensor yields degree-2 falls whose first mutant iteration fills B_{<=3}.
    If that structure survives the shift and the chaining, W_4 contains the
    linear basis everywhere at reachable scale.

  assumptions:
    - >-
      The equality reading of condition (1) of Definition 5 is the one under
      which the chain is non-trivial. Under the printed ">=" reading, d_F
      collapses to 1 + (least degree of a nonzero ideal element), which is 2 on
      every satisfiable planted instance (KN-FIND-936151 section 3). Assumption
      1 would then demand degree <= 2 in a computation whose inputs have degree
      3, and it is violated on inspection (DER-5 of EXP-SEMBIN-cb5e25). That
      reading needs no compute and is recorded as a derivation. It is not this
      hypothesis's evidence.
    - >-
      "Degree of the polynomial appears in the Groebner basis computation (by
      F4)" is read as the total degree of every row formed, including the
      monomial multiples built in symbolic preprocessing. Lemma 2's
      O(N^{d_F w}) matrix-size estimate (:423-424) needs this reading.
    - >-
      The monomial order is degree-compatible (grevlex). DER-3 makes the
      containment criterion independent of which degree-compatible order is
      used.
    - >-
      The generators are the reduced multilinear representatives of the
      descended coordinates (Definition 3 descends mod S_fe, :262; DC-4 of
      EXP-SEMBIN-4fa22c). At m >= 3 the first m - 2 links are cubic, and the
      last link S_3(U_{m-2}, X_m, x(R)) is quadratic after reduction, because
      x(R) is a constant.
    - >-
      Planted R is distributed as a sum of uniform factor-base points, not as a
      uniform R conditioned on being decomposable. The two differ by a weight
      equal to the number of decompositions. This is declared and not
      corrected.

  heuristic_assumptions:
    - id: HEUR-SEMBIN-e5b2db-1
      name: Nagao 2015/984 Assumption 1, specialised to EQS4 at p = 2
      formal_statement: >-
        For every m >= 3, n, k and pairwise-disjoint non-zero cosets V + v_i,
        and every R for which EQS4(m, R) has an F_2-solution, every polynomial
        formed in an F4 computation of a degree-compatible Groebner basis of
        the ideal generated by EQS4(m, R) has total degree <= d_F(EQS4(m, R)).
        Since d_F(EQS4) <= 4 by Koszul padding (DER-4), this implies the
        operational form: GB(EQS4(m, R)) is contained in W_4(EQS4(m, R)),
        equivalently (DER-3) I cap B_{<=4} = W_4 and the reduced GB has degree
        <= 4.
      random_model_justification: >-
        None is offered by the source. Assumption 1 is stated without
        justification (:412-417) and is attributed to [12], [11], [14]
        (recalled pointers only, not read here). As stated for an arbitrary
        system {f_1..f_M} together with Definition 5 as printed, it is false
        for generic systems, because d_F <= 4 for every system that contains
        two quadratics while the solving degree of random Boolean systems grows
        with N. The NULL-PROF arm of EXP-SEMBIN-cb5e25 exhibits this at modest
        N. All the content the assumption could have is EQS4-specific
        structure.
      supporting_results:
        - >-
          KN-FIND-5a8d3e and KN-FIND-c3a917 (internal): on m = 2 unshifted S_3
          descents at n = 17 and 19, W_4 refutes every unsatisfiable instance
          at its first iteration while plain M_4 often does not. These are
          neighbouring evidence that S_3 descents sit far below the
          semi-regular model. They are not evidence about EQS4: m = 2, no
          shifts, unsatisfiable targets.
        - >-
          LEAD-ICE-descent-closure-degree-at-scale (internal row summarising
          crypto-repo results not re-read here): chained S_3 refutation degree
          3-4 through (m, l) = (4, 6) at N = 54, rising at l = 7 for m = 3.
          Unsatisfiable draws, common V, no shifts.
      validation_experiment_ids: [EXP-SEMBIN-cb5e25]
      falsification_condition: >-
        A single EQS4 instance whose W_4 does not contain the Groebner basis,
        certified by a non-containment certificate (an annihilator family
        Lambda of a closed superspace of W_4 with Lambda(g) != 0 for a basis
        element g that vanishes on the enumerated solution set). An independent
        checker must accept it. Timeouts, memory kills and crashes are never
        this condition.

