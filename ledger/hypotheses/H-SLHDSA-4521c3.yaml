# HYPOTHESIS -- H-SLHDSA-4521c3, specified from IDEA-20261018-be7ba5. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-SLHDSA-4521c3
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  derived_from_idea: IDEA-20261018-be7ba5
  added: '2026-10-18'
  statement: >-
    Quantum generic attacks against SLH-DSA roles have very different per-call oracle costs
    because inputs differ in length: F is one compression call while T_len on a WOTS public
    key absorbs len*n bytes (35-67 chains). Counting T-gates, T-depth and qubits of reversible
    SHA-256 compression and Keccak-f[1600] circuits built at reduced rounds and extrapolated
    per round, the oracle cost for T_len exceeds that of F by at least 5 bits at every FIPS
    205 set, which raises the quantum cost of attacks on WOTS public-key compression by the
    same amount relative to a uniform-oracle convention.
  mechanism: >-
    Grover cost is iterations times oracle cost, and published SLH-DSA quantum numbers often
    use one oracle cost for all roles. The number of compression or permutation calls per
    role is fixed by FIPS 205 input lengths; reversible circuit cost per call is measurable
    by building the circuit and counting gates. This turns a convention into a measured per-role
    constant.
  assumptions:
  - Per-round cost is linear in rounds
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Per-round cost is linear in rounds
    random_model_justification: rounds are structurally identical
    supporting_results: []
    validation_experiment_ids:
    - EXP-SLHDSA-699191
    falsification_condition: fit check P2
  predictions:
  - metric: log2 oracle cost T_len minus F, SHA2 instantiation, cat 1
    direction: higher
    minimum_effect: '>= 5 bits'
  - metric: linearity of per-round T-count
    direction: different
    minimum_effect: R^2 >= 0.999
  test_boundary:
    instances:
    - rounds 1..4 per primitive; roles F, H, T_len, H_msg, PRF for 12 FIPS 205 sets
    parameters:
      scale_tier: medium
      scale_justification: 'rounds reduced; transfer: linear in rounds'
    implementation: >-
      Qiskit (or Azure Quantum resource estimator offline equivalent) with hand-built reversible
      SHA-256 and Keccak rounds; Python
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 2
      maximum_memory_gb: 8
      maximum_runs: 16
  distinguishable_outcomes:
  - under 5 bits
  - R^2 below 0.99 (extrapolation unjustified)
  falsification_conditions:
  - T_len minus F under 5 bits
  - non-linear per-round scaling
  interpretation_limits:
  - >-
    Toy tier: reduced n (hash output truncated to 12-32 bits) and reduced w, h, d, k, a; no
    statement transfers to a FIPS 205 parameter set without the stated transfer assumption
    and a separate crypto-tier certificate. Full-round costs are extrapolated, not built.
  - Gate counts are a cost model, not an attack.
  status: specified
  proposed_by: idea-generator
