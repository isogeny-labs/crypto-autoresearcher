# HYPOTHESIS -- H-FNDSA-8d0b9d, specified from IDEA-20261018-ad2429. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-FNDSA-8d0b9d
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  derived_from_idea: IDEA-20261018-ad2429
  added: '2026-10-18'
  statement: >-
    Signing restarts when ||(s1, s2)||^2 exceeds the bound or (RECALLED, padded format) when
    compressed s2 overflows its fixed slot. Under the ideal law both events are functions
    of a key-independent distribution, so accepted signatures stay key-independent. Claim
    A: with an exact sampler, per-key restart rates over 200 keys are homogeneous (chi-square
    p > 0.01). Claim B: under a planted defect whose width error depends on the key, the restart
    rate becomes key-dependent (p < 1e-3) and the accepted law's divergence from ideal differs
    from the unconditioned law's by a factor kappa with |log kappa| >= 0.1. Distinct from
    the encoding-nullspace audit: the object is the selection induced by restarts.
  mechanism: >-
    Rejection on a public function conditions the output law. If the pre-rejection law is
    key-independent, conditioning cannot create key dependence. If it is defective in a key-dependent
    way, rejection reweights the defect: tail-heavy defects are partly removed (kappa < 1),
    others can be concentrated. Restart counts are an extra observable for anyone timing signing,
    so key-dependent rates are a leak independent of signature values.
  assumptions:
  - Restart probability is small enough that conditioning is a perturbation
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Restart probability is small enough that conditioning is a perturbation
    random_model_justification: standard tail bounds on chi-square norms
    supporting_results: []
    validation_experiment_ids:
