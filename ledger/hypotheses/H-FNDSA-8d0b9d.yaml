    falsification_condition: measure restart rate directly
  predictions:
  - metric: homogeneity p-value of r_k, exact sampler
    direction: higher
    minimum_effect: p > 0.01
  - metric: '|log kappa| under planted defect'
    direction: higher
    minimum_effect: '>= 0.1'
  test_boundary:
    instances:
    - >-
      n = 512: 200 keys x 10^5 signatures; n = 64 toy: 20 keys, exact KL; planted defect size
      1e-2 relative width
    parameters:
      scale_tier: medium
      scale_justification: rates at n = 512 on self-generated keys; kappa at toy n = 64
    implementation: C reference signer instrumented for restart counting; Python exact KL
      at toy n
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 8
      maximum_memory_gb: 4
      maximum_runs: 12
  distinguishable_outcomes:
  - p < 1e-3 with an exact sampler
  - '|log kappa| < 0.02'
