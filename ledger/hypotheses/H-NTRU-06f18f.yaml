hypothesis:
  id: H-NTRU-06f18f
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  derived_from_idea: IDEA-20261018-d23aba
  added: '2026-10-18'
  statement: >-
    Multiplication by x in Z[x]/(x^p - x - 1) sends the top coefficient to two positions,
    so ||x^i f|| grows with i instead of staying constant as in x^n + 1. Claim: the rotation
    orbit's covolume exceeds the anticyclic orbit's at matched secret norm by a measurable
    factor, a best-window choice of k consecutive rotations gives the densest rank-k sublattice,
    and the predicted transition shift from covolume ratio matches the measured shift within
    50% with correct sign. Distinct from IDEA-20260809-263751 (black-box comparison) and IDEA-20260816-6e6f2e
    (correlation factor with constant diagonal), which assume or ignore the diagonal: here
    the diagonal itself is the mechanism.
  mechanism: >-
    Each wrap adds a coefficient, so norms grow roughly as sqrt(1 + i/p)-type factors over
    a full orbit (to be measured). Larger diagonal in the Gram matrix means larger covolume,
    a less dense sublattice and a higher q*. The densest sublattice may be a window of low-growth
    rotations of rank below p.
  assumptions:
  - Transition shift is linear in log covolume per dimension
