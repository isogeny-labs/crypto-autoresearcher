    loosened verifier) is flagged on all classes. Either outcome is decidable.
  mechanism: >-
    Byte-level verifier semantics are where conformance bugs live; an accept fibre counted
    in one spec is not the same as agreement across implementations. A differential oracle
    with targeted boundary mutations finds disagreements cheaply, and a planted off-by-one
    verifier calibrates the harness's detection power.
