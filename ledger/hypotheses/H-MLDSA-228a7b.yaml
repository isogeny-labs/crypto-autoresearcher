  statement: >-
    Mutating valid ML-DSA signatures at the predicate boundaries (||z||_inf exactly gamma1
    - beta, hint index lists non-increasing or with nonzero padding, omega-th hint slot, trailing
    bytes, c_tilde length) and running them through PQClean, liboqs, BoringSSL/AWS-LC, RustCrypto
