# HYPOTHESIS -- H-SLHDSA-e1b7f8, specified from IDEA-20261018-cfa824. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-SLHDSA-e1b7f8
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  derived_from_idea: IDEA-20261018-cfa824
  added: '2026-10-18'
  statement: >-
    A classical multi-target preimage search against F-chain values exposed by U users gains
    a factor equal to the number of targets in one tweak domain. With distinct PK.seed per
    user the gain is capped at the per-user exposure t, and with a shared (planted) PK.seed
    it rises to U*t; measured at n in {24,28,32} bits, U in {1,16,256}, the distinct-seed
    arm shows no cross-user gain (slope of log cost vs log U within 0.1 of 0) while the shared-seed
    arm shows slope -1 within 0.1.
  mechanism: >-
    Tweakable hashes keyed by PK.seed put each user in a separate function family, so a single
    evaluation tests membership against one user's targets only. Multi-user security of SLH-DSA
    thus rests on PK.seed uniqueness. The experiment measures this directly so that cost tables
    can use per-user t rather than global t, with an explicit check of the failure mode (seed
    reuse).
  assumptions:
  - Truncated SHAKE256 keyed by PK.seed behaves as independent random functions across seeds
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Truncated SHAKE256 keyed by PK.seed behaves as independent random functions
      across seeds
    random_model_justification: random-oracle model
    supporting_results: []
    validation_experiment_ids:
    - EXP-SLHDSA-8f310d
    falsification_condition: slope test is itself the validation
  predictions:
  - metric: slope of log2 cost vs log2 U, distinct seeds
    direction: different
    minimum_effect: '|slope| <= 0.1'
  - metric: slope, shared seed
    direction: lower
    minimum_effect: slope within 0.1 of -1
  test_boundary:
    instances:
    - n in {24,28,32} bits; U in {1,16,256}; t=64 per user; 200 trials per cell
    parameters:
      scale_tier: toy
      scale_justification: 'n reduced to 24-32; transfer assumption: slope independent of
        n'
    implementation: C or Python+NumPy with hashlib SHAKE256 truncated; hash set of targets
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 12
      maximum_memory_gb: 8
      maximum_runs: 18
  distinguishable_outcomes:
  - '|slope| > 0.2'
  - slope above -0.8
  falsification_conditions:
  - distinct-seed slope significantly negative
  - positive arm slope not near -1
  interpretation_limits:
  - >-
    Toy tier: reduced n (hash output truncated to 12-32 bits) and reduced w, h, d, k, a; no
    statement transfers to a FIPS 205 parameter set without the stated transfer assumption
    and a separate crypto-tier certificate.
  - Generic attack only; quantum analogue handled by the cost table idea.
  status: specified
  proposed_by: idea-generator
