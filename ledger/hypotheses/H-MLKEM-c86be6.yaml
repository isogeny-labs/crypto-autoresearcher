# HYPOTHESIS -- H-MLKEM-c86be6, specified from IDEA-20261018-d449ce. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-c86be6
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-d449ce
  added: '2026-10-18'
  statement: >-
    On q-ary lattices shaped like scaled-down ML-KEM (q=3329, CBD eta=2) and ML-DSA key recovery
    (q=8380417, eta=2) at dims 80-160, the measured log Gram-Schmidt profile after BKZ-beta
    (beta 20..50) deviates from the CN11 simulator by a signed residual whose head region
    (q-vector plateau) differs between the two shapes by at least 0.5 bits in log||b_i*||,
    while the sharp simulator (KN-LIT-4429) cuts the mean absolute residual by at least 30%
    on both.
  mechanism: >-
    Both schemes' estimates pass through the same simulator, but ML-DSA's large q keeps a
    long unreduced q-vector plateau that ML-KEM lacks at matched beta. A residual model fitted
    per shape tells whether one calibration can serve both. f7c912 calibrates only delta(beta)
    on ML-KEM shape; this tracks the full profile and the shape-dependent head.
  assumptions:
  - Simulators take the same initial profile as measured
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Simulators take the same initial profile as measured
    random_model_justification: By construction
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-35b326
    falsification_condition: Assert equality before simulation
  predictions:
  - metric: head_residual_shape_gap
    direction: higher
    minimum_effect: '>= 0.5 bits'
  - metric: sharp_vs_cn11_mae_reduction
    direction: higher
    minimum_effect: '>= 30%'
  test_boundary:
    instances:
    - >-
      dims {80,120,160}; beta {20,30,40,50}; 10 instances; shapes kem (q=3329, k=2 module
      d=dim/2) and dsa (q=8380417)
    parameters:
      scale_tier: medium
      scale_justification: dims <= 160; transfer by residual stability in beta
    implementation: fpylll, BKZ simulators (fpylll.tools.bkz_simulator and sharp re-implementation),
      NumPy
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 40
      maximum_memory_gb: 16
      maximum_runs: 48
  distinguishable_outcomes:
  - < 0.2 bits
  - < 10%
  falsification_conditions:
  - Head gap < 0.2 bits
  - Sharp simulator not better than CN11
  interpretation_limits:
  - >-
    Scale limit: dims <= 160 and beta <= 50; transfer assumes residual shape is stable in
    beta; no FIPS 203/204 statement
  - Calibration instrument, not a security estimate
  status: specified
  proposed_by: idea-generator
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open goal
