hypothesis:
  id: H-MLKEM-ff2ed1
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-42433b
  added: '2026-10-18'
  statement: >-
    Quantum enumeration cost estimates (KN-LIT-3072) take classical tree size T from a GSA-based
    formula. On BKZ-reduced projected blocks (block dim 40-64) of ML-KEM- and ML-DSA-shaped
    lattices, the measured log2 T exceeds the GSA prediction by at least 1.5 bits at block
    dim 64, because the measured profile's tail deviates from GSA, and the deviation propagates
    to the sqrt(T) quantum cost as at least 0.75 bits.
  mechanism: >-
    Enumeration cost is exponentially sensitive to the profile; GSA is known to be wrong at
    the tail. Measuring T exactly and comparing with prediction from the GSA versus measured
    profile isolates the profile error. 70e41d measures classical crossover vs memory price;
    this measures the quantum enumeration input.
  assumptions:
  - Quantum cost scales as sqrt(T)
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
