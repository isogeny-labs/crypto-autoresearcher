    falsification_condition: Add a Gilbert-Elliott bursty arm as sensitivity.
  predictions:
  - metric: queries per true failure at epsilon=1e-2, p=2^-14
    direction: higher
    minimum_effect: '>= 100x the epsilon=0 cost'
  - metric: simulated/bound ratio
    direction: different
    minimum_effect: within [0.5, 2]
  test_boundary:
    instances:
    - >-
      n=64, k=2, q=3329, eta=3, d_v=3; p ~ 2^-14; epsilon in {0,1e-4,1e-3,1e-2}; 50 true failures
      per run; 5 keys
    parameters:
      scale_tier: toy
      scale_justification: the multiplier depends only on epsilon/p and delta; reduced params
        set p
    implementation: Python + C reference ML-KEM (parameterized)
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 10
      maximum_memory_gb: 4
