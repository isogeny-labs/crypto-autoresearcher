# HYPOTHESIS -- H-MLKEM-db49d8, specified from IDEA-20261018-4940b7. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-db49d8
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  derived_from_idea: IDEA-20261018-4940b7
  added: '2026-10-18'
  statement: >-
    Under FIPS 203 implicit rejection, a decryption failure is visible to a remote attacker
    only as a protocol-level key mismatch, which is confounded by benign errors at rate epsilon.
    When epsilon exceeds the per-query failure probability p, the number of queries to collect
    F true failures grows by a factor at least (1 + epsilon/p) times the repetitions needed
    to confirm each candidate. Simulation at elevated-DFR parameters with epsilon in {0, 1e-4,
    1e-3, 1e-2} matches the bound within a factor 2. Defensive: it prices the oracle realism
    that 7c1ae4's conjunction leaves unpriced.
  mechanism: >-
    Decapsulation is deterministic, so a candidate failure can be retested; benign errors
    are independent across retries. Confirmation then requires about log(1/delta)/log(1/epsilon)
    retries per alarm, and alarms arrive at rate p + epsilon. The binary asymmetric channel
    with crossover epsilon has capacity that bounds the information per query about the failure
    set. Comparing simulated query counts with the bound checks whether the confirmation strategy
    is near-optimal.
  assumptions:
  - Benign errors are i.i.d. per query.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
