    falsification_condition: measure feasible-set volume decay per inequality vs independent
      model
  predictions:
  - metric: ratio N_ILWE / N_ineq
    direction: higher
    minimum_effect: '>= 30 at toyDSA(64,2,2) gamma1 = 2^12'
  - metric: N_ineq scaling with n*l
    direction: different
    minimum_effect: N_ineq grows at most linearly in n*l over n in {32, 64, 96}
  - metric: accepted-only stream
    direction: different
    minimum_effect: zero recoveries from 10^6 accepted signatures (rejection hides s1)
  test_boundary:
    instances:
    - >-
      toyDSA(n,2,2) n in {32,64,96}, gamma1 = 2^12, eta = 2, tau = 16; up to 2^22 rejected
      attempts per key; 5 keys per seed block
    parameters:
      scale_tier: toy
      scale_justification: n <= 96, gamma1 = 2^12; transfer by the stated per-attempt information
