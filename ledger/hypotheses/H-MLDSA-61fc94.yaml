# HYPOTHESIS -- H-MLDSA-61fc94, specified from IDEA-20261018-f27cb2. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-61fc94
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  derived_from_idea: IDEA-20261018-f27cb2
  added: '2026-10-18'
  statement: >-
    If an implementation exposes rejected attempts (z_rej, c_rej) (debug logs, a retry API,
    or an unprotected loop), each coordinate with |z_j| >= gamma1 - beta gives an inequality
    on (c s1)_j with threshold uniform in [-beta, beta]. An inequality-constrained solver
    (linear programming plus BKZ finish) recovers s1 at toyDSA(64,2,2) from at least 30 times
    fewer rejected attempts than least-squares ILWE regression on the same leaked z, whose
    requirement is about 16 gamma1^2 / (3 tau).
  mechanism: >-
    A rejected z is y + c s1 with uniform y and no truncation, so its mean carries s1 only
    with noise variance gamma1^2/3, which is ILWE with huge noise. But z_j lies in [-gamma1
    + 1 + u_j, gamma1 + u_j], so coordinates near the edge pin u_j = (c s1)_j from one side
    with resolution about gamma1 - |z_j|; extreme values give inequalities of width O(beta),
    roughly 2^10 times tighter information per useful coordinate than the mean. Accumulating
    thousands of such half-space constraints over the s1 box shrinks the feasible set to one
    point; the inequality-hint integration of LWE side-information work then finishes.
  assumptions:
  - edge inequalities are approximately independent half-spaces
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
