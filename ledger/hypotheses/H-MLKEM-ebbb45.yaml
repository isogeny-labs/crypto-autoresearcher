# HYPOTHESIS -- H-MLKEM-ebbb45, specified from IDEA-20261018-da2ffa. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-ebbb45
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  derived_from_idea: IDEA-20261018-da2ffa
  added: '2026-10-18'
  statement: >-
    For a known (m, ciphertext) pair, v - Decompress(m) = s^T u + noise, so each ciphertext
    yields n extra MLWE-like samples on s with noise std around 40 (from e^T r, s^T e1, e2
    and d_v rounding) against sigma ~1 for the public key. Adding up to 16 such ciphertexts
    to the primal embedding lowers measured beta* by < 1 at n=64, k=2. A drop >= 3 would falsify
    the claim and reveal an unpriced known-plaintext flank.
  mechanism: >-
    A primal attack benefits from extra samples only if their noise-to-modulus ratio is comparable
    to existing samples. Ciphertext-derived samples have noise roughly 40x larger, so their
    rows add volume nearly as fast as they add constraint; the optimal embedding should ignore
    them. This is a falsifiable sanity bound that every key-recovery-from-traffic claim should
    cite.
  assumptions:
  - Derived-sample noise is roughly Gaussian.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Derived-sample noise is roughly Gaussian.
    random_model_justification: CLT.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-6dd4e2
    falsification_condition: Measure empirically (P2).
  predictions:
  - metric: beta*(0) - beta*(16)
    direction: lower
    minimum_effect: < 1 unit
  - metric: measured derived-sample noise std / predicted
    direction: different
    minimum_effect: within [0.8,1.25]
  test_boundary:
    instances:
    - n=64, k=2, q=3329, CBD(2), d_u=10, d_v=4; ciphertext count in {0,1,4,16}; 20 keys
    parameters:
      scale_tier: toy
      scale_justification: >-
        reduced ML-KEM shape: ring Z_3329[X]/(X^n+1) with n in {32,64}, module rank k=2, CBD(eta)
        secrets/errors; transfer assumption: the measured ratio (not the absolute cost) carries
        to n=256 when the governing statistic scales as stated; no FIPS 203 claim is made
    implementation: SageMath, G6K/fpylll, reference ML-KEM (parameterized)
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 30
      maximum_memory_gb: 16
      maximum_runs: 240
  distinguishable_outcomes:
  - '>= 3 units'
  - outside [0.6,1.6]
  falsification_conditions:
  - P1 drop >= 3
  - positive control shows no drop (pipeline invalid)
  interpretation_limits:
  - >-
    Reduced n; the ratio of noise stds is the transferable object; FIPS d_v=4/5 noise is larger
    still at n=256
  status: specified
  proposed_by: idea-generator
