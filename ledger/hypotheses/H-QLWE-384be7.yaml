# HYPOTHESIS -- H-QLWE-384be7, specified from IDEA-20261018-be26e5. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-QLWE-384be7
  question_id: RQ-QLWE-1c4a3b
  goal_id: GOAL-QLWE-291164
  derived_from_idea: IDEA-20261018-be26e5
  added: '2026-10-18'
  statement: >-
    In Simon's DCP erasure step (KN-LIT-e204ab), the amplitude gap between h*=0 and h*=1 is
    a signed sum over z* of count differences times C_{z*}. At reduced bit-length n in {6,8,10}
    and reduced group exponent c in {1,2,3}, the cancellation ratio R = |sum_z C_z| / sum_z
    |C_z| is at most 0.1 on average over secrets, so the bound in Lemma 3 that treats C as
    well-behaved fails at these sizes, and the measured bias of h* toward d_n is below 0.05.
  mechanism: >-
    KN-LIT-e204ab names the signed-C cancellation as the entire game and KN-LIT-3b271a reports
    a no-go for the algorithm. Both are text-level. The quantity is classically computable
    at small n: the B-side contributions C depend only on the low bits of z* and are explicit
    sums of roots of unity over measured y values, so one can enumerate them exactly. A measured
    R near 1 would support Lemma 3's intent; R near 0 with negligible bias would corroborate
    the no-go numerically and pin which step fails.
  assumptions:
  - Reduced c preserves the qualitative sign structure of C
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Reduced c preserves the qualitative sign structure of C
    random_model_justification: None; C depends on c only through group size
    supporting_results: []
    validation_experiment_ids:
    - EXP-QLWE-709141
    falsification_condition: Report R as a function of c and check monotone trend before reading
      n=10
  predictions:
  - metric: mean_cancellation_ratio_R
    direction: lower
    minimum_effect: mean R <= 0.1 at n=10
  - metric: bias_h_star
    direction: lower
    minimum_effect: '|Pr[h*=d_n] - 1/2| <= 0.05 at n=10'
  test_boundary:
    instances:
    - >-
      n in {6,8,10}; c in {1,2,3}; groups a = ceil(n/log2 n); 200 random secrets per cell;
      faulty-sample rate 0
    parameters:
      scale_tier: toy
      scale_justification: 'n<=10 bits, c<=3; transfer assumption: sign structure of C is
        not reversed by larger c'
    implementation: Python/NumPy exact enumeration; optional Qiskit statevector cross-check
      at n=6
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 6
      maximum_memory_gb: 16
      maximum_runs: 27
  distinguishable_outcomes:
  - mean R >= 0.5 at n=10
  - bias >= 0.15 at n=10 with groups chosen as written
  falsification_conditions:
  - Bias >= 0.15 at n=10 with R >= 0.5 (supports Lemma 3 at toy size)
  - Positive control fails to reach Pr >= 0.9 (instrument broken)
  interpretation_limits:
  - >-
    Scale limit: c and n are far below the draft's c >= 12; a toy failure shows the argument
    does not hold at small parameters, not that it fails asymptotically
  - A verdict on a named step of a document, never on LWE hardness or any scheme
  status: specified
  proposed_by: idea-generator
