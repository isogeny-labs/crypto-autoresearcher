# HYPOTHESIS -- H-MLKEM-23e144, specified from IDEA-20261018-ae2c35. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-23e144
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-ae2c35
  added: '2026-10-18'
  statement: >-
    Hybrid attacks pay one CVP (or BDD) per combinatorial guess, usually priced as Babai nearest-plane
    on a reduced basis. Using a sieve-preprocessed list for CVPP (Doulgerakis-Laarhoven-de
    Weger style iterative slicing), the measured per-query cost at d=50-70 for BDD targets
    at the hybrid's distance is 2^{c_q d} with c_q <= 0.1 and success >= 0.9 where Babai succeeds
    < 0.5. This changes the hybrid optimum when ported to estimator parameters by >= 3 bits.
    If c_q >= 0.2 or success does not exceed Babai's, the estimator's Babai pricing stands.
  mechanism: >-
    With a list of short lattice vectors from one sieve, iterative slicing reduces a target
    toward the Voronoi cell; amortized over many targets, the per-query cost is subexponential-ish
    in the list size and can succeed at distances where Babai fails, allowing smaller preprocessing
    beta in the hybrid. Estimators fix the BDD step as Babai; the tradeoff curve between preprocessing
    and per-query success is unmeasured at Kyber shape.
  assumptions:
  - BDD targets from hybrid guesses look like Gaussian perturbations of lattice points.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: BDD targets from hybrid guesses look like Gaussian perturbations of
      lattice points.
    random_model_justification: Hybrid analysis.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-5c0e4d
    falsification_condition: Also test with CBD-structured perturbations.
  predictions:
  - metric: slicer success at r=0.9 minus Babai success
    direction: higher
    minimum_effect: '>= 0.4'
  - metric: fitted per-query exponent c_q
    direction: lower
    minimum_effect: <= 0.1
  test_boundary:
    instances:
    - d in {50,55,60,65,70}; r in {0.3,0.5,0.7,0.9}; 10^4 targets per cell; 3 lattices per
      d
    parameters:
      scale_tier: toy
      scale_justification: d <= 70; transfer conditional on c_q fit
    implementation: G6K for lists, C++ slicer, fpylll Babai, Python
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 40
      maximum_memory_gb: 32
      maximum_runs: 150
  distinguishable_outcomes:
  - < 0.1
  - '>= 0.2'
  falsification_conditions:
  - P1 or P2 violated
  - positive control below 0.95 (bug)
  interpretation_limits:
  - d <= 70; the hybrid re-optimization is conditional on extrapolating c_q
