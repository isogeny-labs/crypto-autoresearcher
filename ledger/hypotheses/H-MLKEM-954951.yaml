# HYPOTHESIS -- H-MLKEM-954951, specified from IDEA-20261018-fdcbd0. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-954951
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-fdcbd0
  added: '2026-10-18'
  statement: >-
    KN-LIT-122 prices quantum near-neighbour search from modelled bucket sizes. Instrumenting
    G6K's bucketed sieve at dims 50-90 on lattices shaped like ML-KEM and ML-DSA key recovery,
    the measured mean bucket size deviates from the model's prediction by at least 15% at
    some dimension, and when Grover cost is computed from measured sizes with QRAM priced
    at 0, 0.1 and 1 gate-equivalents per query, the quantum/classical cost ratio at dim 90
    differs from the model's by at least 2 bits at price 1.
  mechanism: >-
    Quantum sieve speedup lives in searching buckets with Grover; its value depends on bucket
    size distributions (Grover cost sqrt(size), but variance matters since sum of sqrt is
    not sqrt of mean) and on QRAM loads. Measured distributions replace model means, and both
    schemes share the same instrument. 472aa2 asserts QRAM inputs are hidden; this measures
    the input distribution.
  assumptions:
  - Grover per bucket costs sqrt(size) iterations
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Grover per bucket costs sqrt(size) iterations
    random_model_justification: Standard (recalled)
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-663616
    falsification_condition: Sensitivity with amplitude-amplification overhead factor pi/4
  predictions:
  - metric: bucket_size_model_deviation
    direction: higher
    minimum_effect: '>= 15% at some dim'
  - metric: priced_ratio_deviation_bits_price1
    direction: higher
    minimum_effect: '>= 2 bits at dim 90'
  test_boundary:
    instances:
    - dims {50,60,70,80,90}; 5 instances per shape; QRAM price {0,0.1,1}
    parameters:
      scale_tier: medium
      scale_justification: 'dims <= 90; transfer: deviation trend in dim'
    implementation: G6K (patched to log buckets), Python
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 60
      maximum_memory_gb: 64
      maximum_runs: 30
  distinguishable_outcomes:
  - < 5% at all dims
  - < 0.5 bits
  falsification_conditions:
  - Deviation < 5% everywhere
  - Positive control deviation > 2%
  interpretation_limits:
  - >-
    Scale limit: dims <= 90; quantum cost modelled from classical logs; no FIPS verdict; QALG
    owns ML-KEM quantum sieving verdicts, this provides an instrument only
  - Priced at 0/0.1/1 per query; order must hold across the band to rank
  status: specified
  proposed_by: idea-generator
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open goal
    serves this question. The Coordinator must open a successor goal or rebind before dispatch.
