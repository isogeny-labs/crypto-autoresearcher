    direction: higher
    minimum_effect: '1 - theta within 0.05 (known positive)'
    source: IDEA-20261018-a0830c predictions[2]
  test_boundary:
    instances:
    - 'toy curves: generate_prime_order_curve(bits, seed = block_offset + c), bits in {16, 20, 24, 28, 32}'
    - 'lines: theta in {0.30, 0.35} x d in {1 (window), 2, 3 (label GAP)}; six structured lines'
    - 'per (rung, theta, curve): one structured base per d, 20 null bases, gamma plants at 0, 1/6, 1/3, 1/2 and one Z/N interval base, all of exactly b points'
    parameters:
      delta_star_h2: 1/3
      ratio_per_8_bits_h2: 6.35
      descriptive_thresholds: 'h = 3: delta* 1/5, ratio 3.03 per 8 bits; h = 4: delta* 1/7, ratio 2.21'
      target_null_total_per_rung_cell: 2500
      bootstrap_resamples: 2000
    implementation: >-
      experiments/EXP-PFDR-2d36f9/implementation/ (not yet written; derived from experiments/EXP-PFDR-ca5e01/implementation/)
    scope_note: Toy scale only (generated curves, p of 16 to 32 bits). No attack, key, standardized curve or cost claim.
  distinguishable_outcomes:
  - 'O-SUB-BE (support_scoped): controls pass, at least 5 of 6 lines valid, every valid line SUB-BE or SUB-BE-GROWING (upper95 < 1/3).'
  - 'O-ALIVE (falsify, scoped to the surviving line): a line with lower95 > 0 and upper95 >= 1/3 that survives replication on the fresh block.'
  - 'O-MIXED (inconclusive): controls pass but some line is UNRESOLVED or an ALIVE line fails replication.'
  - 'O-INVALID (not evidence): any blocking control fails or fewer than 5 of 6 lines are valid.'
  - 'not evidence: a timeout, memory kill, kernel failure or crash is failed_infrastructure (AGENTS.md rule 5).'
  falsification_conditions:
  - 'A structured line with lower95(delta) > 0 and upper95(delta) >= 1/3 whose replication on block 6,200,000 has lower95 > 0 and upper95 >= 1/3 (O-ALIVE).'
  - 'Plant or Z/N slope not recovered within tolerance: estimator blind; no reading (IDEA falsification condition 1).'
  - 'A/A null lines exclude 0 in more than 1 of 6, or the z_cal calibration gate fails: miscalibrated; no reading (IDEA falsification condition 2, adapted to six lines).'
  confounders:
  - Fits over 16 bits mix constants and exponents; the Z/N control and the gamma plants fix the scale.
  - Hasse fluctuation of N within a rung; handled by the per-curve null mean and by using mean log2 N.
  - Cells at one rung share their curve set; cell statistics are not independent within a rung.
  interpretation_limits:
  - Toy scale; a bound over 16..32 bits says nothing about growth beyond 32 bits.
  - Only the six preregistered point-base lines; FAM-1 mitm arms (EV-PFDR-ad6274), log-GAPs and the bbc53e base are untested here.
  - h = 2 decides; h = 3 and 4 thresholds are reported descriptively only.
  - Producer-written check.py is not independent review, which precedes any status move.
