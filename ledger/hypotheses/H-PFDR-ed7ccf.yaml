  title: >-
    Break-even growth ladder at toy scale: for window (d = 1) and rank-d label-GAP (d = 2, 3) symmetric point
    bases of size b = N^theta, theta in {0.30, 0.35}, on generated prime-order E/F_p, the pair-sum coincidence
    excess kappa over a matched uniform null does not grow with N at the break-even rate delta* = 1/3 (h = 2),
    i.e. by less than 2^(8/3) = 6.35 per 8 bits, over rungs of 16, 20, 24, 28 and 32 bits
  statement: >-
    Let E/F_p be a generated prime-order ordinary curve with N = #E(F_p), and F a symmetric base (F = -F) of
    exactly b = 2*round(2^(bits*theta)/2) points. C(F) is the nontrivial pair-sum coincidence count of
    EXP-PFDR-ca5e01 (sum over s != O of binom(m_s, 2), m_s the number of unordered pairs {P, Q} in F, P != Q,
    Q != -P, P + Q = s). For a structured line (theta, d) and a rung r with bits in {16, 20, 24, 28, 32}, kappa_r
    = S_r / M_r pools the structured counts against matched null means over the rung's curves. The excess moves
    an exponent only if kappa grows as N^delta with delta >= delta*(h) = 1/(2h - 1) (IDEA-20261017-bbc53e harvest
    law); for the measured observable, h = 2 and delta* = 1/3. The hypothesis, as tested: for every valid
    structured line (theta in {0.30, 0.35}, d in {1, 2, 3}; six lines), the curve-cluster bootstrap 95% upper
    bound of delta (the least-squares slope of log2 kappa_r on the rung mean of log2 N) is below 1/3. Tested
    scope: these six lines, the five rungs, the seed blocks of EXP-PFDR-2d36f9, the exact counting convention,
    h = 2 only, generated toy curves only. Nothing about other geometries (FAM-1 mitm arms, log-GAPs, the
    bbc53e weighted base), h >= 3 harvests, p above 2^32, any cost, any standardized or deployed curve or any
    security statement.
  mechanism: >-
    (From IDEA-20261018-a0830c.) PAIR (R1 labels; Sigma = translation by base elements), Class I partial action.
    The object is one slope per line: the growth of the excess X(N) across rungs. Harvest law (IDEA-20261017-bbc53e):
    T = sqrt(2cUN/kappa) < sqrt(pi N/2) iff kappa > 1.27 c U; at U = N^(1/(2h-1)) a constant kappa is N^(-1/(2h-1))
    short, so only growth can move the exponent. A constant or slowly growing kappa (the reading of every
    N-constant lead in the IDEA's column ii) is sub-break-even by law; a slope at or above delta* is the first
    structural relation source on F_p and must then be priced end to end against matched Pollard rho.
  assumptions:
  - 'The vendored curve generator produces prime-order curves deterministically from (bits, seed) up to 32 bits
    with certified orders; seeds in the reserved blocks 6,000,000 (pilot), 6,100,000 (main), 6,200,000
    (replication) and 6,900,000 (selftest) give curves disjoint from every earlier PFDR experiment (a grep of
    experiments/EXP-PFDR-*/specification.yaml for these offsets found none on 2026-10-31).'
  - 'log2 N per rung is the mean over the rung curve set of log2 N_c, not the nominal bit size.'
  - 'No discrete logarithm, key, target or relation is computed; no claim about any curve''s security is made.'
  proof_search_map:
    bottleneck: >-
      Whether any label-structured point base carries a pair-sum excess that grows with N at or above the
      break-even rate delta* = 1/(2h - 1); every bound collected in IDEA-20261018-a0830c column ii is N-constant.
    baseline_embedding:
      parameter_slice: 'uniform symmetric null base of the same b on the same curve (kappa = 1, delta = 0 exactly)'
      reproduction_check: >-
        A/A arm: null replicate 0 read as a pseudo-structured line must give a slope whose 95% interval contains 0
        and a z_cal calibrated within the gate.
    observation_collision:
      observable: slope delta of log2 kappa on log2 N per line
      distinct_preimage_search: >-
        A constant excess (gamma = 0 plant) and a growing excess (gamma = 1/6, 1/3, 1/2 plants) of known slope are
        built on the same curves; the estimator must separate them, so a constant-excess lead cannot read as
        growth and a growing one cannot read as constant.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: per-line slope with a five-rung power-law residual check
      predicted_gain: converts the six gates of the coincidence leads into one growth criterion
    quantifier_order: >-
      FOR EACH preregistered line (theta, d) of the six, over the five fixed rungs: upper95(delta) < 1/3. No
      selection of a best line after data; no claim FOR ALL N.
    method_ceiling:
      strongest_certifiable_claim: >-
        exact coincidence counts; per-line slope with a curve-cluster bootstrap interval over 16 bits of log2 N;
        nothing asymptotic beyond the tested rungs
      nearby_object_control: >-
        Z/N interval base {+-kG : 1 <= k <= b/2} (known slope about 1 - theta) and the gamma plants (known slopes
        0, 1/6, 1/3, 1/2)
    proof_obligations:
    - claim: 'Harvest law T = sqrt(2cUN/kappa) and delta*(h) = 1/(2h - 1) (IDEA-20261017-bbc53e)'
      responsibility: scope (the law sets the threshold; this hypothesis only measures the slope)
    not_applicable_reason: null
  asymptotic_claim: null
  target_complexity:
    time_exponent: >-
      no attack claimed; a live line would move the h/(2h-1) exponent of the table-table family by -delta/2 only
      with delta >= 1/(2h-1) (IDEA-20261018-a0830c)
    memory_exponent: unchanged
    best_known: rho N^(1/2), O(1) memory
    hidden_overhead: the 1.27 c U constant and the stopping constant c are not exponents
  dominated_by: n/a (no result claimed); rho dominates any attack reading
  sota_delta: none; a growth measurement at toy scale
  novelty_status: unverified
  heuristic_assumptions:
  - id: H1
    statement: >-
      (IDEA-20261018-a0830c H1.) kappa(N) is a power law over the ladder, so the slope of log2 kappa on log2 N
      estimates delta.
    rigorous_support: >-
      IDEA-20261017-bbc53e harvest law, exact for independent rows (internal; not re-derived here).
    validation_plan: >-
      EXP-PFDR-2d36f9: per-line residuals of the five-rung fit (curvature check, descriptive) and the Z/N interval
      control, whose slope is about 1 - theta by construction.
    validation_experiment_ids:
    - EXP-PFDR-2d36f9
    falsification_condition: >-
      Z/N control slope off 1 - theta by more than 0.05, or a gamma plant slope off its design slope by more than
      0.03: the estimator is blind and no line is read (O-INVALID).
  - id: H2
    statement: >-
      (IDEA-20261018-a0830c H2.) The best of K_eff null candidates exceeds the mean by sqrt(2 ln K_eff) sd.
    rigorous_support: Gumbel limit and union bound for maxima of weakly dependent statistics (recalled).
    validation_plan: >-
      Not tested here; this hypothesis preregisters all six lines and selects none, so H2 is not load-bearing.
    validation_experiment_ids: []
    falsification_condition: n/a (not used)
  predictions:
  - id: P1
    metric: per-line slope delta of log2 kappa on log2 N (six structured lines)
    direction: same
    minimum_effect: 'upper95(delta) < 1/3 on every valid line (expected near 0; IDEA bound <= 0.02)'
    source: IDEA-20261018-a0830c predictions[0] and claim (iii)
