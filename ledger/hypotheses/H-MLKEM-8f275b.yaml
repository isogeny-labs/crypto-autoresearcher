# HYPOTHESIS -- H-MLKEM-8f275b, specified from IDEA-20261018-ff5892. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-8f275b
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-ff5892
  added: '2026-10-18'
  statement: >-
    A residual correction for the lattice-estimator's primal-uSVP success blocksize, fitted
    on scaled-down ML-KEM-shaped MLWE (q=3329, eta=2), predicts measured success blocksizes
    on scaled-down ML-DSA key-recovery MLWE (q=8380417, eta=2, rank (k,l)) with mean absolute
    error at most 2 blocksize units at dims 100-180; if the error exceeds 5, residuals are
    shape-specific and cannot be borrowed across the two schemes.
  mechanism: >-
    08eda1 measures residuals but within one shape; the two schemes share the estimator but
    differ hugely in q/sigma. A held-out shape is the right test of transfer, and is cheap
    because ML-DSA key recovery is itself MLWE.
  assumptions:
  - Residual is smooth in dimension
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Residual is smooth in dimension
    random_model_justification: None
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-da8d4a
    falsification_condition: Check with leave-one-dim-out
  predictions:
  - metric: holdout_mae_beta
    direction: lower
    minimum_effect: <= 2
  - metric: in_shape_mae_beta
    direction: lower
    minimum_effect: <= 1.5
  test_boundary:
    instances:
    - dims {100,120,140,160,180}; 20 instances per dim per shape
    parameters:
      scale_tier: medium
      scale_justification: dims <= 180
    implementation: fpylll progressive BKZ, lattice-estimator pinned commit, NumPy
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 100
      maximum_memory_gb: 32
      maximum_runs: 30
  distinguishable_outcomes:
  - '>= 5'
  - '>= 3 (fit itself poor)'
  falsification_conditions:
  - Holdout MAE >= 5
  - In-shape MAE >= 3
  interpretation_limits:
  - >-
    Scale limit: dims <= 180 (beta <= ~60); transfer to FIPS dims is an extrapolation; no
    FIPS 203/204 claim
  - Validation of an instrument's transfer, not a security number
  status: specified
  proposed_by: idea-generator
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open goal
