    direction: different
    minimum_effect: factor in [0.6, 0.8]
  - metric: tradeoff_slope_near_floor
    direction: lower
    minimum_effect: <= -2
  test_boundary:
    instances:
    - dims {60,70,80,90}; db factor {0.5,0.7,0.85,1.0,1.2}; 10 instances; shapes kem, dsa
    parameters:
