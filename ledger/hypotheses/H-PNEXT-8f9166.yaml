        - quadratic_aa
        limits:
          degree: 2
          rows: 256
          sat_candidates: 128
          pc_calls: 512
        target_selection: all_affine_x_least_positive_y
        prior_curve_identity: Exactly the previously input-selected curves, fixed here; no dynamic reselection.
        independent_complete_model_census: true
        censored_search_is_not_unsat: true
      coefficients:
        primes:
        - 17
        degrees:
