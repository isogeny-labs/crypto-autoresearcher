  falsification_conditions:
  - Any checked model mismatch, unsound clause, false certificate or missing squarefree chart refutes
    the respective finite implementation assertion. Incomplete execution is UNKNOWN.
  interpretation_limits:
  - Quadratic field equations can expand to high-degree Boolean equations; no intrinsic regularity or
    general speedup follows.
  - No compression of the full coefficient or relation domain is assumed; repeated point divisors are
    outside this squarefree relation claim.
  - Counters cover only instrumented operations, are not full CPU instruction counts, and cannot establish
    an end-to-end speed advantage.
  status: specified
  proposed_by: coordinator
