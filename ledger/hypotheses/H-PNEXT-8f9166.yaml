hypothesis:
  id: H-PNEXT-8f9166
  question_id: RQ-PFDR-ae2fba
  statement: Equivalent quadratic point encodings and symbolic coefficient pruning may expose finite useful
    structure under exact model/certificate/chart checks; operation counts remain descriptive.
  mechanism: Replace eliminated quartic constraints with an equivalent quadratic lift; prune coefficient
    prefixes by symbolic univariate gcd and certified Bezout explanations.
  assumptions:
  - Prime fields only; fixed nonsingular nonanomalous prime-order curves.
  - No scalar recovery, cryptographic-scale ECDLP attack, intrinsic degree of regularity bound or timing
    claim.
  - Reference model sets may verify but never steer search clauses, candidate order or target selection.
  - No expansion of previous matrix/backdoor sweeps without a structural change.
  - All prior data exposure disclosed; repeated fixtures are calibration, not held-out performance evidence.
  - No mixed primitive-operation total; build, search, certificate checking, reconstruction, fallback
    and oracle work remain separate.
  - One serial scientific run, declared finite inventory, no outcome-dependent retries or scaling.
  predictions:
  - metric: ENCODING
    direction: different
    minimum_effect: All 106 cells and 424 arms have complete independently reconstructed model census;
      search model sets are sound and complete exactly when search status is complete. Censored searches
      remain censored.
  - metric: COEFFICIENT
    direction: different
    minimum_effect: All six p17 cells and four arms agree on coefficient models; checked clauses preserve
      all models, and recovered chart plus charged exceptional fallback equals the independent squarefree
      point oracle.
  - metric: COUNTS
    direction: different
    minimum_effect: Retain every declared phase counter and cap status; compare only like primitive counts
      on paired cells with identical public inputs.
  test_boundary:
    instances:
    - experiments/EXP-PNEXT-624f41/config.json
