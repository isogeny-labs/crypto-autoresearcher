  falsification_conditions:
  - A checked counterexample refutes the corresponding finite correctness claim.
  - Any unsolved legal branch defeats that strong-backdoor certificate.
  - No savings in complete charged work is negative only for the tested instrument/configuration.
  interpretation_limits:
  - No scalable coefficient solver, intrinsic regularity bound, arbitrary-prime construction or index-calculus
    advantage follows.
  - Residual S3 instruments are distinct from complete prime-field PDP instances; count all explanation
    work.
  - Boolean quotient adaptation is not reproduction of the paper rank model, and block filtration is not
    the full published Multi-homogeneous XL algorithm.
  - Any UNKNOWN branch defeats a strong-backdoor certificate; no universal scaling implication.
  - Output basis degree and term counts are not degree of regularity or total F4/XL work; no complete
    performance conclusion from those alone.
