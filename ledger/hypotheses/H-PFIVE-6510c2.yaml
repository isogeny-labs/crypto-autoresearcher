hypothesis:
  id: H-PFIVE-6510c2
  question_id: RQ-PFDR-ae2fba
  statement: Five separately judged mechanisms may pass exact finite correctness gates and expose useful
    algebraic structure on the declared fixtures; no shared success or asymptotic conclusion is asserted.
  mechanism:
  - Does shared Graeffe/divisor membership exactly represent the declared chart, including a coefficient-only
    inverse search, and what losses arise on repeated or exceptional charts?
  - Can native prime-field polynomial reasoning produce checked Boolean conflict clauses before all coordinate
    blocks are assigned?
  - Does source-inspired partial-layer selection or block filtration obtain the same certificate using
    fewer matrix entries or arithmetic operations on the frozen fixtures?
  - Does an instance-only small backdoor make every legal residual branch solvable at the frozen degree/free-variable
    cap, with lower total work than equal-entropy controls?
  - Do certified saturation consequences preserve exactly the generic finite-field chart, and what happens
    after every exceptional branch is restored?
  assumptions:
  - Freeze all fixtures and algorithms before scientific trials; input-only deterministic selection rules
    are part of fixtures.
  - All results remain observations until independent review and a committed Coordinator decision.
  - Retain every mismatch, invalid row, resource-censored row and exceptional branch; no adaptive replacement.
  - Do not extrapolate finite exact witnesses to cryptographic-size prime groups or a sub-rho attack.
  - A/A reorders only a declared nuisance factor; positive controls must be detected and negative controls
    retained.
  - No clock is a primary metric; operation counts describe these implementations and count setup, selection,
    failed attempts and checking separately.
  - Performance hypotheses in the original proposals remain open when only correspondence/instrument gates
    are evaluated.
  asymptotic_claim: null
  proof_search_map:
    not_applicable_reason: Stage1 exact finite correspondence/certificate and instrument discrimination;
      no new general theorem is claimed.
  predictions:
  - metric: L1
    direction: different
    minimum_effect: Exact correspondence and p17 coefficient-search census; instrument work only.
  - metric: L2
    direction: different
    minimum_effect: Certificate-checked finite-domain solving, full oracle comparison, and bounded two-block
      residual PC comparisons.
  - metric: L3
    direction: different
    minimum_effect: Four-arm ablation plus homogeneous source-construction calibration.
  - metric: L4
    direction: different
    minimum_effect: Exhaustive certification of all assignments to each selected backdoor.
  - metric: L5
    direction: different
    minimum_effect: Complete small-field chart census, symbolic identity checks and exact GB comparisons.
