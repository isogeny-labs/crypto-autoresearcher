  statement: The cited mixing results give no n with eps(n) < 2^-15 for the non-backtracking
    walk used by Algorithm 3.
  mechanism: A transferred success lower bound must keep at least half the uniform
    bound; the budget 2^-15 is half the reciprocal of the printed NIST-I ratio 2^14.
