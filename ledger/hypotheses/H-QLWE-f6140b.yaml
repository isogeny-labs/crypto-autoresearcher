# HYPOTHESIS -- H-QLWE-f6140b, specified from IDEA-20261018-7fe944. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-QLWE-f6140b
  question_id: RQ-QLWE-1c4a3b
  goal_id: GOAL-QLWE-291164
  derived_from_idea: IDEA-20261018-7fe944
  added: '2026-10-18'
  statement: >-
    A small exact statevector simulator of a claimed quantum lattice step, run at toy modulus
    and dimension, detects the known Step-9 failure of Chen 2024 (KN-LIT-52ce4c): the simulated
    output distribution of the windowed-QFT stage deviates from the distribution the paper's
    step asserts by total variation >= 0.2 at n=2..4. The same simulator run on a corrected
    textbook step (Regev's Fourier sampling on an exact coset state) reproduces the asserted
    distribution within TV <= 0.02. Only a simulator that passes both is admitted as the instrument
    for auditing Simon 2026 or Luo 2026.
  mechanism: >-
    Step audits in this goal are otherwise prose reviews. A load-bearing quantum step usually
    asserts that some register, after a transform and a measurement, has a stated distribution;
    at toy sizes that distribution is exactly computable by dense linear algebra. A retracted
    claim with a publicly named failing step is the only available positive control: if the
    simulator cannot see a bug that is known to exist, its silence on another claim means
    nothing. A correct textbook step is the negative control showing the simulator does not
    manufacture discrepancies from discretisation.
  assumptions:
  - Chen's Step-9 bug is visible at dimension <= 4
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Chen's Step-9 bug is visible at dimension <= 4
    random_model_justification: >-
      Author's retraction note names a structural (not asymptotic) error, as recorded in KN-LIT-52ce4c
    supporting_results: []
    validation_experiment_ids:
    - EXP-QLWE-13657e
    falsification_condition: >-
      If invisible at n<=4, record instrument as blind for asymptotic-only bugs and narrow
      its admitted use
  predictions:
  - metric: tv_chen_step9
    direction: higher
    minimum_effect: TV >= 0.2 at some toy (n<=4, q<=64) configuration of Chen's stated step
  - metric: tv_textbook_regev_fourier
    direction: lower
    minimum_effect: TV <= 0.02 at all configurations
  test_boundary:
    instances:
    - >-
      n in {2,3,4}; q in {17,31,61}; window widths w in {2,4,8}; amplitude truncation 1e-12;
      3 seeds for random secrets
    parameters:
      scale_tier: toy
      scale_justification: 'n<=4, q<=61, exact; transfer assumption: structural step errors
        are dimension-independent'
    implementation: Python 3, NumPy/SciPy dense statevector, exact output distributions; no
      sampling noise
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 2
      maximum_memory_gb: 8
      maximum_runs: 18
  distinguishable_outcomes:
  - TV < 0.05 at every toy configuration the step admits
  - TV > 0.05 at any configuration (simulator manufactures error)
  falsification_conditions:
  - >-
    Simulator reports TV < 0.05 on Chen Step 9 at every toy configuration (instrument blind;
    not admitted)
  - Simulator reports TV > 0.05 on the textbook step (instrument biased)
  interpretation_limits:
  - >-
    Scale limit: a toy-size discrepancy shows the step's assertion is false as written at
    those sizes; absence of discrepancy at toy size does not establish the step at cryptographic
    size
  - Calibration of an instrument, not a verdict on any LWE hardness claim
  status: specified
  proposed_by: idea-generator
