hypothesis:
  id: H-QLWE-0cc17d
  question_id: RQ-QLWE-1c4a3b
  goal_id: GOAL-QLWE-291164
  derived_from_idea: IDEA-20261018-cf3054
  added: '2026-10-18'
  statement: >-
    KN-LIT-1743 claims a tower decomposition of the Principal Ideal Problem through Q subset
    Q(zeta_8) subset ... subset Q(zeta_{2^k}) returns a generator short enough to give approximation
    factor gamma <= 21. Executed classically (PIP solved by Sage/PARI bnfisprincipal at each
    level, standing in for the quantum PIP) on planted principal ideals with short generators
    at degree n in {8,16,32}, the lifted generator's length ratio to the planted generator
    is either <= 21 in >= 90% of instances (step reproduced) or exceeds 21 in the majority
    (step fails as written).
  mechanism: >-
    The quantum part of the claim is PIP, which is classically solvable at small degree; the
    tower descent and lift are classical algebra. Thus the load-bearing classical step can
    be executed exactly at small degree with an honest PIP oracle substitute. If the lifted
    generator is long, the failure is in the descent/lift, independent of any quantum speedup.
  assumptions:
  - Classical PIP is an exact functional substitute for the quantum PIP oracle
