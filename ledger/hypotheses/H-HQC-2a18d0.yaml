# HYPOTHESIS -- H-HQC-2a18d0, specified from IDEA-20261018-baf40a. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-HQC-2a18d0
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  derived_from_idea: IDEA-20261018-baf40a
  added: '2026-10-18'
  statement: >-
    On reduced 2-QCSD instances (n in {67, 101, 131}, weights scaled), Stern's algorithm run
    as Decoding-One-Out-of-Many over all n cyclic shifts reduces measured work by a factor
    within 2x of sqrt(n) (the Sendrier prediction for list-based ISD) relative to single-instance
    decoding, while Prange gains a factor of n only up to the point where list cost dominates;
    the measured exponent of the gain lies in [0.4, 0.6] for Stern.
  mechanism: >-
    Shifts give n syndromes of the same code; the birthday step can match against all of them,
    so list sizes grow and iterations shrink. The prediction sqrt(N) comes from optimal list
    balancing. Measured gains confirm or correct the discount HQC security estimates apply.
  assumptions:
  - Reduced instances follow asymptotic list balancing
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
