# HYPOTHESIS -- H-HQC-1671be, specified from IDEA-20261018-013d6b. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-HQC-1671be
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  derived_from_idea: IDEA-20261018-013d6b
  added: '2026-10-18'
  statement: >-
    Under the FO transform the attacker cannot choose r1, r2, e but can grind messages m,
    keeping those whose derived (r1, r2, e) have high failure likelihood (e.g., high weight
    overlap structure). At reduced n, the boosting curve log2(failure probability gain) versus
    log2(precomputation per kept ciphertext) has slope at least 0.5 over the first 16 bits,
    so total work to first failure drops by >= 2^6 versus random ciphertexts; the curve's
    shape decides whether a DFR error of k orders of magnitude translates into a CCA attack.
  mechanism: >-
    Lattice failure boosting (KN-LIT-5045, D'Anvers et al.) selects ciphertexts with large
    error norm; in HQC the analogue is ciphertexts whose r1, r2, e supports maximise a key-independent
    proxy for w(e'), e.g. w(r2) structure is fixed but distribution of e' depends on weight
    of e plus cancellation in x r2 - r1 y. A key-independent proxy only helps if failure correlates
    with ciphertext-only features; measuring the correlation decides.
  assumptions:
  - Failure correlates with ciphertext-only features through e' weight
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Failure correlates with ciphertext-only features through e' weight
    random_model_justification: structure of e'
    supporting_results: []
    validation_experiment_ids:
    - EXP-HQC-b0014c
    falsification_condition: measured correlation
  predictions:
  - metric: slope of log2 gain vs log2 precomputation over 0..16 bits
    direction: higher
    minimum_effect: '>= 0.5'
  - metric: work-to-first-failure reduction
    direction: higher
    minimum_effect: '>= 2^6'
  test_boundary:
    instances:
    - >-
      n=2003 reduced set with DFR ~2^-20; 2^30 candidate ciphertexts; proxy thresholds at
      quantiles 2^-1..2^-16; 50 keys
    parameters:
      scale_tier: toy
      scale_justification: 'reduced n; transfer: slope of boosting'
    implementation: C reduced HQC; Python analysis
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 48
      maximum_memory_gb: 8
      maximum_runs: 40
  distinguishable_outcomes:
  - <= 0.2
  - < 2^2
  falsification_conditions:
  - slope <= 0.2
  - work reduction < 2^2
  interpretation_limits:
  - >-
    Toy tier: reduced n, w, w_r, w_e and reduced RM/RS code lengths; no statement about HQC-1/3/5
    without the stated transfer assumption and a crypto-tier certificate.
  - Precomputation measured at reduced n; transfer to deployed DFR uses the slope only.
  status: specified
  proposed_by: idea-generator
