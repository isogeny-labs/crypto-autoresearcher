    falsification_condition: A/A between ciphertext seed blocks
  predictions:
  - metric: p99/median per-key DFR
    direction: higher
    minimum_effect: '>= 4'
  - metric: queries to classify a weak key at 95%
    direction: lower
    minimum_effect: <= 2^10
  test_boundary:
    instances:
    - n=2003; 10^4 keys; 10^6 boosted ciphertexts per key; SPRT thresholds alpha=beta=0.05
    parameters:
      scale_tier: toy
      scale_justification: 'reduced n; transfer: dispersion shape'
    implementation: C reduced HQC with IS estimator
    budget:
