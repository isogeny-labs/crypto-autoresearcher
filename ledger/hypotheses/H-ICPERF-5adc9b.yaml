# H-ICPERF-5adc9b — stage-0 instrument for IDEA-20261015-b41f68.
# Specified under DEC-20261017-f2d04c. No run exists in this design packet.
# Host latency, huge pages, and cross-host ratios stay proposed.
hypothesis:
  id: H-ICPERF-5adc9b
  question_id: RQ-ICPERF-94c86e
  source_idea: IDEA-20261015-b41f68
  derived_from_idea: IDEA-20261015-b41f68
  experiment_id: EXP-ICPERF-b2f2d0
  goal_id: GOAL-ICPERF-e6b6a4
  specified_at: '2026-10-17'
  proposed_by: coordinator
  status: supported
  approved_by_decision: DEC-20261017-f2d04c
  status_note: >-
    Moved approved -> analyzed -> supported by DEC-20261105-6e2616
    (2026-11-05) on EV-ICPERF-84ff45 (preliminary, toy, derivation), from
    EXP-ICPERF-283a70 runs RUN-ICPERF-f21eb1, 0ef41e and 74e9a2 (session
    RBS-ICPERF-67df7d). Approved pre-run by DEC-20261017-f2d04c (version 1,
    EXP-ICPERF-b2f2d0); version 2 approved by DEC-20261029-0e40f3 with no
    hypothesis transition. Supported for the integer statement only: the
    specified xorshift32 sampler at seed 20261017, p = 1/50, 64 draws yields
    2943 / 289567 / 28 with no median split, reproduced blind from the
    specification prose; the band clauses hold only as arithmetic
    consequences of those integers. Not adopted (DEC-20261029-22e05b F4): the
    v1 wording "Stage 0 checks that shape", "The CV band is the shape
    control", both_bands_hold as a shape check, and "draws from the geometric
    law"; both wrong-sampler controls also passed both bands. Nothing about
    geometric shape beyond this sample, p, probe panels, tables, host latency
    or IDEA-20261015-b41f68; the interpretation_limits below stand.
  title: >-
    Stage-0 instrument for a geometric probe count: 64 draws at p = 1/50,
    seed 20261017
  statement: >-
    Sixty-four draws from the geometric law with success probability 1/50,
    generated by xorshift32 from seed 20261017, have sample sum 2943, sum of
    squares 289567, and median 28. The sample coefficient of variation lies
    in [0.9, 1.1] and the median-to-mean ratio lies in [0.6, 0.8]. This
    stage does not time memory and does not read a probe panel.
  mechanism: >-
    A memoryless search has a geometric count, with coefficient of variation
    sqrt(1 - p) and median near ln(2) times the mean. Stage 0 checks that
    shape on one frozen sample at p = 1/50. Agreement is an instrument
    check of the null named by IDEA-20261015-b41f68. It is not a test that
    an 8 GiB table's probe counts follow that law.
  assumptions:
    - >-
      The xorshift32 recurrence in the runner is the whole sampler. A
      timeout or an exception is an instrument failure, not evidence about
      host latency.
    - >-
      The two central order statistics of an even sample are equal on this
      seed. A split invalidates the median used here.
  proof_search_map:
    bottleneck: >-
      Whether this one sample has the frozen sum, sum of squares, and
      median, and whether those integers sit in the two bands.
    baseline_embedding:
      parameter_slice: >-
        Population CV sqrt(49/50) and median-to-mean near ln(2), checked
        by integer band tests on the sample.
      reproduction_check: >-
        sample_sum 2943, sum_squares 289567, median 28, both band flags true.
    observation_collision:
      observable: >-
        sample_sum, sum_squares, median, cv_in_band, median_ratio_in_band.
      distinct_preimage_search: >-
        The band tests use the sample moments. They do not time a pointer chase.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The 64-draw sample at seed 20261017.
        predicted_gain: none; this stage records whether that sample matches the freeze
    quantifier_order: >-
      For this seed, this p, and these 64 draws only. No claim is made for
      every base or every host.
    method_ceiling:
      strongest_certifiable_claim: >-
        The stage-0 instrument accepts or rejects this one sample.
        No latency ratio and no huge-page effect follow.
      nearby_object_control: >-
        The CV band is the shape control and the median-ratio band is the
        second control. A second seed is not drawn.
    proof_obligations:
      - claim: band tests are integer comparisons on the sample moments
        responsibility: baseline
      - claim: the run writes the counts; this record is not a result
        responsibility: runtime
      - claim: host receipts are not inputs
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: sample_sum_equals_2943
      direction: different
      minimum_effect: sample_sum is 2943 and sum_squares is 289567
    - metric: median_equals_28
      direction: different
      minimum_effect: median is 28
    - metric: both_bands_hold
      direction: different
      minimum_effect: cv_in_band and median_ratio_in_band are true
  test_boundary:
    instances:
      - geometric draws with success probability 1/50
      - seed 20261017
      - 64 draws
    parameters:
      seed: 20261017
      p_den: 50
      n_targets: 64
    implementation: >-
      experiments/EXP-ICPERF-b2f2d0/implementation/run.py, pure Python,
      no external algebra system
    budget:
      enforcement: advisory
      note: one deterministic sample; machine protection is on the handoff
  falsification_conditions:
    - >-
      Instrument invalid if the sum, the sum of squares, or the median
      differs from the freeze, or if either band flag is false. That
      outcome does not decide the host-latency claim of IDEA-20261015-b41f68.
    - >-
      The alive conditions of IDEA-20261015-b41f68 (a real probe panel,
      a pointer-chase null, and a huge-page pair) are outside this test
      boundary. They stay open.
  interpretation_limits:
    - >-
      A pass checks one seeded sample against two bands. It is not evidence
      that n=83 probe counts are geometric.
    - >-
      A fail invalidates this instrument cell only. It is not negative
      evidence about host latency.
    - Negative evidence closes only the exact tested scope.
    - No deployed curve and no private-key recovery is in scope.
  heuristic_assumptions:
    - id: HEUR-001
      formal_statement: >-
        Not under test beyond this sample. The parent idea's geometric law
        is about probe counts on a quotient at cryptographic sizes. This
        cell draws the law directly.
      random_model_justification: >-
        The sampler is the geometric law at p = 1/50. No walk on a curve
        is drawn.
      supporting_results: []
      validation_experiment_ids: []
      falsification_condition: >-
        Not applicable beyond the frozen sample. No machine probe time is produced.
  structural_ingredients:
    - description: >-
        Geometric count of trials until the first success, with coefficient
        of variation sqrt(1 - p). The sampler is the instrument.
      citation: IDEA-20261015-b41f68
      provenance: internal
      verified_by: >-
        design session 2026-10-17 read ledger/proposals/IDEA-20261015-b41f68.yaml
      role: names the geometric null; the integers evaluated are in the runner
  asymptotic_claim: null
  dominated_by: >-
    The geometric law for a memoryless search, as named by the parent idea.
    A sample that matches that law is the known null, not a faster index
    calculus. This hypothesis claims no exponent delta.
  sota_delta: >-
    None in exponent. The counted delta is a frozen 64-draw sample.
    The parent idea's host-latency table is not produced.
  citations:
    - ref: IDEA-20261015-b41f68
      provenance: internal
      claim: parent proposal, write-once, not modified by this hypothesis
      verified_by: >-
        design session 2026-10-17 read ledger/proposals/IDEA-20261015-b41f68.yaml
