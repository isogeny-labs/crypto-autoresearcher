# HYPOTHESIS -- H-MLKEM-7592be, specified from IDEA-20261018-0c5d75. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-7592be
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  derived_from_idea: IDEA-20261018-0c5d75
  added: '2026-10-18'
  statement: >-
    A policy that picks the next (block size, jump, extra dimensions-for-free) from features
    of the current Gram-Schmidt log-profile, trained on self-generated Kyber-shaped instances
    at lattice dimension 140-180, reduces median counted cost to recover the secret by >=
    15% versus G6K's lwe_challenge default schedule on held-out instances, and by >= 5% versus
    the schedule optimized by the two-step-mode estimator. Below those margins the claim is
    false.
  mechanism: >-
    Fixed schedules assume the profile follows a GSA-like simulator after each tour. Real
    profiles deviate (head concavity, tail flattening) and the deviation predicts when a larger
    jump or an earlier final pump pays. A learned policy conditions on the observed deviation
    instead of a simulator, so it can skip tours that the simulator says are needed but the
    instance does not. The gain is a constant, but it applies directly to the end-to-end S
    of the current baseline.
  assumptions:
  - Profile features at tour t are sufficient statistics for the schedule decision.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
