# HYPOTHESIS -- H-FNDSA-d94478, specified from IDEA-20261018-17ea70. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-FNDSA-d94478
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  derived_from_idea: IDEA-20261018-17ea70
  added: '2026-10-18'
  statement: >-
    In Z[x]/(x^n + 1) the relative trace to the index-2 subfield returns twice the even part,
    the same split ffSampling recurses on. Claim: for a defect planted at ffLDL tree depth
    l, a quadratic statistic on the public relative trace of (s1, s2) to degree n/2^l reaches
    80% power with at least 2x fewer signatures than the same statistic on the full 2n-dimensional
    signature, at n = 64 and l in {3, 5}. Falsified if the full-dimensional statistic is never
    worse than the best trace statistic.
  mechanism: >-
    A deep-level defect perturbs a low-dimensional component; a statistic over all 2n coordinates
    pays noise in every dimension. If the trace maps keep most of the defect while discarding
    dimensions, power per signature rises. Because the secret basis has entries in the top
    field, the trace does not commute with the secret frame, so whether the defect survives
    the projection is exactly what is tested.
  assumptions:
  - Planted center bias at depth l is representative of real deep-level defects
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Planted center bias at depth l is representative of real deep-level
      defects
    random_model_justification: none
    supporting_results: []
    validation_experiment_ids:
    - EXP-FNDSA-23125b
    falsification_condition: repeat with width-miscalibration defect family
  predictions:
  - metric: N80(full)/N80(best trace)
    direction: higher
    minimum_effect: '>= 2 for l = 5'
  - metric: degree of best trace statistic
    direction: different
    minimum_effect: equals n/2^l within one tower step
  test_boundary:
    instances:
    - >-
      n = 64; q = 12289; l in {0, 3, 5}; trace degree d in {1, 2, 4, 8, 16, 32, 64}; 500 replicates;
      signature counts on a log grid up to 10^6
    parameters:
      scale_tier: toy
      scale_justification: n = 64; transfer assumes per-level geometry identical at larger
        n
    implementation: Python/NumPy toy Falcon, power by replicate simulation
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 15
      maximum_memory_gb: 8
      maximum_runs: 30
  distinguishable_outcomes:
  - <= 1 for all l
  - best degree independent of l
  falsification_conditions:
  - full statistic as good or better at every l
  - best degree uncorrelated with l
  interpretation_limits:
  - >-
    Scale and transfer: n = 64 toy with planted defects; transfer assumes tower structure
    scales unchanged to 512/1024
  - Power on planted defects says nothing about whether the real sampler has a defect
  status: specified
  proposed_by: idea-generator
