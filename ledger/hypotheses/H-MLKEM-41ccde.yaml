# HYPOTHESIS -- H-MLKEM-41ccde, specified from IDEA-20261018-70bd4a. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-41ccde
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  derived_from_idea: IDEA-20261018-70bd4a
  added: '2026-10-18'
  statement: >-
    Inside BKZ tours on Kyber-shaped q-ary lattices, the projected coordinates of the block's
    shortest vector are not distributed as a uniform point on the sphere that the GNR pruning
    optimizer assumes; an empirical success model fitted on observed shortest vectors yields
    pruning coefficients that cut enumeration nodes per successful SVP call by >= 20% at block
    size 50-64 at equal success probability. If the empirical distribution passes a uniformity
    test or the node saving is < 5%, the claim is false.
  mechanism: >-
    Extreme pruning computes success probability as the volume of a cylinder intersection
    under a uniform-direction assumption. In BKZ the block basis is already reduced, and the
    found vector's last coordinates are systematically smaller (it is short in the projected
    tail because the head is concave). If the true target concentrates, the optimal pruning
    profile tightens where mass is absent, saving nodes. The model is fitted on one set of
    tours and tested on fresh ones.
  assumptions:
  - The coordinate law is stable across tours and instances.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: The coordinate law is stable across tours and instances.
    random_model_justification: Empirical observations of head concavity.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-e26487
    falsification_condition: Fit on tours 1-4, test on tours 5-8 and fresh instances.
  predictions:
  - metric: nodes per successful SVP (calibrated/uniform) at beta=60
    direction: lower
    minimum_effect: <= 0.8
  - metric: KS distance of projected-coordinate law from uniform-sphere law
    direction: higher
    minimum_effect: p < 0.001 at n_obs >= 2000
  test_boundary:
    instances:
    - >-
      lattice dim 120-160, Kyber shape, q=3329; beta in {50,56,60,64}; 5000 training solutions;
      40 test instances
    parameters:
      scale_tier: toy
      scale_justification: beta <= 64; transfer only to enumeration-based preprocessing
    implementation: fpylll (Pruner, BKZ 2.0) with node counters; SciPy for fitting
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 60
      maximum_memory_gb: 8
      maximum_runs: 200
  distinguishable_outcomes:
  - ratio >= 0.95
  - p > 0.05
  falsification_conditions:
  - P2 not significant
  - P1 saving < 5%
  interpretation_limits:
  - >-
    Block sizes 50-64; real attacks use sieving at beta > 300, so this is an engineering improvement
    to enumeration-BKZ preprocessing only
  - toy lattice dims
  status: specified
  proposed_by: idea-generator
