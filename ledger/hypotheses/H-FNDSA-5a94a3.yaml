    falsification_condition: fix the half-integer convention and test both
  predictions:
  - metric: disagreement fraction at n=512
    direction: higher
    minimum_effect: '>= 0.01'
  - metric: median Delta among disagreeing keys
    direction: higher
    minimum_effect: '>= 0.005'
  test_boundary:
    instances:
    - n in {64, 256, 512, 1024}; 10^4 (f, g) per n; q = 12289
    parameters:
      scale_tier: medium
      scale_justification: deployed n for keygen only, self-generated keys
    implementation: >-
      C tower solver from a public reference implementation; SageMath exact Babai over Q;
      Python comparison
    budget:
