# HYPOTHESIS -- H-MLKEM-3de234, specified from IDEA-20261018-ab4e4d. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-3de234
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-ab4e4d
  added: '2026-10-18'
  statement: >-
    In G6K's bgj1 and BDGL (bdgl) sieves at dimensions 60-90, the DRAM traffic per reduction
    pair test, measured by cache simulation and instrumented database accesses, grows with
    d such that a bandwidth-charged cost (bytes moved / bandwidth) exceeds the arithmetic
    cost by a factor that itself grows by at least 2^{0.01 d}. If bytes per pair test are
    flat in d (cache-resident buckets), a bandwidth charge only shifts core-SVP by a constant
    and the memory-access objection is falsified at this scale.
  mechanism: >-
    Bucketed sieves stream the database through buckets; once the database exceeds last-level
    cache, each bucket pass costs DRAM traffic proportional to bucket size times vector size.
    The ratio of pair tests to bytes depends on bucket size and filtering, which G6K tunes
    for CPU caches. Core-SVP charges only operations. Measuring bytes per test against d gives
    the exponent gap between an operation count and a bandwidth-limited cost, the quantity
    a full-cost model needs.
  assumptions:
  - Cachegrind LL-miss counts track real DRAM traffic within 2x.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Cachegrind LL-miss counts track real DRAM traffic within 2x.
    random_model_justification: Simulator of an inclusive LLC.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-efc1c8
    falsification_condition: >-
      Cross-check one dimension with hardware counters on a host with PMU (perf-ipc skill),
      if available.
  predictions:
  - metric: slope of log2(bytes per pair test) vs d
    direction: higher
    minimum_effect: '>= 0.01 per dimension'
  - metric: bandwidth-charged / op-charged cost ratio at d=90 (20 GB/s/core, 1 ns/op)
    direction: higher
    minimum_effect: '>= 2'
  test_boundary:
    instances:
    - >-
      d in {60,65,70,75,80,85,90}; kernels bgj1, bdgl, gauss (positive, d<=70); 5 instances;
      8 threads pinned; saturation 0.9
    parameters:
      scale_tier: medium
      scale_justification: >-
        sieve dimensions 60-90 on a single node; transfer assumption: the per-dimension exponent
        of the measured quantity is extrapolated to beta~400-900 only as a conditional statement
        with the fit interval; no FIPS 203 security claim
    implementation: G6K with read counters on db/cdb, valgrind cachegrind, Python fits
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 120
      maximum_memory_gb: 64
      maximum_runs: 220
  distinguishable_outcomes:
  - slope CI includes 0
  - <= 1.2
  falsification_conditions:
  - P1 slope CI includes 0 for bdgl and bgj1
  - positive control fails to show growth (instrument broken)
  interpretation_limits:
  - >-
    d <= 90 single node; extrapolation to beta~600 is a conditional on the fitted slope; cache
    simulation is a model of one hierarchy
  status: specified
  proposed_by: idea-generator
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open goal
    serves this question. The Coordinator must open a successor goal or rebind before dispatch.
