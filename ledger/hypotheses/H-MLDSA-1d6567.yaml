# HYPOTHESIS -- H-MLDSA-1d6567, specified from IDEA-20261018-4d0a02. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-1d6567
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  derived_from_idea: IDEA-20261018-4d0a02
  added: '2026-10-18'
  statement: >-
    If ExpandS has a defect that makes coefficients of s1 nonuniform on [-eta, eta] (for example
    a mod-5 bias from reading a nibble with a wrong rejection bound), the secret's entropy
    per coefficient drops. At toyDSA(64..112,2,2), measured primal block size to recover the
    key tracks the estimator's prediction with the defective distribution's variance within
    +-5, and the variance (not entropy) governs it, so a high-entropy low-variance defect
    lowers cost more than a low-entropy same-variance one.
  mechanism: >-
    Primal attacks depend on the secret's standard deviation through the uSVP condition, not
    on entropy; hybrid attacks depend on entropy. A sampler defect therefore can lower one
    or the other. Measuring both defect shapes against the estimator tests whether its MLWE
    calibration holds for the skewed distributions defects produce.
  assumptions:
  - uSVP success condition is the governing predictor
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: uSVP success condition is the governing predictor
    random_model_justification: standard
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLDSA-16ba8d
    falsification_condition: compare success probability curve to KN-LIT-5601 style model
  predictions:
  - metric: measured - predicted beta
    direction: different
    minimum_effect: within +-5 for all arms
  - metric: variance vs entropy effect
    direction: different
    minimum_effect: low-variance arm beta at least 4 lower than equal-variance low-entropy
      arm
  test_boundary:
    instances:
    - >-
      toyDSA(n,2,2) n in {64,80,96,112}; distributions {uniform_eta2, low_variance, low_entropy};
      5 keys
    parameters:
      scale_tier: toy
      scale_justification: n <= 112
    implementation: >-
      SageMath, lattice-estimator, fpylll/G6K; toyDSA(n,k,l): a NumPy re-implementation of
      FIPS 204 Algorithms 1-8 with the ring degree n as a parameter (q = 8380417, d = 13,
      eta, tau, gamma1, gamma2, beta = tau*eta, omega as in ML-DSA-44 unless stated), cross-checked
      against the PQClean ML-DSA-44 reference at n = 256 on 1000 KAT vectors before any reduced
      run
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 8
      maximum_memory_gb: 8
      maximum_runs: 24
  distinguishable_outcomes:
  - outside +-8
  - difference < 2
  falsification_conditions:
  - predictions miss by > 8
  - no variance-vs-entropy distinction
  interpretation_limits:
  - toy n <= 112; transfer via estimator
  - defect shapes are constructed
  status: specified
  proposed_by: idea-generator
