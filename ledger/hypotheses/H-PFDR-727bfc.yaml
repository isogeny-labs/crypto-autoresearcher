  heuristic_assumptions:
  - id: H1
    statement: >-
      (IDEA-20261017-078074 H1.) Labels x(c P), |c| <= T, behave as independent uniform elements of L, so label
      coincidences follow the random-set law. Operationalised here as: in every powered toy cell of the EXP-PFDR-bb0d26
      grid, |kappa - 1| < 0.05 with the bootstrap 95% interval inside [0.90, 1.10].
    rigorous_support: >-
      Recalled, not read: equidistribution of x(cP) over short coefficient ranges is the type of result in
      Shparlinski's work on sequences of points (pointer only); the characteristic-0 rigidity of arXiv:2510.03828
      (Choi, abstract only read by the idea generator) is the motivation, not a proof for F_p. No bound at these
      sizes is claimed.
    validation_plan: >-
      EXP-PFDR-bb0d26: three prime sizes, three ranks, five set sizes; curves per cell sized so the expected null total
      is at least 3750 (1.5 times 2500); compare with the measured matched null; flag |kappa - 1| >= 0.10 at |z| > 4
      and replicate every flagged cell on fresh curves; tail: count of cells with |z| > 3 against the expected 0.3
      percent.
    validation_experiment_ids:
    - EXP-PFDR-bb0d26
    falsification_condition: >-
      A toy cell flagged at |kappa - 1| >= 0.10 and |z| > 4 whose replication on the disjoint replication seed block
      has the same sign, |z| > 3 and |kappa - 1| >= 0.05 (outcome O-STRUCT), on checker-valid runs with the
      calibration gate passing.
  structural_ingredients:
  - description: sum-product phenomenon for points of E and their x-coordinates (pointer only, forbids both
      small label and small group sumsets above about p^(1/2))
    citation: Ahmadi-Shparlinski, Proc. Edinburgh Math. Soc. (2010)
    provenance: recalled
    verified_by: null
    role: scope of the dichotomy; not support
  - description: characteristic-0 rigidity of x-label additive structure for rational points
    citation: arXiv:2510.03828 (Choi), abstract
    provenance: retrieved
    verified_by: idea-generator 2026-10-17, abstract fetched (IDEA-20261017-078074 citation)
    role: motivation for kappa = 1; this experiment is a toy F_p transfer, not a test of the theorem
  - description: group-side energy of a label-defined base (the dual statistic)
    citation: IDEA-20260811-7734c5
    provenance: internal
    verified_by: idea-generator 2026-10-17, file opened (IDEA-20261017-078074 citation)
    role: dual instrument; this hypothesis measures the other side
  reduction_chain:
    core_problem: whether a group-structured base (log-GAP) is label-additively structured, i.e. label-describable
    corollaries: []
  predictions:
  - id: P1
    metric: kappa per powered toy cell
    direction: same
    minimum_effect: '|kappa - 1| < 0.05 with bootstrap 95% CI inside [0.90, 1.10] in every powered cell'
    source: IDEA-20261017-078074 claim ("within 5% of the random-set value") and H1
  - id: P-detect
    metric: kappa per toy cell
    direction: different
    minimum_effect: '|kappa - 1| >= 0.10 at |z| > 4 in some cell (the detection threshold of the alternative)'
    source: IDEA-20261017-078074 predictions block, first entry; used unadjusted as the flag rule of EXP-PFDR-bb0d26
  - id: P2
    metric: planted label AP recovery
    direction: higher
    minimum_effect: 'plant kappa >= 1.15 and plant z > 4 at every powered toy cell'
    source: IDEA-20261017-078074 control 2
  held_extension:
