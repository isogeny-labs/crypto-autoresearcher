  title: >-
    Dual sum-product probe at toy scale: the x-label sets of rank-r log-GAP bases {c_1 P_1 + ... + c_r P_r} on
    generated prime-order E/F_p carry the pair-sum coincidence count of a uniformly random label set of the same size
    (within 5% at every powered toy cell, p of 20 to 28 bits, r in {1,2,3}, 256 <= a <= 4096)
  statement: >-
    Let E/F_p be a generated prime-order ordinary curve, N = #E(F_p), f(x) = x^3 + ax + b, and L = {x in F_p : f(x) a
    nonzero square} the label universe (the R1 x-labels of the points of E other than O, identified up to sign).
    For r in {1,2,3} and points P_1..P_r of E drawn uniformly let the rank-r log-GAP label set X_gap(r, n) be the
    first n distinct labels x(c_1 P_1 + ... + c_r P_r), c in [-T, T]^r in lexicographic order over the coefficient
    vectors whose first nonzero entry is positive (one representative of each +-c pair), T the least integer whose
    half-box holds at least ceil(1.02 n) + 8 vectors. For a label set X let m_s(X) = #{ {u, v} subset of X : u != v,
    u + v = s mod p } and C(X) = sum over s in F_p of binom(m_s(X), 2), the number of nontrivial pair-sum
    coincidences u_1 + u_2 = u_3 + u_4 (four distinct labels). Under the random-set model a uniform n-subset of L has
    E[C] = 3 binom(n,4)/p, about n^4/(8p). The hypothesis, as tested: in every powered cell (bits in {20, 24, 28},
    r in {1,2,3}, n in {256, 512, 1024, 2048, 4096}; 45 cells) the pooled ratio kappa = sum_curves C(X_gap) /
    sum_curves mean C(X_null), against 20 uniformly random n-subsets of L on the same curve, satisfies
    |kappa - 1| < 0.05 with its curve-cluster bootstrap 95% interval inside [0.90, 1.10].
    Tested scope: these cells, the curve seed blocks of EXP-PFDR-bb0d26, the exact counting convention above,
    x-labels only (R1), generated toy curves only. Nothing about y-labels, other labelings, translated or other-shaped
    GAPs, n above 4096, p above 2^28, any standardized or deployed curve, h >= 3, any cost or any security statement.
    The idea's second prediction (verified coincidence counts on standardized curves) is held and is not part of this
    hypothesis as tested; see held_extension.
  mechanism: >-
    (From IDEA-20261017-078074.) Pair (R1 x-labels of points with known integer coefficients, Sigma = integer scaling
    and translation by known multiples). Trichotomy: coordinate-dependent. Label addition is not equivariant under the
    group law, so the label sumset of a log-GAP is a function of the representation. Lossy-projection test: the count
    C(X) discards the group identity of the sums. This is the dual of H-PFDR-011a4b (IDEA-20261017-077f12 asks whether
    a label-structured set is group-additively structured; this asks whether a group-structured set, a log-GAP, is
    label-additively structured). A label-describable log-GAP would be the unknown-sharing base of IDEA-20261017-bbc53e
    (kappa_eff = 2 c_0) together with a label-defined membership test, the implicit-membership route of KN-OPEN-020;
    even then it prices at tau = (h/(2h-1))(1 - gamma), never below 1/2 unless kappa exceeds U (bbc53e), so a failure
    of this probe is a structural finding, not an exponent claim. The measurement costs only label additions plus a
    scalar multiples, no logarithms and no tables.
  assumptions:
  - 'The vendored curve.py generates prime-order curves deterministically from (bits, seed); seeds in the reserved
    block 8,000,000 to 8,999,999 give curves disjoint from every earlier PFDR experiment (main block 8,100,000 + c,
    replication block 8,200,000 + c, selftest block 8,900,000 + c).'
  - 'Labels x(cP), c in the half-box, are not exactly independent uniform elements of L; the experiment compares
    against the measured matched null (uniform n-subsets of L on the same curve), not against the formula.'
  - 'No discrete logarithm, key, target point or relation is computed; the points are seeded random points of
    generated toy curves. No claim about the security of any curve is made in either direction.'
  proof_search_map:
    bottleneck: >-
      Whether the x-label image of a group-structured set (log-GAP) is label-additively structured; a
      label-describable log-GAP base is the one family of IDEA-20261017-bbc53e that would also carry a label
      predicate for membership.
    baseline_embedding:
      parameter_slice: 'random-set law E[C] = 3 binom(n,4)/p for a uniform n-subset of L; here the log-GAP replaces
        the random subset'
      reproduction_check: >-
        selftest: the C kernel equals a brute-force Python count on small sets at p of 12 to 16 bits; a set with exactly
        one planted coincidence is found; a scaling of all labels by a unit leaves C unchanged; the log-GAP builder equals
        a slow Curve.mul recomputation; null-vs-null z_cal calibrates on a synthetic mini-census.
    observation_collision:
      observable: kappa per cell (one ratio of integer counts)
      distinct_preimage_search: >-
        structured-set effect versus pipeline artifact: separated by the matched random null and the null-vs-null
        calibration; instrument sensitivity: the planted known-excess label AP, which must read as an excess at every
        powered cell.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: per-cell kappa and its slope in log n per (bits, r)
      predicted_gain: locates the n at which a departure appears, if any
    quantifier_order: >-
      FOR ALL powered toy cells (bits, r, n): |kappa - 1| < 0.05; no claim FOR ALL p or n
    method_ceiling:
      strongest_certifiable_claim: >-
        exact coincidence counts of the tested sets; kappa per cell with a bootstrap interval over curves; nothing
        asymptotic
      nearby_object_control: >-
        planted label AP (kappa at least 1.15, z above 4 at every powered cell) and null replicate 0 against the other
        19 (calibration)
    proof_obligations:
    - claim: 'Sum-product results on E (Ahmadi-Shparlinski 2010, recalled) forbid small label sumset and small group
        sumset together above about p^(1/2) points; below that neither direction is proved'
      responsibility: scope
    not_applicable_reason: null
