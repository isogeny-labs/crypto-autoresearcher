    prediction: >-
      The idea's second prediction (P3, held): verified nontrivial coincidence count on two standardized prime-field
      curves (secp256k1, NIST P-256) for a <= 4096, expected about 2^-200 under the random-set model, opposite reading
      at least one verified coincidence.
    why_held: >-
      The goal scope is public toy curves only, no deployed target and no claim about any deployed curve, and the user
      has not widened it (ruling of the top-level session, EXP-PFDR-bb0d26 resolution R3). The Coordinator's first
      reading that admitted it is withdrawn.
    how_it_could_be_added: >-
      Only if the user admits it, through a versioned protocol_amendment of EXP-PFDR-bb0d26 and a new approval. Until
      then no standardized-curve constant, cell or rule exists in any bound artifact, and no result of the approved
      scope depends on it.
  test_boundary:
    instances:
    - 'toy curves: generate_prime_order_curve(bits, seed = block_offset + c), bits in {20, 24, 28}; main block 8,100,000 + c, replication block 8,200,000 + c (flagged cells only), c < 2000'
    - 'toy cells: bits x r in {1,2,3} x n in {256, 512, 1024, 2048, 4096}; 45 cells'
    - 'sets per (cell, curve): one rank-r log-GAP label set, 20 uniform null label sets, one planted label AP set, all of exactly n distinct labels'
    parameters:
      counting_convention: C(X) = sum over s of binom(m_s, 2), unordered pairs of distinct labels, four distinct labels per coincidence
      null_reps: 20
      target_coincidences: 2500
      sizing_safety_factor: 1.5
      plant_fraction: 0.30
      bootstrap_resamples: 2000
      flag_rule: '|kappa - 1| >= 0.10 and |z| > 4'
      null_rule: '|kappa - 1| < 0.05 and CI inside [0.90, 1.10]'
      replication_rule: 'same sign, |z| > 3, |kappa - 1| >= 0.05'
      calibration_gate: 'over powered cells sd(z_cal) in [0.75, 1.25] and |mean(z_cal)| <= 0.35'
    implementation: >-
      experiments/EXP-PFDR-bb0d26/implementation/ (run.py, check.py, labelsum.c, vendor/curve.py,
      fixtures/kat.json), written by TASK-20261022-726d76 and sha256-bound by the trial plan at approval
    budget:
      maximum_runs: 5
      maximum_workers: 4
      maximum_memory_gb: 4
    scope_note: >-
      Toy scale only (generated curves, p of 20 to 28 bits, n up to 4096). No attack, no key, no standardized curve and
      no cost claim.
  distinguishable_outcomes:
  - 'O-NULL (support_scoped): calibration passes, at least 80 percent of the 45 toy cells valid and every valid cell
    null; H1 not contradicted at the tested toy scope.'
  - 'O-STRUCT (falsify, scoped to the surviving toy cells): at least one flagged cell survives replication on fresh
    curves.'
  - 'O-MIXED (inconclusive): neither of the above with calibration passing and at least 50 percent of cells valid; the
    contract names the non-null cells.'
  - 'O-INVALID (not evidence): calibration fails or fewer than 50 percent of the 45 toy cells valid.'
  - 'not evidence: a timeout, memory kill, kernel failure or crash is failed_infrastructure; its cells are
    invalid, never null (AGENTS.md rule 5).'
  falsification_conditions:
  - 'Every toy cell within 5 percent with the planted arm recovered closes label-describable log-GAPs at the tested toy
    sizes (scoped; not reject_scoped). (IDEA-20261017-078074, first clause, unadjusted)'
  - 'A toy cell off by at least 10 percent at |z| > 4 that replicates on fresh curves survives as structure (the
    contract tests both signs and replicates at |z| > 3, |kappa - 1| >= 0.05, Coordinator resolution R5 in
    EXP-PFDR-bb0d26).'
  - 'Planted arm not recovered at a cell makes that cell inconclusive, never null. (IDEA control, unadjusted)'
  confounders:
  - The x-map is 2-to-1; the half-box takes one representative of each +-c pair and labels are deduplicated, so
    trivial label equalities are removed.
  - Hasse fluctuation of p across curves of one bit size; handled by the per-curve null mean and variance.
  - Cells at the same bits share their curve sets, so cell statistics are not independent.
  - The toy generator rejects j = 0 and j = 1728, so no beta-orbit label duplication occurs.
  interpretation_limits:
  - A null does not exclude label structure for sets that are not log-GAPs, for translated or truncated-differently
    boxes, or for other labelings.
  - kappa = 1 within 5 percent at p of 20 to 28 bits never confirms the asymptotic random-set statement.
  - No standardized or deployed curve is tested and nothing is said about the security of any curve.
  - The IDEA's clause |X+X| >= 0.9 of the random-set expectation has almost no power at the tested sizes (the
    sumset saturates or is nearly the pair count); it is kept as a secondary check, and C is the decisive statistic.
  - Producer-written check.py is not independent review; independent review precedes any status move.
  status: supported
  status_note: >-
    Moved approved -> analyzed -> supported by DEC-20261029-01405d on EV-PFDR-07d608 (strong, toy, empirical_only).
    Approved pre-run by DEC-20261022-f1efde; this file read specified until this edit. Supported at the tested toy
    scope only: x-labels of proper (relation-free) rank-r log-GAP half-boxes, pair-sum (h = 2) count, 44 of 45 cells
    within the 5% tolerance; b20-r3-n4096 not assessed; relation-bearing log-GAPs untested; not exact random-set
    behaviour. The "label-describable" consequence of falsification_conditions[0] is narrowed by that decision, and
    KN-OPEN-020 stays open.
