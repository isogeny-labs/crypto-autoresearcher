  statement: A shared divisor-coefficient Graeffe membership tower cuts complete five-point
    decomposition work by 2x relative to per-root PKM towers, without a degree or
    exponent claim.
  mechanism: Sharing the coefficient tower across roots moves repeated membership
    work into one Graeffe evaluation; if the correspondence holds, the complete cost
    falls even though the intrinsic degree does not.
  assumptions:
  - User requests factor-base/SAT research; execution is not authorized here.
  - Implicit membership is not an asserted escape from KN-OPEN-020.
  predictions:
  - metric: complete_relation_cost
    direction: lower
    minimum_effect: <=0.5x per-root PKM
  - metric: verified_model_count
    direction: different
    minimum_effect: exact agreement
  - metric: chart_coverage
    direction: different
    minimum_effect: '1.0'
  test_boundary:
    instances:
    - cells named in IDEA-20261029-3d0e71 and DESIGN.md
    parameters:
      instances: 3
