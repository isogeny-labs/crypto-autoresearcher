    falsification_condition: count surviving rotations and regress q*
  predictions:
  - metric: relative drop of log2 q* at k = n/8
    direction: lower
    minimum_effect: '>= 5%'
  - metric: event signature presence in residual
    direction: different
    minimum_effect: present in >= 80% at q above q*(k)
  test_boundary:
    instances:
    - >-
      n in {48, 64, 80}; k in {0, n/16, n/8, n/4}; positions contiguous/scattered; q grid;
      20 instances
    parameters:
