# HYPOTHESIS -- H-MLDSA-6293f2, specified from IDEA-20261018-417012. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-6293f2
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  derived_from_idea: IDEA-20261018-417012
  added: '2026-10-18'
  statement: >-
    A naive T-party threshold signer that sums per-party uniform masks y = sum y_i and applies
    the FIPS rejection bound produces accepted z whose conditional mean is E[z_j | u_j] =
    g_T * u_j with g_T >= 0.8 for T >= 3, so least-squares on public signatures recovers s1
    with about 16 sigma_z^2/(tau g_T^2) signatures. At toyDSA(64,2,2) with gamma1 = 2^10 this
    is predicted at about 1.4*10^5 signatures for T = 4 with per-party range gamma1/T, while
    T = 1 (uniform) shows no recovery at 10^6.
  mechanism: >-
    Rejection sampling hides u only if the mask density is flat over the acceptance window;
    a sum of T uniforms is piecewise polynomial with density falling toward the box edge,
    so truncating y + u to the box barely changes the mean shift u. The gain g_T = 1 - 2B
    p_T(B)/P_T(|Y| < B) approaches 1 as the density at the edge vanishes. Threshold designs
    that rescale per-party ranges or use boundary-clearance techniques exist precisely to
    avoid this; measuring the naive leak quantifies what they protect.
  assumptions:
  - regression variance formula holds with non-uniform z
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
