    direction: different
    minimum_effect: within 5 percent for T in {2,3,4,8}
  - metric: N* at T = 4
    direction: lower
    minimum_effect: within factor 2 of 1.4*10^5
  - metric: T = 1
    direction: different
    minimum_effect: zero recoveries at 10^6
  test_boundary:
    instances:
    - >-
      toyDSA(64,2,2), gamma1 = 2^10, T in {1,2,3,4,8}, per-party range {gamma1/T, gamma1};
