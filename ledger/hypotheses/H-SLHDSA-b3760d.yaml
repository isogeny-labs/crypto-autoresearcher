# HYPOTHESIS -- H-SLHDSA-b3760d, specified from IDEA-20261018-b9e923. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-SLHDSA-b3760d
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  derived_from_idea: IDEA-20261018-b9e923
  added: '2026-10-18'
  statement: >-
    The Kudinov-Kiktenko-Fedorov flaw concerns forgeries in which the forged chain value meets
    the honest chain at a later step without a second preimage at the step the old reduction
    extracted. At n in {10,12,14} bits, w=16, the fraction of extracted WOTS+ forgeries that
    are chain-merge events without an SM-TCR break at the reduction's step exceeds 5% and
    matches the recovered proof's (KN-LIT-6178) additional term within a factor 2; at larger
    n the fraction falls as predicted.
  mechanism: >-
    In short hash chains, two distinct inputs can merge after a few steps; the reduction that
    expects a collision at a specific step misses those cases. The recovered tight proof adds
    a term (preimage/undetectability) to cover them. Measuring the event frequency at toy
    n directly quantifies how much of the proof's slack each term carries.
  assumptions:
  - Truncated SHAKE chains behave as random functions
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Truncated SHAKE chains behave as random functions
    random_model_justification: model
    supporting_results: []
    validation_experiment_ids:
    - EXP-SLHDSA-316fdd
    falsification_condition: cycle structure check
  predictions:
  - metric: fraction of class (b) at n=10
    direction: higher
    minimum_effect: '>= 5%'
  - metric: ratio measured (b) fraction / proof term
    direction: different
    minimum_effect: within factor 2
  test_boundary:
    instances:
    - n in {10,12,14} bits; w=16; len=8 chains; 10^4 forgeries per cell
    parameters:
      scale_tier: toy
      scale_justification: 'n 10-14 bits; transfer: term formula'
    implementation: Python+NumPy; truncated SHAKE256 chain function
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 8
      maximum_memory_gb: 4
      maximum_runs: 18
  distinguishable_outcomes:
  - under 1%
  - off by more than 4x
  falsification_conditions:
  - (b) under 1% at n=10
  - measured vs term off by > 4x
  interpretation_limits:
  - >-
    Toy tier: reduced n (hash output truncated to 12-32 bits) and reduced w, h, d, k, a; no
    statement transfers to a FIPS 205 parameter set without the stated transfer assumption
    and a separate crypto-tier certificate.
  - Measures term weight at toy n; scaling of the term to n=128 is analytic.
  status: specified
  proposed_by: idea-generator
