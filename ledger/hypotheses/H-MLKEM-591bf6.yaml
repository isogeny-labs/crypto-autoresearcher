    falsification_condition: Test correlation between successive failure directions beyond
      the secret component.
  predictions:
  - metric: query cost ratio first failure / fifth failure
    direction: higher
    minimum_effect: '>= 4'
  - metric: measured cosine vs model at F in {1,2,4,8}
    direction: different
    minimum_effect: within 2x
  test_boundary:
    instances:
    - n=64, k=2, q=3329, eta1=eta2=3, d_u=10, d_v=3; F up to 8; 20 keys
    parameters:
      scale_tier: toy
      scale_justification: 'elevated DFR; transfer assumption: functional form of cone narrowing'
    implementation: C reference ML-KEM (parameterized) + Python/NumPy
    budget:
