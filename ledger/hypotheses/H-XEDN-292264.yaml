    citation: https://arxiv.org/pdf/1605.02961
    provenance: retrieved
    verified_by: codex-root
    role: audited source; displayed cutoff not adopted as verified
  interpretation_limits:
  - Integer software controls do not certify the complete repaired theorem.
  - No arbitrary-residue construction, coefficient-discovery method or speedup claimed.
  - No independent review or official scientific promotion in this snapshot.
