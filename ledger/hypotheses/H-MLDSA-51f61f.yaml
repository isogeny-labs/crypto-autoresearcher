# HYPOTHESIS -- H-MLDSA-51f61f, specified from IDEA-20261018-5b48f2. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-51f61f
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  derived_from_idea: IDEA-20261018-5b48f2
  added: '2026-10-18'
  statement: >-
    At small MSIS instances [A | I] x = 0 mod q with q = 8380417, an exact Schnorr-Euchner
    enumeration with l-infinity box pruning finds the true l-infinity minimum lambda_inf.
    The probability that a 2^{0.2075 beta} l2 sieve pool contains a vector below the l-infinity
    bound B is predicted by the Gaussian-coordinate model to within a factor 2, while the
    naive sqrt(m) l2-to-l-infinity conversion overstates the required block size by at least
    6 at m = 64.
  mechanism: >-
    MSIS cost in ML-DSA analyses is computed in l2 and converted. The sieve returns many vectors
    near the l2 Gaussian heuristic, and their coordinates are roughly Gaussian, so the chance
    that one has small l-infinity norm is a tail-product, exploitable via the pool. Without
    a ground-truth lambda_inf, neither conversion has been tested. Exact enumeration in a
    box is feasible at m <= 72 and gives lambda_inf and the count of short l-infinity vectors
    exactly, against which both predictions can be scored.
  assumptions:
  - sieve-pool vectors have approximately i.i.d. Gaussian coordinates
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: sieve-pool vectors have approximately i.i.d. Gaussian coordinates
    random_model_justification: heuristic
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLDSA-01a356
    falsification_condition: KS test of coordinate distribution of pool vectors at each m
  predictions:
  - metric: pool-hit probability measured/predicted
    direction: different
    minimum_effect: ratio in [0.5, 2] at m in {48, 56, 64, 72}
  - metric: block size overstatement of sqrt(m) conversion
    direction: higher
    minimum_effect: '>= 6 at m = 64'
  test_boundary:
    instances:
    - >-
      q = 8380417, m in {48,56,64,72}, module shapes from n in {8,16} with k,l giving m; B
      chosen so the expected count is 1..100; 10 instances per m
    parameters:
      scale_tier: toy
      scale_justification: m <= 72; transfer only of the model's functional form
    implementation: C++ box enumeration (custom, verified on planted instances), fpylll, G6K
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 8
      maximum_memory_gb: 8
      maximum_runs: 24
  distinguishable_outcomes:
  - ratio outside [0.25, 4] at two m
  - overstatement below 2
  falsification_conditions:
  - pool-hit model off by more than factor 4
  - sqrt(m) conversion within 2 of measured
  interpretation_limits:
  - >-
    m <= 72 is far from ML-DSA dimensions (~2048); transfer assumes the pool-hit model's form
    is dimension-independent
  - measures the conversion model, not ML-DSA security
  status: specified
  proposed_by: idea-generator
