# HYPOTHESIS -- H-MLKEM-cf6634, specified from IDEA-20261018-7b3a19. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-cf6634
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  derived_from_idea: IDEA-20261018-7b3a19
  added: '2026-10-18'
  statement: >-
    At module rank 2 and 3 over Z[X]/(X^d+1), d in {8,16,32}, module-BKZ (module-LLL plus
    module-SVP oracles) reaches the same measured log-profile slope as scalar BKZ at a total
    counted cost (SVP-oracle node or sieve pair counts plus size-reduction ring multiplications)
    that is either at least 2x lower (structure is a liability) or at least 2x higher (structure
    is a cost to the attacker). The claim is that the sign is determinable at these sizes
    with 20 instances per cell and is not inside the A/A noise.
  mechanism: >-
    IDEA-20260829-353361 measures the blocksize offset Delta(d,r) at equal slope. A blocksize
    offset does not by itself fix cost: module-BKZ operates on d-times smaller matrices over
    the ring (fast NTT multiplication), uses fewer but larger SVP calls, and the module-SVP
    oracle can exploit the ring automorphisms inside the block. Those terms can offset a positive
    Delta, or compound it. Only a total-cost measurement at matched output decides which.
  assumptions:
  - Equal profile slope implies equal attack utility.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Equal profile slope implies equal attack utility.
    random_model_justification: GSA-based estimators use slope alone.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-de8801
    falsification_condition: Also report success rate on planted uSVP at the reached profile.
  predictions:
  - metric: cost ratio module/scalar at r=2
    direction: different
    minimum_effect: ratio outside [0.5, 2]
  - metric: cost ratio trend in d at fixed r
    direction: higher
    minimum_effect: ratio increases monotonically from d=8 to d=32
  test_boundary:
    instances:
    - >-
      d in {1,8,16,32}, r in {2,3}, q=3329, CBD(2); 20 instances per cell; target slope =
      that of scalar BKZ-30 output
    parameters:
      scale_tier: toy
      scale_justification: >-
        ring degree <= 32; transfer assumption: the fitted trend in d extrapolates to d=256
        only as a conditional statement
    implementation: >-
      SageMath 10 module-LLL/module-BKZ prototype with operation counters, fpylll BKZ 2.0
      with node counters
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 80
      maximum_memory_gb: 8
      maximum_runs: 320
  distinguishable_outcomes:
  - ratio inside [0.5, 2] with CI also inside, i.e. no material difference
  - non-monotone or decreasing trend
  falsification_conditions:
  - positive control ratio outside [0.8,1.25] (counting bug)
  - 'P1: CI of the ratio inside [0.5,2]'
  interpretation_limits:
  - >-
    Dimensions 32-96 only; ML-KEM runs at d=256, r~2-4 - the trend in d is the transferable
    object, not any absolute number
  - operation counts, not wall clock
  status: specified
  proposed_by: idea-generator
