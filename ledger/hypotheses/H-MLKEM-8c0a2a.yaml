# HYPOTHESIS -- H-MLKEM-8c0a2a, specified from IDEA-20261018-957273. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-8c0a2a
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  derived_from_idea: IDEA-20261018-957273
  added: '2026-10-18'
  statement: >-
    May's Meet-LWE representation technique, generalized to secrets with the exact CBD(eta)
    symbol distribution on {-eta..eta} (representations split each symbol into two summands
    drawn from a tuned distribution), achieves a measured time exponent c (log2 time / n)
    at least 10% below the same algorithm using a ternary-style representation on CBD(2) secrets
    at n in {32,48,64}, q=3329. It remains far above the primal lattice attack at the same
    n; the claim concerns the combinatorial exponent, not a break.
  mechanism: >-
    Representation counts grow with the number of ways to write a symbol as a sum; CBD(eta)
    puts mass 6/16, 4/16, 1/16 on 0, +-1, +-2 (eta=2), so tuned summand distributions can
    produce more representations per list element than a ternary-weight split. More representations
    allow stronger filtering modulo partial q-ary constraints, shrinking lists. This changes
    the exponent coefficient of the combinatorial attack, which is the term hybrid attacks
    combine with lattice reduction.
  assumptions:
  - Representations behave as independent uniform under the filtering constraint.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Representations behave as independent uniform under the filtering constraint.
    random_model_justification: Standard in Becker-Coron-Joux and May analyses.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-343bfe
    falsification_condition: Compare measured list sizes to predicted at every level (P2).
  predictions:
  - metric: fitted time exponent c_tuned / c_ternary
    direction: lower
    minimum_effect: <= 0.9
  - metric: measured level-1 list size vs representation-count prediction
    direction: different
    minimum_effect: within factor 2 of prediction
  test_boundary:
    instances:
    - >-
      n in {32,40,48,56,64}, m=n, q=3329, CBD(2) and CBD(3), depth 2 and 3; 10 instances per
      n; memory cap 32 GB
    parameters:
      scale_tier: toy
      scale_justification: >-
        n<=64; transfer assumption: the exponent ratio, not absolute time, informs hybrid
        models at n=256
    implementation: C++/Python Meet-LWE implementation with counters; NumPy
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 30
      maximum_memory_gb: 32
      maximum_runs: 400
  distinguishable_outcomes:
  - ratio >= 0.97 with CI
  - measured lists exceed prediction by > 4x (representation heuristic fails for CBD)
  falsification_conditions:
  - 'P1: no exponent improvement'
  - positive control off by > 4x (implementation invalid)
  interpretation_limits:
  - >-
    n <= 64 combinatorial instances; exponents fitted on 5 points; Meet-LWE is known to lose
    to lattices at ML-KEM sizes, so this is an input to hybrid cost models only
  status: specified
  proposed_by: idea-generator
