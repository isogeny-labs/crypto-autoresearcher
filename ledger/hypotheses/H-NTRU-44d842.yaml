# HYPOTHESIS -- H-NTRU-44d842, specified from IDEA-20261018-5d92f4. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-NTRU-44d842
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  derived_from_idea: IDEA-20261018-5d92f4
  added: '2026-10-18'
  statement: >-
    For matrix NTRU with invertible secret F (d x d over R) and G (m x d), the lattice has
    dimension (d + m)n and a dense sublattice of rank dn, ratio rho = d/(d + m). Claim: log2
    q* collapses onto a single function of N = (d + m)n and rho across (d, m) in {(1,1), (1,2),
    (2,1), (2,2), (1,3)}, with residuals below 0.15 in log2 q; the ring rank-1 case sits on
    the curve. Distinct from IDEA-20260809-2866e0, which locates the transition per rank:
    here a specific collapse law is tested and the rectangular lever varies rho independently
    of N.
  mechanism: >-
    The dense-sublattice event depends on the sublattice's rank and covolume relative to the
    full lattice's determinant and dimension. If ring or module structure only enters through
    those, all variants with equal (N, rho) and secret norm behave alike. A failure of collapse
    would indicate structure beyond geometry, e.g., module automorphisms.
  assumptions:
  - Transition is governed by the densest sublattice's rank and covolume
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Transition is governed by the densest sublattice's rank and covolume
    random_model_justification: KN-LIT-114 analysis as reported
    supporting_results: []
    validation_experiment_ids:
    - EXP-NTRU-267f7d
    falsification_condition: regress q* on covolume
  predictions:
  - metric: max residual from collapse fit
    direction: lower
    minimum_effect: <= 0.15 log2 q
  - metric: d log2 q*/d rho at fixed N
    direction: different
    minimum_effect: nonzero with CI excluding 0
  test_boundary:
    instances:
    - >-
      (d, m) in {(1,1),(1,2),(2,1),(2,2),(1,3)}; N in {96, 128, 160}; 20 instances per q;
      ring x^n + 1
    parameters:
      scale_tier: toy
      scale_justification: N <= 160
    implementation: SageMath, fpylll, profile detector, certificate checker
    budget:
      wall_clock_seconds_per_run: 3600
      total_cpu_hours: 100
      maximum_memory_gb: 16
      maximum_runs: 120
  distinguishable_outcomes:
