# HYPOTHESIS -- H-MLKEM-3e50a4, specified from IDEA-20261018-35cd77. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLKEM-3e50a4
  question_id: RQ-MLKEM-003
  goal_id: null
  derived_from_idea: IDEA-20261018-35cd77
  added: '2026-10-18'
  statement: >-
    Estimators replace ML-KEM's CBD(eta) secret and error by Gaussians of equal variance.
    On primal instances at lattice dimension 120-160, the median success block size for CBD(2)
    differs from the matched-variance discrete Gaussian by < 1 block size, while uniform {-2..2}
    of different kurtosis but matched variance also differs by < 1. If any pair differs by
    >= 2 with CI excluding 0, the variance-only surrogate is not adequate and estimator inputs
    must carry the shape.
  mechanism: >-
    uSVP success depends on the norm of the projected planted vector, which by concentration
    depends mostly on the variance; higher moments enter through the spread of the projected
    norm (excess kurtosis of CBD(2) is -0.25). The effect on the median beta should be small
    but on the spread could be visible. IDEA-20260808-90632c addresses the projected-norm
    ratio law; this measures the attack outcome directly.
  assumptions:
  - Variance matching is the right equivalence.
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Variance matching is the right equivalence.
    random_model_justification: Estimator convention.
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLKEM-62fa28
    falsification_condition: Positive control quantifies sensitivity to variance.
  predictions:
  - metric: '|median beta*(CBD) - median beta*(Gaussian)|'
    direction: lower
    minimum_effect: < 1
  - metric: IQR ratio CBD/Gaussian
    direction: different
    minimum_effect: within [0.8,1.25]
  test_boundary:
    instances:
    - >-
      n=40, k=2, q=3329; laws CBD(2), DGauss(sigma=1), uniform matched; 150 instances; positive
      DGauss sigma^2=1.5
    parameters:
      scale_tier: toy
      scale_justification: 'lattice dim 161; transfer: a null here supports, not proves, the
        surrogate at FIPS dims'
    implementation: G6K, fpylll, SageMath samplers
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 60
      maximum_memory_gb: 16
      maximum_runs: 1200
  distinguishable_outcomes:
  - '>= 2 with CI excluding 0'
  - outside [0.6,1.6]
  falsification_conditions:
  - 'P1: difference >= 2'
  - positive control shows no increase (instrument too coarse)
  interpretation_limits:
  - >-
    Lattice dim <= 160; a null result is a control at this scale; spreads may differ at FIPS
    dims
  status: specified
  proposed_by: idea-generator
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open goal
    serves this question. The Coordinator must open a successor goal or rebind before dispatch.
