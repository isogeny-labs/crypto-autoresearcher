# HYPOTHESIS -- H-HQC-5bcd4f, specified from IDEA-20261018-a4977e. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-HQC-5bcd4f
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  derived_from_idea: IDEA-20261018-a4977e
  added: '2026-10-18'
  statement: >-
    If HQC's fixed-weight sampler has a measurable position bias (IDEA-20260816-967721 measures
    it), an ISD that selects information sets weighted by the bias needs fewer iterations;
    at reduced n with the bias magnified 2^4..2^8 times its measured value, prior-weighted
    Prange reduces iterations by a factor predicted by the KL divergence of the biased distribution
    from uniform, and at the measured bias the reduction is below 1.05x, i.e., the bias is
    security-irrelevant to ISD.
  mechanism: >-
    Prange succeeds when the error avoids the information set; if error positions are biased,
    placing the information set on low-probability positions raises success. Gain scales with
    how concentrated the bias is; a quantitative law turns any measured bias into an ISD cost
    delta.
  assumptions:
  - Sampler bias is position-marginal (no higher-order structure)
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: Sampler bias is position-marginal (no higher-order structure)
    random_model_justification: model
    supporting_results: []
    validation_experiment_ids:
    - EXP-HQC-0fed82
    falsification_condition: test from 967721 output
  predictions:
  - metric: iteration reduction at magnified bias 2^8
    direction: higher
    minimum_effect: within 25% of KL prediction
  - metric: reduction at measured bias
    direction: lower
    minimum_effect: <= 1.05x
  test_boundary:
    instances:
    - n=131 QC; bias scale s in {1,2^4,2^8} times measured; 500 instances
    parameters:
      scale_tier: toy
      scale_justification: 'n=131; transfer: law in KL'
    implementation: C or NumPy Prange
    budget:
      wall_clock_seconds_per_run: 1800
      total_cpu_hours: 4
      maximum_memory_gb: 4
      maximum_runs: 18
  distinguishable_outcomes:
  - '> 2x off prediction'
  - '> 1.2x'
  falsification_conditions:
  - prediction off > 2x
  - measured-bias reduction > 1.2x (would be a finding)
  interpretation_limits:
  - >-
    Toy tier: reduced n, w, w_r, w_e and reduced RM/RS code lengths; no statement about HQC-1/3/5
    without the stated transfer assumption and a crypto-tier certificate.
  status: specified
  proposed_by: idea-generator
