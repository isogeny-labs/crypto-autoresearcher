    falsification_condition: Sensitivity with sqrt(L)*log L
  predictions:
  - metric: quantum_priced_gain
    direction: lower
    minimum_effect: <= sqrt(d) at QRAM price 1
  - metric: classical_gain
    direction: higher
    minimum_effect: '>= d/2'
  test_boundary:
