    - >-
      dims {40,50,60,70}; ring degree d = dim (k=1) and d = dim/2 (k=2); q=3329; 10 instances;
      QRAM price {0,0.1,1}
    parameters:
      scale_tier: toy
      scale_justification: 'dims <= 70; transfer: per-query pricing model scales'
    implementation: G6K or instrumented Python Gauss sieve, NumPy
    budget:
