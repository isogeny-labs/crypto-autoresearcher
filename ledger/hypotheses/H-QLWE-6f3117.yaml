# HYPOTHESIS -- H-QLWE-6f3117, specified from IDEA-20261018-cdde02. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-QLWE-6f3117
  question_id: RQ-QLWE-9108dc
  goal_id: GOAL-QLWE-291164
  derived_from_idea: IDEA-20261018-cdde02
  added: '2026-10-18'
  statement: >-
    In a classical Gauss sieve on Ring-LWE lattices (x^d+1), adding all d signed rotations
    of each list vector raises the reduction hit rate per stored vector by a factor near d,
    a known polynomial gain. When the near-neighbour search is priced as Grover over a QRAM-held
    list at QRAM cost per query in {0, 0.1, 1} gate-equivalents per bit, the gain in total
    cost at dims 40-70 shrinks to at most sqrt(d) or below, and on the plain-LWE control it
    is exactly 1.
  mechanism: >-
    Ring structure gives free rotations, which is the only well-established ring advantage
    for sieving. Under a quantum cost model the list search is Grover-accelerated and QRAM
    is the bottleneck; enlarging the effective list by rotations helps classical pairing linearly
    but quantum search only by a square root, while QRAM loading of rotations costs extra.
    Measuring hits and list sizes and pricing them makes the structure-dependent factor explicit
    and bounded.
  assumptions:
  - Grover over list of size L costs sqrt(L) QRAM queries
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
