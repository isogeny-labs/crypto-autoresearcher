# HYPOTHESIS -- H-MLDSA-2331e7, specified from IDEA-20261018-1acf81. Write-once; status changes only by Coordinator decision.
hypothesis:
  id: H-MLDSA-2331e7
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  derived_from_idea: IDEA-20261018-1acf81
  added: '2026-10-18'
  statement: >-
    In a simulated Hamming-weight leakage of the product c*s1 computed coefficient-wise in
    the NTT domain with d+1 arithmetic shares and Gaussian noise sigma, the number of signatures
    needed to recover s1 by correlation/template attack with known c grows as sigma^{2(d+1)}
    at fixed d. The fitted exponent of traces vs sigma is 2.0, 4.0 and 6.0 within +-0.4 for
    d = 0, 1, 2, and with a first-order share-recombination flaw (shares summed before NTT
    multiply) order 2 collapses to the d = 0 curve.
  mechanism: >-
    Masking's theoretical guarantee is that higher-order moments are needed, so the attack's
    SNR scales as SNR^{d+1}. For ML-DSA the key-dependent intermediate c_hat * s1_hat has
    public c, so a CPA predicts per key coefficient. Whether a concrete masked c*s1 multiplication
    in a share representation matches the theoretical law has to be measured, and the flawed
    arm shows the law depends on implementation, not on order alone.
  assumptions:
  - higher-order CPA with centered products is near-optimal for this model
  proof_search_map:
    not_applicable_reason: Empirical hypothesis; decided by the measurement in the linked
      experiment, not by a proof.
  rerandomization: null
  asymptotic_claim: null
  heuristic_assumptions:
  - id: HEUR-001
    formal_statement: higher-order CPA with centered products is near-optimal for this model
    random_model_justification: standard result for HW leakage
    supporting_results: []
    validation_experiment_ids:
    - EXP-MLDSA-0d773e
    falsification_condition: compare with template attack at d = 1 on a subset
  predictions:
  - metric: fitted exponent of N vs sigma
    direction: higher
    minimum_effect: 2(d+1) +- 0.4 for d in {0,1,2}
  - metric: flawed order-2 arm
    direction: lower
    minimum_effect: exponent within 0.4 of the d = 0 value
  test_boundary:
    instances:
    - >-
      ML-DSA-44 shapes (n = 256, l = 4); d in {0,1,2}; sigma in {0.5,1,2,4,8}; flawed-d2 arm;
      3 keys per seed block; cap 10^7 traces
    parameters:
      scale_tier: medium
      scale_justification: real arithmetic sizes, simulated leakage; transfer is of the exponent
        law only
    implementation: Python/NumPy simulator of share-wise NTT multiply at ML-DSA-44 shapes;
      numba for CPA
    budget:
      wall_clock_seconds_per_run: 7200
      total_cpu_hours: 24
      maximum_memory_gb: 16
      maximum_runs: 30
  distinguishable_outcomes:
  - exponent off by more than 0.8
  - flawed arm exponent >= 4
  falsification_conditions:
  - exponents deviate from 2(d+1) by more than 0.8
  - flawed arm keeps full order
  interpretation_limits:
  - simulation only at real n = 256 arithmetic but modelled leakage; no device measured
  - the exponent law, not absolute trace counts, transfers
  status: specified
  proposed_by: idea-generator
