  items:
    - id: C1
      field: fixture families (prediction positive_control_recall; minimal_test design "3 positives, 3 nulls, 1 nearby-object each")
      prior_value: >-
        "every control flagged by its stated family (known GHS-weak toy cell,
        anomalous toy curve, small-embedding-degree toy curve)"; the claim
        enumerates four candidate families: GHS Weil descent, isogeny moves,
        genus-2/3 covers, pairing embedding.
      corrected_value: >-
        The three named positive controls map to GHS and to pairing; an anomalous
        curve belongs to the p-adic (SSSA) family, which is none of the four
        declared. No named positive control exists for an isogeny move or for a
        cover, so "labels every positive control weak by the stated family" is
        vacuous for those two families and the recall criterion cannot fail
        there. (The review summarised this as the fixtures covering 3 of 4
        families; by the record's own list I count GHS and pairing covered, one
        control off the family list, and isogeny and cover uncovered.) In the
        tool PR #2594 built, RESULTS.md section 2 shows the only class-weak row
        is the pairing control mnt/mnt1 (priced 14.1 bits below matched rho);
        the subfield-subgroup GHS controls have a verified subgroup and are
        priced 4.0 to 5.1 bits above rho (verdict "no weakness found in scope");
        the synthetic genus-4 descent (F10) is classed formula_advantage with no
        map; BLS12-381 is a marginal lead (band 2^130.0 to 2^146.5 against
        2^142.9). RESULTS.md names no anomalous-curve fixture. A positive
        control for each of isogeny and cover candidates is the missing piece.
    - id: C2
      field: acceptance criterion "zero false weak labels on nulls" (prediction false_weak_labels_on_nulls; claim "no null weak")
      prior_value: >-
        minimum_effect "zero (prime-degree binary fields, Koblitz m=1, random
        prime-field curves)".
      corrected_value:
        review_finding: >-
          The `class-weak` verdict of the tool built from this proposal (crypto
          PR #2594) is uncalibrated: on the 34 registry prime curves 14 are
          flagged class-weak, mostly the BN family. A fix is in progress in a
          separate PR (not read here). Reported by the independent review; not
          reproduced by me.
        what_this_means_for_the_criterion: >-
          The criterion's null classes (prime-degree binary fields, Koblitz m = 1,
          random prime-field curves) contain no pairing-friendly curve, so as
          written it can pass while the verdict mislabels registry curves of a
          class it never tests. The merged RESULTS.md audits 6 registered curves
          and 2 controls, not the 34, and states what its own class-weak means:
          the pairing route is priced below rho under the tool's model, "not that
          the curve is broken at any absolute level". Whether the flagged curves
          are false labels or the model's honest output is the calibration
          question; I do not decide it. The criterion should reference the
          calibration PR when it lands and name a null set for each family the
          verdict can fire on, including pairing-friendly curves with a large
          embedding degree.
    - id: D1
      field: dedup, near neighbours the notes omit
      corrected_value:
        IDEA-20261024-a29e53: >-
          (proposed, RQ-PEXT-7c3e91) For K = F_{q^n}, E/K ordinary, claims that
          every class t, or its quadratic twist, holds a genus-n curve over F_q
          (Torelli plus Serre's twist) at n = 3, so that classes with #E(K) odd
          or 2 mod 4, where the GHS cover floor is 13 or 5 (proved), still hold
          genus-3 Jacobians: "the cover floor is not the genus floor". Existence
          is not descent (the proposal says so). It bears on this tool's cover
          leg: a bounded miss in the cover family should state the class's GHS
          floor and the genus floor it leaves open, and the null fixtures for
          cover candidates should be chosen with that distinction.
        IDEA-20261024-7be1c6: >-
          (proposed, RQ-PEXT-7c3e91) An exact split-count law for the curves in
          an isogeny class with E(K)[2] = (Z/2)^2 (the non-floor vertices of the
          K-rational 2-isogeny volcanoes) and a heuristic hits-per-class exponent
          n/2 - 3 for floor-family curves. It bears on this tool's isogeny leg: how
          far a walk must go to reach a cover-bearing representative, and the
          2-adic shape caveat (IDEA-20261024-3c71a9) on which classes can hold one.
        both: >-
          Both are proposals with no measurement; they are cited for their
          claims, not as results. Neither is a positive control.
    - id: X1
      field: status, the tool has been built (crypto PR #2594, merged 2026-10-25, 1d2730d63a; the notes say "branch not present locally")
      corrected_value: >-
        src/bin/transfer_audit.rs and src/bin/transfer_audit/ (about 31,300
        inserted lines over 125 files in the PR, including the generated
        certificates), protocol frozen
        before the first run with two dated amendments. Audited: sect113r1,
        ECC2K-130, K-163, B-163, P-192, secp256k1, four toy Koblitz curves
        (n = 15, 15, 21, 35), the subfield-subgroup controls, mnt/mnt1 and
        BLS12-381 as controls. Every registered-curve verdict is "no weakness
        found in scope"; mnt/mnt1 returns class-weak as pre-registered. Executed:
        trace descent with m = 1, the same-field genus-3 degree-3 binary cover
        pullback (verified on 8 curves), explicit degree-5 Velu isogenies of
        sect113r1. Not evaluated: GHS descent with m >= 2 (no executable map),
        the prime-field genus-2 cover Jacobian arithmetic, pairing evaluation,
        isogeny walks to unidentified representatives. Pre-registered check
        F9(a) failed (fitted exponents 0.857 and 0.962 against a threshold of 1;
        the study labels its reading an interpretation). The study says no cost
        cell of any certificate is measured and nothing in it is an ECDLP
        speedup.
