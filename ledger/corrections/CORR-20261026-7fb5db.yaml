    - id: F1
      field: status of the direction, Frobenius merges at n = 31 (crypto PR #2591 RESULTS section 5, "34 observed, 4.4 expected ... not explained")
      corrected_value:
        reviewer_finding: >-
          30 of the 34 merges are exact Frobenius images, because the low-degree
          prefix window is nearly closed under Frobenius when the modulus is
          sparse (x^31 + x^3 + 1: alpha^(2^5) = alpha^4 + alpha). n = 29 is
          mostly birthday (about 9 of 104 structural). n = 17, 19, 23 are at the
          random-window rate.
        verified_here: >-
          matched_null/frobenius_window_closure.py rebuilds the premise from the
          description of find_irreducible_sparse (smallest sparse irreducible; it
          returns x^17+x^3+1, x^19+x^5+x^2+x+1, x^23+x^5+1, x^29+x^2+1,
          x^31+x^3+1 for the five n) and the base definition (abscissae of degree
          below 10; small base degree below 5, 6, 7, 7, 7, read from the names of
          the PR's pilot calibration directories n17_s5 ... n31_s7). Large abscissae
          carrying a point: 479, 490, 444, 447, 460 for n = 17, 19, 23, 29, 31
          (the PR's table has L = 474, 490, 444, 444, 460: equal at n = 19, 23, 31;
          3 and 5 more at n = 29 and 17, which would be window points whose
          cofactor-projected keys coincide or are O; not checked). Merges that exact Frobenius images
          force among them: 41, 6, 0, 10, 30. At n = 31 the window holds 338
          conjugate pairs against 0.015 for a random 1024-element set, and 20.9
          percent of its elements lie in one. So 30 of the 34 observed merges are
          structural by arithmetic (the other 4 against the PR's random-model
          4.4), and at n = 29 10 of 104. At n = 17 the window holds 128 conjugate
          pairs against 127.4 for a random set (window-level random rate).
          The reviewer's attribution of the 30 to exact images is thereby
          reproduced; the receipts were not searched for which pairs merged.
        consequence: >-
          The n = 31 gain over plain double large primes is not evidence of a
          Frobenius effect in the large-prime distribution of a generic base; it
          reflects the base. The PR text calls the excess "a recorded anomaly,
          not a result" and gives an untested hypothesis for the absorb arm
          (low-degree abscissae close under Frobenius for sparse moduli), which
          is the same mechanism.
    - id: F2
      field: status of the direction, what the orbit arm accepts (the proposal's arms are "identical partial streams")
      corrected_value:
        reviewer_finding: >-
          The orbit arm accepts a superset of the plain arm's trials (6 of 25
          primary pairs differ, at most 4 of about 375 relations), so the gain is
          "orbit columns in the collector plus the filter".
        verified_here: >-
          From the 25 primary dlp / dlp_orbit receipt pairs (n = 17, 19, 23, 29,
          31, seeds 1 to 5): accepted_relations differ in 2 pairs, n = 31 seed 1
          (371 against 375) and seed 4 (377 against 379), orbit never fewer; the
          relation_histogram differs in 6 pairs (n = 23 seed 4; n = 29 seeds 1,
          3; n = 31 seeds 1, 2, 4). So the streams are not identical in the
          accepted sets for 6 of 25 pairs, the difference being at most 4 of 375
          accepted trials. The reviewer's mechanism (a decomposition with a third
          large column is rejected by the plain arm and accepted when two of its
          large columns share an orbit) was not separately checked.
    - id: F3
      field: status of the direction, replication unit and caps
      corrected_value:
        reviewer_finding: >-
          The five seeds share one base per curve, so the replication unit for
          the base-geometry effect is the 5 curves; the caps were chosen at the
          knee (at 2x cap the gap is 0 on all five).
        verified_here: >-
          RESULTS section 5 gives one row per curve (L, orbits, merged), not per
          seed: the factor base and the large-prime set are functions of the
          instance and of (small, envelope) dimensions, and the seeds draw the
          residual stream. The dose series (3 seeds) shows the gap in
          independent relations at 0.5x cap of +0.3, +0.7, 0.0, +1.0, +2.0 and
          at 2x cap of +0.3, 0.0, 0.0, 0.0, 0.0 for n = 17, 19, 23, 29, 31. RESULTS
          section 6 states "the gain in independent relations is confined to
          caps where the plain arm's rank is neither near zero nor saturated".
          Caps were fixed from pilot seeds 9001 to 9004 by starving arm (i), not
          by the quantity compared (RESULTS section 8). Whether a cap is "the
          knee" is the reviewer's description; the dose rows are the data.
    - id: F4
      field: status of the direction, the headline numbers
      corrected_value: >-
        Orbit minus plain double large prime, verified independent relations,
        means over 5 seeds: +3.0, +0.6, +0.0, +32.4, +16.0 at n = 17, 19, 23, 29,
        31 (caps 200, 400, 450, 300, 450; m = 3 for n up to 23, m = 4 above). As
        ratios of the arm means in RESULTS section 3: 1.48, 1.02, 1.00, 2.69,
        1.35 (derived by me from the printed means). 17,865 emitted complete
        relations replayed on the curve with 0 failures; recovered scalars equal
        the planted logs in all 186 receipts that recover one; online CPU not
        distinguishable between the arms (CPU per independent relation falls
        only because the yield rises); the study ran no matched rho, no
        Frobenius-closed base and no counted-unit pricing. These are the study's
        own figures, read and not replayed.
    - id: R1
      field: what remains for this direction
      corrected_value:
        - >-
          A Frobenius-closed base, where every large prime has n orbit mates.
          The PR's own arithmetic remark: for a prefix base at cryptographic r
          the expected number of conjugate pairs among L fixed large primes is
          about L^2 n / r, "vanishingly small"; a gain there would have to come
          from a closed base (the compact-orbit regime of
          LEAD-ICB-large-prime-variants). Under a Frobenius-closed base the
          proposal's H1 (uniform orbit labels) and the balance / frame-matroid
          derivation become testable for the first time.
        - >-
          The matched rho comparison of H-BINSTD-555991 (untested), and pricing
          in the counted unit with canonicalisation, hash lookups and modular row
          operations charged.
        - >-
          More than 5 curves for the base-geometry effect, or a base that varies
          with the seed, and a cap sweep that does not stop at 0.5x and 2x.
        - >-
          The lead's own next_action: Stage 0 of EXP-BINSTD-e066d8 and a 1LP /
          2LP arm in the compact-orbit relation stage at n = 53 and 61. The
          study lists, as its own requirements for a size claim, a Frobenius-
          closed base, counted-unit cost accounting, an end-to-end solve against
          matched signed-Frobenius rho, cycle-length budgets at scale,
          multi-target accounting, and independent replay.
