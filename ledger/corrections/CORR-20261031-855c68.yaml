# decision or protocol approval is implied.
# =============================================================================
correction:
  id: CORR-20261031-855c68
  id_provenance: >-
    Minted with `python3 tools/allocate_id.py --next correction --date 20261031`
    and verified free with `python3 tools/allocate_id.py --check`.
  recorded_at: '2026-10-31'
  recorded_by: Codex follow-up to the open PR #2597 review
  authorizing_decision: null
  authorizing_note: >-
    Additive correction to the current PR branch. No research status, approval,
    or experiment protocol is created by this record.
  goal_id: GOAL-ECDLP2M-001
  record_type: research_note
  record_id: research/ecdlp_retrospective_followup_20261026/README.md
  record_location: research/ecdlp_retrospective_followup_20261026/README.md
  related_corrections:
    - CORR-20261026-7fb5db
  sources_read: >-
    The prior correction CORR-20261026-7fb5db and its deterministic program
    `research/ecdlp_retrospective_followup_20261026/matched_null/frobenius_window_closure.py`.
    The formula was checked independently by counting ordered element-neighbor
    incidences and dividing by two for unordered pairs.
  items:
    - id: F1-EXPECTATION
      field: random expected number of unordered Frobenius-conjugate pairs in a uniform window subset
      prior_value: >-
        The earlier output used the expectation formula
        C(s, 2) * 2 * (n - 1) / (2^n - 2), and its discussion described n = 17,
        19, and 23 as at the random-window rate.
      corrected_value:
        formula: 'C(s, 2) * (n - 1) / (2^n - 3)'
        assumptions: >-
          n is prime; the sample is a uniform size-s subset of the 2^n - 2
          field elements outside F_2. Every such element has n - 1 distinct
          non-self Frobenius conjugates. There are C(2^n - 2, 2) candidate
          unordered pairs, of which (2^n - 2)(n - 1)/2 are conjugate.
        expectations:
          n17: 63.689323943876886
          n19: 17.912314866913988
          n23: 1.3682944899658525
          n29: 0.027210392209945575
          n31: 0.007288497882832538
        unchanged_observed_pair_counts:
          n17: 128
          n19: 60
          n23: 54
          n29: 70
          n31: 338
        corrected_interpretation: >-
          The observed window-level pair counts are respectively about 2.01,
          3.35, 39.47, 2572.55, and 46374.44 times the uniform-subset
          expectations. In particular, n = 17, 19, and 23 are not at the
          random-window rate. This comparison does not reanalyze the producer's
          trial stream and does not itself identify which producer trials
          merged.
      verification:
        unit_tests: >-
          `python3 -m unittest research/ecdlp_retrospective_followup_20261026/matched_null/test_frobenius_window_closure.py`;
          includes the full non-F_2 universe at n = 3, the exact n = 17
          expectation, and rejection of composite n.
        regenerated_outputs:
          - research/ecdlp_retrospective_followup_20261026/matched_null/frobenius_window_closure.json
          - research/ecdlp_retrospective_followup_20261026/matched_null/frobenius_window_closure.txt
        unchanged_claim: >-
          The 30 exact Frobenius merges among the 34 reported n = 31 merges are
          not changed by this correction. The matched-null figure and PDF use
          the separate `output.json` and do not plot this expectation.
  what_this_does_and_does_not_change:
    status_transitions: none
    experiment_protocol_or_approval: none
    observed_window_counts: none
    producer_trial_receipts: none
    files_corrected_additively:
      - research/ecdlp_retrospective_followup_20261026/README.md
      - research/ecdlp_retrospective_followup_20261026/matched_null/frobenius_window_closure.py
      - research/ecdlp_retrospective_followup_20261026/matched_null/frobenius_window_closure.json
      - research/ecdlp_retrospective_followup_20261026/matched_null/frobenius_window_closure.txt
      - research/ecdlp_retrospective_followup_20261026/matched_null/test_frobenius_window_closure.py
      - ledger/corrections/CORR-20261031-855c68.yaml
