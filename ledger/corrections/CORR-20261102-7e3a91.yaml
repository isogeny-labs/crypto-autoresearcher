  prior_value: >-
    The FHJRV polynomial-ring form is unavailable for EcGFp5-shaped double-odd
    curves, because b is a non-square in F_q and E(F_q) has only one rational
    2-torsion point. Stated without restriction on the coordinate.

  corrected_value: >-
    The sentence holds for coordinates phi with phi(-P) = phi(P), i.e. the
    Kummer / x class, whose deck involution is P -> -P. For those, the ring
    form for the 2-torsion action needs b a square or full 2-torsion, and
    double-odd curves have neither. It does NOT hold for the second degree-2
    class.
    - On a double-odd curve, degree-2 coordinates over F_q fall into exactly
      two inequivalent classes: Kummer (x, involution P -> -P) and u = x/y
      (involution P -> N - P), where N = (0, 0) is the rational 2-torsion
      point.
    - Derivation (two lines, checkable): on y^2 = x(x^2 + a x + b),
      P + N = (b/x, -b y/x^2). So u(P + N) = (b/x) / (-b y/x^2) = -x/y =
      -u(P), and u(-P) = -u(P). The audit also checked u(P + N) = -u(P)
      numerically on 200 points at p = 4111.
    - Consequently the summation system in u is invariant under even sign
      changes and S_m, and its quotient lies in a polynomial ring:
      H_R = A(s) + pi B(s), in K[s_1, ..., s_{m-1}, pi], with
      s_k = e_k(u_i^2), pi = prod u_i and the two-term quadric s_m - pi^2.
      This is the FHJRV Prop. 13 shape. That proposition does not need
      phi(-P) = phi(P) (audit reading of FHJRV).
    - Measured ideal degree, equal to 2^{(m-1)^2}, with the planted point
      recovered in every case: D = 16 at m = 3 (p = 4111 and 262231) and
      D = 512 at m = 4 (p = 4129 and 262153). The main session re-measured
      the m = 4, p = 4129 cell with msolve.
    - m = 4 is even. The rescaled lambda construction recorded in the last
      bullet of CORR-20260923-064d0d needs odd extension degree, so the u
      ring form also covers a case that construction does not.
    - At m = 5 the u system would have 6 unknowns of degrees (8,8,8,8,8,2),
      with the same supports as the current quotient (1287 and 792 terms) and
      s_5 - pi^2 replacing the dense w^2 - Q(s). That cell has NOT been run.
      The audit expects D = 65,536 and no degree fall. That is an
      expectation, not a measurement.
    Every other bullet of CORR-20260923-064d0d is untouched, including the
    lambda construction and its square-analogue degrees.

