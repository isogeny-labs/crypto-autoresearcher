    - coordination/tasks/TASK-20261019-bbb351/validation_report.yaml and experiments/EXP-CMFB-cea1d2/reviews/red-team/red_team_report.yaml (both quote the ceiling as established; not edited)
  items:
    - id: C1
      field: "the statement that coverage ratio against a matched random base is at most min(1, mu)/(1 - e^-mu) <= 1.582 for every base at every N, described as a theorem"
      prior_value: >-
        EV-CMFB-e3d1ec, DEC-20261019-f33f3e, the review report and analysis.md
        describe min(1, mu)/(1 - exp(-mu)) <= 1.582 (maximised at mu = 1) as a
        universal theorem supplied by the conservation identity (KN-FIND-007,
        EXP-FB3-001/conservation.md), and use it to say that "more than a
        constant" follows before any run.
      corrected_value: >-
        Three statements must be kept apart.
        (1) EXACT IDENTITY, proved: for any base of B distinct group elements,
        sum_r c(r) = binomial(B+2, 3) over all targets r in Z_N
        (EXP-FB3-001/conservation.md). Its mean per target is mu = binomial(B+2,3)/N.
        (2) EXACT BOUND, proved from (1): the coverage fraction of any base
        satisfies cov <= min(1, mu). The multiplicity distribution c(r) is left
        free by the proof; conservation.md itself says the bound is on coverage
        by the mean, not by the coverage of a random base.
        Consequence: for any SPECIFIED positive baseline coverage c0, the ratio
        cov/c0 <= min(1, mu)/c0. That is a bound relative to c0, and it is
        exactly as strong as the knowledge of c0.
        (3) CONDITIONAL MODEL ESTIMATE, not proved: if the random base's
        coverage is taken to be the Poisson occupancy value c0 = 1 - exp(-mu)
        (heuristic H2 of H-CMFB-9b2eed), then min(1, mu)/c0 = 1.582 at mu = 1.
        This substitutes a model for the baseline. It is a model-conditional
        estimate of the headroom, not a universal finite-instance ratio
        theorem, and it supplies no end-to-end cost result.
        What survives: the exact identity (1), the exact absolute bound (2),
        and the empirical small-x coverage comparison of this experiment with
        its stated scope. What changes: wherever the records say "theorem" or
        "ceiling of at most 1.582 for every base", read "model-conditional
        estimate under H2". The observation that a Bose-Chowla base reaches
        1.1071 on the same instrument is consistent with the estimate and
        proves nothing about it.
    - id: C2
      field: "the sentence that 'the small-x channel cannot beat a constant' follows from a theorem before any run"
      prior_value: >-
        analysis.md Inference 5 and DEC-20261019-f33f3e rationale say the
        constant-only reading follows from the ceiling theorem independent of
        the run.
      corrected_value: >-
        It follows from (2) only relative to a stated baseline coverage c0, and
        from (3) only under H2. The run supplies measured random-base coverage
        directly (the recorded random_seen counts of the 200 matched bases per
        member), so the baseline c0 is available empirically for every cell and
        the bound min(1, mu)/c0 can be computed from the recorded data rather
        than from the Poisson formula. That computation has not been done in
        this correction.
