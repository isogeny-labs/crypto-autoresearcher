# records keep their text; this record supplies the corrected reading beside
# them. No measured value, count, interval, classification or decision
# transition changes.
# =============================================================================
correction:
  id: CORR-20261019-a89bfa
  recorded_at: '2026-10-19'
  recorded_by: coordinator
  type: overstated_claim_scope
  severity: interpretation_only
  record_type: evidence
  record_id: EV-CMFB-e3d1ec
  also_concerns:
    - ledger/decisions/DEC-20261019-f33f3e.yaml (decision rationale, scoped claim and limitations)
    - ledger/hypotheses/H-CMFB-9b2eed.yaml (interpretation_limits and status note)
    - experiments/EXP-CMFB-cea1d2/analysis.md (Inference 5 and the closing cost paragraph)
    - experiments/EXP-CMFB-cea1d2/reports/review-DEC-20261019-f33f3e/report.typ and report.pdf
