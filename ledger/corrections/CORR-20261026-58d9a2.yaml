    - id: C1
      field: pair supply (minimal_test design, "add intermediate-level and composite-ratio pairs")
      corrected_value: >-
        The panel found 3 random-binary pairs (n = 17, 19, 23 with ell = 17, 41,
        23), from a scan of 600 random curves per degree with the Koblitz traces
        excluded; a scan for ell at least 60 over 3000 curves per degree found
        none (pairs/binary_pairs_large_ell.json). Extension-field pairs were
        "not attempted (no explicit-curve constructor in ecbench)". The binary
        arms the proposal needs for SAT and F5 therefore have three pairs to
        draw on until a constructor or a larger scan supplies more, and ten
        paired seeds per pair do not enlarge the number of pairs.
    - id: C2
      field: WDSat named as an arm (predictions[0].minimum_effect, "per arm (CryptoMiniSat-XOR, WDSat, F4, F5)")
      corrected_value: >-
        In the matrix runs of this lineage WDSat was unavailable ("WDSat, msolve
        and Sage executables were unavailable; no numbers are imputed to them",
        crypto research/notes/ecc2k130/m83_solver_matrix_20260927/RESULTS.md;
        the same list in crypto PR #2584's preflight). The proposal does not
        state installing WDSat as a precondition, so one of its four named arms
        is not runnable as written. If it stays unavailable the arm is
        "not run", never a null.
    - id: C3
      field: arms on prime-field pairs
      corrected_value: >-
        The panel's 38 prime-field pairs ran fiber-closed MITM and rho only;
        the F4 solving degree is measured on the 8 binary and Koblitz pairs (panel
        README, section 1B and the Part B table). The proposal's claim covers
        "matched pairs of ordinary curves" and names SAT, F4 and F5 arms; no
        prime-field SAT or F4 arm has been run on any pair. I did not search the
        crypto tree for a prime-field point-decomposition solver engine, so this
        is a statement about the runs, not about what exists.
    - id: C4
      field: binary-only SAT and F5 arms under the prime question RQ-ECTD-001
      corrected_value: >-
        The record's own scope flag says binary pairs lie outside RQ-ECTD-001's
        prime field_types, and SAT and F5 are defined only on the Weil-descended
        binary systems. The consequence for the question it is filed under: the
        SAT / F4 / F5 evidence this proposal could produce is binary evidence,
        and the prime question RQ-ECTD-001 would receive none from it. Re-homing
        the binary arm (the notes name RQ-BINSTD-b6f698) is a Coordinator act.
    - id: C5
      field: falsification_conditions[0] parenthesis
      prior_value: "(closes the SAT/F4/F5 families at the tested levels)"
      corrected_value: >-
        "closes the SAT, F4 and F5 arms at the tested pairs": three binary pairs
