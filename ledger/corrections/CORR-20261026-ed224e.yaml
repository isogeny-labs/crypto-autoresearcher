# =============================================================================
# CORR-20261026-ed224e -- lead-atlas mapping and escape-premise statements for
# the five retrospective-lead proposals IDEA-20261011-{049724, 07c83f, 6bdbe2,
# dcfc4d, fb7b7e} (merged in PR #2588).
#
# WHY. The ids are dated 20261011 and the records say `added: 2026-10-26`.
# tools/validate_ledger.py keys the lead rule on the id date prefix
# (LEAD_CUTOVER = 20261025, check_prior_art_lead), so it exempts them and none
# carries `prior_art.lead`. The contract does not exempt them:
# agents/idea-generator.md requires an ECDLP idea to find its lead, to advance
# an open lead's next_action or say why a different step discriminates better,
# and, under a closed lead, to state which premise of the obstruction it
# escapes ("an idea that cannot do so is a duplicate, and you do not file it").
#
# ADDITIVE. The five proposals, their notes and the filing README are not
# edited. This record maps and states; it closes, rejects, ranks and approves
# nothing, and edits no atlas row (coverage rows are listed for the atlas
# reviewer to append).
# =============================================================================
