  mapping:
    IDEA-20261011-049724:
      title_short: Lead 1, phase-aware Frobenius summation
      primary_lead: LEAD-ICB-frobenius-search-symmetry
      primary_disposition: closed_obstructed (kind proof; revisit_when = a genuine stabilizer of one target, or an equivariant elimination that applies to the production pipeline)
      other_leads:
        - LEAD-ICB-frobenius-orbit-factor-base (closed_obstructed, kind proof; gain exactly n on relations, n^2 on linear algebra, never more)
        - LEAD-ICE-decomposition-probability-audit (open_next_step; the third lead hit of --match, not named by the review)
      escape_premise_statement: >-
        It escapes none of the recorded premises. It is a re-measurement of the
        closed Frobenius leads, not a new mechanism. By premise: (1) Frobenius
        is an equivariance between conjugate targets, not a per-instance
        symmetry (H-BINSTD-74b002, supported): the proposal does not claim a
        per-instance symmetry; phases are unknowns inside one system, which is
        the sound orbit system, consistent with the premise. (2) Fixed-target
        tau-orbit CNF clauses are unsound (H-BINSTD-c3d68f, supported): not
        used. (3) Sound orbit encodings cost at least 0.95 times the plain
        single-instance search: NOT escaped. Arm B is a (representative, shift)
        one-hot encoding of the kind KN-FIND-47da4e priced at 1.00 to 1.47 times
        the n separate systems it replaces (m = 2, n = 13 to 23, never below 1;
        confidence unverified, promotion gate unmet) and H-BINSTD-c72284
        (approved) preregisters at 0.95 or more on stable subspaces (arity 2
        and 3, n in {17, 23, 31}). The proposal's cell (n = 13, four summands,
        an orbit union from a seeded subspace of ker Tr) differs from those
        cells in n and arity; that is a difference of tested scope (core rule 6)
        and not a feature that puts the encoding outside the premise. (4) The k
        conjugates of a relation are one row in the orbit basis; on a non-
        stable base the n conjugates of a target are n attempts: the proposal's
        own derivation ("matrix width stays the number of representatives while
        the effective base is n times wider") is this fact, and its n-fold
        yield is the "exactly n on relations" of LEAD-ICB-frobenius-orbit-
        factor-base. (5) Equivariant elimination: not used.
        The comparator is the second problem. The premise's plain comparator is
        the unquotiented search over the same effective base (65 abscissae at
        n = 13). The proposal compares arm B with arm A, which searches a base
        n times smaller (5 abscissae) and so cannot decompose 8 of the 12
        frozen targets; the per-relation difference between the arms is
        therefore partly the base-size effect the orbit-factor-base lead already
        prices. The unquotiented comparator is not measured.
        By the rule in agents/idea-generator.md this makes the proposal a
        duplicate of a closed lead, which would not be filed today. This record
        states that and nothing more: it does not close, reject or re-rank
        (Coordinator acts). Status of the measurement itself: CORR-20261026-f50bf6.
      lead_for_prior_art_if_refiled: LEAD-ICB-frobenius-search-symmetry
    IDEA-20261011-07c83f:
      title_short: Lead 2, conductor-gap paired relation cost
      primary_lead: LEAD-ICE-curve-presentation-invariance
      primary_disposition: open_next_step (next_action = execute EXP-DREG-dd668d, last-fall and grevlex solving degree on certified toy Velu edges; discriminates a drop beyond random enrichment from none)
      other_leads:
        - LEAD-STR-isogeny-class-generic-invariance (closed_obstructed, kind theorem; isogenous curves have isomorphic prime-order subgroups, rho and BSGS see only the group order and Aut; 403,168 runs, rho floor/crater 1.004 [0.990, 1.016]; revisit_when = a generic-model algorithm whose cost depends on more than the group and Aut, or a level-dependent step cost)
        - LEAD-ICP-isogeny-transported-relation-yield (open_blocked = 17 missing arms of EXP-ECTD-0cf008 after the recovery amendment; blocked_by problems/prime-field-arity3-relation-oracle.md; best measured IC floor/crater 0.975 [0.603, 1.451] at ell = 8209 and 1.127 [0.922, 1.342] at ell = 131101)
      escape_premise_statement: >-
        Under the closed generic-invariance lead the premise is that the cost
        measured depends only on the group and Aut. The proposal measures the
        cost of algebraic systems (SAT, F4, F5 on a Weil-descended system), a
        function of the equation and not of the group element
        (coordinate-dependent in IDEA-20260806-c5d183), which is the case the
        lead's own revisit_when names. So it is not a duplicate of the closed
        lead: it escapes that premise by construction. It then sits under the
        two open leads, advances neither next_action as written (those are
        Groebner degree on Velu edges and prime arity-3 yield; the proposal adds
        SAT and F5 arms, intermediate levels and a seconds-per-verified-relation
        endpoint on binary pairs), and does not say why that step discriminates
        better. The measured results under both open leads are null at the tested
        cells (ICC 0.000 to 0.015 at n = 23 and 31; IC floor/crater 0.975 and
        1.127).
      lead_for_prior_art_if_refiled: LEAD-ICE-curve-presentation-invariance
    IDEA-20261011-6bdbe2:
      title_short: Lead 3, orbit-aware double large prime graph
      primary_lead: LEAD-ICB-large-prime-variants
      primary_disposition: open_next_step (next_action = Stage 0 of EXP-BINSTD-e066d8 (large-prime rows of the KN-FIND-aa2efc free-oracle floor) plus a 1LP/2LP arm in the compact-orbit relation stage at n = 53 and 61, paired against the incumbent in the counted unit; large_prime_filter.rs is the starting point)
      other_leads:
        - LEAD-ICE-relation-graph-rank-large-prime (open_next_step = extend the honest 2LP summation-multigraph run EXP-RELN-c5a377 v4 to larger q with a rewire / Erdos-Renyi null)
        - LEAD-ICP-residual-partial-relations (open_next_step; the first lead hit of --match)
      escape_premise_statement: >-
        The lead is open, so no premise needs escaping. The proposal advances the
        lead but not its written next_action: the lead asks for Stage 0 and an
        arm at n = 53 and 61 in the counted unit; the proposal measures toy
        Koblitz cells n = 17 to 41 by independent verified relations with
        +-lambda^k gains, which its own notes call "a sharpening of Stage 1 of
        H-BINSTD-555991". It does not say why that smaller step discriminates
        better. That measurement has since been made (crypto PR #2591); see
        CORR-20261026-7fb5db.
      lead_for_prior_art_if_refiled: LEAD-ICB-large-prime-variants
    IDEA-20261011-dcfc4d:
      title_short: Lead 4, solver selection by total verified-relation cost
      primary_lead: LEAD-ICP-icperf-binary-pdp-solver
      primary_disposition: open_next_step (next_action = H-ICPERF-c9380d, a Boolean-native Groebner column (BRiAl) with an RSS watchdog on l in {5, 6} and WDSat installed on the runner; discriminates a structural SAT-over-Groebner gap from an engine-availability artifact)
      other_leads:
        - LEAD-ICE-boolean-f4-f5-f6-engines (closed_dominated by LEAD-ICE-rootfind-pairtable-oracle on Koblitz and random-binary n <= 31, m in {2, 3, 4}; priced inherited F4 about 22x to 33x strong rho at n13; revisit_when = pair table infeasible and algebraic degree bounded, or a priced engine beats the MITM floor slope on 3 or more cells)
        - LEAD-ICE-rootfind-pairtable-oracle (open_blocked; the dominating lead; the second lead hit of --match)
      escape_premise_statement: >-
        The proposal does not claim a faster engine, so the domination premise
        (the pair-table oracle is cheaper than any priced engine at the tested
        cells) is neither challenged nor escaped; its own `dominated_by` says FES
        at six variables dominates every engine at s = 2. The m = 83 tiny-base
        cells lie outside the n <= 31 cells that closed the engine lead, which is
        a scope difference. It is a cost-accounting measurement under the open
        ICPERF solver-choice lead and supplies a column definition (total
        charged cost) that the lead's boundary table needs; it does not advance
        the BRiAl / WDSat next_action as written. Since filing, crypto PR #2584
        has run it; see CORR-20261026-2cc304.
      lead_for_prior_art_if_refiled: LEAD-ICP-icperf-binary-pdp-solver
    IDEA-20261011-fb7b7e:
      title_short: Lead 5, automated transfer audit
      primary_lead: LEAD-TRF-cover-catalog-jacobian-transfer
      primary_disposition: open_blocked (next_action = even-degree Mumford arithmetic and the general binary norm phi_* = Jac(H) -> E, then certify subgroup order, kernel and image per binding; blocked_by three crypto problems/ records, the last "catalog-cover-subgroup-certificates-incomplete" = 663 of 664 bindings lack proof-grade certificates)
      other_leads:
        - LEAD-TRF-curve-parameter-transfer-audits (closed_known, kind literature; SafeCurves-type checks are standard; revisit_when = an audit finds a deployed curve with small k, trace one, or a composite-degree binary field in use)
        - LEAD-TRF-ghs-binary-composite and LEAD-TRF-mov-small-embedding-degree (closed_known) and LEAD-TRF-same-field-genus-g-embedding (closed_obstructed), from --match
      escape_premise_statement: >-
        The proposal is tooling, class `tooling`, and claims no mechanism, so it
        has nothing to escape and, under the closed_known leads, claims nothing
        new in scope (its own mechanism paragraph says so). Under the open_blocked
        lead it does not unblock the next_action: executable Jacobian arithmetic
        and norm maps are what the lead needs and what the tool reports as
        not_evaluated (crypto PR #2594, RESULTS section 3).
      lead_for_prior_art_if_refiled: LEAD-TRF-cover-catalog-jacobian-transfer
