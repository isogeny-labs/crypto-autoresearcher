  id: CORR-20261029-1aaef6
  id_provenance: Minted with tools/allocate_id.py --next correction --date 20261029 and confirmed free with --check.
  recorded_at: '2026-10-29'
  recorded_by: coordinator
  decided_under: DEC-20261029-01405d
  record_type: claim
  record_type_note: >-
    The corrected object is one supporting sentence that appears in several records of the round, not a run or
    a candidate.
  record_id: EV-PFDR-07d608
  also_corrects:
    - ledger/evidence/EV-PFDR-07d608.yaml (analysis INF-3; obstruction statement, quantity and summary)
    - experiments/EXP-PFDR-bb0d26/analysis.md (Inference I3)
    - knowledge/findings/KN-FIND-c81e5b.md (Finding, "The instrument could have seen a deviation" list)
    - experiments/EXP-PFDR-bb0d26/reports/review-DEC-20261029-01405d/report.typ and report.pdf (Inference, third bullet)
  field: label-AP detectability bound
  prior_value: >-
    "planted-type label-AP substructure is detectable from about 2 to 47 labels" (0.3% to 3.2% of n), described
    as a scaling estimate, taken from the red team's experiments/EXP-PFDR-bb0d26/review/TASK-20261029-ff0453/
    rt_ap_bound.py and rt_ap_bound.json, and used to say these label sets carry no label-AP structure beyond that
    size.
  corrected_value: >-
    No label-AP size bound is claimed. What the controls establish is unchanged: the planted label AP of the
    frozen plant-size rule (internal coincidences at least 0.30 x the null mean) is read flagged in all 44 powered
    cells, and in the weakest powered cell a true homogeneous |kappa - 1| of at least 0.079 would have read non-null
    with 95% probability. The statement "an additive label predicate for these label sets is not supported at these
    sizes" stands without a size figure.
  reason: >-
    The count C(X) counts coincidences between disjoint unordered pairs, so any set of fewer than four labels has
    exactly zero internal coincidences. rt_ap_bound inverts an assumed cubic signal, which gives bounds of 2.0 to
    2.6 labels for the 28-bit n = 256 cells, a regime where the cubic signal does not apply. The bound is therefore
    unvalidated at the sizes reported (Codex review finding on PR #2693, discussion r4409282663). A discrete
    planted-prefix recount under the stated detection rule would be needed before any size bound is stated.
  effect: >-
    None on the decision: DEC-20261029-01405d stays support (scoped), EV-PFDR-07d608 strength strong, claim tier
    toy, and H-PFDR-727bfc stays supported at the tested toy scope. No rationale, status transition or knowledge
    promotion rested on the bound. Readers of the records listed in also_corrects read the sentence as withdrawn.
    The red-team report and script stay as written; they are the reviewer's record.
  evidence_artifacts:
    - experiments/EXP-PFDR-bb0d26/review/TASK-20261029-ff0453/rt_ap_bound.py
    - experiments/EXP-PFDR-bb0d26/review/TASK-20261029-ff0453/rt_ap_bound.json
