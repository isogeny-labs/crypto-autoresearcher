  corrections:
  - record_type: patient_supervisor
    record_id: tools/experiment_execution.py
    field: driver command comparison
    prior_value: a driver manifest command spelling the same interpreter as an absolute
      sys.executable path was rejected as contradicting a bare python3 launched argv
    corrected_value: accept shlex.join([sys.executable, *launched[1:]]) as a spelling
      of the launched argv
    reason: The driver and supervisor resolve to the same Python; the bare name and
      its absolute path are the same command. The check still rejects a different
      interpreter or any different argument.
  - record_type: implementation
    record_id: experiments/EXP-PFDR-2d36f9/implementation/run.py
    field: _load artifact reader
    prior_value: opened only the plain path; census jobs >= 1 MiB are stored as main-jobs.jsonl.gz
      by the artifact policy, so analyze-main and analyze-final could not read them
    corrected_value: _load reads path + ".gz" transparently when the plain path is
      absent (gzip.open text mode); no counting or analysis logic changed
    reason: The artifact store gzips large run files. Reading the stored form is the
      artifact policy, not a scientific change.
  - record_type: trial_plan
    record_id: experiments/EXP-PFDR-2d36f9/trial-plan.json
    field: reanalysis-ca5e01 inputs_from
    prior_value: ../EXP-PFDR-ca5e01/runs/... resolved under experiments/EXP-PFDR-2d36f9/
      and missed the committed predecessor runs
    corrected_value: ../../EXP-PFDR-ca5e01/runs/... resolves to experiments/EXP-PFDR-ca5e01/runs/
    reason: The descriptive R5 re-analysis must read the committed EXP-PFDR-ca5e01
      outputs from the repository experiment directory.
