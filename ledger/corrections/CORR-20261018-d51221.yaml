correction:
  id: CORR-20261018-d51221
  recorded_at: '2026-10-24'
  record_type: shared_code_archive_impact_measurement
  record_ids:
  - CORR-20260813-d9f0fa
  - EXP-MTIC-001
  - EXP-FIB-001
  - EXP-ICINV-e0cd8f
  - EXP-SEMAEV-93d5cc
  - EXP-SEMAEV-6e9dcf
  decided_by: coordinator
  decision_id: DEC-20261018-3b4a32
  evidence_id: EV-SEMAEV-593b7a
  successor_of: CORR-20260813-d9f0fa
  context: >-
    CORR-20260813-d9f0fa accepted the shared s4_expr repair, named EXP-MTIC-001
    (11 runs) and EXP-FIB-001 (10 runs) as exposed, and barred comparison of
    their archived outputs with post-repair outputs until a matched additive
    rerun was reviewed. The 2026-10-18 audit
    (docs/reports/2026-10-18-semaev-s4-factor-base-audit.md) found a third
    consumer, RUN-ICINV-e0cd8f-m3class. The matched rerun EXP-SEMAEV-93d5cc
    (with successor EXP-SEMAEV-6e9dcf for its mtic-010b cell) ran every
    archived cell that calls s4_expr with the exact legacy bytes and with
    the repaired function, concurrently, and its legacy arm reproduced every
    deterministic archived field. This record states, per archived run and
    field, what the defect changed. No archived artifact is edited.
  extends_affected_families:
  - experiment_id: EXP-ICINV-e0cd8f
    run_id: RUN-ICINV-e0cd8f-m3class
    direct_consumer_path: harness/exp_icinv_e0cd8f_m3class.py (s4_generators, compute_curve_m4)
    note: added to the families of CORR-20260813-d9f0fa; its m3 stage does not call s4_expr
  per_run:
  - archived_run: RUN-ICINV-e0cd8f-m3class
    superseding_run: RUN-SEMAEV-9cab7b
    fields_changed:
    - field: m4.s4_support and gauge.m4.s4_support (control-set-invariants.json, per-curve-invariants.json)
      archived: 227 on 546 records, 225 on 4, 210 on 2
      repaired: 439 on 550 records, 391 on 2
    - field: m4.singular_locus_dim / singular_locus_degree (and gauge)
      archived: 2 / 60 on all 552 records
      repaired: 2 / 39 on all 552 records
    fields_unchanged:
    - m4.singular_locus_is_unit_ideal (false everywhere)
    - gauge m4 agreement (276/276)
    - every m3 field and the CLASS-VARYING verdict (no s4_expr on that path)
    recorded_conclusion_effect: >-
      The verdict and EV-ICINV-8afb64 are unaffected (they rest on m3 families
      and cite no m4 number). The archived m4 secondaries are superseded by
      RUN-SEMAEV-9cab7b's repaired-arm values. DEC-20260811-a3398a's
      next_actions statement that the m4 secondaries "were not computed in this
      run" is inaccurate: they were computed, with the defective polynomial.
  - archived_run: RUN-FIB-004
    superseding_run: RUN-SEMAEV-3e69b6
    fields_changed:
    - field: C16-1 per-target groebner_basis_size / groebner_basis_max_degree
      archived: sizes 3 (16) and 4 (184), max degree 5
      repaired: sizes 14 to 19, max degree 5 (91) or 6 (109)
    - field: C16-1 cost_seconds (median)
      archived: 0.0279 s (legacy rerun on this host 0.0579 s)
      repaired: 3.678 s
    - field: C16-2 n_measured and stop_reason
      archived: 75, per_curve_cumulative_cap_1500s
      repaired: 31, per_run_wall_cap_1800s (the slower C16-1 consumed the run cap)
    fields_unchanged:
    - C16-1 capped count (0), trivial ideals (0), resource_exhaustion (false)
    - C16-2 all measured solves capped, resource_exhaustion (true)
  - archived_run: RUN-FIB-005
    superseding_run: RUN-SEMAEV-4be606
    fields_changed: []
    fields_unchanged:
    - C20-1 75 and C20-2 15 measured, all capped, stop reasons, resource_exhaustion (true)
    note: every measured solve hits the 20 s cap in both arms
  - archived_run: RUN-FIB-006C (with the RUN-FIB-007 ratio and the RUN-FIB-008 gate)
    superseding_run: RUN-SEMAEV-894e27
    fields_changed:
    - field: C16-1 correlation.rho_s (p)
      archived: -0.024 (0.742)
      repaired: -0.366 (permutation p < 1e-4); legacy rerun -0.097 (0.171) is the timing A/A
    - field: C16-1 predictor-cost ratio
      archived: 8.6e-6
      repaired: 6.5e-8
    fields_unchanged:
    - correlation_gate_curves_passing (none), correlation_gate_pass_overall (false)
    - per_curve_status, predictor_cost_gate_pass (true), gate_pass (false), RUN-FIB-008 cancelled_by_gate
    recorded_conclusion_effect: >-
      The gate decision stands. The C16-1 association moves from the
      EXP-FIB-001 falsification band (|rho_s| < 0.2) to its inconclusive band
      (0.2 <= |rho_s| < 0.4), so the archived per-curve reading of no
      association at C16-1 is an artifact of the defect.
  - archived_run: RUN-MTIC-007
    superseding_run: RUN-SEMAEV-2a8498
    fields_changed: []
    fields_unchanged: [16-bit attempted 25, capped 25, cancelled 25, T_desc median 60 s (cap)]
  - archived_run: RUN-MTIC-008
    superseding_run: RUN-SEMAEV-fcd67c
    fields_changed: []
    fields_unchanged: [20-bit 13/13 and 24-bit 12/12 attempted/capped, T_desc medians at the 60 s cap]
  - archived_run: RUN-MTIC-010b
    superseding_run: RUN-SEMAEV-0e5876
    fields_changed: []
    fields_unchanged: [regime (i) and K* infinite under all accountings at 16, 20 and 24 bits; ablation K* infinite at B = 52 and 115, all ablation solves capped]
  immune_by_import:
  - RUN-MTIC-001..006, RUN-MTIC-009 (no s4_expr call)
  - RUN-FIB-001..003 (no s4_expr call)
  - RUN-MTIC-010 and RUN-FIB-006/006B (superseded in the archive by -010b and -006C, whose cells were rerun)
  corrected_claim: >-
    Archived MTIC (007, 008, 010b) and FIB-005 outputs are numerically
    unaffected by the defect within their caps and may be compared with
    post-repair outputs; the comparison bar of CORR-20260813-d9f0fa is lifted
    for those fields. The archived ICINV m4 secondaries and the RUN-FIB-004
    C16-1 cost, basis and C16-2 count fields, and the RUN-FIB-006C C16-1
    correlation and ratio, are superseded by the repaired-arm values above;
    the archived numbers stay immutable and must not be cited as exact-S4
    results.
  integrity_effect:
    archived_artifacts_edited: false
    archived_content_binding_intact: true
    archived_result_validity_changed: false
    archived_numerical_results_superseded_for_fields_above: true
    matched_rerun_completed: true
  status_effects:
    official_research_state_changed: false
    hypothesis_status_changed: false
    note: >-
      H-MTIC-001, H-FIB-001 and H-ICINV-d5e351 keep their status; the FIB
      C16-1 band change is routed to a Coordinator review of H-FIB-001
      (DEC-20261018-3b4a32 next_actions).
  limitations:
  - Toy tier; one execution per arm; timing-derived values (medians, rho_s) carry the A/A spread recorded in EV-SEMAEV-593b7a.
  - Wall-clock caps are host-dependent; the legacy arm reproduced the archived truncation on this host.
  - No ECDLP, cost, speedup or security claim.
