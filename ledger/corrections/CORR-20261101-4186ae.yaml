  corrected_value: >-
    Under the literal >=, each quantity collapses to 1 + (least degree of a nonzero element of the
    ideal it is computed from), as section 3 says. The inequality therefore holds emptily only when
    both sides use the same ideal, which is the INSIDE placement (true side F u S_fe). In the
    placement printed in Lemma 4 (true side {f_1..f_M} alone, fake side F u S_fe) the two ideals
    differ: for witness A, <X^2 Y, X Y + X> has least nonzero degree 2 while <F> + S_fe contains X;
    for witness B, <F> has least nonzero degree 2 while <F> + S_fe contains X_2 + X_3. Hence
    d_F^>=(F) = 3 and d'_F^>= = 2, and Lemma 4 as printed is FALSE under the >= reading as well.
    Boundary 3 applies to the inside placement only. The title's "under the equality reading of
    condition (1), in every placement" remains true; it is not the strongest true statement for the
    printed placement, which fails under both readings. Content of KN-FIND-936151 otherwise unchanged.
  evidence_tier: >-
    Reviewer computation, not a Lean theorem: BATCH-4c1c67 J1 finding F1 (Sage 10.9 Groebner bases
    over GF(2), raw/ge_reading_check.*, raw/ge_fake_check.*) and, independently and blind, J2's nearby
    control 1 (d_F under the lower-bound-only condition: A_F 3, A_F+S_fe 2, B_F 3, B_F+S_fe 2). The Lean
    modules encode the equality reading only.
  reason: >-
    Section 3's collapse argument is correct per ideal but was applied as if both sides shared one
    ideal. Both J1 and J2 of BATCH-4c1c67 found that the printed placement still fails under >=.
