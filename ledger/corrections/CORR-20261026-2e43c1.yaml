# ADDITIVE. EV-BINSTD-769c7c, DEC-20261001-fe73db, H-BINSTD-fe6b59 and
# EXP-BINSTD-cedae5 are not edited. This record changes no status, writes no
# reject_scoped, closes no lead and ranks nothing: it states a measurement, its
# scope, and what to re-review. Closing anything would need an obstruction block
# (inventor protocol); this is not that. Zero experiment runs. The only
# computation is two small local Python programs whose source and output are
# committed beside this record.
# =============================================================================
