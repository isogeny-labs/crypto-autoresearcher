    output: research/ecdlp_retrospective_followup_20261026/matched_null/output.json (summary.txt is its plain-text table; matched_null.svg and matched_null_report.pdf draw it)
    sha256_program: 572b206de59e0c8611e9fc6a7975ba9052e9edc50b0e02f472b6a00fea9cca26
    command: python3 matched_null_check.py --out output.json   # seed 20261026, 20 generic windows per cell, 8 random x-set windows per cell
    environment: python 3.13.16, numpy 2.5.3
    independence: >-
