    instrument_checks: >-
      For both cells: affine point count + 1 equals the stated group order
      (130,412 and 523,492); N x (random point) = O on 6 points; the vectorised
      x(P+Q) equals a separate scalar affine group law on 200 random pairs.
    reproduction_of_the_producers_census:
      n17_RC1:
        field: GF(2^17), modulus x^17 + x^3 + 1, y^2 + xy = x^3 + 97044 x^2 + 126251, #E = 130412, window deg(x) < 9
        values: >-
          |V| 483, T 116,162, identity-sum pairs 241, combined 160,633, distinct
          keys 38,445, max multiplicity 16, ratio 3.1049467736501195, S_fit
          42001.36: all equal to stage1/census-V.yaml.
      n19_koblitz:
        field: GF(2^19), modulus 0x80027, y^2 + xy = x^3 + 1, #E = 523492, window deg(x) < 10
        values: >-
          |V| 1005, T 504,008, identity-sum pairs 502, combined 735,192, distinct
          keys 161,827, max multiplicity 18, ratio 3.0301627673119564, S_fit
          172760.36: all equal to stage5/n19-census.yaml.
    matched_null:
      trivial_partner_collisions: >-
        58,081 at n=17 and 252,004 at n=19, each exactly T/2, measured as the
        number of attempts whose partner pair {-P,-Q} is a valid attempt with the
        same key, halved; no attempt is its own partner. So 36.2 percent (n=17)
        and 34.3 percent (n=19) of the reported "combined relations" are
        vacuous.
      nontrivial_collisions: >-
        102,552 (n=17) and 483,188 (n=19), against the uniform sign-folded
        expectation 103,467.7 and 485,247.7 (ratios 0.9911 and 0.9958).
      generic_simulation_matched_on_both_features: >-
        20 random windows each, negation-closed with one self-negative element,
        keys min(L, N-L): reported-style ratio 3.1088 +/- 0.0199 (n=17, N =
        130,412, |V| = 483) and 3.0297 +/- 0.0092 (n=19, N = 523,492, |V| =
        1005), against the curve's 3.1049 and 3.0302. The curve's nontrivial
        collision count is 102,552 against 102,749.8 +/- 1,031.5 (z = -0.19) at
        n=17 and 483,188 against 483,073.0 +/- 2,240.2 (z = +0.05) at n=19.
        Curve over matched-generic combined count: 0.9988 (n=17), 1.0002 (n=19),
        against the reported 3.131 and 3.034.
      attribution: >-
        Generic, open window, unfolded key (the producer's replica design):
        0.9928 +/- 0.0043 (n=17), 0.9960 +/- 0.0014 (n=19). Closed window,
        unfolded key: 0.9931 and 0.9955. Open window, folded key: 1.9931 and
        1.9958. Closed window, folded key: 3.1088 and 3.0297. On the curve, one
        point per abscissa (no negation closure), keys x(L): 1.9922 (n=17,
        |V| = 503) and 1.9918 (n=19, |V| = 1026). The factor is 2 (key fold) times
        (1 + N/2T) (vacuous partners); the curve contributes neither.
      other_curve_windows_nontrivial_over_expected: >-
        n=17: translated prefix 0.9814, random 9-dimensional subspace 0.9903,
        random x-set 0.9939 (8 further random x-sets: 0.9935 +/- 0.0106, range
        0.9810 to 1.0096). n=19: translated prefix 1.0033, random 10-dimensional
        subspace 0.9944, random x-set 1.0003 (8 further: 0.9967 +/- 0.0051, range
        0.9910 to 1.0060). The analytic expectation runs about 0.7 percent above
        the matched simulation's mean at n=17 (0.993), so values near 0.99 there
        are the null, not a deficit.
      s_fit: >-
        S_fit = T^2 / 2 combined falls from the sign-folded support N/2 by the
        factor 1 + N/2T under the matched null: predicted 41,764 against
        reported 42,001 (n=17), predicted 172,277 against 172,760 (n=19). The
        shortfall of S_fit from N is accounted for; no residual support geometry
        is needed to explain it at these windows.
      aligned_half_V0_n17: >-
        V'_0 = {P in V : constant term of x = 0}: |V| 245, T 29,768, combined
        28,436, ratio 8.3698 (producer 8.37). All 245 points lie in the index-2
        subgroup 2G ((N/2) P = O) and none of the 238 points of the complement
        half does, so every residual lies in 2G and the key space halves again.
        Predicted ratio under that confinement 8.3807; nontrivial over expected
        (confined) 0.9973; matched generic window confined to even residues
        8.306 +/- 0.100. The "directionally elevated, about 2.7x V" reading is
        the parity coset the preregistration already named. Computed here:
        Tr(t^i) = 0 for 1 <= i <= 16 with this modulus, so Tr(x) equals the
        constant term of x for every x in the window, and Tr(a) = 0 for the
        RC-1 coefficient a = 97044. That matches the halving criterion for
        binary curves (P in 2E iff Tr(x) = Tr(a); recalled, not looked up);
        the direct check (N/2) P = O above is what establishes membership
        in 2G.
  scope: >-
    Two toy cells, one curve each: RC-1 at n=17 (prefix window deg(x) < 9, also
    translated, subspace and random x-set windows of the same size) and the
    Koblitz curve y^2 + xy = x^3 + 1 at n=19 (deg(x) < 10, same variants). Pair
    sums of window points, x-coordinate keys. Nothing about other n, other
    arities, other key conventions, Frobenius-closed windows, or any deployed
    curve.
  what_it_says: >-
    At these windows the residual-collision rate of the free-leg pair-sum
    accumulator is what a generic group of the same order gives once the window's
    negation symmetry and the key's sign fold are reproduced in the null. The
    ratio 3.1 is 2 + N/T by arithmetic and varies with window size accordingly
    (2.88 to 3.21 over the random x-sets at n=17, 2.87 to 3.10 at n=19). A
    generic group built with the same window symmetry and key fold also falls
    outside the DO-1 band [0.5, 2] (3.11 at n=17, 3.03 at n=19), so the band does
    not separate the curve from a group-free model; its failure does not bear on
    the group-free birthday claim, and DO-2 "curve concentration" is not
    supported by this observable at these windows.
  what_it_does_not_say:
    - >-
      That no structural concentration exists: other windows can concentrate
      for plain parity reasons (V'_0 does, exactly as predicted), and nothing
      here tests Frobenius-closed windows, other n, or m other than the pair-sum
      step.
    - >-
      Anything about the PR #2591 (crypto) n=31 effect. That observable is
      Frobenius-conjugate abscissae among large primes (30 of 34 merges are
      exact Frobenius images because the prefix window is nearly closed under
      Frobenius for a sparse modulus; checked in
      matched_null/frobenius_window_closure.py), not the pair-sum residual
      collisions measured here. The two effects do not support or undercut each
      other.
    - >-
      Anything about the Stage 0 pricing (dominated_by floors 66.0 to 81.0
      against matched rho 60.809), the certificate re-sum pass rate, the Stage 4
      adversarial control, the recombination-off baseline or the merge-versus-
      collection timing. None was re-run, none is affected by the matched null,
      and "combined" counts elsewhere in the package (attempts_to_B_relations,
      the Stage 2 growth curve) were not audited for inclusion of the vacuous
      partner collisions.
    - >-
      That the instrument is wrong. The census reproduces to the last digit; the
      question is what the generic replica should have been.
