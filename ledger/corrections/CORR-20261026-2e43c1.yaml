  field: >-
    EV-BINSTD-769c7c observations O-stage1-V, O-stage3-5-concentration;
    inference ("DO-2 structural concentration confirmed with Stage 5
    persistence"); direction_note ("Stage 5 confirms concentration is
    structural (n=19 about 3.03)"); unresolved_confounds[0] ("residual support
    geometry ... that drives S_fit << N is measured but not algebraically
    classified").
  prior_value: >-
    "curve/generic = 3.131 outside [0.5, 2]" (RC-1, n=17) and "n=19 curve/generic
    = 3.034", read as curve-specific concentration of free-leg residuals;
    S_fit = 42,001 << N = 130,412 (S_fit / N = 0.322) read as "the optimistic
    assumption S = N is falsified"; V'_0 ratio 8.37 read as "directionally
    elevated".
  corrected_reading: >-
    The reported ratio is combined / (T^2 / 2N), a reference that is correct for
    unfolded keys in a window with no symmetry. The curve census has two
    features the Stage 3 / Stage 5 generic replica lacks: (1) the window is
    closed under negation (V = -V, 483 = 1 + 2 x 241 points at n=17, 1005 =
    1 + 2 x 502 at n=19), and (2) the key is x(L), which identifies L and -L.
    The replica is an open random subset of Z/N with key L (freeleg.py
    generic_zn_census: `window = rng.sample(range(modulus), window_size)`,
    `key = hash_key(L, ...)`; identity-sum pairs 0 to 2 against 241 on the
    curve). Feature (2) doubles the expected collision count, giving a
    reference of T^2/N, not T^2/2N. Feature (1) makes every attempt {P,Q} collide
    with its partner {-P,-Q}: the residual of the partner is -(-P-Q) = P+Q = -L,
    the same abscissa. That is exactly T/2 vacuous collisions, each of the form
    P+Q+(-P)+(-Q) = O, a zero relation vector. Hence
        combined = T/2 + (nontrivial),  nontrivial ~ T^2/N,
        reported ratio ~ 2 + N/T   (3.1227 at n=17, 3.0387 at n=19).
    The observed ratios are 3.105 and 3.030. With the two features matched the
    excess is not there (table in `measured`).
  measured:
