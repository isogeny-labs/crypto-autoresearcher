hypothesis:
  id: H-SIG-001
  question_id: RQ-SIG-001
  statement: >-
    The low-degree syzygy family of the boolean chained Semaev ideal (counts: 1
    at D3, 8n/3 at D4) is either entirely rewritable/Koszul — in which case the
    system is as generic as the raw counts minus that family suggest and
    Yokoyama semi-normality holds with #G* matching m*d^{m-1} on the full CM
    panel — or it contains a non-rewritable low-degree component that grows
    with n, constituting a structural deviation a solver can in principle
    exploit. (Source: HYPOTHESES_100 H013; AUTOLAB_TASKS T3/T5; D5 reopening in
    EC_SIEVE_HONEST_LEDGER.md.)
  mechanism: >-
    F5 signature tracking separates syzygies that are algebraically forced
    (rewritable, Koszul) from those reflecting genuine ideal structure. The
    Semaev ideal's chained-tree construction produces obvious Koszul pairs from
    shared variables between adjacent summation polynomials; if the counted
    family is exactly those, the ideal is semi-regular up to a characterized
    O(n) correction and D5 closes with the correct object. A growing
    non-rewritable component would instead lower the effective solving degree —
    the channel EXP-DREG-001 looks for from the rank side.
  assumptions:
    - The Yokoyama object is implemented per D5_YOKOYAMA_OBJECT.md (Syz=(J:S),
      NS(Syz), sig(f)=LM(RSC(f)), Phi(s), #G* counted on the non-reduced GB).
    - The T11-certified null supplies the matched semi-regular reference.
    - Signature tracking via Singular slimgb protocol (or Sage equivalent) is
      faithful; validated on a small system with a known Koszul family first.
  predictions:
    - metric: count and degree histogram of non-rewritable low-degree signatures
        per n, per panel family
      direction: higher
      minimum_effect: non-rewritable count growing in n on any family (CI-separated
        from the null's rewritable-only profile).
    - metric: #G* vs generic m*d^{m-1}, per panel family
      direction: lower
      minimum_effect: "#G* << m*d^{m-1} or NS(Syz) collapse on some family
        (semi-normality failure)."
  test_boundary:
    instances:
      - "generic + CM panel"
      - "n = 9"
      - "12"
      - "15"
      - "18"
      - ">=3 seeds"
    parameters:
      m: [2, 3]
      max_D: 6
      q: "2^16..2^24"
    implementation: src/h013_f5_signatures.sage (Singular slimgb with protocol),
      hunt_H7_formsearch_final.sage panel definitions
    budget:
      wall_clock_seconds_per_run: 3600
      maximum_memory_gb: 24
      maximum_runs: 160
  falsification_conditions:
    - >-
      All extra syzygies rewritable/Koszul AND #G* matches m*d^{m-1} on every
      panel family: D5 closed with the correct object (scoped KILL).
    - >-
      Deviations constant-sized in n: no growing invariant (bar's growth clause).
  interpretation_limits:
    - >-
      Toy scale; characterization of the syzygy family is a structural result
      either way (two-sided, like T4: null = theorem-shaped closure).
    - >-
      A growing non-rewritable family is structural evidence, not an exponent;
      it feeds EXP-DREG-001 rather than claiming the bar itself.
  status: supported_scoped   # DEC-20260717-002
  proposed_by: coordinator
