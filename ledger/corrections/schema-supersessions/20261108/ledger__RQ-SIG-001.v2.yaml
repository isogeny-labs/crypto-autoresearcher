research_question:
  id: RQ-SIG-001
  title: >-
    What is the origin and growth of the Semaev ideal's low-degree syzygy family
    (observed: 1 at D3, 8n/3 at D4), and does the correct Yokoyama semi-normality
    object (#G*, NS(Syz), signatures Phi(s)) deviate from the generic m*d^{m-1}
    on any curve family?
  scope:
    curve_families:
      - "generic + CM panel {j=0, 1728, -3375, 8000, -32768, isogenous}"
    field_types: [prime field F_p, toy q = 2^16..2^24]
    bit_sizes: [n = 9..18]
    methods:
      - signature-tracked F5 (Singular slimgb with protocol, or equivalent)
      - Yokoyama object: Syz=(J:S), NS(Syz), signatures, #G*
      - graded Betti tables vs matched semi-regular control
  motivation: >-
    The honest ledger reclassified D5 to OPEN / wrong-object: the old normal()
    proxy measured normality, not Yokoyama's signature/F5 condition, and the
    exact object (D5_YOKOYAMA_OBJECT.md) is recovered but never implemented.
    The T2 syzygy counts are the one measured departure from semi-regularity in
    the whole program; whether they are rewritable/Koszul (generic) or a growing
    non-rewritable family (structural) decides if there is anything behind them.
    (Source: HYPOTHESES_100 H013, absorbing AUTOLAB_TASKS T3 + T5.)
  decision_target: >-
    Whether the T2 syzygy family is rewritable/Koszul (generic; closes D5 with
    the right object) or contains a growing non-rewritable low-degree component
    (structural; feeds d_reg analysis in EXP-DREG-001).
  constraints:
    - The instrumented object is #G* / NS(Syz) / signatures — NOT the normal() proxy.
    - Toy scale; AGENTS rule 7 applies.
  status: active
  owner: coordinator
