research_question:
  id: RQ-ISO-001
  title: >-
    Does any small-degree isogenous neighbor of a prime-field curve show anomalous
    point-decomposition behavior (lower Semaev solving degree, or higher
    decomposition yield) versus matched controls, separating a genuine isogeny
    effect from random coefficient variance?
  scope:
    curve_families:
      - "prime-field short-Weierstrass and their l-isogeny neighbors (l in {2,3,5,7})"
    field_types: [prime field F_p]
    bit_sizes: ["toy: p ~ 2^13..2^15 (enumerable)"]
    methods: [m=3 chained Semaev d_reg; decomposition-yield count over a fixed factor base]
  motivation: >-
    ROADMAP Phase 4.1. Isogenous curves over F_p share cardinality, giving a clean
    same-order family. If a neighbor has an anomalously low PDP solving degree or an
    unusually dense decomposition structure NOT explained by generic curve variance,
    that is an in-bar (relation-cost) signal and a concrete "weak isogenous neighbor".
    idea-23 falsified the isogeny WALK cost; this audits the PDP algebra directly.
  decision_target: Whether any neighbor is a weak PDP instance vs the matched-control null.
  constraints: [Toy scale; d_reg is known curve-invariant in prior work so the yield leg carries the signal.]
  status: active
  owner: coordinator
