hypothesis:
  id: H-DREG-001
  question_id: RQ-DREG-001
  statement: >-
    For the boolean chained Semaev system (m=3) at system sizes n = 12..24, the
    solving degree d_reg(n) grows strictly slower than the T11-certified
    support-matched semi-regular null — equivalently, the deficit
    (sr_pred_D - rank_D) grows with n, or d_reg is bounded — which would make
    the per-PDP solve sub-exponential in n and put a non-generic total-cost
    exponent < 0.5 within reach. (Source: HYPOTHESES_100 H011 + H012; AUTOLAB_TASKS
    T2 + T10.)
  mechanism: >-
    The Semaev ideal carries an O(n) family of low-degree syzygies (T2
    observation: exactly 1 at D3, 8n/3 at D4) that a generic semi-regular system
    lacks. If that family, or any structure behind it, forces rank deficits in
    the Macaulay matrices that GROW with n — rather than the decelerating
    1322/1862/1999 seen at n=12/15/18 — the degree of regularity falls below
    the null and the solve cost drops below generic. If d_reg were BOUNDED, the
    solve is polynomial outright.
  assumptions:
    - >-
      The block-m4ri instrument computes exact full-column rank over GF(2);
      validated cell-for-cell against the dense engine at n<=15 (already done:
      69,073 at n=15 sem) before any past-wall number is trusted.
    - The T11 null has identical monomial support / degree profile with only
      coefficients randomized (the miscalibrated D6 null is excluded).
    - sr_pred_D is the semi-regular rank prediction for the same (n, D) cells.
  predictions:
    - metric: deficit(n, D) = sr_pred_D - rank_full(sem, n, D), D <= 6
      direction: higher
      minimum_effect: >-
        deficit at n=17..24 grows super-linearly in n (CI on the growth
        exponent excludes 1 from below) OR any cell shows d_reg(sem) < d_reg(null).
    - metric: gap(n) = d_reg(n) - d_ff(n), >=8 random R per n
      direction: lower
      minimum_effect: gap bounded (fits a constant) OR grows strictly slower
        than the null gap with non-overlapping bootstrap CIs.
  test_boundary:
    instances:
      - ">=3 toy curves"
      - ">=8 random targets R per n"
      - "n in {12,15,17,18,21,24}"
    parameters:
      max_D: 6
      engines: [block-m4ri (new), dense m4ri (validation <= n15)]
      null: T11-certified support-matched semi-regular
    implementation: src/h012c_block_m4ri.py (new) + ic_first_fall_fast.py
    budget:
      wall_clock_seconds_per_run: 7200
      maximum_memory_gb: 40
      maximum_runs: 120
  falsification_conditions:
    - >-
      d_reg(sem) tracks the null within CIs at every reachable n (gap grows
      semi-regularly): scoped KILL of the polynomial-solve / channel scenario.
    - >-
      Deficit at n=17..24 continues the decelerating 1322/1862/1999 trend or
      shrinks relative to rank: no growing invariant (bar's growth clause fails).
    - >-
      Any past-wall cell that cannot be validated by a checkpoint-resume
      consistency check is excluded (AGENTS rule 5), not counted either way.
  interpretation_limits:
    - Toy scale (n <= 24); a KILL is "no signal seen at reachable scale," not a
      theorem (honest-ledger discipline).
    - A bounded-d_reg WIN at n <= 24 is a strong signal, not a crypto-scale
      exponent claim; it triggers the H096 gate, not a conclusion.
    - Subset-column ranks are instrumentation artifacts for sem (finding iv) and
      are never evidence.
  status: inconclusive   # DEC-20260717-002
  proposed_by: coordinator
