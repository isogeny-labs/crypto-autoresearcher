research_question:
  id: RQ-R6-001
  title: >-
    Does adding explicit birthday factor-base membership constraints
    (prod over f in F of (x_i - x(f))) to the chained Semaev m=3 system yield a
    total relation-generation + solve cost with exponent < 0.5 on generic
    prime-field curves?
  scope:
    curve_families:
      - "generic prime-field curves E/F_p"
      - ">=3 curves"
    field_types: [prime field F_p]
    bit_sizes: [subgroup order l = 2^20, 2^24, 2^28, 2^30]
    methods:
      - chained Semaev m=3 (+ m=4 spot arm) with explicit membership polynomials
      - full-cost accounting: relation_cost x solve_cost, group-op-equivalents
  motivation: >-
    R6 is the residual of the program's central wall: the structured x_i^q = 1
    membership case is done (PKM no-win on the structured base), and every
    predicate/tensor/dynamics probe of the log table matches calibrated nulls
    (H016-H028, H067 session kills). The arbitrary explicit-index variant is
    "the single highest-value open object" (AUTOLAB_TASKS T1) because it is the
    only formulation in which the factor base is fully general and the total
    cost can be measured against rho directly.
  decision_target: >-
    A fitted total-cost exponent alpha with bootstrap CI, measured against four
    mandatory controls, deciding whether the explicit-membership route is
    sub-birthday (alive at the bar) or >= birthday (scoped KILL of the last R6
    variant), feeding the H096 integrative gate.
  constraints:
    - Explicit arbitrary index set F, |F| = l^(1/m); NOT the structured x_i^q=1 base.
    - Cost is relation_cost x solve_cost in group-op-equivalents, not solve-only.
    - Toy scale; AGENTS rule 7 applies to any outcome.
  status: active
  owner: coordinator
