hypothesis:
  id: H-FB3-001
  question_id: RQ-FB3-001
  statement: >-
    At least one structured factor-base geometry among {high-bit interval,
    small canonical height, mixed two-base, multiplicative coset union,
    greedy-optimized, asymmetric sizing} yields m=3 decompositions at a rate
    whose advantage over a matched random base GROWS with N (exponent-relevant),
    rather than being a constant or null effect. (Source: HYPOTHESES_100 H004,
    H018, H019, H020, H021, H022, batched per review section 3.3.)
  mechanism: >-
    Decomposition probability depends on how the base's x-coordinates interact
    with the chord structure of the summation condition. High-bit membership
    couples to carry propagation (opposite endianness of the killed low-bit
    interval bases); small-height points concentrate additive relations; mixed
    and coset bases change the sumset profile; greedy optimization could find
    structure none of the hand-designed families have. Any of these MIGHT make
    per-size decomposition probability scale with a different exponent than the
    balanced random base — the only form of advantage that survives at the bar.
  assumptions:
    - The H016 harness (decomposition counting, bootstrap CIs, permutation null
      on labelings) is reused unchanged except for the growth arm.
    - H016 (QR base) and H017 (small multiples) cells are already run and enter
      the Holm family as prior cells; they are not re-run.
    - The greedy base is selected on one curve-half and evaluated on held-out
      targets (transfer guard against overfitting).
  predictions:
    - metric: yield ratio (structured / matched random) per geometry per N,
        with bootstrap CI and permutation-null band
      direction: different
      minimum_effect: ratio CI excludes 1 AND the effect size grows from
        2^14 to 2^18 (slope vs log N excludes 0 in the alive direction) after
        Holm correction across the full family.
    - metric: asymmetric-base exponent gap (H004 arm)
      direction: different
      minimum_effect: per-size decomposition probabilities fit different
        exponents in B (CI-separated), making some B_1*B_2*B_3 ~ l split
        dominate the balanced base super-constantly.
  test_boundary:
    instances: [">=4 generic curves, N in {2^14, 2^16, 2^18}, m=3, >=300 random targets R per cell"]
    parameters:
      geometries: [high_bit_interval, small_height, mixed_two_base, coset_union,
                   greedy_optimized, asymmetric_sizing]
      permutation_draws: ">=100 per cell (matching H016/H017 for family comparability)"
    implementation: src/h016_base_yield harness (extended), h022_greedy_base.py
    budget:
      wall_clock_seconds_per_run: 1800
      maximum_memory_gb: 8
      maximum_runs: 96
  falsification_conditions:
    - >-
      All geometry ratios ~1 within CIs / permutation bands at every N: scoped
      KILL of the F3 family.
    - >-
      Any effect present but constant across N: fails the growth clause —
      "interesting structure," not alive (the H028/H032 pattern).
  interpretation_limits:
    - Toy scale (N <= 2^18); a growth signal triggers a larger-N confirmation
      before any alive claim.
    - A KILL closes the six tested geometries only (AGENTS rule 6), but with
      family-wise statistics it closes them decisively.
  status: approved   # DEC-20260717-002
  proposed_by: coordinator
