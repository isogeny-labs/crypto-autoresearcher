      metrics.secondary. The shorthand "the specification at HEAD is the
      specification that was frozen" is false for both files from a935f207
      onward and must not be used.
    ev_str_003_proof_ref_pin:
      pinned_here_as_a_new_statement: true
      never_an_edit_to_EV_STR_003: >-
        EV-STR-003 is immutable and is NOT edited. This pin is a new statement in
        a new record, which is the only route AGENTS.md rule 4 permits.
      defect: >-
        ledger/evidence/EV-STR-003.yaml line 134 lists
        `experiments/EXP-STR-003/specification.yaml` under `proof_refs` as a BARE
        PATH with no commit pin. From a935f207 onward, a reader resolving that
        proof_ref at HEAD resolves blob 5e0dadf7, not the 1c6f10b7 the evidence
        was written against. Identified by TASK-20260727-031 objection OBJ-2; it
        is the ONLY residual harm to the F1 result either review could identify,
        and no other record in this batch had named it.
      rule: >-
        EV-STR-003's `proof_refs` entry `experiments/EXP-STR-003/specification.yaml`
        RESOLVES AT COMMIT 92268c9e72dd9d49de410f4a535e64af5aa5d9a9, BLOB
