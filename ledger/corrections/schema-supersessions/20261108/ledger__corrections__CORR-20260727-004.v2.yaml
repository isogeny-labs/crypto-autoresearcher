  # ==================================================================
  # THE OPERATIVE READING RULE - what an auditor must do
  # ==================================================================
  binding_resolution_rule:
    statement: >-
      HEAD NO LONGER RESOLVES TO THE FROZEN BLOB. Any auditor of the F1
      falsification recorded in DEC-20260727-009 must resolve the
      contract-in-force at 92268c9e72dd9d49de410f4a535e64af5aa5d9a9, NOT at
