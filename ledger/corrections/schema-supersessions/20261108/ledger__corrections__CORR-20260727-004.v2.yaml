  # ==================================================================
  reason: >-
    AGENTS.md core rule 4 and CLAUDE.md non-negotiable rule 2 require that a
    change to a committed record be made by a superseding record. Two committed,
    frozen experiment contracts were edited in place at a935f207, one of them
    carrying an attested pre-execution freeze and 20 bound run records. That is
    the same FORM as the defect CORR-20260727-007 corrects, and the only route
    the contract permits for recording it is this superseding record. Writing it
    is not optional and was not deferrable: until it existed, the repository
    state was structurally the post-5de2db97 state.

  scope_of_this_correction: >-
    This record edits NO file. experiments/EXP-STR-003/specification.yaml,
    experiments/EXP-IC-002/specification.yaml, ledger/evidence/EV-STR-003.yaml,
    ledger/decisions/DEC-20260727-009.yaml and ledger/decisions/DEC-20260727-008.yaml
    are immutable and untouched. It changes NO experiment result, NO measured
    value, NO criterion and NO hypothesis status. The 20 committed EXP-STR-003
    run records and every value in EV-STR-003 stand exactly as recorded. What it
    changes is how a reader must RESOLVE two paths, and what the repository may
    and may not be cited as having authorized.

  what_this_correction_does_not_assert:
    - >-
      It does NOT assert that the ledger now validates. It does not. The
      validator still exits 1 with 985 new errors, and eleven other
      specifications remain unparseable and grandfathered. Five of 990 errors
      cleared - 0.5 percent. The true claim is "these two experiments now
      register," not "the ledger now validates," and that phrase must appear in
      no record.
    - >-
      It does NOT assert authorial intent was recovered. Because the originals
      are unparseable there is no fact of the matter about what they MEANT as
      YAML. Had double-quote syntax been intended for EXP-STR-003 line 407,
      `"square"` would have denoted the bare string `square`; the repair instead
      yields a string CONTAINING the literal quote characters. That is the
      conservative, raw-text-preserving choice, judged correct from context - the
      rest of the line is prose that cannot be YAML syntax under any reading, and
      every sibling in metrics.secondary has the same `- name: free-text` shape -
      but it is INFERENCE FROM CONTEXT, NOT PROOF. Nothing in tools/ or harness/
      reads metrics.secondary, so no consumer regression is possible either way.
    - >-
      It does NOT assert that the descriptions are technically accurate, only
      that they are unchanged.
    - >-
      It is NOT a research result, a measurement, a cryptanalytic result, an
      attack improvement, a closure or an impossibility claim, and it moves no
      asymptotic exponent in any direction.

