  # ==================================================================
  # THE PRECEDENT BOUNDARY - L1 to L5
  # ==================================================================
  precedent_boundary:
    authority_note: >-
      THIS RECORD CREATES A PRECEDENT AND BOUNDS IT IN THE SAME BREATH. Eleven
      other frozen specifications in this repository are unparseable and
      grandfathered in tools/validate_ledger_baseline.txt (EXP-DREG-001,
      EXP-DREG-002, EXP-EQJ-001, EXP-FB-001, EXP-FB3-001, EXP-ICI-001,
      EXP-REP-001, EXP-REP-002, EXP-SIG-001, EXP-SIG-004, EXP-SIG-005). If
      BATCH-008 is remembered as "in-place repair of a frozen contract is fine
      when you plan it first," those eleven become editable and rule 4's
      protection of frozen contracts is gone. The gate below exists to prevent
      exactly that, and it is CONTENT-gated, not process-gated, so that a reader
      who does not trust the actor can check it.
    what_is_expressly_NOT_the_authority: >-
      THE PRE-COMMITTED PLAN IS NOT LOAD-BEARING AND CONFERS NO AUTHORITY. It is
      SELF-AUTHORED: the Coordinator wrote it, approved it and dispatched its
      execution. No AGENTS.md rule grants a Coordinator authority to
      pre-authorize an immutability breach - rule 4 is not addressed to any role
      - and 5de2db97 would have satisfied that element in full with a one-line
      plan commit. PROCESS-AS-AUTHORITY IS ITSELF THE LAUNDERING MECHANISM
      (TASK-20260727-031, SA-4 / D-3). Also NOT load-bearing: the two-line size
      (rule 4 has no de minimis clause, SA-2), and "snapshot before review"
      (unearned - all eight BATCH-008 cards carry `commit_sha: null` under
      INT-BATCH007-T / INT-BATCH008-C, so no dispatcher receipt exists to lean
      on, OBJ-3).
    gate:
      preamble: >-
        An in-place edit of a committed frozen artifact is permitted ONLY when
        ALL of L1-L5 hold AND are EXHIBITED IN THE COMMIT.
      L1:
        requirement: >-
          THE PRE-EDIT BLOB HAS NO VALID PARSE under the schema the artifact
          claims - it is a corrupt file, not a record. ANYTHING THAT PARSES FAILS
          L1 AND IS A REISSUE-UNDER-A-NEW-ID, FULL STOP.
        why_this_is_the_knife: >-
          It can never extend to a 5de2db97-shaped case, because those files
          parse. The deciding control is one command that requires no trust in
          the actor and no reference to any plan:
          `git cat-file blob <pre-edit-blob> | python3 -c "import sys,yaml; yaml.safe_load(sys.stdin)"`.
          Run against 5de2db97's pre-edit EV-STR-002 and DEC-20260726-006 blobs
          it SUCCEEDS - those were records, and rewriting them moved assertions
          from one conclusion to its opposite. Run against 1c6f10b7 and 8987eb01
          it RAISES ScannerError - those were not records. That single control is
          the whole distinction.
        status_for_this_repair: MET
        status_basis: >-
          Verified twice independently: TASK-20260727-030 control "negative - do
          the originals actually fail, and for the stated reason" (ScannerError
          at line 213 col 31 and line 407 col 24, at the column of the `|`), and
          TASK-20260727-031 D-1(a) re-running the same check on both extracted
          blobs.
      L2:
        requirement: >-
          AN INVERSE TRANSFORM of the post-edit blob reproduces the pre-edit blob
          BYTE FOR BYTE OVER THE WHOLE FILE, exhibited as a re-runnable script,
          not asserted.
        status_for_this_repair: MET_IN_FACT_NOT_ARCHIVED
        status_basis: >-
          The PROPOSITION is archived and independently established. VAL-20260727-003
          claim C1 shows, by index-wise byte comparison of all four blobs, that
          exactly one line differs per file; that the byte delta is exactly +2 per
          file; that the after-line is the before-line with one U+0027 inserted
          after the key prefix and one appended; that neither original scalar
          contains an apostrophe so no escaping was introduced; and that the
          SHA-256 of each file WITH THE CHANGED LINE DELETED is identical before
          and after (EXP-IC-002 99590067f09d8550..., EXP-STR-003
          08644b7e67389387...). That is logically equivalent to the inverse
          transform over the whole file, by a different route, and it IS committed.
          WHAT IS NOT ARCHIVED is the re-runnable script L2 demands.
          TASK-20260727-031 ran the inverse transform itself and reports True for
          both files, but ONLY IN A SCRATCHPAD OUTSIDE THIS REPOSITORY, and that
          probe is expressly not evidence (RC-3). Archiving the script is assigned
          to TASK-20260727-033.
      L3:
        requirement: >-
          THE PRE-EDIT BYTES ARE PRESERVED AS A LIVE FILE IN HEAD, not only in
          history.
        status_for_this_repair: NOT_MET
        status_basis: >-
          The original bytes live only in git history at 92268c9e, c79e3a8d,
          14deee8a and (for EXP-IC-002) 6e6fd28e. A reader standing at HEAD must
          perform git archaeology to see the contract the 20 runs attest.
        remediation: >-
          SCHEDULED, NOT WAIVED. DEC-20260727-010 ADOPTS mechanism M4 and assigns
          it to TASK-20260727-033: land blob 1c6f10b7 verbatim at
          experiments/EXP-STR-003/specification.v1-frozen-1c6f10b7.yaml and blob
          8987eb01 verbatim at
          experiments/EXP-IC-002/specification.v1-frozen-8987eb01.yaml. L3 is
          recorded NOT MET as of this record and this record does not pretend
          otherwise.
      L4:
        requirement: >-
          THE SUPERSEDING CORRECTION RECORD LANDS IN THE SAME COMMIT AS THE EDIT,
          or the edit does not land.
        status_for_this_repair: NOT_MET_AND_UNREMEDIABLE_FOR_THIS_REPAIR
        status_basis: >-
          The edit landed at a935f207 on 2026-07-27 22:23:12 -0700 with no
          superseding record in ledger/corrections/. THIS RECORD LANDS IN A LATER
          COMMIT. Between those two commits the repository state was, as
          TASK-20260727-031 objection OBJ-1 (severity HIGH) states, STRUCTURALLY
          IDENTICAL to the state after 5de2db97 that CORR-20260727-007 corrects:
          an in-place edit of committed frozen artifacts with no superseding
          record. That gap is a real defect of this batch, it cannot be repaired
          retrospectively, and it is recorded rather than argued away. The
          precedent is unflattering: CORR-20260727-007 exists only because an
          independent forensic validator dug 5de2db97 out of git history a day
          later, and "a correction is coming" is what every uncorrected in-place
          edit looks like from the inside.
        binding_on_future_edits: >-
          L4 binds prospectively without exception. Any future in-place edit of a
          committed frozen artifact that does not carry its superseding
          correction IN THE SAME COMMIT is an uncorrected rule 4 violation, and
          this record may not be cited to excuse it.
      L5:
        requirement: >-
          NO FIELD THAT ANY DOWNSTREAM IMMUTABLE RECORD QUOTES CHANGES VALUE.
        status_for_this_repair: MET
        status_basis: >-
          Byte-level line comparison: 923 of 923 and 511 of 511 lines identical
          but for one line each, that line being a secondary metric's description
          text. No criterion, threshold, prediction, budget, stopping rule,
          control, version, status or approved_by field is touched. Both
          documents still parse to `status: approved` with non-null
          success_criterion, falsification_criterion and approved_by;
          `version: 1` in both; `frozen: true` / `frozen_on: 2026-07-27` for
          EXP-STR-003; `frozen` ABSENT in EXP-IC-002 and correctly NOT added.
      summary_of_status:
        L1: MET
        L2: MET_IN_FACT_NOT_ARCHIVED
        L3: NOT_MET
        L4: NOT_MET_AND_UNREMEDIABLE_FOR_THIS_REPAIR
        L5: MET
        plain_reading: >-
          Three of five clauses are satisfied as of this record. This repair is
          therefore NOT a clean instance of the precedent it defines, and must
          not be cited as one. It is distinguishable from 5de2db97 on L1 - and on
          L1 alone.

  # ==================================================================
  # THE DISANALOGY WITH 5de2db97, STATED AT ITS TRUE WIDTH
  # ==================================================================
  relation_to_CORR_20260727_003:
    verdict: HOLDS, BUT NARROWLY AND NOT ON THE ELEMENT THE BATCH LED WITH
