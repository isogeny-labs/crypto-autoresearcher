hypothesis:
  id: H-ICI-001
  question_id: RQ-ICI-001
  statement: >-
    The best total index-calculus exponent on generic E/F_p (crossbred or MITM,
    full relation x solve accounting) has a bootstrap-CI lower bound below 0.5
    when fitted at the largest feasible system sizes. (Source: HYPOTHESES_100
    H014; AUTOLAB_TASKS T12 + T23.)
  mechanism: >-
    Crossbred and MITM trade relation-generation cost against solve cost
    differently; the measured point estimates (0.863 crossbred, ~0.667 MITM)
    come from small ladders without uncertainty quantification. If the true
    fitted exponent of either path bends downward as n grows past the current
    ceiling, the stacked-constants conclusion ("loses by 2^43") could be
    overturned; if both are CI-separated above 0.5, that conclusion becomes a
    quantified wall.
  assumptions:
    - The crossbred and MITM implementations (bitpacked_solver.py,
      crossbred_real_cost.py) are cost-instrumented honestly (all stages
      charged, including sparse linear algebra and memory traffic).
    - The T24-verified rho constant anchors the comparison.
  predictions:
    - metric: fitted total exponent per solver path, bootstrap 90% CI
      direction: lower
      minimum_effect: any path with CI upper bound < 0.5 at >=4 ladder points.
    - metric: exponent stability across the extended ladder (past current ceiling)
      direction: different
      minimum_effect: point estimate moves outside its own small-ladder CI when
        the ladder is extended (i.e., current numbers are ceiling artifacts).
  test_boundary:
    instances: [">=3 toy curves, >=8 targets per n, n ladder to the solver ceiling"]
    parameters:
      solver_paths: [crossbred, mitm]
      k_fraction_sweep: per crossbred_kfrac_sweep.py
    implementation: src/crossbred_real_cost.py, src/crossbred_exponent.py,
      src/bitpacked_solver.py, review_stacked_compat.py
    budget:
      wall_clock_seconds_per_run: 7200
      maximum_memory_gb: 40
      maximum_runs: 120
  falsification_conditions:
    - >-
      Both paths' CI lower bounds > 0.5 at the extended ladder: quantified KILL;
      the "loses by 2^k" statements become CI-backed.
    - Exponents stable within CIs across the extension: current numbers confirmed.
  interpretation_limits:
    - Toy scale; the exponents feed the H096 scoreboard, not a crypto-scale claim.
    - A KILL quantifies distance from rho; it does not prove 0.5 is impossible
      past reachable n (AGENTS rule 6).
  status: rejected_scoped   # DEC-20260717-002
  proposed_by: coordinator
