hypothesis:
  id: H-R6-001
  question_id: RQ-R6-001
  statement: >-
    On generic E/F_p with an explicit birthday factor base (arbitrary index set
    F, |F| = l^{1/3}), the chained Semaev m=3 system plus membership polynomials
    prod_{f in F}(x_i - x(f)) has a measured total-cost exponent alpha
    (relation_cost x solve_cost, group-op-equivalents) whose bootstrap CI upper
    bound is < 0.5 — i.e., it beats the generic control on the same instances.
    (Source: HYPOTHESES_100 H009; AUTOLAB_TASKS T1.)
  mechanism: >-
    Explicit membership collapses the decomposition variety to the factor-base
    points directly (no smooth-subgroup remainder), and the m=3 summation tree
    keeps the ideal's degree profile low. If the constrained system's solving
    degree stays near the first-fall degree while the base stays at l^{1/3},
    the total cost relation x solve can undercut the birthday l^{1/2} barrier.
    Every prior kill in this family used either a structured base or a solve-only
    cost model; neither covers this configuration.
  assumptions:
    - The membership polynomial of degree |F| is represented in factored /
      evaluated form; its construction cost is charged to relation_cost.
    - The T24-verified rho baseline (1.253 / 0.886 constants, EXP anchor H040)
      is the generic control on identical instances.
    - d_reg measurements reuse the EXP-DREG-001 instrument where sizes overlap.
  predictions:
    - metric: total-cost exponent alpha in cost ~ l^alpha, l = 2^20..2^30
      direction: lower
      minimum_effect: fitted alpha with bootstrap 90% CI entirely below 0.5 on
        >=4 ladder points AND below every control's exponent on the same instances.
    - metric: d_reg of the membership-constrained system vs the EXP-DREG-001
        unconstrained ladder
      direction: lower
      minimum_effect: d_reg bounded in l, or growing strictly slower than the
        support-matched null (CI-separated).
  test_boundary:
    instances: [">=3 generic curves, >=8 random targets R per l, l in {2^20, 2^24, 2^28, 2^30}"]
    parameters:
      m: [3, 4]
      base_size: "l^{1/m} per (m, l)"
      membership: explicit arbitrary index set (random + interval arms)
    implementation: src/semaev_tree_prime.py (swap x_i^q=1 -> prod(x - x_f)),
      dreg_measure.py, dsolv_scaling.py, T24-verified pollard_rho.py
    budget:
      wall_clock_seconds_per_run: 14400
      maximum_memory_gb: 40
      maximum_runs: 160
  falsification_conditions:
    - >-
      alpha CI overlaps 0.5 or sits above the rho control: birthday wall holds.
    - >-
      The smooth-subgroup no-win signature recurs (degree flat, time exponential).
    - >-
      Solve-only accounting shows a gain that full relation x solve accounting
      erases: bookkeeping leak, recorded as such.
  interpretation_limits:
    - Toy scale (l <= 2^30); a WIN is a measured non-generic exponent on this
      family, not a crypto-scale claim (AGENTS rule 7), and triggers H096.
    - A KILL closes the arbitrary explicit-membership variant of R6 only;
      it does not touch non-membership formulations (AGENTS rule 6).
    - Censored cells (timeouts/OOM) are infrastructure state, not evidence.
  status: rejected_scoped   # DEC-20260717-002
  proposed_by: coordinator
