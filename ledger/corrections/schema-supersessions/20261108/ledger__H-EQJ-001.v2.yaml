hypothesis:
  id: H-EQJ-001
  question_id: RQ-EQJ-001
  statement: Decomposing the relation space of the m=4 summation fiber-product curve into isotypic components under G = S_{m-1} ⋉ (Z/2)^{m-1} via exact group-algebra idempotents, and harvesting/solving per block, reduces the charged total below the symmetrized baseline (B = rho 1/2) via block-restricted rank arrival and orbit-compressed storage.
  mechanism: The relation operator is G-equivariant, so it splits into isotypic blocks (Maschke/Wedderburn); LA is superlinear in dimension, so sum_blocks LA(B_b) < LA(B) and orbit storage drops by |G|-ish — unless solution tuples arrive in G-orbits that put all harvested relations into trivial/sign blocks (FHJRV equivalence) or block ranks fail to split.
  assumptions: [p ∤ |G| (Maschke applies), relation space operationalized as fiber indicator in the ambient permutation module (see EXP-EQJ-001 specification operationalization_note)]
  predictions:
    - {metric: fully charged exponent trend across 3 sizes, direction: lower, minimum_effect: "< 0.49"}
    - {metric: LA+storage reduction at equal recovered targets, direction: higher, minimum_effect: ">= 4x sustained across three sizes (necessary-not-sufficient)"}
  test_boundary:
    instances:
      - "p in {211, 1009, 4099}"
      - "m=4"
      - "prime-order ordinary curves (deterministic rule)"
      - "FB = k smallest-x (k=12,12,16)"
      - "3 seeds 20260717..20260719"
    parameters: {group: "B_3, |G|=48", ambient_M: [13824, 13824, 32768], null_draws_per_seed: 8}
    implementation: experiments/EXP-EQJ-001/eqj1_isotypic.sage (+ eqj1_verify.sage audit)
    budget: {wall_clock_seconds: 2400, maximum_runs: 8}
  falsification_conditions:
    - EC per-block distribution matches the random-hypergraph/random-action null (structure not EC-specific)
    - measured multiplicities |G|-symmetric with all harvested relations in trivial+sign blocks (equivalence to symmetrization)
    - LA+storage reduction < 4x at equal recovered targets across three sizes
  interpretation_limits: [toy primes <= 2^12, m=4 only, single-target fibers, constant-factor measurements unless scaling differs; toy-curve evidence is not crypto-scale validation]
  status: rejected_scoped
  proposed_by: coordinator-research-director
