research_question:
  id: RQ-FB3-001
  title: >-
    Does ANY structured factor-base geometry (high-bit intervals, small canonical
    height, mixed two-base, multiplicative cosets, greedy-optimized, asymmetric
    sizing) produce a decomposition yield whose advantage over a matched random
    base GROWS with N — an exponent-relevant channel rather than a constant?
  scope:
    curve_families:
      - "generic prime-field curves E/F_p"
      - ">=4 curves"
    field_types: [prime field F_p]
    bit_sizes: [N ~ 2^14, 2^16, 2^18 (growth arm mandatory)]
    methods:
      - m=3 decomposition counting per typed base, matched random base control
      - permutation null on the base labeling; single Holm family across all cells
  motivation: >-
    The F3 factor-base family (HYPOTHESES_100 H004, H018-H022) comprises six
    near-identical cheap cells, each a relabeling of the H016/H017-killed
    pattern. Run separately they would produce six isolated point estimates with
    family-wise multiple-comparison blindness (the honest ledger's critique);
    run as one battery with one Holm correction and a mandatory growth arm,
    they retire the family decisively. H016/H017 are included in the family
    accounting as already-run cells, not re-run.
  decision_target: >-
    Whether any structured base geometry shows a yield effect that grows with N
    (alive — feeds base selection for EXP-R6-001) or all effects are ~1 /
    constant-only (scoped KILL of the F3 family as exponent-relevant).
  constraints:
    - One battery, one pre-registered cell list, one Holm-Bonferroni correction.
    - A WIN requires growth with N, not a constant yield ratio (bar's growth
      clause; H028/H032 both died on exactly this clause).
    - Toy scale; AGENTS rule 7 applies.
  status: active
  owner: coordinator
