research_question:
  id: RQ-DREG-001
  title: >-
    Does the solving degree d_reg of the boolean chained Semaev system (m=3) grow
    with the semi-regular null past the n=21 memory wall, or does the deficit /
    d_reg - d_ff gap behave non-generically (bounded d_reg or a growing deficit)?
  scope:
    curve_families:
      - "generic prime-field curves E/F_p (toy)"
      - ">=3 seeds"
    field_types: [binary boolean Weil-descent systems GF(2)]
    bit_sizes: [system size n = 12, 15, 17, 18, 21, 24 (to the new ceiling)]
    methods:
      - checkpointable block-m4ri full-column-rank instrument (to be built)
      - first-fall degree via ic_first_fall_fast with max_D raised to 6
      - T11-certified support-matched semi-regular null as the reference
  motivation: >-
    The honest ledger (EC_SIEVE_HONEST_LEDGER.md, section D6) reclassified the
    d_reg scaling question to UNRESOLVED / underpowered: it is "the one experiment
    that could falsify the core." A bounded d_reg would make the per-PDP solve
    polynomial and ECDLP-threatening; d_reg tracking the null closes the route.
    The prior instrument (dense echelon / solved-vars-at-D) saturates at n=21,
    D=4, and the HYPOTHESES_100 H012 entry claims an n=17 null measurement that
    the artifacts do not contain (review correction C1) — the wall past n=15 is
    currently unmeasured by any valid instrument.
  decision_target: >-
    Whether the boolean Semaev d_reg(n) tracks the support-matched semi-regular
    null (scoped KILL of the polynomial-solve scenario) or departs from it
    (bounded d_reg, or a deficit that grows with n), with bootstrap CIs on both
    arms and a stated prediction interval at n=30.
  constraints:
    - Toy scale only; per AGENTS rule 7 no crypto-scale claim regardless of outcome.
    - >-
      Subset-column rank is INVALID for the sem arm (h012 finding iv): only
      full-column exact ranks are evidence.
    - A timeout or OOM is failed_infrastructure, never evidence (AGENTS rule 5).
  status: active
  owner: coordinator
