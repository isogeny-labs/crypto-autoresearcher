research_question:
  id: RQ-TTN-001
  title: Do the bond tensors of the recursive Semaev resultant tree admit low-rank factorizations over F_p, and does the chi needed for recall >= 0.99 in contraction-based solution counting grow with exponent < 1 in the per-variable degree d = 2^(m-2) (vs the 1.979 dense composed-resultant exponent of MX-1478)?
  scope:
    curve_families: [ordinary prime-field short-Weierstrass]
    field_types: [F_p]
    bit_sizes: ["toy p in {101, 431, 1009} (<= 2^10)"]
    methods: [Semaev S_m tensors via balanced recursion tree, exact F_p bond ranks, prefix-CUR rank truncation, contraction-based counting, truncated recall]
  motivation: >-
    Candidate C2 (research_directions_20260717.md, lines 469-522): read S_m = Res_y(S_k(...,y), S_{m-k+2}(y,...)) as a tree tensor network; if bond ranks chi grow polynomially with exponent < 1 where dense degree grows exponentially, rank-truncated contraction bypasses the MX-1478 dense-resultant obstruction (cost poly(chi)*tree-size instead of ~d^1.979).
  decision_target: Measured bond-rank growth exponent and chi_needed(recall >= 0.99) against the promotion gate (exponent < 1) and disproof trigger (exponent >= 1.9).
  constraints: ["exact F_p arithmetic", "truncation may only lose recall (outputs verified exactly)", "toy scale: no crypto-scale claim"]
  status: active
  owner: coordinator
