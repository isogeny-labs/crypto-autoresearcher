hypothesis:
  id: H-BKKMV-001
  question_id: RQ-BKKMV-001
  statement: The mixed volume of the target-sectioned Semaev summation system Sys_m = {S_m(x_1..x_{m-1}, t_j)}_{j=1..m-1} grows strictly below the dense Bézout order, certifiable at m in {3,4,5} by exact polytope computation plus BKK cross-check against F_p torus counts; the alternative is Newton saturation (MV = Bézout), which kills B2-class sparse-elimination methods.
  mechanism: Monomial-support sparsity of S_m shrinks the Newton polytopes below the total-degree simplices; BKK mixed volume (the sparse-elimination complexity driver) then undercuts the dense Bézout bound that MX-1478-style dense resultants pay.
  assumptions: [short-Weierstrass y^2 = x^3 + Ax + B, char >= 5, generic distinct valid target x-coordinates]
  predictions:
    - {metric: "MV_m / Bézout", direction: lower, minimum_effect: "< 1 strictly at m = 5"}
    - {metric: "torus count vs MV", direction: "bound holds", minimum_effect: "count <= MV in every tested cell (violation = computation bug)"}
  test_boundary:
    instances:
      - "3 seeded curves (20260717..20260719)"
      - "m in {3,4,5}"
      - "primes {101,431,1009} counts (m=5: p=101 only)"
      - "primes {1000003,1000033} certification + QQ cross-check at m<=4"
    parameters: {seeds: [20260717,20260718,20260719]}
    implementation: experiments/EXP-BKKMV-001/bkkmv1_cert.sage
    budget: {wall_clock_seconds: 2400, maximum_runs: 8, per_invocation_seconds: 600}
  falsification_conditions: [MV = Bézout (saturation) at m = 5, or count > MV in any verified cell, or any positive control (dense MV = d^n, m=3 MV = 8, support stability) fails.]
  interpretation_limits: [Toy prime fields only; 3 measured m-values give a 3-point certificate on the tested range, not an asymptotic proof; the MV-vs-Bézout comparison is convention-dependent (total-degree vs multi-graded box) and both are reported.]
  status: supported
  proposed_by: coordinator-research-director
