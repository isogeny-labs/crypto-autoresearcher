  proves_too_much:
    objects:
    - The inference 'a=1/8 at N=2^24 with margin CI [+0.0050,+0.0115] is a confirmed feasible operating
      point for an online RESEL-L arm' tested against the goal head's own standing record that ZERO online
      arms have ever been run and that ceiling results are SILENT on whether the online lower-bracket
      mechanism reaches the ceiling at any achievable batch size U (DEC-20260907-b4f2a9 RANK 2/3; DEC-20260907-de6b71)
      -- a ceiling-to-online jump that still goes through proves too much.
    - The inference 'a=1/8 at N=2^20 is G3-INFEASIBLE' tested against that cell's own recorded CI [-0.0002,+0.0087]
      straddling zero and k_25=16/25 -- a strict-infeasibility reading that survives a straddled CI proves
      too much; symmetrically, the inference 'the straddle means the cell is really feasible' tested against
      the same numbers proves too much in the permissive direction.
    - The inference 'the margin identity holding exactly on all 200 cells validates the walk-based estimator'
      tested against the recorded method difference (Stage B'' is an exact-basin closed form with zero
      re-selected arms; the walk-based fields it reports are computed within that closed form) -- an inference
      that reads identity-of-identity as inter-method agreement, or that reads ANY per-seed margin agreement
      between independently seeded implementations as required, breaks.
    - The inference 'the crossing bracket is N-stable' tested against the recorded a=1/8 verdict flip
      between scales (k_25=16 straddled at 2^20 vs k_25=20 CI-excluding-zero at 2^24, corroborated by
      the production k>=0 counts 17 vs 24) -- an N-stability claim that still goes through proves too
      much; conversely an inference 'the bracket moves with N' tested against a=1/16 and a=3/16 verdict
      stability at both scales breaks.
    failure_signature: An inference that still goes through where its conclusion is known false, or that
      voids or validates what the recorded numbers and the frozen contract text do not, is wrong somewhere
      nobody has read closely enough yet.
