  scale_relevance:
    tier: toy
    justification: Exact finite fields and finite domains from frozen config; no extrapolation.
    correspondence: null
  replication:
    seeds:
    - 17
    independent_instances: 1
  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_workers: 1
    maximum_runs: 1
  stopping_rules:
  - One additional serial native run after original terminal snapshot, containing all-target point SAT
    plus all78 unchanged algebra cells and durable per-cell outputs; no cell reduction or outcome-dependent
    replacement.
  - Memory4GiB and7200s process watchdog protect host; a cap is UNKNOWN/incomplete, not negative mathematics.
  - Any config, coverage, certificate, group witness or oracle mismatch invalidates affected exact assertion.
  invalidation_rules:
  - Wrong source/input hash, dropped exceptional branch, rejected positive control, non-reproducible exact
    output, corrupted certificate, or inconsistent finite-domain model set.
  success_criterion: 'C-POINT,C-DEGREE,C-BACKDOOR: exact complete declared scope, independently checked
    witnesses/certificates, every UNKNOWN and exception retained; no performance assertion.'
  falsification_criterion: A concrete invalid certificate/model falsifies the corresponding finite assertion.
    Missing/censored cells remain incomplete and require explicit scope retention.
  decision_impact:
    on_positive: Retain distinct finite observations and select follow-up only after independent review;
      no official support transition.
    on_negative: Record affected encoding or instrument counterexample with scope; repair under an additive
      amendment, or close only that tested variant after review.
  variable_ledger:
    independent:
    - name: membership
      levels:
      - false
      - true
    factors:
    - name: curve
      treatment: fixed
      value:
      - 17
      - 97
      how: Existing geometry.select_curve exact first generic nonsingular nonanomalous prime-order selector;
        no domain/outcome reselection.
    - name: targets
      treatment: fixed
      how: ALL affine x coordinates of selected public curve, sorted; target set independent of solver
        outcomes.
    - name: solver
      treatment: fixed
      how: Same original SAT/core source with degree2, row4096, six Boolean variables and all failed attempts
        retained.
    - name: replay
      treatment: fixed
      how: A/A repeats same source/parameters; deterministic results must agree.
    - name: monomial_order_cache
      treatment: fixed
      how: Exact order-equivalence checked over all masks0..255 before solving; caching changes no rowchoice,
        arithmetic, branches or original algebra fixture.
    - name: source_rank_integrity
      treatment: fixed
      how: Correct inherited source_rank stale-row enumeration in the additive independent checker only;
        inspect the current row at each pivot. Six small integrity regression matrices, run before scientific
        fixtures and during verification. Producer source-calibration rank algorithm and all original
        frozen files remain unchanged.
    comparisons:
    - id: C-POINT
      arms:
      - membership
      differs_in: []
      design: absolute
      threshold: Every completed membership result agrees with the complete finite group-pair oracle,
        and every SAT model has a checked actual lift. No SAT outcome is presumed.
    - id: C-AA
      arms:
      - residual
      - aa
      differs_in:
      - replay
      design: aa
    - id: C-DEGREE
      arms:
      - algebra_degree
      differs_in: []
      design: absolute
      threshold: All original declared matrix cells retained, certificates checked and complete/UNKNOWN
        classifications preserved.
    - id: C-BACKDOOR
      arms:
      - algebra_backdoor
      differs_in: []
      design: absolute
      threshold: All original cuts and four legal assignments percut retained; any UNKNOWN branch defeats
        that strong-backdoor assertion.
    crosses_map: false
