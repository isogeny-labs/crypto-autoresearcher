      differs_in: []
      design: absolute
      threshold: Four-arm ablation plus homogeneous source-construction calibration.
    - id: C4
      arms:
      - lead4
      differs_in: []
      design: absolute
      threshold: Exhaustive certification of all assignments to each selected backdoor.
    - id: C5
      arms:
      - lead5
      differs_in: []
      design: absolute
      threshold: Complete small-field chart census, symbolic identity checks and exact GB comparisons.
    - id: C-AA
      arms:
