  stage1_claims:
  - id: L1
    proposal: IDEA-20261029-3d0e71
    question: Does shared Graeffe/divisor membership exactly represent the declared chart, including a
      coefficient-only inverse search, and what losses arise on repeated or exceptional charts?
    stage1: Exact correspondence and p17 coefficient-search census; instrument work only.
    unresolved: No scalable coefficient solver, intrinsic regularity bound, arbitrary-prime construction
      or index-calculus advantage follows.
  - id: L2
    proposal: IDEA-20261029-8d82e6
    question: Can native prime-field polynomial reasoning produce checked Boolean conflict clauses before
      all coordinate blocks are assigned?
    stage1: Certificate-checked finite-domain solving, full oracle comparison, and bounded two-block residual
      PC comparisons.
    unresolved: Residual S3 instruments are distinct from complete prime-field PDP instances; count all
      explanation work.
  - id: L3
    proposal: IDEA-20261029-e4edce
    question: Does source-inspired partial-layer selection or block filtration obtain the same certificate
      using fewer matrix entries or arithmetic operations on the frozen fixtures?
    stage1: Four-arm ablation plus homogeneous source-construction calibration.
    unresolved: Boolean quotient adaptation is not reproduction of the paper rank model, and block filtration
      is not the full published Multi-homogeneous XL algorithm.
  - id: L4
    proposal: IDEA-20261029-2e292c
    question: Does an instance-only small backdoor make every legal residual branch solvable at the frozen
      degree/free-variable cap, with lower total work than equal-entropy controls?
    stage1: Exhaustive certification of all assignments to each selected backdoor.
    unresolved: Any UNKNOWN branch defeats a strong-backdoor certificate; no universal scaling implication.
  - id: L5
    proposal: IDEA-20261029-ec08bc
    question: Do certified saturation consequences preserve exactly the generic finite-field chart, and
      what happens after every exceptional branch is restored?
    stage1: Complete small-field chart census, symbolic identity checks and exact GB comparisons.
    unresolved: Output basis degree and term counts are not degree of regularity or total F4/XL work;
      no complete performance conclusion from those alone.
