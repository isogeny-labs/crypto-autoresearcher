  independent_variables: &id001
  - name: lead
    levels:
    - 1
    - 2
    - 3
    - 4
    - 5
  metrics:
    primary:
    - id: subcells
      name: Raw subcells represented
      unit: integer
      kind: exact
      definition: Exact number of raw records selected by the frozen per-arm extraction rule; includes
        neither inferred nor missing records.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.subcells
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    - id: verification_pass
      name: Package verification indicator
      unit: integer
      kind: exact
      definition: One exactly when all package-specific native checker results required for this arm are
        valid; zero otherwise.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.verification_pass
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    - id: unknown_subcells
      name: Unresolved subcells or branches
      unit: integer
      kind: exact
      definition: For lead4 count every UNKNOWN legal residual branch; elsewhere count explicitly UNKNOWN,
        ROW_CAP or censored raw records.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.unknown_subcells
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    - id: verified
      name: Checked identities and solution-set agreement
      unit: integer
      kind: exact
      definition: Number of checks independently verified; a mismatch invalidates only the affected comparison
        and is retained.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.verified
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    - id: model_count
      name: Exact model count
      unit: integer
      kind: exact
      definition: Complete model count on the named finite chart/domain; incomplete search carries UNKNOWN,
        never zero.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.model_count
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    - id: algebraic_work
      name: Exact instrument arithmetic count
      unit: integer
      kind: exact
      definition: Deterministic integer count of the explicitly instrumented arithmetic subset. Raw fields
        state omissions; not a complete attempt-work count and not a hardware claim.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.algebraic_work
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    - id: matrix_entries
      name: Constructed matrix entries
      unit: integer
      kind: exact
      definition: Exact sum and peak of constructed row-by-column matrix sizes; no intrinsic regularity
        inference.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.matrix_entries
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    secondary:
    - id: certificate_bytes
      name: Certificate representation bytes
      unit: integer
      kind: exact
      definition: Serialized certificate length; sum all attempted explanations.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.certificate_bytes
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    - id: max_filtration_degree
      name: Maximum reached filtration degree
      unit: integer
      kind: exact
      definition: Maximum degree reached by this explicitly specified instrument; not intrinsic degree
        of regularity.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.max_filtration_degree
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
    - id: unknown_branches
      name: Unresolved branches
      unit: integer
      kind: exact
      definition: All cap-limited legal branches; one unresolved branch defeats a strong-backdoor certificate.
      source: export_results.py exact_metrics from hash-bound package JSON; export runs.measurements.counted.unknown_branches
      aggregation: per_row
      resolution: one exact integer
      uncertainty: none_exact
  scale_relevance:
    tier: toy
    justification: Exact finite fields and finite domains from frozen config; no extrapolation.
    correspondence: null
  replication:
    seeds:
    - 17
    independent_instances: 1
  budget:
    enforcement: advisory
    maximum_memory_gb: 4
    maximum_workers: 1
    maximum_runs: 1
  stopping_rules:
  - Execute precisely the frozen finite configs once, with their A/A, positive and negative controls;
    no scaling after inspecting data.
  - Stop affected computation at declared variable/degree/row/memory cap; preserve UNKNOWN and completed
    rows.
  - Certificate mismatch or oracle disagreement invalidates affected scientific comparison; preserve raw
    record and do not silently rerun.
  invalidation_rules:
  - Wrong source/input hash, dropped exceptional branch, rejected positive control, non-reproducible exact
    output, corrupted certificate, or inconsistent finite-domain model set.
  success_criterion: 'C1-C5: independently verified exact finite outcomes, with complete domain/chart
    coverage for every completeness assertion. Original performance hypotheses remain undecided unless
    their full charged-work criterion is actually evaluated.'
  falsification_criterion: 'C1-C5: explicit counterexample, invalid certificate or unresolved legal branch
    rejects the respective finite assertion; censored resource cells remain UNKNOWN.'
  decision_impact:
    on_positive: Retain distinct finite observations and select follow-up only after independent review;
      no official support transition.
    on_negative: Record affected encoding or instrument counterexample with scope; repair under an additive
      amendment, or close only that tested variant after review.
  variable_ledger:
    independent: *id001
    factors:
    - name: fixtures
      treatment: fixed
      value: experiments/EXP-PFIVE-3ca920/config.json
      how: Exact cells and input-only selector rules frozen; no outcome-dependent replacement.
    - name: solver_policy
      treatment: crossed
      how: Within-lead arms and algorithm caps fixed in bound config; compare identical underlying instances.
    - name: nuisance_order
      treatment: fixed
      how: Declared reversed input/assignment order only in A/A controls.
    - name: source_and_field
      treatment: fixed
      how: All arms share pinned source tree, exact modular arithmetic and explicit finite domains.
    - name: limits
      treatment: fixed
      how: Identical finite matrix/variable/degree caps; censored cells are UNKNOWN.
    comparisons:
