  corrected_value:
    object_2: >-
      The literal >= reading of condition (1) is a proves-too-much object for the INSIDE placement
      only (true side F u S_fe). There, under >=, d_F <= d'_F holds for every system with at least
      two generators: a fake fall at D gives a nonzero red(sum) in <F> + S_fe of degree < D, and a
      Koszul syzygy makes some product reach degree >= D. A review that finds the inside-form
      counterexample under >= has proved too much. In the PRINTED placement (true side {f_1..f_M}
      alone, fake side {f_1..f_M} u S_fe) the >= reading is NOT a proves-too-much object: for both
      witnesses d_F^>=(F) = 3 and d'_F^>= = 2, so Lemma 4 as printed is false under >= as well.
    failure_signature: >-
      A review that accepts recovery without U-4, finds the INSIDE-placement counterexample under
      the >= reading, or accepts a first fall degree with no exhibited fall has proved too much.
      Finding the printed-placement counterexample under >= is correct and is not a failure.
    control_2: >-
      Under >=, the inside form of Lemma 4 holds for every system with at least two generators,
      and the printed form does not (witnesses A and B: 3 > 2). The equality reading (D1) carries
      claim C1 (inside form) and not claim C2 (printed form).
  evidence_tier: >-
    Two reviewer computations from one round, not Lean theorems: J1 finding F1 (Sage 10.9 Groebner
    bases over GF(2): least nonzero degree of <F> is 2 for A and B, while <F> + S_fe contains X for A
    and X_2 + X_3 for B) and, blind and independently, J2's nearby control 1 (d_F with the
    lower-bound-only condition: A with F 3, A with F + S_fe 2, B with F 3, B with F + S_fe 2; "with
    S_fe the inequality holds for every system by construction; with F alone it still fails for A
