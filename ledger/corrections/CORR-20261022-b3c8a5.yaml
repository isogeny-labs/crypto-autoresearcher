  interpretation_limits:
    - >-
      Provenance, not cryptanalysis. Nothing here changes the ECDLP on any
      curve or any attack cost. Any point of order n is an equally good
      generator.
    - >-
      This correction removes a negative. It adds no positive. It does not show
      that the binary-curve base points are generator output, and the
      follow-up's searches of the draw do not show that they are not.
