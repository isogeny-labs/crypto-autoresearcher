  field: >-
    Scope of the bundle's seed-agnostic generator scan on the binary-curve base
    points: what "No hits" on those targets tested.
  prior_value:
    README: >-
      "It covered the B-163 seed and every unexplained base-point coordinate.
      All four positive controls were found, including synthetic FreeLIP base
      points on P-384 and P-521 with arbitrary seeds. Results: - No hits on the
      19 targets."
    KN-LIT-d2f917: >-
      "A preregistered skip-filter screen and a seed-agnostic generator scan of
      the unexplained values (both run outside the repository) were negative."
  corrected_value: >-
    On the binary curves the scan did not test the X9.62 draw. X9.62-1998 A.3.1,
    as read in the follow-up note (aburan28/crypto PR #2410,
    research/nist_basepoint_provenance_20261017/README.md, "The binary-curve
    correction"), builds the base point as G = hR from a random point R, with
    cofactor h = 2 (B-163 to B-571, K-163) or h = 4 (K-233 to K-571). The random
    draw is x(R), not Gx. A scan of the published Gx and Gy for generator
    structure cannot detect a generator output that was drawn as x(R) and then
    multiplied by h. The README's "No hits" on the binary-curve coordinates
    therefore says only that the published Gx and Gy themselves showed no
    drand48-family or FreeLIP structure. It is not evidence about whether the
    X9.62 draw was generator output. Second point, conditional: according to the
    target list in research/nist_basepoint_provenance_20261017/snapshot/lib/scan_unexplained.py
    in that PR, the 19 targets were the B-163 seed, Gx and Gy of P-224, P-256,
    P-384 and P-521, and Gx and Gy of B-163, B-233, B-283, B-409 and B-571
    (1 + 8 + 10 = 19). The K-curve base points are not among them. If that list
    is the one the bundle ran, "every unexplained base-point coordinate" also
    overstates the coverage: the K-curve base points were not scanned at all.
    That snapshot is unmerged, is not hash-bound to the bundle's run, and is
    the only record read here that lists the targets, so this second point
    stays conditional. The prime-curve statements (h = 1, so G = R and Gx is
    the draw) and the B-163 seed statement are unaffected.
  scope_of_each_correction:
    README: >-
      Correction of scope, not of a measurement. Nothing here says the recorded
      scan output was wrong. Read the binary-curve part of "No hits on the 19
      targets" as "no hits on the published binary Gx and Gy, which are not the
      X9.62 draw", and read "every unexplained base-point coordinate" as
      possibly excluding the K-curves (conditional, above).
    KN-LIT-d2f917: >-
      Clarification. The sentence is a pointer to the README and inherits its
      scope. For the binary-curve base points, "negative" carries no
      information about the X9.62 draw. The rest of the sentence, the
      prime-curve base points and the B-163 seed, stands as written, still as
      outside-repository observations.
  test_that_addresses_the_draw: >-
    For information, not a basis of this correction: PR #2410 tests every R
    with hR = G, in the polynomial and the normal basis, 137 binary targets (50
    B-curve, 87 K-curve; out/scan_bin.out, out/scan_k.out, out/libs_bin.out),
    with no target hit and its planted controls found, except Maple V rand.
    Those searches (T11, T12) were computed in Python in a standalone session.
    They are unvalidated observations from an unmerged pull request, not
    evidence in this repository. The basis-conversion and halving check that
    builds the targets (gnb.gp, out/gnb.out: both halvings double back to G on
    all five B-curves) is PARI/GP, also unvalidated.
  unaffected:
    - >-
      knowledge/findings/KN-FIND-cee88d.md. It excludes the base points, says
      only that the generator scans ran outside the repository (line 97), and
      lists the binary-curve base points as unexplained (line 113).
    - >-
      ledger/evidence/EV-SCURVE-e9d71b.yaml. The base points are out of scope,
      and C5 (the scans) has no strength.
    - >-
      ledger/decisions/DEC-20261016-a12871.yaml ruling[1]. It concerns P-224's
      G only. P-224 is a prime curve with h = 1.
    - >-
      ledger/decisions/DEC-20261016-fb3a6f.yaml limitations[1] and
      ledger/corrections/CORR-20261016-0bf0b2.yaml interpretation_limits[1].
      They say only that the base-point scans ran outside the repositories,
      with no result claimed.
    - >-
      research/nist_seed_provenance_20261016/validation-20261016/validation_report.yaml
      line 501. It quotes the KN-LIT-d2f917 sentence inside the J7 labelling
      check. A quotation is not a repetition of the claim.
    - >-
      problems/nist-seed-selection-rule-unexplained.md. It makes no claim about
      the base-point scan.
  searched: >-
    knowledge/, problems/ and ledger/corrections/ in full;
    ledger/decisions/DEC-202610*, ledger/evidence/*SCURVE*,
    ledger/handoffs/TASK-202610* and research/nist_*/**/*.{md,yaml}; patterns
    "19 targets", "generator scan", "base-point scan", "seed-agnostic",
    "unexplained values", "No hits", and binary-curve or Koblitz near "base
    point". The local checkout searched is an older branch. The task brief
    states that every file named here is identical to current main. Records on
    main newer than that checkout were not searched.
  reason: >-
    The bundle presented one scan as covering the binary-curve base points
    with no hits. Under the X9.62 base-point procedure that coverage was of
    the wrong quantity. The scope error was found by the follow-up note in
    aburan28/crypto PR #2410 and checked here against the bundle README's own
    wording and, for the target count, against the unmerged snapshot source.
    AGENTS.md core rules 4 and 6: results are immutable and corrections are
    new records, and negative evidence closes only the exact tested scope.
  citations:
    - ref: ANSI X9.62-1998, Annex A.3.1 (base point as G = hR from a random R)
      provenance: internal
      claim: >-
        The base-point procedure multiplies a random point by the cofactor.
      verified_by: >-
        Not verified from the standard. This Coordinator did not retrieve ANSI
        X9.62-1998. The procedure is as stated in aburan28/crypto PR #2410,
        research/nist_basepoint_provenance_20261017/README.md, lines 14-24.
        This Coordinator also recalls that the X9.62 / IEEE P1363 procedure for
        finding a point of prime order multiplies a random point by the
        cofactor. That recollection is a pointer, not support (AGENTS.md core
        rule 9). If the standard says otherwise, this correction holds for any
        procedure that publishes hR rather than a raw draw, and the words "the
        X9.62 draw" should be read as "a draw under that procedure".
