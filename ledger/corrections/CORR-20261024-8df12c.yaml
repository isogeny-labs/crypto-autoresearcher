# =============================================================================
# CORR-20261024-8df12c -- the invalidation clause the two mtic-010b successor
# contracts copied from their parent names the parent's directory, which
# contradicts their own approved write scopes.
#
# APPEND-ONLY. experiments/EXP-SEMAEV-6e9dcf/specification.yaml (approved bytes
# sha256 57658efd..., DEC-20261019-ebf1dc) and
# experiments/EXP-SEMAEV-88c46c/specification.yaml (approved bytes sha256
# 7b45ae4c..., DEC-20261019-5b9240) are not edited and no hash is repinned.
# Raised by the owner's review of PR #2412 (discussion_r4320458095,
# 2026-10-20T01:06Z), which arrived after both successor trials had run.
# =============================================================================
correction:
  id: CORR-20261024-8df12c
  recorded_at: '2026-10-24'
  recorded_by: coordinator
  authorizing_decision: DEC-20261024-85695c
  goal_id: GOAL-ECDLP-001
  record_type: experiment_specification
  record_ids:
  - EXP-SEMAEV-6e9dcf
  - EXP-SEMAEV-88c46c
  field: invalidation_rules, second entry (EXP-SEMAEV-6e9dcf specification.yaml line 215; EXP-SEMAEV-88c46c line 212)
  prior_value: >-
    "Any archived artifact or experiment directory other than
    experiments/EXP-SEMAEV-93d5cc/ is written." (identical in both successors;
    copied verbatim from the parent EXP-SEMAEV-93d5cc)
  corrected_value: >-
    Any archived artifact, or any experiment directory other than this
    contract's own run directory (experiments/EXP-SEMAEV-6e9dcf/runs/ for
    EXP-SEMAEV-6e9dcf; experiments/EXP-SEMAEV-88c46c/runs/ for
    EXP-SEMAEV-88c46c), is written. Reading the parent's hash-checked
    dependency runs (EXP-SEMAEV-93d5cc RUN-SEMAEV-2a8498, RUN-SEMAEV-fcd67c) is
    not a write.
  defect: >-
    Copy-over defect. Read literally, the frozen clause and the same
    contract's approved execution binding cannot both hold: the frozen argv
    (trial-plan.json, command.txt) and the handoff write_scope
    (TASK-20261019-212d85: experiments/EXP-SEMAEV-6e9dcf/runs; the 88c46c
    handoff likewise) place the run outside experiments/EXP-SEMAEV-93d5cc/, and
    writing inside the parent instead would have breached the handoff scope
    and the parent's stopping rule. No compliant execution existed. The
    clause's purpose, stated by its parent, is that no archived artifact and
    no other experiment's records are written.
  timing_disclosure: >-
    This correction is filed AFTER execution, not before as the review asked.
    RUN-SEMAEV-980e8c (EXP-SEMAEV-88c46c) started 2026-10-19T01:30:34Z
    and was interrupted; RUN-SEMAEV-0e5876 (EXP-SEMAEV-6e9dcf) started
    2026-10-19T01:57:06Z, about 23 hours before the review was posted. Under
    the literal prior_value both runs trip the invalidation rule. The
    correction does not retroactively make the contract consistent at run
    time; it records what the run did against the clause's purpose and leaves
    the evidential standing of RUN-SEMAEV-0e5876 to DEC-20261024-85695c.
  observed_conduct:
    writes: >-
      Commit 93280014b7 adds 16 files, all under
      experiments/EXP-SEMAEV-6e9dcf/runs/RUN-SEMAEV-0e5876/ (the handoff's
      artifact_paths); the dependency extraction (launch.py
      unpack_dependency) writes only under that run directory. No archived
      artifact and no file of EXP-SEMAEV-93d5cc is added or modified
      (tools/check_run_immutability.py against origin/main).
    reads_outside_read_scope: >-
      The run reads experiments/EXP-SEMAEV-93d5cc/runs/RUN-SEMAEV-2a8498 and
      RUN-SEMAEV-fcd67c (arms.tar.gz, arms-manifest.json, hash-checked per
      member) through its frozen --dep argv, but the handoff read_scope lists
      only the parent's implementation/. Disclosed here; a second
      handoff-to-argv inconsistency of the same kind, not a write.
    interrupted_run: RUN-SEMAEV-980e8c was already non-evidence (AMD-EXP-SEMAEV-88c46c-20261019-successor); its standing does not change.
  integrity_effect:
    approved_bytes_edited: false
    hash_repinned: false
    archived_artifacts_edited: false
    run_records_edited: false
  status_effects:
    official_research_state_changed: false
    hypothesis_status_changed: false
    note: See DEC-20261024-85695c for the standing of RUN-SEMAEV-0e5876 in EV-SEMAEV-593b7a.
  limitations:
  - Post-execution correction; it cannot restore a pre-registered consistent contract.
  - The parent EXP-SEMAEV-93d5cc clause is correct for the parent and is not changed.
