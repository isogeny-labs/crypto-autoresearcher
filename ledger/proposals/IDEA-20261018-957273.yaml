  title: >-
    Meet-LWE with CBD-shaped representations: do eta-ary representation weights beat the ternary
    analysis for CBD(2)/CBD(3) secrets at n=32-64?
  class: algorithm
  claim: >-
    May's Meet-LWE representation technique, generalized to secrets with the exact CBD(eta)
    symbol distribution on {-eta..eta} (representations split each symbol into two summands
    drawn from a tuned distribution), achieves a measured time exponent c (log2 time / n)
    at least 10% below the same algorithm using a ternary-style representation on CBD(2) secrets
    at n in {32,48,64}, q=3329. It remains far above the primal lattice attack at the same
    n; the claim concerns the combinatorial exponent, not a break.
  mechanism: >-
    Representation counts grow with the number of ways to write a symbol as a sum; CBD(eta)
    puts mass 6/16, 4/16, 1/16 on 0, +-1, +-2 (eta=2), so tuned summand distributions can
    produce more representations per list element than a ternary-weight split. More representations
    allow stronger filtering modulo partial q-ary constraints, shrinking lists. This changes
    the exponent coefficient of the combinatorial attack, which is the term hybrid attacks
    combine with lattice reduction.
  tracked_object: >-
    Measured list sizes per level and total time (counted vector additions) of Meet-LWE on
    CBD(eta) secrets, tuned-representation vs ternary-representation.
