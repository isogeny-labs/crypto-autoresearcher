idea:
  id: IDEA-20261029-e4edce
  status: proposed
  approved_by: null
  title: Partial multigraded Macaulay layers instead of whole-degree expansion
  class: composition
  claim: Reduce measured algebraic solving work on structured prime-field PDP by combining source-defined partial
    Macaulay degree layers with valid multigrading; this does not assert lower intrinsic regularity.
  mechanism: R1/R3 polynomial presentation, coordinate-dependent under exact polynomial consequence operations.
    Group variables by membership/carry layer and curve/divisor block; first check whether a valid multi-homogenization
    exists and charge its extra variables and infinity components. At a degree frontier, generate a frozen
    ordered subset of border monomial multiples rather than the complete next total-degree Macaulay matrix.
    Expand until an independently verified root or refutation certificate is obtained. Compare partial ungraded,
    full multigraded and partial multigraded arms separately. The external ingredients are the 2026 smoothing
    submatrix method and 2025 multi-homogeneous XL; semi-regular or border-regular assumptions must be tested,
    not imported into elliptic systems.
  novelty_status: adaptation
  citations:
  - ref: https://eprint.iacr.org/2026/408
    provenance: retrieved
    claim: Specific Macaulay submatrices can avoid excess whole-degree work under stated assumptions; no lower
      intrinsic invariant theorem for PDP.
    verified_by: Primary abstract read.
  - ref: https://eprint.iacr.org/2025/2060
    provenance: retrieved
    claim: Multi-homogeneous XL and border-regular rank conditions.
    verified_by: Primary abstract read; implementation field support must be checked before reuse.
  assumptions:
  - User requests factor-base/SAT research; execution is not authorized here.
  - Implicit membership is not an asserted escape from KN-OPEN-020.
  proof_search_map:
    bottleneck: Peak matrix dimension and arithmetic work in the last degree layer, not the mathematical regularity
      itself.
    baseline_embedding:
      parameter_slice: Use identical relation predicate with the established solver.
      reproduction_check: Exact model sets including sign and exception conventions at smallest sizes.
    observation_collision:
      observable: Cost paired with exact relations.
      distinct_preimage_search: Elliptic and null systems with equal displayed statistics.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Specified in mechanism.
      predicted_gain: Conditional; not measured.
    quantifier_order: Exists a fixed policy improving held-out declared instances; every accepted relation
      valid. No universal scaling claim.
    method_ceiling:
      strongest_certifiable_claim: Finite-family solver result.
      nearby_object_control: Matched null without the proposed structure.
    proof_obligations:
    - claim: Exact encoding, pruning and complete accounting.
      responsibility: correctness
  predictions:
  - metric: peak_matrix_entries_and_field_ops
    direction: lower
    minimum_effect: 'Proposed screen: 2x lower entries and 20 percent lower complete solve work without increased
      UNKNOWN rate.'
  minimal_test:
    design: Reproduce one source calibration instance first. Freeze a small prime-field solver corpus with
      full-layer certificates available; ablate partial selection and multigrading independently. Compare complete
      solve/refutation outputs at equal memory caps and record all attempted submatrix ranks.
    controls:
    - Exact tiny oracle; uniform and separately labelled planted targets.
    - Identical domains, signs, exceptions and setup allowance.
    - Matched algebraic null and known-positive instrument control.
    required_metrics:
    - verified_model_count
    - actual_solving_degree
    - field_operations
    - matrix_rows_columns_rank
    - memory_peak
    - total_cost_per_verified_relation
    - exception_coverage
  falsification_conditions:
  - Required source rank assumptions fail and selected matrices reach full size before success.
  - Variable inflation or saturation at infinity removes the work benefit.
  - Improvements disappear once selection, retries and root extraction are charged.
  confounders:
  - A lower first-fall degree or lower equation degree being mistaken for lower solving cost.
  - Selected targets or omitted chart cases making the candidate easier.
  interpretation_limits:
  - Proposal only; no experiment or improvement established.
  - Prime-field scope; regularity, solving degree and work are distinct.
  - Independent relation verification; incomplete means UNKNOWN.
  - This is primarily a solver-work improvement candidate; a smaller submatrix is not evidence that d_reg fell.
  heuristic_assumptions:
  - id: H1
    statement: A proper source-defined fraction of the final degree layer supplies the needed pivots on the
      declared structured PDP distribution.
    rigorous_support: The papers give conditional rank models for their stated classes; transfer to PDP is
      not proved.
    validation_plan: Measure actual rank increment and certificate completion against the full matrix, with
      random multihomogeneous and elliptic controls and tail failures.
  target_complexity:
    time_exponent: Unknown. Cost P+(B/rho)C+soft-O(B^2)+descent. With m=5,B near N^(1/5),constant rho, C=N^gamma
      requires gamma<3/10 to beat sqrt(N). Unachieved.
    memory_exponent: Unknown; charge solver, setup, relation state; rho has small memory.
    best_known: Pollard rho O(sqrt(N)); PDP comparator is best matched exact loop/MITM/solver.
    hidden_overhead: Factor-base construction, failed attempts, chart coverage loss, roots/sign recovery, rank
      independence, preprocessing and descent.
    tradeoff_note: Parallel targets possible; charge setup at actual reuse count.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: Tiny proposed discriminating tests; no budget granted.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-5931ee
    - KR-IC-5a43e5
    - KR-IC-fbdb61
    - KR-IC-0d2021
    - KR-IC-5765d2
    nearest:
    - ref: KR-IC-0d2021
      provenance: kb
      relation: adjacent
      delta: Partial degree-layer submatrices and valid multigrading applied to PDP, not lower intrinsic regularity.
    - ref: KR-IC-fbdb61
      provenance: kb
      relation: adjacent
      delta: Invariants are distinct; selected matrix work does not lower last-fall degree by definition.
    - ref: LEAD-ICE-prime-field-semaev-solving-degree
      provenance: internal
      relation: adjacent
      delta: Its negative serial-eliminant exponents stand; this tests smaller degree-layer work without a
        new degree law.
    searched:
    - 2687-row proposal index and referenced full records, current root audit.
    lead: LEAD-ICP-digit-presentation-solving-degree
  recommended_priority: medium
  question_id: RQ-PFDR-ae2fba
  internal_predecessors:
