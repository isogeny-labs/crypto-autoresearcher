    relation: known ingredients
    delta: Existing map records 2026 smoothing. Proposed implementation delta is partial multigraded layers
      on the exact prime-field PDP instances.
  - ref: LEAD-ICP-digit-presentation-solving-degree
    relation: overlap
    delta: Adaptive staircases are already proposed; source-defined partial-layer selection and proof-equivalent
      comparison specify a narrower backend experiment.
