idea:
  id: IDEA-20261109-27a130
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-3fae8b
  title: Dedicated d-free dual addition (8M) with its exceptional set certified exactly as the cyclic
    4-torsion coset, used as the planted incompleteness control for the exhaustive harness
  class: control
  claim: 'The dual addition law in extended coordinates with a = -1: A = X_1 X_2, B = Y_1 Y_2, C = Z_1
    T_2, D = T_1 Z_2, E = D + C, F = (X_1 - Y_1)(X_2 + Y_2) + B - A, G = B - A, H = D - C, X_3 = E F,
    Y_3 = G H, T_3 = E H, Z_3 = F G, costs 8M + 0c + 7a (7M when Z_2 = 1) and computes affinely x_3 =
    (x_1 y_1 + x_2 y_2)/(y_1 y_2 + a x_1 x_2), y_3 = (x_1 y_1 - x_2 y_2)/(x_1 y_2 - x_2 y_1). Over F_p
    with d non-square and sqrt(-1) rational, Z_3 = 0 holds exactly when Q - P lies in the cyclic subgroup
    {O, (0,-1), (sqrt(-1),0), (-sqrt(-1),0)} generated by T_4 = (sqrt(-1), 0); on every other pair the
    output equals the complete law. Consequently, for P and Q both in the prime-order subgroup the only
    exception is P = Q. The exhaustive harness must report exactly 4n exceptional ordered pairs on the
    small analogue with n = #E(F_p''), each satisfying the coset condition; reporting 0 exceptions means
    the harness cannot see incompleteness and is itself failed. Pass threshold: exceptions = 4n, coset
    condition on all of them, 0 disagreements elsewhere, and the Sage identity (x_1 y_1 + x_2 y_2)(1 +
    d x_1 x_2 y_1 y_2) - (x_1 y_2 + y_1 x_2)(y_1 y_2 + a x_1 x_2) in the curve ideal.'
  mechanism: F = 0 means x_1 y_2 = x_2 y_1, i.e. Q lies on the line x = r y with r = x_1 / y_1. Substituting
    into -x^2 + y^2 = 1 + d x^2 y^2 gives d r^2 y^4 + (r^2 - 1) y^2 + 1 = 0, a quadratic in y^2 whose
    roots multiply to 1/(d r^2); one root is y_1^2 (giving Q = P and Q = P + (0,-1)), the other is 1/(d
    x_1^2), which forces x^2 = 1/(d y_1^2), a non-square times a square, so not rational. G = 0 means
    y_1 y_2 = x_1 x_2, the line x = y_1 x_2 ... with ratio 1/r; the rational solutions are (sqrt(-1) y_1,
    sqrt(-1) x_1) and its negative, which are P + T_4 and P - T_4 because (x_1, y_1) + (sqrt(-1), 0) =
    (sqrt(-1) y_1, sqrt(-1) x_1) under the complete law with a = -1. Degenerate cases x_1 y_1 = 0 are
    checked directly and land in the same coset. The 2-part of E(F_p) is cyclic since (0,-1) is the only
    rational 2-torsion point when d is non-square, so the exceptional coset is all of E[4](F_p). The symmetry
    used is the dual-law involution exchanging the two Edwards addition laws; they have disjoint exceptional
    sets, which is why this law is the right control object.
  novelty_status: unverified
  citations:
  - ref: Hisil, Wong, Carter, Dawson 2008, dedicated addition add-2008-hwcd-2
    provenance: recalled
    claim: Source of the d-free 8M dedicated addition.
    verified_by: null
  - ref: Bernstein and Lange, A complete set of addition laws for incomplete Edwards curves
    provenance: recalled
    claim: The two Edwards addition laws have disjoint exceptional sets.
    verified_by: null
  - ref: src/ecc/ed25519.rs
    provenance: internal
    claim: The repository uses only the unified law; no dedicated law and no completeness test exist.
    verified_by: formula-engineer session 2026-11-09 read BRIEF section 1 excerpt
  assumptions:
  - Small analogue selected as in the harness lead with d' non-square and p' = 5 mod 8.
  - E(F_p')[2^infinity] cyclic of order 8, which follows from d' non-square.
  predictions:
  - metric: exceptional ordered pairs on the small analogue
    direction: equal
    minimum_effect: exactly 4n
  - metric: pairs with Z_3 = 0 whose difference is outside the T_4 coset
    direction: equal
    minimum_effect: exactly 0
  - metric: disagreements with the complete law on non-exceptional pairs
    direction: equal
    minimum_effect: exactly 0
  minimal_test:
    design: small_field_exhaustive.py enumerates all n^2 ordered pairs, applies the dual law in extended
      coordinates, classifies Z_3 = 0 pairs by Q - P computed with the complete law, and compares the
      rest; verify_formulas.sage proves the two cross-multiplied identities modulo the curve ideal over
      symbolic a, d.
    controls:
    - The unified law on the same pairs must report 0 exceptions.
    - A deliberately broken dual law (sign flip in F) must report a count different from 4n.
    required_metrics:
    - n, 4n, counted exceptions
    - histogram of Q - P over the exceptional pairs
    - disagreement count
    - op vector {M:8, c:0, a:7} from the counting harness
  falsification_conditions:
  - Exception count differs from 4n.
  - Any exceptional pair has Q - P outside the T_4 coset.
  - Any non-exceptional pair disagrees with the complete law.
  - Sage ideal membership fails.
  confounders:
  - Choosing a small analogue with d' square would add rational points at infinity and change the exception
    set; the selector rejects such d'.
  interpretation_limits:
  - This law is not proposed for secret-dependent paths; it is the control proving the harness detects
    incompleteness, plus a 7M mixed add usable only where the coset condition is certified.
  heuristic_assumptions:
  - id: H1
    statement: The exceptional set computed symbolically over the generic locus is exactly the rational
      coset after accounting for non-square d.
    rigorous_support: Case analysis in the mechanism; exhaustive check on the analogue.
    validation_plan: Exhaustive enumeration at p' and the Sage identities.
  target_complexity:
    time_exponent: not applicable
    memory_exponent: O(n^2) pair enumeration, under 10^6 pairs
    best_known: 8M dedicated add, HCD 2008
    hidden_overhead: none
    tradeoff_note: 1c saved against loss of completeness on a known coset
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: HCD 2008 dominates the formula; the exact rational exceptional-set certificate is the
    deliverable.
  sota_delta: 'Repository delta: first executable completeness certificate; the harness is proven able
    to detect incompleteness. Literature delta: the coset statement is a specialisation to d non-square
    and cyclic E[4].'
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: Curve25519 formula-verification campaign; no ECDLP mechanism is claimed.
