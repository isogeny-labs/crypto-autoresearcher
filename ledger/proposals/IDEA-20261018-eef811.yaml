  minimal_test:
    design: >-
      Implement both encodings over a SHAKE256-truncated digest; for each of 512 revealed
      vectors per cell, grind 2^22 digests and count dominating ones; compare to exact counts
      by dynamic programming over integer vectors.
    controls:
    - >-
      null: random revealed vectors drawn uniformly from the code space rather than from signatures
      (removes signature-induced checksum skew)
    - >-
      positive: planted encoding with the checksum removed, where domination probability must
      be orders of magnitude higher
    - 'A/A: the checksum arm run under two disjoint seed blocks'
