  title: >-
    Cross-user batching under per-key PK.seed: measured multi-target preimage gain across
    U keys, distinct versus shared seeds
  class: composition
  claim: >-
    A classical multi-target preimage search against F-chain values exposed by U users gains
    a factor equal to the number of targets in one tweak domain. With distinct PK.seed per
    user the gain is capped at the per-user exposure t, and with a shared (planted) PK.seed
    it rises to U*t; measured at n in {24,28,32} bits, U in {1,16,256}, the distinct-seed
    arm shows no cross-user gain (slope of log cost vs log U within 0.1 of 0) while the shared-seed
    arm shows slope -1 within 0.1.
  mechanism: >-
    Tweakable hashes keyed by PK.seed put each user in a separate function family, so a single
    evaluation tests membership against one user's targets only. Multi-user security of SLH-DSA
    thus rests on PK.seed uniqueness. The experiment measures this directly so that cost tables
    can use per-user t rather than global t, with an explicit check of the failure mode (seed
    reuse).
  tracked_object: >-
    Number of hash evaluations until first preimage hit against any target, as a function
    of U and seed regime.
