  title: >-
    Verification malleability census at reduced n: accepted mutations per signature field,
    against a planted lax verifier
  class: measurement
  claim: >-
    At reduced n (8 and 12 bytes) with toy h, d, k, a, single-bit and single-field mutations
    of honest signatures are accepted by a reference-faithful verifier only through hash collisions,
    with the accepted-mutation rate per field matching 2^{-8n} times the field's collision
    surface; a strong-unforgeability gap appears only where the verifier ignores bytes (for
    example trailing bytes or unused auth-path nodes). A census of accepted mutations per
    field, compared with a planted lax verifier, decides whether any field of an SLH-DSA signature
    is non-binding.
  mechanism: >-
    Every signature byte should enter a hash whose output is compared to the public root.
    Fields that are recomputed rather than compared (FORS secret values, WOTS chain values,
    auth-path nodes) can be altered only if a hash collision maps the altered input to the
    same output; at n of 8 bytes that rate is measurable. A field that is parsed but never
    hashed would be accepted at rate 1, which is a SUF-CMA break independent of the hash.
    The census therefore separates hash-limited malleability from parsing-limited malleability.
  tracked_object: >-
    Accepted fraction of mutated signatures per field (R, FORS sk values, FORS auth paths,
    WOTS sigs per layer, auth paths per layer, length/trailing bytes).
