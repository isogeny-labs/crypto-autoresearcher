  question_id: RQ-ECDLP-002
  title: Pole-complete Riemann–Roch filtration for the native constructor
  class: control
  status: proposed
  proposed_by: idea-generator
  novelty_status: adaptation
  claim: 'Distinguish rank excluded by the cubic regular-pole rule from rank added by a larger Riemann–Roch space
    on the SAME curve/base. Candidate: completed V3 or V4 adds a projected direction. Both may give none; principal-divisor
    and Riemann–Roch identities are known.'
  mechanism: 'PAIR: R3 functions with exact pole/divisor certificates projected to norm rows; Sigma is multiplication
    within the declared pole filtration. Class partial-action: norm rows add on admissible witnesses, not all translations.
    Forget coefficients/auxiliary support compatibly with norm; charge witness fibres. On C:y^2=f6=x^6+A*x^2+B and
    H=infinity_++infinity_-, V3=L(3H)=span(1,x,x^2,x^3,y), V4=L(4H)=span(1,x,x^2,x^3,x^4,y,xy), dimensions 5,7.
    First complete V3 poles: leading cubic +/-1 is currently excluded, although degree-drop intersections can be
    valid. pi2(infinity_+/-)=(0,+/-B); unequal poles require their signed correction, not zero companion sum. Then
    F=A4+(b0+b1*x)*y in V4, with the SAME source plus three atom constraints, generically leaves a projective plane
    of choices. A4^2-(b0+b1*x)^2*f6 has degree <=8, residual degree <=4 after four forced roots. Check exact poles/base
    factors/multiplicities. a4=b1=0 recovers V3. Keep x=0 chart completion separate.'
