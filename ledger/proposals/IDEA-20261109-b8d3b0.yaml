  assumptions:
  - L is below N/2 so the x-coordinates of kP are distinct.
  - Toy curves have prime order and are not j = 0 or j = 1728.
  predictions:
  - metric: nontrivial energy divided by L^4/p at theta 0.3 to 0.5
    direction: within
    minimum_effect: between 0.5 and 2 for at least 8 of 10 generators per curve
  - metric: fraction of Sidon X_L at theta 0.2 versus exp(-L^4/(2p))
    direction: within
    minimum_effect: inside the two-sided binomial 95 percent interval
  - metric: nontrivial energy of the interval control divided by L^3
    direction: higher
    minimum_effect: at least 0.5
  minimal_test:
    design: For 3 prime-order curves with p at most 2^22 from crypto/docs/ECDLP_CALIBRATION_PRIMES.md
      and 10 random generators P each, compute X_L for L = floor(p^theta), count coincidences of pair
      sums with a hash table (at most 2^22 pairs), subtract trivial quadruples, and compare with L^4/p.
      Run 20 random L-subsets of F_p per (curve, theta) and the interval [1, L] as positive control.
    controls:
    - Random L-subsets of F_p, 20 seeds.
    - Interval control with energy near 2L^3/3.
    - Generators chosen by recorded seeds, not by coordinate.
    required_metrics:
    - L and theta
    - E(X_L) and nontrivial energy
    - L^4/p reference and random control mean and standard deviation
    - Sidon indicator per generator at theta 0.2
    - interval control energy
  falsification_conditions:
  - Nontrivial energy above 5 L^4/p at theta at least 0.3 for 7 of 10 generators on all 3 curves indicates
    structure and kills the random reading.
  - Nontrivial energy below 0.2 L^4/p in the same pattern indicates anti-structure and also kills the
    random reading.
  - Interval control not detected makes the run invalid.
  - Timeouts are infrastructure, not evidence.
  confounders:
  - At theta = 0.2 the expected count L^4/p is below 1; only the Sidon fraction is informative there.
  - Coincidences involving x(kP) = x((N-k)P) are excluded by L < N/2.
  interpretation_limits:
  - The theorem part is about certification, not about truth; the measurement part is a toy-size heuristic
    reading.
  - No statement about Pollard-type methods is made or implied.
  heuristic_assumptions:
  - id: H1
    statement: X_L behaves like a random L-subset of F_p for additive energy when L is below sqrt(p).
    rigorous_support: None; the Weil route is trivial for L below p.
    validation_plan: Exhaustive measurement as in the minimal test.
  target_complexity:
    time_exponent: N^{1/2} unchanged, delta 0
    memory_exponent: O(L^2) hash table at toy size
    best_known: Pollard rho, Theta(N^{1/2}) (KR-RHO-13bf67)
    hidden_overhead: None; no algorithm is proposed.
    tradeoff_note: Barrier plus measurement; no tradeoff defined.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  sota_delta: Exponent delta 0. States the exact window (L below p) in which the additive structure of
    x-coordinates of multiples is beyond character sums and supplies the first exhaustive energy and Sidon
    numbers there.
