idea:
  id: IDEA-20261109-b8d3b0
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Additive energy and Sidon statistics of the x-coordinate set of the first L multiples below
    sqrt(p): the Weil-blind window L < p and an exhaustive measurement at p up to 2^22'
  class: barrier
  claim: 'Barrier (theorem) and measurement (prediction fixed in advance). Let X_L = {x(kP) for 1 <= k
    <= L} in F_p with L = p^theta, and let E(X_L) be the number of quadruples in [1,L]^4 with x(aP) +
    x(bP) = x(cP) + x(dP). Theorem part: E(X_L) is at most L^4/p + L times the square of max over a not
    0 of |sum_{k<=L} e_p(a x(kP))|, and the only available bound on that sum, completion through the hybrid
    sums with |S(a,xi)| at most 2 sqrt(p) + O(1), gives at most C sqrt(p) log p; so E(X_L) is at most
    L^4/p + C^2 p L log^2 p, which exceeds the random reference 2L^2 - L + L^4/p for every L below p.
    Hence no analysis that relies on the F_p-additive structure, or randomness, of x-coordinates of consecutive
    multiples is certifiable or refutable by exponential sums below L = p, and the structural kill of
    wave 1 covers only L above 3 sqrt(p). Measurement part: on 3 prime-order curves with p at most 2^22
    and 10 generators each, the nontrivial energy E(X_L) - (2L^2 - L) lies in 0.5 to 2 times L^4/p for
    theta in {0.3, 0.4, 0.5}, and for theta = 0.2 the fraction of generators with X_L Sidon matches exp(-L^4/(2p))
    within binomial error. No exponent change is claimed.'
  mechanism: 'E(X_L) = p^{-1} sum over a of |S_L(a)|^4 where S_L(a) is the sum of e_p(a x(kP)) over k
    at most L. Parseval fixes the second moment at pL, so the fourth moment is controlled only through
    the sup of |S_L(a)|, and completion to the full group yields sqrt(p) log p, which is the size of a
    single Weil term and cannot see a set of L elements when L is below p. The Balog-Szemeredi-Gowers
    and Freiman theorems convert an energy of L^3/K into a K^{-O(1)}-dense piece of X_L with small doubling,
    i.e. an interval-like set of x-coordinates of consecutive multiples; wave 1 excluded such pieces for
    L above 3 sqrt(p) by degree arguments. Below sqrt(p) the statement has no proof in either direction,
    which is the window this measurement fills. Families whose analyses are affected: sieves over multiples,
    short-window fingerprints and public-scalar bases (IDEA-20260731-015), all of which assume X_L is
    additively random or structured.'
  novelty_status: adaptation
