  title: >-
    Cross-implementation differential verify: the boundary cases FIPS 204's verifier must
    reject, fuzzed across five open implementations
  class: tooling
  claim: >-
    Mutating valid ML-DSA signatures at the predicate boundaries (||z||_inf exactly gamma1
    - beta, hint index lists non-increasing or with nonzero padding, omega-th hint slot, trailing
    bytes, c_tilde length) and running them through PQClean, liboqs, BoringSSL/AWS-LC, RustCrypto
    ml-dsa, and Go circl, at least one implementation-pair disagrees on at least one boundary
    class, or all agree on every class and the harness's positive control (a deliberately
    loosened verifier) is flagged on all classes. Either outcome is decidable.
  mechanism: >-
    Byte-level verifier semantics are where conformance bugs live; an accept fibre counted
    in one spec is not the same as agreement across implementations. A differential oracle
    with targeted boundary mutations finds disagreements cheaply, and a planted off-by-one
    verifier calibrates the harness's detection power.
  tracked_object: per boundary class, the accept/reject vector across implementations
