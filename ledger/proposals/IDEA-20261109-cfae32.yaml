idea:
  id: IDEA-20261109-cfae32
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-9d5d44
  title: Small-order test on Edwards25519 as the quartic U^4 = V^4, in two squarings
  class: algorithm
  claim: Formula-engineering claim, not an ECDLP claim. For a rational point $(X:Y:Z:T)$ on $-x^2+y^2=1+dx^2y^2$,
    $p=2^{255}-19$, cofactor 8, put $U=Y+X$, $V=Y-X$. Then $[8]P=O$ iff $XY(X^2+Y^2)=0$ iff $U^4=V^4$.
    The test is $U^2=V^2$ (order dividing 4) or $U^2=-V^2$ (order 8). Cost 2S + 3a and two comparisons,
    0M, 0I, no use of $Z$, $T$ or $d$. It replaces a cofactor multiplication followed by an identity test,
    which under the assumed baseline costs 12M + 12S + 3 fe_mul by 2 + 1I + 2M.
  mechanism: The doubling in the repository gives $T(2P)=EH$ and $Z(2P)=FG$ with $E=2XY$, $H=-(X^2+Y^2)$,
    $G=Y^2-X^2$, $F=G-2Z^2$. Doubling is complete because $d$ is a non-square, so $FG\ne0$. $E(\mathbb
    F_p)[4]$ is $\{(0,\pm1),(\pm\sqrt{-1},0)\}$, which is the locus $T=0$. Hence $[8]P=O$ iff $[2]P\in
    E[4]$ iff $EH=0$ iff $XY(X^2+Y^2)=0$. Finally $U^2-V^2=4XY$ and $U^2+V^2=2(X^2+Y^2)$, so $8XY(X^2+Y^2)=U^4-V^4$.
    $U$ and $V$ are the eigen-coordinates of translation by the order-4 point, which maps $U\mapsto iU$,
    $V\mapsto-iV$ and so preserves $U^4=V^4$.
