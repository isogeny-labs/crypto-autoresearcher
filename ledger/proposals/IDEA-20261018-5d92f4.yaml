  title: >-
    Scaling-collapse test for matrix NTRU: is the transition a function of flattened dimension
    and dense-sublattice rank ratio only?
  class: mechanism
  claim: >-
    For matrix NTRU with invertible secret F (d x d over R) and G (m x d), the lattice has
    dimension (d + m)n and a dense sublattice of rank dn, ratio rho = d/(d + m). Claim: log2
    q* collapses onto a single function of N = (d + m)n and rho across (d, m) in {(1,1), (1,2),
    (2,1), (2,2), (1,3)}, with residuals below 0.15 in log2 q; the ring rank-1 case sits on
    the curve. Distinct from IDEA-20260809-2866e0, which locates the transition per rank:
    here a specific collapse law is tested and the rectangular lever varies rho independently
    of N.
  mechanism: >-
    The dense-sublattice event depends on the sublattice's rank and covolume relative to the
    full lattice's determinant and dimension. If ring or module structure only enters through
    those, all variants with equal (N, rho) and secret norm behave alike. A failure of collapse
    would indicate structure beyond geometry, e.g., module automorphisms.
  tracked_object: log2 q* per (d, m, n) with bootstrap CI and residual from the fitted collapse
    function.
