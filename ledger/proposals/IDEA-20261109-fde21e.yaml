idea:
  id: IDEA-20261109-fde21e
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Statistical x-label propagation through point addition over F_p: the Wagner/Kuperberg merge
    gain measured exhaustively at p <= 2^14 against a random relabelling control at the scale the Weil
    envelope cannot cover'
  class: barrier
  claim: 'Toy measurement, predictions fixed before any run. On a prime-order curve E/F_p, 2^12 <= p <=
    2^14, generator P_0, label map pre_t(x) = floor(x 2^t / p), let T_t(A,B,C) count pairs (a,b), 1 <=
    a,b < N, a + b not 0 mod N, with pre_t x(aP_0) = A, pre_t x(bP_0) = B, pre_t x((a+b)P_0) = C; let
    E_t = n_A n_B n_C/(N-1)^2 from label marginals, G_t = max T_t/E_t (merge gain) and D_t = t - H(C |
    A,B) in bits (deficit). Prediction for t in 2..5: G_t - 1 <= 5 sqrt(2^{3t} t)/(N-1) and D_t <= 3 2^{3t}/(N-1)^2
    (at t = 4, p near 2^14: 0.04 and 5e-5), each within a factor 2 of the same statistic on a random symmetric
    relabelling of Z_N. A confirmed prediction says a Wagner-type merge on x-labels, the classical twin
    of Kuperberg''s sieve, gets no boost at the one scale where no theorem forbids one. No exponent claim.'
  mechanism: 'Kuperberg''s sieve and Wagner''s k-tree combine two list elements and keep the result only
    when a label is zeroed, which needs a label determined by the summands'' labels. On a prime-order
    group no deterministic propagating projection exists (IDEA-20260806-c5d183 as cited in IDEA-20260806-071255),
    and the representation technique over F_{p^2} pays p^{1.314} for this reason (KR-RHO-5b1c0a). The
    open residue is statistical propagation. Expanding the three interval indicators in F_p-characters,
    every nontrivial term is a two-variable sum W(u,v,w) = sum_{P,Q} e_p(u x(P) + v x(Q) + w x(P+Q)) with
    |W| <= C_W p under square-root cancellation, so |T/E - 1| <= C_W 2^{3t} L(p)^3/p with L(p) = sum |hat
    1_I| about (2/pi) ln p. A 2^j-list Wagner merge with lists of size N^{1/(1+j)} needs t = log_2 N/(1+j)
    zeroed bits per level, so 2^{3t} >= N for j <= 2: the envelope is vacuous exactly there, at every
    size. The table is built from one enumeration of x(aP_0); no walk, no summation polynomial, no sieve
    is run.'
  novelty_status: adaptation
  citations:
  - ref: KR-RHO-5b1c0a
    provenance: internal
    claim: Representation/subset-sum ECDLP over F_{p^2} costs p^{1.314} with non-propagating labels; this
      record measures that assumption over F_p.
    verified_by: REPO BRIEF 2026-11-09 section 3 row; file not opened
  - ref: IDEA-20260806-071255
    provenance: internal
    claim: Cites IDEA-20260806-c5d183 proving the deterministic propagating-projection search is empty
      on prime-order groups.
    verified_by: REPO BRIEF section 2 index line; record not opened
  - ref: KR-IC-73db3f
    provenance: internal
    claim: In binary fields subspace labels propagate after Weil descent; prime fields have no subspace,
      so the statistical question is the right one here.
    verified_by: REPO BRIEF 2026-11-09 section 3 row; file not opened
  assumptions:
  - N prime; pairs with a + b = 0 mod N excluded.
  - Labels use the balanced prefix floor(x 2^t / p), not raw top bits.
  predictions:
  - metric: G_t - 1 at t = 4 on a curve with p near 2^14
    direction: lower
    minimum_effect: at most 0.05
  - metric: D_t in bits at t = 4 on a curve with p near 2^14
    direction: lower
    minimum_effect: at most 5e-5
  - metric: (G_t(curve) - 1)/(G_t(control) - 1) over t in 2..5
    direction: different
    minimum_effect: inside [0.5, 2] on at least 4 of 5 curves
  minimal_test:
    design: Five prime-order curves with p in [2^12, 2^14] from crypto/docs/ECDLP_CALIBRATION_PRIMES.md
      (generated by point counting if that file lacks the range). Enumerate L[a] = x(aP_0) once. For each
      t in 2..5 and each label map in {balanced prefix, low t bits, x mod d for d in 3,5,7, Legendre symbol
      at t = 1} accumulate T_t over all (a,b) by table lookup (about 2^28 lookups), form E_t from marginals,
      report G_t, D_t and chi-square. Repeat with L replaced by a random symmetric relabelling (same value
      at a and -a, same multiplicities). Print the envelope value with C_W = 1 beside each measurement.
      On one j = 0 curve with p = 1 mod 3 add the label pre_t(x^3 mod p). Deliver as cryptanalysis/experiments/qshadow-merge-bias-<date>
      with input, receipt and replay, or a script beside crypto/sage.
    controls:
    - Random symmetric relabelling through identical code paths, two independent draws.
    - Pairs with x(aP_0) = x(bP_0) are doubling pairs, excluded and counted.
    required_metrics:
    - N, p, t, label map
    - G_t, D_t, chi-square, degrees of freedom
    - control G_t, D_t from two relabellings
    - envelope value C_W 2^{3t} L(p)^3/p
    - count of excluded pairs
  falsification_conditions:
  - 'G_t - 1 >= 0.5 at some t <= log_2 N/3 on at least 3 of 5 curves while both controls stay below 0.1:
    statistical propagation exists and the Wagner shadow must be re-costed.'
  - D_t exceeds 100 times the control deficit on at least 3 curves.
  - A control exceeding its own random prediction by a factor 5 marks an invalid run, not evidence.
  - A timeout is infrastructure, neither falsification nor support.
  confounders:
  - Doubling pairs carry exact algebraic structure; excluded.
  - Unequal label marginals; handled by E_t from marginals.
  - On j = 0 curves the x-label distribution has an exact order-3 symmetry.
  - Discreteness at t = 5 where E_t falls below 2^12.
  interpretation_limits:
  - Counts at p <= 2^14; nothing is proven at 2^256.
  - Even G_t = 2 is a constant per merge level; an exponent change needs gain 2^{t(1-o(1))} with t = log_2
    N/3.
  - Says nothing about binary fields, where KR-IC-73db3f labels do propagate.
  heuristic_assumptions:
  - id: H1
    statement: Two-variable sums W(u,v,w) over E x E satisfy |W| <= C_W p for (u,v,w) not all zero, with
      C_W small.
    rigorous_support: Weil gives <= 9p when one of u, v, w is zero (products or shifts of one-variable
      sums); the general case needs a Deligne-type nondegeneracy check not done here.
    validation_plan: At p <= 2^9 compute all W exactly as the 3-D DFT of the triple histogram H(x1,x2,x3)
      and report max |W|/p.
  - id: H2
    statement: The product-of-marginals null with a symmetric relabelling is the right reference.
    rigorous_support: None beyond exchangeability of labels under relabelling.
    validation_plan: Two independent relabellings bound the null's own spread.
  target_complexity:
    time_exponent: 1/2 unchanged, delta 0. A Wagner merge on x-labels with 2^j lists would need exponent
      1/(1+j) and gain 2^t per level; this record predicts gain 1.
    memory_exponent: O(1) beyond the toy table of N x-values
    best_known: Pollard rho, Theta(sqrt N) group operations, KR-RHO-13bf67
    hidden_overhead: None; a measurement.
    tradeoff_note: No time-memory tradeoff is defined or used.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: KR-RHO-13bf67 for any exponent reading; IDEA-20260806-c5d183 for the deterministic case.
    Neither states the statistical merge gain.
  sota_delta: 'Exponent delta 0. Measured delta: G_t and D_t at the Weil-vacuous scale, which no filed
    record reports.'
