  title: >-
    Signed-C cancellation ratio in Simon 2026 Lemma 3, measured by exact simulation at reduced
    group size
  class: measurement
  claim: >-
    In Simon's DCP erasure step (KN-LIT-e204ab), the amplitude gap between h*=0 and h*=1 is
    a signed sum over z* of count differences times C_{z*}. At reduced bit-length n in {6,8,10}
    and reduced group exponent c in {1,2,3}, the cancellation ratio R = |sum_z C_z| / sum_z
    |C_z| is at most 0.1 on average over secrets, so the bound in Lemma 3 that treats C as
    well-behaved fails at these sizes, and the measured bias of h* toward d_n is below 0.05.
  mechanism: >-
    KN-LIT-e204ab names the signed-C cancellation as the entire game and KN-LIT-3b271a reports
    a no-go for the algorithm. Both are text-level. The quantity is classically computable
    at small n: the B-side contributions C depend only on the low bits of z* and are explicit
    sums of roots of unity over measured y values, so one can enumerate them exactly. A measured
    R near 1 would support Lemma 3's intent; R near 0 with negligible bias would corroborate
    the no-go numerically and pin which step fails.
  tracked_object: >-
    Per-instance cancellation ratio R and the exact probability that the Hadamard measurement
    of h* returns d_n, as functions of (n, c, number of groups).
