  title: >-
    Parallel efficiency of G6K sieving from 1 to 64 threads at d=70-85: is core-SVP time a
    sequential fiction under shared bandwidth?
  class: measurement
  claim: >-
    Core-SVP prices total operations as if they parallelize freely. Measured G6K throughput
    (pair tests per second) at d=70-85 on one node scales with efficiency E(t) = speedup/t
    that falls below 0.6 at t=64, and the fall steepens with d (memory-bandwidth saturation).
    If E(64) >= 0.85 at all d, parallel memory contention is negligible at this scale and
    the objection is falsified.
  mechanism: >-
    Bucketed sieves share one database; as threads grow, DRAM bandwidth and cache coherence
    become the bottleneck rather than arithmetic. An attacker's area-time cost then includes
    idle arithmetic, so a parallel attack's real cost exceeds the operation count by 1/E.
    The d-dependence of E reveals whether this is a constant or an exponent-level effect.
  tracked_object: Parallel efficiency E(t,d) of pair-test throughput for bgj1 and BDGL kernels.
