  claim: Test whether admitting x=0 source/interpolation points, with the SAME old m16 base/schedule and regular
    cubic/residual rules, adds a projected row direction. Isolated chart control; historical results remain valid
    within their exclusions.
  mechanism: 'PAIR: R3 principal witnesses with projective quotient chart projected to E norm rows; Sigma is certified
    row composition on its domain. Class partial-action: norm additivity preserves rows while discarding deck/auxiliary
    witnesses, not a full-translation quotient. On C:y^2=x^6+A*x^2+B, B nonzero, pi1=(x^2,y) is regular at zero.
    pi2=(B/x^2,B*y/x^3) extends to E2 identity since local parameter W/V=x/y vanishes; Context.pi2 already returns
    None there, including historical zero residuals; reuse this normalization, not a new map implementation. lift_source
    nevertheless rejects root x=0, and descriptor rejects zero interpolation abscissae. Complete only these admissibility
    rules. Distinct-x Lagrange interpolation permits zero; source/base coincidences still fail distinctness. Deck
    signs coalesce at the ramification point: count stabilizers/aliases, not extra rows. Keep regular (3,3) poles,
    base, residual rule and schedule unchanged; degree-drop, Hermite and V4 changes are separate.'
