idea:
  id: IDEA-20261109-420317
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Lattice small-root bound for Semaev decomposition over F_p, measured beta_max for S_3 and S_4
    against the 1/(m+1) requirement
  class: decomposition
  claim: 'Closure with a price tag, predictions fixed before any run. For curves y^2 = x^3 + b over F_p,
    p in {2^64, 2^96, 2^128}, plant x_1..x_m < p^beta, set x_R = x(-(P_1 + ... + P_m)) and try to recover
    (x_i) from S_{m+1}(X_1..X_m, x_R) = 0 mod p with a Jochemsz-May lattice (shift parameter up to 3,
    LLL then BKZ-20 via fpylll, dimension at most 120). Predictions: the largest beta with at least 90
    percent recovery satisfies beta_max(2) <= 0.25 and beta_max(3) <= 0.125 at every p, and the ratio
    of the sub-rho requirement 1/(m+1) to beta_max is at least 1.3 and does not decrease with m. Hence
    lattice small-root methods cannot supply the polynomial-time decomposition that would make prime-field
    index calculus cost N^{2/(m+1)}. No exponent change is claimed.'
  mechanism: With a polynomial-time decomposition oracle the balanced prime-field cost is N^{2/(m+1)}
    at B = N^{1/(m+1)} (IDEA-20260727-003), below rho for m >= 4. Decomposition with x_i < B is a multivariate
    modular small-root problem, the one classical polynomial-time tool for box constraints over F_p. Coppersmith-type
    lattices recover roots only when the product of bounds is below a p^{1/delta}-type threshold, delta
    the degree, and S_{m+1} has degree 2^{m-1} in each variable with a full-box Newton polytope (IDEA-20260723-006),
    so no sparsity helps. The expected gap between beta_max and 1/(m+1) is a factor of several at m =
    2 and widens with m; this record measures it so a frontier row can state it with data.
  novelty_status: known
  citations:
  - ref: KR-IC-5931ee
    provenance: internal
    claim: Small-x index calculus over F_p is no better than generic under statistical assumptions; a
      lattice box solver is one concrete solver inside that closure.
    verified_by: REPO BRIEF 2026-11-09 section 3 quotation only; filer must open knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  - ref: IDEA-20260727-003
    provenance: internal
    claim: Free-decomposition floor for prime-field Semaev index calculus as a function of beta and m;
      this record tests the only polynomial-time candidate for the oracle.
    verified_by: REPO BRIEF 2026-11-09 section 2 index excerpt; filer must open ledger/proposals/IDEA-20260727-003.yaml
      for the exact floor
  assumptions:
  - Recovered roots are verified by recomputing the point sum; a lattice root failing the check is not
    a success.
  - The exact Jochemsz-May bound for bidegree (2,2) is derived in the sibling notes file before the run
    and recorded as the pre-registered expectation.
  predictions:
  - metric: beta_max(2) at 90 percent recovery
    direction: lower
    minimum_effect: at most 0.25 at every p
  - metric: beta_max(3) at 90 percent recovery
    direction: lower
    minimum_effect: at most 0.125 at every p
  - metric: ratio of 1/(m+1) to beta_max(m)
    direction: higher
    minimum_effect: at least 1.3 and non-decreasing in m
  minimal_test:
    design: For m in {2, 3}, p in {2^64, 2^96, 2^128}, beta from 0.05 to 0.35 in steps of 0.01, 30 planted
      instances per cell; record recovery rate, lattice dimension, LLL and BKZ time. Compare with a random
      polynomial of the same monomial support and a planted small root under the same lattice.
    controls:
    - Random polynomial of equal monomial support with planted small root; its beta_max is the generic
      bound.
    - Unplanted instances to measure spurious recoveries.
    - Recovery verified by point addition on the curve.
    required_metrics:
    - recovery rate per beta, m, p
    - beta_max per m, p with interval
    - generic-control beta_max
    - lattice dimension and reduction time
  falsification_conditions:
  - beta_max(2) >= 1/3 or beta_max(3) >= 1/4 reproduced at two p values with verified roots falsifies
    the closure; check for an encoding bug first since it contradicts KR-IC-5931ee.
  - 'Abandonment rule: beta_max(2) <= 0.25 and beta_max(3) <= 0.125 at all three p closes the lattice
    route with a KR row.'
  - A Semaev beta_max exceeding the generic-control beta_max by more than 0.03 is structure and must be
    explained before closing.
  confounders:
  - BKZ block size and shift parameter move beta_max by a few hundredths; report the best over the grid.
  - At p = 2^64 small roots may be found by brute force in the control; keep beta above 0.05.
  interpretation_limits:
  - One lattice family is measured; it bounds Coppersmith-type methods, not every small-root method.
  - Closes the polynomial-time hope for box constraints; the SAT question is the sibling slope record.
  heuristic_assumptions:
  - id: H1
    statement: Jochemsz-May lattices on S_{m+1} reach at most the generic bound for their monomial support.
    rigorous_support: Heuristic (algebraic independence of reduced vectors), as in all multivariate Coppersmith
      results.
    validation_plan: The generic-control comparison in minimal_test.
  target_complexity:
    time_exponent: 'Needed: polynomial-time decomposition at beta = 1/(m+1), giving N^{2/(m+1)} (N^{2/5}
      at m = 4). Predicted: beta_max far below that at every m, so the lattice route stays at N^1 collection.
      Delta 0.'
    memory_exponent: Lattice dimension at most 120; irrelevant to the attack exponent.
    best_known: Pollard rho, Theta(p^{1/2}) (KR-RHO-13bf67); prime-field index calculus no better than
      generic (KR-IC-5931ee).
    hidden_overhead: None claimed.
    tradeoff_note: No tradeoff; the method finds the root in polynomial time or not at all.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: KR-IC-5931ee dominates the exponent reading. No row records the lattice small-root bound
    for summation polynomials.
  sota_delta: 'Exponent delta 0. Documented delta: a measured beta_max table and a new frontier row closing
    Coppersmith-type decomposition over F_p.'
