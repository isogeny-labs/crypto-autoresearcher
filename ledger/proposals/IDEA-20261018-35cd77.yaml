  predictions:
  - id: P1
    metric: '|median beta*(CBD) - median beta*(Gaussian)|'
    direction: lower
    minimum_effect: < 1
    falsified_by: '>= 2 with CI excluding 0'
  - id: P2
    metric: IQR ratio CBD/Gaussian
    direction: different
    minimum_effect: within [0.8,1.25]
    falsified_by: outside [0.6,1.6]
  minimal_test:
    design: >-
      Same public matrices A (n=40,k=2,q=3329), 150 instances; for each draw s,e from CBD(2),
      discrete Gaussian sigma=1, and uniform with variance matched by scaling support/probabilities;
      progressive G6K to verified recovery.
    controls:
    - 'null: two independent CBD(2) draws on the same A (difference must be ~0)'
    - 'positive: Gaussian with variance 1.5x (beta* must increase measurably)'
    - 'A/A: CBD arm with two reduction seed blocks'
  falsification_conditions:
  - 'P1: difference >= 2'
  - positive control shows no increase (instrument too coarse)
  confounders:
  - matching variance for uniform requires non-integer support weights
  - progressive step granularity
  interpretation_limits:
