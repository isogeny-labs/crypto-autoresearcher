  title: >-
    Does the Gaussian surrogate for CBD errors misprice primal success? Matched-variance CBD
    vs discrete Gaussian vs uniform beta*
  class: control
  claim: >-
    Estimators replace ML-KEM's CBD(eta) secret and error by Gaussians of equal variance.
    On primal instances at lattice dimension 120-160, the median success block size for CBD(2)
    differs from the matched-variance discrete Gaussian by < 1 block size, while uniform {-2..2}
    of different kurtosis but matched variance also differs by < 1. If any pair differs by
    >= 2 with CI excluding 0, the variance-only surrogate is not adequate and estimator inputs
    must carry the shape.
  mechanism: >-
    uSVP success depends on the norm of the projected planted vector, which by concentration
    depends mostly on the variance; higher moments enter through the spread of the projected
    norm (excess kurtosis of CBD(2) is -0.25). The effect on the median beta should be small
    but on the spread could be visible. IDEA-20260808-90632c addresses the projected-norm
    ratio law; this measures the attack outcome directly.
  tracked_object: >-
    Distribution of beta* for three error laws with identical variance, paired instances (same
    A).
  novelty_status: unverified
  novelty_note: >-
    No novelty screen has run. kb citations were opened by the drafting session; recalled
    ones are pointers only (AGENTS.md rule 9).
  citations:
  - ref: KN-LIT-061
    provenance: kb
    claim: the estimator convention tested
    verified_by: knowledge/literature/KN-LIT-061.md (opened by the drafting session)
  - ref: KN-LIT-108
