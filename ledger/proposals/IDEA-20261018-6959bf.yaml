  title: >-
    Information per sample of extrapolated dihedral coset states versus plain DCP, as a function
    of extrapolation width
  class: measurement
  claim: >-
    BKSW eDCP states (KN-LIT-4706) superpose j in [0, M) with amplitude profile f(j) instead
    of j in {0,1}. Computed exactly for N in {2^8..2^16}, the Fourier-sampling mutual information
    between the measured y and the secret s grows with M at least as log M for Gaussian profiles,
    so eDCP samples carry more information than DCP samples; the per-sample gain at the M
    implied by LWE noise rates is at least 3 bits.
  mechanism: >-
    If extrapolated samples are informationally richer, the equivalence suggests that eDCP-specific
    algorithms might need fewer samples than DCP sieves. Exact distributions of y given s
    are computable classically, giving the information budget per sample, which bounds any
    algorithm's sample count from below.
  tracked_object: I(Y; s) per eDCP sample under uniform s, versus M and amplitude profile.
