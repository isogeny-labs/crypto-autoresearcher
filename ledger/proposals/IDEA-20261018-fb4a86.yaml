  title: >-
    Hedging priced against faults: differential recovery needs 2^{h/2} same-message queries
    with h-bit rnd; census of mode-independent faults
  class: composition
  claim: >-
    For single-bit faults on c (or on mu before the challenge hash), differential recovery
    z - z' = (c - c') s1 needs two signatures of the same message with the same mask. In deterministic
    mode this needs 2 signing queries; with an rnd source of h bits it needs about 2^{h/2}
    same-message queries; with caller-supplied rnd (an API exposing it) it collapses to 2.
    Measured on real ML-DSA-44 with simulated faults, median queries to recovery fit 2^{h/2}
    within factor 2 for h in {8..24}, and a census of fault positions shows which positions
    are mode-independent (attack works in hedged mode at h = 256).
  mechanism: >-
    rho'' = H(K || rnd || mu): equal masks need equal (rnd, mu). A fault after rho'' (e.g.
    on c) with the mask reused gives an exact linear relation. Hedging thus converts a 2-query
    attack into a birthday search over rnd. Faults that do not need mask reuse (e.g. zeroing
    y, skipping the addition) are unaffected by hedging; the census separates the two classes,
    which is a mode-dependent fault boundary.
  tracked_object: same-message signing queries to s1 recovery, per fault position and per
    rnd entropy h
