idea:
  id: IDEA-20261109-d4263a
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-9d5d44
  title: Complete co-Z sum-and-difference on extended Edwards25519 in 13M + 1c
  class: algorithm
  claim: Formula-engineering claim, not an ECDLP claim. For extended points $P_j=(X_j:Y_j:Z_j:T_j)$ on
    $-x^2+y^2=1+dx^2y^2$, $k=2d$, compute $U_j=Y_j+X_j$, $V_j=Y_j-X_j$, $A=V_1V_2$, $B=U_1U_2$, $A'=V_1U_2$,
    $B'=U_1V_2$, $C=k\,(T_1T_2)$, $D=2Z_1Z_2$, $E=B-A$, $H=B+A$, $E'=B'-A'$, $H'=B'+A'$, $F=D-C$, $G=D+C$,
    $Z_\pm=FG$. Then $P_1+P_2=(EF:GH:Z_\pm:EH)$ and $P_1-P_2=(E'G:FH':Z_\pm:E'H')$. Cost 13M + 1c + 11a
    against 16M + 2c + 18a for two unified additions. Both outputs share one $Z$. The pair is complete
    on $E(\mathbb F_p)$, including $P_1=\pm P_2$ and all torsion inputs, and is branch-free.
  mechanism: 'Negating $P_2$ acts on layer 1 by $U_2\leftrightarrow V_2$ and $T_2\mapsto-T_2$, so $(A,B)\mapsto(A'',B'')$,
    $C\mapsto-C$, $D\mapsto D$, hence $F\leftrightarrow G$. The unified outputs $X=EF$, $Y=GH$, $Z=FG$,
    $T=EH$ become $E''G$, $FH''$, $GF$, $E''H''$. $Z=D^2-C^2$ is invariant because the two denominators
    $1\pm d\,x_1x_2y_1y_2$ are exchanged. Shared work is $C$, $D$ and $Z_\pm$. Count: 4M for $A,B,A'',B''$;
    2M + 1c for $C,D$; 1M for $Z_\pm$; 6M for the remaining outputs. Completeness is inherited from the
    unified law since $d$ is a non-square.'
  novelty_status: unverified
  citations:
  - ref: BRIEF section 1, src/ecc/ed25519.rs excerpt (EdPoint::add, EdPoint::neg)
    provenance: internal
    claim: A sum and a difference currently cost two add calls and a neg.
    verified_by: idea-generator session 2026-11-09 read the BRIEF excerpt
  - ref: Hisil, Wong, Carter, Dawson 2008, Twisted Edwards curves revisited
    provenance: recalled
    claim: Unified law used for both halves; pointer only.
    verified_by: null
  assumptions:
  - $a=-1$, $d$ non-square; $k=2d$ is a cached constant.
  - Inputs satisfy $XY=ZT$.
