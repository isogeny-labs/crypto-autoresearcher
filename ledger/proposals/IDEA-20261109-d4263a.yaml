    minimum_effect: exactly 0 on every pair
  minimal_test:
    design: Assertion A9 of scripts/ed25519_law_ansatz.py on 20 random pairs and the diagonal; then a
      Rust add_sub beside EdPoint::add with an fe_mul counter, used to build {A, B, A+B, A-B} for verification.
    controls:
    - Two separate EdPoint::add calls on the same inputs.
    - Inputs P1 = P2, P1 = -P2 and the eight torsion points.
    required_metrics:
    - fe_mul count per pair for both arms
    - affine equality of both outputs with the control
    - equality of the two Z coordinates
  falsification_conditions:
