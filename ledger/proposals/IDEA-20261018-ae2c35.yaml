  title: >-
    Batch-CVP after one sieve: measured per-query cost of Voronoi-slicer CVPP at d=50-70 versus
    the per-guess Babai cost hybrids assume
  class: measurement
  claim: >-
    Hybrid attacks pay one CVP (or BDD) per combinatorial guess, usually priced as Babai nearest-plane
    on a reduced basis. Using a sieve-preprocessed list for CVPP (Doulgerakis-Laarhoven-de
    Weger style iterative slicing), the measured per-query cost at d=50-70 for BDD targets
    at the hybrid's distance is 2^{c_q d} with c_q <= 0.1 and success >= 0.9 where Babai succeeds
    < 0.5. This changes the hybrid optimum when ported to estimator parameters by >= 3 bits.
    If c_q >= 0.2 or success does not exceed Babai's, the estimator's Babai pricing stands.
  mechanism: >-
    With a list of short lattice vectors from one sieve, iterative slicing reduces a target
    toward the Voronoi cell; amortized over many targets, the per-query cost is subexponential-ish
    in the list size and can succeed at distances where Babai fails, allowing smaller preprocessing
    beta in the hybrid. Estimators fix the BDD step as Babai; the tradeoff curve between preprocessing
    and per-query success is unmeasured at Kyber shape.
  tracked_object: >-
    Per-query counted cost and success rate of slicer CVPP vs Babai for BDD targets at relative
    distance r in {0.5,0.7,0.9} of the gh, on Kyber-shaped projected sublattices.
