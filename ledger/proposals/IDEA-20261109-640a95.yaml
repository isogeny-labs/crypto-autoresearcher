    claim: -1 is a square and d a non-square on Edwards25519.
    verified_by: this session read the BRIEF
  assumptions:
  - 'Completeness of the unified law (used to identify denominators) holds: a square, d non-square.'
  - E[4](F_p) is cyclic of order 4; the test enumerates it from E[8](F_p) by doubling.
  predictions:
  - metric: pairs (P_1, P_2) in the torsion test with Z_3 = 0
    direction: equal
    minimum_effect: exactly those with P_1 - P_2 in E[4](F_p), none else
  - metric: projective disagreement with the unified law off E[4]
    direction: equal
    minimum_effect: 0 disagreements over 10000 random pairs
  minimal_test:
    design: 'Sage script edwards25519_dual_law.sage: build E[8](F_p); for all pairs in E[8] x (E[8] union
      {B,...,8B}) compute the dual law and assert (Z_3 == 0) == (P_1 - P_2 in E[4]); for 10000 random
      pairs assert X_3^u Z_3^d = X_3^d Z_3^u and Y_3^u Z_3^d = Y_3^d Z_3^u against the unified law. Rust:
      a test module calling both laws.'
    controls:
    - 'Null object: the same enumeration over a small p'' = 1 mod 4 with every point of E(F_p'') confirms
      the exception set is exactly a coset structure of size #E * 4.'
    - Unified law reports zero exceptional pairs on the same inputs.
    required_metrics:
    - count of exceptional pairs
    - count of pairs with P_1 - P_2 in E[4]
    - disagreements with unified law
    - mul and constant-mul counters (8 and 0)
  falsification_conditions:
  - Any pair with Z_3 = 0 and P_1 - P_2 not in E[4](F_p), or vice versa.
  - Any projective disagreement with the unified law off the exception set.
  confounders:
  - Random pairs almost never hit E[4]; the exhaustive torsion grid is the only informative test of the
    exception set.
  interpretation_limits:
  - Operation counts and exception sets for one formula; no ECDLP statement. 1c saved over HCD uncached
    is 0 saved over the Niels-cached unified law.
  heuristic_assumptions:
  - id: H1
    statement: The exceptional divisor of the dual law is the rational 4-torsion coset structure.
    rigorous_support: Derivation above from the two numerators of P_1 - P_2.
    validation_plan: Exhaustive torsion grid; small-prime full enumeration as null object.
  target_complexity:
    time_exponent: not an exponent claim; 8M + 10a per addition
    memory_exponent: none
    best_known: 8M + 1c unified (HCD), 8M cached unified (record 1)
    hidden_overhead: incompleteness requires a guard or a second law
    tradeoff_note: saves 1c, costs completeness; useful only as oracle or closure-complete system
  estimated_cost:
