idea:
  id: IDEA-20261109-640a95
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-3fae8b
  title: 'Dual addition law on Edwards25519 (8M, no constant): exceptional exactly when P_1 - P_2 lies
    in the rational 4-torsion, and not completable by any coordinate rescaling'
  class: algorithm
  claim: 'On -x^2 + y^2 = 1 + d x^2 y^2 over F_p, p = 2^255 - 19, with extended inputs (X_i:Y_i:Z_i:T_i),
    Z_i != 0, Z_i T_i = X_i Y_i, the dual law A = (Y_1 - X_1)(Y_2 + X_2), B = (Y_1 + X_1)(Y_2 - X_2),
    C = 2 Z_1 T_2, D = 2 T_1 Z_2, E = D + C, F = B - A, G = B + A, H = D - C, X_3 = E F, Y_3 = G H, T_3
    = E H, Z_3 = F G returns P_1 + P_2 with Z_3 T_3 = X_3 Y_3 at 8M + 10a, 0c, 0S, and Z_3 = 0 if and
    only if P_1 - P_2 lies in E[4](F_p) = {(0,1), (0,-1), (i,0), (-i,0)}, i = sqrt(-1). In affine terms
    x_3 = (x_1 y_1 + x_2 y_2)/(y_1 y_2 - x_1 x_2), y_3 = (x_1 y_1 - x_2 y_2)/(x_1 y_2 - y_1 x_2). The
    exceptional set is invariant under every rescaling (X_i:Y_i:Z_i:T_i) -> (l X_i: l Y_i: l Z_i: l T_i)
    and contains the rational pairs P_1 = P_2, so no choice of representatives, cache or constant folding
    makes this law complete on Edwards25519. The law is therefore filed as a test oracle for the unified
    law (they must agree projectively whenever P_1 - P_2 is outside E[4]) and as the second member of
    a complete system over the algebraic closure, not as a hot-path replacement.'
  mechanism: 'F = 2(X_1 Y_2 - Y_1 X_2), G = 2(Y_1 Y_2 - X_1 X_2), E = 2(T_1 Z_2 + Z_1 T_2), H = 2(T_1
    Z_2 - Z_1 T_2). Cross-multiplying the dual and unified affine laws and eliminating d x_i^2 y_i^2 =
    -x_i^2 + y_i^2 - 1 with both curve equations gives identities, so the two laws agree wherever both
    denominators are nonzero. Exception set: F = 0 is x_1 y_2 = y_1 x_2, which is the numerator of x(P_1
    - P_2) = (x_1 y_2 - y_1 x_2)/(1 - d x_1 x_2 y_1 y_2) with nonvanishing denominator (unified law complete),
    so F = 0 iff x(P_1 - P_2) = 0 iff P_1 - P_2 in {(0,1), (0,-1)}; G = 0 is the numerator of y(P_1 -
    P_2) = (y_1 y_2 - x_1 x_2)/(1 - d x_1 x_2 y_1 y_2), so G = 0 iff y(P_1 - P_2) = 0 iff P_1 - P_2 in
    {(i,0), (-i,0)}. Together: Z_3 = 0 iff P_1 - P_2 in the cyclic group of order 4 generated by (i,0).
    Rigidity: the conditions X_1 Y_2 = Y_1 X_2 and Y_1 Y_2 = X_1 X_2 are bihomogeneous of bidegree (1,1),
    hence rescaling-invariant; a law is complete over F_p iff its exceptional divisor {P_1 - P_2 in S}
    has S(F_p) empty, and here S = E[4](F_p) is rational. The symmetry used is translation invariance
    of the exceptional divisor. In a prime-subgroup scalar multiplication the exception is exactly P_1
    = P_2, reachable in the final iterations for specific scalars, so the law is not constant-time-safe
    alone.'
  novelty_status: unverified
