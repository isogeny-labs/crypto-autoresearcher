  title: >-
    Quantum ISD cost tables for HQC under depth caps: Grover-Prange and quantum-walk variants
    with MAXDEPTH and QRAM as axes
  class: tooling
  claim: >-
    Recomputing Grover-Prange and quantum-walk ISD costs for HQC-1/3/5 under depth caps D
    in {2^40, 2^64, 2^96} and with or without QRAM shows that the published quantum estimates
    (KN-LIT-de5373) move by at least 10 bits across conventions, and that under D = 2^64 without
    QRAM at least one parameter set's quantum cost is within 5 bits of its category floor;
    a reduced statevector check of Grover-Prange on n <= 20 qubit search spaces validates
    the iteration law.
  mechanism: >-
    Quantum ISD gains come from Grover over information sets plus quantum walks for list steps;
    depth caps force parallelism that erodes Grover gains, and walk variants need QRAM. Published
    numbers fix one convention; the table makes the convention an axis.
  tracked_object: Table of log2 quantum cost per set, algorithm, D, QRAM flag.
