idea:
  id: IDEA-20261109-44ec24
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Small-multiplier ratio statistic of the small-x factor base over F_p - free division-polynomial
    relations P_i = +-k P_j counted against a Poisson null from one exhaustive log table
  class: representation
  claim: 'Let F_L = {P in E(F_p) : x(P) < L} on a prime-order toy curve, B = |F_L|, and A = {log_P(Q)
    : Q in F_L} its symmetric log set in Z/N. For each k with 2 <= k <= K define c_k = #{a in A : k a
    in A}. Each such coincidence is a relation P_i = +-k P_j, a root of the scalar polynomial C_k, usable
    without any Semaev solve. Prediction: for every k not in {+-1}, c_k is Poisson with mean B^2/N up
    to the exact total sum c_k over all k equal to B(B-1), and max_{2<=k<=K} c_k does not exceed the 0.999
    Poisson quantile at K = 10^4 and B near sqrt N. Relevance: index calculus from such relations needs
    K >= N/(eps B) multipliers where eps = max_k c_k N/B^2, costing at least N/eps field operations, so
    only eps of order sqrt N would move the exponent; the prediction is eps <= 10.'
  mechanism: The small-x predicate is a coordinate condition; its log set A behaves as a random symmetric
    subset of Z/N for additive statistics (wave 1 additive-energy record, barriers-wave energy tautology).
    Multiplicative structure in A is the distinct statement that A is nearly closed under a small dilation
    k, i.e. that x(kP) < L is correlated with x(P) < L. Exponential-sum heuristics predict no correlation;
    the GLV dilation lambda has x(lambda P) = omega x(P), whose residue mod p is uncorrelated with x(P)
    < L, so even lambda gives mean B^2/N. The statistic is computed exactly from one exhaustive log table.
  novelty_status: adaptation
  citations:
  - ref: KR-IC-5931ee
    provenance: internal
    claim: Naive prime-field index calculus cannot beat generic methods under stated assumptions; this
      record tests a relation source that bypasses decomposition.
    verified_by: REPO BRIEF section 3 row text, Mythos run 2026-11-09.
  - ref: KR-RHO-0528e7
    provenance: internal
    claim: The lambda dilation is the one known multiplicative structure on the curve; it is a constant
      factor.
    verified_by: REPO BRIEF section 3 row text, Mythos run 2026-11-09.
  - ref: IDEA-20260805-a9a95d
    provenance: internal
    claim: Exact relation-count identity for symmetric factor bases; the sum of c_k over all k is the
      analogous exact total here.
    verified_by: REPO BRIEF section 2 ledger index excerpt, 2026-11-09.
  assumptions:
  - N is prime so every nonzero a in Z/N has a unique k with b = k a for each b.
  - The exhaustive log table enumerates all N multiples of P once; no sampling.
  predictions:
  - metric: eps = max over 2 <= k <= K of c_k N / B^2
    direction: lower
    minimum_effect: at most 10 at every tested prime, matching the random symmetric control within noise
  - metric: chi-square distance of the c_k histogram from Poisson(B^2/N)
    direction: lower
    minimum_effect: within the 95 percent band on all curves
  minimal_test:
    design: For four prime-order curves with p between 2^20 and 2^26 from crypto/docs/ECDLP_CALIBRATION_PRIMES.md,
      build the exhaustive log table, take L near sqrt p and near p^{2/3}, form A, and compute c_k for
      2 <= k <= 10^4 by hashing A. Report the histogram, eps, chi-square, and multiplicative energy sum
      of c_k^2 over all k.
    controls:
    - Random symmetric subset of Z/N of size B, same statistics.
    - Positive control {+-g^j: j <= B/2} for a random g, which must show c_g near B.
    - Arithmetic-progression-in-x base {x = c + j d} as a second structured arm.
    required_metrics:
    - p, N, L, B
    - c_k histogram and eps
    - chi-square statistic
    - multiplicative energy
    - control values per arm
  falsification_conditions:
  - eps exceeds 10 on two or more curves while the random control stays below 5.
  - The c_k histogram departs from Poisson at the 99.9 percent level for the small-x arm but not the control.
  - The positive control fails to show c_g near B, which invalidates the run as a pipeline fault.
  confounders:
  - k = +-1 are tautological and excluded; k near N/2 corresponds to small negative multipliers and is
    covered by symmetry.
  - At L near sqrt p the mean B^2/N is about 1, so the maximum over 10^4 values of k has a natural Poisson
    tail near 7.
  interpretation_limits:
  - A null result at toy p is heuristic evidence, not a proof, that multiplier relations give no relation-supply
    boost.
  - Even a positive eps of 10 moves no exponent; only eps near sqrt N would.
  heuristic_assumptions:
  - id: H1
    statement: The indicator of x(P) < L and the indicator of x(kP) < L are uncorrelated for every fixed
      k not in {+-1}.
    rigorous_support: Expected from Weil-type bounds on hybrid sums (barriers-wave lead), which control
      each k separately with error p^{-1/2} polylog; not proved uniformly over k here.
    validation_plan: Exact c_k census at four primes against the Poisson null and the random control.
  target_complexity:
    time_exponent: p^{1/2} unchanged
    memory_exponent: N words for the toy log table
    best_known: Pollard rho, Theta(p^{1/2}) group operations, KR-RHO-13bf67.
    hidden_overhead: None claimed; the statistic is a census, not an algorithm.
    tradeoff_note: Verification of a candidate relation costs one scalar multiplication; supply, not verification,
      is the obstruction.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: KR-IC-5931ee dominates any index-calculus reading; it does not measure multiplier relations.
    The wave 1 additive-energy record measures the additive analogue only.
  sota_delta: Exponent delta 0 predicted. New content is the first multiplicative (dilation) census of
    a prime-field factor base log set with an explicit eps threshold tied to the exponent.
