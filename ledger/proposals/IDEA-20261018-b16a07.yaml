  title: >-
    Structure-blindness test for quantum enumeration: is the Montanaro tree size on ring and
    module bases the same as on plain LWE?
  class: control
  claim: >-
    The quantum-frontier schema classifies rows as structure-blind or structure-dependent,
    but for quantum enumeration (KN-LIT-3072) the cost is a function of the classical enumeration
    tree size T (roughly sqrt(T) quantum steps). On BKZ-reduced bases of plain LWE, Ring-LWE
    (x^d+1) and Module-LWE (rank 2,4) embeddings of identical total dimension 40..70, the
    measured log2 T for the same pruning radius differs by less than 1 bit across structures,
    so the row is structure-blind by measurement.
  mechanism: >-
    If T depends only on the Gram-Schmidt profile, and the profile after BKZ is indistinguishable
    between structured and plain bases (the usual assumption), then quantum enumeration's
    exponent cannot see the ring. Measuring T exactly with fpylll node counts tests the classification
    instead of asserting it, and a planted-structure positive control shows the instrument
    detects a profile difference when one exists.
  tracked_object: >-
    Exact enumeration node count T (fpylll, fixed pruning coefficients and radius) on the
    last projected block after BKZ-beta, per structure.
