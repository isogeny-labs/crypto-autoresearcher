  assumptions:
  - p = 1 mod 3, N =
  - The unitary group of the standard rank-2 Hermitian form over Z[omega] is the monomial group of order
    72; the test recounts it.
  predictions:
  - metric: median over k of m_1(k) divided by N^{1/2}
    direction: inside interval
    minimum_effect: between 0.25 and 0.90 at every toy N tested
  - metric: maximum over k of m_1(k) divided by N^{1/2}
    direction: lower
    minimum_effect: at most 1.56
  - metric: number of isometry classes among {L_k} divided by (N+1)
    direction: inside interval
    minimum_effect: between 1/24 and 1/12
  minimal_test:
    design: For j = 0 prime-order curves with N in [10^3, 10^5] (sage), compute pi = a + b omega from
      t and p. For every k build L_k as a rank-4 Z-lattice, LLL-reduce, record m_1(k) and a canonical
      reduced Hermitian Gram form; count distinct classes. Then, for 200 random k, measure the smallest
      T at which exhaustive search over Nm a, Nm c <= T finds [c]P = [a]Q and compare with m_1(k).
    controls:
    - Random rank-4 Z-lattices of covolume 3N/4 for the Gaussian-heuristic median.
    - Random lines in F_N^2 pulled back to Z^4 without the Z[omega] structure.
    required_metrics:
    - m_1(k) for all k
    - median and maximum of m_1 / sqrt(N)
    - class count and fibre sizes of k -> class
    - first detecting T versus m_1 on the 200 sampled k
  falsification_conditions:
  - Median m_1 / sqrt(N) below 0.25 or above 0.90 at any tested N.
  - Some k with m_1 > 1.56 sqrt(N) (would indicate an error in (i)).
  - Class count outside [(N+1)/24, (N+1)/12].
  - An invariant of the class computable in o(sqrt(N)) group operations is exhibited (would be a result,
    not this record).
  confounders:
  - Reduced-form canonicalisation over Z[omega] may merge classes if units are mishandled; use a Z-canonical
    form as cross-check.
  interpretation_limits:
  - A confirmed scaling is a constant at toy N; the exponent 1/2 is untouched.
  - The 24-fold fibre bound depends on the unimodular overlattice count, checked only at toy N.
  heuristic_assumptions:
  - id: H1
    statement: Across k the lattices L_k behave as random determinant-N Hermitian lattices for the first
      minimum (Gaussian heuristic).
    rigorous_support: Minkowski gives the upper bound only; the Siegel-Weil average of representation
      numbers (lead 4) would make the mean rigorous.
    validation_plan: Compare the empirical distribution of m_1 with the random-lattice control at three
      sizes of N.
  target_complexity:
    time_exponent: N^{1/2} unchanged (delta 0)
    memory_exponent: N^{1/2} for the claw, O(1) for the lattice statement
    best_known: Pollard rho at Theta(N^{1/2}) with the sqrt(6) CM constant (KR-RHO-13bf67, KR-RHO-0528e7)
    hidden_overhead: none claimed; no algorithm is proposed
    tradeoff_note: The claw of (iv) is a time-memory balanced search and is not proposed as an algorithm;
      it prices the moduli point.
  estimated_cost:
    implementation: low
    compute: low
