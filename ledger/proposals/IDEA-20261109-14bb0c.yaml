idea:
  id: IDEA-20261109-14bb0c
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Ratio lattice L(P,Q) of Eisenstein pairs with [c]P = [a]Q is the Hermitian class of the (1,N)-polarised
    surface E^2/<(P,Q)>: minima scale as N^{1/2} and the moduli point is a claw, exponent delta 0'
  class: representation
  claim: 'Let E/F_p have j = 0, End(E) = Z[omega], prime order N, Frobenius pi, n = (pi - 1) the prime
    of norm N, and Q = kP. Put L_k = {(a,c) in Z[omega]^2 with c = k a mod n}, form Nm a + Nm c. (i) L_k
    is the Hermitian lattice of A = E^2/<(P,Q)> with the polarisation descended from N times the product
    polarisation; it has determinant N and type (1,N), and A is isomorphic to E^2 through (R,S) -> ((pi-1)R,
    S - theta R) for any theta = k mod n. (ii) The map k -> isometry class of L_k is at most 24-to-1:
    the unitary group of O_K^2 (order 72) acts on P^1(F_N) by k -> zeta k and k -> zeta/k, and a second
    unimodular overlattice, if it exists, at most doubles the fibre; so the number of classes lies in
    [(N+1)/24, (N+1)/12] and the class determines k up to that fibre. (iii) The first minimum m_1(k) obeys
    m_1 <= 1.56 N^{1/2} for every k (Minkowski in dimension 4, covolume 3N/4) and its median over k lies
    in [0.25, 0.90] N^{1/2}. (iv) The class invariants reachable from (P,Q) are the representation numbers
    r_k(m); each representation is a coincidence [c]P = [a]Q, and finding one with Nm a, Nm c <= T is
    a claw between two lists of about 3.6T elements, nonempty only when T is about m_1. The record claims
    no exponent change.'
  mechanism: Gamma = <(P,Q)> is the only cyclic order-N subgroup of (E x E)(F_p) computable from the instance;
    it is isotropic for e_N, so N lambda_prod descends. The pullback computation M^* H_A M = N I with
    M = [[pi-1, 0], [-theta, 1]] gives H_A = adj(M M^*), whose lattice is M^{-1}(O_K^2) = (1/(pi-1)) L_k
    up to scaling. The GLV reading is that the shortest vector of L_k is the smallest Eisenstein ratio
    c/a = k mod n, a two-dimensional-over-Z[omega] analogue of the GLV decomposition; RESEARCH_GLV_HNP.md
    holds the repo lattice conventions. Nothing here evaluates an isogeny or a pairing.
