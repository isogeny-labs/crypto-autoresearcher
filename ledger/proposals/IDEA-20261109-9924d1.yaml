      provenance: internal
      relation: adjacent
      delta: The row is a cost theorem under statistical assumptions; this record measures the fourth-moment
        behaviour of one assumption.
    - ref: KR-IC-73db3f
      provenance: internal
      relation: orthogonal
      delta: Subspace factor bases live in binary fields; intervals in F_p have no linear structure, which
        is what the energy probes.
