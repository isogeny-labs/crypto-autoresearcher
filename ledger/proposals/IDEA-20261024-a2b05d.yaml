idea:
  id: IDEA-20261024-a2b05d
  title: >-
    Arity / oracle-order threshold for Semaev index calculus: the two-term cost
    model made exact, with both oracle semantics, as a machine-checked theorem
  class: control
  question_id: RQ-ECDLP-361f3a
  claim: >-
    Within the two-term cost model (H1-H4), an arity-m index calculus whose
    decomposition oracle costs B^k per attempt (B = r^beta) has cost exponent
    inf over beta equal to 2/(m+1-k) for 0 <= k <= 2 and k/(m-1) for
    2 <= k <= m-1 when an attempt returns every decomposition of its target,
    and 2/(m+1) (k = 0) or (1+k)/m (1 <= k <= m-1) when it returns at most one.
    It is below the generic 1/2 iff m > k+3 (k <= 2) or 2k < m-1 (k >= 2);
    every meet-in-the-middle oracle (k >= m/2) and the exhaustive oracle
    (k = m-1) stays at or above 1/2 at every arity, over prime and binary
    fields alike. Proved in Lean: formal/CryptoResearch/IC/ArityOracleThreshold.lean.
  mechanism: >-
    Attempts to collect B relations are max(1, r/B^(m-1)) for an
    all-decompositions oracle (H1-H2) and at least B for a one-decomposition
    oracle; an attempt costs B^k (H4); sparse linear algebra costs B^2 (H3).
    In exponents costAll = max(max(0, 1 - beta(m-1)) + k beta, 2 beta) and
    costOne = max(max(0, 1 - beta m) + beta + k beta, 2 beta); the infimum sits
    at beta = 1/(m+1-k) for k <= 2 and at beta = 1/(m-1) for k >= 2 (1/m for
    costOne). This idea does NOT escape the obstruction of
    LEAD-ICE-generic-oracle-arity-cost-floor; it proves it in the model for
    every r and arity (kind cost_model -> proof, conditional on H1-H4) and
    sharpens revisit_when to one measurable number: the fitted enumeration
    order k of a candidate oracle with its return semantics. Representation and
    operation set unchanged (Class I partial action).
  novelty_status: adaptation
  citations:
    - ref: IDEA-20260803-fa9839
      provenance: internal
      claim: two-term charge and threshold d < (m-3)/4 for B-independent D_trial
      verified_by: mythos-lead-discovery-20261024
    - ref: IDEA-20260808-2ef5c8
      provenance: internal
      claim: D_trial = B^theta, two regimes, MITM never below 1/2 (prose)
      verified_by: mythos-lead-discovery-20261024
    - ref: IDEA-20260829-b5a2c8
      provenance: internal
      claim: the m = 2 floor N^(2/3) free, N^1 as built
      verified_by: mythos-lead-discovery-20261024
    - ref: IDEA-20260830-4ab603
      provenance: internal
      claim: the free m = 2 oracle is a B^2 memory purchase (not formalised here)
      verified_by: mythos-lead-discovery-20261024
    - ref: KN-FIND-007
      provenance: internal
      claim: mean per-target yield C(B+m-1, m)/N for every base of size B (H1)
      verified_by: mythos-lead-discovery-20261024
  assumptions:
    - Exponents in the limit log cost / log r; constants, m!, folding and r^o(1) dropped.
    - Oracle cost is a pure power B^k; other oracles enter through a fitted k.
    - Memory is not charged (follow-up target from IDEA-20260830-4ab603).
  proof_search_map:
    bottleneck: infimum over beta of a max of two piecewise-linear functions
    baseline_embedding:
      parameter_slice: k = 0 gives IDEA-20260803-fa9839; k = theta gives both regimes of IDEA-20260808-2ef5c8
      reproduction_check: symbolic, in the Lean file (free_oracle, small_threshold, large_threshold)
    observation_collision:
      observable: the cost exponent as a function of (m, beta, k) and the oracle return semantics
      distinct_preimage_search: same k, different semantics, different exponent for k >= 2 (1/3 vs 3/7 at m = 7)
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: closed form E*(m, k) with attainment witnesses
        predicted_gain: a measured zero-cell table (binary, n <= 83) becomes a statement for every r and m
    quantifier_order: forall m >= 2, k >= 0, beta > 0, cost >= E*(m, k); exists beta(m, k) with equality
    method_ceiling:
      strongest_certifiable_claim: the algebra of the model only
      nearby_object_control: extension-field slice N = q^n, m = n, k = 0 where the model gives q^(2n/(n+1)) against the literature q^(2-2/n) (IDEA-20260830-3c0861)
    proof_obligations:
      - {claim: lower bounds and attainment, responsibility: correctness}
      - {claim: thresholds, MITM and exhaustive corollaries, responsibility: scope}
      - {claim: hypotheses jointly satisfiable; one control per hypothesis, responsibility: strictness}
    not_applicable_reason: null
  predictions:
    - metric: fitted enumeration order k of each implemented prime-field oracle at fixed m over a beta ladder
      direction: higher
      minimum_effect: k >= (m-1)/2 (all-decompositions) or k >= m/2 - 1 (one-decomposition), CI lower bound above the line
    - metric: sealed exponent of ic.pipeline mitm negation_folded (ECBND1h93b7a9d5c187) against the model value 1.0 at m = 2, k = 1
      direction: different
      minimum_effect: CI must contain 1.0 or the m = 2 reading is falsified at toy scale
  minimal_test:
    design: >-
      For each implemented oracle, fix m, run a beta ladder of >= 6 base sizes
      spanning >= 12 bits of log2 r on the sealed prime toy domain, count GAE per
      attempt in ecbench, fit k (ci_method linearised_t) and compare with the
      threshold line; matched rho.negation and an A/A arm at every size.
      Spec in the session report, approved_by null.
    controls:
      - A/A copy of each oracle arm
      - instrumented oracle costing exactly B^1 must fit k = 1 (positive control)
      - exhaustive oracle must fit k = m-1
    required_metrics: [gae_per_attempt, fitted_k_with_ci, relations_per_attempt, end_to_end_S, S_rho_matched]
  falsification_conditions:
    - an oracle with fitted k below the line whose end-to-end exponent stays above rho over >= 6 sizes
    - a measured mean yield above C(B+m-1, m)/N for some base (H1)
    - a sealed m = 2 mitm exponent CI excluding 1.0 at larger sizes
  confounders:
    - pre-asymptotic fits at toy sizes (sealed 0.84 [0.65, 0.95] at 4 sizes vs model 1.0)
    - unpriced native work on the oracle arm (price at 0, 0.1, 1 GAE)
    - folding and automorphism quotients change constants, not k
  interpretation_limits:
    - A theorem about the model; H1-H4 are hypotheses.
    - Silent on oracles whose cost is not a power of B and on whether k < (m-1)/2 is realisable.
    - Not a universal impossibility statement (docs/claims-and-verification.md).
  heuristic_assumptions:
    - id: H1
      statement: expected decompositions of a random target into m base points is B^m/(m! r) r^o(1)
      rigorous_support: KN-FIND-007 conservation of the mean yield
      validation_plan: count decompositions per target over the beta ladder; compare to B^m/(m! r); tail check on the maximum
    - id: H2
      statement: the linear-algebra stage needs B r^o(1) relations
      rigorous_support: rank over B unknowns is at most B
      validation_plan: relations-to-full-rank counter per run; fit against B
    - id: H3
      statement: sparse elimination costs B^2 r^o(1)
      rigorous_support: Wiedemann / Lanczos O(B^2 m)
      validation_plan: linalg-phase GAE over the ladder; fit against 2
    - id: H4
      statement: one attempt costs B^k r^o(1)
      rigorous_support: definitional for enumeration, pair tables and MITM; fitted otherwise
      validation_plan: the minimal test; positive control pins k = 1
  target_complexity:
    time_exponent: no attack; E*(m, k) per the notes, smallest sub-generic model point 2/5 at (m, k) = (5, 1); > 1/2 for every MITM or exhaustive oracle
    memory_exponent: not charged; B = r^beta at the optimum beta
    best_known: rho r^(1/2), O(1) memory; every measured IC arm above it
    hidden_overhead: m!, 2^m, constants and r^o(1) dropped; pessimistic by 2/(n(n+1)) on the extension-field slice
    tradeoff_note: not an algorithm; the threshold line future oracles are measured against
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
  dominated_by: n/a (no result claimed; a proof of the program's own cost model)
  sota_delta: >-
    No attack. Converts the cost_model closure of LEAD-ICE-generic-oracle-arity-cost-floor
    into a machine-checked statement for every r and m; adds the
    one-decomposition variant and the line k < (m-1)/2 every oracle must beat.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-RHO-13bf67, KR-IC-5931ee, KR-RHO-ea34b8, KR-IC-9e610d, KR-IC-1fcdbc]
    nearest:
      - ref: LEAD-ICE-generic-oracle-arity-cost-floor
        provenance: internal
        relation: special_case
        delta: its closure is a binary n <= 83 zero-cell table; this proves the statement for every r and oracle order
      - ref: LEAD-ICP-generic-table-decomposition
        provenance: internal
        relation: adjacent
        delta: its remark "m = 3 only ties even with T_dec = O(1)" is theorem arity_three_free_ties
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: Shoup is unconditional and generic; this model also covers coordinate-reading oracles of cost B^k
    searched: {corpus_grep: [two-term, D_trial, oracle exponent, per-trial decomposition cost], web: [], blocked: []}
    lead: LEAD-ICE-generic-oracle-arity-cost-floor
    new_lead_reason: null
  status: proposed
