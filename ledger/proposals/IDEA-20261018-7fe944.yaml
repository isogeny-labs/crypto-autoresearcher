  title: >-
    Calibrate a step-audit statevector simulator on Chen 2024 Step 9 before it audits any
    live claim
  class: control
  claim: >-
    A small exact statevector simulator of a claimed quantum lattice step, run at toy modulus
    and dimension, detects the known Step-9 failure of Chen 2024 (KN-LIT-52ce4c): the simulated
    output distribution of the windowed-QFT stage deviates from the distribution the paper's
    step asserts by total variation >= 0.2 at n=2..4. The same simulator run on a corrected
    textbook step (Regev's Fourier sampling on an exact coset state) reproduces the asserted
    distribution within TV <= 0.02. Only a simulator that passes both is admitted as the instrument
    for auditing Simon 2026 or Luo 2026.
  mechanism: >-
    Step audits in this goal are otherwise prose reviews. A load-bearing quantum step usually
    asserts that some register, after a transform and a measurement, has a stated distribution;
    at toy sizes that distribution is exactly computable by dense linear algebra. A retracted
    claim with a publicly named failing step is the only available positive control: if the
    simulator cannot see a bug that is known to exist, its silence on another claim means
    nothing. A correct textbook step is the negative control showing the simulator does not
    manufacture discrepancies from discretisation.
  tracked_object: >-
    Total variation distance between the simulated post-measurement distribution of the audited
    register and the distribution asserted by the audited step, per (n, q, window width).
