    claim: F3/F4 already have useful/zero-Q fixtures, mod-r qualification and signed stitching.
  assumptions:
  - Future collector fixes public P,Q,a_i,b_i/base before collisions; no k or atom-log input.
  - F1-F7 excluded as new arithmetic; F2 and residual storage are known composition components.
  - Retain signs, multiplicities, place fields, poles and all attempts; x-only/degree-only residual equality is
    insufficient.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-a4dd54
    - KR-IC-46d822
