    lead: LEAD-ICP-residual-partial-relations
  proof_search_map:
    bottleneck: Turn outside-place cancellation into independent equations with genuine Q information rather than
      zero-Q cycles.
    baseline_embedding:
      parameter_slice: Discard partials for complete-only; one outside place recovers historical 1LP.
      reproduction_check: Reconstruct signed native/source witnesses before dependencies.
    observation_collision:
      observable: Unsigned graph forgets signs, lifts and target coefficients.
      distinct_preimage_search: Same graph with flipped signs or all b_i=0 need not give useful equations.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Signed residual module with native/two-quotient/Q-coefficient certificates.
      predicted_gain: Finite discrimination only; no established attack gain.
    quantifier_order: Freeze public collector/base/coefficients before collisions; cancel all-draw rows, then test
      B mod r. Planted witnesses do not estimate yield.
    method_ceiling:
      strongest_certifiable_claim: Exact useful/zero-Q dependencies for one finite collector.
      nearby_object_control: Same signed graph with b_i=0; r*e_i is integrally nonzero but zero over F_r.
    proof_obligations:
    - claim: Integer cancellation and vertical/polar witnesses certify native support.
      responsibility: correctness
    - claim: B and final annihilator meet nonzero-mod-r gates.
      responsibility: interface
    - claim: Charge tables, sorting, dependencies, LA, failures and return.
      responsibility: runtime
    not_applicable_reason: null
  predictions:
  - metric: independently valid new projected rows with B nonzero mod r
    direction: higher
    minimum_effect: At least one beyond complete-only rows for the candidate; raw graph cycles do not count.
  - metric: native versus projected cancellation rate, L,b and final k-identifiability
    direction: different
    minimum_effect: Report signed failures and zero-Q cycles; nonzero B alone is insufficient.
  minimal_test:
    design: 'Future sketch only: one fixed law with complete/1LP/signed-2LP accounting; verify planted/null cases,
      then natural all-draw yield. Retained complete-only matrices supply no missing partial stream. New protocol
      required; no Q or collection here.'
    controls:
    - Full-native identity L=0; signed planted cycle, wrong-sign and same-x/different-lift copies.
    - Zero-Q graph, r*e_i and nonzero-B-but-unidentifiable system separate gates.
    - Degree/sign-matched rewiring, random labels and relabelled cyclic-group interfaces calibrate cycles/L,b.
    required_metrics:
    - all attempts
    - signed place keys
    - integer dependencies
    - native/E1/E2 residuals
    - affine signatures/B mod r
    - new rank/final identifiability
    - L,b
    - table/work bytes
  falsification_conditions:
  - No additional valid nonzero-B rows in the frozen finite scope.
  - Orientation, native/polar correction or mod-r reduction removes the apparent useful cycles.
  - Claimed k-identifiability lacks a final annihilator or natural-row certificate.
  confounders:
  - Collision selection
  - zero-Q cycles
  - signed incidence
  - projected versus native equality
  - isogeny kernel
  - memory
  - planted witnesses
  interpretation_limits:
  - 'Inside KN-OPEN-020 bounded-degree scope: attributed 1LP/2LP adaptation, no new arithmetic escape.'
  - Retained complete rows supply no natural partial/target workload. Nonzero B or one extra row alone need not
    identify k. No exponent improvement established.
  heuristic_assumptions:
  - id: H1
    statement: Conditioned on degree, signs and vertex frequencies, native partial cycles follow a configuration-model
      signed graph.
    rigorous_support: Integer cancellation is exact; random-graph cycle laws only define a comparison model.
    validation_plan: Later compare components/2-core, signed cycles and collision tails with degree-matched rewiring.
      Record p,r,B and failures. No crypto-size shortcut/transfer.
  - id: H2
    statement: For nonzero w over F_r, independent uniform b_i give uniform sum(w_i*b_i). Native cycle conditioning
      need not preserve independence.
    rigorous_support: A nonzero linear form of independent uniform F_r variables is uniform; integral nonzero is
      insufficient.
    validation_plan: Compare actual B histogram and zero tails with uniform law only under justified independence;
      otherwise give descriptive counts, without invoking the law.
  target_complexity:
    time_exponent: No r exponent established; charge collection C, O(L*log L) sorting, signed dependencies, LA/descent/return.
      Generic enumeration inherits the r^(1/2) floor.
    memory_exponent: No r exponent established; O(B+L+nnz(D_L)+retained matrix) words plus solver overhead; L is
      actual partial count.
    best_known: Pollard rho r^(1/2+o(1)) time, small serial state; BSGS r^(1/2) time and memory.
    hidden_overhead: Place fields, failures, sorting I/O, integer growth, checks, zero-Q cycles and verification.
    tradeoff_note: Cache caps destroy cycles; external sorting trades RAM for I/O. Parallelism retains table/LA
      costs.
  dominated_by: n/a (no attack result claimed); known arithmetic components only.
  sota_delta: No attack; zero established time/memory exponent or complete-cost improvement.
