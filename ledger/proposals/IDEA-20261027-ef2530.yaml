idea:
  id: IDEA-20261027-ef2530
  question_id: RQ-ECDLP-002
  title: Signed partial cycles with a nonzero Q coefficient
  class: composition
  status: proposed
  proposed_by: idea-generator
  novelty_status: adaptation
  claim: Test whether signed one/two-outside-place cancellation adds valid nonzero-Q rows beyond complete-only collection.
    Large-prime cycles and stitching are known; distinguish native cancellation, projected rank and target identifiability.
  mechanism: 'PAIR: R3 source-labelled principal rows with <=2 outside places and polar markers; Sigma is signed
    composition on matching certified places. Class partial-action: cancellation propagates rows on that domain,
    not under all translations. Projection forgets outside/auxiliary support only after its cancellation witness.
    On C use H=infinity_++infinity_- and [2T-H] atoms so hyperelliptic conjugation is integral negation; track the
    factor two, invertible mod odd r. Keep oriented C-place keys, not x(pi1(T)). Require integer signed incidence
    cancellation w*D_L=0, with vertical/polar corrections; unsigned cycles or mod-r cancellation alone do not certify
    native cancellation. Independently check E1/E2 residuals, without assuming their product isogeny injective.
    Public sources R_i=a_i*P+b_i*Q give m*z=A+B*k. Reduce aggregate B modulo r including normalization. B=0 can
    add base rank but attaches no Q. Final recovery requires h*M=0, h*B nonzero, giving k=-(h*A)/(h*B), or an equivalent
    natural-row certificate.'
  citations:
  - ref: inputs/refs/experiments/ecdlp_isogeny/po_transfer_003_result.md
    provenance: internal
    verified_by: TASK-20261027-00ae45
    claim: Full historical cubic/1LP result read; unfavorable costs and scoped successors.
  - ref: research/prym_leads_20261027/context/p256-prior-report.md
    provenance: internal
