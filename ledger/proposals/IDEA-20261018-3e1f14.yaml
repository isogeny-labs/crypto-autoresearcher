  title: >-
    Hedged entropy is load-bearing only if rho'' drops K or mu: signatures-to-s1 vs rnd entropy
    h for three derivations
  class: control
  claim: >-
    With the FIPS 204 derivation rho'' = H(K || rnd || mu), signatures-to-key-recovery is
    infinite at every rnd entropy h from 0 to 256 bits: degraded rnd costs nothing against
    a passive observer. If K is dropped (rho'' = H(rnd || mu)), one signature plus 2^h ExpandMask
    evaluations recovers s1; if mu is dropped (rho'' = H(K || rnd)), a mask collision between
    different messages appears after about 2^{h/2} signatures and one colliding pair gives
    s1 = (c1 - c2)^{-1}(z1 - z2). Both defective arms verify under a conformant verifier.
  mechanism: >-
    y = ExpandMask(rho'', kappa) is fully determined by rho''. With K inside, an observer
    cannot evaluate y even when rnd is known; with mu inside, equal rnd on different messages
    gives unrelated masks. Dropping K makes y a public function of a low-entropy rnd and a
    known message, so z - y = c s1 and c is invertible mod q with overwhelming probability.
    Dropping mu makes y depend only on (K, rnd), so equal rnd across messages reuses y with
    kappa equal whenever both signatures accept on the same iteration, and z1 - z2 = (c1 -
    c2) s1 exactly. This turns the RQ's hedged-vs-deterministic question into three measured
    curves.
  tracked_object: >-
    number of signatures and ExpandMask work until exact s1 recovery, as a function of rnd
    entropy h, for three rho'' derivations
