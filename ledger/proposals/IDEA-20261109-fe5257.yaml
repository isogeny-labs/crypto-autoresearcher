  - The Kato-Saito statement CH_0(A)_0 isomorphic to A(F_q) for abelian varieties over finite fields is
    recalled, not opened; the next agent must confirm it from a source before citing (i) as proven.
  predictions:
  - metric: number of j in [0, N) with a point count of X_j over F_{p^r} different from that of E, for
      r with gcd(N, p^r - 1) = 1
    direction: equal
    minimum_effect: exactly 0
  - metric: ratio of point counts of X_k and E over F_{p^{k_N}} on a toy curve with k_N at most 4
    direction: equal
    minimum_effect: exactly N
  minimal_test:
    design: 'Written proof audit of (i) and (ii) with the recalled theorems listed and sourced. Then two
      toy arms in Sage under crypto/sage. Arm G: generic prime-order toy curves from crypto/docs/ECDLP_CALIBRATION_PRIMES.md
      with p at most 2^10, all j, r = 1 and r = 2 (r = 2 on 64 random j plus j = k), counting points of
      X_j by pointwise Miller evaluation of h_j. Arm M: constructed toy curves with k_N in {2, 3, 4};
      count X_j over F_{p^{k_N}} for all j and record which j is singled out.'
    controls:
    - 'Arm M is the positive control: exactly one j must be singled out and it must equal the independently
      computed discrete log.'
    - A ramified cover z^N = f with f a random function of degree N whose divisor is not N times a degree-zero
      divisor must give point counts differing from E.
    required_metrics:
    - point counts of X_j and E over F_{p^r} for each j, r
    - k_N and the singled-out j in arm M
    - the discrete log k computed by exhaustive search
  falsification_conditions:
  - Any j not equal to k with a point count of X_j over F_{p^r} different from E for some r with gcd(N,
    p^r - 1) = 1.
  - In arm M the singled-out j differs from k, or more than one j is singled out.
  - The proof audit finds that translation does not act trivially on some Weil cohomology of E.
  confounders:
  - Arm G counts are tautological given gcd(N, p^r - 1) = 1; they calibrate the harness and do not by
    themselves support (ii).
  interpretation_limits:
  - The record closes functorial cohomological invariants only. Non-functorial covers that use coordinates
    (RECORD D) are not covered by (i).
