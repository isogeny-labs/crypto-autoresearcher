  id: IDEA-20261109-fe5257
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Translation rigidity: pure Weil cohomology of (E, P, Q) over F_p is scalar-blind, and the Kummer
    cover of the Miller quotient is E itself for every wrong guess, with the embedding field as the first
    discriminating Euler factor'
  class: barrier
  claim: Let E/F_p have prime order N, P a generator, Q = kP. (i) For every Weil cohomology H (l-adic,
    crystalline, rigid) translation by P acts as the identity on H^*(E^n), and CH_0(E^n)_0 is isomorphic
    to E(F_p)^n (Kato-Saito, recalled), so every invariant obtained by applying H to E, to its powers,
    or to correspondences built from P and Q by the group law equals its value at P = Q = O. (ii) With
    h_j = f_Q f_P^{-j}, Miller functions of divisor N(P)-N(O) and N(Q)-N(O), the Kummer cover X_j of equation
    z^N = h_j is, for every j not congruent to k, an elliptic curve isomorphic to E over F_p, the covering
    map being the isogeny with kernel the Frobenius eigenline on which pi acts as p; for j congruent to
    k it is E x Spec F_p[z]/(z^N - c), a disjoint union of E and (N-1)/k_N copies of E over F_{p^{k_N}}.
    (iii) Hence the number of F_{p^r}-points of X_j equals that of E for every j and every r with gcd(N,
    p^r - 1) = 1, and the first r at which j = k is visible is k_N = ord_N(p). No exponent changes.
  mechanism: (i) Translations form a connected family containing the identity, so the graph of tau_P is
    algebraically equivalent to the diagonal and the cycle class map kills algebraic equivalence. Over
    a finite field the Albanese kernel of CH_0 of an abelian variety vanishes by unramified class field
    theory. (ii) h_j has divisor N times D_j = (Q) - j(P) + (j-1)(O), so the cover is etale; gcd(N, p-1)
    = 1 gives it a rational point; its Jacobian is E modulo the Cartier dual of mu_N, which is the constant
    group E(F_p), and E/E(F_p) is E by Lang. For j = k, D_k is principal and the torsor is trivial. (iii)
    is the point count of a product. The only scalar-dependent object is the rank-one lattice L_k of principal
    divisors supported on O, P, Q, which no cohomology functor sees.
  novelty_status: adaptation
