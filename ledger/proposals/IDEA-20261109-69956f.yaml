  predictions:
  - metric: Frobenius step pi(R) - R for F_{p^N}-rational N-th roots of Q
    direction: different
    minimum_effect: equals u Q with u the inverse of p - 1 mod N, for every Q and R tested; at p = 13
      and N = 7 the step is 3Q
  - metric: exponent of the N-primary part of E(F_{p^N})
    direction: different
    minimum_effect: equals N^2 exactly, order also N^2
  - metric: number of F_{p^j}-points of the root scheme of Q, j up to 3N
    direction: different
    minimum_effect: identical sequences for all Q distinct from O
  minimal_test:
    design: In Sage build y^2 = x^3 + b over F_13 with group order 7 and over F_13 with group order 19
      (recompute both), extend to F_{13^7} and F_{13^19}, enumerate all N-th roots of each Q in E(F_p)
      by solving [N]R = Q over the extension, apply Frobenius and record pi(R) - R, compute the group
      structure of E(F_{p^N}) with Sage's abelian group routine, and count F_{p^j}-points of the root
      schemes for j up to 3N. Add two further toy primes from crypto/docs/ECDLP_CALIBRATION_PRIMES.md
      with N below 40.
    controls:
    - Q = O, where the root scheme is E[N] and the point counts differ.
    - A random non-CM curve of prime order at the same p, to check that the constants do not depend on
      j = 0.
    required_metrics:
    - p
    - N
    - u = inverse of p - 1 mod N
    - observed Frobenius steps as multiples of Q
    - invariants of E(F_{p^N}) N-primary part
    - point-count sequences of the root schemes per Q
  falsification_conditions:
  - Any F_{p^N}-rational N-th root R with pi(R) - R not equal to u Q.
  - The N-primary part of E(F_{p^N}) is not cyclic or not of order N^2 on an instance satisfying the assumptions.
  - Two values of Q distinct from O with different root-scheme point-count sequences.
  confounders:
  - Sage's group structure computation over F_{13^19} may be slow; a timeout is infrastructure.
  - Sign conventions for pi-hat on L_1 must be fixed by direct computation, since an error there changes
    u to its negative.
  interpretation_limits:
  - Exact constants at toy sizes; the structural claims are proved in the mechanism and the toy run is
    a sign and convention check.
  - The Z/N^2 lift is a generic group of size N^2 and offers no algorithm.
  heuristic_assumptions:
  - id: H1
    statement: The valuation computation of pi^N - 1 at the conjugate prime is 0 for all p of 256 bits
      with prime N.
    rigorous_support: Follows from ord_N(p) dividing N - 1 and not N; N dividing p - 1 is impossible for
      N near p.
    validation_plan: Verify on every toy instance and on secp256k1 parameters by exact integer arithmetic.
  target_complexity:
    time_exponent: N^{1/2} unchanged in the Z/N^2 lift; representation cost N^1 log p
    memory_exponent: N^1 for one element of F_{p^N}; delta +1/2 in the wrong direction
    best_known: Pollard rho in Theta(N^{1/2}) group operations, KR-RHO-13bf67
    hidden_overhead: Field arithmetic in F_{p^N} costs at least N log p per operation.
    tradeoff_note: No tradeoff; the lift strictly enlarges every resource.
