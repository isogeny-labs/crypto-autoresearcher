idea:
  id: IDEA-20261109-69956f
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: The N-th roots of Q rational over F_{p^N} form a Frobenius orbit with step (p - 1)^{-1} Q, the
    N-primary part of E(F_{p^N}) is cyclic of order N^2, and the root schemes of all Q distinct from O
    have the same zeta function
  class: barrier
  claim: 'Let E over F_p have prime order N, Frobenius pi, eigenlines L_1 = E(F_p) and L_p of E[N], and
    let ord_N(p) not divide N, which holds whenever N does not divide p - 1. Claim (i): for every Q in
    E(F_p) distinct from O and every R with NR = Q that is rational over F_{p^N}, pi(R) = R + u Q with
    u the inverse of p - 1 modulo N, and these R are exactly the N-th roots with zero L_p-component of
    the cocycle (pi - 1)R. Claim (ii): the N-primary part of E(F_{p^N}) is cyclic of order N^2 and is
    generated by any N-th root of P, so the N-th roots of kP are the multiples k'' R_P with k'' congruent
    to k mod N. Claim (iii): the number of F_{p^j}-points of the finite scheme of N-th roots of Q is zero
    unless N divides j and is independent of Q distinct from O. Consequence: the Lang torsor is a cyclic
    Z/N^2 extension of the instance whose DL reduces by Pohlig-Hellman to two DLs mod N, and representing
    one of its points costs N log p bits, exponent 1 in memory. No break is claimed.'
  mechanism: '[N] = (pi - 1)(pi-hat - 1) in End(E). With c = (pi - 1)R one has (pi-hat - 1)c = Q; pi-hat
    acts as p on L_1 and as 1 on L_p, so the L_1-component of c is (p - 1)^{-1} Q and the L_p-component
    can be made zero by translating R within E[N], which is possible because pi - 1 is bijective on L_p.
    Then pi^j R = R + j u Q, an orbit of length N, so R is rational over F_{p^N}. The valuation of pi^N
    - 1 at the prime (pi - 1) is 2 by the binomial expansion, and at the conjugate prime it is 0 since
    pi is congruent to p there and ord_N(p) does not divide N; the N-part of the order is N^2, and it
    is cyclic because L_p is not rational over F_{p^N}. Point counts of the root scheme count fixed points
    of x -> pi x + c on E[N]-cosets and depend only on the permutation type.'
  novelty_status: adaptation
