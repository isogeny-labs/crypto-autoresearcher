idea:
  id: IDEA-20261027-4d8543
  question_id: RQ-SEMBIN-9e8f82
  status: proposed
  added: '2026-10-27'
  title: 'Saturation-aware matched pairs: layer-resolved Macaulay pivot profile, residual fall after ablating the
    trace and carry carriers, and an exhaustive shift-class census over (F/V)^m with satisfiability stratification'
  class: control
  claim: '(C1) Layer theorem. In a degree-graded Boolean-ring elimination of the degree-D Macaulay matrix of EQS4,
    the pivot count in degree-D columns, pi_D(D), is the same for every v and every B at fixed (R, basis, V): the
    top forms of the blocks are the cubic trilinear form [x x'' u]_j of the field''s structure tensor (and a quadratic
    form for the R-block), with no v and no B. The shift enters only layers <= 2; B only as a constant vector. Rank
    = sum_e pi_D(e), so all v-dependence sits below the top layer.

    (C2) Saturation. First fall is carried by shift-covariant mechanisms (IDEA-20261016-e191a8), so total-rank and
    d''_F pairs are saturated. The informative observable is Excess_D(v) = rank M_D(v) - pi_D(D) - N_local(D), the
    new lower-degree polynomials not explained by the local carry and trace consequences. Claim: Excess_4(v) is
    NOT constant over the shift census at tiny n: >= 10% of classes v in (F/V)^m differ from Excess_4(0) (competing:
    constant, v is no lever for the rank profile). No direction is guaranteed: P2 of IDEA-20260913-352163 ("can
    only increase") is not a theorem, since the lift of a top-form syzygy can become a genuine syzygy or stop being
    one at F_2-points.

    '
  mechanism: 'OBJECT FRAME. Representation: R1 (x on V+v, descended). Sigma: translation by Fb elements; Class I
    partial-action. Tracked object: the pivot-degree histogram (pi_D(e))_e; lossy (drops columns and coefficients)
    and Sigma-compatible: a translation by v in V is a degree-filtered ring automorphism fixing the histogram (HKYY
    Prop 2.3(iv)); for v not in V the histogram is the object. Not a change of coordinates.

    Census: the system depends on v only through v mod V (n-k bits per coset). (n,k,m) = (7,2,3): 32768 classes,
    exhaustive; (8,2,3): 262144, uniform sample of 4000. Satisfiability is exact by enumeration and stratifies the
    data: unsatisfiable instances put 1 in the ideal, give literal d''_F = 1 (EV-SEMBIN-c71cad) and are never pooled.
    A B-sweep at fixed v isolates the constant-vector perturbation.

    '
  novelty_status: unverified
