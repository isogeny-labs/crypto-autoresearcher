    verified_by: coordinator (/root/coordinator), source-limited reading 2026-10-27; not an independent mathematical
      review
  assumptions:
  - Corrected XOR product pinned; same seeds, order, routine across arms.
  - Coset disjointness checked, not assumed; non-disjoint classes labelled.
  proof_search_map:
    bottleneck: which part of the matched-pair signal depends on v at all
    baseline_embedding:
      parameter_slice: 'v_i in V: all pi_D(e) identical'
      reproduction_check: pi_D(D) identical over 1000 random (v,B); Nagao Example 1 fixture
    observation_collision: pairs with equal total rank and different histograms show total rank is too coarse
    quantifier_order: 'FORALL classes at (7,2,3): top entry invariant; EXISTS a class with Excess_4 != Excess_4(0)
      is the claim'
    method_ceiling:
      strongest_certifiable_claim: exact census at (7,2,3)
      nearby_object_control: random cubic system of the same support
  predictions:
  - metric: pi_D(D) over all (v,B), D=3,4
    direction: different
    minimum_effect: identical in 100% of cells (theorem; mismatch = bug)
  - metric: fraction of classes with Excess_4 != Excess_4(0), satisfiable stratum
    direction: higher
    minimum_effect: '>= 10% (vs <= 1% under constancy), exact binomial CI'
  - metric: Excess_4(v) vs Hamming weight of v mod V
    direction: different
    minimum_effect: '|Spearman rho| >= 0.3 means v structure is a lever'
  minimal_test:
    design: Per cell build EQS2 and EQS4(v), degree-graded Boolean-ring Macaulay elimination at D=3,4,5, record
      (pi_D(e))_e, rank and the Def5/Def6/HPS labels computed. Census as above, sat/unsat strata; B-sweep over 4
      values of B for 200 fixed v.
    controls:
    - v in V exact null
    - v=0 baseline
    - random cubic null of identical support and wiring
    - m=2 contrast (no free slot)
    required_metrics:
    - histogram per system
    - census fractions with exact CIs
    - sat/unsat label
    - definition label
  falsification_conditions:
  - 'pi_D(D) differs across any (v,B): the top-form lemma or the instrument is wrong; cells void.'
  - 'Excess_4 constant over the exhaustive (7,2,3) census, satisfiable stratum: v is not a lever for the rank profile
    and the shift question reduces to solving degree (IDEA-20261016-d0335b).'
  - 'v in V null differs: defect.'
  confounders:
  - 'satisfiability differs between v=0 and v != 0 at the same R when yield ~ 1: stratify'
  - 'small-n degeneracy: random null calibrates'
  - definition variant
  - pivot order depends on monomial order; fix and record it
  interpretation_limits:
  - Toy tier, p=2, one curve family.
  - Constant Excess does not corroborate Theorem 1; varying Excess does not refute it.
  - No claim about any curve.
  heuristic_assumptions:
  - id: H1
    statement: Excess_D over uniform random classes has a unimodal law with mean and variance stable in n at fixed
      (k,m)
    rigorous_support: none; rank semicontinuity in a parameter family orders generic vs special points only, not
      two F_2-points
    validation_plan: exact census n=7, sample n=8, n=9,10 if sizing permits; KS between histograms
  target_complexity:
    time_exponent: none claimed
    memory_exponent: none claimed
    best_known: Nagao n^{8w+1} conditional; vOW 2^{n/2}
    hidden_overhead: '2^{m(n-k)} classes: exhaustive only at toy size'
    tradeoff_note: none
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
