idea:
  id: IDEA-20261024-e65d46
  title: >-
    Characteristic-p subset-sum polynomial-calculus degree floor for digit
    (Boolean-affine) presentations of prime-field Semaev decomposition
  class: control
  question_id: RQ-ECDLP-361f3a
  claim: >-
    R1 digit representation, relation-decomposition stage. For p > ceil(s/2), any
    odd-order E/F_p, target and presentation x_k = a_k + sum_j c_kj d_kj (Boolean digits, nonzero
    weights), every polynomial-calculus refutation (over F_p or an extension) of a
    Fbar_p-UNSAT chained digit system has degree >= ceil(s/2)+1; the direct system too
    when 2^{m-1} <= ceil(s/2). So every PC-simulable solver (XL, F4, F5, MutantXL)
    reaches degree >= (log2 B)/2 + 1 there, and no d_lf bounded in s exists for them.
  mechanism: >-
    Pair: R1 Boolean digits; Sigma_IC = translation by factor-base points (Class I);
    oracle rules Sigma_PC = variable multiplication, linear combination, restriction.
    Trichotomy: partial-action (bounds the oracle only). Lemma K_p: IPS 1999 use the
    reals only for full rank of the k vs k+1 inclusion matrix, true mod p iff p > k+1.
    Restriction: fix other legs to Boolean values and chain nodes to one algebraic
    branch; the residual g(L) (degree e = 2 chained, 2^{m-1} direct) has no root on the
    cube, and g(L) = h(L)(L - rho) gives a knapsack refutation of degree max(D, e).
    Escapes 'enumerates or table-looks-up' (SO-TABLE), 'generic' (SO-GEN), 'membership
    polynomial prod(x - v) of degree B' (SO-ALGFB); conservation is not escaped.
  novelty_status: unverified
  citations:
    - ref: ECCC TR97-042 (Impagliazzo-Pudlak-Sgall)
      provenance: retrieved
      claim: Thm 4.1 (reals), Lemma 4.2 (inclusion-matrix rank), Sec. 5 (Groebner simulated by PC)
      verified_by: scout-sat-xor-planted agent, 2026-10-24 (read the source)
    - ref: Wilson, Europ. J. Combin. 11 (1990)
      provenance: recalled
      claim: k vs k+1 inclusion matrix has full row rank mod p iff p > k+1
      verified_by: null
    - ref: de Caen, Electron. J. Combin. 8 (2001) N5
      provenance: retrieved
      claim: the same full-rank conclusion over characteristic p > k
      verified_by: gate sat-xor-C1, 2026-10-24 (read the source)
    - ref: arXiv 1606.05050 (Forbes-Shpilka-Tzameret-Wigderson)
      provenance: retrieved
      claim: Cor 5.4, static degree >= n in characteristic >= poly(n) (not PC)
      verified_by: gates sat-xor-C1, comm-alg-C1, 2026-10-24 (read the source)
    - ref: IDEA-20260903-e1e38b
      provenance: internal
      claim: same rank theorem gives the direct first-fall law (H-TOP)
      verified_by: gate sat-xor-C1, 2026-10-24 (read the record)
    - ref: EV-PFDR-f71d7f
      provenance: internal
      claim: direct system has d_lf >= m 2^{m-1} + 1 (generator degree)
      verified_by: idea-generator filing agent, 2026-10-25 (read O-1, O-2)
  assumptions:
    - UNSAT = no Fbar_p solution with Boolean digits; twist targets are outside.
  proof_search_map:
    bottleneck: least PC degree reaching 1 from the restricted digit system
    baseline_embedding:
      parameter_slice: one free leg, others fixed, gives the IPS knapsack
      reproduction_check: scout repro/m1.out, ceil(s/2)+1 on 106/106 UNSAT knapsacks
    observation_collision:
      observable: least D with 1 in the degree-D multilinear PC closure
      distinct_preimage_search: binary, unit, random weights and all out-of-range rho agree
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: one-block restriction of the digit system to an IPS knapsack
        predicted_gain: bounded-d_lf branch decided by proof
    quantifier_order: >-
      forall p > ceil(s/2), E, x_R, presentation, Fbar_p-UNSAT instance (chained, or
      direct with 2^{m-1} <= ceil(s/2)), forall PC refutations: degree >= ceil(s/2)+1.
    method_ceiling:
      strongest_certifiable_claim: PC-simulable solvers, UNSAT draws
      nearby_object_control: char 3, c_i = 1, rho in F_9 - F_3 refutes in degree 3, all n
    proof_obligations:
      - claim: Lemma K_p transfer via the rank theorem
        responsibility: correctness
      - claim: direct cells 2^{m-1} > ceil(s/2) left to the axiom degree
        responsibility: scope
      - claim: Groebner-to-PC simulation; d_lf wording
        responsibility: interface
    not_applicable_reason: null
  predictions:
    - metric: PC refutation degree, UNSAT draws, m = 2 (s = 3..8), m = 3 (s = 7, 8)
      direction: higher
      minimum_effect: ">= ceil(s/2)+1 on every draw"
    - metric: PC degree minus d_ff (EV-PFDR-1394a4), same cells
      direction: different
      minimum_effect: sign per cell recorded
  minimal_test:
    design: >-
      Review the proof; run the exact PC-degree checker as the digit arm of
      EXP-PCD-887825 (H-PCD-03be5a) and the H-PFDR-d5f90f ladder; knapsack s = 6..14,
      three toy primes; corner cells apart (notes, approved_by null).
    controls:
      - planted SAT draws must return no refutation
      - char-3 Frobenius control must refute in degree 3
      - support-matched null
    required_metrics: [pc_degree, d_ff, unsat_certified, corner_flag]
  falsification_conditions:
    - a Fbar_p-UNSAT draw in the claimed regime refuted below ceil(s/2)+1
    - inclusion-matrix rank deficient mod p for some k with p > k+1
    - a degenerate restriction on an odd-order curve
  confounders:
    - s <= 9, three toy primes
    - solver degree vs PC degree (recalled simulation)
    - satisfiable attempts (L1-D) unexamined
  interpretation_limits:
    - PC-simulable solvers on Fbar_p-UNSAT draws; not SAT, CP/SoS, lattice, carry circuits.
    - KN-OPEN-020 implicit membership, Boolean-affine sub-class only.
    - Margins: two unmerged dense-Macaulay models (notes).
  heuristic_assumptions:
    - id: H1
      statement: Wilson's rank theorem holds as recalled
      rigorous_support: de Caen 2001 (retrieved); scout repro/wilson.out 174/174 cells
      validation_plan: retrieve Wilson 1990; rank check n <= 16
    - id: H2
      statement: d_lf of an inconsistent system is its Macaulay solving degree
      rigorous_support: Caminata-Gorla (recalled; definitions in KN-LIT-4e8513)
      validation_plan: report PC degree and d_lf side by side
    - id: H3
      statement: F4, F5, XL and MutantXL degrees bound the PC degree
      rigorous_support: IPS Sec. 5 (retrieved); Clegg-Edmonds-Impagliazzo 1996 (recalled)
      validation_plan: msolve F4 degree on the checker cells
  target_complexity:
    time_exponent: no attack (gain 0); predicted D >= 34 at P-256, m = 4 (model)
    memory_exponent: not applicable
    best_known: rho r^(1/2)
    hidden_overhead: chained cell -29.9 bits at 256-bit (SAT/XOR dense model), not closed
    tradeoff_note: multidegree-truncating solvers escape at m >= 5 (omega = 1 model)
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: medium
  dominated_by: >-
