idea:
  id: IDEA-20261024-1b76a4
  title: >-
    Corner lemma: strategy-independent Howgrave-Graham ceiling for single-equation
    small-root decomposition, with its unconditional form and the tree arm
  class: control
  question_id: RQ-ECDLP-361f3a
  claim: >-
    R1 representation, relation-decomposition stage. If every one-per-slot coordinate
    choice gives a unit corner prod c_i^D of f mod p that is a leading monomial, no
    lattice inside (f,p)^t cap Z[M] meets the HG determinant criterion unless
    D*log_p(box volume) < 1, for every t, M and shift set. For S_{m+1}(.;x_R),
    D = 2^{m-1}, so the ceiling 2^{1-m} is below the demand m/(2(m-1)) at every m >= 2
    for window, AP, rank-r GAP, Farey and digit bases. One unit corner of weight >= 1
    leaves no g != 0 in (p,f)^t with ||g(Xx)||_inf < p^t (Lemma U, unconditional).
  mechanism: >-
    Pair: R1 = integer, Farey or GAP/digit representative of x(P) in a box; Sigma =
    translation by factor-base elements (Class I); oracle = HG lattice from
    (S_{m+1}, p)^t. Trichotomy: partial-action. Lemma A ((p,f) regular, so
    (I_t : p^j) = I_{t-j}) bounds the index by p^(sum_k dim V_k); Lemma B bounds dim V_k
    by leading-monomial counts; averaging over corner orders gives the ceiling. Lemma U:
    {p^(t-k) f^k} is a strong Groebner basis over Z_(p). Tree arm: the count on
    in_sigma(J^k) predicts gamma1+gamma2 < 1/2 at the (4,2) root vs demand > 7/4
    (H4). Escapes 'enumerates or table-looks-up' (SO-TABLE), 'generic' (SO-GEN),
    'algebraic locus of degree d' (SO-ALGFB), then closes that escape; SO-ALGFB's
    conservation clause still fixes the demand.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260723-006
      provenance: internal
      claim: corner coefficient 1, full-box support outside O(m) targets (H2)
      verified_by: gate lattice-C1, 2026-10-24 (read)
    - ref: IDEA-20260904-39336c
      provenance: internal
      claim: same decision by optimal-shift computation; no ceiling
      verified_by: gates lattice-C1, padic-C4, 2026-10-24 (read)
    - ref: IACR ePrint 2024/1577 (Ryan)
      provenance: retrieved
      claim: optimal shifts from a Groebner basis; abstract states no reach ceiling
      verified_by: scout-lattice-smallroot agent, 2026-10-24 (read the source)
    - ref: IACR ePrint 2012/108 (Aono et al.)
      provenance: retrieved
      claim: univariate and Boneh-Durfee optimality; no multivariate bound in abstract
      verified_by: scout-lattice-smallroot agent, 2026-10-24 (read the source)
    - ref: Matsumura, Commutative Ring Theory, Th. 16.2
      provenance: recalled
      claim: regular sequence gives a polynomial graded ring (Lemma A)
      verified_by: null
  assumptions:
    - H1 (determinant level) for the averaged and tree ceilings; Lemma U is exempt.
  proof_search_map:
    bottleneck: the index of any HG lattice in (f,p)^t cap Z[M]
    baseline_embedding:
      parameter_slice: full box, JM shifts, S_3(x1,x2;x_R)
      reproduction_check: scout corner_probe.py, dim V_k = (L-2k+1)^2 exactly
    observation_collision:
      observable: sum_k dim V_k vs sum_a w(a)
      distinct_preimage_search: hill-climb over M in [0,L]^2; none above the box
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: corner ceiling for all (M, t, shifts, GAP rank); Lemma U
        predicted_gain: w = 0 cells and per-block (4,2) decided by proof
    quantifier_order: >-
      forall m, t, M, shift sets in (f,p)^t, weights with D*vol >= 1: HG criterion
      fails; exists unit corner of weight >= 1 implies forall g != 0 in (p,f)^t,
      ||g(Xx)||_inf >= p^t.
    method_ceiling:
      strongest_certifiable_claim: determinant level; Lemma U unconditional; joint arm under H4
      nearby_object_control: 2-unknown S_3, p = 101, X <= 3/2 has vectors below p^t
    proof_obligations:
      - claim: Lemmas A, B, averaging, U
        responsibility: correctness
      - claim: corner premise for S_{m+1}, GAP, Farey
        responsibility: scope
      - claim: regularity of (p, f_A, f_B, f_R); H4
        responsibility: strictness
    not_applicable_reason: null
  predictions:
    - metric: exact sum_k dim V_k / averaged bound, rank-2 GAP and Farey S_3
      direction: lower
      minimum_effect: <= 1 at every support
    - metric: averaged nu_sigma/w of J on (3,1), (4,2) trees at demand points
      direction: lower
      minimum_effect: < 1 everywhere
  minimal_test:
    design: >-
      Review Lemmas A, B, U; extend corner_probe.py to rank-2 GAP and Farey; dim V_k(J)
      on the joint tree fixtures over 10-20 orders at p ~ 2^16 (notes, approved_by null).
    controls:
      - box support reproduces the corner count
      - small-box positive control finds short vectors
      - special-j fixture as premise check
    required_metrics: [dim_Vk_exact, averaged_bound, ratio, joint_order_ratio, regularity]
  falsification_conditions:
    - exact dim V_k above the averaged count for some M
    - certified or planted reach above 1/D on a single-equation cell
    - g != 0 in (p,f)^t with ||g(Xx)||_inf < p^t at corner weight >= 1
    - joint ratio >= 1 at a demand-feasible point (H4 fails)
  confounders:
    - sum vs per-variable units (smallroot_reach.py factor n)
    - small-t sublattices stand in for the ideal lattice
    - exceptional targets or special j
  interpretation_limits:
    - Determinant level except Lemma U; ideal (f,p)^t, polynomial dimension, trees, prime field, toy p.
    - KN-OPEN-020 implicit-membership (lattice-describable) class; not a universal no-go.
    - Scout scripts are scratch; dossiers in docs/reports/ecdlp-lead-discovery-20261024/scouting/.
  heuristic_assumptions:
    - id: H1
      statement: reach equals the HG determinant criterion
      rigorous_support: HG lemma plus Gaussian heuristic; Lemma U drops it for one corner
      validation_plan: exact SVP on sublattices across the threshold
    - id: H2
      statement: generic x_R gives full-box support, corner coefficient 1
      rigorous_support: resultant induction; symbolic m <= 3, S_5 mod 10007
      validation_plan: sample x_R incl. exceptional set and special j
    - id: H3
      statement: the demand of analysis/smallroot-reach/CLOSURE.md s.1 is representation-free
      rigorous_support: KN-FIND-007 conservation
      validation_plan: none beyond KN-FIND-007
    - id: H4
      statement: per-block ceilings stay binding in the joint tree ideal
      rigorous_support: none; in_sigma(J^k) may exceed in_sigma(J)^k
      validation_plan: dim V_k(J) on joint union-support fixtures, t <= 3 (see notes)
  target_complexity:
    time_exponent: no attack (gain 0); predicted margin -0.50 to -0.56 (sum units)
    memory_exponent: not applicable
    best_known: rho r^(1/2)
    hidden_overhead: finite t only lowers reach
    tradeoff_note: lattice plus guessing helps only if vol < 2/D (m <= 2)
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
  dominated_by: n/a (no attack); KR-IC-5931ee, KR-RHO-13bf67 checked; no KR lattice row
  sota_delta: >-
