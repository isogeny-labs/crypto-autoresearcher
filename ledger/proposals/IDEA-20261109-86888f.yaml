      statement: 'New test: Grid p in {2^16, 2^20, 2^24}, B = 2^4 .. 2^12, m in {3, 4}; per cell 20 planted
        and 20 certified-unsat targets. Enumeration and Groebner in the crypto ic tree; SAT via a bit-vector
        encoding of modular arithmetic emitted to CaDiCaL and Kissat. Fit c by least squares on log T_dec
        versus log B per solver.'
