  minimal_test:
    design: For p = 13 and the curves y^2 = x^3 + b with prime order N in {7, 19}, and for three integer
      lifts b~ = b, b + p, b + 2p, compute E~(Q_p)[N] by Hensel lifting the F_p-points and the quotient
      E~(Q_p)/N through the filtration by the formal group. Where Magma is available, construct explicit
      cocycles for Kummer classes and evaluate the local Tate pairing through the Weil pairing and the
      Hilbert symbol at p; otherwise record the order counts only.
    controls:
    - A lift with N dividing p - 1 is excluded; such p fail the embedding-degree condition and are reported
      separately.
    - Repeat with a prime ell not dividing N; the Kummer image is then 0, the shadow-theorem case.
    required_metrics:
    - p
    - N
    - lift b~
    - order of E~(Q_p)[N]
    - order of E~(Q_p)/N
    - number of pairing evaluations and number that are nonzero
  falsification_conditions:
  - E~(Q_p)[N] or E~(Q_p)/N has order different from N on a valid instance.
  - A nonzero local Tate pairing value between two Kummer classes is found.
  - A timeout is infrastructure, not a falsification.
  confounders:
  - Lifts with bad reduction at p are invalid instances, not counterexamples.
  interpretation_limits:
  - The record says nothing about the other local components of the Cassels-Tate pairing; only the component
    at P is shown to be blind.
  - It does not decide whether Sha[N] is nonzero for any lift.
