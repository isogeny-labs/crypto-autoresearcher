idea:
  id: IDEA-20261109-f861c2
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Cassels-Tate and Brauer-Manin pairings on N-coverings of any lift have zero component at the
    prime above p, because the Kummer image is the maximal isotropic unramified line of order N inside
    a local H^1 of order N^2
  class: barrier
  claim: Let E~ be any elliptic curve over a number field K with good reduction at a prime P above p,
    residue curve E of prime order N with p not dividing N. Then |E~(K_P)[N]| = N, |H^1(K_P, E~[N])| =
    N^2, the Kummer image E~(K_P)/N has order N, is unramified, and is its own annihilator under the local
    Tate pairing. Hence for sigma, tau in the N-Selmer group the P-component of the Cassels-Tate pairing
    vanishes, Manin's Brauer-Manin pairing on the N-coverings of E~ is independent of the local data at
    P, and a class of Sha[N] localises to a point of E(F_p) whose F_N-coordinate relative to P is constrained
    by no global pairing. This is a theorem-level closure with a toy consistency check and moves no exponent.
  mechanism: Torsion of E~(K_P) injects into E(F_p) for p not dividing N, giving |E~(K_P)[N]| = N; local
    Euler characteristic and Tate duality give |H^1| = |H^0| |H^2| = N^2 since E~[N] is self-dual by the
    Weil pairing. The formal group is N-divisible, so E~(K_P)/N is E(F_p)/N = E(F_p), order N, and its
    classes are unramified. Cup products of unramified classes land in H^2 of the unramified Galois group
    Z-hat with torsion coefficients, which is zero, so the line is isotropic, and a maximal isotropic
    subspace of a 2-dimensional nondegenerate space has dimension 1, so it is the full annihilator.
  novelty_status: adaptation
