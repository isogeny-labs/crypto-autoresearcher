idea:
  id: IDEA-20261109-16e2d3
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Second Witt digit of the torsion-section lift against the finite-field zeta: one affine fit
    decides whether the crystalline and de Rham coordinates of a point are the same object'
  class: representation
  claim: 'E/F_p ordinary of prime order N != p, Etilde/Z_p any Weierstrass lift, Phat in Etilde(Z/p^2)
    the unique lift of P of order N (the wave-1 torsion-section lift). Put x_1(P) := (x(Phat) - x(P)^p)/p
    mod p, the second Witt coordinate of x(Phat), and let c be the E^nat zeta of the sibling record. Claim:
    there exist alpha in F_p and h in L(nO), n <= 200, with x_1(P) = alpha y(P) c(P) + h(P) for every
    affine P. Prediction: alpha != 0 for every lift and n <= 20. If alpha = 0 then x_1 is a regular function
    of degree <= n and the wave-1 Witt-digit factor base is an algebraic predicate of that degree. If
    no solution exists for n <= 200 while the planted control fits, the chart identification is wrong
    and the record is invalid. In every outcome no exponent moves.'
  mechanism: The Greenberg transform Gr_2(Etilde) is a commutative extension of E by G_a over F_p, kernel
    Etilde_1(Z/p^2) = F_p via t/p, F_p-points Etilde(Z/p^2). Ext^1(E,G_a) = H^1(E,O_E) is one-dimensional
    and spanned by the class of E^nat, so Gr_2 is split or isomorphic to E^nat after scaling G_a by alpha.
    Both torsors are trivial over the affine curve E - O, so an isomorphism of extensions reads (P,w)
    -> (P, alpha w + f(P)) with f regular on E - O, and the unique order-N sections correspond. The Greenberg
    chart x_1 is affine in the torsor coordinate with slope 2y (the invariant vector field moves x at
    rate 2y), which yields the fitted form. Buium's description of the mod-p first jet space of an abelian
    scheme as the Hasse-Witt twist of the universal vectorial extension (recalled, must be checked) predicts
    alpha != 0 exactly for ordinary E.
  novelty_status: speculative
