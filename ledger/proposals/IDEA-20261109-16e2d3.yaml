  predictions:
  - metric: alpha for each of three lifts at each prime
    direction: different
    minimum_effect: nonzero in all cases
  - metric: n_min, smallest pole order admitting a fit
    direction: lower
    minimum_effect: at most 20, and constant across primes for a fixed lift type
  - metric: residual of the fitted identity on all N-1 affine points
    direction: lower
    minimum_effect: exactly 0
  minimal_test:
    design: For eight prime-order curves with N in [2^12, 2^16] from crypto/docs/ECDLP_CALIBRATION_PRIMES.md,
      three lifts each (naive integer (a,b); canonical j = 0 lift y^2 = x^3 + [b] with Teichmuller b;
      perturbed (a + p a', b + p b')). Compute x_1 and c for all P. For n in 10,20,...,200 solve x_1 =
      alpha y c + sum_i h_i phi_i over the basis of L(nO) on 2n + 40 random points and verify on all points.
      Report (alpha, n_min) per lift and prime. Sage or plain Python under research/cohomology_zeta_20261109.
    controls:
    - c replaced by a random odd function, no fit for n <= 200, which shows the test has power.
    - x_1 replaced by the Witt digit of a naive non-torsion lift, no fit expected.
    - Planted x_1 := y c + x^5 must return alpha = 1 and n_min = 5.
    required_metrics:
    - alpha per lift and prime
    - n_min per lift and prime
    - verification residual
    - control outcomes
  falsification_conditions:
  - No fit for n <= 200 on a lift while the planted control fits (model wrong, record invalid).
  - alpha = 0 on any lift (Greenberg splits; the Witt digit is algebraic of degree n_min).
  - n_min growing with p for a fixed lift type (the transition is not a bounded-degree algebraic map).
  confounders:
  - Choice of Teichmuller versus integer representative in the Witt digit; only the Teichmuller-based
    x_1 is canonical.
  - Lifts of a, b to Z/p^2 differ between arms by design; report them.
  interpretation_limits:
  - A confirmed fit identifies two coordinates; it does not make either informative about k.
  - alpha = 0 would be a structural surprise but still gives only a low-degree algebraic predicate.
  heuristic_assumptions:
  - id: H1
    statement: Gr_2(Etilde) is non-split for ordinary E and any lift, so alpha != 0.
    rigorous_support: recalled Buium statement, unverified this session.
    validation_plan: The fit itself at eight primes and three lifts, plus a reading note on Buium 1995
      committed next to the script.
