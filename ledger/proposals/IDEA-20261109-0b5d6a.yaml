  assumptions:
  - A basis of L((m+1)O) in x and y monomials with 2i + 3j <= m + 1 is used; the test recomputes it.
  - R is not among the base points.
  predictions:
  - metric: number of random m-subsets whose projected images are coplanar yet do not sum to -R, m = 3,4
    direction: zero
    minimum_effect: 0 of 10^4, and conversely 0 relations missed
  - metric: charged field-operation ratio slope-hash collinearity / addition enumeration, m = 3, B = 2^8..2^12
    direction: different
    minimum_effect: within [0.7, 1.3]
  - metric: fitted exponent in B of the dual arrangement solver, m = 3,4
    direction: different
    minimum_effect: within [m - 1.1, m - 0.9]
  minimal_test:
    design: 'Toy prime-order curves at p <= 2^26. Implement the L((m+1)O) embedding, the projection from
      R, and three solvers for target relations: addition enumeration, slope-hash collinearity (m = 3),
      and the dual arrangement recursion of Claim 2. Count field multiplications and inversions; verify
      Claims 1 and 2 exactly on random subsets.'
    controls:
    - Random points of P^{m-1} not on the curve; degeneracies there must be chance-level and unrelated
      to the group law.
    - Interval base and random base of equal size; relation counts match the B^m / N mean.
    required_metrics:
    - coplanarity versus sum mismatches
    - operation counts per solver per B
    - fitted exponents
  falsification_conditions:
  - Any mismatch between hyperplane incidence and the group relation.
  - A degeneracy solver with fitted exponent below m - 1.3 at m = 4 (positive outcome).
  - Slope-hash ratio outside [0.5, 2.0] indicates a miscount, not a result.
  confounders:
  - Hash-table constants at small B; report operation counts, not time.
  - Points at infinity in projective coordinates need separate handling.
  interpretation_limits:
  - A verified reduction is exact but moves no exponent.
  - Real-field lower bounds do not transfer; the lemma is open in both directions over F_p.
  heuristic_assumptions:
  - id: H1
    statement: Every arrangement or duality-based degeneracy algorithm over F_p reduces to enumeration
      of (m-1)-subsets.
    rigorous_support: Claim 2 proves it for the natural duality; not for all algorithms.
    validation_plan: Implement the dual recursion and fit its exponent in the test.
  target_complexity:
    time_exponent: B^{m-1} per target, unchanged; overall above N^{1/2}
    memory_exponent: B
    best_known: Pollard rho Theta(N^{1/2}); for the inner search, enumeration B^{m-1}
    hidden_overhead: re-embedding costs (m+1) B multiplications per target
    tradeoff_note: None.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  sota_delta: 'Exponent delta 0. Delta: exact identification of prime-field PDP with classical hyperplane
    degeneracy for a degree-m elliptic normal curve, and a proof that duality gives back enumeration.'
