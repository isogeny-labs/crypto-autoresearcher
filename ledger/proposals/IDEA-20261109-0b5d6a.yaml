idea:
  id: IDEA-20261109-0b5d6a
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Arity-m point decomposition is m-point hyperplane degeneracy for the degree-m elliptic normal
    curve obtained by projecting from the target, and projective duality re-derives enumeration
  class: representation
  claim: 'Embed E by L((m+1)O) in P^m. Hyperplane sections are the divisors linearly equivalent to (m+1)O,
    so m+1 points lie on a hyperplane iff they sum to O (the incidence determinant of the relations wave).
    Claim 1 (per-target re-embedding). Projecting from the target image R~ maps E to the elliptic normal
    curve of degree m in P^{m-1} embedded by |(m+1)O - R|; m base images lie on a hyperplane iff their
    sum is -R. Hence the whole decomposition problem is the classical affine-degeneracy problem (m points
    on a hyperplane in P^{m-1}) for B points on a fixed degree-m curve, with the point set a linear transform
    of one fixed set. Claim 2 (duality recursion). For an (m-1)-subset J, the dual point l_J meets R~^*
    in the point dual to the hyperplane through P~_J and R~, whose last intersection with E is -(sum_J
    P_j + R); so arrangement-based degeneracy algorithms are enumeration of (m-1)-subsets with a dictionary
    lookup, cost B^{m-1}, the same as the e_k = k - 1 floor. Claim 3 (constants). At m = 3 the O(n^2)
    slope-hashing collinearity algorithm charged in field operations costs between 0.7x and 1.3x of point-addition
    enumeration per target. The missing lemma is a finite-field analogue of Erickson-Seidel: no degeneracy
    detector for points on a degree-m elliptic normal curve over F_p runs below B^{m-1-delta} (equivalently,
    an incidence algorithm, not only a Bourgain-Katz-Tao bound, would be needed to go below).'
  mechanism: The reduction is exact and target-dependent only through a linear projection. The import
    fails algorithmically because every sub-n^d geometric method (cuttings, Szemeredi-Trotter) uses an
    order on the field, and the dual point of a candidate hyperplane is itself the point whose membership
    in the base decides the relation.
