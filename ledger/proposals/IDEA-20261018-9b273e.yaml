  title: >-
    One randomness tape, three conforming builds: signature disagreement rates for emulated,
    strict and FMA-contracted FN-DSA
  class: measurement
  claim: >-
    Reference Falcon code (RECALLED) ships an integer-emulated floating-point backend and
    a native one, and compilers may contract a*b + c into FMA, changing rounding. Claim: on
    self-generated keys and identical RNG tapes, emulated and strict-native builds produce
    bit-identical signatures on 10^6 signatures, while FMA-contracted builds disagree on a
    fraction >= 1e-5 of signatures at n = 512. Each disagreement is a real-world arithmetic
    defect instance at deployed dimension; its first-differing tree node locates it.
  mechanism: >-
    IEEE-754 binary64 with correct rounding is deterministic, so a faithful emulation matches
    strict native. FMA rounds once instead of twice, so it changes some centres by one ulp;
    a one-ulp centre change flips the sampled integer only when the centre sits near a decision
    boundary, which happens at a rate set by width and precision. The flip rate measured here
    is the empirical counterpart of the p-bit flip-set model.
  tracked_object: Disagreement rate per build pair and the histogram of first-differing tree
    nodes.
