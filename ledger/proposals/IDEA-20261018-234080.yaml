  minimal_test:
    design: >-
      Elevated-DFR reduced ML-KEM (n=64,k=2,eta=3,d_v=3). For 20 keys collect up to 8 failures
      with directional filtering; log cosine and queries per failure.
    controls:
    - >-
      null: directional filter using an independent random direction - queries per failure
      must stay flat
    - 'positive: oracle filter using the true secret direction (upper bound)'
