  title: >-
    How fast does the failure cone narrow? Measured secret-direction cosine after F failures
    versus the D'Anvers-Rossi-Virdia model
  class: measurement
  claim: >-
    After F decryption failures, the averaged failure direction has cosine with the true secret
    direction growing like sqrt(F)/sqrt(F + c) with c predicted by the D'Anvers-Rossi-Virdia
    directional model, and the query cost to the (F+1)-th failure, using direction-weighted
    filtering, falls by >= 4x relative to the first failure by F=4 at reduced parameters.
    If the cosine or the cost ratio deviates from the model by more than 2x, the model used
    to price post-first-failure attacks is wrong.
  mechanism: >-
    Failures occur where the ciphertext direction correlates with the secret; averaging failing
    directions (with ring-rotation alignment) estimates the secret direction, and filtering
    further candidates by correlation with that estimate boosts the failure rate. The bootstrapping
    model gives closed forms; they have been checked at Kyber-like sizes mostly by simulation
    of the noise term rather than by end-to-end encapsulation pipelines with compression.
  tracked_object: >-
    cos(estimate_F, true secret) and queries-to-next-failure as functions of F, end-to-end
    through real (parameterized) encapsulation.
