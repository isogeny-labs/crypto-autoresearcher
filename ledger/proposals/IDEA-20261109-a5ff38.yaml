idea:
  id: IDEA-20261109-a5ff38
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: F4 step-degree profile of prime-field Semaev membership systems is locally constant on the (a,b)-plane,
    with j = 0, j = 1728 and isogeny-class arms
  class: barrier
  claim: 'Let p be a prime in [2^16, 2^20] with p = 1 mod 12, m in {3,4}, and B a divisor of p-1 near
    p^{1/m}. For E_{a,b}: y^2 = x^3 + ax + b define Sigma_{a,b}(x_R) = {S_{m+1}(x_1,...,x_m,x_R), x_i^B
    - 1 (i=1..m)} with x_R = x(R) for a random R in E_{a,b}(F_p). Let D_max be the largest step degree
    a fixed F4 implementation (fixed monomial and variable order) reaches before returning the reduced
    basis or {1}, and S_tot the total rows reduced. Claim: at fixed (p, m, B) and fixed solvability class
    of x_R, D_max is the same for at least 90 percent of 40 uniformly random (a,b) with ab(4a^3+27b^2)
    != 0, and the same value is taken on every curve of the F_p-isogeny class of one generic curve reached
    by rational ell-isogenies, ell <= 13, that still has ab != 0. The fibres a = 0 (when 3 | B) and b
    = 0 (when 4 | B) are special: D_max there may differ and the sign of the difference is the result,
    predicted in {-1, 0, +1}. No change of ECDLP exponent is asserted; the record decides whether moving
    the instance in moduli space can change Groebner cost anywhere but on a thin special locus that secp256k1
    (a = 0) already occupies.'
  mechanism: The coefficients of S_{m+1} are polynomials in (a,b) (S_3 is quadratic in a and linear in
    b) and x_i^B - 1 is curve-independent, so every rank F4 computes is the rank of a matrix with entries
    polynomial in (a,b) over F_p; each rank is constant off a proper closed subset and the whole step-degree
    profile is constant on a dense open set (generic flatness, upper semicontinuity of Hilbert functions).
    Special fibres are where a minor vanishes identically; a = 0 carries the diagonal mu_3 action x_i
    -> omega x_i under which S_{m+1} is weighted homogeneous and x_i^B - 1 is invariant when 3 | B, so
    Sigma_{0,b} is mu_3-graded; b = 0 carries the mu_4 analogue when 4 | B. Isogenous curves with ab !=
    0 are generic points of the plane with the same N, so isogeny motion is predicted to leave D_max fixed
    while the two CM fibres are the only candidates for a jump.
  novelty_status: adaptation
  citations:
