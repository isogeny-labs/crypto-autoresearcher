    metric: N*(leaf_only)/N*(top_half) at matched leaked bits
    direction: higher
    minimum_effect: ratio >= 2 at n = 64 and n = 128
    falsified_by: ratio at or below 1 at both n
  - id: P3
    metric: log-log slope b of N* in n at eps = 0
    direction: different
    minimum_effect: b in [0, 1.5] with 95% CI width < 0.6
    falsified_by: b outside [0, 1.5] or residual > 0.3 log2 units
  minimal_test:
    design: >-
      Python port of a toy Falcon (q = 12289, n in {16, 32, 64, 128}) with an exponent-leak
      oracle wrapped around ffSampling; attacker: bucket MLE then BKZ (fpylll) on the hint-embedded
      lattice; sweep eps and leaked level.
    controls:
    - >-
      null: leak oracle returns exponents of centers computed under an independent random
      key with the same public key format; recovery must fail up to 5x the predicted N*
    - >-
      positive: eps = 0 and full-precision center values leaked; recovery must succeed within
      a handful of signatures
    - >-
      A/A: identical configuration run on two disjoint key/seed blocks; N* ratio sets the
      noise floor
  falsification_conditions:
  - N* not monotone in I(eps) across the 4 noise levels at n = 64
  - null-oracle arm recovers the key in any trial (pipeline leaks the key by another path)
  - positive control fails, so the attack harness is not able to see a leak
  confounders:
  - BKZ block size cap limits recovery independently of hint count
  - the toy port's tree depth differs from the reference implementation at small n
  - MLE initialization quality dominating the hint information
  interpretation_limits:
