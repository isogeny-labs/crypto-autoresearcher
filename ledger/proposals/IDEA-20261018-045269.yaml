  title: >-
    Floating-point conversion leak as a learning curve: signatures-to-key vs channel noise
    and tree level, simulated oracle, n=16..128
  class: mechanism
  claim: >-
    KN-LIT-7909ee reports Falcon key recovery from tens of power traces that leak the signed
    exponent of each ffSampling center at integer-to-float conversion. Abstract that leak
    as a noisy channel (exponent bucket of each center, flipped to a neighbouring bucket with
    probability eps) on a self-built toy Falcon. The claim: the median number of signatures
    to certified key recovery N*(n, eps) scales as C * n^b / I(eps), with I(eps) the per-center
    mutual information of the channel, b in [0, 1.5], and leaks restricted to the top half
    of the tree carry at least twice the key information per leaked bit of leaf-only leaks.
    Falsified if N* is not monotone in I(eps) or the log-log fit in n leaves residuals above
    0.3 in log2 N*.
  mechanism: >-
    Each center c_i is an affine function of the target and of previously drawn integers through
    the secret ffLDL tree, so an exponent bucket is a two-sided interval constraint on a secret-dependent
    linear form. Many signatures give many intervals; maximum-likelihood over the bucket observations
    turns them into approximate linear hints, and lattice reduction finishes the key, which
    is the reported pipeline. The information per observation is bounded by the bucket entropy
    times the channel capacity, so signature count should track 1/I(eps). Top-level centers
    are larger dense combinations of more secret coordinates, so a bit there should constrain
    more of the key than a leaf bit.
  tracked_object: >-
    N*(n, eps, level): median over 10 self-generated keys of the number of simulated-leak
    signatures needed until the recovered (f, g) satisfies h = g/f mod q and reproduces a
    verifying signature.
