idea:
  id: IDEA-20261109-5c783a
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: The discrete log on a j = 0 prime-order curve is a Galois element of the ray class field of conductor
    (pi - 1); its only analytic shadows are (N-1)/6 Hecke L-functions, inversion costs N^{3/2}, and the
    required archimedean input is the compatible lift
  class: barrier
  claim: 'Let E/F_p be y^2 = x^3 + b with End = Z[omega], K = Q(sqrt(-3)), pi the Frobenius, n = (pi -
    1), #E(F_p) = N = Nm(n) prime (so N = 1 mod 6). Closed form, no compute: E(F_p) = E~[n] reduced mod
    a prime P above p, G = Gal(K(n)/K) = (O_K/n)^*/mu_6 of order (N-1)/6, and the discrete log k is the
    element sigma_k acting on E~[n] as [k]. The analytic objects attached to G are the (N-1)/6 Hecke L-functions
    L(s, chi) of conductor dividing n, analytic conductor 3N up to a constant, each computable to fixed
    precision in N^{1/2+o(1)} terms. Kronecker''s limit formula expresses log|u^sigma| for the elliptic
    unit u as a character sum over G of L''(0, chi); recovering log|u^{sigma_k}| costs (N-1)/6 times N^{1/2+o(1)}
    = N^{3/2+o(1)}, and matching it against the instance needs log|u_Q|, the archimedean embedding of
    the unit of the torsion lift Q^, which is the compatible-lift datum unavailable from Q mod P. Direct
    Chebotarev is no better: the least prime of K in the class sigma_k has norm about N log N unconditionally
    by the GLV box and is bounded by (log d_{K(n)})^2 = N^2 (log N)^2 under GRH. Exponent 3/2 (or 1) against
    1/2; delta +1 (or +1/2).'
  mechanism: 'Main theorem of complex multiplication: for a prime q = (beta) of K prime to 3 n, Frob_q
    acts on E~[n] by multiplication by beta mod n, and beta mod n acts on E(F_p) as the GLV scalar a +
    b lambda. So the DL is the Artin symbol of any beta with beta = k mod n up to mu_6. Shimura reciprocity
    moves elliptic units by the same sigma: u_{kP} = sigma_k(u_P). The L-function side knows the vector
    (log|u^sigma|)_sigma only through its Fourier transform (L''(0, chi))_chi; reading one coordinate
    is a full inversion. The instance supplies Q only as a residue class mod P, which fixes sigma_k abstractly
    but gives no archimedean value; producing one is the complex elliptic logarithm of the compatible
    lift, filed as known in the automorphic wave.'
  novelty_status: known
