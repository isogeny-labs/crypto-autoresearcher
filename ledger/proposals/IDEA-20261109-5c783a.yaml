  assumptions:
  - Class number 1 for K, so ideals are principal and classes are residues mod n up to units.
  - The approximate functional equation needs about sqrt(conductor) terms per L-value at fixed precision.
  predictions:
  - metric: order of the ray class group mod n at toy N
    direction: different
    minimum_effect: exactly (N-1)/6 on every toy instance
  - metric: terms used by lfun per L'(0, chi) at toy N
    direction: higher
    minimum_effect: scaling exponent in N at least 0.45 across N in [60, 4000]
  minimal_test:
    design: 'Zero-compute price table as stated, plus a toy calibration: for four j = 0 prime-order curves
      with N in [60, 4000], in PARI/GP compute bnrinit(K, n) and its class group order, the number of
      characters, and the term count reported by lfuninit for L(s, chi) at precision 30; fit the exponent
      of terms versus N. Optionally verify on the smallest instance that Frob_q for q = (beta) permutes
      the roots of the lifted kernel polynomial of pi - 1 as multiplication by a + b lambda.'
    controls:
    - A non-CM prime-order toy curve, where no ray class description exists and bnrinit has no analogue.
    - The trivial character, whose L-function is the Dedekind zeta of K with conductor 3.
    required_metrics:
    - N, p, lambda, order of the ray class group
    - terms per L-value and fitted exponent
    - the implied total cost (N-1)/6 times terms
  falsification_conditions:
  - A ray class group of order different from (N-1)/6 on a valid instance.
  - A documented procedure computing any archimedean datum of Q^ in o(N^{1/2}) operations.
  - A Fourier inversion over G that reads one coordinate from o(N) L-values.
  confounders:
  - lfuninit term counts depend on precision and implementation constants; only the scaling exponent is
    scored.
  interpretation_limits:
  - This is a price table for a route already closed by the compatible-lift obstruction; it adds the L-function
    cost and no mechanism.
  heuristic_assumptions:
  - id: H1
    statement: Each L'(0, chi) costs N^{1/2+o(1)} and no shortcut shares work across the (N-1)/6 characters
      below N^{3/2}.
    rigorous_support: Standard approximate functional equation; sharing is not excluded by theorem.
    validation_plan: The toy term-count fit and a literature check for batched Hecke L-value algorithms.
  target_complexity:
    time_exponent: N^{3/2} with an archimedean oracle; N^{1} for direct Chebotarev via the GLV box
    memory_exponent: N for the character table
    best_known: Pollard rho, Theta(N^{1/2}), KR-RHO-13bf67
    hidden_overhead: The oracle itself is the compatible lift, i.e. the problem.
    tradeoff_note: Delta is +1 against the best exponent; no tradeoff exists.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
