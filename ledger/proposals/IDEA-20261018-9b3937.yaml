  minimal_test:
    design: >-
      Build primal embedding bases at ML-KEM-512 (k=2) and ML-KEM-768 (k=3) shapes, n=256,
      q=3329, CBD secrets, with the estimator's optimal number of samples m. Also build bases
      at intermediate d from 400 to 1500. For each, run fpylll LLL and one BKZ-20 tour under
      each precision type (double, long double, dd, qd, MPFR-128). Count operations by instrumenting
      the GSO and size-reduction loops, and check GSO consistency against an exact rational
      recomputation on sampled indices.
    controls:
    - >-
      null: a random unimodular-scrambled basis of Z^d at the same d, which is well conditioned.
      Double must suffice, and maintenance cost must follow the d^3 law with a small constant.
    - >-
      positive: a basis with a planted, deliberately extreme log-profile slope (a q-ary block
      with q=2^30), where double must fail at moderate d
    - 'A/A: the same ML-KEM-shape basis run twice under two basis-scrambling seed blocks'
  falsification_conditions:
  - 'P1: measured cost below 2^30 at the ML-KEM-768 shape'
  - 'P2: double is sound at every d, so the precision escalation is absent'
  - >-
    the positive control does not fail under double, which means the consistency check is
    too weak and the batch is invalid
  confounders:
  - fpylll's adaptive precision heuristics can change mid-run
  - the count of insertions per tour depends on how well reduced the input is
  - >-
    wall time depends on library builds, so the comparison uses counted operations weighted
    by a fixed cost table per precision type
  interpretation_limits:
  - >-
    This measures only the non-oracle term, at true FIPS dimension. It says nothing about
    the SVP oracle's cost and is not a statement of ML-KEM security. The total-attack implication
    is a conditional sum with the oracle cost taken from the model.
  - >-
    One library family (fpylll/G6K). Other implementations may use different precision strategies.
