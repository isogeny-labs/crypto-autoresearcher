  - id: P2
    metric: iteration ratio at i >= d/4
    direction: lower
    minimum_effect: <= 1.1
    falsified_by: ratio >= 1.5 at i=d/4, which would mean rotation structure survives projection
  minimal_test:
    design: >-
      Primal embedding lattices of module-LWE with n in {16,32}, k in {2,3} (d=64..96). For
      each, run G6K sieve on context [i, d] for i in {0, 4, 8, d/8, d/4, d/2} with and without
      inserting rotated copies (projected) of every newly found vector; count iterations,
      pair tests and wall time to saturation.
    controls:
    - >-
      null: unstructured q-ary lattice of the same dimension and determinant with 'rotations'
      applied as random signed coordinate permutations (orbit is not in the lattice) - augmentation
      must not help
    - >-
      positive: ideal lattice (k=1) full sieve, where the orbit is exact and the published
      gain should reproduce
    - 'A/A: plain arm run twice with different database-initialization seed blocks'
  falsification_conditions:
