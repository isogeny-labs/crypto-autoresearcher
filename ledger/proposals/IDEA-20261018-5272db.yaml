  title: >-
    Rotation-augmented sieve database on negacyclic module lattices: does the 2n-fold rotation
    orbit survive projection into BKZ blocks?
  class: algorithm
  claim: >-
    On the full (unprojected) primal lattice of a module-LWE instance over Z[X]/(X^n+1), inserting
    all 2n signed rotations of each new short vector into a G6K database cuts the number of
    sieve iterations to saturation by a factor >= 4 at lattice dimension 64-96. Inside BKZ
    the projected block pi_i(L) is not rotation invariant, so the gain must collapse to <=
    1.1x once the block is a proper projection. The falsifiable content is the collapse curve
    as a function of projection depth.
  mechanism: >-
    The module lattice is invariant under multiplication by X acting coordinatewise on each
    ring component, so each lattice vector carries an orbit of 2n vectors of equal norm (Schneider;
    Bos-Naehrig-van de Pol exploited this for ideal Gauss sieving). Projection orthogonal
    to the first i Gram-Schmidt vectors destroys the invariance because the projection subspace
    is not X-stable. The fraction of the orbit that stays short after projection decays with
    i. Measuring that decay tells whether any rotation saving can reach the projected sieves
    that dominate the real attack.
  tracked_object: >-
    Ratio of sieve iterations (and total pair tests) to reach 90% saturation, rotation-augmented
    vs plain, as a function of projection depth i into the lattice.
