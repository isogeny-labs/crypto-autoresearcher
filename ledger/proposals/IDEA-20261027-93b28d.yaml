  assumptions:
  - Exact sets at n <= 18, typed disjoint cosets, k in {2,3}.
  - d_zero measured on the Boolean cube in the polynomial basis; basis dependence recorded.
  proof_search_map:
    bottleneck: propagation of R through m-2 n-bit variables at constant degree
    baseline_embedding:
      parameter_slice: 'i=1: P_1 = V+v_1, d_zero = 1'
      reproduction_check: 'random affine subspace gives d_zero = 1; random subset gives min{D: C(n,<=D) > |P|} up
        to +1'
    observation_collision: sets of equal size with different closure leak
    quantifier_order: 'FORALL cuts i: d_zero(P_i) <= d* is what the variant needs; one cut with generic leak refutes
      it at that scope'
    method_ceiling:
      strongest_certifiable_claim: closure-leak curves at n <= 18
      nearby_object_control: size-matched random subsets and subspaces
  predictions:
  - metric: phi_D(P_i)/phi_D(null_i) at D = d_count(|P_i|)
    direction: different
    minimum_effect: 'H_gen: in [0.85, 1.15]; H_struct: <= 0.5'
  - metric: d_zero(P_i) vs d_count(|P_i|), n in {12,14,16,18}
    direction: higher
    minimum_effect: 'H_gen: tracks d_count (3 at n=16, rising)'
  minimal_test:
    design: 'n in {12,14,16,18}, k in {2,3}, fixed seeds, P_i exact for i = 1..m. Evaluate ev_D(q) on all 2^n cube
      points, reduce against the GF(2) span of ev_D(P_i), D = 1..6; record phi_D. Nulls: 20 random subsets and 20
      random (unions of) subspaces of equal size per cell.'
    controls:
    - P_1 subspace (positive)
    - random subset (negative)
    - v_i in V untyped sets
    - second curve B
    required_metrics:
    - phi_D curves
    - d_zero
    - '|P_i|'
    - null bands
  falsification_conditions:
  - 'phi_D(P_i) inside the null band for all i >= 2 and all tested n: H_gen at tested scope, variant obstructed
    by cut entropy.'
  - 'phi ratio <= 0.5 with d_zero <= 3 at all i, stable from n=12 to 18: H_struct, stage 2 opens (breakthrough-adjacent;
    no curve claim).'
  - 'Instrument fails the positive control: void.'
  confounders:
  - 'toy n gives d_count only 3-5 (growth ~ n/log n is slow): the ratio to null is the readout'
  - basis dependence
  - curve choice
  - '|P| near 2^n is degenerate: report i <= m/2+1'
  interpretation_limits:
  - d-closed P_i is necessary for message passing, not sufficient.
  - Toy tier; the n=571 figure is counting arithmetic.
  - No claim about any curve.
  heuristic_assumptions:
  - id: H1
    statement: x-sets of typed partial sums behave as generic subsets of F_2^n under low-degree closure
    rigorous_support: 'for random P, d_zero = min{D: C(n,<=D) > |P|} up to +1 (independent evaluation vectors)'
    validation_plan: '20 random subsets per (n,|P|): empirical d_zero vs the formula, largest deviation as the tail
      check'
  target_complexity:
    time_exponent: 'if H_struct holds with d* and derivation at D'' = d*+3 passes: n^{(d*+3)w+2} (m links, O(n)
      trials; d*=2, w=2.807: n^{16.0}) vs Nagao n^{8w+1} = n^{23.5}'
    memory_exponent: n^{2(d*+3)} dense
    best_known: Nagao n^{8w+1} conditional on Assumption 1; vOW 2^{n/2}
    hidden_overhead: 1/D'! constants, p^{C_0}/C_0, the unproved derivation stage; if H_gen holds the cost is n^{Theta(n/log
      n)}, worse than rho
    tradeoff_note: memory-heavy; links sequential, trials parallel
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  dominated_by: vOW parallel rho at every FIPS label (EV-SEMBIN-f4408c, EV-SEMBIN-71e5cd); n/a for the measurement
