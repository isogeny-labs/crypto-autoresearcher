idea:
  id: IDEA-20261027-93b28d
  question_id: RQ-SEMBIN-9e8f82
  status: proposed
  added: '2026-10-27'
  title: 'Cut-describability gate for a transfer-matrix (dynamic-programming) Groebner variant of Nagao''s chain:
    the closure-leak curve of the partial-sum x-sets P_i decides whether degree-d messages can exist'
  class: algorithm
  claim: 'Nagao''s chain passes information from R through m-2 n-bit variables U_i. A transfer-matrix variant keeps
    after link i only a degree-<=d description M_i of P_i = {x(P_1+..+P_i)} (the message) and derives M_{i+1} from
    M_i, the next S_3 block and the next coset, at m*C(2n+k, d+3)^w per solve instead of C(N+4,4)^w with N ~ n^2/C_0.
    A degree-d message exists only if P_i is d-closed: no q outside P_i has its degree-<=d monomial-evaluation vector
    in the F_2-span of those of P_i. Define the closure leak phi_D(P) = |{q notin P : ev_D(q) in span ev_D(P)}|
    / (2^n - |P|) and d_zero(P) = least D with phi_D = 0. Claim (H_gen): for typed cosets at toy (n,k), phi_D(P_i),
    i >= 2, matches size-matched random subsets within 15% (equal d_zero), so the cut-entropy count d >~ log2|P_i|/log2(n/d)
    applies and the variant is obstructed at the middle cut (|P| ~ 2^{n/2}: d >~ 64 at n=571, counting arithmetic
    only). Competing (H_struct): d_zero(P_i) <= 3 for all i and phi ratio to null <= 0.5.

    '
  mechanism: 'OBJECT FRAME. Representation: R1 (x in F_2^n; exact sets from curve arithmetic at n <= 18). Sigma:
    merge with the next coset via S_3 (translation by Fb elements); Class I partial-action. Tracked object: P_i
    as the zero set of low-degree polynomials. Lossy-projection test: discards which tuples produced each point
    and all multiplicities (2^{ki} tuples to |P_i| points); Sigma-compatible because a merge reads only x-values.
    Controls: P_1 = V+v_1 (a subspace, d_zero = 1) is the positive control showing the instrument sees structure;
    random subsets are the negative control. KN-OPEN-020: scoped-out class; no escape claimed; the idea prices the
    one open number, the degree of the message.

    Necessary, not sufficient: a d-closed set may still not be derivable from M_i at degree <= d+3. A pass opens
    stage 2 (derivation at D'' = d+3); a fail closes the variant with a named obstruction (cut entropy).

    '
  novelty_status: unverified
