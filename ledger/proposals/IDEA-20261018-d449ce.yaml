  title: >-
    One BKZ-simulator calibration for both ML-KEM and ML-DSA lattice shapes: per-index Gram-Schmidt
    residual of CN11 and sharp simulators
  class: measurement
  claim: >-
    On q-ary lattices shaped like scaled-down ML-KEM (q=3329, CBD eta=2) and ML-DSA key recovery
    (q=8380417, eta=2) at dims 80-160, the measured log Gram-Schmidt profile after BKZ-beta
    (beta 20..50) deviates from the CN11 simulator by a signed residual whose head region
    (q-vector plateau) differs between the two shapes by at least 0.5 bits in log||b_i*||,
    while the sharp simulator (KN-LIT-4429) cuts the mean absolute residual by at least 30%
    on both.
  mechanism: >-
    Both schemes' estimates pass through the same simulator, but ML-DSA's large q keeps a
    long unreduced q-vector plateau that ML-KEM lacks at matched beta. A residual model fitted
    per shape tells whether one calibration can serve both. f7c912 calibrates only delta(beta)
    on ML-KEM shape; this tracks the full profile and the shape-dependent head.
  tracked_object: >-
    Per-index residual log||b_i*||_measured - log||b_i*||_simulated after BKZ-beta tours,
    per shape and simulator.
