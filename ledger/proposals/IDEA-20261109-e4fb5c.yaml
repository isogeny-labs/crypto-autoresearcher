      provenance: internal
      relation: adjacent
      delta: Generic bound is bit-blind; the Walsh spectrum is a bit-level statistic of the representation.
    - ref: KR-RHO-898783
      provenance: internal
      relation: orthogonal
      delta: Interval methods use the size of k, not parities of its bits.
