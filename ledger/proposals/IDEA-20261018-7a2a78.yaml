  title: >-
    Galois-orbit Fourier sampling on toy Ring-LWE: does the automorphism group leak mutual
    information that a random permutation group does not?
  class: mechanism
  claim: >-
    Prepare (in exact classical simulation) the quantum state over Z_q^n obtained by superposing
    an RLWE sample's Galois conjugates sigma_i(b) for sigma_i in Gal(Q(zeta_{2n})/Q), then
    apply QFT over Z_q^n and measure. At n in {4,8}, q in {17,41}, the mutual information
    I(outcome; s) per sample is no larger than for the structure-removed control in which
    the Galois group is replaced by a random permutation group of the same order acting on
    coefficients, within 0.01 bits.
  mechanism: >-
    A ring-only quantum mechanism must use something plain LWE lacks; the Galois action is
    the most direct candidate, since it permutes the CRT slots and maps s to sigma(s). Fourier
    sampling over an orbit superposition is the generic way a quantum algorithm exploits a
    group action. Exact simulation at q^n <= 41^4 is feasible, and comparing against an isomorphic-size
    random permutation group isolates whether the algebraic action, not merely symmetry, carries
    information.
  tracked_object: >-
    Exact mutual information I(Y; s) between the measured Fourier outcome Y and the secret
    s, per sample, per group action.
