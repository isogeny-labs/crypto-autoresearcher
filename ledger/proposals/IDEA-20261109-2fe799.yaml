        field multiplications per action). Scanlon arm: build the n by n matrix with columns C_{T^i}(x),
        solve M a = y over F_2. Rho arm: a 16-adding walk on the cyclic A-module with states C_alpha(x)
        + C_beta(y), distinguished points, '
