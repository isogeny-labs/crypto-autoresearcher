      provenance: internal
      relation: adjacent
      delta: The row's anomalous attack is the existing positive control; the Carlitz control uses linear
        algebra on a non-cyclic group.
    - ref: KR-RHO-13bf67
      provenance: internal
      relation: orthogonal
      delta: The row is the generic bound the Carlitz representation evades; no exponent claim is made
        for curves.
