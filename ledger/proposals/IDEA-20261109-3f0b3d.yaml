idea:
  id: IDEA-20261109-3f0b3d
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Spectral norm of the small-x factor base in the character group of E(F_p): three pre-registered
    regimes and the low-frequency energy any known-DL target-set yield boost requires'
  class: representation
  claim: 'Let E/F_p have prime order N, generator P, F_beta the set of points with 0 <= x < p^beta, B
    = |F_beta|. Put v(k) = 1 if kP lies in F_beta, hat v(b) = sum_k v(k) e(bk/N), and C(p,beta) = max
    over b != 0 of |hat v(b)|/sqrt(B). Theorems: sqrt((N-B)/(N-1)) <= C <= 3 sqrt(p)(1+ln p)/sqrt(B).
    Three regimes for the slope alpha of log C against log p: random, alpha = 0 with C about sqrt(2 ln
    N) (hat v is real since F is symmetric); arithmetic progression, alpha = beta/2, realised by the control
    of multiples kP with 0 < k < B; Weil ceiling, alpha = (1-beta)/2. Prediction 1: for beta in (1/4,
    1/3, 1/2) and 8 primes per beta in [2^16, 2^28], F_beta is in the random regime, alpha within 0.03
    of 0 and C/sqrt(2 ln N) inside [0.7, 1.3]. Prediction 2: the low-frequency energy E_L = sum over 0
    < |b| <= N/L of |hat v(b)|^2 at L = B is within a factor 1.3 of its random value 2NB/L, so target
    sets of the form aP with 0 < a < L gain no relation yield over uniform targets. This supersedes the
    four incompatible alpha values of IDEA-20260805-c4f675 by fixing normalisation, taking the maximum
    over every b, and adding both calibrating controls.'
  mechanism: hat v(b) = sum over Q in F of chi_b(Q) = (1/p) sum_a hat 1_I(a) F(a,b) with F the hybrid
    matrix of the companion record; the Weil bound 3 sqrt(p) and the Wiener norm p(1+ln p) of an interval
    give the upper bound, Parseval the lower bound. For a known-DL target set T, the excess sum over R
    in T of r_m(R) minus |T| B^m/N equals (1/N) sum over b != 0 of hat v(b)^m conj(hat 1_T(b)); for T
    an arithmetic progression of length L the weight sits on |b| <= N/L, so the gain is governed by E_L.
    Uniform targets gain exactly nothing (IDEA-20260805-a25f11), so this is the only additive-combinatorial
    lever on relation supply. The same number is the dual of equidistribution of the discrete logs of
    F_beta mod N, a Burgess-type question for the rank-2 trace function x -> sum of chi_b over points
    above x, a theorem only for beta > 1/2 with no amplification step below because translation on E does
    not preserve x-intervals. The run enumerates x(kP) for k < N (at most 2^28 group operations), forms
    v, and performs one Bluestein FFT of length N per (p, beta).
  novelty_status: adaptation
