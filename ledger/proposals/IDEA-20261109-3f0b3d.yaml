    verified_by: brief section 3 row text.
  assumptions:
  - N prime, N != p; toy discrete logs come from full enumeration, which is instrumentation, not the method.
  - The factor base is the x-interval [0, p^beta), symmetric under negation.
  predictions:
  - metric: slope alpha of log C(p,beta) against log p for F_beta, each beta
    direction: different
    minimum_effect: within 0.03 of 0 with 95 percent CI
  - metric: C(p,beta) divided by sqrt(2 ln N)
    direction: different
    minimum_effect: inside [0.7, 1.3] at every prime
  - metric: E_L divided by 2NB/L at L = B
    direction: different
    minimum_effect: inside [0.77, 1.3] at every prime
  - metric: slope alpha for the arithmetic-progression control
    direction: higher
    minimum_effect: within 0.03 of beta/2
  minimal_test:
    design: For each beta and 8 prime-order curves (selected with the crypto ic executable), enumerate
      the multiples, build v, FFT, record C, argmax b, and E_L for L equal to B and to B^2, then fit alpha
      by least squares. Run the same pipeline on both controls and on the c4f675 definition.
    controls:
    - Random subset of E(F_p) of size B, expected alpha 0.
    - Multiples kP with 0 < k < B, expected alpha beta/2.
    - Parseval check that the sum of |hat v(b)|^2 over b equals N B.
    - Weil ceiling check on C at every prime.
    required_metrics:
    - p, N, beta, B
    - C and argmax b
    - alpha with CI, per family
    - E_L over 2NB/L for both L
    - control values and both identity checks
  falsification_conditions:
  - Alpha for F_beta at least 0.05 with CI excluding 0 for any beta <= 1/2 means the discrete logs of
    small-x points are Fourier-biased; the null fails and target-set boosting is live.
  - E_L above twice 2NB/L at L = B for a majority of primes at some beta gives the same conclusion from
    the yield side.
  - Control slope outside beta/2 plus or minus 0.03, or a failed Parseval check, is an invalid run.
  confounders:
  - At beta = 1/2 and small p the factor 1 - B/N is not negligible; the fit uses the exact variance B(1
    - B/N).
  - The maximum of a length-N real spectrum has extreme-value spread near 0.5 in C; eight primes per beta
    is the minimum.
  interpretation_limits:
  - A confirmed random regime is a toy measurement up to 2^28 and a theorem only above beta 1/2.
  - Only arithmetic-progression target sets are covered; other known-DL target sets have other hat 1_T.
  heuristic_assumptions:
  - id: H1
    statement: The discrete logs of x-interval points equidistribute mod N in the Fourier sense for beta
      < 1/2.
    rigorous_support: Theorem for beta > 1/2 by completion against the hybrid bound; open below.
    validation_plan: The sweep above with the two controls.
  target_complexity:
    time_exponent: N^(1/2) unchanged under the null; a confirmed alpha > 0 would be priced for arithmetic-progression-target
      index calculus in a successor record
    memory_exponent: N bits for v at toy size only
    best_known: Pollard rho, Theta(N^(1/2)) (KR-RHO-13bf67)
    hidden_overhead: none claimed
    tradeoff_note: none; this is a discriminating measurement
