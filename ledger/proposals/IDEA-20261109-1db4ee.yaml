idea:
  id: IDEA-20261109-1db4ee
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-9d5d44
  title: Bilinear (1,1) addition-law ansatz on extended Edwards25519 solves to two pencils; 8M is the
    floor and the Z/4 characters chi^(+-1) carry no law
  class: representation
  claim: 'Formula-engineering claim, not an ECDLP claim. Curve $-x^2+y^2=1+dx^2y^2$, $d=-121665/121666$
    non-square, $p=2^{255}-19$, coordinates $(X:Y:Z:T)$, $XY=ZT$. Ansatz: $x_3=N_x/D_x$, $y_3=N_y/D_y$
    with all four forms bilinear in $(X_1,Y_1,Z_1,T_1)\otimes(X_2,Y_2,Z_2,T_2)$ (64 unknowns), outputs
    $X_3=N_xD_y$, $Y_3=N_yD_x$, $Z_3=D_xD_y$, $T_3=N_xN_y$. (C1) The solution space is exactly $(N_x,D_x)=\lambda(X_1Y_2+Y_1X_2,\
    Z_1Z_2+dT_1T_2)+\mu(T_1Z_2+Z_1T_2,\ Y_1Y_2-X_1X_2)$ and $(N_y,D_y)=\lambda''(Y_1Y_2+X_1X_2,\ Z_1Z_2-dT_1T_2)+\mu''(T_1Z_2-Z_1T_2,\
    X_1Y_2-Y_1X_2)$. (C2) The law fails exactly when $\lambda+\mu\,y(P_1-P_2)=0$ or $\lambda''+\mu''\,x(P_1-P_2)=0$.
    (C3) Every member needs at least 4 bilinear products for its four forms, hence at least 8M; the corners
    cost ss 8M+1c, dd 8M, sd and ds 9M+1c over $\mathbb F_p$. (C4) With $U=Y+X$, $V=Y-X$ and $\tau=(\sqrt{-1},0)$,
    the 16 monomials split 4+4+4+4 by character of $(P_1,P_2)\mapsto(P_1+\tau,P_2-\tau)$; ss uses exactly
    $\{U_1U_2,V_1V_2,Z_1Z_2,T_1T_2\}$, dd exactly $\{U_1V_2,V_1U_2,Z_1T_2,T_1Z_2\}$, and the other eight
    monomials carry no law. No law below 8M exists in this ansatz.'
  mechanism: '$\tau$ acts linearly, $(X,Y,Z,T)\mapsto(iY,iX,Z,-T)$, diagonal on $(U,V,Z,T)$ with characters
    $(i,-i,1,-1)$. Dimension: denominators are sections of $p_1^*L\otimes p_2^*L\otimes\mu^*\mathcal O(-(x)_\infty)$,
    which has degree 0 on fibres of $P_1-P_2$; a nonzero section has divisor $\delta^*$(degree-2 divisor),
    so $h^0=2$. Membership uses the identities $(x_1y_1+x_2y_2)(1+dt)-(x_1y_2+y_1x_2)(y_1y_2-x_1x_2)=-x_1y_1c_2-x_2y_2c_1$
    and $(x_1y_1-x_2y_2)(1-dt)-(y_1y_2+x_1x_2)(x_1y_2-y_1x_2)=-x_1y_1c_2+x_2y_2c_1$, $t=x_1x_2y_1y_2$,
    $c_j=-x_j^2+y_j^2-1-dx_j^2y_j^2$. Bound: the eight basis forms have disjoint monomial supports, so
    the four chosen forms span dimension 4 and need 4 rank-one products. Mixed corners: the pair $\{Z_1Z_2\pm
    dT_1T_2,\ T_1Z_2\mp Z_1T_2\}$ has rank 3 because $\lambda^2=-1/d$ has no root in $\mathbb F_p$.'
  novelty_status: unverified
