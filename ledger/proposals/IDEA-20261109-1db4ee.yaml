  predictions:
  - metric: dimension of the solution space per coordinate (A2, A3)
    direction: different
    minimum_effect: exactly 2
  - metric: Legendre symbol of -1/d (A6)
    direction: different
    minimum_effect: exactly -1
  minimal_test:
    design: Run scripts/ed25519_law_ansatz.py. A2 solves the ansatz over Q(d) with linsolve; A3 evaluates
      at 40 random point pairs on Edwards25519.
    controls:
    - Square-d control curve; the mixed-corner block rank must drop to 2.
    - Random bilinear pair (N, D) must fail the membership rows.
    required_metrics:
    - free-parameter count from A2
    - nullity from A3 for x and y
    - Legendre symbol of -1/d
  falsification_conditions:
  - A2 or A3 reports a dimension other than 2.
  - A law in the family is exhibited with fewer than 4 layer-1 products.
  - A timeout of the symbolic solve is infrastructure, not falsification.
  confounders:
