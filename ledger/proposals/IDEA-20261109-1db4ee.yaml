  assumptions:
  - $a=-1$ is a square and $d$ a non-square mod $p$; the script asserts both.
  - 'Cost model: layer 1 is products of a linear form in $P_1$ by a linear form in $P_2$; layer 2 is the
    four output products.'
  proof_search_map:
    bottleneck: Dimension of the solution space at the actual constant d.
    baseline_embedding:
      parameter_slice: Corners ss and dd are the two HWCD laws.
      reproduction_check: Assertion A1 and the hwcd4 comparison in A5.
    observation_collision:
      observable: Nullity of the 40 x 32 evaluation matrix.
      distinct_preimage_search: Evaluation can only over-estimate the space.
    constructive_transforms:
    - Change of basis to tau-eigen coordinates (U, V, Z, T).
    quantifier_order: For all pencil parameters, no evaluation with fewer than 4 layer-1 products.
    method_ceiling:
      strongest_certifiable_claim: A floor inside the two-layer ansatz only.
      nearby_object_control: A curve with square d, where the mixed block rank drops to 2.
    proof_obligations:
