  title: >-
    Compressed ADRS and shared SHA-256 midstate: exhaustive tweak-injectivity census of SHA2
    versus SHAKE over every reachable address
  class: control
  claim: >-
    In the SHA2 instantiation the 32-byte ADRS is compressed to 22 bytes and PK.seed is padded
    to one block so every call shares a precomputed midstate; in SHAKE the full ADRS is absorbed.
    Over every address a reduced-parameter signer can reach (h in {8,12}, d in {2,4}, k up
    to 14, a up to 6, len up to 35), the compressed encoding is injective on reachable addresses
    with zero collisions, but there exist (type, field) combinations whose compressed images
    coincide with images from other types when unreachable fields are populated; the reachable/unreachable
    boundary is the whole safety argument and can be checked exhaustively.
  mechanism: >-
    Domain separation in tweakable hashing is only as good as the injectivity of the tweak
    encoding over the addresses the signer actually uses. Compression drops high bytes of
    layer and tree address and keeps type; if a field exceeds its compressed width in some
    parameter set, two distinct logical calls share a tweak. The shared midstate means the
    PK.seed block contributes nothing per call, so domain separation rests entirely on the
    compressed ADRS bytes. An exhaustive census at reduced sizes and an analytic width check
    at FIPS 205 sizes decide whether any set is near the boundary.
  tracked_object: >-
    Set of (encoding, reachable address) pairs mapped to encoded tweak bytes; number of collisions
    and minimum headroom (bits) between field values used and field width, per parameter set.
