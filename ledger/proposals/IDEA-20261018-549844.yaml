  title: >-
    A shared positive-control ladder: five planted sampler defect types at exact KL, and each
    detector's minimum detectable KL
  class: tooling
  claim: >-
    Each detector in this lane brings its own positive control, so sensitivities cannot be
    compared. Build a shared ladder at n in {8, 16}: five defect types (leaf width scale,
    centre bias, tail truncation, sibling copula, p-bit rounding) at six exactly computed
    KL levels. Claim: for a fixed generic quadratic detector, the minimum detectable KL at
    10^5 signatures differs by at least 10x between defect types, so a single power number
    per detector is meaningless; the ladder yields a detector-by-defect sensitivity matrix.
    Falsified if minimum detectable KL is within 3x across types.
  mechanism: >-
    KL is an average; detectors see the defect through particular statistics, and defect types
    put their divergence in different places (tails, means, dependence). Exact KL at n <=
    16 is computable by support enumeration, so rungs are known without sampling error.
  tracked_object: Minimum detectable KL (80% power, alpha 0.01, 10^5 signatures) per detector
    x defect type.
