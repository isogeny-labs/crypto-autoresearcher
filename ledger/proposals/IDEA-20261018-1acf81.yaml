  title: >-
    Masking order as a measured security parameter for c*s1: traces-to-key vs SNR at order
    d = 0, 1, 2 in a simulated Hamming-weight model
  class: measurement
  claim: >-
    In a simulated Hamming-weight leakage of the product c*s1 computed coefficient-wise in
    the NTT domain with d+1 arithmetic shares and Gaussian noise sigma, the number of signatures
    needed to recover s1 by correlation/template attack with known c grows as sigma^{2(d+1)}
    at fixed d. The fitted exponent of traces vs sigma is 2.0, 4.0 and 6.0 within +-0.4 for
    d = 0, 1, 2, and with a first-order share-recombination flaw (shares summed before NTT
    multiply) order 2 collapses to the d = 0 curve.
  mechanism: >-
    Masking's theoretical guarantee is that higher-order moments are needed, so the attack's
    SNR scales as SNR^{d+1}. For ML-DSA the key-dependent intermediate c_hat * s1_hat has
    public c, so a CPA predicts per key coefficient. Whether a concrete masked c*s1 multiplication
    in a share representation matches the theoretical law has to be measured, and the flawed
    arm shows the law depends on implementation, not on order alone.
  tracked_object: signatures (traces) to full s1 recovery as a function of noise sigma and
    masking order d
