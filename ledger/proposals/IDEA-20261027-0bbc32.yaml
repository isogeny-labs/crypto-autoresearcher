    statement: Conditional on common support, anchors and individual ranks, the two collector rowspaces behave like
      independent uniformly drawn subspaces of the admissible row space.
    rigorous_support: Dimension/intersection identities are exact; uniform finite-field subspace intersection is
      only a comparison model, not a theorem about these related covers.
    validation_plan: Later compare intersections, rank increments and longest dependent runs with rank/support-matched
      random-subspace nulls. Record p,r,t,B and conditioning. No crypto-size shortcut or transfer known.
