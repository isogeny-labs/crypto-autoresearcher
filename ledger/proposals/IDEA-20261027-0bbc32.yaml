      parameter_slice: t=0 on exactly the new common signed E base.
      reproduction_check: Symbolic quotient substitutions; independently certify principal/E rows and signed transport.
    observation_collision:
      observable: Projected rowspace forgets cover and auxiliary witnesses.
      distinct_preimage_search: Deck/sign/coordinate transports give different witnesses with identical norm rows.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Common-atom matrices M_0 and M_1, their intersection and stacked-row certificates.
      predicted_gain: Finite discrimination only; no established attack gain.
    quantifier_order: Fix E and public t pair first, select common atoms without row labels, then apply the same
      public-source schedule; no success-selected cover search.
    method_ceiling:
      strongest_certifiable_claim: Complementarity of two finite rowspaces on one unknown vector.
      nearby_object_control: Transported copies of one cover give zero extra dimension.
    proof_obligations:
    - claim: Certify quotient extensions, poles and subgroup action.
      responsibility: correctness
    - claim: Common columns are the same oriented E points.
      responsibility: interface
    - claim: Charge cover/common-base search and both collectors.
      responsibility: runtime
    not_applicable_reason: null
  predictions:
  - metric: rank(stack(M_0,M_1))-max(rank(M_0),rank(M_1))
    direction: higher
    minimum_effect: At least one for the complementary-row candidate; zero rejects it for the frozen pair/base/stream.
  - metric: common usable signed-atom count and L,b of native-witness projection
    direction: different
    minimum_effect: Measure actual intersection and witness fibres; no independent-cover or half-liftability law
      is assumed.
  minimal_test:
    design: 'Future sketch only: admissible t=0,1 on one E, independently certified common base, identical native
      cubic policies; certify intersection and stacked rank, preserving failures. Requires a new frozen protocol/implementation;
      no run here.'
    controls:
    - Full-witness identity L=0; transported t=0 copy yields no extra rank.
    - Duplicate rows, false column maps and unrelated-curve stacking cannot certify new same-system information.
    - Random labels, relabelled cyclic-group and split-product controls calibrate L,b and distinguish auxiliary
      cancellation from E information.
    required_metrics:
    - identities/exceptions
    - common B,U
    - all attempts
    - affine signatures/stacked rank
    - intersection/new-row certificates
    - L,b
    - setup/collector work
    - peak bytes
  falsification_conditions:
  - Projected rowspaces coincide on the common base, or apparent gain disappears under correct sign/public-column
    transport.
  - Covers are equivalent under the declared base/cover automorphisms and a transported-control replay explains
    the gain.
  - Success requires changing E, atom variables or source policies between arms.
  confounders:
