idea:
  id: IDEA-20261027-0bbc32
  question_id: RQ-ECDLP-002
  title: Translated quadratic covers of the same E as a row-space control
  class: control
  status: proposed
  proposed_by: idea-generator
  novelty_status: adaptation
  claim: Known translated quadratic pullbacks test whether two different covers of the SAME E yield a strict stacked-rank
    increase on identical signed E atoms. Geometry and branch-support difference alone establish no rank or algorithmic
    advantage.
  mechanism: 'PAIR: R3 native cover witnesses with common E norm columns; Sigma is certified relation composition
    on common atoms. Class partial-action: rows add where witnesses exist, without full translation propagation.
    Projection loses deck/companion information; charge those witness fibres, not extra columns. For E:Y^2=f(U)=U^3+A*U+B
    and c=f(t) nonzero, C_t:y^2=x^6+3t*x^4+(3t^2+A)*x^2+c has pi_t=(x^2+t,y). Its complementary quotient is E''_t:V^2=W^3+(3t^2+A)*W^2+3t*c*W+c^2
    with W=c/x^2,V=c*y/x^3. Separable f and char not 2 give a smooth sextic. t=0 recovers the old cover. Distinct
    branch supports over E still require automorphism-equivalence checks. Compare admissible t=0,1 on the SAME signed
    E atoms liftable in both, with identical sources/anchors. Rebuild both baselines on this intersection: historical
    rank on a different base is not comparable. Stack only after exact signed common-column transport.'
  citations:
