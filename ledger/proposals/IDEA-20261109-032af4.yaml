      flat only above sqrt(p).
    verified_by: brief section 3 row text (file not opened in this session)
  - ref: IDEA-20260801-021
    provenance: internal
    claim: A degree-d algebraic predicate cuts at most 3d points; this record extends the barrier from
      degree to Kummer complexity.
    verified_by: brief section 2 index line (file not opened in this session)
  assumptions:
  - Toy curves have prime order and are not j = 0 or j = 1728.
  - For the mu_B arm, B divides p - 1 and 3 does not divide B.
  predictions:
  - metric: spectral ratio max |T| over sqrt(|F|) relative to random mean
    direction: within
    minimum_effect: between 0.7 and 1.5 for all three structured bases
  - metric: z-score of C_3(F) against |F|^3/N Poisson
    direction: within
    minimum_effect: absolute value at most 3
  - metric: max |T(xi)| compared with (4rd+2) sqrt(p)
    direction: lower
    minimum_effect: strictly below on every curve and base (theorem check)
  minimal_test:
    design: Choose 3 prime-order curves with p near 2^20 from crypto/docs/ECDLP_CALIBRATION_PRIMES.md
      such that p - 1 has a divisor B near 2^8 with 3 not dividing B. Build the exhaustive log table,
      the three structured bases of size near 2^8 and 20 random subsets. Compute T(xi) for all xi by FFT
      over Z/N, C_3(F) by sorting A + A against A. Report spectral ratios, C_3 z-scores and the theorem
      check.
    controls:
    - Random subsets of E(F_p) of the same size, 20 seeds.
    - Planted progression base as positive control for the spectrum.
    - Interval base as the known reference arm.
    required_metrics:
    - size of each base and its deviation from N/2^r or B
    - max |T(xi)| over xi not 0
    - random mean and standard deviation of the spectral ratio
    - C_3(F) and its Poisson z-score
    - theorem check flag per base
  falsification_conditions:
  - A structured base with spectral ratio above 3 times random on all 3 curves kills the heuristic reading
    and opens a structure lead.
  - Any |T(xi)| above (4rd+2) sqrt(p) means the constant or the code is wrong; the run is invalid until
    resolved.
  - A published bound certifying |F| for 2^r above sqrt(N) would falsify the barrier clause about sqrt(p).
  confounders:
  - Legendre patterns with correlated c_i (for example an arithmetic progression) can lower the effective
    r; choose c_i uniformly.
  - On j = 0 curves 3 dividing B forces lambda-closure and a 3-fold spectral symmetry (wave-1 known);
    excluded by construction.
  interpretation_limits:
  - The theorem bounds a spectrum; it does not price a solver.
  - A random-level spectrum at 2^20 is a heuristic indication only.
  heuristic_assumptions:
  - id: H1
    statement: Kummer-pattern bases of size below sqrt(p) have random-level spectrum and Poisson relation
      counts.
    rigorous_support: None below sqrt(p); the theorem is vacuous there by design.
    validation_plan: Exhaustive toy measurement as in the minimal test.
  target_complexity:
    time_exponent: N^{1/2} unchanged, delta 0
    memory_exponent: O(N) toy table only
    best_known: Pollard rho, Theta(N^{1/2}) (KR-RHO-13bf67)
    hidden_overhead: None; no algorithm is proposed.
    tradeoff_note: Barrier statement plus a measurement; no tradeoff defined.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  sota_delta: 'Exponent delta 0. New barrier family: Kummer complexity replaces algebraic degree, covering
    mu_B and Legendre-pattern bases in one bound.'
