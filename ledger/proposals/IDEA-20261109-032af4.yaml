idea:
  id: IDEA-20261109-032af4
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Conductor barrier for Kummer-pattern factor bases over F_p: r quadratic-residue conditions on
    x give a discrete-log spectrum at most (4rd+2) sqrt(p), so size and relation supply are certified
    only above sqrt(p), with a toy spectrum and relation-count measurement'
  class: barrier
  claim: 'Barrier (theorem modulo a constant check). Let E/F_p have prime order N, let g_1..g_r in F_p[x]
    have degree at most d, let chi be the Legendre symbol and let F = {P with chi(g_i(x(P))) = eps_i for
    all i}. Let T(xi) be the sum over P in F of e_N(xi log P). Then |F| = N/2^r + O((4rd+2) sqrt(p)) and
    |T(xi)| is at most (4rd+2) sqrt(p) for xi not 0. The mu_B base x^B = 1 is the case of the full character
    group trivial on mu_B and satisfies |T(xi)| at most 6 sqrt(p). Consequence: whenever |F| is at most
    sqrt(p), neither the size of F nor any relation-supply statement about F is certified by character
    sums, the same wall as for intervals and for degree-d algebraic predicates, with Kummer complexity
    r replacing degree. Families ruled out from rigor: every power-residue-pattern base at beta below
    1/2. Heuristic reading, to be measured: such bases are spectrally random. Measurement prediction at
    p near 2^20 with bases of size near 2^8 built as an interval, as mu_B with B dividing p-1 and 3 not
    dividing B, and as an r = 12 Legendre pattern with g_i = x + c_i: the ratio of max |T(xi)| over xi
    not 0 to sqrt(|F|) lies within 0.7 to 1.5 times the random-subset mean, and the relation count C_3(F)
    lies within 3 standard deviations of the Poisson value |F|^3/N. No exponent change is claimed.'
  mechanism: Expand 1_F = 2^{-r} times the product over i of (1 + eps_i chi(g_i(x))). Each of the 2^r
    - 1 nonconstant terms is a mixed sum over E(F_p) of a multiplicative character of the rational function
    G_S = product of g_i over i in S composed with x, which is ramified at most at 2rd points, times the
    Lang-torsor character P -> e_N(xi log P), which is an unramified rank-one sheaf on E. For xi not 0
    the tensor product is geometrically nontrivial, so Weil's theorem for curves (Bombieri's mixed-sum
    form, recalled) bounds each term by a constant times sqrt(p); the constant (4rd+2) is a safe bookkeeping
    value to be checked. Weighting 2^{-r} and summing gives the stated bound for all r at once, so increasing
    r shrinks the base without shrinking the error. On the algebraic side the predicate is encoded by
    z_i^2 = g_i(x), which adds (N/B)^m geometric solutions per target, at least B^{m-1} for every beta
    at most 1/2, so a solver that visits geometric solutions never beats enumeration on this base.
  novelty_status: adaptation
  citations:
