  sota_delta: 'Exponent delta 0. New statement: summation degree over any cover with automorphism symmetry
    is d^{m-1}/|G_f| >= 2^{m-2}, attained only by x; Y_m exists with degree 3^{m-2} and equal yield per
    unknown.'
