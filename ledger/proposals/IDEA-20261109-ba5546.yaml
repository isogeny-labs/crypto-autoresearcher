    verified_by: REPO BRIEF 2026-11-09 section 3 row text, file not opened in this session
  assumptions:
  - The definition of beta in KN-LIT-0a321c is deg lambda <= p^{n' beta} with the polynomial over F_{p^n}
    splitting completely in F_{p^n}, the next agent must confirm this from the source.
  - Lucas's theorem over F_p, no heuristic.
  predictions:
  - metric: dimension of ker (tau - 1)^k in F_{p^{p^m}}
    direction: different
    minimum_effect: equals k exactly for every tested (p, m, k)
  - metric: second-highest exponent of the subspace polynomial
    direction: different
    minimum_effect: equals p to the power (k - p^v) exactly
  - metric: number of nonzero terms
    direction: different
    minimum_effect: equals the product of (k_i + 1) exactly
  minimal_test:
    design: Sage, construct F_{p^{p^m}} for (p, m) in {(3,1), (3,2), (5,1), (7,1)}, compute ker (tau -
      1)^k as an F_p-matrix kernel for all k, expand (tau - 1)^k symbolically, compare dimension, support
      and exponents with the closed forms. Then read KN-LIT-0a321c and KN-LIT-4fe9d2 through the knowledge
      index and evaluate the row's cost formula at each (beta, n'/n) in the table.
    controls:
    - Random k-dimensional subspaces of the same field, their subspace polynomials should be dense, all
      exponents present.
    - The subfield polynomial c = 1 as the beta = 0 anchor.
    required_metrics:
    - dimension table
    - support and second exponent table
    - beta and n'/n per k
    - cost exponent from the source formula per pair
  falsification_conditions:
  - Any (p, m, k) with dimension not k or support not the Lucas set, then the derivation is wrong.
  - The sources define beta or n'/n so that the pair (1/2, 2/p) is excluded, then the record reduces to
    a row-text correction request.
  confounders:
  - The useful regime for decomposition needs n/n' integral or near it, the pairs here have n/n' = p/c
    which is integral only for c dividing p, that is c = 1.
  interpretation_limits:
  - Nothing here touches E/F_p, the ambient field has degree p^m over F_p and the N-part of a base-changed
    prime-field curve sits in E(F_p), transfer-wave ascent null control.
  - Small-characteristic extension-field curves are the only possible beneficiaries, and even there the
    exponent reading waits on the source formula.
  heuristic_assumptions:
  - id: H1
    statement: The row's bound beta >= 3/4 carries an unquoted hypothesis.
    rigorous_support: The pair (1/2, 2/p) is a theorem for the explicit family, so either the hypothesis
      exists or the row is misquoted.
    validation_plan: Open the two KN-LIT sources named in the row and quote the hypothesis into the record's
      notes.
  target_complexity:
    time_exponent: ECDLP over F_p exponent 1/2 unchanged, extension-field exponent to be evaluated from
      the source formula
    memory_exponent: O(p^m) field elements for the toy verification
    best_known: KR-IC-49c882, quasi-subfield framework with no useful family known, KR-IC-46d822 for the
      subfield case
    hidden_overhead: none for the verification
    tradeoff_note: No tradeoff proposed.
