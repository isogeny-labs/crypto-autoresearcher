idea:
  id: IDEA-20261109-ba5546
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Carlitz T^k-torsion of phi_T = tau - 1 is the Artin-Schreier-Witt filtration of F_{p^{p^m}},
    a linearised complete splitter with beta = 1 - p^v/k by Lucas, and the (beta, n'/n) table it produces
    must be reconciled with KR-IC-49c882
  class: factor_base
  claim: Over F_p let tau be the p-power Frobenius and phi_T = tau - 1. For p^{m-1} < k <= p^m the T^k-torsion
    V_k = ker (tau - 1)^k is a k-dimensional F_p-subspace of F_{p^{p^m}}, since x^{p^m} - 1 = (x - 1)^{p^m}
    and F_{p^{p^m}} is a cyclic F_p[tau]-module. Its subspace polynomial is (tau - 1)^k = prod_i (tau^{p^i}
    - 1)^{k_i} over the p-adic digits k_i of k, with prod (k_i + 1) nonzero terms and second-highest exponent
    p^{k - p^v}, v the lowest nonzero digit position. As a linearised complete splitter X^{p^{n'}} - lambda(X)
    over F_{p^n} it has n' = k, n = p^m, beta = 1 - p^v / k. For k = c p^{m-1}, 1 <= c <= p - 1, the pair
    is (beta, n'/n) = (1 - 1/c, c/p), c = 1 being the subfield polynomial. Predictions, complete splitting
    and dimensions verified at (p, m) in {(3,1), (3,2), (5,1), (7,1)}, and the pair (1/2, 2/p) for odd
    p is either admitted by the definition in the KR-IC-49c882 sources, in which case the row text needs
    a stated hypothesis, or excluded by an explicit condition, which the row should then quote. For prime-field
    ECDLP the family is void, n = 1 gives only V_1 = F_p.
  mechanism: The Carlitz module over the constant field commutes with Frobenius, so its torsion is the
    unipotent filtration of tau. Lucas's theorem turns the digit pattern of k into the monomial support,
    so sparsity and splitting field are both closed forms. The quasi-subfield question of KR-IC-49c882
    asks for sparse linearised polynomials that split completely, this family is the canonical one and
    its parameter table can be read off without computation.
  novelty_status: adaptation
