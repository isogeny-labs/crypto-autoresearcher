  title: >-
    Detection vs exploitation race for a narrowed ExpandMask: can a public auditor spot it
    before an attacker recovers s1?
  class: measurement
  claim: >-
    If ExpandMask samples y from [-gamma1/2, gamma1/2] (one bit short), every signature verifies
    and no rejection fires, yet z = y + c s1 has support shifted by c s1 so per-coordinate
    extremes reveal (c s1)_j. A public chi-square test on z coefficients detects the defect
    with about 30 signatures at 99 percent power, while exact s1 recovery from extremes needs
    on the order of 10^3 signatures at ML-DSA-44; the ratio N_recover / N_detect >= 20 at
    all three parameter sets.
  mechanism: >-
    Verifier only bounds z, so a narrower mask passes. The auditor sees z coefficient histograms
    that are uniform on a half-width box: a gross deviation from the honest uniform on [-(gamma1
    - beta), gamma1 - beta]. The attacker needs, per key, enough samples that edge coordinates
    pin each u_j, which is slower. The race tells whether public monitoring can catch such
    defects in time.
  tracked_object: N_detect (public statistic) and N_recover (attacker) for the same defective
    signer
