  title: >-
    Repudiable keys by rho grinding: cost law q^{k-l+1}/256 for a rank-deficient NTT slot
    of A, and its honest frequency
  class: measurement
  claim: >-
    The probability that a uniformly expanded k x l slot matrix over F_q is rank-deficient
    is about q^{-(k-l+1)}; at true q = 8380417 and k = l = 4 that is 2^-23 per slot, 2^-15
    per key over 256 slots. A key owner grinding rho finds a key with a rank-deficient slot
    in about 2^15 ExpandA calls at ML-DSA-44 shape (k = l), and whether such keys give any
    forgery advantage is tested rather than assumed. Measured median grind cost within factor
    2 of 1/(256 q^{-(k-l+1)}), and the honest-key rate of degenerate slots matches the same
    law.
  mechanism: >-
    For k = l (ML-DSA-44), square slot matrices are singular with probability about 1/q, so
    over 256 slots and modest grinding, singular slots are common enough to appear in honest
    keys too (about 2^-15 per key). A verifier cannot cheaply know whether the owner chose
    rho to create this. Whether a singular slot gives a usable advantage is tested by the
    forger measuring success of slot-local SIS against such keys vs honest ones.
  tracked_object: grind cost to a singular slot, honest-key singular-slot frequency, and forgery
    advantage
