    proof_obligations: []
  predictions:
  - metric: analytic rank minus number of independent sections found
    direction: different
    minimum_effect: equals 0 on at least 95 percent of surfaces
  - metric: max |c_i| over all primitive relations divided by (4 sqrt(r))^r d_T
    direction: lower
    minimum_effect: at most 1 on 100 percent of surfaces
  - metric: fraction of random targets k recovered by specialised relations
    direction: lower
    minimum_effect: at most 2 (4 sqrt(r))^{2r} d_T^2 / N
  minimal_test:
    design: For p in crypto/docs/ECDLP_CALIBRATION_PRIMES.md with p <= 2^10, sample 200 Weierstrass K3
      models whose Kodaira fibres contribute root-lattice rank >= 16 (verified by Tate's algorithm in
      Sage). Count points over F_p and F_{p^2} fibre by fibre, obtain the degree <= 4 non-trivial factor
      of the zeta function using the functional equation, and read the rank. Enumerate polynomial sections
      with deg x <= 4, deg y <= 6 by linear algebra, compute the height Gram matrix, extract primitive
      relations and their max |c_i|. For 10^3 uniformly random (P, Q, k) on a smooth fibre, construct
      two sections through (t_0, P) and (t_0, Q) when possible and record whether any specialised relation
      yields k.
    controls:
    - Rational-surface arm (deg a <= 4, deg b <= 6) reproducing the XEDN norm-1 observation.
    - 'Random-Gram control: random integer Gram matrices with the same entry bounds, to show the coefficient
      bound is lattice-generic.'
    required_metrics:
    - p
    - analytic rank per surface
    - sections found per surface
    - max |c_i| per relation
    - d_T per surface
    - recovered-k fraction
  falsification_conditions:
  - A primitive relation with max |c_i| above (4 sqrt(r))^r d_T.
  - Analytic rank below the number of independent sections found.
  - Recovered-k fraction exceeding the stated bound by a factor 10.
  confounders:
  - Sections meeting O have larger height; restrict or recompute the bound with P.O.
  - Non-reduced or inseparable fibres at small p; discard those models.
  interpretation_limits:
  - Confirms a reach bound at p <= 2^10; proves no new hardness.
  - Does not address non-polynomial sections of larger height, whose bound grows with height.
  heuristic_assumptions:
  - id: H1
    statement: Sections through prescribed points exist with density independent of k.
    rigorous_support: None; counting argument only.
    validation_plan: Record construction success rate versus k in the test.
  target_complexity:
    time_exponent: N^{1/2} unchanged; reach fraction at most 2^{-56} at 256 bits
    memory_exponent: O(p^2) fibre counts in the toy test
    best_known: Pollard rho, Theta(sqrt(N)) (KR-RHO-13bf67)
    hidden_overhead: None claimed.
    tradeoff_note: Barrier record.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  dominated_by: KR-IC-cd159a for lifting; XEDN records for rational surfaces. The chi = 2 bound and the
    analytic-rank check are not stated in either.
