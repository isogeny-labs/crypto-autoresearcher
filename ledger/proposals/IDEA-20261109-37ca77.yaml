idea:
  id: IDEA-20261109-37ca77
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'K3 elliptic surfaces over F_p(t): analytic rank from the zeta function is computable, but Shioda
    height bounds cap relation coefficients, so specialisation recovers k only on a set of size (4 sqrt(r))^{2r}
    d_T^2'
  class: barrier
  claim: Let S be y^2 = x^3 + a(t) x + b(t) over F_p with deg a <= 8, deg b <= 12 and Euler characteristic
    chi = 2. (i) The Mordell-Weil rank r over F_p(t) equals the order of vanishing of L(S/F_p(t), T) at
    T = 1/p, computable from point counts over F_{p^i}, i <= 2, once the bad-fibre root lattices contribute
    rank >= 16. (ii) Every section with polynomial coordinates of t-degree <= 4 in x has canonical height
    <= 2 chi = 4, so any primitive Z-relation among r + 1 such sections has |c_i| <= (4 sqrt(r))^r d_T
    where d_T is the discriminant of the trivial lattice. (iii) Specialising a relation supported on sections
    through (t_0, P) and (t_0, Q) yields k = -c_1 / c_2 mod N, so the set of recoverable k has size at
    most (2 (4 sqrt(r))^r d_T)^2, below 2^{200} for r <= 20 and d_T <= 2^{10}, a fraction 2^{-56} of Z/N
    at 256 bits. No exponent change is claimed.
  mechanism: The L-function of the generic fibre is the characteristic polynomial of Frobenius on the
    transcendental plus Mordell-Weil part of H^2(S); Tate's conjecture for K3 surfaces over finite fields
    identifies its zero at T = 1/p with the Neron-Severi rank. The analytic object knows how many independent
    sections exist, but the height pairing is positive definite with bounded entries, and Hadamard's inequality
    on the cofactors of the Gram matrix bounds relation coefficients. The XEDN lane found only norm-1
    relations on rational surfaces; chi = 2 is the first case where the L-function is non-trivial, and
    the bound shows the DL-reach stays polynomially small.
  novelty_status: adaptation
  citations:
  - ref: IDEA-20260805-5a9d2c
    provenance: internal
    claim: Every XEDN Mordell-Weil relation had support 3 or 4 and infinity-norm exactly 1; this record
      explains the small norm by a height bound and extends it to chi = 2.
    verified_by: ledger index excerpt in REPO BRIEF 2026-11-09 section 2
  - ref: IDEA-20260805-e5dd09
    provenance: internal
    claim: Rank of the rational family is determined by root multiplicities; for K3 the L-function carries
      the extra information.
    verified_by: ledger index excerpt in REPO BRIEF 2026-11-09 section 2
  - ref: KR-IC-cd159a
    provenance: internal
    claim: Lifting to a larger base and looking for dependence is the xedni family.
    verified_by: frontier map excerpt in REPO BRIEF 2026-11-09 section 3
  assumptions:
  - Tate conjecture for K3 surfaces over finite fields (Charles, Madapusi-Pera; recalled) so analytic
    rank equals algebraic rank.
  - Shioda height formula with sections meeting O nowhere (recalled).
  proof_search_map:
    not_applicable_reason: Barrier with a measured constant; no algorithm.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
