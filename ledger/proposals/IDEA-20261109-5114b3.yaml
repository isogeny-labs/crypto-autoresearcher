    compute: low
  recommended_priority: low
  dominated_by: The barriers-wave hybrid-sum record for the regime; RECORD A for the functorial case.
    The Prym statistic is the addition.
  sota_delta: exponent delta 0; one more pre-registered flatness probe in the Weil-uncovered regime.
