  title: >-
    Subfield norm attack vs direct dense-sublattice reduction at n=64..256: does NTRU Prime's
    lack of subfields buy any distance?
  class: measurement
  claim: >-
    KN-LIT-113 reports that the mechanism is the dense sublattice, not subfields. Claim: on
    x^n + 1 at fixed BKZ block size, the minimal q for certified recovery by direct reduction
    is lower than by the subfield norm attack (KN-LIT-112) to every proper subfield, with
    log q_sub / log q_dsd >= 1.05 in every (n, beta) cell. Then the subfield-free design of
    x^p - x - 1 removes only a dominated attack and contributes zero fatigue distance by this
    route. Falsified if the subfield attack succeeds at lower q in any cell.
  mechanism: >-
    Norming to an index-k subfield raises secret norm to the k-th power while dividing dimension
    by k; it helps only when q grows faster than that norm. Direct reduction exploits the
    full dense sublattice without paying norm growth, so it should dominate.
  tracked_object: Minimal log2 q for 50% certified recovery per attack, n and beta.
