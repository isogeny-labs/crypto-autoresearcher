  minimal_test:
    design: >-
      Run G6K bgj1 and bdgl sieves to saturation on random q-ary (Kyber-shape) lattices of
      d in {60,65,...,90}, 5 instances each; record instrumented DB reads and, for d <= 75,
      cachegrind LL misses; fit slopes.
    controls:
    - >-
      null: same sieves with the database artificially capped below LLC size (forced cache
      residency) - slope must be ~0
    - >-
      positive: Gauss sieve (list-based, uniform access) where bytes per test growth is known
      to be large
    - 'A/A: bgj1 at each d with two database-seed blocks'
  falsification_conditions:
