  title: >-
    Measured approximation-factor crossover between the Stickelberger quantum Ideal-SVP pipeline
    and BKZ at small cyclotomic conductors
  class: measurement
  claim: >-
    The Cramer-Ducas-Wesolowski pipeline (KN-LIT-116) solves Ideal-SVP at approximation factor
    exp(O~(sqrt n)) given a quantum class-group/PIP oracle. Simulated classically at prime-power
    conductors with phi(m) in {16..64} (class group and PIP via PARI), the achieved approximation
    factor exceeds the factor BKZ-20 achieves on the same ideal lattices at every tested n,
    so the crossover dimension n* where the quantum pipeline wins is above 64; the fitted
    crossover extrapolates to n* in a stated range with CI.
  mechanism: >-
    The structural advantage in the ideal-lattice regime is asymptotic; deployed parameters
    live at small gamma. Measuring both gamma curves at small n and fitting the crossover
    turns the quantifier separation (large gamma vs small gamma) into a number. The structure-removed
    control is a random lattice of the same determinant and dimension, where only BKZ applies.
  tracked_object: >-
    Ratio gamma_CDW(n) / gamma_BKZ20(n) on random ideals of cyclotomic fields, and the fitted
    crossover n*.
