idea:
  id: IDEA-20261109-6a9a3d
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Gowers U^3 uniformity of the discrete-log image of coordinate-defined factor bases, against random
    and planted quadratic-Bohr controls
  class: barrier
  claim: 'Toy measurement, prediction fixed before any run. For prime-order toy curves with N at most
    2^16 and bases F_beta = {P in E(F_p) with x(P) < p^beta}, beta in {0.3, 0.4, 0.5, 0.6}, let A be the
    set of discrete logs of F_beta from one exhaustive table and f = 1_A - |A|/N on Z/N. Prediction 1:
    the U^3 statistic ||f||_{U^3}^8 lies within 3 standard deviations of the mean over 20 uniformly random
    subsets of Z/N of size |A|, for every beta and for 5 curves. Prediction 2: the planted set A_Q = {k
    with ||q k^2/N|| < |A|/(2N)} exceeds the random mean by a factor at least 10 while its U^2 statistic
    stays within 2 times the random mean. Reading: the log image carries no complexity-2 (quadratic) structure
    beyond the U^2 content already filed, so no base selection or structured elimination keyed to quadratic
    phases or 4-term progressions of logs has a signal at these sizes. No exponent change is claimed.'
  mechanism: 'U^2 is the maximal Fourier coefficient and controls counts of single relations. U^3 controls
    complexity-2 linear systems: 4-term progressions of logs, which are chained midpoint relations P1
    + P3 = 2 P2 and P2 + P4 = 2 P3, and the 3-dimensional parallelepiped counts that decide how many relations
    share two base points, i.e. short cycles in the relation hypergraph that produce dependencies in the
    relation matrix. By the inverse theorem for U^3 (Green and Tao, recalled), a large U^3 norm is equivalent
    to correlation with a quadratic phase or a 2-step nilsequence. The statistic is computed as ||f||_{U^3}^8
    = E_h ||Delta_h f||_{U^2}^4 with one FFT per shift h, about N^2 log N operations. A Weil-type certificate
    would need eight-character sums over E^4 and, with the hybrid-sum bound 2 sqrt(p) log p, would be
    nontrivial only near beta = 3/4, so exhaustive measurement is the only instrument below.'
  novelty_status: adaptation
  citations:
  - ref: KR-RHO-13bf67
    provenance: internal
    claim: Generic lower bound Omega(sqrt N); exponent delta here is 0.
    verified_by: brief section 3 row text (file not opened in this session)
  - ref: KR-IC-5931ee
    provenance: internal
    claim: Naive prime-field Semaev index calculus cannot beat generic methods under statistical assumptions
      that are first-moment (complexity-1) statements; U^3 is a complexity-2 statement.
    verified_by: brief section 3 row text (file not opened in this session)
  - ref: KR-RHO-0528e7
    provenance: internal
    claim: Automorphism orbits are the only known spectral structure of a coordinate base; on j = 0 they
      force 3-fold spectral symmetry.
    verified_by: brief section 3 row text (file not opened in this session)
  assumptions:
  - The toy curves have prime order so the log table is a bijection with Z/N.
  - The U^3 statistic is computed from the balanced function f, not from the raw indicator, so density
    alone cannot inflate it.
  predictions:
  - metric: z-score of U3 statistic against 20 random subsets
    direction: within
    minimum_effect: absolute value at most 3 at every beta and curve
  - metric: ratio of planted quadratic set U3 statistic to random mean
    direction: higher
    minimum_effect: at least 10
  - metric: ratio of planted quadratic set U2 statistic to random mean
    direction: within
    minimum_effect: at most 2
  minimal_test:
    design: Pick 5 prime-order curves with p at most 2^16 from crypto/docs/ECDLP_CALIBRATION_PRIMES.md
      (read the file for the list), excluding j = 0 and j = 1728. Enumerate kP for all k, build A for
      each beta, compute the U^2 and U^3 statistics of f by FFT. Generate 20 random subsets per (curve,
      beta) with recorded seeds, the planted quadratic set A_Q with q random, and a planted progression.
      Report z-scores.
    controls:
    - Uniformly random subsets of Z/N of the same size, 20 seeds.
    - Planted quadratic Bohr set A_Q (large U3, random U2).
    - Planted progression (large U2 and U3) as instrument check.
    - j = 0 curves excluded or reported in a separate arm.
    required_metrics:
    - U3 statistic of f
    - U2 statistic (maximal Fourier coefficient) of f
    - random mean and standard deviation per (curve, beta)
    - z-scores for F_beta
    - ratios for both planted controls
  falsification_conditions:
  - z-score above 3 at two or more beta values on three or more curves kills the null reading and opens
    a structure lead.
  - Planted quadratic set not detected at factor 10 makes the run invalid as an instrument, not a result.
  - A timeout or memory failure is infrastructure, not evidence.
  confounders:
  - Small N inflates variance of the random reference; report standard deviations, not only means.
  - Degenerate parallelepipeds (a zero shift) contribute to every set alike; they are included identically
    in test and controls.
  interpretation_limits:
  - A null at N = 2^16 is not a proof of uniformity at 256 bits.
  - A positive would be a toy-size signal with no exponent attached.
  heuristic_assumptions:
  - id: H1
    statement: The log image of a coordinate-defined base is U^3-uniform at the level of a random subset
      of the same size.
    rigorous_support: None below beta about 3/4; the eight-character Weil estimate is trivial for smaller
      bases.
    validation_plan: Exhaustive computation at N up to 2^16 with the stated controls.
  target_complexity:
    time_exponent: N^{1/2} unchanged, delta 0
    memory_exponent: O(N) for the toy table only
    best_known: Pollard rho, Theta(N^{1/2}) group operations (KR-RHO-13bf67)
    hidden_overhead: None; no algorithm is proposed.
    tradeoff_note: Measurement only; no time-memory tradeoff is defined.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: KR-RHO-13bf67 dominates any exponent reading. The wave-1 spectral norm record covers the
    U^2 statistic; this record adds the U^3 statistic.
  sota_delta: Exponent delta 0. Adds the first complexity-2 uniformity statistic of a prime-field factor
    base, with calibrated positive controls.
