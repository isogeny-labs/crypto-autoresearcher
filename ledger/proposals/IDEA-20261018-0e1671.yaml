  title: >-
    Measured noise growth of the Albrecht-Deo RLWE self-reduction chain against its proven
    bound, and the gamma regime it lands in
  class: measurement
  claim: >-
    Albrecht-Deo (KN-LIT-4628) give an RLWE self-reduction that halves ring dimension and
    squares the modulus with a stated error-rate increase. Iterated k times at n=256 down
    to 32 on toy instances, the measured error rate grows by a factor at least 4x smaller
    than the proven worst-case bound per step, but the resulting low-dimension instance still
    sits at an approximation factor at least 2^10 below the regime where ideal-lattice quantum
    algorithms (gamma = exp(O~(sqrt n))) apply.
  mechanism: >-
    Dimension-reducing reductions are the only known way to move structured instances toward
    small n where structure-dependent quantum results bite. Proven bounds are worst-case;
    measured growth tells whether the chain is tighter in practice. Comparing the landed alpha
    against the gamma at which known quantum ideal methods operate makes the quantifier gap
    a measured number per step.
  tracked_object: >-
    Empirical standard deviation of error after each halving step divided by q at that step,
    versus the proven bound, and the implied gamma.
