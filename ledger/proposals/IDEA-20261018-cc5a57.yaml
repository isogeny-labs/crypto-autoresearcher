  minimal_test:
    design: >-
      Planted centre-bias defect at delta in {1e-2, 1e-1}; PyTorch surrogate likelihood; 20
      restarts; compare with second- and fourth-moment learners.
    controls:
    - 'null: delta = 0 (MLE angle distribution must match random)'
    - 'positive: delta = 0.3'
    - 'A/A: same arm with two initialisation-seed blocks'
  falsification_conditions:
