  predictions:
  - id: P1
    metric: mean beta*(F=0) - beta*(F=4)
    direction: higher
    minimum_effect: '>= 8 block-size units at n=64,k=2'
    falsified_by: drop below the AA1 noise floor or below 4 units
  - id: P2
    metric: '|beta*_measured - beta*_DDGR_predicted| at F in {1,2,4,8}'
    direction: lower
    minimum_effect: <= 3 units at every F
    falsified_by: any F with absolute miss > 5 units
  - id: P3
    metric: beta* drop for non-failure hints (null arm)
    direction: lower
    minimum_effect: <= 1 unit at matched hint count
    falsified_by: null arm drop >= 3 units, meaning the pipeline leaks secret information
  minimal_test:
    design: >-
      Generate 30 reduced ML-KEM keys (n=64,k=2,q=3329,eta1=eta2=3 to make failures reachable).
      For each, harvest F in {0,1,2,4,8} failing ciphertexts from honestly generated encapsulations
      filtered by ||(r,e1)|| (simulated oracle using the self-generated secret key). Integrate
      the failures as approximate hints with the leaky-LWE-estimator framework, build the
      reduced embedding, and run G6K progressive pumps until the secret verifies; record beta*.
    controls:
    - >-
      null: integrate the same number of NON-failing ciphertexts (true but weak conditioning)
      of matched ||(r,e1)||; predicted drop ~0
    - >-
      positive: integrate F perfect hints <(s,e),c> = exact value along the same directions;
      DDGR predicts ~1 dimension per hint and the pipeline must reproduce it
    - >-
      A/A: the no-hint arm run twice on the same instances with different BKZ randomization
      seed blocks
  falsification_conditions:
  - 'P1 fails: failure-hint arm beta* within noise of the no-hint arm at F=4'
  - >-
    positive control fails to show >= 0.7 dimension per perfect hint (pipeline broken; the
    batch is invalid, not negative)
  - null arm shows a material drop (leakage in the harness)
  confounders:
  - eta raised to 3 changes the failure geometry relative to FIPS eta2=2
  - >-
    the filtered ciphertext population has larger ||(r,e1)||, changing the hint directions'
    norms
  - progressive BKZ success is stochastic; per-instance variance can mask small effects
  interpretation_limits:
  - >-
    Reduced n=64 and raised eta: the result is a calibration of the hint-integration step,
    not an ML-KEM failure attack cost; at FIPS 203 the dominant cost remains finding the first
    failure (2^100+ queries by published DFR), which this test does not touch
  - Simulated oracle only; no implementation or deployed key is queried
  heuristic_assumptions:
  - id: H1
    statement: >-
      The posterior of <(s,e),c> conditioned on failure is well approximated by a truncated
      Gaussian.
    rigorous_support: CLT over n*k CBD terms; DDGR use the same approximation for approximate
      hints.
    validation_plan: >-
      Compare empirical conditioned moments from 10^6 simulated failures at n=64 against the
      truncated-Gaussian moments (KS test).
  - id: H2
    statement: Failures from different ciphertexts give nearly independent directions.
    rigorous_support: Random r,e1 directions are nearly orthogonal in dimension 2kn.
    validation_plan: Report the Gram matrix of the F normalized directions; max off-diagonal
      |cos| logged.
