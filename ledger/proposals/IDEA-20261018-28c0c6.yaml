  title: >-
    Ablate each Verify check: which FIPS 204 verifier predicates are load-bearing, by the
    cost of a key-less forgery per ablation
  class: control
  claim: >-
    For each Algorithm 8 check (z-norm bound, hint count <= omega, hint encoding canonicity,
    c_tilde full-length comparison), a verifier missing exactly that check admits a key-less
    forgery whose cost is: z-norm dropped, polynomial (solve A z = w + c t1 2^d by linear
    algebra); c_tilde compared on only b bits, 2^b hash trials; hint-count dropped, still
    SelfTargetMSIS-hard (no measured forgery in 2^32 trials); canonicity dropped, malleability
    only, no forgery. Each predicted cost is confirmed by an actual forgery or bounded by
    a null result at real ML-DSA-44.
  mechanism: >-
    Prior lane work ablates signer checks and counts accept fibres; the mirror question asks
    what each verifier predicate protects. Dropping the z bound removes shortness so SIS becomes
    linear algebra; truncated comparison turns the hash binding into a b-bit search; the hint
    count limits malleability but forgery still needs short z.
  tracked_object: key-less forgery cost against each single-check-ablated verifier
