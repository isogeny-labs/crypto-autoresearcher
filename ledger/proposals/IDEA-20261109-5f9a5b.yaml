idea:
  id: IDEA-20261109-5f9a5b
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-9d5d44
  title: X25519 ladder with two one-way selects per step instead of two conditional swaps, from the argument
    symmetry of differential addition
  class: algorithm
  claim: Curve $v^2 = u^3 + A u^2 + u$, $A = 486662$, $B = 1$, $a_{24} = (A-2)/4 = 121665$, $p = 2^{255}-19$.
    Keep slot 0 $(U_0:W_0)$ = last doubling output and slot 1 $(U_1:W_1)$ = last differential-addition
    output, initialised to $(1:0)$ and $(x_1:1)$, with $k_{255} := 0$. For $t = 254,\dots,0$ let $\sigma_t
    = k_t \oplus k_{t+1}$ and compute $A_0 = U_0+W_0$, $B_0 = U_0-W_0$, $A_1 = U_1+W_1$, $B_1 = U_1-W_1$,
    $m_1 = B_1 A_0$, $m_2 = A_1 B_0$, $U_1' = (m_1+m_2)^2$, $W_1' = x_1 (m_1-m_2)^2$, $A = A_0 + \sigma_t
    (A_1-A_0)$, $B = B_0 + \sigma_t (B_1-B_0)$, $AA = A^2$, $BB = B^2$, $E = AA-BB$, $U_0' = AA \cdot
    BB$, $W_0' = E (AA + a_{24} E)$. The result is $U_{k_0}/W_{k_0}$, slot 0 for every clamped scalar.
    Claim 1. The output equals ladder() in src/ecc/x25519.rs byte for byte for every scalar and every
    32-byte u, low-order and twist inputs included. Claim 2. Cost per step is 5M + 4S + 1c + 8a plus 2
    bit-multiplications and 4a with 2 field elements written; the arithmetic conditional swap needs 2
    bit-multiplications and 6a with 4 elements written. The saving is 2a and two masked writes per step,
    510a over 255 steps. M and S are unchanged and no M or S speedup is claimed.
  mechanism: Differential addition is symmetric in its two point arguments. Exchanging $(A_0,B_0)$ with
    $(A_1,B_1)$ exchanges $m_1$ and $m_2$, so $m_1+m_2$ is fixed and $m_1-m_2$ changes sign before it
    is squared. Only the doubling needs to know which slot holds which multiple. Invariant. After bit
    $k_t$ the smaller multiple $jP$ sits in slot $k_t$ and $(j+1)P$ in the other, because the doubled
    point always lands in slot 0. The next step doubles $jP$ when $k_{t-1}=0$ and $(j+1)P$ otherwise,
    which is slot $k_t \oplus k_{t-1}$. The step is branch-free, reads each scalar bit once in a fixed
    order and uses no table. Exceptional behaviour is that of the RFC step. The doubling is correct on
    $(1:0)$ and $(0:1)$; the addition needs $x_1 \notin \{0,\infty\}$; $u = 0$ degenerates to $(0:0)$
    and returns 0.
  novelty_status: unverified
  citations:
  - ref: aburan28/crypto src/ecc/x25519.rs ladder()
    provenance: internal
    claim: The current step is 10 fe_mul calls (5M + 4S + 1c) and 8 additions with a branch on s == 1.
    verified_by: idea-generator session 2026-11-09 read the excerpt in BRIEF section 1, not the file itself
  - ref: RFC 7748 section 5
    provenance: recalled
    claim: Source of the baseline step and of cswap. Pointer only.
    verified_by: null
  assumptions:
  - fe_add, fe_sub, fe_mul return canonical residues, as the excerpt implies.
  - The bit-multiplication is written as a field multiply by 0 or 1 in BigUint. This removes the branch,
    not the variable-time arithmetic.
  predictions:
  - metric: bytewise mismatches against ladder() on the test set
    direction: lower
    minimum_effect: exactly 0, any mismatch falsifies
  - metric: additions per step spent on slot handling
    direction: lower
    minimum_effect: 4 against 6 for the arithmetic swap
  minimal_test:
    design: Add ladder_select() beside ladder(). Rust test ladder_select_matches_reference compares both
      on the RFC 7748 section 5.2 vectors, 10000 random scalar and u pairs with a fixed seed, unclamped
      scalars with k_0 = 1, and the low-order u values 0, 1, p-1 and the two order-8 values. Count calls
      with a wrapper.
    controls:
    - Mutation with the select on (A_0,B_0) only when sigma = 1 inverted; must fail the comparison.
    - Mutation that swaps m_1 and m_2; must still pass, showing the symmetry is what is used.
    required_metrics:
    - mismatches
    - fe_mul calls per step
    - fe_add and fe_sub calls per step
    - bit-multiplications per step
  falsification_conditions:
  - Any byte mismatch against ladder() on a valid run.
  - A measured slot-handling count above 2 bit-multiplications and 4a.
  - A build failure or timeout is infrastructure, not falsification.
  confounders:
  - BigUint multiply by zero is fast-pathed, so wall time can differ by bit value in both variants. Wall
    time is not a metric here.
  interpretation_limits:
  - Branch-free source is not constant time. No side-channel claim is made for the BigUint field.
  - The count is in field operations, not machine cost.
  heuristic_assumptions:
  - id: H1
    statement: A masked one-way select costs no more than half a masked swap in a fixed-limb field type.
    rigorous_support: Counted in field operations only (2a against 3a per pair of elements). No limb-level
      measurement exists.
    validation_plan: Count limb operations once a fixed-limb field type exists.
  target_complexity:
    time_exponent: not applicable, constant-factor formula count
    memory_exponent: not applicable, 4 field elements of state as today
    best_known: RFC 7748 step, 5M + 4S + 1c + 8a plus cswap
    hidden_overhead: one extra temporary pair for the selected (A, B)
    tradeoff_note: none, same state size and same M and S
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: Nothing in the BRIEF. Equal to the RFC 7748 ladder in M and S; the delta is in additions
    and writes only.
  sota_delta: 0M, 0S, minus 2a and minus 2 masked element writes per bit against the arithmetic conditional
    swap; removes the secret-dependent branch present in the repository today.
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: Curve25519 explicit-formula campaign; an implementation formula, not an ECDLP
      mechanism.
    none_found_after:
    - BRIEF section 2 ledger index, searched for ladder, swap, select
    - BRIEF section 1 excerpts of x25519.rs and ed25519.rs
