idea:
  id: IDEA-20261024-5bbcda
  title: >-
    Writability floor for the expanded reduced binary-digit presentation of
    prime-field Semaev systems, from the uniqueness of multilinear representations
  class: control
  question_id: RQ-ECDLP-361f3a
  claim: >-
    R1 representation, relation-decomposition stage. For the d = 2 digit
    presentation (rows mu*S~ in the squarefree ring), a solver reading S~ in the
    0/1 monomial basis pays |supp S~| per attempt. Floor A: the part of block
    degree (K,...,K), K = 2^(m-1), has exactly C(s, K)^m nonzero terms if p > K
    and H1. Model margins over rho: +29.4/+31.2/+34.3/+32.7 bits at log2 p =
    128/256/384/521 (H2; H3 at high m). Floor A + H2 alone closes m <= 4 (128),
    m <= 5 (256), m <= 6 (384, 521); m = 5 at 128 bits is undecided (+1.1).
    Rigorous only at m <= 4. Gain 0 (closure).
  mechanism: >-
    Pair: base-2 digits of the abscissae as ms auxiliary F_p variables with
    d^2 = d (R1); Sigma = translation by factor-base points (Class I,
    partial-action). Moebius inversion makes the 0/1 multilinear form of
    d -> S_{m+1}(x(d), x_R) unique, so its support belongs to the function.
    Block-degree-K monomials come only from c*prod x_i^K, coefficient
    c*K!*prod 2^j. Zeroing digits keeps exactly the avoiding monomials, so a
    subcube support is a certified lower bound. Cost per cell: attempts*|supp|
    + m(2^s/2)^2 (H2), solver free. A cost floor on one presentation, not an
    escape of SO-ALGFB; unexpanded and chained digit systems stay open.
  novelty_status: adaptation
  citations:
    - ref: Nisan-Szegedy, Computational Complexity 4 (1994) 301-313
      provenance: retrieved
      claim: p. 302, unique multilinear representation; 0/1 and +-1 forms differ in sparsity
      verified_by: scout-query-communication agent, lead-discovery 2026-10-24 (read the source); p. 302 read by the QC2 gate agent
    - ref: EV-PFDR-f71d7f
      provenance: internal
      claim: O-3, top part has binom(s, 2^(m-1))^m terms = 2^221.3 at (256, m 5)
      verified_by: QC2 gate agent, lead-discovery 2026-10-24
    - ref: KN-OPEN-02200b
      provenance: internal
      claim: H-TOP holds at m = 2, 3, 4; open at m >= 5
      verified_by: QC2 gate agent, lead-discovery 2026-10-24
    - ref: EV-PFDR-1394a4
      provenance: internal
      claim: O-13 solver-side closure does not reach m >= 10 at 256-bit p
      verified_by: idea filing agent, lead-discovery 2026-10-24
  assumptions:
    - Solver class reads S~ in the 0/1 monomial basis; other bases are out of scope.
    - Cost model favourable to the attack; cells within +-2 bits undecided.
  proof_search_map:
    bottleneck: writing the expanded generator S~ before any solver step
    baseline_embedding:
      parameter_slice: W = 2, m = 5, s = 54, 256 bits gives EV-PFDR-f71d7f O-3 (221.3 bits)
      reproduction_check: qc/qc2_floorA_by_m.py re-run byte-identical by the gate
    observation_collision:
      observable: support of S~ in the 0/1 multilinear basis
      distinct_preimage_search: +-1 encoding of the same function; unexpanded presentation, same zero set, small input
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: written support in place of d_lf
        predicted_gain: solver-independent closure of the expanded W = 2 branch
    quantifier_order: >-
      for all log2 p in {128,256,384,521}, m <= 14, 2^s <= p, every 0/1-basis
      solver: H1(m), H2 and (H3 in its band) imply cost >= rho*2^2
    method_ceiling:
      strongest_certifiable_claim: floor A at m <= 4 given H2; statistical H3 at m = 6..8, 128/256 bits
      nearby_object_control: W >= 64 at 384 bits (-2.6), W >= 8 at 521 bits (-2.3)
    proof_obligations:
      - {claim: floor A count and non-vanishing, responsibility: correctness}
      - {claim: H1 at m = 5 and 6, responsibility: feasibility}
      - {claim: basis and presentation scope, responsibility: scope}
    not_applicable_reason: null
  predictions:
    - metric: sampled zero fraction of block-degree <= 3 coefficients, m = 6..8
      direction: lower
      minimum_effect: CP95 nonzero count above each cell's need; tightest (256 bits, m 7, s 38) needs 2^90.8 of 2^92.1
    - metric: coefficient of prod x_i^16 in S_6 mod p
      direction: different
      minimum_effect: nonzero constant free of a, b, x_R
  minimal_test:
    design: >-
      Step 1: S_6 top-form check (KN-OPEN-02200b route). Step 2: Moebius
      sampler at m = 6, 7, 8 only, about 2^(4m-1) point additions per
      coefficient, 20 draws x 2 monomials per cell. Protocol in the notes;
      approved_by null.
    controls:
      - reproduce qc/qc2_h4_check.out at m = 2, 3
      - S_{m+1} with its x_R-leading coefficient, checked against S_3 and S_4
      - planted zero; p = 65537 shows the 1/p rate
    required_metrics: [zero_fraction_cp95, nonzero_vs_need, s6_top_coefficient, control_match]
  falsification_conditions:
    - CP95 nonzero bound below the need at a sampled cell; that arity reverts to floor A (closure fails there).
    - S_6 top coefficient zero or curve-dependent mod p; floor-A cells at m = 5, 6 void.
    - A sub-quadratic sparse solver for weight-m rows; the 521-bit closure fails (-10.8).
  confounders:
    - basis dependence of floor B and H3
    - few sampled cells stand for 202-730 H3 cells
  interpretation_limits:
    - Expanded reduced presentation only; unexpanded, chained and W-ary cells stay open; KN-OPEN-020 not answered.
    - Model at four sizes; toy H4 check covers K <= 4; generic j only.
  heuristic_assumptions:
    - id: H1
      statement: coefficient of prod x_i^(2^(m-1)) in S_{m+1} is a nonzero constant mod p at m = 5, 6 (H-TOP)
      rigorous_support: holds at m = 2, 3, 4 (KN-OPEN-02200b)
      validation_plan: S_6 symbolic specialisation at m = 5; m = 6 stays conditional
    - id: H2
      statement: sparse linear algebra on weight-m rows costs at least m*B^2, B = 2^s/2
      rigorous_support: Wiedemann gives m*B^2 as upper bound; nothing sub-quadratic known
      validation_plan: not measurable here; every margin reported with and without H2
    - id: H3
      statement: H4w, at least 2^-80/2^-155/2^-226/2^-302 of block-degree <= K monomials nonzero (128/256/384/521 bits)
      rigorous_support: floor A; Schwartz-Zippel on coefficients in (a, b, x_R); exact toy check m <= 3
      validation_plan: sampler at m = 6..8, tightest s, Clopper-Pearson vs need; zero-cluster check; m >= 9 and 384/521 bits stay unverified
  target_complexity:
    time_exponent: no attack; closure margins +29.4/+31.2/+34.3/+32.7 bits (model)
    memory_exponent: the written generator, >= C(s, 2^(m-1))^m terms
    best_known: rho sqrt(pi N/4)
    hidden_overhead: solver priced at zero; H2 load-bearing at 521 bits
    tradeoff_note: n/a
  estimated_cost: {implementation: medium, compute: medium}
  recommended_priority: medium
  dominated_by: n/a (no attack); predicted dominated by rho under H1-H3 (KR-IC-5931ee direction)
  sota_delta: >-
    No attack. Closure of LEAD-ICP-digit-presentation-solving-degree branch
