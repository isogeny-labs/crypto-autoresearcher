idea:
  id: IDEA-20261027-d434c8
  question_id: RQ-ECDLP-002
  title: Retained kernel features and natural target-row certificates
  class: measurement
  status: proposed
  proposed_by: idea-generator
  novelty_status: adaptation
  claim: Test whether support-component and one/two-column features generate both retained right kernels. Separately
    specify natural target-row acceptance by the standard annihilator criterion. Deficient base-log rank alone does
    not reject target recovery. Post-data diagnostic; no target constructor supplied.
  mechanism: 'PAIR: R3 source-labelled principal-divisor witnesses projected to signed norm rows; Sigma is addition
    of certified witnesses on their admissible domain. Class partial-action: witnesses compose without representatives
    for every translation. Projection forgets functions, deck choices and auxiliary support; norm additivity preserves
    composition. It is lossy on witnesses, not a deterministic quotient of G. For sealed M*z=b over F_r, let W be
    generated by zero-column units, e_i-e_j for equal columns, e_i+e_j for opposite columns, and row-support-component
    indicators annihilating M. Test W=ker(M), keeping unexplained directions. For a FUTURE public constructor c*(Q+tP)=sum(v_j*F_j)+hP,
    c nonzero mod r, v is identifiable iff v*K=0 for a complete right kernel K. A lambda*M=v certificate gives k=c^(-1)*(lambda*b+h)-t.
    A v chosen from rowspace first is planted, not descent. Use retained public-source rows for post-data leave-source-out
    checks; no new Q or atom logs.'
  citations:
  - ref: EXP-ECDLP-a9b6a5/RUN-ECDLP-967315
    provenance: internal
    verified_by: TASK-20261027-00ae45
    claim: Retained finite systems and prior scope; no new rank computation here.
  - ref: problems/prym-assisted-source-labelled-router.md
    provenance: internal
    verified_by: TASK-20261027-00ae45
    claim: Already states the annihilator criterion and missing natural router.
  assumptions:
  - Only sealed p4099 A2 b13/16 matrices and existing signed/public-column maps; no new sources, targets or atom
    logs.
  - F1-F7 excluded as new primary arithmetic; F2 relations and F7 retained data are known diagnostic components.
  - Leave-source-out is post-data stability, not independent validation; derive each dictionary on its training
    rows only.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-RHO-13bf67
    - KR-IC-5931ee
    - KR-IC-5a43e5
    nearest:
    - ref: LEAD-TRF-cover-catalog-jacobian-transfer
      provenance: internal
