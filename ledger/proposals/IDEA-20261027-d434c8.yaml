      delta: Right kernels and target functionals, not adaptive collection.
    lead: LEAD-TRF-cover-catalog-jacobian-transfer
  proof_search_map:
    bottleneck: Explain retained invisible atom directions and obtain a natural target functional orthogonal to
      them.
    baseline_embedding:
      parameter_slice: Original full M*z=b; direct elimination.
      reproduction_check: Independently certify ranks, M*K=0, kernel dimension and consistency from sealed bytes.
    observation_collision:
      observable: Norm rows forget upstairs witnesses; z and z+K*u share M*z.
      distinct_preimage_search: Choose u separating v*z from v*(z+K*u) when v*K is nonzero; no logs needed.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: Feature subspace W and certificates lambda*M=v for retained or future natural rows.
      predicted_gain: Finite discrimination only; no established attack gain.
    quantifier_order: Fix dictionary and sealed rows first; test each cell; only a separately frozen public constructor
      may later produce v from Q.
    method_ceiling:
      strongest_certifiable_claim: Finite kernel explanation and conditional functional identifiability.
      nearby_object_control: A row chosen from rowspace passes without natural Q attachment.
    proof_obligations:
    - claim: Kernel, signed-column transport and affine consistency agree.
      responsibility: correctness
    - claim: Public constructor produces v,c,h,t before span testing, without k.
      responsibility: interface
    - claim: Scope is two matrices, not a constructor theorem.
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: dim(ker(M)/W)
    direction: lower
    minimum_effect: Explanatory hypothesis predicts exactly zero in each cell; any positive value rejects its completeness
      there.
  - metric: natural-row annihilator residual v*K
    direction: different
    minimum_effect: Exact zero permits a lambda certificate; nonzero leaves the functional unidentified by M alone.
  - metric: witness-fibre loss L and admissible composition branching b
    direction: different
    minimum_effect: Report fibre counts where retained witnesses permit them; unobserved fibres remain unknown,
      never L=0 by default.
  minimal_test:
    design: 'Advice only: independently certify both sealed systems, then leave-one-public-source-block-out span
      checks on retained rows. Bind digests and post-data scope. No collector, Q constructor or atom-log computation.'
    controls:
    - Full-witness identity L=0; signed row/column transports preserve rank and feature dimensions.
    - Planted equal/opposite columns and omitted pivot expose kernel-check defects.
    - Same-support random labels and relabelled abstract cyclic-group interfaces calibrate combinatorial features
      and L,b; no control labels become advice.
    required_metrics:
    - digests
    - U/ranks/kernel
    - dim W and residual
    - affine signatures/syndromes
    - v*K and lambda certificates
    - L,b
    - operations/bytes
  falsification_conditions:
  - Any residual kernel dimension refutes the complete feature explanation for that cell.
  - A claimed identifiable v has v*K nonzero or no valid lambda*M=v certificate.
  - A purported natural row was selected using rowspace or scalar knowledge; it cannot support descent.
  confounders:
  - Canonical sign changes
  - removed public anchors
  - source-order effects on prefix rank rather than final rank
  - dictionary fitting after seeing answers
  interpretation_limits:
  - 'Inside KN-OPEN-020 bounded-base scope: stop at finite measurement/conditional algebra.'
  - No natural Q row supplied, universal obstruction or exponent improvement established.
  heuristic_assumptions:
  - id: H1
    statement: Conditional on frozen support and public-column removal, source-block span increments may be modelled
      by support-matched uniform finite-field rows.
    rigorous_support: Rank-nullity and the annihilator equivalence are exact; only the uniform random-matrix comparison
      is a heuristic and is unnecessary for finite certificates.
    validation_plan: Later compare retained source-block increments and longest dependent runs with support-matched
      random-matrix nulls. Record orders and conditioning. No crypto-size shortcut/transfer; exact certificates
      need no heuristic.
  target_complexity:
    time_exponent: No ECDLP exponent claimed; dense diagnostic O(n*U*min(n,U)) field operations, n=97 or 67 and
      U=15 in retained scope.
    memory_exponent: No attack exponent; O(n*U+U^2) field elements for the diagnostic and certificates.
    best_known: Pollard rho r^(1/2+o(1)) time, small serial state; BSGS r^(1/2) time and memory.
    hidden_overhead: Parsing, column transport, dictionary and independent certificates; no n,U scaling law inferred.
    tradeoff_note: Diagnostic, not an online/cold attack tradeoff or parallel speedup.
  dominated_by: n/a (no attack result claimed); known arithmetic components only.
  sota_delta: No attack; zero established time/memory exponent or complete-cost improvement.
