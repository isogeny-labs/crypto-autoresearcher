idea:
  id: IDEA-20261029-2e292c
  status: proposed
  approved_by: null
  title: Strong algebraic backdoors selected without witnesses
  class: algorithm
  claim: Test whether conditioning a small, instance-computable set of carry or intermediate variables leaves
    a tractable complete residual more cheaply than the existing fixed-block guessing strategy.
  mechanism: R1 finite-domain circuit variables; coordinate-dependent under restriction and exact propagation.
    Build a public dependency/rank-defect hypergraph from the unsolved instance. A fixed, training-frozen policy
    selects a backdoor S before looking at any witness. A strong backdoor means every legal assignment alpha
    to S leaves a residual solvable by the declared bounded-degree or acyclic procedure, including UNSAT branches.
    Search cost is construction plus sum_alpha C(F|alpha), with entropy b=sum log2 |D_i| only an upper bound
    when domains correlate. Rank deficiency alone is not a certificate. This is a structural backdoor question,
    not ordinary guess-and-determine or a learned factor-base selector.
  novelty_status: adaptation
  citations:
  - ref: KR-IC-e847d1
    provenance: kb
    claim: Crossbred/hybrid algebra plus guessing is known.
    verified_by: Current frontier map read.
  - ref: IDEA-20260904-b40e6d
    provenance: internal
    claim: Existing fixed-backdoor null proposal.
    verified_by: Proposal index read; full details require parent review.
  assumptions:
  - User requests factor-base/SAT research; execution is not authorized here.
  - Implicit membership is not an asserted escape from KN-OPEN-020.
  proof_search_map:
    bottleneck: The total assignment entropy of a backdoor plus the residual proof cost, including the cost
      of finding it.
    baseline_embedding:
      parameter_slice: Use identical relation predicate with the established solver.
      reproduction_check: Exact model sets including sign and exception conventions at smallest sizes.
    observation_collision:
      observable: Cost paired with exact relations.
      distinct_preimage_search: Elliptic and null systems with equal displayed statistics.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Specified in mechanism.
      predicted_gain: Conditional; not measured.
    quantifier_order: Exists a fixed policy improving held-out declared instances; every accepted relation
      valid. No universal scaling claim.
    method_ceiling:
      strongest_certifiable_claim: Finite-family solver result.
      nearby_object_control: Matched null without the proposed structure.
    proof_obligations:
    - claim: Exact encoding, pruning and complete accounting.
      responsibility: correctness
  predictions:
  - metric: total_backdoor_solve_cost
    direction: lower
    minimum_effect: 'Proposed screen: at least 2x reduction against equal-entropy random cuts and best fixed-block
      guessing.'
  minimal_test:
    design: Freeze tiny exact digit-system instances and a witness-blind policy. At these sizes enumerate every
      assignment to candidate backdoors, certify every residual, and compare equal-entropy random, min-fill,
      fixed-block and rank-guided cuts. Include a planted synthetic circuit with a known small strong backdoor
      as a positive control.
    controls:
    - Exact tiny oracle; uniform and separately labelled planted targets.
    - Identical domains, signs, exceptions and setup allowance.
    - Matched algebraic null and known-positive instrument control.
    required_metrics:
    - verified_model_count
    - actual_solving_degree
    - field_operations
    - matrix_rows_columns_rank
    - memory_peak
    - total_cost_per_verified_relation
    - exception_coverage
  falsification_conditions:
  - A purported strong backdoor has even one unresolved legal assignment.
  - Policy needs known roots or tuning on test instances.
  - Selection plus all residual branches is no cheaper than fixed-block or random cuts.
  - Backdoor entropy scales like the full known enumeration exponent.
  confounders:
  - A lower first-fall degree or lower equation degree being mistaken for lower solving cost.
  - Selected targets or omitted chart cases making the candidate easier.
  interpretation_limits:
  - Proposal only; no experiment or improvement established.
  - Prime-field scope; regularity, solving degree and work are distinct.
  - Independent relation verification; incomplete means UNKNOWN.
  heuristic_assumptions:
  - id: H1
    statement: A witness-blind polynomial-time policy finds S with sum_alpha C(F|alpha) asymptotically below
      the best fixed-block strategy on a nonvanishing fraction of target instances.
    rigorous_support: Conditioning is exact, but no structural theorem supplies such S; generic bounded-treewidth
      circuits are positive controls only.
    validation_plan: Exhaustive strong-backdoor verification at tiny sizes, then report cost distributions
      and unresolved assignments; no extrapolation from weak backdoors.
  target_complexity:
    time_exponent: Unknown. C_attempt=C_select+sum_alpha C_res(alpha), upper bounded by C_select+2^b max C_res
      for b Boolean backdoor bits. If b=theta log2 N and C_res=N^eta, require theta+eta<3/10 at m=5,B near
      N^(1/5), plus collection and LA gates.
    memory_exponent: Unknown; charge solver, setup, relation state; rho has small memory.
    best_known: Pollard rho O(sqrt(N)); PDP comparator is best matched exact loop/MITM/solver.
    hidden_overhead: Factor-base construction, failed attempts, chart coverage loss, roots/sign recovery, rank
      independence, preprocessing and descent.
    tradeoff_note: Parallel targets possible; charge setup at actual reuse count.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: Tiny proposed discriminating tests; no budget granted.
