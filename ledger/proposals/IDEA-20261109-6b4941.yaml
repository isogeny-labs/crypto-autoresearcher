idea:
  id: IDEA-20261109-6b4941
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-5038da
  title: The T4-invariant coordinate w = d x^2 y^2 on Edwards25519 has a constant-free differential addition
    and is the Montgomery x-line of the 4-isogenous curve A' = 2(A+6)/(2-A); its ladder costs 5M+4S+2c
    per bit
  class: representation
  claim: 'Let w(P) = d x^2 y^2 on -x^2 + y^2 = 1 + d x^2 y^2. Then w(-P) = w(P + T_2) = w(P + T_4) = w(P),
    and for all P, Q: w(P+Q) w(P-Q) (1 - w_1 w_2)^2 = (w_1 - w_2)^2, w_1 = w(P), w_2 = w(Q); w(2P) = 4
    w ((1+w)^2 - (4a/d) w) / (1 - w^2)^2 with 4a/d = 486664/121665. Projectively w = W/Z: differential
    addition U = (Z_1+W_1)(Z_2-W_2), V = (Z_1-W_1)(Z_2+W_2), W_{P+Q} = Z_{P-Q} (U-V)^2, Z_{P+Q} = W_{P-Q}
    (U+V)^2 (4M+2S; 3M+2S with Z_{P-Q} = 1); doubling S_1 = (Z+W)^2, S_2 = (Z-W)^2, D_4 = S_1 - S_2, W_2
    = D_4 (121665 S_2 - D_4), Z_2 = 121665 S_1 S_2 (2M+2S+2c_small). Under X_M := Z, Z_M := W these are
    exactly RFC 7748''s ladder formulas with a_24'' = -1/121665, so x'' = 1/w is the Montgomery coordinate
    of E'': y''^2 = x''^3 + A'' x''^2 + x'', A'' = 2(A+6)/(2-A) = -243334/121665, the codomain of the
    4-isogeny with kernel <T_4> (Montgomery u = 1). Per-bit cost 5M+4S+2c_small versus 5M+4S+1c_small:
    slower by one small constant multiply, same (2,2) degree. The ladder output w(kP) determines kP only
    modulo <-1, T_4>, so it cannot produce the X25519 u-coordinate without the dual isogeny.'
  mechanism: 'Write alpha_i = -x_i^2, beta_i = y_i^2 so alpha_i + beta_i = 1 + w_i and alpha_i beta_i
    = -w_i/d. The complete law gives x(P+Q) x(P-Q) = (x_1^2 y_2^2 - y_1^2 x_2^2)/(1 - w_1 w_2) and y(P+Q)
    y(P-Q) = (y_1^2 y_2^2 - x_1^2 x_2^2)/(1 - w_1 w_2); the product of numerators is -(alpha_1 beta_2
    - beta_1 alpha_2)(beta_1 beta_2 - alpha_1 alpha_2) = -(p_1 s_2^2 - p_2 s_1^2) with s_i = alpha_i +
    beta_i, p_i = alpha_i beta_i, which is (1/d)(w_1 (1+w_2)^2 - w_2 (1+w_1)^2) = (1/d)(w_1 - w_2)(1 -
    w_1 w_2). Multiplying by d and squaring gives the stated identity. Doubling uses x(2P) = 2xy/(1+w),
    y(2P) = (y^2 + x^2)/(1-w) and (y^2+x^2)^2 = (1+w)^2 - 4 a w/d. The symmetry exploited is the order-8
    group <-1, T_4> acting on E; the quotient is the Kummer line of E/<T_4>, which is why no new law appears:
    Kummer-line differential addition has bidegree (2,2) on every curve. Clearing 4a/d by the free projective
    factor 121665 turns the single full-size constant into two small ones (121665 and 121666, the latter
    absorbed via 121665 S_1 - 121666 D_4 = 121665 S_2 - D_4).'
  novelty_status: unverified
  citations:
  - ref: Farashahi-Hosseini 2017, Differential addition on twisted Edwards curves (w-coordinates)
    provenance: recalled
    claim: w-coordinate ladders with Montgomery-equivalent cost; likely contains the identity in another
      normalisation
    verified_by: null
  - ref: De Feo-Jao-Plut 2014, 4-isogeny codomain A' = 2(A+6)/(2-A) for kernel x = 1
    provenance: recalled
    claim: codomain constant of the Montgomery 4-isogeny
    verified_by: null
  - ref: BRIEF section 1, src/ecc/x25519.rs ladder
    provenance: internal
    claim: RFC 7748 step shape X_2 = AA*BB, Z_2 = E(AA + a24 E) with a24 = 121665
    verified_by: idea-generator session 2026-11-09 read the BRIEF excerpt
  assumptions:
  - a = -1, d = -121665/121666, so 4a/d = 486664/121665 and a_24' = (A'+2)/4 = -1/121665.
  - The rational point of order 4 on the Montgomery model has u = 1 (486664 is a square; checked).
  - Projective scaling (W:Z) ~ (lambda W: lambda Z) is free; constants may be moved between W and Z.
  proof_search_map:
    not_applicable_reason: Identity between explicit rational functions on one curve; checked by symbolic
      expansion and random evaluation, not an exponent claim.
    bottleneck: not_applicable
    proof_obligations: []
  predictions:
  - metric: random pairs (P,Q) violating w(P+Q) w(P-Q) (1 - w_1 w_2)^2 = (w_1 - w_2)^2
    direction: equal
    minimum_effect: exactly 0 of 10^4
  - metric: random P with w(2P) != Montgomery-doubling of 1/w(P) on E' with a_24' = -1/121665
    direction: equal
    minimum_effect: exactly 0 of 10^4
  - metric: j(E') versus j of Sage's codomain of the 4-isogeny with kernel the u = 1 point
    direction: equal
    minimum_effect: equal
  minimal_test:
    design: 'scripts/check_w_ladder_4isogeny.sage: (i) sample 10^4 pairs, assert the differential-addition
      identity; (ii) assert the doubling identity against the RFC 7748 step with X_M = Z, Z_M = W, a24
      = -1/121665; (iii) build E_M as a Weierstrass curve via u -> u + A/3, compute E.isogeny(E.lift_x(1
      + A/3)) and assert its codomain has j = 256 (A''^2 - 3)^3 / (A''^2 - 4); (iv) assert #E''(F_p) =
      8 l.'
    controls:
    - Null object of the same shape - replace A' by a random A'' and assert (ii) fails.
    - Replace w by y^2 (not T_4-invariant) and assert (i) fails on most pairs.
    required_metrics:
    - identity violations in (i) and (ii)
    - j-invariant equality in (iii)
    - per-bit count 5M+4S+2c versus 5M+4S+1c in the counting field
  falsification_conditions:
  - Any violation of the identity in (i) or (ii) on valid points.
  - j(E') differs from the 4-isogeny codomain's j-invariant.
  - A w-ladder step with fewer than 5M+4S+2c that still passes (i)-(ii) would falsify the cost claim.
  confounders:
  - Sign conventions of the Edwards-Montgomery map do not affect w (it is even); the j-invariant check
    is convention-free.
  - The identification is up to the 2-torsion translation of E' (x' = w vs 1/w); both pass (ii) by X<->Z
    symmetry of the ladder.
  interpretation_limits:
  - Negative on cost; positive only as a structural identification. No change to x25519.rs is recommended.
  - Does not deliver the X25519 u-coordinate; see the isogeny-shortened ladder lead for the dual-isogeny
    route.
  heuristic_assumptions: []
  target_complexity:
    time_exponent: not an exponent claim; per-bit field count
    memory_exponent: unchanged, two field elements per ladder leg
    best_known: RFC 7748 ladder 5M+4S+1c_small per bit
    hidden_overhead: one extra small-constant multiply per bit; two isogeny evaluations if u(kP) is required
    tradeoff_note: constant-free differential addition is paid back with interest in the doubling
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: RFC 7748 ladder on E itself (5M+4S+1c_small) dominates on cost; the record's content is
    the identification and the degree classification.
  sota_delta: 'Count delta +1c_small per bit (worse). Structural delta: explicit Curve25519 constants
    A'' = -243334/121665, a_24'' = -1/121665 and the statement that no ladderable coordinate on this curve
    has differential addition of bidegree below (2,2).'
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: Curve25519 explicit-formula campaign (alternative coordinate systems); no ECDLP
      mechanism is claimed.
    none_found_after:
    - 'BRIEF section 2 ledger index: no record files a w-coordinate, Kummer-line or isogeny-conjugated
      ladder for Curve25519'
    - 'BRIEF section 1: src/ecc/x25519.rs implements only the u-coordinate ladder'
