  title: >-
    Subfield-trace projections of signatures as public detectors: does power peak at the degree
    matching a defect's tree level?
  class: representation
  claim: >-
    In Z[x]/(x^n + 1) the relative trace to the index-2 subfield returns twice the even part,
    the same split ffSampling recurses on. Claim: for a defect planted at ffLDL tree depth
    l, a quadratic statistic on the public relative trace of (s1, s2) to degree n/2^l reaches
    80% power with at least 2x fewer signatures than the same statistic on the full 2n-dimensional
    signature, at n = 64 and l in {3, 5}. Falsified if the full-dimensional statistic is never
    worse than the best trace statistic.
  mechanism: >-
    A deep-level defect perturbs a low-dimensional component; a statistic over all 2n coordinates
    pays noise in every dimension. If the trace maps keep most of the defect while discarding
    dimensions, power per signature rises. Because the secret basis has entries in the top
    field, the trace does not commute with the secret frame, so whether the defect survives
    the projection is exactly what is tested.
  tracked_object: Signatures to 80% power at alpha = 0.01 for each statistic family and defect
    level.
  novelty_status: unverified
  novelty_note: >-
    No novelty screen has run. kb citations were opened by the drafting session; recalled
