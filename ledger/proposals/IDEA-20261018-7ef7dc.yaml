  title: >-
    Kuperberg and Regev DHSP sieves under faulty samples: classically simulated success-vs-fault-rate
    tables at toy group sizes
  class: measurement
  claim: >-
    Kuperberg-style sieves act on classical phase labels with random measurement outcomes,
    so they are exactly simulable classically. At N = 2^16..2^40, the probability of recovering
    the low bit of d drops below 0.6 once the faulty-sample rate exceeds 1/(number of combining
    levels)^c for a fitted c; for the fault rates the LWE-to-DCP reduction forces (1/poly
    at toy n) Kuperberg's sieve fails, while the query/memory tradeoff between Kuperberg-1
    and Regev's polynomial-memory variant is reproduced within 20% of published exponents.
  mechanism: >-
    Noise tolerance, not speed, is the binding constraint for the LWE route (KN-LIT-2c8264).
    Each combining step of the sieve XORs labels; a faulty sample contaminates every descendant,
    so success decays geometrically with depth. Simulation gives the empirical decay curve
    and therefore the maximum fault rate as a function of N, which can be matched against
    the fault rate the reduction produces.
  tracked_object: >-
    Success probability of recovering d mod 2 versus (log N, fault rate, sieve variant), and
    queries and peak memory per run.
