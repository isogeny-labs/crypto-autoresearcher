  title: >-
    Depth-limited parallel Grover cost tables per FIPS 205 hash role: multi-target preimage
    cost under MAXDEPTH and processor count
  class: tooling
  claim: >-
    For each FIPS 205 parameter set and each hash role (F, H, T_len, H_msg, PRF), the cost
    of the best generic quantum multi-target attack depends on the number of exposed targets
    t, the depth cap D and the processor count P as G = sqrt(2^n / t) total iterations split
    across P machines, giving total gates ~ 2^n / (t * D) per machine-depth product when D
    binds. A machine-checked table over D in {2^40, 2^64, 2^96} and t from the transcript
    exposure counts shows at least one parameter set whose depth-capped quantum margin falls
    below its category floor by >= 4 bits when t is taken as the full exposed target count;
    or none does, which is the comfortable-margin outcome.
  mechanism: >-
    Grover parallelises badly: splitting the search space over P machines saves only sqrt(P)
    in depth while multiplying width by P. Under a depth cap D the attacker must use P = 2^n/(t
    D^2) machines, and total cost scales as 2^n/(t D), so multi-target gain t is fully realised
    in the quantum setting under depth limits. Tweaks and per-key PK.seed limit t to targets
    sharing one tweak domain; the table must count t per tweak domain, not per transcript,
    which is exactly where conventions disagree.
  tracked_object: >-
    A table T[param_set][role][D][t_convention] -> (log2 total gates, log2 qubit-width, log2
    depth) with interval bounds from the oracle-cost range.
