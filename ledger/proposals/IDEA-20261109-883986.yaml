idea:
  id: IDEA-20261109-883986
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Smart's map is the class of E~(Z/p^2) in Ext^1(Z/N, F_p) = Z/gcd(N, p), and the torsion digit
    is affine in the Weierstrass deformation (a_1, b_1) with B = x_0/(3b) along the canonical direction
    and generic A off it
  class: methodological
  claim: '(1) For any Weierstrass lift mod p^2 and any lift rule L, the map P -> [N]L(P) in E_1/E_2 =
    F_p is Smart''s homomorphism when N = p and equals N d_L(P) in general, where d_L(P) is the fibre
    coordinate of L(P) relative to the torsion section; the obstruction to a canonical choice is the class
    of 0 -> F_p -> E~(Z/p^2) -> E(F_p) -> 0 in Ext^1(Z/N, F_p) = Z/gcd(N, p), zero for p prime to N (secp256k1,
    t about 1.27 times 2^128, N < p) and equal to the Smart invariant for N = p; the filed trace-one record
    (attack fails exactly on the canonical lift) is the statement that this class vanishes at the canonical
    anomalous lift. (2) For E~_{a_1, b_1}: y^2 = x^3 + (a + p a_1) x + (b + p b_1) the torsion digit obeys
    x_1(P; a_1, b_1) = x_1(P; 0, 0) + a_1 A(P) + b_1 B(P) exactly in F_p, with A, B: E(F_p) -> F_p each
    computable in O(log N). (3) On y^2 = x^3 + b (canonical lift) the b_1-direction is the isomorphism
    (x, y) -> (u^2 x, u^3 y), u^6 = 1 + p b_1/b, so B(P) = x_0/(3b) exactly, while the a_1-direction leaves
    the canonical locus and A has generic degree over E(F_{p^2}). (4) For j nonzero both A and B have
    generic degree. (5) For N = p the construction P^ = P~ - [N^{-1}]([N]P~) fails at the inversion of
    N on E_1, the same gcd. No exponent change is claimed.'
  mechanism: 'Modulo p^2 every first-order perturbation enters affinely because p^2 = 0, so the lift-dependence
    of the only new digit is captured by two functions A and B. The canonical direction is a coordinate
    change and leaves the Teichmueller structure (companion record) intact; the non-canonical direction
    destroys Frobenius compatibility and should randomise the digit. The Ext computation is the precise
    reason the anomalous attack does not extend: not ordinariness (secp256k1 is ordinary, p does not divide
    t) but gcd(N, p) = 1 kills the extension class and splits E~(Q_p) as Z/N + Z_p, so the lifted discrete
    log is a free Z_p-component plus the original ECDLP.'
  novelty_status: adaptation
  citations:
  - ref: KR-RHO-53c89f
    provenance: internal
    claim: Smart, Satoh-Araki and Semaev solve trace-one curves in polynomial time; this record identifies
      their map with an extension class that vanishes for N prime to p.
    verified_by: REPO BRIEF section 3 row text, file not opened in this session
  - ref: KR-RHO-755e35
    provenance: internal
    claim: Anomaly is an isogeny invariant, so no isogenous model changes gcd(N, p); the deformation here
      is a lift, not an isogeny.
    verified_by: REPO BRIEF section 3 row text, file not opened in this session
  assumptions:
  - p >= 5 and p prime to N N' so the torsion lift exists over W(F_{p^2}).
  - Deformations are taken in short Weierstrass form; x -> u^2 x + r with r nonzero is excluded since
    it introduces an x^2 term.
  predictions:
  - metric: pointwise residual of the affine law x_1(a_1, b_1) - x_1(0, 0) - a_1 A - b_1 B
    direction: lower
    minimum_effect: exactly 0 on every point and every tested (a_1, b_1)
  - metric: pointwise residual B(P) - x_0/(3b) on j = 0 curves
    direction: lower
    minimum_effect: exactly 0
  - metric: degree of A over X on j = 0 curves, and of A and B on j nonzero curves
    direction: higher
    minimum_effect: at least |X| - 3 at every tested prime
  minimal_test:
    design: 'Share the lifting pipeline of the Teichmueller record. For primes p = 1 mod 3 in [31, 241]
      and j = 0 curves, compute x_1 over E(F_{p^2}) at (a_1, b_1) in {(0,0), (1,0), (2,0), (0,1), (1,1)},
      verify the affine law and the closed form of B pointwise, interpolate A over X and record its degree.
      Repeat for three non-CM curves y^2 = x^3 + a x + b with a nonzero at the same primes, interpolating
      both A and B. Anomalous arm: construct a toy trace-one curve as in the filed trace-one record and
      confirm the torsion-lift construction raises a division by p at the [N^{-1}] step on every lift.'
    controls:
    - Affine law verified pointwise before any degree is recorded.
    - B = x_0/(3b) pointwise on j = 0 curves as a correctness certificate of the mod p^2 arithmetic.
    - Random even function on X interpolates at degree |X| - 1.
    - Anomalous arm fails at the predicted step and nowhere else.
    required_metrics:
    - p, curve, N, N', |X|
    - maximal affine-law residual, maximal B residual
    - deg_A (j = 0), deg_A and deg_B (j nonzero), deg_random
    - anomalous arm failure step
  falsification_conditions:
  - Any nonzero affine-law residual, which is an arithmetic error and an invalid run.
  - B differs from x_0/(3b) pointwise on a j = 0 curve.
  - deg_A at most (3p-1)/2 on j = 0 curves at two or more primes, which would mean the digit structure
    survives loss of the canonical lift.
  - The anomalous arm succeeds in building a torsion section on a non-canonical lift.
  confounders:
  - Points where intermediate additions degenerate modulo p are handled in the formal-group chart; their
    count is reported.
  interpretation_limits:
  - Degrees are measured at toy p; the Ext statement is exact at every size but moves no exponent.
  - Nothing here bounds non-algebraic statistics of A; that is the spectrum record's job.
  heuristic_assumptions:
  - id: H1
    statement: The non-canonical deformation direction produces a digit of generic degree.
    rigorous_support: None; only the canonical direction has a theorem behind it.
    validation_plan: deg_A across the prime sweep and across three non-CM curves.
  target_complexity:
    time_exponent: N^{1/2} unchanged
    memory_exponent: O(p^2) at toy size
    best_known: Pollard rho at Theta(N^{1/2}) per KR-RHO-13bf67; Smart's map is polynomial time only at
      gcd(N, p) = p
    hidden_overhead: None; A and B cost two 256-bit scalar multiplications modulo p^2 each.
    tradeoff_note: None.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  sota_delta: Exponent delta 0. Counted delta, the Smart map is identified with an extension class of
    order gcd(N, p), the lift-dependence of the p-adic digit is reduced to two explicit functions, one
    of which has the closed form x_0/(3b) on the canonical direction.
