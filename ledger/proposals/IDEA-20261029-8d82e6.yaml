idea:
  id: IDEA-20261029-8d82e6
  status: proposed
  approved_by: null
  title: Resume prime-field CDCL with certificate-producing finite-domain theory
  class: algorithm
  claim: Reconcile preliminary plain-Macaulay inverse-degree support, then test whether bounded-PC learning
    prunes before whole-block enumeration.
  mechanism: R1 digit variables plus native F_p arithmetic; coordinate-dependent, operation set is Boolean
    restriction and certified consequence learning. Retain Boolean/finite-domain factor-base decisions, and
    keep multiplications in F_p. At a conflict return an explicit polynomial identity 1=sum a_i f_i modulo
    the declared Boolean/domain equations, or a guarded consequence valid under the recorded prefix. Use the
    certificate to learn a clause over decision literals. Compare Yices2 zero-decomposition MCSat, cvc5 finite-field
    theory and bit-blasted SAT with identical domain restrictions. Do not enumerate all p field values. The
    open delta is bounded-PC mutant learning and proof/branch cost after reconciliation of preliminary FULL
    support, not the general idea of SAT for PDP.
  novelty_status: adaptation
  citations:
  - ref: https://arxiv.org/abs/2402.17927
    provenance: retrieved
    claim: Yices2 finite-field MCSat uses zero decomposition; restricted prime fields, no PDP speed claim.
    verified_by: Primary abstract and paper extract read.
  - ref: https://eprint.iacr.org/2023/091
    provenance: retrieved
    claim: Finite-field SMT/cvc5 is a required matched backend.
    verified_by: Root primary-source audit.
  - ref: IDEA-20260905-24d827
    provenance: internal
    claim: BV/FF and user-propagator PDP comparison already proposed.
    verified_by: Git blob read with root audit.
  assumptions:
  - User requests factor-base/SAT research; execution is not authorized here.
  - Implicit membership is not an asserted escape from KN-OPEN-020.
  proof_search_map:
    bottleneck: Polynomial certificate width/degree and amortized conflict cost before all but one factor-base
      block is assigned.
    baseline_embedding:
      parameter_slice: Use identical relation predicate with the established solver.
      reproduction_check: Exact model sets including sign and exception conventions at smallest sizes.
    observation_collision:
      observable: Cost paired with exact relations.
      distinct_preimage_search: Elliptic and null systems with equal displayed statistics.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Specified in mechanism.
      predicted_gain: Conditional; not measured.
    quantifier_order: Exists a fixed policy improving held-out declared instances; every accepted relation
      valid. No universal scaling claim.
    method_ceiling:
      strongest_certifiable_claim: Finite-family solver result.
      nearby_object_control: Matched null without the proposed structure.
    proof_obligations:
    - claim: Exact encoding, pruning and complete accounting.
      responsibility: correctness
  predictions:
  - metric: charged_search_cost
    direction: lower
    minimum_effect: 'Proposed screen: at least 2x less full work than strongest enumeration/SMT control on
      held-out cells; all theory calls included.'
  minimal_test:
    design: Reuse the exact residual fixtures from EXP-ECDLP-3abd24 if accessible, then freeze an extension
      with bounded-PC closure and proof export. First replay existing s4,5,6 plain inverse-degree values; compare
      learned-prefix coverage at equal proof budget. No new target size until certificates and UNSAT agree
      with the oracle.
    controls:
    - Exact tiny oracle; uniform and separately labelled planted targets.
    - Identical domains, signs, exceptions and setup allowance.
    - Matched algebraic null and known-positive instrument control.
    required_metrics:
    - verified_model_count
    - actual_solving_degree
    - field_operations
    - matrix_rows_columns_rank
    - memory_peak
    - total_cost_per_verified_relation
    - exception_coverage
  falsification_conditions:
  - Pruning begins only after all but one factor-base block is fixed.
  - Theory explanation construction costs as much as the pruned enumeration.
  - Invalid certificates, omitted finite domains, or gains only on planted/SAT inputs.
  confounders:
  - A lower first-fall degree or lower equation degree being mistaken for lower solving cost.
  - Selected targets or omitted chart cases making the candidate easier.
  interpretation_limits:
  - Proposal only; no experiment or improvement established.
  - Prime-field scope; regularity, solving degree and work are distinct.
  - Independent relation verification; incomplete means UNKNOWN.
  heuristic_assumptions:
  - id: H1
    statement: For a nonvanishing fraction of early Boolean prefixes, bounded-PC produces short refutations
      despite high plain-Macaulay inverse degree.
    rigorous_support: Plain-Macaulay and bounded-PC are different proof systems; existing FULL result does
      not establish this assumption.
    validation_plan: Measure certified earliest refutable depth, maximum degree, arithmetic operations and
      tail cost on exact SAT/UNSAT residuals.
  target_complexity:
    time_exponent: Unknown. Cost P+(B/rho)C+soft-O(B^2)+descent. With m=5,B near N^(1/5),constant rho, C=N^gamma
      requires gamma<3/10 to beat sqrt(N). Unachieved.
    memory_exponent: Unknown; charge solver, setup, relation state; rho has small memory.
    best_known: Pollard rho O(sqrt(N)); PDP comparator is best matched exact loop/MITM/solver.
    hidden_overhead: Factor-base construction, failed attempts, chart coverage loss, roots/sign recovery, rank
      independence, preprocessing and descent.
    tradeoff_note: Parallel targets possible; charge setup at actual reuse count.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: Tiny proposed discriminating tests; no budget granted.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
