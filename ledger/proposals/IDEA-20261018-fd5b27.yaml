  title: >-
    Regev's quantum step read in the attack direction: how much BDD-radius shortfall does
    the iterative DGS-width reduction tolerate?
  class: mechanism
  claim: >-
    Regev's reduction iterates: DGS samples of width r on the dual plus a BDD oracle of radius
    ~ alpha q / r yield DGS samples of width r/2. Simulated exactly in dimension 2..3 with
    a perfect oracle and with oracles whose decoding radius is a factor rho < 1 of the required
    one, the width stops shrinking once rho falls below a threshold rho* in (0.3, 0.9); an
    attacker's average-case LWE solver corresponds to rho << rho* for worst-case lattices,
    making the obstruction quantitative with measured rho*.
  mechanism: >-
    Lane 3 asks whether the asymmetry is definitional or quantitative. The reduction consumes
    a BDD oracle valid on all lattices; an attacker has at best an average-case solver. Replacing
    the oracle by one with shrunken radius and measuring whether the iteration still contracts
    gives a number for the tolerance; the quantifier failure is then that the attacker's oracle
    fails the 'for all lattices' quantifier at radius rho*.
  tracked_object: >-
    Ratio of output DGS width to input width per iteration, versus oracle radius factor rho,
    in toy dimension.
