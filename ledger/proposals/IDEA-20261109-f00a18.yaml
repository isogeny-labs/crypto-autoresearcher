    verified_by: path listed in REPO BRIEF section 1 only
  assumptions:
  - p is 1 mod 3, N is prime and not equal to p, so p splits in K and phi has degree N.
  - The class number of K is 1, so the ray class group mod (pi - 1) is (O_K/(pi-1))^* modulo the six units.
  proof_search_map:
    not_applicable_reason: A localisation and cost statement with a toy verification, not an exponent-moving
      algorithm.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
