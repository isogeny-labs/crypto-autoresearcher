    proof_obligations: []
  predictions:
  - metric: order of the local Kummer image at P = (pi)
    direction: different
    minimum_effect: equals N exactly on every toy instance
  - metric: Cassels local factor at the two primes above p
    direction: different
    minimum_effect: equals 1 on every toy instance
  - metric: degree of K(E~[phi]) over K
    direction: higher
    minimum_effect: at least (N - 1)/6 on every toy instance
  minimal_test:
    design: Enumerate p <= 200 with p = 1 mod 3 and b in F_p^* such that y^2 = x^3 + b has prime order
      N in {7, 13, 19, 31, 37, 43}; first instances p = 13 with N = 7 and N = 19. Lift b to Z, compute
      pi in Z[omega], the degree of K(E~[pi - 1]), the local images at both primes above p, Sel^phi and
      the dual Selmer group (Magma SelmerGroup of the isogeny, or hand Kummer theory over K(E~[phi]) for
      N = 7), and the reductions of generators of E~(K).
    controls:
    - For each instance compute the ell-Selmer local image at P for a prime ell not dividing N; the wave-2
      shadow theorem predicts 0.
    - Recompute pi from the point count and check Nm(pi - 1) = N.
    required_metrics:
    - p
    - N
    - b
    - degree of K(E~[phi]) over K
    - order of local image at (pi)
    - order of local image at the conjugate prime
    - Cassels local factor at (pi)
    - dim_F_N Sel^phi
    - dim_F_N dual Selmer
    - rank of E~(K)
  falsification_conditions:
  - The local Kummer image at (pi) has order different from N on any valid instance.
  - A Cassels local factor at a prime above p differs from 1.
  - The degree of K(E~[phi]) over K is below (N - 1)/6 on any instance.
  - A Selmer class is produced whose localisation at (pi) is labelled relative to the reduction of P without
    a global point reducing to it.
  - A Magma or Sage timeout is infrastructure, not a result.
  confounders:
  - Sel^phi can exceed the rank contribution through Sha[phi]; the record reports both dimensions and
    does not interpret Sha[phi] as information about E(F_p).
  - Instances with N = p are anomalous and excluded.
  interpretation_limits:
  - Toy N up to 43 says nothing about Selmer dimensions at 256 bits; only the three structural claims
    transfer.
  - No statement is made about non-CM lifts, which have no rational N-isogeny.
  heuristic_assumptions:
  - id: H1
    statement: For N above the toy range, K(E~[phi]) still has degree at least (N - 1)/6 over K.
    rigorous_support: Main theorem of complex multiplication for class number 1; recalled, not opened
      in this session.
    validation_plan: Compute the degree for every toy instance and compare with (N - 1)/6 times a divisor
      of 6.
  target_complexity:
    time_exponent: at least N^1 (field degree (N - 1)/6, about 2^253 at 256 bits) against the best known
      N^{1/2}; delta at least +1/2 in the wrong direction
    memory_exponent: at least N^1 to hold one Kummer generator
    best_known: Pollard rho in Theta(N^{1/2}) group operations, KR-RHO-13bf67
    hidden_overhead: Class group and unit computation of the ray class field, superpolynomial beyond the
      degree itself.
    tradeoff_note: No time-memory tradeoff is defined; the degree is a floor on both.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
