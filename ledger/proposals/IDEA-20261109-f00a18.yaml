idea:
  id: IDEA-20261109-f00a18
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Isogeny descent by phi = pi - 1 on the canonical CM lift over Q(sqrt(-3)): localisation at the
    prime above p is the reduction map, Cassels'' local factors are 1, and the Kummer field is the ray
    class field of conductor (pi - 1) of degree at least (N - 1)/6'
  class: barrier
  claim: 'Let E be y^2 = x^3 + b over F_p with p congruent to 1 mod 3, prime order N, Frobenius pi in
    Z[omega], and let the lift be y^2 = x^3 + b over K = Q(sqrt(-3)) with phi = pi - 1, an endomorphism
    of degree N defined over K. Claim (i): at the prime P = (pi), K_P = Q_p and the local Kummer image
    E~(Q_p)/phi E~(Q_p) has order exactly N and is canonically the reduction E(F_p); the class of a global
    point localises to its reduction. Claim (ii): at the conjugate prime the local image is 0, and the
    Cassels local factor |coker phi|/|ker phi| equals 1 at both primes above p. Claim (iii): K(E~[phi])
    contains the ray class field of conductor (pi - 1), whose degree over K is (N - 1)/6 when the class
    number is 1, so any Kummer-theoretic description of a Selmer class costs at least (N - 1)/6 field
    coordinates. Consequence: the only degree-N descent available on any lift of a j = 0 prime-order curve
    reduces the ECDLP to the compatible-lift problem and costs exponent at least 1 against rho''s 1/2.
    No break is claimed.'
  mechanism: pi acts on the formal group E~_1(Q_p) through the embedding in which pi has valuation 1,
    so pi - 1 is a unit there and bijective; on E(F_p) pi is the identity, so phi induces 0. The snake
    lemma on 0 -> E~_1 -> E~(Q_p) -> E(F_p) -> 0 gives coker phi isomorphic to E(F_p) and ker phi isomorphic
    to E(F_p) lifted by Hensel (E~[phi] is etale of order N with all geometric points in the eigenline
    L_1). At the conjugate prime pi reduces to the dual Frobenius, acting as p on E(F_p), and p - 1 is
    a unit mod N, so coker and ker vanish. The Weber function on E~[(pi-1)] generates the ray class field
    by the main theorem of complex multiplication.
  novelty_status: adaptation
