      - ref: LEAD-RHO-bsgs-family-memory
        provenance: internal
        relation: adjacent
        delta: closed_known; a row at or below bsgs.negation earns no IC credit
    lead: LEAD-ICP-prime-ic-constant-engineering
    new_lead_reason: null
