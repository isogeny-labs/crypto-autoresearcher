idea:
  id: IDEA-20261024-06f16f
  title: >-
    Table B at the j = m table vertex: full m-fold signed sumset (m = 3, 4), one
    x-lookup per walked target, base re-sized (tier I, constant only)
  class: algorithm
  question_id: RQ-ECDLP-361f3a
  claim: >-
    R1 (x-key), relation stage. PREDICTION under H1-H4, not a measurement: at fp24
    a table of every <= 3-fold signed sum of B* = 22-24 abscissae (7.6k-9.8k keys)
    with one lookup per walked target costs 5.8-7.4 GAE/sqrt(r), 1.9-2.4x below
    the Table B m = 2 incumbent (14.0, 12.4k keys; 13.5x -> 5.6-7.1x matched rho);
    m = 4, B* = 11-12: 4.1-5.2. Constant only: family exponent m/(2m-1) > 1/2
    (3/5 at m = 3 vs 2/3); no crossing of rho or BSGS is claimed.
  mechanism: >-
    Pair: x-key of the <= m-fold signed sumset of a small base; Sigma = translation
    by base elements plus the walked step R <- R + G; partial action (Class I).
    Engines so far use table arity j <= m-1 plus a scan. A j-table with m-j
    scanned summands costs N B^(1-j) + B^j (build charged): exponent j/(2j-1),
    best at j = m. In IDEA-20261024-a2b05d terms the per-attempt order becomes
    k = 0 by buying a B^m table; its MITM corollary (k >= m/2) does not cover this
    and its free-oracle line leaves memory uncharged; charging the build (its
    section 8, generalised from m = 2) gives max(1 - beta(m-1), m beta, 2 beta)
    >= m/(2m-1). Inside SO-TABLE and SO-GEN. The m -> infinity limit is BSGS with
    unknown-log baby steps, >= 1.48 sqrt(rho_rel B r) under H1-H3, about 3x the
    collision floor (1/2) sqrt(rho_rel B r) of IDEA-20260928-ce3ab0.
  novelty_status: adaptation
  citations:
    - ref: KN-LIT-013
      provenance: retrieved
      claim: CGK S*T^2 = Omega~(eps N) with free advice; why SO-TABLE applies
      verified_by: mythos-lead-discovery-20261024 gate QC3
    - ref: IDEA-20260928-ce3ab0
      provenance: internal
      claim: collision floor S >= (1/2) sqrt(r N) (derivation, unreviewed)
      verified_by: mythos-lead-discovery-20261024 gate QC3
    - ref: crypto:research/ic_triple_table_20260923
      provenance: internal
      claim: Koblitz (m, j) = (4, 3) table 1.493, 0.589, 0.409 x scaled; gain grows with r
      verified_by: mythos-lead-discovery-20261024 filer
    - ref: crypto:research/ic_triple_counted_20260923
      provenance: internal
      claim: IC arm 1.19x-2.88x above rho in its own canonical form, all five cells
      verified_by: mythos-lead-discovery-20261024 filer
    - ref: crypto:docs/ic/runs/ic-boundary-ledger-round5-2026-09-22.json
      provenance: internal
      claim: fp24 m = 2 row S 14.79, B 111, 12,432 keys, 1.096 GAE per trial
      verified_by: mythos-lead-discovery-20261024 scout
  assumptions:
    - One target per instance; table inside S; LA negligible at B <= 64.
    - H1-H3 are the dossier's H7-H9; H4 added at filing.
  proof_search_map:
    bottleneck: j = 2 table hit rate 2K/r with K ~ B^2 balances at r^(2/3)
    baseline_embedding:
      parameter_slice: m = j = 2 of the model is the incumbent (B = 111 at fp24)
      reproduction_check: model 14.71 vs boundary-ledger 14.79 (calibration)
    not_applicable_reason: constant-level recipe, not proof-oriented
  predictions:
    - metric: paired GAE ratio incumbent/candidate (m = 3) per rung
      direction: higher
      minimum_effect: lower 95% bound > 1 at w = 0, 0.1, 1; point 1.9-2.4 at fp24
    - metric: candidate S over bsgs.negation S, beside table keys/sqrt(r)
      direction: higher
      minimum_effect: "> 1 at every rung (model 5.7-7.2x at fp24, m = 3)"
  minimal_test:
    design: >-
      Rank/early-stop pre-check (m = 3, B = 5-24), then paired ecbench arms vs the
      incumbent on 7 rungs fp14-fp28 (14 bits), 6 workloads x 4 targets,
      linearised_t, section 5a band; protocol in notes, approved_by null.
    controls:
      - A/A copy of the incumbent
      - matched rho.negation, IC arm's canonical form
      - bsgs.negation on the same workloads (BSGS-relabelling control)
      - group-law replay of every candidate relation
    required_metrics: [S_per_phase, keys_per_sqrt_r, ratio_ci_by_weight, S_over_rho, S_over_bsgs, S_over_collision_floor, rho_rel, distinct_keys_over_formula]
  falsification_conditions:
    - interval spans or lies below 1 at every rung fp20-fp28 at some weight
    - S above the predicted band by > 1.5x at fp20-fp28 (H1-H3 fail)
    - early stop needs > 1.5 B relations in > 10% of pre-check solves
  confounders:
    - constants fitted on one m = 2 row (calibration, not validation)
    - "model m = 2 below Table B at fp14/fp16 (5.3-6.8 vs 13.1; 6.5-8.4 vs 11.7): H4"
    - unpriced inserts and lookups (band on every arm)
    - small-base rank floor (the Koblitz table lost its smallest cell)
  interpretation_limits:
    - Tier I constant; exponent unchanged; nothing about crossing rho
    - Table B rows and ECBND1h93b7a9d5c187 are different incumbents
    - "KN-OPEN-020 class: explicit-list base, scoped out, untouched"
  heuristic_assumptions:
    - id: H1
      statement: relations needed under early stop = rho_rel B, rho_rel in [0.667, 1.0], m = 3-5
      rigorous_support: rank over B unknowns <= B; 74/111 measured at m = 2, fp24
      validation_plan: relations-to-rank counter; pre-check at B = 5-24
    - id: H2
      statement: per-trial hit probability = 2K/r with K the formula key count
      rigorous_support: KN-FIND-007 mean and Markov ceiling; yield/ceiling 1.0014 at m = 2
      validation_plan: distinct keys over formula at every B; yield/ceiling per arm
    - id: H3
      statement: c_tab = 1 GAE per key, c_w = 1.096 GAE per trial, as at m = 2
      rigorous_support: a level-j key is a level-(j-1) key plus one base point
      validation_plan: per-phase GAE counters at every rung
    - id: H4
      statement: fixed costs outside the model are negligible at the frozen B
      rigorous_support: model within 7% of measured m = 2 rows at fp18-fp24 only
      validation_plan: incumbent re-measured per rung; per-phase report
  target_complexity:
    time_exponent: family r^(m/(2m-1)) (3/5 at m = 3) vs incumbent r^(2/3); claim is a constant at log2 r 14-28
    memory_exponent: r^(m/(2m-1)) keys; 2.3-3.0 sqrt(r) predicted at fp24 vs incumbent 3.76 sqrt(r)
    best_known: rho.negation r^(1/2), O(1) memory; bsgs.negation 1.16x floor, 0.50 sqrt(r) table
    hidden_overhead: 5.8 GAE per abscissa (square roots); small-B rank unmeasured
    tradeoff_note: j = m vertex of the generic family; limit BSGS
  estimated_cost: {implementation: medium, compute: low}
  recommended_priority: medium
  dominated_by: >-
    Checked. In the model rho.negation and bsgs.negation dominate the candidate on
    both axes (fp24, m = 3: 5.6-7.1x rho ops; bsgs.negation about 1.03 GAE/sqrt(r)
    with 0.50 sqrt(r) entries vs 2.3-3.0 sqrt(r) keys), as they dominate the
    incumbent; the claim is a Pareto move inside the IC family only.
  sota_delta: >-
    Predicted Table B fp24 14.0 -> 5.8-7.4 GAE/sqrt(r) (m = 3), 4.1-5.2 (m = 4);
    13.5x -> 5.6-7.1x / 3.9-4.9x matched rho; keys 12.4k -> 7.6k-9.8k; rho-gap
    growth N^(1/6) -> N^(1/10). ECBND1h93b7a9d5c187 (alpha 0.8407 [0.6459,
    0.9528]) unchanged unless a new bound is sealed.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-RHO-fbd582, KR-RHO-cb1c58, KR-RHO-ea34b8, KR-RHO-cd0049, KR-IC-5931ee, KR-RHO-13bf67, KR-RHO-7d93f6]
    nearest:
