    verified_by: brief section 3 row text, Mythos run 2026-11-09
  assumptions:
  - The wave-1 resultant tower (relations lane, PRs 3183-3190) is available as code or as an exact description;
    the next agent must locate it under crypto/ic or crypto/research.
  - d is a quadratic non-residue, checked by Euler's criterion in the run.
  predictions:
  - metric: relations per charged F_p multiplication, X_B tower divided by mu_B tower at matched B and
      p
    direction: different
    minimum_effect: ratio within [0.77, 1.3]
  - metric: number of roots of D_B in F_p
    direction: higher
    minimum_effect: exactly B - 1, distinct, on every instance
  - metric: count of prime factors of (p + 1)/16 for secp256k1 in [2^48, 2^70]
    direction: different
    minimum_effect: an exact count with an ECM run to B1 = 11e6 over 400 curves, reported either way
  minimal_test:
    design: 'Part A (minutes): ECM on 2^252 - 2^28 - 61 with B1 = 11e6 and 400 curves after trial division
      to 2^30; report all factors found and the cofactor''s primality status. Part B (hours): choose calibration
      primes p in 2^24..2^32 with a divisor B of p + 1 near p^{1/3} and, where possible, a divisor B''
      of p - 1 of the same size; build D_B, verify its roots, run the resultant tower at arity 3 and 4
      for 10^4 random targets with X_B and with mu_{B''}; charge every F_p and F_{p^2} multiplication.'
    controls:
    - mu_B base at matched size (wave-1 record) on the same or a neighbouring prime.
    - Random subset of the x-line of size B with the same tower (yield baseline).
    - Root check that D_B splits completely over F_p.
    required_metrics:
    - factors and cofactor status of (p + 1)/16
    - relations per charged multiplication for X_B, mu_B and the random control
    - membership cost in F_p multiplications for both bases
    - number of F_p roots of D_B
  falsification_conditions:
  - D_B fails to split completely over F_p on a verified instance (theory error; invalid run).
  - X_B yield per charged multiplication is below 0.5 of the mu_B yield at matched B (the base is not
    random-like, itself worth a record).
  - Part A finding no divisor in [2^40, 2^80] does not falsify the mechanism; it closes deployability
    on secp256k1 and is recorded as such.
  confounders:
  - Different primes for X_B and mu_B arms change the N/B ratio; normalise yield by B^m/N.
  - The random-subset control has no algebraic membership; compare yields only, not membership cost.
  interpretation_limits:
  - Exponent is that of the mu_B lane: at least 1 unless the joint-solve exponent e_k of that lane moves.
      This record widens deployability only.
  - The classification covers subgroup-cut bases on the x-line; unions of cosets and non-group predicates
    are outside it.
  heuristic_assumptions:
  - id: H1
    statement: Zeros of S_{m+1} on X_B^k are as frequent as on a random subset of the same size.
    rigorous_support: Weil-type bounds give this only for B above p^{1/2}; below that it is the same heuristic
      the mu_B lane uses.
    validation_plan: Part B random-subset control at two sizes of B.
  target_complexity:
    time_exponent: as the mu_B lane, at least 1 in log_N units without a joint-solve gain; 1/2 is the
      comparator
    memory_exponent: B for the relation matrix
    best_known: Pollard rho, Theta(sqrt N) group operations
    hidden_overhead: F_{p^2} membership arithmetic, about 3 F_p multiplications per squaring step.
    tradeoff_note: Same large-prime extension as the mu_B lane via B | B' | p + 1.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: KR-IC-5931ee dominates any exponent reading. The wave-1 mu_B record is the sibling; neither
    it nor any row lists the p + 1 torus family.
