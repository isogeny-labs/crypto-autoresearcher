idea:
  id: IDEA-20261109-2f2a97
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Norm-one torus factor base X_B for B | p + 1 is the second and last algebraic-subgroup factor
    base on the x-line over F_p, with a Dickson membership polynomial of degree B - 1 and a deployability
    test by factoring (p + 1)/16 for secp256k1
  class: relation_collection
  claim: 'Classification: a connected one-dimensional algebraic group over F_p whose underlying variety
    is an open subset of P^1 is G_a, G_m or the nonsplit torus T_2 (forms of G_a over perfect fields are
    trivial, tori of dimension one are classified by H^1(Gal, Z/2)). Finite subgroups of F_p-points: none
    for G_a (p prime), mu_B for B | p - 1, and a cyclic group of order B for each B | p + 1. The Carlitz-torsion
    (additive) family is therefore empty on F_p, and the complete list of subgroup-cut factor bases on
    the x-line is mu_B (wave-1 relations record) together with X_B defined here. With iota^2 = d a non-residue,
    x -> (x + iota)/(x - iota) is a bijection P^1(F_p) -> T_2(F_p) and the order-B subgroup pulls back
    to X_B = {infinity} union the roots of D_B(x) = ((x + iota)^B - (x - iota)^B)/(2 iota) in F_p[x],
    degree B - 1, all roots in F_p and distinct. Membership costs log2 B multiplications in F_{p^2}. Predictions:
    (1) the wave-1 resultant tower with gcd against D_B in place of X^B - 1 yields relations per charged
    F_p multiplication within a factor 1.3 of the mu_B base at matched B on calibration primes; (2) (p
    + 1)/16 = 2^252 - 2^28 - 61 for secp256k1 is factored by ECM to decide whether a divisor B in [2^48,
    2^70] exists, which p - 1 = 2*3*7*13441*q_233 (recalled) does not provide. No exponent moves.'
  mechanism: The function-field angle asks which analogue of Carlitz torsion survives on a prime field.
    Additive torsion dies with the subgroup lattice of F_p; what survives is the torsion of the two tori.
    The split torus gives mu_B and is already filed; the nonsplit torus is rationally parametrised by
    the x-line with punctures at the conjugate pair plus or minus iota, so its subgroups are the roots
    of a Dickson-type polynomial over F_p. Everything the mu_B lane does with X^B - 1 (algebraic membership,
    resultant tower, large-prime extension with B | B') transfers with D_B, at the price of F_{p^2} membership
    arithmetic and the loss of the j = 0 weight-3 symmetry.
  novelty_status: adaptation
