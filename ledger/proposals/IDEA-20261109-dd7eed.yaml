    memory_exponent: unchanged
    best_known: Pollard rho, Theta(N^{1/2}) (KR-RHO-13bf67)
    hidden_overhead: none claimed; descent here is polynomial and yields no bit of k
    tradeoff_note: Barrier record; delta 0.
