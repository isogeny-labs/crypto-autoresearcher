idea:
  id: IDEA-20261109-8a3bc8
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Unit-sibling curves of a j = 0 prime-order curve over six primes q_u = Nm(1 + (pi - 1)u) have
    group order exactly N, and every compatible transfer between them is a torsor under (O_K/n)^*
  class: transfer
  claim: 'Let E, y^2 = x^3 + b over F_p with p = 1 mod 3, have prime order N, so End(E) = Z[omega] = O_K,
    Frobenius pi in O_K, Nm(pi) = p, n = (pi - 1) of norm N. For u in mu_6 put pi_u = 1 + (pi - 1)u and
    q_u = Nm(pi_u). (A, exact) If q_u is prime, exactly one sextic twist E_u of y^2 = x^3 + b over F_{q_u}
    has Frobenius pi_u, and #E_u(F_{q_u}) = Nm((pi - 1)u) = N; E(F_p) and E_u(F_{q_u}) are both O_K/n
    as O_K-modules. u = 1 gives q_1 = p, u = -1 gives q_{-1} = p - 2t + 4. (B, theorem) The O_K-module
    isomorphisms E(F_p) -> E_u(F_{q_u}) form a torsor under (O_K/n)^* = (Z/N)^*. The geometric ones, reduction
    of the global n-torsion of y^2 = x^3 + b over the ray class field K_n at primes above p and above
    q_u, form a sub-torsor under Gal(K_n/K) = (O_K/n)^*/mu_6 indexed by the prime choice. No rule computable
    without the discrete log selects a compatible map, otherwise the ECDLP on E would reduce to the ECDLP
    on E_u with a known scalar correction and, for the anomalous sibling of the companion control record,
    to a polynomial-time problem, against KR-RHO-13bf67. (C, pre-registered) For secp256k1 no sibling
    with u != 1 is anomalous or has ord_N(q_u) <= 12, so even a free map would be exponent-neutral. This
    record files the order certificate and the torsor theorem and claims no exponent change.'
  mechanism: Lenstra's isomorphism E(F_p) = O_K/(pi - 1) (recalled) depends on the ideal (pi - 1), not
    on pi. Multiplying pi - 1 by a unit keeps the ideal and the group but moves the Frobenius element,
    hence the prime q_u = Nm(1 + (pi - 1)u) and the field. Any isomorphism between the two reductions
    factors through the n-torsion in the ray class field, whose Galois group is the full scalar group
    modulo mu_6; picking a prime above p and one above q_u is picking a scalar. Cross-characteristic analogue
    of KR-RHO-755e35, the realisation exists, the order is automatic, the map carries the log.
  novelty_status: adaptation
