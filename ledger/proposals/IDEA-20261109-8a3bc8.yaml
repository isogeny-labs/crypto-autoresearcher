    memory_exponent: O(1)
    best_known: Pollard rho, Theta(N^{1/2}) group operations, KR-RHO-13bf67
    hidden_overhead: None, the record proposes no algorithm.
    tradeoff_note: Even a free compatible map lands on a 256-bit prime-order curve of generic embedding
      degree.
