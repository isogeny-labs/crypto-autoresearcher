    claim: Designer freedom over F_p is the isogeny class; siblings lie outside it and outside F_p.
    verified_by: brief section 2 index line, read 2026-11-09
  assumptions:
  - N prime, p = 1 mod 3, b not a cube or square class making E have 3-torsion; the test rechecks N prime
    and recomputes t = p + 1 - N.
  - The six twists over F_{q_u} are enumerated as b_u = b * c^i for c a sextic non-residue mod q_u.
  proof_search_map:
    not_applicable_reason: Order certificate plus a torsor theorem, no exponent claim.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
  - metric: max over toy curves and prime q_u of abs(#E_u(F_{q_u}) - N) for the selected twist
    direction: lower
    minimum_effect: exactly 0 on every instance
  - metric: min over u != 1 with q_u prime of ord_N(q_u), secp256k1
    direction: higher
    minimum_effect: greater than 12, certified from the factored part of N - 1
  - metric: number of u != 1 with q_u = N, secp256k1
    direction: lower
    minimum_effect: exactly 0
  minimal_test:
    design: Sage. Toy arm, for each j = 0 prime-order curve with p = 1 mod 3 and p <= 2^24 in crypto/docs/ECDLP_CALIBRATION_PRIMES.md
      (construct 30 if fewer exist), solve 4p = (2a - b)^2 + 3b^2 for pi = a + b omega consistent with
      t, form the six q_u, test primality, enumerate the six twists over each prime q_u and count points
      exhaustively, record which twist has order N. secp256k1 arm, compute pi from p and t, the six q_u,
      Miller-Rabin, select the twist with [N]P = O on 20 random points, factor N - 1 with PARI (trial
      division to 2^30 plus ECM, 30 min cap), report the factored part and the implied lower bound on
      ord_N(q_u).
    controls:
    - Non-CM toy prime-order curve with random (a, b), report that no unit sibling exists (End not Z[omega]),
      construction is CM-specific.
    - Sextic twists over F_p of the same E, orders Nm(pi u' - 1), listed beside the siblings to show same
      field different order versus different field same order.
    required_metrics:
    - pi as a + b omega
    - q_u for all u, primality flags
    - selected twist index and
    - factored part of N - 1 and ord_N(q_u) lower bound
    - q_u == N flag
  falsification_conditions:
  - A prime q_u with no twist of order N on any toy instance, claim A false.
  - A secp256k1 sibling with q_u = N or ord_N(q_u) <= 12, claim C false, priority of the anomalous-sibling
    control rises.
  - A poly(log p) rule producing a compatible map on toy curves whose recovered scalar equals k on more
    than 6/(N - 1) plus 3 sigma of 300 instances, claim B false, treated as an implementation error first.
  - Timeouts in factoring N - 1 are infrastructure, report the partial bound.
  confounders:
  - Composite q_u are skipped; the fraction prime is reported, not predicted.
  - Twist selection by [N]P = O on random points fails only if two twists share order N, which point counting
    at toy size excludes.
  interpretation_limits:
  - A verified sibling table is an arithmetic fact about CM curves, not an attack surface.
  - Claim B is proved for O_K-module maps; set maps that are not homomorphisms are outside the theorem
    and outside transfer.
  heuristic_assumptions:
  - id: H1
    statement: For secp256k1 at least one q_u with u != 1 is prime.
    rigorous_support: Heuristic density 1/ln q about 1/177 per candidate; may fail, in which case claim
      C is vacuous and reported so.
    validation_plan: Miller-Rabin on the five candidates in the secp256k1 arm.
  target_complexity:
