  minimal_test:
    design: >-
      For each (d, r) build 20 random module-LWE q-ary lattices (q=3329, CBD(2)). Run scalar
      progressive BKZ (fpylll) and module-BKZ (a SageMath prototype per Lee-Pellet-Mary-Stehle-Wallet
      module-LLL with enumeration-based module-SVP) until the measured profile slope reaches
      the same target; count operations.
    controls:
    - >-
      null: unstructured lattice of the same dimension where module-BKZ is run on a fake module
      basis (block-diagonal grouping without ring structure) - the module algorithm's advantage,
      if any, must vanish
    - >-
      positive: d=1 (Z-modules) where module-BKZ equals scalar BKZ and the ratio must be 1
      within noise
    - 'A/A: scalar BKZ run twice with different basis-randomization seed blocks'
  falsification_conditions:
