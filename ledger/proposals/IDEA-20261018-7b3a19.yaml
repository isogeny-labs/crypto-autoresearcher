  title: >-
    Module-BKZ versus scalar BKZ in total counted operations at equal output profile, rank
    2-3 modules over degree 8-32 cyclotomics
  class: measurement
  claim: >-
    At module rank 2 and 3 over Z[X]/(X^d+1), d in {8,16,32}, module-BKZ (module-LLL plus
    module-SVP oracles) reaches the same measured log-profile slope as scalar BKZ at a total
    counted cost (SVP-oracle node or sieve pair counts plus size-reduction ring multiplications)
    that is either at least 2x lower (structure is a liability) or at least 2x higher (structure
    is a cost to the attacker). The claim is that the sign is determinable at these sizes
    with 20 instances per cell and is not inside the A/A noise.
  mechanism: >-
    IDEA-20260829-353361 measures the blocksize offset Delta(d,r) at equal slope. A blocksize
    offset does not by itself fix cost: module-BKZ operates on d-times smaller matrices over
    the ring (fast NTT multiplication), uses fewer but larger SVP calls, and the module-SVP
    oracle can exploit the ring automorphisms inside the block. Those terms can offset a positive
    Delta, or compound it. Only a total-cost measurement at matched output decides which.
  tracked_object: >-
    Total counted cost (enumeration nodes or sieve pair tests, plus ring/integer multiplications
    in size reduction) to reach target root-Hermite slope, module-BKZ divided by scalar BKZ.
