  assumptions:
  - The toy curve has prime order N so that the log table is a bijection.
  - Pairs with P equal to plus or minus Q are excluded and counted.
  predictions:
  - metric: abs(P(|D| <= 0.01) - 0.010) for h = x/p
    direction: lower
    minimum_effect: at most 0.003
  - metric: mass of the atom at D = 0 for the DL height k/N
    direction: higher
    minimum_effect: at least 0.49
  - metric: mass of the atom at D = 0 for h = x/p
    direction: lower
    minimum_effect: at most 100/p
  minimal_test:
    design: Pick the smallest prime-order calibration curve above 2^19 from crypto/docs/ECDLP_CALIBRATION_PRIMES.md.
      Build the log table by N successive additions. Sample 10^6 uniform pairs. Compute D for h1 = x/p,
      h2 = y/p, h3 = (least absolute residue of x)/p, h4 = k/N. Histogram with bin 0.01; record atoms,
      D_max, spread H, and the Kolmogorov distance to the three-uniform law.
    controls:
    - Simulated U3 - U1 - U2 with the same sample size.
    - Integer control, pairs (a, b) uniform in [1, N/4) with h = a/N, defect exactly 0, confirming the
      atom reading of the instrument.
    required_metrics:
    - p
    - N
    - sample size
    - spread H and D_max for each h
    - P(|D| <= 0.01) for each h
    - atom masses at 0 and at -1 for each h
    - Kolmogorov distance to the three-uniform law for h1 and h3
  falsification_conditions:
  - 'For h1 or h3, P(|D| <= 0.01) is at least 0.02, or an atom at 0 of mass at least 100/p appears: the
    coordinate height carries additive structure and the practical reading of the barrier fails.'
  - 'For h4 the atom masses fall outside 0.5 plus or minus 0.01: wrong log table (invalid run) or wrong
    model.'
  - D_max below H/2 for any h contradicts the theorem and marks an implementation error; invalid run.
  - The theorem is not falsifiable by computation; only the measured claims are.
  confounders:
  - Representative choice for x (in [0,p) versus symmetric) changes the law; h3 is included for that reason.
  - Sign convention of y affects h2 only.
  interpretation_limits:
  - Closes deterministic size functions on E(F_p); heights on p-adic or global lifts are out of scope.
  - Does not bound set-based probabilistic relation supply; that is the wave-1 energy and spectral records.
  heuristic_assumptions:
  - id: H1
    statement: The triple (x(P), x(Q), x(P+Q))/p is equidistributed in the unit cube to within p^{-1/2}
      polylog p.
    rigorous_support: Weil-type hybrid-sum bound as stated in the wave-1 hybrid-sum record; not re-derived
      here.
    validation_plan: The histogram and Kolmogorov metrics of the minimal test.
  target_complexity:
    time_exponent: p^{1/2} unchanged, delta 0
    memory_exponent: O(N) log table at toy size only
    best_known: Pollard rho in Theta(p^{1/2}) (KR-RHO-13bf67); naive Semaev over F_p not below generic
      (KR-IC-5931ee)
    hidden_overhead: None; no algorithm is proposed.
    tradeoff_note: A barrier record; no tradeoff is defined.
