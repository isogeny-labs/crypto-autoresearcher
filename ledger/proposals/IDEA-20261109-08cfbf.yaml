idea:
  id: IDEA-20261109-08cfbf
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'No bounded-defect height on E(F_p): every D-quasi-additive size function on a finite group is
    bounded by D, so a smoothness-style point sieve cannot exist, with a toy defect-histogram measurement'
  class: barrier
  claim: 'Theorem (zero compute). Let G be a finite group and h a real-valued function on G with |h(ab)
    - h(a) - h(b)| <= D for all a, b. Then |h(g)| <= D for every g. Proof: |h(g^n) - n h(g)| <= (n-1)
    D by induction; take n a multiple of ord(g) so h(g^n) = h(e) with |h(e)| <= D; divide by n and let
    n grow. Consequence: a size function on E(F_p) with spread H = max h - min h has defect at least H/2,
    so the defect-zero log-norm that integer and function-field sieves rest on has no analogue on points,
    and any relation collector of the shape "small points whose sum is small" is a statement about a set,
    measured by the energy and spectral records already filed. Measured claim, falsifiable: at p about
    2^20, for h = x(P)/p the defect D(P,Q) = h(P+Q) - h(P) - h(Q) over uniform pairs follows the law of
    U3 - U1 - U2 for independent uniforms (probability of |D| <= 0.01 equal to 0.010 within 0.003, no
    atom at 0), while for the discrete-log height h = k/N (k the least residue of the log) the law is
    two atoms of mass 1/2 at D = 0 and D = -1, the theorem''s bound attained. No exponent moves.'
  mechanism: Index calculus in Z or F_q[x] needs a height with defect zero on the ring and positive density
    of small elements; relations exist because sums of small things stay small. On a torsion group every
    quasi-additive function is bounded by its defect, so smallness cannot be preserved under addition.
    The measurement asks whether the forced failure is concentrated (the DL height fails exactly on wrap-around
    pairs, measure 1/2) or diffuse (coordinate heights fail everywhere, with no additive structure at
    all). Either way the sieve step of NFS has no port to E(F_p). The theorem also covers maps into Z
    or R with bounded defect, extending the algebraic-group exit maps of IDEA-20260727-005 to non-algebraic
    quasi-homomorphisms.
