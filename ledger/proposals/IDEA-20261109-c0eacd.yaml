  id: IDEA-20261109-c0eacd
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Every realization of the 1-motive of a point on a prime-order curve over F_p is split except
    at ell = N, where it is the Tate pairing; a lift-count table separates the three p-adic regimes
  class: representation
  claim: 'Let M_P = [Z -> E, 1 -> P], E/F_p of prime order N. For ell != p the ell-adic realization is
    an extension of Z_ell by T_ell E with class in H^1(F_p, T_ell E) = T_ell E/(F-1), a group of order
    ell^{v_ell(N)} because det(F-1) = N; the crystalline (Dieudonne) realization has class in D/(F-1)D
    of order p^{v_p(N)}; the de Rham realization is split by the unique order-N section of E^nat(F_p).
    Hence for p != N every additive cohomological invariant of P vanishes except the ell = N Kummer class,
    whose computation in any basis is the Tate pairing in F_{p^k}, k = ord_N(p). Measurable form: L(P),
    the number of lifts of P in Etilde(Z/p^2) of order dividing N, equals 1 for all P when p != N; on
    anomalous toy curves it equals 0 for P != O on a non-canonical lift (Smart''s map is the nonzero class)
    and p for all P on the canonical lift (class zero). Non-additive invariants are not excluded; they
    are the fibre coordinates of the sibling records.'
  mechanism: Z/N has no nonzero homomorphism into a Z_p-module, a W-module or a pro-ell group with ell
    != N, and every realization functor is additive on 1-motives, so it kills P. The exception ell = N
    exists because F - 1 has determinant N on T_N E. The slope-0 part of H^1_cris is T_p E with unit-root
    eigenvalue u and v_p(u - 1) = v_p(N), so the Newton polygon places the crystalline class in a group
    of order p^{v_p(N)}. Buium delta-characters of any order, Coleman logarithms, Bloch-Kato classes and
    Hodge-Tate periods are additive into Z_p-modules and are covered. The lift count L(P) is the integral
    shadow of these statements and distinguishes the three regimes with one computation.
