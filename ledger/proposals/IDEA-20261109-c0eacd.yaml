  minimal_test:
    design: For 20 prime-order curves from crypto/docs/ECDLP_CALIBRATION_PRIMES.md and the wave-1 anomalous
      j = 0 toy curves, enumerate the p lifts Ptilde + R, R in Etilde_1(Z/p^2), of each P and count those
      with [N](Ptilde + R) = O in Etilde(Z/p^2). Tabulate alongside the orders ell^{v_ell(N)} for ell
      in 2,3,5,p,N computed from the trace. The ell = N positive arm is the already filed transfer-wave
      embedding-degree-1 record and is cited, not rerun.
    controls:
    - A toy curve of order p m, m prime, as the gcd control.
    - Two lifts per curve, naive and perturbed, to show L(P) is lift-independent when p != N.
    required_metrics:
    - L(P) histogram per curve and lift
    - v_p(N), ord_N(p) where feasible
    - ell-part orders table
  falsification_conditions:
  - Any p != N curve with L(P) != 1 at any point.
  - An explicit additive map from E(F_p) to a Z_p-module or to F_p that is nonzero on a p != N curve;
    a proposal of such a map is to be checked for additivity first.
  - Timeouts are infrastructure, not evidence.
  confounders:
  - Order computations in Etilde(Z/p^2) must use the full group law including the kernel of reduction.
  interpretation_limits:
  - This is a barrier statement about functorial invariants; it says nothing about non-additive statistics.
  - Toy sizes only; the theorem itself needs no size.
  heuristic_assumptions:
