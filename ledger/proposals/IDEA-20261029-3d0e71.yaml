idea:
  id: IDEA-20261029-3d0e71
  status: proposed
  approved_by: null
  title: Shared divisor coefficients with a Graeffe membership tower
  class: composition
  claim: For suitable p with d=2^k dividing p-1, a shared coefficient tower may reduce complete five-point
    decomposition work relative to per-root PKM towers; no degree or exponent improvement is claimed.
  mechanism: 'R3 effective-divisor coefficients paired with root-squaring; coordinate-dependent. Let E:y^2=f(x),
    R=(r,s), d=2^k|p-1, c=t^d!=0. Take monic cubic A and linear B. Impose A(r)-sB(r)=0, A^2-B^2f=(X-r)U_0,
    U_0 monic degree5, gcd(B,U_0)=1 and U_0(r)!=0. Write U_j(X)=E_j(X^2)+XO_j(X^2); impose U_(j+1)(T)=T O_j(T)^2-E_j(T)^2
    and U_k(T)=(T-c)^5. Five quadratic coefficient equations per layer express simultaneous membership for
    all roots. Recover (xi,-A(xi)/B(xi)) with multiplicity; div(A+By) proves their sum is R. Add squarefree
    U_0 to match the shared quotient comparator X^d=c mod U. Selected-chart coverage is charged. Details and
    proof map are in notes.md. This removes point labels only: known m! symmetry is not an exponent gain.'
  novelty_status: adaptation
  citations:
  - ref: https://people.maths.ox.ac.uk/petit/files/16PKC_primeECDLP.pdf
    provenance: retrieved
    claim: Prime-field multiplicative coset and per-root rational-map tower framework.
    verified_by: Full PDF sections 3.1-3.4 read.
  - ref: https://link.springer.com/article/10.1007/s10817-019-09526-y
    provenance: retrieved
    claim: Known Graeffe root-squaring coefficient transform has a verified implementation.
    verified_by: Primary-paper search extract read; not an ECDLP result.
  assumptions:
  - User requests factor-base/SAT research; execution is not authorized here.
  - Implicit membership is not an asserted escape from KN-OPEN-020.
  proof_search_map:
    bottleneck: Whether root symmetry shared throughout membership removes enough matrix/branch work to offset
      coefficient coupling.
    baseline_embedding:
      parameter_slice: Same relation predicate, established solver.
      reproduction_check: Exact tiny model-set equality.
    observation_collision:
      observable: Cost paired with exact relations.
      distinct_preimage_search: Elliptic and null systems with equal displayed statistics.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Specified in mechanism.
      predicted_gain: Unmeasured.
    quantifier_order: Exists a fixed policy improving held-out declared instances; every relation valid. No
      scaling claim.
    method_ceiling:
      strongest_certifiable_claim: Finite-family solver result.
      nearby_object_control: Matched null without the proposed structure.
    proof_obligations:
    - claim: Exact encoding, pruning and complete accounting.
      responsibility: correctness
  predictions:
  - metric: complete_cost_per_verified_relation
    direction: lower
    minimum_effect: 'Proposed: 2x complete-work reduction on three matched cells; no scaling inference.'
  minimal_test:
    design: Prove correspondence first. Freeze k=3,4 cells with at least five usable distinct x checked separately.
      Compare per-root PKM, symmetric S6, quotient and Graeffe on identical squarefree charts. Keep k=2 only
      as an empty-chart negative control; repeated-root arm separate. Require exact model agreement before
      timing.
    controls:
    - Exact tiny oracle; uniform and separately labelled planted targets.
    - Identical domains, signs, exceptions and setup allowance.
    - Matched algebraic null and known-positive instrument control.
    required_metrics:
    - verified_model_count
    - solving_degree
    - field_operations
    - matrix_rank
    - memory_peak
    - complete_relation_cost
    - chart_coverage
  falsification_conditions:
  - Any missing/spurious relation under declared chart equivalence.
  - After matching permutation multiplicity and root sets, no complete-work improvement.
  - Degree/branch growth merely moves into the coefficient tower or gcd/chart conditions.
  - No suitable divisor d near the desired factor-base size for the actual target prime.
  confounders:
  - Only a permutation-constant gain, or complexity hidden in membership/exception constraints.
  interpretation_limits:
  - Proposal only; no experiment or improvement established.
  - Prime-field scope; regularity, solving degree and work are distinct.
  - Independent relation verification; incomplete means UNKNOWN.
  - An arbitrary interval factor base has no free logarithmic-length product polynomial circuit.
  - Applicable p-1 structure is a restriction on the field, not a weakness proved for every prime curve.
  - Backward Graeffe search still has roughly binomial(d+4,5) multisets absent additional pruning.
  - Initial E(F_p) has prime order; cofactors require explicit subgroup treatment.
  heuristic_assumptions:
  - id: H1
    statement: Held-out generic elliptic norm instances admit cheaper closure than matched per-root systems
      at the same membership size.
    rigorous_support: Coefficient identities are exact; cheaper solving is unproved.
    validation_plan: Compare matched cost and tail distributions against per-root and random norm-system nulls.
  - id: H2
    statement: The selected chart retains a nonvanishing fraction of useful decompositions as d grows.
    rigorous_support: Principal-divisor correctness holds on the chart; coverage is unproved.
    validation_plan: Exact tiny census of uniform-target successes and all excluded chart cases.
  target_complexity:
    time_exponent: Unknown. Cost P+(B/rho)C+soft-O(B^2)+descent. With m=5,B near N^(1/5),constant rho, C=N^gamma
      requires gamma<3/10 to beat sqrt(N). Unachieved.
    memory_exponent: Unknown; charge solver, setup, relation state; rho has small memory.
    best_known: Pollard rho O(sqrt(N)); PDP comparator is best matched exact loop/MITM/solver.
    hidden_overhead: Factor-base construction, failed attempts, chart coverage loss, roots/sign recovery, rank
      independence, preprocessing and descent.
    tradeoff_note: Parallel targets possible; charge setup at actual reuse count.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: Proposed tiny tests only.
