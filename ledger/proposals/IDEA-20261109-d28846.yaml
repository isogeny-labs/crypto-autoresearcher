idea:
  id: IDEA-20261109-d28846
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-9d5d44
  title: Fixed-base X25519 by a right-to-left differential chain at 3M + 2S per bit, exception-free on
    clamped scalars through an order-4 offset
  class: algorithm
  claim: 'Let $P$ be the base point $u = 9$ of prime order $\ell$, $S$ a point of order 4 with $x(S) =
    1$, $P_i = 2^i P$, and $\mu_i = (x(P_i)+1)/(x(P_i)-1)$ for $i = 0,\dots,251$ (public table, 252 field
    elements). For a clamped $k$ put $k'' = k/8$, bits $b_0,\dots,b_{251}$ with $b_{251} = 1$, and $a_i
    = k'' \bmod 2^i$. Maintain $R_A = a_i P + S$ and $R_B = (a_i - 2^i) P + S$, starting from $R_A = (1:1)$
    and $R_B = (x(S-P):1)$. At step $i$ take $R_{sel} = R_A$ if $b_i = 1$, else $R_B$, and $R_{oth}$ the
    other one; with $R_{sel} = (X:Z)$ and $R_{oth} = (X_o:Z_o)$ compute $H_+ = X + Z$, $H_- = X - Z$,
    $m = \mu_i H_-$, $X'' = Z_o (m + H_+)^2$, $Z'' = X_o (m - H_+)^2$, and replace $R_{sel}$ by $(X'':Z'')$.
    After step 251 apply three doublings to $R_A$: $AA = (X+Z)^2$, $BB = (X-Z)^2$, $E = AA-BB$, $X \leftarrow
    AA \cdot BB$, $Z \leftarrow E(AA + 121665 E)$. Claim 1. The result equals x25519_base for every clamped
    scalar. Claim 2. Cost is 252(3M + 2S + 4a) + 3(2M + 2S + 1c + 4a) = 762M + 510S + 3c + 1020a, against
    255(4M + 4S + 2c + 8a) = 1020M + 1020S + 510c + 2040a for the current ladder at $u = 9$, where the
    multiply by $x_1 = 9$ is a small constant. Claim 3. No step meets an exceptional input for any clamped
    scalar.'
  mechanism: '$R_A - R_B = P_i$ at every step. If $b_i = 1$ then $R_A + P_i$ is wanted and $R_A - P_i
    = R_B$ is the known difference; if $b_i = 0$ then $R_B - P_i$ is wanted and $R_B + P_i = R_A$ is the
    known difference. Each bit therefore costs one differential addition whose difference is the untouched
    state point and whose second argument is the table point, scaled so that $(x_i+1 : x_i-1) = (\mu_i
    : 1)$; both outputs pick up the same factor $(x_i-1)^{-2}$. The end value is $k''P + S$ and $8(k''P
    + S) = kP$ because $8S = O$. Completeness. Every state point lies in the coset $S + \langle P \rangle$,
    which contains neither $O$ nor $T = (0,0)$ since $S$ and $S - T$ have order 4. So every difference
    has $x \notin \{0,\infty\}$ and every $Z$ is nonzero. $x(P_i) \neq 1$ because $P_i$ has order $\ell$.
    Using $S + P$ in place of $S - P$ computes $-kP$, same $x$. The select is a masked swap keyed on $b_i
    \oplus b_{i-1}$ with $b_{-1} := 1$; the table index is the public loop counter.'
  novelty_status: unverified
  citations:
  - ref: Oliveira, Lopez, Hisil, Faz-Hernandez, Rodriguez-Henriquez, How to (pre-)compute a ladder, SAC
      2017
    provenance: recalled
    claim: Right-to-left fixed-base ladder at 3M + 2S per bit with a small order offset. Pointer only;
      the formulas above are re-derived in this record, not transcribed.
    verified_by: null
  - ref: aburan28/crypto src/ecc/x25519.rs x25519_base()
    provenance: internal
    claim: x25519_base calls the generic ladder with u = 9.
    verified_by: idea-generator session 2026-11-09 read the excerpt in BRIEF section 1
  assumptions:
  - The scalar is clamped inside the function, as x25519() does today.
  - The table and x(S-P) are generated by a committed script with full affine arithmetic and checked against
    a recomputation.
  predictions:
  - metric: bytewise mismatches against x25519_base
    direction: lower
    minimum_effect: exactly 0
  - metric: field multiplications plus squarings per scalar
    direction: lower
    minimum_effect: 1272 against 2040, excluding the final inversion
  - metric: zero denominators met during the chain
    direction: lower
    minimum_effect: exactly 0 over all tested clamped scalars
  minimal_test:
    design: Sage script gen_r2l_table.sage emits mu_i and x(S-P) and asserts x(P_i) != 1 and S of order
      4. Rust test base_r2l_matches_reference compares against x25519_base on the RFC 7748 vectors, 10000
      seeded random scalars, the scalars with k' = 2^251 and k' = 2^252 - 1, and k = 5l - 1.
    controls:
    - Replace S by the identity (R_A = (1:0)); the chain must hit a zero difference for clamped scalars
      and fail, showing the offset is load-bearing.
    - Corrupt one table entry; the comparison must fail.
    required_metrics:
    - mismatches
    - fe_mul and fe_sq calls per scalar
    - zero-denominator events
    - table size in bytes
  falsification_conditions:
  - Any mismatch against x25519_base on a valid run.
  - Any state point with X = 0 or Z = 0 for a clamped scalar.
  - A count above 762M + 510S + 3c before the final inversion.
  confounders:
  - BigUint multiply by the small x_1 = 9 is cheap, so wall-time gain can be smaller than the M count
    suggests.
  interpretation_limits:
  - Applies to the fixed base only; variable-base X25519 is unchanged.
  - Not a constant-time claim for BigUint arithmetic.
  heuristic_assumptions:
  - id: H1
    statement: An 8 KB public table is acceptable for this crate.
    rigorous_support: None; a deployment choice, not mathematics.
    validation_plan: Report table bytes beside the operation counts.
  target_complexity:
    time_exponent: not applicable, constant-factor formula count
    memory_exponent: not applicable, 252 precomputed field elements
    best_known: Left-to-right ladder, 4M + 4S + 2c per bit at u = 9; Edwards comb methods are outside
      this angle
    hidden_overhead: table generation, one batch inversion offline
    tradeoff_note: 8064 bytes of public constants for 258M and 510S
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  dominated_by: The published technique this re-derives. No ledger record in the BRIEF states it.
  sota_delta: Minus 258M, minus 510S, minus 507c, minus 1020a per fixed-base scalar multiplication against
    the repository ladder; no novelty claimed over the recalled paper.
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: Curve25519 explicit-formula campaign; fixed-base arithmetic, not an ECDLP mechanism.
    none_found_after:
    - BRIEF section 2 ledger index, searched for fixed-base, table
    - BRIEF section 1 excerpt of x25519.rs
