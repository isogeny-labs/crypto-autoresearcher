  minimal_test:
    design: >-
      Reduced ML-KEM with n=64, k=2, q=3329, eta1=eta2=3, d_u=10, d_v=3 so base DFR is ~2^-14
      (calibrated first). Generate 2^30 encapsulations per key for 20 keys, score with both
      rules, keep the top 2^-10, query the simulated oracle, count failures.
    controls:
