idea:
  id: IDEA-20261109-8ab090
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-9d5d44
  title: Dedicated d-free addition on Edwards25519 at 8M + 0c, with exceptional set exactly the rational
    4-torsion coset and exactly 4N exceptional ordered pairs
  class: mechanism
  claim: 'For $P_i=(X_i:Y_i:Z_i:T_i)$ on $-x^2+y^2=1+dx^2y^2$ compute $A=(Y_1-X_1)(Y_2+X_2)$, $B=(Y_1+X_1)(Y_2-X_2)$,
    $C=2Z_1T_2$, $D=2T_1Z_2$, $E=D+C$, $F=B-A$, $G=B+A$, $H=D-C$, $X_3=EF$, $Y_3=GH$, $T_3=EH$, $Z_3=FG$.
    Count: 8M + 0c + 10a (two of the additions are the doublings in C and D); the constant $d$ does not
    appear. Identities: $F=2(X_1Y_2-Y_1X_2)$ and $G=2(Y_1Y_2-X_1X_2)$, so $Z_3=4(X_1Y_2-Y_1X_2)(Y_1Y_2-X_1X_2)$,
    with $x_3=E/G$ and $y_3=H/F$. Exception statement, for any prime $q\equiv 1 \pmod 4$ and non-square
    $d$: $Z_3=0$ if and only if $P_2-P_1\in\{(0,1),(0,-1),(i,0),(-i,0)\}$ with $i^2=-1$. Each $P_1$ has
    exactly 4 exceptional $P_2$, so a curve with N rational points has exactly 4N exceptional ordered
    pairs. On every other pair the output is $P_1+P_2$. On Curve25519 the rational group is cyclic of
    order $8l$, so the set is $E(\mathbb{F}_p)[4]$. For $P_1,P_2$ both of order $l$ the only exception
    is $P_1=P_2$. The identity as $P_1$ is not exceptional unless $P_2$ is 4-torsion.'
  mechanism: This is the dual addition law $x_3=(x_1y_1+x_2y_2)/(y_1y_2-x_1x_2)$, $y_3=(x_1y_1-x_2y_2)/(x_1y_2-y_1x_2)$
    in extended coordinates. Proof of the exceptional set. If $x_1y_2=y_1x_2$ then $(x_2,y_2)=\lambda(x_1,y_1)$,
    and substituting into the curve gives $(\lambda^2-1)(1-d\lambda^2x_1^2y_1^2)=0$. The second factor
    would make $d$ a square, so $\lambda=\pm1$, that is $P_2=P_1$ or $P_2=P_1+(0,-1)$. If $y_1y_2=x_1x_2$
    then $(x_2,y_2)=\mu(y_1,x_1)$, and the curve gives $(1+\mu^2)(1+d\mu^2x_1^2y_1^2)=0$. The second factor
    would make $-d$ a square, impossible since $-1$ is a square, so $\mu=\pm i$, that is $P_2=(\pm iy_1,\pm
    ix_1)=P_1+(\pm i,0)$. The four points form the cyclic subgroup generated by $(i,0)$. The symmetry
    used is the dual law; it buys independence from $d$ and one constant multiply over the unified law
    at 8M + 1c + 9a. The formula is branch-free but not complete, so it is only safe where the difference
    of the operands is provably outside the 4-torsion.
  novelty_status: unverified
  citations:
  - ref: BRIEF section 1 excerpt of src/ecc/ed25519.rs, fn add
    provenance: internal
    claim: Baseline unified addition, 12 fe_mul and 1 fe_inv as written.
    verified_by: this session, by reading the excerpt in the BRIEF
  - ref: Hisil, Wong, Carter, Dawson 2008, dedicated addition for a = -1
    provenance: recalled
    claim: An 8M d-free addition that is not valid for doubling. Pointer only.
    verified_by: none
  - ref: Bernstein and Lange, complete set of addition laws for incomplete Edwards curves
    provenance: recalled
    claim: The dual law and its exceptional divisor. Pointer only.
    verified_by: none
  assumptions:
  - q is congruent to 1 mod 4 and d is a non-square; both hold at p by BRIEF section 0.
  - Inputs are rational points with Z non-zero and T Z = X Y.
  predictions:
  - metric: ordered pairs with Z_3 = 0 minus 4N, per analogue curve
    direction: lower
    minimum_effect: exactly 0
  - metric: non-exceptional pairs whose output differs from the reference sum
    direction: lower
    minimum_effect: exactly 0
  minimal_test:
    design: 'tools/formula_cert/run.sh ed-add-dedicated. (1) Trace count must equal (8M, 0S, 0c, 10a)
      and the trace must contain no constant node. (2) Sage: F, G and Z_3 equal the stated polynomials;
      x_3 and y_3 agree with the unified law modulo the curve ideal. (3) Exhaustive, for every prime q
      in 13, 17, 29, 37, 41, 53 and every non-square d: enumerate all ordered pairs, assert the set with
      Z_3 = 0 equals the set with P_2 - P_1 in the four listed points, assert its size is 4N, and assert
      the output equals the reference sum elsewhere. (4) At p: for an order-8 point P_8 and the base point,
      Z_3 = 0 on B + (B + jP_8) exactly for j in 0, 2, 4, 6.'
    controls:
    - q = 19 and q = 23 (congruent to 3 mod 4), where the point (0,1) must have exactly 2 exceptional
      partners, so the 4-per-point assertion must fail.
    - A square d, where the reported count is allowed to differ and is recorded.
    required_metrics:
    - traced M, S, c, a
    - per curve N, exceptional pair count, set-equality verdict
    - number of curves swept
  falsification_conditions:
  - Any swept curve has an exceptional pair outside the coset or a coset pair with Z_3 non-zero.
  - Any exceptional count differs from 4N.
  - A non-exceptional pair gives a wrong sum.
  - The q congruent to 3 mod 4 control passes the 4-per-point assertion.
  confounders:
  - Small curves with N below 8 make the coset a large fraction of the group; all are still enumerated.
  interpretation_limits:
  - A pair-level statement. It does not license use inside a scalar multiplication without a separate
    argument that the accumulator and table entry never differ by 4-torsion.
  - When 2 d T_2 is cached the unified law is also 8M, so the gain exists only for uncached operands.
  heuristic_assumptions:
  - id: H1
    statement: None; the exceptional set is proved above from the two quadratic-character facts.
    rigorous_support: The two factorisations in the mechanism.
    validation_plan: Exhaustive sweep and the q congruent to 3 mod 4 control.
  target_complexity:
    time_exponent: not applicable, constant-factor field-operation count
    memory_exponent: not applicable
    best_known: 8M dedicated and 8M + 1c unified addition (recalled)
    hidden_overhead: The caller must exclude the exceptional coset.
    tradeoff_note: Trades completeness for one constant multiply and d-independence.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: The unified law with a cached 2 d T_2 operand, which is 8M and complete; this record's
    formula is preferable only for uncached operands or where a d-free trace is wanted.
  sota_delta: 0M against the literature count. One constant multiply fewer than the uncached unified law;
    4 fe_mul and 1 fe_inv fewer than the excerpted add. The delta filed is the exact exceptional count
    4N with a one-command certificate.
  prior_art:
    frontier_map: not_applicable
