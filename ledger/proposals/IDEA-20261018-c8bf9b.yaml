  title: >-
    Weak-key classes under boosted ciphertexts: per-key DFR upper tail at reduced n and the
    queries needed to recognise a weak key
  class: measurement
  claim: >-
    Among 10^4 reduced-n keys, the top 1% by measured DFR have DFR at least 4x the median
    when ciphertexts are boosted, and the weak-key property is detectable after observing
    at most 2^10 boosted decapsulations per key (sequential test), giving a multi-key attack
    whose per-key query cost is below single-key cost by the factor of the tail. If the per-key
    DFR distribution is concentrated within the A/A band, weak keys do not exist at this scale.
  mechanism: >-
    Failure depends on x and y through cancellation in x r2 - r1 y; keys whose supports align
    with RM block boundaries or have high autocorrelation yield heavier e' in particular blocks.
    Boosting magnifies per-key differences. A multi-key adversary spends queries on many keys
    and stops on those that fail early.
  tracked_object: Per-key DFR distribution under boosted ciphertexts and sequential-test detection
    cost.
