  title: >-
    Measured success curve P(beta) of progressive primal attacks on Kyber-shaped instances
    versus the Postlethwaite-Virdia simulator
  class: measurement
  claim: >-
    On Kyber-shaped primal instances (module rank 2, ring degree 32-48, q=3329, CBD(2)), the
    empirical success probability P(beta) of progressive BKZ/G6K rises over a window of width
    >= 6 block sizes from 10% to 90%, and the Postlethwaite-Virdia probabilistic simulator
    predicts the median within 2 block sizes while the 2016 estimate is biased by >= 3. If
    the window is < 3 wide, the step-function convention is empirically adequate at this scale.
  mechanism: >-
    Core-SVP prices a single block size assumed to succeed. The success event depends on the
    projected norm of the planted vector, a random variable whose spread gives a smooth P(beta).
    The expected cost under a progressive strategy is a sum over P(beta) increments, which
    can be cheaper or dearer than the step convention. PV21 model this; the measurement checks
    it on module-structured, CBD instances rather than LWE with Gaussian error.
  tracked_object: Empirical CDF of the success block size beta* over 200 instances per parameter
    set.
  novelty_status: unverified
  novelty_note: >-
    No novelty screen has run. kb citations were opened by the drafting session; recalled
