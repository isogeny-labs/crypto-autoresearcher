  minimal_test:
    design: >-
      Generate exponent hints as in F1 (eps = 0); run estimator; measure beta_meas by increasing
      BKZ block size until recovery.
    controls:
    - >-
      null: hints from an independent key (estimator predicts no gain; measured gain must
