  title: >-
    Known-plaintext ciphertexts as extra, much noisier MLWE samples on s: measure that they
    do not lower primal beta (control)
  class: control
  claim: >-
    For a known (m, ciphertext) pair, v - Decompress(m) = s^T u + noise, so each ciphertext
    yields n extra MLWE-like samples on s with noise std around 40 (from e^T r, s^T e1, e2
    and d_v rounding) against sigma ~1 for the public key. Adding up to 16 such ciphertexts
    to the primal embedding lowers measured beta* by < 1 at n=64, k=2. A drop >= 3 would falsify
    the claim and reveal an unpriced known-plaintext flank.
  mechanism: >-
    A primal attack benefits from extra samples only if their noise-to-modulus ratio is comparable
    to existing samples. Ciphertext-derived samples have noise roughly 40x larger, so their
    rows add volume nearly as fast as they add constraint; the optimal embedding should ignore
    them. This is a falsifiable sanity bound that every key-recovery-from-traffic claim should
    cite.
  tracked_object: >-
    beta* of the primal attack with 0, 1, 4, 16 known-plaintext ciphertexts appended (weighted
    optimally), plus the measured noise std of the derived samples.
