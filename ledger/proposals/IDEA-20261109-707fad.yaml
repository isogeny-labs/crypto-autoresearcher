      provenance: internal
      relation: adjacent
      delta: Same solver family, different field; the row's gain rests on XOR reasoning that F_p encodings
        cannot use.
    - ref: KR-IC-e847d1
      provenance: internal
      relation: orthogonal
      delta: Crossbred targets sparse Boolean quadratic systems; a bit-blasted F_p circuit is neither
        sparse nor quadratic.
