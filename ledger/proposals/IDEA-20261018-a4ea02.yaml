  title: >-
    Multilevel amortised Gaussian elimination re-measured: Prange and Stern with and without
    pivot reuse at reduced sublinear weight
  class: measurement
  claim: >-
    On reduced instances in the sublinear-weight regime (n in {251, 509}, w ~ sqrt(n)), reusing
    partial pivots across iterations reduces counted bit-operations per iteration by at least
    2^3 for Prange and by at least 2^1.5 for Stern relative to fresh elimination, and the
    overall speedup lies within 1 bit of KN-LIT-7565's branching-process prediction.
  mechanism: >-
    In sublinear weight, ISD iterations are cheap except for Gaussian elimination; reusing
    pivots across overlapping information sets amortises elimination. The branching-process
    analysis predicts how many pivots survive; measuring at reduced n tests the constants
    that matter for HQC estimates.
  tracked_object: Counted bit operations per iteration and total, with/without MAGE.
