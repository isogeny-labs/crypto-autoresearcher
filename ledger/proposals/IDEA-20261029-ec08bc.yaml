idea:
  id: IDEA-20261029-ec08bc
  status: proposed
  approved_by: null
  title: Complete chart-local saturation before expensive closure
  class: algorithm
  claim: Determine whether exceptional denominator components, rather than the genuine decomposition component,
    account for a material part of solving cost in the exact prime-field encoding.
  mechanism: R1 affine or R3 divisor equations, coordinate-dependent under chart restriction and exact saturation.
    Let h be a chosen addition denominator, subresultant pivot or norm recovery denominator. Split h=0 versus
    h!=0 and solve I:h^infinity on the latter using checkable identities h^e g=sum a_i f_i. Retain and charge
    the h=0 branch with complete projective/doubling/infinity formulas. Compare the same partition solved by
    plain substitution, inverse-variable Rabinowitsch equations and certified localized closure. The delta
    from prior guarded PRS is whether full closure cost improves with complete chart coverage and whether reusable
    saturation certificates explain the change. More redundant equations alone do not qualify.
  novelty_status: adaptation
  citations:
  - ref: IDEA-20260906-69b3fc
    provenance: internal
    claim: Guarded PRS and run references exist; actual artifacts need reconciliation.
    verified_by: Root current ledger audit; run claims not independently reviewed.
  - ref: https://eprint.iacr.org/2016/704
    provenance: retrieved
    claim: High-saturation graph PDP constructions are prior art; not a proven exponent improvement.
    verified_by: Primary abstract read.
  assumptions:
  - User requests factor-base/SAT research; execution is not authorized here.
  - Implicit membership is not an asserted escape from KN-OPEN-020.
  proof_search_map:
    bottleneck: High-degree consequences supported on excluded components, and the total cost of preserving
      all exceptional branches.
    baseline_embedding:
      parameter_slice: Use identical relation predicate with the established solver.
      reproduction_check: Exact model sets including sign and exception conventions at smallest sizes.
    observation_collision:
      observable: Cost paired with exact relations.
      distinct_preimage_search: Elliptic and null systems with equal displayed statistics.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Specified in mechanism.
      predicted_gain: Conditional; not measured.
    quantifier_order: Exists a fixed policy improving held-out declared instances; every accepted relation
      valid. No universal scaling claim.
    method_ceiling:
      strongest_certifiable_claim: Finite-family solver result.
      nearby_object_control: Matched null without the proposed structure.
    proof_obligations:
    - claim: Exact encoding, pruning and complete accounting.
      responsibility: correctness
  predictions:
  - metric: complete_chart_union_solve_cost
    direction: lower
    minimum_effect: 'Proposed screen: 2x cheaper than unsaturated exact baseline with identical recovered solution
      set.'
  minimal_test:
    design: Locate and review referenced PRS artifacts before new work. Then freeze an exhaustive small chart
      census containing generic additions, equal-x, doubling, infinity and norm-denominator zero cases. Require
      exact chart-union model equality and independently checked saturation certificates before timing.
    controls:
    - Exact tiny oracle; uniform and separately labelled planted targets.
    - Identical domains, signs, exceptions and setup allowance.
    - Matched algebraic null and known-positive instrument control.
    required_metrics:
    - verified_model_count
    - actual_solving_degree
    - field_operations
    - matrix_rows_columns_rank
    - memory_peak
    - total_cost_per_verified_relation
    - exception_coverage
  falsification_conditions:
  - The apparent gain is entirely due to discarded valid relations.
  - High-degree closure remains on the generic saturated component.
  - Exceptional-branch or saturation-certificate construction costs cancel the gain.
  - Only the equation count improves; pivot ranks and full solve cost do not.
  confounders:
  - A lower first-fall degree or lower equation degree being mistaken for lower solving cost.
  - Selected targets or omitted chart cases making the candidate easier.
  interpretation_limits:
  - Proposal only; no experiment or improvement established.
  - Prime-field scope; regularity, solving degree and work are distinct.
  - Independent relation verification; incomplete means UNKNOWN.
  heuristic_assumptions:
  - id: H1
    statement: For the declared encoding, exceptional components cause a nonvanishing portion of high-degree
      matrix work while their complete branch cost is smaller.
    rigorous_support: Saturation and disjoint chart union are exact algebraic operations; no theorem assigns
      the work to those components.
    validation_plan: Compare complete degree/rank traces per chart and the unsplit system, retaining worst-case
      exceptional tails and exact solution counts.
  target_complexity:
    time_exponent: Unknown. Cost P+(B/rho)C+soft-O(B^2)+descent. With m=5,B near N^(1/5),constant rho, C=N^gamma
      requires gamma<3/10 to beat sqrt(N). Unachieved.
    memory_exponent: Unknown; charge solver, setup, relation state; rho has small memory.
    best_known: Pollard rho O(sqrt(N)); PDP comparator is best matched exact loop/MITM/solver.
    hidden_overhead: Factor-base construction, failed attempts, chart coverage loss, roots/sign recovery, rank
      independence, preprocessing and descent.
    tradeoff_note: Parallel targets possible; charge setup at actual reuse count.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: Tiny proposed discriminating tests; no budget granted.
  prior_art:
