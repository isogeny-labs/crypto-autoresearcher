    verified_by: frontier map excerpt in REPO BRIEF 2026-11-09 section 3
  assumptions:
  - Lenstra's module isomorphism E(F_p) = O_K / (pi - 1) with omega acting as lambda, as used in the wave-1
    port record; the normalisation is to be taken from RESEARCH_SECP256K1_CM.md.
  - Tate-Shioda holds for the twisted Delsarte-type surface (recalled).
