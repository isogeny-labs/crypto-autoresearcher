  predictions:
  - metric: fraction of section pairs whose DL equals the Z[omega] ratio mod N
    direction: higher
    minimum_effect: equals 1 on all pairs admitting a relation
  - metric: number of distinct pairwise DL classes over sections with deg x <= 2
    direction: lower
    minimum_effect: at most 130 for every tested (p, b)
  - metric: L-polynomial rank minus independent sections found
    direction: different
    minimum_effect: equals 0 on at least 95 percent of b
  minimal_test:
    design: 'For p = 1 mod 6, p <= 2^10, choose B with #E(F_p) prime N and compute lambda. Sample 100
      degree-6 b(t) with distinct roots. Compute the L-polynomial of C_b by counting beta^6 = b(t) over
      F_p and F_{p^2} with sextic character sums, extract the twisted eigenpart and the multiplicity of
      (1 - t_E T + p T^2). Enumerate sections with deg x <= 2, deg y <= 3 by solving linear systems in
      Sage, find Z[omega]-relations via the height pairing, specialise at 5 smooth t_0, compute DLs by
      exhaustive enumeration (ground truth only), and compare with (a_1 + b_1 lambda)(a_2 + b_2 lambda)^{-1}.'
    controls:
    - Non-isotrivial control y^2 = x^3 + a(t) x + b(t) with the same degrees, where relations are plain
      integer ratios and no lambda appears.
    - Random-pair control, unrelated points of E(F_p), to confirm the DL oracle.
    required_metrics:
    - p
    - N
    - lambda
    - L-polynomial twisted eigenpart per b
    - sections found per b
    - relation list with (a_i, b_i)
    - agreement count
    - distinct DL classes
  falsification_conditions:
  - A section pair with a relation whose specialised DL is not the stated ratio.
  - More than 130 distinct DL classes from sections with deg x <= 2.
  - Rank from the L-polynomial below the number of independent sections.
  confounders:
  - Constant sections from E(F_p)[torsion] are absent when N is prime; verify.
  - Choice of omega versus omega^2 flips lambda; fix by the audit's normalisation.
  interpretation_limits:
  - Reach of about 130 classes at any p; a barrier, not a method.
  - Larger-degree sections enlarge the norm bound polynomially, never to N.
  heuristic_assumptions:
  - id: H1
    statement: Every relation among low-degree sections is Z[omega]-linear with N(alpha_i) <= 36.
    rigorous_support: Degree bound on morphisms C_b -> E from deg x <= 2; recalled argument.
    validation_plan: Compute all relations and report max N(alpha_i).
  target_complexity:
    time_exponent: N^{1/2} unchanged
    memory_exponent: O(p) toy enumeration
    best_known: Pollard rho, Theta(sqrt(N)) (KR-RHO-13bf67)
    hidden_overhead: None claimed.
    tradeoff_note: Barrier record.
