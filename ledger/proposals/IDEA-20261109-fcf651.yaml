idea:
  id: IDEA-20261109-fcf651
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Isotrivial j = 0 surfaces y^2 = x^3 + b(t): every discrete log between specialised sections
    is the reduction mod (pi - 1) of a small-norm element of Z[omega], and the section rank is read from
    the L-polynomial of the sextic cover'
  class: barrier
  claim: 'Let p = 1 mod 6, E : y^2 = x^3 + B over F_p ordinary with End(E) = Z[omega], G = E(F_p) of prime
    order N, and lambda the GLV scalar with lambda^2 + lambda + 1 = 0 mod N. For b(t) in F_p[t] of degree
    6 with distinct roots, let S_b : y^2 = x^3 + b(t). (i) The Z[omega]-module of F_p(t)-sections of S_b
    has rank equal to the multiplicity of the Frobenius polynomial of E in the omega-twisted eigenpart
    of the L-polynomial of C_b : beta^6 = b(t), computable from sextic Jacobi-type sums over F_p. (ii)
    For sections s_1, s_2 with a relation alpha_1 s_1 = alpha_2 s_2, alpha_i = a_i + b_i omega, and any
    smooth t_0, DL(s_2(t_0) : s_1(t_0)) = (a_1 + b_1 lambda) (a_2 + b_2 lambda)^{-1} mod N. (iii) Among
    all sections with deg_t x <= 2 the number of distinct pairwise DL classes is at most the number of
    alpha in Z[omega] with N(alpha) <= 36, about 130. No exponent change is claimed.'
  mechanism: Over F_p(C_b) the surface becomes the constant curve E, so sections are twisted morphisms
    C_b -> E and the section group is a submodule of Hom(J(C_b), E), a Z[omega]-module because End(E)
    = Z[omega]. Specialisation at t_0 is a Z[omega]-homomorphism to E(F_p), and Lenstra's isomorphism
    E(F_p) = O_K / (pi - 1) sends omega to lambda. Relations therefore specialise to ratios of small-norm
    elements of Z[omega]; the L-polynomial of C_b decides how many independent sections exist but cannot
    change the norm bound, which is controlled by the degree of the morphism.
  novelty_status: adaptation
  citations:
  - ref: KR-RHO-0528e7
    provenance: internal
    claim: The j = 0 automorphism gives only a constant factor; here the same Z[omega] action is the only
      structure surviving specialisation.
    verified_by: frontier map excerpt in REPO BRIEF 2026-11-09 section 3
  - ref: IDEA-20260805-e5dd09
    provenance: internal
    claim: Geometric rank of y^2 = x^3 + b(t) with deg b = 6 is determined by the root pattern; this record
