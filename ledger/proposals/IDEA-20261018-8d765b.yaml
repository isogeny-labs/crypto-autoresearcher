  title: >-
    Grafting-tree fault forgery simulated at reduced h and d: faulty signatures needed for
    a verified universal forgery, by faulted layer
  class: measurement
  claim: >-
    At reduced parameters (h in {8,12}, d in {2,3,4}, w=16, n=16 bytes), a single transient
    fault in the computation of a non-top-layer subtree root causes the parent WOTS+ key to
    sign an attacker-useful wrong root; the number of faulty signatures needed until a grafted
    subtree yields a verified universal forgery is predicted by the WOTS domination count
    and is at most 8 for faults on layer d-2 at w=16. The number grows with layer height in
    a way set by how many signatures reuse the parent one-time key, and an implementation
    that recomputes and compares roots needs zero-false-negative detection to reach parity
    with the unfaulted scheme.
  mechanism: >-
    Upper-layer WOTS+ keys sign the same subtree root every time a signature passes through
    them, so they are used many times by design and expose one fixed chain-position vector.
    A fault that corrupts the root being signed makes that key sign a second value, granting
    the elementwise max of two position vectors. Once the attacker can sign an arbitrary root
    of their own subtree by domination, they graft a fresh subtree and forge for any message.
    The layer chosen sets how often a faulted signature hits the same parent key and therefore
    how many faults are needed.
  tracked_object: >-
    Count of faulty signatures until a verified forgery, per faulted layer, plus the per-fault
    probability that the max-vector dominates a grinding target within 2^24 tries.
