  title: >-
    A defective ExpandA zeroing NTT slots of A leaks s2 in those slots from pk alone: block
    size vs number of bad slots
  class: mechanism
  claim: >-
    R_q splits into 256 slots because q = 1 mod 512. If ExpandA returns A whose NTT-domain
    entries vanish in a set S of slots (a plausible rejection-sampling or buffer-offset bug),
    then t_hat = A_hat s1_hat + s2_hat gives s2_hat exactly in S, and the MLWE instance restricted
    to the complement has dimension (256 - |S|) per polynomial. Measured at toyDSA(64,2,2)
    with true q, key recovery by primal BKZ needs a block size that drops linearly in |S|
    with slope matching the estimator's dimension reduction within 15 percent, and full recovery
    at |S| = n needs no lattice reduction.
  mechanism: >-
    Each zero slot is a linear constraint on s2's NTT coordinates; since s2 is short in the
    coefficient domain, |S| known NTT coordinates of s2 are |S| perfect linear hints on a
    short vector, which DDGR integrates as dimension reduction. The partial-NTT projection
    idea in the lane studies homomorphic images of the verification equation; here the defect
    is in A itself and the leak is from the public key without any signature.
  tracked_object: >-
    BKZ block size to recover (s1, s2) from pk only as a function of the number of zeroed
    NTT slots |S|
