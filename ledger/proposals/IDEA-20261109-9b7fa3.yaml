idea:
  id: IDEA-20261109-9b7fa3
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Variance of Semaev decomposition counts over targets equals the 2m-th spectral moment of the
    factor base, and Holder makes Poisson dispersion the floor: no factor base decomposes targets more
    uniformly than a random one'
  class: barrier
  claim: 'Exact statements, with a zero-compute verification on existing outputs. Let F in E(F_p) be symmetric,
    f = |F|, A the set of logs of F in Z/N, T(xi) the real sum over a in A of e_N(xi a), and r_m(t) the
    number of ordered m-tuples in A^m summing to t. Then r_m(t) equals N^{-1} times the sum over xi of
    T(xi)^m e_N(-xi t), the mean over t is f^m/N, and the variance over t is N^{-2} times the sum over
    xi not 0 of T(xi)^{2m}. By the power-mean inequality and Parseval the variance is at least the mean
    times (1 - f/N)^m (N/(N-1))^{m-1}, with equality if and only if A is a difference set, and at most
    the mean times (max_{xi not 0} T(xi)^2 / f)^{m-1}. Consequences: the fraction of targets with no decomposition
    is at most variance over mean squared, hence controlled by the spectral norm alone; yield boosting
    on a target set only redistributes counts with both the sum and the sum of squares fixed; and no base
    is under-dispersed relative to random. Families ruled out: designs that aim at every target decomposing
    when the mean is below the (max T^2/f)^{m-1} scale, and any claimed uniformity advantage of a structured
    base over a random one.'
  mechanism: The Fourier expansion of the m-fold convolution of 1_A over the cyclic group of prime order
    N gives r_m exactly; the second moment over t is the 2m-th moment of the spectrum by Parseval on Z/N.
    Parseval also fixes the second spectral moment at f(N - f), so Holder bounds the 2m-th moment below
    by (f(N-f))^m/(N-1)^{m-1}, attained only by a flat spectrum, which is the definition of a difference
    set, a log-defined object never realised by a coordinate base. The upper bound replaces all but one
    factor of T^2 by the spectral norm. Chebyshev converts the variance bound into a bound on the zero-count
    fraction. All of this is independent of how r_m is realised algebraically and so prices the descent
    stage for every prime-field index calculus on a symmetric base.
  novelty_status: adaptation
