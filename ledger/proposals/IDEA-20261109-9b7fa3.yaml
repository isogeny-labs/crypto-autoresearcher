  assumptions:
  - F is symmetric so T(xi) is real and signs are absorbed into A.
  - r_m counts ordered tuples; other conventions rescale by known factors.
  predictions:
  - metric: relative error of variance times N^2 against the 2m-th spectral moment
    direction: lower
    minimum_effect: at most 1e-9 for m = 2 and m = 3 after convention reconciliation
  - metric: variance over mean divided by (1 - f/N)^m
    direction: higher
    minimum_effect: at least 1 on every base, random and structured
  - metric: variance over mean for the planted progression base
    direction: higher
    minimum_effect: at least 10 times the random-base value
  minimal_test:
    design: Take the exact spectrum and the decomposition-count histogram produced by the synthesis-wave
      record on the small-x base (read its outputs; reconcile ordered versus unordered and sign conventions),
      compute both sides of the identity and both bounds. If those outputs are unavailable, run one exhaustive
      table at p near 2^18 with an interval base, a mu_B base and 20 random bases of equal size, m = 2
      and 3.
    controls:
    - Random bases of equal size, 20 seeds, expected variance near mean.
    - Planted progression base with a large upper spectral moment.
    - Convention check on a hand-computed N = 31 example.
    required_metrics:
    - f, N, m
    - mean and variance of r_m over all targets
    - 2m-th spectral moment and spectral norm
    - lower and upper bound values
    - zero-count fraction and the Chebyshev bound
  falsification_conditions:
  - Identity failing beyond convention factors kills the stated conventions and the record as written.
  - Variance below the Holder floor is an arithmetic bug; invalid run.
  - A coordinate base within 1e-3 of the floor would be a difference set; report as anomalous for independent
    recheck.
  confounders:
  - Unordered or sign-reduced histograms differ by m! and 2^m factors.
  - Targets in F itself contribute degenerate tuples; include them consistently.
  interpretation_limits:
  - The identity prices dispersion, not solver cost or exponent.
  - Chebyshev is loose; the zero-count bound is an upper bound only.
  heuristic_assumptions:
  - id: H1
    statement: Coordinate bases have spectral norm at the random level, so the upper bound is mean times
      polylog.
    rigorous_support: Theorem only for f above sqrt(p) (Weil); measured at toy size by the wave-1 spectral
      record.
    validation_plan: Read the spectral norm off the same toy outputs.
  target_complexity:
    time_exponent: N^{1/2} unchanged, delta 0
    memory_exponent: O(N) toy table only
    best_known: Pollard rho, Theta(N^{1/2}) (KR-RHO-13bf67)
    hidden_overhead: None; no algorithm is proposed.
    tradeoff_note: Exact identity; no tradeoff defined.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  dominated_by: If IDEA-20260805-a9a95d already states the variance identity, this record reduces to the
    Holder floor, the upper bound and the check.
  sota_delta: Exponent delta 0. Replaces a heuristic second-moment assumption on decomposition counts
    by an exact identity with a provable floor.
