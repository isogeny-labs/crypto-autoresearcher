idea:
  id: IDEA-20261109-e2592b
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Coleman integral of x dx/y between torsion-section lifts equals -2 times the difference of E^nat(Z_p)
    torsion coordinates: the crystalline Abel-Jacobi value of a point in O(log N) ring operations versus
    Theta(p) by Kedlaya'
  class: representation
  claim: 'Etilde/Z_p a lift of an ordinary prime-order E/F_p, Phat, Qhat in Etilde(Z_p)[N] the torsion-section
    lifts at precision p^n, n <= 6, eta = x dx/y. Define c_nat(Phat) := -Lambda_N(Phat)/N in Z/p^n, the
    slope sum of any addition chain in the E^nat(Z/p^n) chart with lambda(R,-R) = 0. Claim A: int_{Qhat}^{Phat}
    eta = -2 (c_nat(Phat) - c_nat(Qhat)) in Z/p^{n-2} for all pairs, and int_{Qhat}^{Phat} dx/y = 0. Claim
    B: c_nat costs O(n log N) operations in Z/p^n while the Coleman side costs Theta(p n) (Frobenius matrix
    plus evaluation of the Monsky-Washnitzer primitives), so the measured time ratio grows linearly in
    p. Consequence: the crystalline Abel-Jacobi coordinate of P is computed fastest by the group law because
    it is the group law; it is a quasi-homomorphism with cocycle -2 lambda, c_nat(k Phat) = k c_nat(Phat)
    + Lambda_k(Phat), and carries no scalar information.'
  mechanism: eta is of the second kind and tau_P^* eta - eta = d(-2 lambda(P, .)) is an algebraic identity
    (the zeta addition theorem with x = wp, y = wp'/2). Coleman primitives respect algebraic exactness
    and are unique up to a constant on a connected curve, so F_eta(P+Q) = F_eta(P) + F_eta(Q) - 2 lambda(P,Q)
    once F_eta has no constant term in t = -x/y at O. F_eta is odd, hence N F_eta(Phat) = 2 Lambda_{N-1}(Phat).
    The same algebra defines the order-N section of E^nat(Z/p^n), whose reduction mod p is the finite-field
    zeta of the sibling record. The crystalline realization of [Z -> E, 1 -> P] relative to Frobenius-fixed
    (torsion) lifts is this pair of integrals; the first vanishes and the second is c_nat.
  novelty_status: unverified
