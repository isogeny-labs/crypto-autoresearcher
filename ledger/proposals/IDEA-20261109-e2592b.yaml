  predictions:
  - metric: agreement digits between the eta integral and -2 times the c_nat difference
    direction: higher
    minimum_effect: at least n - 2 on 50 random pairs at each prime
  - metric: p-adic valuation of the dx/y integral between torsion lifts
    direction: higher
    minimum_effect: at least n - 1
  - metric: slope of log(T_Coleman / T_nat) against log p
    direction: higher
    minimum_effect: 1.0 plus or minus 0.2
  minimal_test:
    design: Six prime-order curves with 10^3 < p < 10^4 from crypto/docs/ECDLP_CALIBRATION_PRIMES.md,
      n = 6. Compute torsion lifts with the wave-1 code; compute c_nat in E^nat(Z/p^n) in plain Python;
      compute Coleman integrals with Sage's p-adic hyperelliptic class on y^2 = x^3 + a x + b. Fix the
      sign of lambda once by the four-point cocycle check on naive non-torsion lifts, int_{A+B'}^{A+B}
      eta - int_{B'}^{B} eta = -2 (lambda(A,B) - lambda(A,B')). Record wall times of both sides per point.
      Script under research/cohomology_zeta_20261109.
    controls:
    - The dx/y integral between torsion lifts must vanish (wave-1 result reproduced).
    - Naive lifts of the same points must violate Claim A by the log of the lift noise, showing the test
      is specific to torsion lifts.
    - The cocycle check on four naive points, fixing and freezing the sign.
    required_metrics:
    - agreement digits per pair
    - valuation of the dx/y integral
    - T_Coleman and T_nat per prime
    - sign used
  falsification_conditions:
  - Disagreement beyond two lost digits on any torsion pair after the single sign normalization kills
    Claim A.
  - A time ratio not growing with p kills Claim B as stated.
  - Sage failing on the model is infrastructure, not evidence.
  confounders:
  - Precision loss in Coleman integrals near the disc of O; keep points away from it.
  - Sage internal normalization of the basis differentials; compare the eta integral only.
  interpretation_limits:
  - Confirmation identifies a crystalline invariant with a group-law quantity; it makes no claim about
    k.
  - Toy p only; the identity itself is size-free.
  heuristic_assumptions:
  - id: H1
    statement: Coleman primitives of second-kind differentials are unique up to a constant and respect
      the algebraic addition identity.
    rigorous_support: Coleman's theory on curves, recalled.
    validation_plan: the cocycle check on naive lifts and the 50-pair agreement at six primes.
  target_complexity:
    time_exponent: N^{1/2} unchanged, delta 0
    memory_exponent: O(p n) on the Coleman side, O(n) on the E^nat side
    best_known: Pollard rho, Theta(N^{1/2}) (KR-RHO-13bf67); Kedlaya Theta(p) and Harvey p^{1/2} for Frobenius
      matrices
    hidden_overhead: none; no algorithm proposed
    tradeoff_note: the invariant costs the same as the point when computed through the group, and far
      more when computed cohomologically.
  estimated_cost:
