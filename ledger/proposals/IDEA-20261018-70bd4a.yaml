  title: >-
    Empirical success model for pruned enumeration in BKZ blocks: the block's shortest vector
    is not uniform on the sphere
  class: algorithm
  claim: >-
    Inside BKZ tours on Kyber-shaped q-ary lattices, the projected coordinates of the block's
    shortest vector are not distributed as a uniform point on the sphere that the GNR pruning
    optimizer assumes; an empirical success model fitted on observed shortest vectors yields
    pruning coefficients that cut enumeration nodes per successful SVP call by >= 20% at block
    size 50-64 at equal success probability. If the empirical distribution passes a uniformity
    test or the node saving is < 5%, the claim is false.
  mechanism: >-
    Extreme pruning computes success probability as the volume of a cylinder intersection
    under a uniform-direction assumption. In BKZ the block basis is already reduced, and the
    found vector's last coordinates are systematically smaller (it is short in the projected
    tail because the head is concave). If the true target concentrates, the optimal pruning
    profile tightens where mass is absent, saving nodes. The model is fitted on one set of
    tours and tested on fresh ones.
  tracked_object: >-
    Enumeration nodes per successful SVP call (and per BKZ tour) under GNR-uniform pruning
    vs empirically calibrated pruning, and the empirical distribution of normalized projected
    coordinates of the found shortest vectors.
