  minimal_test:
    design: >-
      Collect 5000 block SVP solutions from BKZ-50..64 tours on Kyber-shaped lattices (dim
      120-160); fit a parametric model of the normalized coordinate-mass profile; derive pruning
      coefficients by maximizing success/nodes under that model; evaluate on fresh tours.
    controls:
    - >-
      null: random q-ary lattice blocks preprocessed to the same profile but with targets
