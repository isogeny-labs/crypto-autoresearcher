  title: >-
    Certified importance-sampling estimator of HQC's decoding failure rate at reduced n: weight
    tilting with a provable upper bound
  class: tooling
  claim: >-
    At reduced n where direct Monte Carlo sees failures only at DFR >= 2^-24, an importance-sampling
    estimator that tilts the weights of r1, r2, e upward and reweights by the exact likelihood
    ratio of fixed-weight distributions estimates DFRs down to 2^-40 with relative error under
    20%, and its empirical-Bernstein upper confidence bound covers the true value in at least
    95% of replicate runs where the truth is known by direct MC. Where direct MC and IS overlap
    they agree within the A/A band; if they do not, the IS estimator is biased and must not
    be used for extrapolation.
  mechanism: >-
    Failures come from heavy-tailed weight of e' = x r2 - r1 y + e; tilting r1, r2, e weights
    to larger values makes failures common, and the exact ratio of the two fixed-weight hypergeometric-type
    distributions restores unbiasedness. Because weight is the dominant failure driver, the
    tilt captures most variance. A certified bound needs bounded likelihood ratios, which
    holds since weights range over a finite set; empirical Bernstein gives a finite-sample
    upper bound.
  tracked_object: >-
    IS estimate of DFR and its 95% upper confidence bound, versus direct MC estimate, per
    reduced parameter set.
