  minimal_test:
    design: >-
      Implement reduced HQC (n ~ 2000-4000, scaled RM(1,m) inner and shortened RS outer) in
      C; direct MC at parameter sets with DFR 2^-12..2^-24; IS with tilt chosen by cross-entropy
      on a pilot run; compare overlaps and extend to 2^-40.
    controls:
    - 'null: tilt = identity, IS must reduce to MC exactly'
    - >-
      positive: planted weaker decoder (one RS correction fewer) with known higher DFR, IS
      must track the change
    - 'A/A: IS under two seed blocks'
