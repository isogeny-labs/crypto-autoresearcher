idea:
  id: IDEA-20261109-410419
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Universal vectorial extension over F_p: the chord slope is its 2-cocycle, the unique order-N
    section defines a finite-field zeta c(P), and c is predicted to be a generic odd function with no
    scalar content'
  class: representation
  claim: 'E/F_p of prime order N, p > 3, N != p. Model E^nat(F_p) as pairs (P,z) in E(F_p) x F_p with
    (P,z)+(Q,w) = (P+Q, z+w+lambda(P,Q)), lambda the chord slope for P != +-Q, the tangent slope for P
    = Q, and 0 when P = -Q or a summand is O. Claim A (theorem-level, checked numerically): this is an
    abelian group of order pN with a unique subgroup of order N, so c(P) := -Lambda_N(P)/N mod p (Lambda_N
    the slope sum along any addition chain for [N](P,0)) is well defined and satisfies c(P+Q) = c(P)+c(Q)+lambda(P,Q),
    c(-P) = -c(P), c(pP) = Lambda_p(P), and Lambda_k(P) = (2y/k)(d psi_k/dx)/psi_k for odd k < N. Claim
    B (prediction): writing c(P) = y(P) g(x(P)), the interpolation degree of g on the set X of (N-1)/2
    x-values is at least |X|-2, and the hybrid sum max over (a,b) != (0,0) of |sum_k e_p(a c(kP)) e_N(bk)|
    stays below 4 sqrt(N log(pN)). Then c(Q) = k c(P) + Lambda_k(P) is one F_p equation in two unknowns
    and no exponent moves.'
  mechanism: E^nat is the universal extension of E by G_a; its class spans Ext^1(E,G_a) = H^1(E,O_E),
    dimension 1. The de Rham realization of the 1-motive [Z -> E, 1 -> P] is the canonical order-N lift
    s(P) = (P,c(P)). Since gcd(p,N) = 1 the sequence 0 -> F_p -> E^nat(F_p) -> E(F_p) -> 0 splits uniquely,
    s is a homomorphism carrying P and nothing else, and every F_p coordinate of s is a quasi-homomorphism
    with the rational cocycle lambda. The chord slope to a fixed Q counted by IDEA-20261007-fd7c23 equals
    c(P+Q)-c(P)-c(Q); P and -P-Q share one line through Q, so that map is 2-to-1 and N_s = n/2 + 1 for
    odd group order, which forces the filed prediction n - N_s >= 4. E^nat -> E has no regular section,
    so c is not an algebraic map; Claim B says it is not a hidden low-degree one either.
  novelty_status: unverified
