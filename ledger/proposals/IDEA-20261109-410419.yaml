    proof_obligations: []
  predictions:
  - metric: associativity failures over 10^5 random triples
    direction: lower
    minimum_effect: exactly 0
  - metric: T(g), number of vanishing leading interpolation coefficients of g
    direction: lower
    minimum_effect: at most 1 at every prime, matching the random odd control
  - metric: H(c), hybrid-sum maximum divided by sqrt(N)
    direction: lower
    minimum_effect: below 4 sqrt(log(pN)) at every prime
  - metric: N_s minus (n/2 + 1) for the chord-slope image to a canonical Q
    direction: different
    minimum_effect: exactly 0 on prime-order curves
  minimal_test:
    design: Prime-order toy curves with N in [2^12, 2^17] from crypto/docs/ECDLP_CALIBRATION_PRIMES.md
      plus three j = 0 curves. Implement E^nat(F_p) in a standalone Rust or C script under research/cohomology_zeta_20261109.
      Enumerate kP for all k, compute c(kP) by double-and-add in E^nat, verify c(pP) = Lambda_p(P) and
      the psi_k identity for k = 3,5,7 at 100 random P (one global sign of lambda may be flipped once
      if k = 3 demands it). T(g) uses Lagrange weights w(x) = 1/prod(x - x') and tests sum g(x) w(x) x^i
      = 0 for i = 0,1,2. H(c) uses an FFT over k for 64 random a and all b.
    controls:
    - Random odd function y r(x), r uniform, for the T and H distributions.
    - Planted y (x^3 + 1), where T must equal |X| - 4 exactly.
    - Label control c replaced by k mod p, where H must spike, validating the FFT path.
    required_metrics:
    - associativity failures
    - psi_k identity pass count and the sign used
    - T(g) per prime
    - H(c) per prime with its argmax (a,b)
    - N_s and n
  falsification_conditions:
  - Claim A dies if the psi_k identity fails for both signs or c(pP) != Lambda_p(P) anywhere.
  - Claim B dies if T(g) >= 3 or H(c) exceeds the bound at two or more primes while the controls behave;
    c would then have to be re-examined as an algebraic predicate.
  - An associativity failure is an invalid model, not evidence either way.
  confounders:
  - The sign convention of lambda, fixed once by the k = 3 check and frozen.
  - Floating-point FFT error; keep N <= 2^17 and complex double.
  interpretation_limits:
  - A confirmed Claim B is a toy-size statistic and a barrier reading, not a degree theorem.
  - The j = 0 arm fixes conventions for secp256k1 but proves nothing about it.
  heuristic_assumptions:
  - id: H1
    statement: c behaves like a uniformly random odd function on E(F_p) for degree and hybrid sums.
    rigorous_support: Only the absence of a regular section of E^nat -> E; Weil bounds do not apply because
      c is not rational of low degree.
    validation_plan: T and H against the random control at six or more primes, script and raw tables committed
      under research/cohomology_zeta_20261109.
  target_complexity:
