    verified_by: recalled only; the k = 3 check in the test fixes the sign
  assumptions:
  - N prime, N != p, p > 3, so N is invertible mod p and E(F_p) has no 2-torsion.
  - The conventions at P = Q, P = -Q and O give a group law; the run checks associativity on random triples
    and treats a failure as an invalid model, not as evidence about Claim B.
  proof_search_map:
    not_applicable_reason: finite-group statistics at toy sizes, no exponent claim
    bottleneck: not_applicable
    baseline_embedding:
