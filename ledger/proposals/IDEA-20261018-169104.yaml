  title: >-
    Low-memory ISD re-measured: Stern, Dumer and MMT under hard memory caps at reduced HQC-like
    parameters, against Li-Wang curves
  class: measurement
  claim: >-
    Under memory caps M in {2^10, 2^14, 2^18} list entries on reduced QC instances (n in {101..257}),
    the measured operations-versus-memory curve for each algorithm matches the KN-LIT-5677ae
    predictions within 1.5 bits, and the optimal algorithm switches from MMT to Dumer/Stern
    at a cap within one doubling of the predicted crossover; if measurement shows a crossover
    more than two doublings away, the low-memory security estimates for HQC carry a systematic
    error.
  mechanism: >-
    Memory-limited ISD replaces large lists with repeated smaller ones, raising iteration
    counts. The predicted curves rest on asymptotic list sizes; at reduced n constants and
    rounding dominate. Measuring with real caps validates the curve shape used to charge memory.
  tracked_object: Counted ops to solve vs memory cap per algorithm.
