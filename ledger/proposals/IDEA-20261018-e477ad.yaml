  title: >-
    Adaptive versus fixed partition in Simon's erasure step: does the independence condition
    named by Guo-Yang carry the bias?
  class: mechanism
  claim: >-
    Guo and Yang (KN-LIT-a2a423) isolate an unproved condition: the A/B partition must be
    fixed independently of the measured string, while the algorithm chooses it from the measurement.
    At toy size the h* bias toward d_n differs by at least 0.1 between a partition fixed in
    advance (oracle-free but unrealisable) and the adaptive partition the algorithm actually
    uses. If the bias exists only under the fixed partition, the gap is exactly the unproved
    condition.
  mechanism: >-
    The Lemma 2 cancellation argument holds for any fixed partition. Selecting A as the all-zero-Hadamard
    groups correlates A with the measured b' values, which can reweight the z* branches unequally.
    Exact enumeration lets both partitions be computed on identical randomness, isolating
    the effect of adaptivity alone.
  tracked_object: >-
    Difference in exact Pr[h* = d_n] between adaptive (as specified) and fixed-in-advance
    partitions on identical secrets and measurement outcomes.
