    - KR-RHO-13bf67
    - KR-IC-cd159a
    - KR-IC-5ea2f8
    nearest:
    - ref: KR-RHO-53c89f
      provenance: internal
      relation: special_case
      delta: The row covers k_p = 1; this record defines k_p for every ordinary curve and predicts it
        for secp256k1.
    - ref: KR-RHO-755e35
      provenance: internal
      relation: adjacent
      delta: k_p depends only on t, hence is isogeny-invariant, consistent with the row.
    searched:
      corpus_grep:
      - brief section 2 for ord_p, p-torsion, ascent, anomalous, trace-one
      - wave-1 transfer and p-adic lane titles for ascent variants
      web: []
      blocked: []
