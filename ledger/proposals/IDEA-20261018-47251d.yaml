  title: >-
    Tower NTRUSolve vs exact rational Babai on the same (f,g): does approximate field-norm
    reduction leave slack in (F,G)?
  class: measurement
  claim: >-
    NTRUSolve (KN-LIT-4954) lifts a solution of fG - gF = q up the power-of-two tower via
    the field norm and size-reduces (F, G) against (f, g) at every level with approximate
    arithmetic. Two correct solvers can return (F, G) differing by k(f, g). Claim: on identical
    (f, g) at n = 512, the tower solver and an exact-rational Babai reduction disagree on
    (F, G) for at least 1% of keys; when they disagree, the largest Gram-Schmidt norm of the
    full basis differs by at least 0.5%, and at least 1 key in 10^3 is accepted by one solver
    and rejected by the other. Falsified if outputs are identical on 10^4 keys.
  mechanism: >-
    Size reduction computes k = round((F f* + G g*)/(f f* + g g*)) in approximate precision;
    near-half fractional parts round differently under truncated precision, and errors at
    a lower tower level propagate through the lift. The final basis quality sets leaf widths,
    so solver choice changes the per-key leaf margins of F3 and the acceptance set of keygen
    without changing correctness.
  tracked_object: >-
    Per-key indicator of (F, G) disagreement and Delta = log max_i ||b~_i|| (tower) minus
    log max_i ||b~_i|| (exact).
