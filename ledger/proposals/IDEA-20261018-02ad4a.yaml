  minimal_test:
    design: >-
      Nested design: 10 instances x 5 basis randomisations x 2 thread counts, for BKZ-40 and
      G6K pump at dims 60,80,100 on both shapes; random-effects ANOVA.
    controls:
    - >-
      null/negative: identical instance, identical basis, single thread (pure determinism
      check: variance must be 0 for op counts)
    - >-
      positive: inject a known 0.5-bit cost offset in one arm; the registry's test must detect
      it at 80% power
    - 'A/A: the full design repeated on two days/hosts'
  falsification_conditions:
