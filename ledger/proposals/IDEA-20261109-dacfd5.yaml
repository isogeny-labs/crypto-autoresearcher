idea:
  id: IDEA-20261109-dacfd5
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-9d5d44
  title: Curve25519 as the 4-isogenous image of the complete curve -x^2 + y^2 = 1 + 121665 x^2 y^2, with
    the isogeny absorbed by clamping
  class: composition
  claim: 'Formula engineering, not an ECDLP claim. Let $\bar E: -x^2 + y^2 = 1 + \bar d x^2y^2$, $\bar
    d = 121665 = (A-2)/4$, $A = 486662$, $i^2 = -1$. C1. $\bar d$ is a non-square, so the unified law
    is complete on $\bar E(\mathbb{F}_p)$. C2. $\psi(x,y) = (u,v) = (-y^2/x^2,\ i\,y(2 + x^2 - y^2)/x^3)$
    maps $\bar E$ to $v^2 = u^3 + Au^2 + u$; projectively $(U:V:W) = (-XY^2 : iY(2Z^2 + X^2 - Y^2) : X^3)$,
    with no common zero on $\bar E(\mathbb{F}_p)$; x-only $(U:W) = (-Y^2 : X^2)$ at $2S$. C3. Dual, x-only,
    with $Q = U^2 + AUW + W^2$: $(Y'':Z'') = ((U-W)^4 - 4(A+2)U^2W^2 : Q^2 - (A^2-4)U^2W^2)$, cost $1M
    + 4S + 3c$, defined on all of $\mathbb{P}^1(\mathbb{F}_p)$ because $A^2 - 4$ is a non-square. Full
    dual: $x'' = \mp 4i\,v(u^2-1)/((u^2-1)^2 + 4v^2)$. C4. $\psi$ has rational kernel $\{(0,1),(0,-1)\}$
    and image the index-2 subgroup of order $4\ell$; it is a bijection on the order-$\ell$ subgroups.
    It is not a model of the full group. C5. $\psi \circ \hat\psi = [4]$ up to the sign in C3, so for
    $4 \mid k$, $[k]P = \psi([k/4]\hat\psi(P))$; clamped scalars qualify. C6. An uncached unified addition
    on $\bar E$ costs $8M + 1c + 9a$ with $c = 2\bar d = 243330$, against 9 general multiplies on Edwards25519
    and 12 fe_mul plus 1 fe_inv in the current EdPoint add. With cached $2dT$ tables the gain is 0. C7.
    $y(\hat\psi(B)) = -157675040/718320160 = -985469/4489501$ for $u = 9$ (hand arithmetic).'
  mechanism: 'C2: $u(u^2 + Au + 1) = -y^2((x^2-y^2)^2 - 4\bar d x^2y^2)/x^6$ and the curve equation gives
    $4\bar d x^2y^2 = 4(y^2 - x^2 - 1)$, so the bracket is $(x^2 - y^2 + 2)^2$. Zeros: $X = 0$ forces
    $Y^2 = Z^2$, where $Y(2Z^2 - Y^2) \ne 0$. C1: $121666 = (A+2)/4$ is a square because $\sqrt{-486664}$
    and $\sqrt{-1}$ exist, and $d = -121665/121666$ is a non-square. C3: with $s = u^2 - 1$, $q = u^2
    + Au + 1$, $v^2 = uq$, $x = 4vs/(s^2 + 4v^2)$ and $y = (4uq - s^2)/(s^2 - 2q(u^2+1))$ satisfy $x^2
    + y^2 = 1 - \bar d x^2y^2$ by the identity $(s^2 + 4uq)^2 - 4(2-A)uqs^2 = (s^2 - 2q(u^2+1))^2$; then
    $x \mapsto -ix$. The kernel of the dual is generated by a point with $u = -1$, which is not rational;
    $u = 1$ maps to $(0,-1)$. Unified law on $\bar E$: $A_1 = (Y_1-X_1)(Y_2-X_2)$, $B_1 = (Y_1+X_1)(Y_2+X_2)$,
    $C_1 = 243330\,T_1T_2$, $D_1 = 2Z_1Z_2$, outputs $((B_1-A_1)(D_1-C_1) : (D_1+C_1)(B_1+A_1) : (D_1-C_1)(D_1+C_1)
    : (B_1-A_1)(B_1+A_1))$. Fixed base: $G'' = [4^{-1} \bmod \ell]\hat\psi(B)$ gives $\psi(G'') = B$.
    Symmetry: the cyclic 4-isogeny; clamping supplies the factor 4.'
  novelty_status: unverified
  citations:
  - ref: BRIEF sections 0 and 1
    provenance: internal
    claim: Curve constants, clamping, a24 = 121665 in the ladder, and ed25519_d() recomputed with fe_inv
      inside add.
    verified_by: idea-generator session 2026-11-09 read the BRIEF text
  - ref: RFC 7748 section 4.2, curve448 to edwards448 4-isogeny
    provenance: recalled
    claim: Same map shape for curve448; this record is its Curve25519 analogue.
    verified_by: null
  - ref: Hamburg, Ed448-Goldilocks, 2015
    provenance: recalled
    claim: 4-isogeny strategy with small d; likely known in substance.
    verified_by: null
  assumptions:
  - Hypotheses of the BRIEF; cofactor 8 and group order 8 times l.
  - The sign in C3 is chosen so that $\psi \circ \hat\psi = [4]$; the script decides it.
  predictions:
  - metric: failures of $\psi(P+Q) = \psi(P) + \psi(Q)$ and of $\psi\hat\psi = [4]$ over the sample
    direction: lower
    minimum_effect: exactly 0
  - metric: index of the image of psi in the rational group of the toy and of Curve25519
    direction: different
    minimum_effect: exactly 2
  - metric: general field multiplies per uncached unified addition
    direction: lower
    minimum_effect: 8 on the isogenous curve against 9 on Edwards25519
  minimal_test:
    design: 'Proposed scripts/sage/c25519_iso4_small_d.sage. Symbolic check of C2 and C3. Toy at p = 13,
      A = 7 (isogenous d = 11): exhaustive homomorphism, kernel, image and composition checks. Curve25519:
      order of random points divides 8l, 10000 random homomorphism checks, $\psi(G'') = (9, \cdot)$, C7
      recomputed, and x25519 of the RFC 7748 scalars reproduced as $\psi([k/4]\hat\psi(P))$ on the x-line.'
    controls:
    - 'Lost-point control: P and P + (0,-1) must have equal images, and no point of exact order 8 may
      be hit.'
    - 'Null: replace 121665 by 121666 (a square); completeness must fail at some pair.'
    required_metrics:
    - homomorphism and composition mismatch counts
    - kernel size and image index
    - fe_mul and fe_inv calls per addition on both curves
  falsification_conditions:
  - A point of the isogenous curve whose image is off Curve25519.
  - $\psi \circ \hat\psi$ different from $[4]$ and $[-4]$.
  - An exceptional pair for the unified law on the isogenous curve.
  - C7 not reproduced, which would indicate a hand-arithmetic error, not a failed mechanism.
  - A crash or timeout is infrastructure, not a falsification.
  confounders:
  - Production code caches $2dT$, which removes the only per-addition gain.
  - Entering from an x-only input needs a square root to obtain a full point.
  interpretation_limits:
  - 'Not usable for Ed25519 verification: equality after the isogeny holds only modulo $\{O, (0,-1)\}$,
    which is neither the cofactorless nor the cofactored check.'
  - Twist inputs of X25519 are outside the claim; the ladder remains the variable-base method.
  heuristic_assumptions:
  - id: H1
    statement: None; algebraic identities and group-order bookkeeping.
    rigorous_support: Hand derivation in the filing session, with the dual's shape recalled from RFC 7748
      and re-verified by the stated identity.
    validation_plan: Symbolic and exhaustive checks above.
  target_complexity:
    time_exponent: not applicable, 8M + 1c per uncached addition
    memory_exponent: not applicable
    best_known: 8M with a cached 2dT operand on Edwards25519.
    hidden_overhead: isogeny evaluation at entry (1M + 4S + 3c x-only) and exit (2S)
    tradeoff_note: The gain is at most 1M per uncached addition and 0 with cached tables.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  dominated_by: Cached-operand addition on Edwards25519 dominates for fixed-base and table-driven work.
    Nothing in BRIEF section 2 states this isogeny.
  sota_delta: 'Per uncached addition: 9 general multiplies to 8M + 1 small-constant multiply. Per addition
    in this repository: removes 1 fe_inv and 3 fe_mul. Exponent delta not applicable.'
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: Campaign "Curve25519 explicit formulas and coordinate systems" is formula engineering;
      no ECDLP frontier row is touched.
    none_found_after:
    - BRIEF section 2, all 30 ledger entries (truncated abstracts), for 4-isogeny, small d, or clamping
      absorbed by an isogeny
    - BRIEF section 1 excerpts of x25519.rs and ed25519.rs
