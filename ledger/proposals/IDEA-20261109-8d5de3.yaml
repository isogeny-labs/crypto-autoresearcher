idea:
  id: IDEA-20261109-8d5de3
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECC-9d5d44
  title: The swap-odd addition law on Edwards25519; exact exceptional set E[4] and a validity condition
    for double-and-add
  class: mechanism
  claim: Formula-engineering claim, not an ECDLP claim. On $-x^2+y^2=1+dx^2y^2$ over $p=2^{255}-19$ in
    $(X:Y:Z:T)$, the law $A=(Y_1-X_1)(Y_2+X_2)$, $B=(Y_1+X_1)(Y_2-X_2)$, $C=2Z_1T_2$, $D=2T_1Z_2$, $E=D+C$,
    $F=B-A$, $G=B+A$, $H=D-C$, $X_3=EF$, $Y_3=GH$, $Z_3=FG$, $T_3=EH$ costs 8M + 0c + 10a and uses no
    curve constant. (C1) Swapping the inputs exchanges $A\leftrightarrow B$ and $C\leftrightarrow D$ and
    sends $(X_3,Y_3,Z_3,T_3)$ to its negative; the unified law fixes every product and the vector. (C2)
    Any law whose output vector is swap-odd is zero at $P_1=P_2$, so it cannot double. (C3) $Z_3=0$ iff
    $P_1-P_2\in\{(0,1),(0,-1),(\pm\sqrt{-1},0)\}=E(\mathbb F_p)[4]$; otherwise the output equals the unified
    sum. (C4) In MSB-first double-and-add with $\mathrm{ord}(P)=\ell$ the add step is never exceptional
    for $0\le k<\ell$, and is exceptional for clamped scalars with $\lfloor k/8\rfloor=(\ell+1)/2$.
  mechanism: $F=2(X_1Y_2-Y_1X_2)$ and $G=2(Y_1Y_2-X_1X_2)$. With $t=x_1x_2y_1y_2$, $x(P_1-P_2)=(x_1y_2-y_1x_2)/(1-dt)$
    and $y(P_1-P_2)=(y_1y_2-x_1x_2)/(1+dt)$, and $1\pm dt\ne0$ on rational points because $d$ is a non-square.
    So $F=0$ iff $x(P_1-P_2)=0$ and $G=0$ iff $y(P_1-P_2)=0$, which are the four points of order dividing
    4. For (C2), a polynomial vector with $\Phi(P_2,P_1)=-\Phi(P_1,P_2)$ gives $2\Phi(P,P)=0$. For (C4),
    before the add the accumulator is $mP$ with $m=2\lfloor k/2^{j+1}\rfloor$, so $P_1-P_2=(m-1)P$ and
    the step fails iff $\ell\mid m-1$; $m-1\le k-1<\ell$ and $m-1$ is odd when $k<\ell$, while $m=\ell+1$
    is reachable from a clamped scalar.
