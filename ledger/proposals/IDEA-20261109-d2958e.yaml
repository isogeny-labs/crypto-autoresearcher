  status: proposed
  approved_by: null
  class: algorithm
  novelty_status: adaptation
  title: 'Spine-hit to one endomorphism: drop the second Delfs-Galbraith phase and measure the constant'
  claim: For a public supersingular E_A/F_{p^2} with secret path from a known E_0/F_p, a random non-backtracking
    2-walk psi of length k ~ (1/2)log2 p + c that lands on an F_p-rational curve E' yields the non-scalar
    endomorphism theta = psi_dual o pi_p o psi of degree p*4^k, and OneEnd-to-EndRing saturation then
    recovers End(E_A) without any class-group computation on the spine. Expected cost Theta~(p^{1/2})
    walk steps, O(1) memory; same exponent as Delfs-Galbraith, improved constant. Cleared against H-WESO-516558,
    H-ALISO-003, H-ALISO-005; no Lean lemma in the brief constrains it.
  mechanism: 'Graph G_2(p): floor(p/12)+{0,1,2} vertices, 3-regular, Ramanujan. Spine size h(-4p) (+h(-p)
    when p = 3 mod 4), i.e. Theta~(p^{1/2}). Hitting time from a mixed start is ~ (p/12)/|spine| walks
    of length k. Since E''^(p) = E'', Frobenius pi_p is an endomorphism of E'' of degree p and reduced
    trace 0, so theta is not in Z. Saturation: compute the order Z<theta, theta''> for a second hit theta''
    or use the Page-Wesolowski reduction; cost polynomial in log p, constant unmeasured.'
  security_delta: None in exponent. Breaks nothing new; recalibrates the constant in SQIsign key-recovery
    cost claims (p ~ 2^248 at NIST-I gives p^{1/2} = 2^124 walk steps before the constant).
  kill_test: At p in [2^28, 2^40], measure walks-to-spine against 12/sqrt(p) and the saturation wall-clock.
    If the end-to-end gain over full Delfs-Galbraith is below 2x at all sizes, refile as measurement only
    and close as algorithmic lead.
