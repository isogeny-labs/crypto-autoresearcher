  title: >-
    The integrity dual of t0 secrecy: how many low bit-planes of t0 in the secret key can
    be corrupted before signatures stop verifying
  class: measurement
  claim: >-
    If the low b bit-planes of the signer's stored t0 are randomised, the hint is computed
    from c t0' instead of c t0 and a signature fails verification only when the error c e
    pushes a coefficient across a HighBits boundary. Predicted per-signature failure rate
    is n k sqrt(2/pi) sqrt(tau/6) 2^b / (2 gamma2) for small b: about 2 percent at b = 1 and
    17 percent at b = 4 at ML-DSA-44, about 11 percent at b = 4 at ML-DSA-65; the fit holds
    within factor 2 for b in {1..5} and saturates above. So low-plane t0 integrity faults
    are largely silent to verification, the dual of how little t0 a public observer needs.
  mechanism: >-
    t0 enters signing only through c t0 in the hint; a randomised low-plane error e has variance
    about 2^{2b}/6, so c e has standard deviation sqrt(tau/6) 2^b, and a coefficient fails
    only if it lies within |c e| of a HighBits boundary, probability |c e|/(2 gamma2). The
    rate quantifies how much of t0 the signer actually uses, the dual of how much of t0 a
    public observer learns.
  tracked_object: verify-failure rate vs number of corrupted t0 bit-planes
