idea:
  id: IDEA-20261031-6610ed
  title: 'Prime-field Koblitz analogue: CM-by-Z[(1+sqrt(-7))/2] curves with the norm-2 endomorphism of
    designed orbit size h ~ log_2 N on G, rho on <+-alpha>-classes with canonicalisation charged'
  class: algorithm
  claim: On curves constructed with N | N(alpha^h - 1), rho on <+-alpha>-classes needs sqrt(h) fewer iterations
    than negation rho (positive control), and its total counted cost relative to negation rho is kappa/sqrt(h)
    with kappa the charged per-step canonicalisation cost; the recorded obstruction predicts kappa >=
    (h-1) c(alpha)/c(add), hence a net loss of about sqrt(h). The claim is falsified (and the lead reopened)
    if total cost falls below negation rho at h >= 16.
  mechanism: 'Representation: Weierstrass points; operation set: translation plus the endomorphism alpha
    (degree 2) and negation; the tracked object is the orbit class (block system of <+-alpha> acting on
    G, Class I partial action per IDEA-20260901-863e36); the priced open number is the canonicalisation
    cost kappa. Escapes the glv-gls premise (orbit = whole group) by designing ord_N(lambda) = h.'
  novelty_status: unverified
  citations:
  - ref: KR-RHO-482ed3
    provenance: internal
    claim: Koblitz signed-Frobenius classes give sqrt(pi r/(4m))
    verified_by: frontier map read 2026-10-31
  - ref: IDEA-20260901-6b63a4
    provenance: internal
    claim: n^h >= (sqrt N - 1)^2 for a norm-n endomorphism with eigenvalue order h
    verified_by: lead file read 2026-10-31
  - ref: H-EWALK-29cb90
    provenance: internal
    claim: canonicalisation cost conjecture for multiplier subgroups of order > 6
    verified_by: lead file read 2026-10-31
  - ref: Duursma, Gaudry, Morain, Speeding up the discrete log computation on curves with automorphisms,
      ASIACRYPT 1999
    provenance: retrieved
    claim: sqrt(m) speedup for automorphisms of order m
    verified_by: web search result 2026-10-31
  assumptions:
  - Class number 1 for D = -7 (so the norm-N prime is principal); CM construction of E/F_p with prescribed
    Frobenius.
  - Counted-unit cost model of ecbench for alpha evaluations and comparisons.
  - 'Construction facts from the design probe (see IDEA-20261031-6610ed.notes.md): group order 4l, not
    prime; prime N(1 +- 2 delta); only h = 19 and 23 are exact equality cases in 16..24.'
  proof_search_map:
    bottleneck: the per-step canonicalisation cost kappa for an orbit of size h under a degree-2 endomorphism
    baseline_embedding:
      parameter_slice: h = 1 (negation only) reproduces KR-RHO-fb88e6; h = 3 with an automorphism reproduces
        the j = 0 sqrt 6
      reproduction_check: ratio-to-ceiling within the EV-ENDO-10109d band
    observation_collision:
      observable: canonical orbit representative
      distinct_preimage_search: none (the class is the object)
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: the CM family with N | N(alpha^h - 1)
      predicted_gain: constant sqrt(h) in iterations
      net predicted <= 1/sqrt(h) in total cost: null
    quantifier_order: EXISTS a curve family (constructed) such that FOR ALL instances the iteration saving
      is sqrt(h); the total-cost sign is the measured unknown
    method_ceiling:
      strongest_certifiable_claim: a constant <= sqrt(log N)
      never an exponent: null
      nearby_object_control: a j = 0 curve of the same N (automorphism classes
      known sqrt 6 net gain) and a generic-D curve of the same N (no classes): null
    proof_obligations:
    - claim: the construction yields ord_N(lambda) = h exactly
      responsibility: correctness
    - claim: iteration count scales as sqrt(h) saving
      responsibility: success_probability
    - claim: kappa >= (h-1) c(alpha)/c(add) for orbit-enumeration canonicalisers
      responsibility: runtime
    not_applicable_reason: null
  predictions:
  - metric: iterations_ratio_alpha_classes_over_negation
    direction: lower
    minimum_effect: about 1/sqrt(h), e.g. 0.25 at h = 16
  - metric: total_counted_cost_ratio_over_negation
    direction: higher
    minimum_effect: predicted >= 1 (loss); the candidate is alive only if < 0.9 at h >= 16
  minimal_test:
    design: three arms (negation rho; alpha-class rho full canonicalisation; alpha-class rho x-only batched
      canonicalisation), h in [16, 32], N ~ 2^20..2^32, >= 200 planted instances per cell
    controls:
    - j = 0 automorphism-class rho on a matched-N curve (positive)
    - generic-D curve of matched N (null)
    - matched-rho calibration per LEAD-RHO-matched-rho-calibration
    required_metrics:
    - iterations
    - counted cost
    - kappa per step
    - exact curve identities and seeds
  falsification_conditions:
  - total-cost ratio >= 1 at every h with the iteration saving confirmed closes the candidate (lead stays
    closed, revisit_when discharged)
  - iteration saving absent means the class walk is mis-implemented (invalid run, not evidence)
  confounders:
  - fruitless cycles in class walks (handle per KR-RHO-fb88e6)
  - batching across walks hiding alpha cost
  - choice of representative rule
  interpretation_limits:
  - constant-factor only; nothing about generic-D deployed curves (|D_K| large
  - no norm-2 endomorphism)
  - Instances have cofactor 4, so results concern the order-l subgroup only; only two instances are exact
    equality cases.
  heuristic_assumptions:
  - id: H1
    statement: rho on the N/(2h) classes behaves as a random mapping on N/(2h) points
    rigorous_support: KR-RHO-93979e (random-oracle partition bound) for the class walk as in Duursma-Gaudry-Morain
    validation_plan: iteration histogram vs sqrt(pi N/(4h)) at each h, KS test, >= 200 instances
  target_complexity:
    time_exponent: N^{1/2} (unchanged)
    memory_exponent: polylog (distinguished points)
    best_known: sqrt(pi N / 4) iterations with negation
    hidden_overhead: kappa ~ h alpha-evaluations per step; the whole question
    tradeoff_note: parallelises as rho; no memory change
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-RHO-0528e7
    - KR-RHO-482ed3
    - KR-RHO-037e22
    - KR-RHO-fb88e6
    - KR-RHO-825bca
    - KR-RHO-13bf67
    nearest:
    - ref: KR-RHO-482ed3
      provenance: internal
      relation: adjacent
      delta: same class mechanism with a degree-2 CM endomorphism instead of Frobenius; the orbit cost
        is the difference
    - ref: LEAD-STR-small-cm-disc-nonunit-endo
      provenance: internal
      relation: special_case
      delta: constructs the equality case its revisit_when names
    searched:
      corpus_grep:
      - norm-2 endomorphism
      - equality case
      - Koblitz analogue
      - canonicalisation
      web:
      - Pollard rho equivalence classes endomorphism small order prime field
      blocked: []
    lead: LEAD-STR-small-cm-disc-nonunit-endo
    new_lead_reason: null
  question_id: RQ-ECDLP-002
  dominated_by: Checked; n/a for the construction. For the attack reading it is dominated on every axis
    by negation rho (same N^(1/2) exponent) unless a canonicaliser costing o(h) exists; the program's
    own recorded obstruction predicts a net loss of about sqrt(h).
  sota_delta: Gain 0 at the exponent level. Predicted iteration saving 1/sqrt(h) (0.25 at h=16), predicted
    total counted cost ratio >= 1 (loss of about sqrt(h)); the construction itself (ord_N(lambda)=h by
    design) has never been built in this program.
  status: proposed
  added: '2026-10-31'
  proposed_by: idea-synthesist (special-structure lead search 2026-10-31; families A and B converged on
    this candidate independently)
