  - ref: Lang 1956, Algebraic groups over finite fields
    provenance: recalled
    claim: Every torsor under a connected algebraic group over F_q is trivial.
    verified_by: recalled; the filing coordinator must confirm.
  - ref: Cremona database curve 571a1
    provenance: recalled
    claim: Rank 0 with Sha of order 4, the standard explicit Sha[2] example.
    verified_by: recalled; confirm in LMFDB before the run.
  assumptions:
  - N is prime and p does not divide n in every reduction step used.
  - 'The toy primes are good primes of 571a1 at which #E_p(F_p) is prime.'
  predictions:
  - metric: 'number of reduced coverings with #C_p(F_p) different from #E_p(F_p)'
    direction: lower
    minimum_effect: exactly 0 (any nonzero count falsifies)
  - metric: number of reduced coverings whose image in E_p(F_p) is a proper subgroup
    direction: lower
    minimum_effect: exactly 0
  - metric: '|H^1(F_p, E[n])| minus |E(F_p)[n]| for n in {2, 3, N}'
    direction: lower
    minimum_effect: exactly 0 on every toy curve
  minimal_test:
    design: 'Sage or PARI. (a) For 571a1 compute the 2-coverings with ell2cover, take 20 good primes p
      in [2^10, 2^16] with #E_p prime, reduce each quartic, count F_p-points and the image of the covering
      map. (b) For three calibration primes p <= 2^12 from crypto/docs/ECDLP_CALIBRATION_PRIMES.md and
      a prime-order curve, form the two-point lift E~_{P,Q} of 50 random instances, compute its 2-Selmer
      coverings with ellrank, reduce and score the same metrics. (c) Compute the Frobenius matrix on E[n]
      for n in {2, 3, N} and the order of coinvariants.'
    controls:
    - Coverings attached to global points (P~, Q~ themselves, and positive-rank twists of 571a1), scored
      identically.
    - 'Primes where #E_p is not prime are excluded and their count reported.'
    required_metrics:
    - number of coverings scored
    - 'per-covering #C_p(F_p) minus #E_p(F_p)'
    - per-covering image index
    - '|H^1(F_p, E[n])| for n in {2, 3, N}'
  falsification_conditions:
  - 'Any reduced covering of period prime to N with #C_p(F_p) different from #E_p(F_p) or with image a
    proper subgroup.'
  - Any n coprime to N with H^1(F_p, E[n]) nonzero on a prime-order toy curve.
  - A timeout or PARI failure is infrastructure, not evidence.
  confounders:
  - A quartic with bad reduction at p (p dividing its discriminant) is excluded and counted.
  - Point counts are F_p-isomorphism invariants, so the metric does not depend on the chosen model of
    the covering.
  interpretation_limits:
  - Closes descent objects of period prime to N as sources of information about k; defers pairings to
    KR-RHO-53c89f.
  - The period-N case is closed by size (degree N), not by vanishing.
  heuristic_assumptions:
  - id: H1
    statement: Sha(E~/Q)[N] is nonzero with probability about 1/N for lifts of a 256-bit instance, so
      period-N shadows are rare as well as huge.
    rigorous_support: Delaunay-type heuristics; not load-bearing, the vanishing statements are theorems.
    validation_plan: Record the 2-Selmer excess over the two known points in test (b) as a weak sanity
      check that Sha[2] is already rare in this family.
  target_complexity:
    time_exponent: unchanged, N^{1/2}
    memory_exponent: unchanged
    best_known: Pollard rho, Theta(N^{1/2}) group operations (KR-RHO-13bf67)
    hidden_overhead: none; no algorithm is proposed
    tradeoff_note: Barrier record; delta against the best known exponent is 0.
  estimated_cost:
