  recommended_priority: medium
  dominated_by: KR-RHO-53c89f dominates the n = N transfer; KR-IC-cd159a dominates the lifting reading.
    Neither states shadow vanishing for period prime to N or the torsor reading of the instance.
  sota_delta: Exponent delta 0. New content is the closure statement in quantitative form (shadow 0 for
    gcd(n, N) = 1, degree at least N otherwise).
