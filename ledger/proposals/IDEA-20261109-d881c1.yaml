idea:
  id: IDEA-20261109-d881c1
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Shadow theorem for descent on a prime-order curve: Selmer and Sha classes of period prime to
    N vanish in E(F_p), and over F_p the only torsor is the ECDLP instance itself'
  class: barrier
  claim: 'Let E/F_p have prime order N, G = <P>. (i) Over F_p, Lang gives H^1(F_p, E) = 0 and Kummer gives
    E(F_p)/n = H^1(F_p, E[n]) of order |E(F_p)[n]|: zero for gcd(n, N) = 1, Z/N for n = N. The N-covering
    of class delta(Q) is pi_Q(R) = [N]R + Q; the finite E[N]-torsor [N]^{-1}(Q) has no F_p-point; ECDLP
    is the statement [T_Q] = k [T_P] in H^1(F_p, E[N]), whose only invariant computable below the N-division
    field is the Tate pairing. (ii) For any number field K, place v above p of good reduction, and gcd(n,
    N) = 1, the localisation Sel_n(E~/K) -> E~(K_v)/n = E(k_v)/n kills the N-primary part of E(k_v); hence
    every element of Sel_n and of Sha(E~/K)[n] has shadow 0 in G. A nonzero shadow needs N | n, a covering
    of degree at least N. Toy prediction: every reduced 2-covering of a curve with nonzero Sha[2], and
    of the two-point lift of an ECDLP instance, has #C(F_p) = #E(F_p) and a covering map surjective on
    F_p-points, exactly as coverings of global points do.'
  mechanism: 'A torsor with no rational point over F_p must be a torsor under a finite group scheme (Lang),
    and the only ones attached to E are [n]^{-1}(Q), classified by E(F_p)/n. Over a global field a Selmer
    class localises into the Kummer image E(k_v)/n, whose N-part is zero for gcd(n, N) = 1 because that
    part is n-divisible; Sha is locally trivial by definition. So global descent objects are invisible
    to any computation on G unless their period is a multiple of N, and N-coverings are curves of degree
    N in P^{N-1}. This separates an obstruction (Sha, Brauer-Manin: image 0 at p) from a transfer (the
    n = N Kummer class: the Tate pairing, already closed).'
  novelty_status: unverified
  citations:
