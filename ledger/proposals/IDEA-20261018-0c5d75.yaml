  minimal_test:
    design: >-
      Generate 400 training and 100 held-out instances (n_ring=64..80 x k=2, q=3329, CBD(2),
      embedding dim ~ 2kn - some coordinates dropped to bring dim to 140-180). Train a gradient-boosted
      policy by imitation of the best schedule found by search on training instances. Evaluate
      all schedules on held-out instances with paired seeds.
    controls:
