idea:
  id: IDEA-20261109-e512b8
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Dyadic-subcube dispersion of prime-field point-decomposition solution counts: Poisson flatness
    at every prefix depth and the enumeration floor it imposes on branching solvers'
  class: barrier
  claim: 'Setting: toy prime-order curve, p about 2^24, interval base I = {x < 2^12} (beta = 1/2), arity
    m = 3, target x_R uniform. Let X_R be the set of (x1, x2, x3) in I^3 with x1 < x2 < x3 and S_4(x1,
    x2, x3, x_R) = 0. For depth j in 1..5 partition the fundamental domain into subcubes C by the top
    j bits of each coordinate (strictly increasing prefixes only), with n_C the number of solutions in
    C and K_j the number of subcubes. Claim: the dispersion index D_j = Var_C(n_C)/Mean_C(n_C) satisfies
    |D_j - 1| <= 3 sqrt(2/K_j) + 0.05 whenever Mean_C >= 4, for at least 45 of 50 targets, agreeing with
    a Poisson null and with a random polynomial of the same multidegree: no bit prefix of the encoding
    carries solution-count signal. Reading: a branching solver cannot prune above the depth where Mean_C
    is about 1 and must refute about |I|^{m-1}/polylog subcubes, the enumeration floor, so the wave-1
    SMT scaling exponent c_m should equal (m-1) beta. Certified regime: for |C| at least 2^{O(m)} p^{(m+1)/2}
    (log p)^m flatness is a theorem via the Weil bound; the test regime is below it and is therefore measured,
    not proved. Exponent delta 0.'
  mechanism: The fibre X_R is an affine piece of a variety of dimension m-1, and the nonzero Fourier coefficients
    of its F_p-point indicator are bounded by 2^{O(m)} p^{(m-1)/2} (Weil, as used by the wave-1 hybrid-sum
    record). Fourier box counting then gives n_C = |C| |X_R| / p^m plus an error of that size times log^m
    p, which certifies flatness above the stated scale. Below it the Poisson-process behaviour of X_R
    in the box is exactly what a prefix-guided solver would have to violate to beat enumeration. The Koblitz
    lane's prefix-saturation statistic in cryptanalysis (N41, N131) exploits Frobenius linearity to create
    affine prefix structure; over F_p no linear structure exists, and this record tests that absence directly.
  novelty_status: adaptation
  citations:
  - ref: KR-IC-5765d2
    provenance: internal
    claim: SAT and XOR reasoning speed binary PDP by constants, exponent unchanged.
    verified_by: brief section 3 row text, session 2026-11-09
  - ref: KR-RHO-13bf67
