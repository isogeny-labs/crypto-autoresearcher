  title: >-
    Calibrating the syndrome-decoding estimator against counted ISD at reduced n: measured
    constant offsets per algorithm on QC instances
  class: control
  claim: >-
    For Prange, Stern, Dumer and BJMM on reduced QC instances (n in {101..257}), the CryptographicEstimators
    predictions differ from counted bit-operations by an algorithm-specific constant offset
    within 3 bits and with slope in n within 5% of 1; an offset larger than 5 bits for any
    algorithm would mean HQC's estimated ISD costs carry a systematic shift.
  mechanism: >-
    Estimators compute asymptotic or optimised concrete costs with specific cost models for
    list operations and GE; real counted implementations reveal hidden constants. A calibration
    line per algorithm is the control every matched ISD baseline needs.
  tracked_object: 'Per algorithm: measured log2 ops minus estimator log2 ops vs n.'
