idea:
  id: IDEA-20261024-892d61
  title: >-
    Exact occupancy calculator for the arity-3 crater/floor panel: conservation,
    Markov ceiling and Paley-Zygmund floor, kappa2 tied to pair-sum coincidences
  class: measurement
  question_id: RQ-ECDLP-361f3a
  claim: >-
    Partial-action IC, relation stage, yield side only. On E/F_p of prime order r,
    for a signed base of B abscissae the useful-triple count u(R) at uniform
    R != O has E u = lambda = (M - u_O)/(r-1) exactly (M = 8 C(B,3)) and
    lambda/(1 + kappa2 lambda) <= coverage <= lambda, kappa2 = E[u(u-1)]/lambda^2;
    for size-B bases with equal r, cov/cov' <= (lambda/lambda')(1 + kappa2'
    lambda'), so a 1.2 floor/crater ratio needs kappa2 >= about 0.2/lambda (2.90
    at P29, 3.00 at P37). Scout-reported, exact on 12 P29 bases (11 outputs kept):
    kappa2 0.991-1.018, floor/crater 1.000125, sealed-arm z +0.40, +0.09; P37 is
    sampled (0.995 +- 0.017). Gain 0; the panel's other exit criteria stay owed.
  mechanism: >-
    Pair: signed small-abscissa or random base on prime-order E/F_p; Sigma =
    translation by base elements as useful-triple sums; partial action, Class I.
    Mean: the M triple sums have total mass M on G (KN-FIND-007); u_O <=
    4 C(B,2)/3. Ceiling: Markov. Floor: Cauchy-Schwarz (Paley-Zygmund, theta = 0)
    with E u^2 = kappa2 lambda^2 + lambda; one Jensen step from identity (i) of
    IDEA-20260906-cd7b7e; kappa2 is the energy of IDEA-20260906-d1494b. Each
    coincidence Pa + Pb = Pc + Pd adds about 4(B-4)/((r-1) lambda^2) (H2).
    Transport: an isogeny of degree prime to r is an isomorphism on G
    (KR-RHO-755e35, IDEA-20261015-e0b5dd), so u is targetwise identical.
  novelty_status: adaptation
  citations:
    - ref: KN-FIND-007
      provenance: internal
      claim: mean count C(B+m-1, m)/N for every base; coverage <= mean
      verified_by: mythos-lead-discovery-20261024 gate C1
    - ref: IDEA-20260906-d1494b
      provenance: internal
      claim: sum c^2 = E_m; Poisson value for a random base
      verified_by: mythos-lead-discovery-20261024 gate C1
    - ref: IDEA-20260906-cd7b7e
      provenance: internal
      claim: cov = (C_tot/N) E_M[1/c_M]; E_m = C_tot E_M[c_M]
      verified_by: mythos-lead-discovery-20261024 filer
    - ref: IDEA-20261015-e0b5dd
      provenance: internal
      claim: phi(S) has the yield, coverage and rank of S
      verified_by: mythos-lead-discovery-20261024 gate C1
    - ref: EXP-ECTD-0cf008
      provenance: internal
      claim: sealed 2204, 2191, 2178 of 32768; 17 of 20 arms missing
      verified_by: mythos-lead-discovery-20261024 filer
    - ref: Arratia-Goldstein-Gordon, Ann. Probab. 17(1) (1989) 9-25
      provenance: retrieved
      claim: Chen-Stein two-moment Poisson approximation (abstract only)
      verified_by: mythos-lead-discovery-20261024 scout
  assumptions:
    - Useful triples as in ORACLE_FORMAT.md; #E = r prime.
  proof_search_map:
    bottleneck: a coverage lower bound from base data (Markov is only the ceiling)
    baseline_embedding:
      parameter_slice: kappa2 = 1 gives lambda/(1 + lambda); the ceiling is KN-FIND-007
      reproduction_check: popcov exact on 12 P29 bases, all inside the band
    observation_collision:
      observable: coverage D/(r-1) and kappa2 per base
      distinct_preimage_search: P29 floor native vs u2-native, kappa2 1.0014 vs 1.0183, coverage ordered as predicted
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: two-sided band, kappa2 driven by pair-sum coincidences
        predicted_gain: a necessary condition for a 1.2 ratio
    quantifier_order: for all prime r and size-B bases F, F' in groups of order r, the band and the ratio bound hold
    method_ceiling:
      strongest_certifiable_claim: the necessary condition; exact values for frozen bases
      nearby_object_control: cofactor curves, ell = 2 floor/crater 0.9428 (C3 law); prime order is load-bearing
    proof_obligations:
      - {claim: mean, Markov and Cauchy-Schwarz steps, responsibility: correctness}
      - {claim: prime order and the target law, responsibility: scope}
      - {claim: ratio bound keeps lambda/lambda', responsibility: strictness}
    not_applicable_reason: null
  predictions:
    - metric: exact P37 population floor/crater native ratio
      direction: different
      minimum_effect: "|ratio - 1| >= 0.2 is the lead's effect; scout 0.995 +- 0.017"
    - metric: max kappa2 over the 8 P37 prepared bases
      direction: lower
      minimum_effect: below 2.9 (predicted < 1.1)
  minimal_test:
    design: >-
      popcov exact on the 8 P37 prepared bases (5.45e9 sums each, bucketed) or
      popsample at 1e6 own targets per base, with paircoin; base lines only,
      panel target lines unread; protocol in notes, approved_by null.
    controls: [P29 table reproduced, z vs three sealed arms, native vs transported D, size-matched random bases]
    required_metrics: [D, lambda, u_O, kappa2, pair_coincidences, floor_crater_ratio, sealed_z]
  falsification_conditions:
    - the calculator misses a sealed arm by > 3 sigma
    - a P37 base with kappa2 >= 3, or a P37 ratio outside [0.98, 1.02]
    - an exact coverage outside its own band (arithmetic error)
  confounders:
    - P37 is sampled (own targets), not exact
    - two sizes cannot show an excess growing with N
    - the kappa2 fit has n = 10
  interpretation_limits:
    - Settles the two occupancy contrasts only; exit criteria 3-4 (problems/prime-field-arity3-relation-oracle.md) stay owed
    - Prime order only (a cofactor changes the mean, C3)
    - "KN-OPEN-020 class: explicit-list bases; the band is recorded mathematics"
  heuristic_assumptions:
    - id: H1
      statement: panel targets are uniform without replacement on G minus O
      rigorous_support: true by protocol
      validation_plan: audit the generator
    - id: H2
      statement: each pair-sum coincidence adds about 4(B-4)/((r-1) lambda^2) to kappa2
      rigorous_support: about 2(B-4) colliding triple pairs each
      validation_plan: P29 fit 0.00077 vs 0.00066; refit on P37
    - id: H3
      statement: the P37 native bases have kappa2 < 1.1
      rigorous_support: sampled 1.02 +- 0.07; sealed u2 arm implies 1.05
      validation_plan: exact popcov on the 8 P37 bases
  target_complexity:
    time_exponent: n/a (instrument, gain 0); P29 6 s CPU per base
    memory_exponent: B^3 sums (2.2e7 at P29, 5.45e9 at P37)
    best_known: sampled panel, 32768 targets per arm, ratio sd about 0.029
    hidden_overhead: P37 exact 1-2 h per base
    tradeoff_note: exact count vs sampling
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: high
  dominated_by: >-
    Checked; n/a for S. On occupancy the sampled panel estimates the same
    parameters with more noise; it stays needed for its other criteria.
  sota_delta: >-
    Gain 0. P29 occupancy contrast: sampled sd 0.029 -> exact 1.000125; P37
    0.995 +- 0.017 (scout); 6 s per base vs a 32768-target arm; adds the
    necessary condition kappa2 >= 0.2/lambda.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-RHO-755e35, KR-IC-5931ee, KR-IC-5a43e5, KR-IC-73db3f, KR-IC-b0fcda, KR-RHO-46c2c6]
    nearest:
      - ref: LEAD-ICP-isogeny-transported-relation-yield
        provenance: internal
        relation: same
        delta: same observable and rule; exact count replaces sampling for occupancy only
      - ref: KN-FIND-007
        provenance: internal
        relation: generalizes
        delta: adds the second-moment floor to the mean and ceiling
      - ref: LEAD-ICE-decomposition-probability-audit
        provenance: internal
        relation: adjacent
        delta: its second-order test; P29 native kappa2 about equal to random
      - ref: LEAD-TRF-teske-secret-isogeny-trapdoor
        provenance: internal
        relation: adjacent
        delta: its IC-meter half closes by its own rule on outcome (a)
    lead: LEAD-ICP-isogeny-transported-relation-yield
    new_lead_reason: null
