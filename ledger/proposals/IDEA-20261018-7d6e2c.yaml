  title: >-
    Masked signers vs the exact signing-only predicates: boundary-forced differential testing
    of masked vs reference rejections
  class: tooling
  claim: >-
    Masked ML-DSA implementations evaluate ||z||_inf < gamma1 - beta, the LowBits bound and
    the hint-weight gate on shares via A2B conversions; an off-by-one or carry bug changes
    the rejection set without affecting verification of accepted signatures for the self-enforcing
    z check, but for the signing-only ct0/hint gates it is invisible to verify. Forcing y
    (via test hooks) to land within +-2 of each boundary, a masked implementation's decisions
    match the unmasked reference on 10^7 forced cases, or the first mismatch is exhibited;
    a planted carry bug is detected within 10^4 forced cases.
  mechanism: >-
    Random testing never reaches the signing-only boundaries (rates below 10^-9); boundary
    forcing by choosing y or c makes each predicate's edge reachable directly, and comparing
    decision bits between masked and unmasked code isolates masking-induced errors.
  tracked_object: >-
    decision-bit mismatch rate between masked and reference implementations at forced boundaries
