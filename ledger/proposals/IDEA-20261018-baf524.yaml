  title: >-
    NTRU Prime's unbalanced secret (3f,g): how the dense-sublattice transition moves with
    block-norm ratio, with and without rescaling
  class: mechanism
  claim: >-
    In Streamlined NTRU Prime (RECALLED) h = g/(3f), so the short vector in the NTRU lattice
    is (3f, g) with block norms differing by a ratio r (about 3 sqrt(w) / sqrt(2p/3), RECALLED
    shapes). The fatigue law assumes balanced blocks. Claim: without rescaling, log2 q* shifts
    by at least 0.5 log2 r relative to balanced; with the optimal diagonal rescaling of one
    block, the shift is at most 0.1 log2 r. So the deployed distance must be quoted after
    rescaling. Falsified if the unrescaled shift is absent.
  mechanism: >-
    Lattice reduction sees Euclidean norms; an unbalanced secret is longer than necessary
    in one block and the dense orbit's covolume rises. Scaling the first block by 1/r (a standard
    primal-attack trick) restores balance and the dense-sublattice event should return to
    the balanced location.
  tracked_object: log2 q* versus r, rescaled and unrescaled.
