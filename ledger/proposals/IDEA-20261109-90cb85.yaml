    verified_by: REPO BRIEF section 3 row text, Mythos run 2026-11-09.
  - ref: IDEA-20260806-0c9de1
    provenance: internal
    claim: Earlier speculative X_1(N) representation of (E, P); this record states what that representation
      can and cannot add.
    verified_by: REPO BRIEF section 2 ledger index excerpt, 2026-11-09.
  assumptions:
  - N is an odd prime equal to
  - For the Phi_N check j(E) is not in {0, 1728}; j = 0 curves are tested by direct subgroup enumeration
    only.
  predictions:
  - metric: excess over 2 of F_p-rational cyclic N-subgroups, summed over curves
    direction: lower
    minimum_effect: exactly zero
  - metric: number of curves with j not in {0,1728} where the multiplicity of X = j(E) in Phi_N(j(E),
      X) mod p differs from 2
    direction: lower
    minimum_effect: zero
  - metric: number of Frobenius-moved points in the X_1(N) fibre over (E, L_1)
    direction: lower
    minimum_effect: zero on every curve
  minimal_test:
    design: For p <= 40 and prime-order ordinary curves with N in {5, 7, 11, 13}, evaluate PARI polmodular(N)
      at j(E) mod p, factor over F_p, record the multiplicity of j(E) and all other F_p-roots with multiplicities.
      Enumerate E[N] over F_{p^{k_N}}, list Frobenius-stable cyclic subgroups, compute Velu quotients
      and their j-invariants, and verify the swap under w_N by computing (pi - 1)L_p. On j = 0 curves
      count <lambda>-orbits on x-values.
    controls:
    - A curve with N dividing p - 1 where the eigenvalues coincide and more stable lines are expected.
    - A supersingular toy curve, where the rational structure differs, reported separately.
    required_metrics:
    - p, j, N, k_N
    - stable subgroup count and Velu quotient j-invariants
    - Phi_N root multiplicities over F_p
    - lambda-orbit sizes on j = 0 curves
  falsification_conditions:
  - A tested curve has a third F_p-rational cyclic N-subgroup, or a quotient by L_1 or L_p not isomorphic
    to E.
  - The multiplicity of j(E) in Phi_N(j(E), X) mod p differs from 2 for some j not in {0, 1728}.
  - Any point of the X_1(N) fibre is moved by Frobenius.
  confounders:
  - Other F_p-roots of Phi_N(j(E), X) can arise from Frobenius orbits of non-stable subgroups whose quotients
    share a j-invariant; they are reported, not predicted away.
  - PARI and Sage normalisations of Phi_N agree up to a unit; multiplicity is normalisation-free.
  interpretation_limits:
  - This closes the modular-curve coordinate route with exponent delta 0; it says nothing about Hecke-transported
    relation collection beyond pointing at the repo's hecke experiments.
  - Toy levels only; Phi_N for N near 2^256 is not an object of computation.
  heuristic_assumptions:
  - id: H1
    statement: The multiplicity-2 statement holds for every ordinary prime-order curve, not only for maximal-order
      CM curves.
    rigorous_support: Ideals of norm N in any order coprime to the conductor are two; (pi - 1) and (pibar
      - 1) are principal in Z[pi]; a short argument, not refereed in the repository.
    validation_plan: Direct factorisation of Phi_N(j(E), X) mod p on all toy curves with generic j and
      comparison with the Velu quotient list.
  target_complexity:
    time_exponent: p^{1/2} unchanged
    memory_exponent: O(1) beyond toy modular polynomials
    best_known: Pollard rho, Theta(p^{1/2}) group operations, KR-RHO-13bf67, with the sqrt 6 Aut constant
      on j = 0 curves, KR-RHO-0528e7.
    hidden_overhead: None claimed; no algorithm is proposed.
    tradeoff_note: The diamond torsor has no Frobenius symmetry; the only usable quotient is Aut(E), already
      charged in rho.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: KR-RHO-0528e7 dominates the only positive content (the Aut constant); KR-RHO-13bf67 dominates
    the exponent. The record's value is closing the X_0 and X_1 coordinate route with a toy certificate.
  sota_delta: Exponent delta 0. New content is the exact two-point fibre and multiplicity statement and
    the Frobenius-trivial torsor reading of ECDLP on X_1(N).
