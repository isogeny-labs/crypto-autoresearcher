idea:
  id: IDEA-20261109-90cb85
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Modular fibre certificate - X_0(N)(F_p) over j(E) is two w_N-swapped points with quotient E,
    the X_1(N) fibre is a Frobenius-trivial torsor, and the moduli presentation of ECDLP adds exactly
    Aut(E)
  class: representation
  claim: 'Let E/F_p have odd prime order N with p not 1 mod N. (i) The fibre of X_0(N) -> X(1) over j(E)
    consists of exactly two F_p-points, (E, L_1) and (E, L_p), exchanged by the Atkin-Lehner involution
    w_N, and both quotient curves are isomorphic to E; hence X = j(E) is a root of Phi_N(j(E), X) mod
    p of multiplicity exactly 2. (ii) The fibre of X_1(N) -> X_0(N) over (E, L_1) is the set of (N - 1)/2
    points (E, +-kP), all F_p-rational; the diamond operators (Z/N)^*/{+-1} act simply transitively and
    Frobenius acts trivially, so the ECDLP is the diamond-operator torsor problem with no Galois symmetry
    to quotient by. (iii) The only extra symmetry is Aut(E) acting through the diamonds, orbits of size
    |Aut(E)|/2 (3 for j = 0), the constant of KR-RHO-0528e7. (iv) Marked-point barrier: any object built
    from (E, L_1) or symmetric in E(F_p) is invariant under all diamonds and therefore constant in k.
    Exponent delta 0.'
  mechanism: Stable cyclic subgroups of E[N] are the eigenlines L_1 = ker(pi-1) and L_p = ker(pihat-1);
    pi - 1 and pihat - 1 are degree-N endomorphisms, so E/L_1 and E/L_p are E. w_N(E, L_1) is (E/L_1,
    E[N]/L_1) = (E, (pi-1)L_p) = (E, L_p) since pi - 1 acts invertibly on L_p. Elements of norm N in End(E)
    are units times pi - 1 or pibar - 1, so no other cyclic N-isogeny E -> E exists and the multiplicity
    is 2. Diamonds <a> send (E, P) to (E, aP) and commute with Frobenius, which fixes every rational point.
  novelty_status: known
  citations:
  - ref: KR-RHO-0528e7
    provenance: internal
    claim: Automorphism groups give a sqrt m constant; here it appears as the only non-diamond symmetry
      of the X_1(N) fibre.
    verified_by: REPO BRIEF section 3 row text, Mythos run 2026-11-09.
  - ref: KR-RHO-755e35
    provenance: internal
    claim: Isogenous curves are equally hard; relevant to Hecke correspondences on the fibre, which this
