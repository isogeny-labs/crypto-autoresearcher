  title: >-
    Does hybrid guessing destroy the dense sublattice? Projected NTRU residuals vs matched
    random uSVP after fixing k coefficients
  class: mechanism
  claim: >-
    Hybrid attacks guess k coordinates and reduce a projected lattice of dimension 2n - k.
    Claim: the residual retains a dense sublattice of rank about n - k, so its transition
    q*(k) falls as k grows; at k = n/8, log2 q* drops by at least 5% relative to k = 0. If
    instead the residual is indistinguishable from a matched random uSVP instance (event signature
    absent), guessing destroys the dense sublattice and hybrid and fatigue attacks cannot
    be combined.
  mechanism: >-
    Rotations x^i (f, g) that avoid guessed coordinates survive projection intact; others
    are perturbed by known amounts. The surviving orbit is a dense sublattice in fewer dimensions
    with the same q, which is relatively more overstretched. Whether enough rotations survive
    depends on which coordinates are guessed (contiguous windows preserve more).
  tracked_object: >-
    log2 q*(k) in the projected lattice and profile event signature against matched random
    uSVP.
