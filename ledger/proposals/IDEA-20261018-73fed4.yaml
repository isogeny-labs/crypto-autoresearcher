  title: >-
    Rejection hides odd mask biases to second order: key recovery needs eps^-4 signatures
    for a linear y tilt, eps^-2 for an even bias
  class: mechanism
  claim: >-
    If the mask y has density proportional to 1 + eps*f(y/gamma1) instead of uniform, the
    accepted z = y + c s1 has conditional mean E[z_j | u_j] = a + g*u_j with u = c s1, and
    least squares of z on rot(c) recovers s1 from N* = 16 sigma_z^2 / (tau g^2) signatures.
    For an ODD defect f(x) = x the gain is second order, g = eps^2 B^2/(3 G^2), so N* scales
    as eps^-4; for an EVEN defect f(x) = x^2 it is first order, g = -2 eps B^2/(3 G^2), so
    N* scales as eps^-2 (G = gamma1, B = gamma1 - beta). At toyDSA(32,2,2) with gamma1 = 2^6
    the two fitted slopes are -4 and -2 within +-0.5, and eps = 0 gives no recovery.
  mechanism: >-
    Rejection sampling hides u only because the accepted density of z, p(z - u) restricted
    to the box, is flat. For a perturbed density the u-dependence of the accepted mean comes
    from the perturbation's derivative inside the box: an even perturbation (curvature, as
    produced by summed or edge-biased samplers) has a z-linear cross term -2 eps u z / G^2
    at first order, while an odd linear tilt moves the mean only through the normalising constant
    1 - eps u / G, a second-order effect. So the parity of a sampler defect, not its size,
    sets the exponent of the signature count, which is the quantity a defect triage needs
    and which the uniform-y proof does not discuss.
  tracked_object: >-
    the number of accepted toyDSA signatures N* at which least-squares rounding returns s1
    exactly, against defect size eps, for odd and even defects
