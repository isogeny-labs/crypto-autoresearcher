  minimal_test:
    design: >-
      Generate toyDSA keys; sign uniformly random messages with a mask sampler perturbed by
      eps*f; regress z on rot(c); round; compare with s1; find N* on a doubling grid per (f,
      eps).
    controls:
    - 'null: eps = 0 exact uniform sampler, same N grid'
    - 'positive: rejection disabled (z = y + c s1 always output, ILWE regime of KN-LIT-4828)'
    - 'A/A: even defect eps = 2^-2 in two seed blocks'
  falsification_conditions:
