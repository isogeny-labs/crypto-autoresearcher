idea:
  id: IDEA-20261109-44606b
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Fourier certification barrier: relation supply for prime-field decomposition at beta < 2/m is
    unprovable by character sums, and the Weil-certifiable range prices rigorous interval index calculus
    at exponent at least 3 omega/4'
  class: barrier
  claim: 'Let G = <P> have prime order N, F a subset of G with |F| = B = N^beta, and r_m(R) the number
    of m-tuples in F^m summing to R. Theorem A: |r_m(R) - B^m/N| <= M^(m-2) B for every R, where M is
    the maximum of |hat 1_F(chi)| over chi != 1, and M >= sqrt(B(N-B)/(N-1)) by Parseval. Hence a proof
    that r_m(R) >= 1 for a positive fraction of R which goes through this inequality needs B^(m/2) > N,
    i.e. beta > 2/m, for every factor base, flat spectrum included. Theorem B: for coordinate factor bases
    of points with x in A, the only M the Weil bound yields is 3 p^(-1/2) times the Wiener norm of 1_A;
    for an interval this is 3 sqrt(p)(1+ln p), so the Weil-certifiable range is beta > m/(2(m-1)) up to
    logs (3/4 at m = 3, 2/3 at m = 4, limit 1/2); for generic A the Wiener norm is about p sqrt(B) and
    nothing is certified below beta = 1. Consequences: (1) the relation-yield heuristic at the operating
    point beta = 1/m cannot be discharged by Fourier or Weil methods and must remain numbered or be attacked
    by point counts on the Semaev variety restricted to boxes, higher moments or sieve arguments; (2)
    rigorous interval index calculus has provable supply only at beta >= m/(2(m-1)), where linear algebra
    alone costs B^omega = N^(omega m/(2(m-1))) >= N^(1.5); (3) the certification margin mu = B^(m-1)/(N
    M^(m-2)) at beta = 1/m obeys mu <= N^(-1/2) by Parseval alone and, with the measured M of the spectral-norm
    record, is predicted near N^(-1/2)(2 ln N)^(-(m-2)/2), about 2^-19 at p = 2^28, m = 4.'
  mechanism: Fourier inversion on Z/N gives r_m(R) = (1/N) sum_chi hat 1_F(chi)^m conj chi(R). Separate
    chi = 1, bound each remaining term by M^(m-2) |hat 1_F(chi)|^2 and apply Parseval, sum over chi of
    |hat 1_F|^2 = N B. The Weil input is the hybrid bound |sum_Q psi_a(x(Q)) chi(Q)| <= 3 sqrt(p) with
    1_A expanded in additive characters. The barrier is about proofs that pass through the sup-norm of
    the spectrum; it is not an algorithmic impossibility and leaves non-Fourier rigour open. Diem's rigorous
    extension-field results (KR-IC-64659b) avoid it because the subfield factor base is a subvariety and
    supply is a point count; over F_p every proper subvariety of E is finite (IDEA-20260801-021's bound
    |F cap Z| <= 3 d), so that route does not exist and the Fourier route is the only generic one.
  novelty_status: adaptation
