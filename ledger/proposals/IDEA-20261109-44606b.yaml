  assumptions:
  - omega >= 2 is used only to state the rigorous exponent floor.
  - Log factors are dropped in exponents and kept in the margin predictions.
  predictions:
  - metric: measured margin mu at beta 1/m for m equal 3 and 4, p in [2^20, 2^28]
    direction: lower
    minimum_effect: below 2^-10 at every prime and below N^(-1/2) always
  - metric: fraction of R with r_3(R) >= 1 against 1 - exp(-B^3/N) at beta 1/3, p near 2^20
    direction: different
    minimum_effect: within 10 percent, the heuristic holding while uncertifiable
  - metric: M against sqrt(B(N-B)/(N-1)) and against 3 sqrt(p)(1+ln p)
    direction: different
    minimum_effect: inside both bounds at every prime
  minimal_test:
    design: Reuse the spectral-norm sweep for M. At one prime near 2^20 with beta = 1/3, compute r_3(R)
      for every R by enumerating the B^2 pairs of F (about 2^27 group operations) and report the fraction
      of targets with a decomposition together with mu. Only a pair enumeration over the ic executable's
      point lists is new.
    controls:
    - Random subset of G of size B for mu and the yield fraction.
    - Both theorem bounds on M checked per prime.
    required_metrics:
    - p, N, B, beta, m
    - M, mu and the two bounds
    - yield fraction and its Poisson prediction
  falsification_conditions:
  - A filed proof of r_m(R) >= 1 for a positive fraction of R at beta < 2/m that uses only the sup-norm
    of hat 1_F and Parseval; Theorem A says none exists, so one would expose an error here.
  - M measured outside either theorem bound is invalid arithmetic.
  - Yield fraction off 1 - exp(-B^3/N) by more than 10 percent at p near 2^20 puts the heuristic, not
    the barrier, in question and needs its own record.
  confounders:
  - Symmetric F makes hat 1_F real and signs cancel, so the true error can sit far below M^(m-2) B; that
    does not weaken a barrier about what the inequality certifies.
  interpretation_limits:
  - The barrier concerns a proof route and licenses no algorithmic conclusion.
  - Exponent statements are up to log factors; the margin keeps them.
  heuristic_assumptions:
  - id: H1
    statement: The measured M for the interval factor base is near sqrt(2 B ln N), giving mu near N^(-1/2)(2
      ln N)^(-(m-2)/2).
    rigorous_support: Only mu <= N^(-1/2) is proven; the sharper value is the random regime of the companion
      record.
    validation_plan: Read M from the spectral-norm sweep; no new runs.
  target_complexity:
    time_exponent: rigorous interval index calculus needs at least omega m/(2(m-1)) >= 3 omega/4 >= 1.5
      against 1/2 heuristic; delta at least +1.0
    memory_exponent: B = N^(m/(2(m-1))) >= N^(3/4) for the rigorous variant
    best_known: Pollard rho at exponent 1/2 heuristically; no rigorous prime-field index calculus below
      exponent 1 is known
    hidden_overhead: the decomposition step is uncosted and can only raise the rigorous exponent
    tradeoff_note: Lowering beta below the certifiable range trades a theorem for the numbered yield heuristic;
      there is no intermediate.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: KR-RHO-13bf67 for exponents. KR-IC-64659b dominates the rigorous question over extension
    fields; no row states a prime-field certification range.
  sota_delta: Exponent delta +1.0 or worse for the rigorous variant; the useful delta is a closed-form
    statement of which heuristics character sums can never discharge, at zero compute.
