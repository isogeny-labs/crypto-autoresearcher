idea:
  id: IDEA-20261109-6bd180
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: Trace-one attack on j = 0 anomalous toy curves fails on exactly the canonical lift and succeeds
    linearly in the deformation coordinate, with a same-prime non-anomalous negative arm
  class: representation
  claim: 'Let p = 3 a^2 - 3 a + 1 be prime, E the sextic twist y^2 = x^3 + b over F_p with p points (it
    exists because 2a - b'' = 1 is one of the six traces), and for c in {0, ..., p-1} let E~_c be y^2
    = x^3 + p c x + b over Z_p; E~_0 is the canonical lift since it has CM by Z[omega]. Lift points by
    keeping the integer x and Hensel-lifting y to Z/p^2, and set D_c(P) = t([p] P~) / p mod p. (i) D_0(P)
    = 0 for every P: on the canonical lift the attack fails for every point and every point-lift, because
    E~_0(Q_p) contains a p-torsion Z/p mapping onto E(F_p). (ii) For every c nonzero, D_c(P) is nonzero
    for all P other than O and D_c(kP) = k D_c(P), so k is read from two p-adic digits. (iii) D_c(P) =
    c D_1(P) mod p: the extension class is F_p-linear in the Kodaira-Spencer coordinate c (Serre- Tate).
    (iv) On the same prime, the non-anomalous twists with order N give D''(P) = t([N] P~) / p mod p nonzero
    but lift-dependent, with k_hat = k at frequency about 1/p. Arm B: class-number-one anomalous curves,
    p = (1 + |D| y^2)/4 for D in {-11, -19, -43, -67, -163}, where the lift with integer j = j_D and the
    matching twist fails and j_D + p c with c nonzero succeeds. Statement for secp256k1: the trace is
    about 1.27 times 2^128, not 1, so no deformation class works; the precision p^2 (512-bit) that would
    suffice is never the bottleneck.'
  mechanism: The map P to [p] P~ mod E~_2 is a homomorphism E(F_p) = Z/p to E~_1/E~_2 = F_p because [p]
    E~_1 lies in E~_2; it is zero or an isomorphism. It is zero exactly when the connected-etale sequence
    of E~[p] splits mod p^2, that is for the canonical lift, where the etale quotient is constant because
    the unit root is 1 mod p (trace one), giving Q_p-rational p-torsion over every F_p-point. The lifts
    E~_c form a torsor under H^1(E, T_E) = F_p with E~_c - E~_0 = c times the Kodaira-Spencer class of
    d/dA, and Serre-Tate identifies the torsor with the first-order part of G_m-hat, so the extension
    class, hence D_c, is linear in c. For N different from p the same construction gives a valuation-1
    element varying with the lift, which is arm (iv).
