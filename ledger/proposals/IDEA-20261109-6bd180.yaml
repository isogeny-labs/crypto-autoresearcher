  assumptions:
  - a is chosen so that p = 3 a^2 - 3 a + 1 is prime between 2^24 and 2^30; p = 1 mod 3 follows.
  - The anomalous twist is found by testing [p] P = O on a random point for each class of b in F_p^x modulo
    sixth powers.
  - Z/p^2 arithmetic is projective; t = -X/Y.
  predictions:
  - metric: fraction of P with D_0(P) = 0
    direction: higher
    minimum_effect: 1.0
  - metric: fraction of (c nonzero, P, k) with D_c(P) nonzero and D_c(kP) = k D_c(P)
    direction: higher
    minimum_effect: 1.0
  - metric: fraction of (c, P) with D_c(P) = c D_1(P) mod p
    direction: higher
    minimum_effect: 1.0
  - metric: k_hat match frequency on the non-anomalous twists
    direction: lower
    minimum_effect: at most 10/p
  - metric: arm B failure set over c
    direction: different
    minimum_effect: exactly the single class c = 0
  minimal_test:
    design: Search a in [2^12, 2^15] for prime p; find the anomalous twist; for c in {0, 1, 2, random,
      p-1} and 10^3 random (P, k) compute D_c with Z/p^2 arithmetic; run arm (iv) on the other five twists
      with their N; run arm B for two D values with y chosen so p is prime near 2^28, lifting by the integer
      j_D and by j_D + p c. About 50 group operations per D value.
    controls:
    - Standard positive control, a random anomalous curve with j not 0 or 1728 and the naive integer coefficient
      lift must succeed on all points except with probability about 1/p.
    - Sanity, [p] P = O on E(F_p) for the chosen twist and [N] P = O on the others.
    - A canonical-lift arm run with precision p^3 must still give t([p] P~) in p^2 Z_p, ruling out a precision
      artefact.
    required_metrics:
    - D_0 zero rate
    - success rate per c
    - linearity-in-c rate
    - k_hat match rate on non-anomalous twists
    - arm B failure classes
  falsification_conditions:
  - Any valid sample with D_0(P) nonzero, or any c nonzero with D_c(P) = 0 for some P other than O.
  - Prediction (iii) failing while (i) and (ii) hold kills only the Serre-Tate linearity reading, which
    is then recorded as such.
  - A non-anomalous twist with k_hat match rate above 100/p on two seeds would contradict the gate of
    lead 1 and must be escalated.
  confounders:
  - Choosing a twist with p points but lifting a different twist's b silently changes the curve; verify
    the reduction of E~_c mod p is E.
  - In arm B, the wrong quadratic twist of the integer-j lift reduces to the twist of E, not E; check
    the trace of the reduction.
  interpretation_limits:
  - Results are about trace-one toy curves and a 1/p-measure failure set; they move no exponent and do
    not transfer to p not dividing N by construction.
  heuristic_assumptions:
  - id: H1
    statement: The family c maps bijectively onto deformation classes mod p^2 and the attack homomorphism
      is linear in c.
    rigorous_support: Serre-Tate theory and the Kodaira-Spencer computation sketched in the mechanism;
      not written out in this session.
    validation_plan: Prediction (iii) over all c at p near 2^24, full enumeration of c for one small prime
      near 2^12.
  target_complexity:
    time_exponent: polynomial in log p for trace one only; N^(1/2) unchanged otherwise, delta 0
    memory_exponent: O(log p)
    best_known: Trace-one attack (KR-RHO-53c89f) on anomalous curves; Pollard rho (KR-RHO-13bf67) elsewhere
    hidden_overhead: None; two p-adic digits suffice.
    tradeoff_note: Not a tradeoff; a classification of which lifts the known attack fails on.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: KR-RHO-53c89f dominates the attack itself; this record only fixes the exact failing lift
    and the same-prime negative.
  sota_delta: 'Exponent 0. Counted delta: the failing set of lifts is exactly one deformation class, success
    is linear in the deformation coordinate, and on the same prime the non-anomalous twists sit at chance.'
