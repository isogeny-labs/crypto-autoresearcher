idea:
  id: IDEA-20261109-2d33e1
  added: '2026-11-09'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-f655d3
  title: 'Positive transfer control: trace-2 toy curves with embedding degree 1, Tate self-pairing into
    F_p^* and ca_indexcalc, scored by ladder slope against matched rho'
  class: control
  claim: 'For primes p in [2^28, 2^44] with (p - 1)/2 = N prime, a random search over y^2 = x^3 + ax +
    b finds a curve with trace 2, hence order p - 1 = 2N and k = ord_N(p) = 1, in an expected number of
    point counts of order sqrt(p). On such a curve E(F_p) is cyclic, the reduced Tate pairing e(P, P)
    is nontrivial, and e(P, Q) = e(P, P)^{k_DL} moves the instance into the order-N subgroup of F_p^*,
    where cryptanalysis ca_indexcalc.h (p < 2^63) solves it. Prediction fixed before any run: the charged
    slope of the transfer pipeline (Miller loop plus index calculus) against log2 N is at most 0.40 and
    the slope of matched ca_rho.h is at least 0.45, while wall clock may favour rho at every rung. The
    control certifies that the lane''s instrument detects a real transfer by slope, not by toy wall clock.'
  mechanism: N dividing p - 1 and p + 1 - t forces N to divide t - 2, and N > 2 sqrt(p) + 2 forces t =
    2, so embedding degree 1 at full-size N is exactly the trace-2 family; its CM discriminant -8N is
    huge, so curves must be found by search, and the sqrt(p) search cost caps the ladder near 44 bits.
    With E(F_p) cyclic of order 2N, N E(F_p) is the 2-torsion, P generates E(F_p)/N E(F_p), and nondegeneracy
    of the reduced Tate pairing gives e(P, P) != 1 (the k = 1 self-pairing phenomenon, recalled). The
    pairing is a homomorphism from the group generated by P into mu_N inside F_p^*, so the logarithm is
    preserved; the F_p^* DLP is subexponential, so the slope must fall below 1/2.
  novelty_status: adaptation
  citations:
  - ref: KR-RHO-53c89f
    provenance: internal
    claim: MOV/Frey-Ruck transfer applies when the embedding degree is small; this control instantiates
      k = 1 at toy size.
    verified_by: REPO BRIEF 2026-11-09 section 3; file not opened
  - ref: IDEA-20260805-cc4c2c
    provenance: internal
    claim: an anomalous transfer control CTRL-ANOMALOUS-TRACE1 exists; this record is the pairing counterpart
      and does not duplicate it.
    verified_by: REPO BRIEF 2026-11-09 section 2 excerpt; ledger file not opened
  - ref: IDEA-20260805-4d31bc
    provenance: internal
    claim: the program's estimator is a ladder slope, not a toy wall clock; this control adopts it.
    verified_by: REPO BRIEF 2026-11-09 section 2 excerpt; ledger file not opened
  assumptions:
  - Safe primes exist at each rung and point counting at or below 44 bits is fast (Pari ellcard or Sage).
  - ca_indexcalc.h returns verified logs in Z_p^* for p < 2^63 as the cryptanalysis README states.
  predictions:
  - metric: trace-2 search cost in point counts divided by sqrt(p), per rung
    direction: different
    minimum_effect: between 0.05 and 20 (a sanity band)
  - metric: fitted slope alpha_T of charged transfer cost against log2 N
    direction: lower
    minimum_effect: at most 0.40
  - metric: alpha_rho minus alpha_T
    direction: higher
    minimum_effect: at least 0.10
  minimal_test:
    design: 'Rungs 28, 32, 36, 40, 44 bits; one safe prime per rung, random (a, b) until trace 2 (count
      attempts). Fix P of order N and five random Q. Transfer: Miller loop for the reduced Tate pairing
      (Sage tate_pairing or a short implementation), then ca_indexcalc on e(P, P) and e(P, Q), log ratio
      mod N, verify Q = k P. Baseline: ca_rho.h with negation map on the same (P, Q). Charge both in field
      multiplications and in wall clock; fit slopes by least squares.'
    controls:
    - null: same Miller loop on a prime-order curve of the same bit size with large k; because N does
        not divide p - 1 the reduced pairing is identically 1 and no instance transfers.
    - e(P, P) != 1 recorded at every rung.
    - Matched rho on the same instances.
    required_metrics:
    - p, N, t, attempts, k
    - e(P, P) != 1 flag
    - charged cost per rung for transfer and for rho, slopes with standard errors
    - verification of the recovered k_DL
  falsification_conditions:
  - alpha_T above 0.45 with standard error below 0.05 across five rungs; then the instrument cannot see
    a real transfer and the lane's negative results are uninformative.
  - e(P, P) = 1 at any rung, or the recovered k_DL fails Q = k P (implementation error; stop).
  - Trace-2 search exceeding 100 sqrt(p) point counts at a rung is infrastructure, not evidence.
  confounders:
  - ca_indexcalc has a fixed setup cost that flattens small rungs; report slopes with and without the
    28-bit rung.
  - Rho at 2^44 takes milliseconds; use charged operation counts for the primary slope.
  interpretation_limits:
  - A passing control validates the instrument on a k = 1 family; it says nothing about secp256k1, whose
    k is certified in the sibling certificate record.
  heuristic_assumptions:
  - id: H1
    statement: trace-2 curves occur with probability about c/sqrt(p) over random (a, b), c between 0.05
      and 2.
    rigorous_support: 'Deuring: the number of F_p-isomorphism classes with trace t is the Kronecker class
      number H(t^2 - 4p), of size about sqrt(p) up to logs (recalled).'
    validation_plan: the attempts-per-rung metric in this record's search script.
  target_complexity:
    time_exponent: not applicable to secp256k1; on the control family the transfer is L_p(1/2) against
      N^{1/2}
    memory_exponent: index-calculus factor base, subexponential
    best_known: rho N^{1/2} on the curve side; NFS L_p(1/3) on the field side (ca_indexcalc is L_p(1/2))
    hidden_overhead: trace-2 search at sqrt(p) point counts, charged separately
    tradeoff_note: a control; it moves no exponent for the target curve
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  dominated_by: KR-RHO-53c89f names the mechanism; no row or ledger record in the brief runs a k = 1 control
    through the program's slope estimator.
  sota_delta: 'Exponent delta 0 for the target. Instrument delta: a positive control for the transfer
    lane with a sub-0.5 slope target.'
