  title: >-
    Memory-capped sieving: success and cost when G6K's database is held below the 2^{0.2075n}
    list size, on both schemes' lattices
  class: measurement
  claim: >-
    Holding G6K's database size factor below 1 (0.5, 0.7, 0.85 of default) at dims 60-90 on
    ML-KEM- and ML-DSA-shaped lattices, the saturation success probability falls below 0.5
    at a factor of about 0.7, and the cost-memory tradeoff exponent (d log time / d log memory)
    near the floor is at least -2, so memory-charged cost with an area-time price cannot be
    lowered by more than 2 bits by shrinking memory.
  mechanism: >-
    Memory-charged cost models (area x time) reward smaller memory only if time does not explode.
    The tradeoff near the minimal list size is unmeasured; 7bc28c prices access pattern, fc6361
    counts saturation balls at full size, 70e41d moves the crossover with memory price. This
    measures the time penalty of capping memory directly, one instrument for both schemes.
  tracked_object: >-
    Saturation success probability and op count to saturation as functions of database cap,
    per dimension and shape.
