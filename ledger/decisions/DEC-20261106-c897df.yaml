  rationale:
    - >-
      DG-1 prescribes its own outcome for an unavailable knowledge base: dispatch
      stays blocked, the approval does not expire, the impediment is recorded on
      the goal. The facts are that case. Satisfying it would waive a gate I wrote
      for a reason it anticipated.
    - >-
      The sibling-repository half is real progress and is credited as a bounded
      negative result for what was searched. It does not cover the published
      literature or the unreviewed lead-atlas paths, which is what the missing
      half is for.
    - >-
      A 7.3 to 7.7 h pass with an unrecoverable .started marker makes duplicate
      or misdirected compute expensive. The environment that cannot serve
      research-kb is also unsuitable to run the pass, so the two blockers close
      together on a different host.
    - >-
      A detached launch is required for any launch and is not sufficient. The run
      is not recommended in this session.
