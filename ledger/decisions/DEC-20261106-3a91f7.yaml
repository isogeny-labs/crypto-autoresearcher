    repeat_allowance: >-
      If the reopened session stops again in S02-trials before the supervisor runs (step_finished
      data has no supervisor_argv, and runs/ has no RUN-ICPERF-8b0d47 or RUN-ICPERF-5ffa79), with
      failure_class infrastructure_error from the claim, its push, the claim fetch, or the
