  # ---------------------------------------------------------------- ruling 1
  stop_classification:
    session: RBS-ICPERF-de8978
    class: infrastructure_error
    subclass: GitHub server error (HTTP 500) on the claim publish push, before the supervisor ran, no submission, no spend
    basis:
      - "journal.jsonl seq 6 step_finished S02-trials attempt 1: status failed, failure_class infrastructure_error, exit_code 2, detail 'claim failed (exit 2)'. data has claim_argv and no supervisor_argv. seq 7 session_finished status stopped with the same class. Journal tip 2ed8c747..., VERIFY OK (reported)."
      - "steps/S02-trials.attempt-1.claim.stdout: 'claimed TASK-20261106-724d14 -> .../claims/TASK-20261106-724d14.1.claim.json'. claim.stderr: 'REFUSE: git push failed: ... remote: Internal Server Error ... ! [remote rejected] claude/c1-launch-20261106 -> claude/c1-launch-20261106 (Internal Server Error)'. The remote-side 500 is a GitHub transient. It is not a defect in our bytes."
      - "tools/runbook.py _supervise returns infrastructure_error from the claim branch (code != 0) before _sync_claim and before tools/experiment_execution.py run. No run directory can exist, because execute_trial makes it exclusively and only the supervisor calls it. experiments/EXP-ICPERF-127dbd/runs/ holds only RUN-ICPERF-c7f69e, so launch_eks.sh never ran in this session."
      - "seq 4 and seq 5 unit_recorded for T1 RUN-ICPERF-8b0d47 and T2 RUN-ICPERF-5ffa79: receipt_status not_run, run_dir null, receipt_sha256 null, valid false. These are journal placeholders, not runs."
    rulings:
      - "Infrastructure signal, not evidence (AGENTS.md rule 5). Nothing about C1 sessions S1 or S2 was observed. No negative result exists, and H-ICPERF-4cb536 stays as it is."
      - "Not terminal. docs/runbook-execution.md: 'A session stopped by infrastructure_error or resource_exhaustion may be reopened by rerunning once the cause is fixed (session_reopened)'. tools/runbook.py REOPENABLE = (infrastructure_error, resource_exhaustion). run() appends session_reopened and resumes at the first step not done, here S02-trials attempt 2, because S01-probe has passed. The cause is external and transient, and it has cleared: the step-6 push of the same branch succeeded."
      - "Not a protocol section 9 infrastructure outcome. No C1 job was launched, so no -r2 trigger occurred and the -r2 allowance stays unconsumed (DEC-20261106-ecf261 request_ruling)."
      - "Budget: USD 0 contributed to actual_spend. No job was launched, so no hard bound is assigned. Spent to date is USD 0."

  # ---------------------------------------------------------------- ruling 2
  run_id_ruling:
    consumed: false
    ids: [RUN-ICPERF-8b0d47, RUN-ICPERF-5ffa79]
    basis: >-
      A run id is consumed when the supervisor creates its run directory (experiment_execution.py
      execute_trial: 'directory.mkdir()  # exclusive; even an empty interrupted attempt is never
      reused') or when a release binds its execution receipt (goal_lanes.py
      failed_run_has_bound_execution_receipt). Neither happened. No directory, launch.json,
      receipt, raw result, S3 object or AWS submission exists for either id, and no release
      exists. The journal's not_run unit entries are superseded on reopen. tools/runbook.py
      latest_units keeps the last unit_recorded per (step, trial), and verify re-evaluates every
      unit. Reusing the ids is therefore not a redispatch of a consumed registration. It is the
      first execution of each, in the same session that registered them.
    replacement_ids: none. The reopen uses T1 RUN-ICPERF-8b0d47, then T2 RUN-ICPERF-5ffa79, session RBS-ICPERF-de8978, task TASK-20261106-724d14, snapshot TASK-20261106-d5ec1e and card CARD-EXP-ICPERF-127dbd-2, all unchanged.
    why_not_a_new_session: >-
      A new session id would need a recompiled runbook (session_id is bound), new run ids, a new
      trial plan and specification (required_artifacts), a new executor handoff (its
      artifact_paths name RUN-ICPERF-8b0d47 and RUN-ICPERF-5ffa79), a new card, a new snapshot
      handoff, a new queue and a new approval with a probe. The tool provides reopen for exactly
      this stop class. Recompiling would be the larger and less lawful change.

  # ---------------------------------------------------------------- ruling 3
  claim_ruling:
    claim: {task: TASK-20261106-724d14, epoch: 1, owner: executor-mechanical-icperf-127dbd, branch: claude/c1-launch-20261106, acquired_at: '2026-11-06T23:09:40Z', expires_at: '2026-11-07T01:54:40Z', commit: 82dd4ae094, on_origin: true, released: false}
    blocks_new_claim: >-
      Only while it is live. goal_lanes.py claim_task refuses another claim on a live claim
      (unless --force, which is forbidden here) and allows epoch 2 once epoch 1 is expired or
      released. The release would be artifact-free, so the receipt-bound block does not apply.
    must_not_be_reused: >-
      If epoch 1 is still live at the reopen, runbook.py _live_claim_epoch finds a live claim
      with the session owner (the journal fixes owner executor-mechanical-icperf-127dbd), and
      _supervise reuses epoch 1 with only its remaining TTL. experiment_execution.py stops a
      trial with claim_expired when the claim expires. The step needs up to 9600 s, and the
      claim TTL of 165 min (9900 s) is sized for that. A partly used epoch 1 could kill the
      supervision of a paid EKS job. So the reopen runs only after epoch 1 has expired.
    how_released: >-
      Epoch 1 is left to expire at 2026-11-07T01:54:40Z. It is not released. Its owner session
      has ended, and tools/goal_lanes.py says 'only the owner releases (fencing). If the owner is
      gone, let the claim expire.' No other session releases it as
      executor-mechanical-icperf-127dbd, and nobody claims with --force. The Coordinator records
      here that the expiry is the planned end of epoch 1, not a crash to reconcile. On reopen,
      runbook.py claims epoch 2 (supersedes {epoch 1, status expired}) with a fresh 165-min TTL,
      publishes it, proves it on the fetched branch, and releases it as completed or failed after
      the supervisor.

  # ---------------------------------------------------------------- ruling 4
