  conditional_enable:
    authorized_delta: >-
      After all prerequisites below are freshly evidenced, change only
      TASK-20261028-43b2e0 in dispatch_queue.json from blocked to queued;
      remove its now-stale blocked_reason and the required trailing comma.
      Preserve the other three task objects, all handoff bytes, dependency
      graph, four V artifact paths, budgets, queue-level gate and old batches.
      If source queue SHA differs from the pinned original, stop and
      recalculate the minimal patch; never apply a stale patch blindly.
    prerequisites:
      - >-
        Verify DEC-20261029-fa59cd, its checkpoint and exact admission
        evidence are archived, pushed and reviewable at one exact remote
        head, and read back their hashes. Resolve the companion plan's
        prospective fields without inventing a claim, epoch or V outcome.
      - >-
        Refresh current main and source refs and the authoring checkout;
        merge current main and validate the enable delta with DEC schema,
        exact queue semantic diff, native ready-only off/refs, artifact policy
        and merge hygiene. Reconcile any relevant change before using this patch.
        Hosted full-ledger run 40828608670 attempt1 job123297490863 checked
        out main 8adde006c1de2c4331608e85b328071e59e89e4c and produced
        a complete 64-error report byte-identical to e3fe/main981; native
        ci_ledger_gate passed no-regression. This validates that main base,
        not the future enable commit. Absolute corpus cleanliness remains
        false, and a sparse checkout refusal is not a passing validation.
        Full exact-PR-head CI remains a merge gate, not a prerequisite for
        this administrative enable review; do not claim it passed early.
      - >-
        Recheck the exact P/A completed releases and all 21/11 artifact
        hashes, A's 31-path content_at_commit archive and original M receipt,
        19 historical source mappings, the frozen plan and original batch
        bytes. A later legitimate V queue edit does not rewrite A's release
        or require the mutable queue to match original M forever.
      - >-
        Refresh all remote refs and scan all six RELN lanes and every
        refs-aware native claim with complete Git output. Require zero
        competing live claims, goal-wide max_concurrent=1 and no lane
        takeover. A partial or errored ref scan is STOP, not zero owners.
      - >-
        Recheck Conductor project experiments presence/owner and allow for
        exact DEC, checkpoint, admission, queue and V review/task scopes.
        Reconcile native claims with presence and stop on conflict or unknown.
      - >-
        Recheck exact V receipt002/session ID, actual provider/model/effort,
        CLI, read-only sandbox, cwd, binding digest and independent history:
        fixed probe only, no producer or V review turn, no fallback or
        degradation. Do not use failed001, P or Coordinator sessions for V.
        Renderer and resource preflights must remain valid for the planned
        mechanical route. Actual claim owner/epoch/expiry are still unset.
    failure_rule: >-
      If any prerequisite remains unknown or fails, keep V blocked and
      archive the exact impediment rather than an enabled queue. No forced
      claim, new V session, model substitution or scientific execution.
    after_publication: >-
      Publish and read back the exact enable DEC, checkpoint and minimal
      queue edit before any V claim. Then run fresh ready-only/native refs,
      six-lane ownership, source and Conductor checks again. One accountable
      owner may acquire a finite native epoch under the original task budget.
      Publish the separate actual-epoch owner-writer authorization note
      required by fa59cd before any V output. V model work, four-output
      completion check, producer landing, exact-epoch release and dependent
      L archive remain later distinct acts.
  preserved_limits:
