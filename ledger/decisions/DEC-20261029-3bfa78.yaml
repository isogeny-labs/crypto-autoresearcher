    named the repair RR-ICPERF-V2-QUEUE-20261029. It declined option B (raise
    the cap on a headroom basis and open one shared lane) for two reasons: the
    requesting session had limited the work to "within goal concurrency", and
    idle capacity alone does not justify admitting a lane. The user has now
    explicitly directed that the cap be raised so these successors can get a
    lane.

  user_direction:
    date: '2026-10-29'
    relayed_by: top-level session (the agent that launched this Coordinator)
    verbatim: >-
      "Raise GOAL-ICPERF-e6b6a4's max_concurrent from 2 to 3 so the v2 ICPERF
      successors can get a lane. Record this as a Coordinator decision,
      citing the user's request, using the repo's route for changing goal
      concurrency."
    route_used: >-
      There is no dedicated tool for changing goal concurrency. The repo's
      route is a committed Coordinator decision that edits
      ledger/goals/<GOAL>/goal.yaml campaign_budget.max_concurrent and its
      max_concurrent_basis in the same ledger archive. AGENTS.md ("ECC comes
      first", rule 1) and docs/agent-contract-extended.md (line 509) say that
      max_concurrent is machine headroom. docs/agent-contract-extended.md
      (lines 886-896) says that sizing it is the dispatching Coordinator's
      responsibility. The clears_when of IMP-ICPERF-V2-LANE-20261029 names "a
      Coordinator decision [that] revises max_concurrent". This record is
      that decision. Its archive is TASK-20261029-9a6d9d.

  honesty_about_316bfb:
    option_B_was_declined_because: >-
      (1) The requester then limited the work to "within goal concurrency".
      (2) agents/coordinator.md (Focus discipline) says that idle parallel
      capacity does not justify admitting another lane. DEC-20261029-316bfb
      also said that a headroom revision should be prompted by something
      other than admitting this work.
    what_changed: >-
      Only the instruction changed. The user has now explicitly directed this
      revision, and that replaces the earlier "within goal concurrency" limit.
      The machine figures below are a fresh reading. They are not offered as
      the reason for the change. Idle capacity is still not a reason to admit
      a lane, and this decision does not rely on it.
    impediment_clause_not_met: >-
      IMP-ICPERF-V2-LANE-20261029 clears_when allows "a Coordinator decision
      [that] revises max_concurrent on a headroom basis prompted by something
      other than admitting this work". That condition is NOT met. This
      revision is prompted precisely by admitting this work. The clause was the
      Coordinator's own restraint, written in DEC-20261029-316bfb. It is
      superseded here by the user's explicit direction, and this record says
      so rather than claiming the clause is met. The impediment's other
      conditions still stand: the repair must be merged together with the
      lane, and both probes must report approvable true at source_ref
      origin/main. The impediment is not cleared by this record.

