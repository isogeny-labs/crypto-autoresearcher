  rationale:
    - >-
      The user explicitly directed the revision, and sizing max_concurrent is
      the Coordinator's responsibility. A committed decision that edits the
      goal head in its own ledger archive is the route the repo provides.
    - >-
      The cap stays bounded machine headroom, as AGENTS.md "ECC comes first"
      rule 1 requires. A fresh reading (4 CPUs, 14 GB available, load average
      0.59 / 1.71 / 1.50) against 256 MB, 60 s, queue max_concurrent 1
      integer trials shows the third lane adds no load that degrades other
      runs. The quiet-machine rule is kept for solver benchmarks.
    - >-
      One shared lane, not two, keeps the open-lane count at exactly 3. That
      count stays at 3 whether or not PR #2439 lands, because it swaps one
      lane for another.
    - >-
      Opening the lane does not make the contracts runnable. Repair
      RR-ICPERF-V2-QUEUE-20261029 must still move both trial-plan queue fields
      onto the lane's queue, and the probe must pass at source_ref origin/main.
      Approval remains a separate, later decision.
    - >-
      The repair is ranked ahead of doing nothing. It is the only remaining
      structural step between two complete, designed ECC contracts and a
      decidable approval. It runs no trial.
