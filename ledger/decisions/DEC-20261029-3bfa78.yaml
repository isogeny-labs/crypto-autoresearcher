    with the observed load average and flagged. The rule also applies the
    other way: TASK-20261029-65798b and TASK-20261029-f370f1 are not
    dispatched onto a host where a quiet-machine solver benchmark is running.
    The cap of 3 counts lanes. It does not admit a second solver task beside
    a solver benchmark.

