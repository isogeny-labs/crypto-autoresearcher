  specification_bind_ruling:
    question: >-
      RR-ICPERF-V2-QUEUE-20261029 says the repair "updates each runbook's
      trial-plan bind and also the specification bind the design return
      already requires at approval". Does this repair move the runbook's
      specification bind to the prospective approved-spec sha256 (704b0f...
      for EXP-ICPERF-284bc4, 491106... for EXP-ICPERF-283a70)?
    ruling: >-
      No. In this repair the runbook specification bind stays at the
      review_required bytes (8634d6... for EXP-ICPERF-284bc4, 3b36b0... for
      EXP-ICPERF-283a70). The clause is read as pointing to the approval-time
      step that the design return already requires (protocol_deviations,
      bullet 4). It is not read as a step of this repair. That step belongs
      to the approval archive in the next PR: commit specification.preview.yaml
      as specification.yaml, update that one bind, re-lint, and have
      DEC-20261029-ca33b3 / DEC-20261029-0e40f3 name the new runbook_sha256
      and lint receipt.
    why: >-
      If the bind were moved now, it would no longer match the
      specification.yaml on disk, and lint would refuse it. If the approved
      bytes were committed now to make it match, assess() would refuse the
      canonical specification as already approved, and it would no longer be
      the review_required bytes committed at source_ref. The two orderings
      exclude each other. Only the approval-time ordering lets both the probe
      and lint pass. This ruling only fixes the order of the steps. It
      changes no byte that DEC-20261029-316bfb fixed and no criterion.
    consequence_for_approval: >-
      The packet's lint receipt describes the pre-approval runbook. The
      approval archive replaces the runbook and lint receipt. The
      post-approval gate is therefore tools/newest_experiments.py reporting
      execution_state ready against the approved bytes. Any mismatch stops
      dispatch and needs an additive correction (AGENTS.md, "Approval is
      bounded by execution").

