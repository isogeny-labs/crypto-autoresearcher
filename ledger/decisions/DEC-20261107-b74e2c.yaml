    commits: {claim_epoch_2: 7da9049467, release_failed: 6f81fb38db, run_record: 4166fb89d2, base: 944a2ba5a9}
    cloud: {job: ic-c1-dg-s1-20261106, job_uid: 8a20d036-efc2-45d2-ada6-6442b93c5a52, pod_uid: 5885ba61-53c2-4e2e-8a47-ff1ff04ee2e7, launcher_build: 47cf1e4f-10a7-4ee3-862d-9e9700e122e3}
  rationale:
    - "Validity before interpretation: 2 planned units, 0 valid. T1 is needs_reconciliation, and T2 never ran. The run set is incomplete, so it is not evidence (rule 5)."
    - "The failure is ours and it is deterministic. The pinned launcher never names results for a failed Job, and the expected exit 42 always fails the Job. Calling it infrastructure would make it reopenable and would repeat it on S2."
    - "The smallest lawful path to S1's data is a read-only transfer bound to the consumed run id. A relaunch or -r2 would spend money and create a second S1 from which one could choose."
    - "Section 9 item 3 pre-registers that a launcher defect affecting both sessions is fixed by a protocol_amendment. Following it keeps the fix pre-data for S2."
    - "Scope: constant-factor counted engineering at fp28 (DEC-20261106-c69de4). No asymptotic, wall-time or rho-beating claim is made."
  evidence_refs:
    - experiments/EXP-ICPERF-127dbd/runs/RUN-ICPERF-8b0d47/raw-result.json (sha256 278a27d4..., per receipt)
