        and it may be cited only for that. It is not citable as a pass of the
        stage-0 instrument cell, or as evidence about H-ICPERF-5adc9b. Its
        "clean" audit verdict has no replay power (miss probability 1.0 at
        every rate).
    run_RUN-ICPERF-b09be8:
      citability: invalidated
      scope: >-
        Invalidated as evidence for or against H-ICPERF-5adc9b and as a pass or
        fail of the stage-0 instrument cell. The receipt says invalid_output and
        published false: run.py writes a 9-line manifest (177 bytes) that fails
        check_run with 8 errors under both the run-era and HEAD validators.
        This is a named LGN-8 instance. The raw-result.json values (2943,
        289567, 28, both flags true) are the output of an invalid unit, not an
        observation of the success criterion. The record stays as written. No
        supersession, quarantine or replacement manifest is filed
        (DEC-20261028-f8c018). LGN-8 triage stays separate.
        provenance_quarantine does not apply, because the execution provenance
        is recorded.
    infrastructure_versus_science: >-
      This is an implementation failure of the instrument's manifest writer. It
      is infrastructure signal, never negative evidence about the sampler or
      host latency (AGENTS.md rule 5). failure_class implementation_error on
      the step describes the manifest, not the sampler (escalation F7 and
      claim 1).

  findings_adopted:
    - id: F2
      ruling: >-
        Adopted. HEAD's tools/experiment_execution.py complete_manifest adds
        result.certificate {kind: none} only when the driver wrote
        attack_claimed false. Neither manifest.yaml nor raw-result.json carries
        attack_claimed, so the supervisor would refuse a rerun of the frozen
        run.py (EnvelopeRefused). The reader inferred this from code and did not
        execute it. The top-level session confirmed by grep that neither
        EXP-ICPERF-b2f2d0 nor EXP-ICPERF-e467a5 run.py emits attack_claimed.
        So no unchanged rerun is ranked, under this session id or any other.
    - id: F3
      ruling: >-
        Adopted. The runbook encodes neither the success criterion (2943,
        289567, 28, both flags true) nor the falsification criterion. It has
        controls: [], summarises 2 of the 5 primary metrics (sample_sum,
        cv_in_band), and omits sum_squares, median, median_ratio_in_band and
        elapsed_seconds. cv_band and median_ratio_band are not spec_bindings.
        Even a valid unit could not have recorded success or falsification by
        itself.
    - id: F4
      ruling: >-
        Adopted as a design limit of the specification, not a defect of the
        session. The escalation reader computed (null-object check, under the
        audit directory, not a trial) that 6635 of 21207 non-degenerate wrong
        xorshift triples (31.3%) pass both bands. The support-{0,...} reading
        also passes. The correct sampler passes both bands on only 48.2% of
        seeds 1..2000, and passes both with no median split on 11.95%. The
        bands are therefore not controls. The amendment must make exact-integer
        reproduction the decisive success criterion, which leaves the frozen
        criterion unchanged: it already names the three integers. The band
        flags stay reported as descriptive fields. The amendment must also add
        a real negative control that has to fail the exact match, such as a
        wrong shift triple or the support-{0,...} reading.
    - id: F5
      ruling: >-
        Adopted. The version-2 specification must state the recurrence:
        xorshift32 left/right/left with shifts (13, 17, 5) mod 2^32,
        step-then-test, count of trials with support {1, 2, ...}, the stream
        continuing from the previous stop, and the seed itself not a tested
        state. The text then determines the sample without a convention. The
        (13, 17, 5) attribution to Marsaglia (2003) is recalled provenance, a
        pointer only. The specification must state the triple as its
        definition, not cite it as support.
    - id: F6
      ruling: >-
        Recorded. preflight tracked_dirty true and the unrecorded paths are a
        limitation. The bound files hash equal.
    - id: F1_F7
      ruling: Recorded as stated in audit-review-escalation.yaml. Neither changes this ruling.

