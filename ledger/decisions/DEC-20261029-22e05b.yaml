  rationale:
    - >-
      Validity is checked before interpretation. The run count is 1 and valid
      units 0, the manifest is schema-incomplete, and no unit was replayed. An
      invalid run set goes back for repair with its defects listed (F1-F5); it
      is not evidence.
    - >-
      The frozen run.py is the cause, and F2 shows that HEAD's supervisor would
      refuse it again. A rerun under the same bytes is therefore not a valid
      next step. docs/runbook-execution.md requires an amended runbook with a
      new session id and a new approval.
    - >-
      Keeping the success criterion while encoding it as assertions, and adding
      a negative control, does not change a criterion after seeing an outcome.
      The three integers were preregistered from run.py at design time
      (preregistered_prediction.source), and the version-1 unit produced no
      valid observation. The version-2 record still discloses that readers saw
      the invalid unit's raw values (data_seen).
    - >-
      Scope: this session, this run and version 1 of this contract only.
      Nothing about host latency, probe panels or IDEA-20261015-b41f68 (rule 6).
