    session_RBS-ICPERF-c4a91e:
      citability: scoped
      scope: >-
        Citable as an intact record of one execution. The chain tip is
        f8b72cbc..., and all 8 step-log digests, the S01 output, the 3 unit
        artifacts, the receipt and its 10 artifact digests recompute equal (as
        the escalation reader re-verified). Across all refs, each file has one
