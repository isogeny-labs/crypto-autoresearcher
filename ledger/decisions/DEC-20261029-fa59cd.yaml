      review, in-memory negative controls and attestation. It may read
      committed/published source and write a private outside-repository
      output envelope through its supported output-last-message route.
      It does not write Git, declare a whole-claim verdict, repair producer
      evidence, or borrow any P/A/Coordinator session.
    mechanical_writer: >-
      The separately attributed parent control plane may decode and copy
      exactly V-authored review.json, review.md and review.svg bytes, and
      render report.pdf from V-authored report.typ and SVG using the pinned
      local Typst helper. It may not write or revise a V finding, verdict,
      control outcome, source list, limitation, attestation or diagram.
      Parent's unknown model identity cannot substitute for V's verified
      model. This split must be published and accepted before claim.
    actual_epoch_note: >-
      After native V claim and before any V output, publish an append-only
      TASK-20261028-43b2e0.<actual_epoch>.owner-writer.json note in the
      batch admission root, outside V's review directory. Bind actual
      owner/epoch/expiry/owning session/worktree, V receipt/session, parent
      writer identity and live-owner authorization, source/plan pins and
      exact four paths. Do not invent dual-session fields in the native
      claim. Recheck this live fence before each copy/render/commit/release.
    writer_scope: >-
      Only coordination/goals/GOAL-RELN-001/batches/BATCH-0834cb/reviews/
      TASK-20261028-43b2e0/ and its exact four declared artifact paths.
      The raw envelope is an outside-repository input. The V-authored
      report.typ is first an outside-repository rendering input, then copied
      verbatim as append-only control-plane provenance under the V admission
      directory with actual native turn/envelope/hash attribution. It is not
      a fifth V task artifact. Parent creates no fifth file in V's review
      directory and never rewrites the V-authored source.
    envelope_and_render: >-
      The independent V turn returns one parseable, immutable private
      envelope with the exact three UTF-8 file bodies and V-authored
      report.typ, all intended paths, lengths, SHA256s and turn/session
      provenance. Parent binds the actual native turn from its event stream,
      rather than accepting a model-invented turn ID. Parent verifies the
      envelope before exact byte copy and archives a verbatim source copy
      under admission for PDF replay. Raw envelope stays private if it
      exceeds artifact policy; source/turn/hash attestation remains durable.
      In isolated scratch with fixed fonts, pinned Typst 0.15.0 native
      library SHA256 00618956a34c4863319fdf5e8835ea743f1d3af9d993273d020c4591073d2ef9,
      no shell execution, no #import/#include and root/package isolation,
      render PDF under the same 2-GiB task cap. Keep the neutral helper
      immutable; if actual report source needs an external file, package,
      import/include or helper change beyond the isolated route, stop for
      separate review rather than silently extend.
      Retain actual command, version, font/input hashes, exit, PDF hash,
      pdfinfo warning, text/page/Ghostscript checks and every-page visual
      inspection. No PDF/A or warning-free property is claimed.
    independent_completion_check: >-
      Before completed release, the same receipt-bound V session separately
      re-reads all four actual files read-only, verifies byte hashes,
      authorship, content/attestation, rendered PDF correspondence,
      source and claim fence, and returns PASS or STOP. Parent then checks
      native artifact policy, commits the four exact V artifacts as producer
      content, completes native producer landing, pushes the content and
      reads back all four exact remote blob hashes before the live owner
      publishes a truthful exact-epoch V release. Dependent
      TASK-20261028-73c568 then owns the isolated
      review archive and administrative disposition. An inconclusive/breaks
      review may be a valid report outcome;
      an incomplete or mismatched artifact route is not a completed task.
