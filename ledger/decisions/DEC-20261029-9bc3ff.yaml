  specification_findings_for_the_amendment:
    - id: SF-1
      text: >-
        The three specification controls are algebraic identities of run.py,
        not discriminating controls. In run.py:49-59 ic_online/bl_online reduces
        to c_probe*c_state*bl_den/(bl_num*c_step^2), so r and A cancel. The
        (1000, 4) and (4000, 2) cells can fail only through an inexact
        division. bsgs_probes = (r//A)/states and probes = r/(A*states) are the
        same quantity (run.py:50, 60). The amendment must label them as
        arithmetic-consistency checks or replace them, and must add at least
        one planted negative control that has to fail: for example a perturbed
        price constant, or an online model whose precomputation is not
        states*c_state, which must give a reduced ratio other than 925/4. The
        probe count must also come from a computation independent of the
        formula it is compared with.
    - id: SF-2
      text: >-
        Two of the four primary metrics, price_ratio_den and all_match_bsgs,
        never reach the session summary. The secondary metric elapsed_seconds is
        not summarised. No runbook assertion encodes the success criterion
        (925, 4, true, true). The cells (r, A) are neither bound nor asserted.
    - id: SF-3
      text: >-
        The specification gives the BL online times only as literals (80, 320,
        40 ns). Their model (bl_steps = bl_num*r/(bl_den*A*precomputation_steps),
        precomputation_steps = states*c_state/c_step = 525) appears only in
        run.py. It must be stated in the version-2 specification, as must the
        reading of the factor 10 as bl_den, so the online ratios can be
        re-derived blind.
    - id: SF-4
      text: >-
        run.py writes a manifest that fails check_run, and does not emit
        attack_claimed. HEAD's complete_manifest therefore cannot supply
        result.certificate.kind, and an unchanged rerun would be refused again.
        This is escalation finding F2 of AUD-20261029T011541Z-f9db07, and it
        applies here too: the top-level session verified by grep that this
        run.py also emits no attack_claimed.

