  context: 'Retry session RBS-SEMBIN-620add of EXP-SEMBIN-24ec56 completed 7 of its 19 retries (RUN-SEMBIN-b503a2,
    RUN-SEMBIN-9c21b8, RUN-SEMBIN-ba948a, RUN-SEMBIN-2f97e8, RUN-SEMBIN-74d2c7, RUN-SEMBIN-885673, RUN-SEMBIN-127424),
    lost poly-m4-n11 to a container restart, and was stopped on 2026-11-03 during rand-m4-n11. Measured on the 4-CPU
    host of retry-2: m=4 n=9 cells took 7.0-11.5 h (poly 7.0 h, rand 7.6 h, null-support 11.4 h) against the m=3
    timings the 64800 s watchdog was sized from; rand-m4-n11 ran curve 0 at about 15 min per SAT target over 43
    SAT and 10 UNSAT targets, about 11 h per curve and 33 h per cell. The user chose on 2026-11-03 to stop here
    and hand the remaining cells to a persistent host with a resized retry plan.'
  decision: approve
  decision_scope: APPROVES amendment AMD-EXP-SEMBIN-24ec56-20261103-retry3 and the retry of exactly these 12 trials,
    once each, under the run ids listed under execution_dispatch, through experiments/EXP-SEMBIN-24ec56/runbook-retry3.yaml
    (session RBS-SEMBIN-c3f120; six two-trial steps under TASK-20261103-c3f120, TASK-20261103-690a14, TASK-20261103-ec2dd8,
    TASK-20261103-11e331, TASK-20261103-6bfe7a, TASK-20261103-952d2a) in lane BATCH-821a5d, with 84 h per-cell watchdogs.
    CLOSES TASK-20261031-620add as failed and CANCELS TASK-20261031-0538f3 (its 7 final records are archived by
    TASK-20261103-e9dd0d); retry-2 run ids RUN-SEMBIN-67009b, RUN-SEMBIN-9aac65, RUN-SEMBIN-3ddd63, RUN-SEMBIN-ff7994,
    RUN-SEMBIN-265449, RUN-SEMBIN-57976e, RUN-SEMBIN-f56bc1, RUN-SEMBIN-76decf, RUN-SEMBIN-2abe6f, RUN-SEMBIN-0be9ab
    stay unused. Asserts nothing about any hypothesis; changes no scientific protocol value.
