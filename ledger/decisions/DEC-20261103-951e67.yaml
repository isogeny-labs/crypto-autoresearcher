  rationale:
  - The frozen watchdogs were sized from m=3 timings; measured m>=4 rates are 2x or more beyond them, so as frozen
    the remaining cells could only end watchdog_expired.
  - The watchdog is machine protection, not a scientific parameter; per-job caps, censoring and every scientific
    value stay as frozen.
  - Retries are once each and final whatever their outcome, so no outcome is rerun until it looks favourable.
  evidence_refs: []
  limitations:
  - Toy scale; nothing about n = 131.
  - check.py is producer-written; independent review precedes any status move.
  - The null retries are subject to the same C3 checker-scope question as the completed null trials.
  - Cells at >= 124,314 columns may censor under the 6 GB per-job cap; a censored cell is never negative.
