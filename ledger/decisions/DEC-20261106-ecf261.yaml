  # ---------------------------------------------------------------- ruling 1
  stop_classification:
    session: RBS-ICPERF-e2a5c2
    class: implementation_error
    subclass: wrapper defect before submission (launch_eks.sh duplicate check), no job, no spend
    basis:
      - "journal.jsonl seq 6 step_finished S02-trials: failure_class implementation_error, exit_code 3; seq 7 session_finished status stopped with the same class. Steps: S01-probe passed, S02-trials failed, S03-verify not_run."
      - "RUN-ICPERF-c7f69e/raw-result.json: submitted false, outcome_class other, refusal duplicate_check_failed. stderr.log: InvalidInputException from BatchGetBuilds ('Invalid build ID provided'), then 'duplicate check failed (codebuild batch-get-builds)'."
      - "Cause (FINDINGS.md, reproduced read-only by the top-level session, F3(a)): line 174 of launch_eks.sh 130164868... ran list-builds-for-project with --max-items 100 --output text. Under aws-cli 1.46.2 this appends the pagination token to the text output, so the 101st word, 'None', was passed to batch-get-builds as a build id. --dry-run makes no AWS call, so S01 and every dry run missed this path."
      - "No submission: S3 runs/ic-c1-dg-s1-20261106/, runs/ic-c1-dg-s2-20261106/ and both -r2 prefixes hold 0 objects, and inputs/requests/21728056...dec.json does not exist (F5). The fixed duplicate check found no CodeBuild build carrying the S1 request key (F3(b))."
    rulings:
      - "The stop is terminal. Under docs/runbook-execution.md, a stop with any class other than infrastructure_error or resource_exhaustion is terminal. The fix also changes bound bytes, so the session could not be reopened under its runbook in any case. RBS-ICPERF-e2a5c2 is closed and is never reopened, resumed or rerun. Its journal and run files stay as written."
      - "The trial receipt of RUN-ICPERF-c7f69e has status infrastructure_error. That is the supervisor's label for a nonzero driver exit, and it stands as written. It is not a protocol section 9 infrastructure outcome (timeout, crash or host loss of a launched job), because no C1 job existed. Nothing about the C1 sessions S1 and S2 was observed."
      - "Not evidence. RUN-ICPERF-c7f69e is neither a C1 observation nor a negative result (AGENTS.md rule 5). RUN-ICPERF-6f784c was never created. Both ids are consumed and are never reused."
      - "This was neither host loss nor a deadline hit. Neither protocol rerun rule is triggered, and no -r2 allowance is consumed (ruling 3)."
      - "Budget: the stopped session contributes USD 0 to actual_spend. The rule is 'billing, else the job's HB', and no job was launched, so it assigns no hard bound."

  # ---------------------------------------------------------------- ruling 2
  wrapper_fix_ruling:
    ruling: >-
      accept_with_amendment. v2, the duplicate-check fix, is accepted. The bytes that run are
      v3a: v2 plus the amended manifest of manifest_amendment_ruling.
    bytes_that_run:
      path: experiments/EXP-ICPERF-127dbd/implementation/launch_eks.sh
      version: v3a
      sha256: 0fcdd67e22f6105c36883bf9ba7edb62e512e6ff135979e0b63084fb2c9b7dc0
      not: 7dbe33eb56843daa47885e58df644371b86052c7c42e4f11bcf38c17bc9d386d (v3, rejected)
      replaces_sha256: 130164868a21d1b1ee4ff66ba89ea0c4fdfee2e20decc6451abd2ab10ef6d41f
      committed_in: d2db4c34f4 on claude/c1-session2-20261106 (recompile commit)
    accepted_bytes:
      path: experiments/EXP-ICPERF-127dbd/implementation/launch_eks.sh
      version: v2 (duplicate-check fix; the base of v3a)
      source: scratchpad/c1-fix/launch_eks.v2.sh
      sha256: 2fa09e84e8f465135c2d6697544f27006e6c55d8388eb9a1882dab20a8caac6d
      replaces_sha256: 130164868a21d1b1ee4ff66ba89ea0c4fdfee2e20decc6451abd2ab10ef6d41f
      accepted_change: >-
        Exactly the three changes FINDINGS.md proposes, all in step 2, the duplicate check.
        (a) list-builds-for-project uses --no-paginate in place of --max-items 100 (fixed lines
        174-176). (b) Only tokens matching ^<project>:[0-9a-f-]+$ are kept (line 177). (c) It
        refuses 4 if the listing printed something but no build id survived (line 180). Nothing
        else changes. These parts are byte-identical: step 1; step 1b, the remote-pin re-check
        that C1-AMENDMENT-1 requires before every submission; step 1c; the S3 prefix and
        request-object checks; the single launch; the download; and the outcome classes.
        F7 confirms (a)-(c) in the HEAD-to-v3a diff of the duplicate-check hunk.
    amendment:
      defect_found: >-
        scratchpad/c1-fix/launch_eks.patch is stale. It holds one hunk (@@ -171,7 +171,10 @@)
        that adds lines 174-177 only. It lacks the line-180 refusal, which the fixed file (sha256
        2fa09e84...), FINDINGS.md bullet 3 and the h.sh/h2.sh test blocks all contain.
        Applying that patch to 130164868... does not produce the accepted bytes.
      required: >-
        Do not apply or archive that patch. The accepted bytes are the fixed file. The patches
        archived in approval_archive C1 are regenerated with diff -u: orig to v2, orig to v3a,
        and v2 to v3a.
    review_notes:
      - "Fail-closed is preserved. Every new failure path is exit 4, with nothing submitted. The S3 request-object check, inputs/requests/<digest>.json, remains the primary barrier against a second submission, and it does not depend on CodeBuild paging."
      - "Coverage is unchanged: one page of at most 100 newest build ids, as before. FINDINGS reports the page-size equivalence; the Coordinator did not verify it independently. The positive control F3(d) shows the CodeBuild branch still detects duplicates: the newest existing build's key gives REFUSE 3."
      - "Non-blocking: the --dry-run echo on line 117 did not show --max-items before the fix and does not show --no-paginate after it. It is cosmetic and left unchanged."
      - "The wrapper runs only as the supervised trial argv. Never run the fixed or the original wrapper by hand without --dry-run. The fix tests use the extracted duplicate-check block, which contains no launch call."
    manifest_amendment_ruling:
      added: >-
        2026-11-06, in an addendum from the top-level session. PR #3105 CI rejects the flat
        manifest.yaml of RUN-ICPERF-c7f69e.
      proposal: >-
        Wrapper v3 (sha256 7dbe33eb56843daa47885e58df644371b86052c7c42e4f11bcf38c17bc9d386d;
        scratchpad/c1-fix/WRAPPER-V3.md and launch_eks.v2-to-v3.patch). It keeps v2 and adds a
        schema-complete JSON manifest on every path. Statuses: failed_implementation when not
        submitted, completed_inconclusive when job_completed, failed_infrastructure otherwise.
        It writes inputs.seed 0 and curve_id null as placeholders, and request identity in
        inputs.parameters. code.command is compact jq JSON of $0 plus the arguments, and
        code.commit comes from git rev-parse HEAD.
      ruling: reject v3 as proposed; accept it as amended (v3a)
      defect_in_v3: >-
        The supervisor runs tools/experiment_execution.py complete_manifest only on driver exit
        0 (job_completed), and complete_manifest first calls _check_driver_facts. That check
        would refuse v3's manifest (EnvelopeRefused) after a paid job had completed, for two
        reasons. (1) _check_trial_inputs (lines 322-349) refuses a stated inputs.seed or
        inputs.curve_id, and any non-empty inputs.parameters, when the frozen trial declares
        none; the C1 trials declare none. (2) code.command must equal the launched argv as
        json.dumps (with ', ' separators), the list itself, or the shell-joined form (lines
        402-413); jq -c output has no spaces. code.commit from git HEAD is also checked against
        the launch authority commit (line 401), which holds only if HEAD has not moved. The
        supervisor would mark the unit invalid. The duplicate check would then refuse to
        relaunch the same request, and the protocol reserves -r2 for host loss, so S1 would be
        lost. v3's tests ran only validate_ledger.check_run, never complete_manifest.
        Separately, seed 0 is a stated value with no source (rule 9), even with a note.
        check_run does not require a seed (RUN_REQUIRED_TOP is id, experiment_id, status,
        code, environment, inputs, timing, result). F12(ii) confirms the refusal:
        EnvelopeRefused on run.code.command.
      v3a_required:
        - "Exit-0 path (outcome_class job_completed): manifest.yaml is byte-identical to the v2 heredoc, the nested run with id, experiment_id, hypothesis_id, task_id, trial_id, approved_by, attack_claimed false and result.raw_result. The supervisor completes it from publish-time facts. Validity stays with check_job.py and S03-verify (analyze-c1.sh). The wrapper never writes a status on this path."
        - "Every other path that writes records (refusals with exit 3 and 4, and exit 5) gets the schema-complete manifest. No supervisor completion runs on these paths. The manifest has no inputs.seed and no inputs.curve_id. inputs.parameters keeps job_name, request_sha256 and validated_request_sha256. code.commit comes from <record-dir>/environment.json .commit, and code.command is <record-dir>/command.txt verbatim."
        - "Status mapping on those paths, accepted as a mechanical label. submitted false gives failed_implementation. submitted true without job_completed gives failed_infrastructure. valid is false. invalid_reason ends 'mechanical wrapper label; the Coordinator classifies the stop'. The label decides nothing."
        - "raw-result.json, exit codes, outcome classes, the duplicate-check block, the single submission and the download are unchanged."
        - "Known and unchanged: exit-2 refusals (usage, pin mismatch, unsupervised) write no records, as in v1 and v2."
      v3a_review: >-
        Accepted at 0fcdd67e.... F2-v3a: bash -n OK. The v2-to-v3a diff has three hunks, all
        additions with no line removed (t0/s0 clock line; exit-0 guard and comment; else
        branch). The duplicate-check block is byte-identical to v2 lines 163-189, so F3 carries
        over. The exit-0 heredoc is IDENTICAL to v2. F12 results: (i) the v3a exit-0 manifest
        passes complete_manifest and check_run cleanly. (iii) Exit 3 and exit 4 give
        failed_implementation, and the deadline case gives failed_infrastructure; none
        contains seed or curve_id; command equals command.txt; check_run is clean. Two
        deviations from the letter are accepted, as non-exit-0 paths that complete_manifest
        never checks. code.commit falls back to git rev-parse HEAD, then 'unknown', if
        environment.json lacks .commit. code.dirty is false as in v3.

    protocol_amendment_ruling:
      needed: false
      basis:
        - "inputs/protocol.json (in-repo copy c2f38c42..., protocol_sha256 9844f78d...) binds no launch_eks.sh digest. Its only mention of the wrapper is C1-AMENDMENT-1 changes[0], 'launch_eks.sh re-checks them [the four remote pins] before every submission'. The fix leaves that check (step 1b) unchanged. F4 found no wrapper digest in the crypto study directory."
        - "The fix changes no N, seed, curve, target, arm, weight, threshold, margin, accounting rule, decision mapping, request, budget line or deadline. It changes only a read-only refusal before submission and the manifest written on non-exit-0 paths, so no success criterion changes and no protocol_amendment record is needed on either side."
        - "Only crypto-autoresearcher bytes bind the wrapper digest: the runbook binds and trial-plan.json source_sha256. Both are recompiled (ruling 5), which forces a new runbook sha256 and therefore this approval."

  # ---------------------------------------------------------------- ruling 3
  request_ruling:
    new_session_uses:
      T1: {request: experiments/EXP-ICPERF-127dbd/inputs/request-s1.json, sha256: 683cc67d136ab6a2e5f1f3fbc7f6ae20ba981194f4781418340d883620b6c779, job_name: ic-c1-dg-s1-20261106}
      T2: {request: experiments/EXP-ICPERF-127dbd/inputs/request-s2.json, sha256: d58a601e3a5503bd37578105763f05c35ec6b98503faa55628781fd61f8c4bf1, job_name: ic-c1-dg-s2-20261106}
    basis:
      - "The first-attempt requests were never submitted: there is no S3 object under either job prefix, no request object, and no CodeBuild build carrying the key. Launching them now is the first attempt of S1 and S2, not a rerun. The protocol's inadmissible list forbids a 'third session or selective rerun', but that list counts C1 sessions (ecbench jobs S1 and S2), and none has run. Runbook sessions are only execution containers."
      - "The protocol reserves launch/request-sK-r2.json for a rerun after a timeout, crash or host loss of a launched job (invalidation_rules[2]). Using -r2 now would label a first attempt as a rerun and spend the only host-loss allowance on an event that is not host loss. It would also break the job_names S1/S2 mapping that check_job.py and the runbook results_uri pattern (ic-c1-dg-s[12]-20261106) assume."
    r2_allowance:
      status: available, unconsumed (S1-r2 and S2-r2 each at most once)
      applies_when: >-
        Only after a launched C1 job ends in a timeout, crash or host loss, as protocol section
        9 defines it. A deadline hit is not rerun (protocol stopping rule 'deadline'). A defect
        in a wrapper, the runbook or the supervisor, before or after submission, is not a -r2
        trigger.
      how: >-
        Only as a new runbook session on the frozen request-sK-r2.json (fd9c9c8f... for S1,
        816d85f0... for S2), after a new Coordinator decision. This decision authorizes no -r2
        session. The protocol section 10 gate lines for -r2 stay at 2.79 (S1-r2) and 3.72
        (S2-r2).
      not_bound_here: The recompiled runbook does not bind the -r2 requests and must not.

  owner_gate_ruling:
    ruling: >-
      The 2026-11-06T22:05Z go-ahead covers RBS-ICPERF-de8978. Protocol section 11 defines the
      go-ahead per launch (S1, S2 and any -r2 under the USD 5.00 cap), not per runbook session.
      The recompile changes no request, instance type, deadline, budget line or cap, and USD 0
      has been spent.
    conditions:
      - "The relay quotes the owner message verbatim with its timestamp (relay fact 2). The Coordinator did not see the owner message and relies on the top-level session's report. This decision is not the go-ahead, and no agent message can stand in for it."
      - "If the owner has since withdrawn, limited or qualified the go-ahead, that governs, and nothing is relayed."
      - "Recommended, not a gate: in its next report, the top-level session tells the owner that the first session stopped before submission at USD 0, and why."

  budget_gate:
    rule: >-
      Protocol section 10, unchanged. Before each launch L, require actual_spend + HB(L) +
      HB(every first-attempt job not yet launched) <= USD 5.00, with HB(job) = USD 0.93108 at
      the 3,600 s deadline. actual_spend comes from billing, else from the job's HB, never
      from an estimate. RBS-ICPERF-e2a5c2 contributes 0.
    S1: "0 + 0.93108 + 0.93108 = 1.86216 <= 5.00"
    S2: "0.93108 + 0.93108 + 0 = 1.86216 <= 5.00 (S1's actual billed spend replaces its 0.93108 if available)"
    ceiling_usd: 5.00
    worst_case_committed_usd: 3.72
    spent_to_date_usd: 0

