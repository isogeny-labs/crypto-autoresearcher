    - "First-attempt requests preserve the protocol's only host-loss rerun for its intended use and keep the job-name/attempt mapping exact."
    - "Scope: constant-factor counted engineering at fp28, as in c69de4. No asymptotic, wall-time or rho-beating claim. The gap to rho is reported as the distance remaining."
