    ICR-8_stage1_band_test:
      finding: SHF-20261106-a114e7 ICR-8
      ruling: >-
        When DEC-20261105-6e2616 NA-2 (stage-1 design for
        IDEA-20261015-b41f68) is ranked, the ranking record states that the
        parent band test (CV^2 in [0.81, 1.21] and median/mean in [0.6, 0.8])
        is non-identifying in the limit, not only underpowered at n = 64. It
        is scale-free: it accepts Geometric(1/30) and Geometric(1/80) at the
        same rate as the true law, and its pass rate tends to 1 as n grows
        for every small-p geometric and for a CV = 1 lognormal (CV^2 = 1 and
        median/mean = 2^-0.5, about 0.707, lie inside both bands). A stage-1
        test must therefore add a p/mean check against p_pred fixed in
        advance and a distributional check (CDF at fixed quantiles or a
        memorylessness check); a larger panel with the same bands remains a
        null-accepting test. This is consistent with, and sharpens,
        DEC-20261105-6e2616 NA-2 as written (which already forbids reusing the
        bands as the test).
      basis: >-
        Case finding ICR-8 and reader claims C10 and C15 (reproduced 52.4%
        rejection of a true geometric and 31-32% acceptance of a CV = 1
        lognormal at n = 64; simulated pass rate 1.0 at n = 8192;
        band_asymptotics.out.json, not read here). The analytic part (the
        lognormal's CV^2 and median/mean values against the bands) is
        checkable from the band definitions alone.
