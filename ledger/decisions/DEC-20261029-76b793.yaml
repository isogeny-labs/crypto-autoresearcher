  coverage_limits:
  - Finite fixtures and one independent reviewer establish neither all-prime correctness nor all-input formal correctness;
    no new mathematical theorem or novelty audit is accepted.
  - The four malformed inputs isolate four named guards only. The p17 fixture exercises one high 2-adic valuation;
    it does not cover all Tonelli-Shanks valuations.
  - The 250 assertions are related checks within seven fixed families, not 250 independent workloads or scientific
    samples.
  - Setup-probe fields and trie-node counts are narrow software observations, not authenticated total operations,
    timings or an end-to-end cost comparison.
  - Boolean coverage alone validates no polynomial clause, model or projected fiber. A returned gap need not be
    an arithmetic solution; the utility yields no arithmetic SAT/UNSAT certificate.
  - Future arbitrary-literal partial-trail clauses are outside the prefix-cylinder interface. They require a separate
