  per_joint_verdicts:
    false_nonroot_isolation:
      reviewer_verdict: holds
      coordinator_assessment: The empty-D2 negative preserves its input digest and empty projected model set. The
        original checker rejects exactly invalid nonroot certificate; suppressing only this guard in an isolated
        in-memory mutant admits that same artifact. The mutant certifies nothing.
    rehash_input_guards:
      reviewer_verdict: holds
      coordinator_assessment: Correctly rehashed duplicate-domain, singular-curve, off-curve-target and zero-ordinate-target
        inputs fail their four named guards in the checker and are also rejected by solve. No claim covers every
        parser guard.
    oncurve_sum_guards:
      reviewer_verdict: holds
      coordinator_assessment: Both fixed witness mutations retain on-curve summands, coordinate domains, projection
        and digest. Exact rejection distinguishes wrong sum abscissa from the same-abscissa wrong ordinate; independent
        addition checks the latter sums to -R.
    exception_and_root_paths:
      reviewer_verdict: holds
      coordinator_assessment: The p7 order-three target retains the unique exceptional projection with (-R,-R),
        and deletion fails completeness. The p17 fixture checks v2(p-1)=4, candidates 2 then 3, Z=3, two setup probes,
        signs/certificates and agreement with a separate tiny group oracle.
    prefix_coverage:
      reviewer_verdict: holds
      coordinator_assessment: Nine fixed cover/gap cases and eleven invalid-input cases pass; n256 fixtures use
        no cube enumeration. Each returned gap is independently in-domain and outside all supplied cylinders. arithmetic_verified
        remains false.
    execution_custody:
      reviewer_verdict: holds
      coordinator_assessment: The independent reviewer actually executed seven test families with 250 passing named
        assertions and the exact old18 regressions in two successful suite invocations. All frozen sources and harness
        hashes match before, after and at Coordinator inspection.
  scoped_claim:
    checker_fixtures: Only the prospective p5 false-nonroot and sum controls, four rehashed malformed inputs, p7
      order-three exception and p17 general-root fixture, plus the original18 regressions.
    prime_premise: Mathematical primality remains an explicit input premise, not a proved result of parser acceptance.
    prefix_semantics: (depth,prefix) covers n-bit integers with those low depth bits; variable0 is first. Optional
      domain is bits >> projected_bits < aux_bound. A false coverage result supplies an actual uncovered Boolean/auxiliary-domain
      integer.
    prefix_scope: Nine fixed cover/gap fixtures and eleven invalid-input cases. The n256 two-half cover, one-half
      hole and empty-prefix cover use 3,2,1 trie nodes; the one-half gap is1. These are fixed observations, not
      scaling measurements.
    prefix_source_accounting: At most 1+sum(depth) allocated nodes. Input validation/trie work is O(number of prefixes+sum(depth)),
      with integer-bit, input and output costs additional. An exponentially long prefix list remains expensive.
      Fixed assertions and source inspection are not a formal all-input implementation proof.
    arithmetic_verified: false
    transcript_adapter_implemented: false
    guard_mutant: Only an isolated in-memory intentionally weakened checker copy is used as a negative control;
      the original checker is unchanged and provides every certification finding.
