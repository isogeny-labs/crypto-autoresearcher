  rationale:
  - 'Validity before interpretation: run counts, manifests and S3 copies, seeds and spec equality, raw/summary agreement and
    the A/A and position controls were all checked by independent code, and none fails.'
  - The review plan's five joints each had a named breaking artifact; none was found. The decision statistic was re-derived
    blind from records.jsonl and matches the instrument to 4.2e-16.
  - 'The proves-too-much control shows the required signature: no improvement on identical arms or at P24, and a label-swap
    null centred on 1 that narrows as 1/sqrt(n) while the observed ratio holds near 0.96.'
  - 'Coordinator contract: a positive result expands only after an independent verifier passes; it has passed, so the scoped
    support and the publication of PROTOCOL 10 may proceed.'
  - 'Neither discrepancy touches the claim: one is a descriptive figure truncated in prose, the other a field no check reads;
    results are immutable, so both are additive corrections.'
  - Strength preliminary because the wall statistic is one session on one host class; the knowledge-promotion rule applies
    at replicated or strong, and VERDICT-P32 already placed the durable record in the lead atlas.
  - 'AGENTS.md 5a: rho-neg ranks ahead of both IC arms at every weight on every curve; dgbf is never ranked ahead of dgb in
    counted S''.'
