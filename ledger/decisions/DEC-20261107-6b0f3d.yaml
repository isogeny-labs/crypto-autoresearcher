    - "Custody that the dispatcher cannot verify is stated as such and given a verifiable successor, the approval archive. It is never forced into a queue shape that misdescribes the work."
  evidence_refs:
    - tools/research_dispatch.py (ROLES; lines 955-1040)
    - ledger/decisions/DEC-20261107-e41c08.yaml
  limitations:
