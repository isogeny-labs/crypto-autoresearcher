  next_actions:
  - >-
    Implement the source-bound production F_p trail theory. Compare every partial/full theory
    response and explanation with exhaustive small-field semantics; reject corrupted explanations
    and Boolean-plus-theory UNSAT proof steps before any held-out freeze.
  - >-
    Complete the typed canonical exporter, exact cold/setup/online/certificate instrumentation,
    natural-only analysis and power source. Run s=6..14 only after every freeze blocker passes.
  - >-
    In parallel at development scope, implement a compact or lazy multi-valued selector and prove
    exact projected signed-model-set equivalence to Sinz one-hot on every small cell. Preflight its
    setup exponent, serialized bytes and peak RSS before proposing any continuation amendment.
  - >-
    Keep exact two-window enumeration as the model-set oracle and e=2 reference. Preserve the m=2
    theorem cells as component evidence only and retain higher-arity rationality circuits.
  limitations:
