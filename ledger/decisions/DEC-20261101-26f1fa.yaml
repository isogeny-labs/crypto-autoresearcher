coordinator_decision:
  id: DEC-20261101-26f1fa
  id_provenance: >-
    Allocated with tools/allocate_id.py --next coordinator_decision --date 20261101 and
    confirmed free with tools/allocate_id.py --check DEC-20261101-26f1fa before this record
    was written.
  context: >-
    Additive hardening of the unrun prime-field arity-three CDCL(T) screen after review found
    nine execution-design defects: preprocessing was outside the cost bridge; censored and
    control rows could enter the slope ambiguously; one-hot continuation resources were not
    admitted; schoolbook CNF cost was stated as a universal lower bound; abscissa and signed-point
    semantics were conflated; QF_FF lacked a checked finite-field UNSAT route; forbidden-word
    enumeration was uncapped; and the local crypto report reused the unrelated checker-defect
    decision identifier. Literature and official cvc5 source were reviewed before this decision,
    and the owner repository landed a disclosed native development oracle.
  decision: refine
  decision_scope: >-
    Additively supersede only the corrected_execution_design, experiment-selection and next-action
    fields of DEC-20261031-b51282. Preserve that immutable decision's arity correction and retained
    mathematics. DEC-20261031-cd6460 remains exclusively the checker-defect decision and is not
    superseded. No hypothesis, experiment, evidence or goal status changes here because no held-out
    instance, production solver row or performance measurement was produced.
  decided_by: coordinator
  decided_at: '2026-11-01T00:40:00+00:00'
  target_ids:
  - DEC-20261031-b51282
  - LEAD-ICP-digit-presentation-solving-degree
  - LEAD-ICP-shared-coefficient-membership
  rationale:
  - >-
    With s=log2(p)/m, reusable setup S(s)=2^(a s), natural query Q(s)=2^(e s) and
    Theta(2^s) required queries, cold collection costs 2^(a s)+2^((e+1)s) up to
    polynomial factors. At m=3 the necessary rho-crossover gates are both a<1.5 and e<0.5.
  - >-
    The query slope is identified only by the complete preregistered natural population.
    Planted and exact-UNSAT instances are correctness/control strata, not samples from that
    population. Any natural timeout, OOM, unknown, unproved UNSAT or missing rung is inconclusive;
    no completed-row subset or imputation may satisfy the advance gate.
  - >-
    Sinz sequential at-most-one plus one at-least-one clause is the selected exactly-one
    construction. At s=27 its three windows have 402653184 selector variables, 402653181
    auxiliaries and 1207959543 exactly-one clauses, for 805306365 Boolean variables before
    theory auxiliaries. The one-hot s=15..27 continuation is therefore unadmitted pending a
    measured resource gate or a compact/lazy selector with exact small-cell model-set equivalence.
  - >-
    Boolean quotient equations avoid algebraic carry semantics but do not establish a universal
    quadratic multiplication lower bound. Theta((log p)^2) is retained only for the frozen
    schoolbook pure-CNF control, whose actual gates, clauses, variables and bytes must be counted.
  - >-
    Chained S3 constraints are sign-blind. A faithful model binds each selected abscissa to a
    rational-lift sign and independently replays the signed group equation. The guarded
    three-summand rationality argument does not repair an underconstrained exporter.
  - >-
    Official cvc5 source head 02f77af402b4be82f27e5cc00b86b265a90dea3d returns nullptr from
    TheoryFiniteFields::getProofChecker. QF_FF is therefore a SAT/model diagnostic, not an
    UNSAT-eligible slope candidate, unless a prospective amendment binds an independently checked
    finite-field certificate route. With one proof-eligible slope candidate there is no Holm family.
  - >-
    Field/index membership is the compact semantic predicate 0<=word<domain, implemented by an
    unsigned comparator or native theory check. One clause per forbidden word is allowed only
    below a frozen cap admitting the complete enumeration.
  - >-
    The native owner fixture exhaustively validates the lift identity, t=0 branch, disjoint
    windows, signed replay, guarded three-summand rationality, chained S3, compact range predicate,
    selected exactly-one construction and agreement with exact two-window enumeration. This is
    bounded implementation evidence, not a production propagator or exponent result.
  retained_mathematics:
  - rational quadratic lambda lift (2 t lambda - s0)^2 = f(x)
  - discriminant 16 t^2 f(x), with t=0 retained as an explicit exceptional branch
  - three-summand rationality under rational target, odd prime whole-group order and disjoint windows
  - explicit rationality circuits for arity at least four
  - compact field/index domain predicate, with per-word clauses only under an explicit cap
  hardened_execution_design:
    owner: isogeny-labs/cryptanalysis
    merged_pr: https://github.com/isogeny-labs/cryptanalysis/pull/1347
    source_head: 86bd347e4502933697825ea276380fad0da76a1c
    merge_commit: 3c769002f0f68d63a5055f6f3e24a9500393180e
    protocol: experiments/prime-field-m3-cdclt-20261031/PROTOCOL.md
    companion_crypto_pr: https://github.com/isogeny-labs/crypto/pull/3114
    companion_crypto_source_head: c8e685b56adf8e18ee3bf6b847b38da097e1ea48
    fixed_arity: 3
    initial_ladder: every integer s=6..14, analyzed at actual log2(p)/3
    natural_population: every preregistered natural row; no censoring or substitution
    control_populations: planted and exact-UNSAT rows reported separately
    setup_gate: upper 95 percent interval a<1.5
    query_gate: natural-only upper 95 percent interval e<0.5
    multiple_comparison_correction: none; one proof-eligible slope candidate
    qf_ff_status: SAT/model diagnostic until independently checked finite-field UNSAT evidence exists
    continuation_status: one-hot s=15..27 not admitted
    run_status: not frozen; no held-out instances generated and no scientific rows run
  evidence_strength: desk_correction_plus_native_development_fixture
  claim_tier: corrected_experiment_contract_and_bounded_implementation_validation
  proof_status: arithmetic_cost_identity_plus_exhaustive_development_fixture_plus_unrun_design
  proof_assistant_verified: false
  evidence_refs:
  - ledger/decisions/DEC-20261031-b51282.yaml
  - ledger/decisions/DEC-20261031-cd6460.yaml
  - knowledge/literature/KN-LIT-10b0fa.md
  - knowledge/leads/ecdlp/ic-prime/LEAD-ICP-digit-presentation-solving-degree.yaml
  - knowledge/leads/ecdlp/ic-prime/LEAD-ICP-shared-coefficient-membership.yaml
