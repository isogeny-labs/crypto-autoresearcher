  rationale:
  - C3's pre-stated first closure clause is met with a wide margin. The whole mechanism-reachable share is at most 0.92 %
    of S at w = 0, under the 3 % line, so a counted A/B (about USD 0.5-1) could not show a material improvement.
  - The decomposition is exact (residual 0 in every record), so the "unidentified" overhead the ranking assigned to C3 does
    not exist at the scale it stated. It was an artefact of using one r for two curves.
  - The generator is not the default at ea8e9ef7, but there is almost nothing for it to act on. The dominant phase contains
    no scalar multiplication.
  - Closing on a criterion fixed before the test, with the test's artefacts archived first, is not a post-hoc criterion change.
  - The success criterion (owner, 2026-10-15) counts any verified, measured improvement. A sub-1 % ceiling would not justify a paid run. It
    is dominated by C1 (approval DEC-20261106-c69de4 drafted, not yet archived) and by exponent-targeting work (DEC-20261106-1d23b6
    roadmap caveat).
  scope: fp28, the v6 counted session's two prime_search curves, the walk incumbent at N 407 with mitm:negation_folded=1 and
