  closure:
    item: C3 (DEC-20261106-1d23b6 ranking rank 3)
    outcome: closed_without_run
    criterion_applied: 'The first clause of C3''s own closes_when, "reducible share under about 3 % of S". The second clause
      ("generator already the default") is FALSE at ea8e9ef7 and is not relied on.'
    reducible_share: 'Upper bound 0.92 % of S at w = 0, about 0.19 S: everything C3''s mechanism could touch, taken as fully
      removable, i.e. restart offset draws 0.396 % + jump table and initial point 0.500 % + restart additions 0.0135 % + verify
      0.013 %. A fixed-window generator would remove only part of the scalar-multiplication ops inside those lines, so the realistic
      gain is a fraction of that bound. The bound is under the 3 % line by more than a factor of 3, and the derived jump-table
      line''s unresolved 45-versus-38 ops-per-multiplication gap (DECOMP.md section 1) moves it by well under 0.1 % of S.'
    dominant_phases_outside_mechanism: 'oracle_setup (54 %) contains no scalar multiplication, so the generator cannot act
      on it; its pairs are distinct factor-base points, not multiples of a fixed base. Walk steps (45 %) are single additions
      per trial and are the search itself. Neither is fixed overhead in C3''s sense.'
    refutation_basis: 'empirical_only plus source reading. The share figures are counted, deterministic records of one v6
      session on two fp28 curves; the N(N+1) identity and the absence of the generator are read from ea8e9ef7 source and
      agree exactly with the counters. This is the closure of a ranked candidate on its pre-stated criterion, not a rejection
      of a hypothesis; no hypothesis record exists for C3 and none moves.'
    weights: 'Measured at w = 0 only. At w = 0.1 and 1 the fixed-overhead lines (once-per-run jump table, per-restart draws,
      one verification) carry little native work beside the per-trial lookups and guard probes, so their share is expected
      to fall, not rise. This is an inference, not a measurement.'
    reopen_when: 'A later commit makes scalar multiplication a material share of S at fp28 (for example a target source that
      draws a fresh aP+bQ per trial, or restarts per trial), or a decomposition at another size shows a fixed-overhead share
      of at least about 3 % of S.'
