    Python outputs) were not opened; their results are cited as the README
    states them. No scientific trial was run and none is dispatched.
  official_transitions:
    hypothesis_status_changed: false
    experiment_status_changed: false
    goal_status_changed: false
    goal_next_action_changed: false
    safecurves_comparison_cell_changed: false
