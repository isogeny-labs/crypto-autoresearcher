    correction_issued: CORR-20261022-b3c8a5
  rulings:
    - ruling: correction
      record: CORR-20261022-b3c8a5
      statement: >-
        The bundle README's "The unexplained values" paragraph presents its
        scan as covering every unexplained base-point coordinate, with "No
        hits on the 19 targets". On the binary curves it scanned the published
        Gx and Gy, while the X9.62-1998 A.3.1 draw, as the follow-up reads the
        standard, is x(R) with G = hR. So that negative does not test the
        draw. If the unmerged snapshot's target list is the one the bundle
        ran, the K-curves were not scanned at all. The README is hash-bound
        and is not edited. The one committed record that repeats the claim,
        KN-LIT-d2f917 (line 98-99), is covered as a clarification and gets
        the addendum below. The six other places searched that mention the
        scans are listed as unaffected in the correction, with reasons.
    - ruling: knowledge_addendum
      record: KN-LIT-d2f917
      statement: >-
        One dated addendum after the existing text, in the form of the
        2026-10-16 addenda to KN-TECH-031027 and KN-LIT-b58682: a disclosure,
        not a correction of the summary of the posts. It says what this entry
        does and does not record about the posts' tests (it does not record
        any base-point test by either source, or anything about the
        binary-curve base points), points to the scope correction, and lists
        the follow-up's searches as unvalidated observations with their blind
        cells and implementation status. Frontmatter is unchanged, so
        knowledge/sources.json and knowledge/SOURCES.md are unchanged.
    - ruling: problems
      records:
        - problems/nist-base-points-generation-unexplained.md
        - problems/nist-b163-seed-generation-unexplained.md
      statement: >-
        Two new records, not one. The base points (14 points over prime and
        binary fields, searched by T1-T12) and the B-163 seed (a 160-bit
        seed, searched by T13, T14 and the earlier scan) are different
        objects with different searches, exit conditions and next steps, and
        neither AGENTS.md "Name the obstruction" nor problems/TEMPLATE.md asks
        that they be combined. Neither duplicates
        problems/nist-seed-selection-rule-unexplained.md, which concerns the
        skip rule. Both follow the template and get index rows in
        problems/README.md. The B-163 record adds one fact derived here and
        checkable from the published seed alone: words 1, 3 and 5 have their
        top bit set, so the seed cannot be five unedited lrand48() words in
        32-bit slots, the layout of its four siblings, and no single edit can
        make it one.
    - ruling: problem_history
      record: problems/nist-seed-selection-rule-unexplained.md
      statement: >-
        One additive dated entry records the CM-discriminant screen (PR #2410,
        self-dated protocol not committed first) and the merged skip-filter
        study (H7-H11, 21 features, protocol commit as its README states, not
        verified here) as two further negative attempts at the second exit
        condition. Only the "Last updated" field and the history change.
        Status, exit conditions and recheck trigger are unchanged, so the
        index row is unchanged.
    - ruling: evidence_status_of_the_follow_up
      statement: >-
        Everything taken from PR #2410 and from the skip-filter study is an
        unvalidated observation from another repository, not evidence here.
        No EV record is written, because no independent validation exists and
        the pull request is unmerged. Eight of the 14 searches were computed
        in Python and are observations even in aburan28/crypto until a native
        port reproduces them. No conclusion in these records rests on them:
        the correction rests on the bundle README's own wording and the
        cofactor relation G = hR, and the problem records cite the searches
        as observations to scope the open question.
  rationale:
    - >-
      AGENTS.md core rules 4 and 6: results are immutable and corrections are
      new records, and negative evidence closes only the exact tested scope.
      The earlier scan's binary-curve negative was read more broadly than what
      it tested, and the correction narrows it.
    - >-
      AGENTS.md "Name the obstruction": the unexplained base points and the
      B-163 seed are recurring blockers to a complete account of the published
      parameters, named in KN-LIT-d2f917, KN-FIND-cee88d, CORR-20261016-0bf0b2
      and DEC-20261016-a12871 but without a problem record of their own.
    - >-
      Proportionality: this is provenance of historical constants. Any point of
      order n is an equally good generator. No ECDLP cost, attack claim or
      curve-safety statement depends on it, so rule 12 and the asymptotic
      promotion gates do not apply, and no claims/*.json is needed.
