    - H-MONO-23d347
    - IDEA-20261023-f15270
    - BATCH-69d9a2
    - BATCH-a8825c
    - GOAL-PATH-001
    - RQ-MONO-001
    - KN-OPEN-62c870

  # ------------------------------------------------------------ 1. re-review composition
  re_review_composition:
    review: coordination/goals/GOAL-PATH-001/review/TASK-20261106-7c2b01/fix_review.md (read in full by this act; sha256 52198231...2e1a at 573356f303 per the 649ebb archive block)
    attestation: coordination/goals/GOAL-PATH-001/review/TASK-20261106-7c2b01/review_attestation.yaml (read in full; sha256 50e14bb5...2c21)
    commit_reviewed: 9a0b5955146a6a87584774f8018da3559df86275
    reading_rule: >-
      Unchanged from DEC-20261106-843cf7: a finding is MUST-FIX when, left alone, it lets a cell
      that violates the specification's stopping or invalidation rules be recorded as valid, or
      lets an instrument defect reach a P-reading under F7 or F8, or when its fix costs less
      than its separate tracking. Under owner_direction no invalidation or hardening finding is
      recorded as a limitation in this round.
    procedure_deviations_of_the_review:
      accepted: [PD-1, PD-2, PD-3, PD-4]
      reason: >-
        PD-1 (read-only main checkout instead of a separate full worktree) preserves the
        property RR-2 needed, a real root conftest and pyproject, and the reviewer showed byte
        identity of the experiment tree and both root files with the commit. PD-2 (no
        claim/release by the reviewer) is how the top-level session runs this queue; the
        session claimed and released (queue tasks_state_revisions). PD-3 is stated honestly as
        not FX-16 and is not counted as closing DEV-1. PD-4 is required by the new cmd_cell order.
    closed_items_held:
      - F-1 (a) to (e), with the caveat that the bytecode route reopens the F-1 failure mode; it is fixed under HX-2 and re-checked in 941825 RR-2.
      - N-1 (M5 killed by the reviewer's own run, 8 of 379; guards independently recounted; M3 control still killed, 58 of 379).
      - N-2, with NF-2 to NF-4 opened separately.
      - N-3 and N-4.
    findings:
      - id: N-5 item 5
        reviewer_status: not closed
        disposition: must_fix
        fix_ids: [HX-2]
        reason: >-
          The .py-only refusal was the specified fix, and it was implemented as specified; the
          specification was too narrow, not the implementation. A sourceless code/yaml.pyc
          passes the gate against an unapproved specification (N5-Y), and code/pytest.pyc makes
          the gate record a full self-test pass that never ran (N5-P). N5-P passes V2-1 after
          the fact, so the F-1 failure mode is reachable again. The fix closes the class (any
          entry in code/ that is not a committed file) rather than the next suffix.
      - id: NF-1
        reviewer_severity: blocking
        grade_by_this_act: blocking (the reviewer's grade is kept)
        disposition: must_fix
        fix_ids: [HX-2]
        reason: >-
          Bytecode in code/__pycache__/ whose header matches the source mtime and size is
          executed in place of the hashed source while code_sha256 is unchanged, and the stray
          check skips that directory by design. A cell whose executed code differs from the
          approved build is invalid under invalidation rule 3, yet this one would carry the
          approved hash and leave nothing in the package. I considered re-grading it
          non-blocking because it needs a deliberately planted file: no accidental route exists,
          as the reviewer notes. I do not, for three reasons. The reading rule turns on whether
          an invalid cell can be recorded valid, not on intent. The forgeable-receipt limitation
          of DEC-20261106-843cf7 was accepted only because forgery is checkable after the fact,
          and this route is not. And the fix is launcher-only and cheap.
      - id: NF-2
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [HX-3]
        reason: >-
          A writer defect in cdf.json top-level N or s leaves validity valid. N - |S| is the
          lambda denominator and s the sample size of every P6 reading, so this is an
          invalidation gap on the arm-C path that P6 rests on. Comparing every top-level key costs
          minutes. The fix also adds m to cdf.json (the reviewer's observation), so the file is
          self-describing, as N-5 item 3 intended.
      - id: NF-3
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [HX-4]
        reason: A missing recount for one convention leaves the R1 check (stopping rule 1's only arithmetic guard on the executing host beside the suite) silently partial. One expected-set check fixes it.
      - id: NF-4
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [HX-5]
        reason: >-
          V2-4 says the launcher enforces the F2 family stop. Edges (a) library path, (c) broken
          symlink and (d) run id STOP-F2.json each defeat that enforcement, and (d) also
          swallows a true F2 write. Edge (b) is a reading rule: earlier arm-A cells of a stopped
          family are void by stopping rule 2, and the launcher must not rewrite their manifests,
          so the sentinel records them and V2-5 makes the analysis apply it.
      - id: NF-5
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [HX-6]
        reason: >-
          Owner direction names the surviving mutant. M6 truncates arm-C S-set keys of 2^32 or
          more. It is non-equivalent (O count 14 against 0 at (41, 6) and (29, 7), m = 2) and
          survives all 379 items. S_counts and m_S feed exceptional_targets and lambda, so P6. This
          is the N-1 gap at the S set: the start-up suite cannot fail on that path on the
          executing host. The fix is a KAT, and the reviewer's M6 run is its acceptance test.
      - id: NF-6
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [HX-7]
        reason: >-
          The analysis applies V2-1 in any case (V2-1, V2-2), but a launcher validity of valid
          on a forged GateResult is a launcher-side record that contradicts V2-1, and a
          symlinked runs/ moves packages where no archive finds them. Both are cheap to close in
          the launcher. The token guarding run_cell stays an accident guard, as the reviewer
          says.
      - id: NF-7
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [HX-8]
        reason: >-
          The 16 GB cap and the memory metric are read from these keys. A children peak that
          includes the start-up suite and gcc misstates cell worker memory. Separating the
          attribution is cheap, and it is a measurement-honesty item that AGENTS.md "Artifact
          policy" already requires (resource measurements per run).
      - id: OBS-receipt-clash
        reviewer_severity: observation (refusal direction)
        disposition: must_fix (cheap)
        fix_ids: [HX-9]
        reason: Two selftest runs within one second collide and exit with a traceback. The mechanical tier could hit this. A unique receipt id with exclusive create costs one line and one test.
      - id: OBS-valid-with-reasons
        reviewer_severity: observation
        disposition: no_action
        reason: By design (V2-3). A consumer honours readings_withheld; the approval act's runbook and the analysis carry that rule.
    still_recorded_limitations:
      - L-2 (N-6, B2 tuple seed above 10^4 subsets) stands as written in DEC-20261106-843cf7, with its trigger. It is unreachable in this plan and is not an invalidation or hardening finding of the 7c2b01 round.
    composed_verdict_b8: >-
      B8 stays OPEN (failed once at 165da2 and once at 7c2b01). It clears when TASK-20261106-afbe9b
      archives a TASK-20261106-941825 report that finds every must-fix of this act and of
      DEC-20261106-843cf7 closed (including DEV-1 and M6 killed by the reviewer's own run) and no
      new blocking finding.

  # ------------------------------------------------------------ 2. DEV-1
  dev1_rate_correction:
    what: >-
      DEC-20261106-843cf7 dev1_decision put the exact (32779, 2, m = 3) cell at "about 6e12
      multisets, about 17 h". That implies about 1e8 multisets/s. It also put the substitute at
      "well under 4 h". Neither figure agrees with the arm-C calibration that record cited:
      throughput-calibration.json armC (n = 2, m = 2) records 537,739,615 multisets in 78.65 s
      wall, about 6.8e6/s. The measured m = 3 sampled rate (4c4831 SF-1, about 4.8e6/s;
      7c2b01, 4.6e6 to 5.0e6/s) fits that calibration. The error was the predecessor
      Coordinator act's arithmetic, not a calibration or kernel defect.
    basis: The ratio is computed by this act from two recorded keys of throughput-calibration.json (multisets, wall_s); nothing was re-measured.
    consequence: >-
      The 14,400 s FX-16 budget was set on a wrong rate, so the FX-16 stop is a budget-setting
      error and an infrastructure outcome. It is not a KAT failure and not evidence. The
      predecessor's residual_note on the exact cell stands; at the measured rate that cell is
      about 1.2e6 s and stays unrun.
    watchdog_carry_forward: >-
      The contract arm-C watchdogs (3x projection) will be set by the approval act from a model
      calibrated at m = 2, n = 2 and scaled by (n/2)^2. Contract arm-C cells have m = n, so the
      model's m-dependence matters. The DEV-1 cell gives a measured (n = 2, m = 3) rate. The
      approval act compares it with the model's implied rate at that point before setting the
      arm-C watchdogs (declared successor, condition SC-3). B7 stays cleared: no counting path
      changes in this round.
  dev1_decision_v2:
    supersedes: DEC-20261106-843cf7 dev1_decision (budget and placement only; the cell is unchanged)
    cell: >-
      Exactly the FX-16 cell as written in code/tests/test_kat_extended.py at 9a0b5955
      (sha256 79894702...06b5), unmodified. F_{q''^2} with q'' = 10,007 by the least-prime rule
      and the disjointness test. KAT curve seed kat|large|10007|2|m3, line base (B = 9,886),
      arm_c_cell at m = 3, s = 50 sampled targets, an independent pair-sum membership method
      that makes no kernel call, and a vacuity guard of 25 or more of 50 nonzero. Non-contract,
      KAT mode. It is not an experiment run and computes nothing on a contract curve.
    budget: >-
      Owner direction (about 10-12 h, 16 GB): the task budget is 43,200 s wall and 16 GB. The
      go threshold is a measured projection of at most 39,600 s on the executing host. The cell
      watchdog fires 41,400 s after the full cell starts. The projection step itself is limited
      to 1,200 s. 1,200 + 41,400 = 42,600 s, which is within 43,200 s. Memory: 16 GB is a cap.
      The modeled need is about 0.4 GB (4c4831), and the review host reports 15 GiB; an
      out-of-memory kill is infrastructure.
    placement: >-
      My call: a SEPARATE executor task (96fee7), run AFTER the fix task (2b7223) completes and
      on its final bytes, and BEFORE the single snapshot (dfd0ed). That snapshot binds the fixed
      code and the DEV-1 record in one commit. The reasons:
      (a) test_kat_extended.py imports launcher, which 2b7223 changes (the import-time code-tree
      check), so the cell must exercise the final launcher to bind to the approved build.
      (b) Every file the cell computes with (kernel.c, counters.py, curves.py, fqn.py,
      test_kat_extended.py) is frozen in 2b7223 (HX-1), so running after the fix loses nothing.
      (c) One snapshot of both keeps every task with exactly one archival task inside the
      reserved ids. dfd0ed checks that the code hashes the cell recorded equal the committed
      bytes, so the cell's result binds to committed code before anyone treats it as durable.
      (d) The 12 h cell needs a quiet host (the re-review measured a loaded-host rate), and it
      must precede the re-review, which checks it. So the queue runs strictly one task at a time.
    outcomes:
      passed: >-
        All test_kat_extended.py items pass: all 50 kernel/membership pairs are equal, the guard
        is met, and the multiset count equals C(B+2, 3). DEV-1 closes when 941825 confirms it.
      mismatch: >-
        Any unequal pair is an instrument finding on the kernel's m = 3 large-q path. It is
        recorded verbatim and never re-run for a different answer. B1 reopens. kernel.c is
        frozen, so no repair is made in this round. dfd0ed still archives the record, then the
        queue stops before 941825 for a fresh act (spare DEC-20261106-24d2a2).
      stopped_or_infrastructure: >-
        A projection above 39,600 s, a watchdog kill, a crash or an out-of-memory kill is
        infrastructure, not a KAT outcome. DEV-1 stays open. dfd0ed archives the record, and
        the queue stops before 941825 for a fresh act. The cell is never shrunk and no
        substitute is invented.

  # ------------------------------------------------------------ 3. amendments pinned now
  specification_additions_for_v2_supplement:
    written_before_data: >-
      No contract cell exists. These are invalidation and reading rules, not predictions. The
      approval act copies V2-1 to V2-4 (DEC-20261106-843cf7) and V2-5 and V2-6 below verbatim
      into the v2 amendment and specification. predictions_to_freeze of DEC-20261105-f0b7c7 is
      unchanged.
    items:
      - id: V2-5
        text: >-
          Stopping rule 2, applied by the analysis. When runs/STOP-F2.json exists, every arm-A
          cell of the stopped family is VOID for every P-reading, whatever its own manifest
          validity says. That includes the cells completed before the sentinel, which the
          sentinel lists in family_runs_at_stop. The launcher never rewrites an earlier
          manifest.
      - id: V2-6
        text: >-
          Executed-code integrity. A cell is INVALID (infrastructure) unless its manifest
          carries a code_tree block showing three things. (a) A pre-gate and a post-cell scan of
          code/ found no entry outside CODE_TREE_ALLOWLIST: no __pycache__, .pyc, .so, symlink,
          hidden or other file at any depth. (b) Every allow-listed file re-hashed after the
          cell equals its value at the gate. (c) Each third-party module the launcher imported
          (at least numpy, yaml and pytest's location for the self-test) resolved outside code/.
  approval_records_v2_1:
    amends: DEC-20261106-843cf7 approval_lock_binding_v2.approval_records (the snapshot named only)
    text: >-
      The approval decision records the TASK-20261106-dfd0ed snapshot commit instead of the
      5c1258 commit. It also records, at that commit, the per-file sha256 of the seven
      CODE_FILES, of tests/test_kat.py and of tests/test_kat_extended.py, code_sha256, the
      sha256 of CODE_TREE_ALLOWLIST as read from launcher.py, EXPECTED_KAT_ITEMS and
      DESIGNED_SKIPS. Lock content (five fields), the code_sha256 definition and the
      selftest_receipts clause of approval_lock_binding_v2 are unchanged. CODE_TREE_ALLOWLIST
      lives in launcher.py and is therefore bound by code_sha256. The 72f51766a6 and 9a0b5955
      bytes stay bound as history and are never the approved build.

