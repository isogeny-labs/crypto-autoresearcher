      - Observation: the must-fix table and the new findings.
      - Comparison: reviewer severity against this disposition, and NF-1 kept blocking, with
        the reason.
      - Inference: HX-1 to HX-10, V2-5, V2-6, the DEV-1 budget and placement, and the
        dev1_rate_correction, stated plainly as the predecessor act's arithmetic error.
      - Limitation: L-2, session-only independence, KAT-field scope, receipts not
