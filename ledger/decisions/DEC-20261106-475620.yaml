    - {id: B5, status: open, text: "no runbook or mechanical card; must carry the V2-1, V2-4 and V2-6 checks and the selftest step", clears_when: "approval act: experiment-director compile, LINT OK, then CARD OK"}
    - {id: B6, status: open, text: "no preapproval packet or run handoff", clears_when: "approvable true on the exact prospective bytes; after the approval archive, execution_state ready"}
    - {id: B7, status: cleared, text: "TP-1 not triggered (throughput-calibration.json). No counting path changes in this round. The SF-1 rate datum is carried to the approval act's arm-C watchdogs (dev1_rate_correction), not to B7.", clears_when: "met; reopens if kernel.c or a counting loop changes"}
    - {id: B8, status: open (failed twice), text: "165da2 failed on F-1; 7c2b01 failed on N-5 (5), DEV-1 and NF-1.", clears_when: "afbe9b archives a 941825 report finding every must-fix closed and no new blocking finding"}

  # ------------------------------------------------------------ 5. visual report
  visual_report:
    owed_by_this_act: true
    reason: >-
      This act records a DEC that composes a review and changes a readiness gate (research-
      visuals "Every evidence review"; AGENTS.md "Research searches must leave visual
      reports"). It is consistent with review-DEC-20261106-843cf7. There is no evidence record
      and no status move, so the report is small.
    directory: experiments/EXP-MONO-1a1be2/reports/review-DEC-20261106-475620/
    files_in_git:
      - report.typ (source)
      - findings.svg
      - mutation-kill.svg
      - figures.py (draws both SVGs from figure-data.json)
      - figure-data.json (small, well under 64 KiB; every value copied from fix_review.md or fix-report-4c4831.md by section and table, with its source, or from this decision with its key)
      - .artifacts.json (manifest written by tools/artifacts/artifacts.py push)
      - .gitignore (managed block written by the same push)
    pdf: >-
      report.pdf is rendered from report.typ with both graphs embedded, and every page is
      inspected. It goes to the artifact store with python3 tools/artifacts/artifacts.py push on
