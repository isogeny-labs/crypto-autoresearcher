  decision: revise
  decision_scope: >-
    (1) Composes the 7c2b01 re-review: N-5 item 5 and NF-1 (graded blocking) are fixed by one
    code-tree hardening item; NF-2 to NF-7 are all must-fix; the five closed items stay closed.
    (2) Under owner_direction, DEV-1 is fixed by running the unchanged FX-16 cell with a 12 h
