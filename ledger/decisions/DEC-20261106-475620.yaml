    - 5c1258: snapshot at 9a0b5955146a, code_sha256 5e16c757...e1e3; full suite passed on a
      byte-identical extract; plan byte-identical.
    - 7c2b01 (fresh validator, review-adversarial): B8 FAILED. Closed F-1, N-1, N-2, N-3, N-4.
      Not closed: N-5 item 5 and DEV-1. New: NF-1 blocking; NF-2 to NF-7 non-blocking.
    - 649ebb: snapshot of the re-review at 573356f303.
    Lane BATCH-69d9a2 is still open. EXP-MONO-1a1be2 is a review_required draft; H-MONO-23d347
    is proposed. The specification is unedited (d81a85b3...c373).

  owner_direction:
    given_at: '2026-11-06'
    provenance: >-
      An owner instruction given to the top-level session in this session and relayed to this
      composing subagent in its task text. This subagent did not see the user's message
      directly. It records the direction as relayed, not as an approval of anything.
    text_as_relayed: >-
      DEV-1: keep the planned substitute cell F_{10007^2} at m = 3 (as specified in
      DEC-20261106-843cf7 FX-16) and GRANT it a larger budget of about 10-12 h wall time
      (16 GB). Earlier owner direction stands: DEV-1, the surviving mutant, and the
      invalidation/hardening findings are to be FIXED, not recorded as limitations.
    effect: >-
      DEV-1 is fixed by running the unchanged FX-16 cell under a 43,200 s (12 h) task budget
      with 16 GB (dev1_decision_v2). No smaller substitute field and no limitation is
      considered. NF-5 (mutant M6 survives) is must-fix with a test that kills M6. NF-2, NF-3,
      NF-4, NF-6 and NF-7 are invalidation or hardening findings and are must-fix; none
