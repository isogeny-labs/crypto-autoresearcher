        planted-bytecode and shadowing attacks refused; M6, M5 and M3 killed by the reviewer's
        own runs; the DEV-1 cell run in full on the committed bytes, with a reviewer-computed
        membership check of at least 10 logged targets; the plan byte-identical; and no new
        blocking finding.
      inconclusive_decision: >-
        If 941825 fails B8, the rerank trigger below fires. A fresh Coordinator act (spare
        DEC-20261106-24d2a2) composes the failure and reranks the lane before opening any third
        fix round. A fix that needs a frozen file (HX-1) stops 2b7223 and returns to that fresh
        act. A DEV-1 outcome other than passed stops the queue after dfd0ed and returns there
        too. All of this is infrastructure, never evidence.
      excluded_peripheral_work: >-
