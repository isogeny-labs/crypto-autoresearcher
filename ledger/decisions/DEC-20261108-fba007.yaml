    text: "\"\"\"Counted operational setup only; no metadata or candidate implementation.\n\
      \nTrusted root supplies an exact config path/hash approved in the additive DEC.\n\
      Same-UID hostile mutation is outside the native cooperative ownership model.\n\
      No execution is authorized by possession of this source.\n\"\"\"\nimport os\n\
      import signal\nimport time\n\nwith open('/proc/self/stat', encoding='ascii')\
      \ as _stream:\n    _ticks = int(_stream.read().rsplit(')', 1)[1].split()[19])\n\
      _hz = os.sysconf('SC_CLK_TCK')\n_boot_offset = time.clock_gettime(time.CLOCK_BOOTTIME)\
      \ - time.monotonic()\n_deadline = _ticks / _hz - _boot_offset + 5.0 - 1.0 /\
      \ _hz\nsignal.signal(signal.SIGALRM, signal.SIG_DFL)\nsignal.setitimer(signal.ITIMER_REAL,\
      \ max(0.000001, _deadline - time.monotonic()))\n\nimport hashlib\nimport json\n\
      from pathlib import Path\nimport re\nimport stat\nimport subprocess\nimport\
      \ sys\n\nROOT = '/home/ec2-user/crypto-prime-sat-ideas-20261029'\nSUPERVISOR\
      \ = ROOT + '/research/prime_scalar_manifest_metadata_20261107/metadata_supervisor.py'\n\
      SUPERVISOR_SHA = '0b5da687def7f61bf848ba106b5a3e728547b0f6c3b7fa116a3da17c75b87704'\n\
      INTERPRETER = '/home/ec2-user/.local/share/uv/python/cpython-3.12.8-linux-x86_64-gnu/bin/python3.12'\n\
      INTERPRETER_SHA = '0dc3a692fa85fcdb7f1a5877d2adf179809ac417a07ffde2373c832863800a15'\n\
      \n\ndef require(condition, message):\n    if not condition:\n        raise RuntimeError(message)\n\
      \n\ndef regular(path, limit):\n    p = Path(path)\n    require(p.is_absolute()\
      \ and str(p) == path and '..' not in p.parts, 'noncanonical path')\n    for\
      \ part in (p, *p.parents):\n        require(not part.is_symlink(), 'symlink\
      \ path')\n    fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)\n\
      \    with os.fdopen(fd, 'rb') as handle:\n        require(stat.S_ISREG(os.fstat(handle.fileno()).st_mode),\
      \ 'nonregular input')\n        result = handle.read(limit + 1)\n    require(len(result)\
      \ <= limit, 'input too large')\n    return result\n\n\ndef parse(payload):\n\
      \    def pairs(rows):\n        result = {}\n        for key, value in rows:\n\
      \            require(key not in result, 'duplicate JSON key')\n            result[key]\
      \ = value\n        return result\n    def nonfinite(value):\n        raise RuntimeError('nonfinite\
      \ JSON value')\n    return json.loads(payload, object_pairs_hook=pairs, parse_constant=nonfinite)\n\
      \n\ndef command(argv, env):\n    remaining = _deadline - time.monotonic()\n\
      \    require(remaining > 0, 'original startup budget exhausted')\n    try:\n\
      \        r = subprocess.run(argv, env=env, cwd=ROOT, stdin=subprocess.DEVNULL,\n\
      \                           stdout=subprocess.PIPE, stderr=subprocess.PIPE,\n\
      \                           timeout=remaining, check=False)\n    except subprocess.TimeoutExpired\
      \ as error:\n        raise RuntimeError('setup command timeout: ' + repr(argv)\
      \ + '; stdout=' +\n                           repr(error.stdout)[:2048] + ';\
      \ stderr=' + repr(error.stderr)[:2048]) from error\n    require(r.returncode\
      \ == 0, 'setup command failed: ' + repr(argv) + ' rc=' + str(r.returncode)\n\
      \            + ' stdout=' + repr(r.stdout)[:2048] + ' stderr=' + repr(r.stderr)[:2048])\n\
      \    require(len(r.stdout) <= 65536 and len(r.stderr) <= 65536, 'setup output\
      \ too large')\n    return r.stdout.decode()\n\n\ndef show(unit, env):\n    fields\
      \ = 'Id,MainPID,InvocationID,Slice,ControlGroup,ActiveState,ExecMainStartTimestampMonotonic,CPUQuotaPerSecUSec,MemoryMax,MemorySwapMax,TasksMax,RuntimeMaxUSec,KillMode,KillSignal,SendSIGKILL,TimeoutStopUSec'\n\
      \    output = command(['/usr/bin/systemctl', '--user', 'show', unit, '--property='\
      \ + fields], env)\n    return dict(row.split('=', 1) for row in output.splitlines()\
      \ if '=' in row)\n\n\ndef controls(group, tasks):\n    p = Path('/sys/fs/cgroup'\
      \ + group)\n    quota, period = (p / 'cpu.max').read_text().split()\n    require(quota\
      \ != 'max' and int(quota) == int(period) and int(quota) > 0, 'CPU cap mismatch')\n\
      \    for name, value in [('memory.max', '536870912'), ('memory.swap.max', '0'),\
      \ ('pids.max', str(tasks))]:\n        require((p / name).read_text().strip()\
      \ == value, name + ' mismatch')\n\n\ndef main():\n    global _deadline\n   \
      \ require(len(sys.argv) == 3 and re.fullmatch('[0-9a-f]{64}', sys.argv[2]),\
      \ 'exact config path/hash required')\n    raw = regular(sys.argv[1], 1024 *\
      \ 1024)\n    require(hashlib.sha256(raw).hexdigest() == sys.argv[2], 'setup\
      \ config digest mismatch')\n    c = parse(raw)\n    require(type(c) is dict\
      \ and set(c) == {'schema', 'phase', 'parent_unit', 'slice', 'uid', 'environment',\n\
      \            'launch_path', 'launch_sha256', 'approval_sha256', 'wrapper_sha256'},\
      \ 'setup config fields')\n    require(c['schema'] == 'prime-scalar.counted-root-setup/v1'\
      \ and c['phase'] in ('builder', 'audit'), 'setup schema/phase')\n    require(type(c['uid'])\
      \ is int and c['uid'] == os.getuid() == os.geteuid() == 1000, 'setup UID')\n\
      \    prefix = 'prime_scalar_e7cdd2_e1_' + c['phase']\n    require(c['parent_unit']\
      \ == prefix + '_parent.service' and c['slice'] == prefix + '.slice',\n     \
      \       'exact approved unit/slice name')\n    expected_env = {'PATH': '/usr/bin:/bin',\
      \ 'HOME': '/home/ec2-user', 'XDG_RUNTIME_DIR': '/run/user/1000',\n         \
      \           'DBUS_SESSION_BUS_ADDRESS': 'unix:path=/run/user/1000/bus', 'LANG':\
      \ 'C.UTF-8', 'LC_ALL': 'C.UTF-8'}\n    require(c['environment'] == expected_env,\
      \ 'setup environment')\n    invocation = os.environ.get('INVOCATION_ID', '')\n\
      \    require(re.fullmatch('[0-9a-f]{32}', invocation), 'missing parent InvocationID')\n\
      \    env = dict(expected_env, INVOCATION_ID=invocation)\n    require(str(Path.cwd())\
      \ == ROOT, 'setup working directory')\n    require(hashlib.sha256(regular(str(Path(__file__).absolute()),\
      \ 1024 * 1024)).hexdigest()\n            == c['wrapper_sha256'], 'wrapper source\
      \ digest')\n    launch_raw = regular(c['launch_path'], 1024 * 1024)\n    require(hashlib.sha256(launch_raw).hexdigest()\
      \ == c['launch_sha256'], 'trusted launch digest')\n    launch = parse(launch_raw)\n\
      \    require(launch['phase'] == c['phase'] and launch['approval']['sha256']\
      \ == c['approval_sha256'], 'launch/approval mismatch')\n    parent = show(c['parent_unit'],\
      \ env)\n    require(parent['MainPID'] == str(os.getpid()) and parent['InvocationID']\
      \ == invocation\n            and parent['Id'] == c['parent_unit'] and parent['Slice']\
      \ == c['slice']\n            and parent['ActiveState'] == 'active', 'parent\
      \ identity')\n    start = int(parent['ExecMainStartTimestampMonotonic']) / 1000000\n\
      \    require(start > 0, 'missing parent activation clock')\n    _deadline =\
      \ min(_deadline, start + 5)\n    require(time.monotonic() < _deadline, 'parent\
      \ startup exhausted')\n    signal.setitimer(signal.ITIMER_REAL, max(0.000001,\
      \ _deadline - time.monotonic()))\n    for key, value in [('CPUQuotaPerSecUSec',\
      \ '1s'), ('MemoryMax', '536870912'), ('MemorySwapMax', '0'),\n             \
      \          ('TasksMax', '16'), ('RuntimeMaxUSec', '1min 10s'), ('KillMode',\
      \ 'control-group'),\n                       ('SendSIGKILL', 'yes'), ('TimeoutStopUSec',\
      \ '0')]:\n        require(parent.get(key) == value, 'parent property mismatch:\
      \ ' + key)\n    require(parent['KillSignal'] in ('9', 'SIGKILL'), 'parent immediate\
      \ kill')\n    actual_group = [row[3:] for row in Path('/proc/self/cgroup').read_text().splitlines()\
      \ if row.startswith('0::')]\n    require(actual_group == [parent['ControlGroup']],\
      \ 'parent cgroup identity')\n    controls(parent['ControlGroup'], 16)\n    shared\
      \ = show(c['slice'], env)\n    require(shared['Id'] == c['slice'] and shared['ActiveState']\
      \ == 'active', 'shared slice identity')\n    require(parent['ControlGroup']\
      \ == shared['ControlGroup'] + '/' + c['parent_unit'], 'parent slice placement')\n\
      \    group = Path('/sys/fs/cgroup' + shared['ControlGroup'])\n    def membership():\n\
      \        require({p for p in group.rglob('*') if p.is_dir()} == {group / c['parent_unit']},\
      \ 'unknown slice descendants')\n        pids = {int(pid) for p in group.rglob('cgroup.procs')\
      \ for pid in p.read_text().split()}\n        require(pids == {os.getpid()},\
      \ 'unknown setup processes')\n    membership()\n    command(['/usr/bin/systemctl',\
      \ '--user', 'set-property', '--runtime', c['slice'],\n             'CPUQuota=100%',\
      \ 'MemoryMax=536870912', 'MemorySwapMax=0', 'TasksMax=17'], env)\n    controls(shared['ControlGroup'],\
      \ 17)\n    controls(parent['ControlGroup'], 16)\n    membership()\n    require(hashlib.sha256(regular(INTERPRETER,\
      \ 64 * 1024 * 1024)).hexdigest() == INTERPRETER_SHA, 'interpreter digest')\n\
      \    require(hashlib.sha256(regular(SUPERVISOR, 1024 * 1024)).hexdigest() ==\
      \ SUPERVISOR_SHA, 'supervisor digest')\n    require(time.monotonic() < _deadline,\
      \ 'no startup time remains for supervisor')\n    # Do not disarm the fatal timer.\
      \ exec preserves PID/start ticks and ITIMER_REAL.\n    os.execve(INTERPRETER,\
      \ [INTERPRETER, '-I', '-B', SUPERVISOR, c['launch_path'], c['launch_sha256']],\
      \ env)\n\n\nif __name__ == '__main__':\n    try:\n        main()\n    except\
      \ BaseException as error:\n        print(json.dumps({'schema': 'prime-scalar.root-setup-failure/v1',\
      \ 'status': 'incomplete',\n                          'pid': os.getpid(), 'invocation_id':\
      \ os.environ.get('INVOCATION_ID'),\n                          'error': type(error).__name__\
      \ + ': ' + str(error)[:8192]}), flush=True)\n        raise\n"
