  task_id: TASK-20261105-18a59d
  archived_by: TASK-20261105-c0d167
  mode: review composition and pre-approval revision (coordinate; /design-experiment step 5; no trials)
  decided_by: coordinator
  decided_at: '2026-11-05'
  authorized_by: >-
    Coordinator authority (agents/coordinator.md: approve experiments, reprioritize, open
