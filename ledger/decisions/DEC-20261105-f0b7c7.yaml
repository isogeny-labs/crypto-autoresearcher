    It approves NO experiment, protocol, runbook or run.
    The committed specification is NOT edited. It stays the v1 pre-approval draft,
    bound at 26a72871e7 with sha256 d81a85b3...c373.

  target_ids:
    - EXP-MONO-1a1be2
    - H-MONO-23d347
    - IDEA-20261023-f15270
    - REVIEW-PATH-20261029-3ac467
    - BATCH-c53152
    - BATCH-8517aa
    - GOAL-PATH-001
    - RQ-MONO-001
    - KN-OPEN-62c870

  # ------------------------------------------------------------ 1. composition
  composition:
    round_id: REVIEW-PATH-20261029-3ac467
    reports_read:
      - coordination/goals/GOAL-PATH-001/review/TASK-20261029-3ac467/blind_rederivation.md (read in full)
      - coordination/goals/GOAL-PATH-001/review/TASK-20261029-3ac467/review_attestation.yaml (read in full)
      - coordination/goals/GOAL-PATH-001/review/TASK-20261029-3ac467/computations.json (step ids located; values not re-opened beyond what the report cites)
    compared_against: review-plan.yaml claim_under_review (the producer's L1-L6, L8) and EXP-MONO-1a1be2 v1 P2, P5
    reading_rule: >-
      A joint "holds" when the re-derived statement and its leading value agree with the
      producer's. If it agrees but carries a sharper or extra term, that term is recorded
      as a refinement. A different leading value, or a counterexample to the producer's
      statement, would be a break.
    joints:
      - id: J1
        producer: L1 sum_R T_A = B^n; L2 ratio B^n/C(B+n-1,n) = n!/prod_{i<n}(1+i/B) in [n! exp(-n(n-1)/(2B)), n!]; T_A = sum over multisets of n!/prod m_j!; baseline slice C(q+n-1,n)/q^n = (1/n!) prod_{i<n}(1+i/q)
        rederived: >-
          Identical statements, including the bracket and the multinomial form. Also
          derived: the expansion n!(1 - n(n-1)/(2B) + O(n^4/B^2)); the alternative lower
          bound n!(1+(n-1)/B)^{-(n-1)}; and the observation that B = q is the card's
          specialisation, not an identity (for generic a, b in F_Q, B fluctuates around q).
        composed: holds
        effect_on_contract: >-
          None. Every ratio and denominator in the contract uses the actual B, N and t2
          (CTL-exact-denominator), not B = q.
      - id: J2
        producer: L3 T_S(R) = sum over ordered tuples with sum R of 2^j for 2R != O; L4 T_M - T_X supported on x-multisets with x(R) a multiple root; n = 2 answers T_A(O) = B, T_M(O) = (B+t2)/2; cancellation-free count [z^n]((1+z)/(1-z))^((B-t2)/2)(1+z)^t2
        rederived: >-
          The same statements and values. Three additions:
          (a) for R in G[2] the class count is half of sum 2^{t(P)}, so in the
              sign-vector convention T_S(R) = sum 2^{t(P)} holds at every target;
          (b) T_M - T_X = sum_Xi (a(Xi,R) - 1)_+ exactly; this is at most
              sum_Xi (mult_{x(R)} - 1)_+, with equality on simple Xi; strict
              inequality occurs off simple Xi (56 targets in one case);
          (c) at n = 2 with 2R != O, T_M(R) = T_X(R).
        composed: holds, refined (additions a to c)
        prior_check: >-
          The prior named L4 as the most likely break in the round (about 0.75). It did
          not break.
        effect_on_contract: >-
          P2 (i) to (vi) are unchanged. Additions (a) and (c) become exact identities
          P2(vii) and P2(viii) (predictions_to_freeze). Addition (b) confirms the
          producer's "nonzero only where x(R) is a multiple root" as a necessary condition.
      - id: J3
        producer: L5 c <= min(1, mu_M), c >= mu^2/E[T^2], no base exceeds rate C(B+n-1,n)/N; Poisson-null ceilings 0.346, 0.119, 0.030, 0.006 (n = 2..5)
        rederived: >-
          The same bounds and the same four ceiling values to three decimals. Additions:
          (a) every symmetric base (n >= 2, |X| >= 2) obeys a strictly lower ceiling,
              c <= min(1, mu_sym), with
              N mu_sym = [z^n](1+z)^{|X|-1}(1-z)^{-(B-t2)/2-1};
              when mu_M <= 1, no symmetric base attains mu_M;
          (b) the Poisson ceiling table is a large-B model; at small B, random symmetric
              bases fall below 1 - exp(-mu).
        composed: holds, refined (additions a, b)
        effect_on_contract: >-
          F1's threshold min(1, C(B+n-1,n)/N) is unchanged. Addition (a) becomes the exact
          bound P2(ix), whose failure is read under F7, never as F1. Addition (b) makes the
          per-cell exact ceiling ratio a reported quantity beside P3 (RQ-1), and it is a
          stated limitation of P6 at n = 6, 7, where B is about 37 and 23.
      - id: J4
        producer: L6 generic complete-split probability 2^{1-n}(1 + O(n/sqrt Q)); 1 on the factor-base locus; exact over proxy 2^{n-1}
        rederived: >-
          The leading value is 2^{1-n}, and the probability on the locus is exactly 1.
          Exact form:
            P_split = 2^{1-n}(1 + eta) - (t/Q)^n + delta,
          where eta = nt/Q + O(n^2/Q) and 0 <= delta <= C(n,2)(|W'|/Q)^2, with delta = 0
          when t = 0. The relative error is O(n^2/Q) + O(n^2 2^n/Q^2).
          The probability that all nonzero chi are equal is exactly
            M_n = (p_+ + p_0)^n + (p_- + p_0)^n - p_0^n.
          A mixed nondegenerate tuple never splits.
          Exact over proxy is (1 - zeta)/P_split, with 0 <= zeta <= 1/|X|; its leading
          value is 2^{n-1}.
        composed: holds, refined (sharper error term; zeta correction)
        prior_check: >-
          The prior expected exactly this sharper error term, O(n^2/Q) relative, and said
          a sharper term would be a refinement, not a break. Same leading value, so not a
          break. The zeta correction is O(1/|X|) and leaves the leading value unchanged.
        effect_on_contract: >-
          P5(a) and the comparator in P5(b) are confirmed as stated. Conditional on every
          chi being nonzero, the comparator (p_+^n + p_-^n)/(p_+ + p_-)^n is exactly the
          probability that all chi are equal, and on nondegenerate fibres splitting is
          exactly that event. P5(c) is unchanged. M_n + delta is not adopted as a
          prediction (rationale R-5).
      - id: J5
        producer: L8 2^{n-1} = q^{Theta(1)} forces n = Theta(log q); a 2^{n-1} gain in rate 1/n! changes log_q(1/rate) by the relative amount ln 2/(ln n - 1) -> 0
        rederived: >-
          log_q(n!) = Theta(log log q) and log_q(2^{n-1}) -> c. The relative change is
          -ln 2/(ln n - 1)(1 + o(1)) -> 0. The exponent class q^{Theta(log log q)} is
          unchanged, and so is its leading constant c/ln 2.
        composed: holds (as stated; the sign is a convention)
        effect_on_contract: None (no run tests L8).
    proves_too_much:
      O1: passes. The cap allows coverage up to min(1, mu); a non-symmetric base attained mu. A greedy symmetric base beat matched random bases, at 1.116 and 1.243, while staying below its ceiling.
      O2: passes. The locus split probability is 1, not the generic value.
      O3: passes. For D' (one point per pair), T_S depends only on X and differs from T_A'. The T_M - T_X identity is stated to need D = -D.
      O4: passes. Every factor is 1 at n = 1.
    verdict_against_prior: >-
      This concurs with the recorded prior (about 0.6 that every joint holds as stated;
      about 0.85 that no joint breaks in a way that changes a provisional value). No
      provisional value changes. The prior's most likely break did not occur, and its
      specific expectation for J4 was met. A concurrence with a written prior informs less
      than an overturn would, but it is recorded as such, not as a vote.
    b3: >-
      CLEARS when TASK-20261105-c0d167 verifies. No version-2 amendment is needed for a
      broken joint. The final specification still differs from v1 by the additions pinned
      below. The approval act writes them as a protocol_amendment (handling_of_specification).
    limitations_of_the_round:
      - "PD-2: one re-deriver owned all five joints and the control. There is no second reviewer."
      - "PD-1: the blind-history check is UNCHECKABLE, never passed. Hygiene is attested by the reviewer and by the commit messages of the archives."
      - Independence is between sessions only, not between models. The producer, the re-deriver (self-reported claude-opus-5-5, model_verified false) and this composing session are the same model id. This was not a rule-12 round (DEC-20261029-71d757 R-5, OI-5), and nothing here triggers rule 12. There is no closure, no promotion, and no contradiction of validated evidence.
      - Corroboration covers toy fields only (counting up to Q = 961, splitting up to Q = 1,953,125, n <= 4 computed). Semaev's theorem was not read. The T1 transfer of KN-FIND-4f0d84 is corroborated over F_{p^2} and F_{p^3} at small p, not at contract scale.
      - Convention note, so that the run analysis does not misread a factor of 2. The card's T_S counts sign classes with sums in {R, -R}, while the code's T_S counts sign vectors with sum R. The two agree on 2R != O and differ by exactly a factor of 2 at R in E[2]. T_X is the same in both.
      - P2(iv)'s multiple-root clause is not tested by arm A, which builds no fibre at n >= 3. It rests on J2 (10,011 multiplicity checks) and on the arm-B group-law cross-checks.
    procedure_observation: >-
      The PR #2707 bytes reached main through an owner-instructed PR outside this batch's
      archive chain. Nothing is wrong with that, but no archival task binds them. The
      TASK-20261105-7083a8 snapshot re-binds every code file at its final bytes, and the
      approval binds the code sha256 from that snapshot (approval_lock_binding).

  # ------------------------------------------------------ 2. predictions to freeze
  predictions_to_freeze:
    written_before_data: >-
      No contract cell has been counted. The KAT cells and the re-deriver's fields are
      disjoint from every contract cell. These entries are recorded here first
      (first_recorded_in: ledger/decisions/DEC-20261105-f0b7c7.yaml), and the approval act
      copies them verbatim into the final specification. Their values never change after
      any run.
    unchanged: P1, P2 (i)-(vi), P3, P4, P5 (a)-(c), P6, P7, P8 as in specification v1, in value and tolerance
    provenance_upgrade: >-
      P2 source becomes "IDEA-20261023-f15270 L1-L4, independently re-derived by
      TASK-20261029-3ac467 (composed in DEC-20261105-f0b7c7)". P5 source adds "L6 leading
      value and the conditional comparator re-derived by TASK-20261029-3ac467 Q4".
    added:
      - id: P2(vii)
        quantity: per exhaustive cell, the targets O and E[2] that the current iii comparison skips
        prediction: >-
          T_S(R) (code convention: ordered x-tuples with sign vectors summing to R) equals
          sum over ordered point tuples with sum R of 2^{t(P)} at EVERY target, including
          O and E[2]. Reported as the count of skipped targets with nonzero residual;
          predicted 0.
        source: TASK-20261029-3ac467 Q2 (fibre of phi has size 2^{t(P)}; class form with factor 1/2 on G[2])
        decisive: true (C-identities; a failure in a valid cell is F7)
      - id: P2(viii)
        quantity: n = 2 exhaustive cells, every target with 2R != O
        prediction: T_M(R) = T_X(R); the count of such targets with T_M != T_X is predicted 0
        source: TASK-20261029-3ac467 Q2 corollary
        decisive: true (C-identities; F7)
      - id: P2(ix)
        quantity: per exhaustive cell and base (line, matched_random, half_twin), the number of targets with T_M >= 1
        prediction: >-
          at most min(N, C_sym), where C_sym = [z^n](1+z)^{|X|-1}(1-z)^{-(B-t2)/2-1} is
          computed with the base's own B, t2 and |X|. Reported as observed, C_sym and the
          margin; predicted no excess.
        source: TASK-20261029-3ac467 Q3 item 4
        decisive: >-
          true as an exact bound. An excess in a valid cell is read under F7: a
          derivation-correction record, or a counter defect investigated first. It is
          never read as F1 / CLAUSE_SUPPORTED, because F1's threshold is unchanged.
    reported_not_decisive:
      - {id: RQ-1, what: "per arm-A cell, min(1, C_sym/N) divided by the matched-random coverage: the exact per-cell ceiling on kappa_rel, shown beside P3 (J3 addition b)"}
      - {id: RQ-2, what: "per B1 cell, the fractions of zero, degree-deficient, non-squarefree and any-chi-zero tuples (already secondary), now also named as the scale of the conditioning gap in P5(b)"}
      - {id: RQ-3, what: "the J4 exact-over-proxy factor (1 - zeta)/P_split is NOT measured by any arm; it is cited in the eventual evidence review as a derivation, never as a measurement"}
    not_adopted:
      - {what: "unconditional split fraction against M_n + delta on all B1 tuples", why: "B1 tests splitting only on squarefree full-degree fibres with nonzero chi; adding it means changing the fibre analysis; at rung 2 the degenerate and chi-zero mass is about 1e-3 or less, so it adds little beyond P5(b) (R-5)"}
      - {what: "tightening F1 to min(1, mu_sym)", why: "that would change a falsification threshold; P2(ix) carries the sharper bound under F7 instead"}

  # ------------------------------------------------------------ 3. F-1 and F-2
  f1_decision:
    choice: require a pre-approval KAT extension (TASK-20261105-ac5ad6 KX-1 to KX-5); IM-3 is widened by this decision
    reasons:
      - >-
        The untested code paths carry most of the contract: arm A and B at n = 4, 5, and
        four of the six arm-C n values (4 to 7).
      - >-
        An arithmetic defect at n >= 4 would not be caught by P1. The conservation
        identity holds for any map from tuples to targets.
      - >-
        Such a defect would surface first as a P2 identity failure, which the contract
        routes to F7, a derivation-correction record. An instrument defect would then be
        filed against a derivation that two independent sessions now agree on. That is
        the program's most expensive misreading, and the start-up self-test cannot
        prevent it while the KATs stop at n = 3.
      - >-
        The extension costs a few hours and zero runs. The cells
        F_{5^n} and F_{13^n} (n = 4..7), and F_{q'_n^n} with q'_n the least prime > q_n
        (n = 2..7), are disjoint from every contract cell.
    widened_im3: >-
      Field, curve and counter KATs may use q in {5, 13} at n <= 7, and q'_n = the least
      prime greater than the arm-C q_n at degree n, for n = 2..7. The throughput proxies
      of TP-0 are timing-only. All other IM-3 terms stand: naive against optimised only,
      no cross-convention identity or predicted value asserted, and no derived statistic
      recorded.
  f2_decision:
    choice: require a measured throughput on non-contract proxy cells (TP-0); no compiled port unless TP-1 triggers
    reasons:
      - Watchdogs and worker counts are set from the throughput. A watchdog sized from a 4x-uncertain model either wastes cells as failed_infrastructure or hides a hang.
      - The measurement costs less than one B1 cell; a port costs a new implementation and its own KATs.
    TP-0: >-
      Timing only. Measure B1 analysis per tuple at n = 2..5 on (257, 2), (43, 3),
      (29, 4) and (13, 5), the least primes above each rung-2 q, with at least 10^4 tuples
      each. Also time the largest arm-A cell proxy (103, 4) and the arm-C n = 2 proxy
      (q'_2, 2), each in full or with a stated partial fraction. Record wall time, CPU time,
      peak RSS and the worker count. No tally, split count, chi pattern, histogram or
      coverage is printed, recorded or kept; the outputs go to a temporary directory
      deleted unread.
    TP-1: >-
      If the measured projection for one B1 cell of 10^6 tuples exceeds 24 h of wall time
      at the worker count the host can sustain, the approval act does not approve. It
      opens a compiled-B1-port task instead. Otherwise the approval act sets every
      per-arm watchdog to 3x the measured projection (minimum 1 h) and records it.

  # ------------------------------------------------------------ 4. choice
  choice:
    chosen: (b) keep EXP-MONO-1a1be2 review_required and open BATCH-8517aa
    why_not_a: >-
      Option (a) needs every one of B1-B6 to clear in this act. B1 cannot honestly clear
      while the KATs stop at n = 3 (f1_decision), and the watchdog values for B5/B6 would
      rest on a model (f2_decision). The cost of (b) is one implementation task, one code
      review and two archives, all with zero runs. The cost of (a) going wrong is a run of
      about 100 cells whose n >= 4 rows could be misfiled as derivation failures.
    ranked_ahead_of_doing_nothing: >-
      The batch clears the last instrument blockers on the only designed contract of an
      ECC lineage. Its outputs are needed under every outcome of the eventual run. No other
      open act on GOAL-PATH-001 is claimed. The next Q1 act, the C-Q1d absorption check
      (DEC-20261023-19c53b), keeps its rank and is not displaced.
    updated_blockers:
      - {id: B1, status: open (narrowed), text: "Instrument exists (02a714; 177 KATs after #2707). Remaining: F-1 widened KATs and the composition residuals (P2(vii)-(ix)).", clears_when: "TASK-20261105-7083a8 verifies with the full KAT suite passing, and TASK-20261105-49716d verifies with no unresolved blocking finding from TASK-20261105-165da2"}
      - {id: B2, status: open (narrowed), text: "Launcher and generator exist. The regenerated plan must be byte-identical to, or a recorded successor of, the 9ccbe614...fb4a preview.", clears_when: "the approval act binds trial_plan_sha256 of the plan regenerated from the 7083a8 code"}
      - {id: B3, status: cleared, text: "Composed here: every joint holds, three refined; additions pinned in predictions_to_freeze.", clears_when: "TASK-20261105-c0d167 verifies"}
      - {id: B4, status: open, text: "protocol.json not written", clears_when: "approval act: validate and freeze, hash bound in execution_plan.protocol_hashes"}
      - {id: B5, status: open, text: "no runbook or mechanical card", clears_when: "approval act: experiment-director compile, LINT OK, then CARD OK"}
      - {id: B6, status: open, text: "no preapproval packet or run handoff", clears_when: "approvable true on the exact prospective bytes; after the approval archive, execution_state ready"}
      - {id: B7, status: open (new), text: "throughput measured, watchdogs set (F-2)", clears_when: "throughput-calibration.json in the 7083a8 snapshot, and TP-1 not triggered"}
      - {id: B8, status: open (new), text: "independent code review of the final code", clears_when: "the 165da2 report is archived by 49716d with no blocking finding left unresolved"}

  # ---------------------------------------------------- specification handling
  handling_of_specification:
    now: >-
      Not edited. experiments/EXP-MONO-1a1be2/specification.yaml stays the v1
      review_required draft (sha256 d81a85b3...c373). Its blocker list is superseded, for
      decision purposes, by updated_blockers above. Its own header requires that any change
      before approval be an amendment that keeps the original on record.
    approval_act: >-
      /design-experiment step 5 asks for preview copies of the exact final bytes in a
      packet. The launcher reads experiments/EXP-MONO-1a1be2/specification.yaml and checks
      its sha256 against approval.lock, so the approved bytes must end up at that path.
      The approval act therefore:
      (i) writes experiments/EXP-MONO-1a1be2/amendments/AMEND-v2-<DEC-id>.yaml, a
          protocol_amendment listing every v1 -> v2 change with this decision as the
          reason (zero runs, so no outcome informed it);
      (ii) writes the v2 bytes, with status approved and approved_by coordinator, to the
           preview path experiments/EXP-MONO-1a1be2/preapproval/specification.v2.preview.yaml;
      (iii) builds the packet on that preview and requires approvable: true;
      (iv) only then, in the approval archive, writes byte-identical v2 content to
           specification.yaml.
      v1 stays on record through the 26a72871e7 binding and the amendment. The design
      skill allows this: the pre-approval draft becomes the frozen contract at approval.
      What it forbids is an edit after approval.
  approval_lock_binding: >-
    The approval decision records four things: the 7083a8 snapshot commit; the per-file
    sha256 of the seven CODE_FILES at that commit; code_sha256 = launcher.code_sha256()
    (one sha256 over "name:sha256\n" for fqn.py, curves.py, semaev.py, counters.py,
    kernel.c, launcher.py and make_trial_plan.py, in that order) computed on those bytes;
    and the sha256 of code/tests/test_kat.py.
    The approval archive writes experiments/EXP-MONO-1a1be2/approval.lock as JSON with
    approved_by, specification_sha256 (the v2 bytes), code_sha256 and trial_plan_sha256.
    The launcher's gate is the post-#2707 code, and it refuses a missing, empty or
    mismatched lock. The 02a714 bytes stay bound as history and are never the approved
    build. The start-up self-test receipt binds the same code_sha256 and the test-file
    sha256.

  # ------------------------------------------------------------ visual report
  visual_report:
    owed_by_this_act: true
    reason: >-
      This act records a DEC that composes a review round, clears a readiness blocker and
      pins predictions. That is the review step of coordinate (research-visuals, "Every
      evidence review"). There is no evidence record and no status move, so the report is
      small.
    directory: experiments/EXP-MONO-1a1be2/reports/review-DEC-20261105-f0b7c7/
    files:
      - report.typ (source)
      - report.pdf (rendered, inspected)
      - composition.svg
      - split-fraction.svg
      - figures.py (draws both SVGs from figure-data.json)
      - figure-data.json (values copied by key from computations.json, each with its step id)
