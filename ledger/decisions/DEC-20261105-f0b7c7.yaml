    After the snapshot, on the owner's explicit instruction, PR #2707 (merged at
    f7b61f7e0d) fixed three launcher defects found by Codex review:
    - an empty approval.lock bypassed every check;
    - a B2 instance with fewer than n factor-base x-coordinates crashed (KeyError);
