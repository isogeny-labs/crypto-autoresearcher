    AUD-20261029T012603Z-0b6353 of RBS-PFDR-bb0d26. The deterministic audit
    replayed 4 of 5 units and flagged two: analyze-main RUN-PFDR-243425 and
    analyze-final RUN-PFDR-089edc, whose raw-result.json /summary differs from
