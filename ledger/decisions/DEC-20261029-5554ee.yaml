    analyze-final under CPython 3.11 (the manifest python_version), or under
    the toleranced compare of TASK-20261029-1bcf80, and records the interpreter
    used. It must not treat the 2-leaf float mismatch as a fabrication signal,
    or a 3.13 exact match as required. The plan must also take the reader's
    not_covered items as attack inputs. The re-derivation was not blind to
    run.py, the planted arm was not regenerated by disjoint code, jobs with
    n >= 1024 were not recounted, and ci95 is not bit-reproducible from the
    specification. A strictly blind re-derivation belongs in the plan.

