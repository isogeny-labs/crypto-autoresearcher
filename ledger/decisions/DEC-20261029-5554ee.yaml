    of floats compensated, while the runs were recorded under 3.11.15 and
    replayed under 3.13.17. It is not fabrication. The five runs stay citable as
    recorded, with the scope below. There is no rerun, no invalidation and no
    implementation fix. The replay contract is repaired in tooling
    (TASK-20261029-1bcf80). The independent review of DEC-20261022-9aec2b NA-1
    stays the next action of lane BATCH-8d6d84.
  context: >-
