    cause_confirmed_both_ways: >-
      scripts/cause_probe.py ran the bound analyze_records in-process. Native
      3.11.17 output was byte-identical to the recorded files, and native
      3.12.3 and 3.13.17 output to the replay files. 3.13.17 with a strict
      left-fold sum matched the recorded files, and 3.11.17 with a Neumaier sum
      matched the replay files. Record order, set and dict order, and unseeded
      sources were ruled out. This is a diagnostic, not an audit replay.
    exact_value: >-
      Recorded and replayed floats both lie within 2.1e-13 of the exact
      rational calibration statistics (blind_rederive.py). Neither is exact.
    margins: >-
      The tightest gate margin (|kappa - 1| = 0.0086 under 0.05) is more than
      1e9 times the largest float discrepancy.

  ruling:
    classification: environment_drift
    classification_text: >-
      Environment drift (interpreter version), not fabrication. The recorded
      values are authentic CPython 3.11.15 outputs of the bound driver on the
      committed inputs. A miscopied or invented value would not reproduce
      byte-for-byte under 3.11 or under a swapped summation function, and these
      do.
    runs:
      RUN-PFDR-e44a19:
        trial: selftest
        citability: citable
        scope: >-
          Citable as recorded, as input to the independent review. Not replayed
          (1 of 5). The reader recomputed the 42 KAT sets, 3 label universes, 15
          half-box rows and the design table with disjoint code, all with 0
          mismatches.
      RUN-PFDR-4d8c71:
        trial: census-toy-main
        citability: citable
        scope: >-
          Citable as recorded. Its replay matched /summary exactly. The jobs
          files are identical except for the seconds field and line order, both
          of which the specification excludes.
      RUN-PFDR-cd03e2:
        trial: census-toy-rep
        citability: citable
        scope: Citable as recorded. Its replay matched (0 jobs, empty file).
      RUN-PFDR-243425:
        trial: analyze-main
        citability: scoped
        scope: >-
          Citable as recorded. Under the current exact-equality contract it has
          no exact-replay assurance for /summary/calibration/mean and /sd (rel
          up to 8.6e-14). Every non-float leaf and every decision field
          replayed equal. Byte reproduction under 3.11 rests only on the
          reader's in-process diagnostic, not on an audit replay. Any citation
          must disclose this.
      RUN-PFDR-089edc:
        trial: analyze-final
        citability: scoped
        scope: Same as RUN-PFDR-243425.
    session_RBS-PFDR-bb0d26:
      citability: scoped
      scope: >-
        The integrity of the session holds: chain, bound files and digests. Its
        audit is not clean (flagged), and stays flagged as recorded. The two
        calibration summary metrics carry the interpreter-dependent last bits.
        All other summary metrics replay bit-equal.
    citability_meaning: >-
      "Citable" here means the run record may be cited by an evidence review as
      the record of what ran. No run is evidence until an EV record exists, and
      none exists. SUPPORT_SCOPED is the tool's string. This decision adopts
      neither the string nor the outcome (as in DEC-20261022-9aec2b).
    no_rerun_no_invalidation_no_fix: >-
      No rerun: the data are authentic and complete. No invalidation: no class,
      count, flag, outcome or headline changes. No implementation fix: the
      driver is deterministic within an interpreter family. The defect is in
      the replay contract, which compares derived floats with no tolerance and
      records no interpreter. The frozen runbook stays as it is, and
      environment.python is not added to it.

  replay_contract_ruling:
    float_tolerance: >-
      Yes. A documented float tolerance, applied only to float leaves: ints,
      strings, bools, nulls, key sets and list lengths stay exact. A runbook
      declares it prospectively per pointer. An audit-time tolerance for a
      frozen runbook is recorded in audit.json, and its result is labelled
      matched_within_tolerance, never matched. The reader suggests rel_tol 1e-9
      and abs_tol 1e-12, which match check.py _close. The observed rel is at
      most 8.6e-14. Default stays exact equality.
    interpreter_parity: >-
      Yes. Record the replay interpreter (sys.version, executable) per replay,
      compare it with the replayed unit's manifest python_version, and report a
      difference as its own environment_drift note rather than a bare
      mismatch. When a runbook pins environment.python and the audit host's
      interpreter differs, report not_covered rather than replaying silently.
    future_runbooks: >-
      Runbooks whose replay.compare reaches derived floats pin
      environment.python to the producing major.minor. They split compare into
      exact pointers and toleranced pointers, and include the specification's
      primary per-cell table where one exists (reader O1). New drivers should
      accumulate floats with math.fsum. This is guidance for the design lane,
      not a change to any frozen runbook.
    implemented_by: TASK-20261029-1bcf80

  review_constraint_for_NA-1: >-
    DEC-20261022-9aec2b NA-1 (open /review-evidence for EXP-PFDR-bb0d26 with a
    review_plan written before any reviewer runs) stays the single next action
