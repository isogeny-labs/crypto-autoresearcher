  rationale:
    - >-
      The mismatch is fully explained by a controlled, two-way experiment on
      the summation function. It is confined to float last bits at most 416
      ulps. It changes no count, class, flag, outcome or headline, and it sits
      more than 1e9 times inside the tightest gate margin.
    - >-
      Exact float equality across interpreter versions is stricter than the
      experiment's own determinism statement. R7 and
      determinism_excluded_fields promise pure job records, not bit-identity
      of derived floats. The producer's checker already compares these fields
      with rel_tol 1e-9. The contract, not the run, needs repair.
    - >-
      Invalidating authentic, complete runs over a tool-contract gap would
      discard valid data (agents/coordinator.md prohibitions). Ignoring the
      flag would hide that the audit was not clean. So the citability is
      scoped and disclosed, and the tool is fixed.
    - >-
      Scope: toy curves of 20, 24 and 28 bits, n up to 4096, the frozen
      contract only. Nothing about any standardized or deployed curve.
