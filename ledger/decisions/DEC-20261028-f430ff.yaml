  prospective_owner_writer_contract:
    accountable_owner: >-
      Exactly one future Coordinator P claim owner, identified by an actual
      lowercase bus address and the session that owns the claim. The parent
      control-plane session may be that owner if it is then active and
      authorized. No owner, claim, or epoch is assigned by this decision.
      Only the owner of the live epoch may authorize its writer and release
      that claim.
    model_session: >-
      Before queue enable or claim, create and verify a new exact-task
      TASK-20261028-20d746 read-only model session under
      coordinator-orchestration-code, reasoning effort high, with no fallback
      or degradation. Its immutable task-specific receipt must bind the actual
      serving model, effort, provider, workdir, read-only sandbox, and session
      ID. Continue model work only in that receipt-bound session and sandbox.
      Receipt003 from the orientation thread is not P admission. The P model
      session supplies Coordinator judgment and read-only review of the import;
      it does not write P outputs or establish the claim owner's identity.
    mechanical_writer: >-
      A separately attributed parent Coordinator control-plane process may
      create P outputs only with the live claim owner's explicit, recorded
      authorization. The parent reported CODEX_THREAD_ID and CODEX_SESSION_ID
      as 01a179ee-06bf-7550-bc38-0d98c7e3b9c8; this is only a time-bound
      candidate writer identity. Use its actual current identity if still
      active, or another expressly authorized writer if it has ended. No
      AUTORESEARCH runtime, model, or policy marker was present for that parent
      identity. Its model is unknown and cannot substitute for the P model
      session's verified serving-model evidence. A standalone read-only
      model session does not satisfy the Coordinator role's write/edit
      requirements; the published composite arrangement must be accepted
      as the task route before claim.
    claim_and_attribution: >-
      After a separate queue enable and fresh pre-claim recheck, claim only
      the queued P card through goal_lanes.py using one actual --as owner.
      If --session is supplied, it identifies that accountable claim owner's
      session, not a second participant. The native claim has no documented
      dual-role session field; bind the P model receipt and session separately.
      The claim must name the actual worktree and be published with a bounded
      expiry. Its owner and epoch are learned from the real claim, never
      prefilled here.
    attribution_note: >-
      After the real claim and before any P output, create and publish one
      append-only note outside P's task directory at
      coordination/goals/GOAL-RELN-001/batches/BATCH-0834cb/admission/
      TASK-20261028-20d746.<epoch>.owner-writer.json, replacing <epoch>
      with the actual claimed epoch. Bind the exact claim owner, epoch,
      owning session if supplied, expiry, worktree and write scope; the P
      model receipt and session; the actual mechanical writer identity and
      explicit owner authorization; the 19 source-byte identities; and the
      declared output paths. This note adds no field to the native claim.
      Before each writer operation, recheck the same live owner, epoch,
      session binding, scope and expiry. Any change stops writing.
    writer_scope: >-
      Only coordination/goals/GOAL-RELN-001/batches/BATCH-0834cb/tasks/
      TASK-20261028-20d746/ is writable for P. The writer produces only
      the 21 artifact_paths declared in the published handoff and queue:
      19 separately mapped capsule files, import-manifest.json, and
      custody-report.json. The attribution note is outside that task
      write scope and is a separate Coordinator control-plane record.
      No output may enter the old BATCH-79a580 namespace.
    import_procedure: >-
      For each of the 19 source-bindings rows, read raw bytes from its
      source_commit:source_path Git blob, check its listed byte count,
      SHA256, and Git blob OID, then write exactly those bytes to its sole
      listed destination_path. Verify destination size and SHA256. Preserve
      empty stderr bytes, both distinct receipt versions, original
      claims/releases, and the source lane. The strict import manifest maps
      every source identity to exactly one declared destination and its
      verified hashes. The custody report records the original archive
      message/ancestry limitation and the release-only missing GOAL- alias
      as unresolved; it neither creates that alias nor relabels a hash.
      Importing bytes does not execute historical programs.
    pre_release_verification: >-
      A read-only checker separate from the mechanical writer re-reads all
      21 declared paths, recomputes byte counts and SHA256 values, checks
      the manifest's one-to-one mapping and the custody report's limitations,
      and compares the live owner/epoch/scope with the attribution note.
      This is a P completion check, not V's later independent review.
      Missing, extra, mismatched, oversized, or unattributed output stops
      completed release. Check each output against repository artifact
      policy before commit; a threshold requiring an unauthorized storage
      operation stops this route.
    completion_and_successors: >-
      Only the live claim owner may publish a completed P release, with the
      exact epoch and SHA256 of all 21 declared outputs. Failed or incomplete
      import cannot be released completed. Only after that actual completed
      release may A perform its isolated content archive. V then conducts
      fresh independent source and archive review under its own session
      admission; L adjudicates only after V. Neither P nor A changes a
      scientific claim or approval.
