      - report.pdf (rendered, every page inspected)
      - findings.svg
      - mutation-kill.svg
      - figures.py (draws both SVGs from figure-data.json)
      - figure-data.json (well under 64 KiB; values copied from code_review.md by section and table, each with its source)
    report_contents: >-
      Decision (revise; nothing approved), claim tier (instrument review; no mathematics) and
