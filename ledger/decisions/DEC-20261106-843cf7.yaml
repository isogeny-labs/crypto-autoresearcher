    - {id: B1, status: open (narrowed), text: "Widened KATs pass (316, 7083a8). Remaining: a non-vacuous large-Q index KAT that kills M5 (N-1), and the m = 3 large-q substitute cell (DEV-1, FX-16).", clears_when: "TASK-20261106-5c1258 verifies with the full suite passing and the FX-16 cell passed, and 7c2b01 confirms M5 is killed and FX-16 ran as specified"}
    - {id: B2, status: open (determinism confirmed), text: "Plan regenerates byte-identical (9ccbe614...fb4a) at 72f51766a6, twice by 165da2. The fix must keep it identical.", clears_when: "the approval act binds trial_plan_sha256 of the plan regenerated from the 5c1258 code"}
