      Strictly in sequence: (1) commit the queue alone, render it, open lane BATCH-69d9a2;
      (2) render the decision report; 0c8aee alone, then close lane BATCH-8517aa;
      (3) 4c4831; (4) 5c1258 alone; (5) 7c2b01 on the 5c1258 commit; (6) 649ebb alone;
      (7) the approval act (declared successor, outside this queue).
    max_concurrent: 1
    focus:
      decisive_evidence: the 7c2b01 report finding every must-fix closed, M5 killed, the gate scenarios refused, the plan byte-identical and no new blocking finding
      inconclusive_decision: >-
        If 7c2b01 finds a must-fix not closed or a new blocking finding, a fresh Coordinator
        act (spare DEC-20261106-720ace) composes it and opens one further fix round. A second
        consecutive failed re-review is a rerank trigger. A fix that needs kernel.c, fqn.py,
        curves.py, semaev.py, make_trial_plan.py or throughput_calibration.py stops 4c4831
        and returns to that fresh act. All of this is infrastructure, never evidence.
      excluded_peripheral_work: N-6 seed derivation; the exact (32779, 2, m = 3) cell (replaced by the FX-16 substitute); a compiled B1 port; L7; reading C; the 2^36 extension; M_n + delta; any contract cell
      rerank_trigger: >-
        Any of: two consecutive failed re-reviews; a fix requires a kernel or plan change;
        the regenerated plan differs from 9ccbe614...fb4a; EXP-MONO-1a1be2 not approved by
        2026-12-15 (DEC-20261105-f0b7c7 knowledge_promotion revisit condition, which stands).
      stage_budget: >-
        Advisory (docs/research-budget-policy.md): fixes 36000 s (21600 s of code and tests
        plus 14400 s for the FX-16 cell), re-review 14400 s, three archives about 8100 s
        together. Zero runs.
    pairing_duty: >-
      Unchanged. Arm C remains the paired heuristic-validation arm (HEUR-F-1, HEUR-F-2);
      4c4831 continues the proof-of-concept implementation. The fixes strengthen exactly the
      arm-C path (N-1, N-3) that the pairing rests on.
    review: >-
      7c2b01 is an instrument re-review, not a claim-changing round, so it has no
      review_plan. Blindness is lifted deliberately: it reads the 165da2 report, because a
      fix-verification review must know what was found. It does not read the fix producer's
      session. The eventual runs get their own independent validation in review-evidence.

