  # ------------------------------------------------------------ 6. batch
  batch:
    id: BATCH-69d9a2
    goal_id: GOAL-PATH-001
    dispatch_queue: coordination/goals/GOAL-PATH-001/batches/BATCH-69d9a2/dispatch_queue.json
    tasks:
      - TASK-20261106-fdd5c2 (coordinator; this act; completed on writing; archived by 0c8aee)
      - TASK-20261106-0c8aee (coordinator; ledger archive of this act, ALONE; closes lane BATCH-8517aa; pins 4c4831 inputs)
      - TASK-20261106-4c4831 (executor, executor-implementation; FX-1 to FX-16, including the DEV-1 substitute cell; zero contract cells, zero runs; archived by 5c1258)
      - TASK-20261106-5c1258 (coordinator; snapshot of 4c4831, alone among commit tasks; re-binds code_sha256)
      - TASK-20261106-7c2b01 (validator, review-adversarial, fresh independent session; focused re-review RR-1 to RR-8; archived by 649ebb)
      - TASK-20261106-649ebb (coordinator; snapshot of 7c2b01, alone among commit tasks)
