  # ------------------------------------------------------------ 1. code-review composition
  code_review_composition:
    review: coordination/goals/GOAL-PATH-001/review/TASK-20261105-165da2/code_review.md (read in full; sha256 4c77c235...c101 at 608902a44d)
    attestation: coordination/goals/GOAL-PATH-001/review/TASK-20261105-165da2/review_attestation.yaml (read in full; sha256 01d5f958...c0cf)
    commit_reviewed: 72f51766a67be05f6d8de0f4ed962c4c615d52bd
    reading_rule: >-
      A finding is MUST-FIX when, left alone, it lets a cell that violates the
      specification's stopping or invalidation rules be recorded as valid, or lets an
      instrument defect reach a P-reading under F7 or F8, or when its fix costs less than its
      separate tracking. It is a RECORDED LIMITATION only when no path the approved plan
      executes can reach it, and the limitation then carries a trigger that turns it into a
      must-fix.
    findings:
      - id: F-1
        reviewer_severity: blocking
        disposition: must_fix
        fix_ids: [FX-2, FX-3, FX-4, FX-5, FX-6]
        reason: >-
          Stopping rule 1 is the only guard against an arithmetic difference on the
          executing host (DEC-20261105-f0b7c7 f1_decision); the R1 recount shares the kernel.
          Each of the five gaps (a)-(e) alone lets a cell start without the full suite having
          passed, and the package cannot show it. I adopt the reviewer's five-part repair,
          with two additions found in reading it: the self-test environment must also scrub
          PYTEST_ADDOPTS and PYTEST_PLUGINS and disable plugin autoload, since either can
          deselect items as the root conftest did; and a receipt that fails a check must
          REFUSE the cell, not fall through silently to a full run (gap (e) third point).
      - id: N-1
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [FX-7]
        reason: >-
          The approved bytes are correct on this path (reviewer differential), so this is
          not an instrument defect. But the start-up suite exists to guard the EXECUTING
          host, not the review host, and arm-C n = 6, 7 is a third of arm C. A start-up suite
          that cannot fail on the large-Q index path does not guard it. The fix is two KATs
          on existing KAT fields and asserts no predicted value. W10 is also made
          non-vacuous at every n >= 3, since nine of its eleven cells compare zero vectors.
          Acceptance: the M5 mutant must fail at least one new item, and 7c2b01 confirms the
          kill independently (RR-3). Owner direction item 2 makes this binding.
      - id: N-2
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [FX-8]
        reason: >-
          The run will be executed by the mechanical tier from a runbook. AGENTS.md "Artifact
          policy" requires a validity status and reason per run. A launcher-side validity
          block and an enforced F2 family stop remove a judgement the mechanical tier should
          not make. The analysis still recomputes validity from raw fields, and the stricter
          reading wins (V2-2). Owner direction item 3 makes this binding, with tests that fail
          on the 72f51766a6 code.
      - id: N-3
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [FX-9]
        reason: >-
          lambda from the P2(vi) closed form couples P6 (F8) to P2(vi) (F7): a P2(vi) defect
          would move every arm-C lambda and could be misread as a refutation of HEUR-F-1.
          The specification defines lambda from the cancellation-free total, so using the
          counted value is the definition, not a change. Agreement is recorded per cell and
          base, and disagreement withholds that cell's P6 reading (V2-3).
      - id: N-4
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [FX-10]
        reason: IM-3 says no derived statistic is recorded in KAT mode. The fix gates three keys and costs minutes.
      - id: N-5
        reviewer_severity: non-blocking
        disposition: must_fix
        fix_ids: [FX-11]
        reason: >-
          Five small hardening items. (1) Approved specifications in this repository set
          execution_authorized and frozen true; the gate must check them and the lock's
          approved_by. (2) An unsanitized run id can write a package outside runs/, where no
          archive finds it. (3) and (4) make the arm-C sample reproducible from cdf.json
          alone and the memory metric honest under the 16 GB cap. (5) closes an unhashed
          shadowing route. All are cheap and the launcher is being changed anyway. Owner
          direction item 3 makes this binding, with a test per item that fails on the
          72f51766a6 code.
      - id: N-6
        reviewer_severity: non-blocking
        disposition: recorded_limitation
        limitation_id: L-2
        reason: >-
          Unreachable in this plan: no B2 instance exceeds 10^4 subsets (max 8,515), so the
          B2 tuple seed is never consumed. Changing seed derivation risks the plan's byte
          identity for no gain.
        trigger_to_must_fix: >-
          Any successor plan in which some B2 instance has more than 10^4 subsets. Per-rung
          seeds are then required before that plan is approved.
    held: >-
      CR-1 refusals (13 scenarios), CR-2 seeds and byte-identical plan, CR-3 kills of M1-M4
      by widened KATs only, CR-4 residuals equal to an independent recomputation on 33 cases,
      CR-5 discipline, CR-6 sampler and cdf.json keys. These are not re-reviewed in full; the
      re-review checks that the fixes do not regress them (RR-6).
    composed_verdict_b8: >-
      B8 stays OPEN. It clears when TASK-20261106-649ebb archives a TASK-20261106-7c2b01
      report that finds every must-fix closed and no new blocking finding.

  # ------------------------------------------------------------ 2. DEV-1
  dev1_decision:
    deviation: >-
      KX-4 asked for the large-q E2 sampled-counter KAT at m in {2, 3} for every n = 2..7.
      The cell (32779, 2, m = 3) was not run (about 6e12 multisets, about 17 h, over the 8 h
      budget). (32779, 2) was checked at m = 2 only. The card was silent on a substitute.
    choice: >-
      FIX before approval, as the owner directs (owner_direction item 1). The fix is a
      SUBSTITUTE non-contract large-q cell (FX-16), not a one-off budget for
      (32779, 2, m = 3). The cell is F_{q''^2} with q'' the least prime greater than 10,000
      (the test computes it by trial division and checks it disjoint from every contract
      pair; 10,007 is expected by the rule). It runs the large-q E2 sampled-counter KAT at
      m = 3 on the line base with s = 50 targets, checked by an independent membership
      method in Python field arithmetic, under the KX-4 rules. Budget: 14,400 s wall and
      16 GB for this cell, inside 4c4831. The executor first records a measured
      projection; if that exceeds the budget, it stops and reports, and never shrinks the
      cell silently.
    why_substitute_not_budget:
      - >-
        The substitute keeps every property the omitted cell would test: degree n = 2, tuple
        size m = 3, depth-3 multiset enumeration in the compiled kernel, a field large
        enough (Q about 1e8) to sit in the same index-width class as the n = 2 contract
        cell (Q < 2^31), the same kernel and sampler code, and nonzero counts on sampled
        targets (about C(B+2,3)/N, i.e. thousands per target, at B about q), so the
        comparison is not vacuous.
      - >-
        The exact cell needs about 6e12 multisets in the kernel (about 17 h at the
        calibrated rate). Its independent membership method needs a pair-sum table of
        about 5e8 entries built by Python point additions: hours of time, and memory
        comparable to the 16 GB cap. Together that is over 20 h, with real risk of a
        memory-bound failure that would be infrastructure and prove nothing. The
        substitute does the same check in well under 4 h, about 1/30 of the multisets.
      - >-
        No contract cell runs m = 3 at n = 2: every arm-C cell has tuple_size_m equal to n
        (e.g. C-n2-q32771-c0, tuple_size_m 2). The check therefore guards the code path,
        not a contract configuration, and a substitute on that path is sufficient.
    residual_note: >-
      Not a limitation; recorded for completeness. The exact (32779, 2, m = 3) cell stays
      unrun. If a successor plan ever runs m = 3 at n = 2 at contract size, or any
      configuration whose multiset count exceeds 2^32, a KAT at that scale is required
      before approval.

  # ------------------------------------------------------------ 3. amendments pinned now
  approval_lock_binding_v2:
    supersedes: DEC-20261105-f0b7c7 approval_lock_binding (lock content and the receipt clause only)
    why_before_data: The 165da2 review found the test file unbound (F-1 (a)); no approval and no run exists, so the lock is amended, not repaired.
    lock_content: >-
      experiments/EXP-MONO-1a1be2/approval.lock is JSON with five fields: approved_by,
      specification_sha256 (the v2 bytes), code_sha256 (launcher.code_sha256() over the same
      seven CODE_FILES in the same order, unchanged definition), trial_plan_sha256, and the
      NEW test_file_sha256 (sha256 of code/tests/test_kat.py). check_approval refuses a lock
      missing any field or mismatching any hash (FX-2).
    approval_records: >-
      The approval decision records the TASK-20261106-5c1258 snapshot commit, the per-file
      sha256 of the seven CODE_FILES and of tests/test_kat.py at that commit, code_sha256,
      and EXPECTED_KAT_ITEMS and DESIGNED_SKIPS as read from launcher.py at that commit.
      The 72f51766a6 bytes stay bound as history and are never the approved build.
    selftest_receipts: >-
      A start-up self-test receipt is written only by the launcher's selftest subcommand,
      after approval.lock exists, into experiments/EXP-MONO-1a1be2/selftest-receipts/<id>/.
      It binds code_sha256, test_file_sha256, the lock sha256, an environment key and the
      junit XML sha256 (FX-5). The run handoff's write_scope must include that directory.
  specification_additions_for_v2:
    written_before_data: >-
      No contract cell exists. These are invalidation and reading rules, not predictions.
      The approval act copies them verbatim into the v2 amendment and specification;
      predictions_to_freeze of DEC-20261105-f0b7c7 is unchanged.
    items:
      - id: V2-1
        text: >-
          Stopping rule 1, made checkable. A cell is INVALID (infrastructure) unless its
          manifest carries (a) a gate block whose specification, lock, plan, code and
          test-file sha256 equal the approved values, and (b) a startup_selftest block
          showing, for the executing host, a full pass: collected equal to
          EXPECTED_KAT_ITEMS, zero failures and errors, and skipped node ids exactly
          DESIGNED_SKIPS for an approved specification, either run in-process or by an
          accepted receipt whose bytes are copied into the package.
      - id: V2-2
        text: >-
          Each manifest carries a launcher-written validity block (status valid, void or
          invalid, with reasons) from the R1 recount, the group-law cross-check counts,
          identity-field completeness, raw/summary agreement and the curve selection rule.
          The analysis recomputes validity from the raw fields; where the two differ the
          stricter status applies and the difference is reported as an instrument finding.
      - id: V2-3
        text: >-
          Arm-C lambda = (N_cf_counted - m_S)/(N - |S|), with N_cf_counted the kernel's
          counted cancellation-free total. The P2(vi) closed form is recorded beside it with
          an equality flag per cell and base. Inequality withholds that cell's P6 reading
          (INCONCLUSIVE for P6) and is investigated under F7 first, never read as F8.
      - id: V2-4
        text: >-
          The F2 family stop is enforced by the launcher: the first arm-A cell with a
          CTL-null all-target identity failure writes runs/STOP-F2.json, is void, and every
          later arm-A cell is refused while the sentinel exists. The runbook checks the
          sentinel before each arm-A cell. Removing the sentinel requires a new implementation
          commit and a Coordinator decision.

