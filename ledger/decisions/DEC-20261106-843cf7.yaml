    canonical_graphs: >-
      None changes: no evidence record, status or knowledge entry moves. report.typ lists the
      canonical graphs checked and left unchanged, including the two figures of
      review-DEC-20261105-f0b7c7.
    rendering: >-
      The top-level session renders under research-visuals "Rendering" (typst wheel in a
