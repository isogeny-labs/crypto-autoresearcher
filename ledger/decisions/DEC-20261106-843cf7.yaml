    reason: >-
      This act records a DEC that composes a review and changes a readiness gate (the review
      step of coordinate; research-visuals "Every evidence review"). There is no evidence
      record and no status move, so the report is small. Consistent with
      review-DEC-20261105-f0b7c7.
    directory: experiments/EXP-MONO-1a1be2/reports/review-DEC-20261106-843cf7/
    files:
