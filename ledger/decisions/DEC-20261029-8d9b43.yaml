        reason: R-4 of DEC-20261029-8d9b43; knowledge/README.md "findings"
        evidence_artifacts: [knowledge/findings/KN-FIND-c81e5b.md, ledger/decisions/DEC-20261029-01405d.yaml, ledger/evidence/EV-PFDR-28183c.yaml]

