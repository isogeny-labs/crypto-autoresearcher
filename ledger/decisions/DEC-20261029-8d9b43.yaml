  cross_round_comparison:
    concurs:
      - id: CC-1
        what: data, validity and reproduction
        text: >-
          Both rounds find the run set valid: five runs, hashes bound, seeds on the rule, raw/summary agreement, no
          defect. Both reproduce O-NULL / SUPPORT_SCOPED blind from the raw records, with S exact and classes 45/45.
          Both make a byte-identical 3.11 replay of analyze-main, analyze-final and the selftest (theirs 3.11.15,
          which also covers census-toy-rep; ours 3.11.17). Both reproduce the 3.13 drift (479 float leaves, max
          relative 6.47e-11). The four degenerate jobs carry the same short relations.
      - id: CC-2
        what: scope
        text: >-
          Both rounds give the same scope: x-labels of proper (relation-free, injective) rank <= 3 log-GAP half-boxes;
          44 of 45 cells, with b20-r3-n4096 not assessed; pair-sum (h = 2) only; the 5% tolerance and not exact
          random-set behaviour; toy, with no transfer. EV-PFDR-28183c's per-cell bound x_c is a strictly narrower
          statement inside EV-PFDR-07d608's band statement. It is not a contradiction.
      - id: CC-3
        what: corrections and refused wording
        text: >-
          Both rounds find that the specification's flag-power sentence is wrong: about 0.50, not above 0.95, at a
          true 10% excess. Both find that O-NULL is protected because a true 10% departure reads intermediate. Both
          refuse the decision_impact sentences "scoped closure of label-describable ... bases" and "KN-OPEN-020 ...
          not opened by a label predicate" (EV-PFDR-28183c F1, F2; DEC-20261029-01405d rulings.decision_impact_wording).
          Both keep KN-OPEN-020 open, and both leave IDEA-20261017-bbc53e untested.
      - id: CC-4
        what: unexpected observations
        text: >-
          Both rounds report the cell-level over-dispersion of z (sum of z^2 71.4 on 44), the same six cells with
          |z| > 2 whose intervals exclude 1, and zero duplicate skips in ok jobs against a model expecting some.
    adds_beyond_first_round:
      note: Each item was checked against the other round's records, not assumed.
      items:
        - id: AD-1
          text: >-
            Label-describable null controls run as objects: PTM-4a (uniform subsets of L, inside the Legendre
            predicate) and PTM-4c (inverse-interval sets, a polynomial-time label predicate) read null at 8/8 cells.
            The first round made the observation-fiber point by argument (red team ff0453 lines 258-284) and built no
            such object. Its proves-too-much objects were the plant, the invalid cell, real-curve or asymptotic
            sentences, and the A/A arm.
        - id: AD-2
          text: >-
            Sensitivity objects at the decision boundary: PTM-2 at 1.10 and 1.15 (25/64 and 16/16 flagged), PTM-3
            deficit sets (6/6 flagged; the counting floor 0.912 makes a 10% deficit impossible at b20-r2-n4096), and
            PTM-5 interval sets (16/16). The first round's flag-power figure (0.50) is analytic. AD-2 confirms it
            empirically and adds the deficit-side vacuity.
        - id: AD-3
          text: >-
            The replication and O-STRUCT path exercised on known-false objects: PTM-1 routes the plant through the
            even/odd pseudo-replication and reaches O-STRUCT in both the reviewer classifier and the producer's
            analyze_records. The first round flagged the plant 44/44 but did not route it through replication.
        - id: AD-4
          text: >-
            Per-cell exclusion bounds x_c (max 0.0743; <= 0.0052 at n >= 2048; <= 0.0012 at n = 4096) and absolute
            per-set excess bounds (0.194 coincidences per set at b28 n = 256). The first round reports the band, the
            maxima of |kappa - 1| and an MDE of 0.079 in the weakest cell (rt_ap_bound). The two are consistent.
        - id: AD-5
          text: >-
            A 1536-combination ambiguity cross-product in the blind re-derivation (J1), with no change in any
            combination. The first round's blind task tried named alternatives (blind e5fe6b, about 10 entries) and
            ran no cross-product.
        - id: AD-6
          text: >-
            Measurement-fidelity breadth: PARI ellcard certification of all 1580 main-curve orders, plus exhaustive
            point counts on 12 curves; a recount of 33 jobs by disjoint code, 27 of them with n >= 1024; and 31
            adversarial kernel cases including p near 2^31 and wrap-around sums. The first round checked N.P_i = O
            on 19 jobs and recounted 15 ok jobs (10 with n >= 1024) plus 4 degenerate jobs (838 fields).
        - id: AD-7
          text: >-
            The citation-pointer correction RC-2: the recalled Ahmadi-Shparlinski 2010 pointer is not the source of
            the p^(1/2) range. The first round lists the pointer as recalled and not load-bearing without examining
            its content.
        - id: AD-8
          text: >-
            A degenerate-count excess: 4 degenerate curves in b20-r3-n4096 against 0.73 to 0.89 expected (Poisson
            tail about 0.01). The first round reports the shortfall of ok-with-skips (0 against 2.7 to 3.2 expected)
            but not the cell's degenerate excess.
        - id: AD-9
          text: >-
            A second exact 3.11 replay at a different patch level (3.11.17), byte-identical. This is evidence that
            the outputs do not depend on the 3.11 patch level, and an input to DEC-20261029-01405d NA-6
            (citability rescope).
