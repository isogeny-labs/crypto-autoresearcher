  # ---------------------------------------------------------------------------
  rulings:
    - id: R-1
      title: validity and the scoped claim
      text: >-
        Validity holds by both rounds independently. The statement supported is EV-PFDR-28183c largest_claim_justified.
        It is EV-PFDR-07d608 scoped_claim with a per-cell equivalence bound x_c, and with the label-predicate
        limitation demonstrated on objects (AD-1) rather than argued. The two claims agree, and neither is broadened.
    - id: R-2
      title: strength -- preliminary, not strong
      text: >-
        docs/evidence-and-reproducibility.md orders the levels anecdotal, preliminary, replicated, strong.
        "Replicated" requires that "the effect was reproduced from a clean run". Here the effect rests on one census
        (RUN-PFDR-4d8c71, one main seed block). Every reproduction in either round re-reads that census: replays,
        recounts and blind re-derivations reproduce the analysis, not the effect from a clean run. EV-PFDR-07d608
        itself says "not replicated: no fresh-curve census".

        Grading strong while that lower rung is unmet skips it. This program's precedent EV-PFDR-f6b76c graded a
        larger single run set (5100 curves per rung) preliminary. Its words were "not 'replicated': one producer
        session, one engine, one run set. It is not 'strong': the scale is toy ... and one null-control criterion is
        uninformative at this design". The same conditions hold here, and EV-PFDR-07d608 discloses them itself:
        - toy scale;
        - one run set;
        - a weak calibration gate (L4) and a flag rule whose stated power was wrong;
        - an unexplained over-dispersion that limits "stable effect" to the 5% band.

        The grade consistent with the hierarchy and the precedent is preliminary. This ruling rests on EV-PFDR-07d608's
        own stated facts and the shared hierarchy. It does not rest on this round's pre-committed mapping or on the
        custody of this round's reports. Conflict disclosed: this Coordinator composed the other round's sibling.
        The ruling can be contested by a new record.
    - id: R-3
      title: decision mapping and status -- no transition
      text: >-
        Had this round stood alone, its pre-committed mapping would have recorded H-PFDR-727bfc at analyzed, not
        supported: a general power shortfall leads to refine. That branch is this round's own rule, and the other round
        never adopted it. Its premise was that a power shortfall lets a +-10% departure hide in a null. Both rounds now
        show the premise false (P(read null | +-10%) <= 0.0033 per cell here; "a true 10% excess reads intermediate"
        there).

        Reversing a valid, independently reviewed and published support by the composition rule of a round that knew
        nothing of the other round would let a local procedural rule override a substantively agreed result. This
        decision does not do that. It concurs with support of the scoped claim and records that its own mapping, taken
        alone, would have given analyzed (PD-C7). Support with preliminary evidence is admissible: no rule ties a
        hypothesis's supported status to strength strong (H-SEMBIN-97ea23, supported on "moderate"). status_transitions
        is therefore empty.
    - id: R-4
      title: consequence for KN-FIND-c81e5b
      text: >-
        knowledge/README.md admits a KN-FIND only from evidence of strength replicated or strong. With R-2, the
        promotion basis of KN-FIND-c81e5b is unmet. Its content is correct, narrowly scoped and consistent with
        EV-PFDR-28183c: it disclaims label-describability, keeps KN-OPEN-020 open and states one run set. So no wording
        weaken is required.

        The entry is not edited and not withdrawn. CORR-B records that its basis is preliminary, pending replication,
        and that until a fresh-block replication of the full grid composes it is cited only with that disclosure. A
        replication reading O-NULL regularizes the basis (replicated). A non-null replication leads to supersession by
        a new record. AD-1 is added there as a supplementary control for the entry's "not a closure of
        label-describable" limitation.
    - id: R-5
      title: rule 12
      text: >-
        Not engaged. No breakthrough is claimed and no lane or direction closes. No established evidence is
        contradicted: the two rounds agree on every measured value, validity, scope and correction ("contradictory" in
        the hierarchy means valid experiments materially disagree, and these are two reviews of one experiment that
        agree on its data). The disagreement is an assessment, a strength grade, made by the role that assigns it. It
        does not require review-breakthrough at max.
    - id: R-6
      title: corrections carried
      text: >-
        RC-1 (flag-power sentence) and RC-2 (citation pointer) stand in EV-PFDR-28183c. RC-1 is the correction that
        DEC-20261029-01405d NA-7 plans for the power sentence, so that NA-7 item may cite RC-1 instead of minting a
        duplicate. F1 to F6 stand as not supported. F1 and F2 coincide with DEC-20261029-01405d's refused wording.
    - id: R-7
      title: custody
      text: >-
        The independence checker still fails on the committed batch, on the J1 sources_read format only (PD-C1). This
        decision makes no status transition, and R-2 does not depend on this round's reports, so the TASK-20261029-d7284b
        gate (no official transition on a FAIL) is honoured trivially. CORR-A and CORR-B take effect when committed by
        their own archive. HT-1 and held-hypothesis-edit.patch are moot: the hypothesis file on main carries
        DEC-20261029-01405d's edit, and this decision does not touch it.

