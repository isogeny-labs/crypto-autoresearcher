    against_DEC-20261029-9bc3ff:
      SF-1: >-
        Met. Controls CON-1 and CON-2 are relabelled arithmetic_consistency
        (spec lines 101-120). CON-3 replaces the duplicate count with an
        enumeration: run.py bsgs_max_lookups (lines 100-113) tries every
        target, independent of probes = r/(A*states) (lines 91-92). There
        are two planted negatives that must move the ratio off 925/4:
        NEG-1 c_probe 371 -> 1855/8, and NEG-2 precomputation_steps 10 ->
        185/42 (spec lines 132-154). The runbook asserts both with
        matches_preregistered false (runbook.yaml lines 440-479). The
        Coordinator checked the arithmetic: 370*2100*10/(21*40*40) = 925/4,
        371*21000/33600 = 1855/8, and at (1000, 2) with 10 precomputation
        steps, 18500/(105*40) = 185/42.
      SF-2: >-
        Met. The runbook summarises price_ratio_num, price_ratio_den,
        ratios_agree, all_match_bsgs, matches_preregistered and
        elapsed_seconds (runbook.yaml lines 512-562). The success criterion
        is asserted on the primary trial (925, 4, ratios_agree true,
        all_match_bsgs true; lines 178-274). The cells are bound in
        spec_bindings (lines 46-63) and asserted per cell.
      SF-3: >-
        Met. The online time model, the reading of the factor 10 as bl_den,
        and precomputation_steps 525 are stated (spec lines 65-91) and bound
        (runbook.yaml lines 43-45).
      SF-4: >-
        Met. run.py emits attack_claimed False (lines 269, 351). The runbook
        asserts /attack_claimed false in raw-result.json and
        /run/attack_claimed false in manifest.yaml (runbook.yaml lines
        140-141, 171-172).
      criteria_unchanged: >-
        The success and falsification criteria are version 1's, verbatim
        (spec lines 298-305). The preregistered integers come from version 1
        (lines 198-212). The invalid unit's values are disclosed under
        data_seen and are not an observation (lines 218-224).
    controls_metrics_budget_stopping: >-
        Complete: controls CON-1 to CON-3 and NEG-1/NEG-2; primary and
        secondary metrics; budget maximum_runs 6, 60 s per run, 1 GB;
        stopping rule of six trials, one run each; invalidation rules;
        distinct decision_impact; and required_artifacts for six run ids.
        The probe's structural checks also passed on these bytes.
    new_session: >-
        RBS-ICPERF-8cdc92 (spec line 338, runbook binding line 71). Its
        predecessor is RBS-ICPERF-b7e41c, which is terminal and spliced
        (DEC-20261029-9bc3ff).
    version_1_not_runnable: >-
        The v2 specification declares supersedes: EXP-ICPERF-e467a5 (spec
        line 13). tools/newest_experiments.py newest_runnable() drops every
        id named by a supersedes field (lines 205-212, 286). So
        EXP-ICPERF-e467a5 is never selectable. A direct /run of it is
        forbidden by DEC-20261029-9bc3ff NA-5 and would hit the terminal
        session.
    tool_repairs_from_9bc3ff: >-
        The returns of TASK-20261029-1bcf80 (session-id collision and audit
        tolerance in tools/runbook.py) and TASK-20261029-583a07
        (session-file merge-hygiene guard) are present on main at
        coordination/tasks/<TASK>/return.yaml. The Coordinator read their
        headers only.

