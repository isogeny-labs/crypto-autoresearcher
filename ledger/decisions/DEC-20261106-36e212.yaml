  limitations:
    - >-
      The Coordinator saw the director's impediments only as a summary relayed
      by the top-level session. A director finding not in that summary is not
      ruled on here.
    - >-
      The lane census is of the working tree. Lane files on other refs were not
      read. RUL-1 is conditional on the all-refs listing the top-level session
      runs first.
    - >-
      The machine figures (4 CPUs, 15 GB RAM, about 9 GB free disk) were
      relayed. No virtual-to-resident ratio of the largest units has been
      measured, so 32768 MB is a proposal that has not been tested at scale.
    - >-
      No hash is computed or asserted in this record. The trial-plan, runbook,
      specification, protocol and queue hashes exist only after the order of
      operations is executed. The handoff TASK-20261106-9da2e3 carries two
      marked tokens that the top-level session replaces from the final plan.
    - >-
      Two archive task ids (the design archive that carries the lane files and
      the goal-head edit, and the approval archive) were not pre-allocated.
      The Coordinator minted none; the top-level session allocates them.
    - >-
      The goal head open_batches edit (BATCH-e0a0c1 to closed, BATCH-501c2f
      added) and the specification and protocol edits are not in this task's
      write scope; they are specified in the design notes for the session that
      carries the design archive.
    - >-
      The collision search, the measured timings for the revision 2 additions,
      and the director's regeneration are not done. This record does not
      pre-judge them.
