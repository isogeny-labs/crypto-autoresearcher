  rationale:
    - >-
      The cap is a count of lanes tied to machine headroom, and the Coordinator
      may not raise it without the user. A finished lane that nobody closed is
      a record gap, and closing it by its own recorded facts is the repository's
      route (close-lane exists to "record that a lane's ledger archive
      landed"). It frees the slot without admitting any extra work.
    - >-
      The memory ruling keeps the real cap exactly where the specification put
      it and supplies the number the supervisor forces on the plan, rather than
      leaving the plan unapprovable or hiding RLIMIT_AS in a mechanical default.
      A loose ceiling above the resident cap is the least faithful-to-the-letter
      and the most faithful-to-the-intent option available, and the deviation is
      declared before the freeze.
    - >-
      Accepting replay-exempt for pass 1 without a condition would let a
      mechanical-tier session's "all contained" stand on tool-written but
      unreplayed records. The hard condition on interpretation keeps the
      exemption from becoming evidence.
    - >-
      Freezing the protocol first is the only order in which the argv, the run
      ids, the wdag nonce and the plan hash are final; any other order produces
      a plan that must be regenerated after approval, which approval forbids.
