    director's impediments. Completeness against AGENTS.md "Approval is bounded
    by execution" is the approval decision's to check, on the probe report and
    the regenerated bytes. The contract is a counterexample search against a
    published conditional assumption (Nagao 2015/984 Assumption 1 as the
    operational "degree 4 suffices"), with the independent certificate checker
    as its heuristic-validation companion; it is not a complexity claim and
    none of the promotion gates for an asymptotic claim is in play.

