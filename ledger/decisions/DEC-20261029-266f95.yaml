  rationale:
  - Coordinator compared the frozen producer package with the sealed pre-code derivation and actual permitted source
    review. Seven joints agree and hold; the software execution component remains inconclusive in the independent
    review.
  - The unchanged native independence checker passed the sole actual attestation. Its parsed receipt and raw-source
    hash are retained in review-inputs.json; all producer, review and software-receipt source hashes match.
  - The root-observed 18 fixed correctness test passes are separately recorded observations, not independent execution
    replication or scientific samples.
  - The result supplies a complete and explicitly costed one-domain reference while preventing monomial inventory
    from being mistaken for necessary solver work.
  scoped_claim:
    count_scope: Even s>=2, p>max(3,s), nonzero original weights, two disjoint s-bit coordinate blocks, nonsingular
      short Weierstrass curve and finite rational target with t!=0, using the exact raw generator lists accepted
      in DEC-20261029-0857a9.
    local_hilbert_series:
    - (1+T)^(2s)
    - (1+3T)^s
    local_prefixes:
    - C_bit(D)=sum_{j=0}^{min(D,2s)} binom(2s,j)
    - C_group(D)=sum_{j=0}^{min(D,s)} binom(s,j)*3^j
    paired_cutoffs:
      preceding:
      - 3s/2
      - s
      regularity:
      - 3s/2+1
      - s+1
      mutant_cap:
      - 3s/2+2
      - s+2
    exact_comparison: 'At each paired cutoff: 4^s/2<=C_bit<=C_group=4^s. Strict at preceding degree for all even
      s>=2, at regularity for even s>=4, and at mutant cap for even s>=6; the remaining small cases are equal.'
    ambient_capacities: A_bit(D)=binom(2s+D,D), A_group(D)=binom(3s+D,D), distinct from local counts and actual
      solver rows/columns/pivots.
    algorithm_scope: Any mathematically prime p>3, nonsingular E:y^2=x^3+a*x+b, finite R=(r,t) on E with t!=0, and
      duplicate-free finite affine coordinate domains D1,D2, including overlapping domains. The API supplies no
      primality proof.
    algorithm: Enumerate all rational lifts over D1 and test Q=R-P against D2, retaining finite complements. All
      mode outputs the complete ordered projected set and witnesses; K<=2|D1|-1_{r in D1}. First mode always declares
      completeness false.
    completeness_identity: 'With h=x-r,c=-r*x-2r^2-a: S3=h^2*z^2+(2*h*c-4*t^2)*z+c^2-4*t^2*(x+r), discriminant=16*t^2*(x^3+a*x+b);
      h=0 has the unique linear root x(2R).'
    checker: Independent source imports no producer helpers. One lift record per D1 coordinate, checked roots/signs
      or nonzero w with w^2=Z*f(x), global Euler-certified nonsquare Z, all second roots, D2 filter, complete projected-set
      equality and division-free point-sum checks.
    producer_cost: T_setup+O(B1*(E(p)+S_actual(p)+G(p)+M(D2)+1))+O(K log(K+1)) comparisons+certificate/output construction
      and serialization. S_actual includes every actual per-call root initialization and verification; nonsquare
      rows also require a root.
    checker_cost: T_check_setup+E(p)+O(B1*(I(p)+M(D2)+1))+O(K log(K+1)) comparisons+O(K) field operations for division-free
      witnesses+certificate/input reading; no new square-root extraction.
    cost_qualifications: Prime premise or separate certification, input bit lengths, deterministic nonsquare probes,
      reuse assumptions, hash expected-cost assumptions, storage and bit arithmetic remain explicit. No measured
      or combined-cost improvement is asserted.
  proof_status: derivation
  evidence_strength: one_independent_precode_derivation_and_source_audit_with_separate_producer_software_receipt
  claim_tier: scoped_conditional_algorithm_and_symbolic_accounting
