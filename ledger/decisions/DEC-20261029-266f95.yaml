      coordinator_assessment: Costs include every deterministic nonsquare probe, twisted-root production, actual
        per-call Tonelli-Shanks initialization, domain setup, memberships, retained output, sorting and independent
        checking.
    mode_and_software_scope:
      reviewer_verdict: inconclusive
      coordinator_assessment: First/all semantics hold by source audit. Reviewer execution integrity remains inconclusive
        because no tests were run or receipts read. The separate root receipt records 18 fixed tests passing; coverage
        gaps remain.
    decision_boundary:
