coordinator_decision:
  id: DEC-20261031-e3ee70
  recorded_at: '2026-10-31'
  decided_by: coordinator
  goal_id: GOAL-PEXT-4a1d6b
  mode: portfolio
  kind: prospective_execution_binding_reconciliation
  decision: revise
  target_ids:
  - GOAL-PEXT-4a1d6b
  - EXP-PEXT-212d5c
  - H-PEXT-d536a1
  - TASK-20261024-672126
  - BATCH-21339c
  context: The supervisor refused both trials launched on 2026-10-29 (regression RUN-PEXT-fccfb9, lean RUN-PEXT-af1b2a)
    because the driver run.py recorded run.code.command with an absolute interpreter path that cannot equal the
    plan's bare python3 argv. Both refusals precede any validated output; the two run directories are immutable
    records and the frozen plan reuses their run ids. The user authorised amending and re-running on a different
    host.
  decision_scope: Prepare and adopt only the command-recording fix in run.py and the reassignment of two run ids
    with the dependent plan, queue and handoff hash rebinding described by the additive amendment. Retain
    DEC-20261024-992998 as scientific approval and DEC-20261026-8a6d90 as the prior rebinding. No new experiment
    is approved, no trial is launched, and no hypothesis or goal scientific status changes. This decision becomes
    official only after verified archive and publication.
  authorization: AGENTS.md standing authorization; explicit user instruction to amend, then re-run EXP-PEXT-212d5c
    on a different host. The re-run itself is a separate Executor step.
  amendment_ref: experiments/EXP-PEXT-212d5c/amendments/AMD-EXP-PEXT-212d5c-20261031-command-recording.yaml
  base_main: b6be801213
  rationale:
  - One recording expression prevents the supervisor from accepting an otherwise valid driver manifest on any host,
    since sys.executable is an absolute, host-dependent path.
  - sys.orig_argv is the exact launched argv; its shlex.join is a form the supervisor already accepts.
  - A read-only replay of the supervisor's driver-fact check over the two refused manifests passes with the corrected
    command, so no second mismatch hides behind this one in those two trials.
  - Fresh run ids keep the refused-run records immutable.
  - The approved-unrun count does not grow; no additional scientific contract is created.
  sources_checked:
  - ref: experiments/EXP-PEXT-212d5c/reports/run-20261029T1410Z/report.md
    provenance: internal
    verified_by: Coordinator design lane reading the report and the two receipts
    claim: Cause and detail of the supervisor refusal; driver-reported values unvalidated.
  - ref: tools/experiment_execution.py
    provenance: internal
    verified_by: Coordinator design lane (_check_driver_facts, execute_trial)
    claim: Accepts run.code.command as json.dumps(argv), the list, or shlex.join(argv); launches the plan argv with
      the run directory substituted.
  - ref: ledger/decisions/DEC-20261026-8a6d90.yaml
    provenance: internal
    verified_by: Coordinator design lane
    claim: Procedural precedent for additive pre-run execution hash reconciliation.
  evidence_refs: []
  knowledge_promotion:
    promoted: []
    not_warranted: Technical execution-binding correction; no scientific evidence review or finding.
  limitations:
  - The fix is verified by a read-only replay and a launch probe, not by a trial run.
  - Executor serving-route admission (executor-implementation, no fallback) and the whole-ledger CI validation debt
    are outstanding and are not resolved or asserted by this decision.
  - The specification still lists the original run ids for regression and lean; the frozen plan, queue and handoff
    carry the new ids and the specification hash is unchanged.
  - The lean trial needs a Lean toolchain and the large regression files need disk or artifact storage on the new host.
  - The 2026-10-29 driver-reported values are unvalidated and not adopted.
  - No archival commit or publication has yet been verified for this prepared packet.
  problem_refs:
  - problems/full-ledger-validation-errors.md
  graph_update:
    checked: Operational correction only; no scientific knowledge-graph edge or finding changes.
    changes_required: false
  provenance:
    requested_policy: coordinator-orchestration-code
    runtime: Claude Code subagent (Coordinator design lane)
    actual_model_identity: claude-sonnet-5-5 as stated by the runtime; unverified by the repository
    preparation_only: true
  next_actions:
  - Publish and verify the correction through a Coordinator ledger archive task in a new lane (the 20261026 lane
    BATCH-2ece9f is closed); mint the task ids then.
  - After verified publication and executor-implementation admission, a separate Executor invokes /run EXP-PEXT-212d5c
    under TASK-20261024-672126 in open BATCH-21339c on a Lean-capable host with enough disk; do not execute here.
