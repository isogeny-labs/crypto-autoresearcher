# DEC-20261106-0c4c43 -- Coordinator record of the independence and attribution
# position of sheriff case SHF-20261106-a114e7 (findings SES-INDEP, LNX-3, LNX-5,
# SES-UNLINKED): how its findings are cited, who may merge PR #3071, and the
# commit-trailer rule for independent reviewers from 2026-11-06.
# Zero runs. No research status changes. No existing file is edited.
coordinator_decision:
  id: DEC-20261106-0c4c43
  id_provenance: >-
    Allocated by the top-level session with python3 tools/allocate_id.py --next
    coordinator_decision --date 20261106, then --check DEC-20261106-0c4c43: "OK:
    well-formed and free across the union" (48,138 identifier-bearing paths
    scanned), as reported by the top-level session. The Coordinator had no
    shell and minted no identifier.
  recorded_at: '2026-11-06'
  decided_at: '2026-11-06'
  decided_by: coordinator
  recorded_by: coordinator
  mode: integrity_remediation
  decision: record
  decision_label: >-
    Record the independence facts of sheriff case SHF-20261106-a114e7 and fix how
    it is cited. Its reader files are the primary evidence. Its reproducible
    findings stand on their artifacts. Its composed verdicts on the LNX claims,
    and its re-verdicts on fixes made by the producer, are reader-only until a
    session with no producer link re-composes them. PR #3071 is merged by a
    non-producing session or the owner. From 2026-11-06 an independent reviewer
    or audit session signs its commits with its own session trailer only.
  context: >-
    SHF-20261106-a114e7 is an independent re-audit of origin/main da442739db (and
    isogeny-labs/crypto 3a7a0f98a, isogeny-labs/cryptanalysis 5bdfb496d). It sits on
    branch claude/sheriff-reaudit-20261106 (PR #3071, unmerged, head
    ef52d97e641c17bbe5a6dd2c60a28b813fbbdacf). Its finding SES-INDEP (major, B9)
    and the lean reader's LNX-3 (major, B9) show that the session that
    commissioned it, and whose Claude-Session trailer is on its commits, produced
    many of the records it audits. This record states what that means for every
    later citation of the case. The case files are not in this checkout. They
    were read from byte copies the top-level session made with git show.
  target_ids:
    - SHF-20261106-a114e7
    - EV-ICPERF-08f6f9
    - DEC-20261105-8a9984
    - EV-ICPERF-84ff45
    - DEC-20261105-6e2616
    - CORR-20261106-243c4d
    - EV-PFDR-07d608
    - DEC-20261029-01405d
    - KN-FIND-c81e5b
    - CORR-20261029-1aaef6
  related_records:
    sheriff_case: >-
      SHF-20261106-a114e7 at research/sheriff/SHF-20261106-a114e7/findings.yaml on
      branch claude/sheriff-reaudit-20261106 (PR #3071, unmerged), head commit
      ef52d97e641c17bbe5a6dd2c60a28b813fbbdacf
    findings: [SES-INDEP, LNX-3, LNX-5, SES-UNLINKED]
    companion_decision: >-
      DEC-20261106-2f9a94 (LNX-2: ruling on the 2026-10-29 quotient-translation-descent
      review and the independent Lean review round it opens)
  session_provenance: >-
    Composed by a Coordinator subagent dispatched by top-level session
    https://claude.ai/code/session_01TCbLH7HXJioSw2Bzx7P9p9. That session produced
    none of the audited records: the top-level session reports that no commit on
    main carries its id. The work was commissioned by session
    session_016SURwTvgaQmnMnhpa1SLXQ, which produced many of the audited records
    (see independence_facts). Model, as stated by the top-level session:
    claude-opus-5-5. The Coordinator had no shell. Every git fact below was
    verified by the top-level session and is cited as such, or is cited as the
    case's own statement where marked.

  independence_facts:
    audit_session: >-
      The case was run in session_01TCbLH84PotMkHyFGFE4ifE (case header
      audit_session; REPORT.md "Independence"). According to the case, no commit
      on any audited main carries that id. That session produced nothing under audit.
    commissioning_session: >-
      session_016SURwTvgaQmnMnhpa1SLXQ commissioned the case. It asked that the
      case's commits carry its Claude-Session trailer and that it merge the PR
      (case header commissioning_session; SES-INDEP; REPORT.md "Independence").
    records_produced_by_the_commissioner:
      verified_by_top_level_session_in_git:
        - "EV-ICPERF-08f6f9 and EV-ICPERF-84ff45: added in 714ebc4565, which carries Claude-Session session_016SURwTvgaQmnMnhpa1SLXQ"
        - "EV-PFDR-07d608, DEC-20261029-01405d and KN-FIND-c81e5b: added in d3942d9261, same trailer"
        - "CORR-20261106-243c4d: added in c9cdb19c25, same trailer"
        - >-
          Lean theorem commits for formal/CryptoResearch/Quotient/TranslationDescent.lean:
          418825c73d (2026-10-16) and c62fb626ab (2026-10-23, the #2496 rename); the
          #2670 review commit fcee5a4487 (2026-10-29); the note corrections 1f3c063cae
          and 1f96ad0ba1 (2026-10-17). Every one carries the same trailer.
      stated_by_the_case_not_reverified_here:
        - >-
          DEC-20261105-8a9984 and DEC-20261105-6e2616 (the ICPERF evidence-review
          decisions), the ICPERF v2 approvals and lane, #3059 and
          CORR-20261029-1aaef6. SES-INDEP and REPORT.md attribute these to the
          commissioner, and the case counts 91 commits on main by it. The top-level
          session's git check did not list these ids, so their attribution rests on
          the case.
    case_commit_trailers: >-
      Verified by the top-level session. Case commits db4592579a and 22ad076fcd carry
      only Claude-Session session_016SURwTvgaQmnMnhpa1SLXQ. The final case commit
      80b60a75a3 carries "Audit-Session: .../session_01TCbLH84PotMkHyFGFE4ifE (this
      case was run in this session; the Claude-Session trailer below names the
      commissioning session, as requested)" and also the commissioner's Claude-Session
      trailer. So the trailer the case carries names the producer of much of what
      it audits.
    identifier_limit: >-
      A Claude-Session URL is the only session identifier on record. Whether one URL
      maps to one model context is not established. A shared URL does not prove a
      shared context, and distinct URLs would not prove isolation (readers/lean.yaml
      limitations). This record therefore narrows how the case is read. It does not
      void the case.
    skill_refusal_condition: >-
      The sheriff skill refuses when the auditing session produced the result. That
      condition is not met: the auditing session produced nothing in scope. What
      fails is narrower. The commissioner, trailer-holder and intended merger is the
      producer (SES-INDEP).

  citation_rule:
    form: >-
      Cite this case's findings and verdicts on ICPERF, PFDR and Lean (#2496/#2670)
      records as "an audit run in a non-producing session but commissioned (and
      trailer-attributed) by the producer of the audited records".
    primary_evidence: >-
      The reader files (research/sheriff/SHF-20261106-a114e7/readers/*.yaml) and
      their scripts and outputs are the primary evidence. findings.yaml and REPORT.md
      are a composition of them (REPORT.md says findings.yaml is composed by
      scripts/compose.py from the eight reader files plus scripts/session.yaml).
    reproducible_findings: >-
      A finding that is a reproducible fact stands on its artifacts, whoever
      commissioned the audit. Examples are git metadata (trailers, merge order,
      ancestry), sha256 bindings, and recomputations with committed scripts (for
      example scripts/readers/icperf-interpretation/rederive_price_ratio.out.json,
      scripts/readers/lean/fidelity.out, ptm_fail.out, ptm_refute.out,
      blind_descent.out). Rerunning the committed command is the check.
    reader_only_verdicts: >-
      Read the following as reader-only (research/sheriff/SHF-20261106-a114e7/readers/lean.yaml,
      a fresh validator context), not as independently session-composed. They stay
      reader-only until a session with no producer link re-composes them:
      (1) the case's composed verdicts on the LNX claims C-LNX-1, C-LNX-2, C-LNX-5a,
      C-LNX-5b, C-LNX-6 and C-LNX-7 (the claims LNX-3 lists); (2) its prior-finding
      re-verdicts on fixes the producer made: L1, L2, L-N8, L-N9 and LN9-R.
    direction_asymmetry: >-
      This does not weaken adverse findings against the producer. When a
      producer-commissioned audit finds defects in the producer's records, the
      conflict does not run in the producer's favour. Examples are LNX-1, LNX-2,
      SES-INDEP itself, and the ICR/ICV findings on ICPERF records. Exculpatory
      verdicts on the producer's own fixes ("fixed", "holds", "upheld_scoped") carry
      the narrower reading above. No verdict is reversed by this record. Only the
      weight it carries is stated.
    lnx5_coverage: >-
      LNX-5 (minor, B3). The case sweep did not scan isogeny-labs/crypto research/
      or tools/, because the sparse cone excluded them. Lean under crypto research/
      and tools/ is therefore not_covered by the case, apart from the lean reader's
      text scan with git show of the TreeSplit and conductor_gap Lean files
      (scripts/readers/lean/crypto_text_scan.txt). That scan found nothing new. Other
      crypto research/*/lean projects are unswept. No citation of this case may say
      it swept crypto research/ or tools/ Lean.
    ses_unlinked: >-
      SES-UNLINKED (minor, B9). A reader suggested overclaimed or unsupported for a
      claim without linking a finding, and the reason is only in that reader's claim
      text and checks. The case does not name the claim in the finding. No record
      action is possible here beyond this pointer. A reader of the case who relies on
      any claim verdict must read the reader file that carries it
      (research/sheriff/SHF-20261106-a114e7/readers/*.yaml, claims[].suggested_verdict
      and checks), not only findings.yaml.

  merge_rule: >-
    PR #3071 (branch claude/sheriff-reaudit-20261106, head ef52d97e64) must be
    merged by a session that produced none of the audited records, or by the
    owner. It must not be merged by session_016SURwTvgaQmnMnhpa1SLXQ. A merge is a
    git operation and confers no review. Merging the case adds nothing to the
    standing of its verdicts beyond what citation_rule states.

  forward_rule:
    effective: >-
      Commits made from 2026-11-06 onward, after this decision is recorded. Commits
      that predate it, including the case's own, are not re-judged. They are read
      under citation_rule.
    rule:
      - >-
        An independent reviewer, validator, red team, blind re-deriver, or sheriff
        or audit session signs its commits with its own session's trailer only: its
        own Claude-Session line. It never uses another session's trailer, whether
        the commissioner's or the producer's.
      - >-
        A commissioning session is named, if at all, in the record body (for example
        a commissioned_by field). It is never named in a commit trailer. An
        Audit-Session trailer alongside the commissioner's Claude-Session trailer, as
        on 80b60a75a3, does not comply.
      - >-
        Review and audit records carry the reviewer's own session id, and its model
        id where the runtime exposes it, in the record body.
      - >-
        A review whose commits carry a producer's trailer is treated as not
        independent by its identifiers.
    supersedes_case_fix_text: >-
      SES-INDEP's FIX says "Commits from 2026-11-06 carry an Audit-Session trailer
      naming the auditing session". For independent review and audit work, the rule
      above replaces that practice from its effective date.

  own_position: >-
    These remediation records (DEC-20261106-0c4c43, DEC-20261106-2f9a94 and the
    three handoffs under
    coordination/formal-reviews/quotient-translation-descent-20261106/) were composed
    in session_01TCbLH7HXJioSw2Bzx7P9p9, which produced none of the audited records.
    They were commissioned by session_016SURwTvgaQmnMnhpa1SLXQ, which will merge this
    PR. The top-level session declares that this PR's commits carry only
    session_01TCbLH7HXJioSw2Bzx7P9p9's trailer. That can be checked on the PR's
    commits; it was not observable when this record was written. A merge by the
    commissioner is a git operation, and the rulings here rest on the composing
    session. The owner or a non-producing session is recommended, not required, to
    merge this PR as well, as for #3071.

  rationale:
    - >-
      AGENTS.md "Review architecture" and lean-review.md section 5 tie a review's
      standing to independence that can be checked. The only identifier on record is
      the Claude-Session trailer, and it names the producer on the case's commits.
      That puts the case's own composition on the producer's side of the identifier
      boundary, even though the work was done in a fresh session.
    - >-
      Removing the case entirely would discard reproducible artifacts and adverse
      findings that the commissioner link cannot have biased in the producer's
      favour. Reading every verdict as fully independent would rely on the very
      identifier LNX-3 shows to be compromised. The citation rule takes the narrowest
      reading consistent with the artifacts.
    - >-
      AGENTS.md core rule 4: records are immutable. The case, the audited records
      and the frozen review files are not edited. This record adds a reading; it
      changes no byte.
    - >-
      AGENTS.md core rule 9: facts verified by the top-level session are cited as
      such. Attributions resting only on the case are marked as the case's.
  evidence_refs:
