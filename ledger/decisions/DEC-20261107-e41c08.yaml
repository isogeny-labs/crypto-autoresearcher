  hypothesis_id: H-ICPERF-4cb536
  facts_reported:
    - "PR #3132 merged at 03:21:16Z, two minutes after it was opened, as main commit 0ea4ca81d0. The request to disable auto-merge was refused because the PR had already merged."
    - "On main, specification.yaml reads status approved, approved_by DEC-20261107-7802ec, execution_authorized true and frozen true. trial-plan.json reads approved_by DEC-20261107-7802ec. ledger/decisions/DEC-20261107-7802ec.yaml does not exist. Card lint and the preapproval packet fail. No run has been launched."
    - "The bytes on main: v3b f93e8858..., locate_results.sh efcc2983..., reconcile_run.sh eac18f21..., spec 097462e3..., plan 3f564ea2..., runbook 488ae3ac..., card -3. Crypto PR #3613 (ff781aa8b7) holds C1-AMENDMENT-2. The top-level session re-ran the fixtures: 113 pass, 0 fail, 4 skipped. The director reported 117 pass, 0 fail."

  procedure_deviations:
    - id: PD-2
      what: >-
        The c5a0f4 package reached ccf1699ed0 without its archive receipt (handoff D-8 and the
        one-isolated-commit rule were not met). The archive receipt names the author of ccf1699ed0.
    - id: PD-3
      what: >-
        PR #3132 auto-merged to main (0ea4ca81d0). That put an official approval state on main
        (specification status approved, execution_authorized true, plan approved_by) whose approver,
        DEC-20261107-7802ec, does not exist. It was an official transition from an uncommitted
        decision, and it was forbidden.
      cause: >-
        The director wrote the approved forms at the canonical paths (B-CANONICAL-SPEC-STATE). The
        Coordinator's handoff c5a0f4 allowed that by declaring the canonical paths. Auto-merge then
        landed the PR before any hold could take effect. The Coordinator's handoff design is a cause.
      impact: >-
        None on execution. No run was launched. Card lint and the preapproval probe refused the state.
        RBS-ICPERF-616277 cannot run, because the runbook needs a committed decision that names its
        sha256. It is a record-integrity defect, not evidence.
      never_again: >-
        A design handoff that produces approved forms declares them as previews outside the canonical
        specification and plan paths. A PR that carries an approved form is not given auto-merge
        until its approval decision is in the same PR.

  rulings:
    - id: 1
      text: >-
        Assign TASK-20261107-9d2b6a (role red-team, independent session, zero runs, zero AWS calls).
        It covers questions (a) to (c) and B-FILED-BEFORE-AFFECTED-DATA as (d).
    - id: 2
      title: correction of record state (PD-3)
      text: >-
        In the canonical files:
          - specification.yaml goes back to status review_required, frozen true, approved_by null and
            execution_authorized false. frozen stays true: the bytes are the frozen design, and
            experiment_execution.load_plan candidate readiness requires an unapproved, frozen,
            review_required specification.
          - trial-plan.json becomes the candidate form: approval_required true, approved_by null,
            candidate_only true, and specification_sha256 set to the sha256 of the corrected
            specification.yaml.
        The approved forms are preserved byte-exact from 0ea4ca81d0 as
        experiments/EXP-ICPERF-127dbd/design/approval-preview/specification.yaml (097462e3...) and
        trial-plan.json (3f564ea2...). The runbook header already states that its bound digests are
        the preview bytes the approval archive swaps in. So runbook.yaml (488ae3ac...), its binds and
        spec_bindings, card -3 and runbook-lint.txt are NOT changed. The approval archive for
        DEC-20261107-7802ec swaps the two previews back into the canonical paths, and refreshes the
        preapproval packet then. Until that swap, runbook.py lint reports the two bind mismatches.
        That is expected and blocks any relay.
    - id: 3
      title: commit order on claude/c1-approval-correction-20261107 (one PR)
      text: >-
        Three commits, in this order:
          - C1 (ledger): this decision, TASK-20261107-9d2b6a, the TASK-20261107-c5a0f4 edit and goal.yaml.
          - C2 (archive c5a0f4, alone): only its snapshot receipt and the archive fields. Its tree
            still holds the director's bytes, as at 0ea4ca81d0, so content_at_commit binds what the
            director produced. The receipt names 0ea4ca81d0 as the commit where the package landed,
            and records PD-2 and PD-3.
          - C3 (correction): specification.yaml, trial-plan.json and the two approval-preview files.
        Do not stage specification.yaml or trial-plan.json in C1 or C2. Enable auto-merge only after
        all three are pushed and validate_ledger passes on C3. A dispatcher refusal of C2 comes back
        here.
    - id: 4
      title: which commit the archive and the dispatch name
      text: >-
        The c5a0f4 archive does not name 0ea4ca81d0 as its commit_sha. That commit carries no receipt.
        archive.commit_sha is C2, and parent_sha is C1. The receipt cites 0ea4ca81d0 as the landing
        commit. The 9d2b6a dispatch waits until the correction PR has merged. It names the main merge
        commit of that PR (which contains C2), and 0ea4ca81d0 as the first main commit holding the
        reviewed bytes. The three script sha256 values must match at both commits. 9d2b6a archives
        on a new branch from origin/main through its own ready-for-review PR.
    - id: 5
      text: >-
        DEC-20261107-7802ec is not written or committed until all of these hold:
          - 9d2b6a's report is archived with no 'blocks approval' finding open;
          - B-CANONICAL-SPEC-STATE (resolved by ruling 2 except for the swap), B-IN-PLACE-REPLACEMENT,
            B-S1-COPY-CUSTODY and B-PARTIAL-OUTPUT-RESIDUAL are each ruled;
          - experiment_preapproval reports approvable: true;
          - after the approval archive, newest_experiments reports execution_state ready.
        A 'blocks approval' or 'fix before S2' finding goes back to the experiment-director as a new
        task.
    - id: 6
      text: >-
        The fixture counts differ (113 against 117). The 9d2b6a archive receipt records a full re-run
        with the checkout argument, which must give 117 pass, 0 fail. Any other count returns here.
    - id: 7
      text: "Crypto PR #3613 may merge. Filing the amendment before S2 data is lawful, subject to the answer to (d)."
