    - {path: experiments/EXP-ICPERF-127dbd/trial-plan.json, from: "approved_by DEC-20261107-7802ec", to: "candidate_only true, approval_required true, approved_by null", basis: PD-3}
  target_ids: [TASK-20261107-9d2b6a, TASK-20261107-c5a0f4, EXP-ICPERF-127dbd, GOAL-ICPERF-e6b6a4, BATCH-0e0902]
