  rationale:
    - "Approval state on main must follow a committed decision. Restoring the draft state and keeping the approved bytes as previews is the smallest correction, and it keeps every hash binding of the runbook and card intact."
    - "The archive binds what the producer produced, before the correction. The correction is its own visible commit."
    - "The locator decides which bytes become S1 evidence. So an adversary other than the author must attack it before approval (sabotage is assumed)."
  evidence_refs:
    - experiments/EXP-ICPERF-127dbd/runbook.yaml (header lines 1-3; binds lines 17-20)
    - tools/experiment_execution.py (load_plan, lines 113-152)
    - tools/research_dispatch.py (ARCHIVE_BINDING_MODES; archive verification)
    - experiments/EXP-ICPERF-127dbd/design/c5a0f4/FINDINGS.md (blockers)
  limitations:
