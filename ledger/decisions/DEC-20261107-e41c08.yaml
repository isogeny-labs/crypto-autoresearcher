    and edited the following:
      - ledger/handoffs/TASK-20261107-c5a0f4.yaml (the archive block and artifact_paths only);
      - goal.yaml next_action;
      - experiments/EXP-ICPERF-127dbd/specification.yaml (header lines 2-3; status, approved_by and
