  source: isogeny-labs/crypto research/ic_packed_filter_20261029/cards/RULING-P28-ADDENDUM-1.md (sha256 8bac4596f2b5df73b360b8ee9840ce7cea5ee006d9fcf058be44335d4c1b46da;
    transcribed from its Decision record section)
  supersedes_in_part: DEC-20261029-ced80a ruling d, condition D2 (replaced by D2prime)
  subject: XP-20261029-packed-filter RULING-P28 addendum 1 - D3 resolved, D2 judged on effective build timeout and replaced
    by D2', P32 prerequisites, seal kept
  context: 'P28-rho-r2 (launched 21:17:22Z) ended with result.json state failed exit 23 and job-exit.json exit 42 (pod 9f8f7676-...),
    WAIT_ROUTE RESULT_JSON_PRESENT; the original counted prefix still holds 0 keys. The CodeBuild project reports timeoutInMinutes
    70 (lastModified before every build), but all five builds of the study recorded 45, with no override in any start request;
    cause unknown, owner infrastructure. Owner questions of RULING-P28 (d) were relayed at about 20:45Z and are unanswered.

    '
  decision: revise
  rulings:
    A: 'D3 met: P28-rho-r2 is terminal by result.json, which card-launch-v2 Step 4 accepts for PREV_COUNTED_TAG=P28-rho-r2.
      It wrote job-exit.json, so it is not a host loss: B6 does not arise and it is never rerun. B5 is a classification
      rule applied at counted-analysis dispatch, not a launch-ordering condition, so it does not hold D3 open. Exit 23/42
      is read only by the counted exit-42 clause at analysis.'
    B: 'D2 is judged on the effective per-build timeout; on that reading it is unmet. The project field is a necessary,
      not a sufficient, check. Because run-request deletes no Job, a 45-min build costs supervision only, and card v2''s
      S3VERIFY route covers that case. D2 is replaced by D2'': (1) a P32 launcher timeout is infrastructure signal, classified
      by the job''s own files via W3/S3VERIFY, with the image digest disclosed as unverifiable unless the owner supplies
      pod status; (2) at P32, MAIN_SESSION before build endTime + 4,500 s is not a host loss: WAIT is re-dispatched after
      that time, then RULING-P28 B2-B6 apply with b=32; (3) the owner follow-up on the 70/45 discrepancy is sent; (4) the
      Step 6A and Step 9 lines are quoted in the launch log entry. No card v3: a post-launch fail-closed check cannot un-launch,
      and a pre-launch refusal would be a permanent hold. Step 6A stays as frozen. No AWS, launcher or stack change by any
      agent.'
    C: 'Also required before LAUNCH 32: E1 S3VERIFY b=28 PAIR TAG P28 POD_STATUS_SHA256 NONE with S3_TERMINAL=true (within
      the seal: identity files only, outcome files absent; anything else returns to the coordinator); E2 this addendum,
      the P28-rho-r2 receipts, s3verify-P28 and the session log committed and pushed, and the B4 timing confirmed (a late
      push is a disclosed deviation). D1 met; D4 unchanged (owner answers or the 24 h fallback from the recorded send time).
      Seal not lifted: it lifts only under RULING-P28 (a), decided at the P32 verdict. P28 counted analysis stays deferred;
      P32 does not wait for it.'
  target_ids:
  - XP-20261029-packed-filter
  rationale:
  - D3's text is satisfied by result.json; B5 concerns which counted session counts, and PROTOCOL §6.1 says a counted failure
    does not change the wall decision.
  - C4 chose 70 to cover run-request's 3,780 s wait; only the effective build timeout serves that purpose, and facts 1-3
    show the project field does not set it.
  - 'run-request lines 18-35, 46 and 54-65: a build timeout ends supervision but deletes no Job, so launcher-less S3 verification
    (RULING-P28 C2/C5/C6) is a complete route with one disclosed leg.'
  - A gate no agent can satisfy, on a cause nobody knows, would pause the goal indefinitely; D2' pre-registers the consequence
    before any P32 data instead.
  - Card v2 Step 4 cannot accept PREV_WALL_TAG=P28 without an S3VERIFY receipt, since P28 has no result.json.
  - Keeping the seal keeps every remaining P32 decision blind to the 28-bit wall data.
  evidence_refs:
  - research/ic_packed_filter_20261029/cards/RULING-P28.md (sha256 bff4e46df7b522f64c86a76631ae3088af7aa6f41a65e80cd1f9fadae8954275),
    (a), (b), (c), (d)
  - research/ic_packed_filter_20261029/cards/card-launch-v2.md (sha256 8fa7610fa63ae4043a55c17459167ee874ebcfde7616e332c42ebe6a048cd526),
    Step 4, 6A, 9, W3, Procedure S, Never retry
  - research/ic_packed_filter_20261029/P28/P28-HOSTLOSS.md
  - taskq/deploy/eks-karpenter/remote/run-request lines 18-35, 46, 54-65 (sha256 e9706cc6...2192)
  - backlog/XP-20261029-packed-filter/PROTOCOL.md section 6.1 "Counted session" (sha256 703bde26...7e51)
  - 'main-session receipts: CodeBuild project read (timeoutInMinutes 70, lastModified 1792725034); build.json/build-start.json
    of the five builds (45); start-request.json files; P28-rho-r2 result.json, job-exit.json and the W3 output'
  limitations:
  - All AWS and receipt facts are the main session's report; the coordinator opened no receipt, no P28 wall file and no
    counted record.
  - The source of the 45-minute build timeout is unknown; D2' rests on run-request deleting no Job on a timeout, and does
    not cover any owner-side mechanism that might do so.
  - Without pod status, the image-digest leg of verify-build stays unverified for any launcher-less P32 job, and for exit-23
    sessions it never ran.
  - The SIGTERM cause and the Job-deadline semantics remain unverified (D4 open).
  next_actions:
