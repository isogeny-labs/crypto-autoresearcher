  - 'Main session: dispatch S3VERIFY b=28 UNIT PAIR TAG P28 POD_STATUS_SHA256 NONE with card-launch-v2; archive s3verify-P28/;
    on S3_TERMINAL=false or a STOP, return the case to the coordinator.'
  - 'Main session: when D1, D2'', D3, E1, E2 and D4 hold (owner answers, or 24 h after the recorded send time), dispatch
    LAUNCH b=32 with PREV_WALL_TAG=P28 and PREV_COUNTED_TAG=P28-rho-r2; quote Step 6A and Step 9 in the log entry.'
  - 'Coordinator: at the P32 verdict decision, rule on a P28 successor protocol (lifts or keeps the seal); after that, P28
    counted analysis is dispatched with COUNTED as B5 decides.'
