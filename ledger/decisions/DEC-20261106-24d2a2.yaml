        disposition: >-
          SC-4: the approval act records the dfd0ed method and value, and cites the other as an
          alias with its method. 7db1de RR-1 recomputes both.
      - id: OBS-3
        text: The cell is single-threaded on a 4-core host (executor scope finding 2). Nothing is parallelised.
        disposition: >-
          No action in this round. A parallel or chunked cell needs a change to kernel.c or to
          the bound test file (see dev1_rerun_decision.checkpointability) and is option C of
          OQ-1.
      - id: OBS-4
        text: >-
          The upload token in the environment had expired. The RESUME push used the ambient AWS
          credentials, with the token variable unset for that call. No hook was bypassed.
        disposition: >-
          Noted. bc7a76 LD-6 requires scripts/checkpoint.sh gate to pass and a push to succeed
