      - id: OBS-5
        text: The harness cap is CG-1; it is recorded there.
        disposition: see CG-1
    scope_finding_accepted: >-
      SF-96fee7-1 is accepted as written: a cell of about 10.5 h cannot be a child of one harness
      background task, so it needs a detached or re-attached launcher, then a fresh task and a
      fresh budget.

  # ------------------------------------------------------------ 2. DEV-1 re-run
  dev1_rerun_decision:
    runs_again: >-
      Yes. It is exactly the cell of DEC-20261106-475620 dev1_decision_v2.cell, unchanged:
      tests/test_kat_extended.py at 79894702...06b5, all three items, KAT mode, non-contract, on
      the code bound in snapshot 5f6c092450. No smaller field, no subset of targets, no shrunk
      base and no substitute.
    binds_code_sha256: >-
      Yes: 5d5a607d59741b699065c02066d56a2883a34b44431da56c7bfd439b1f731464, with the per-file
      sha256 of dfd0ed sa6_code_binding and path_sha256. The re-run binds these bytes only if the
      hardening re-review (7db1de) requests no launcher change. If a fix changes any code/ byte,
      bc7a76 is void and the cell runs on the new bytes under a superseding card. Reason: the
      cell imports launcher, whose import-time code-tree check is part of what DEV-1 exercises
      (DEC-20261106-475620 dev1_decision_v2.placement (a)).
    checkpointability:
      finding: >-
        At the bound bytes the cell is atomic, and no checkpoint is possible without a code
        change. The cell item makes one call, counters.arm_c_cell, and arm_c_cell makes one
        kernel call, Kernel.run_sampled, which is one C call (krun_sampled). That call enumerates
        every C(B+2, 3) multiset of the base and returns only at the end. It exposes no
        intermediate state, takes no start or stop range, and takes no seed for a resumable
        split. Running the m = 3 kernel on prefix sub-bases is cumulative, not partitioning, so
        it ends by enumerating the full base anyway. Any other split (for example a target shift
        to m = 2 calls) tests a different kernel path from the one DEV-1 exists to test.
      basis: counters.py lines 259-272 (run_sampled) and 543-560 (arm_c_cell); tests/test_kat_extended.py lines 154-182. Read by this act.
      consequence: >-
        A container restart costs the whole attempt. Making the cell restartable or parallel
        means changing kernel.c (frozen; B7 reopens on any kernel or counting-loop change;
        excluded by DEC-20261106-475620 excluded_peripheral_work) or changing the bound test
        file. Either way it is no longer the unchanged cell the owner named. This act does NOT
        open that fix task. It is option C of OQ-1.
    launcher_design:
      authoritative_text: ledger/handoffs/TASK-20261107-bc7a76.yaml constraints LD-1 to LD-12
      summary:
        - LD-1 Bytes are re-verified for every attempt, with a before-record written BEFORE the projection (OBS-1) and an after-record written after any outcome.
        - LD-2 The command is exactly the 96fee7 DX-2 argv, built by the copy's launcher from the same isolation, with scratch paths only.
        - LD-3 The projection is repeated for every attempt: 1,200 s at most, go only at or below 39,600 s, otherwise stopped_projection with no retry.
        - LD-4 A supervisor script is kept as an artifact and run from scratch with its sha256 checked. It writes state.json, wraps the cell in a coreutils timeout at 41,400 s, writes a heartbeat line every 600 s (with the cell process's VmHWM, which yields a peak-RSS figure even on a kill), writes exit.json at child exit, and traps TERM, INT and HUP. It never restarts the cell itself.
        - LD-5 Launch is setsid nohup from one short foreground command, never a harness background task and never the harness timeout. The launch records the supervisor pid, its start time, the pgid, boot_id, the PID 1 start time and the uptime.
        - LD-6 RESUME is filled and pushed before every launch (scripts/checkpoint.sh gate must pass) and pushed again at every terminal classification.
        - LD-7 The state directory sits outside the repository, on a path that survives a container restart if one is known. Any session re-attaches from RESUME.md alone, by single read-only check-ins about every 60 minutes. There is no sleep loop and no background poll.
        - LD-8 Classification is mechanical, C1 to C8. Restart evidence is any of a changed boot_id, a changed PID 1 start time, or an uptime shorter than the time since launch.
        - LD-9 Retries follow only a classified container restart (C5), up to maximum_attempts, each from LD-1 with a fresh copy and a fresh projection. Each attempt has its own record.
        - LD-10 Collection writes the seven artifacts and keeps cumulative DEV-1 wall accounting, attempt 1 included.
        - LD-11 The host is idle during an attempt.
        - LD-12 Zero runs, KAT values never in messages, never Bedrock.
    restart_handling: >-
      A container restart during an attempt is stopped_infrastructure (container_restart) for
      that attempt. It is recorded in full and is never a KAT outcome. Only this sub-cause may be
      retried, and at most maximum_attempts attempts run in the card. Every other stop goes back
      to a fresh act without a retry: stopped_projection, watchdog, signalled, unexplained_kill,
      crash or OOM. An OOM kill is anomalous at the modelled need of about 0.4 GB. A cell that
      completes is never re-run for a different answer (mismatch is terminal). If every allowed
      attempt is lost to restarts, the outcome is stopped_infrastructure_retries_exhausted and a
      fresh act decides, with the owner where OQ-1 requires it.
    allowance_reading:
      question: Does the owner's grant cover a re-run, and further retries after a restart?
      reading: >-
        It is NOT presumed to. The owner must be asked (OQ-1). Reasons:
        (a) DEC-20261106-475620 encoded the grant as a budget for DEV-1: a 43,200 s task, within
            "about 10-12 h". Attempt 1 used about 2.5 h of it (task start about 23:05Z to kill
            detection about 01:32Z, dev1-report-96fee7.md). The rest cannot hold the cell.
        (b) One fresh attempt needs up to 42,600 s (1,200 s projection plus the 41,400 s
            watchdog), so DEV-1 would come to about 13 to 14.3 h in all. That is above the upper
            end of the grant. With up to two restart retries it could reach about 26 h.
        (c) docs/research-budget-policy.md charges failed attempts and retries to the same
            allowance, preserves cumulative charges, and requires explicit owner authorization
            for a larger allowance. That text binds cloud spending. It is not strictly about this
            local host, and this act applies it by analogy, because this owner set this cell's
            time explicitly.
        (d) ENV-2 is a material fact the owner did not have. The host restarts without warning,
            the cell cannot checkpoint, and so one attempt's chance of finishing is unknown and
            may be low. Spending more of the owner's time on this host, rather than on a host
            that survives restarts (ENV-4: none is configured), is the owner's call.
        This is not an experiment re-approval, which the standing authorization forbids asking
        for. Nothing is approved here. It is a question about the size of an owner-set resource
        grant. agents/coordinator.md says budget ESTIMATES never justify asking again; the
        owner's grant is not an estimate.
      what_proceeds_without_an_answer: >-
        Everything else. The ledger archive, the hardening re-review 7db1de and its snapshot
        971edf need no owner input and rank ahead of doing nothing: B8-H is decision-relevant
        and runnable now. Only bc7a76 waits (state blocked; impediment IMP-PATH-20261107-1).

  owner_questions:
    - id: OQ-1
      status: open
      to: owner (relayed verbatim by the top-level session; the answer is recorded by a committed Coordinator act, never by a message)
      text: >-
        DEV-1 is the F_{10007^2}, m = 3 check you granted about 10-12 h. Its first attempt was
        killed after about 2 h of cell time by a harness limit on background tasks. That was a
        launch error, not the code, and nothing about the kernel was learned. A fresh attempt on
        the same code needs about 10.5 h of cell time, up to about 11.8 h with its watchdog.
        Counting the first attempt, DEV-1 would use about 13-14 h, above the 12 h you granted.
        The container has also restarted without warning at least twice this session. A restart
        kills the cell, and the cell cannot checkpoint without changing frozen code. Which do you
        authorize?
        (A) Re-run here under a detached supervisor, with up to 2 attempts if restarts interrupt
            it: at most about 26 h of DEV-1 wall in all, or a lower cap you set.
        (B) A runner that survives restarts (for example cloud), with a dollar ceiling, CPU/RAM,
            deadline and retry allowance that you set. None is configured now.
        (C) A code change that makes the cell restartable or parallel. This reopens the kernel
            review, and the cell would no longer be byte-identical to the one you named.
        (D) Something else, or not now.
      coordinator_recommendation: >-
        (A) with at most 2 attempts. If both are lost to restarts, return with (B). (C) is not
        recommended: it changes the frozen kernel path that DEV-1 exists to test, and it adds a
        review round.
      on_each_answer:
        A: The releasing act records the answer and transitions bc7a76 from blocked to queued. It may lower maximum_attempts to 1 or set a cumulative cap. It writes the DEV-1 verification task and its snapshot (B8-D).
        A_lower_than_one_attempt: Treated as D.
        B: bc7a76 is cancelled. A superseding card adds a cloud launch under research-budget-policy (inputs pushed first, a finite dollar ceiling, CPU/RAM, an absolute deadline, a retry allowance) with LD-1 to LD-3 and LD-8 to LD-10 kept.
        C: bc7a76 is cancelled. A fix task with its own review is opened. B7 reopens, and DEV-1 is redefined by a recorded protocol amendment of the instrument plan, before any data.
        D: bc7a76 stays blocked. IMP-PATH-20261107-1 stands with its recheck. B1, and with it the approval, stays impeded, and is never downgraded to a limitation (owner direction of 2026-11-06).
      pd1_note: The question states budget and timing figures only. It states no KAT value, lemma value, formula or prior.

  # ------------------------------------------------------------ 3. placement of the re-review
  review_placement:
    decision: >-
      The hardening re-review runs FIRST, alone, on the dfd0ed commit, before any DEV-1 attempt.
      It never runs in parallel with a DEV-1 attempt. TASK-20261107-7db1de carries
      TASK-20261106-941825 RR-1 to RR-4 and RR-6 to RR-8 unchanged in substance. In place of
      RR-5 it has RR-5H, a check of the 96fee7 stop record only, and it adds RR-9, an advisory
      red-team of the bc7a76 launcher design. The DEV-1 joint (941825 RR-5, verbatim) moves to a
      DEV-1 verification task that the releasing act writes after the DEV-1 snapshot eebc5b.
    reasons:
      - >-
        R-P1 The 10.5 h cell must run on the final launcher bytes (placement (a)). If the
        re-review found a launcher defect after the cell, the fix would change code_sha256 and
        the cell would have to run again. Reviewing first spends about 6 h of review to protect
        about 11 h of cell. The order of 475620, cell before review, was right only while the
        cell was expected to finish inside one task.
      - >-
        R-P2 DEV-1 now waits on an owner answer of unknown latency. 941825 VP-2 required
        "DEV-1 outcome passed", so keeping it would idle the lane's only runnable work.
      - >-
        R-P3 RR-1 to RR-4 and RR-6 to RR-8 do not read the DEV-1 cell output. RR-5 reads only the
        DEV-1 record, so it can move without loss to a task that runs after the record exists.
      - >-
        R-P4 Not in parallel. The cell needs an otherwise idle host (DEC-20261106-475620
        placement (d); its full-pass rate feeds SC-3), and the re-review runs full suites and
        mutants on the same 4 cores. max_concurrent stays 1.
      - >-
        R-P5 RR-9 lets an independent reviewer attack the restart and re-attach design before
        11 h of compute depend on it, and costs little.
    rules_from_DEC-20261106-475620_that_still_bind:
      - Strictly one task at a time (max_concurrent 1); archives run alone among commit tasks.
      - DEV-1 runs on an otherwise idle host and on the bytes the approval will lock.
      - The cell is never shrunk, never substituted and never re-run for a different answer; a mismatch is recorded verbatim and B1 reopens.
      - The 941825 independence list, unchanged, plus the sessions of this act's producers.
      - Blindness is lifted only for the 165da2 code_review.md and the 7c2b01 fix_review.md. No attestation and no producer session is read.
      - The decisive evidence of batch.focus.decisive_evidence, every item, now across two reports.
      - SC-1, SC-2 and SC-3 for the approval act; V2-1 to V2-6; approval_records_v2_1.
      - PD-1 (no lemma value, formula, prediction value, KAT value, timing or prior in commit or PR text).
    b8_split:
      B8-H: >-
        Hardening part. It clears when TASK-20261107-971edf archives a TASK-20261107-7db1de
        report that finds every hardening must-fix closed and no new blocking finding: N-5 item
        5, NF-1 to NF-7 and the receipt clash, each by its RR item; M6, M5 and M3 killed by the
        reviewer's own runs; the plan byte-identical. The DEV-1 row there reads "not run (open)"
        and does not count against B8-H.
      B8-D: >-
        DEV-1 part. It clears when the DEV-1 verification task, which the releasing act writes
        with TASK-20261106-941825 RR-5 verbatim, confirms all of the following on the eebc5b
        commit: outcome passed, the cell run in full on the 5d5a607d bytes, and the reviewer's
        own kernel-free membership counts on at least 10 logged targets agreeing.
      B8: Clears when B8-H and B8-D have both cleared. The decisive evidence is unchanged; it is only divided between two reports.

  # ------------------------------------------------------------ 4. records and queue
  batch_choice:
    chosen: BATCH-c077fd (new batch)
    reason: >-
      BATCH-a8825c's queue is immutable except for archive blocks and tasks_state_revisions, so
      it cannot take new tasks. Its own chain also ends at afbe9b. The new tasks (the ledger
      archive of this act, the re-review and its snapshot, the DEV-1 re-attempt and its
      snapshot) need a queue. BATCH-a8825c is checkpointed and its lane closed after 58546f
      verifies. Its two unrun tasks are cancelled by tasks_state_revisions entries, which is the
      one change that queue allows.
