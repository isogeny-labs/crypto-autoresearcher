  visual_report:
    owed_by_this_act: true
    reason: >-
      A DEC that composes an infrastructure stop and changes the readiness-gate structure (B8
      split). research-visuals and AGENTS.md "Visual research record" cover failed and
      inconclusive work too. There is no evidence record and no status move, so the report is
