      - dev1-attempt-timeline.svg
      - queue-and-gates.svg
      - figures.py (draws both SVGs from figure-data.json)
      - figure-data.json (well under 64 KiB; every value names its source file and key, or this decision and its key)
      - .artifacts.json (manifest written by tools/artifacts/artifacts.py push)
      - .gitignore (managed block written by the same push)
    pdf: >-
      report.pdf is rendered from report.typ with both graphs embedded, and every page is
      inspected. It goes to the artifact store with python3 tools/artifacts/artifacts.py push,
      not git add. If the tool refuses, the refusal is stated in report.typ and the 58546f
      receipt, no PDF is committed, and 58546f drops .artifacts.json and .gitignore by a
      recorded deviation (fourteen paths).
    report_contents: >-
      It states the decision (revise; nothing approved; one owner question open), the claim tier
      (an instrument infrastructure stop; no mathematics) and the scope. It cites
      DEC-20261106-24d2a2, DEC-20261106-475620, TASK-20261106-96fee7 (c1ba901dfd),
      TASK-20261106-dfd0ed (5f6c092450), TASK-20261106-2b7223 and EXP-MONO-1a1be2. It keeps
      Observation, Comparison, Inference and Limitation separate:
      - Observation: the 96fee7 validity check, the kill at the harness cap, and what exists and
        what is null in the kat log.
      - Comparison: the planned timeline (projection, go threshold, watchdog, task budget)
        against the attempt as it happened.
      - Inference: CG-1, the checkpointability finding, the launcher design LD-1 to LD-12, the
        retry rule, review-first and the B8 split.
      - Limitation: environment facts as reported and unverified; the restart rate unknown;
        session-only independence; KAT-field scope.
      OQ-1 is quoted in full, with the recommendation marked as the Coordinator's. The report
      says that no run exists, that DEV-1 is neither passed nor failed, and that no timing is
      evidence about any prediction.
    figure_1_dev1_attempt_timeline_svg: >-
      A quantitative timeline of RECORDED values and decision parameters only, with one
      horizontal axis in seconds from the start of the cell.
      - Bars: the projection-phase wall (dev1-kat-log-96fee7.json dx3_projection.wall, drawn
        before zero) and the attempt-1 cell from start to kill (cell_result.wall_s), ending in a
        cross labelled "harness cap (ENV-1)".
      - Vertical markers: the harness cap 7,200 s (ENV-1); the modelled projection total
        (dx3_projection.modeled_projection_seconds.total); the go threshold 39,600 s; the cell
        watchdog 41,400 s; and the per-attempt limit 42,600 s (1,200 + 41,400), all from
        DEC-20261106-475620 dev1_decision_v2.budget.
      - A second, cumulative lane for OQ-1: attempt 1 task wall (about 2.5 h, from the report's
        times), plus one attempt at 42,600 s, plus a second at 42,600 s, against a shaded band
        for the grant of about 10-12 h.
      Caption: sources by key; KAT fields only; timings are host measurements, not evidence; the
      cumulative lane is a budget bound, not a measurement.
    figure_2_queue_and_gates_svg: >-
      A diagram. Left: BATCH-a8825c with five completed tasks, and 941825 and afbe9b greyed and
      labelled "cancelled, superseded". Centre: BATCH-c077fd, 0932f4 -> 58546f -> 7db1de ->
      971edf -> [OQ-1 answer + releasing act] -> bc7a76 (blocked) -> eebc5b -> [DEV-1
      verification, written by the releasing act] -> approval act. Gates are drawn as badges: B8-H
      after 971edf, B8-D after the verification, B8 = B8-H and B8-D. Right: the LD-8
      classification as a small table (C1 to C8 -> outcome word -> retry yes or no). Every edge
      is labelled "instrument, not evidence".
    canonical_graphs: >-
      None changes: no evidence record, status or knowledge entry moves. report.typ lists the
      canonical graphs checked and left unchanged, including the figures of
      review-DEC-20261106-475620 and review-DEC-20261106-843cf7.
    rendering: >-
