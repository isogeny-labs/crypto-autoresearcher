  # ------------------------------------------------------------ 1. the 96fee7 outcome
  outcome_composition_96fee7:
    records_read:
      - experiments/EXP-MONO-1a1be2/implementation/dev1-report-96fee7.md (in full)
      - experiments/EXP-MONO-1a1be2/implementation/dev1-kat-log-96fee7.json (in full)
      - experiments/EXP-MONO-1a1be2/implementation/environment-96fee7.json (in full)
      - coordination/goals/GOAL-PATH-001/batches/BATCH-a8825c/archives/TASK-20261106-dfd0ed/snapshot-receipt.json (in full)
      - dev1-junit-96fee7.xml was not opened. dfd0ed binds it by sha256 and the report describes it as a labelled placeholder. 7db1de RR-5H checks it.
    validity_check:
      expected_run_count: "0 experiment runs (KAT mode, non-contract) and one cell attempt. Recorded: one attempt, stopped. Holds."
      byte_integrity: >-
        Holds, with one observation (OBS-1). dx1_hashes_before, dx1_hashes_after and
        repo_code_hashes_after list the same eleven sha256 values and code_sha256 5d5a607d, and
        dfd0ed SA-3 found them equal to the committed bytes. test_kat_extended.py is
        79894702...06b5, unmodified.
      projection_first: >-
        Holds. The DX-3 sub-base projection ran before the cell, within its 1,200 s limit. Its
        modelled total (key dx3_projection.modeled_projection_seconds.total) is within the
        39,600 s go threshold, so starting the cell was correct under the card. The margin is
        under 5%.
      cell: >-
        Killed at about 7,200 s of cell time. That is the harness background-task cap (ENV-1),
        not the 41,400 s watchdog, not a crash of the code under test, and not an out-of-memory
        kill. The two helper items passed; the third, the cell, was mid-run. pytest writes junit
        only at session end, so no junit exists and the committed file is a labelled placeholder.
        No per-target count pair, guard count, full-pass rate or cell peak RSS exists (all null
        in the kat log).
      not_shrunk_not_restarted: Holds. The report gives the reason for not restarting (the remaining task budget was below the projection).
      resume: "Holds. RESUME was pushed before and after (OBS-4)."
      control_comparability: Not applicable. Nothing was compared.
    classification: stopped_infrastructure
    reading: >-
      An infrastructure stop under AGENTS.md core rule 5 and DEC-20261106-475620
      dev1_decision_v2.outcomes.stopped_or_infrastructure. It is NOT a KAT outcome. It says
      nothing about the kernel's m = 3 large-q path, nothing about B1 except that DEV-1 has not
      run, and nothing about any prediction. DEV-1 stays OPEN. The two helper-item passes are not
      a partial DEV-1 result: they are the prime-rule check and the 40-point sub-base agreement,
      both of which precede the cell by design. The projection-phase sub-base rates are not the
      full-pass rate SC-3 needs, and they do not substitute for it.
    card_gap:
      id: CG-1
      owner: coordinator (this act owns it for DEC-20261106-475620)
      text: >-
        The 96fee7 card set a 41,400 s cell watchdog but named no launch mechanism, and nothing in
        the card or the batch recorded that a harness background task cannot outlive
        7,200,000 ms. The executor used the harness facility at its maximum. A card that cannot
        be honoured as written is the Coordinator's defect first. The executor's own report
        calls the launch an executor error, and both readings are kept. TASK-20261107-bc7a76
        closes the gap with LD-4 and LD-5 (a detached supervisor and no harness background
        task).
    observations:
      - id: OBS-1
        text: >-
          dx1_hashes_before was written by a second hashing pass a few minutes after the cell
          started. The pre-projection sha256sum listing was the real pre-check, and it is
          reported equal, but it is not archived as a file.
        disposition: >-
          Accepted for 96fee7. The after-hashes and the committed bytes agree, and the record is
          not evidence. bc7a76 LD-1 writes the before-record into its attempts file before the
          projection.
      - id: OBS-2
        text: >-
          Two allow-list digests of the same eleven CODE_TREE_ALLOWLIST entries are on record:
          fix-report-2b7223.md gives 1832f855...11d1 (entries joined by newline, with a trailing
          newline), and the dfd0ed receipt gives 8a242ebc...6445 (without one). They are two
