  rationale:
    - R-1 The SA-9 successor is carried out. The 96fee7 record is validity-checked before it is interpreted, composed as an infrastructure stop, and given no evidential weight.
    - R-2 The stop came from a launch mechanism the card did not specify (CG-1), not from the instrument. The fix is a launcher outside the experiment's code, so the bound bytes and the cell stay exactly as directed.
    - R-3 The cell cannot checkpoint at the bound bytes. Restart risk is therefore handled by detection, honest per-attempt records and a bounded retry, never by shrinking or splitting the cell.
    - R-4 The allowance is the owner's. It is partly spent, a re-attempt exceeds it, and the host turns out to restart without warning. Asking one question is the honest course, and the work that needs no answer proceeds meanwhile.
    - R-5 Reviewing first protects the long cell from a late launcher change and uses the owner-wait for B8-H. RR-9 red-teams the launch design before compute depends on it.
    - R-6 No success criterion, prediction, tolerance, invalidation rule or decisive-evidence item changes. The B8 split and SC-4 and SC-5 are pre-data, administrative and recorded here.
    - R-7 Nothing here moves H-MONO-23d347, supports a lemma, or speaks to any exponent.

  scope_and_limitations:
    - This act ran no tool and computed no hash. Commits, PR number 3123, digests and the environment facts are as the top-level session, the committed receipts and the 96fee7 records report. Every figure quoted is copied from a named record or is a sum of decision parameters.
    - The container restart rate is not recorded, so no success probability for an attempt is stated. bc7a76 records the uptime and the restart signals at every launch and check-in.
    - Restart detection relies on boot_id, the PID 1 start time and uptime. A restart that changes none of them would be classified unexplained_kill, which is not retried. That is the conservative direction. RR-9 may sharpen it.
    - L-2 (N-6) as stated in DEC-20261106-843cf7. Receipts and the code_tree block are not cryptographically authenticated (the DEC-20261106-475620 position, unchanged).
    - Independence of 7db1de is between sessions only, not between models (resolved model claude-opus-5-5, model_verified false). This is not a rule-12 round.
    - Toy tier throughout. KN-OPEN-62c870 CS-D2 and CS-R7 bind every later citation.

