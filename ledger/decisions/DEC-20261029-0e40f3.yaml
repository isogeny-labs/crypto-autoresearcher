    TASK-20261029-f8b6eb moved the trial-plan queue onto that lane. PR #2709
    merged all of it into main as 862fea464c (archive TASK-20261029-9a6d9d).
    The probe now reports approvable true with no blockers.

  pass_rule_restated:
    source: DEC-20261029-22e05b F4 and F5
    rule: >-
      EXP-ICPERF-283a70 passes only on the exact integers sample_sum 2943,
      sum_squares 289567 and median 28, with no median split. The
      coefficient-of-variation and median-to-mean band flags are descriptive
      only, and neither value of either flag passes or fails the run. The
      wrong-sampler control (shift triple (1, 2, 14)) and the
      support-{0, 1, ...} control must both fail the exact match. A failed
      negative control invalidates the session's control validity.
    criterion_unchanged: >-
      The success and falsification criteria are version 1's, verbatim
      (spec lines 287-294). Given the three integers, both band flags are
      true by arithmetic. The Coordinator checked this:
      64*289567 - 2943^2 = 9871039, and 9871039/8661249 is about 1.140,
      inside [0.81, 1.21]. 28*64/2943 = 1792/2943, about 0.609, inside
      [0.6, 0.8]. So the exact match decides the whole verbatim criterion,
      and no criterion is changed after any outcome.

