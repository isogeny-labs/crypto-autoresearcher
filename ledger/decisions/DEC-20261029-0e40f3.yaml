  protocol_completeness_check:
    read_by_coordinator:
      - coordination/design/TASK-20261029-038368/EXP-ICPERF-283a70/specification.preview.yaml
      - experiments/EXP-ICPERF-283a70/runbook.yaml
      - experiments/EXP-ICPERF-283a70/implementation/run.py (lines 36-108)
    against_DEC-20261029-22e05b:
      exact_integers_decisive: >-
        Met. The primary trial geometric-probe-sample asserts sample_sum
        2943, sum_squares 289567, median 28, median_split false and
        exact_match true (runbook.yaml lines 197-230), and the spec_bindings
        bind the three integers (lines 53-61). run.py computes exact_match
        as the tuple equality with PREREGISTERED (lines 38, 106-107). The
        decisive test is stated in spec lines 252-267.
      bands_descriptive_only: >-
        Met. cv_in_band and median_ratio_in_band are asserted only as
        "type: boolean" (runbook.yaml lines 173-176), never as equals true.
        The specification lists them under descriptive_only (lines 179-181).
        DESC-1/DESC-2 state that neither flag value fails the run (lines
        111-146). The band inputs are asserted as exact integers instead:
        cv_sq_num 9871039, cv_sq_den 8661249, median_ratio_num 1792,
        median_ratio_den 2943 (runbook.yaml lines 223-230).
      wrong_sampler_control_must_fail: >-
        Met. CTL-1 ctl-neg-wrong-triple, with shifts (1, 2, 14) and
        support_min 1, asserts exact_match false, median_split false and
        2938 / 290138 / 29 (runbook.yaml lines 231-256). CTL-2
        ctl-neg-support-zero, with shifts (13, 17, 5) and support_min 0,
        asserts exact_match false and 2879 / 283745 / 27 (lines 257-282).
        Both are listed as controls (lines 283-285) and bound in
        spec_bindings (lines 62-77). run.py TRIALS (lines 41-45) defines the
        three arms.
      recurrence_stated_F5: >-
        Met. Spec sampler.definition (lines 63-78) gives xorshift32
        left/right/left with (13, 17, 5) mod 2^32, step-then-test, support
        {1, ...}, a stream that continues from the last stop, and an untested
        seed. run.py step/draw/sample (lines 52-78) implements exactly that.
        The triple is stated as definition, with Marsaglia as a recalled
        pointer only (lines 74-78).
      manifest_F2: >-
        Met. The runbook asserts /attack_claimed false in raw-result.json
        and /run/attack_claimed false in manifest.yaml (runbook.yaml lines
        148-149, 190-191).
      metrics_F3: >-
        Met. The runbook summarises sample_sum, sum_squares, median,
        cv_in_band, median_ratio_in_band, exact_match and elapsed_seconds
        (runbook.yaml lines 312-371).
    controls_metrics_budget_stopping: >-
        Complete: controls CTL-1/CTL-2 and DESC-1/DESC-2; metrics; budget
        maximum_runs 3, 60 s per run, 1 GB; stopping rule of three trials,
        one run each; invalidation rules; distinct decision_impact; and
        required_artifacts for three run ids. The probe's structural checks
        also passed on these bytes.
    new_session: >-
        RBS-ICPERF-67df7d (spec line 317, runbook binding lines 79-80). Its
        predecessor RBS-ICPERF-c4a91e is terminal (DEC-20261029-22e05b).
    version_1_not_runnable: >-
        The v2 specification declares supersedes: EXP-ICPERF-b2f2d0 (spec
        line 13). tools/newest_experiments.py newest_runnable() drops every
        id named by a supersedes field (lines 205-212, 286). So
        EXP-ICPERF-b2f2d0 is never selectable. A direct /run of it is
        forbidden by DEC-20261029-22e05b NA-3, and the supervisor would
        refuse it (F2).

  status_transitions:
    - {record: EXP-ICPERF-283a70, from: review_required, to: approved, by: specification.yaml byte swap in TASK-20261029-0a9023}
