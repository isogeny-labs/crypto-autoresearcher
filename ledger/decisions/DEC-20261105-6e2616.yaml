    from-prose re-derivation reproduces all three arms. J1 and J2 hold;
    tools/check_review_independence.py PASS.
  decision: support
  decision_scope: >-
    Support of H-ICPERF-5adc9b's integer statement only: the specified
    xorshift32 sampler at seed 20261017 yields 2943 / 289567 / 28 with no
    median split, and the statement's band clauses then hold arithmetically.
    Not support of a geometric shape beyond this sample, of p, of any probe
    panel or table, of host latency or huge pages, or of IDEA-20261015-b41f68
    claims (1)-(4).
  target_ids:
