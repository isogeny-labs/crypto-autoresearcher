  claim_tier: toy
  proof_status: derivation
  scoped_claim: >-
    Under session RBS-ICPERF-67df7d, run.py (sha256 53965863...9a38) at seed
    20261017, p = 1/50, n = 64, shifts (13,17,5), support {1,2,...} wrote
    sample_sum 2943, sum_squares 289567, median 28 with no median split, equal
    to the integers fixed 2026-10-17; the wrong-triple arm wrote
    2938/290138/29 and the support-0 arm 2879/283745/27, and both failed the
    exact match. An implementation written blind from the specification prose
    reproduces all three arms. Both band flags were true on all three units,
    so the bands distinguished none of them. Nothing follows about geometric
    shape beyond this sample, p, any table's probe counts, host latency, or
    any index-calculus or rho cost.
  rulings:
    pass_rule: >-
      Decided by the specification decisive_test and the DEC-20261029-0e40f3
      restated pass rule (exact integers, no median split; bands descriptive;
      CTL-1 and CTL-2 must fail the exact match). Met: primary exact, both
      controls fail exact match with their frozen integers. The verbatim v1
      success_criterion's band clauses are entailed by the integers and are
      not used as a criterion.
    bands: >-
      Descriptive only and non-discriminating on this record: cv_in_band and
      median_ratio_in_band are true on 3 of 3 units while exact_match is true
      on 1 of 3. No band result is read as evidence of geometric shape, at
      sample scale or at host scale.
    hypothesis_wording: >-
      H-ICPERF-5adc9b is unamended v1 text. Its mechanism sentence "Stage 0
      checks that shape", method_ceiling "The CV band is the shape control",
      the prediction both_bands_hold read as a shape check, and the phrase
      "draws from the geometric law" are not adopted by this decision
      (DEC-20261029-22e05b F4). The record is immutable; the status note
      fences the reading.
    parent_band_test: >-
      IDEA-20261015-b41f68 claim (1) uses the same bands as its test that real
      probe counts are geometric. This pass does not validate that test for
      stage 1; red-team computations (scratch, not evidence) put its
      rejection of a true geometric 64-sample near 53 percent and its
      acceptance of a CV = 1 lognormal near 30 percent.
    audit_parity: >-
      The clean audit's "no environment drift" is a false negative (PARITY-1):
      tools/runbook.py _recorded_python reads /run/environment/python_version
      and these manifests write /version and /python, so the
      DEC-20261029-5554ee interpreter-parity comparison never ran. Actual drift
      3.11.17 -> 3.13.18 changed no integer or boolean. The audit stays as
      recorded; the tool is repaired by NA-1.
    section_5a: >-
      No comparison against rho is made, so no band is owed (EV-ICPERF-84ff45
      s5a_band): no rho or IC arm, no group, no GAE counter; the priced-arm
      set is empty.
    v1_runs: RUN-ICPERF-943efa and RUN-ICPERF-b09be8 stay invalidated and are cited by nothing in this decision as evidence.
  status_transitions:
    - {record: H-ICPERF-5adc9b, from: approved, to: supported, via: analyzed, by: "hypothesis status edit in this decision's ledger archive"}
    - {record: EXP-ICPERF-283a70, from: completed, to: analyzed, by: "this decision record; specification.yaml is frozen and is not edited"}
