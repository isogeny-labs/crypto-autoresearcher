  hypothesis_status_ruling:
    hypothesis: H-ICPERF-5adc9b
    old_status: approved
    new_status: supported
    scope_of_status: >-
      The integer statement of the specified sampler at seed 20261017, p = 1/50,
      n = 64, and the band clauses only as arithmetic consequences of those
      integers. The interpretation limits stand: a pass is not evidence that
      n=83 probe counts are geometric; the alive conditions of
      IDEA-20261015-b41f68 (real probe panel, pointer-chase null, huge-page
      pair) stay open and untested.
    not_adopted: >-
      The v1 shape wording listed in rulings.hypothesis_wording.
  rationale:
    - >-
      Validity before interpretation: 3 of 3 units, receipts, manifests,
      journal chain, raw/summary/report agreement and the exact pass rule all
      hold under independent code (J1), and a mutation test of the frozen
      runbook confirms that only the integers decide validity. Seed integrity:
      seed 20261017 asserted in every unit.
    - >-
      The recorded integers equal the out-of-sample preregistration, the
      audit replay, the validator's spec-prose sampler, the red team's
      recomputation and the blind from-prose implementation, for all three
      arms. The blind implementation is the only check that can fail on an
      error shared by the prose, both runners and the design scratch code, and
      it did not fail.
    - >-
      The coordinator prior (plan, written before any reviewer ran) expected
      the exact integers to hold, both controls to fail exact match while
      passing the bands, and strength preliminary. Confirmed. Not foreseen:
      the clean audit's parity check silently did not run.
    - >-
      Strength preliminary: one seed and one execution per arm, no pcc claim,
      and the content is a deterministic identity of a specified program. The
      red team allowed "replicated" for the arithmetic identity once the blind
      arms matched; the Coordinator declines it, because there is no effect to
      replicate and the label would trigger promotion for a fact about one
      seed.
    - >-
      Support, not refine: the defects are in hypothesis wording (immutable,
      fenced by status note), report labels and audit tooling. A superseding
      hypothesis for a 64-draw toy sample would rank behind the parent idea's
      stage-1 design and is not commissioned.
