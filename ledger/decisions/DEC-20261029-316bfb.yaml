# DEC-20261029-316bfb: Coordinator disposition of the v2 successor approvals
# EXP-ICPERF-284bc4 and EXP-ICPERF-283a70. No approval is recorded. The goal
# concurrency cap holds, and an impediment is recorded on the active goal. A
# design-package queue-path defect is named as a required repair. Includes a
# ruling on the hypothesis-status question raised for DEC-20261017-95d677 and
# DEC-20261022-f1efde. No run was launched. No status moves. No immutable
# record was edited.
