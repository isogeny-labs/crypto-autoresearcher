  rationale:
    - >-
      Approval is bounded by execution. It needs probe approvable true on the
      exact bytes with a lawful goal lane. Neither package can reach that now.
      The cap blocks any new lane (VF-4), and the trial-plan queue paths block
      any lane at all (VF-5).
    - >-
      The cap is a declared machine-headroom bound, and the requester limited
      this work to within it. Raising it only to admit waiting work would use
      idle capacity as the reason, which the focus discipline forbids.
    - >-
      An approved but unrun contract waiting behind the cap costs nothing, and
      neither does a review_required one. Neither is evidence or a failure of
      its hypothesis. Holding does not weaken DEC-20261029-9bc3ff or
      DEC-20261029-22e05b, and neither version-1 id may run.
    - >-
      Ending this task leaves the goal active. The impediment names the two
      blocked approvals, when they clear, and when to recheck.
