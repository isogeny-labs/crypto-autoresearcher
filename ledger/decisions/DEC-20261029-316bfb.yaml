  verified_facts:
    - id: VF-1
      fact: >-
        Goal campaign_budget.max_concurrent is 2
        (ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml). Its max_concurrent_basis
        is machine headroom, written around the EXP-ICPERF-66fd51 solver
        benchmark.
    - id: VF-2
      fact: >-
        tools/experiment_preapproval.py (lines 317-333 at this checkout) loads
        lanes with include_refs false. It blocks when the number of open lanes
        is greater than the cap, when the packet's lane is missing or not open,
        or when the lane's dispatch_queue_path differs from packet.queue. Line
        260 also requires trial_plan.queue to equal packet.queue.
    - id: VF-3
      fact: >-
        In coordination/goals/GOAL-ICPERF-e6b6a4/lanes/, only two lane files
        have no matching .closed.json: BATCH-5bfb57 (opened by
        DEC-20261019-786a95, owner coordinator-icperf-prime63-protocol) and
        BATCH-8f7bd6 (opened by DEC-20261018-273b2d, owner
        coordinator-icperf-binary-review). Each belongs to another session.
        Open PR #2439 (updated 2026-10-26, reported by the top-level session)
        closes BATCH-5bfb57 and opens BATCH-ac3c38, which leaves the open count
        unchanged. Neither lane is this session's to close.
    - id: VF-4
      fact: >-
        Opening any new lane makes the open count at least 3, which is greater
        than the cap of 2. The probe would therefore still refuse.
    - id: VF-5
      fact: >-
        tools/goal_lanes.py open_lane (line 546) requires the queue path to
        lie under coordination/goals/GOAL-ICPERF-e6b6a4/batches/<BATCH>/. Both
        experiments/EXP-ICPERF-284bc4/trial-plan.json and
        experiments/EXP-ICPERF-283a70/trial-plan.json set queue to
        coordination/design/TASK-20261029-038368/<EXP>/queue.preview.json. The
        design return records this as a protocol deviation. With these bytes,
        no lane can satisfy VF-2, whatever the cap.
    - id: VF-6
      fact: >-
        With source_ref origin/..., the probe requires the runbook lint
        receipt, goal.yaml and the lane file to be byte-identical at that ref.
        A new lane must therefore reach origin/main before the probe can pass.
        That takes two merges: the lane first, then the approval.

  options_considered:
    - id: A
      text: >-
        Keep the cap, record no approval, and record the impediment on the
        goal with the queue-path repair named.
      chosen: true
    - id: B
      text: >-
        Raise max_concurrent on a current machine-headroom basis (4 CPUs, 15 GB
        RAM, about 14 GB available; trials are 256 MB, 60 s, queue
        max_concurrent 1) and open one shared lane for both successors.
      chosen: false
      why_not: >-
        The requester limited the work to "within goal concurrency". The
        Coordinator focus discipline (agents/coordinator.md) also says idle
        parallel capacity does not justify admitting another lane. The cap
        would be raised only because this work is waiting, and that would turn
        the probe's concurrency gate into a formality. The current basis may
        well be stale, because the 66fd51 quiet-machine condition and the
        5 GB-free reading are from an earlier batch. That should be decided by
        a headroom review prompted by something other than admitting this
        work. It is not decided here.
    - id: C
      text: >-
        Put both successors into the queue of an already-open lane
        (BATCH-5bfb57 or BATCH-8f7bd6).
      chosen: false
      why_not: >-
        Each queue sits inside another session's lane write_scope, and those
        lanes have their own objectives. Writing into either queue would break
        the lane discipline in AGENTS.md "Lanes" and
        docs/concurrent-goal-lanes.md.

  hypothesis_status_ruling:
    question: >-
      Do DEC-20261017-95d677 and DEC-20261022-f1efde imply "approved" for
      hypotheses whose files read "specified", and should this goal correct
      them?
    DEC-20261022-f1efde:
      in_goal: false
      finding: >-
        Its goal is GOAL-PFDR-fd09e0 and its hypothesis is H-PFDR-727bfc, so it
        is outside GOAL-ICPERF-e6b6a4. The reported mismatch is also already
        resolved. The decision's own status_transitions block records
        H-PFDR-727bfc specified -> approved. The hypothesis file now reads
        status supported, and its status_note says it was moved approved ->
        analyzed -> supported by DEC-20261029-01405d, was approved pre-run by
        DEC-20261022-f1efde, and "read specified until this edit".
      ruling: >-
        No action. Nothing remains to correct, and it is outside this goal.
    DEC-20261017-95d677:
      in_goal: true
      finding: >-
        The decision approves EXP-ICPERF-e467a5 (version 1) and lists
        H-ICPERF-2f52d1 in target_ids. It has no status_transitions block. The
        hypothesis file was written in the same design packet. Its header says
        "Specified under DEC-20261017-95d677", and its status is specified.
        DEC-20261029-9bc3ff records_checked already noted the asymmetry with
        the sibling H-ICPERF-5adc9b, which reads approved with
        approved_by_decision DEC-20261017-f2d04c, and did not fix it.
      ruling: >-
        No status correction. The committed records do not decide the
        question. The approving decision records no hypothesis transition, and
        the hypothesis file names that decision as the one it was specified
        under. A retroactive specified -> approved would have to be inferred
        from target_ids alone. It would also misstate the present state. The
        only contract that decision approved (EXP-ICPERF-e467a5 v1) has an
        invalidated run, and DEC-20261029-9bc3ff and DEC-20261029-22e05b bar it
        from running again. The only runnable successor, EXP-ICPERF-284bc4, is
        unapproved. "specified" is therefore the accurate official status of
        H-ICPERF-2f52d1 today, and it stays as written. H-ICPERF-5adc9b keeps
        its recorded approved status. No approved -> specified edge exists, and
        approval asserts nothing about a hypothesis. Its approval also gives no
        dispatch authority, because dispatch is gated on the experiment
        (version 1 barred; version 2 review_required).
      what_resolves_it: >-
        When the probe passes and DEC-20261029-ca33b3 approves EXP-ICPERF-284bc4,
        that decision records the transition H-ICPERF-2f52d1 specified ->
        approved in status_transitions. It edits the hypothesis status field
        with a status_note that names DEC-20261017-95d677 as the version-1
        approval that recorded no transition, following the H-PFDR-727bfc
        precedent. DEC-20261029-0e40f3 records no hypothesis transition for
        H-ICPERF-5adc9b, which is already approved.

  required_repair_before_any_lane:
    id: RR-ICPERF-V2-QUEUE-20261029
    owner: >-
      A design-lane task (executor policy executor-implementation) dispatched
      by the Coordinator decision that opens the lane. Implementation is the
      design lane's, not the Coordinator's.
    text: >-
      Both contracts share one lane and one queue at
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/<BATCH>/dispatch_queue.json.
      Use a BATCH id allocated when the lane is opened. BATCH-38f344 may be used
      only if --check still confirms it free. The queue holds both executor
      tasks (TASK-20261029-65798b, TASK-20261029-f370f1) and their archive
      tasks (TASK-20261029-fe381b, TASK-20261029-6b18a6), with queue
      max_concurrent 1. The repair sets the queue field of both trial-plan.json
      files to that path and regenerates both trial-plan sha256 values. It
      updates each runbook's trial-plan bind and also the specification bind
      the design return already requires at approval. It re-runs
      tools/runbook.py lint, commits the new runbook-lint.txt receipts, and
      updates trial_plan_sha256 in both handoff execution bindings and in the
      queue's embedded handoffs. Both packets then point queue and lane_id at
      the lane. The repair changes no criterion, control, seed, integer,
      run id or budget. DEC-20261029-22e05b still holds: 283a70 passes only on
      the exact values 2943 / 289567 / 28, its bands are descriptive only, and
      the wrong-sampler control must fail.

  status_transitions: []
  status_transitions_note: >-
    None. EXP-ICPERF-284bc4 and EXP-ICPERF-283a70 stay review_required (frozen
    false, approved_by null). H-ICPERF-2f52d1 stays specified and
    H-ICPERF-5adc9b stays approved, as written. GOAL-ICPERF-e6b6a4 stays
