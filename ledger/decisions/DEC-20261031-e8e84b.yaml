    claude-opus-5-5 as stated by the runtime. No shell: tools/allocate_id.py, tools/ecc_priority.py,
    tools/experiment_preapproval.py, tools/validate_ledger.py and tools/newest_experiments.py were run by the
    top-level session; their outputs are cited as reported by it.
  goal_id: GOAL-PFDR-fd09e0
  question_id: RQ-PFDR-ae2fba
  mode: portfolio
  kind: selection_and_design
  context: >-
    Portfolio pass, ECC first. 174 open ECC ideas (ECDLP 48, PFDR 6). The ECDLP lead atlas (stamped 2026-10-30)
    gives LEAD-ICP-coincidence-harvest-structured-base disposition open_next_step with next_action "run the
    break-even growth ladder (IDEA-20261018-a0830c)". Its prerequisite review of EXP-PFDR-bb0d26 is composed twice:
    DEC-20261029-01405d (support; H-PFDR-727bfc supported; EV-PFDR-07d608) and DEC-20261029-8d9b43 (concur; strength
    of EV-PFDR-07d608 to be corrected strong -> preliminary by CORR-A, not yet written). The second round is
    composed, not open; the lead text calling it open is stale. Neither changes this design. IDEA-20261018-a0830c is
    proposed, prio high, area PFDR (an ECC area in orchestration/research-priority.yaml), and no hypothesis or
    experiment cites it. tools/ecc_priority.py --classify printed "non-ECC" because it keys on the id prefix and
    IDEA ids carry no area; --open-ideas lists it as [PFDR] (top-level session).
  decision: revise
  decision_label: >-
    select_IDEA-20261018-a0830c__design_H-PFDR-ed7ccf_and_EXP-PFDR-2d36f9_v1__not_approved_review_required__blockers_recorded_on_GOAL-PFDR-fd09e0
  target_ids:
  - IDEA-20261018-a0830c
  - H-PFDR-ed7ccf
  - EXP-PFDR-2d36f9
  - GOAL-PFDR-fd09e0
  - LEAD-ICP-coincidence-harvest-structured-base

  ranking:
    selected: IDEA-20261018-a0830c
    basis: >-
      Exponent first (docs/target-result-profile.md): it is the only candidate whose readout is an exponent of N.
      It turns every coincidence lead's gate into one growth criterion: delta >= 1/(2h - 1), that is 6.35 per 8
      bits at h = 2. It is the lead atlas's named next step. Its implementation and compute cost are low, and it
      reuses the EXP-PFDR-ca5e01 kernel and builders.
    compared:
    - id: IDEA-20261027-d217c2
      reading: ECDLP control (pole-complete Riemann-Roch filtration of the native constructor); constant/representation level; medium implementation
    - id: IDEA-20261027-d434c8
      reading: ECDLP measurement (retained kernel features, target-row certificates); constructor-level, no exponent readout
    - id: IDEA-20261027-d5c1ee
      reading: ECDLP control (isolated x = 0 chart completion); finite chart effect, its own method ceiling
    - id: IDEA-20261018-9fc21f
      reading: PFDR mechanism; kappa = d(V) at most the cofactor and empty on prime order; a column-ii N-constant bound that a0830c classifies sub-break-even by law
    - id: IDEA-20261018-5fa71b
      reading: PFDR control (one count vector, three moments); calibration-level
    - id: IDEA-20261030-b6f05e
      reading: not ranked above a0830c; not examined in depth in this pass (stated, not inferred)
    - id: DREG ideas needing 256-512 GB hosts
      reading: not runnable on available hosts; ranking them over a runnable low-cost exponent readout is unjustified
    rank_ahead_of_nothing: >-
      Yes. If O-SUB-BE holds, the lead's point-base geometries close at h = 2 over 16..32 bits, backed by an
      obstruction quantity. If O-ALIVE holds, the program has its first structural relation source on F_p. Both
      outcomes change the next decision.

  design:
    hypothesis: ledger/hypotheses/H-PFDR-ed7ccf.yaml (status specified)
    contract: experiments/EXP-PFDR-2d36f9/specification.yaml (version 1, status review_required, frozen false, approved_by null)
    summary: >-
      Six preregistered lines (theta 0.30, 0.35 x d 1, 2, 3). Five rungs at bits 16, 20, 24, 28, 32 on fresh seed
      blocks 6,0/6,1/6,2/6,9 million. The statistic is the slope delta of log2 kappa on log2 N, with a curve-cluster
      bootstrap 95% interval. Line classes: ALIVE (lower > 0, upper >= 1/3), SUB-BE-GROWING, SUB-BE, UNRESOLVED.
      Controls:
      - positive: gamma plants at 1/2 (must read ALIVE) and the Z/N interval base (slope 1 - theta within 0.05);
      - negative: gamma = 0 plant (an N-constant excess must read SUB-BE);
      - slope recovery: plants at 0, 1/6, 1/3, 1/2 within 0.03 (blocking);
      - A/A: null replicate 0 as a pseudo-line (5 of 6 cover 0) and a z_cal gate;
      - matched seeds across arms;
      - replication of any ALIVE line on a fresh block.
      Decision criterion stated numerically: upper95(delta) < 1/3 on every valid line supports; ALIVE replicated
      falsifies. Cost unit: none measured (group operations in the harvest law; CPU-seconds for machine use).
      Stop after seven planned trials.
    resolutions: R1 (rung spacing and the literal per-8-bit ratio), R2 (FAM-1 excluded from v1), R3 (gamma 1/2 added; randomized rounding of L), R4 (calibration bands), R5 (stage 1 re-analysis descriptive only); see the contract
    kills_or_advances_lead: >-
      O-SUB-BE: candidate exhausted_at_scale for window and label-GAP point bases only, after review, with the
      obstruction block "max upper95(delta) against delta* = 1/3". O-ALIVE: price the surviving line against
      matched rho and extend the ladder beyond 32 bits. The lead's FAM-1 clause stays open either way (R2).

  approval:
    recorded: false
    standing_authorization: AGENTS.md "Standing user authorization" (user, 2026-09-06) would cover approval once the probe reports approvable
    preapproval_probe: >-
      Run by the top-level session on packet
      /tmp/claude-0/-home-user/5d259445-3543-53ca-af2b-12f63e820d47/scratchpad/preapproval-EXP-PFDR-2d36f9.json;
      result recorded in the handback of this task (expected approvable false).
    blocking_fields:
    - experiments/EXP-PFDR-2d36f9/implementation/ (run.py, check.py, paircount.c, vendor/curve.py) does not exist; trial_plan source_sha256 cannot bind committed sources
    - experiments/EXP-PFDR-2d36f9/trial-plan.json does not exist (schema crypto.autoresearch.trial_plan.v1, RUN ids, argv commands, memory_mb, watchdogs)
    - no prospective queue (coordination/goals/GOAL-PFDR-fd09e0/batches/<BATCH>/queue.json) with an executor task, and no lane id
    - no executor handoff ledger/handoffs/TASK-*.yaml for the run
    - the canonical review_required specification is not yet committed at origin/main (source_ref)
    - no reserved approval DEC id named in a packet
    - 'open technical risk for the implementation lane to certify: prime-order curve generation and order certification at 28 and 32 bits with the vendored generator, and the paircount.c key bound at p < 2^32'

  rationale:
  - The idea is complete enough to freeze as a protocol. Its predictions, controls, falsification conditions and heuristics map one to one onto the contract. Departures are recorded as resolutions before any data.
  - Approval is bounded by execution. Without implementation and trial plan the runnable condition cannot hold, so the contract stays review_required and the blockers are recorded rather than parked on the user.
  - Scope is toy (p <= 2^32), h = 2, six lines. No transfer beyond 32 bits is assumed, and no cost or security statement is made.
  evidence_refs:
  - ledger/proposals/IDEA-20261018-a0830c.yaml
  - knowledge/leads/ecdlp/ic-prime/LEAD-ICP-coincidence-harvest-structured-base.yaml
  - experiments/EXP-PFDR-ca5e01/specification.yaml
  - ledger/decisions/DEC-20261029-01405d.yaml
  - ledger/decisions/DEC-20261029-8d9b43.yaml
  - ledger/evidence/EV-PFDR-ad6274.yaml (FAM-1 definition, R2)
  limitations:
  - The Coordinator ran no command; ID allocation, ECC classification, the preapproval probe and the validator are the top-level session's.
  - The ECDLP ideas d217c2, d434c8 and d5c1ee and the PFDR idea b6f05e were ranked from their titles, classes and cost fields only.
  - Curve-count and CPU estimates are back-of-envelope (b^4/(8N)) and advisory.
  - The lead's FAM-1 clause is not addressed by version 1.

