    - "Read on main by the Coordinator: TASK-20261016-3833ab (the executor task of DEC-20261016-6a041f) is in state queued in analysis/xedni-cheon/20261016-faithful-eligibility/dispatch_queue.json."
  rulings:
    - "R1 (ruling quarantine). RBS-XEDN-a7cd25 is quarantined as a whole. This covers chain B (blob 3085ea22 on main, tip 7852f392) and chain A (blob d45487a4 at fc38e671, reachable from main through 85a3fa6d98's second parent 8c265ebea2, tip 45eff20e). It covers every unit, receipt, step log, manifest_v2 and run directory either chain wrote, in both chains' bytes. Quarantined material is kept and is not evidence about H-XEDN-5befd8, IDEA-20261016-633cb1, H1 or any other record. No evidence review, validation gate, synthesis, roadmap ranking or knowledge entry may cite it as a measurement. The session id is never reopened, under any failure class."
    - "R2 (custody of chain A). This decision is the custody record that merge 85a3fa6d98 lacked. Chain A's authoritative bytes are those at commit fc38e67127513cb15635b053d70fc4069b6a1cce, and for the journal path the blob is d45487a4bfb5c47301c3b282fe87df1fa77fe898. Neither chain is the authoritative attempt 4, and both are quarantined. This decision does not restore chain A's files to the tree. It does not supersede chain B's files, and it creates no run_supersession_registry entry."
    - "R3 (not replay, not clear). Replay is impossible because no unit is valid and the audit had zero replay power. A clear ruling is excluded by the fork, by the overwrite at merge, and by C5 never having run."
    - "R4 (escalation to an independent validator not ordered). The units fail validity mechanically: the supervisor refused them before check.py in both chains. No validator review can make unchecked outputs checker-valid. The reader's agreement with the raw fields is a screen on unvalidated outputs and carries no weight toward any status. The open items the reader escalated (custody of chain A, maximum_runs, rerun route) are Coordinator rulings and are made here."
    - "R5 (maximum_runs / 'no third run'). run.py was executed for each run id in both chains without an amendment. Neither execution produced a checker-validated run. Any further execution of EXP-XEDN-0c0182 needs a versioned protocol_amendment, fresh run ids, a new session id and a new Coordinator approval, as the specification's own stopping rule requires. DEC-20261016-6a041f authorizes no further execution of RUN-XEDN-132272, RUN-XEDN-f4d646 or RBS-XEDN-a7cd25. TASK-20261016-3833ab must not be dispatched against this session. Changing its queue state is a separate native queue act, not done here."
    - "R6 (failure classes). Attempts 1 to 3 (claim push refused, supervisor refusal of an uncommitted claim input, and cannot-lock-ref, per the earlier reader) are infrastructure signal. Attempt 4 in both chains is a driver/supervisor interface failure: run.py's manifest cannot be completed into a run envelope. That is implementation signal. Neither is evidence for or against H-XEDN-5befd8. The earlier finding XEDN-REOPEN-TEXT-CONFLICT is moot for this session under R1. A successor runbook must make its tell_on_failure text and the reopen rule agree."
    - "R7 (post-observation disclosure). The reader has seen the census values under both eligibility readings, so F-SPEC-4 can no longer be resolved blind. Any amendment that fixes the meaning of point-level eligibility or the P5 base (w0, z0) must say it was written after those values were seen. The p=353 clause and P5 that it decides then count as post hoc for prediction-provenance purposes (docs/confound-control.md). No success criterion may change without that versioned amendment."
