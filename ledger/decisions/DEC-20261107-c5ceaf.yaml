  facts_reported:
    - "Verified with git by the top-level session (not by the Coordinator): main's journal is blob 3085ea22 (24 entries, 4 attempts). Attempts 1 to 3 end in infrastructure_error, with reopens at seq 6, 12 and 18. Attempt 4 ends in implementation_error, then stopped. Merge 85a3fa6d98 ('Merge approved harness-plan records onto current main', 2026-10-31) has first parent d83777bd6c, which carries blob 3085ea22 (chain B), and second parent 8c265ebea2, which carries blob d45487a4 (chain A). The merge result kept chain B. Chain A's journal survives only in history, and no superseding or custody record exists. Both chains share owner runbook-ece267 and the same first entry time, and both wrote attempt 4 from the same 18-entry state."
    - "Read on main by the Coordinator: the journal's reopen entries (lines 7, 13 and 19) carry reason 'previous stop was infrastructure_error'. Units at lines 21 and 22 read invalid_output / invalid_measurement. Line 23 reads 'supervisor exit 3 (trials remain or need reconciliation)', class implementation_error. These strings are producer prose and are unverified."
