    - "Reader report (unverified): the merge kept chain B's bytes at 16 paths where chain A had committed write-once records. These are the journal, six attempt-4 step logs, both execution-receipt.json files, launch.json, environment.json and command.txt for both runs, and RUN-XEDN-132272/raw-result.json, which differs only in elapsed_seconds. No run_supersession_registry entry covers chain A's receipts."
    - "Reader report (unverified): in both chains the supervisor refused both trials while completing the manifest envelope, before check.py ('run.result.certificate.kind must be one of discrete_log|decomposition|none'). check_returncode is null and the check logs are empty, so C5 never ran. Both execution-receipt.json files read returncode 0, status invalid_output, published false."
