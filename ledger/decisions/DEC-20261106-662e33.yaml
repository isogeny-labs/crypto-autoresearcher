  - isogeny-labs/crypto:research/ic_line_layout_tournament_20261031/QUALIFICATION-V6-20261106.md
  - isogeny-labs/crypto:research/ic_line_layout_tournament_20261031/PROTOCOL-V6-AMENDMENT-1.md
  limitations:
  - F6 and F6b grade L2 on the local host, not on a c8a node; the qualification is the c8a check.
  - The launcher's control-comparison.json and the full 576-record and 128-pair counts are first exercised by the qualification.
  - The pc-fb2x stand-in tests the comparison shape that the candidate comparison is expected to share.
  - The AWS price list was not read; the budget rule is a launch-card gate.
  - pc-fb2x checks direction fidelity, not few-percent sensitivity; the v6 claim is fp28-only on the pinned executable.
