  scoped_claim_this_experiment_can_support:
    summary: >-
      Pass 1 can support only a statement about the instances of the frozen
      grid it completes: for coset-shifted Nagao EQS4 and EQS4-U systems at
      p = 2, over the sampled cells (m = 3, n = 3..17; m = 4, k = 2, n = 8..10;
      and the single stretch cell (3, 19, 7) if budget allows), under the
      specified sampling rule, closure W_D and budget, whether the degree-4
      mutant closure W_4 contains a degree-compatible Groebner basis of the
      ideal. Either (O-1) at least one instance is not contained, with a
      certificate that the independent checker accepts, which is a
      counterexample to the operational form of "Proposition 5 and Assumption 1"
      (that degree 4 suffices) at that instance; or (O-2) every decisive
      instance is contained while the null arm discriminates, which corroborates
      the operational form at the tested cells only and is breakthrough-adjacent;
      or inconclusive or invalid (O-3, O-5, O-6).
    cannot_support:
      - >-
        The user's goal wording, "run harness until subexp ecdlp algo
        disproved". No run of this experiment, in pass 1 or in any pass within
        its maximum_runs, can disprove or prove a subexponential ECDLP
        algorithm. It is a bounded counterexample search against the
        refutable content of one conditional theorem (Nagao 2015/984, Theorem 1
        at p = 2). Theorem 1 is conditional and a counterexample does not
        refute it as a conditional (interpretation_limits); an all-contained
        outcome does not prove it, does not measure complexity, and does not
        establish a cost or speedup. A subexponential-time claim for ECDLP is
        an asymptotic statement over all n; this contract has no FORALL-n
        statement and no asymptotic_claim (null), and the promotion gates for
        an asymptotic claim are not in play and are not met.
      - >-
        Any statement about a deployed or standardised curve (sect163k1, B-163,
        K-233 and the like) or about ECDLP security in either direction.
      - >-
        Transfer to n >= 20 except the single stretch cell, to m >= 5, to
        p >= 3, to non-degree-compatible orders, to algorithms outside the
        linear-algebra closure model (SAT, exhaustive search, hybrid guessing),
        or to Nagao's asymptotic regime (k = C0, m ~ n/C0). A D_solve series
        over n is confounded and decides nothing.
      - >-
        Containment at N >= 27, which is engine-decided and uncertified. A
        contained instance shows only that a degree-4 route exists, not that a
        particular F4 selection strategy stays inside degree 4.
      - >-
        Any evidence decision that rests on the contained side of pass-1 data
        before the nonce-sampled scratch replay is archived (DG-5).
      - >-
        Anything about which this decision claims novelty (DL-1).
    goal_pointer: >-
      The user's wording stays an unreachable end-state, not a task. What the
      goal can do next after this experiment is the specification's
      decision_impact; this decision changes none of it.

  declared_limitations:
    - id: DL-1
      text: >-
        Collision search partial. Not searched: scripts/research-kb (no
        executable), the local kb/ derived index service, aburan28/crypto
        research/dreg_closure_* (not checked out), and the cryptanalysis
        repository beyond AGENTS.md and CLAUDE.md. The lead-atlas rows cited
