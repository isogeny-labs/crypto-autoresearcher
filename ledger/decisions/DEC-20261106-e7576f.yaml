  gate_ruling_collision_search:
    question: >-
      RUL-12 gate 1 required the observation-collision search to be performed
      with research-kb and the repository greps before this decision. The
      research-kb executable, the local kb/ index and the sibling crypto
      repository were unavailable, so only the in-repository half was done and
      collision-search.json declares itself PARTIAL. Approve with the partial
      search declared, or hold until the knowledge base can be queried?
    ruling: >-
      Approve, with the research-kb half converted from an approval gate into a
      hard dispatch gate (DG-1). This amends RUL-12 gate 1 on the Coordinator's
      own authority and says so here; it is not a silent waiver.
    reasons:
      - >-
        What a collision costs. The specification names two things a collision
        would mean: a replication (reframe cheaply) or an existing
        counterexample or corroboration that changes the ranking of this run.
        Both are about not wasting a 12-hour, 10 GiB, four-CPU run. Neither
        makes a completed run invalid or misleading. A collision found late
        costs compute; it does not corrupt evidence, because the run is
        observation-only and moves no status. That bounds the harm of a partial
        search at "possibly duplicate work", which is not zero but is not a
        validity defect.
      - >-
        What approval buys. Approval here writes a ledger state and starts
        nothing. The run is independently unlaunchable today (CRYPTO_AR_BLOBSTORE
        unset, S02 unverified), so holding approval would not prevent a
        premature launch that approval does not also prevent, if DG-1 is a
        gate. The risk is a dispatcher that reads execution_state ready and
        skips the decision text; DG-1 is therefore also required to be a
        committed file whose existence the dispatcher checks, not a memory.
      - >-
        What the partial search does show. The in-repository half found no
        prior measurement of the degree-4 mutant closure's containment of the
        Groebner basis on satisfiable Nagao disjoint-coset EQS4. The adjacent
        records (EXP-SEMBIN-22a1a2, EXP-SEMBIN-4fa22c, EXP-SEMBIN-d9767f,
        EXP-SEMBIN-24ec56, EXP-CERTBIN-060020, KN-FIND-936151) measure
        different quantities, as the file maps. The one hit the hypothesis
        itself leans on, the sibling-repository research/dreg_closure_*
        results, enters only through the lead-atlas row summary and was not
        re-read; that is exactly the part DG-1 closes.
      - >-
        Why not hold. Holding would park a complete, probed, linted contract on
        an environmental absence that may be indefinite, with no one assigned to
        remove it. AGENTS.md says an incomplete protocol is completed or records
        its impediment, never parked. The honest alternative to parking is a
        gate with an owner, a deadline (before the first measurement) and a
        defined consequence (withdraw by a superseding decision), which is what
        DG-1 is. AGENTS.md "Knowledge retrieval" itself states "No result is
        not evidence of absence" and treats missing access as an access gap,
        never as mathematical evidence; the converse holds here: a partial
        search is not evidence of novelty.
    what_this_does_not_permit: >-
      No record, report or promotion may call this measurement novel, first, or
      unreplicated on the basis of collision-search.json. The file supports only
      "no prior measurement was found in the searched in-repository sources".
    consequence_if_dg1_finds_a_collision: >-
      A hit that is a replication, an existing counterexample or a
      corroboration is read by the Coordinator before dispatch. If it reframes
      the contract the Coordinator writes a superseding decision that
      withdraws this approval (EXP-SEMBIN-cb5e25 back to review_required by an
      additive record, never by editing this one) and the experiment returns
      to design. Dispatch does not proceed meanwhile.

