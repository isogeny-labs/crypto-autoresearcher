        independent reviewer. The Coordinator read the file and its seven
        mapped hits; it did not re-run the greps. Resolved only by DG-1.
    - id: DL-2
      text: >-
        The approved specification bytes still contain pre-approval narrative:
        proof_search_map.observation_collision_search.status reads "required
        before the first run, not yet performed", and readiness.blockers lists
        the collision search, the recompiled plan, the unbuilt queue, the
        missing approval decision ("this contract stays review_required, frozen
        false, approved_by null") and unmeasured timings. These are stale
        design-time lists inside a file whose header fields (lines 194 to 199)
        read approved/frozen/execution_authorized. The header and this decision
        govern; the stale lists are not gates and the probe did not treat them
        as blockers. They cannot be edited without changing the approved hash;
        a later additive amendment may correct them.
    - id: DL-3
      text: >-
        DR-11 declared deviation (RUL-3). The supervisor's RLIMIT_AS is set to
        a loose 32768 MB virtual ceiling; the binding limit is the run.py VmRSS
        watchdog at 10 GiB. This deviates from the specification's "never
        RLIMIT_AS" in letter and not in intent. The ceiling was checked only on
        a trivial cell (experiments/EXP-SEMBIN-cb5e25/rlimit-confirmation.json,
        not re-read) and is unmeasured for the wdag at N = 26 and the N = 40
        closure; the kill-inside-child path is untested. A kill at the ceiling
        is an infrastructure signal under SR-7, never a censored M-1. A
        resident-set spike between watchdog polls can exceed 10 GiB for one
        interval (about 5 GB of host margin). Pass-2 SR-7 selection must select
        every row with status error, failed_infrastructure or crash.
    - id: DL-4
      text: >-
        DR-13 declared deviation (RUL-4, RUL-5, RUL-9). Pass 1 runs the static
        grid and five certify passes only. The trials step is replay-exempt, so
        the audit's replay field-compare is not_covered for it. An undecided
        PC-TRI instance is a warning, the C-PC gate then does not hold for its
        cell, and neither S-MAIN nor F-MAIN may be called from that cell.
        SR-6 re-runs, the SR-7 retry and a raised certificate guard belong to
        pass 2, which is a separate plan, runbook, session id, shared run
        directory and approval, and counts as run 2 of maximum_runs 3.
    - id: DL-5
      text: >-
        Identifier defect in the approved specification: design_revision
        contains two entries both numbered DR-11, one in revision 2 (certificate
        emission child, null degree-1 mismatch, F-6 as failure, EQS4-NOFE
        generators, P-7 calibration) and one in revision 3 (RLIMIT_AS). In this
        decision and its dispatch gate, "DR-11" means the revision 3 RLIMIT_AS
        ruling unless "revision 2" is said. The duplicate cannot be repaired
        without changing the approved hash; record a correction in the pass-1
        archive.
    - id: DL-6
      text: >-
        SR-8 clock (DR-12). The 43200 s is charged from the first trial; the
        S05 fixtures step (up to 3600 s) is outside it. Whether SR-8 is per
        pass or cumulative across passes, and the pass-2 shared run directory
        and clock, are not decided here (RUL-9).
    - id: DL-7
      text: >-
        Neither the Coordinator nor, as far as the record shows, any session has
        measured host timings for the revision 2 additions (wdag at N = 20 and
        24..26, null brute force at N = 24..26); the 26,400 s modelled total
        against the 43200 s cap is a model. A budget censoring is incomplete,
        not negative (O-6).
    - id: DL-8
      text: >-
        The Coordinator did not hash any file, did not run the probe, the
        runbook lint or the card lint, did not read the 5,900-line artifact_paths
        list in full, and did not read the 587-trial plan or the queue beyond
        its max_concurrent and task states. The queue and trial plan are
        bound by the probe's hashes and the runbook's binds only.
    - id: DL-9
      text: >-
        The run-archive task TASK-20261106-c5d001 exists as the handoff's
        archived_by and as the card embedded in the committed queue. No
        ledger/handoffs file for it is written in this package. It is a
