  limitations:
    - >-
      Toy sizes 2^14 < p <= 2^25 only. No transfer to 2^52 or to the 53-bit
      pair is claimed or argued. A coupling growing like N^eps with eps above
      about 0.13 and below 0.04 percent at 2^24 is unconstrained at 2^52 (RT-O4).
    - >-
      One confirmatory pass, fixed seeds; no replication on fresh instances; no
      growth arm; C16 underpowered; the FAM population is exhaustive in band.
    - >-
      The tested base does not use the CM structure. The signed convention, other
      m, other charts and models, other bases and the floor curve are untested.
    - >-
      Frozen-code defects D1 and D2 stand in the record of t8; the superseding
      analysis is not yet made. The contract-text powered set, MDE and Holm
      values quoted here are the Coordinator's and the reviewers' arithmetic on
      recorded values.
    - >-
      The review plan was written after both verdicts; the Coordinator prior is
      post hoc; the blind re-derivation was not blind; two reviewers worked the
      same quantity on J3; the red team has no TASK card; the reviewed snapshot
      is a producer-session head (c6a2f13fdb), not a Coordinator snapshot archive.
    - >-
      The Coordinator had no shell: no number in the evidence, analysis, report or
      graph data was produced by running code in this review. Numbers are read
      from RUN-CMFB-2010d3/raw-result.json by key or are arithmetic on recorded
      values, labelled derived; the structural translation of the C24 bound
      (about 20 extra pair-sum coincidences) and the occupancy constant
      1.235/sqrt(N) are the red team's analysis, not reproduced by the repository's
      instrument. The graph and the PDF are rendered by the calling session.
    - >-
      Decomposition cost, relation rank and linear algebra were not measured.
      Coverage equal to a random base does not imply equal cost.
