# DEC-20261019-f33f3e - evidence review of EXP-CMFB-cea1d2.
# Decision: refine. The run is valid; the scoped null on the small-x window base is
# recorded as preliminary evidence that supports H1 (EV-CMFB-e3d1ec). H-CMFB-9b2eed
# moves specified -> analyzed, not supported. No ECDLP claim changes. The
# Coordinator ordered no new compute for the analysis defects D1 and D2; it
# commissions a design for the one experiment that could change the reading of the
# CM question (a CM-coupled base) and does not approve it.
# Not official until the ledger archive commit is verified by the dispatcher.
