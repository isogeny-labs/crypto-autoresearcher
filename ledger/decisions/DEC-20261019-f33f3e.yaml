  scoped_claim: >-
    No coverage difference between the small-x liftable-window factor base and a
    matched random base exceeding the predefined resolution delta = 0.5 percent
    was observed over the tested instances (107 prime-order curves with
    2^14 < p <= 2^25: 27 FAM members of p = 5t^2 + 19t + 19, 40 other D = -19
    crater-type curves, 40 random curves), base (the first ceil((6N)^(1/3))
    abscissae with f(x) a nonzero square, one canonical-sign point each, in the
    integral Weierstrass chart), counting convention (m = 3, unsigned multisets,
    targets uniform over Z_N, exact counting, 200 matched random bases per
    member) and budget (16 minutes wall, one pass, seeds 7001 to 7010). At C24
    (2^22 < p <= 2^25; FAM 13 of 13 members in the band) every 95 percent
    interval for the mean coverage ratio minus 1 lies inside +-0.04 percent
    (FAM -0.022 [-0.038, -0.006], N-A -0.000 [-0.024, +0.027], N-B +0.016
    [-0.001, +0.035] percent); at C20 inside [-0.074, +0.057] percent under the
    contract-text powered set. C16 (FAM n = 4) is underpowered and enters no
    conclusion. This is a statement at resolution 0.5 percent for the stated
    arms, cells, chart, base and convention; it is not a statement that no
    effect exists. It does not say that no factor base can beat a random one
    (a Sidon-type base reaches +10.7 percent, EV-FBG-001). The measured claim is
    exchangeability of this base; 'a coverage advantage cannot exceed 1.582' is
    the conservation theorem KN-FIND-007 and is not a result of this run. The
    CM structure (endomorphism chain, isogeny pullback, canonical lift, other
    models, joint windows, the floor curve), the signed x-only convention,
    growth in N, decomposition cost, rank and linear algebra were not tested.
    Evidence strength preliminary; claim tier toy; EV-CMFB-e3d1ec, EXP-CMFB-cea1d2,
    RUN-CMFB-2010d3 with VAL-20261019-1b97f5 and RT-20261019-520123. No ECDLP
    speed, rho comparison or pair-46-scale claim.
  corrected_reading_of_decision_impact: >-
    The contract's decision_impact.on_positive is replaced for all later
    citations by three separately sourced sentences (RT-O1 narrowest fix). (i)
    Coverage cannot exceed a constant: a theorem, ratio at most 1.582, KN-FIND-007.
    (ii) Measured: the small-x liftable-window base is exchangeable with a
    matched random base at resolution 0.5 percent (+-0.04 percent at C24) for the
    tested arms, unsigned m = 3. (iii) Decomposition cost, relation rank, linear
    algebra, CM-coupled bases and growth: not measured. The word 'channel'
    denotes the small-x window base only; the phrase 'candidate for scoped
    retirement of this channel' is not acted on by this decision.
