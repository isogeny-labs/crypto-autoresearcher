  context: >-
    EXP-CMFB-cea1d2 ran its eight frozen trials on 2026-10-19 (16 minutes wall).
    The mechanical classification recorded by t8 is NULL_AT_RESOLUTION. The
    independent validation VAL-20261019-1b97f5 returned passed with two
    spec-versus-code discrepancies (D1, D2). The red team RT-20261019-520123
    returned conclusion_requires_narrowing. The review plan
    (experiments/EXP-CMFB-cea1d2/reviews/review_plan.yaml) was written after both
    verdicts; see procedure_deviations.
  validity: >-
    Valid and complete for the tested scope. 8 of 8 trials, schema-complete
    manifests, one instance list (sha256 38cf5509...fa314), seeds 7001 to 7010,
    72 of 72 artifact hashes equal, all 26,331 coverage counts recounted by
    independent code (0 mismatches), controls and gates recomputed, all eight
    trials rebuilt from scratch with identical raw results (VAL M4, M5, M9, C1 to
    C10). No timeout, crash or retry; none is read as evidence.
  rationale:
    - >-
      The outcome the frozen rule produces is NULL_AT_RESOLUTION and it follows
      from the rule under both powered-cell readings (recorded {C24}, contract
      text {C20, C24}; VAL M7). At C24 every 95 percent interval is inside
      +-0.04 percent and at C20 inside [-0.074, +0.057] percent, against the
      declared delta of 0.5 percent. The instrument could have failed this test:
      the planted base was recovered in 7 of 8, 8 of 8 and 8 of 8 curves at
      +3.0, +1.2 and +0.5 percent. The evidence therefore supports H1
      (exchangeability) for the small-x liftable-window base at the tested
      scope. This is the data's content and the decision does not argue against it.
    - >-
      Strength is preliminary, not replicated or strong. One confirmatory pass on
      one seed set; the gate numbers were seen before the run (specification
      pre_freeze_disclosure); one powered cell by the recorded code and two by
      the contract text; no growth arm; the from-scratch rebuild is determinism
      on the same host, not replication on fresh instances; FAM is an exhaustive
      population and cannot be re-drawn inside the band; the planted gate has one
      rung and thin margins at C16 and C20. The from-scratch rebuild and the
      independent recount are strong evidence of execution integrity and of the
      counting implementation; they are not replication of a statistical
      conclusion.
    - >-
      `support` is withheld, for four reasons stated so that none is read as a
      quiet disagreement with the data. (1) The statement a `supported` status
      would certify is narrower than the sentence the contract attaches to it:
      decision_impact.on_positive says 'constant-only (no effect)' and 'candidate
      for scoped retirement of this channel for RQ-CMFB-33610e', which the red
      team shows exceeds the measurement (RT-O1, RT-O3, RT-O7). The ceiling of at
      most 1.582 is a theorem (KN-FIND-007) independent of this run, the tested
      base never touches the CM structure, and the unsigned convention is not the
      x-only one. (2) The recorded powered set, MDE and Holm values in t8 are not
      the contract's (D1), and no archived analysis applying the contract text
      exists yet. (3) The Coordinator's determination that D1 does not fire I9
      (below) is a judgment on which the standing of the run depends. (4) The
      claim is a single unreplicated observation of something narrower than the
      question; a first observation of a null that the Coordinator expected
      (post hoc, review_plan coordinator_prior) is not a license to retire a
      channel. `refine` (improve the experiment) is the transition that matches
      the next steps: fix the analysis record, then touch the structure the base
      did not touch.
    - >-
      `reject_scoped` and `weaken` do not apply: the data contradict no
      prediction of the hypothesis (it predicted the null), and no refutation
      artifact is needed. The FAM deficit (T negative in all three cells, C24
      -0.022 percent, recorded Holm p 0.094, 0.187 under the contract text) is
      not a detected deficit under the pre-registered rule; it is recorded as an
      exploratory descriptive row and not chased (RT-O6). `inconclusive` does not
      apply: the powered cells discriminate the null from effects of 0.04 percent
      or more at C24. `replicate` is not ordered for this contract: only the
      N-A and N-B arms could be re-drawn and nothing in them is surprising; a
      replication of the FAM sign needs the next cell up (C28, RC-4), which is not
      commissioned now (below).
    - >-
      Defects D1 and D2 are defects of the frozen analysis code. They are
      recorded with their measured effect in analysis.md and EV-CMFB-e3d1ec; the
      code and the recorded t8 are not edited. D1 (MDE inflation sqrt(3) x 1.0025
      against 'no inflation factor'): powered set {C24} instead of {C20, C24},
      FAM C24 Holm 0.0936 instead of 0.1872 (derived by the Coordinator from the
      recorded randomization p, equal to VAL M7), classification unchanged. D2
      (I10 against the superseded 0.49/sqrt(N) instead of the frozen
      1.4/sqrt(N)): a false positive in all nine arm-cells, ratios 0.815 to 0.971
      against the frozen reference. The frozen text, not the frozen code, governs
      where they differ; this applies the success criterion as written and
      changes none, so no protocol_amendment is required.
    - >-
      Determination on I9 (VAL D1 left it to the Coordinator). I9 is the
      agreement between the t8 tables and the recomputation in check.py, and that
      agreement holds. The affected fields (powered, mde, mde_ok, holm_p) are
      derived reporting quantities downstream of measured coverages that were
      independently recounted with no mismatch; the departure is in the
      conservative direction; the classification is invariant. R1 is not applied
      and the run is not voided. The alternative literal reading (any t8 table
      field differing from a contract-text recomputation voids the run) is
      recorded and rejected, with the consequence that, had it been adopted, no
      scientific reading would be made.
    - >-
      Success criterion (CLAUDE.md). The measured improvement of the small-x base
      over the current index-calculus baseline, a random factor base, is none:
      the base equals the baseline within 0.04 percent at C24 (interval ends
      -0.038 to +0.035 percent) and within 0.074 percent at C20 under the contract
      text. The result is neither an improvement nor a regression and is reported
      as such. Distance remaining to matched Pollard rho: no measured value
      exists. The red team's analytic, unmeasured estimate is index calculus over
      rho of 88 to 3400 at N = 2^24 across the 0, 0.1 and 1 GAE-per-unpriced-
      operation band, with the order holding across the band and the coverage
      constant (at most 1.582) moving it by less than the rounding of the model.
      It is quoted as context labelled estimate; this decision makes no
      cross-method comparison and ranks no arm (AGENTS.md section 5a is not
      triggered).
    - >-
      Roadmap bias (exponent-targeting over constant-cofactor). Every coverage
      measurement on this question is capped at a constant of 1.582 by the
      conservation theorem, so this lane cannot by itself yield an exponent. The
      cheapest remaining experiment on it (RC-2, a CM-coupled base) is worth
      commissioning because it is the only tested object that uses the
      structure the research question names, and because a null would retire the
      endomorphism-chain base at toy size with a named obstruction instead of an
      inherited one; it is ranked below exponent-targeting work and must not
      displace it. The decision is not paired with a heuristic-validation
      experiment at target scale: it does not dispatch a conditional result and no
      asymptotic claim is made.
