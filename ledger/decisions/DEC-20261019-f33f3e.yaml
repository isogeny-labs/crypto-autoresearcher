      classification, the transition is re-evaluated instead.
    - >-
      3. Commission the DESIGN, not the approval, of RC-2: a CM-coupled base on
      the same instrument. For each FAM and N-A member at C20 and C24, a base of B
      points {w^j(Q)} with labels l x lambda^j (lambda = 2/v mod N for FAM,
      (2 - a + b)/(2 b) mod N for N-A, from pi = (a - b)/2 + b w acting as 1 on
      G; verified per curve by [lambda]Q = w(Q) on the curve), against the same
      200 matched random bases, new contract, new seeds, pre-registered
      prediction from the red team's norm argument (chain bases collision-free
      only up to J near log_5(N/36) elements, far below B = N^(1/3), so the ratio
      should be 1.000 +- 0.0004 beyond that; unverified by the Coordinator).
      Fold in, as arms or controls of the same contract rather than separate
      experiments: the signed x-only convention (RC-3, mu_signed = 8 at this B or
      B halved to keep mu = 1) and a graded dose-response with k planted additive
      quadruples in {0, 5, 20, 80} at C20 and C24 (RC-5), so the 0.04 to 0.5
      percent range gets more than one rung. Route through /propose-ideas
      (the idea records the red team's RC-2 and its overlap check) then
      /design-experiment; the contract is approved only when it has a launcher and
      is runnable in the turn it is approved (AGENTS.md 'Approval is bounded by
      execution'). Check overlap first: H-CMFB-7d4e1a (EXP-CMFB-b36f58, review_
      required, no launcher) tests an arc of w-orbit points for the m = 2 BSGS-
      equivalence of the search cost, not m = 3 coverage; H-CMFB-c5e29b tests
      box-count dispersion of joint x-y windows. Do not duplicate them; reuse the
      launcher of EXP-CMFB-cea1d2 (count.py, curves.py, driver.py) by copy into
      the new experiment directory rather than editing it. Priority: low to
      medium; cost about four minutes of one C24 cell on 4 cores for 13 members
      (RT RC-2 estimate); it does not displace exponent-targeting work.
    - >-
