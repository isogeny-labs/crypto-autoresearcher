  decision: refine
  decision_label: >-
    Refine. Accept the run as valid; record a scoped null (small-x liftable-window
    base exchangeable with a matched random base for exact m = 3 coverage, at
    resolution 0.5 percent, toy sizes) as preliminary supporting evidence; hold
    H-CMFB-9b2eed at analyzed; order a zero-compute superseding analysis for
    defects D1 and D2; commission the design of a CM-coupled base on the same
    instrument.
