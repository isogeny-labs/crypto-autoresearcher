  conditional_enable:
    authorized_delta: >-
      After every enable prerequisite below is satisfied and recorded at
      final archive, change only TASK-20261028-20d746 in the published
      queue from state blocked to state queued and remove its stale
      blocked_reason, with the JSON comma adjustment required by that
      removal. Keep the queue-level publication_gate, every other task,
      artifact path, input, budget, and old batch byte-identical.
      The inherited publication_gate prose remains historical; the
      published decision records the current gate assessment.
    enable_packet: >-
      The two exact P receipt files, pre-claim-plan.json, this decision,
      its checkpoint, and the minimal queue edit may be archived in one
      verified, pushed, reviewable enable packet. The admission files may
      instead be in an earlier published packet. No separate earlier
      admission-file publication is required before editing the queue.
      All admission bytes and the enabled queue must be published and
      rechecked before any later P claim.
    prerequisites:
      - >-
        Merge current origin/main into the RELN authoring branch and
        validate the resulting tree before archival publication. Recheck
        present PR2651 and predecessor PR2645 states, the source ref,
        and exact queue/source objects. Any drift from the pinned packet
        requires reconciliation before this patch is used.
      - >-
        Include the exact verified P receipt002 and failed receipt001
        bytes, without replacing the failed attempt, plus a
        pre-claim-plan.json under coordination/goals/GOAL-RELN-001/
        batches/BATCH-0834cb/admission/TASK-20261028-20d746/.
        These three files do not exist at pinned head H. The plan
        must bind the proposed owner address, planned writer identity
        and authorization procedure, verified P model receipt/session,
        selected 90-minute claim TTL, source and ownership snapshots,
        exact worktree and scope, and the 19 source and 21 output
        identities. Actual claim epoch, expiry, and live-owner writer
        authorization remain null or ungranted. After a native claim,
        publish the separate epoch-specific note required by
        DEC-20261028-f430ff, binding the actual owner and epoch,
        freshly verified writer identity, and explicit live-owner
        authorization before any P output.
      - >-
        Recheck that receipt002's exact P session is still the intended
        read-only task session, with model, effort, cwd and sandbox
        unchanged. The proposed claim address is
        coordinator-reln-custody-20261028. The parent-reported candidate
        owning/writer session 01a179ee-06bf-7550-bc38-0d98c7e3b9c8
        has unknown serving model and no AUTORESEARCH runtime/model/policy
        marker. Freshly bind the actual owner and writer; if that session
        ended, use a newly authorized identity. The writer's model
        cannot substitute for P's verified model receipt.
      - >-
        The pre-claim-plan.json must record the selected finite 90-minute
        native P claim lease before its archive: P's 60-minute task
        wall-clock budget plus 30 minutes for completion and publication
        checks. This does not change P's 3600-second task budget,
        2 GiB memory limit, or maximum_runs=0. No claim epoch or expiry
        exists until the later native claim; verify the actual lease then.
      - >-
        Immediately before actual queue enable, refresh all remote refs
        and all six RELN lanes and their refs-aware native claims.
        Enforce goal-wide max_concurrent=1, confirm no conflicting live
        claim or owner, and do not take over another lane. Recheck all
        19 exact source identities and the source ref against the
        published bindings. Prior zero-live-claim and hash observations
        do not clear this gate.
      - >-
        In Conductor project experiments only, freshly verify P's exact
        declared directory scope, presence, and owner. Reconcile that
        result with native claims and the proposed accountable owner.
        The 17:41 snapshot does not clear this final gate. Missing,
        conflicting, stale, or ambiguous presence or ownership stops
        enable.
    failure_rule: >-
      If an enable prerequisite fails or remains unknown, keep P blocked
      and archive an exact impediment instead of publishing the queue
      patch. Do not substitute a model/session, force a claim, merge
      unrelated source changes, or modify old BATCH-79a580 bytes.
    after_publication: >-
      A queued P may appear structurally Ready under a fresh
      research_dispatch.py --claims refs check. That is neither task
      admission nor launch authority. Before a later claim, verify
      publication of the admission bytes and enabled queue; select
      the justified finite TTL with review slack; and recheck the
      exact P session, accountable owner, all six lanes and goal-wide
      claims, source identities, and Conductor experiments
      scope/presence/owner. Native goal_lanes.py assigns owner and epoch
      only upon an actual claim; use one --as owner and, if supplied,
      --session only for that claim owner's session. After claim and
      before any of P's 21 outputs, publish the separate epoch-specific
      owner-writer attribution note required by DEC-20261028-f430ff.
