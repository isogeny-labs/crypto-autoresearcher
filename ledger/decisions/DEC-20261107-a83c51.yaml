    reserved_not_written: DEC-20261107-7802ec
  rationale:
    - "The locator decides which bytes become S1 and S2 evidence. A self-consistent planted prefix that passes the wrapper, check_job.py and validity is exactly the sabotage the program assumes."
    - "objects.json is the only snapshot of the prefix that the job did not write. Binding to it is what turns the AMENDMENT-2 disclosure into a checkable claim."
    - "Every control is local and needs no spend. The design cost is small next to a paid S2 run on bytes known to admit a planted prefix."
  evidence_refs:
