coordinator_decision:
  id: DEC-20261024-85695c
  recorded_at: '2026-10-24'
  question_ids:
  - RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  kind: protocol_amendment_approval
  context: >-
    The owner's review of PR #2412 (discussion_r4320458095, 2026-10-20) found
    that the two mtic-010b successor contracts EXP-SEMAEV-6e9dcf and
    EXP-SEMAEV-88c46c keep their parent's invalidation clause, which
    invalidates any write to an experiment directory other than
    experiments/EXP-SEMAEV-93d5cc/, while their frozen argv and handoffs write
    their own run directories. The review asked for a Coordinator-approved
    correction before execution, preserving the approved bytes. Both trials
    had already run (RUN-SEMAEV-980e8c from 2026-10-19T01:30Z, interrupted;
    RUN-SEMAEV-0e5876 from 01:57Z, output_validated) when the review was
    posted.
  decision: approve
  decision_scope: >-
    APPROVES CORR-20261024-8df12c as a post-execution correction of the
    second invalidation rule of both successors, without editing their
    approved bytes (6e9dcf sha256 57658efd..., 88c46c sha256 7b45ae4c...) or
    repinning any hash. RULES on RUN-SEMAEV-0e5876: it stays in
    EV-SEMAEV-593b7a, qualified as below. Authorizes no trial and changes no
    hypothesis status.
  target_ids:
  - CORR-20261024-8df12c
  - EXP-SEMAEV-6e9dcf
  - EXP-SEMAEV-88c46c
  - RUN-SEMAEV-0e5876
  - RUN-SEMAEV-980e8c
  - EV-SEMAEV-593b7a
  - CORR-20261018-d51221
  - DEC-20261018-3b4a32
  - TASK-20261019-212d85
  authorization: Standing user authorization of 2026-09-06 in AGENTS.md and the owner's request of 2026-10-18.
  ruling_on_run:
    run: RUN-SEMAEV-0e5876
    literal_prior_rule_tripped: true
    standing: retained in EV-SEMAEV-593b7a as qualified evidence for the mtic-010b cell only
    basis:
    - No compliant execution existed under the prior text; the defect is in the contract, not in the run's conduct.
    - The clause's purpose holds on the record: all 16 written files are under the run's own handoff artifact_paths, no archived or parent file changed (tools/check_run_immutability.py).
    - The cell's outcome (every solve capped, regime (i), K* infinite in both arms) supports no new claim and changes no conclusion field; EV-SEMAEV-593b7a is already preliminary.
    qualification: >-
      This standing rests on a correction filed after the run. If the owner
      rejects a post-execution correction, the mtic-010b cell reverts to
      unmeasured: EV-SEMAEV-593b7a observation O6 then holds for MTIC-007 and
      -008 only, and the RUN-MTIC-010b entry of CORR-20261018-d51221 (lifted
      comparison bar) lapses. Nothing else in DEC-20261018-3b4a32 depends on
      this run.
    independent_revalidation: >-
      The independent-session re-validation already required by
      DEC-20261018-3b4a32 next_actions must also check CORR-20261024-8df12c
      observed_conduct (write paths and the read_scope disclosure).
  status_transitions:
  - record: EXP-SEMAEV-6e9dcf
    note: no change (analyzed)
  - record: EXP-SEMAEV-88c46c
    note: no change (failed_infrastructure)
  - record: H-SEMAEV-94dab2
    note: no change (analyzed)
  rationale:
  - A content-preserving correction keeps the approval boundary visible; editing the clause or repinning would hide that the run executed under a self-contradictory contract.
  - Disqualifying the run would discard a measurement whose conduct met the clause's purpose, to enforce a text no execution could satisfy; qualifying it and naming the reversal keeps the owner's call open.
  evidence_refs:
  - EV-SEMAEV-593b7a
  limitations:
  - The correction is post hoc; it does not meet the review's "before execution".
  - The successor handoff read_scope also omits the parent dependency runs the frozen argv reads (disclosed in CORR-20261024-8df12c).
  knowledge_promotion:
    promoted: []
    not_warranted: A contract correction is not evidence.
  next_actions:
  - Owner to accept or reject the post-execution correction on PR #2545; on rejection, apply the qualification above in a successor evidence record.
  - Future successor contracts rebind path-bearing invalidation and read-scope clauses to their own directories at freeze time.
  decided_by: coordinator
  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    runtime: claude_code
    fallback_used: false
    degraded_requirements: []
