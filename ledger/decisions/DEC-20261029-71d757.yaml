# DESIGN AND BATCH-OPENING DECISION for IDEA-20261023-f15270 (/design-experiment).
# Writes H-MONO-23d347 and the review_required DRAFT of EXP-MONO-1a1be2, opens
# BATCH-c53152 (blind re-derivation of L1-L6 and L8 under a review plan written first,
# proof-of-concept implementation, archives), and writes the BATCH-7ca353 checkpoint.
# It APPROVES NO EXPERIMENT, changes no hypothesis, idea or goal status, and launches
# zero runs. It takes effect only when the ledger archive TASK-20261029-37675c
# verifies. Written by a Coordinator subagent with no shell; every id was reserved by
# the top-level session, and the --check results belong in the 37675c receipt.
coordinator_decision:
  id: DEC-20261029-71d757
  task_id: TASK-20261023-111e6a
  archived_by: TASK-20261029-37675c
  mode: design (/design-experiment; no trials)
  decided_by: coordinator
  decided_at: '2026-10-29'
  authorized_by: >-
    Coordinator authority (agents/coordinator.md: approve experiments, reprioritize,
    open batches). DEC-20261023-19c53b NA-1 declared_successor_not_an_additional_next_action
    ("/design-experiment on IDEA-20261023-f15270 in a fresh Coordinator act (spare
    TASK-20261023-111e6a may be assigned to it). It covers the primary contract, the
    paired sampled validation arm and a proof-of-concept implementation task. Approval
    comes only after experiment_preapproval.py reports approvable: true. That act writes
    the BATCH-7ca353 checkpoint and closes the lane."). AGENTS.md "ECC comes first"
    rule 3. The standing user authorization (2026-09-06) is noted and NOT used: no
    contract here is complete and approvable ("Approval is bounded by execution").

  context: >-
    BATCH-7ca353 is complete: archives 5f803f2e47 (ledger) and eee021589a (snapshot,
    content_at_commit) verify under research_dispatch.py, as the top-level session
    reported; PR #2518 merged 2026-10-24; the branch
    claude/quotient-summation-ecc2k-130-4y7t3o restarted from origin/main 3d15b01ec1.
    IDEA-20261023-f15270 is the only open lead of the lineage and no record on main
    designs it. Its derivations L1-L8 are [D] or [P], written by the idea-generator and
    NOT independently re-derived; it recommends the blind re-derivation of L1-L6 first,
    then a design with arms A and B primary, arm C as the paired heuristic-validation
    arm and a proof-of-concept implementation in the same batch, and advises
    re-derivation "before a contract freezes the predicted values". DEC-20261017-12e0f4
    S-2 readiness blocker (c), implementation, is not cleared. portfolio_kpis
    --goal-backlog GOAL-PATH-001 reports approved_unrun 0 (advisory; reported by the
    top-level session).

  decision: approve
  decision_scope: >-
    Approves (1) option A' below; (2) H-MONO-23d347 as a proposed hypothesis and the
    EXP-MONO-1a1be2 specification as a review_required DRAFT with predictions marked
    provisional and readiness blockers B1-B6; (3) the opening of BATCH-c53152 with
    TASK-20261023-111e6a (this act), TASK-20261029-37675c (opening ledger archive),
    TASK-20261029-3ac467 (blind re-derivation, validator), TASK-20261029-a97206
    (implementation, executor), TASK-20261029-02a714 and TASK-20261029-fe6c9d (snapshot
    archives); (4) the review plan REVIEW-PATH-20261029-3ac467; (5) the BATCH-7ca353
    checkpoint and the closing of that lane after 37675c verifies. It approves NO
    experiment, protocol, runbook or run; EXP-MONO-1a1be2 has approved_by null and
    execution_authorized false.

  target_ids:
    - IDEA-20261023-f15270
    - H-MONO-23d347
    - EXP-MONO-1a1be2
    - BATCH-c53152
    - BATCH-7ca353
    - GOAL-PATH-001
    - RQ-MONO-001
    - KN-OPEN-62c870

  # ---------------------------------------------------------------- options
  options:
    rule: >-
      ECC first: RQ-MONO-001 and GOAL-PATH-001 are reported ECC (re-checked by 37675c
      LA-6), so every option is ECC work and ECC order does not separate them. They are
      separated by information per cost, by what each leaves on the critical path to an
      approvable contract, and by the rules that bind this step: "Open ECC ideas are
      designed, not shelved", "Approval is bounded by execution" (implementation is the
      design lane's), records immutable, predictions written before data and never
      re-dated.
    considered:
      - id: A
        what: Draft H and the contract now as review_required, predictions provisional; one batch with the implementation task and the blind re-derivation in parallel.
        for: >-
          Satisfies ECC rule 3 and the declared successor (contract, paired validation
          arm and implementation task in one batch). Puts the long pole, implementation
          (blocker B1, the missing launcher), on the critical path now. The re-derivation
          stays blind because every design artifact is in its blind_from. The
          IDEA's caution is honoured literally: nothing freezes until the approval act
          binds the composed re-derivation.
        against: >-
          If a joint breaks, the drafted values need a version-2 amendment before
          approval. Cost: one amendment with zero runs; no outcome can have informed it.
      - id: B
        what: Blind re-derivation alone as its own batch; defer the hypothesis and contract until it returns.
        for: Cheapest artifact that decides readings Y and the mean; no risk of drafting values that change.
        against: >-
          Serialises implementation behind the re-derivation for no information gain:
          the instrument is needed under every re-derivation outcome (T1, HEUR-F-1 and
          counter correctness are measured whatever L1-L6 turn out to be; a broken
          derivation makes the measurement more needed, not less). Leaves an open ECC
          idea undesigned (rule 3) and the missing launcher unscheduled. The
          implementation task could not be specified without a contract to implement.
      - id: C
        what: Design now; approve after implementation lands; no re-derivation.
        for: Simplest.
        against: >-
          Drops the cheapest decisive artifact the IDEA itself names and freezes [D]
          values that no second agent has derived. A self-consistent implementation of a
          wrong identity would pass its own checks (agents/coordinator.md "Review
          architecture" item 6).
      - id: N-0
        what: Do nothing.
        against: Leaves KN-OPEN-62c870 Q3 and the clause carried by two goal heads with no scheduled act; violates ECC rule 3.
    chosen: >-
      A' = A plus the design refinements DF-1 to DF-6. It ranks ahead of N-0 because
      both producers return a result under either outcome, and it keeps one lane.
    prior: >-
      Recorded before any work of this batch. About 0.85 that the composed
      re-derivation leaves every provisional value of EXP-MONO-1a1be2 unchanged; the
      most likely break is L4 or the 2-torsion term of the cancellation-free count;
      details in the review plan's coordinator_prior. About 0.8 that the implementation
      clears B1 and B2 in one task; the most likely shortfall is the arm-C compiled
      kernel at n = 2 (about 5.4e8 multisets). DEC-20261023-19c53b's 0.85 for
      CONVENTION_ARTIFACT_DIAGNOSED or CLAUSE_REFUTED_AT_TOY on the eventual run stands.

  design_notes:
    - id: DF-1
      text: >-
        P5 gains a per-tuple test and an exact finite-Q comparator, written before any
        data: on squarefree full-degree generic fibres, complete splitting must agree
        with "all chi(f(x_i)) equal" on every tuple (a single disagreement is a
        counterexample certificate against T1 at that cell), and phi_hat_n is compared
        within 3 SE with (p_plus^n + p_minus^n)/(p_plus + p_minus)^n computed from N and
        the root count of f, whose limit is the IDEA's 2^{1-n}. This sharpens PR-5
        without loosening it; the IDEA's 2^{1-n} is reported beside it. The n = 2 value
        is partially in sample (the m = 3 F_p freq_split informed the a51c82 formula), so
        the decisive scope is n = 3..5.
    - id: DF-2
      text: >-
        Arm C fields by a deterministic rule (least prime q > 3 with q^n >= 2^30); the
        IDEA's optional 2^36 extension (medium tier) is excluded from this contract.
        Point counting by baby-step giant-step suffices at these sizes, so no SEA or
        Schoof dependency is introduced; exhaustive counts cross-check it below 2^27.
    - id: DF-3
      text: Arm B fixed to the second q rung per n, 10^6 tuples per (n, curve), group-law cross-check on all locus tuples and a 1 percent generic subsample; arm-B curves are the arm-A curves.
    - id: DF-4
      text: >-
        L8 is added to the blind re-derivation (joint J5). It is the only lemma that
        speaks to the "WOULD/DOES move an exponent" clause directly, and it is cheap.
        L7 is excluded (OI-3).
    - id: DF-5
      text: >-
        Implementation KATs are restricted to cells disjoint from every contract cell
        (q in {5, 13}, n <= 3, plus prime fields) and compare each optimised counter with
        a naive enumeration from the same definition; no KAT asserts a convention
        identity or a predicted value. The KAT log is listed in P2's prediction
        provenance so the approval act re-checks it.
    - id: DF-6
      text: >-
        Arm D (the EXP-MONO-c819ba F_p fixture) is descriptive only, with no criterion.
        Overlap with H-MONO-663fb4 is handled by reading its fixture by key, not by
        re-measuring.

  readiness_and_blockers: >-
    EXP-MONO-1a1be2 is not runnable this turn and is not submitted to
    experiment_preapproval.py: no launcher, trial plan, protocol.json or runbook exists,
    so the probe could not return approvable true and no preview packet can be built.
    The exact blockers B1-B6 are in its readiness_blockers. The missing launcher is
    recorded in GOAL-PATH-001 next_action_2026_10_29 and impediment IMP-PATH-20261029-1
    (AGENTS.md "Approval is bounded by execution").

  open_items:
    - id: OI-1
      text: protocol.json (experiment.protocol/v1) is written, validated and frozen by the approval act (blocker B4); it needs a shell and the final predictions.
    - id: OI-2
      text: The experiment-director compile pass (runbook and mechanical task card) belongs to the approval act (blocker B5).
    - id: OI-3
      text: >-
        L7 (the general-m form of the DEC-20260802-a51c82 factor, [P]) is not tested
        here. Its consumer is GOAL-ICEX-001's mandated read. A zero-run key read of the
        F_p fixtures against L7 is a separate act, ranked when the ICEX lane next takes
        a design step; it is not decision-changing for this contract.
    - id: OI-4
      text: >-
        GOAL-PATH-001 stays a flat file. tools/shard_goal.py re-serialises every line and
        this act holds no shell; the file is well under the 64 KiB advisory. The
        BATCH-7ca353 checkpoint is appended additively to batch_checkpoints, which
        validate_ledger.py reads. Conversion is left to a later act that can stage it as
        its own commit.
    - id: OI-5
      text: >-
        This round is an ordinary blind re-derivation (validator, review-adversarial). If
        the composition leads to a knowledge entry that contradicts a validated evidence
        record or closes a lane, the composing act assesses AGENTS.md rule 12
        (review-breakthrough) before promotion.
    - id: OI-6
      text: The re-derivation round has one reviewer owning all joints (review plan PD-2) and an UNCHECKABLE blind-history check (PD-1); both are planned deviations, recorded before the round.

  # ---------------------------------------------------------------- batch
  batch:
    id: BATCH-c53152
    goal_id: GOAL-PATH-001
    dispatch_queue: coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/dispatch_queue.json
    review_plan: coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/review-plan.yaml
    tasks:
      - TASK-20261023-111e6a (coordinator; this act; completed on writing; archived by 37675c)
      - TASK-20261029-37675c (coordinator; opening ledger archive, ALONE, content_at_commit; closes lane BATCH-7ca353)
      - TASK-20261029-3ac467 (validator, review-adversarial, independent session; blind re-derivation J1-J5; zero runs; archived by fe6c9d)
      - TASK-20261029-a97206 (executor, executor-implementation; toolchain and KATs; zero runs; archived by 02a714)
      - TASK-20261029-02a714 (coordinator; snapshot of a97206, alone among commit tasks)
      - TASK-20261029-fe6c9d (coordinator; snapshot of 3ac467, alone among commit tasks)
    order: >-
      (1) Queue committed alone, rendered, lane opened (37675c LA-1). (2) 37675c alone;
      then close lane BATCH-7ca353 (LA-12). (3) 3ac467 and a97206 in parallel (disjoint
      write scopes; the re-deriver in its own worktree at the 37675c commit). (4) 02a714
      and fe6c9d each alone among commit tasks, in completion order. (5) A fresh
      Coordinator act composes and decides (NA-1 successor).
    max_concurrent: 2
    focus:
      decisive_evidence: the composed J1-J5 verdicts and a KAT-clean, snapshot-verified instrument
      inconclusive_decision: >-
        a joint returned inconclusive leaves its predictions provisional; the approval
        act may approve only with that prediction demoted to a reported, non-decisive
        quantity, recorded by amendment before any run
      excluded_peripheral_work: L7, reading C (solve or sign-finding cost), the 2^36 extension, the C-Q1d absorption check of IDEA-20260904-a1b81b
      rerank_trigger: >-
        a broken joint in J1-J3 (the cap or conservation), or an implementation report
        that arm C is infeasible at the rule's fields, sends the contract to a revision
        act before approval
      stage_budget: >-
        advisory, docs/research-budget-policy.md: re-derivation 14400 s, implementation
        28800 s, three archives about 6300 s together; the eventual run is about 96
        cells, counts in the specification, no timing claimed
    pairing_duty: >-
      Discharged in the same batch: arm C of EXP-MONO-1a1be2 is the sampled
      heuristic-validation arm (HEUR-F-1, HEUR-F-2, target-scale sampling, predicted
      Poisson CDF, tails T1-T4), and TASK-20261029-a97206 is the proof-of-concept
      implementation task (agents/coordinator.md "Dispatch bias";
      DEC-20261017-12e0f4 successor_after_this_lane (2)).
    review: >-
      TASK-20261029-3ac467 is the review round; a97206 is an instrument and changes no
      claim (review_required false), and the eventual runs get their own independent
      validation in the review-evidence step.

  conditions:
    - {id: OC-1, text: "The queue is committed alone and renders clean under tools/research_dispatch.py before 37675c stages anything."}
    - {id: OC-2, text: "tools/ecc_priority.py --classify reports ECC for RQ-MONO-001 and GOAL-PATH-001, with no budget violation (37675c LA-6). Otherwise stop; a fresh act uses spare DEC-20261029-ae39de."}
    - {id: OC-3, text: "The GOAL-PATH-001 diff is exactly the additive set in 37675c LA-3; status stays active."}
    - {id: OC-4, text: "Every reserved id is free under tools/allocate_id.py --check (37675c LA-5)."}
    - {id: OC-5, text: "The specification validates as a review_required draft and check_review_independence.py reports no plan-shape error (37675c LA-7)."}
    - {id: OC-6, text: "validate_ledger.py and check_merge_hygiene.py report no new error attributable to a staged path."}

  # ---------------------------------------------------- BATCH-7ca353 checkpoint
  batch_7ca353_checkpoint:
    written_to: ledger/goals/GOAL-PATH-001.yaml batch_checkpoints (appended item)
    lane_closure: tools/goal_lanes.py close-lane GOAL-PATH-001 BATCH-7ca353 --outcome archived, run by 37675c LA-12 after this decision verifies
    summary: >-
      Re-scope batch. Four tasks completed, zero runs: 18665a (rank, DEC-20261023-19c53b),
      5c6d48 (ledger archive 5f803f2e47), 4c12dc (IDEA-20261023-f15270 and its report),
      5bcc13 (snapshot eee021589a). Outcome: proposal written and archived; nothing
      approved, no status moved, no evidence produced.

  rationale:
    - R-1 The declared successor of DEC-20261023-19c53b is carried out as declared, and the lane it opened is checkpointed and closed.
    - R-2 Approval is withheld honestly: the contract cannot be made runnable this turn, so it stays review_required with six exact blockers, and the missing launcher is scheduled now in the same batch.
    - R-3 Blindness is preserved by construction: every design artifact of this act is in blind_from, and the re-deriver reads a card with quantities and parameters only.
    - R-4 Exponent bias is applied honestly. This lineage moves no exponent in either direction; it is ranked because it decides an exponent clause ("WOULD/DOES move an exponent") that two live goal heads and a mandated ICEX read carry, and L8, the exponent-class statement, is put under re-derivation.
    - R-5 The re-derivation uses the validator role at its ordinary policy, not review-breakthrough; a proposal's derivation check is not a claimed break, closure or contradiction of validated evidence (OI-5 keeps the later check).
    - R-6 A proposal is not evidence. Nothing here asserts any lemma, any measurement or any disposition.

  scope_and_limitations:
    - This act ran no tool and computed no hash. The ECC classification, the KPI, the archives and the PR are as the top-level session reported them; 37675c re-checks what it can. tools/autoresearch_focus.py was not run.
    - The IDEA and report were read in full; the KN-FIND premises were not re-read here; no run directory was opened.
    - The q_n and s_n values for arm C are given as expected values of deterministic rules; the generator's output binds (spec arms.C).
    - Toy tier throughout; KN-OPEN-62c870 CS-D2 and CS-R7 bind every later citation.

  visual_report:
    owed_by_this_act: false
    reason: >-
      A design and batch-opening act; it reviews no evidence, runs no search and no
      experiment. The IDEA's search-round report already exists
      (docs/reports/2026-10-23-idea-f15270-rescope/). A report, graph and PDF are owed by
