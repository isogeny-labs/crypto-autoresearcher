coordinator_decision:
  id: DEC-20261029-8b2734
  id_provenance: >-
    Pre-allocated by the top-level session with tools/allocate_id.py and confirmed free with --check; the Coordinator
    minted no id. The same holds for TASK-20261029-2c7b52, TASK-20261029-e54312, TASK-20261029-11526b,
    TASK-20261029-d7284b and the reserved EV-PFDR-28183c and DEC-20261029-8d9b43.
  recorded_at: '2026-10-29'
  decided_at: '2026-10-29'
  decided_by: coordinator
  session_provenance: >-
    Coordinator subagent, policy coordinator-orchestration-code, effort high, binding anthropic:claude-opus-5-5 as
    stated by the top-level session (not Bedrock). No shell: no hash in this record was computed by this session, and
    no command was run.
  goal_id: GOAL-PFDR-fd09e0
  batch_id: BATCH-924d2c
  question_ids:
  - RQ-PFDR-ae2fba
  mode: goal
  kind: review_round_opening
  decision: open_review_round
  decision_scope: >-
    Opens the independent /review-evidence round for EXP-PFDR-bb0d26 (H-PFDR-727bfc) in a new review lane BATCH-924d2c
    under the review plan written first, and dispatches three reviewer tasks and one ledger-archive task. Moves no
    status, writes no evidence record, approves no experiment, launches no run and promotes no knowledge. Toy scope
    only; nothing about any standardized or deployed curve.
  target_ids:
  - GOAL-PFDR-fd09e0
  - RQ-PFDR-ae2fba
  - H-PFDR-727bfc
  - EXP-PFDR-bb0d26
  - RUN-PFDR-e44a19
  - RUN-PFDR-4d8c71
  - RUN-PFDR-243425
  - RUN-PFDR-cd03e2
  - RUN-PFDR-089edc
  - BATCH-924d2c
  - TASK-20261029-2c7b52
  - TASK-20261029-e54312
  - TASK-20261029-11526b
  - TASK-20261029-d7284b
  context: >-
    DEC-20261022-9aec2b recorded the five trials of EXP-PFDR-bb0d26 as observations (tool strings outcome O-NULL,
    headline SUPPORT_SCOPED, adopted by no decision) and named as NA-1 an independent /review-evidence with a review
    plan written before any reviewer runs. DEC-20261029-5554ee ruled the audit's replay mismatch interpreter drift
    (CPython 3.11.15 recorded, 3.13.17 replayed; compensated sum()), kept the runs citable with analyze-main and
    analyze-final scoped, and constrained NA-1: replay under CPython 3.11 or a toleranced compare with the interpreter
    recorded, the audit reader's not_covered items as attack inputs, and a strictly blind re-derivation. That lane,
    BATCH-8d6d84, belongs to another session (coordinator-pfdr-1rfntm, branch gone, no live claim) and holds no review
    task, so this round opens its own lane. Base: origin/main 3d15b01ec1, branch review/pfdr-bb0d26.
  review_plan: coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/review-plan.yaml
  review_plan_summary:
    prior_location: review-plan.yaml coordinator_prior (recorded before any report; excluded from the blind owner's inputs)
    joints:
    - {id: J1, owner: TASK-20261029-2c7b52, role: validator, joint: blind re-derivation of the reading from the statement and raw job records}
    - {id: J2a, owner: TASK-20261029-e54312, role: validator, joint: 'execution integrity and reproducibility (3.11 replay, toleranced 3.13 compare, digests, manifests, seeds, raw/summary, report page 1)'}
    - {id: J2b, owner: TASK-20261029-e54312, role: validator, joint: 'measurement fidelity (kernel, curve orders, recount of sampled jobs including n >= 1024 and the planted arm by disjoint code, degenerate-job certificates)'}
    - {id: J3a, owner: TASK-20261029-11526b, role: red-team, joint: power and statistical sufficiency of the null}
    - {id: J3b, owner: TASK-20261029-11526b, role: red-team, joint: 'inference and scope, with the proves-too-much objects PTM-1 to PTM-5'}
    blindness: mutual, lifted_for empty; the blind owner works in a dispatcher-built tree without .git
    blind_rederivation_owner: TASK-20261029-2c7b52
    proves_too_much_owner: TASK-20261029-11526b
  export_ruling: >-
    No experiments/EXP-PFDR-bb0d26/export.json and no reviews/ directory exist (gaps G-1, G-2 of the plan). The export
    is excused for this round and not required to be produced: an experiment.export/v1 bundle binds a frozen
    experiment.protocol/v1 record by hash, this experiment was frozen on 2026-10-22 in the specification shape without
    one, and a protocol written now would be a post-data protocol presented as pre-registered. The owner rule is dated
    the same day as the design; the ruling does not depend on their order. An absent export is not a failing export;
    the reviewers read the hash-bound run packages directly. The gap is carried into the evidence record's limitations
    and into a non-blocking next action of the composing decision.
  dispatch_preconditions:
  - id: DP-1
    text: >-
      Merge origin/main into review/pfdr-bb0d26 (merge, never rebase); commit alone and by exact path the six opening
      files (review-plan.yaml, dispatch_queue.json, this decision, the four cards); run tools/validate_ledger.py; push;
      open or refresh a PR against main naming DEC-20261029-8b2734 and the four TASK ids; enable auto-merge. Every
      reviewer input must be committed and pushed before its reviewer starts.
  - id: DP-2
    text: >-
      Claim lane BATCH-924d2c with tools/goal_lanes.py (the tool writes the lane file), within the goal's
      max_concurrent; the queue's max_concurrent is 3.
  - id: DP-3
    text: >-
      Each reviewer runs in a fresh independent session under review-adversarial at xhigh with no fallback and no
      degradation; it is not the producer session, not the audit reader of AUD-20261029T012603Z-0b6353 and not this
      Coordinator; the served binding is recorded in its report. Each reviewer writes only its own write_scope and
      commits nothing; no two reviewers share a worktree.
  - id: DP-4
    text: >-
      For TASK-20261029-2c7b52 only: build the blind tree exactly as review-plan.yaml blind_rederivation.blind_input_route
      states (allowlist copies, blind-input-manifest.json, no .git, protected-literal grep with no hit). If any step
      fails, that card stays queued and the failure is recorded; the other two cards are not held for it.
  - id: DP-5
    text: >-
      If the repository hooks treat a replay or recount by TASK-20261029-e54312 or the PTM computations of
      TASK-20261029-11526b as a run launcher, fill .resume/RESUME.md (scripts/checkpoint.sh init) before dispatching
      them, per CLAUDE.md "Resume checkpoints". These are checks, not trials.
  status_transitions: []
  rationale:
  - >-
    The tool-computed reading is a candidate SUPPORT_SCOPED, and decision_impact.on_positive routes it to independent
    review before H-PFDR-727bfc may move to analyzed or supported. A claim-changing round runs under a plan written
    first (AGENTS.md "Review architecture"); the plan records my prior so that concurrence can be told apart from
    agreement with me.
  - >-
    The only re-derivation so far read run.py (audit-review blindness_disclosure), so it cannot see an implementation
    that is wrong and self-consistent with a reading of the specification. J1 is blind to the implementation, the
    outputs, the audit and every decision that quotes them, and works in a tree with no git history because commit
    messages on main state the producer's values.
  - >-
    The joints are split so each load-bearing step has exactly one owner: the reading (J1), whether the records are
    what the bound code produced (J2a), whether the counts are the true counts (J2b), whether a null at these cells
    could have been anything else (J3a), and whether the conclusion drawn follows and is scoped (J3b). The audit
    reader's not_covered items are assigned: the 3.11 replay and interpreter record (J2a), selftest replay (J2a), n >=
    1024 recounts and the planted arm by disjoint code (J2b), the unexercised replication path (PTM-1), the largest-|z|
    tail and correlation (J3a), and the non-blind re-derivation (J1).
  - >-
    A new lane keeps this session from writing into another session's queue; reviewers write only into
    reviews/<TASK-ID>/ of this lane, and exactly one archive task (TASK-20261029-d7284b) commits the round after all
    three return.
  - >-
    Scope: generated toy curves of 20, 24 and 28 bits, n from 256 to 4096, the frozen contract only. No transfer or
    extrapolation is assumed by any task of this round.
  evidence_refs: []
  inputs_cited:
  - experiments/EXP-PFDR-bb0d26/specification.yaml
  - ledger/hypotheses/H-PFDR-727bfc.yaml
  - ledger/decisions/DEC-20261022-f1efde.yaml
  - ledger/decisions/DEC-20261022-9aec2b.yaml
  - ledger/decisions/DEC-20261029-5554ee.yaml
  - experiments/EXP-PFDR-bb0d26/audits/AUD-20261029T012603Z-0b6353/audit-review.yaml
  - coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-8d6d84/dispatch_queue.json
  limitations:
  - >-
    Reviewer session identity, served model and filesystem isolation of the blind tree cannot be verified by this
    record; they are attested in each report and checked by the dispatching session. check_review_independence.py
    verifies declared reads, not truthful ones.
  - >-
    No protected_sha256 is declared because this session has no shell; the blind tree's lack of history replaces the
    commit-message check, and that is stated in the plan rather than reported as a pass.
  - >-
    The hypothesis file status (specified) disagrees with the official status by decision record (approved); left
    unedited at opening and handled by the composition's hypothesis_update_rule.
  - >-
    The toleranced replay tooling of TASK-20261029-1bcf80 has not landed at the base commit; J2a declares its own
    tolerance (rel 1e-9, abs 1e-12, float leaves only), matching check.py _close as cited in DEC-20261029-5554ee.
  next_actions:
  - id: NA-1
    rank: 1
    owner: top-level session, then the three reviewers
    text: >-
      Satisfy DP-1 to DP-5 and dispatch TASK-20261029-2c7b52, TASK-20261029-e54312 and TASK-20261029-11526b (up to three
      concurrently, each in its own session); when all three have returned, re-dispatch the Coordinator to compose
      EV-PFDR-28183c and DEC-20261029-8d9b43, then run TASK-20261029-d7284b alone. This is the single next action of
      GOAL-PFDR-fd09e0 lane BATCH-924d2c.
  opened_tasks:
