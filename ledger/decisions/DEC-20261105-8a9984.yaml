  claim_tier: toy
  proof_status: derivation
  scoped_claim: >-
    At c_probe 370, c_state 2100 and c_step 40 ns (assumed constants equal to
    IDEA-20261015-7a3c9e's n=83 inferred/assumed prices), BL constant 21/10
    and 10 states, run.py sha256 ef13257e... evaluates the stated closed-form
    online-time model in exact rationals: the reduced price ratio and the
    online ratio at each of (1000,2), (4000,2), (1000,4) are 925/4 and the
    probe counts 50, 200, 25 equal the enumerated BSGS maxima; a planted
    c_probe 371 gives 1855/8 and a planted 10-step precomputation gives
    185/42. An implementation written blind from the statement agrees on
    every value. This measures no price, latency, step count or cost, compares
    nothing with Pollard rho, ranks IC against Bernstein-Lange in neither
    direction, and makes no latency or n=83 statement.
  rulings:
    validity: >-
      Valid run set. The audit flag is a replay-coverage defect of the runbook
      replay.compare union list (absent-on-both scored as mismatch), not a
      value mismatch; no return to the Executor. Session RBS-ICPERF-8cdc92 is
      citable, scoped, in the sense of DEC-20261029-5554ee citability_meaning:
      any citation discloses the flagged verdict (matched 0 of 6), the
      row-level classification that carries replay assurance, and the
      undetected interpreter drift 3.11.17 -> 3.13.18 that changed no value.
      The audit stays flagged as recorded.
    labelling_ruling: >-
      For every reader of this experiment's records: (a) price_ratio_num,
      price_ratio_den, ratios_agree, all_match_bsgs and matches_preregistered
      are computed from frozen inputs, not measured, wherever runbook.yaml,
      reports/run-20261030T1520Z (report.typ, data.json) or a metrics export
      label them "measured"; only elapsed_seconds is measured. (b) 370, 2100
      and 40 ns are IDEA-20261015-7a3c9e's n=83 inferred (c_probe, c_state)
      and assumed (c_step) prices, so 925/4 = 231.25 is numerically the idea's
      "231 against the measured 235", and this pass adds no information to
      that comparison; 235x [61, 645] is unverified in the ledger. (c) The
      producer phrasing "no latency effect, no n=83 speedup" (PR #2776, as
      quoted in the review plan) reads "makes no latency or n=83 statement";
      the record closes nothing there. Frozen files stay unedited; an
      additive correction record carries this (NA-1).
    section_5a: >-
      No comparison against rho is made, so no band is owed (EV-ICPERF-08f6f9
      s5a_band). The red team's illustrative band shows that any order read
      from 925/4 would be set entirely by the price assumption (10/21 under
      uniform 0/0.1/1 GAE weights, [0.119, 1.905] across corners, 231.25 at the
      record's ns prices). No ranking in either direction is licensed.
    v1_runs: RUN-ICPERF-943efa and RUN-ICPERF-b09be8 stay invalidated and are cited by nothing in this decision as evidence.
