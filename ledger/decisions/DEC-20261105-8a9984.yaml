  decision: support
  decision_scope: >-
    Support of H-ICPERF-2f52d1 as stated, and only as stated: the integer
    identity at the three toy cells under the frozen assumed prices. Not
    support of IDEA-20261015-7a3c9e or any of its claims (1)-(4), the n=83
    arm, the 235x figure, any latency effect, any Bernstein-Lange or rho cost
    ranking, or any frontier row.
  target_ids:
