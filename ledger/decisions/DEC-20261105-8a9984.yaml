  hypothesis_status_ruling:
    hypothesis: H-ICPERF-2f52d1
    old_status: approved
    new_status: supported
    scope_of_status: >-
      The arithmetic statement at the three toy cells only. Interpretation
      limits of the hypothesis stand: a pass is not evidence that a measured
      n=83 deficit equals 235, and the alive conditions of IDEA-20261015-7a3c9e
      (host ratios at seven sizes, slope band, ordinary-curve control) stay
      open and untested.
    not_adopted: >-
      The proof obligation "the price formula is computed separately from the
      online times" is met by code reading and the blind re-derivation, not by
      any run assertion (red-team M7). CON-3 is not read as "IC equals BSGS on
      the quotient" at expected cost (worst case 50/200/25 against BSGS mean
      25.5/100.5/13.0).
  rationale:
    - >-
      Validity before interpretation: run count, schema-complete manifests,
      receipts, journal chain, raw/summary/report agreement and control
      comparability all hold under independent code (J1). Seeds are absent by
      design for deterministic arithmetic. The single audit defect changes no
      value, so the run set is evidence, not a return to the Executor.
    - >-
      The recorded values equal the out-of-sample preregistered integers and
      the blind re-derivation at every quantity, including the NEG-2
      non-integer bl_steps 105/2. That is the check that can see a wrong but
      self-consistent implementation, and it found none.
    - >-
      The coordinator prior (plan, written before any reviewer ran) expected a
      scoped instrument pass, a replay-coverage flag and strength preliminary
      at most. The review confirmed it, and added two things the prior did not
      foresee: the audit's parity check silently did not run, and the prices
      are the parent idea's n=83 estimates, which makes 925/4 its 231-vs-235
      figure.
    - >-
      Strength preliminary: one deterministic execution per unit, flagged
      audit, no pcc claim, four mutants passing every assertion, and content
      that holds by construction. A replication would reproduce an identity,
      not an effect, so none is commissioned.
    - >-
      Support, not refine: the hypothesis says what was tested and its
      interpretation limits already fence the parent claims. The defects found
      are in labels, exports and audit tooling, and are handled by an additive
      correction and tooling tasks, not by a new hypothesis.
    - >-
      Research direction: this is a constant-level accounting instrument with
      no exponent content. Its value is to clear the instrument so that the
      parent idea's receipt-reading stage can be ranked on its merits; it is
      not itself a lead.
