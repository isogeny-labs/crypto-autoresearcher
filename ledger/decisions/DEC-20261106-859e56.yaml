  source: isogeny-labs/crypto research/ic_line_layout_tournament_20261031/DECISION-V6-REDESIGN-20261106.md (sha256 7556377eab6d9c50b1c83e9549f572c056f5f1850feb364d47f4a29990eeceaa at commit c1300fbdb; transcribed
