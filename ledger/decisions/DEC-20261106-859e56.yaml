  limitations:
  - The weaken rests on empirical_only evidence from two valid sessions on two host epochs; no mechanism explains the slowdown.
    The validator's descriptive phase split (about 44 % of the extra wall in oracle_setup, about 55 % in relations) is a
    pointer for reopening condition (1), not evidence of a cause.
  - Host epochs are instances, not necessarily distinct physical machines; the scope says host epochs, nothing finer.
  - The counted session's wall block of counted-compare-incumbent__candidate-w0.1.json was exposed to the Coordinator after
    every verdict had been written; it is unused and unreported.
  - The analysis outputs were written to scratch paths, not the frozen reports/v6/analysis-{a,b}; the validator confirmed
    the copies byte-identical (26/26 non-empty files).
