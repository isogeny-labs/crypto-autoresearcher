      source_anchor: "review.md \xA77; blind-rederivation.md \xA7\xA76\u20137"
  limitations:
  - The invariant is attached to the specified generator lists; equality of their affine ideals does not make
    it an affine-ideal invariant.
  - Both exact rejection predicates must be nonzero. A zero predicate loses the stated guarantee; constant1
    gives a unit ideal and trivial inconsistency.
  - The elliptic application retains p>3, a nonsingular curve, finite rational target with nonzero ordinate,
    s>=2, injective affine bit maps with nonzero weights and 2^s<=p.
  - The tensor lemma for m>=2 is algebra only; it does not authorize rational-membership augmentation for arbitrary
    higher-summand systems.
  - New-window construction does not alter an existing fixed-domain problem and does not guarantee a useful
    nonempty factor base or relation yield.
  - Uniform independent coordinate sampling is required for the expected search bound; a deterministic scan
    can require p tests. Dense membership construction is exponential in s.
  - No formal proof-assistant verification, novelty finding, implementation validation, solving-degree or first/last-fall-degree
    reduction, measured speedup, scalar recovery or general ECDLP advantage.
  - One independent reviewer performed two separately recorded phases; this is not two independent reviewers
    or models. Model/effort are dispatch-reported; no provider probe was performed.
  - Archival order and the reveal event are recorded; the exact first-reveal wall-clock timestamp was not separately
    captured.
  - The initial native checker failed on two Git source-identity aliases. A documented post-review infrastructure
    repair passed the unchanged attestations; original failure and sparse-test import failure remain retained.
  - The historical PNEXT native invalid_output receipt remains unchanged. Its empirical work claims and supplemental
    replay were not revalidated or used as proof evidence here.
