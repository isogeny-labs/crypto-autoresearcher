  rationale:
  - Coordinator inspected the immutable proof, independently archived blind derivation and all seven comparison
    arguments. Each assigned comparison joint is holds under the stated hypotheses.
  - The exact baseline has both vanishing and nonvanishing witnesses; complement multiplication supplies the
    strict conditional augmented bound.
  - An explicit rational line factorization establishes two-summand rational lifts, including coincident-coordinate
    cases; the split reduced Boolean algebra establishes equality of affine ideals.
  - The corrected native checker passes both unchanged attestations and the composed prospective plan; archived
    technical regression evidence records113 passing tests including9 new identity cases. These are infrastructure
    tests, not scientific trials.
  scoped_claim:
    definition: d_reg(F)=min{d:(F^top)_d=R_d}, using the highest homogeneous parts of the supplied generators.
    baseline: d_reg(F0)=s+ceil((s+2)/2)=1+s+floor((s+1)/2).
    augmented: d_reg(F1)<=s+floor((s+1)/2)=d_reg(F0)-1 when both exact multilinear block rejection predicates
      are nonzero.
    affine_statement: (F0)=(F1) in the same affine Boolean polynomial ring; both encode the same two-summand
      solutions.
    unit_exception: If either rejection predicate is constant1, d_reg(F1)=0 and the system is inconsistent.
    algebra_only_extension: 'For m>=2,1<=e<=s,nonzero block weights and characteristic0 or p>s: baseline (m-1)s+ceil((s+e)/2);
      nonzero homogeneous block predicates give upper bound (m-1)(s-1)+ceil((s+e)/2).'
