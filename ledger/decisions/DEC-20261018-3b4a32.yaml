coordinator_decision:
  id: DEC-20261018-3b4a32
  recorded_at: '2026-10-24'
  question_ids:
  - RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  kind: evidence_review
  context: >-
    Review of the matched legacy/repaired s4_expr rerun EXP-SEMAEV-93d5cc
    (with successors EXP-SEMAEV-88c46c, interrupted, and EXP-SEMAEV-6e9dcf)
    for H-SEMAEV-94dab2, under the review plan
    experiments/EXP-SEMAEV-93d5cc/reviews/review-plan.yaml (written and
    committed before any trial finished). Validation TASK-20261018-83a561
    (VAL-20261024-c8a775) passed on all seven validated runs.
  decision: replicate
  decision_scope: >-
    Records EV-SEMAEV-593b7a (supports, scoped; preliminary) and files
    CORR-20261018-d51221, which supersedes the archived ICINV m4 secondaries
    and the FIB C16-1 cost, basis, correlation and C16-2 count fields with
    the repaired-arm values, and lifts the CORR-20260813-d9f0fa comparison
    bar for the unchanged MTIC and FIB-005 fields. H-SEMAEV-94dab2 moves to
    analyzed, not supported: the validator was not an independent session
    (procedure deviation below). The next step is an independent-session
    re-validation of the seven run records, not a rerun; a later decision may
    then move the hypothesis to supported in the scope of EV-SEMAEV-593b7a.
  target_ids:
  - H-SEMAEV-94dab2
  - EXP-SEMAEV-93d5cc
  - EXP-SEMAEV-88c46c
  - EXP-SEMAEV-6e9dcf
  - EV-SEMAEV-593b7a
  - CORR-20261018-d51221
  - CORR-20260813-d9f0fa
  - TASK-20261018-83a561
  - TASK-20261018-dd817e
  evidence_refs:
  - EV-SEMAEV-593b7a
  rationale:
  - The arm contrast is one-factor and isolated, and the legacy arm reproduced every deterministic archived field, so the observed changes are attributable to the defect.
  - The deterministic changes (ICINV m4 tuples, C16-1 bases) are exact and the ICINV values were blindly re-derived; the timing-derived ones rest on one execution per arm.
  - The capped cells cannot discriminate the two polynomials (validator saturation caveat), so their unchanged outputs close only the archived-number question, not the cost question.
  procedure_deviations:
  - deviation: >-
      The validator for TASK-20261018-83a561 ran as a subagent of the session
      that designed and executed the experiment; its handoff required
      independent_session_required true. Its blindness to the run report and
      to draft records was honoured (it reports not opening them), but
      session independence was not met.
    effect: evidence strength capped at preliminary; the hypothesis status transition is limited to analyzed
    remedy: an independent-session re-validation task before any move to supported
  status_transitions:
  - record: H-SEMAEV-94dab2
    from: approved
    to: analyzed
  - record: EXP-SEMAEV-93d5cc
    to: analyzed
    note: six cells output_validated; its mtic-010b cell measured by EXP-SEMAEV-6e9dcf
  - record: EXP-SEMAEV-6e9dcf
    to: analyzed
  - record: EXP-SEMAEV-88c46c
    to: failed_infrastructure
    note: its only trial was interrupted by a container restart; not evidence
  - record: H-MTIC-001
    note: no change
  - record: H-FIB-001
    note: no change; review requested below
  - record: H-ICINV-d5e351
    note: no change
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Decision is replicate at preliminary strength; promotion of the scoped
      finding waits for the independent-session re-validation. The open
      problem KN-OPEN-5b3a08 is updated by the successor action below, not
      here.
  next_actions:
  - Open an independent-session validator task re-validating the seven EXP-SEMAEV-93d5cc/-6e9dcf run records against the same review plan.
  - Coordinator review of H-FIB-001 in light of the C16-1 band change (rho_s -0.024 to -0.366) recorded in CORR-20261018-d51221; no status change implied here.
  - Supersede KN-OPEN-5b3a08 Q1's numerical-impact question with these results (DECISION-REQUEST-20261018-ic-integrity R-1.1/R-1.3), keeping Q2 (cofactor confound) open.
  - Decide whether EXP-DTREE-b93a15 (approved, unrun, fix-only recomputation of the same MTIC/FIB runs) is withdrawn as subsumed by EXP-SEMAEV-93d5cc.
  limitations:
  - Toy tier; one execution per arm; host-dependent caps.
  - No ECDLP, cost, speedup or security claim.
  decided_by: coordinator
  inference:
    policy: coordinator-orchestration-code
