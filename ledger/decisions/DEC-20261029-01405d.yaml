      No threshold was moved after the runs.
    - >-
      The instrument could have seen a deviation. The weakest powered cell would read a true |kappa - 1| >= 0.079
      as non-null with 95% probability, and the planted AP reads flagged everywhere. The A/A arms do not flag
      above nominal. The null is therefore informative at the 5% tolerance.
    - >-
