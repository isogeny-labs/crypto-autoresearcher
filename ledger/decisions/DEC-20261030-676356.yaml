  limitations:
  - Finite fixed execution plus source review is not universal implementation correctness, a formal proof, novelty,
    a degree reduction, runtime advantage or general prime-field ECDLP speedup.
  - No certificate-finding/search efficiency is established. The generic arithmetic identity works modulo p without
    proving primality; EC semantics retain the external prime premise.
  - The API receives decoded mappings. It rejects mask aliases but cannot certify a raw JSON parser against duplicate
    identical textual keys.
  - Only the completeness phase avoids full-cube enumeration. Test-only tiny enumeration and direct old verification
    are intentional. Membership truth tables and the exact auxiliary exclusion list may remain large.
  - Projected-model completeness differs from all-full-root enumeration; gaps are not arithmetic models and censored
    status is not promoted.
  - Future partial-trail arbitrary-literal clauses require a different proof/completeness interface or explicit
    prefix restriction with conversion costs. No such search change is admitted.
  - One independent reviewer is not a quorum. Requested native runtime/model/effort are not authenticated serving
    identity; opaque UUID remains unknown.
  - All original files/receipts/statuses remain unchanged, including historical PNEXT invalid_output and the earlier
    source-review execution-inconclusive record.
