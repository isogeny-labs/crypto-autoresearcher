      reviewer_verdict: holds
      independent_counts:
        cases: 66
        assertion_evaluations: 66
      coordinator_assessment: All66 fixed schema cases reject the designated malformed inputs, including bool/float
        values, int/string mask aliases, invalid coefficients, wrong components and malformed items after a closing
        proof.
    prefix_identity:
      reviewer_verdict: holds
      independent_counts:
        cases: 18
        assertion_evaluations: 41
      coordinator_assessment: Separate variable-set restriction/multiplication confirms the fixed nonconstant identity;
        all specified coefficient, restriction and clause mutations are rejected.18 cases and41 assertion evaluations.
    model_fiber_scope:
      reviewer_verdict: holds
      independent_counts:
        cases: 9
        assertion_evaluations: 33
      coordinator_assessment: Models and domains are checked before blocking projections; distinct auxiliary assignments
        with duplicate projections are rejected. The fixed fiber has four full roots but only two returned projections.9
        cases and33 evaluations.
    exact_domain:
      reviewer_verdict: holds
      independent_counts:
        cases: 19
        assertion_evaluations: 64
      coordinator_assessment: Fixed CNFs agree with independently derived numeric bounds. Missing, duplicate, below-bound,
        mixed-projected and partial clauses fail. Empty-domain inputs still validate all supplied records.19 cases
        and64 evaluations.
    coverage_and_censoring:
      reviewer_verdict: holds
      independent_counts:
        cases: 5
        assertion_evaluations: 96
      coordinator_assessment: Independent small-domain coverage agrees; a hole rejects a complete claim and a covered
        censored transcript remains censored. The synthetic n256 constant-refutation fixture uses one depth-zero
        prefix and one node.5 cases and96 evaluations.
    legacy_integration:
      reviewer_verdict: holds
      independent_counts:
        cases: 28
        assertion_evaluations: 1578
      coordinator_assessment: The fixed p5 cell in all four arms agrees with unchanged verify_search for complete/censored
        acceptance and all five fixed negative mutations. Separate curve arithmetic gives exactly(2,3),(3,2),(3,3).28
        cases and1578 evaluations.
    actual_execution_custody:
      reviewer_verdict: holds
      independent_counts:
        cases: 3
        assertion_evaluations: 9
      coordinator_assessment: One independent suite returned0; all target/harness hashes match before/after/current
        bytes, no forbidden-entry sentinel fired and no repair followed.3 cases and9 evaluations.
  scoped_claim:
    api:
    - verify_transcript(p,n,projected_bits,polynomials,domain_cnf,answer,aux_bound=None)
    - verify_encoding_search(cell,arm,answer)
    arithmetic: Canonical sparse Boolean-quotient polynomials and every restricted multiplier identity sum(q_i*f_i)=1
      are checked modulo integer p>=2. Mathematical primality is not certified.
    projected_completeness: After individually verifying roots and excluding duplicate projections, verified model
      cylinders and refuted prefix cylinders must cover the supported domain for declared complete. An actual root
      avoids refuted cylinders and therefore has a returned projection. This does not assert every auxiliary assignment
      within a model cylinder is a root or return all full roots.
    domain: Full Boolean cube or the exact legacy full-width auxiliary-range CNF, validated through shape, distinct
      excluded values and cardinality. Arbitrary CNF is unsupported.
    status: Censored stays censored even when cover_complete is true. A returned uncovered value is only a coverage
      gap, not a claimed arithmetic root.
    wrapper: Fixed legacy build and reconstruct are reused; curve/target/digit premises checked, prime-field interpretation
      conditional on mathematical primality. Four named encodings supported; no expected-model census is an operational
      argument.
    fixed_legacy_observation: For p5,a=b=1,s2,R(0,1), all four arms agree on projected coordinates[(2,3),(3,2),(3,3)]
      and packed projections[11,14,15]. Full canonical witnesses are[11,14,15] in quartic/membership and[11,14,79]
      in quadratic variants.
    large_fixture: n256 constant1 refutation is a fixed synthetic software case with one depth-zero prefix/node
      and one identity term-pair multiplication; not a256-bit curve or ECDLP result.
    costs: Parsing/restriction/identity/model/domain/trie counters remain separate from wrapper construction and
      reconstruction. Trie/input work follows number of prefixes+sum depths, with at most1+sum depths nodes and
      additional integer/input/output costs. Supplied certificates and range CNFs may be large; membership build
      retains full truth-table work.
