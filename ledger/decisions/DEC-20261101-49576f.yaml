    note: specified unchanged
  - record: EXP-PFDR-ada71b
    note: review_required until preapproval reports approvable true
  goal_update: next_action becomes the EXP-PFDR-ada71b preapproval and approval, then /run.
  next_actions:
  - Run tools/experiment_preapproval.py on the EXP-PFDR-ada71b packet; approve under
    DEC-20261101-cb3277 only on approvable true.
  - /run EXP-PFDR-ada71b under TASK-20261101-8951b8 after approval and the snapshot
    archive TASK-20261101-125ee4.
  knowledge_promotion:
    promoted: []
    not_warranted: Design decision; no result.
