  context: Theory-only grouped-indicator synthesis after an outcome-independent fresh replacement review; the
    original failed review procedure and outputs remain preserved.
  decision: approve
  decision_scope: Approve scoped archival acceptance of the frozen producer algebra and source-qualified upper
