  decided_at: '2026-10-29T19:00:43.644308+00:00'
  rationale:
  - Coordinator compared the exact frozen producer bytes with the actual fresh independent derivation; all eight
    joint conclusions agree within the frozen scope.
  - Local models and inverse maps establish exact affine correspondence; homogeneous local normal monomials give
    the upper bound and an independent top-degree nonvanishing argument gives raw even-s equality.
  - Weighted Lefschetz is applied blockwise at p>s; exact ranks establish both sides of the original threshold.
  - The unchanged native independence checker passed the sole successor attestation, with no post-dispatch administrative
    exchange; all input hashes match. Original failed receipt is not repaired or reclassified.
  scoped_claim:
    definition: d_reg(F)=min{d>=0:(F^top)_d=R_d}, for the highest homogeneous parts of the explicit listed generators.
    local_field_scope: Any field; actual nonempty bit groups of widths w_g.
    general_encoding: One indicator for each nonzero group word; u_a^2-u_a and u_a*u_b (a<b) local constraints;
      all-zero indicators represent the zero word.
    affine_statement: Explicit bit projection and assignment-indicator inverse give exact bit-model bijection
      and isomorphic affine quotients in different ambient rings. Coordinate injectivity, if wanted, is a separate
      premise.
    local_hilbert_series: product_g(1+(2^w_g-1)*T)
    general_full_upper_bound: d_reg(full grouped list)<=G+1, with all local equations retained; equality is not
      universal.
    prime_s3_hypotheses: p>max(3,s), even s>=2, nonzero original bit weights, two disjoint s-bit coordinate blocks,
      nonsingular short Weierstrass curve and finite rational target R=(r,t), t!=0. Pair groups stay within each
      coordinate.
    generator_lists: 'Original: 2s Boolean equations plus raw fixed-target S3. Grouped: all 6s local indicator
      quadratics in 3s variables plus raw substituted S3; no circuit auxiliaries or affine reduction.'
    baseline: d_reg(F0)=s+ceil((s+2)/2)=1+3s/2 for even s.
    grouped_raw_even: d_reg(Fg)=s+1 for even s>=2.
    strict_regularity_difference: d_reg(F0)-d_reg(Fg)=s/2, while variables increase from 2s to 3s.
    solving_degree_upper_bound: sd_sigma(Fg)<=max(d_reg(Fg)+1,4)=s+2, under Salizzoni Definition 2.5/Proposition
      3.10 and degree-compatible mutant closure.
  proof_status: derivation
  evidence_strength: independently_checked_symbolic_derivation_one_admissible_blind_reviewer
  claim_tier: scoped_generator_dependent_algebraic_result
  per_joint_verdicts:
    local_models:
      reviewer_verdict: holds
      coordinator_assessment: Zero and unit states over any field, including the zero word.
      producer_and_review_anchors: Sections 2; Joint 1
    bijection_and_ideals:
      reviewer_verdict: holds
      coordinator_assessment: Explicit inverse maps preserve bit assignments and induce affine quotient-ring isomorphisms;
        no equality of ambient ideals.
      producer_and_review_anchors: Section 2; Joint 2
    representation_counts:
      reviewer_verdict: holds
      coordinator_assessment: Actual-width counts agree; even-s paired lists use 3s variables and 6s local quadratics,
        plus S3.
      producer_and_review_anchors: Section 3; Joint 3
    hilbert_series:
      reviewer_verdict: holds
      coordinator_assessment: Local highest-part Hilbert series is product_g(1+(2^w_g-1)T); the full quotient
        may be smaller.
      producer_and_review_anchors: Section 3; Joint 4
    regularity_bound:
      reviewer_verdict: holds
      coordinator_assessment: General full upper bound G+1; independent nonvanishing proves equality s+1 for the
        frozen even-s raw S3 list.
      producer_and_review_anchors: Sections 3-4; Joint 5
    baseline_comparison:
      reviewer_verdict: holds
      coordinator_assessment: Separate s-variable Lefschetz ranks and a surviving preceding-degree component give
        the exact original baseline.
      producer_and_review_anchors: Section 4; Joint 6
    solving_degree_transfer:
      reviewer_verdict: holds
      coordinator_assessment: Salizzoni mutant closure and degree-compatible order give sd_sigma<=s+2; raw input
        degree four is retained at s=2.
      producer_and_review_anchors: Section 5; Joint 7
    cost_and_scope:
      reviewer_verdict: holds
      coordinator_assessment: Variable growth, unchanged state count, expanded quartic, matrix and reconstruction
        costs prevent an unearned performance claim.
      producer_and_review_anchors: Section 6; Joint 8
  reviewer_extensions_outside_acceptance:
    observed_in_both_reports:
    - For paired actual widths, raw and locally reduced S3 thresholds 2*ceil(s/2)+1, with separate reduced s=2
      proof.
    - Odd-s strict threshold difference floor(s/2), and corresponding mutant-closure upper bounds.
    disposition: Retain as reviewer-derived extensions, not silently added to the frozen producer acceptance.
      Separate explicit adjudication is needed before claiming a broader accepted theorem or promotion. The original
      report still fails its procedural gate.
