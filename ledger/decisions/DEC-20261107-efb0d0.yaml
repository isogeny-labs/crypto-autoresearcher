  rulings:
    - "R1 (ruling quarantine). RBS-SEMBIN-24ec56 is quarantined as a whole. This covers chain B on main (blob e8e6357d, tip eb3ee32b) and chain A on origin/claude/index-calculus-ecdlp-ecc2k-rm3mrv (blobs 6a77a91a, fdea491e and f9bc11b7 at commit 9fc0d78b5e, tip 7a8329e2 as the reader reports). It also covers every unit, step log, receipt and run directory either chain records, including the 17 producer receipts that DEC-20261030-a44f55 counted. Quarantined material is kept byte-for-byte. It is not evidence about H-SEMBIN-106967 or any other record. No evidence review, validation gate, synthesis, roadmap ranking or knowledge entry may cite it as a measurement. No chain is a continuation prefix of the other. The session id is never reopened, resumed or re-claimed. Neither chain is ever merged onto the other at the shared path."
    - "R2 (not replay, not clear). Replay is impossible because the chain on main has no valid unit, and the audit had zero replay power. A clear ruling is excluded by the identity finding (two executions under one session id) alone."
    - "R3 (escalation to an independent validator not ordered now). On main's tip there is nothing to validate. For chain A, the only validation route is TASK-20261030-d34252, which is blocked with 'do not reoffer'. Its frozen source pins (fdea491e, 11 rows) are now a strict prefix of a 52-entry tip, as the reader reports. Under F2, output_validated does not imply validity under the specification. A future validator review of chain A's receipts therefore needs a re-scoped successor custody plan, pinned to the current tip, and that is a separate Coordinator act. This ruling does not foreclose it."
    - "R4. The extension of chain A at attempt 5 on 2026-10-31 is recorded as an open custody defect, not adjudicated here. It came after the original task was blocked (DEC-20261030-a44f55), on a branch main does not contain. Any later custody review must answer whether that claim was authorized and whether attempt 5 wrote or only reconciled receipts."
    - "R5. Attempt 1 of chain B (the dispatcher's ancestry refusal, whose cause the reader could not reproduce) is infrastructure signal. Its control_validity 'failed' means controls not run, not controls measured to fail. None of it is evidence for or against H-SEMBIN-106967."
    - "R6. Runbook sha256 2996f44f854ecb70712ddca4ef64e31888467cdaa37dbea739824c717d38fd5c and trial plan sha256 ced00bdae527379d627263a4c9befcc3eb97f015c06b222da26899619acfb7c5 may not drive any further session. A successor needs a versioned protocol_amendment that adds hypothesis_id with hash rebinding (MSG-20261106-e9aeae) and fixes F1 to F3 without changing any success criterion. It also needs fresh run ids, a new session id, red-team review and a Coordinator approval decision. Only then may it run, and only via /run. DEC-20261018-9262ac remains the record of the original approval. It authorizes no further execution under RBS-SEMBIN-24ec56."
    - "R7. TASK-20261030-d34252 and TASK-20261030-459b12 keep their present queue states. This decision neither reoffers nor cancels them."
