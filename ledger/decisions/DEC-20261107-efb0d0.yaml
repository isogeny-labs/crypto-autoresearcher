  rationale:
    - "Quarantine is the only ruling that keeps both chains intact without treating either as authoritative. The two chains have different genesis entries, owners and claim epochs under one session id, and one was extended after its task was blocked. Under docs/pcc.md, an unexplained continuation is treated as possible sabotage until a custody review explains it."
    - "Replay needs a valid unit, and none exists on main. Clear needs a session whose identity and chain hold, and this one fails that test."
    - "Escalating now would send a validator to a session with nothing to check on main, or to a chain whose frozen review pins are stale. The defects that block progress (F1, F2, the missing hypothesis_id) are protocol defects. Only a versioned amendment can fix them."
