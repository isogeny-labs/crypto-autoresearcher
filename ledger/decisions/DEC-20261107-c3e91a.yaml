  rationale:
    - "K-7 exists because sabotage is assumed. An allowlist that silently drops the only network path makes the run fail. One that admits proxy and CA variables unpinned re-opens the endpoint attack K-7 closed. Pins with recorded values satisfy both."
    - "The BASH_ENV, SHELLOPTS/PS4 and imported-function vectors act before any script line, so only the argv can close them. The argv is director-owned and costs nothing to change."
    - "Credential variable names do not pin the credential source. Requiring the environment keys and disabling IMDS does, at no cost in the executor container."
    - "Fewest steps that keep custody sound: the red team must judge the bytes that will run, and only the director may produce them."
