  rationale:
  - >-
    Independent TASK-20261019-52baee assigns V1 and V2 to one fresh review thread and reports holds on both. Its pre-code derivation records the frozen plan digest, P1-P4 IDs, owners and full statements before checker and author-test reads. Its sources_read omits the blinded scientific reports. The sealed report and attestation hashes match the completed release and verified two-file snapshot.
  - >-
    The independent review reports 21 cases: the exact pinned baseline passed and all 20 false mutations rejected. Empty or whitespace P3 and swapped P3/P4 plan bytes fail external digest admission; a scalar verdict for the two-joint Red Team owner fails required per-joint mapping. Wrong owner or ID, duplicate ID, missing attestation or verdict, invalid verdict, sibling read and blind_from mutations also reject. Direct check() rejects empty, whitespace and ID-only explicit statements.
  - >-
    The root session reran the frozen-plan CLI on the two archived scientific attestations and the tool-round self-check on the sealed V1/V2 attestation; both exited 0 with all declared joints owned and attested. These are admission checks on declared bytes, not authentication of read histories or scientific conclusions.
  - >-
