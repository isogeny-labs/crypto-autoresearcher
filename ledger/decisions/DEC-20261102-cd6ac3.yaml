  scoped_claim:
    general_field: Every field K; n>=0; R=K[x,z], L=x-ell(z)-c with ell homogeneous linear; retain every nonzero
      affine-substituted row.
    graded_map: R/(F_top) surjects onto S/(G_top) via homogeneous x->ell; every target graded dimension is at most
      its source dimension.
    regularity: If the source highest-part quotient is finite-dimensional, dreg(G)<=dreg(F). Zero quotient dreg0;
      no-variable empty list dreg1.
    solutions: Projection and x=ell+c reconstruction are inverse over every field extension.
    field_augmentation: Over F_p, all coefficients and c in F_p and every surviving variable field row retained,
      including auxiliaries. The transformed eliminated field row is a linear combination of surviving field rows,
      both ordinarily and in highest parts.
    diagnostic:
      api_boundary: Polynomial-basis translation only; no new short-Weierstrass curve API call.
      cubic: f(a+Z)=Z^3+3*a*Z^2+(3*a^2+alpha)*Z+b^2
      dreg:
        original: 2*p
        reduced_b_nonzero: p+1
        reduced_b_zero: p+1
      excluded_rows:
      - interval
      - rationality
      - stratum-inverse
      - other auxiliaries
      forward:
      - q=r1
      - h=r0+a*r1
      - w=s1+2*a
      - v=s0+a*s1+a^2
      hilbert_polynomials:
        original: (1+t)*(1+t+...+t^(p-1))^2
        reduced_b_nonzero: (1+t)*(1+t+...+t^(p-1))
        reduced_b_zero: (1+t)*(1+t+...+t^(p-1))
      inverse:
      - r1=q
      - r0=h-a*q
      - s1=w-2*a
      - s0=v-a*w+a^2
      norm: A(X)^2-f(X)+(X-a)*U(X); translated nonzero coefficient rows are -E2,-E1,-E0
      original_symbols:
        r0: chart.A0
        r1: chart.A1
        s0: support.u0
        s1: support.u1
      sign: h-b; original pivot r0=b-a*r1
      top_ideals:
        original: (h,q^2,v^p,w^p)
        reduced_b_nonzero: (q^2,v+2*b*q,w^p)
        reduced_b_zero: (q^2,v,w^p)
      translated_symbols:
        h: A0 in the contract diagnostic
        q: A1 in the contract diagnostic
        v: u0 in the contract diagnostic
        w: u1 in the contract diagnostic
    source_application:
      source_sha256: 354d6eef9695477f5c3ab2e9acc274241848f25a863dac30d2e5eb0def68c3b9
      finite_target_k:
      - 1
      - 2
      - 3
      - 4
      - 5
      pivot: A0=b B(a)-sum_(i>=1) A_i a^i; normalized constants included; no division by b.
      full_field_projected_dimension: k to k-1 in applicable finite charts; U and all auxiliaries stay lifted.
      row_families: All nonzero norm, stratum, interval, rationality and explicit field rows; sign.target alone
        vanishes, plus any actual zero rows.
      raw_source: canonical_chart has quadratic arithmetic but no appended all-variable v^p-v; bit/range compilation
        is separate.
      special_cases: No finite-target pivot for identity charts or k0/special charts; literal scalar obstructions
        retained.
    independent_joint_verdicts:
      graded_quotient: holds
      solution_field_equations: holds
      row_retention: holds
      translated_k2: holds
      source_application: holds
      claim_boundary: holds
  countercontrols:
  - example: (z^2+z,z^2,z) versus (z^2+z,z^2)
    conclusion: Same ordinary ideal (z), but dreg1 versus2; ordinary redundancy is insufficient.
  - example: F=(x,z^2), x=0
    conclusion: Both dreg2; universal strictness is false, including redundant prime-field augmentation.
  - example: F=(x-z,x^p-x) with no surviving z field row
    conclusion: Deleting transformed field row destroys finite top quotient and extension-field solution correspondence.
  - example: x=a z with a outside F_p, z=1
    conclusion: Extra (a^p-a)z prevents ordinary field-row redundancy.
  - example: Boolean x=y+z over p>3, y=z=1
    conclusion: Remaining bit equations allow it; transformed x idempotence equals2 and must remain.
  - example: Add w=0 to diagnostic
    conclusion: Regularities become p+1 and2, refuting unchanged-threshold transfer to systems with extra rows.
  - example: Identity and impossible charts
    conclusion: Absent sign pivot and unit ideals prohibit indiscriminate finite-target or strictness claims.
