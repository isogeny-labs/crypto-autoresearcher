  rationale:
  - The independent proof gives the correctly directed graded surjection over every field, handles constants and
    degenerate cases, and distinguishes affine and homogeneous substitution.
  - Exact monomial bases prove both diagnostic values for zero and nonzero target ordinate without a solution-existence
    assumption.
  - All six frozen joints hold at their stated scope; source-text reconciliation confirms finite k1..5 pivots, special
    cases and complete retained row-family transport.
  - The countercontrols expose false stronger claims and are retained as part of the supported result.
  evidence_strength: independent_analytical_derivation
  claim_tier: conditional_algebraic_theorem_and_exact_diagnostic
  proof_status: derivation
  proof_assistant_verified: false
  proof_refs:
  - research/prime_sat_affine_regularity_20261102/TASK-20261102-5288b1/independent-derivation.md
