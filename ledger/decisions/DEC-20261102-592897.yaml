  decision_scope: Complete finite-k2 constant-B field-augmented highest-part quotient, literal raw equality, certified
    added-row strictness under explicit premises, and reconstructed field projections.
  target_ids:
  - TASK-20261102-ebd0fe
  - TASK-20261102-bf48ac
  evidence_strength: independent_analytical_derivation
  claim_tier: conditional_source_specific_algebraic_theorem
  proof_status: derivation
  proof_assistant_verified: false
  rationale:
  - All eight frozen joints hold with complete retained auxiliary rows and explicit source-binding proof.
  - Both ordinary and highest-part pre-pivot ideals are preserved by separate certificates; the post-pivot linear
    row remains.
  - Exact graded quotient maps prove strictness for nonzero C and nonzero target ordinate without ordinary solvability
    or regular-element assumptions.
  - The zero-ordinate equality criterion, unit strata and omitted-premise controls prevent stronger unsupported
    claims.
  scoped_claim:
    quantifiers: Every p>3 prime, nonsingular short-Weierstrass curve over F_p, finite target (a,b) on that curve,
      valid public interval with 2^s<p, finite arity2 constant-B chart, each of the three declared rationality arms;
      explicit field rows for every variable.
    system: A=A0+qX, B=1, U=X^2+u1X+u0; norm A^2-f+(X-a)U; L=A0+a*q-b; all other rows H in F_p[z].
    auxiliary_scope: Every actual emitted stratum, interval and rationality row and every registered auxiliary;
      opaque imported component semantics are not revalidated.
    base_quotient: K=(highest parts of H), C=F_p[z]/K; all z_i^p in K give finite dimension.
    original: I=(A0+a*q,q^2,K); quotient C[q]/(q^2).
    raw_pivot: For a!=0, literal original-X row substitution alone has quotient C[q]/(q^2), hence equal regularity
      for either ordinate.
    added_row: R=N1+2*a*N2; R_top=2*q*(A0+a*q)=2*q*L_top. Ordinary and highest-part ideals unchanged before substitution.
    reduced: After A0=b-a*q, keep every nonzero row; J=(q^2,K,v+2*b*q), v=u0+a*u1.
    nonzero_ordinate: If C!=0 and b!=0, original dreg=d+2, reduced dreg=e+1 where d=top(C), e=top(C/(v^2))<=d. Exact
      drop d-e+1>=1.
    zero_ordinate: If C!=0 and b=0, reduced quotient (C/(v))[q]/q^2, reduced dreg=e+2. Equality iff (C/(v))_d!=0,
      equivalently C_d != v*C_(d-1).
    a_zero: R duplicates N1; raw substituted list already contains the linear row. N0 vanishes using target membership.
    unit_boundary: C=0 gives both values0. Literal zero/linear B strata at finite arity2 have unchanged constant
      obstructions.
    special_charts: Identity charts lack the finite sign pivot; arity0, identity arity1 and other arities are not
      covered by analogy.
    field_row_certificate: (b-a*q)^p-(b-a*q)=-a*(q^p-q); surviving coefficient and all auxiliary field rows retained.
    solutions: Over every extension, (A0,q,z)<->(q,z) with A0=b-a*q is an ordinary coordinate-ring and solution
      isomorphism; corresponding complete z fibers agree.
    projection: Original projection (A0,q) reconstructed from retained projected q; graded elimination of q is proof-only,
      never a second runtime pivot.
    signed_output: Reconstruction restores A,B,U and all signed-recovery inputs; common-root beta-sign regressions
      remain required in their broader chart family.
    independent_joint_verdicts:
      source_separation: holds
      original_quotient: holds
      raw_equality: holds
      added_row: holds
      reduced_quotient: holds
      strictness_boundaries: holds
      solutions_projection: holds
      claim_boundary: holds
  countercontrols:
  - id: C_zero
    proof: D7
    outcome: Both regularities0; strict premise excluded.
  - id: b_zero_equal
    proof: D7
    outcome: C=Fp[u0,u1]/(u0+a*u1,u1^p), v=0, both p+1; algebraic non-realized control.
  - id: b_zero_strict
    proof: D7
    outcome: C=Fp[u0,u1]/(u1,u0^p), regularities p+1 and2; algebraic non-realized control.
  - id: nonzero_b_sharp
    proof: D7
    outcome: v=0 algebraic control realizes drop exactly1.
  - id: raw_a_nonzero
    proof: D4
    outcome: Literal raw top ideal(q^2,K), equal original regularity.
  - id: a_zero_duplicate
    proof: D4-D6
    outcome: R=N1; raw already has linear row; N0 becomes0 by target membership.
  - id: impossible_strata
    proof: D7
    outcome: Source constant1 or-1 survives; both0.
  - id: no_pivot_special_charts
    proof: D7
    outcome: Identity targets have no finite sign row; special arities and other k excluded.
  - id: missing_fields
    proof: D8.1
    outcome: Infinite quotient possible; Definition1.4 premise can fail.
  - id: coefficients_outside_Fp
    proof: D8.2
    outcome: Transformed field row not generally redundant; explicit lambda example.
  - id: ordinary_redundant_deletion
    proof: D8.3
    outcome: Same ordinary ideal can have highest-part regularity2 or1.
  - id: boolean_idempotence
    proof: D8.4
    outcome: For odd p, x=y+z requires2*y*z=0 modulo surviving idempotence; characteristic2 exception stated.
  - id: dependent_H
    proof: D8.5
    outcome: Row q breaks the proposed separation/factorization.
  - id: ordinary_unsat_nonzero_top
    proof: D8.6
    outcome: Fp7 example has no solutions but nonzero highest-part quotient.
