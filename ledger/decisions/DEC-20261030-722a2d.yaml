  scoped_claim:
    statement: For every valid cold input and fixed limits, if the bound baseline refute routine returns refuted,
      the specified active-only routine returns the identical ordered multiplier-certificate vector at no more insertion
      attempts and within the same row cap.
    source_path: research/prime_sat_five_tests_20261029/core.py
    source_sha256: c67fc44404b282ac963f1021a4b6197ebbb4a8bf382c70a2576db45172065a4f
    premises:
    - Prime p; integer n>=0; finite ordered generator list with integer coefficients and nonnegative integer monomial
      masks smaller than 2^n; no bool/float/alias masks. Treat primality as a mathematical input premise, not a
      parser certificate.
    - Clean every generator modulo p. A is the union of all variables in all cleaned generators, including generators
      exceeding the row-degree cap. Preserve original generator indices and original increasing variable indices
      in A.
    - Fixed integer degree_cap>=0 and row_cap>=0; literal cold empty basis and FIFO from the bound source, exact
      leading-mask order (bit_count,mask), no different global rank/adaptive policies.
    - 'Candidate differs only in the multiplication loop: for i in range(ring.n) becomes for i in sorted(A). Support
      extraction is new separately charged setup. All original generators, insertion/cleaning/normalization/certificate/cap
      logic remain.'
    - Count attempted insertion before cleaning/degree check, including zero/dependent/over-degree rows and the
      overflowing attempted call. Stop at first refutation exactly as source. No warm starts, row batching, relabeling
      or policy change.
    certificate_scope: Identical full ordered multiplier vector in the original Boolean quotient, preserving generator
      indices and original variable masks.
    attempt_scope: B and C count attempted insertions up to matched first success, not stored rank, field operations,
      machine work or elapsed time. K is the number of removed inactive-tag calls.
    model_scope: 'Inactive coordinates remain free: Z(F)=Z_A(F) x {0,1}^(inactive variables). No fixing of those
      coordinates in returned models.'
    prime_field_verified: false
    prime_field_note: Primality is an explicit mathematical premise, not established by this source/parser review.
  per_joint_verdicts:
    algebraic_identity: holds
    source_invariant: holds
    ordered_simulation: holds
    cap_semantics: holds
    negative_controls: holds
    model_and_cost_scope: holds
    producer_comparison: holds
  worked_control_findings:
  - All-active support gives K=0 and identical search, plus new support-extraction overhead. No universal strict
    cost gain follows.
  - Empty support, zero/constant inputs, row_cap=0 and degree_cap=0 retain literal attempted-insertion and stopping
    semantics.
  - For f=x and inactive y, (0,0) and (0,1) are both models. A mixed-tag warm start (1+y)x can cross tags during
    reduction; that is outside the cold theorem.
  - For odd prime and D=2, f=1+x+y, g=xf-1, h=yf-1 give first-success certificates (x,-1,0) versus (y,0,-1) when
    the active-variable order is reversed. This is a handwritten symbolic control, not an executed test.
  - Divisibility pivot reduction changes the source argument. Support from an arbitrary accepted-row subset is unproved;
    all final accepted initial rows may admit a separate span argument, so variants are not universally declared
    false.
  limitations:
  - The candidate is a stipulated one-loop transformation; its implementation and executed correctness controls
    remain future work. This review contains no numerical measurements or software executions.
  - The baseline is selected-echelon FIFO search, not a complete degree-bounded polynomial-calculus procedure. UNKNOWN
    proves neither non-refutability nor equal candidate behavior.
  - The implication is conditional on baseline success. No strict insertion saving, changed capped outcome, equality
    of rank/arithmetic/telemetry, whole-SAT trajectory monotonicity or total-cost/runtime gain is established.
  - Support extraction and every construction, restriction, search, certificate, checking, reconstruction, failure,
    memory, serialization and I/O cost remain chargeable. The pre-reduction max_accepted_row_degree counter is not
    an independent-row-only statistic.
  - Warm starts, parent-row reuse, callback bookkeeping, relabeling, changed support/order/pivot rules, batching
    and adaptive strategies require separate obligations and are outside this accepted factor.
  - The producer monomial-universe formula was learned after reveal and is not accepted as actual matrix size, memory,
    degree of regularity or complete work.
  - One reviewer supplied two phases, not two independent reviews. Native byte/declared-chronology consistency does
    not authenticate timestamps, undisclosed reads, model/provider identity or remote push timing. Requested gpt-6.1-sol/xhigh/fork-none
    remains distinct from unverified serving identity and effective effort.
  - No proof-assistant verification, novelty result, new regularity theorem, exponent improvement, unknown-scalar
    recovery or general prime-field ECDLP speedup follows.
