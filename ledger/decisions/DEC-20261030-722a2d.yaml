  rationale:
  - The independent sealed derivation establishes the inactive-mask invariant for both rows and every ordered certificate
    component. Exact pivot equality prevents reductions across inactive-mask classes, and only the empty class can
    produce a constant.
  - Filtering the baseline FIFO and insertion events to empty inactive masks gives the literal candidate trace with
    original generator and increasing active-index order. The first successful normalized certificate vector is
    identical, not merely existentially equivalent.
  - At matched first success B=C+K with K>=0 counts attempted insertions, including calls before cleaning and degree
    rejection. Prefix injection proves C<=B<=row_cap whenever baseline succeeds.
  - All seven final joints hold. Producer comparison was unresolved in the sealed phase and completed only after
    mechanical release; no correction to the blind mathematical proof was learned after reveal. The unchanged native
    gate returned zero with --no-addenda.
  - Coordinator rehashed all seven review artifacts against the actual gate and all nine source/checker bindings
    against input-bindings.json. This synthesis ran no scientific routine, software test, solver or review checker.
