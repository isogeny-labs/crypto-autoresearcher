        equal, 39 absent-on-both, 0 differing); parity false negative found;
        18/18 interpreter replays identical. Limitations L1-L8 carried.
    J2-scope:
      owner: TASK-20261105-c44b03
      role: red_team
      verdict: holds
      verdict_source: experiments/EXP-ICPERF-284bc4/review/TASK-20261105-c44b03/review-attestation.yaml
      original_verdict: holds_with_limitation (red-team-report.yaml, unedited)
      basis: >-
        No path from the record to a latency, speedup or ranking claim; NEG-1
        and NEG-2 can fail (kill M1-M4); no rho comparison, so no section-5a
        band owed. Holds only for the narrowest supported statement, under
        limitations O1-O9 (labels, price provenance, mutants M5/M7/M8/M11,
        CON-3 max vs mean, BL out of regime, rounded constant, wording, no
        pcc claim, no exactness positive control).
    blind_rederivation:
      owner: TASK-20261105-b543c3
      verdict: derived
      source: experiments/EXP-ICPERF-284bc4/review/TASK-20261105-b543c3/blind-rederivation.yaml
      comparison_with_recorded: >-
        Equal at every quantity: precomputation 525; price 925/4; probes and
        BSGS maxima 50/200/25; bl_steps 2/8/1; online 18500/74000/9250 ns over
        80/320/40 ns, ratio 925/4 per cell; c_probe 371 gives 1855/8 at price
        and every cell (ic 18550/74200/9275); precomputation 10 gives 185/42 at
        every cell with bl_steps 105, 420, 105/2. Compared by the Coordinator
        against runs/*/raw-result.json in this review.
  proves_too_much:
    c_probe_371: rejected by the success criterion; RUN-ICPERF-30596e records 1855/8 and matches_preregistered false. The identity part (ratios agree, r and A invariance) survives at 371 and at every price vector, so it is not evidence about prices.
    precomputation_10: does not reproduce 925/4 (185/42); the one perturbation that breaks the identity itself.
    n83_bl_arm: no argument from this record concludes a measured deficit of 235 or any speedup; the record blocks the reading, and the numerical coincidence 925/4 = 231.25 is the idea's own back-of-envelope figure.
  independence_check:
    tool: tools/check_review_independence.py
    result: PASS
    run_by: top-level session (as reported to the Coordinator; not re-run here)
    expected_plan_sha256: f4a34e9bd2aa961039c8371d09a110198ce8904a1dfc949e12ba718972fd6985
    plan_frozen_at: f7eb8ae292
    targets:
      - experiments/EXP-ICPERF-284bc4/review/TASK-20261105-576b11/review-attestation.yaml
      - experiments/EXP-ICPERF-284bc4/review/TASK-20261105-c44b03/review-attestation.yaml
      - experiments/EXP-ICPERF-284bc4/review/TASK-20261105-b543c3/blind-rederivation.yaml
    limit: >-
      PASS checks declared ownership, verdict vocabulary, blind_from and
      controls on pinned bytes; it does not authenticate read history or decide
      scientific correctness. The original attestations inside
      validation-report.yaml and red-team-report.yaml were not the checker's
      targets (see procedure_deviations PD-1).
  s5a_band:
    applies: false
    comparison_against_rho_made: false
    band: none
    reason: >-
      No arm is Pollard rho, no target is solved and no counted unit exists, so
      S = total/sqrt(n) is undefined and there are no unpriced counters to
      weight at 0, 0.1 and 1 GAE. The only two-arm quantity, 925/4, is an
      online-phase formula ratio against a Bernstein-Lange closed form at
      assumed ns prices (sheriff B5.1 accounting; B5.4/B5.5 phases missing).
      The record ranks nothing. Both red-teams found no comparison against rho.
    illustrative_band_red_team: >-
      Red-team pencil arithmetic under a counter model the record does not
      contain (each IC probe, IC state and BL step = 1 group addition + 1
      native unit): R = IC_online/BL_online = 10/21 = 0.476 at uniform weight
      w in {0, 0.1, 1}; [0.119, 1.905] across the 27 independent-weight
      corners, 4 of 27 putting BL ahead; the record's ns prices give 231.25.
      The order is set entirely by the price assumption; no ranking in either
      direction is licensed. Illustrative only, not evidence.
  procedure_deviations:
    - id: PD-1
      text: >-
        The top-level brief offered holds_with_limitation, which
        tools/check_review_independence.py does not accept. Both reviewers
        filed review-attestation.yaml addenda in checker vocabulary (holds plus
        explicit limitations); validation-report.yaml and red-team-report.yaml
        are unedited. The checker was run on the addenda and the blind
        re-derivation.
    - id: PD-2
      text: >-
        Plan PD-1 (recorded, not repaired): the audit tool counts a replay
        pointer absent from both files as a mismatch, so the deterministic
        verdict is flagged with no value difference.
    - id: PD-3
      text: >-
        The plan's known_inputs audit_note says "No environment drift". That
        repeats the tool's output and is inaccurate: the parity check did not
        run, and the actual drift is 3.11.17 to 3.13.18 (no value effect).
    - id: PD-4
      text: >-
        The plan's blind_rederivation.quantity writes the price ratio as
        c_probe*c_state*states*bl_den / (bl_num*c_step^2), with a spurious
        factor states (it would give 4625/2). The hypothesis statement and the
        specification omit it, and the re-deriver used the omitting form
        (c_probe*c_state*bl_den / (bl_num*c_step^2)). The derived quantity is
        the hypothesis's; the plan text is a drafting defect.
    - id: PD-5
      text: >-
        The review tasks TASK-20261105-576b11, -c44b03 and -b543c3 have no
        handoff records under ledger/handoffs/; they were dispatched in-session
        by the top-level session, and the blind re-derivation brief is not
        archived. The re-derivation records its own method and parameters.
    - id: PD-6
      text: >-
        HEAD moved to 1e5baa38e6 during review (adding the blind file). The
        validator saw the sibling path and line count via git diff --stat, and
        the red team saw the directory name; neither opened its content.
        Inputs were confirmed byte-identical to f7eb8ae292.
