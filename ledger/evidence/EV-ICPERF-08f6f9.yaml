    J1-validity:
      owner: TASK-20261105-576b11
      role: validator
      verdict: holds
      verdict_source: experiments/EXP-ICPERF-284bc4/review/TASK-20261105-576b11/review-attestation.yaml
      original_verdict: holds_with_limitation (validation-report.yaml, unedited)
      basis: >-
        6/6 units; 60/60 receipt digests; 180/180 manifest bindings; check_run
        clean with a discriminating corrupted-manifest control; journal chain
        intact (tip 534b1a29...); runbook verify OK; 268/268 assertions
