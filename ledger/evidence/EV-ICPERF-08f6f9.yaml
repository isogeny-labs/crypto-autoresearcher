  analysis: experiments/EXP-ICPERF-284bc4/analysis.md
  type: empirical
  direction: supports
  direction_scope: >-
    Supports H-ICPERF-2f52d1 as stated and only as stated: with c_probe 370 ns,
    c_state 2100 ns, c_step 40 ns (assumed constants), BL constant 21/10 and 10
    states, the reduced price ratio is 925/4, the online ratio at each of
    (1000,2), (4000,2), (1000,4) is 925/4, and each probe count equals
    (r/A)/states = 50, 200, 25. Neutral on IDEA-20261015-7a3c9e's
    measured-price claim, on the n=83 arm, on host latency and on any rho or
    Bernstein-Lange cost ranking; the record makes no statement there.
  strength: preliminary
  strength_justification: >-
    Valid run set (6 of 6 units, J1 holds), out-of-sample preregistered
    integers met exactly, both planted negatives moved the ratio, and an
    implementation written blind from the statement reproduces every value.
    Strength stays preliminary: one deterministic execution per unit with no
    independent second run; the deterministic audit is flagged as recorded
    (matched 0 of 6, a pointer-coverage defect) and its interpreter-parity
    check did not run; no pcc claim covers the integers; and the content is an
    algebraic identity that holds by construction, so "replicated" would
    describe a reproduced effect that does not exist. Four mutants pass every
    run assertion (red-team M5, M7, M8, M11).
  claim_tier: toy
  claim_tier_note: >-
    Scale label only. No field, curve, group or target exists; three integer
    cells. The record cannot carry a measured_bound and is not a cost claim
    (AGENTS.md "Curve identity and measured bounds").
  scale_relevance: >-
    toy-scale: direct exact-rational evaluation at the stated cells only. No
    transfer to section-23 sizes, to n=83, or to a memory-latency model
    (specification scale_relevance).
  certificate_refs: []
  certificate_note: No unit claims a solve or relation (attack_claimed false, certificate kind none on all six manifests).
  proof_status: derivation
  proof_refs:
    - experiments/EXP-ICPERF-284bc4/review/TASK-20261105-b543c3/blind-rederivation.yaml
    - experiments/EXP-ICPERF-284bc4/specification.yaml
  proof_status_note: >-
    The specification reference is /experiment/online_time_model/cancellation.
    The supported statement is an exact arithmetic identity. Its checkable
    basis is the blind exact-rational derivation (embedded script, committed
    at 1e5baa38e6 before this record) and the specification's stated
    cancellation (ic_online / bl_online reduces to c_probe * c_state * bl_den /
    (bl_num * c_step^2)). Labelled derivation, not proved, not machine-verified.
  observations:
    - id: O1
      statement: >-
        RUN-ICPERF-8e3acd raw-result.json: price_ratio_num 925,
        price_ratio_den 4, precomputation_steps 525, ratios_agree true,
        all_match_bsgs true, matches_preregistered true. Cells (1000,2):
        probes 50, bsgs_probes 50, bl_steps 2, ic_online_ns 18500,
        bl_online_ns 80, ratio 925/4; (4000,2): 200, 200, 8, 74000, 320,
        925/4; (1000,4): 25, 25, 1, 9250, 40, 925/4.
    - id: O2
      statement: >-
        RUN-ICPERF-2d715d (CON-1) cells (1000,2) and (1000,4) both 925/4,
        same_reduced_ratio true; RUN-ICPERF-2c627f (CON-2) cells (1000,2) and
        (4000,2) both 925/4, same_reduced_ratio true; RUN-ICPERF-779d41
        (CON-3) enumerated_probes 50, 200, 25 equal formula_probes, all_match
        true. All three record matches_preregistered true.
    - id: O3
      statement: >-
        RUN-ICPERF-30596e (NEG-1, c_probe 371): price ratio 1855/8 and online
        ratio 1855/8 at all three cells, ic_online_ns 18550, 74200, 9275,
        matches_preregistered false. RUN-ICPERF-850008 (NEG-2,
        precomputation_steps 10): bl_steps 105, 420, 105/2; bl_online_ns
        4200, 16800, 2100; online ratio 185/42 at all three cells;
        matches_preregistered false; no price-ratio field (by the formula
        the price ratio is unaffected by the precomputation model).
    - id: O4
      statement: >-
        Audit AUD-20261105T164527Z-d5036c verdict flagged, matched 0 of 6.
        Validator row audit: 66 rows, 27 present on both sides and exactly
        equal, 39 absent from both files (each predicted by the bound run.py
        observe() branch for its trial kind), 0 absent on one side, 0
        differing. Whole documents equal except /elapsed_seconds and
        /interpreter.
    - id: O5
      statement: >-
        Recorded interpreter CPython 3.11.17 (all six units, S01); audit
        replay CPython 3.13.18; audit environment_drift [] is a false negative
        (tools/runbook.py _recorded_python reads /run/environment/python_version;
        these manifests use /version and /python). Validator replays under
        3.11.18, 3.12.3, 3.13.18: 18 of 18 identical, check.py rc 0.
    - id: O6
      statement: >-
        Blind re-derivation TASK-20261105-b543c3 equals every recorded value
        in O1-O3, including NEG-2 bl_steps 105/2 at (1000,4).
  inference: >-
    The instrument evaluates the stated closed-form model in exact rationals
    and returns the preregistered integers; its output responds to a planted
    change of c_probe and of the precomputation model; a blind implementation
    agrees everywhere. The identity holds by construction: r and A cancel for
    every price vector under the equal-precomputation-time definition
    (red-team null-price control, 2000 of 2000), and NEG-2 shows the identity
    is equivalent to that definition. Only the literal 925/4 carries
    information, and it is a function of the frozen inputs. The session is
    citable with the audit-flag and parity disclosures. Nothing follows about
    prices, latency, n=83, Bernstein-Lange regime behaviour or rho.
  narrowest_supported_statement: >-
    At the frozen inputs (c_probe 370, c_state 2100, c_step 40 ns, all assumed
    constants equal to IDEA-20261015-7a3c9e's n=83 inferred/assumed prices;
    c_BL 21/10; 10 states; cells (1000,2), (4000,2), (1000,4)), run.py sha256
    ef13257e... evaluates the stated closed-form online-time model in exact
    rationals and returns 925/4 for the price formula and for each cell's
    online ratio and the preregistered per-cell integers; its output responds
    to a planted change of c_probe (1855/8) and of the precomputation model
    (185/42). Accounting class (sheriff B5.1). It measures no price, latency,
    step count or cost, makes no comparison with Pollard rho, ranks IC against
    Bernstein-Lange in neither direction, and makes no latency or n=83
    statement.
  boundaries:
    - Prices are assumed constants (370, 2100, 40 ns); no host receipt is read (stopping rule).
    - BL constant 21/10 only; the unrounded 2.124 or 2.335 forces an inexact division (instrument failure, not falsification).
    - Three cells (1000,2), (4000,2), (1000,4); 10 states; online phase only at matched precomputation time.
    - Bernstein-Lange closed form evaluated outside its regime at all three cells (P = 525 at least m at two cells; implied table about 20.9 above m^(1/3)).
    - CPython 3.11.17 recorded; 3.11.18, 3.12.3, 3.13.18 replayed; run.py sha256 ef13257e9973f7a447f37e1991fec948c5a8eb3a12395e510a7b8678cd5c434f.
    - No transfer to IDEA-20261015-7a3c9e claims (1)-(4), the section-23 table, n=83, any memory-latency model, any frontier row.
  unresolved_confounds:
    - >-
      Computed integers are labelled "measured" in runbook.yaml, the run
      report and data.json, and tools/progress_metrics.py exports the assumed
      prices (including NEG-1's planted 371) in physical units without an
      assumed/planted qualifier (red-team O1). Ruled in DEC-20261105-8a9984
      labelling_ruling; correction record pending.
    - >-
      Price provenance undisclosed in the specification and hypothesis:
      925/4 = 231.25 is numerically the idea's "231 vs measured 235"; the 235x
      [61, 645] comparator is unverified in the ledger (red-team O2).
    - >-
      CON-3 compares BSGS worst case with a quantity the parent idea defines
      as a geometric mean; BSGS mean is 25.5/100.5/13.0 against 50/200/25
      (red-team O4). In this configuration max equals m/s by theorem, so no
      correct enumeration can disagree (M5 undetectable).
    - >-
      The replay contract flattens per-trial pointers into one union, and the
      audit tool scores absent-on-both as mismatch and cannot see the
      interpreter key; a tool defect, not a data defect.
  confound_assessment:
    - {comparison: CMP-PRIMARY, verdict: isolated, basis: "Absolute comparison of one deterministic unit with out-of-sample integers fixed 2026-10-17; every input (prices, BL constant, states, cells) fixed and asserted; exact equality; blind re-derivation agrees."}
    - {comparison: CMP-CON-1, verdict: isolated, basis: "Arms differ only in A (2 vs 4), asserted per cell. Isolated but non-discriminating: A cancels by construction, so the check fails only through an inexact division or a code defect it shares with the primary."}
    - {comparison: CMP-CON-2, verdict: isolated, basis: "Arms differ only in r (1000 vs 4000), asserted per cell. Isolated but non-discriminating for the same reason as CMP-CON-1 (r cancels for every price vector; red-team null-price control 2000/2000)."}
    - {comparison: CMP-CON-3, verdict: isolated, basis: "Absolute comparison of enumerated BSGS worst-case lookups with the probe formula at three cells; deterministic. Statistic is worst case against a parent-defined mean, and max = m/s holds by theorem here, so it cannot discriminate a formula-duplicating implementation (M5)."}
    - {comparison: CMP-NEG-1, verdict: isolated, basis: "Only c_probe differs (370 vs 371), asserted /c_probe_ns; ratio moved 925/4 -> 1855/8 at every cell and in the price formula. Control integers are in-sample calibration (PRED-CONTROLS), not a prediction."}
    - {comparison: CMP-NEG-2, verdict: isolated, basis: "Only the precomputation model differs (525 vs 10 steps), asserted /precomputation_steps; online ratio moved to 185/42 at every cell. In-sample calibration; it shows the identity equals the equal-precomputation-time definition."}
    - {comparison: CMP-AA, verdict: isolated, basis: "Recorded unit against audit replay of the same bound run.py. Process, host and interpreter (3.11.17 vs 3.13.18) co-varied; no value differs, so nothing needs attribution. The tool reported matched 0 of 6 because 39 compared pointers are absent on both sides; the validator's type-strict row audit (27 equal, 0 differing) and 18 replays across three interpreters carry the A/A reading."}
