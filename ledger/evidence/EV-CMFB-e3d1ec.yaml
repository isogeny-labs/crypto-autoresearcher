    - >-
      Sensitivity gate (t3): planted B+1 base detected in 7 of 8 (C16), 8 of 8
      (C20), 8 of 8 (C24) curves; pooled ratio against the Poisson-law value C16
      1.02667 vs 1.03035, C20 1.01091 vs 1.01247, C24 1.00525 vs 1.00521, all
      within tolerance; pooled randomization p 5.0e-5. Margins are thin at C16
