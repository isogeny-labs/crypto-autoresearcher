  inference: >-
    Within the tested instances, base, counting convention and resource budget,
    no coverage difference between the small-x liftable-window base and a matched
    random base exceeding the predefined resolution delta = 0.5 percent was
    observed. At C24 (FAM 13 of 13 members in the band, N-A 16, N-B 16) the 95
    percent intervals are inside +-0.04 percent, about thirteen times finer than
    delta; at C20 (powered under the contract text, not under the recorded code)
    inside +-0.08 percent. This supports H1, the exchangeability of the small-x
    window with a random base for exact m = 3 coverage, at the tested scope. It
    does not discriminate E1, E2 and E3 above the C24 bound because no arm shows
    an effect to attribute. The 'constant-only' reading of the research question
    follows from the conservation ceiling (KN-FIND-007), a theorem independent of
    this run, not from the measurement; the measured claim is the narrower
    exchangeability of this one base. The tested base never uses the CM structure
    (endomorphism-chain, isogeny-pullback, canonical-lift, other-model and joint
    x-y bases and the floor curve were not run), so no statement about CM
    channels follows. No improvement over the index-calculus baseline (a random
    factor base) was measured: the small-x base equals the baseline to within
    0.04 percent at C24. Strength is preliminary: a valid, controlled,
    independently validated experiment of toy scale with one confirmatory pass
    on one seed set, one powered cell by the recorded code and two by the
    contract text, no growth arm and no replication on fresh instances.
  boundaries:
    - >-
      Tested: prime-order curves y^2 = x^3 + A x + B over F_p, 2^14 < p <= 2^25,
      three arms (FAM members of p = 5t^2 + 19t + 19; N-A crater-type D = -19
      curves with b != a + 2; N-B random curves |A|, |B| <= 1000); small-x
      liftable-window base of size B = ceil((6N)^(1/3)) in the integral
      Weierstrass chart; m = 3; unsigned canonical-sign multisets; targets
      uniform over Z_N; exact counting (no solver); 200 matched random bases per
      member; resolution delta = 0.5 percent; seeds 7001 to 7010; one pass.
    - >-
      Claim tier toy. Not a statement about 2^52, the 53-bit pair, its floor, its
      crater-to-floor isogeny, its canonical lift, or any prime of that size;
      there is no transfer argument and no growth arm (3 powered cells needed;
      1 by the recorded code, 2 by the contract text). A coupling that grows like
      N^eps with eps above about 0.13 and is below 0.04 percent at 2^24 is
      unconstrained at 2^52 (RT-O4, derived by the red team).
    - >-
      Not tested: any base other than the small-x window (w-orbit and
      endomorphism-chain bases, isogeny-pullback bases, canonical-lift
      relations, Montgomery, Edwards and Hessian small-x windows, joint x-y
      windows, Sidon-type bases which reach +10.7 percent in EV-FBG-001); the
      signed (x-only, Semaev) convention, for which the coverage ceiling is about
      1.0003 at this B (RT-O7); other m; restricted targets; the floor curve
      (End = Z[pi]); decomposition cost, relation rank, linear algebra and
      descent. Coverage equal to a random base does not imply equal cost (the
      Gaudry-Diem base has coverage ratio 1 and a known cost advantage; RT proves
      too much object).
    - >-
      Interpretation scope. 'constant-only' for coverage is the conservation
      ceiling of at most 1.582 (KN-FIND-007), a theorem; the run measured
      exchangeability, not the ceiling. The scan-efficiency channel (qr_window)
      is validated as an implementation and is immaterial to cost (RT-O8).
    - >-
      Resolution. Effects of at most 0.04 percent at C24 are resolved; between
      0.04 and 0.5 percent the instrument has one sensitivity rung (planted
      +0.52 percent at C24); the declared null is at delta = 0.5 percent, not at
      zero. In structural units the C24 bound excludes a systematic surplus or
      deficit of more than about 20 additive pair-sum coincidences per member
      (RT-O4; the red team's calibration, not reproduced by the repository's
      instrument).
    - >-
      Cross-method accounting. No cross-method comparison is made. The red
      team's analytic, unmeasured estimate of index calculus over rho at
      N = 2^24 is 88 to 3400 across the 0, 0.1 and 1 GAE-per-unpriced-operation
      band with the order holding across the band (RT baseline_comparison); it
      is context, not a ranking made here, and no coverage result of either sign
      could move it by more than the coverage constant of at most 1.582.
  unresolved_confounds:
    - >-
      Frozen-text versus frozen-code inconsistencies D1 and D2 (analysis code
      and the shared checker). Their measured effect is recorded; the
      superseding analysis that applies the contract text to the existing raw
