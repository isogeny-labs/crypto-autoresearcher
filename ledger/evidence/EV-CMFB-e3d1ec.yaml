      0.5 / 0.4 / 0.46, N-A 0.5 / 0.44 / 0.5, N-B 0 at C16 / C20 / C24).
    - >-
      Pseudo-replication across t within the FAM cell (lag-1 autocorrelation
      0.416 / 0.018 / 0.324); handled by block bootstrap, and the randomization
      test treats members as independent units.
    - >-
      Fixed-seed single pass, with gate numbers seen before the run; no
      replication on fresh instances. The from-scratch rebuild is same code, same
      host.
    - >-
      N-A and N-B draw distributions were verified instance by instance, not as
      distributions (log-uniform p, uniform Frobenius angle).
    - >-
      The blind re-derivation required by the review plan was not blind, and the
      review plan was written after both verdicts (experiments/EXP-CMFB-cea1d2/
      reviews/review_plan.yaml, procedure_deviations).
    - >-
      Producer-session commits (ed7be5c508, 11a2df56d5, c6a2f13fdb) rather than a
      Coordinator snapshot archive are the reviewed snapshot (VAL A1).
  obstruction:
    statement: >-
      A window of small integers x in the integral Weierstrass chart carries no
      detectable group-law structure: the multiset-sum coverage of the small-x
      liftable base is exchangeable with that of a random base of equal size, on
      crater-type D = -19 family members, other D = -19 curves and random curves
      alike. Recorded because the result is a scoped null for the small-x channel
      of RQ-CMFB-33610e, although the hypothesis itself predicted it (direction
      supports H1). Not recorded as closing the lane: the CM-coupled bases are
      untested.
    quantity: >-
      T(arm, cell) = mean over members of (coverage of the small-x base / mean
      coverage of 200 matched random bases) - 1, in percent, with the 95 percent
      moving-block-bootstrap interval
    value: >-
      FAM C24 -0.0224 [-0.0381, -0.0060] percent (n = 13, exhaustive); N-A C24
      -0.0004 [-0.0237, +0.0267] (n = 16); N-B C24 +0.0161 [-0.0012, +0.0346] (n
      = 16); C20 FAM -0.0296 [-0.0741, +0.0482] (n = 10), N-A -0.0085 [-0.0612,
      +0.0389] (n = 16), N-B +0.0102 [-0.0384, +0.0570] (n = 16); randomization
      standard deviation of the FAM C24 mean about 0.010 percent (RT-O4); against
      the declared delta of 0.5 percent
    measured_by:
      - EXP-CMFB-cea1d2
      - RUN-CMFB-2010d3
      - RUN-CMFB-3dc120
      - RUN-CMFB-42a578
      - RUN-CMFB-e13f0e
      - RUN-CMFB-c71d35
    scope: >-
      m = 3, unsigned canonical-sign multisets, targets uniform over Z_N, small-x
      liftable window in the integral chart of E_0 (or its twist) or |A|, |B| <=
      1000, prime-order curves, 2^22 < p <= 2^25 (C24) and, under the contract
      text, 2^18 < p <= 2^22 (C20); FAM exhaustive in band; fixed seeds 7001 to
      7010. Claimed nowhere else.
    resource_check:
      examined: true
      reading: >-
        Which theory takes 'the small-x window is exchangeable with a random
        base for multiset-sum statistics' as its hypothesis? (i) The generic-group
        model: index calculus with such a base is then bounded below by
        generic-group cost and the gap to rho on the relation phase is a power of
        N times a constant (RT analytic_band, an unmeasured estimate). That
        reading closes the coverage channel for this base. (ii) A candidate not
        tested: small solutions of the modular equation S_4(x1, x2, x3, x_R) = 0
        mod p in the box [0, W)^3. The null says the number of solutions equals
        that of a random base (about W^3/p), which is the hypothesis a
        lattice-style small-root method needs; whether such a method finds them
        below B^2 time on a prime field is a cost question this run does not
        touch. Speculation from the measurement, a candidate for ranking and not
        evidence (RT resource_check). (iii) The same null, read the other way, is
        the control that a CM-coupled base (w-orbit, labels l x lambda^j) must
        be compared against: a coupling would show up as a departure from this
        measured exchangeability on the same instrument (RC-2 of the red team).
        No theory is spawned here.
      spawned_ids: []
  reviewed_by: coordinator
