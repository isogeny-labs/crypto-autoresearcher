      percent below the Poisson-law value at C16 and C20 (RT-O9).
    H3: >-
      Bateman-Horn member counts: exact 4 / 10 / 13 against 3.11 / 8.01 / 14.42,
      within a factor of 2; affects power only.
  observations:
