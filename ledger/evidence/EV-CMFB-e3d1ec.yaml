    - >-
      Defect D1 of the frozen analysis code (VAL D1, RT-O2): MDE carries a
      sqrt(3) x 1.0025 factor the contract excludes. Recorded MDE (percent) C20
      0.243 / 0.268 / 0.245 and C24 0.065 / 0.063 / 0.057 (FAM / N-A / N-B);
