  inference: 'The v1 frozen instrument did not produce a valid break-even reading
    at the tested cells: the 16-bit theta=0.30 pilot mean null fell below the frozen
    2500-coincidence target and the plant/calibration controls failed. This is an
    instrument/design observation, not evidence about the mathematics of kappa growth.'
  boundaries:
  - 'EXP-PFDR-2d36f9 v1: bits 16,20,24,28,32; theta 0.30,0.35; d 1,2,3; h=2; seed
    blocks 6,000,000/6,100,000/6,200,000/6,900,000; 4 workers.'
  - No statement beyond these cells, and no cost, security or deployed-curve claim.
  unresolved_confounds:
  - The pilot target of 2500 coincidences is unreachable at bits 16 theta 0.30 with
    the frozen base sizes, so one factor combination is invalid by construction.
  - The plant design/slope recovery and calibration gates fail; a revised design must
    separate a bad plant construction from a genuinely sub-break-even reading.
  - census-rep is empty because no line is ALIVE, so replication of an ALIVE line
    was not exercised.
  confound_assessment:
  - comparison: C-line-slope
    verdict: not_isolated
    basis: Three of six lines are invalid with M<2500 at 16 bits; the calibration
      gate fails, so the slope comparison is not isolated from instrument invalidity.
  - comparison: C-aa-null
    verdict: not_isolated
    basis: The A/A null calibration does not pass (mean -0.1495, sd 0.6597).
  - comparison: C-plant-recovery
    verdict: not_isolated
    basis: C3 plant entries record design_ok/slope_ok false; the plant construction
      at these rungs is not a valid positive control.
  - comparison: C-zn
    verdict: not_isolated
    basis: C6 does not pass; the Z/N interval slope check is not satisfied.
