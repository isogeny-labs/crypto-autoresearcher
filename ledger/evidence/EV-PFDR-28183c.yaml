  record_corrections:
    note: >-
      Corrections of statements in immutable records, made here because a correction is a new record (AGENTS.md rule
      4). The source records are not edited. No CORR-* record is minted by this composition.
    items:
      - id: RC-1
        corrects: specification.yaml heuristic_validation.sample_size_justification (F5); DEC-20261022-f1efde wherever it restates it
        prior_statement: the flag rule detects a true 10% excess with probability above 0.95 under Poisson variance
        corrected_statement: >-
          The frozen flag rule is the conjunction |kappa - 1| >= 0.10 AND |z| > 4. Because 4 sigma_kappa <= 0.067 at
          every powered cell, the effect-size conjunct binds and the probability of flagging a true +-10% departure is
          0.50 at all 44 cells; 0.95 is reached only at |delta| from 0.1000 to 0.1302 per cell. The z conjunct alone has
          power >= 0.9707 at +10%. The quantity that bounds what the null reading excludes is x_c per cell (OB-3), and a
          +-10% departure is read null with probability <= 0.0033 at every cell (OB-4). The defect was arithmetic and
          visible before the data (the decision threshold equals the alternative boundary); sample size does not cure it.
        basis: coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-924d2c/reviews/TASK-20261029-11526b/outputs/power-table.json; ptm-results.json (PTM-2 at 1.10)
      - id: RC-2
        corrects: >-
          H-PFDR-727bfc structural_ingredients[0] and proof_search_map.proof_obligations[0] ("Ahmadi-Shparlinski 2010
          (recalled): forbids small label sumset and small group sumset together above about p^(1/2)"); the same
          pointer in IDEA-20261017-078074 and specification.yaml heuristic_validation.rigorous_support
        prior_statement: Ahmadi-Shparlinski, Proc. Edinburgh Math. Soc. (2010), provenance recalled, as the source of a label-sum versus group-sum dichotomy above about p^(1/2)
        corrected_statement: >-
          Pointer correction only; recalled references are pointers, never support, and none of these supported the
          reading. (a) O. Ahmadi and I. E. Shparlinski, "Bilinear character sums and sum-product problems on elliptic
          curves", Proc. Edinburgh Math. Soc. 53 (2010) 1-12, arXiv:0806.0640: provenance retrieved, verified_by
          TASK-20261029-11526b (abstract and theorem statements, ar5iv rendering). It pairs x(aP) + x(bP) with x(abP), a
          multiplicative structure in the scalar, and its nontrivial ranges for a prime-order curve begin near
          q^(9/10) and q^(15/16), not p^(1/2). It is not the source of the p^(1/2) dichotomy. (b) The group-sum variant
          x(R) + x(S) against x(R + S) with a q^(1/2) range is attributed by the red team to Shparlinski, Finite Fields
          Appl. (2008), DOI 10.1016/j.ffa.2007.12.002. Provenance of that attribution: recalled / search-result level.
          The red team's sources_read says the restatement in arXiv:1302.4210 was "not opened", while scope-and-wording.md
          section 6 says the bound was "read only from the restatement"; the weaker reading is taken, so (b) is a
          pointer with verified_by empty. Even as attributed, (b) is a sumset lower bound and gives no kappa = 1 anchor
          at any tested n. "No tested cell has a proven kappa = 1 anchor" stands.
        basis: TASK-20261029-11526b report.yaml OBJ-6 and sources_read; scope-and-wording.md section 6

