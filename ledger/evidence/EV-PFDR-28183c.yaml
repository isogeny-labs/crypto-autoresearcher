  largest_claim_justified: >-
    On generated prime-order ordinary toy curves E/F_p with p of 20, 24 and 28 bits (main seed block 8,100,000 + c,
    j != 0, 1728; RUN-PFDR-4d8c71, RUN-PFDR-089edc), for x-label sets of rank r <= 3 log-GAPs built as specified
    (independent uniformly random base points, one representative per +-c, lexicographic half-box fill, every valid
    set collected from an injective box), of size 256 <= n <= 4096, the pooled nontrivial pair-sum coincidence count
    matches that of uniform label sets of the same size on the same curves within the measured per-cell 95% interval
    at each of the 44 assessable cells (|kappa - 1| <= x_c, x_c <= 0.0743 at every cell, <= 0.0052 at every cell with
    n >= 2048, <= 0.0012 at n = 4096; b20-r3-n4096 not assessable). H1 as operationalised (|kappa - 1| < 0.05 with
    the interval inside [0.90, 1.10]) is not contradicted at these cells; the literal random-model statement is not
    established. The reading says nothing about label-describability or membership predicates, other statistics of
    the label sets, other set shapes or labelings, larger n or p, or any standardized curve. One main seed block;
    not replicated.

