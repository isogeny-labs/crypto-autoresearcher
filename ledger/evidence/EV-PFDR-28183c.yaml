  obstruction:
    statement: >-
      On generated prime-order toy curves at 20, 24 and 28 bits, the x-label sets of rank r <= 3 log-GAPs (as built,
      injective boxes) carry the pair-sum coincidence count of matched uniform label sets within a measured per-cell
      equivalence bound. This blocks reading these sets, at these sizes, as carrying a pair-sum (h = 2) label-additive
      excess or deficit larger than x_c. It is a measured property of the sets' pair-sum count. It blocks nothing about
      label-describability or membership predicates (PTM-4a/4c share the fiber kappa about 1), other statistics, other
      bases or larger p and n, and it closes no lane.
    quantity: >-
      x_c = max(1 - ci95_lo, ci95_hi - 1), the larger distance from 1 of the curve-cluster bootstrap 95% interval of
      kappa = S/M per cell (dimensionless ratio); secondary, the 95% bound on the absolute excess (S - M)/curves in
      coincidences per set.
    value: >-
      Per cell, x_c (RUN-PFDR-089edc ci95; power-table.json): b20-r1 n256 0.00992, n512 0.00411, n1024 0.000925,
      n2048 0.000202, n4096 0.0000910; b20-r2 0.0139, 0.00337, 0.000901, 0.000252, 0.0000432; b20-r3 n256 0.0258,
      n512 0.00437, n1024 0.000924, n2048 0.000234, n4096 not assessable; b24-r1 0.0582, 0.0134, 0.00414, 0.00160,
      0.000226; b24-r2 0.0357, 0.0136, 0.00277, 0.000844, 0.000245; b24-r3 0.0442, 0.0186, 0.00403, 0.00143,
      0.000230; b28-r1 0.0743, 0.0424, 0.0198, 0.00266, 0.00103; b28-r2 0.0341, 0.0632, 0.0120, 0.00521, 0.00120;
      b28-r3 0.0482, 0.0493, 0.0203, 0.00205, 0.000616 (n = 256, 512, 1024, 2048, 4096 in order). Max 0.0743
      (b28-r1-n256); <= 0.0052 for n >= 2048; <= 0.0012 at n = 4096. Absolute per-set excess bound, 95%, max over r
      (regime-table.json): 0.194 (b28 n = 256) to 4.26e3 (b20 n = 4096) coincidences per set. Kappa point values and
      intervals per cell: RUN-PFDR-089edc analysis.json /cells.
    measured_by:
      - RUN-PFDR-4d8c71
      - RUN-PFDR-089edc
