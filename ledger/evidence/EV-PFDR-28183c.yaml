    measured_by_note: >-
      Read from RUN-PFDR-089edc analysis.json /cells ci95 (the producer's bootstrap, reproduced bit for bit by J2a
      integrity.py and at Monte Carlo level by J1's own seeds); x_c and the absolute bound tabulated by
      TASK-20261029-11526b power-table.json and regime-table.json. No new run.
    scope: >-
