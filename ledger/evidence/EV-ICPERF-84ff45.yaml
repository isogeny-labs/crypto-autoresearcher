  decision_rule_applied: >-
    The specification decisive_test and the DEC-20261029-0e40f3 restated pass
    rule (DEC-20261029-22e05b F4/F5): pass only on exact sample_sum 2943,
    sum_squares 289567 and median 28 with median_split false; cv_in_band and
    median_ratio_in_band descriptive only; CTL-1 and CTL-2 must both fail the
    exact match. The verbatim v1 success_criterion's band clauses are entailed
    by the three integers and are not an independent criterion.
  type: empirical
  direction: supports
  direction_scope: >-
    Supports H-ICPERF-5adc9b's integer statement and only that: the xorshift32
    sampler defined in the specification (shifts 13, 17, 5; step then test;
    stop at x mod 50 = 0; support from 1; chained draws; seed untested), run 64
    times from seed 20261017, yields sample sum 2943, sum of squares 289567
    and median 28 with no median split; the statement's band clauses then
    hold arithmetically. Neutral on geometric shape beyond this sample, on p,
    on any table's or probe panel's probe-count law, on host latency, huge
    pages, cross-host ratios, and IDEA-20261015-b41f68 claims (1)-(4).
  strength: preliminary
  strength_justification: >-
    Valid run set (3 of 3 units, J1 holds), audit clean with 3 of 3 exact
    replays, out-of-sample integers met exactly, both negative controls fail
    the exact match with their frozen integers, and a blind implementation
    written from the specification prose reproduces all three arms. The
    blind re-derivation closes the single-lineage gap for the claim "the
    specification text determines these integers". Strength stays
    preliminary: one seed and one execution per arm, no independent second
    run, no pcc claim, the audit's interpreter-parity check did not run, and
    the content is a deterministic identity of a specified program, so
    "replicated" would describe a reproduced effect that does not exist.
  claim_tier: toy
  claim_tier_note: >-
    Scale label only: 64 synthetic draws at mean 50; no field, curve, table or
    host. Not a cost claim; no measured_bound.
  scale_relevance: >-
    toy-scale: direct computation of one seeded sample. No transfer to an
    8 GiB table, to n=83 or to a cross-host latency ratio (specification
    scale_relevance).
  certificate_refs: []
  certificate_note: No unit claims a solve or relation (attack_claimed false, certificate kind none on all three manifests).
  proof_status: derivation
  proof_refs:
    - experiments/EXP-ICPERF-283a70/review/TASK-20261105-6d9502/blind-rederivation.yaml
  proof_status_note: >-
    The supported statement is an exact property of a specified deterministic
    program. Its checkable basis is the blind from-prose implementation with
    its embedded script and the 64 draws per arm (committed at 1e5baa38e6
    before this record), plus the code-free CTL-2 identity S' = S - 64,
    Q' = Q - 2S + 64, median' = median - 1. Labelled derivation, not proved.
  observations:
    - id: O1
      statement: >-
        RUN-ICPERF-f21eb1 (primary; shifts 13,17,5; support_min 1)
        raw-result.json: sample_sum 2943, sum_squares 289567, median 28,
        median_split false, exact_match true, cv_sq_num 9871039, cv_sq_den
        8661249 (CV^2 = 1.13968, CV = 1.0676), median_ratio_num 1792,
        median_ratio_den 2943 (0.60890), cv_in_band true, median_ratio_in_band
        true.
    - id: O2
      statement: >-
        RUN-ICPERF-0ef41e (CTL-1; shifts 1,2,14): 2938 / 290138 / 29,
        median_split false, exact_match false, CV^2 9936988/8631844 = 1.15120,
        median ratio 1856/2938 = 0.63172, both band flags true.
    - id: O3
      statement: >-
        RUN-ICPERF-74e9a2 (CTL-2; support_min 0): 2879 / 283745 / 27,
        median_split false, exact_match false, CV^2 9871039/8288641 = 1.19091,
        median ratio 1728/2879 = 0.60021, both band flags true.
    - id: O4
      statement: >-
        Audit AUD-20261105T164530Z-b85ca9 verdict clean, 3 of 3 replayed,
        matched 3, mismatch 0, 11 integer/boolean pointers each, no tolerance.
        Recorded interpreter CPython 3.11.17; replay 3.13.18; audit
        environment_drift [] is a false negative (PARITY-1: _recorded_python
        reads /run/environment/python_version; manifests use /version and
        /python). No value affected.
    - id: O5
      statement: >-
        Blind re-derivation TASK-20261105-6d9502: A (13,17,5, support 1)
        2943 / 289567 / 28, order statistics 32 and 33 both 28, CV^2
        9871039/8661249, median/mean 1792/2943; B (1,2,14) 2938 / 290138 / 29,
        29/29, CV^2 2484247/2157961 (= 9936988/8631844), 928/1469
        (= 1856/2938); C (support 0) 2879 / 283745 / 27, 27/27, CV^2
        9871039/8288641, 1728/2879. Equal to O1-O3 at every value. The blind
        primary draws equal the validator's spec-prose draws element by
        element.
    - id: O6
      statement: >-
        Band flags are true on all three units (fraction_true 3/3) while
        exact_match is true on the primary only (1/3). The band criterion does
        not separate the frozen sampler from either wrong sampler.
  inference: >-
    The specification's sampler prose determines 2943 / 289567 / 28 (and the
    two control triples): the producer runner, the audit replay, the
    validator's spec-prose sampler, the red team's recomputation and the blind
    from-prose implementation all agree. The exact integers discriminate the
    declared parameters and conventions within the xorshift family (red team:
    0 of 21202 completing wrong triples match sum and sum of squares; a
    seed-tested convention misses by 1 in the sum). The bands discriminate
    nothing here: both wrong samplers pass them, and at n = 64 they reject a
    truly geometric sample about 53 percent of the time and accept a CV = 1
    lognormal about 30 percent (red-team Monte Carlo, scratch, not evidence).
    No statement about geometric shape beyond this sample, about p, or about
    any table, probe panel or host follows.
  narrowest_supported_statement: >-
    Under session RBS-ICPERF-67df7d, run.py (sha256 53965863...9a38) at seed
    20261017, p = 1/50, n = 64, shifts (13,17,5), support {1,2,...} wrote
    sample_sum 2943, sum_squares 289567, median 28 with no median split,
    equal to the integers fixed 2026-10-17. The wrong-triple arm wrote
    2938/290138/29 and the support-0 arm 2879/283745/27; both failed the exact
    match. An implementation written blind from the specification prose
    reproduces all three arms. Both band flags were true on all three units,
    so the bands distinguished none of them. Nothing follows about geometric
    shape beyond this sample, p, any table's probe counts, host latency, or any
    index-calculus or rho cost.
  boundaries:
    - Seed 20261017 only; p = 1/50; n = 64; shift triples (13,17,5) and (1,2,14); support_min 1 and 0.
    - Sampler is the specification's xorshift32 recurrence; the attribution of the triple to Marsaglia (2003) is recalled provenance, a pointer only.
    - CPython 3.11.17 recorded; 3.13.18 replayed; run.py sha256 53965863...9a38.
    - The 64 draws are not persisted in raw-result.json; they were regenerated by the validator, the red team and the blind re-deriver.
    - No transfer to an 8 GiB table, real probe panels, n=83, huge pages, cross-host ratios, or IDEA-20261015-b41f68 claims (1)-(4).
  unresolved_confounds:
    - >-
      H-ICPERF-5adc9b is unamended v1 text ("Stage 0 checks that shape", "The
      CV band is the shape control", prediction both_bands_hold, "draws from
      the geometric law"). That shape reading is not adopted: the band flags
      are implied by the integers and were true for both wrong samplers
      (red-team L3; DEC-20261029-22e05b F4).
    - >-
      The run report (reports/run-20261030T1525Z) labels cv_in_band and
      median_ratio_in_band "measured", fraction_true 1, n = 1 (primary only),
      and omits the controls' band flags (red-team L4); tabulated for all
      three units in O1-O3 and O6 here.
    - >-
      CTL-2 is an affine image of the primary and CTL-1 a known-outcome
      choice from a design scan; both share step(), draw() and moments() with
      the primary, so neither detects a common-mode code error (red-team L2).
      The blind from-prose implementation is the check that does.
  confound_assessment:
    - {comparison: CMP-PRIMARY, verdict: isolated, basis: "Absolute comparison of one deterministic unit with out-of-sample integers fixed 2026-10-17 (EXP-ICPERF-b2f2d0 at 0fcf799458); seed, p_den, n_targets, shifts and support asserted; exact equality; blind from-prose implementation agrees."}
    - {comparison: CMP-CTL-1, verdict: isolated, basis: "Arms differ only in the shift triple ((13,17,5) vs (1,2,14)), asserted /shifts; exact match fails as required. Control integers are in-sample calibration (PRED-CONTROLS) from an unretained design scan, now reproduced blind."}
    - {comparison: CMP-CTL-2, verdict: isolated, basis: "Arms differ only in support_min (1 vs 0), asserted /support_min. Isolated but arithmetically tied to the primary (S-64, Q-2S+64, median-1), so it tests the support_min path, not the generator."}
    - {comparison: CMP-AA, verdict: isolated, basis: "Recorded units against audit replays of the same run.py: 3 of 3 matched on 11 exact pointers. Process, host and interpreter (3.11.17 vs 3.13.18) co-varied; no value differs, so nothing needs attribution. The tool's parity note is a false negative (PARITY-1)."}
