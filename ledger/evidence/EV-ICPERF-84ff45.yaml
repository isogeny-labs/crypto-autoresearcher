      - {run: RUN-ICPERF-74e9a2, arm: CTL-2, cv_sq: 9871039/8288641, cv_sq_decimal: 1.19091, median_ratio: 1728/2879, median_ratio_decimal: 0.60021, cv_in_band: true, median_ratio_in_band: true, exact_match: false}
