  # ---------------------------------------------------------------------------
  scoped_claim: >-
    For x-labels of proper (relation-free) rank-r log-GAP half-boxes (r in {1, 2, 3}; fixed origin; one
    representative per +-c; lexicographic fill; T minimal by vector count) of n in {256, 512, 1024, 2048, 4096}
    labels, on generated prime-order ordinary curves of 20, 24 and 28 bits (main seed block 8,100,000 + c; 50 to
    1440 curves per cell), the exact pair-sum (h = 2) coincidence count matches the matched uniform-label null
    within the preregistered 5% tolerance in 44 of the 45 toy cells: |kappa - 1| < 0.05 with every curve-cluster
    95% interval inside [0.90, 1.10]. The observed |kappa - 1| is at most 0.041 overall and at most 0.009 at
    n >= 1024. Cell b20-r3-n4096 is not assessed, relation-bearing log-GAPs are untested, and support is for the
    5% tolerance, not for exact random-set behaviour.

  claim_boundaries:
    curve_family_and_field: >-
      Prime-order ordinary short-Weierstrass E/F_p from the vendored generate_prime_order_curve(bits, seed). The
      generator excludes j = 0, j = 1728 and anomalous curves.
    bit_sizes: 20, 24, 28
    instance_generation: seed = 8,100,000 + c (main block), c < 2000; cells at the same bits share curves; base points and null streams seeded per (cell, curve)
    solver_and_version: experiments/EXP-PFDR-bb0d26/implementation/ at authority commit 48bd193a (run.py 1d889ad9..., labelsum.c 28a80d52..., check.py c7efb467..., vendor/curve.py fcca2beb...), CPython 3.11.15
    parameter_range: r in {1, 2, 3}; n in {256, 512, 1024, 2048, 4096}; 20 null replicates; plant fraction 0.30; 2000 bootstrap resamples
    seeds_and_instances: 50 to 1440 curves per cell (design.json), 6653 ok jobs, 1580 distinct curves
    controls_and_baselines: matched uniform null (C2), planted label AP (C3), null-vs-null calibration (C4), even/odd curves A/A, scaling identity (C7); Pollard rho (C8) not run, because no cost claim is made
    resource_limits: 4 workers, 4 GB, per-trial watchdogs; machine protection only
    scale_relevance:
      label: toy-scale
      justification: direct computation at p of 20 to 28 bits and n up to 4096; no correspondence; no transfer asserted
    transfer_and_extrapolation_assumptions:
      - None asserted. Nothing is claimed for p outside 20-28 bits, n outside 256-4096, any standardized or deployed curve, or any growth law (the log-kappa slopes are descriptive within the tested range only).
    largest_claim_justified: see scoped_claim
  boundaries:
    - "Negative-result semantics: no label-additive structure meeting the preregistered threshold was observed over the tested cells, curves, construction and implementation. This does not show that no label structure exists, that other set families, labelings or sizes behave alike, or that no other predicate describes these sets."
    - "Proper log-GAPs only. The only four relation-bearing draws of the census (b20-r3-n4096, c = 6, 30, 42, 47) were excluded unmeasured by the frozen degenerate rule. They are the instances most favourable to the alternative; their absence is selection, not chance missingness."
    - "b20-r3-n4096 is not assessed: invalid, never null. Its 46-curve descriptive kappa is never a reading. The 45-cell quantifier of P1 is observed at 44 cells only."
    - "Pair-sum (h = 2) structure only. Not excluded: multiplicative, algebraic, polynomial, constructible, interpolation-based or source-recovery label predicates; coincidence order h >= 3."
    - "x-labels (R1) only. Not y-labels, other coordinates or other curve models."
    - "Not tested: translated boxes x(Q + cP) (target-dependent bases), other fills or orders, full boxes with both lifts, rank >= 4, non-GAP bases, or unions of short rank-1 progressions such as the unknown-sharing base of IDEA-20261017-bbc53e."
    - "The decision_impact.on_positive wording ('scoped closure of label-describable rank <= 3 log-GAP bases'; 'the implicit-membership route of KN-OPEN-020 ... not opened by a label predicate') is NOT adopted. It is broader than the measured property and the tested object (red team O1). KN-OPEN-020 stays open."
    - "No cost, exponent, attack, real-curve, security or asymptotic statement. The held real-curve extension (HU-5) is untested."
  unresolved_confounds:
    - "Cell-level over-dispersion of the log-GAP z (OBS-6), unexplained. Chance after look-elsewhere and a small cell-specific effect below the tolerance cannot be separated without a fresh-curve replication of the |z| > 2 cells."
    - "Group-to-label sensitivity is unvalidated. The plant is label-side structure; no positive control exists in which group structure is known to induce label structure (red team O7)."
    - "Calibration gate power is low (red team O6). z_cal itself is well calibrated (sum z^2 44.9 on 44), but the gate would pass a moderate miscalibration with probability 0.36 to 0.40."
    - "First-order relation model (blind F3; red team Q3): 0 ok jobs with any duplicate skip against about 2.7 to 3.2 expected (P about 0.04 to 0.065). This is mild and chance-level; the own-code scan explains the one near case (b20-r3-n2048 c 23)."

  confound_assessment:
    - comparison: C-struct-null
      verdict: isolated
      basis: >-
        In every ok job the log-GAP arm and the 20 null sets were built on the same curve (p, a, b, N), from the
        same label universe, and counted by the same kernel; they differ only in set construction (J2: 1580 curves
        on the seed rule; J3: both arms regenerated by disjoint code on 15 jobs, 838/838 fields). A degenerate
        job builds neither arm, so the pairing holds on all 6653 ok jobs. The degenerate exclusion conditions the
        population on properness (a scope restriction, see boundaries); it does not unbalance the arms.
    - comparison: C-plant-null
      verdict: isolated
      basis: >-
        The plant and null sets were built on the same curves with the same kernel. The plant was feasible on every
        curve of every powered cell, and m was minimal under the exact rule (J3: 15 plant sets regenerated from the
        specification text). Read flagged in 44/44 cells (red team).
    - comparison: C-aa-null
      verdict: randomized
      basis: >-
        Replicate 0 against replicates 1..19, each from its own seeded stream on the same curve. Per cell: 0 of 44
        flagged, 44 null. z_cal sum of z^2 is 44.9 on 44 (p 0.44), and the 880 leave-one-out comparisons flag 0
        (red team; blind calibration identical).
    - comparison: C-aa-curves
      verdict: randomized
      basis: >-
        Even and odd curve indices are disjoint halves of one randomized draw. 0 of 44 flagged and 2 intermediate
        (b24-r1-n256, b24-r3-n256); sum of z^2 is 40.5 on 44 (p 0.62) (red team; blind F4).
    - comparison: C-aa-scale
      verdict: isolated
      basis: >-
        An exact identity check run in the selftest only. Scaling the labels of 12 toy sets (p of 12-16 bits) by u^2
        left C and D unchanged (scaling-identity:0 to :11 pass), and the selftest replayed byte-identically under
        3.11.15 (J1). Census jobs used u = 1, so the identity was exercised at selftest scale only, as planned.

  # ---------------------------------------------------------------------------
  obstruction:
    obstruction_note: >-
      Filled because the specification's decision_impact.on_positive requires it. The direction is supports, not
      weakens. The obstruction is to reading these label sets as label-additively structured; it is not an
      obstruction to H1.
    statement: >-
      For x-labels of proper rank-r (r <= 3) log-GAP half-boxes of 256 to 4096 labels on generated prime-order
      curves of 20 to 28 bits, the pair-sum (h = 2) coincidence count equals the matched uniform-label count
      within 5% in 44 of 45 cells. This is a measured property of these label sets. It blocks reading them as
