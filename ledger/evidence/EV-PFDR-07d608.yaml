      - id: OBS-2
        text: >-
          RUN-PFDR-089edc analysis.json (scoped citability per DEC-20261029-5554ee; exact 3.11.15 audit replay made
          in this round's J1):
          - outcome O-NULL and headline SUPPORT_SCOPED;
          - calibration n 44, mean -0.26757013662385903, sd 0.9735699770654103, pass true;
          - fraction_valid 0.9777777777777777, flagged_cells [], powered_cells 44, plant_infeasible_cells [],
            null_mean_anomalies [];
          - 44 cells are class null and b20-r3-n4096 is class invalid.
      - id: OBS-3
        text: >-
          Extremes over the 44 powered cells:
          - largest |kappa - 1| 0.04140 at b28-r1-n256 (kappa 1.04140, ci95 [1.00996, 1.07428]);
          - lowest ci95 bound 0.93684 (b28-r2-n512); largest |z| 3.131 (b24-r1-n2048);
          - |kappa - 1| <= 0.0089 at n >= 1024 and <= 0.0025 at n >= 2048;
          - smallest plant_kappa 1.28852 (b20-r2-n4096) and smallest plant_z 21.93 (b24-r2-n256);
          - |log-kappa slope| <= 0.0088 for every (bits, r).
      - id: OBS-4
        text: >-
          J1: analyze-main, analyze-final, selftest and census-toy-rep replay byte-identically under CPython
          3.11.15. The DEC-20261029-5554ee tolerance was never invoked. A 3.13.17 control reproduces the audit's
          drift exactly: 2 summary float leaves (416 and 402 ulps) and 479 analysis float leaves, max rel
          6.47e-11, with 0 non-float leaves.
      - id: OBS-5
        text: >-
          The four degenerate jobs (c 6, 30, 42, 47) each carry a short relation among the seeded base points
          (sup-norm 8 to 14). The relation forces exactly the recorded duplicate skips, so H(3, 10) holds only 3566,
          4006, 3030 and 2641 distinct labels. Every one of the 6653 ok jobs has duplicate_skips 0 (J2, J3, red team
          Q3).
      - id: OBS-6
        text: >-
          This test was not preregistered. Over the 44 cells, the log-GAP z values have sum of z^2 = 71.43 on 44
          (p about 0.006 under independence), population sd 1.262 and mean 0.175. Six cells have |z| > 2
          (b20-r1-n4096, b20-r3-n256, b24-r1-n2048, b24-r3-n2048, b28-r1-n256, b28-r2-n512), and the same six
          intervals exclude 1. The A/A arms on the same cells give 44.9 on 44 (z_cal) and 40.5 on 44 (even/odd).
          The per-curve variance of the gap arm matches the null. The excess comes from cell-level shifts of mixed
          sign that do not repeat across bits (blind F1; red team O3). The Coordinator re-summed 71.43 from the
          recorded z values.
      - id: OBS-7
        text: >-
          Controls and proves-too-much. The plant reads flagged in 44/44 cells (lowest bootstrap lower bound
          1.2877). The A/A null reads null in 44/44 and flags 0/880 in leave-one-out. The even/odd A/A flags 0/44
          (2 intermediate). The selftest scaling identity passes for 12 sets. The invalid cell is never read as
          null. No record states a real-curve or asymptotic claim (red team).
    comparison:
      - id: CMP-1
        text: >-
          Blind re-derivation against the recorded reading, cell by cell (analysis.md table):
          - S equal in all 44 cells; M equal at two decimals; kappa equal at six decimals; z and z_cal equal at three
            decimals.
          - Class equal in all 45 cells (44 null, 1 invalid). Calibration, fraction_valid, outcome and headline
            equal.
          - The ci95 endpoints agree within a Monte Carlo tolerance: the bootstrap seed derivation is not in the
            specification (blind U4), and the re-deriver used its own declared seed. The largest endpoint difference
            is 0.0034 (b24-r2-n256 upper, 1.02189 recorded against 1.02526 blind). That is inside the re-deriver's
            own spread across variants (<= 0.0039), and no endpoint is within 0.024 of the band.
      - id: CMP-2
        text: >-
          Against the frozen predictions. P1 is met on 44/44 powered cells and not assessed at b20-r3-n4096. P2 is
          met on 44/44. P-detect is not met. The C4 gate passes. The O-NULL rule is met at 44/45 valid.
      - id: CMP-3
        text: >-
          Against the coordinator prior (frozen before any reviewer): every expected finding met, and no stop
          condition fired. The prior did not anticipate OBS-6, the flag-power error, the low gate power or the
          proper-GAP selection.
      - id: CMP-4
        text: >-
          Against the A/A noise floor. Cross-cell dispersion of the log-GAP z (71.4) exceeds the A/A arms (44.9,
          40.5); per-curve dispersion does not; and every kappa deviation is inside the 5% band.
    inference:
      - id: INF-1
        text: >-
          H1 holds at the preregistered 5% tolerance in 44 of 45 toy cells, in the scope of scoped_claim below.
      - id: INF-2
        text: >-
          The reading is neither an instrument artefact nor a pipeline artefact. The plant is recovered
          everywhere, and an MDE of 0.079 in the weakest powered cell (b28-r1-n512, M 3922.5) would have read
          non-null with 95% probability. The A/A comparisons stay at nominal. Replay, recount and blind
          re-derivation each reproduce the reading.
      - id: INF-3
        text: >-
          The measured property is h = 2 additive energy of the x-labels. An additive (small-doubling or
          label-AP) label predicate for these label sets is not supported at these sizes, beyond planted-type
          substructure of about 2 to 47 labels (red team rt_ap_bound, a scaling estimate). The measurement does
          not decide "label-describable", does not reach the IDEA-20261017-bbc53e base, and leaves KN-OPEN-020
          open.
      - id: INF-4
        text: >-
          OBS-6 is unexplained. Chance after look-elsewhere and a small cell-specific effect below the tolerance
          are both compatible with the data; a replication of the |z| > 2 cells is the discriminating test. No
          class depends on it.
    limitation:
