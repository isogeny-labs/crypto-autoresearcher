  direction: supports
  direction_scope: >-
    Supports H-SEMAEV-94dab2 in the cells where the legacy polynomial was
    solved or analysed to completion: every m4 invariant of
    RUN-ICINV-e0cd8f-m3class and the C16-1 decomposition basis, cost and
    cost correlation of RUN-FIB-004/006C. In the capped cells (MTIC-007,
    -008, -010b; FIB C16-2, C20-1, C20-2) the repaired arm equals the legacy
    arm on every S4-dependent output, which is the per-cell falsification
    condition: the defect is inert there within the archived caps.
  strength: preliminary
  strength_justification: >-
    Predefined frozen protocol, one-factor arm contrast with both arms on one
    host concurrently, a legacy-arm A/A that reproduced every deterministic
    archived field (CTRL-LEGACY-REPRO 7/7), and retained artifacts; the
    deterministic changes (552/552 ICINV m4 tuples, 200/200 C16-1 basis
    tuples) are exact and the ICINV values were blindly re-derived by the
    validator. Capped at preliminary because (a) the review's validator ran
    as a subagent of the producing session, not the independent session its
    handoff required (procedure deviation in DEC-20261018-3b4a32), and (b)
    the timing-derived quantities (C16-1 medians, rho_s) rest on one
    execution per arm.
  claim_tier: toy
  claim_tier_note: >-
    The archived toy instances only: MTIC 16/20/24-bit curves, FIB C16-1,
    C16-2, C20-1, C20-2, ICINV p = 4001 class (138 curves) and control set
    (138 curves), each with a gauge twin.
  certificate_refs: []
  proof_status: not_applicable
  proof_refs: []
  scale_relevance: toy-scale
  scale_relevance_justification: direct computation on the archived toy instances; nothing transfers to other sizes
  curve_family: prime-field short Weierstrass curves (MTIC, FIB toy instances; ICINV p = 4001 isogeny class and random control)
  bit_sizes: [12, 16, 20, 24]
  instance_generation: archived frozen instances and seeds, unchanged
  solver_and_version: sympy 1.14.0 Buchberger (MTIC, FIB); Singular 4.4.1 std (ICINV); CPython 3.13.16, Linux x86_64
  seeds_and_instances: archived (MTIC seeds 1-3; FIB instance seeds 1, 2 and permutation seed 20260807; ICINV seed 20260810 curve lists)
  controls: CTRL-LEGACY-REPRO (pass 7/7), CTRL-ARM-FINGERPRINT (pass), CTRL-REEXTRACT (pass), CTRL-IMMUNE-BY-IMPORT
  resource_limits: archived caps (60 s and 20 s per solve, 1500 s cumulative, 1800 s FIB run cap, 180 s Singular); 8 GB per process
  validation:
    task_id: TASK-20261018-83a561
    report: experiments/EXP-SEMAEV-93d5cc/reviews/TASK-20261018-83a561/validation-report.md
    report_id: VAL-20261024-c8a775
    verdict: passed
    joint: run_integrity_and_controls holds on all 7 cells
  observations:
  - id: O1
    statement: >-
      Legacy arm equals the archive on every deterministic field in every
      cell: 552/552 ICINV m4 tuples; FIB per-target tuples on all 200+75 and
      75+15 targets; MTIC per-target tuples on 25, 13, 12 targets; MTIC-010b
      regime and K*. Capped counts reproduced exactly on this host.
  - id: O2
    statement: >-
      ICINV m4: s4_support 439 on 550 records and 391 on 2 (class curve 77
      and its gauge twin, where a^3 + 8b^2 = 0 mod 4001 zeroes 48
      coefficients) against archived 227 (546), 225 (4), 210 (2);
      singular-locus dim/degree 2/39 on all 552 against 2/60; gauge
      agreement 276/276 in every arm.
  - id: O3
    statement: >-
      FIB C16-1: all 200 targets solved uncapped in every arm; repaired
      basis size 14-19 and max degree 5 or 6 against 3-4 and 5; repaired
      median 3.678 s against 0.0579 s (legacy rerun) and 0.0279 s
      (archive); repaired times split exactly by max degree (degree 6: all
      109 below 4.5 s; degree 5: all 91 at or above 4.5 s).
  - id: O4
    statement: >-
      FIB C16-2 repaired measured 31 targets (1800 s run cap reached after
      C16-1 took 1189 s) against 75; all capped in every arm. C20-1/C20-2:
      75/15 measured, all capped, identical in every arm.
  - id: O5
    statement: >-
      C16-1 Spearman rho_s: archived -0.024, legacy rerun -0.097, repaired
      -0.366 (null 95% half-width 0.139). Correlation gate: no curve passes
      in any arm; cost gate passes; RUN-FIB-008 stays cancelled.
  - id: O6
    statement: >-
      MTIC 007/008/010b: every attempted descent capped at 60 s in every
      arm; regime (i), K* infinite under all accountings at 16, 20 and 24
      bits and for both ablation bases, in every arm.
  confound_assessment:
  - comparison: C-defect
    verdict: isolated
    basis: >-
      Arms differ only in the s4_expr binding (pinned sources, installed
      fingerprints and per-child arm logs verified by the validator); same
      program, inputs, seeds, caps, host and concurrent timing.
  - comparison: C-aa-legacy-archive
    verdict: isolated
    basis: same function and inputs on a different host and date; zero deterministic differences, timing spread recorded (C16-1 median 0.0279 vs 0.0579 s; rho_s 0.073)
  - comparison: C-repaired-archive
    verdict: not_isolated
    basis: s4_arm and execution_environment both differ; reported for the owner's archived-vs-repaired table only and decides nothing alone
  prediction_outcomes:
  - prediction: P1
    outcome: >-
      calibration (partially in sample): 439 on 550 of 552 records; the two
      391 records are explained by a^3 + 8b^2 = 0 mod p on class curve 77
    decisive: false
  - prediction: P2
    outcome: the ICINV CLASS-VARYING verdict rests on m3 only and is unaffected (held)
    decisive: true
  - prediction: P3
    outcome: no direction predicted; MTIC and FIB categorical outcomes unchanged
    decisive: false
  inference: >-
    The defect changed the recorded S4-dependent outputs wherever the legacy
    polynomial was solved or analysed to completion (ICINV m4; FIB C16-1),
    and left them unchanged wherever every solve hit its cap (MTIC, FIB C16-2
    and C20). No frozen MTIC or FIB conclusion field changes; the ICINV m4
    secondary values change; the FIB C16-1 association moves from the
    EXP-FIB-001 falsification band into its inconclusive band (outside this
    contract's frozen fields).
  boundaries:
  - Toy tier; the archived instances only.
  - Unchanged capped cells mean the caps still bind with the exact S4, not that S4 is irrelevant to cost.
  - One execution per arm; timing-derived quantities carry the recorded A/A spread.
  - No cost, speedup, security or ECDLP claim; not an improvement over any index-calculus baseline.
  unresolved_confounds:
  - Five run manifests record code.commit as the HEAD at run end, not start; no pinned source differs between the two (validator L1).
  - RUN-SEMAEV-0e5876's manifest code.command names the parent launch.py; command.txt records the actual launch_successor.py argv (validator L2).
  - Trial manifests do not record peak memory.
  - The archived programs were untracked at their run commits; their run-time bytes are evidenced only by the exact legacy reproduction.
