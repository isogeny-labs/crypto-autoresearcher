research_question:
  id: RQ-ECC-3fae8b
  title: Which explicit Curve25519 formulas and coordinate systems reduce operation
    count or strengthen completeness?
  scope:
    curve_families:
    - montgomery
    - twisted_edwards
    field_types:
    - prime
    bit_sizes:
    - 255
    methods:
    - montgomery_ladder
    - edwards_extended
    - coordinate_change
    - isogeny_map
    - formula_search
    - verification
  motivation: Curve25519 formulas are copied from RFC 7748 and HCD 2008; a coordinated
    derivation and verification pass can find cheaper or more complete laws and make
    the claims checkable.
  decision_target: Which explicit formula or coordinate system beats the filed baseline
    in M/S or completeness, verified by a script the repository can run.
  constraints:
  - explicit formulas only; a count without the formulas is not a record
  - state completeness and the exceptional locus for every law
  status: active
  owner: coordinator
