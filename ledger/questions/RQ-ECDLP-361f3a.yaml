research_question:
  id: RQ-ECDLP-361f3a
  title: >-
    Which decomposition oracles, factor-base descriptions or relation mechanisms
    for prime-field elliptic-curve index calculus can move the end-to-end cost
    exponent or the end-to-end constant below the current measured incumbent
    (Table B, m = 2 folded/walked pair table; sealed prime toy bounds
    ECBND1h93b7a9d5c187 and ECBND1h9879c0aa348f) -- and, for each mechanism the
    program has tried, what proved, measured or cost-model obstruction decides
    it, at what arity and oracle cost?
  scope:
    curve_families:
      - >-
        prime-order ordinary curves y^2 = x^3 + Ax + B over F_p, generic (no CM,
        embedding degree > 1, non-anomalous), drawn by prime_search at the toy
        tier (fields <= 32 bits) for every measured cell; the ICV1 slugs of Table B
        (icv1-fp10-t5-192cb216 .. icv1-fp24-t1577-77336155) and of the sealed
        prime toy domain ECDOM1ha1f283af3a5d (fp18-tm337, fp20-t727, fp22-tm1385,
        fp24-t1059) are the frozen instances
      - >-
        SECONDARY, same question for Koblitz curves y^2 + xy = x^3 + a x^2 + 1 over
        F_{2^n}, n prime (ECC2K-130 family, m = 83 gate; Table A sizes n in
        {41, 47, 53, 57, 59, 61}) and random ordinary binary curves (Table B
        f2m15..f2m27), where the matched reference is rho.signed_frobenius_strong
    field_types: [prime, binary_extension]
    bit_sizes:
      - >-
        executable: prime fields 10-32 bits (toy tier) with end-to-end cold S in
        ecbench.gae against rho.negation on the same planted target; binary n <= 62
        (ecbench word limit) against rho.signed_frobenius_strong
      - >-
        model only: the arity/oracle-order exponent model is stated for all r;
        no claim at cryptographic size is made from toy measurements
    methods:
      - >-
        Semaev summation-polynomial decomposition at arity m with a factor base
        of size B = r^beta; oracle classes by enumeration order k (per-attempt
        cost B^k): exhaustive (k = m-1), meet-in-the-middle (k = ceil(m/2)),
        pair/root-finding (k = 1 at m = 2), Groebner and SAT on algebraically
        described bases, lattice small-root methods, and the open class
        k < m/2 - 1 for which no construction is known
      - >-
        counted in ecbench GAE with unpriced native work priced at 0, 0.1 and 1
        GAE per operation (crypto/AGENTS.md section 5a); one target, every phase,
        failures charged, setup amortisation stated
  motivation: >-
    After 147 atlas leads (72 closed with a named obstruction) the prime-field
    index-calculus lane has no sub-rho cell at any size and no sealed bound on
    any Table B row. The 2026-10-24 lead-discovery round (this question) audits
    every closed and open prime-field lead against its revisit condition and
    scope, asks which closures a short theorem would replace, and files only
    mechanisms that escape a named premise of a standing obstruction. The first
    deliverable is the arity/oracle-order threshold theorem (Lean target
    TASK-20261024-9fbb0f): it fixes exactly which oracle cost exponent an
    arity-m prime-field index calculus needs to beat 1/2, so that every future
    oracle proposal is decided by one measured exponent instead of a new
    campaign.
  decision_target: >-
    For each surviving lead, a committed record that either (a) moves a Table B
    row or seals a prime IC bound below the incumbent at every band weight
    (rule-in, Tier I), or (b) fits a cost exponent whose 95% CI excludes the
    matched rho's over >= 6 sizes spanning >= 12 bits (Tier X), or (c) names the
    theorem, proof, controlled measurement, literature row or cost model that
    closes the lead within a stated scope. A measured oracle order k >= m/2 - 1
    for every implemented prime-field oracle, together with the threshold
    theorem, is a complete answer for the enumerative class.
  constraints:
    - Prime fields first; binary and Koblitz leads are audited but not expanded here.
    - One instrument for every arm (ecbench GAE); rank only where the order holds across the 0 / 0.1 / 1 GAE band.
    - A stage win is a stage improvement until end-to-end S moves; relabelling and accounting changes are not improvements.
    - Gaps to matched rho are distance remaining, never pass/fail.
    - A timeout or uncontrolled null leaves a lead open; closure needs a named obstruction with kind, scope and a committed record.
    - Heuristics are numbered and carried as hypotheses into every theorem that uses them; Lean certifies derivations and exact facts, never measurements.
  related_questions: [RQ-ICPERF-94c86e, RQ-ECDLP-623a32, RQ-ECDLP-f0a7b0, RQ-ICINV-475b5e, RQ-SATIC-1ae57a]
  atlas_brief_at_open: >-
    ECDLP lead atlas reviewed 2026-10-24: 147 leads, 72 closed with a named
    obstruction, 51 open with a decided next step, 16 blocked, 8 unexamined;
    2049/2078 records mapped; changed since review: crypto-autoresearcher 146
    paths, crypto 16, cryptanalysis 32, ecc-challenges 3.
  status: active
  owner: coordinator
  added: 2026-10-24
