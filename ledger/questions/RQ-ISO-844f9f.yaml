research_question:
  id: RQ-ISO-844f9f
  title: Which isogeny mechanism, cleared against the filed hypotheses, evidence and
    Lean lemmas, could move a security estimate or yield a checkable attack artifact?
  scope:
    curve_families:
    - supersingular
    - ordinary
    field_types:
    - prime
    bit_sizes:
    - 256
    - 384
    - 512
    methods:
    - endring
    - sqisign
    - higher_dimensional
    - csidh
    - pathfinding
    - post_sidh
  motivation: Isogeny-based cryptography is the program's densest open lane; the brief
    lists every filed hypothesis, contradiction, Lean lemma and experiment, so a lead
    must clear them rather than rediscover them.
  decision_target: Which isogeny mechanism could move a security estimate or produce
    a checkable attack artifact, and which filed closure would it overturn?
  constraints:
  - cite the filed hypothesis/evidence/Lean lemma each lead clears
  - no re-proposal of a lane the ledger records as refuted or weakened
  status: active
  owner: coordinator
