review_plan:
  schema: binstd.formal_review_plan.v1
  input_manifest: research/binstd_formal_review_20261027/inputs.json
  blind_input: research/binstd_formal_review_20261027/blind-statements.json
  producer_pr: 2484
  producer_head: 976b82bf60afda5e3d31c0da2704604ea2f2e5a5
  current_main_at_plan: d83b078e5c185578c033cc07a9bc3054e03de16b
  claim_under_review: >-
    Two exact declarations: factor8_irreducible_pair proves irreducibility in
    (ZMod 2)[X] of the factors encoded by 313 and 471;
    canonicalFrobenius_order_and_minpoly proves order 17 and the exact
    factor-product minimal polynomial of Frobenius on canonical GaloisField 2 17.
    Neither declaration claims an archived runner representation equivalence,
    exhaustive invariant-subspace classification or empirical yield result.
  coordinator_prior: >-
    I expect the finite factor arithmetic and canonical-field statements to
    be mathematically true and the named CI proof gate to pass. I have read the
    proof source and am not an independent fidelity reviewer. The highest-risk
    joints are whether the theorem types match the stated target, whether the
    cited verification receipts bind the current complete workspace, and whether
    any downstream Stage-1 claim silently assumes an unproved runner-to-canonical
    bridge or full invariant-subspace classification. A green build alone would
    not settle those semantic questions.
  joints:
    - id: J1-theorem-and-verifier-fidelity
      assigned_to: T-608
      write_scope: research/binstd_formal_review_20261027/reports/J1/
      policy: review-adversarial
      attack_plan: >-
        At exact producer head, inspect elaborated types, definitions, target
        YAMLs, source and dependency pins, proof-verification receipts and
        current exact-head CI. Check theorem names, quantifiers, field,
        polynomial coefficient mapping, forbidden constructs and transitive
        axioms. Try an omitted-module or wrong-name control against the
        verifier if feasible without a heavy local build. Distinguish named
        Lean evidence from a full workspace gate and semantic proof fidelity.
      breaking_artifact: >-
        An exact type/claim mismatch, unbound input, unapproved axiom, false
        success from a missing theorem, or a reproducible current-head gate
        failure. Otherwise report scoped machine/fidelity findings and limits.
    - id: J2-blind-arithmetic-and-concrete-bridge
      assigned_to: T-609
      write_scope: research/binstd_formal_review_20261027/reports/J2/
      policy: review-adversarial
      attack_plan: >-
        First read only blind-statements.json, derive factor irreducibility and
        Frobenius order/minpoly independently with a separate implementation or
        proof, and seal commands, output and method. Only after sealing may this
        reviewer inspect producer source, targets and receipts. Check the
        bitmask-to-polynomial mapping, runner modulus and whether a genuine
        isomorphism/conjugacy and invariant-subspace classification are proved.
      breaking_artifact: >-
        A reproducible arithmetic contradiction or false control accepted by
        the claimed theorem; otherwise a source-independent derivation with an
        explicit missing-bridge list and no empirical inference.
  proves_too_much:
    assigned_to: T-609
    objects:
      - X^8+1, reducible over F_2
      - Frobenius on GF(2), whose order and minimal polynomial differ from GF(2^17)
    failure_signature: >-
      The independent method must distinguish these from the degree-eight
      archived factors and canonical GF(2^17). This tests the method, not the
      truth of the producer theorem by itself.
  blind_rederivation:
    assigned_to: T-609
    input: research/binstd_formal_review_20261027/blind-statements.json
    required: true
    seal_before_reading_producer: true
    forbidden_paths: listed in blind-statements.json
  machine_gate:
    owner: coordinator
    required: >-
      Fresh exact-head named-module Lean build, #print axioms and fail-closed
      transitive audit on the two declarations; reconcile complete source
      coverage and verifier input hashes. Do not substitute old receipts or
      merely green unrelated checks. Reserve exclusive memory admission before
      a local complete Mathlib build; hosted current-head CI may be observed
      without dispatching a duplicate job.
  review_boundaries:
    - No EXP/RUN/EV/DEC or hypothesis-status change from this technical packet.
    - No archive rewriting; corrections require new records.
    - Reviewers do not read sibling reports before their own reports are sealed.
    - A missing concrete bridge is partial fidelity for a concrete Stage-1 claim,
      not a refutation of the scoped canonical Lean theorems.
  procedure_deviations:
    - >-
      Conductor accepted archival reviewer cards T-608 and T-609 without
      reserving their requested subdirectory scopes while T-607 held the parent.
      The Coordinator will release T-607 before dispatch and constrain each
      reviewer to its named report directory. No heavy workload is authorized
      by these unscoped cards.
