<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
  <title id="title">BINSTD formal review evidence boundary</title>
  <desc id="desc">Archived polynomial parameters lead to two scoped Lean statements. A separate, unproved bridge to the historical runner prevents inference about its yields.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#385c72"/></marker>
    <style>
      text { font-family: DejaVu Sans, sans-serif; fill: #173042; }
      .title { font-size: 22px; font-weight: 700; }
      .head { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 12px; fill: #425b6b; }
      .box { fill: #eef6fa; stroke: #477b97; stroke-width: 2; rx: 9; }
      .scope { fill: #e9f5ed; stroke: #408158; stroke-width: 2; rx: 9; }
      .gap { fill: #fff4e4; stroke: #a56a26; stroke-width: 2; stroke-dasharray: 7 5; rx: 9; }
      .line { fill: none; stroke: #385c72; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="490" fill="#fcfdfd"/>
  <text class="title" x="30" y="38">BINSTD: what the Lean claims can establish</text>
  <rect class="box" x="30" y="68" width="245" height="125"/>
  <text class="head" x="45" y="95">Frozen Stage 1 inputs</text>
  <text class="body" x="45" y="122">n = 17; factors 3, 313, 471</text>
  <text class="body" x="45" y="146">Archived runner modulus 131081</text>
  <text class="small" x="45" y="172">Parameters only; no proof of yields</text>
  <rect class="scope" x="338" y="68" width="530" height="125"/>
  <text class="head" x="353" y="96">Scoped formal statements</text>
  <text class="body" x="353" y="123">313 and 471: irreducible in F₂[X]</text>
  <text class="body" x="353" y="148">Canonical GF(2¹⁷) Frobenius: order 17, stated minpoly</text>
  <text class="small" x="353" y="174">Exact declarations require a current Lean build and axiom audit</text>
  <path class="line" d="M275,130 H332"/>
  <path class="line" d="M603,193 V224"/>
  <rect class="gap" x="338" y="228" width="530" height="104"/>
  <text class="head" x="353" y="256">Missing concrete bridges</text>
  <text class="body" x="353" y="281">Runner ↔ canonical field map and Frobenius conjugacy</text>
  <text class="body" x="353" y="306">Complete invariant-subspace classification</text>
  <path class="line" d="M603,332 V360"/>
  <rect class="box" x="338" y="365" width="530" height="89"/>
  <text class="head" x="353" y="393">Historical Stage 1 performance</text>
  <text class="body" x="353" y="419">Target selection, execution, timings, yields, and security cost</text>
  <text class="small" x="353" y="440">These remain separate empirical obligations.</text>
  <text class="small" x="30" y="472">Review packet: research/binstd_formal_review_20261027 | PR #2484, head 976b82bf…</text>
</svg>
