   <g id="text_1">
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(40.324441 36.973486)">RECOVERED SOURCE</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(44.473144 48.159681)">Ma94: 29 July 1994</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(30.924691 59.345877)">130 pages; exact PS hash</text>
   </g>
   <g id="text_2">
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(186.631153 36.973486)">DOCUMENTED MECHANISMS</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(190.56652 48.159681)">CRT and baby-step bounds</text>
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(193.907919 59.345877)">Type2 repeated-fiber gap</text>
   </g>
   <g id="text_3">
    <text style="font: 8.3px 'DejaVu Sans'" transform="translate(347.995588 36.973486)">RETAINED COHORT CHECK</text>
