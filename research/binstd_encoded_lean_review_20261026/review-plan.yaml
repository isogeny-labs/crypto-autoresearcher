review_plan:
  claim_under_review: >-
    At producer PR head 6409590d9bf26201956095e87f36f25d346cba68,
    CryptoResearch.Binstd.EncodedDivisors.archived_no_small_monic_divisors
    states that the source-defined XOR-and-shift bitmask predicate returns true
    on archived masks 131081, 313 and 471, traverses exactly 510, 30 and 30
    monic candidates, and returns false on known-reducible controls 131073
    and 257. The source does not claim a Lean theorem of polynomial
    irreducibility or a normal-basis/Frobenius bridge.
  coordinator_prior: >-
    I authored the producer certificate and cannot independently certify its
    semantic fidelity. I expect the pinned direct Lean checks to reproduce and
    the finite encoded truth table to hold. The main risks are an omitted
    divisor degree or lower mask, an insufficient reduction fuel bound, a
    mismatch between bitmasks and claimed polynomials, and conflating the
    source-defined computation with irreducibility in (ZMod 2)[X]. The full
    Mathlib workspace gate is expected to remain unverified while another
    host Lake build owns the heavy-build slot and hosted Actions cannot assign
    runners.
  joints:
    - joint: J1-exact-theorem-and-workflow-fidelity
      assigned_to: TASK-20261026-538444
      attack_plan: >-
        Freeze the exact producer revision and hashes in inputs.json. Compare
        the elaborated type of the combined theorem with the target spec,
        archived evidence and report. Expand noSmallMonicDivisor, trialCount
        and remFuel: test the half-degree bound, whether all lower monic masks
        occur, and whether fuel could leave an unreduced value on these exact
        inputs. Independently rerun the direct pinned Lean compile and axiom
        prints; inspect the receipt generator and distinguish it from the
        missing full Lake gate. Try a mutated positive or false control and
        retain its actual result. Trace any claim of polynomial irreducibility
        to a checked bitmask-to-(ZMod 2)[X] bridge, or mark the bridge absent.
      breaking_artifact: >-
        A reproducible mismatch between theorem type and source claim, a
        missing candidate, failed control, forbidden axiom, stale hash,
        false-success gate, or an exact counterexample to the stated encoded
        predicate; otherwise a scoped fidelity table with missing bridges.
    - joint: J2-blind-finite-arithmetic-and-controls
      assigned_to: TASK-20261026-7ab9cb
      attack_plan: >-
        Read only blind-statements.json and own handoff. Implement or derive
        the stated XOR-and-shift reduction independently from its mathematical
        description. Compute candidate counts and predicate values for all
        five masks; independently test degree-one divisor mask 3 on the two
        known-reducible controls. Check whether a natural-number log2 or fuel
        edge could change these concrete answers. Seal a result before any
        producer source, receipt or sibling review is read.
      breaking_artifact: >-
        An independently reproducible conflicting count, truth value or
        remainder, with raw computation and command; otherwise a scoped
        statement-only derivation and explicit limitations.
  blindness:
    mutual: true
    lifted_for:
      - TASK-20261026-034c33
    rationale: >-
      Only the archival Coordinator may compare sealed reviewer reports after
      both return. The two reviewer sessions may not read each other's work.
  proves_too_much:
    objects:
      - "131073, the reducible degree-17 mask X^17+1"
      - "257, the reducible degree-eight mask X^8+1"
    failure_signature: >-
      The same encoded predicate must return false on both, and divisor mask
      3 must leave zero encoded remainder. A reviewer should distinguish this
      finite check from a generic soundness theorem.
    assigned_to: TASK-20261026-7ab9cb
  blind_rederivation:
    required: true
    quantity: >-
      The finite predicate truth table, degree-one control remainders and
      candidate counts from the written mathematical algorithm and masks.
    parameters: research/binstd_encoded_lean_review_20261026/blind-statements.json
    blind_from:
      - formal/CryptoResearch/Binstd/EncodedDivisors.lean
      - formal/targets/binstd-encoded-divisors.yaml
      - research/binstd_end_to_end_20261026/
      - research/binstd_encoded_lean_review_20261026/inputs.json
      - research/binstd_encoded_lean_review_20261026/review-plan.yaml
      - research/binstd_encoded_lean_review_20261026/reports/TASK-20261026-538444/
      - git history and the producer PR
    assigned_to: TASK-20261026-7ab9cb
  procedure_deviations: []
