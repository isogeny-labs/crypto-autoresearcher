<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510"><rect width="1000" height="510" fill="#f7fafc"/><g font-family="sans-serif" fill="#172c40"><text x="35" y="43" font-size="25" font-weight="bold">Group two bits into three mutually exclusive indicators</text><text x="35" y="77" font-size="17">Theory-only candidate • even coordinate width s • no measured speedup</text><g fill="white" stroke="#486b8d" stroke-width="2"><rect x="35" y="104" width="420" height="200" rx="10"/><rect x="515" y="104" width="450" height="200" rx="10"/><rect x="35" y="350" width="930" height="125" rx="10"/></g><g font-size="20"><text x="55" y="138">Digit 0 → (0,0,0)</text><text x="55" y="174">Digit 1 → (1,0,0)</text><text x="55" y="210">Digit 2 → (0,1,0)</text><text x="55" y="246">Digit 3 → (0,0,1)</text><text x="55" y="282">Coordinate digit = u₁ + 2u₂ + 3u₃</text><text x="535" y="138">uⱼ² − uⱼ = 0; uⱼuₖ = 0 for j ≠ k</text><text x="535" y="174">Top ideal kills all products in a group</text><text x="535" y="210">s groups: degree s+1 repeats a group</text><text x="535" y="246">Therefore d_reg ≤ s+1</text><text x="535" y="282">Mutant solving-degree bound ≤ s+2</text><text x="55" y="386">Tradeoff: 2s → 3s variables; 6s local quadratic equations</text><text x="55" y="423">Same 4^s coordinate assignments; projection and inverse are explicit</text><text x="55" y="458">Construction, matrix width, SAT search and certificates still need a matched test</text></g><path d="M455 200 H515 M740 304 V350" stroke="#486b8d" stroke-width="3"/></g></svg>