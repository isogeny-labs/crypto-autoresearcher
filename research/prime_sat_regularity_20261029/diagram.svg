<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" fill="#f7fafc"/><g font-family="sans-serif" fill="#172c40"><text x="40" y="46" font-size="25" font-weight="bold">A scoped regularity reduction — proof under review</text><text x="40" y="77" font-size="16">Two summands; p &gt; 3; 2^s ≤ p; nonzero exact coordinate rejection predicates</text><g fill="white" stroke="#486b8d" stroke-width="2"><rect x="40" y="110" width="430" height="120" rx="12"/><rect x="530" y="110" width="430" height="120" rx="12"/><rect x="40" y="285" width="430" height="135" rx="12"/><rect x="530" y="285" width="430" height="135" rx="12"/><rect x="40" y="475" width="920" height="125" rx="12"/></g><g font-size="19"><text x="60" y="143">Baseline top ideal</text><text x="60" y="178">Variable squares and L₁² L₂²</text><text x="60" y="209">d_reg = s + ceil((s+2)/2)</text><text x="550" y="143">Augmented top ideal</text><text x="550" y="178">Add nonzero block predicates</text><text x="550" y="209">Each generates its block-top monomial</text><text x="60" y="321">Independent ingredients</text><text x="60" y="357">Strong Lefschetz rank in each block</text><text x="60" y="390">Tensor-product Hilbert calculation</text><text x="550" y="321">Candidate strict bound</text><text x="550" y="357">d_reg ≤ s + floor((s+1)/2)</text><text x="550" y="390">Same affine ideal; at least one degree less</text><text x="60" y="512">Scope and cost remain part of the result</text><text x="60" y="549">Exponential membership construction; no proved solving-time advantage</text><text x="60" y="581">No transfer to arbitrary higher arity; general ECDLP goal remains active</text></g><g stroke="#486b8d" stroke-width="3" fill="none"><path d="M470 170 H530 M255 230 V285 M745 230 V285 M470 350 H530 M745 420 V475"/></g></g></svg>