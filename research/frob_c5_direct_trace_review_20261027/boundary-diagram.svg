<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="FROB C5 successor trace review evidence boundary">
  <style>
    text { font: 17px system-ui, sans-serif; fill: #172b4d; }
    .small { font-size: 14px; }
    .title { font-size: 24px; font-weight: 700; }
    .box { fill: #f2f7ff; stroke: #315ca8; stroke-width: 2; rx: 12; }
    .control { fill: #fff3e0; stroke: #b66300; stroke-width: 2; rx: 12; }
    .boundary { fill: #f8ebeb; stroke: #a82e2e; stroke-width: 2; rx: 12; }
    .arrow { stroke: #315ca8; stroke-width: 2.5; fill: none; marker-end: url(#head); }
    .cut { stroke: #a82e2e; stroke-width: 3; stroke-dasharray: 8 5; }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#315ca8"/></marker></defs>
  <text x="28" y="38" class="title">FROB C5: successor trace review and historical boundary</text>
  <text x="28" y="65" class="small">Three fixed degree-five quotient algebras: q = 11, 13, 19</text>
  <rect x="28" y="91" width="270" height="84" class="box"/>
  <text x="48" y="122">Frozen modulus and native output</text>
  <text x="48" y="150" class="small">SHA-bound source inputs</text>
  <rect x="367" y="91" width="275" height="84" class="box"/>
  <text x="388" y="122">Direct repeated q-power</text>
  <text x="388" y="150" class="small">5-term trace on each basis vector</text>
  <rect x="367" y="221" width="275" height="84" class="box"/>
  <text x="388" y="252">Prior q-power matrix M</text>
  <text x="388" y="280" class="small">independent h(M) matrix path</text>
  <rect x="711" y="145" width="260" height="105" class="box"/>
  <text x="733" y="179">Compare all 25 entries</text>
  <text x="733" y="207" class="small">then rank / nullity / image</text>
  <path d="M298 132 H367" class="arrow"/>
  <path d="M298 154 C330 154 330 263 367 263" class="arrow"/>
  <path d="M642 132 C680 132 680 176 711 176" class="arrow"/>
  <path d="M642 263 C680 263 680 220 711 220" class="arrow"/>
  <rect x="711" y="282" width="260" height="67" class="control"/>
  <text x="733" y="311">Known-false control</text>
  <text x="733" y="336" class="small">q=13 four-term sum</text>
  <path d="M842 282 V250" class="arrow"/>
  <line x1="28" y1="390" x2="971" y2="390" class="cut"/>
  <text x="30" y="380" class="small">Review boundary: successor arithmetic cannot authenticate the original Sage process</text>
  <rect x="171" y="422" width="658" height="95" class="boundary"/>
  <text x="192" y="453">Historical loaded-source custody and C5 success flag remain open</text>
  <text x="192" y="481" class="small">No claim here about C8, ECDLP cost, speedup, or a production curve</text>
</svg>
