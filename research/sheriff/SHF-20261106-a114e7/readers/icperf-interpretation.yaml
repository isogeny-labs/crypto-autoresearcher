checks:
  - id: ICR-K1-chronology
    command: "git log --follow -- experiments/EXP-ICPERF-{284bc4,283a70}/specification.yaml; git merge-base --is-ancestor cb48b111d7 af94114e9c / cd912cacbb; git diff 714ebc4565^ 714ebc4565 -- ledger/hypotheses/"
    output: inline
    result: >-
      pass. Specs created 66ccdc9153 (2026-10-29 05:34Z), only status/frozen/approved_by flipped at
      cb48b111d7 (15:14Z), both ancestors of the run commits af94114e9c / cd912cacbb (2026-10-30). The
      hypothesis edits at 714ebc4565 change only status and status_note (statement, predictions and
      falsification text unchanged). Predicted integers were fixed 2026-10-17 in the v1 specs.
  - id: ICR-K2-forks
    command: "ls experiments/EXP-ICPERF-*/runbook-sessions; git ls-files experiments/EXP-ICPERF-*/runs; journal event types for RBS-ICPERF-b7e41c, c4a91e, 8cdc92, 67df7d; grep -rl H-ICPERF-2f52d1|5adc9b"
    output: inline
    result: >-
      pass (disclosed). Same-question units: v1 RUN-ICPERF-943efa (RBS-ICPERF-b7e41c, 2026-10-21; a
      2026-10-19 execution A of the same session id recorded an impediment and no unit, disclosed in
      DEC-20261029-9bc3ff, not named in EV-ICPERF-08f6f9) and v1 RUN-ICPERF-b09be8 (RBS-ICPERF-c4a91e);
      both named in EV not_evidence and in the v2 spec prediction_provenance.data_seen. Design-time
      executions of the v1 runners (the source of the preregistered integers) and the 21207-triple
      design scan that picked CTL-1 are disclosed in the specs. No other experiment tests either
      hypothesis. All outcomes are deterministic, so no best-of-k selection is possible.
  - id: ICR-K3-decision-rule
    command: "read spec success_criterion / decisive_test / decision_impact; compare with EV O1 and raw-result primary keys"
    output: inline
    result: >-
      pass, scoped. Both frozen rules are exact-equality rules with no margin; the outcomes meet them
      (925/4, ratios_agree, all_match_bsgs, 50/200/25; 2943/289567/28 with no split, controls fail exact
      match). No post-hoc margin. Two caveats: (i) each hypothesis's only negative outcome is "instrument
      invalid", never "refuted", so `supported` records instrument validation of an a-priori statement;
      (ii) the v2 decisive tests were written 2026-10-29 after the v1 outputs had been seen (disclosed in
      data_seen); they are stricter than v1 and the programs are deterministic, so no freedom was gained.
  - id: ICR-K4-wording-sweep
    command: "grep -n -i -E 'faster|speed ?up|speedup|latency|wall[- ]?time|end-to-end|attack cost|improve' $(cat scripts/readers/icperf-interpretation/wording_scope_files.txt)"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/wording_hits.txt
    result: >-
      103 hits in 36 files (every non-replay file of #3044 plus #3056/#3058 records). Every ledger,
      analysis, report.typ and PDF hit is a negation or scope fence. Asserting hits: one (red-team
      report 284bc4:343 "IC is about 2.1x faster online", illustrative). Quoted producer phrase: "no
      latency effect, no n=83 speedup, no attack" (review-plan 284bc4:28, corrected by CORR (c)) and "no
      latency effect, no attack" (review-plan 283a70:26, not corrected). No n=83 result, end-to-end or
      attack-cost claim is asserted anywhere in the records.
  - id: ICR-K5-pdf
    command: "git show 714ebc4565:<report dir>/report.pdf | sha256sum; pdftotext -layout; grep"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/review-DEC-20261105-{8a9984,6e2616}.report.txt
    result: pass. Hashes equal .artifacts.json; PDF text matches report.typ; latency/n=83 words are negations only; no later change to report.typ/data.json after the PDF build (git log of both report dirs).
  - id: ICR-K6-derived-view-export
    command: "CHECKPOINT_SKIP=audit BENCHREC_SKIP=audit python3 tools/progress_metrics.py --ref da442739db --since 2026-10-01 | grep '\"problem\": \"icperf\"'"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/progress_metrics_icperf.jsonl
    result: >-
      fail. 46 rows. c_probe_ns 370 and NEG-1's planted 371 are emitted with unit "nanoseconds per
      probe" (c_state/c_step likewise); 283a70 xorshift draws, including both wrong-sampler controls,
      are emitted as "probe-count sum" and "probes per target". DEC-20261105-8a9984 NA-2 ordered the
      284bc4 relabel; tools/progress_metrics.py is unchanged for ICPERF since 029903cba3 (2026-10-30). See ICR-1.
  - id: ICR-K7-claims-gate
    command: "ls claims/; grep -ril icperf claims/"
    output: inline
    result: >-
      pass. The progress-fidelity gate (AGENTS.md:160) covers new quantitative speedup, performance
      advantage or attack-cost claims. None of the audited records makes one (925/4 is explicitly an
      unranked formula value), so no claims/*.json is required, and none exists for ICPERF.
  - id: ICR-K8-s5a
    command: "read crypto:AGENTS.md:1094-1135; python3 -I scripts/readers/icperf-interpretation/rederive_price_ratio.py (s5a_band block)"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/rederive_price_ratio.out.json
    result: >-
      ruling outcome holds, rationale mis-scoped (ICR-2). 283a70: not applicable, correct (no cross-method
      arm). 284bc4: section 5a covers "every cross-method comparison and every ranking", and 925/4 is
      IC-online / BL-online. Neither arm emits a counter, so it is unrankable; my band confirms the order
      flips inside 0/0.1/1 GAE (see blind_rederivation.s5a_band).
  - id: ICR-K9-corrections
    command: "sed -n <lines> runbook.yaml / data.json; sha256sum of the three corrected files; git log of both CORR files; grep CORR ids repo-wide"
    output: inline
    result: >-
      Content of both corrections is accurate (label lines 515/524/533/541/549, data.json lines
      32/52/62/73/84 read "measured"; digests e5850bc6/db07265c/41910e15 match). But two records close
      the same NA-1 (ICR-4).
  - id: ICR-K10-figure
    command: "read reports/review-DEC-20261105-8a9984/plot.py:13 and data.json graph_spec; python3 compare recorded vs blind_rederived over ratio_points"
    output: inline
    result: minor defect (ICR-5). Blind series plots `value` for every point (`if True`); 15/15 points agree as strings, so the rendered figure is not wrong but cannot show a disagreement.
  - id: ICR-K11-ledger-summary
    command: "CHECKPOINT_SKIP=audit BENCHREC_SKIP=audit python3 tools/ledger_summary.py --recent 40"
    output: "traceback: KeyError slice(None, 3, None) in recent_decisions (tools/ledger_summary.py:159)"
    result: not_covered. The tool crashes on the current ledger; ledger-summary wording was not checked through it (the underlying records were read directly).

blind_rederivation:
  H-ICPERF-2f52d1:
    script: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/rederive_price_ratio.py
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/rederive_price_ratio.out.json
    from: "hypothesis statement and test_boundary parameters only (370, 2100, 40 ns; 21/10; 10 states; three cells); no producer code or raw output read before the result"
    quantity: "price ratio c_probe*c_state/((21/10)*c_step^2); per-cell IC online / BL online at equal precomputation time; probes (r/A)/states; BSGS max and mean by enumeration"
    derived: "925/4; P = 525 steps; cells (1000,2) 50 probes, bl_steps 2, 18500/80; (4000,2) 200, 8, 74000/320; (1000,4) 25, 1, 9250/40; each ratio 925/4; BSGS max 50/200/25, mean 51/2, 201/2, 13"
    support_threshold: "exact equality to 925/4 at the price formula and every cell, and probes == (r/A)/states. The statement is an identity, so no tolerance can be derived; any margin would be post hoc."
    compared_with_decisions: "DEC-20261105-8a9984 used the same exact rule (spec success_criterion) and the recorded raw values equal mine (read afterwards). Equal."
  H-ICPERF-5adc9b:
    script: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/rederive_xorshift.py
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/rederive_xorshift.out.json
    from: "hypothesis statement (xorshift32, seed 20261017, p = 1/50, 64 draws) plus, as one reading among several, the spec v2 sampler prose"
    derived: >-
      Spec convention (13,17,5; step then test; x mod 50 = 0; support from 1; chained) gives 2943 /
      289567 / 28, no split, CV 1.0676, median/mean 0.6089 (both bands true). The statement alone
      underdetermines the sampler: testing the seed gives 2944/289582/28; the u < p threshold convention
      x < 2^32/50 gives 3832/526854/36 with a median split and CV 1.139 (out of band); support from 0
      gives 2879/283745/27; triple (13,17,15) gives 4065/468049/42 with a split.
    support_threshold: "exact (sum, sum of squares, median) and no split; band clauses are implied by those integers"
    compared_with_decisions: "DEC-20261105-6e2616 used exactly this rule and scoped support to 'the specified xorshift32 sampler', which is the narrowing my readings require. Equal."
  s5a_band:
    model_RT: "each probe/state/step = 1 group addition + 1 native op, independent weights: R = (1+w_p)(1+w_s)/(2.1(1+w_b)^2) = 10/21 at every uniform w; 27 corners [0.1190, 1.9048], 4 of 27 BL ahead (reproduces the EV's illustrative band)"
    model_MULT: "uniform w applied to every arm (the section 5a wording) but native-op multiplicities k in {1,2} per probe/state/step unknown: R in [0.2116, 1.0714] over 24 cases, BL ahead only at k=(2,2,1), w=1"
    mean_probes: "the parent idea defines probes/target as a mean; BSGS mean / formula = 0.510, 0.5025, 0.520, so R at uniform w is about 0.24, not 0.476"
    record_prices: "231.25 at 370/2100/40 ns = 37/4 GAE per probe and 105/2 GAE per state at 40 ns = 1 GAE, 216x to 1100x outside the band"
    memory_axis: "listed, not charged: IC table 10 states; BL table about sqrt(525/1.2) = 20.9 entries under the parent's model; BL formula out of regime (P >= m at two cells)"
    conclusion: "order is not stable across the band and no arm emits counters, so section 5a yields 'unresolved, unrankable', which coincides with the decisions' 'no ranking in either direction'"

proves_too_much_control:
  H-ICPERF-2f52d1:
    objects:
      - "null price vector (1,1,1): rule output supported=false (10/21), ratios_agree=true"
      - "5000 random price vectors (seed 20261106): supported 0/5000, ratios_agree 5000/5000"
      - "c_probe 371: false (1855/8); precomputation 10 steps: false (cells 185/42)"
      - "unrounded BL constants 2.124 and 2.3353: false, cells non-integral (instrument failure by the frozen rule)"
      - "counterfactual n=83 measured deficits 2x, 235x, 2000x: rule output identical (true) in all three"
    result: >-
      The exact rule passes the control: it never yields `supported` on a null input. The identity
      sub-rules (ratios_agree, CON-1, CON-2) do NOT: they pass on every price vector, so they carry no
      information (records say so). And the rule's output is invariant to every empirical fact about
      n=83, so any reading of `supported` as evidence about the n=83 deficit, latency or the BL law proves
      too much; the records fence exactly this.
  H-ICPERF-5adc9b:
    objects:
      - "correct sampler at 1000 other seeds: exact rule 0/1000, band rule 464/1000"
      - "true Geometric(1/50) iid, 2000 x 64: exact 0, band 951 (rejects the true law 52%)"
      - "wrong-p geometrics p=1/30 and 1/80: exact 0, band 949 and 950 (identical to the true law)"
      - "lognormal CV=1 mean 50: exact 0, band 628; uniform 1..99: exact 0, band 0"
      - "band test vs n (band_asymptotics.out.json): pass rate -> 1.0 at n=8192 for p=1/30, 1/80 and lognormal CV=1"
    result: >-
      The exact rule used by DEC-20261105-6e2616 passes the control. The band clauses in the hypothesis
      statement and the parent's claim (1) fail it: they accept wrong-p geometrics at the true-law rate and,
      as n grows, accept every small-p geometric and the CV=1 lognormal with probability 1. The parameter
      that should sharpen a shape test (n) makes the wrong objects pass more, which is an artifact tell.

