findings:
  - id: ICR-1
    beat: B8
    severity: major
    claim_ids: [C11]
    what: >-
      The progress export presents assumed and planted inputs and synthetic draw counts in latency and
      probe units at another scope. At da442739db tools/progress_metrics.py emits
      icperf.EXP-ICPERF-284bc4.<trial>.c_probe_ns = 370 (and 371 for the planted NEG-1) with unit
      "nanoseconds per probe", plus c_state_ns and c_step_ns in "nanoseconds per state/step", with no
      assumed or planted qualifier. It emits 283a70's xorshift sample (sum 2943/2938/2879, median
      28/29/27, both wrong-sampler controls included) as "probe-count sum" and "probes per target", the
      wording of the n=83 table-probe hypothesis H-ICPERF-b3d1a4. DEC-20261105-8a9984 NA-2 ordered the
      284bc4 relabel and it is not done. No ruling covers the 283a70 units. The rows are better=neutral,
      so nothing is ranked, but a dashboard reader sees a measured ns/probe and a measured probes/target
      that do not exist.
    evidence:
      - tools/progress_metrics.py:198-212
      - tools/progress_metrics.py:273-285
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/progress_metrics_icperf.jsonl
      - ledger/decisions/DEC-20261105-8a9984.yaml:212-219
      - ledger/corrections/CORR-20261105-1d848a.yaml:84-90
    fix: >-
      Executor tooling handoff (NA-2, extended): label c_*_ns rows "assumed input" ("planted input" for
      NEG-1) or drop them. Rename the 283a70 units to "synthetic xorshift draw-count sum" and "draws
      (synthetic, not table probes)", or export only exact_match. Add a test asserting no ICPERF stage-0
      row carries a probe/latency unit.
  - id: ICR-2
    beat: B5
    severity: minor
    claim_ids: [C4]
    what: >-
      The section-5a "not applicable" ruling for EXP-ICPERF-284bc4 uses the wrong trigger. EV-ICPERF-08f6f9
      s5a_band and DEC-20261105-8a9984 rulings.section_5a reason "no comparison against rho is made, so no
      band is owed". crypto:AGENTS.md section 5a binds "every cross-method comparison and every ranking"
      in ledger rows and papers, not only comparisons against rho. 925/4 is IC-online over BL-online (the
      review graph's y-axis), priced with assumed ns on both arms. Applied correctly, section 5a gives:
      no arm emits a counter, so the arms are unrankable; the band (this reader: 10/21 at uniform w,
      [0.119, 1.905] at the corners, [0.212, 1.071] under unknown native-op multiplicities, about 0.24 with
      mean probes) flips the order, so the result is unresolved. The operative conclusion "no ranking in
      either direction" is unchanged. The stated rationale would, as precedent, exempt every non-rho
      cross-method ratio (IC vs BL, IC vs BSGS) from the band.
    evidence:
      - ledger/evidence/EV-ICPERF-08f6f9.yaml:237-255
      - ledger/decisions/DEC-20261105-8a9984.yaml:94-99
      - experiments/EXP-ICPERF-284bc4/analysis.md:58
      - experiments/EXP-ICPERF-284bc4/reports/review-DEC-20261105-8a9984/plot.py:18
      - crypto:AGENTS.md:1106-1135
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/rederive_price_ratio.out.json
    fix: >-
      In the next record that cites this ruling, restate it as "section 5a applies to the IC/BL ratio; no
      counters emitted, band order-unstable, unresolved; no ranking". Do not cite "no rho arm, so no band"
      as precedent. NA-4's successor (RC-5) already requires the band.
  - id: ICR-3
    beat: B8
    severity: minor
    claim_ids: [C9]
    what: >-
      The latency-closure phrasing and the "measured" labels are corrected for 284bc4 only. The producer
      scope phrase for EXP-ICPERF-283a70, "Stage-0 observation only: no latency effect, no attack" (PR
      #2776 as quoted in its review plan and its red-team report), asserts the absence of a latency effect
      that was never measured. Neither DEC-20261105-6e2616 nor any correction rules on it, although the
      identical 284bc4 phrase was ruled to read "makes no latency or n=83 statement". 283a70's run report
      and runbook label the computed integers and band flags "measured", which the 284bc4 ruling calls
      computed. EV-ICPERF-84ff45 lists the labels as a confound but orders no correction.
    evidence:
      - experiments/EXP-ICPERF-283a70/review/review-plan.yaml:26
      - experiments/EXP-ICPERF-283a70/review/TASK-20261105-b3b41a/red-team-report.yaml:44
      - experiments/EXP-ICPERF-283a70/reports/run-20261030T1525Z/report.typ:38-44
      - experiments/EXP-ICPERF-283a70/runbook.yaml:315-366
      - ledger/evidence/EV-ICPERF-84ff45.yaml:161-165
      - ledger/decisions/DEC-20261105-8a9984.yaml:80-93
    fix: An additive correction for EXP-ICPERF-283a70 mirroring CORR-20261106-243c4d (a) and (c).
  - id: ICR-4
    beat: B7
    severity: minor
    claim_ids: [C7]
    what: >-
      Two correction records close the same next action. DEC-20261105-8a9984 NA-1 asks for "one additive
      correction record". CORR-20261105-1d848a (f0653d0ce9, merged #3056 at cfbf4940af) and
      CORR-20261106-243c4d (c9cdb19c25, merged #3058 at edfc50a373) were filed six minutes apart from two
      branches. Each says it closes or executes NA-1, neither supersedes or cites the other, the goal
      checkpoint TASK-20261106-ed3fa9 names only 1d848a, and SR-20261106-e32b11 names only 243c4d. Their
      content is consistent (checked), so no reading changes, but the correction chain has two heads.
    evidence:
      - ledger/corrections/CORR-20261105-1d848a.yaml:137
      - ledger/corrections/CORR-20261106-243c4d.yaml:16-18
      - ledger/goals/GOAL-ICPERF-e6b6a4/checkpoints/TASK-20261106-ed3fa9.yaml:14-15
      - coordination/sessions/receipts/20261106/SR-20261106-e32b11.yaml:16-18
    fix: One superseding note naming a canonical record and marking the other a duplicate. Both stay immutable.
  - id: ICR-5
    beat: B8
    severity: minor
    claim_ids: [C1]
    what: >-
      The review graph for DEC-20261105-8a9984 draws its "blind re-derived (TASK-20261105-b543c3), equal
      at every point" series from the recorded `value` field unconditionally (`[p["value"] for p in pts
      if True]`). The data's own graph_spec says "value when blind_rederived equals recorded". The panel
      can never show a disagreement. The data agree (15/15 string-equal), so the rendered figure is not
      wrong, but it is not the independent display it is labelled as. The 283a70 plot reads
      blind_rederived correctly.
    evidence:
      - experiments/EXP-ICPERF-284bc4/reports/review-DEC-20261105-8a9984/plot.py:13
      - experiments/EXP-ICPERF-284bc4/reports/review-DEC-20261105-8a9984/data.json (graph_spec.panel_a.series[1])
      - experiments/EXP-ICPERF-283a70/reports/review-DEC-20261105-6e2616/plot.py:15
    fix: Plot p["blind_rederived"] (as a Fraction) in a later report. The frozen report stays as is.
  - id: ICR-6
    beat: B6
    severity: minor
    claim_ids: [C1, C2, C13]
    what: >-
      "Out of sample" is applied to a design-time computation. PRED-PRIMARY is labelled out_of_sample, and
      the strength_justification of both EV records cites "out-of-sample preregistered integers met
      exactly". The integers were produced by executing the v1 runner in a design-time directory
      (spec source fields). The v2 decisive tests were written after the v1 outputs were seen. For a
      deterministic program, a later match reproduces a design-time computation; it is not an
      out-of-sample prediction. Each hypothesis's only negative outcome is "instrument invalid", so
      `supported` can only mean the instrument was validated. The only independent evidence is the blind
      re-derivation. Strength is already preliminary, so no verdict changes.
    evidence:
      - experiments/EXP-ICPERF-284bc4/specification.yaml:208-227
      - experiments/EXP-ICPERF-283a70/specification.yaml:195-214
      - ledger/evidence/EV-ICPERF-08f6f9.yaml:43-53
      - ledger/evidence/EV-ICPERF-84ff45.yaml:52-62
      - ledger/hypotheses/H-ICPERF-2f52d1.yaml:133-142
    fix: Future records describe these as "design-time computed values reproduced (instrument validation)". The specification template could reserve out_of_sample for predictions not produced by running the instrument.
  - id: ICR-7
    beat: B8
    severity: minor
    claim_ids: [C6b]
    what: >-
      A reviewer asserts a speed ordering: "IC is about 2.1x faster online"
      (red-team-report 284bc4:343). It is labelled pencil arithmetic, but as written it is a speed
      ordering. It holds only under one counter model that uses the worst-case probe count (with the
      mean probe count the parent defines, R is about 0.24). It drops to an unordered [0.21, 1.07] once
      native-op multiplicities differ between arms. It ignores the memory axis, where the parent places
      IC's disadvantage, and it is evaluated where the BL closed form is out of regime. EV-ICPERF-08f6f9
      transcribes the number without the word "faster", correctly.
    evidence:
      - experiments/EXP-ICPERF-284bc4/review/TASK-20261105-c44b03/red-team-report.yaml:335-350
      - ledger/evidence/EV-ICPERF-08f6f9.yaml:248-255
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/rederive_price_ratio.out.json
    fix: None to the frozen report. Any citation reads "R = 10/21 under one illustrative counter model; no ordering licensed".
  - id: ICR-8
    beat: B6
    severity: minor
    claim_ids: [C10, C15]
    what: >-
      The band test cannot identify a geometric law at any n, a fact the records do not state.
      DEC-20261105-6e2616 parent_band_test and EV-ICPERF-84ff45 describe it as a power problem at n = 64
      (rejects a true geometric about 53%, accepts a CV=1 lognormal about 30%; reproduced here: 52.4% and
      31-32%). More data does not fix it. The test is scale-free and accepts Geometric(1/30) and
      Geometric(1/80) at exactly the true-law rate. As n grows, its pass rate tends to 1 for every
      small-p geometric and for the CV=1 lognormal (analytic: CV^2 = 1 and median/mean = 2^-0.5 = 0.707 are
      inside both bands; simulated 1.0 at n = 8192). This matters for NA-2. A stage-1 test must carry a
      p/mean check and a distributional check; a larger panel with the same bands remains a null-accepting test.
    evidence:
      - ledger/decisions/DEC-20261105-6e2616.yaml:88-93
      - ledger/decisions/DEC-20261105-6e2616.yaml:214-222
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/band_asymptotics.out.json
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-interpretation/rederive_xorshift.out.json
    fix: When NA-2 is ranked, state that the bands are non-identifying in the limit, not only underpowered at n=64.
  - id: ICR-9
    beat: B8
    severity: minor
    claim_ids: [C17]
    what: >-
      Knowledge lead LEAD-ICP-retained-setup-online lists H-ICPERF-2f52d1 and H-ICPERF-5adc9b in ledger_refs.
      Its obstruction has `kind: measured` and includes the parent idea's untested clause "orbit-folded
      m = 2 Koblitz IC is BSGS on the quotient and sits on the BL r/P law". Since 2026-11-05 both
      hypotheses read `supported`, and nothing in the lead says the support covers a toy arithmetic
      identity and a seeded sample only. DEC-20261105-8a9984 explicitly declines the "IC equals BSGS on
      the quotient" reading of CON-3. The lead predates the support (last_reviewed 2026-11-02) and does not
      cite it, so this is a conflation risk, not an asserted claim.
    evidence:
      - knowledge/leads/ecdlp/ic-prime/LEAD-ICP-retained-setup-online.yaml:11-18
      - knowledge/leads/ecdlp/ic-prime/LEAD-ICP-retained-setup-online.yaml:46-52
      - ledger/decisions/DEC-20261105-8a9984.yaml:122-127
    fix: At the next lead review, annotate the two ledger_refs as "stage-0 instrument checks; no support for the BL-law clause" or drop them.

