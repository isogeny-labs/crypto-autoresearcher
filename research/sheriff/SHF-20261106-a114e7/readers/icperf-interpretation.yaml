answers:
  q1_predictions_and_rules: >-
    H-ICPERF-2f52d1 predicts three exact integer facts: price ratio 925/4, three equal online ratios,
    and probes 50/200/25 equal to BSGS. H-ICPERF-5adc9b predicts an exact (2943, 289567, 28) for the
    spec sampler, with the bands implied. Both frozen rules were committed before the runs, are exact
    and have no margin, and are met. They license `supported` only in the scoped sense of instrument
    validation. A failing outcome would be "instrument invalid", never "refuted" (ICR-6). The v1
    sessions RBS-ICPERF-b7e41c and c4a91e and their invalid units are disclosed. The only undisclosed
    item is the 2026-10-19 unit-less execution A in EV-08f6f9, and it is immaterial because everything
    is deterministic.
  q2_wording: >-
    No record, report, PDF, knowledge entry or ledger line asserts latency, wall-time speed, an n=83
    result, or an end-to-end or attack-cost improvement. Live defects: the progress export's ns/probe
    and probes/target units (ICR-1, major); the uncorrected 283a70 "no latency effect" phrase and
    "measured" labels (ICR-3); and a reviewer's "IC is about 2.1x faster online" (ICR-7, quoted
    illustratively). No claims/*.json is required, and none exists.
  q3_s5a: >-
    For 283a70, "not applicable" is correct. For 284bc4, the outcome (no ranking) is correct, but
    section 5a does apply to the IC/BL cross-method ratio. Banded, it is unresolved and unrankable
    (ICR-2).
  q4_rederivation: >-
    Equal to the decisions: exact 925/4 and exact 2943/289567/28. The exact rules pass the
    proves-too-much control. The identity sub-checks and the band clauses do not, and both are fenced
    by the decisions.
  q5_cheapest_unrun_control: >-
    For the records' own claims: one extra deterministic unit, "NEG-2b" (precomputation 10 steps with
    price_ratio also emitted). The price formula must stay 925/4 while the online ratio moves to 185/42.
    This kills mutant M7 (price taken from the online ratio), which today is caught only by code
    reading. It can be paired with RC-4 (BL 2124/1000 must stop as an instrument failure), which kills
    M8. Both cost under 0.1 s. For the interpretation these records risk being read as: the
    zero-compute receipt read of NA-4 (c_probe from the K1798 probe count and time, c_state from
    555 s / 2^28, c_step from BL-arm receipts, compared with 235x [61, 645]). It is the cheapest test
    that could falsify anything empirical, and it has not been run.

