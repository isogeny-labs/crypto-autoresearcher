schema: sheriff.reader/v1
case: SHF-20261106-a114e7
joint: "ICR - B5/B8 ICPERF v2 interpretation and cost model: hypothesis support (H-ICPERF-2f52d1, H-ICPERF-5adc9b), latency / n=83 / speed wording, section 5a applicability"
reader:
  role: red-team
  model: claude-opus-5-5
  independence: >-
    Did not produce anything under audit. Judged from committed records, code and my own
    reruns at crypto-autoresearcher da442739db (the working branch later advanced to 52b5005d17
    with sheriff WIP commits only; `git diff da442739db HEAD -- . ':!research/sheriff'` adds one
    problems/ file and touches no audited record). PR descriptions could not be read (gh 403) and
    were not used; commit messages were displayed by git log/show and are not used as evidence.
target:
  crypto-autoresearcher: {path: /home/user/crypto-autoresearcher, head: da442739db, branch: claude/sheriff-reaudit-20261106}
  crypto: {path: /home/user/crypto, head: 3a7a0f98a, read: AGENTS.md lines 983-1150 only}
  cryptanalysis: {path: /home/user/cryptanalysis, head: 5bdfb496d, read: AGENTS.md grep for 5a/GAE/band and lines 370-410}
  merges_audited:
    - "#2692 be79317981 (v2 design: EXP-ICPERF-284bc4, EXP-ICPERF-283a70 specs, runners, runbooks)"
    - "#3044 38b8aac01e (EV-ICPERF-08f6f9, EV-ICPERF-84ff45, DEC-20261105-8a9984, DEC-20261105-6e2616, hypothesis status edits, review reports, analyses, audits)"
