checks:
  - id: K1-bind
    command: "git -C <repo> rev-parse HEAD origin/main; git status --short (all three repos); git diff --name-only da442739db HEAD (crypto-autoresearcher)"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/text_checks.out (section heads)
    result: "pass. crypto 3a7a0f98a == origin/main, clean. crypto-autoresearcher audited at da442739db; branch commits since then touch only the case dir, pcc/ledger.jsonl and one unrelated problem record."
  - id: K2-blind-p4
    command: "python3 -I scripts/readers/papers/papers_checks.py /home/user/crypto  (section A)"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/papers_checks.out
    result: "pass. My own sieve gives 330 primes p = 1 (mod 6) with p <= 5000 (first 7, last 4999), 669 primes p <= 5000, and 666 primes in [7, 5000], the forprime(p=7,5000) loop count. structural_completeness.tex:444 says 330 of 669."
  - id: K3-blind-second-number
    command: "papers_checks.py sections B, C, G"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/papers_checks.out
    result: >-
      pass. (i) 80 primes p = 1 (mod 6) with p <= 1000 (tex:414). (ii) Solving 4p = 73 + 3k^2 with p prime
      in [7, 5000] gives exactly k in {1,5,9,11,21,25,31,35,41,55,65} (tex:447-448); the k <= 11 primes are
      {19,37,79,109} (tex:440), and 349 is in the set (tex:461). (iii) LLL arithmetic from the standard
      group orders (recalled, and string-equal to crypto:src/ecc/curve_zoo.rs and p256_structural.rs).
      n^4 > f64::MAX holds for secp256k1, P-384 and brainpoolP384r1 and fails for P-256 and brainpoolP256r1.
      f64::MAX ~ 2^1024. n(secp256k1) - n(P-256) ~ 2^224.0. P-256's n^4 sits below f64::MAX by a factor of
      about 1 - 2^-30. For P-521, n^2 has 1042 bits, the scale shift is 542 and 22 low bits are truncated.
      Correct rounding then gives exactly 2^500; a truncating 53-bit conversion gives 2^500(1 - 2^-53),
      a residual of 2^447. (iv) secp256k1 p mod {3,5,7,11,13} = {1,3,1,7,5}; p != l-1 (mod l) for every odd
      l <= 29; -7 is not a cube mod p, so x^3 + 7 is irreducible.
  - id: K4-proves-too-much
    command: "papers_checks.py section D: the same check() applied to values known to be wrong"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/papers_checks.out
    result: "pass. All 8 controls FAIL as required: 621 (the withdrawn count), 331, 81, the k list without 65, 'P-256 n^4 > f64::MAX', 'truncation gives exactly 2^500', the old 2^1023 and the old 2^192."
  - id: K5-p3-recount
    command: "papers_checks.py section F: my own point counts of y^2 = x^3 + b over F_p, 5 <= p < 500, b = 1..p-1, l in {3,5,7} (all p) and {11,13} (p = 1 mod 3), r = p mod l != 0"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/papers_checks.out
    result: >-
      pass. Every number in tex:369-399 re-derives exactly: 24,476 = 8,734 ordinary + 15,742 supersingular;
      8,156 in the hypothesis classes, all ordinary, 0 violations; 16,320 excluded (578 ordinary), all with
      l | #E^t; the hypothesis classes that contain instances; the skipped (7,7,5) with #E = 7; 1,802 for
      l in {11,13} (198; 1,510 + 94); 26,278 / 10,536 / 9,864. The distinct (l,p,#E) counts 336, 249, 292
      and 209 also re-derive, but none appears in the recount/ outputs the paper cites (PPX-4).
  - id: K6-loc-table
    command: "papers_checks.py section E: wc -l of git show 57fa35852:secp256k1_cm_audit/<f> and HEAD:..., existence of <stem>_output.expected.txt, tests/curve_audit.rs"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/papers_checks.out
    result: >-
      pass for the paper. All 16 rows, the expected-output column, the total 3305 (equal at 57fa35852 and
      HEAD) and tests/curve_audit.rs = 568 lines match. The Markdown twin's 10-row total 2386 equals its
      rows. Fail for abstract.txt:56-60, which says "13 PARI/GP scripts (~3000 lines) with committed
      baseline outputs" and a "~390 lines" Rust test. The test has 568 lines at every commit since
      2026-09-12 and 584 before (PPX-3).
  - id: K7-lll-rerun-table
    command: "papers_checks.py section H: parse every probe line of logs/probes.log and logs/p521_hp.log"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/papers_checks.out
    result: "pass. All nine rows of tex:197-205 (recovered/distinct, recovered/runs, k_bits) match the committed logs exactly, and no log row falls outside the table. The probes themselves were not re-executed (cargo blocked)."
  - id: K8-pn7-cells
    command: "python3 -I (inline, recorded) over research/ic_tree_split_structured_v_20261011/runs/registered/cells.jsonl; gap = curve.d_s - r.d_s"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/pn7_cells.out
    result: "pass. Six frob cells have g in {23,29,127}. Five are at gap -1 with |T2| = 29, 28, 70, 29, 35. The sixth (a=0, seed 20261012, l=4, |T2|=1) has gap 0. 15 of the 20 n=21 frob cells are at gap 0. This matches RESULTS.md:52-58 and report.typ:29."
  - id: K9-semaev-trace
    command: "git show HEAD:experiments/EXP-SMON-e5cbe6/runs/RUN-SMON-e5cbe6-001/raw-result.json | python3 -I (leaf search and per-m sums)"
    output: inline
    result: "pass. C2 samples 18000, good 16737. C5 samples 18000, good 16107. C6 total 257061, good 224906, bad includes 101, 211 and 157. NULL-A 599 (0.1369) and NULL-B 595 (0.4891). Seed 20260807; 20 curves. The paper's artifact table (paper.tex:859-897) names exactly these keys."
  - id: K10-text-checks
    command: "CHECKPOINT_SKIP=audit BENCHREC_SKIP=audit bash scripts/readers/papers/text_checks.sh"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/text_checks.out
    result: "Line evidence for every prior-finding verdict below. These are greps and git show only."
  - id: K11-ecbench-census
    command: "git ls-tree -r --name-only HEAD > tree; git cat-file --batch < HEAD:<dir>/session.json list; python3 -I scripts/readers/papers/ecbench_census.py tree blobs dirs"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/ecbench_census.out
    result: >-
      1,455 session.json directories, of which 1,435 have schema ecbench.session/v1 (1,379 complete,
      23 interrupted, 33 running). All 33 running sessions satisfy audit.rs's never_finalised predicate,
      and none is pinned in INCOMPLETE_SESSIONS.tsv or DEFECTIVE_SESSIONS.tsv, so CI should list all 33
      as unbound prefixes. 516 sessions keep records.jsonl only in the artifact store behind a
      git-tracked .artifacts.json. 430 of those lie outside ci-scope.mjs's directory rules, and the
      file-name rule never matches .artifacts.json (PPX-5). Add dates are in never_finalised_added.out:
      30 of the 33 were added by 2026-10-26 and 3 on 2026-10-30. That does not match the 13 that
      PPN-5 reported. The difference lies in the prior case's count, not in the producer, and I did not
      resolve it.
  - id: K12-new-claim-scan
    command: "git diff -U0 <last commit before 2026-10-28> HEAD over papers/ (tex/md/txt) and README.md in both repos, plus a phrase scan of all *.md/*.tex added lines in crypto; then read each surviving lead in context"
    output: inline (lead_dispositions)
    result: "Two leads confirmed (PPX-1, PPX-2). The others were dismissed or handed on, one line each."
  - id: K13-make-check
    command: "make -C papers/<paper> check (NOT RUN)"
    output: none
    result: "not_covered. Building runs producer code. PDF currency was checked by commit date and pdftotext instead: the LLL and structural PDFs (2026-10-28T16:19) postdate their .tex (15:24) and contain the corrected text."
  - id: K14-ecbench-verify
    command: "cargo build --release --bin ecbench && ecbench verify --dir <session> --replay 0 --allow-interrupted (NOT RUN)"
    output: none
    result: "not_covered (permission policy). The E1, E1-R and PPN-5 verdicts rest on reading audit.rs and the audit script."

blind_rederivation:
  quantity: "P4: the number of primes p = 1 (mod 6) with p <= 5000; second number: the 80 primes p = 1 (mod 6) with p <= 1000 and the norm-form set 4p = 73 + 3k^2 (structural_completeness.tex:414, 447-448); plus the LLL note's P-521 2^500 / 2^447 conversion arithmetic"
  method: "My own Eratosthenes sieve, Miller-Rabin and direct search (papers_checks.py sections A-C), from the statement only. No producer script or output was used to compute; the producer values are compared afterwards."
  result: "330 (of 669) and 80 re-derive exactly. The k set is exactly the 11 values stated. 2^500 under correct rounding and 2^500(1 - 2^-53) (residual 2^447) under truncation re-derive."
  output: research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/papers_checks.out
proves_too_much_control:
  object: "the same comparison function run on values known to be wrong (621, 331, 81, a truncated k list, P-256 overflow, exact 2^500 under truncation, 2^1023, 2^192)"
  expected: all FAIL
  result: "8 of 8 FAIL (papers_checks.out section D; papers_checks.json D_controls_all_failed: true). The instrument does not accept every input."

