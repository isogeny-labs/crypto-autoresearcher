lead_dispositions:
  - lead: "treatise prog_prime.tex:226 'beats rho from 24 bits up'"
    disposition: confirmed
    one_line: "PPX-1."
  - lead: "treatise prog_rootfinding.tex:237 and program rootfinding.tex:237 'verified executions'"
    disposition: confirmed
    one_line: "PPX-2."
  - lead: "first-fall-lean title 'Machine-checked first-fall-degree reasoning' (car papers/first-fall-lean)"
    disposition: dismissed_for_B8
    one_line: "The cited declarations (lemma4_mv_false, lemma4_mvB_false, exact_first_fall_degrees, recovery) exist in formal/CryptoResearch/Nagao/*.lean and are imported by CryptoResearch.lean. Build, axioms and fidelity belong to the B3 reader and are not_covered here."
  - lead: "first-fall-lean 'no fake fall at degree 1 was proved by a reviewer'"
    disposition: dismissed
    one_line: "The paper says it was adopted as the Lean theorem exact_first_fall_degrees (FakeExact.lean:107); it is earned by that artifact, subject to B3."
  - lead: "crypto benchmarks/20261029-prime-precompute-regime/README.md:10 'beats rho per target from about 6 targets on'"
    disposition: handed_on
    one_line: "Headed 'control and accounting, not an improvement', with no results row. Whether the matched reference for a multi-target regime is multi-target rho rather than independent single-target runs is a B5 cost-model question for the red-team joint. My scaling argument would rest on recalled Kuhn-Struik constants, so I make no finding."
  - lead: "treatise prog_frontier.tex:310 'measured IC beats a rho arm'"
    disposition: dismissed
    one_line: "It discloses that the arm is the item-7 rho at 1.75 sqrt(l) steps and leaves the crossing against a matched rho 'not established' (lines 319-325)."
  - lead: "treatise prog_binary.tex:122-150 MITM 'Speed-up' table (94-277x to 4,244x)"
    disposition: dismissed
    one_line: "It names the component (pair table vs Gaudry pairs-and-solve), is labelled 'wall-time ... shared host, unvalidated', and cites three study dirs. No interval is given for l >= 9, which is a note, not a finding."
  - lead: "treatise audit.tex:38 'IC's online speed-up over rho'"
    disposition: dismissed
    one_line: "Captioned 'The retired online wins', under 'Claims that did not survive'."
  - lead: "treatise prog_groebner/prog_koblitz component speed-up rows"
    disposition: dismissed
    one_line: "Labelled as stage or component speed-ups that change no index-calculus result, or archived as incomplete/withheld, in the captions read."
  - lead: "ecdlp-boundaries generic.tex:37 'proves that one concrete implementation beats every other'"
    disposition: dismissed
    one_line: "It is a negation ('Neither schematic inequality proves ...')."
  - lead: "crypto README.md added lines with 'speedup' (rootfinding results section)"
    disposition: dismissed
    one_line: "Every hit is negated or caveated ('not a speedup', 'do not cite them as admitted speedups')."

