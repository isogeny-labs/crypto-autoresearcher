findings:
  - id: PPX-1
    beat: B8
    severity: minor
    claim_ids: [PPX-C7]
    what: >-
      Added after 2026-10-28 (commit 74c2bffa4), the treatise says "Cheon's attack with auxiliary inputs
      beats rho from 24 bits up, but only for the DLP with auxiliary inputs". The cited RESULTS.md
      (3 seeds per size) supports that only for the p-1 BSGS fixed-base-comb variant, which it classes
      as 'engineering': S/S_rho is 0.281 at 24 bits and below 1 at every size to 48. The naive p-1
      variant, classed 'advance', is slower than rho at 24 and 28 bits (1.125, 1.827). The p-1 kangaroo
      comb loses at 28 bits (1.219). Cheon's p+1 algorithm is slower than rho at every measured size
      (7.03 at 24 bits down to 1.37 at 40). The DLPwAI scoping is kept; the variant and the p+1 negative
      are dropped.
    evidence:
      - crypto:papers/ecdlp-index-calculus-treatise/sections/prog_prime.tex:225-227
      - crypto:research/torsion_auxiliary_inputs_20260918/RESULTS.md:9-19
      - crypto:research/torsion_auxiliary_inputs_20260918/RESULTS.md:45-56
    fix: "Say 'Cheon's p-1 algorithm with fixed-base comb tables beats rho from 24 bits up (24-48 bits, three seeds per size), and the naive variant from 32 bits; the p+1 variant is slower than rho at every measured size (24-40 bits); all for the DLP with auxiliary inputs only'. Rebuild the PDF."
  - id: PPX-2
    beat: B8
    severity: minor
    claim_ids: [PPX-C8]
    what: >-
      Two papers use execution-proof wording for answer-verified runs. The treatise (added after
      2026-10-28) and the older program paper (2026-10-20) both write "1,088/1,088 verified executions".
      The cited row, benchmarks/README.md:247, says "verified sealed ecbench executions", meaning sealed
      sessions whose answers were verified. These are replays and hashes, not execution proofs, and no
      execution proof exists in these repositories (SKILL.md rules). This is the same defect class as
      SES-1, now in a paper.
    evidence:
      - crypto:papers/ecdlp-index-calculus-treatise/sections/prog_rootfinding.tex:237
      - crypto:papers/ecdlp-index-calculus-program/sections/rootfinding.tex:237
      - crypto:benchmarks/README.md:247
    fix: "Write '1,088/1,088 executions with verified answers (sealed ecbench sessions)' in both papers and rebuild their PDFs."
  - id: PPX-3
    beat: B8
    severity: minor
    claim_ids: [PPX-C6]
    what: >-
      The structural-completeness submission abstract (abstract.txt:53-60, last changed 2026-10-17, before
      the PPN-3 correction) still advertises "13 PARI/GP scripts (~3000 lines) with committed baseline
      outputs for reproducibility" and "1 Rust integration test (~390 lines)". The corrected paper says
      16 scripts, 3305 LOC, 12 of 16 with expected output, and tests/curve_audit.rs at 568 lines. The
      test has had 568 lines since 2026-09-12 and 584 before that, so '~390' matches no recorded state.
    evidence:
      - crypto:papers/structural-completeness/abstract.txt:53-60
      - crypto:papers/structural-completeness/structural_completeness.tex:962-1009
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/text_checks.out
    fix: "Regenerate the companion-artefact lines of abstract.txt from the paper's Reproducibility section (16 scripts, 3305 LOC at 57fa35852, 12 with expected output, 568-line test), or drop them."
  - id: PPX-4
    beat: B8
    severity: minor
    claim_ids: [PPX-C2]
    what: >-
      tex:394-396 gives 336 and 249 distinct (l, p, #E) checks (292 and 209 for l in {3,5,7}) and then
      says "The counts and the re-run outputs are committed in recount/ (count.txt, exp_*.txt)". None
      of the four distinct counts appears in any recount/ output. They are correct, since my independent
      recount re-derives all four, but they trace to no cited artifact.
    evidence:
      - crypto:papers/structural-completeness/structural_completeness.tex:393-399
      - crypto:papers/structural-completeness/recount/count.txt
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/papers_checks.out
    fix: "Add the distinct-(l,p,#E) tallies to count.py/count.txt (regenerated and committed), or cite the artifact that holds them."
  - id: PPX-5
    beat: B7
    severity: minor
    claim_ids: [PPX-C9]
    what: >-
      The PPN-6(b) fix does not cover sessions whose records live in the artifact store. ci-scope.mjs
      selects ecbench_replay for session.json and records.jsonl(.gz) by name anywhere, plus every
      non-prose file under five research and docs trees. 516 committed ecbench sessions keep
      records.jsonl only as an entry in a git-tracked .artifacts.json, and 430 of them lie outside those
      trees. The name rule never matches .artifacts.json, and the artifacts workflow only flags data
      committed to git, not changed pointers. So a PR or push that edits only such a pointer
      (re-pointing records.jsonl to other bytes) runs neither evidence_audit_pr nor the 'never edited'
      step. The weekly lane re-audits integrity, and session.records_sha256 then catches a re-pointed
      finalised session. It does not run the never-edited check, and it cannot catch a swapped prefix
      in a never-finalised session (one such pointer-only session:
      research/pkm_tower_rootfind_20261018/interrupted/P8-worker-restart-20261019). Reasoned from
      code; no CI run observed.
    evidence:
      - crypto:.github/scripts/ci-scope.mjs:70-79
      - crypto:.github/workflows/ecbench.yml:274-299
      - crypto:.github/workflows/ecbench.yml:575
      - crypto:.github/workflows/artifacts.yml:49-56
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/papers/ecbench_census.out
    fix: "Add `(^|/)\\.artifacts\\.json$` to the ecbench_replay rule (or select when the changed .artifacts.json's directory holds an ecbench session.json), and run the never-edited diff in the weekly lane against the previous scheduled commit."
  - id: PPX-6
    beat: B7
    severity: minor
    claim_ids: [PPX-C10]
    what: >-
      In the sharded PR audit (AUDIT_SHARD=k/16), the summary line reports '$bound_count of $index
      committed ecbench sessions pass integrity'. bound_count counts only this shard's sessions, but
      index counts every non-pinned session in the whole list (ecbench-audit-sessions.sh:105-127,
      184-185, 202). A green shard therefore reads as if most committed sessions were not
      integrity-passed. This understates rather than overstates, but the integrity text is wrong.
    evidence:
      - crypto:.github/scripts/ecbench-audit-sessions.sh:105-127
      - crypto:.github/scripts/ecbench-audit-sessions.sh:184-185
      - crypto:.github/scripts/ecbench-audit-sessions.sh:202
      - crypto:.github/workflows/ecbench.yml:653-656
    fix: "Report '$bound_count of $audited sessions in this shard (of $index in total)'."

