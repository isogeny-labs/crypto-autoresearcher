limitations:
  - "This is a sheriff reader record, never a validation_report, and it satisfies no review gate. Projected onto agents/validator.md its verdict would be `incomplete`: the producer's tests and mutants were not executed."
  - "Every 'would fail if deleted' statement is reasoning from code, corroborated by models that re-implement the verifiers' logic. The models do not execute the Rust and could diverge from it in an unread detail."
  - "The GWC19 statement and the frozen-heart attack class are recalled, not retrieved. Neither is load-bearing: ZKX-3 rests on the code (challenges() reads only the proof) and the model's algebra, and K7 on the code's own formula plus the numeric remainders."
  - "Not reviewed: v1 stark.rs internals beyond FRI and verify; merkle.rs (taken from the prior audit's reading, not re-read); groth16 pairing."

