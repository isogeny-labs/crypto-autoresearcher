      "ways" re-read one census from one seed block; and a power/scope review reproduces nothing. The records do
      not call it an execution proof (each says there is none), and my own 3.11.18 replay confirms the bytes, so
      the facts stand and only the words overreach. The substance was later narrowed by DEC-20261029-8d9b43 R-2
      and CORR-20261029-b45e67 / CORR-20261029-a8c797 (strength preliminary); the KN-FIND sentence itself is
