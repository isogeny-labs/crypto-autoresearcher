blind_rederivation:
  quantity: >-
    kappa = S/M, the pooled pair-sum (h = 2) coincidence count of x-labels of rank-r log-GAP half-boxes over the
    mean of 20 matched uniform label sets on the same curve, and the random-set law E[C] = 3 binom(n,4)/p.
  method: >-
    research/sheriff/SHF-20261106-a114e7/scripts/readers/pfdr/blind_rederive.py, written from the hypothesis and
    the specification text only (counting_convention, log_gap_builder, null_builder): own prime-order curve
    generation (random 20-bit p = 3 mod 4, exact point count by quadratic-character table, N prime, N != p), own
    affine group law, own half-box enumerator (first nonzero coordinate positive, lexicographic, coordinates
    ascending from -T, T minimal with ((2T+1)^r - 1)/2 >= ceil(1.02 n) + 8, O and repeated labels skipped), own
    uniform null builder and own counter C = sum_s binom(m_s, 2). 50 FRESH curves from my own seed string (none of
    the producer's seed block), r in {1,2,3}, n in {256, 1024}, 20 null sets per curve, own percentile bootstrap.
    Analytic sketch: for the label universe L, E(L) = |L|^4/p + (1/p) sum_{xi != 0} |L^(xi)|^4 and the Weil bound
    |L^(xi)| = O(sqrt p) give E[C] = 3 binom(n,4)/p (1 + O(1/p)).
  output: research/sheriff/SHF-20261106-a114e7/scripts/readers/pfdr/blind_rederive.json (and .stdout.txt)
  result: >-
    Agrees with the claim at the re-derived scale. kappa = 0.99948 (b20-r1-n256), 1.00023 (r1-n1024), 1.00343
    (r2-n256), 0.99987 (r2-n1024), 1.00011 (r3-n256), 1.00053 (r3-n1024); |z| <= 1.59; every own-bootstrap 95%
    interval inside [0.90, 1.10]; all six read null under the 5% rule. Measured null mean over 3 binom(n,4)/p:
    0.9967 to 1.0011. |L| = (N-1)/2 on all 50 curves. Declared restrictions: bits 20 only, p = 3 mod 4 only,
    n <= 1024, my own curve family (not the vendored generator), so it re-derives the law, not the producer's 24-
    and 28-bit cells.
