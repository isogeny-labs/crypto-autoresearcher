  - id: PFX-3
    beat: B7
    severity: minor
    claim_ids: [PFX-C-311-replay, PFX-C-DEC-validity-replay]
    what: >-
      The audit instrument for RBS-PFDR-bb0d26 cannot detect a full reseal, and its replays cannot see per-cell
      values. runbook.yaml replay mode fields compares raw-result.json /summary only: three integer counts for
      census-toy-main and five decision fields for the analysis units. In a scratch copy, a forgery that moved
      b28-r2-n512 kappa from 0.96490 to 1.00209 (changing EV OBS-3's lowest interval bound and one of OBS-6's six
      |z| > 2 cells) passed verify --rerun-checks and a nonce-sampled audit (verdict clean). The recorded audit's
      "census-toy-main matched" therefore binds only those counts (DEC-20261029-5554ee's fuller jobs-file
      comparison was a reader's extra check). The audited records do not rely on the audit for per-cell values,
