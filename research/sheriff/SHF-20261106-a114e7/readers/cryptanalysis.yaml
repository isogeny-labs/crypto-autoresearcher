limitations:
  - >-
    The band is a convention, not a bound. Its w=1 end prices one S3 root solve (about 1 half-trace plus 8-11 field
    multiplications by the counters) at 1 GAE, so even w=1 need not upper-bound the IC's real cost. No ECBND1h
    measured bound exists for any cell, so none of this can enter the crypto-autoresearcher ledger as a cost claim.
  - >-
    Everything is for the stacked producer, the lineage's earlier row. The current n=83 baseline (field-ops) has no
    band, and nothing here transfers to it: closure and the index and rank rewrites changed the dominant rank-stage
    work.
  - The rank stage is a single draw (n=1 per rank arm). The second archived draw is uncounted.
  - "toy scale: l is about 2^52.9 (n=83 field degree), one Koblitz curve, 20 points"

