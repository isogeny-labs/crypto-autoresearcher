blind_rederivation:
  quantity: >-
    Gap of each IC arm to the matched rho, cost(arm) / cost(rT), at w = 0, 0.1 and 1 GAE per unpriced native
    operation, and whether the order holds across the band
  statement_used: "crypto:AGENTS.md section 5a (lines 1094-1131) and the raw per-run stdout of run 39882571652, nothing else"
  method: >-
    blind_band.py decodes the base64 payloads and uses the producer's own kind labels in the records. It prices IC as
    ec_add+ec_double, plus w times every native, native_grouping, field and endomorphism counter. Composite and
    trivial group ops are not charged, because their adds and doubles are already counted. Rho is group_additions
    plus w*(canonicalizations + partition_hashes + table inserts/queries + failed collisions). Means are over runs,
    S = cost/sqrt(l). Per-arm e2e counters are used for kS and kP (one run each) and cS and cP (20 each).
  result: >-
    At w=0, kS/rT = 0.0113806 and kP/rT = 0.0114112. Both round to the quoted 0.01138 / 0.01141. At w=0.1 and 1 my
    literal reading gives 96.45 / 384.3 (kS) and 146.4 / 583.3 (kP), about 3.33x the quoted 29.00 / 115.5 and
    43.93 / 175.0. The ruling is the same in both readings: IC is cheaper at w=0 and dearer at 0.1 and 1, so the
    pair is unresolved.
  disagreement_and_resolution: >-
    Section 5a alone is underspecified at two points that move the w>0 cells by 3.3x without changing the ruling.
    (a) Are field operations 'native operations' to be charged, or constituents of the root solves and group
    operations? (b) What is one solved target of the S arm: the kS process, or kS's rank stage plus cS's cold work?
    Leaving the field-kind counters uncharged reproduces 29.00 / 115.5 (kS e2e 29.0012 / 115.525). But kP's 43.94
    then misses the quoted 43.93, so (b) mattered too. Both points are fixed by the frozen PROTOCOL.md (71-93):
    field ops are 'reported, not priced', and S = E2E(kS, cS) = kS rank stage + cS setup/LA/online. I read that
    protocol only after this derivation. My implementation of the protocol text from raw phases (protocol_band.py)
    reproduces every published cell. That second step is a reimplementation, not a blind one: I had read band.py
    first, and took its bootstrap seed (20261023) and order-statistic indexing so the interval digits are
    comparable. The point estimates depend only on the protocol text.
  outputs:
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/blind_band.py
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/blind_band.out
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/blind_band.json
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/protocol_band.py
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/protocol_band.out
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/protocol_band.json

proves_too_much_control:
  - id: PTM-1 raw counter perturbation in a scratch copy
    input: >-
      A copy of the 124 raw stdout/stderr files in the session scratchpad. In 00024.stdout.txt (cS s007) the base64
      payload was re-encoded with phases.targets.root_index_probes and end_to_end.root_index_probes each +50,000,000.
    expected: >-
      My payload-hash check flags exactly that file. S/rT does not move at w=0, because probes are unpriced. At w=0.1
      and 1 it moves by exactly w*5e7/20/cost_rT(w). P does not move.
    observed: >-
      raw_result_sha256 61 match, 1 mismatch. S/rT is 0.0113811 at w=0 (unchanged), 28.99550 -> 29.01892 at w=0.1 and
      115.50259 -> 115.59593 at w=1, both equal to the prediction to 1e-9. P is unchanged.
    result: pass
  - id: PTM-2 known-false conclusion must be refused
    input: "the conclusion 'S is cheaper than rT at every weight of the band' on the real data"
    expected: refused (unresolved)
    observed: >-
      unresolved. Positive control: after scaling every IC unpriced counter by 1e-3 in a copy, the same rule ranks S
      cheaper at every weight (4.10e5 / 3.19e6 against rT 1.07e7 / 2.68e7). The instrument can see an IC win when
      the data contain one.
    result: pass
  - id: PTM-3 no published cell shows IC beating rho at w >= 0.1
    input: every S and P gap row in band.md (4 rows incl. sensitivity) and BASELINES.md:795-796
    observed: >-
      None below 1; the smallest at w>=0.1 is 29.0. The only cell of this run that would show IC below rho at w=0.1
      is not published: the cached-log cold arm alone, cS without the rank stage, at 0.747 [0.573, 1.023]. It
      appears only if the rank stage is dropped, which the protocol's E2E unit forbids. No quoted 0.747 / 0.7470 was
      found in BASELINES.md, baselines.json or the experiment's .md files.
    result: pass
  - id: PTM-4 answer checker can fail
    input: "[k+1]G against Q for all 62 rows"
    observed: rejected 62/62
    result: pass

