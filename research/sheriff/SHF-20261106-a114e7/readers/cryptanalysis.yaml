findings:
  - id: CAX-1
    beat: B8
    severity: minor
    claim_ids: [CAX-C13]
    what: >-
      After 08375ddb5 (2026-11-04) replaced the n=83 baseline row with the field-ops producer, the band records
      disagree about which row is current. BASELINES.md:804 says "the current field-ops row (and the former
      rank-finder row) needs the counters ported". baselines.json open[5], byte-unchanged since #1077, still says
      "the current rank-finder row needs the counters ported to its derivation", although BASELINES.md says to
      "update both files in the same change". BASELINES.pdf was last rendered at 5a6c233ea (2026-10-22): it still
      prints "Still open: the current rank-finder row" and has no field-ops row, so the committed PDF predates the
      last change to the baseline it renders. The experiment README:18 and 216-221 also present the rank-finder as
      the current baseline, but that is a dated status (2026-10-23).
    evidence:
      - cryptanalysis:docs/ic/BASELINES.md:804
      - cryptanalysis:docs/ic/baselines.json open[5]
      - cryptanalysis:docs/ic/baselines.json baselines[4]
      - cryptanalysis:docs/ic/BASELINES.pdf (last commit 5a6c233ea; pdftotext line 2888)
      - cryptanalysis:experiments/koblitz-n83-opcounts-20261023/README.md:18
    fix: >-
      Bring open[5] in line with BASELINES.md:804 (field-ops is current, rank-finder former, neither has a band),
      re-render BASELINES.pdf, and add a dated note to the experiment README's 'What is left'.
  - id: CAX-2
    beat: B5
    severity: minor
    claim_ids: [CAX-C2, CAX-C3, CAX-C5]
    what: >-
      Section 5a requires listing "every unpriced counter for every arm ... with its count". The band entries (band.md,
      README band table, BASELINES.md:777-808, open[5]) give only the summed "mean unpriced native ops". Per-counter
      counts exist only in the machine-readable counts.json and in a partial README paragraph (kS rank stage, local).
      The field-kind counters that the frozen kind map does not price, as "inside a priced kind", appear in no band
      entry. For S they are 7.20e9 operations, against the 3.09e9 that are priced. The reader is therefore not shown
      that charging them at w moves S/rT to 96.43 / 384.2 and P/rT to 146.4 / 583.3, and the crossover from w* =
      0.0029 to 0.00085 (S). The ruling (unresolved) is unchanged under every variant I tried.
    evidence:
      - cryptanalysis:experiments/koblitz-n83-opcounts-20261023/PROTOCOL.md:91-93
      - cryptanalysis:experiments/koblitz-n83-opcounts-20261023/band.py:53-71
      - cryptanalysis:experiments/koblitz-n83-opcounts-20261023/run_github_39882571652/panel/band.md:6-10
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/blind_band.out
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/protocol_band.out
    fix: >-
      Beside the band, add a per-arm table of every counter (priced, unpriced, reported-not-priced) with its mean
      count. Add a one-line sensitivity with the field-kind counters charged at w, and state the crossover weights
      (S 0.00286, P 0.00188).
  - id: CAX-3
    beat: B7
    severity: minor
    claim_ids: [CAX-C12]
    what: >-
      README.md:158-159 says "A second run reproduced every output byte for byte", and ARTIFACT.json says the v2
      outputs were "reproduced byte for byte by a second run". No output, hash or log of that second run is
      committed, so the statement cites nothing.
    evidence:
