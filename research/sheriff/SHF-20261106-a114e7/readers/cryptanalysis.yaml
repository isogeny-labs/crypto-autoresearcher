  - id: CAX-K6-answers-independently-verified
    command: "python3 -I verify_answers.py decoded_runs.json (my own GF(2^83) arithmetic; Koblitz trace by Lucas recurrence)"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/verify_answers.out
    result: >-
      pass. f = x^83+x^7+x^4+x^2+1 is irreducible (Rabin test). The curve is y^2+xy = x^3+x^2+1 with t_83 =
      6151469093347, so #E = 9671406556910881928556062, equal to the ICV1 curve id. l = 8569786107849059 is prime
      (Miller-Rabin, 40 bases), l*h = #E, G is on the curve and [l]G = O. [k]G = Q holds for all 62 recovered scalars
      (every arm and point), and [k+1]G != Q for all 62, so the checker can fail. One scalar per point across arms.
  - id: CAX-K7-band-recompute-digit-by-digit
    command: "python3 -I protocol_band.py decoded_runs.json protocol_band.json (my implementation of PROTOCOL.md:71-100 from raw phases)"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/protocol_band.out
    result: >-
      pass. Every cell matches every place it is quoted, at the printed precision. Places checked: band.md and
      band-v2.md (means, costs, gaps, 95% intervals at both rho bounds, Frobenius sensitivity), BASELINES.md:795-796
      and 798-802, baselines.json open[5], README:173-198 (including S/P 0.9973 / 0.6600 / 0.6599 and "about 88x" =
      1/0.0113811 = 87.87), and the coordinates and error bars in figures/band_gap_39882571652.tex. Unrounded values
      (b=0): S/rT 0.0113811 [0.00876673, 0.0155193], 28.9955 [22.3270, 39.5431], 115.503 [88.9389, 157.519]; P/rT
      0.0114118 [0.00879032, 0.0155611], 43.9319 [33.8324, 59.9193], 175.019 [134.784, 238.710]. The prior case's
      quoted 0.01138 / 29.00 / 115.5 and 0.01141 / 43.93 / 175.0 are correct.
  - id: CAX-K8-rho-scalar-mul-bound
    command: same script (b in {0, 104})
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/protocol_band.out
    result: "pass. Claim: 'at 104 GAE every cell moves by < 0.1%'. The largest move is 0.041% (P at w=0: 0.0114118 -> 0.0114071)."
  - id: CAX-K9-order-and-crossover
    command: same script (crossover_w)
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/protocol_band.json
    result: >-
      pass. The order of S and rT, and of P and rT, flips inside the band. IC is cheaper only at w below
      w* = 0.0028551 GAE (S) and 0.0018804 (P) per unpriced native operation (0.0028563 / 0.0018812 at b=104). So
      IC beats matched rho only if a root solve, probe or canonicalization costs under about 1/350 (S) or 1/530 (P)
      of a group addition. At every w >= 0.0029 rho is cheaper. No published cell shows IC cheaper at w >= 0.1.
  - id: CAX-K10-kind-map-sensitivity
    command: "python3 -I blind_band.py decoded_runs.json blind_band.json; protocol_band.py (models literal, protocol+frob_as_group)"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/blind_band.out
    result: >-
      pass for the ruling; the magnitudes are model-dependent. The protocol does not charge field-kind counters
      (field_mul/sqr/inv/half_trace; PROTOCOL.md:91-93; band.py:60-61). For S these are 7.20e9 operations, against
      the 3.09e9 that are charged. Charging every non-group counter at w gives S/rT 0.0113811 / 96.43 / 384.2 and P/rT
      0.0114118 / 146.4 / 583.3, with crossover 0.00085 (S) and 0.00056 (P). Pricing Frobenius as group operations
      makes rT cheaper at every weight (reproduces the producer's 56.08 / 70.99 / 115.5 and 84.00 / 106.8 / 175.0).
      Dropping endomorphisms or s3_root_solves moves the w>=0.1 cells by at most 5%. 'Unresolved' holds under every
      variant.
  - id: CAX-K11-counter-internal-consistency
    command: "python3 -I counter_consistency.py decoded_runs.json"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/counter_consistency.out
