    command: "python3 -I twin_identity.py decoded_runs.json decoded_twin.json (fields of PROTOCOL.md:56-66)"
    output: research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/twin_identity.out
    result: >-
      pass. 62/62 rows are identical to archived run 38862448935 on every listed field. kS and kP (twin serials 42
      and 43) match on every attempt's probes, rank_relations_blake3, rank probes, root calls, attempts, relations,
