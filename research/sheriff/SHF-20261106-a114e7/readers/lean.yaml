blind_rederivation:
  quantity: "the set of translations T in E(F_p) through which τ_T descends along the degree-2 quotient φ = x∘τ_R (involution ι_S, S = 2R), compared with E[2](F_p) and with the set commuting with ι_S"
  inputs: "only the note's Setting and Lemma: ι_S(P) = -(P+S), φ(P) = x(P+R) is the quotient by ι_{2R}, and the claim 'descends iff 2T = O'. No producer script, Lean proof or prior-case script was used."
  method: >-
    The reader's own short-Weierstrass-with-a2 arithmetic over F_p. Descent is tested as a set map on rational points:
    φ(P) = φ(P') must imply φ(P+T) = φ(P'+T). Curves: y² = x³+2x²+5x and y² = x³−x over F_1009, y² = x³+x+3 over F_211,
    and y² = x³+x²+x+1 over F_101. For each, R ∈ {O, a point of order 3, a point of order 4 where present, two other
    points}, giving 19 (curve, R) cases, 11 of them with S not 2-torsion (orders 3, 12, 19, 20, 24, 38, 65, 120).
    The script also asserts that ι_S is an involution and that φ has fibres of size ≤ 2.
  result: >-
    In all 19 cases, the T that descend = the T that commute with ι_S = E[2](F_p): 4 for each F_1009 curve and for the F_101
    curve, 2 for the F_211 curve. RESULT PASS. This supports the prose bridge (descent ⟺ commutation) on rational points of
    these curves. It is a bounded finite check, not a proof, and it does not address ψ being a morphism.
  script: research/sheriff/SHF-20261106-a114e7/scripts/readers/lean/blind_descent.py
  output: research/sheriff/SHF-20261106-a114e7/scripts/readers/lean/blind_descent.out
  note: "Part C of the same script (closed forms for the #2670 control counts) was written after reading controls.py and is a re-derivation, not a blind one."

proves_too_much_control:
  lean: "K13: four mutated statements (drop commutativity; 2 → 4; an order-4 T in ZMod 4; drop the torsion condition) all fail to elaborate, and two of them are kernel-refuted as false (ptm_refute.lean)."
  descent: "blind_descent.py part B: 'τ_T descends iff 4T = O' fails on all 19 cases (every case has 4-torsion beyond E[2]), and 'every T descends' fails on all 19."
  result: pass

