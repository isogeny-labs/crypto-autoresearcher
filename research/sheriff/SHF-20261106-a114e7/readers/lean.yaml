findings:
  - id: LNX-1
    beat: B8
    severity: minor
    claim_ids: [C-LNX-4]
    what: >-
      A live paper overclaims the formal tier. crypto's program paper, in the companion-repository catalogue row for
      research/THM_QUOTIENT_DESCENT1.md, says "Proved (Lean-formalized) that only 2-torsion translations descend through a
      degree-2 quotient of E, closing Galbraith's 'larger group actions?' question for x-type coordinates". The Lean theorem
      formalizes only that τ_T commutes with ι_S iff 2T = 0. Descent (degree-2 maps as quotients by ι_S; descent ⟺
      commutation) and the Corollary behind the Galbraith closure are prose. Its source note said so from 2026-10-17
      (md:116-117) and the Lean header says so too. The row's Status cell cites only the 2026-10-16/17 corrections. Severity
      follows the precedent of L7 and L-N9 for the same pattern.
    evidence:
      - crypto:papers/ecdlp-index-calculus-program/sections/companion_catalogue.tex:317
      - formal/CryptoResearch/Quotient/TranslationDescent.lean:19-23
      - research/THM_QUOTIENT_DESCENT1.md:3-9
      - research/THM_QUOTIENT_DESCENT1.md:88-92
    fix: >-
      Narrow the row, e.g. "Proved (elementary, prose) that only 2-torsion translations descend ...; the group-law identity
      (τ_T commutes with ι_S iff 2T = 0) is Lean-formalized as CryptoResearch.Quotient.translation_commutes_iff_two_torsion".
      Drop the Galbraith closure or mark it as resting on the unformalized Corollary. Correct the companion data row
      (now in the artifact store) and regenerate.
  - id: LNX-2
    beat: B7
    severity: major
    claim_ids: [C-LNX-5b, C-LNX-6]
    what: >-
      The #2670 semantic review's independence and its validated_scoped outcome are unsupported. review.yaml attests
      "independent of the producer; did not write the code under review" but records no session or model id. Its commit
      fcee5a4487 carries the same Claude-Session identifier (session_016SURwTvgaQmnMnhpa1SLXQ) as both commits that wrote the
      theorem file (418825c73d, c62fb626ab) and as the note corrections. It has no review_plan, a single reviewer and no blind
      re-derivation (its own deviations). tools/check_review_independence.py cannot run on it (exit 2, no review_plan).
      lean-review.md:161-165 makes validated_scoped require independently supported faithful_scoped and all required
      reviewer attestations, and says a missing reviewer prevents that outcome. formal/targets/README.md:276-278 still
      presents it as the "independent semantic review" that finds the theorem faithful_scoped / validated_scoped. The
      receipts correctly keep semantic_review pending. The review's mathematical conclusions are right (this reader
      reproduced them, K5-K11), so what is overstated is the process tier, not the content.
    evidence:
      - docs/reports/2026-10-29-quotient-translation-descent-review/review.yaml:40
      - docs/reports/2026-10-29-quotient-translation-descent-review/review.yaml:61-71
      - formal/targets/README.md:276-278
      - .claude/skills/review-evidence/references/lean-review.md:161-165
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/lean/independence.txt
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/lean/review_independence.out
    fix: >-
      Re-label the 2026-10-29 record as a same-session, single-reviewer fidelity check with outcome `inconclusive` (fidelity
      not independently supported). Do this as a new superseding record, not an edit. Drop "independent" from
      formal/targets/README.md. If a validated_scoped outcome is wanted, commission a review under a frozen review_plan with a
      reviewer whose session and model ids differ from the producer's and are recorded, plus a blind re-derivation and
      check_review_independence.py. Keep semantic_review pending until then.
  - id: LNX-3
    beat: B9
    severity: major
    claim_ids: [C-LNX-1, C-LNX-2, C-LNX-5a, C-LNX-5b, C-LNX-6, C-LNX-7]
    what: >-
      This case is composed by the producer's session for this joint. The case's own commits on
      claude/sheriff-reaudit-20261106 (db4592579a, 22ad076fcd) carry Claude-Session session_016SURwTvgaQmnMnhpa1SLXQ. That is
      the identifier on every commit that wrote formal/CryptoResearch/Quotient/TranslationDescent.lean (418825c73d theorem,
      c62fb626ab rename, i.e. #2496 under audit), on the #2670 review under audit (fcee5a4487), on the note's corrections
      (1f3c063cae, 1f96ad0ba1), and on sheriff cases SHF-20261016-3caa6f and SHF-20261028-0f3f64. SKILL.md step 0 says to
      refuse when this session produced the result. This reader's context is fresh (attribution session
      session_01TCbLH84PotMkHyFGFE4ifE) and produced nothing. The case's composition of verdicts on these claims, and of
      prior-finding verdicts for fixes this session made (L1, L2, L-N8, L-N9, LN9-R), is not independent by the available
      identifiers. A Claude-Session URL is the only identifier on record. Whether it maps to one model context is not
      established, so this narrows and does not break.
    evidence:
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/lean/independence.txt
      - .claude/skills/sheriff/SKILL.md:46
      - docs/sheriff.md:459-460
    fix: >-
      Declare it in REPORT.md and findings.yaml. Either have a session with a different identifier compose the verdicts for
      the LNX claims and for the #2496/#2670 prior-finding re-verdicts, or record those verdicts as reader-only (this file)
      and not session-composed.
  - id: LNX-4
    beat: B3
    severity: minor
    claim_ids: [C-LNX-8]
    what: >-
      The S3Roots audit log is stale against its sources (L-N7 regressed in part). papers/rootfinding-decomposition/lean/AxiomAudit.lean
      has audited 7 declarations since a419170dd7 (2026-10-29). These are the three of the 2026-10-17 log plus addX_eq_mathlib_addX,
      pointX_add_eq_xPlus, pointX_add_neg_eq_xMinus and S3_factor_mathlib, and the CI step expects 7 lines. The committed
      axiom-audit.txt is from 2026-10-17 and lists only the first 3. README.md:84-87 says the four bridge lemmas are audited.
      No committed output shows their axioms.
    evidence:
      - crypto:papers/rootfinding-decomposition/lean/AxiomAudit.lean:18-25
      - crypto:papers/rootfinding-decomposition/lean/axiom-audit.txt:1-26
      - crypto:papers/rootfinding-decomposition/README.md:84-99
      - crypto:.github/workflows/rootfinding-s3roots-lean.yml:54
    fix: "Commit the audit output of a green run at the current S3Roots sources (7 lines), or say in README.md that the bridge lemmas' audit is CI-only and cite the run."
  - id: LNX-5
    beat: B3
    severity: minor
    claim_ids: []
    what: >-
      The case sweep did not scan crypto's research/ or tools/ trees, because the crypto sparse cone excludes them. Its lean.*
      rules saw only papers/ Lean in crypto. The TreeSplit and conductor_gap Lean files, which carry prior findings L3, L5,
      L-N1, L-N2 and L-N7, were therefore not swept. This reader text-scanned them with `git show HEAD:` (crypto_text_scan.txt)
      and found nothing new. Other crypto research/*/lean projects remain unswept.
    evidence:
      - research/sheriff/SHF-20261106-a114e7/sweep.json
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/lean/crypto_text_scan.txt
    fix: "Run the sweep's lean.* rules over `git ls-files research tools` of crypto via git show (no checkout), or record crypto research/ Lean as not_covered in the case."

claims:
  - id: C-LNX-1
    text: "In an additive commutative group E, for all S and T: (for every P, -(P + S) + T = -(P + T + S)) holds if and only if 2 T = 0. That is, translation by T commutes with the involution iota_S(P) = -(P + S) exactly when T is 2-torsion, whatever S is."
    location: formal/targets/quotient-translation-descent.yaml:19-23; formal/CryptoResearch/Quotient/TranslationDescent.lean:39-48
    suggested_verdict: upheld_scoped
    scoped_to: "Holds as stated, for every AddCommGroup and every S, including Mathlib elliptic-curve point groups. Module build and source elaboration on v4.35.0 succeeded, the axioms are [propext], and the proves-too-much and differential controls pass. The full-workspace verify_formal_targets gate and hosted CI were not observed here, and the formal lane's semantic_review stays pending."
    findings: [LNX-3]
    beats: {B2: n/a, B3: pass, B4: n/a, B5: n/a, B6: n/a, B7: pass, B8: n/a}
  - id: C-LNX-2
    text: "Status: PROVED (elementary). The Lemma's group-law identity is formalized as CryptoResearch.Quotient.translation_commutes_iff_two_torsion ... The theorem proves commutation with ι_S; descent follows by the prose argument"
    location: research/THM_QUOTIENT_DESCENT1.md:3-9
    suggested_verdict: upheld_scoped
    scoped_to: "The formal part is exactly the commutation identity. The step from commutation to descent and the degree-2-quotient classification are prose; they agree with the reader's finite rational-point check on 19 (curve, R) cases. ψ being a morphism is not argued in the note."
    findings: [LNX-3]
    beats: {B2: n/a, B3: pass, B4: n/a, B5: n/a, B6: n/a, B7: pass, B8: pass}
  - id: C-LNX-3
    text: "τ_T descends through φ = E/⟨ι_S⟩ — i.e. there is a map ψ: P^1 → P^1 with φ ∘ τ_T = ψ ∘ φ — if and only if 2T = O."
    location: research/THM_QUOTIENT_DESCENT1.md:37-51
    suggested_verdict: upheld_scoped
    scoped_to: "The elementary prose proof is correct as read. The blind finite check gives descends = commutes = E[2](F_p) on four curves over F_1009, F_211 and F_101 with S of orders 1 to 120. It is not formalized. A bounded check is no proof."
