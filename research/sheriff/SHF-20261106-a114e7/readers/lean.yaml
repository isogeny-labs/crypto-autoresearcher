    why: "Not opened; PDF currency was not part of this joint"
    command_that_would_cover: "read the PDFs and compare them with report.typ / review.md"

limitations:
  - "This is a sheriff reader record. It is not a validation_report, does not satisfy a review gate, and does not substitute for the formal lane's semantic_review, which stays pending. Projected onto agents/validator.md it would be `incomplete`, because the full-workspace gate and the crypto builds are not_covered."
  - "The blind re-derivation checks descent as a set map on F_p-rational points of four small curves. It neither proves the prose bridge nor addresses ψ being a morphism."
  - "The independence evidence in LNX-2 and LNX-3 is the Claude-Session commit trailer, the only identifier on record. A shared URL does not prove a shared model context, and distinct URLs would not prove isolation."
  - "In the cryptanalysis rg, JSON and other data formats were excluded to keep the scan bounded. A zero-hit count proves no absence."

