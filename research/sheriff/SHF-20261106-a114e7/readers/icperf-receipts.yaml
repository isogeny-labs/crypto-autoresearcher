findings:
  - id: ICV-1
    beat: B7
    severity: minor
    claim_ids: [ICV-C2, ICV-C11]
    what: >-
      The preregistered A/A instrument (CMP-AA: 'tools/runbook.py audit compares the replay
      pointers exactly') still returns a failing verdict for RBS-ICPERF-8cdc92 at HEAD: flagged,
      matched 0 of 6, exit 1, all 39 problem rows 'recorded null, replay null'. The runbook's
      single replay.compare list unions pointers of six heterogeneous trials, and the tool scores
      absent-on-both as mismatch. In substance the A/A holds (whole documents equal on 6/6 audit
      replays and 18/18 direct replays under 3.11.18/3.12.3/3.13.18), and the producer discloses the
      flag in EV-ICPERF-08f6f9 (title, O4, PD-2) and DEC-20261105-8a9984 rulings.validity. But the
      A/A reading rests on a post-hoc row classification plus independent comparisons, not on the
      declared instrument, and the tool fix ordered as DEC-20261105-6e2616 NA-1(b) is not on main
      (#3059 fixed only (a)). Minor because CMP-AA is not part of the decisive test and no value
      differs.
    evidence:
      - "tools/runbook.py:2525"
      - "experiments/EXP-ICPERF-284bc4/runbook.yaml:486"
      - "experiments/EXP-ICPERF-284bc4/specification.yaml:188"
      - "research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-receipts/audit-RBS-ICPERF-8cdc92/audit.json"
      - "research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-receipts/replay_interpreters.json"
      - "ledger/decisions/DEC-20261105-6e2616.yaml:197"
    fix: "Land DEC-20261105-6e2616 NA-1(b) (absent-on-both = not_applicable; per-trial compare pointers) with a regression test on the 8cdc92 bytes, then file a fresh audit of RBS-ICPERF-8cdc92 that reports clean. Until then, any citation keeps the flagged-verdict disclosure."
  - id: ICV-2
    beat: B7
    severity: minor
    claim_ids: [ICV-C1, ICV-C8]
    what: >-
      None of the 9 run manifests records code.dirty or code.source (all_pinned), so
      tools/check_run_source_provenance.py --strict reports 0 pinned / 9 unpinned and fails. The
      source is pinned in substance (run.environment.source_sha256 for run.py and check.py, which
      import only the standard library and yaml, equals the plan bindings and HEAD), and a clean
      tracked tree is recorded only once per session at preflight (journal seq 0, tracked_dirty
      false at 9d13fcfde5 / af94114e9c), not at each unit's launch commit (5200f03900 / 980ff5f076).
    evidence:
      - "experiments/EXP-ICPERF-284bc4/runs/RUN-ICPERF-8e3acd/manifest.yaml:12"
      - "experiments/EXP-ICPERF-284bc4/runbook-sessions/RBS-ICPERF-8cdc92/journal.jsonl:1"
      - "research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-receipts/provenance_checks.txt"
    fix: "Have run.py (or the supervisor) write code.dirty and code.source.files/all_pinned in the manifest, or teach check_run_source_provenance.py to accept run.environment.source_sha256 together with a recorded clean-tree flag; future units only, these manifests stay as recorded."
  - id: ICV-3
    beat: B6
    severity: minor
    claim_ids: [ICV-C5]
    what: >-
      EXP-ICPERF-283a70 raw-result.json stores only aggregates (sum, sum of squares, median,
      band inputs), not the 64 draws, so the headline integers cannot be recomputed from raw
      rows. They were checked here by an independent regeneration from the seed and the
      specification prose (exact match), and the internal arithmetic of every row holds. Disclosed
      in EV-ICPERF-84ff45 boundaries.
    evidence:
      - "experiments/EXP-ICPERF-283a70/runs/RUN-ICPERF-f21eb1/raw-result.json:30"
      - "ledger/evidence/EV-ICPERF-84ff45.yaml:152"
    fix: "Persist per-draw (per-target) counts in any successor, as DEC-20261105-6e2616 NA-2 already asks for stage 1."
  - id: ICV-4
    beat: B8
    severity: minor
    claim_ids: [ICV-C10]
    what: >-
      CORR-20261106-243c4d corrects 'measured' to 'computed' only for EXP-ICPERF-284bc4. The same
      mislabel exists in EXP-ICPERF-283a70: runbook.yaml labels sample_sum, sum_squares, median,
      cv_in_band, median_ratio_in_band and exact_match 'measured', though each is computed by a
      deterministic seeded program. DEC-20261105-6e2616 notes only the report's band-flag labels and
      orders no correction. This is a coverage gap of the correction programme, not an inaccuracy in
      CORR-20261106-243c4d.
    evidence:
      - "experiments/EXP-ICPERF-283a70/runbook.yaml:315"
      - "ledger/decisions/DEC-20261105-6e2616.yaml:175"
      - "ledger/corrections/CORR-20261106-243c4d.yaml:20"
    fix: "An additive correction for EXP-ICPERF-283a70 labels (computed, not measured; only elapsed_seconds measured), mirroring CORR-20261106-243c4d."
  - id: ICV-5
    beat: B6
    severity: minor
    claim_ids: [ICV-C1, ICV-C3]
    what: >-
      Most of the 284bc4 control set cannot fail by construction. ratios_agree, CON-1 and CON-2 are
      invariant in r, A and states for every price vector (my states=11 input still gives 925/4),
      and CON-3's worst-case enumeration equals m/states by theorem. Only NEG-1 and NEG-2 can move
      the outcome, and neither study declares a positive control (e.g. a planted inexact division
      for the exactness rule). The spec labels all of this honestly (cancellation;
      arithmetic_consistency), so no record is wrong. But '925/4 at three cells' plus 'consistency
      controls pass' certify only that run.py evaluates the stated closed form correctly. Inference
      beyond that is the red-team joint.
    evidence:
      - "experiments/EXP-ICPERF-284bc4/specification.yaml:83"
      - "experiments/EXP-ICPERF-284bc4/specification.yaml:101"
      - "experiments/EXP-ICPERF-284bc4/specification.yaml:121"
      - "research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-receipts/blind_rederive.json"
    fix: "No repair to these records. Any successor that wants a discriminating control should adopt the producer's own RC-3/RC-4 (DEC-20261105-8a9984 NA-4)."

