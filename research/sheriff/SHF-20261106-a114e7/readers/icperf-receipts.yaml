proves_too_much_control:
  284bc4: >-
    Inputs whose conclusion '925/4' is known false must fail, and do: c_probe 371 -> 1855/8;
    c_state 2101 -> 77737/336; c_step 41 -> 370000/1681; BL 21/11 -> 2035/8; precomputation 10 ->
    185/42 online. But the identity proves too much in r, A and states: states 11 still gives
    925/4 at every cell and ratios_agree true (caught only by the precomputation_steps 525
    assertion and the primary exactness rule: probes 500/11). So ratios_agree, CON-1 and CON-2
    cannot fail except through a code defect or an inexact division, and CON-3 cannot fail for a
    correct enumeration because max lookups = m/states exactly when states divides m. The spec
    says this itself (online_time_model.cancellation; controls labelled arithmetic_consistency).
    Only NEG-1/NEG-2 discriminate, and they discriminate inputs, not any measured quantity.
  283a70: >-
    Wrong samplers must fail the exact match, and do: seed 20261018 -> 2779/228939/26; triple
    (5,17,13) -> 3270/464534/33 with a median split; p_den 49 -> 3550/354018/45 with a split;
    plus the declared CTL-1 and CTL-2. The bands prove too much: seed 20261018 passes the CV band,
    and CTL-1/CTL-2 pass both bands (spec DESC-1/DESC-2 labels them descriptive).
  output: research/sheriff/SHF-20261106-a114e7/scripts/readers/icperf-receipts/blind_rederive.json

