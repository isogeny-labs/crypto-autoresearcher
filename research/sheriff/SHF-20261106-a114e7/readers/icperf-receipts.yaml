blind_rederivation:
  order: >-
    Read the two frozen specifications (statement, inputs, controls), wrote and ran
    blind_rederive.py, then opened raw-result.json rows. Producer run.py/check.py were opened only
    afterwards (imports, write paths, the BSGS enumeration), producer reviews never.
  what_925_4_counts: >-
    A reduced dimensionless ratio, not a count of anything observed: c_probe*c_state*bl_den /
    (bl_num*c_step^2) = 370*2100*10/(21*40^2) = 7770000/33600 = 925/4 = 231.25. Equivalently, at
    each cell, (IC online time = r/(A*states) probes x 370 ns) / (BL online time = 21*r/(10*A*525)
    steps x 40 ns), where 525 = states*c_state/c_step is the BL precomputation step budget that
    equals the IC table-build time. r, A and states cancel identically, so every cell gives 925/4.
  what_2943_289567_28_count: >-
    For 64 chained draws of a xorshift32 (left 13, right 17, left 5, all mod 2^32) started at
    seed 20261017, each draw = number of step-then-test iterations until the state is 0 mod 50
    (support {1,2,...}, seed never tested): the sum of the 64 draws (2943), the sum of their
    squares (289567), and the 32nd smallest draw (28), which equals the 33rd (no median split).
  results:
    "284bc4 primary": "price 925/4; precomputation 525; cells (1000,2) probes 50, bl 2, 18500/80 ns; (4000,2) 200, 8, 74000/320; (1000,4) 25, 1, 9250/40; every ratio 925/4; all integer; enumerated BSGS max 50/200/25"
    "284bc4 NEG-1 c_probe 371": "price and every cell 1855/8 (ic 18550, 74200, 9275 ns)"
    "284bc4 NEG-2 precomputation 10": "every cell 185/42 (bl_steps 105, 420, 105/2; bl ns 4200, 16800, 2100); price ratio unchanged 925/4, so ratios_agree false"
    "283a70 primary": "2943 / 289567 / 28, no split; cv_sq 9871039/8661249 in [81/100,121/100]; median ratio 1792/2943 in [3/5,4/5]; first draws 7, 22, 69, 52, 26, 41, 29, 16"
