schema: sheriff.reader/v1
case: SHF-20261106-a114e7
joint: "LGX: B7 ledger and tooling. Duplicate-key YAML loaders, complete_manifest contradiction refusals, the empty-manifest gate and PR-scoped check_run (#2659); completion sources and CORR-20261028-1e1ff4 / -a02dba (#2663); the four runbook-session audits (#2671); rulings DEC-20261029-9bc3ff / -22e05b / -5554ee and CORR-20261029-892bca (#2674); the runbook-session bytes guard (#2686); runbook.py float tolerance, interpreter parity, session-id collision and multi-journal audit (#2689, #3059); validate_ledger recount, check_merge_hygiene --absolute and runbook.py pending-audits on main"
reader:
