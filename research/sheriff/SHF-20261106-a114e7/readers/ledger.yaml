findings:
  - id: LGX-1
    beat: B7
    severity: minor
    claim_ids: [C-LGX-1, C-LGX-4]
    what: >-
      Duplicate-key refusal covers the two routing registries and supervisor-completed driver manifests
      only, as the loader's docstring says. Every other YAML reader on the gate path uses plain safe_load,
      where the last value silently wins: validate_ledger.load_yaml (every ledger record, specification,
      review-plan file and run manifest, so check_run), check_merge_hygiene.check_parses and
      check_new_run_manifests (through check_run), tools/duplicate_run_ids.yaml and the legacy inventories.
      Planted: a run manifest with certificate.kind discrete_log then none, or with two experiment_id
      values, passes check_run and the PR-scoped hygiene check with 0 errors and is registered; a decision
      with status accepted then rejected parses and loads as rejected. Run records not completed by the
      supervisor (hand-published runs, manifest_v2 supersessions) can therefore carry a contradicting
      duplicate onto main.
    evidence:
      - tools/validate_ledger.py:785-792
      - tools/validate_ledger.py:1854-1891
      - tools/validate_ledger.py:196
      - tools/check_merge_hygiene.py:547-590
      - tools/check_merge_hygiene.py:624-660
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/probe_completion.json (check_run_duplicate_keys, registry_and_record_loaders)
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/probe_merge_hygiene.json (check_new_run_manifests)
    fix: >-
      Load run manifests (manifest.yaml and manifest_v2.yaml) and new ledger records with the unique-key
      loader in check_run, check_new_run_manifests and check_parses, scoped to files a PR adds or changes so
      archived records keep their bytes; or report duplicates as errors for new records only.
  - id: LGX-2
    beat: B7
    severity: major
    claim_ids: [C-LGX-2]
    what: >-
      complete_manifest checks only an enumerated set of locations. Driver values elsewhere that have a
      publish-time source are published unchecked: run-level seed and parameters (G1, G3) and the flat-shape
      seed (G2), extra or missing keys inside inputs.parameters (G4, G5; _conflicts compares only shared
      keys), inputs.seed when the trial has no seed and hypothesis_id when the plan has none (G6, G7),
      inputs.specification_sha256 (G18), started_at after finished_at (G8), an environment.python that merely
      contains the version string (G9), and a case-variant inputs.Seed (G17). In G1 the published manifest
      carries run.seed 99 beside the supervisor-added inputs.seed 1, a contradiction the supervisor itself
      completed. 91 manifests on main carry a run-level seed and 113 run-level parameters. The documentation
      states "Every driver value with a publish-time source is checked against it type-strictly ... and a
      contradiction is refused".
    evidence:
      - tools/experiment_execution.py:259-266
      - tools/experiment_execution.py:310-399
      - docs/experiment-execution.md:163-181
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/probe_completion.json (gap_probes)
    fix: >-
      Check run-level and flat-shape seed/parameters/curve_id against the trial; compare inputs.parameters as
      a whole (or refuse keys outside the plan unless the driver marks them derived); refuse hypothesis_id
      and seed when the plan/trial declares none; check started_at <= finished_at and an exact version
      token. Otherwise narrow the documentation to the enumerated locations.
  - id: LGX-3
    beat: B7
    severity: major
    claim_ids: [C-LGX-14]
    what: >-
      The replay float tolerance is declared and recorded but unbounded. parse_tolerance accepts any finite
      non-negative rel_tol/abs_tol (rel_tol=1e6 and abs_tol=1e300 are accepted), both in a frozen runbook
      (lint) and as an audit-time --float-tolerance chosen after the mismatch is seen. Under rel_tol=0.5 a
      doubled value, under rel_tol=1 a 1000x change, and under abs_tol=1e9 a sign flip replay as
      matched_within_tolerance; only 'mismatch' is a finding, so the audit verdict is 'clean'. No other tool
      reads float_tolerance or flags a large one. The audit can therefore accept materially different numbers
      while still reporting a clean screen.
    evidence:
      - tools/runbook.py:1062-1085
      - tools/runbook.py:1087-1135
      - tools/runbook.py:2423
      - tools/runbook.py:2464
      - docs/runbook-execution.md:215-242
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/probe_runbook_tolerance.json
    fix: >-
      Cap the tolerance (for example rel_tol <= 1e-6, abs_tol <= 1e-9 unless a Coordinator decision names a
      larger one in the runbook), and make an audit-option tolerance or any toleranced match visible in the
      verdict (for example 'clean_within_tolerance' plus a finding naming the source and the bound) so a
      toleranced screen is never read as an exact one.
  - id: LGX-4
    beat: B7
    severity: minor
    claim_ids: [C-LGX-13]
    what: >-
      check_session_files refuses modified, deleted and spliced session files, but does not flag an
      unrecorded extra file added inside a sealed session, a journal append that binds a new output file,
      a non-merge commit (squash merge or direct push) checked with --absolute, or a session directory
      outside experiments/<EXP>/ and examples/**/ (SESSION_FILE).
    evidence:
      - tools/check_merge_hygiene.py:728-731
      - tools/check_merge_hygiene.py:953-1040
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/probe_merge_hygiene.json
    fix: >-
      Report session files that the journal does not bind; in --absolute mode compare HEAD with HEAD^ when
      HEAD is not a merge; widen SESSION_FILE to any */runbook-sessions/<id>/ path or refuse sessions
      elsewhere.
  - id: LGX-5
    beat: B7
    severity: minor
    claim_ids: [C-LGX-4]
    what: >-
      check_new_run_manifests matches only experiments/*/runs/*/manifest.yaml. A PR-added run whose only
      envelope is manifest_v2.yaml (which validate_ledger does schema-check when no manifest.yaml exists) is
      not checked: a flat or empty manifest_v2.yaml passes merge hygiene.
    evidence:
      - tools/check_merge_hygiene.py:646-652
      - tools/validate_ledger.py:115-116
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/probe_merge_hygiene.json (check_new_run_manifests)
    fix: Also check manifest_v2.yaml when it is the run's only envelope, as validate_ledger's main() does.
  - id: LGX-6
    beat: B7
    severity: minor
    claim_ids: [C-LGX-18]
    what: >-
      The LGN-8 class now reaches main validator-clean rather than not at all: 13 schema-failing run
      manifests (1 to 11 check_run errors each on the raw file) entered main after b7d5e65b9f together
      with additive_schema_completion supersessions
      (XEDN x2, PFIVE, CMFB x8, DREG, PNEXT), and the 26 LGN-8 errors were cleared the same way after
      DEC-20261029-9bc3ff and -22e05b recorded that no supersession is filed for 943efa/b09be8. None of the 17
      new run-supersession entries names a decision_id, and nothing beyond schema and hash pinning checks a
      superseding manifest's fidelity. The three sampled record the failure faithfully.
    evidence:
      - tools/run_supersession_registry.yaml (entries registered 2026-10-19 .. 2026-11-05 for the runs named)
      - experiments/EXP-XEDN-0c0182/runs/RUN-XEDN-132272/execution-receipt.json (status invalid_output, refusal detail)
      - ledger/decisions/DEC-20261029-9bc3ff.yaml (ruling.run_RUN-ICPERF-943efa)
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/resolution_attribution.json
    fix: >-
      Require a decision_id (or a validator review) for every run-supersession entry, and have
      check_new_run_manifests require that a superseding manifest carries the receipt's status for a refused
      or failed run.
  - id: LGX-7
    beat: B7
    severity: minor
    claim_ids: []
    what: >-
      Two finished runbook sessions await audit on main: RBS-SEMBIN-24ec56 and RBS-XEDN-a7cd25 (its two
      audits cover earlier journal tips). The tool and the blind re-derivation agree.
    evidence:
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/runbook_pending_audits.json
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/blind_pending_audits.json
    fix: Run /audit-runs on both before either is cited.
  - id: LGX-8
    beat: B7
    severity: minor
    claim_ids: [C-LGX-8, C-LGX-17]
    what: >-
      (a) A session whose units are all invalid has an empty replay population; the audit replays nothing,
      leaves not_covered empty and returns verdict clean (RBS-ICPERF-c4a91e, both #2671 and this rerun);
      only detection_power (miss probability 1.0) shows it. (b) After #3059 widened the recorded-interpreter
      sources, docs/runbook-execution.md:244-249 still describes only /run/environment/python_version, and
      an unquoted YAML python_version (a float such as 3.11, or 3.10 read as 3.1) yields parity unknown.
    evidence:
      - tools/runbook.py:2362-2367
      - tools/runbook.py:2259-2275
      - docs/runbook-execution.md:244-249
      - research/sheriff/SHF-20261106-a114e7/scripts/readers/ledger/out/audit_RBS-ICPERF-c4a91e.audit.json
    fix: >-
      Add a not_covered line when a trials step has no valid unit to replay; update the parity paragraph to
      RECORDED_PYTHON_SOURCES; read a numeric python_version from the source text, not the parsed float.

