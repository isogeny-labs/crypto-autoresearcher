checks:
  - id: K1-validate-ledger-main
    command: >-
      python3 -I -B scripts/readers/ledger/build_tree.py <repo> da442739db <scratch>/tree_main <repo> da442739db;
      cd <scratch>/tree_main && python3 -B tools/validate_ledger.py [--no-baseline]
    output: scripts/readers/ledger/out/validate_ledger_main.{stdout,stderr}, validate_ledger_main_nobaseline.*, main_new.txt, main_all.txt
    result: >-
      FAIL: 1 new validation error (1,211 in total, 1,210 grandfathered; tools/validate_ledger_baseline.txt
      is byte-identical to b7d5e65b9f's and no baseline entry went stale). The one error:
      experiments/EXP-BINSTD-591d28/runs/RUN-BINSTD-f7ca97/manifest.yaml: expected top-level key 'run'
      (a flat manifest added 2026-10-11 by #1650, one of the 67 of SHF-20261028-0f3f64; problems/binstd-f7ca97-original-execution-captures-missing.md
      records why it is not superseded). The validator refuses a sparse checkout, so it ran on a non-git
      materialisation of da442739db: 126,152 files hardlinked from the clean worktree, 42,200 written from
      git, 2,607 large non-record blobs as empty placeholders (listed in out/tree_main.placeholders.txt). A first run produced 2 phantom errors
      from a 2 MB manifest.yaml left as a placeholder (EXP-FROB-b8cf21 TASK-20260907-ee1e3c and the evidence
      citing it); that file was written from git and the run repeated. No placeholder is a .yaml/.yml file;
      no remaining error names a placeholder. A full checkout (9.6 GB) did not fit (2.5 GB free).
  - id: K2-validate-ledger-prior-and-attribution
    command: >-
      same build at b7d5e65b9f (hardlinked from tree_main), its own validator and baseline;
      python3 -I -B scripts/readers/ledger/attribute_resolutions.py out/prior_new67.txt out/main_new.txt
    output: scripts/readers/ledger/out/validate_ledger_prior*.{stdout,stderr}, prior_new67.txt, resolution_attribution.json, validate_ledger_categories.json
    result: >-
      Independent recount at b7d5e65b9f: 67 new (1,277 total); line-for-line identical to the case's list
      (prior_case_list67.txt, compared after the recount). Between b7d5e65b9f and da442739db, 66 of the 67
      were resolved and 0 new errors appeared. None of the 24 erroring files changed a byte. Resolution:
      29 by run supersessions (manifest_v2, additive_schema_completion): RUN-ECDLP-9f18c9 (10, #2756),
      RUN-ICPERF-943efa and -b09be8 (16, #2715), FROB-91ee9c TASK-20260914-7119f2 (3, #2714); 28 by schema
      supersessions of 12 handoff/proposal records (4973b4cd1d, #2771); 3 by schema supersessions via #2764
      (TASK-20260910-19bd7b and the IDEA-94078e/-c9c6c3 v3 routes); 2 by the LGN-1 registry de-duplication
      (DEC-20261019-624f64, TASK-20261017-2d324f; 63cea870d2, which reached main's first-parent line in
      #2609); 1 by a validator rule for the hash-bound AUXIN successor draft (EXP-AUXIN-339fb0, bef7340a3d
      via #2657); and 3 by per-quantity review_plan checks (TASK-20261003-68bcf5, whose plan lists
      quantities each with quantity/assigned_to/blind_from; 4973b4cd1d via #2771). 29+28+3+2+1+3 = 66. Category breakdowns of the 67 and the 1,211 are in validate_ledger_categories.json.
  - id: K3-count-claims-in-scope
    command: same build and validator at e9b91d62a9, f450a6cce3, 7b16f392d3, 692b54f1f4, 0265593c57 (each commit's own validator and baseline); set comparisons with comm
    output: scripts/readers/ledger/out/validate_ledger_<commit>.*, errs_<commit>.txt
    result: >-
      e9b91d62a9 141 and f450a6cce3 124, every f450a6cce3 error also at e9b91d62a9 and no DEC-20260929 line
      at either (CORR-20261028-1e1ff4 upheld). 7b16f392d3 65 = the 67 minus exactly the two LGN-1 errors;
      692b54f1f4 115; 0265593c57 100, which adds exactly one error over its first parent
      (DEC-20261019-624f64 knowledge_promotion) and contains both LGN-1 errors (DEC-20261028-f8c018 67/65/115/100
      upheld; its 98 "with registry repair only" was not measured here, and is consistent with 100 minus the
      two LGN-1 errors). The two draft contracts are 703,334 and 705,752 bytes at e9b91d62a9.
  - id: K4-check-merge-hygiene-absolute
    command: CHECKPOINT_SKIP=audit python3 -B tools/check_merge_hygiene.py --absolute (audit worktree)
    output: scripts/readers/ledger/out/check_merge_hygiene_absolute.{stdout,stderr}
    result: >-
      PASS, rc 0: no conflict markers, no unparseable records, no duplicate registry keys, no changed
      runbook-session files. Partial: run on the sparse worktree at db4592579a (the session WIP commit on
      da442739db). The parse rules cover ledger/*.yaml, experiments/*/specification.yaml and coordination
      *.json, all inside the sparse set. The session-file group compares merge parents only in --absolute
      mode and HEAD is not a merge, so that group was vacuous here; K12 exercises it.
  - id: K5-pending-audits
    command: CHECKPOINT_SKIP=audit python3 -B tools/runbook.py pending-audits --json
    output: scripts/readers/ledger/out/runbook_pending_audits.json
    result: >-
      2 pending: RBS-SEMBIN-24ec56 (stopped 2026-10-26, reached main after b7d5e65b9f) and RBS-XEDN-a7cd25
      (stopped 2026-10-30; two audits exist for earlier journal tips; the journal was appended after them,
      prefix-preserving). The four LGN-9 sessions are no longer pending. The blind re-derivation agrees.
  - id: K6-complete-manifest-contradictions
    command: python3 -I -B scripts/readers/ledger/probe_completion.py <scratch>/tree_main <scratch>/probe
    output: scripts/readers/ledger/out/probe_completion.json (controls, cases)
    result: >-
      Controls: a partial driver manifest with no contradiction is completed (20 keys added, each with a
      source in envelope_completion.sources, representation note present); an agreeing complete envelope is
      accepted 'unchanged'. 46 of 46 contradictions of a publish-time fact are refused with the driver bytes
      unchanged and no candidate file left: run id/run_id, experiment_id, task_id, trial_id, approved_by,
      hypothesis_id; code.commit (also a 12-hex prefix), code.command, check_command, command_file;
      environment.commit, source_sha256, specification_sha256, runtime_lock, runtime_lock_sha256, file,
      python (same interpreter); inputs.trial_plan, plan_sha256, trial_id, seed (2, "1", 1.0, true),
      parameters (25, "24", 24.0), curve_id; timing.started_at/finished_at outside the interval or without a
      zone, wall_seconds 60, -0.5, NaN, true; result.metrics {m: 4} and {m: 3.0} vs run.metrics {m: 3};
      result.raw_result; attack_claimed against raw-result.json both ways; and a complete envelope
      contradicting only task_id, only inputs.seed or only code.commit.
  - id: K7-complete-manifest-gaps
    command: same script (gap_probes)
    output: scripts/readers/ledger/out/probe_completion.json (gap_probes)
    result: >-
      Accepted and published (finding LGX-2): G1 run.seed 99 for a seed-1 trial (published beside the
      supervisor-added inputs.seed 1); G2 the same in the flat shape; G3 run.parameters {bits: 64} against
      trial parameters {bits: 24}; G4 an extra key in inputs.parameters; G5 inputs.parameters {}; G6
      hypothesis_id when the plan has none; G7 inputs.seed when the trial has none; G8 started_at after
      finished_at (both inside the interval); G9 environment.python "not 3.13.18; ran under 3.13.189";
      G10 a verified discrete_log certificate while attack_claimed is false in both files; G11 raw-result.json
      with attack_claimed true then false (JSON last-wins); G12 unparseable raw-result.json; G13 status
      failed after exit 0; G17 inputs.Seed; G18 inputs.specification_sha256 contradicting the plan. On main,
      91 run manifests carry a run-level seed and 113 run-level parameters (none currently disagree with
      inputs.seed), so drivers do write these places.
  - id: K8-empty-manifest-gate
    command: same script (empty_manifest_complete, empty_manifest_check_run)
    output: scripts/readers/ledger/out/probe_completion.json
    result: >-
      pass. complete_manifest refuses all 13 variants: 0-byte, comment-only, null, ~, '---', '---/...',
      BOM-only, whitespace, [], a scalar ("not a mapping"), {} and run: {} (schema cannot be completed),
      run: (null). check_run reports every one: the 8 that load as None get "run manifest is empty (no YAML
      document)", the rest "expected top-level key 'run'" or the missing-field list. load_plan refuses
      manifest.yaml and raw-result.json in allow_empty_artifacts (experiment_execution.py:206-210), and
      execute_trial calls complete_manifest for any existing manifest.yaml and maps EnvelopeRefused to
      invalid_output (999-1003, 1019-1023); both by code reading, execute_trial not run end to end.
  - id: K9-duplicate-keys
    command: same script (duplicate_driver_keys, check_run_duplicate_keys, registry_and_record_loaders)
    output: scripts/readers/ledger/out/probe_completion.json
    result: >-
      Driver manifests: refused for a top-level duplicate, a nested code.commit duplicate, 'seed' vs seed,
      a merge-key override and a repeated top-level run:. Registries: a planted duplicate superseded_path
      is refused by load_schema_supersessions and load_run_supersessions, and
      check_merge_hygiene.check_registry_duplicate_keys reports it (control on main bytes: no problem).
      Still accepted, last value wins (finding LGX-1): validate_ledger.check_run on a run manifest with
      experiment_id twice, or with certificate.kind discrete_log then none (0 errors, run registered);
      check_new_run_manifests on the same; check_merge_hygiene.check_parses and validate_ledger.load_yaml on
      a decision with status accepted then rejected (no problem; loads as rejected);
      tools/duplicate_run_ids.yaml with a repeated key (plain _safe_load).
  - id: K10-pr-scoped-check-run
    command: python3 -I -B scripts/readers/ledger/probe_merge_hygiene.py <scratch>/tree_main <scratch>/mh (check_new_run_manifests)
    output: scripts/readers/ledger/out/probe_merge_hygiene.json
    result: >-
      A PR-added flat or empty manifest.yaml is reported; a valid one passes. The same flat or empty
      envelope as a run's only manifest_v2.yaml (validate_ledger checks manifest_v2.yaml when no
      manifest.yaml exists) is not reported, and a duplicate-key manifest passes (LGX-5, LGX-1). In CI the
      step gets a full checkout for any non-documentation path (.github/scripts/ci_scope.py), so the
      manifests are on disk there.
  - id: K11-session-bytes-guard
    command: same script (scratch git repositories; check_session_files)
    output: scripts/readers/ledger/out/probe_merge_hygiene.json
    result: >-
      Flagged: a modified sealed output file; a modified output with the journal digest rewritten to match
      (journal not a byte prefix); a deleted sealed file; a merge that keeps execution B's journal and
      output but execution A's log (the RBS-ICPERF-b7e41c splice), in PR scope and in --absolute
      (merge-parent) scope, including the off-journal digest. Not flagged (control): an unrelated change;
      a journal append. Not flagged (LGX-4): an unrecorded extra file added inside a sealed session; a
      journal append that binds a new output file; a non-merge commit modifying a sealed file under
      --absolute; any session directory outside experiments/<EXP>/ and examples/**/.
  - id: K12-session-guard-on-history
    command: python3 -c "check_merge_hygiene.check_session_files(base)" for base b7d5e65b9f and da442739db~200 (audit worktree, git objects only)
    output: scripts/readers/ledger/out/session_files_since_prior.txt
    result: >-
      0 findings for both ranges. The only session change since b7d5e65b9f is RBS-XEDN-a7cd25's journal,
      whose old bytes are a prefix of the new (20,019 -> 33,755 bytes). The known b7e41c mismatch predates
      both ranges and is reported only when a change touches that session.
  - id: K13-runbook-audits-rerun
    command: >-
      git clone --shared --no-checkout; sparse tools/, orchestration/, templates/, ledger/decisions/ and the
      three experiments; checkout --detach da442739db; refs mirrored from the worktree (1,625);
      python3 -B tools/runbook.py audit <session> --auditor "validator/claude-opus-5-5 sheriff SHF-20261106-a114e7 ledger reader"
      (fresh nonce, never --nonce)
    output: scripts/readers/ledger/out/audit_RBS-ICPERF-b7e41c.*, audit_RBS-ICPERF-c4a91e.*, audit_RBS-PFDR-ca5e01.{started,stdout,stderr,partial_replay_stdout.log,partial_replay_main-jobs.jsonl,partial_job_compare.json}
    result: >-
      RBS-ICPERF-b7e41c: verdict flagged; the same digest finding as #2671's d57860
      (steps/S02-trials.attempt-1.supervisor.stderr differs from its recorded digest) plus the two
      journal-chain findings the newer tool adds (fb546f79d0, first commit 93b87120f6, owner
      executor-codex-run-20261019-0527; c3f89d1fce, first commit ba814919aa, owner
      executor-run-icperf-e467a5-20261021). RBS-ICPERF-c4a91e: verdict clean, as #2671's f9db07. Both
      replay 0 units: each session's only unit is invalid_output, so the replay population is empty
      (miss probability 1.0; LGX-8). Both audits are schema v2, fresh nonces 08d1f5de... and b0331641...,
      tool sha256 8de36933.... RBS-PFDR-ca5e01 (replays 4 of 6 valid units): fresh nonce; the first
      chosen unit was census-main RUN-PFDR-eb4733 (19,388 jobs, 947 s wall on the producer's host). At
      load average ~11 on 4 cores the first jobs took 379-408 s each against 57-63 s recorded, so the audit
      was stopped after 30 min (rc 143) to free the shared host; no audit.json was written. Of the 35 job
      records the partial replay wrote, 34 equal the recorded records in every field but `seconds`; the
      35th was killed (status failed_infrastructure:kernel_exit_-9, an infrastructure event, not a
      mismatch). The ca5e01 and bb0d26 replays are not_covered here.
  - id: K14-tolerance-and-parity
    command: python3 -I -B scripts/readers/ledger/probe_runbook_tolerance.py <scratch>/tree_main <scratch>/rbt
    output: scripts/readers/ledger/out/probe_runbook_tolerance.json
    result: >-
      parse_tolerance accepts any finite non-negative value: rel_tol=1, rel_tol=1e6, abs_tol=1e300 are
      accepted; negative, NaN, inf, booleans, {} and unknown keys are refused. compare_tolerant: the bb0d26
      drift pair is within the suggested 1e-9/1e-12, a 1% change is not. Under rel_tol=0.5 a doubled value is
      within tolerance; under rel_tol=1 a 1e3 -> 1e6 change and a document whose mean moves -0.2675 -> -0.9 and
      sd 0.97 -> 5.0 (n and pass equal) are within tolerance; under rel_tol=2 or abs_tol=1e9 a sign flip is.
      Ints and int-vs-float stay exact. Only 'mismatch' is a finding, so each of these audits would be
      verdict clean (LGX-3). Parity helpers: "3.11.15 (main...)" -> 3.11.15, "3" and the float 3.11 ->
      None (unknown), 3.11.15 vs 3.11.17 mismatch, "3.11" vs 3.11.17 match.
  - id: K15-session-collision-and-chains
    command: same script (scratch git repository)
    output: scripts/readers/ledger/out/probe_runbook_tolerance.json
    result: >-
      session_id_collisions: a branch holding the journal blocks a fresh session; an identical or extended
      local journal passes; an unrelated local journal is refused; after the branch is deleted nothing is
      seen (refs only, never fetches, as documented). journal_chain_findings: an overwrite gives 2 chains and
      2 findings, and stays 2 after the second chain appends. On real data the b7e41c rerun reports both
      chains (owners executor-codex-run-20261019-0527 and executor-run-icperf-e467a5-20261021); c4a91e,
      committed twice with identical bytes (31b6310304 / 62578b925e, same session tree f793d2a4), gives 1.
  - id: K16-corrections-and-rulings
    command: >-
      python3 -I -B scripts/readers/ledger/verify_corr_892bca.py; an inline script for DEC-20261029-9bc3ff
      (out/verify_dec_9bc3ff.txt); git log/show/ls-tree/cat-file for CORR-20261028-a02dba and
      DEC-20261029-22e05b / -5554ee; /usr/bin/python3.11 and python3.13 sum([1e16, 1.0, -1e16])
    output: scripts/readers/ledger/out/verify_corr_892bca.json, verify_dec_9bc3ff.txt
    result: >-
      CORR-20261029-892bca: every git fact holds (stderr blob ed9fcfcdf5 at 93b87120f6, 0186e97db6 and main;
      e69de29bb2 at 2d3948be7f; journal fb546f79d0 vs c3f89d1fce; 96 bytes, sha256 85aab135...; the two tips
      and start times; merge parents 4162400dad / af671797aa, merge base without the session; journal,
      environment.json, claim.stdout and release.stdout resolved to B, supervisor.stderr to A; 8 of 9
      B-bound files match on main; first reached main's first-parent line in 6b65cdcaeb (#2416);
      RUN-ICPERF-943efa's three artifacts and receipt match journal seq 4 and the receipt). The stderr blob
      is unchanged on main, so the record is additive. DEC-20261029-9bc3ff premises hold (A: 9/9 digests
      at 93b87120f6, S02 exit 2 infrastructure_error, unit not_run, tracked_dirty false; B: 9/9 at
      2d3948be7f, S02 exit 3 implementation_error, unit invalid_output, preflight tracked_dirty true at
