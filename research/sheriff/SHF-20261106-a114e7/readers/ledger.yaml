limitations:
  - "This file is a sheriff reader record. It is never a validation_report and satisfies no review gate. Projected onto the agents/validator.md template its verdict would be `incomplete` (required-check status and full-checkout validation are not_covered)."
  - "The validator counts come from a non-git materialisation with empty placeholders for large non-record blobs. A hash check against a placeholder would add an error, not hide one, and no reported error names a placeholder."
