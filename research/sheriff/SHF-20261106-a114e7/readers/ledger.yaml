  binding_evidence: >-
    git rev-parse da442739db^{tree} = d39dfde801..., equal to sweep.json
    repos.crypto-autoresearcher.head_tree; sweep.json canary passed (15 caught,
    0 missed, 0 false positives).
  prior_head_compared: b7d5e65b9f (the head audited by SHF-20261028-0f3f64)

