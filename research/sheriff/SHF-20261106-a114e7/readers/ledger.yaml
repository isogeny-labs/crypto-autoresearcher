  model: claude-opus-5-5
  independence: >-
    Produced nothing under audit. Judged from code, records and git objects at
    crypto-autoresearcher origin/main da442739db and from this reader's own
    reruns and probes. PR descriptions were not read. Commit messages were
    displayed by git log/show and are not used as evidence. Prior sheriff
    finding texts were read only to learn what was claimed. One prior-case
    artifact (SHF-20261028-0f3f64 scripts/readers/ledger/out/validate_ledger_main.txt,
    the list of 67 errors) was opened as data, after this reader had recounted
    the same commit independently, to compare the two lists.
target:
  repo: isogeny-labs/crypto-autoresearcher
  path: /home/user/crypto-autoresearcher
  head: da442739db82a5f99d95e4ab9413cbe6fb326f0a
  head_tree: d39dfde801a82d895f6f9dc538d290e448d26792
  at_origin_main: true
  worktree_note: >-
    The audit worktree's HEAD was db4592579a at the start and 3a8ea3ad82 at the
    end: session WIP commits on top of origin/main that touch only
    research/sheriff/SHF-20261106-a114e7/ and problems/ (this reader committed
