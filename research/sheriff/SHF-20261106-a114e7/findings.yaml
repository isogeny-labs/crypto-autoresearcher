    were used, cone-sparse for crypto.
  - 'crypto-autoresearcher is a sparse checkout (44,841 tracked files outside it): validate_ledger refuses
    to run sparse; the ledger reader ran it on a materialised tree with 2,607 empty placeholders for large
    non-record files.'
