  - id: CAN-2
    source: research/sheriff/SHF-20261028-0f3f64/findings.yaml
    verdict: not_fixed
    why: 'Reconfirmed from raw data. ec_frobenius ("base construction") is 0 in every phase of all 42
      IC records, and base_source is retained_header (the base is loaded). The S and P units take cS/cP''s
      cached-table LA, not the rank process''s solve: kS and kP''s linear_algebra phase has 179,700 la_mulmods
      outside the unit. Adding it moves S/rT at w=1 from 115.50259 to 115.50930. Pricing all of X = 427.524
      ms as group additions adds at most 2.43e6 GAE at a 175.95 ns step (2.27e6 at this run''s own 188.2
      ns/walk step), giving a w=0 S gap of at most 0.285 (0.267). The ruling survives, and the w>=0.1
      gaps are lower bounds. Since #1077 the README band section, PROTOCOL.md, open[5] and the BASELINES
      band bullet are unchanged apart from the ''Still open'' sentence. None of them names either omission
      or labels the IC costs as lower bounds.'
    evidence:
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/prior_checks.out
    - cryptanalysis:experiments/koblitz-n83-opcounts-20261023/PROTOCOL.md:73-77
    reader: readers/cryptanalysis.yaml
  - id: CAN-3
    source: research/sheriff/SHF-20261028-0f3f64/findings.yaml
    verdict: not_fixed
    why: Found blind before reading CAN-3, then reconfirmed. The rank stage is 97.44% of S's unpriced
      work and comes from one rank process (seed 101), constant in every bootstrap resample. S/P at w=0
      is 0.997317, a 272-group-op difference between single rank draws (kS rank stage 55,318 vs kP 55,590).
      The archived second seed has +1.377% kS rank probes, which would put S/rT at 29.38 / 117.05, inside
      the reported intervals. The bootstrap upper bound at w=0.1 is 39.54 (seed 20261023, 10k draws),
      39.30 (seed 1) and 39.00 (40k draws), so it is Monte-Carlo-dependent at the third digit. Nothing
      in the band records changed. "S is cheaper than P at every weight" stands unqualified (BASELINES.md:798,
      README:189, open[5]).
    evidence:
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/prior_checks.out
    - research/sheriff/SHF-20261106-a114e7/scripts/readers/cryptanalysis/twin_identity.out
