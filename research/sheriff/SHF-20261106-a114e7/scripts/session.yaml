findings:
  - id: CIX-1
    beat: B7
    severity: major
    claim_ids: [SES/C-CI-MERGE]
    reader: REPORT.md
    what: "ledger-and-harness and merge-hygiene still do not gate merge. PR #3065 (head 4a55bcc5f6) merged 2026-11-06T02:20:55Z while its own validate run 42149688322 (pull_request) still had ledger, merge-hygiene, ledger-and-harness, static-checks, records, changes and the harness shards running; only progress-fidelity, formal workspace, artifacts and fast checks had completed - consistent with exactly the three contexts problems/pr-merge-checks-not-enforced.md records as required. All later passed, which does not satisfy the pre-merge rule. PRs #3058 and #3059 did wait."
    evidence: [research/sheriff/SHF-20261106-a114e7/checks/ci/merge_timings.yaml, problems/pr-merge-checks-not-enforced.md]
    fix: "Add ledger-and-harness (the validate aggregate) and merge-hygiene to the main ruleset's required contexts, or disarm auto-merge whenever applicable checks extend beyond the required set; prove it on a controlled PR with a pending and a failing merge-hygiene (problems/post-merge-checks-mask-pre-merge-state.md)."
  - id: CIX-2
    beat: B7
    severity: major
    claim_ids: [SES/C-CI-MERGE]
    reader: REPORT.md
    what: "Post-merge pull_request_target (closed) runs post success against the PR head SHA and mask a failed pre-merge result. PR #3056 (head 51a2e0fa34) merged 02:20:46Z with lab-parity run 42137487481 (pull_request) concluded failure; run 42149730300 (pull_request_target, created 02:20:50Z, after merge) reports success on the same head SHA, so the PR rollup now reads green. The post-merge run validated main, not the merged head."
    evidence: [research/sheriff/SHF-20261106-a114e7/checks/ci/merge_timings.yaml, .github/workflows/lab-parity.yml, .github/workflows/validate.yml]
    fix: "Give post-merge jobs distinct check names or post them only on the merge commit; never let a post-merge run be read as the head's pre-merge result. Record #3056 in the problem record."
  - id: CIX-3
    beat: B7
    severity: minor
    claim_ids: [SES/C-CI-2805]
    reader: REPORT.md
    what: "ci_scope.resolve_base for pull_request_target takes HEAD^1 of the base-branch commit GitHub checked out, without checking HEAD^2 == pull_request.head.sha; with two merges before checkout the post-merge validation can diff another PR. Latent; not observed."
    evidence: [.github/scripts/ci_scope.py]
    fix: "Check out pull_request.merge_commit_sha explicitly, or refuse when HEAD^2 differs from the event's head sha."
  - id: SES-INDEP
    beat: B9
    severity: major
    claim_ids: []
    reader: REPORT.md
    what: "Independence and attribution. This case was run in session 01TCbLH84PotMkHyFGFE4ifE, which produced nothing under audit (no commit on main carries its id). It was commissioned by session 016SURwTvgaQmnMnhpa1SLXQ, which authored 91 commits on main including EV-ICPERF-08f6f9/DEC-20261105-8a9984, EV-ICPERF-84ff45/DEC-20261105-6e2616, the ICPERF approvals and lane, CORR-20261106-243c4d, #3059, and EV-PFDR-07d608/DEC-20261029-01405d/KN-FIND-c81e5b/CORR-20261029-1aaef6, and that session asked that this case's commits carry its Claude-Session trailer and that it merge this PR. The trailer therefore names the producer; reader LNX-3 read it as self-audit. The skill's refusal condition (this session produced the result) is not met, but the commissioner and merger is the producer of much of the audited scope."
    evidence: [research/sheriff/SHF-20261106-a114e7/readers/lean.yaml]
    fix: "Read this case's verdicts on ICPERF and PFDR records as an audit commissioned by their producer; the Coordinator should have a session that did not produce them merge the PR and cite the case. Commits from 2026-11-06 carry an Audit-Session trailer naming the auditing session."
  - id: SES-UNLINKED
    beat: B9
    severity: minor
    claim_ids: []
    reader: REPORT.md
    what: "A reader suggested overclaimed/unsupported for a claim without linking a finding; the reason is in that reader's claim text and checks."
    evidence: [research/sheriff/SHF-20261106-a114e7/readers]
    fix: "See the reader file for the claim; the producer narrows the wording or supplies the artifact."
