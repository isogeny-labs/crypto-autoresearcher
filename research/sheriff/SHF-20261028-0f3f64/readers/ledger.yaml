suggested_verdicts:
  - claim: C-MAN-1
    text: "complete_manifest never invents values"
    verdict: upheld_scoped
    scoped_to: >-
      No measured or scientific value is invented. Identity, inputs, environment, timing and code
      fields come from the plan, trial, authority, environment.json, argv and the clock, and absent
      plan keys (seed, parameters, hypothesis_id) are not defaulted. The envelope does fill
      constants: status completed and its note (from exit code 0), commit_meaning, pointer fields
      (three of which name files not yet written), and the documented certificate.kind none.
    findings: [LGN-4]
  - claim: C-MAN-2
    text: "complete_manifest refuses contradictions"
    verdict: overclaimed
    scoped_to: >-
      Refuses contradictions only on run.id, run.run_id and run.experiment_id, and only by Python !=.
      All other fields, nested blocks and type differences pass (24/27 cases). A contradicting
      envelope reaches output_validated end to end.
    findings: [LGN-2]
  - claim: C-MAN-3
    text: "complete_manifest gates on validate_ledger.check_run and refuses when it fails"
    verdict: upheld_scoped
    scoped_to: >-
      check_run is called on the driver manifest and on the completed candidate before os.replace.
      A planted check_run error, missing raw-result.json or stdout.log, a bad certificate kind or an
      unverified claim certificate each refuse, and the driver bytes are kept. The gate is schema-only
      (empty Ctx, no cross-references). check_run passes empty or null documents, so a 0-byte
      manifest allowed empty by the plan is output_validated. Driver-failure runs (rc != 0) are never
      completed or gated, and are still committed to main (LGN-8).
    findings: [LGN-3, LGN-8]
  - claim: C-MAN-4
    text: "complete_manifest preserves the driver's bytes (kept and hashed, not re-serialised)"
    verdict: upheld_scoped
    scoped_to: >-
      The original bytes are kept exactly in the receipt and sha256-bound in both the receipt and the
      completed manifest. Refusal and unchanged paths leave the file byte-identical. The published
      manifest.yaml itself is a re-serialisation: comments are lost, YAML 1.1 values are normalised
      and duplicate keys collapse silently.
    findings: [LGN-5]
  - claim: C-LED-1
    text: "PR #2497 took validate_ledger new errors from 143 to 126"
    verdict: overclaimed
    scoped_to: >-
      At the PR tip, a controlled measurement gives 141 -> 124 (-17, exactly the 17 claimed records).
      The absolute figures carry 2 measurement artifacts. As merged (0265593c57 vs 692b54f1f4) the
      change is 115 -> 100 (-15): TASK-20261017-2d324f was not fixed and DEC-20261019-624f64
      regressed, both still failing on main.
    findings: [LGN-1, LGN-6, LGN-8]
  - claim: C-LED-2
    text: "The AES and five flat-run manifest_v2 records are faithful to the archived bytes they cite"
    verdict: upheld_scoped
    scoped_to: >-
      All 7 records: 53/53 cited hashes recompute and 7/7 registry entries re-hash. Every transcribed
      value equals the archived key it claims, with the 3 ICPERF differences disclosed in
      status_source and kind_basis. certificate.kind none in the five flat runs is a derived,
      disclosed ruling, not a transcribed value. The AES custody annotation names the wrong first
      commit (LGN-7).
    findings: [LGN-7]
  - claim: C-LED-3
    text: "The rulings DEC-20261023-5c9671 left in place are justified by the record contents"
    verdict: upheld_scoped
    scoped_to: >-
      Each kept ruling's premise holds on the record contents: FROB (cb06b8c20c lacks the driver;
      quarantine requires completed_invalid and evidence_eligible false); QSP-715b58 (claim_expired,
      no output); TASK-20261003-6e0c8a (no handoff, id only in 16555aac8d); prior-art/citations (a
      screen or source reading is needed); EXP-AUXIN-339fb0 (draft, approved_by null);
      RUN-BINSTD-f7ca97 (no capture companions); the 30 review-plan errors (completing them would
      invent assignments); handoff budgets (no limit in card or decision). Exceptions: the two
      DEC-20260929 items are listed as live errors but are measurement artifacts (LGN-6), and the
      "resolved" TASK-20261017-2d324f budget is not resolved as merged (LGN-1).
    findings: [LGN-1, LGN-6]

