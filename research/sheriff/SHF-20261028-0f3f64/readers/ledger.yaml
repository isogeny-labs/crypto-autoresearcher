findings:
  - id: LGN-1
    severity: major
    claim_ids: [C-LED-1, C-LED-3]
    what: >-
      PR #2497's merge corrupted tools/schema_supersession_registry.yaml. Merge commit 21acbaab63
      ("keep both sides of the overlap") dropped the '- kind: ledger' and 'registered:' lines of
      both new entries. Their keys became duplicate keys inside the existing DEC-20261019-624f64
      entry, and YAML keeps the last value. On main only TASK-20261017-4d744d is routed.
      TASK-20261017-2d324f still fails "missing required field 'budget'", although its v2 exists and
      hash-matches. DEC-20261019-624f64 lost its routing and now fails "missing required field
      'knowledge_promotion'" (a regression). Both errors are among the 67 on main today.
      check_merge_hygiene --absolute and validate_ledger both load the file without complaint.
    evidence:
      - "tools/schema_supersession_registry.yaml lines 1873-1892 (duplicate keys at 1873)"
      - "git show f450a6cce3:tools/schema_supersession_registry.yaml (well-formed) vs 21acbaab63 (broken)"
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/validate_ledger_pr2497-parent1.txt
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/validate_ledger_pr2497-merge.txt
    fix: >-
      A registry correction that restores the three entries as separate list items
      (DEC-20261019-624f64, TASK-20261017-2d324f, TASK-20261017-4d744d) under a Coordinator
      decision. Also make the registry loaders (validate_ledger, check_merge_hygiene) reject
      duplicate mapping keys, so a merge cannot silently clobber an entry again.
  - id: LGN-2
    severity: major
    claim_ids: [C-MAN-2]
    what: >-
      complete_manifest() checks only id, run_id and experiment_id against the plan (_agree).
      Every other field the driver wrote is kept unchecked, because put() adds only missing keys and
      whole blocks are skipped when present. 24 of 27 contradiction cases were accepted:
      task_id, trial_id, approved_by, hypothesis_id; code.commit, code.command and
      code.check_command; environment.commit and environment.python; inputs.seed 2 vs 1, "1" vs 1,
      1.0 vs 1 and True vs 1; inputs.parameters, including "20" vs 20; inputs.plan_sha256;
      inputs.trial_id; timing.started_at and timing.wall_seconds; result.metrics vs run.metrics;
      attack_claimed false in manifest.yaml but true in raw-result.json (and the reverse) when the
      driver supplies a certificate. A complete envelope ('unchanged' path) contradicting task_id,
      seed and commit was also accepted. End to end, a driver with a contradicting task_id, seed and
      commit is published as output_validated. _agree uses Python !=, which treats 1.0, True and 1
      as equal (latent, because only string fields are compared today). The documentation says
      "one that contradicts the plan is refused".
    evidence:
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/complete_manifest_adversarial.json (cases b_*)
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/execute_trial_end_to_end.json (E2)
      - tools/experiment_execution.py:241-245, 280-285, 312-371
    fix: >-
      Compare every driver-present field that has a declared source (plan, trial, authority,
      environment.json, argv, checker, clock) recursively and type-strictly (same type and equal at
      every level). Refuse mismatches between run.metrics and result.metrics, and between the
      manifest's and raw-result.json's attack_claimed. Otherwise narrow docs/experiment-execution.md
      to "id, run_id and experiment_id are checked".
  - id: LGN-3
    severity: major
    claim_ids: [C-MAN-3]
    what: >-
      The gate is check_run, and check_run is vacuous on a document that loads as None: a 0-byte,
      comment-only or 'null' manifest.yaml yields no errors. execute_trial skips complete_manifest
      for a 0-byte manifest, and load_plan lets a plan list manifest.yaml in allow_empty_artifacts.
      End to end, such a trial is output_validated with an empty manifest.yaml (coverage
      output_validated, measurement_complete true). The full ledger validator also accepts the empty
      file silently; it would surface only as "unknown run" if something cited the run.
    evidence:
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/complete_manifest_adversarial.json (c7_check_run_on_empty_or_null_manifest)
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/execute_trial_end_to_end.json (E1)
      - "tools/validate_ledger.py check_run: 'doc = load_yaml(path, ctx); if doc is None: return'"
      - tools/experiment_execution.py:195-203, 739-753
    fix: >-
      check_run reports an error for a None or non-mapping document. load_plan refuses
      manifest.yaml and raw-result.json in allow_empty_artifacts. execute_trial calls
      complete_manifest for any existing manifest.yaml, which refuses non-mappings.
  - id: LGN-4
    severity: minor
    claim_ids: [C-MAN-1]
    what: >-
      No measured or scientific value is invented. But the documentation's "the only derived value
      is certificate.kind: none" is inaccurate. status: completed and its status_note are derived
      from exit code 0. code.commit_meaning, code.command_file, environment.file, timing.source,
      result.raw_result, result.executor_receipt and artifacts.* are constants. Three of those
      pointers (execution-receipt.json, check.stdout.log, check.stderr.log) name files that do not
      exist when the manifest is written; the supervisor creates them later. code.command comes from
      argv in memory, not from command.txt as documented, and a disagreement between the two is not
      detected.
    evidence:
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/complete_manifest_adversarial.json (a1 provenance_table, literal_fields, pointers_to_files_absent_at_completion_time)
    fix: "Correct docs/experiment-execution.md, and record each added field's source in run.envelope_completion."
  - id: LGN-5
    severity: minor
    claim_ids: [C-MAN-4]
    what: >-
      The driver's bytes are kept exactly (receipt manifest_completion.driver_manifest_text) and
      hashed in both the receipt and run.envelope_completion. A BOM, CRLF and non-ASCII manifest
      round-trips byte-exactly through the receipt's JSON options. Refusal and 'unchanged' paths
      leave manifest.yaml byte-identical with no candidate left behind. However, the published
      manifest.yaml is a yaml.safe_dump re-serialisation. Comments are dropped; 1.10 becomes 1.1,
      yes becomes True, 017 becomes 15, and timestamp text becomes a datetime. Duplicate keys
      collapse silently, last one wins: a driver text 'attack_claimed: true' then
      'attack_claimed: false' is published as false, with certificate.kind none derived from it.
    evidence:
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/complete_manifest_adversarial.json (d1..d5)
    fix: >-
      Refuse driver manifests with duplicate keys. State in envelope_completion that values were
      re-serialised. Optionally keep the driver bytes as a sibling file
      (manifest.driver.yaml) in addition to the receipt copy.
  - id: LGN-6
    severity: minor
    claim_ids: [C-LED-1, C-LED-3]
    what: >-
      DEC-20261023-5c9671's 143 and 126 each include two phantom errors from its own sparse
      measurement, which left files over 300 KB off disk. The DEC-20260929-21bb51 and -7efa82
      draft-contract.yaml files are about 700 KB, and the validator hashes them. The decision lists
      both decisions as "still reported in this measurement" among unchanged rulings, although its
      own delta note says cc21e56e76 validated these references. With a measurement controlled
      against a full checkout, the counts are 141 at e9b91d62a9 and 124 at f450a6cce3. The -17
      delta is exact.
    evidence:
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/validate_ledger_pr2497-base.txt
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/validate_ledger_pr2497-tip.txt
      - "git ls-tree -l e9b91d62a9 coordination/goals/GOAL-AUXIN-a93442 (BATCH-8456b6 703334 B, BATCH-9b2090 705752 B draft contracts)"
    fix: "Record ledger counts from a measurement controlled against a full checkout (K5 shows one that fits about 2.7 GB), and name any measurement artifacts."
  - id: LGN-7
    severity: minor
    claim_ids: [C-LED-2]
    what: >-
      RUN-AES-0739d9 and RUN-AES-a36d0b manifest_v2 execution_source_custody say the implementation
      files "were first committed later (via merge fa563c5812, 2026-10-03)". In fact
      implementation/ (8 files) was first committed in 3bc7f516ec at 2026-09-10T19:38:24Z. That
      commit is the direct child of the recorded launch HEAD d447e31aaa, lands about 5 minutes after
      the run's last logged event (19:33:09Z), and its bytes are identical to main today. The
      record's conclusion still stands (the executed bytes are not hash-bound), but the pointer is
      wrong and understates the custody that exists.
    evidence:
      - experiments/EXP-AES-14352a/runs/RUN-AES-0739d9/manifest_v2.yaml (execution_source_custody)
      - "git log --full-history --diff-filter=AD -- experiments/EXP-AES-14352a/implementation/run_stage1.py; git log -1 --format=%P 3bc7f516ec; git diff --stat 3bc7f516ec origin/main -- experiments/EXP-AES-14352a/implementation/ (empty)"
    fix: "A superseding correction note naming 3bc7f516ec; records stay immutable."
  - id: LGN-8
    severity: major
    claim_ids: [C-LED-1]
    what: >-
      Schema-failing run manifests keep entering main through PRs whose merges add new
      validate_ledger errors. RUN-ICPERF-943efa and RUN-ICPERF-b09be8 came in via PR #2452 (merged
      2026-10-24; receipts invalid_output, refusal recorded in detail). RUN-ECDLP-9f18c9 came in via
      PR #2579 (2026-10-25; infrastructure_error, rc 2, so completion never applied). Together they
      account for 26 of the 67 errors on main. PR #2497 itself added DEC-20261019-624f64.
      tools/ci_ledger_gate.py fails any PR whose head has an error its base lacks, so either the
      validate workflow did not run or it is not required for merge. The class of M2-R recurs after
      PR #2488.
    evidence:
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/ledger/out/validate_ledger_main.txt
      - "experiments/EXP-ICPERF-e467a5/runs/RUN-ICPERF-943efa/execution-receipt.json, experiments/EXP-ICPERF-b2f2d0/runs/RUN-ICPERF-b09be8/execution-receipt.json, experiments/EXP-ECDLP-381959/runs/RUN-ECDLP-9f18c9/execution-receipt.json"
      - tools/ci_ledger_gate.py:47-75
