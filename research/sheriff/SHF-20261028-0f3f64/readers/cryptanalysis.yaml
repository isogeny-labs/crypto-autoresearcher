findings:
  - id: CAN-1
    beat: B5 / B8.4
    severity: minor
    claim_ids: [C-KOB-3]
    what: >-
      The band is recorded only as baselines.json open[5] and a BASELINES.md bullet; the stacked row itself still says it has
      none. other_records[13] (stacked producer) keeps section_5a_band "Not computable from this run ... the IC / rho gap (94.4)
      has no band", gap_cold_ic_over_rho.statistic "the section 5a band is not computable (section_5a_band)" and
      uncharged_phases.measurement_status "The section 5a band stays uncomputable (open)"; BASELINES.md lines 424-427 and 441-443
      say the same. No corrections[] entry records the addition (last entry 2026-10-17) and as_of stays 2026-10-21. A reader of
      the row, or a uniform reader of the JSON, is told the band does not exist.
    evidence:
      - "cryptanalysis:docs/ic/baselines.json other_records[13].section_5a_band, .gap_cold_ic_over_rho.statistic, .uncharged_phases.measurement_status, open[5], corrections, as_of"
      - "cryptanalysis:docs/ic/BASELINES.md:424-427, 441-443, 707-738"
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/cryptanalysis/out/prior_findings_evidence.txt
    fix: >-
      Add a corrections entry (evidence added, accounting only) and point the stacked row's section_5a_band (and the two
      BASELINES.md bullets) at the recorded band: run 39882571652, gaps 0.01138 / 29.00 / 115.5, unresolved. Update as_of.
  - id: CAN-2
    beat: B5.4
    severity: minor
    claim_ids: [C-KOB-3, C-KOB-4]
    what: >-
      The band unit is not "all of its work" (PROTOCOL.md:73). Factor-base construction is absent: every IC process loads the
      K600 base from a file and ec_frobenius ("base construction") is 0 in every phase of all 42 IC records. The linear algebra
      is represented by the cold process's verified cache load (la_mulmods 0) rather than the rank process's solve (179,700
      la_mulmods). Neither omission is named in the README band section, PROTOCOL.md, open[5] or the BASELINES.md band bullet
      (the stacked row discloses both, for wall time only). Impact is bounded and does not change a ruling: adding the LA phase
      moves the w=1 S gap from 115.50259 to 115.50930; pricing all of the measured construction time X = 427.524 ms (Intel replay
      host) as group additions at the 175.95 ns rT step (EPYC 9V45) adds at most 2.43e6 GAE, so the w=0 S gap would be at most
      0.285, still below 1: the flip and "unresolved" survive, and at w >= 0.1 the reported gaps are lower bounds on the IC's
      distance to rho.
    evidence:
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/cryptanalysis/out/counter_consistency.json
      - "research/sheriff/SHF-20261028-0f3f64/scripts/readers/cryptanalysis/out/reimpl_result.json readouts.omitted_rank_process_la_vs_cold_la, S_gap_w1_with_rank_LA_added, factor_base_X_as_GAE_upper_bound, S_gap_w0_if_X_all_group_adds"
      - "cryptanalysis:docs/ic/baselines.json other_records[13].uncharged_phases"
    fix: "Name both uncharged phases in the band entries and label the IC costs (and so the w >= 0.1 gaps) as lower bounds; count base construction when the counters are ported."
  - id: CAN-3
    beat: B6.5
    severity: minor
    claim_ids: [C-KOB-3]
    what: >-
      The intervals do not cover the dominant term's variance. The paired bootstrap resamples the 20 cold points only; the
      rank stage, 97.4% of S's unpriced work, comes from one rank process (seed 101) and is a constant in every resample. So the
      w=0.1 / w=1 intervals carry rho's point-to-point spread, not rank-seed spread, and the S-vs-P ranking at w=0 (S/P 0.997317
      [0.997316, 0.997317]) rests on a 272-addition difference between the kS and kP rank stages at that one seed (101,088.9 vs
      101,360.9 group operations). Archived K2 (seed 102) has 1.38% more rank-stage probes than K1, which would move the S gap to
      about 29.38 / 117.05: inside the reported intervals, so no ruling changes. Separately, the bounds are quoted to 4 significant
      figures but are Monte-Carlo-dependent at the third: the w=0.1 S upper bound is 39.54 at seed 20261023, 39.30 at seed 1 and
      39.00 with 40,000 draws.
    evidence:
      - "research/sheriff/SHF-20261028-0f3f64/scripts/readers/cryptanalysis/out/reimpl_result.json band.pairs['S vs P'], band.gap[*][*].ci_seed1 / ci_seed987654321_40k, readouts.rank_seed_variability, readouts.S_rank_stage_unpriced_share"
    fix: "State that the interval excludes rank-seed variance, report the w=0 S < P order as single-seed, and quote bootstrap bounds to 3 significant figures (or count a second rank seed)."
  - id: CAN-4
    beat: B6.1 / B6.3
    severity: minor
    claim_ids: [C-KOB-2]
    what: >-
      The acceptance analysis postdates the data. analyze_v2.py first appears at ad1fbc6 (2026-10-23T02:59:00Z), 62 minutes after
      the last row finished (01:56:42Z); the frozen protocol named opcounts.py analyze. v2 is stricter only (it adds
      complete_frozen_panel and gates the band on it; the band arithmetic is unchanged) and its counts and band are byte-identical to
      v1's, so there is no forking-path effect on any number, but README.md, ANALYSIS_V2.md and ARTIFACT.json do not state the
      chronology. Preregistration is provable only from the PR head (765061e ancestor of 1a6067f and 02a59e2), not from main's
      squashed history.
    evidence:
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/cryptanalysis/out/preregistration_chronology.txt
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/cryptanalysis/out/sha256sums-check.txt
    fix: "Record in ANALYSIS_V2.md or ARTIFACT.json: protocol 765061e 01:11:19Z, run 01:23:55-01:56:42Z, v2 ad1fbc6 02:59:00Z, v2 stricter-only with byte-identical counts and band; cite refs/pull/1077/head for the ancestry."
  - id: CAN-5
    beat: B5 (dominated_by)
    severity: minor
    claim_ids: [C-KOB-4]
    what: >-
      The band compares time only. On memory the IC arms are about 100x worse than the matched rho: peak RSS 1.876 GB (kS, cS)
      and 5.81 GB (kP, cP) with a 1 GiB root table of 29.88M entries, against 18.4 MB RSS and a mean of 138,876 table entries
      (6.8 MB payload lower bound) for rT. The w=0 end ("S about 88x cheaper") is therefore not a Pareto point: rT is not dominated
      at any weight. Not stated in the README band section or the band entries.
    evidence:
      - "research/sheriff/SHF-20261028-0f3f64/scripts/readers/cryptanalysis/out/reimpl_result.json readouts.memory"
    fix: "Report peak RSS and stored entries for every arm beside the band, and say that rho is undominated."

