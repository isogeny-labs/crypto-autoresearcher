readings_not_evidence:
  - >-
    Where reality sits in the band: the stacked row's wall-time gap 94.42 [73.52, 125.29] (run 38862448935) corresponds to a
    uniform weight w = 0.60 [0.37, 1.31] in this band, and the IC's own field-operation counts imply 0.09-2.9 GAE per native
    operation (0.16-0.72 at I = 10 M, S = 0.5 M, depending on the half-trace cost). Both readings put the true pricing far above w* = 0.0029, where the IC is
    tens of times dearer than rho; neither changes the frozen-rule ruling "unresolved" (out/readings.json, readouts.implied_w_*).
  - >-
    Reversal (multi-target regime): with the rank stage, setup and LA shared by T targets, the IC beats a rho that does not reuse
    work only beyond about T = 30 targets (w=0.1) or T = 139 (w=1); against a rho that reuses distinguished points (Kuhn-Struik heuristic,
    per-target cost ~ 1.128/sqrt(T)) the best IC/rho ratio is 1.96 at w=0.1 and 7.8 at w=1, near T = 686. Under these heuristics
    amortization does not rescue the stacked producer; a measured multi-target band would test it (out/readings.json).

red_team_report:
  id: RT-20261028-cryptanalysis-opcounts
  task_id: "sheriff SHF-20261028-0f3f64, reader joint B5/B6/B7 cryptanalysis"
  claim_under_review: "cryptanalysis PR #1077: counted n=83 stacked producer, run 39882571652, section 5a band for the stacked row, 'unresolved vs rho', no improvement"
  objections:
    - "CAN-1 stale band status in the stacked row (baselines.json, BASELINES.md)"
    - "CAN-2 band unit omits factor-base construction and substitutes the cached-LA load; band text calls it all of the work"
    - "CAN-3 interval excludes rank-seed variance; w=0 S<P rests on one seed; bounds MC-dependent at the 3rd figure"
    - "CAN-4 v2 analyzer authored after the data (stricter-only, numbers unchanged), chronology unstated"
    - "CAN-5 memory axis absent; rho undominated"
  required_controls:
    - "Count a second rank seed (e.g. K2, seed 102) with the counted producer to put rank-seed variance into the interval"
    - "Port the counters to the rank-finder derivation and run its own counting protocol before any band is quoted for the current row"
  counterexample_or_mutation: "CK-11: seven known-verdict mutations (truncation, single row, seed, duplicate, record +1, rho x1000, P := S) all reach the known verdict"
  baseline_comparison: >-
    Matched rho rT: 8,882,150.8 group additions = 0.986 x sqrt(pi r / 332); BSGS with the same quotient (~1.44e7 ops, ~7.2e6
    entries) is dominated by rT; IC S at 1.011e5 group + 3.093e9 native ops per target: 0.0114x rT at w=0, 29.0x at 0.1,
    115.5x at 1 (unresolved; flip at w* = 0.0029); memory ~100x rT's.
  heuristic_challenges: []
  cost_model_challenges: ["CAN-2", "CAN-3", "CAN-5"]
  reduction_and_scope_challenges:
    - "The band is for the stacked producer only; it does not transfer to the current rank-finder row (wall-time gap 3.924 vs 94.4)"
    - "Cold-start, one target per unit; no amortized figure is reported or claimed"
  proof_architecture_challenges: []
  narrowest_supported_statement: >-
