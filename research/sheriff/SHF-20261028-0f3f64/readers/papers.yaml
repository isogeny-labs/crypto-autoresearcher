    output: research/sheriff/SHF-20261028-0f3f64/scripts/readers/papers/p1_pn1_f64.out
    result: pass
    note: >-
      Curve orders checked independently (G on curve, n probable-prime, n*G = O, Hasse) for all 8
      curves. Exact n^4 > f64::MAX = (2^53-1)2^971 holds for secp256k1, P-384, brainpoolP384r1,
      P-521 and fails for P-256 (n^4/MAX = 1 - 2^-30), brainpoolP256r1, secp192k1, secp224k1,
      as the note states. P-521: bits(n^2) = 1042, shift 542; emulating lattice.rs
      big_to_f64_scaled with round-to-nearest conversion gives the diagonal exactly 2^500 and a
      first-GS-subtraction residual of exactly 0 over 64 random a_l (the note's 2026-10-17
      correction). With truncating conversion the diagonal is 2^500(1-2^-53) and the residual
