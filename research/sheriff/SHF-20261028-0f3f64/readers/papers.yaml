    would_cover: "elan + lake build && lake env lean AxiomAudit.lean && lake env leanchecker --fresh <modules> in each project (a session allowed to run crypto code), diffed against the committed logs"
  - what: The three CI runs the committed axiom-audit logs were copied from, and their artifact zip hashes
    would_cover: "gh run view / gh run download with read access to isogeny-labs/crypto; sha256sum of the artifact zips against the log headers"
  - what: ecbench verify of the 951 sessions (in particular the 13 never-finalised ones) and any replay
    would_cover: "cargo build --release --bin ecbench; bash .github/scripts/ecbench-audit-sessions.sh <list>; ecbench verify --replay N on another host"
  - what: PDF rebuild checks (make check) for the two papers and the TreeSplit report
    would_cover: "make -C papers/lll-degeneracy-note check; make -C papers/structural-completeness check; typst compile of report.typ"
  - what: The a2 - 2p values of the seven norm-form primes and the PARI class-group and Galois outputs
    would_cover: "an independent genus-2 point count of C_p (not plain arithmetic); only the committed PARI output was compared"

limitations:
  - >-
    The "exactly 2^500" and "exact subtraction" statements in the LLL note were checked by
    emulating crypto's lattice.rs in Python binary64, assuming BigInt::to_f64 rounds to nearest.
    That is what num-bigint 0.5.1 does (round-to-odd then nearest-even, inspected in the local
    cargo registry). crypto locks num-bigint 0.4.8, whose source is not on disk. Under truncation
    the conclusion flips (residual 2^447).
  - >-
    Curve constants were copied from crypto's source and then validated independently (n*G = O,
    primality, Hasse), not compared against FIPS 186-4 / SEC 2 / RFC 5639 documents.
  - >-
    Reading blobs outside the sparse set fetched objects into /home/user/crypto/.git. The
    session.json, records.jsonl and .gp blobs were bulk-fetched by OID. An early mistaken `git
    ls-tree -r -l HEAD` (the -l size lookup forces a lazy fetch per blob) ran about 10 minutes and
    spawned `git gc --auto` before this reader killed it. Neither the sparse set, HEAD nor the
    working tree changed (checked at the end), and no crypto code was executed. Read-only shell
    commands that a project hook misclassified as experiment launches carried a CHECKPOINT_SKIP
    tag.
  - >-
    Verdicts are on current files at 669809d5c6. "fixed" with basis: text means the defect is
    gone from the text and the mechanism is present in code or workflows. Any run-dependent part
    is listed under not_covered.

