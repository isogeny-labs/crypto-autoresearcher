findings:
  - id: PPN-1
    beat: B8
    severity: minor
    prior: L-N2
    what: >-
      The conductor-gap README's status banner still reads "Result: no implemented method sees
      the gap; see §5." (crypto:research/conductor_gap_cm_pairs_20261010/README.md:3-4). §5 was
      corrected to "No implemented method shows a reproducible conductor effect ... pending the rho
      re-test at l = 8209" (README.md:150-157), and the correction note there says the unqualified
      sentence "the still-unexplained l = 8209 rho interval does not yet allow". The banner, the
      first thing a reader sees, keeps the withdrawn conclusion.
    evidence:
      - "crypto:research/conductor_gap_cm_pairs_20261010/README.md:3-4"
      - "crypto:research/conductor_gap_cm_pairs_20261010/README.md:150-157"
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/papers/text_checks.out
    fix: "Qualify the banner as §5 is qualified (no reproducible effect, pending the l = 8209 rho re-test under a fresh measurement seed), with a dated correction note."
  - id: PPN-2
    beat: B8
    severity: minor
    prior: P-N1
    what: >-
      The analysis note that the corrected LLL note cites as its diagnosis still asserts the
      withdrawn P-521 mechanism and two wrong numbers, with no correction since 2026-09-19. §10.2
      says the "Root cause" is "catastrophic cancellation" with residual ~2^446
      (RESEARCH_LLL_GS_ANALYSIS.md:275-276, 291, 305). The note's own 2026-10-17 correction calls
      that unsupported. §10.1 says f64::MAX ≈ 2^1023 (line 265); it is (2^53-1)·2^971 ≈ 2^1024.
      It also says P-256's order is smaller than secp256k1's "by ~2^192" (line 267); the
      difference is 2^224.0. The reader recomputation also shows the "exact" claim is conditional:
      the zero residual on the initial basis needs a correctly rounded BigInt-to-f64 conversion.
      With truncation the residual is 2^447, as §10.2 says.
    evidence:
      - "crypto:research/notes/lattice-hnp/RESEARCH_LLL_GS_ANALYSIS.md:265,267,275-276,291,305"
      - "crypto:papers/lll-degeneracy-note/lll_degeneracy_note.tex:52,69-87,170-173"
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/papers/p1_pn1_f64.out
    fix: >-
      Add a dated correction to §10.1-10.2 of the analysis (mechanism withdrawn as in the note;
      f64::MAX ≈ 2^1024; difference 2^224). Pin the "exactly 2^500" sentence of the note to the
      num-bigint version and its to_f64 rounding (0.4.8 is locked; only 0.5.1's round-to-odd
      code was inspected here), or to a one-line Rust check whose output is committed.
  - id: PPN-3
    beat: B8
    severity: minor
    prior: null
    what: >-
      The structural-completeness paper's Reproducibility table gives a total of "≈ 3533" LOC
      (structural_completeness.tex:986, also in the committed PDF). Its 16 rows sum to 3333. Four
      rows disagree with the committed files at HEAD: howe_explicit_cover.gp 274 vs 201 lines,
      multi_curve_audit.gp 274 vs 239, curve_audit_template.gp 120 vs 204, glv_hnp_phase1.gp 180
      vs 176. The actual total is 3305. The neighbouring claims "committed expected outputs" and
      "approximately 3 minutes on an M-series Mac" cite no artifact.
    evidence:
      - "crypto:papers/structural-completeness/structural_completeness.tex:960-986"
      - research/sheriff/SHF-20261028-0f3f64/scripts/readers/papers/structural_recount.out
    fix: "Regenerate the table from the files (wc -l at a named commit), correct the total, and cite the expected-output files and the timing record or drop those claims; rebuild the PDF."
  - id: PPN-4
    beat: B8
    severity: minor
    prior: P5/P-N6
    what: >-
      The structural-completeness introduction still says the theorem turns a folklore claim
      "into a rigorously decomposable, mechanically verifiable structural statement"
      (structural_completeness.tex:146-148; Markdown twin PAPER_STRUCTURAL_COMPLETENESS.md:110).
      After the P5/P-N6 corrections, the abstract and README say the theorem is "argued" with
      "proof sketches ... not yet independently reviewed". Nothing about it is machine-checked:
      no Lean or other formalisation is cited, and §8's proof is a case-analysis sketch.
    evidence:
      - "crypto:papers/structural-completeness/structural_completeness.tex:146-148"
      - "crypto:papers/structural-completeness/structural_completeness.tex:74-77"
      - "crypto:research/notes/cm-isogeny/PAPER_STRUCTURAL_COMPLETENESS.md:110"
    fix: "Drop 'rigorously ... mechanically verifiable' or replace it with the sketch status, in the .tex, the Markdown twin and the PDF."
  - id: PPN-5
    beat: B7
    severity: minor
    prior: E1-R
    what: >-
      The verifier now marks a never-finalised session records_bound: false with interruption
      never_finalised (audit.rs:214-226, 281-285, 759-762), which is the "report them as unbound"
      branch of the E1-R fix. CI never surfaces that mark: ecbench-audit-sessions.sh deletes each
      verify receipt (line 103) and reports every accepted session as one that "pass[es] integrity"
      (line 114). No line in the script or ecbench.yml mentions records_bound or never_finalised.
      13 committed sessions are in that state. 6 of them were added on 2026-10-19, after E1-R:
      pdp_split_slots_20261012/{A-n19, A-n19-02, A-n19-fast} and
      volcano_tall_layers_20261018/{b1__spec_t3, b2__spec_t3, b2__spec_t60}. Nothing in CI tells
      a citer that these are unbound prefixes.
    evidence:
      - "crypto:src/cryptanalysis/ecbench/audit.rs:214-226,281-285,336-341,759-762"
