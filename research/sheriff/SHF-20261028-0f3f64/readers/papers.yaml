# Independent B3/B7/B8 reader: crypto papers, Lean text and ecbench (sheriff case SHF-20261028-0f3f64).
# Paths: bare = crypto-autoresearcher; crypto:<path>:<line> = isogeny-labs/crypto at HEAD
# 669809d5c6110796b36b32fe26073376a605911d (== origin/main, sparse clone, read through git show / ls-tree).
# This reader produced nothing under audit. Scripts and saved outputs:
# research/sheriff/SHF-20261028-0f3f64/scripts/readers/papers/ (S below).
joint: >-
  B3 (Lean text: holes, native_decide, trusted-native list, committed axiom-audit logs), B7
  (ecbench session enumeration, session status, never-finalised sessions, provenance of the
  fixes) and B8 (paper numbers and wording), re-checking prior findings P1 P3 P4 P5 L3 L4 L5 L6
  L7 E1 E2 (SHF-20261016-3caa6f) and P-N1 P-N2 P-N4 P-N5 P-N6 P-N7 L-N1 L-N2 L-N7 E1-R
  (SHF-20261017-e4d7f6) against current crypto main.
