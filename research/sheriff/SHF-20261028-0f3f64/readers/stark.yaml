suggested_verdicts:
  - claim: C-STARK-1
    text: the OOD values are transcript-bound
    verdict: upheld_scoped
    scoped_to: "By code reading at crypto 669809d5c6. f(z), f(wz) and Comp(z) are absorbed (canonical) after z and before gamma/lambda, the FRI challenges and the queries. z is drawn after both commitments, the statement is absorbed first, and the verifier replays the prover's order exactly (K3). The ood_unbound negative test pins the binding. cargo test is not_covered, and AIR-fingerprint, n and beta binding is untested (S2N-5)."
    findings: [S2N-5, S2N-11]
  - claim: C-STARK-2
    text: the verifier recomputes D(x)
    verdict: upheld_scoped
    scoped_to: "By code reading. D(x) is recomputed from the Merkle-bound f(x), f(wx) (opened at (p + beta) mod L) and Comp(x) plus the OOD values, and compared with the Merkle-bound FRI layer-0 value at the same position. The second term (f(wX) - f(wz))/(X - z) is a valid quotient (script). The Deep gate is pinned by tests; fri_pos == p is not isolated, and the doc text omits f(wx). cargo test is not_covered."
    findings: [S2N-6, S2N-7]
  - claim: C-STARK-3
    text: the degree bound and lambda-adjustment are correct
    verdict: upheld_scoped
    scoped_to: "Derived and checked numerically at (n,beta) = (8,4), (8,8), (16,8). Honest Comp has degree n-2 (< n). Each bracket has degree n-2 (< n-1), and (lambda0 + lambda1 x) lifts it to n-1 (< n). log2 n folds to a constant beta-value layer enforce < n, given the verifier's depth gate (766). lambda is drawn after the OOD values. lambda1 = 0 (probability at most 1.36/r) only lets a degree-n trace that equals a valid witness on H pass, so no false statement is accepted. cargo test is not_covered, and the depth gate itself is untested (S2N-2)."
    findings: [S2N-2, S2N-6]
  - claim: C-STARK-4
    text: the stated conjectured eps
    verdict: upheld_scoped
    scoped_to: "The arithmetic follows from the stated conjectural formula: 2^-240 (default), 2^-40 (fast), and eps_field <= 2^-217.6 < 2^-215 for k <= n and L <= 2^32. The 128-bit SHA-256 cap and the T-query factor are stated, and no security level is claimed (module docs and README:494). The formula is uncited to an exact conjecture, its field terms use the unique-decoding L/r form without list-size factors, and k is unbounded in code."
    findings: [S2N-8]
  - claim: C-STARK-5
    text: the negative tests exercise each check
    verdict: overclaimed
    scoped_to: "Tests pin the OOD canonicity, AIR-at-z, D vs layer 0, OOD binding, boundary binding (frozen heart), q binding, transcript-derived positions, the gamma2 and gamma3 terms, the degree adjustment, deep_offset and FRI-on-composition. They do not isolate FRI fold consistency (soundness-critical), the FRI depth / over-fold gate (soundness-critical), fri_pos == p, the composition opening/recompute pair, the gamma1 term, or AIR/n/beta binding. None of the tests was executed here (cargo blocked)."
    findings: [S2N-1, S2N-2, S2N-3, S2N-4, S2N-5]

