  - id: S1
    verdict: fixed
    reader: readers/stark.yaml
    why: 'Code-read at 669809d5c6; execution not_covered. Every cause S1 lists is addressed. v1 checks the transition
      at each queried row and its successor, and both boundary rows. v2 recomputes Comp(x) from the opened trace
      with alpha1, alpha2 and every boundary, checks the AIR at z, and runs FRI on the DEEP quotient over a beta
      >= 2 coset LDE. q and positions come from the verifier and the transcript in both modules, and the empty proof
      fails the length gate. All four original mutants have negative tests. Residual by design: v1 is a documented
      spot-check, not a STARK, which accepts a false statement with probability (1 - k/n)^q (6.9% for one bad row
      at n = 8, q = 20); carried under V1.'
  - id: S2
    verdict: fixed
    reader: readers/stark.yaml
    why: The (q/beta)^q formula is gone. The docs state a conjectured eps <~ rho^q 2^-g + eps_field + eps_hash,
      with rho = 1/beta, g = 0, k, r ~ 2^254.86, L <= 2^32 and the SHA-256 128-bit cap. No security level is claimed
      and no proven bound is stated. The arithmetic re-derives (K6); the residual nuance is S2N-8.
  - id: V1
    verdict: partially_fixed
    reader: readers/stark.yaml
    why: 'Fixed for stark_v2. statement_transcript absorbs the AIR fingerprint, n, beta, q, folds, final size and
      every (p_k, v_k) before the trace root and alpha1, and three frozen-heart negative tests have an attack control.
      Fixed for the three v1 defects: q is the verifier''s argument (lengths checked) and is absorbed, so a prefix
      fails; the fold count is fixed at log2 n; zero folds are rejected; layer 0 must be the trace root. Not fixed,
      by design: v1 grinding at a caller-chosen q. The verifier has no floor on q, and at q = 20, n = 8 a two-row
      forgery escapes with probability 0.0032 (about 315 attempts). This is now documented, sized by spot_check_queries
      and tested both ways, and v1 disclaims any research use.'
  - id: V2
    verdict: fixed
    reader: readers/stark.yaml
    why: 'No bit figure is claimed: the docs say ''no security level is claimed for this code'', and StarkConfig
      calls 8^-80 ''not a security level''. The 128-bit SHA-256 collision cap and the T-query Fiat-Shamir factor
      are stated. ''Proven bounds are about half'' was replaced by ''Proven ... bounds are weaker ...; this module
      does not state one''. The frozen-heart forgeries the bound ignored are closed (V1).'
  - id: V3
    verdict: fixed
    reader: readers/stark.yaml
    why: The v1 text now gives escape (1 - k/n)^q with a verifier-fixed q and catch probability 1 - (1 - 1/n)^q,
      which is at most 1. No 'q/n' remains. The last FRI root and final constant are absorbed (absorb_fri_final)
      and checked. Non-canonical v+r is rejected (canonical_bytes in leaf_ok/absorb_scalar), and 2^300 returns false.
      v2 has an OOD sample. README:494 marks both modules as 'educational, unaudited ... no stated security level;
      must not back a research claim'. Tests now cover frozen heart, wrong AIR, duplicated query and the v1 query
      count.
  - id: F-STARK-API (C7)
    verdict: fixed
    reader: readers/stark.yaml
    why: 1c784d902 (an ancestor of HEAD via merge f118a24b3) replaced the public transition closure with AffineTransition.
      Its fields are private (constructor new(previous, next, constant) only), and AirV2.transition has that type,
      so a non-polynomial or higher-degree transition cannot be represented. The fingerprint at (0,0), (1,0), (0,1)
      is then exact. The verifier never calls the remaining generate_trace closure, since check() uses only n, boundary
      and transition. v1's Air keeps a closure, but v1 evaluates it directly at queried rows and makes no degree
      assumption, so C7 does not apply there. quadratic_transition_is_outside_the_air_type only shows an affine
      map differs from prev*next at (1,1); the real guarantee is the type.
