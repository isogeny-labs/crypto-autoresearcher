    - S2N-6
    scoped_to: 'Derived and checked numerically at (n,beta) = (8,4), (8,8), (16,8). Honest Comp has degree n-2 (<
      n). Each bracket has degree n-2 (< n-1), and (lambda0 + lambda1 x) lifts it to n-1 (< n). log2 n folds to
      a constant beta-value layer enforce < n, given the verifier''s depth gate (766). lambda is drawn after the
      OOD values. lambda1 = 0 (probability at most 1.36/r) only lets a degree-n trace that equals a valid witness
      on H pass, so no false statement is accepted. cargo test is not_covered, and the depth gate itself is untested
      (S2N-2). cargo test --release --lib zk::stark not run: the session''s permission policy refused execution
      of code from the external crypto clone.'
