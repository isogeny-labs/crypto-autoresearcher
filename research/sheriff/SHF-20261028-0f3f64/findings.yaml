  findings:
  - id: S2N-1
    beat: B2
    severity: major
    reader: readers/stark.yaml
    what: The FRI fold-consistency check in fri_verify (next layer's eval == folded value; last fold == final_constant)
      has no negative test, in stark_v2 or stark v1, that would fail if it were deleted. Every v2 proof expected
      to fail FRI comes from the honest folding code, so its non-constant last layer is caught first by the final-layer
      root check. The check is soundness-critical. Without it, a prover could commit the true, non-low-degree D
      of a false statement as layer 0 (passing the Deep gate) and constant layers from layer 1 onward (passing the
      root check), and verify would accept. Reasoned from code; not executed (cargo blocked).
    evidence:
    - crypto:src/zk/stark.rs:576-594
    - crypto:src/zk/stark.rs:522-528
    - crypto:src/zk/stark_v2.rs:1338-1343
    - crypto:src/zk/stark_v2.rs:1442
    - crypto:src/zk/stark_v2.rs:1543
    - crypto:src/zk/stark_v2.rs:1556
    - crypto:src/zk/stark_v2.rs:1316
    fix: Add a negative test whose FRI commitment keeps the real layer 0 of the false statement 1 -> 12345 and replaces
      layers 1..log2 n with a constant table (Merkle roots recomputed, transcript re-derived). Assert Err(Reject::Fri),
      plus a control that its last root equals the constant-layer root. Add a second variant that changes one intermediate
      value with a re-committed root.
  - id: S2N-2
    beat: B2
    severity: major
    reader: readers/stark.yaml
    what: 'The verifier-fixed FRI depth (layer_roots.len() == log2 n + 1) is the only guard against over-folding.
      With final_size < beta (e.g. 1), FRI enforces no degree bound: any table folds to a single value, as the script
      control shows. The prover knob allows any power-of-two final size and the statement absorbs beta and log2
      n from the verifier''s config. So with line 766 deleted, a false statement proved with fri_final_size = 1
      would pass every other gate. No test exercises that direction. The tests that target the gate (popped root;
      final_size = 2*beta) are rejected for other reasons (transcript-moved positions; non-constant final layer).'
    evidence:
