notes: |
  Retrospective obligation for crypto's merged affine AIR API. The exact
  source comment and negative control are bound in the source note and input
  manifest. Build the actual named module and retain its seven type/axiom prints.
  A passing target does not prove Rust implementation/serialization correctness
