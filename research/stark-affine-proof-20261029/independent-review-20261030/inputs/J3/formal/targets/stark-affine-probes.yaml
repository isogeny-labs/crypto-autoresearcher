claim: |
  For every commutative ring R and every a,b,c,a',b',c' in R, define
  E(a,b,c,x,y)=a*x+b*y+c. If E(a,b,c,x,y)=E(a',b',c',x,y) at each of
  (x,y)=(0,0),(1,0),(0,1), then the two expressions agree for every x,y in R.
  This is an exact ring-valued expression claim, without field, characteristic,
  finiteness or nontriviality assumptions. It does not assert that serialized
  bytes or a hash are injective, or that the complete STARK is sound.
