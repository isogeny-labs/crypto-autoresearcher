<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <rect width="1100" height="680" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="35" y="42" font-size="27" font-weight="bold">AES research: instrument, candidates, independent evidence</text>
    <text x="35" y="72" font-size="16">17 October 2026 · blue: implemented lab · dashed orange: proposed extension · no scientific promotion</text>
    <g stroke="#2563eb" stroke-width="2" fill="#eff6ff">
      <rect x="35" y="110" width="310" height="145" rx="12"/>
      <rect x="395" y="110" width="310" height="145" rx="12"/>
      <rect x="755" y="110" width="310" height="145" rx="12"/>
    </g>
    <g font-size="17" font-weight="bold">
      <text x="55" y="141">Correct cipher and oracle</text>
      <text x="415" y="141">Candidate generation</text>
      <text x="775" y="141">Frozen independent test</text>
    </g>
    <g font-size="15">
      <text x="55" y="174">AES-128 / 192 / 256; explicit rounds</text>
      <text x="55" y="199">FIPS + OpenSSL; exact DDT/LAT/BCT</text>
      <text x="55" y="224">Consistent lazy random permutation</text>
      <text x="415" y="174">Bounded value-level beam proposals</text>
      <text x="415" y="199">Empirical byte / bit XOR projections</text>
      <text x="415" y="224">Model scores remain proposals</text>
      <text x="775" y="174">Fresh plaintexts and fixed new keys</text>
      <text x="775" y="199">Per-key counts; family correction</text>
      <text x="775" y="224">PRP null + hashes + immutable output</text>
    </g>
    <g stroke="#2563eb" stroke-width="3" fill="none">
      <path d="M345 180 H387 M377 173 L387 180 L377 187"/>
      <path d="M705 180 H747 M737 173 L747 180 L737 187"/>
    </g>
    <g stroke="#2563eb" stroke-width="2" fill="#eff6ff">
      <rect x="35" y="290" width="1030" height="100" rx="12"/>
    </g>
    <text x="55" y="321" font-size="18" font-weight="bold">Mechanism controls already implemented</text>
    <text x="55" y="349" font-size="16">Known integral + one-member mutant · inversion / affine ablations · key-schedule diagnostics · fixed-delta boomerangs</text>
    <text x="55" y="374" font-size="16">Key-disjoint dataset export provides fixtures; no learned model is trained in this release.</text>
    <g stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" fill="#fffbeb">
      <rect x="35" y="425" width="310" height="145" rx="12"/>
      <rect x="395" y="425" width="310" height="145" rx="12"/>
      <rect x="755" y="425" width="310" height="145" rx="12"/>
    </g>
    <g font-size="17" font-weight="bold">
      <text x="55" y="456">Exactness and feasibility</text>
      <text x="415" y="456">Multi-text structure</text>
      <text x="775" y="456">Search and full costs</text>
    </g>
    <g font-size="15">
      <text x="55" y="488">Complete toy hull enumeration</text>
      <text x="55" y="513">SAT witnesses / UNSAT certificates</text>
      <text x="55" y="538">Fixed-key plateau constraints</text>
      <text x="415" y="488">Joint related-difference quartets</text>
      <text x="415" y="513">Cross-ratio super-box matching</text>
      <text x="415" y="538">Conditional boomerang / DL switches</text>
      <text x="775" y="488">Native learned proposal ranker</text>
      <text x="775" y="513">DS-MitM / partial-sum accounting</text>
      <text x="775" y="538">External comparisons; GPU search</text>
    </g>
    <text x="35" y="616" font-size="16" font-weight="bold">Separate tracks: related-key / chosen-key · quantum models · leakage / faults · mode misuse</text>
    <text x="35" y="645" font-size="15">A component relationship, passing test, reduced-round result or merged PR is not a full-AES break.</text>
  </g>
