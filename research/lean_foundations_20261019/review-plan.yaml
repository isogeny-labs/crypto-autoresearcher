review_plan:
  claim_under_review: Exact algebraic foundation claims 1-6 in theory.md, at the source-map revisions,
    plus preservation of the documented rho state invariant. Machine counts are separate from semantic
    correspondence; no all-history, geometric-construction, C-refinement or performance claim.
  coordinator_prior: 'I authored these proofs and expect their scoped algebra to hold, but cannot supply
    an independent fidelity verdict. Main risks: a one-direction reachability claim, hidden cyclic embedding
    assumptions, mixed-sign and empty cases, composition order, denominator or coprimality omissions,
    state invariant substituted for C verification, and stale receipts after pin migration.'
  joints:
  - joint: J1-NCP-fidelity
    assigned_to: TASK-20261019-420d50
    attack_plan: Compare the full reachability iff, shortest construction, actual point action, canonical
      equivalence and companion kernel witnesses with the original note/frozen specs and new theory note.
      Attack B=0, d=0, mixed signs, invalid sign, chronological versus permutation order and n=2. Identify
      full-presentation/surjectivity clauses still unproved.
    breaking_artifact: A checked counterexample, exact source/type mismatch or reproduced false-success
      control, with a precisely supported narrower scope.
  - joint: J2-cyclic-rho-transport-fidelity
    assigned_to: TASK-20261019-f90afe
    attack_plan: Review canonical ZMod encoding, exact-order injectivity/image, actual walk invariant,
      both collision branches, explicit Bezout coefficient and consumer state preservation against exact
      source claims and rho.c. Attack annihilation without exact order, composite modulus, both zero denominators,
      noncoprime degree and vacuous assumptions. Distinguish the algebraic C model from a refinement proof.
    breaking_artifact: A checked counterexample, exact source/type mismatch or reproduced false-success
      control, with a precisely supported narrower scope.
  - joint: J3-pins-source-coverage-CI
    assigned_to: TASK-20261019-06b72f
    attack_plan: Check stable pins, shared dependency consistency, complete new source inclusion, exact
      named audits, CI scope producer repair and target floor 66. Trace formal and review-evidence skills
      to the existing entry points. Run relevant existing negative/positive controls; check fresh receipts
      locally when present. Do not attribute old workflow/receipt evidence to new pins or claim complete
      historical semantics.
    breaking_artifact: A checked counterexample, exact source/type mismatch or reproduced false-success
      control, with a precisely supported narrower scope.
  - joint: J4-blind-derivation
    assigned_to: TASK-20261019-08fc13
    attack_plan: Read only the isolated statement-only input and third-party dependencies; independently
      derive all five mathematical quantities and assumptions, with kernel-checked boundary controls.
      Read no producer proof, result, review plan, source map, sibling report or Git history.
    breaking_artifact: A checked counterexample, exact source/type mismatch or reproduced false-success
      control, with a precisely supported narrower scope.
