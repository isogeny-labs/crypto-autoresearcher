id: LEAD-ICE-descent-closure-degree-at-scale
family: ic-engine
title: >-
  Does the MutantXL/F4 closure (refutation) degree of descended S_3/S_4 chains stay at 4 as
  l and n grow?
mechanism: >-
  If the solving degree of the Weil-descended decomposition system stays constant (Semaev
  Assumption 1, Petit-Quisquater FFD), each PDP query is polynomial and binary IC becomes
  subexponential. Measured: closure degree 3-4 where XL needs 5-7, flat through (m,l) = (4,6)
  at N = 54, but the degree rises at l = 7 at m = 3. The surviving rule (degree rises at l
  = 7) sets the ECC2K-130 m = 4 price.
disposition: open_blocked
next_action:
  step: >-
    Run the frozen dreg_closure C1 cell (m = 3, n = 19, l = 7, degree 5) and A2/B1/B2 cells
    on a host with >= 250 GB RAM (or a sparse closure), then (m, l) = (4, 7); report closure
    degree on >= 4 unsatisfiable draws plus satisfiable controls.
  discriminates: >-
    Degree 4 at l = 7 for m = 4 restores the "4, constant" row (2^68.43, still +7.6 bits over
    rho); degree 5 confirms the +10.32-bit optimistic bracket; degree >= 6 shows the degree
    grows with l and the binary-descent route has no constant-degree regime, closing this
    lead as obstructed.
  blocked_by: >-
    memory (C1 capped at 169 GB of 184 GB; projection 217 GB) - research/dreg_closure_m4l6_20261018/RESULTS.md
best_measured: >-
  closure degree 4 through (m,l) = (4,6), N = 54; (3,7) degree-5 closure capped at 169 GB;
  ECC2K-130 m = 4 optimistic +10.32 bits over rho (+12.48 with K), derived
