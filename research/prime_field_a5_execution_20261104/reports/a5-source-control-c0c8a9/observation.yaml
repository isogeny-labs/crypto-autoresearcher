patterns: []
limitations:
- No new curve or target selection; conditional finite follow-up.
- Bounded t1..64nonmatches exclude only registered collisions.
- Source construction is aggregated acrossarms; Fp/Fr/group/logicalcosts overlap,
  no complete weightedS.
