schema: crypto.autoresearch.experiment_observation.v1
report_kind: run_observations
question: How do fixed public-source schedules change rank and natural target identifiability
  on unchanged A4 bases?
scope: Four already observed A4 curves over8191/65537, original16/14/32/31columns
  and32fixed public targets; three hash seeds, conditioned follow-up.
method:
  description: One supervised collector, shared pair/target tables; separate complete
    arithmetic oracle; analyze prefixes0/16/64 with relation-only and explicit-anchor
    scopes.
  command: /workspace/factor-base-venv/bin/python -B research/prime_field_a5_execution_20261104/supervise.py
    --protocol research/prime_field_a5_execution_20261104/protocol-v2.json --release
    research/prime_field_a5_execution_20261104/release.json --owner root-a5 --out
    research/prime_field_a5_execution_20261104/runs/a5-source-control-c0c8a9
  parameters:
    curves: 4
    source_schedules: 4
    sources_per_schedule: 64
    targets_per_curve: 8
    prefixes:
    - 0
    - 16
    - 64
    scopes:
    - relations
    - anchors
  seeds:
  - 0
  - 1
  - 2
  sampling_unit: Fixed curve/schedule/prefix/scope; targets reused across schedules.
  stopping_rule: Complete all96scope records; no rank/recovery stop; fixed protective
    refusal gates.
