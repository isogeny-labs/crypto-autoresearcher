schema: crypto.autoresearch.experiment_observation.v1
report_kind: reanalysis
question: Which polynomial inputs can the sampler reach, how often are they reused, and what varies
  within an identical input?
scope: Archived G3 rows and exact bounded coefficient/cubic-prime arithmetic; no new point search
  or independent scientific review.
method:
  description: Group saved rows, enumerate coefficient support and evaluate all eight cubic patterns
    at k=4..12 by trial division. Seeds below are archived source seeds, not fresh replicas.
  command: python3 research/snfs_sampler_variation_20261018/analyze.py --out research/snfs_sampler_variation_20261018/data
  parameters:
    kmin: 4
    kmax: 12
    minimum_prime: 4096
    source_work_ladder:
    - 300
    - 1000
    - 3000
    - 10000
    - 30000
    - 100000
  seeds:
  - 1
  - 2
  - 3
  sampling_unit: Accepted field draws, curve rows and incidental fixed-input seed pairs; kept distinct.
  stopping_rule: All 1,395 saved rows; four coefficient supports; 72 cubic evaluations; no new random
    samples.
