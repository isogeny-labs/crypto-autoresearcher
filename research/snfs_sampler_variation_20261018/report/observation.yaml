controls:
- id: cubic-reference
  description: Exact cubic rational-root/prime reference
  observation_ids:
  - support
  matching: Same coefficient constraints, k range and minimum prime as source; every eligible cubic
    is also accepted in saved rows.
  limitations:
  - The source modular irreducibility test is not replayed; higher degrees have only pre-filter counts
    here.
- id: paired-inputs
  description: Seeds 1 and 3 at an identical algebraic input
  observation_ids:
  - trajectories
  matching: Same g,p,root,A,B, auxiliary-prime list and torsion bound within each group.
  limitations:
  - Incidental overlaps; two seeds each; sample-point lists capped at eight; final counts do not identify
    full point sets.
patterns:
- id: cubic-occupancy
  kind: exploratory_pattern
  description: Each 20-draw cubic stratum revisits exactly the five admissible coefficient patterns.
  observation_ids:
  - draws
  reference_ids:
  - cubic-reference
  uncertainty: Descriptive finite support and three saved strata, without a sampler uniformity test.
  alternative_explanations:
  - The small admissible support and replacement sampling explain why repeated fields can occur; rejected
    draws were not recorded.
- id: trajectory-prefix
  kind: exploratory_pattern
  description: Two paired trajectories differ at W=3,000 despite equal final counts and identical
    capped sample lists.
  observation_ids:
  - trajectories
  reference_ids:
  - paired-inputs
  uncertainty: Four matched inputs and two seeds each; no estimate beyond these saved paths.
  alternative_explanations:
  - Seed-dependent enumeration order can change intermediate discoveries even when later counts agree.
  - The eight-point reporting cap can hide later differences in the saved sample lists.
limitations:
- Original run status and row weighting are preserved.
- Row grouping uses literal coefficients, not field-isomorphism classes.
- 'No fresh fixed-input replicas ran: the current CLI couples generation and search seeds.'
- No scientific interpretation, relevance or usefulness verdict is recorded.
missing:
- field: /observations/0/value/1/admissible_support_count
  reason: Higher-degree admissible support was not classified.
- field: /observations/0/value/2/admissible_support_count
  reason: Higher-degree admissible support was not classified.
- field: /observations/0/value/3/admissible_support_count
  reason: Higher-degree admissible support was not classified.
- field: /observations/4/sample
  reason: 'Not applicable: literal process receipt fields.'
next_checks:
- question: What changes under fresh search seeds when all algebraic inputs are fixed?
  method: Prepare a versioned fixed-input replay interface; freeze separate input and search-seed
    records and retain full per-rung traces.
  control: Same explicit inputs and work ladder; compare coupled and per-input seed schedules without
    overwriting old outputs.
  status: proposed
