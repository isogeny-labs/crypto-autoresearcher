# EXPERIMENT CONTRACT -- EXP-QLWE-acfe75 (review_required, unapproved, zero runs).
experiment:
  id: EXP-QLWE-acfe75
  hypothesis_id: H-QLWE-d979e8
  derived_from_idea: IDEA-20261018-0e1671
  question_id: RQ-QLWE-9108dc
  goal_id: GOAL-QLWE-291164
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Measured error growth through RLWE halvings
  objective: How tight the proven self-reduction bound is and where the chain lands
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath, NumPy
    parameters: n=256 -> 128 -> 64 -> 32; q=3329 -> q^2 ...; sigma=1.0; 2000 samples per step
    procedure: >-
      1. Generate RLWE with known s. 2. Apply halving. 3. Measure error. 4. Compare bound.
      5. Compute gamma. 6. Controls.
  controls:
  - >-
    null/negative: plain LWE dimension halving by coordinate projection (structure-free),
    which increases error trivially
  - >-
    positive: noise-free RLWE (sigma=0) through the chain: measured growth must equal the
    rounding term exactly
  - 'A/A: two sample seed blocks'
  independent_variables:
  - reduction
  - halvings
  metrics:
    primary:
    - measured/bound ratio
    secondary:
    - gamma gap bits
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: ratio
    formula: <= 0.25
    source: worst-case slack typical of such reductions
  scale_relevance:
    tier: toy
    justification: 'n <= 256; transfer: measured slack is a property of the reduction''s algebra'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 18
  stopping_rules:
  - stop after 3 halvings
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - positive-control mismatch invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 and C2 show ratio <= 0.25 per step and gap >= 10 bits (P1, P2), AA1
    noise floor
  falsification_criterion: C2 shows ratio >= 0.8 or gap < 3 bits (P1 or P2 falsified)
  decision_impact:
    on_positive: >-
      Record the measured landed regime as a named obstruction boundary for dimension-reduction
      routes
    on_negative: >-
      Dimension-reduction routes stay open; open a proposal pricing the landed instance against
      ideal-lattice quantum methods
  variable_ledger:
    independent:
    - name: reduction
      levels:
      - ad_self_reduction
      - plain_projection_null
    - name: halvings
      levels:
      - '1'
      - '2'
      - '3'
    factors:
    - name: sample_seed_block
      treatment: randomized
      value: 2 blocks
      how: rng
    - name: error_sigma
      treatment: fixed
      value: '1.0'
      how: frozen
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - ad_self_reduction
      - plain_projection_null
      differs_in:
      - reduction
      design: one_factor
    - id: C2
      arms:
      - ad_self_reduction 3 halvings
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - block A
      - block B
      differs_in:
      - sample_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-0e1671.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-0e1671.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
