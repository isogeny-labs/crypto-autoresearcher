# EXPERIMENT CONTRACT -- EXP-MLKEM-da8d4a (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-da8d4a
  hypothesis_id: H-MLKEM-8f275b
  derived_from_idea: IDEA-20261018-ff5892
  question_id: RQ-MLKEM-003
  goal_id: null
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: KEM-to-DSA residual transfer
  objective: Whether estimator corrections can be shared across the two schemes
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: fpylll progressive BKZ, lattice-estimator pinned commit, NumPy
    parameters: dims {100,120,140,160,180}; 20 instances per dim per shape
    procedure: 1. Generate. 2. Measure success beta. 3. Fit on KEM. 4. Predict DSA. 5. Controls.
  controls:
  - 'null/negative: predict DSA with no correction (raw estimator)'
  - 'positive: refit on DSA itself (in-shape) must give MAE <= 1.5'
  - 'A/A: two instance seed blocks on KEM fit'
  independent_variables:
  - correction_source
  - dimension
  metrics:
    primary:
    - holdout MAE
    secondary:
    - in-shape MAE
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: holdout MAE
    formula: <= 2
    source: residual driven by profile, not q
  scale_relevance:
    tier: medium
    justification: dims <= 180
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 100
    maximum_memory_gb: 32
    maximum_runs: 30
  stopping_rules:
  - stop dims where success beta > 65
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - A/A fit difference > 1 invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C2 holdout MAE <= 2 and C1 improves over raw (P1, P2), AA1 noise floor
  falsification_criterion: C2 holdout MAE >= 5 (P1 falsified)
  decision_impact:
    on_positive: One residual correction used for both ML-KEM and ML-DSA estimates
    on_negative: Residual corrections recorded as shape-specific; each scheme calibrates separately
  variable_ledger:
    independent:
    - name: correction_source
      levels:
      - kem_fit
      - none_raw
      - dsa_in_shape
    - name: dimension
      levels:
      - '100'
      - '120'
      - '140'
      - '160'
      - '180'
    factors:
    - name: instance_seed_block
      treatment: randomized
      value: 2 blocks of 10
      how: rng
    - name: estimator_commit
      treatment: fixed
      value: pinned
      how: hash recorded
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - kem_fit
      - none_raw
      differs_in:
      - correction_source
      design: one_factor
    - id: C2
      arms:
      - kem_fit holdout MAE
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - kem block A
      - kem block B
      differs_in:
      - instance_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-ff5892.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-ff5892.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
  - raw-result.json (per-trial records)
  - success_beta.csv
  - fit.json
  - report.pdf
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLKEM-da8d4a/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-ff5892.
    - >-
      RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open
      goal serves this question. The Coordinator must open a successor goal or rebind before
      dispatch.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
  goal_id_note: >-
    RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open goal
    serves this question. The Coordinator must open a successor goal or rebind before dispatch.
