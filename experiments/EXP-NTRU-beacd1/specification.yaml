      1. Generate. 2. Run both reducers with same schedule. 3. Record work and profile per
      tour. 4. Detect event. 5. Certify recovery.
  controls:
  - 'null: random symplectic lattice of matched determinant without dense sublattice'
  - 'positive: overstretched q where event is certain'
  - 'A/A: plain BKZ on two seed blocks'
  independent_variables:
  - reducer_arm
  - lattice_dimension
  metrics:
