protocol_amendment:
  experiment_id: EXP-ICPERF-b2f2d0
  amendment_id: AMD-20261029-v2
  recorded_at: '2026-10-29'
  recorded_by_task: TASK-20261029-038368
  opened_by_decision: DEC-20261029-22e05b
  version_from: 1
  version_to: 2
