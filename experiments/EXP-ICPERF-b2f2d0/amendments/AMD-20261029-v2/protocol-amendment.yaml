  successor_specification: experiments/EXP-ICPERF-283a70/specification.yaml
  successor_runbook_session: RBS-ICPERF-67df7d
  link_convention: >-
    The successor names this experiment in predecessor_experiment_id and
    supersedes (the repository's successor convention). This amendment
    directory is the predecessor's forward link; the version-1 specification
    is not edited.
  reason: >-
    Version 1 cannot proceed unchanged. Its only run, RUN-ICPERF-b09be8, is
    invalid_output because run.py writes a 9-line manifest that fails
    check_run and emits no attack_claimed, so the current supervisor would
    refuse an unchanged rerun (F2). The runbook encodes neither criterion, has
    no controls and summarises two of five primary metrics (F3). The bands do
    not discriminate (F4). The recurrence is stated only in code (F5).
    docs/runbook-execution.md requires an amended runbook with a new session
    id and a new approval.
  changes:
    - id: CH-1
      finding: F2
      text: >-
        New run.py writes the complete run envelope itself (it passes
        check_run as written; complete_manifest returns unchanged) and writes
        attack_claimed false in raw-result.json and manifest.yaml.
    - id: CH-2
      finding: F3
      text: >-
        New runbook (session RBS-ICPERF-67df7d) asserts sample_sum 2943,
        sum_squares 289567, median 28, median_split false and exact_match
        true, summarises all five primary metrics, exact_match and
        elapsed_seconds, and binds every input as spec_bindings, the bands
        included.
    - id: CH-3
      finding: F4
      text: >-
        The decisive test is the exact match with the three preregistered
        integers. The band flags are descriptive fields (DESC-1, DESC-2), with
        a runbook counterpart that checks their exact inputs. Two planted
        negative controls must fail the exact match: shift triple (1, 2, 14)
        (CTL-1, gives 2938 / 290138 / 29 and passes both bands) and the
        support-{0, 1, ...} reading (CTL-2, gives 2879 / 283745 / 27).
    - id: CH-4
      finding: F5
      text: >-
        The recurrence is stated as a definition: xorshift32 left 13, right 17,
        left 5, mod 2^32, step then test, support {1, 2, ...}, each draw
        continuing from the previous stop, the seed never tested. The
        Marsaglia (2003) attribution is recalled provenance, a pointer only.
    - id: CH-5
      text: >-
        The replay interpreter is recorded: each unit writes /interpreter, the
        session records the launching interpreter in S01, and replay compares
        integers and booleans only. No minor-version pin.
    - id: CH-6
      text: >-
        Budget maximum_runs rises from 1 to 3, one run per trial, because the
        controls are now trials. The success and falsification criteria and
        the preregistered prediction are version 1's, verbatim.
