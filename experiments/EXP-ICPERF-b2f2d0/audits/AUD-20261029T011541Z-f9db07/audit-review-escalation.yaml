    - id: 3
      sweep_claim: >-
        Specification-fidelity gaps: no runbook counterpart for the preregistered prediction
        (2943/289567/28), controls: [] against two spec controls, spec metrics not summarised.
      finding: confirmed
      evidence:
        - >-
          No runbook assertion, metric or replay compares any field with 2943, 289567 or 28.
          The only checks on sample_sum and cv_in_band are type checks (integer and boolean).
          Replay mode "fields" compares a re-run against the first run, not against the frozen
          integers. Under this runbook, even a valid unit would not record success or
          falsification by itself.
        - >-
          runbook.yaml S02 has controls: []. The two specification controls (CV^2 band
          [0.81,1.21] against population sqrt(1-1/50); median/mean band [0.6,0.8] against ln 2)
          exist only as run.py output fields (cv_in_band, median_ratio_in_band), computed on the
          same sample.
        - >-
          runbook metrics summarise only sample_sum (min,max) and cv_in_band (fraction_true).
          sum_squares, median and median_ratio_in_band appear only in replay compare, and the
          secondary metric elapsed_seconds appears nowhere. spec_bindings pin seed, p_den and
          n_targets but not cv_band or median_ratio_band.
      added:
        - >-
          Encoding the bands as runbook controls would not have helped, because the bands have
          no discriminating power (finding F4, control_discrimination below). Their outcome on
          seed 20261017 was known before freeze, since preregistered_prediction.source says the
          integers were evaluated by run.py in a design-time directory. The only check that
          discriminates is reproduction of the exact integers, and that is the one the runbook
          does not encode.
    - id: 4
      sweep_claim: >-
        The blind re-derivation matches only under an unstated shift triple (13,17,5) and
        continue-state reading, chosen knowing the target.
      finding: partly
      evidence:
        - >-
          Refuted in part. The spec text excludes the sweep's alternative (variant B, restart
          from the seed each draw) without reference to the target: "64 independent geometric
          counts" rules out 64 identical draws (448/3136/7, CV 0). The trial-count convention
          is also pinned by the text: "Sixty-four draws at mean 50" and the control's
          population value sqrt(1 - 1/50) hold only for support {1,2,...}. Support {0,1,...}
          gives mean 49 and CV 1/sqrt(1-p). So the A-versus-B choice was not target-informed,
          and the sweep's statement that the spec does not say whether the count includes the
          stopping draw is incorrect.
        - >-
          Confirmed in part. The shift triple is not in the spec text. The spec defers the
          sampler to the runner (inputs.runner; H-ICPERF-5adc9b assumption "The xorshift32
          recurrence in the runner is the whole sampler"). (13,17,5) is the conventional
          xorshift32 triple, but my provenance for that is recalled (Marsaglia, "Xorshift RNGs",
          J. Stat. Softw. 8(14), 2003), not retrieved. No in-repo source outside the producer
          defines it.
        - >-
          New underdetermination the sweep missed: the spec does not say whether the seed itself
          is a tested state. Under (13,17,5), with the seed tested first and the stream advanced
          past each stop, the sample is 2944 / 289582 / 28 with both bands true. No non-numeric
          spec constraint excludes this reading. Of the 12 readings enumerated, exactly two are
          admissible on spec text alone, and they differ in two of the three frozen integers.
        - >-
          The risk of a target-informed match is bounded. Under the step-then-test reading, only
          (13,17,5) among 21,207 non-degenerate left/right/left triples in [1,31]^3 reproduces
          (2943, 289567, 28) jointly (sample_sum alone collides for 20 triples). With at most
          two admissible orderings and the conventional triple, a chance three-integer match is
          implausible. The match identifies the runner's convention; it is not a fit with free
          parameters.
      underdetermination_verdict: >-
        Yes, the spec underdetermines the derivation in text, on two points: the shift triple,
        and whether the seed is a tested state. The conventional xorshift32 definition (outputs
        are post-update states, shifts 13/17/5) resolves both and is the reading run.py uses
        (lines 19-38, read after the derivation). Neither the restart question nor the count
        convention is open. A future amendment should state the recurrence and the ordering
        in the specification.
    - id: 5
      sweep_claim: tracked_dirty true in preflight is unexplained.
      finding: confirmed
      evidence:
        - >-
          Run-era tools/runbook.py (blob sha256 52c41d4e, equal to preflight tool_sha256) sets
          tracked_dirty from a non-empty `git status --porcelain --untracked-files=no`, so a
          tracked file was modified or staged at 14:26:37Z. The paths are not recorded anywhere.
        - >-
          Two explanations are ruled out. (a) The sibling session's writes: RBS-ICPERF-b7e41c was
          not tracked at preflight HEAD 39d6edf631 (git ls-tree). (b) goal_lanes publishing:
          run-era goal_lanes.publish uses a path-limited `git commit -- <paths>`. The sibling
          also started dirty (14:26:19Z, HEAD 6e27b5ac8e), so the modification predates both
          sessions.
        - >-
          The impact is bounded but not excluded. The four bound inputs were hash-checked at
          session start and still match (specification 36e31929, trial-plan 07799d51, run.py
          e7e91ca0, check.py 43ecb697, runbook 940b980a). tools/runbook.py equals its committed
          blob. Every recorded behaviour of the unbound tools is accounted for by their
          committed run-era versions: the schema verdict string, exit 3 with JSON on stdout, and
          an empty stderr. The working-tree bytes of tools/experiment_execution.py, goal_lanes.py
          and validate_ledger.py at run time are unrecorded.
        - >-
          preflight.commit 39d6edf631 is the sibling's release commit, made 5 s before this
          session started. authority.commit 4d49d3ef94 is this session's claim commit, a child
          of 39d6edf631 that adds only the claim file. Both are on main.

