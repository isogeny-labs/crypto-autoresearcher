      sweep_claim: The runbook's validity assertions and check.py cannot catch this.
      finding: confirmed
      evidence:
        - >-
          runbook.yaml S02-trials validity: both the files block and the by_trial block assert
          only raw-result.json. That is why journal seq 4 carries two validity entries, both
          "raw-result.json passed: true", next to valid false. No assertion of any kind names
          manifest.yaml.
        - >-
          check.py tests manifest.yaml only for existence and by substring: "RUN-ICPERF-b09be8"
          and "EXP-ICPERF-b2f2d0" must occur in its text (lines 48-50). It invokes no schema
          check.
      corrections:
        - >-
          The sweep understated check.py. Besides file existence and run naming, it checks
          raw-result.json schema, experiment_id, trial_id, seed, p_den and n_targets for
          equality, checks that all nine REQUIRED keys are present, and checks that RESULTS.md
