  blind_rederivation:
    primary_metric: >-
      All five primary fields (sample_sum, sum_squares, median, cv_in_band,
      median_ratio_in_band), computed from one sample.
    script: experiments/EXP-ICPERF-b2f2d0/audits/AUD-20261029T011541Z-f9db07/scripts/escalation/rederive_from_spec.py
    script_sha256: e9c045fea4d1122be90096a798a480aeff6450e606095c23c1c5d4e199ffad17
    commands:
      - python3 -I <script> experiments/EXP-ICPERF-b2f2d0/runs/RUN-ICPERF-b09be8/raw-result.json 1   # parts 1 and 4
      - python3 -I <script> - 2 3   # parts 2 and 3, about 3.5 min CPU
    method: >-
      I enumerated 12 readings of the sampler sentence under (13,17,5): test order
      {step-then-test, test-then-step, test-then-step with advance past the stop} x count
      {trials, failures} x stream {continue, restart}. Each reading was filtered by
      non-numeric spec text only: "independent", "mean 50", the population CV value
      sqrt(1-1/50), and stop states not re-tested. The frozen integers were not used to
      filter. CV^2 = (nQ - S^2)/S^2 and median ratio = median*n/S, in exact rationals,
      exactly as the spec formula states.
    results:
      admissible_readings:
        step_then_test_trials_continue: {sample_sum: 2943, sum_squares: 289567, median: 28, median_split: false, cv_in_band: true, median_ratio_in_band: true}
        test_then_step_advance_trials_continue: {sample_sum: 2944, sum_squares: 289582, median: 28, median_split: false, cv_in_band: true, median_ratio_in_band: true}
      excluded_readings_examples:
        restart_from_seed (sweep variant B): {sample_sum: 448, sum_squares: 3136, median: 7, excluded_by: "independent (64 identical draws)"}
        failures_count_continue: {sample_sum: 2879, sum_squares: 283745, median: 27, cv_in_band: true, median_ratio_in_band: true, excluded_by: "mean 50 / population CV sqrt(1-1/50)"}
        test_then_step_continue: {sample_sum: 71, excluded_by: "stop state re-tested; draws 2..64 trivial"}
      producer_raw_result: {sample_sum: 2943, sum_squares: 289567, median: 28, cv_in_band: true, median_ratio_in_band: true}
      specification_prediction: {sample_sum: 2943, sum_squares: 289567, median: 28, cv_in_band: true, median_ratio_in_band: true}
      session_summary: >-
        sample_sum min/max null and cv_in_band fraction_true null, n 0, with the unit excluded
        as invalid. There is no summary value to compare against.
      comparison: >-
        The conventional reading (step-then-test, trials, continue) equals raw-result.json and
        the specification in all five fields. The other admissible reading differs from both
        in sample_sum and sum_squares.
    triple_sweep:
      family: "x ^= x<<a; x ^= x>>b; x ^= x<<c (mod 2^32), (a,b,c) in [1,31]^3, step-then-test, trials, continue"
      triples_total: 29791
      nondegenerate: 21207
      reproducing_2943_289567_28: 1
      reproducing_triple: [13, 17, 5]
      sample_sum_2943_only: 20
      distinct_sample_sums: 3557
    caveats:
      - >-
        Agreement identifies the runner's convention. It does not independently confirm a
        prediction, because the specification's integers were produced by run.py at design
        time (preregistered_prediction.source).
      - >-
        The sweep script's variant B is not a competing reading of the specification, and its
        "count includes the stopping draw" choice is pinned by the specification. Its
        underspecification_found therefore overstates the open choices in two places and
        misses the seed-tested ambiguity.

  control_discrimination:
    note: >-
      This is a null-object check of the specification's two band controls (inventor protocol
      section 3 style). It is computed under the audit directory and is not a trial: the
      sampler is not re-run as an instrument cell and no seed of the experiment is opened.
    wrong_sampler_null:
      object: "21,207 non-degenerate alternative xorshift triples, same reading"
      both_bands_pass: 6635
      fraction: 0.3129
    correct_sampler_other_seeds:
      object: "(13,17,5), same reading, seeds 1..2000"
      cv_band_pass: 0.609
      median_ratio_band_pass: 0.744
      both_bands_pass: 0.4815
      median_split: 0.736
      both_bands_and_no_split: 0.1195
    population_reference: {cv: 0.98995, cv2: 0.98, median_trials_support: 35, ln2: 0.693147}
    frozen_seed_values: {cv2: 1.13968, median_ratio: 0.60890}
    reading: >-
      The bands accept about a third of wrong samplers and reject about half of correct
      samples, so at n = 64 they cannot act as positive or negative controls of the sampler.
      The frozen seed's median ratio, 0.609, sits just inside the lower edge, 0.6. Seed 20261017
      is one of the roughly 12% of seeds where both bands hold and the median does not split,
      and this was known at freeze. What the specification lacks, and what a quantity that
      ought to decay would show, is any scaling: for example, band acceptance under the null
      as n grows. The specification does not address this.

