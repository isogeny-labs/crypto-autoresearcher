    - id: F3
      severity: moderate
      what: >-
        The runbook does not encode the success or falsification criterion (2943/289567/28 and
        both flags), has controls: [], summarises only 2 of 5 primary metrics, and omits
        elapsed_seconds.
    - id: F4
      severity: moderate
      what: >-
        The specification's band "controls" have no discriminating power, and their outcome on
        the frozen seed was known before freeze. Wrong xorshift triples pass both bands at
        31.3%, and so does the support-{0,...} reading. The correct sampler passes both bands
        on only 48.2% of seeds 1..2000, and passes both bands with no median split on only
        11.95%. A pass therefore says nothing about geometric shape. Only the exact-integer
        reproduction discriminates. This is a limit of the specification design, not a defect
        of the session.
    - id: F5
      severity: minor
      what: >-
        The specification underdetermines the sampler in text: the shift triple is unstated,
        and so is whether the seed is a tested state. A reading the spec admits yields
        2944/289582/28. The conventional definition resolves both and matches uniquely.
    - id: F6
      severity: minor
      what: >-
        preflight tracked_dirty true is unexplained and its paths are unrecorded. The impact is
