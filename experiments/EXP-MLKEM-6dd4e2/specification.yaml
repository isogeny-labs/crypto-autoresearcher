# EXPERIMENT CONTRACT -- EXP-MLKEM-6dd4e2 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-6dd4e2
  hypothesis_id: H-MLKEM-ebbb45
  derived_from_idea: IDEA-20261018-da2ffa
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Primal beta* with appended known-plaintext ciphertext rows
  objective: Close (or open) the known-plaintext-sample flank with a measurement.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath, G6K/fpylll, reference ML-KEM (parameterized)
    parameters: n=64, k=2, q=3329, CBD(2), d_u=10, d_v=4; ciphertext count in {0,1,4,16};
      20 keys
    procedure: >-
      1) Freeze. 2) Generate ciphertexts with known m. 3) Build weighted embeddings. 4) Reduce
      to verified recovery. 5) Compare beta*.
  controls:
  - 'null: rows from ciphertexts with WRONG plaintexts (noise uniform) - beta must not drop'
  - >-
    positive: rows from a variant with d_v=12, no rounding and eta2=1, where noise is small
    and beta must drop measurably
  - 'A/A: zero-row arm with two seed blocks'
  independent_variables:
  - ciphertext_rows
  - row_source
  metrics:
    primary:
    - beta*
    secondary:
    - derived-sample noise std
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: beta* drop at 16 rows
    formula: estimator with mixed-noise samples
    source: derived before data
  scale_relevance:
    tier: toy
    justification: >-
      reduced ML-KEM shape: ring Z_3329[X]/(X^n+1) with n in {32,64}, module rank k=2, CBD(eta)
      secrets/errors; transfer assumption: the measured ratio (not the absolute cost) carries
      to n=256 when the governing statistic scales as stated; no FIPS 203 claim is made
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    - 2026101810
    - 2026101811
    - 2026101812
    - 2026101813
    - 2026101814
    - 2026101815
    - 2026101816
    - 2026101817
    - 2026101818
    - 2026101819
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 30
    maximum_memory_gb: 16
    maximum_runs: 240
  stopping_rules:
  - censor at beta=110
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C1 drop < 1 with CI upper bound < 3 (P1), C2 shows the positive variant dropping, P2 noise
    within range; beyond AA1 noise floor.
  falsification_criterion: C1 drop >= 3 with CI excluding 0.
  decision_impact:
    on_positive: >-
      Register as a control: known-plaintext traffic does not help primal key recovery; cite
      in any traffic-based claim.
    on_negative: Open a known-plaintext flank lane and price it at FIPS parameters.
  variable_ledger:
    independent:
    - name: ciphertext_rows
      levels:
      - '0'
      - '1'
      - '4'
      - '16'
    - name: row_source
      levels:
      - true_plaintext
      - wrong_plaintext_null
      - lownoise_variant_positive
    factors:
    - name: reduction_seed_block
      treatment: randomized
      value: A,B
      how: basis randomization
    - name: key_seed
      treatment: randomized
      value: '20'
      how: paired
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - ciphertext_rows=16
      - ciphertext_rows=0
      differs_in:
      - ciphertext_rows
      design: one_factor
    - id: C2
      arms:
      - true_plaintext
      - lownoise_variant_positive
      differs_in:
      - row_source
      design: one_factor
    - id: AA1
      arms:
      - rows=0 block A
      - rows=0 block B
      differs_in:
      - reduction_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-da2ffa.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-da2ffa.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with frozen protocol hash, tool versions (fpylll/G6K/Sage commit ids), host
    and seeds
  - raw-result.json with one row per (arm, instance, seed) including verification flag
  - analysis.json with effect sizes, bootstrap CIs and the AA noise floor
  - report.md plus graph (SVG/PNG) and PDF per the research-visuals skill
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
