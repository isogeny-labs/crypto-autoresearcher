# EXPERIMENT CONTRACT -- EXP-QLWE-e4d829 (review_required, unapproved, zero runs).
experiment:
  id: EXP-QLWE-e4d829
  hypothesis_id: H-QLWE-3cc070
  derived_from_idea: IDEA-20261018-6959bf
  question_id: RQ-QLWE-d2d713
  goal_id: GOAL-QLWE-291164
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Exact eDCP Fourier MI
  objective: How much more information an extrapolated sample carries
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Python/NumPy, mpmath
    parameters: log N in {8,12,16}; M in {1,2,4,16,64,256,N}; profiles uniform, Gaussian
    procedure: 1. Compute amplitudes. 2. FFT per s. 3. MI. 4. Controls.
  controls:
  - 'null/negative: M=1 (no coset structure): MI must be 0'
  - 'positive: M=N with uniform profile (Fourier sampling reveals s fully): MI near log N'
  - 'A/A: two numerical precisions (float64 vs mpmath 50 digits) on M=16'
  independent_variables:
  - extrapolation_width_M
  - profile
  metrics:
    primary:
    - MI gain over DCP
    secondary:
    - slope in log M
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: gain at M=16
    formula: '>= 3 bits'
    source: log M scaling of Fourier support
  scale_relevance:
    tier: toy
    justification: 'N <= 2^16; transfer: MI as function of M/N'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 30
  stopping_rules:
  - stop after grid
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - A/A difference > 1e-6 bits invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 gain >= 3 bits (P1) and C2 slope >= 0.8 (P2), AA1 noise floor
  falsification_criterion: C1 gain < 1 bit or C2 slope <= 0.3
  decision_impact:
    on_positive: Record eDCP sample-information advantage; motivates eDCP-specific sieve design
      in Lane 3
    on_negative: >-
      Record that extrapolation adds little information; eDCP route reduces to DCP sample
      complexity
  variable_ledger:
    independent:
    - name: extrapolation_width_M
      levels:
      - '1'
      - '2'
      - '16'
      - '64'
      - '256'
      - N
    - name: profile
      levels:
      - uniform
      - gaussian
    factors:
    - name: numeric_precision
      treatment: crossed
      value: float64 or mpmath50
      how: both on M=16
    - name: log_N
      treatment: fixed
      value: 8,12,16 reported separately
      how: per cell
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - M=16
      - M=2
      differs_in:
      - extrapolation_width_M
      design: one_factor
    - id: C2
      arms:
      - gaussian profile slope
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - float64
      - mpmath50
      differs_in:
      - numeric_precision
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-6959bf.yaml
    written_at: '2026-10-18'
    data_seen: []
