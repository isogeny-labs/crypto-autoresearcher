  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 50
    maximum_memory_gb: 8
    maximum_runs: 96
  stopping_rules:
  - stop when CIs < 0.1
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - uncertified recovery excluded
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 shows P1 and P2 beyond the AA1 noise floor.
  falsification_criterion: C1 shows no drop and residual matches random uSVP.
  decision_impact:
    on_positive: Design a guess-then-DSD composite and measure its full cost.
    on_negative: Treat hybrid and DSD as non-composable.
  variable_ledger:
