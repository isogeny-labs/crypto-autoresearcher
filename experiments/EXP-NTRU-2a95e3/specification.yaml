  title: Residual density after oracle guessing
  objective: Decide whether guessing preserves the dense sublattice.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath, fpylll, detector
    parameters: >-
      n in {48, 64, 80}; k in {0, n/16, n/8, n/4}; positions contiguous/scattered; q grid;
      20 instances
    procedure: >-
      1. Generate. 2. Project with oracle guesses. 3. Sweep q. 4. Detect event and certify.
      5. Fit q*(k).
  controls:
  - 'null: random uSVP of same dimension and gap'
  - 'positive: unprojected overstretched NTRU'
  - 'A/A: k = 0 on two seed blocks'
  independent_variables:
  - guess_count_k
  - guess_pattern
  metrics:
    primary:
    - log2 q*(k)
    secondary:
    - surviving rotations
    - event presence rate
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: relative drop at k=n/8
    formula: '>= 5%'
    source: surviving-orbit argument
  scale_relevance:
    tier: toy
    justification: n <= 80
    correspondence: null
  tail_checks: []
  replication:
