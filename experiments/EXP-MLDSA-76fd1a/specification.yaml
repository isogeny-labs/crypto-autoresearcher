# EXPERIMENT CONTRACT -- EXP-MLDSA-76fd1a (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-76fd1a
  hypothesis_id: H-MLDSA-61fc94
  derived_from_idea: IDEA-20261018-f27cb2
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Edge-inequality vs regression on leaked rejected transcripts
  objective: >-
    how much faster the edge-inequality solver is than ILWE regression on the same leak, and
    whether accepted signatures leak nothing
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python/NumPy, SciPy HiGHS LP, fpylll/G6K; toyDSA(n,k,l): a NumPy re-implementation of
      FIPS 204 Algorithms 1-8 with the ring degree n as a parameter (q = 8380417, d = 13,
      eta, tau, gamma1, gamma2, beta = tau*eta, omega as in ML-DSA-44 unless stated), cross-checked
      against the PQClean ML-DSA-44 reference at n = 256 on 1000 KAT vectors before any reduced
      run
    parameters: >-
      toyDSA(n,2,2) n in {32,64,96}, gamma1 = 2^12, eta = 2, tau = 16; up to 2^22 rejected
      attempts per key; 5 keys per seed block
    procedure: >-
      1) KAT check. 2) Run signer, log rejected attempts. 3) Solver A least squares on doubling
      prefix grid. 4) Solver B LP feasibility on edge coordinates, then BKZ on residual box.
      5) Certify.
  controls:
  - 'null: accepted signatures only, identical counts'
  - 'positive: leaked y alongside z, giving exact c s1 per attempt'
  - 'A/A: solver B on two seed blocks'
  independent_variables:
  - solver
  - ring_degree_n
  - stream
  metrics:
    primary:
    - attempts to exact recovery per solver
    secondary:
    - feasible-set log-volume per attempt
    - LP time
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: N_ILWE / N_ineq at n = 64
    formula: (16 gamma1^2 /(3 tau)) / (c0 n l gamma1 / beta)
    source: variance and edge-density arguments in this record
  scale_relevance:
    tier: toy
    justification: n <= 96, gamma1 = 2^12; transfer by the stated per-attempt information
      model
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop at 5/5 recoveries per cell or 2^22 attempts
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: 'P1 holds in C1, P2 in C2, P3 in C3; AA1 noise floor: counts within factor
    1.5'
  falsification_criterion: C1 ratio below 10 or C3 shows accepted-only recovery
  decision_impact:
    on_positive: >-
      add 'aborted transcripts must not leak' as a priced requirement with an attempts-to-key
      number in the fault/leak taxonomy
    on_negative: >-
      conclude edge information is not exploitable beyond regression and drop aborted-transcript
      leakage from the priority list
  variable_ledger:
    independent:
    - name: solver
      levels:
      - ilwe_regression
      - edge_inequality
    - name: ring_degree_n
      levels:
      - '32'
      - '64'
      - '96'
    - name: stream
      levels:
      - rejected
      - accepted_only
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    - name: run_order
      treatment: randomized
      value: arm order shuffled per seed block
      how: interleave arms trial by trial with a recorded permutation
    comparisons:
    - id: C1
      arms:
      - edge_inequality n64
      - ilwe_regression n64
      differs_in:
      - solver
      design: one_factor
    - id: C2
      arms:
      - edge_inequality over n grid
      differs_in: []
      design: absolute
    - id: C3
      arms:
      - edge_inequality rejected
      - edge_inequality accepted_only
      differs_in:
      - stream
      design: one_factor
    - id: AA1
      arms:
      - edge_inequality n64 seed-block A
      - edge_inequality n64 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-f27cb2.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-f27cb2.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P3
    first_recorded_in: ledger/proposals/IDEA-20261018-f27cb2.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
