  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 100
    maximum_memory_gb: 16
    maximum_runs: 120
  stopping_rules:
  - stop a variant when q* CI < 0.1
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - uncertified recoveries excluded
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C2 shows P1 and C1 shows P2 beyond the AA1 noise floor.
  falsification_criterion: C2 residuals exceed 0.3 for any shape.
  decision_impact:
    on_positive: Use one law for all module/matrix NTRU distance statements.
    on_negative: Fit per-shape laws; module structure matters beyond geometry.
  variable_ledger:
    independent:
    - name: shape_dm
      levels:
      - 1x1
      - 1x2
      - 2x1
      - 2x2
      - 1x3
    - name: flattened_dimension
      levels:
      - '96'
      - '128'
      - '160'
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: bkz_beta
      treatment: fixed
      value: '30'
      how: manifest
    comparisons:
    - id: C1
      arms:
      - 1x2
      - 2x1
      differs_in:
      - shape_dm
      design: one_factor
    - id: C2
      arms:
      - all shapes collapse fit
      differs_in: []
      design: absolute
    - id: AA1
      arms:
