  title: Matrix NTRU collapse sweep
  objective: Test whether transition location collapses on (N, rho).
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath, fpylll, profile detector, certificate checker
    parameters: >-
      (d, m) in {(1,1),(1,2),(2,1),(2,2),(1,3)}; N in {96, 128, 160}; 20 instances per q;
      ring x^n + 1
    procedure: 1. Generate variants. 2. Sweep q. 3. Reduce. 4. Detect and certify. 5. Fit
      collapse.
  controls:
  - 'null: matched random lattices'
  - 'positive: planted dense sublattice of controlled rank ratio in an unstructured lattice'
  - 'A/A: one variant on two seed blocks'
  independent_variables:
  - shape_dm
  - flattened_dimension
  metrics:
    primary:
    - collapse residuals
    secondary:
    - q* CIs
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: residual
    formula: <= 0.15
    source: geometric argument
  scale_relevance:
    tier: toy
    justification: N <= 160
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
