# EXPERIMENT CONTRACT -- EXP-MLKEM-641142 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-641142
  hypothesis_id: H-MLKEM-03171d
  derived_from_idea: IDEA-20261018-6a1f41
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Measured beta* versus integrated failure count on reduced ML-KEM (n=64, k=2)
  objective: >-
    Reduce the uncertainty in how many block-size units one decryption failure is worth after
    the lattice step, and whether DDGR's estimator predicts it.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python 3, SageMath 10, leaky-LWE-estimator (DDGR framework), G6K pump/progressive BKZ
      via fpylll, NumPy; reduced ML-KEM keygen/encaps written from FIPS 203 pseudocode with
      n parameterized
    parameters: >-
      n=64, k=2, q=3329, eta1=eta2=3, d_u=10, d_v=4; 30 keys; F in {0,1,2,4,8}; candidate
      encapsulations up to 2^26 per key filtered to the top 2^-10 by ||(r,e1)||; G6K progressive
      pumps from beta=30 in steps of 2 up to 110; embedding dimension 2kn+1=257
    procedure: >-
      1) Freeze protocol and seeds. 2) Keygen 30 keys. 3) For each key generate filtered encapsulations
      and query the simulated oracle until 8 failures and 8 non-failures of matched norm are
      stored. 4) For each arm and F build the hint-integrated DBDD instance (DDGR isotropize).
      5) Run progressive reduction, record beta* and verify s. 6) Run the leaky-LWE estimator
      for the same hints. 7) Compute paired differences and bootstrap CIs.
  controls:
  - >-
    null: integrate the same number of NON-failing ciphertexts (true but weak conditioning)
    of matched ||(r,e1)||; predicted drop ~0
  - >-
    positive: integrate F perfect hints <(s,e),c> = exact value along the same directions;
    DDGR predicts ~1 dimension per hint and the pipeline must reproduce it
  - >-
    A/A: the no-hint arm run twice on the same instances with different BKZ randomization
    seed blocks
  independent_variables:
  - hint_type
  - num_hints
  metrics:
    primary:
    - beta* per instance
    - paired beta* drop with 95% bootstrap CI
    secondary:
    - estimator residual
    - oracle queries per failure
    - max |cos| between hint directions
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: beta*(none) - beta*(failure_approx, F=4)
    formula: DDGR leaky-LWE estimator output for the integrated hints
    source: KN-LIT-118 framework
  scale_relevance:
    tier: toy
    justification: >-
      reduced ML-KEM shape: ring Z_3329[X]/(X^n+1) with n in {32,64}, module rank k=2, CBD(eta)
      secrets/errors; transfer assumption: the measured ratio (not the absolute cost) carries
      to n=256 when the governing statistic scales as stated; no FIPS 203 claim is made
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
