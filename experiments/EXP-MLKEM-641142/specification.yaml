    - 2026101828
    - 2026101829
    independent_instances: 30
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 48
    maximum_memory_gb: 16
    maximum_runs: 300
  stopping_rules:
  - stop an instance at beta=110 without success and record censored
  - stop the batch if the positive control fails on 5 consecutive instances
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - positive control below 0.7 dimension per perfect hint invalidates the batch
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C1 shows a paired drop >= 8 at F=4 with CI excluding 0 and above the AA1 noise floor (P1),
    and C2 residual <= 3 at all F (P2), with C3 drop <= 1 (P3).
  falsification_criterion: C1 drop at F=4 below 4 units or inside the AA1 noise floor, or
    C2 residual > 5 at any F.
  decision_impact:
    on_positive: >-
      Adopt DDGR integration as the lattice back end of the failure flank and price ML-KEM
      failure attacks as (query cost) + (beta* from estimator), feeding RQ-MLKEM-003 target
      4.
    on_negative: >-
      Record that failure-conditioned hints are worth less than DDGR predicts; the failure
      flank is priced by query cost alone and the lattice step gets no discount.
  variable_ledger:
    independent:
    - name: hint_type
      levels:
      - none
      - failure_approx
      - nonfailure_approx_null
      - perfect_positive
    - name: num_hints
      levels:
      - '1'
      - '2'
      - '4'
      - '8'
    factors:
    - name: instance_seed
      treatment: randomized
      value: 30 keys
      how: keys drawn from seeded SHAKE; same keys in every arm (paired)
    - name: bkz_seed_block
      treatment: randomized
      value: blocks A and B
      how: basis randomization seed block used by G6K before progressive reduction
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - failure_approx
      - none
      differs_in:
      - hint_type
      design: one_factor
    - id: C2
      arms:
      - failure_approx vs DDGR prediction
      differs_in: []
      design: absolute
    - id: C3
      arms:
      - nonfailure_approx_null
      - none
      differs_in:
      - hint_type
      design: one_factor
    - id: AA1
      arms:
      - none bkz_seed_block A
      - none bkz_seed_block B
      differs_in:
      - bkz_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
