    findings:
    - id: F1
      text: >-
        C6 is implemented as an in-trial two-replicate comparison
        (summary.c6.identical in run.py). The specification's C6 check and comparison
        C-aa-c6 compare ctrl-c6-replicate-m3-n9 against trial poly-m3-n9
        (RUN-SEMBIN-0689a2), and no runbook element makes that comparison.
    - id: F2
      text: >-
        Step validity accepts raw-result /status completed_invalid, run.py exits 0 on
        completed_invalid, and check.py exits 0 when the status matches its recount. A
        trial whose C1 gate fails, whose C6 replicate differs, or that has a false
        refutation, eliminator or enumerator disagreement, evalcheck mismatch or worker
        error would be recorded as a valid unit. control_validity could then read passed
        for runs that the spec's invalidation_rules void. Only false_refutations and
        eliminator_disagreements are surfaced as metrics; c1.pass, c6.identical and
        per-unit /status are not.
    - id: F3
      text: >-
        The session summary surfaces none of: the primary D_W distribution, the
        per-cell CP95 interval, per-cell M_4 counts, null r_4 (P2), the m=2 control rate
        (C2), the block-local arm, or ops_proxy / P4. They would exist only inside each
        unit's raw-result.json.
    note: >-
      F1-F3 are latent in this session because no unit ran. They bind any later session
      that reuses runbook sha256 2996f44f....

