- id: S01-retries
  kind: trials
  title: Execute retry group 1 of 6 (poly-m4-n11, rand-m4-n11) once each, under the supervisor claim
  explain: Runs run.py then check.py for both trials of trial-plan-retry3-g1.json under the supervisor claim and
    keeps every output file.
  plan: experiments/EXP-SEMBIN-24ec56/trial-plan-retry3-g1.json
  engine: supervisor
  claim:
    ttl_minutes: 10080
  timeout_seconds: 604800
  validity:
    files:
    - path: manifest.yaml
    - path: results.jsonl
    - path: instances.json
    - path: raw-result.json
      json: true
      assertions:
      - pointer: /schema
        equals: sembin.closure_degree.result.v1
      - pointer: /experiment_id
        equals: EXP-SEMBIN-24ec56
      - pointer: /hypothesis_id
        equals: H-SEMBIN-106967
      - pointer: /trial_id
        equals: '{trial_id}'
      - pointer: /run_id
        equals: '{run_id}'
      - pointer: /environment/m4ri_available
        type: boolean
      - pointer: /cells
        type: array
      - pointer: /instances
        type: array
      - pointer: /instances
        min_length: 1
      - pointer: /summary/false_refutations
        type: integer
      - pointer: /summary/censored_jobs
        type: integer
      - pointer: /summary/eliminator_disagreements
        type: integer
      - pointer: /instances_canonical_sha256
        matches: ^[0-9a-f]{64}$
      - pointer: /status
        in:
        - completed_valid
        - completed_invalid
  by_trial:
    poly-m4-n11:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - pointer: /seed
          equals: 20261019
        - pointer: /run_id
          equals: RUN-SEMBIN-afeaf6
        - pointer: /trial_id
          equals: poly-m4-n11
    rand-m4-n11:
