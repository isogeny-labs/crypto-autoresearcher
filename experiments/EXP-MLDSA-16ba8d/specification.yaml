# EXPERIMENT CONTRACT -- EXP-MLDSA-16ba8d (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-16ba8d
  hypothesis_id: H-MLDSA-1d6567
  derived_from_idea: IDEA-20261018-4d0a02
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Estimator calibration on defective ExpandS secrets
  objective: whether the estimator's MLWE calibration holds for defect-skewed secrets
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      SageMath, lattice-estimator, fpylll/G6K; toyDSA(n,k,l): a NumPy re-implementation of
      FIPS 204 Algorithms 1-8 with the ring degree n as a parameter (q = 8380417, d = 13,
      eta, tau, gamma1, gamma2, beta = tau*eta, omega as in ML-DSA-44 unless stated), cross-checked
      against the PQClean ML-DSA-44 reference at n = 256 on 1000 KAT vectors before any reduced
      run
    parameters: >-
      toyDSA(n,2,2) n in {64,80,96,112}; distributions {uniform_eta2, low_variance, low_entropy};
      5 keys
    procedure: 1) KAT. 2) keys from each distribution. 3) Predict. 4) Progressive BKZ. 5)
      Certify.
  controls:
  - 'null: honest uniform eta = 2'
  - 'positive: ternary {-1,0,1} with known lower cost'
  - 'A/A: honest under two seeds'
  independent_variables:
  - secret_distribution
  metrics:
    primary:
    - measured beta
    secondary:
    - predicted beta
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: beta
    formula: lattice-estimator primal_usvp with defect variance
    source: KN-LIT-061
  scale_relevance:
    tier: toy
    justification: n <= 112
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop at beta 80
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: P1 in C2 and P2 in C1; AA1 noise floor beta within 3
  falsification_criterion: C2 misses by > 8
  decision_impact:
    on_positive: certify the estimator for skewed secrets in MLWE pricing
    on_negative: flag estimator miscalibration for skewed secrets
  variable_ledger:
    independent:
    - name: secret_distribution
      levels:
      - uniform_eta2
      - low_variance
      - low_entropy
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    comparisons:
    - id: C1
      arms:
      - low_variance
      - low_entropy
      differs_in:
      - secret_distribution
      design: one_factor
    - id: C2
      arms:
      - measured vs predicted all arms
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - uniform seed-block A
      - uniform seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-4d0a02.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-4d0a02.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLDSA-16ba8d/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-4d0a02.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
