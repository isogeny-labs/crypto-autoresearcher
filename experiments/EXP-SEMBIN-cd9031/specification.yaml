experiment:
  id: EXP-SEMBIN-cd9031
  hypothesis_id: H-SEMBIN-230c74
  version: 1
  title: Does the 18-22% t=2 yield deficit transfer to the cost-relevant linear regime?
  status: review_required
  objective: At fixed |V|=1024 and t=2, does the confinement dispersion factor f_disp
    track (1+e^{-mu})/2 from mu=.5 down to .0078, while the unconfined arm stays 1.000+-.005?
    Confined f_disp tracks the closed form within .005 while the unconfined arm is
    flat at 1, so the 18-22% deficit is a saturation artifact and the clustering reading
    loses.
  inputs:
    proposal: ledger/proposals/IDEA-20261017-e9f824.yaml
    design_protocol: experiments/EXP-SEMBIN-cd9031/protocol.json
    design_packet: analysis/open-ideas-design-20261031/DESIGN.md
    cells:
      instances: 10
      replicates: 1
      warmups: 0
  controls:
  - 'A/A: C-aa'
  - 'positive: mu-half (the recorded mu~.5 f_disp .80 is reproduced)'
  - 'negative: curve-free (curve-free symmetric random map with f_disp=1 at every
    mu)'
  independent_variables:
  - arm
  metrics:
    primary:
    - f_disp
    - f_disp_unconf
    - pi1
    - vmr
    secondary: []
  replication:
    seeds:
    - 20261031
    independent_instances: 10
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 16.0
    maximum_runs: 10
  stopping_rules:
  - 'fixed: n=20..29 x two confinement arms x two B values, plus the mu~.5 and curve-free
    controls, then stop'
  invalidation_rules:
  - a row whose instrument hash differs from the frozen build is excluded and reported
  - a control that fails its expected detection voids the clean cells it was meant
    to protect
  success_criterion: C-form is supported when confined f_disp tracks the closed form
    within .005, pi1=0, the unconfined arm is 1.000+-.005 and the mu~.5 control is
    reproduced; confined f_disp below .95 at mu<=.04 in >=2 cells establishes clustering.
  falsification_criterion: 'Confined f_disp at mu-hat<=.04 below .95 in >=2 cells:
    intrinsic clustering exists, first-order cost >=0.07 bit.'
  required_artifacts:
  - experiments/EXP-SEMBIN-cd9031/protocol.json
  - experiments/EXP-SEMBIN-cd9031/runs/
  - experiments/EXP-SEMBIN-cd9031/results/
  - experiments/EXP-SEMBIN-cd9031/reports/
  assigned_to: executor-mechanical
  approved_by: null
  source_idea: IDEA-20261017-e9f824
  derived_from_idea: IDEA-20261017-e9f824
