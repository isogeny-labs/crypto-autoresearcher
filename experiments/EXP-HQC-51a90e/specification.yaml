# EXPERIMENT CONTRACT -- EXP-HQC-51a90e (review_required, unapproved, zero runs).
experiment:
  id: EXP-HQC-51a90e
  hypothesis_id: H-HQC-2a18d0
  derived_from_idea: IDEA-20261018-baf40a
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: DOOM gain on reduced QC instances
  objective: Whether realised DOOM gain matches the sqrt prediction.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C ISD with operation counters; Python fits
    parameters: n in {67,101,131}; code length 2n; weights w ~ sqrt(n)/1.5; 200 instances
      per cell
    procedure: 1. Instances. 2. Solve single and DOOM. 3. Count ops. 4. Fit exponent.
  controls:
  - >-
    null: non-QC random code of same size with n independent syndromes of different codes
    (no gain expected for one code)
  - 'positive: n syndromes of the same random code with planted solutions'
  - 'A/A: single-instance Stern under two seed blocks'
  independent_variables:
  - mode
  - algorithm
  metrics:
    primary:
    - DOOM gain exponent
    secondary:
    - memory peak
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: gain
    formula: sqrt(n) for Stern
    source: Sendrier 2011
  scale_relevance:
    tier: toy
    justification: 'n up to 131; transfer: exponent of gain'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 36
  stopping_rules:
  - 200 instances per cell
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - instance without planted solution invalid
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Success if C1 exponent in [0.4,0.6] beyond the AA1 noise floor (P1) and C2 consistent
    with P2.
  falsification_criterion: Falsified if C1 exponent outside [0.3,0.7].
  decision_impact:
    on_positive: Use the measured DOOM exponent in the matched ISD baseline.
    on_negative: Revise the QC discount used in HQC concrete cost.
  variable_ledger:
    independent:
    - name: mode
      levels:
      - single
      - doom
    - name: algorithm
      levels:
      - prange
      - stern
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    - name: n_size
      treatment: crossed
      value: 67,101,131
      how: all cells
    comparisons:
    - id: C1
      arms:
      - stern single
      - stern doom
      differs_in:
      - mode
      design: one_factor
    - id: C2
      arms:
      - prange doom
      - stern doom
      differs_in:
      - algorithm
      design: one_factor
    - id: C3
      arms:
      - non-QC null
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - stern single seed-block A
      - stern single seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-baf40a.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-baf40a.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - op counts CSV
  - fit SVG
  - PDF
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-HQC-51a90e/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-baf40a.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
