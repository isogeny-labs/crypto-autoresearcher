experiment:
  id: EXP-FNDSA-fb188f
  hypothesis_id: H-FNDSA-24cf2f
  derived_from_idea: IDEA-20261018-fd1f81
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Fatigue point by key-spectrum family
  objective: Measure whether embedding-spectrum flatness moves the dense-sublattice transition.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath, fpylll BKZ 2.0, profile detector, certificate checker
    parameters: >-
      n in {32, 64}; ring x^n + 1; q on log2 grid step 0.25 around predicted q*; 20 keys per
      family per q; BKZ beta <= 30
    procedure: >-
      1. Generate families with matched norm. 2. Compute orbit covolume. 3. Reduce per q.
      4. Detect event and certify recovery. 5. Fit logistic q*.
  controls:
  - 'null: Gaussian keys conditioned on norm only'
  - 'positive: planted skewed-spectrum keys'
  - 'A/A: Falcon family on two seed blocks'
  independent_variables:
  - key_family
  - dimension_n
  metrics:
    primary:
    - log2 q* with bootstrap CI
    secondary:
    - orbit log-covolume
    - recovery beta
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: Delta log2 q*
    formula: proportional to Delta log covolume / n
    source: AM-GM covolume argument
  scale_relevance:
    tier: toy
    justification: n <= 64; claim is direction of shift
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    - 2026101810
    - 2026101811
    - 2026101812
    - 2026101813
    - 2026101814
    - 2026101815
    - 2026101816
    - 2026101817
    - 2026101818
    - 2026101819
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40
    maximum_memory_gb: 8
    maximum_runs: 64
  stopping_rules:
  - stop a family when q* CI width < 0.1
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - uncertified recoveries are not counted
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 gives P1 and C2 gives P2 with CIs excluding 0, beyond AA1 noise floor.
  falsification_criterion: C1 CI contains 0 while C2 detects the skewed shift.
  decision_impact:
    on_positive: Report key-spectrum as a fatigue covariate; FN-DSA margin analyses should
      include it.
    on_negative: Treat norm as sufficient key statistic for fatigue location.
  variable_ledger:
    independent:
    - name: key_family
      levels:
      - falcon_accepted
      - antrag_annular
      - skewed_planted
      - norm_only_gaussian
    - name: dimension_n
      levels:
      - '32'
      - '64'
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: bkz_beta
      treatment: fixed
      value: '30'
      how: manifest
    comparisons:
    - id: C1
      arms:
      - antrag_annular
      - falcon_accepted
      differs_in:
      - key_family
      design: one_factor
    - id: C2
      arms:
      - skewed_planted
      - falcon_accepted
      differs_in:
      - key_family
      design: one_factor
    - id: AA1
      arms:
      - falcon block A
      - falcon block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
