# EXPERIMENT CONTRACT -- EXP-FNDSA-23125b (review_required, unapproved, zero runs).
experiment:
  id: EXP-FNDSA-23125b
  hypothesis_id: H-FNDSA-d94478
  derived_from_idea: IDEA-20261018-17ea70
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Trace-projected detectors vs full detector
  objective: Measure whether subfield trace projections concentrate defect power.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Python/NumPy toy Falcon, power by replicate simulation
    parameters: >-
      n = 64; q = 12289; l in {0, 3, 5}; trace degree d in {1, 2, 4, 8, 16, 32, 64}; 500 replicates;
      signature counts on a log grid up to 10^6
    procedure: >-
      1. Plant defect. 2. Generate signatures. 3. Compute statistics per degree. 4. Calibrate
      thresholds on exact arm. 5. Estimate power curves and N80.
  controls:
  - 'null: exact sampler, all statistics'
  - 'positive: planted defect at top level (l = 0)'
  - 'A/A: exact sampler on two seed blocks to calibrate false-positive rate'
  independent_variables:
  - statistic_family
  - defect_level
  metrics:
    primary:
    - N80 per statistic
    secondary:
    - false-positive rate under exact sampler
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: argmax-power degree
    formula: n/2^l
    source: tower-split argument
  scale_relevance:
    tier: toy
    justification: n = 64; transfer assumes per-level geometry identical at larger n
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    independent_instances: 5
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 15
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
  - stop if exact-arm false-positive rate exceeds 2 alpha
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - miscalibrated null invalidates the power estimates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 shows P1 at l = 5 and C2 shows P2, with false-positive rate set by
    the AA1 noise floor.
  falsification_criterion: C1 finds the full statistic at least as powerful as every trace
    statistic at all levels.
  decision_impact:
    on_positive: Adopt tower-matched statistics as the lane's default public detector family.
    on_negative: >-
      Keep full-dimensional or dual-lattice statistics; the tower gives no handle on public
      data.
  variable_ledger:
    independent:
    - name: statistic_family
      levels:
      - full_dimension_quadratic
      - relative_trace_degree_d
    - name: defect_level
      levels:
      - '0'
      - '3'
      - '5'
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: alpha
      treatment: fixed
      value: 0.01 Bonferroni over degrees
      how: manifest
    comparisons:
    - id: C1
      arms:
      - relative_trace_degree_d best
      - full_dimension_quadratic
      differs_in:
      - statistic_family
      design: one_factor
    - id: C2
      arms:
      - defect_level 3
      - defect_level 5
      differs_in:
      - defect_level
      design: one_factor
    - id: AA1
      arms:
      - exact block A
      - exact block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-17ea70.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-17ea70.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml
  - raw-result.json
  - power curves
  - PDF report
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-FNDSA-23125b/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-17ea70.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
