experiment:
  id: EXP-MONO-1a1be2
  version: 1
  title: >-
    Origin of the 2^(n-1) compounding factor over F_{q^n}: four-convention exhaustive
    decomposition counts (arm A), generic and factor-base-locus fibre splitting of
    S_{n+1} (arm B), and a target-sampled Poisson validation arm (arm C)
  goal_id: GOAL-PATH-001
  question_id: RQ-MONO-001
  hypothesis_id: H-MONO-23d347
  idea_ids: [IDEA-20261023-f15270]
  supersedes_by_reference_idea: IDEA-20260803-ff7415
  batch_id: BATCH-c53152
  status: review_required
  approved_by: null
  execution_authorized: false
  frozen: false
  designed_at: '2026-10-29'
  designed_by: coordinator
  designed_by_decision: DEC-20261029-71d757
  preregistration_state: >-
    provisional_until_approval. Predictions P1 to P8 are written before any run and
    before any implementation exists. They become frozen only in the approval act,
    which must cite the composed verdict of the blind re-derivation of L1 to L6 and
    L8 (review plan coordination/goals/GOAL-PATH-001/batches/BATCH-c53152/review-plan.yaml).
    If a joint breaks, this version is not approved; a version-2 amendment under
    amendments/ states the change and its reason, and this text stays on record.
  objective: >-
    Decide, at the tested cells and nowhere else, which reading of the clause "a
    per-fibre factor of 2 ... compounds as 2^{n-1}" (superseded KN-FIND-c41ea9 text,
    carried by DEC-20260802-a51c82 and two goal heads) the counts support: a yield
    factor (reading Y), a proxy-correction factor (reading P), or neither. Corroborate
    the premises the derivation cannot supply: the transfer T1 of KN-FIND-4f0d84 and
    KN-FIND-bdcd60 (3) from F_p to F_{q^n}, counter correctness through exact known
    answers and a failing twin, and the per-target Poisson law HEUR-F-1. Reading C
    (solve or sign-finding cost) is out of scope.
  scope:
    field: >-
      F_Q with Q = q^n, q an odd prime greater than 3, F_Q = F_q[t]/(g) with g the
      lexicographically least monic irreducible polynomial of degree n over F_q
      (coefficients read from the constant term upward, each in 0..q-1).
    curve_family: >-
      short Weierstrass y^2 = x^3 + a x + b over F_Q; (a, b) uniform over F_Q^2 from
      the seed rule; reject singular curves and every curve with j(E) in F_q (this
      also removes j = 0 and j = 1728).
    factor_base: "D = {P in E(F_Q) minus O : x(P) in F_q}; B = |D|; X = x(D); t2 = |D intersect E[2]|"
    group: E(F_Q), order N counted by the implementation (exhaustive when Q < 2^27, otherwise baby-step giant-step on the Hasse interval with an independent exhaustive cross-check on every curve with Q < 2^27)
    tier: toy
    tier_note: >-
      Largest arm-A field Q = 101^4 = 104,060,401 (under 2^27); arm C fields are about
      2^30 to 2^32 by the rule below. Toy tier by the mechanical rule. Nothing here
      concerns cryptographic scale. The optional 2^36 extension proposed by the IDEA is
      excluded from this contract.
  arms:
    A_exhaustive_grid:
      description: >-
        Exhaustive over all N targets. For each cell and each of three bases (line base
        D, matched random symmetric base, half-size failing twin) compute T_A(R), T_M(R),
        T_S(R) and T_X(R) for every R, with an independent recount (T_S from ordered
        x-tuples and sign classes; T_M from multisets) per OI-1 repair R1.
      cells:
        n1_anchor: {q: [61, 251], curves_per_q: 3, note: "F_Q = F_q; all convention ratios must equal 1"}
        n2: {q: [61, 251, 1021, 4093]}
        n3: {q: [17, 41, 101, 251]}
        n4: {q: [11, 23, 53, 101]}
        n5: {q: [7, 11, 17, 29]}
      curves_per_cell: 3
      cell_count: 54
      cell_count_note: 48 grid cells (4 n x 4 q x 3 curves) plus 6 n = 1 anchor cells; none sampled
      repeat_dominated_flag: cells with B < n^2 are flagged; P3 is decided on unflagged cells and also reported with them
    B_fibre_splitting:
      description: >-
        (B1) generic tuples: 10^6 ordered x-tuples uniform in F_Q^n per (n, curve) on
        the second q rung (q = 251, 41, 23, 11 for n = 2, 3, 4, 5), three curves each.
        For every tuple compute S_{n+1}(x_1..x_n, T) as a univariate polynomial in T by
        the resultant recursion, test squarefreeness and full degree, and test complete
        splitting over F_Q by distinct-degree factorisation; record chi(f(x_i)) for every
        i. (B2) factor-base locus: up to 10^4 tuples of distinct elements of X per
        (n, curve) on the first and second q rungs, all of them when fewer exist. A 1
        percent subsample of B1 and all of B2 are cross-checked by the group-law method
        (roots computed as x of signed sums of lifts over F_{Q^2}).
      cell_count: 24
      cell_count_note: B1 12 (4 n x 3 curves) plus B2 12 (4 n x 3 curves, each over two rungs)
    C_validation_target_sampled:
      description: >-
        Heuristic-validation arm (heuristic_under_test HEUR-F-1, HEUR-F-2).
        Target-sampled, base-exhaustive: enumerate all C(B+n-1, n) multisets of the line
        base once, sum each, and look the sum up in a hash set of s sampled target
        classes (R and -R share a class). Per-target counts are exact; only the targets
        are sampled. The same is done for a matched random symmetric base per curve.
      q_rule: >-
        for n = 2..7, q_n is the least prime p > 3 with p^n >= 2^30, computed by the
        trial-plan generator and recorded per cell. Expected values by the rule: 32771,
        1031, 191, 67, 37, 23 for n = 2..7 (the n = 6, 7 values equal the IDEA's). The
        generator's output binds; a disagreement with this list is reported, not
        silently absorbed.
      curves_per_n: 3
      cell_count: 18
      target_sampling: >-
        targets drawn by uniform x in F_Q with chi(f(x)) = +1 and a uniform sign, one
        representative per +- class, then restricted to generic targets (not O, not in
        E[2], not a sum of n - 2l base points); draws continue until s generic classes
        are held.
      sample_size_rule: >-
        s_n = ceil((1 - c)/(c * 0.03^2)) with c = 1 - exp(-lambda_nominal),
        lambda_nominal = 1/n! (an upper bound on the needed s because the actual lambda
        is larger at finite B). Values by the rule, IDEA arithmetic: about 1.7e3, 6.1e3,
        2.6e4, 1.3e5, 8.0e5, 5.6e6 for n = 2..7; the generator's computed values bind.
      enumeration_size_note: >-
        about 5.4e8 multisets at n = 2 and 1.8e8 at n = 3, so the inner loop is compiled
        (code/kernel.c); derived counts, not timings.
    D_prime_field_fixture:
      description: >-
        Optional and descriptive only. Read the F_p per-cell mean_ordered,
        mean_multiset, var_ordered and var_multiset of EXP-MONO-c819ba by key and report
        them beside arm A. No new run, no criterion, no decisive role. The L7 general-m
        relation-rate form is not tested by this contract (DEC-20261029-71d757 OI-3).
  inputs:
    proposal: ledger/proposals/IDEA-20261023-f15270.yaml
    proposal_report: docs/reports/2026-10-23-idea-f15270-rescope/report.md
    premises: [knowledge/findings/KN-FIND-007.md, knowledge/findings/KN-FIND-4f0d84.md, knowledge/findings/KN-FIND-bdcd60.md]
    open_problem: knowledge/open-problems/KN-OPEN-62c870.md
    corrections_binding: ledger/corrections/CORR-20260802-1d8384.yaml
    fixtures_read_by_key_only: [experiments/EXP-MONO-c819ba/execution_report.yaml]
    implementation: >-
      experiments/EXP-MONO-1a1be2/code/ (to be written by TASK-20261029-a97206; does not
      exist at design time). Reusable by path, read-only: experiments/EXP-SMON-e5cbe6/code/semaev_cover.py,
      src/crypto_autoresearcher/index_calculus/{semaev,decompose,tails,curve,factor_base,stats}.py.
  seeds:
    curve_seed_rule: >-
      seed string "f15270|<arm>|<n>|<q>|<curve_index>" with arm in {A, B, C} and
      curve_index in {0, 1, 2}; generator numpy.random.Generator(PCG64(s)) with s the
      integer value of the first 16 bytes (big-endian) of SHA-256 of the UTF-8 seed
      string. Arm B reuses the arm-A curves of the same (n, q).
    base_seed_rule: seed string "f15270|base|<cell_id>|<role>|<replicate>" with role in {random, twin}; same generator construction
    tuple_seed_rule: seed string "f15270|tuples|<cell_id>|<replicate>"; same generator construction
    target_seed_rule: seed string "f15270|targets|<cell_id>"; same generator construction
    note: every derived seed is written into the trial plan and every manifest
  independent_variables:
    - {name: n, levels: [1, 2, 3, 4, 5, 6, 7], note: "1 is the anchor; 6 and 7 are arm C only"}
    - {name: q_rung, levels: [1, 2, 3, 4], note: "the per-n q ladder of arm A"}
    - {name: factor_base_construction, levels: [line, matched_random, half_twin]}
  controls:
    - id: CTL-null
      object: matched random symmetric base of size B with the same t2 (t2 points drawn from E(F_Q)[2] minus O, the remaining (B - t2)/2 +- pairs uniform over non-2-torsion classes)
      expected: all-target multiset mean equals C(B+n-1,n)/N exactly in every exhaustive cell
      on_failure: F2
    - id: CTL-twin
      object: random symmetric base with the same t2 and ceil((B - t2)/4) +- pairs (about half size)
      expected: all-target mean ratio to its full-size sibling equals C(B'+n-1,n)/C(B+n-1,n) exactly, B' the twin size
      on_failure: F6 (PC-C not detected)
    - id: CTL-anchor
      object: n = 1 cells
      expected: T_A = T_M = T_S = T_X on every target; every ratio 1
      on_failure: F7
    - id: CTL-known-answer
      object: n = 2 cells, target O
      expected: provisional P2(v)
      on_failure: F7
    - id: CTL-positive
      object: PC-A (log2 of the A/M mean ratio against n - 1), PC-B (log2 of 1/phi_n against n - 1), PC-C (twin ratio)
      expected: detected as in P7
      on_failure: F6
    - id: CTL-aa
      object: second matched random base with an independent base seed (C-aa-baseseed); second 10^6-tuple sample with an independent tuple seed on one curve per n (C-aa-tupleseed)
      expected: noise floor for kappa_rel and for phi_n
    - id: CTL-exact-denominator
      object: every ratio is against an exact rational computed from B, N, t2 and n
      expected: no certifying gate exists that could fail
  metrics:
    primary:
      - id: M1
        name: convention_identity_residuals
        definition: per exhaustive cell and target, the residual of each identity listed in P2; reported as the count of targets with nonzero residual
      - id: M2
        name: kappa_rel_slope
        definition: least-squares slope of log2(kappa_rel) against n - 1 over n = 2..5, kappa_rel = generic-target coverage of the line base over that of the matched random base, per-n mean over curves and rungs; interval by bootstrap over curves (10^4 resamples, seed "f15270|bootstrap")
      - id: M3
        name: locus_split_fraction
        definition: fraction of arm-B2 tuples with squarefree full-degree fibre whose fibre splits completely over F_Q
      - id: M4
        name: rule_agreement_and_phi_n
        definition: >-
          on arm-B1 tuples with every chi(f(x_i)) nonzero and a squarefree full-degree
          fibre, (a) the count of tuples where complete splitting disagrees with "all
          chi(f(x_i)) equal" and (b) phi_hat_n, the complete-split frequency, with its
          binomial SE
      - id: M5
        name: poisson_fit_arm_C
        definition: per arm-C cell, coverage, zero fraction, dispersion index, KS and chi-square statistics of the empirical count law against Poisson(lambda), lambda = (N_cf - m_S)/(N - |S|) computed exactly per cell
    secondary:
      - all-target means per convention and base; generic-target means; per-cell B, t2, |X|, N, |S|, repeat fraction
      - fraction of non-squarefree or degree-deficient fibres in arm B1
      - phi_hat_n against the limit 2^{1-n}, reported beside the exact finite-Q comparator of P5
      - arm D fixture values (descriptive)
      - wall time and peak RSS per cell (never a primary metric)
  heuristic_under_test: HEUR-F-1 and HEUR-F-2 (arm C); HEUR-F-3, the transfer T1, (arm B and P2(iii) to (v))
  preregistered_predictions:
    - id: P1
      quantity: all-target mean of T_M per cell and base, over C(B+n-1,n)/N
      prediction: exactly 1 in every exhaustive cell (KN-FIND-007); vacuous as a test of the clause, power against counter defects only
      source: KN-FIND-007 (derivation tier, committed); IDEA PR-1
    - id: P2
      quantity: per-cell, per-target exact identities among T_A, T_M, T_S, T_X
      prediction: >-
        provisional, from IDEA L2 to L4: (i) sum_R T_A = B^n and sum_R T_M =
        C(B+n-1,n); (ii) T_A(R) = sum over multisets mu with sum R of n!/prod(m_j!);
        (iii) for 2R != O, T_S(R) = sum over ordered tuples with sum R of 2^j, j the
        number of 2-torsion entries; (iv) T_M(R) - T_X(R) equals the excess count of
        point multisets over a common x-multiset that sum to R, nonzero only where x(R)
        is a multiple root of S_{n+1}; (v) at n = 2, T_A(O) = B and T_M(O) = (B+t2)/2;
        (vi) the number of size-n multisets of D with no pair summing to O is the
        coefficient of z^n in ((1+z)/(1-z))^((B-t2)/2) (1+z)^t2
      source: IDEA-20261023-f15270 L1 to L4 [D, not yet independently re-derived]
    - id: P3
      quantity: M2, slope of log2(kappa_rel) against n - 1 on unflagged cells
      prediction: inside [-0.15, 0.15]; the compounding reading predicts 1.0
      source: IDEA PR-2b (band and compounding value carried from IDEA-20260803-ff7415)
    - id: P4
      quantity: M3
      prediction: 1 (every squarefree full-degree locus fibre splits completely over F_Q), n = 2..5
      source: KN-FIND-4f0d84 transferred under T1 (HEUR-F-3); IDEA PR-4
    - id: P5
      quantity: M4
      prediction: >-
        (a) zero disagreements between complete splitting and "all chi(f(x_i)) equal";
        (b) phi_hat_n within 3 binomial SE of the exact finite-Q comparator
        (p_plus^n + p_minus^n)/(p_plus + p_minus)^n, where p_plus = (N - 1 - r)/(2Q),
        p_minus = 1 - p_plus - r/Q and r the number of roots of x^3 + a x + b in F_Q
        (this comparator tends to 2^{1-n}); (c) slope of log2(1/phi_hat_n) against n - 1
        inside [0.85, 1.15], predicted 1.0
      source: >-
        KN-FIND-bdcd60 (3) transferred under T1; IDEA PR-5 and L6 for the 2^{1-n} limit;
        the exact finite-Q comparator and the per-tuple agreement test (a) are added by
        DEC-20261029-71d757 design note DF-1, written before any data
    - id: P6
      quantity: M5 on arm-C cells
      prediction: >-
        per cell, coverage within 3 SE of 1 - exp(-lambda); dispersion index within
        3 SE of 1; KS and chi-square not rejected at Holm-corrected alpha 0.01 across
        the 18 cells; tails T1 (P_pred(max >= observed) >= 0.001), T2 (fraction with
        count >= 3 within 3 SE of Poisson), T3 (zero fraction within 3 SE of
        exp(-lambda)); T4 (counts at targets in S exceed Poisson) reported separately
      source: HEUR-F-1, HEUR-F-2 (IDEA validation_arm); Chen-Stein is a recalled pointer only
    - id: P7
      quantity: positive controls
      prediction: >-
        PC-A slope of log2(A/M mean ratio) against n - 1 within 0.15 of the value
        computed from B^n/C(B+n-1,n) at the actual B; PC-B as P5 (c); PC-C twin ratio
        exact as CTL-twin
      source: IDEA minimal_test.controls (c)
    - id: P8
      quantity: n = 1 anchor ratios
      prediction: every convention ratio equals 1 on every target
      source: IDEA nearby_object_control (a)
  scale_relevance:
    tier: toy
    justification: >-
      Arm A at Q up to about 2^26.6, arm C at Q about 2^30 to 2^31.7, n at most 7. The
      derivation, not the grid, carries any statement for all n. Transfer assumption
      (stated, HEUR-F-4 NOT SUPPORTED): behaviour at n <= 7 and the tested q says
      nothing about n = Theta(log q), the only regime where 2^{n-1} = q^{Theta(1)}.
    correspondence: null
  tail_checks:
    - T1 observed maximum count against the Poisson order statistic, P_pred(max >= observed) >= 0.001
    - T2 fraction of targets with count >= 3 against Poisson
    - T3 zero fraction against exp(-lambda)
    - T4 structural tail at targets in S, reported separately as a counter-sensitivity check
  replication:
    seeds: by the seed rules above; every derived seed is in the trial plan
    independent_instances: 3 curves per (n, q) in every arm
    recount: every arm-A cell is recounted independently (R1); a cell whose recount ends in failed_infrastructure is VOID
  variable_ledger:
    independent:
      - {name: n, levels: [1, 2, 3, 4, 5, 6, 7]}
      - {name: q_rung, levels: [1, 2, 3, 4]}
      - {name: factor_base_construction, levels: [line, matched_random, half_twin]}
    factors:
      - {name: field_modulus, treatment: fixed, value: least monic irreducible of degree n, how: one deterministic rule in the trial-plan generator for every arm}
      - {name: curve, treatment: randomized, how: three curves per (n, q) by the frozen seed rule, independent of arm and base}
      - {name: j_invariant_class, treatment: fixed, value: j(E) not in F_q, how: rejection in the curve generator}
      - {name: t2, treatment: measured, how: recorded per curve; matched between line and random bases; carried exactly in every identity}
      - {name: base_seed, treatment: randomized, how: base seed rule; the A/A arm redraws it}
      - {name: tuple_seed, treatment: randomized, how: tuple seed rule; the A/A arm redraws it}
      - {name: target_set, treatment: fixed, value: all N targets in arm A; generic targets by the frozen sampling rule in arm C, how: trial plan}
      - {name: counting_convention, treatment: crossed, how: A, M, S and X computed on every target of every arm-A cell}
      - {name: implementation_build, treatment: fixed, how: one commit of code/ bound by sha256 in the approval decision}
      - {name: point_counter, treatment: fixed, how: one counter with exhaustive cross-check below 2^27}
      - {name: host_load, treatment: measured, how: recorded per cell; wall time only, never a primary metric}
    comparisons:
      - {id: C-identities, arms: [line, matched_random, half_twin], differs_in: [], design: absolute, note: "each base read against the exact P1, P2 values"}
      - {id: C-line-vs-random, arms: [line, matched_random], differs_in: [factor_base_construction], design: one_factor}
      - {id: C-n-by-rung, arms: [n2..n5 x rung1..rung4], differs_in: [n, q_rung], design: factorial}
      - {id: C-twin, arms: [matched_random, half_twin], differs_in: [factor_base_construction], design: one_factor}
      - {id: C-locus-split, arms: [B2], differs_in: [], design: absolute}
      - {id: C-rule-agree, arms: [B1], differs_in: [], design: absolute}
      - {id: C-phi-n, arms: [B1 n2..n5], differs_in: [n], design: one_factor, note: "q varies with n by the fixed rung-2 rule; the comparator is computed per curve, so q enters only through the exact comparator"}
      - {id: C-poisson, arms: [C], differs_in: [], design: absolute}
      - {id: C-anchor, arms: [n1_anchor], differs_in: [], design: absolute}
      - {id: C-aa-baseseed, arms: [matched_random, matched_random_reseeded], differs_in: [base_seed], design: aa}
      - {id: C-aa-tupleseed, arms: [B1, B1_reseeded], differs_in: [tuple_seed], design: aa}
    crosses_map: true
