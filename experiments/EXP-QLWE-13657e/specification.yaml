# EXPERIMENT CONTRACT -- EXP-QLWE-13657e (review_required, unapproved, zero runs).
experiment:
  id: EXP-QLWE-13657e
  hypothesis_id: H-QLWE-f6140b
  derived_from_idea: IDEA-20261018-7fe944
  question_id: RQ-QLWE-1c4a3b
  goal_id: GOAL-QLWE-291164
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Positive/negative-control calibration of the toy step-audit simulator
  objective: >-
    Whether a dense statevector simulator can distinguish a known-broken quantum lattice step
    from a known-correct one at toy size
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Python 3, NumPy/SciPy dense statevector, exact output distributions; no sampling
      noise
    parameters: >-
      n in {2,3,4}; q in {17,31,61}; window widths w in {2,4,8}; amplitude truncation 1e-12;
      3 seeds for random secrets
    procedure: >-
      1. Transcribe Chen Steps 8-9 and Regev Fourier step into a frozen spec. 2. Implement
      both on one simulator core. 3. Compute exact distributions and asserted distributions.
      4. Report TV per cell. 5. Run A/A truncation check.
  controls:
  - >-
    null/negative: textbook Regev Fourier sampling step, whose distribution is proven, must
    give TV near 0
  - 'positive: Chen Step 9, publicly known to fail, must give large TV'
  - >-
    A/A: two runs differing only in amplitude truncation tolerance (1e-12 vs 1e-10) must agree
    to TV < 0.005
  independent_variables:
  - audited_step
  - toy_size
  metrics:
    primary:
    - max TV per audited step
    secondary:
    - TV vs n trend
    - runtime per cell
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: TV gap between steps
    formula: max_cells TV(chen) - max_cells TV(regev) >= 0.15
    source: retraction note recorded in KN-LIT-52ce4c
  scale_relevance:
    tier: toy
    justification: 'n<=4, q<=61, exact; transfer assumption: structural step errors are dimension-independent'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 18
  stopping_rules:
  - stop after all 9 cells x 2 steps x 2 tolerances
  - stop if Step 9 cannot be transcribed unambiguously; record as not reached
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - A/A TV > 0.005 invalidates the run
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C1 shows TV(chen) - TV(regev) >= 0.15 (P1, P2) and C2 shows TV >= 0.2 in some cell, with
    AA1 below 0.005 as noise floor
  falsification_criterion: C2 shows TV(chen) < 0.05 in every cell, or C1 shows TV(regev) >
    0.05 (P1 or P2 falsified)
  decision_impact:
    on_positive: Instrument admitted for the Simon and Luo step audits under this RQ
    on_negative: >-
      Instrument recorded as blind or biased; step audits proceed by prose adjudication only
      and the simulator is not cited
  variable_ledger:
    independent:
    - name: audited_step
      levels:
      - chen_step9
      - regev_textbook_fourier
    - name: toy_size
      levels:
      - n2_q17
      - n3_q31
      - n4_q61
    factors:
    - name: truncation_tol
      treatment: crossed
      value: 1e-12 or 1e-10
      how: run every cell at both tolerances
    - name: secret_seed
      treatment: randomized
      value: 3 seeds
      how: numpy default_rng seeds 1..3
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - chen_step9
      - regev_textbook_fourier
      differs_in:
      - audited_step
      design: one_factor
    - id: C2
      arms:
      - chen_step9 at all toy sizes
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - regev_textbook tol 1e-12
      - regev_textbook tol 1e-10
      differs_in:
      - truncation_tol
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-7fe944.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-7fe944.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
  - raw-result.json (per-trial records)
  - tv_table.csv
  - transcription.md of both steps with page/equation references
  - report.pdf with TV heatmap
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-QLWE-13657e/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-7fe944.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
