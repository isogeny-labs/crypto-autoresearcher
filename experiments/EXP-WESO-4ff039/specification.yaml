experiment:
  id: EXP-WESO-4ff039
  hypothesis_id: H-WESO-297876
  version: 1
  title: Per-entry modular-polynomial cost against the NIST-I Delfs-Galbraith gap
  status: review_required
  objective: At p=5*2^248-1 with B* from the Section 4.1 formulas, is the entry-weighted
    F_{p^2}-multiplication count c at least 2^Delta, where Delta is the recomputed
    gap to the Delfs-Galbraith line? c >= 2^Delta, so the listing correction lifts
    the NIST-I time lower bound to at least the Delfs-Galbraith line under the Section
    4.1 model.
  inputs:
    proposal: ledger/proposals/IDEA-20261016-fb1656.yaml
    design_protocol: experiments/EXP-WESO-4ff039/protocol.json
    design_packet: analysis/open-ideas-design-20261031/DESIGN.md
    cells:
      instances: 20
      replicates: 1
      warmups: 0
  controls:
  - 'A/A: C-aa'
  - 'positive: known-phi (the counted root count matches the hand value)'
  - 'negative: toy-l (a small prime l where the gap cannot be reached)'
  independent_variables:
  - arm
  metrics:
    primary:
    - log2_c
    - delta
    - algorithm_split
    secondary: []
  replication:
    seeds:
    - 20261031
    independent_instances: 20
  budget:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: null
    maximum_memory_gb: 16.0
    maximum_runs: 10
  stopping_rules:
  - 'fixed: 20 j values x both algorithms, batched routine written before the count,
    then stop'
  invalidation_rules:
  - a row whose instrument hash differs from the frozen build is excluded and reported
  - a control that fails its expected detection voids the clean cells it was meant
    to protect
  success_criterion: C-gap is supported when log2_c>=delta at the recomputed prime;
    c<2^Delta falsifies the lift, and a 2^Delta split between the algorithms falsifies
    the one-sided label.
  falsification_criterion: "c < 2^\u0394: the listing correction does not reach the\
    \ Delfs\u2013Galbraith line."
  required_artifacts:
  - experiments/EXP-WESO-4ff039/protocol.json
  - experiments/EXP-WESO-4ff039/runs/
  - experiments/EXP-WESO-4ff039/results/
  - experiments/EXP-WESO-4ff039/reports/
  assigned_to: executor-mechanical
  approved_by: null
