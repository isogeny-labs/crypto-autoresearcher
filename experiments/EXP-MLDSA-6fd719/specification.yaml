# EXPERIMENT CONTRACT -- EXP-MLDSA-6fd719 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-6fd719
  hypothesis_id: H-MLDSA-228a7b
  derived_from_idea: IDEA-20261018-0e598c
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Differential boundary fuzzing of ML-DSA verifiers
  objective: whether open ML-DSA verifiers agree on every boundary predicate
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Python harness calling C/Go/Rust verifiers via FFI or subprocess; pinned versions
    parameters: ML-DSA-44/65/87; 10^6 mutations per class per set; 9 classes
    procedure: >-
      1) Build pinned implementations. 2) Valid signature corpus. 3) Mutate. 4) Verify everywhere.
      5) Planted-bug arm.
  controls:
  - 'null: unmutated valid signatures (all accept)'
  - 'positive: planted <= vs < verifier'
  - 'A/A: same mutation stream under two run orders'
  independent_variables:
  - verifier
  - mutation_class
  metrics:
    primary:
    - disagreement count per class
    secondary:
    - coverage
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: planted detection rate
    formula: '1.0'
    source: harness design
  scale_relevance:
    tier: crypto
    justification: real parameters, byte-level
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop at 10^6 mutations per class
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - a disagreement is only recorded after reproduction on a fresh build
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: P1 in C1 and C2 reported completely; AA1 noise floor zero verdict changes
  falsification_criterion: C1 planted bug missed or AA1 shows nondeterminism
  decision_impact:
    on_positive: file disagreements with maintainers and publish the boundary corpus as a
      conformance asset
    on_negative: publish the corpus as evidence of agreement on these classes and close the
      class list
  variable_ledger:
    independent:
    - name: verifier
      levels:
      - pqclean
      - liboqs
      - awslc
      - rustcrypto
      - circl
      - planted_bug
    - name: mutation_class
      levels:
      - z_boundary
      - hint_order
      - hint_padding
      - omega_slot
      - length
    factors:
    - name: run_order
      treatment: randomized
      value: arm order shuffled per seed block
      how: interleave arms trial by trial with a recorded permutation
    - name: parameter_set
      treatment: crossed
      value: 44, 65, 87
      how: all arms on all three sets
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - pqclean
      - planted_bug
      differs_in:
      - verifier
      design: one_factor
    - id: C2
      arms:
      - disagreement table
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - all verifiers order A
      - all verifiers order B
      differs_in:
      - run_order
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-0e598c.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-0e598c.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLDSA-6fd719/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-0e598c.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
