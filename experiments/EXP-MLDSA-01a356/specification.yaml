# EXPERIMENT CONTRACT -- EXP-MLDSA-01a356 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-01a356
  hypothesis_id: H-MLDSA-51f61f
  derived_from_idea: IDEA-20261018-5b48f2
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Exact l-infinity MSIS ground truth vs sieve-pool model
  objective: whether the sieve-pool l-infinity model or the sqrt(m) conversion is calibrated
    at small m
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C++ box enumeration (custom, verified on planted instances), fpylll, G6K
    parameters: >-
      q = 8380417, m in {48,56,64,72}, module shapes from n in {8,16} with k,l giving m; B
      chosen so the expected count is 1..100; 10 instances per m
    procedure: >-
      1) Build instances. 2) Exact enumeration: lambda_inf and count below B. 3) G6K progressive
      sieve, record pool at each beta, find minimal beta with a hit. 4) Compare to both models.
      5) Planted control.
  controls:
  - >-
    null: random q-ary lattice with same determinant but no ML-DSA structure (A uniform, no
    module structure)
  - 'positive: planted short l-infinity vector of norm B/2'
  - 'A/A: same instance size under two seeds'
  independent_variables:
  - dimension_m
  - lattice_type
  - model
  metrics:
    primary:
    - measured minimal beta with l-infinity hit
    - pool-hit ratio
    secondary:
    - lambda_inf/B
    - count below B
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: P(hit in pool)
    formula: 1 - (1 - prod_i P(|g_i| <= B))^{|pool|}, g_i Gaussian with variance from GH
    source: Gaussian-coordinate model
  scale_relevance:
    tier: toy
    justification: m <= 72; transfer only of the model's functional form
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop enumeration per instance at 48 CPU hours, mark unresolved
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: P1 in C3 and P2 in C1; C2 shows no structure effect beyond AA1 noise
    floor (beta within 2)
  falsification_criterion: C3 ratio outside [0.25,4] at two m or C1 overstatement below 2
  decision_impact:
    on_positive: adopt the pool-hit model for l-infinity conversions in GOAL-MLDSA-001 estimates
    on_negative: >-
      flag both conversions as uncalibrated and require exact small-m checks before any l-infinity
      estimate is cited
  variable_ledger:
    independent:
    - name: dimension_m
      levels:
      - '48'
      - '56'
      - '64'
      - '72'
    - name: lattice_type
      levels:
      - module_mldsa_shape
      - plain_qary
    - name: model
      levels:
      - pool_hit
      - sqrt_m_conversion
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    - name: sieve_variant
      treatment: fixed
      value: G6K bgj1
      how: same sieve throughout
    comparisons:
    - id: C1
      arms:
      - pool_hit m64
      - sqrt_m_conversion m64
      differs_in:
      - model
      design: one_factor
    - id: C2
      arms:
      - module_mldsa_shape m64
      - plain_qary m64
      differs_in:
      - lattice_type
      design: one_factor
    - id: C3
      arms:
      - pool_hit over m grid
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - m64 seed-block A
      - m64 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-5b48f2.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-5b48f2.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
