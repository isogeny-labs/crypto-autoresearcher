# EXPERIMENT CONTRACT -- EXP-QLWE-b3e74e (review_required, unapproved, zero runs).
experiment:
  id: EXP-QLWE-b3e74e
  hypothesis_id: H-QLWE-9a946d
  derived_from_idea: IDEA-20261018-e477ad
  question_id: RQ-QLWE-1c4a3b
  goal_id: GOAL-QLWE-291164
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Adaptive vs fixed partition bias on identical randomness
  objective: Whether the unproved independence condition is where Simon's bias lives
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Python/NumPy exact enumeration sharing the signed-C audit core
    parameters: n in {6,8,10}; c=2; 200 secrets; partition sizes matched
    procedure: >-
      1. Reuse frozen transcription. 2. For each draw compute adaptive and fixed partitions.
      3. Exact bias and acceptance probability. 4. Null and positive controls. 5. A/A.
  controls:
  - >-
    null/negative: both partitions applied to a d with d_n uniformly resampled independent
    of the state (bias must be 0)
  - 'positive: fixed partition with Regev oracle erasure (bias near 1/2)'
  - 'A/A: adaptive arm under two seed blocks'
  independent_variables:
  - partition_rule
  - bit_length_n
  metrics:
    primary:
    - bias difference fixed minus adaptive
    secondary:
    - acceptance probability per arm
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: bias difference
    formula: bias_fixed - bias_adaptive >= 0.1
    source: KN-LIT-a2a423 abstract
  scale_relevance:
    tier: toy
    justification: 'n<=10; transfer assumption: the direction of the adaptivity effect is
      size-independent'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 12
  stopping_rules:
  - stop after 6 cells
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - null bias > 0.03 invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 shows a difference >= 0.1 and C2 shows adaptive bias <= 0.05 (P1,
    P2), AA1 noise floor
  falsification_criterion: C1 shows difference < 0.03 at all n, or C2 adaptive bias >= 0.15
    (P1 or P2 falsified)
  decision_impact:
    on_positive: >-
      Name the partition-independence condition as the failing hypothesis in the adjudication
      record
    on_negative: >-
      Record that adaptivity is not the carrier at toy size and look elsewhere (conditioning,
      recursion)
  variable_ledger:
    independent:
    - name: partition_rule
      levels:
      - adaptive_as_written
      - fixed_in_advance
    - name: bit_length_n
      levels:
      - '6'
      - '8'
      - '10'
    factors:
    - name: secret_seed_block
      treatment: randomized
      value: 2 blocks x 100
      how: rng seeds
    - name: acceptance_probability
      treatment: measured
      value: per cell
      how: recorded and reported next to bias
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - adaptive_as_written
      - fixed_in_advance
      differs_in:
      - partition_rule
      design: one_factor
    - id: C2
      arms:
      - adaptive_as_written all n
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - adaptive block A
      - adaptive block B
      differs_in:
      - secret_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-e477ad.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-e477ad.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
  - raw-result.json (per-trial records)
  - bias_by_partition.csv
  - report.pdf
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-QLWE-b3e74e/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-e477ad.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
