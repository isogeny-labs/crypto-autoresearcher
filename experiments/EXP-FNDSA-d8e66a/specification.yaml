# EXPERIMENT CONTRACT -- EXP-FNDSA-d8e66a (review_required, unapproved, zero runs).
experiment:
  id: EXP-FNDSA-d8e66a
  hypothesis_id: H-FNDSA-8d0b9d
  derived_from_idea: IDEA-20261018-ad2429
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Restart-rate homogeneity and conditioning factor
  objective: Check whether restarts can carry key information under exact and defective samplers.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C reference signer instrumented for restart counting; Python exact KL at toy
      n
    parameters: >-
      n = 512: 200 keys x 10^5 signatures; n = 64 toy: 20 keys, exact KL; planted defect size
      1e-2 relative width
    procedure: >-
      1. Instrument restarts. 2. Run exact and planted arms. 3. Chi-square homogeneity test.
      4. Compute kappa at toy n.
  controls:
  - 'null: high-precision sampler'
  - 'positive: planted width error proportional to a key feature (max leaf GS norm)'
  - 'A/A: exact sampler on two seed blocks'
  independent_variables:
  - sampler_arm
  - restart_condition
  metrics:
    primary:
    - homogeneity p-value
    - kappa
    secondary:
    - mean restart rate
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: homogeneity p under exact sampler
    formula: p > 0.01
    source: conditioning argument
  scale_relevance:
    tier: medium
    justification: rates at n = 512 on self-generated keys; kappa at toy n = 64
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    independent_instances: 2
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 4
    maximum_runs: 12
  stopping_rules:
  - stop when 200 keys x 10^5 signatures logged
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - signatures failing verification invalidate the block
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Exact arm satisfies P1 and C1 shows P2 with planted-arm heterogeneity p < 1e-3, beyond
    the AA1 noise floor.
  falsification_criterion: >-
    C1 shows no rate heterogeneity under the planted defect, or the exact arm is heterogeneous.
  decision_impact:
    on_positive: Add restart counts as a secondary observable in every FN-DSA detector.
    on_negative: Exclude restarts from the observation model.
  variable_ledger:
    independent:
    - name: sampler_arm
      levels:
      - exact_high_precision
      - planted_key_dependent_width
    - name: restart_condition
      levels:
      - norm_bound_only
      - norm_plus_slot
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: message_stream
      treatment: randomized
      value: SHAKE-derived
      how: per seed
    comparisons:
    - id: C1
      arms:
      - planted_key_dependent_width
      - exact_high_precision
      differs_in:
      - sampler_arm
      design: one_factor
    - id: C2
      arms:
      - norm_plus_slot
      - norm_bound_only
      differs_in:
      - restart_condition
      design: one_factor
    - id: AA1
      arms:
      - exact block A
      - exact block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-ad2429.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-ad2429.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml
