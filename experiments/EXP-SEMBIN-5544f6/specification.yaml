experiment:
  id: EXP-SEMBIN-5544f6
  hypothesis_id: H-SEMBIN-515f38
  version: 1
  title: Zero-background detector for intrinsic solution clustering at t=4..12
  status: review_required
  objective: With Poisson background <=1e-5, does the conditional extra-solution rate
    nu_t exceed the null at any cell t=4..12, and does the planted 2-torsion flip
    recover exactly 2^{t-1}-1? nu_t stays within the null bound in every cell while
    the planted flip recovers 2^{t-1}-1, so no intrinsic clustering is detected in
    the tested box.
  inputs:
    proposal: ledger/proposals/IDEA-20261017-3079bc.yaml
    design_protocol: experiments/EXP-SEMBIN-5544f6/protocol.json
    design_packet: analysis/open-ideas-design-20261031/DESIGN.md
    cells:
      instances: 5
      replicates: 1
      warmups: 0
  controls:
  - 'A/A: C-aa'
  - 'positive: planted-flip (nu equals 2^{t-1}-1 exactly)'
  - 'negative: curve-free (relabelled Z/N group, where no curve coincidence exists)'
  independent_variables:
  - arm
  metrics:
    primary:
    - extra
    - planted
    - nonrational
    secondary: []
  replication:
    seeds:
    - 20261031
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 16.0
    maximum_runs: 10
  stopping_rules:
  - 'fixed: five (t,k) cells x four families x 2e4 targets, then stop'
  invalidation_rules:
  - a row whose instrument hash differs from the frozen build is excluded and reported
  - a control that fails its expected detection voids the clean cells it was meant
    to protect
  success_criterion: C-null is supported when the planted control is recovered, the
    curve-free control is empty, and no cell exceeds the null bound; a missed planted
    control voids every clean cell, and events above the null at >=2 cells with a
    common pattern establish clustering.
  falsification_criterion: 'Planted control not recovered: detector blind, no cell
    may be called clean.'
  required_artifacts:
  - experiments/EXP-SEMBIN-5544f6/protocol.json
  - experiments/EXP-SEMBIN-5544f6/runs/
  - experiments/EXP-SEMBIN-5544f6/results/
  - experiments/EXP-SEMBIN-5544f6/reports/
  assigned_to: executor-mechanical
  approved_by: null
  source_idea: IDEA-20261017-3079bc
  derived_from_idea: IDEA-20261017-3079bc
