experiment:
  id: EXP-SEMAEV-6e9dcf
  hypothesis_id: H-SEMAEV-94dab2
  goal_id: GOAL-ECDLP-001
  question_id: RQ-ECDLP-002
  version: 1
  title: Second one-trial successor for the mtic-010b cell of EXP-SEMAEV-93d5cc (after EXP-SEMAEV-88c46c was interrupted)
  status: analyzed
  frozen: true
  approved_by: DEC-20261019-ebf1dc
  approved_at: '2026-10-19'
  execution_authorized: true
  designed_at: '2026-10-19'
  designed_under_task: TASK-20261019-11f651
  claim_tier: toy
  successor_of:
    experiment_id: EXP-SEMAEV-88c46c
    amendment: experiments/EXP-SEMAEV-88c46c/amendments/AMD-EXP-SEMAEV-88c46c-20261019-successor.yaml
    interrupted_run: RUN-SEMAEV-980e8c
    original_experiment: EXP-SEMAEV-93d5cc
    original_interrupted_run: RUN-SEMAEV-500a81
    dependency_runs:
      mtic-007: RUN-SEMAEV-2a8498
      mtic-008: RUN-SEMAEV-fcd67c
  class: evidence-integrity measurement (matched rerun, one substituted function); successor in scope to the approved,
    unrun EXP-DTREE-b93a15, whose fix-only bit-exact recomputation of the MTIC/FIB runs this contract contains as
    its repaired arm. EXP-DTREE-b93a15 keeps its status.
  objective: 'Run the parent contract''s mtic-010b cell, unchanged, once: RUN-MTIC-010b (20-bit ablation descents
    at B = 52 and 115, and the final aggregation of K* and regime per accounting) with the legacy and the repaired
    s4_expr concurrently, reading the parent''s output-validated mtic-007 and mtic-008 arm outputs as the RUN-MTIC-007/008
    inputs of each arm.'
  selection:
    rule: the single parent cell left unmeasured by the interruption; fixed by the amendment
    cells:
    - cell: mtic-010b
      archived: RUN-MTIC-010b
      scope: 20-bit ablation descents (B = 52, 115) and the final aggregation (K*, regime) on this arm's RUN-MTIC-007/008
        and the archived S4-independent runs
  arms:
    legacy:
      s4_source: experiments/EXP-SEMAEV-93d5cc/implementation/vendor/semaev_legacy_53a23952.py
      s4_source_sha256: 53a23952420f8ee724b70746eb7c872e54cbb33dc4cb24be1e88dcdcbef4817e
      note: byte-identical to harness/semaev.py at a2947025e2, 1ba846482a, 53d3fed02f and 76a48ff3d8 (the recorded
        commits of every exposed run)
    repaired:
      s4_source: harness/semaev.py
      s4_source_sha256: c417f1948d7df7bb1864726e169d885e4d3163cb62036393f2616ef71c630de6
    installation: arms.install assigns the consumer module's s4_expr name binding (run_mtic.s4_expr, harness.exp_icinv_e0cd8f_m3class.s4_expr,
      and driver.decompcost.s4_expr inside each spawn child via fib_child.solve and the EXP_S4RR_ARM environment
      variable). Nothing else is patched.
    pairing: both arms of a cell run as concurrent processes in one trial, so they share host and load
  input_bindings:
    legacy_semaev:
      path: experiments/EXP-SEMAEV-93d5cc/implementation/vendor/semaev_legacy_53a23952.py
      sha256: 53a23952420f8ee724b70746eb7c872e54cbb33dc4cb24be1e88dcdcbef4817e
    repaired_semaev:
      path: harness/semaev.py
      sha256: c417f1948d7df7bb1864726e169d885e4d3163cb62036393f2616ef71c630de6
  inputs:
    archived_runs:
    - experiments/EXP-MTIC-001/runs/RUN-MTIC-010b
    programs:
    - experiments/EXP-MTIC-001/code/run_mtic.py
    dependency_runs:
    - experiments/EXP-SEMAEV-93d5cc/runs/RUN-SEMAEV-2a8498
    - experiments/EXP-SEMAEV-93d5cc/runs/RUN-SEMAEV-fcd67c
    environment: 'This container: Linux x86_64, CPython 3.13, sympy 1.14.0 (as archived), Singular 4.4.1 from /opt/conda-sage/envs/sage
      (archived 4.3.2). The archive ran on macOS arm64 (MTIC, FIB) and an unrecorded Linux host (ICINV).'
  controls:
  - id: CTRL-LEGACY-REPRO
    method: 'Legacy arm against the archive, per cell, by the frozen rules in implementation/compare.py::legacy_control:
      icinv-m4 every one of the 552 (s4_support, singular-locus dim, degree, unit) tuples equal; fib-004/005 per-target
      (capped, basis size, basis max degree, trivial) equal on every target both measured, resource_exhaustion equal,
      all-capped pattern equal, n_measured within +-2; fib-decision correlation gate, curves passing and per-curve
      status equal; mtic-007/008 per-target tuples equal on common targets, uncapped count equal, n_attempted within
      +-2; mtic-010b regime, K* and uncensored counts equal per size and K* and capped pattern per ablation base.'
    pass_condition: every check of the cell holds
    on_fail: The cell's REPAIRED-vs-LEGACY contrast is still reported but labelled drift-confounded and decides
      nothing; the mismatch is itself recorded as an observation about the archive's reproducibility.
  - id: CTRL-ARM-FINGERPRINT
    method: 'check.py: each arm''s installed s4_expr has the pinned source sha256 and its frozen fingerprint on
      the EXP-SEMAEV-a097b5 fixture (y^2 = x^3 + 2x + 3, F_101, abscissae 1, 3, 5, 41): legacy free symbols {x1,
      x2, x4}; repaired {x1, x2, x3, x4}, total degree 12, residue 0. For FIB cells every spawn child logs its arm,
      module and source hash.'
    pass_condition: exact; a failure makes the trial invalid_output (instrument failure, not evidence)
  - id: CTRL-REEXTRACT
    method: check.py recomputes the comparison from the arm outputs and requires byte equality with raw-result.json
    pass_condition: exact
  - id: CTRL-IMMUNE-BY-IMPORT
    method: The excluded runs are classified IMMUNE by the call-site analysis under selection.rule; the report restates
      it per run.
    pass_condition: recorded
  independent_variables:
  - name: s4_arm
    levels:
    - legacy
    - repaired
  - name: cell
    levels:
    - mtic-010b
  metrics:
    primary:
    - per cell, the archived / legacy / repaired values of the S4-dependent outputs extracted by compare.extract
      (ICINV m4 tuple distributions and per-record differences; FIB n_measured, n_capped, n_solved, median cost,
      basis size and degree counts, resource_exhaustion; FIB correlation and gate fields; MTIC attempted, capped,
      trivial-ideal, cancelled counts and T_desc medians; MTIC-010b regime and K* per accounting)
    - per cell, CTRL-LEGACY-REPRO pass/fail with its checks
    - per cell and conclusion field, changed (repaired vs archived) and changed (repaired vs legacy)
    secondary:
    - ICINV records differing between arms (count of 552)
    - wall seconds per arm (host-dependent, never a cost claim)
  conclusion_rules:
    note: The recorded conclusion of each archived run, and the field whose change counts as a change of that conclusion
      (compare.conclusion_fields). A conclusion changes when the repaired arm's field differs from the archived
      one; it is attributed to the defect only when CTRL-LEGACY-REPRO passes for that cell and the legacy arm's
      field equals the archived one.
    mtic-010b: regime per accounting and K* per accounting at 16, 20 and 24 bits; K* per ablation base
  variable_ledger:
    independent:
    - name: s4_arm
      levels:
      - legacy
      - repaired
    factors:
    - name: archived_program
      treatment: fixed
      value: the committed run_mtic.py, driver/*.py and exp_icinv_e0cd8f_m3class.py, unmodified, bound by source_sha256
      how: both arms import the same files; only the s4_expr binding differs
    - name: instances_targets_seeds
      treatment: fixed
      value: the archived frozen-instances.yaml files, target streams and seeds, and the archived ICINV curve lists
      how: read in place (copied into the arm directory with sha256 where a program needs them under --out-root)
    - name: caps
      treatment: fixed
      value: archived per-solve and cumulative wall-clock caps and the 180 s Singular timeout
      how: program constants, unchanged
    - name: other_harness_functions
      treatment: fixed
      value: current tree (build_factor_base default byte-identical to legacy, CORR-20260813-d9f0fa)
      how: same process tree for both arms
    - name: execution_environment
      treatment: fixed
      value: within a trial both arms run concurrently on one host (this container, Linux x86_64, Python 3.13, sympy
        1.14.0, Singular 4.4.1)
      how: fixed between the arms of a cell; differs only between the archive (macOS arm64 for MTIC and FIB, Singular
        4.3.2 for ICINV, earlier dates) and this rerun, which is what CTRL-LEGACY-REPRO exposes; affects cap-truncated
        counts and timing
    comparisons:
    - id: C-defect
      arms:
      - legacy
      - repaired
      differs_in:
      - s4_arm
      design: one_factor
      note: per cell; decisive only where C-aa-legacy-archive passes
    - id: C-aa-legacy-archive
      arms:
      - archived run
      - legacy arm
      differs_in:
      - execution_environment
      design: aa
      note: same function, program and inputs, different machine and time; its mismatches are the drift floor C-defect
        is read against
    - id: C-repaired-archive
      arms:
      - archived run
      - repaired arm
      differs_in:
      - s4_arm
      - execution_environment
      design: confounded
      reason: two factors change at once; reported because the owner asked for archived-vs-repaired, decides nothing
        alone
    crosses_map: false
    crosses_map_note: no claim moves across a map; every arm runs the archived instance as stored
  prediction_provenance:
  - prediction: P3
    first_recorded_in: ledger/hypotheses/H-SEMAEV-94dab2.yaml
    written_at: '2026-10-18'
    data_seen:
    - path: experiments/EXP-FIB-001/runs/ and experiments/EXP-MTIC-001/runs/
      measured: the archived (legacy, other host) values the legacy arm is meant to reproduce
    - path: experiments/EXP-SEMAEV-93d5cc/runs/ (RUN-SEMAEV-2a8498, -fcd67c and the interrupted RUN-SEMAEV-500a81)
      measured: both arms capped every attempted MTIC descent at 60 s at 16, 20 and 24 bits; the interrupted attempt
        capped every ablation solve it reached
    - path: experiments/EXP-SEMAEV-88c46c/runs/RUN-SEMAEV-980e8c (interrupted)
      measured: every ablation solve both arms reached capped at 60 s
    sample_status: partially_in_sample
    overlap: the T_desc inputs of the aggregation are the parent runs; the ablation descents were partly observed
      in the interrupted attempt
    decisive_scope: the ablation descents at B = 52 and 115 beyond those the interrupted attempt reached, and the
      aggregation; the rest is calibration
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-cell change of the S4-dependent outputs between arms
    formula: none (measurement); P1 and P2 of H-SEMAEV-94dab2 are calibration checks
    source: H-SEMAEV-94dab2
  scale_relevance:
    tier: toy
    justification: the archived runs are toy-tier; the rerun reproduces their scale exactly and asserts nothing
      beyond it
    correspondence: null
  tail_checks:
  - every ICINV record has returncode 0 or an explicit timeout entry; timeouts are counted, never imputed
  - every FIB measurement records worker_error; a non-null worker_error is reported per arm
  replication:
    seeds: archived (MTIC seeds 1, 2, 3; FIB instance seeds 1, 2 and permutation seed 20260807; ICINV seed 20260810
      curve lists)
    independent_instances: as archived
    note: one execution per arm per cell; the archive is the replicate the legacy arm is compared with (C-aa-legacy-archive)
  invalidation_rules:
  - CTRL-ARM-FINGERPRINT or CTRL-REEXTRACT fails (instrument failure).
  - Any archived artifact or experiment directory other than experiments/EXP-SEMAEV-93d5cc/ is written.
  - An arm imports a different s4_expr than its pinned source, or any other function is substituted.
  success_criterion: 'Decidable per cell from the metrics: the cell measures the defect when both arms complete,
    CTRL-ARM-FINGERPRINT and CTRL-REEXTRACT pass, and CTRL-LEGACY-REPRO passes; then C-defect reports whether each
    conclusion field changed. The experiment succeeds as a measurement when every cell is decided either way.'
  falsification_criterion: 'Per cell (H-SEMAEV-94dab2): with CTRL-LEGACY-REPRO passing, the repaired arm equals
    the legacy arm on every S4-dependent output the cell records. A cell whose CTRL-LEGACY-REPRO fails decides nothing.'
  decision_impact:
    on_positive: Where a cell's repaired arm changes a recorded output with the legacy control passing, a CORR record
      names the archived run, the changed field, archived and repaired values, and binds this experiment's run as
      the superseding numerical record; where a recorded conclusion field changes, the Coordinator reviews the affected
      hypothesis on its own path (no status change follows from this experiment alone).
    on_negative: Where the repaired arm equals the legacy arm with the control passing, the archived run is recorded
      as numerically unaffected by the defect in that scope, and CORR-20260813-d9f0fa's comparison bar is lifted
      for it by a successor CORR record.
  measured_vs_modeled: every number is measured or read from an archived record; nothing is modelled
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 2
    maximum_memory_gb: 8
    maximum_runs: 1
    maximum_workers: 2
    note: advisory and machine protection only
  stopping_rules:
  - Run the single trial once; a crash, watchdog or process loss is failed_infrastructure for it, never evidence
    about the defect.
  - Nothing is rerun to change a CTRL-LEGACY-REPRO outcome.
  required_artifacts:
  - experiments/EXP-SEMAEV-6e9dcf/runs/RUN-SEMAEV-0e5876/ (manifest.yaml, raw-result.json, arms.tar.gz, arms-manifest.json,
    four arm logs, supervisor files)
  - reported in the parent experiment's run report and evidence review
  implementation:
    launcher: experiments/EXP-SEMAEV-6e9dcf/implementation/launch_successor.py
    note: imports the parent's hash-bound launch.py unmodified and sets only the manifest experiment id; the manifest
      code.command field names the parent launch.py, while command.txt records the actual argv
    worker: experiments/EXP-SEMAEV-93d5cc/implementation/worker.py
    checker: experiments/EXP-SEMAEV-93d5cc/implementation/check.py
    trial_plan: experiments/EXP-SEMAEV-6e9dcf/trial-plan.json
  assigned_to: executor
  inference_policy: executor-implementation
  execution_note: Both earlier attempts were lost to container restarts while the session was idle; this trial is
    run with the session kept active.
