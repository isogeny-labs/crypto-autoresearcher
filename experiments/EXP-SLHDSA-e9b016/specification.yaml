# EXPERIMENT CONTRACT -- EXP-SLHDSA-e9b016 (review_required, unapproved, zero runs).
experiment:
  id: EXP-SLHDSA-e9b016
  hypothesis_id: H-SLHDSA-6b5a76
  derived_from_idea: IDEA-20261018-8d765b
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Grafting forgery count by faulted layer at reduced h,d
  objective: >-
    How many faulty signatures a grafting forgery needs per layer, and whether recompute-and-compare
    removes it.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python 3 toy SLH-DSA (shared with lane tooling), SHAKE256 truncated to 16 bytes, independent
      verifier module
    parameters: >-
      h in {8,12}; d in {2,3,4}; w=16; n=16 bytes; 200 attack trials per cell; grinding budget
      2^24 per attempt; countermeasure arm 10^4 faults
    procedure: "REVIEW HOLD PR2404 entry 83: WOTS checksum antichain and minimum reachable chain index. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-SLHDSA-e9b016/specification.yaml. A corrected prospective procedure is required; the archived procedure is withdrawn from execution consideration."
  controls:
  - 'null: unfaulted signer, same query budget, forgery rate must be 0'
  - >-
    positive: fault always on the same parent key with attacker-chosen flip, where the forgery
    must arrive in the minimal count
  - 'A/A: layer d-2 arm under two seed blocks'
  independent_variables:
  - faulted_layer
  - countermeasure
  metrics:
    primary:
    - median faulty signatures to verified forgery
    secondary:
    - grinding attempts per forgery
    - countermeasure detection rate
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: expected faulty signatures to forgery
    formula: "REVIEW HOLD PR2404 entry 83: WOTS checksum antichain and minimum reachable chain index. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-SLHDSA-e9b016/specification.yaml. The archived prediction is not an accepted cost or correctness model."
    source: WOTS+ domination count
  scale_relevance:
    tier: toy
    justification: 'h,d,n reduced; transfer assumption: count depends on w and reuse rate,
      not n'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 4
    maximum_runs: 30
  stopping_rules:
  - stop each cell after 200 trials or 2 CPU-hours
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - a forgery that fails the independent verifier is discarded and the trial marked invalid
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: "REVIEW HOLD PR2404 entry 83: WOTS checksum antichain and minimum reachable chain index. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-SLHDSA-e9b016/specification.yaml. No success verdict is defined until a corrected prospective contract is independently reviewed."
  falsification_criterion: "REVIEW HOLD PR2404 entry 83: WOTS checksum antichain and minimum reachable chain index. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-SLHDSA-e9b016/specification.yaml. No hypothesis verdict follows from this static protocol correction."
  decision_impact:
    on_positive: "Blocked pending corrected prospective design and Coordinator approval; retain all hypothesis and direction statuses."
    on_negative: "Blocked pending corrected prospective design and Coordinator approval; a capped or undefined comparison is not mathematical negative evidence."
  variable_ledger:
    independent:
    - name: faulted_layer
      levels:
      - '0'
      - d-2
    - name: countermeasure
      levels:
      - none
      - recompute_compare
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    - name: fault_bit_location
      treatment: randomized
      value: uniform over root bits
      how: drawn per fault from seed
    comparisons:
    - id: C1
      arms:
      - layer d-2 none
      - layer 0 none
      differs_in:
      - faulted_layer
      design: one_factor
    - id: C2
      arms:
      - layer d-2 none
      - layer d-2 recompute_compare
      differs_in:
      - countermeasure
      design: one_factor
    - id: C3
      arms:
      - unfaulted null
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - layer d-2 none seed-block A
      - layer d-2 none seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
