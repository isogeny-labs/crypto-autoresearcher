  title: Hybrid vs primal across the transition on x^p - x - 1
  objective: Measure hybrid gain below and above the measured fatigue transition.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath, fpylll BKZ 2.0, C MITM table, certificate checker
    parameters: >-
      p in {61, 73, 89, 101, 113}; q levels {0.5x, 1x, 2x measured q*}; r in 0..30; 10 instances
      per cell
    procedure: >-
      1. Generate instances. 2. Locate q* per p (reuse goal's sweep). 3. Run primal BKZ to
      success. 4. Run hybrid for each r. 5. Certify recovery. 6. Compare work.
  controls:
  - >-
    null: matched random lattice of same dimension and determinant with no planted secret
    (both attacks must fail)
  - 'positive: very low weight secrets where the hybrid must win'
  - 'A/A: primal arm on two seed blocks'
  independent_variables:
  - attack_arm
  - q_level
  - ring_degree_p
  metrics:
    primary:
    - work ratio
    secondary:
    - optimal r
    - Babai success rate
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: work ratio at p=101 below transition
    formula: '>= 2'
    source: KN-LIT-2084 cost model
  scale_relevance:
    tier: toy
    justification: p <= 113; slopes transferred with CI only
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    independent_instances: 10
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 120
    maximum_memory_gb: 32
    maximum_runs: 150
  stopping_rules:
  - censor cells at 2 hours
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - uncertified recovery not counted
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 gives P1 below transition and C2 gives P2, beyond the AA1 noise floor.
  falsification_criterion: C1 ratio below 1.2 at every p below transition.
  decision_impact:
    on_positive: Report hybrid distance alongside fatigue distance for NTRU Prime shapes.
    on_negative: Report fatigue distance only; hybrid adds nothing at these shapes.
  variable_ledger:
    independent:
    - name: attack_arm
      levels:
      - primal_bkz
      - hybrid_mitm_best_r
    - name: q_level
      levels:
      - below
      - near
      - above
    - name: ring_degree_p
      levels:
      - '61'
      - '73'
      - '89'
      - '101'
      - '113'
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: core_pinning
      treatment: fixed
      value: one isolated core
      how: taskset
    comparisons:
    - id: C1
      arms:
      - hybrid_mitm_best_r
      - primal_bkz
      differs_in:
      - attack_arm
      design: one_factor
    - id: C2
      arms:
      - hybrid gain below
      - hybrid gain above
      differs_in:
      - q_level
      design: one_factor
    - id: AA1
