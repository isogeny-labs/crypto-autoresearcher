    disjointness: >-
      j3_recount.py (sha256 d4a9e72972a8bfad00f034ea57837eb0211cad8d9702e2b04ee14d608f6cdfc2) imports nothing from
      the implementation directory and never calls labelsum.c, run.py, check.py or curve.py. Its own code covers
      Miller-Rabin, the Legendre symbol, a Cipolla square root (Tonelli-Shanks is the vendored method), and affine
      chord-and-tangent add and left-to-right double-and-add on y^2 = x^3 + a x + b over F_p, with (p, a, b) from
      the job record. The producer builds multiples by repeated addition tables, a different path. The half-box
      ([-T,T]^r lexicographic, coordinates ascending from -T, first nonzero positive) and
      T = least with ((2T+1)^r - 1)/2 >= ceil(1.02 n) + 8 come from the hypothesis and specification text. So do
      the null builder (uniform x in [0, p), keep if f(x) is a nonzero square, skip repeats) and the plant builder
      (x0 = randrange(p), w = randrange(1, p), the first m AP terms in L, m least in [4, n/2] with
      internal(m) >= 0.30 x mean null_C under exact rational comparison, fill by the null rule skipping labels
      already present). C = sum binom(m_s, 2) and D = #{s : m_s >= 1} are counted by brute force over all
      unordered pairs of distinct labels with collections.Counter. The producer derivations it uses are those the
      plan allows: the seeded stream labels and the Curve.random_point draw semantics, re-typed. run.py's
      gap_builder and classify sections were read only after this script was frozen.
