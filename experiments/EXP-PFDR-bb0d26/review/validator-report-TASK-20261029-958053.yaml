observations:
  - >-
    No 3.11.15 tolerance was needed. Exact byte reproduction of analyze-main and analyze-final under the manifest
    interpreter version is now observed by an audit replay. Before, it rested only on the in-process diagnostic
    cited by DEC-20261029-5554ee (its stated limitation). The interpreter build differs (uv Clang 22.1.3 build vs
    the recorded GCC 13.3.0 build of 3.11.15), and the bytes are still identical.
  - >-
    Environment drift note (DEC-20261029-5554ee interpreter parity): the control interpreter 3.13.17 differs from
    the manifest's 3.11.15. Its output differs only in float leaves, all inside rel 1e-9 / abs 1e-12, matching the
    audit pattern exactly.
  - >-
    Report page 1 prints "Commit: 98ab449608ff6eb12d053e68a5dc2143fc22d286". That is the runbook session's
    opening commit (attempt 1, 2026-10-22), not the runs' commit 48bd193a. 98ab4496 is an ancestor of 48bd193a,
    and `git diff --stat` between them is empty for experiments/EXP-PFDR-bb0d26 and H-PFDR-727bfc. Not a run id
    or value misstatement, but a reader could take it for the code commit of the runs.
  - >-
    Report page 1 lists census_main_failed_infrastructure 0 and does not show the 4 degenerate jobs, because the
    runbook defines no degenerate metric. That is correct as written, but the invalid cell is visible only in
    raw-result.json invalid_reason and analysis*.json.
  - >-
    No ok record in the 6653 has a duplicate or infinity skip, while the expected number of short base-point
    relations (|d_i| <= 2T) over all r >= 2 jobs is H/N = 7.06. The own-code scan of all 4438 r >= 2 jobs
    (j3_relation_scan.py, j3-relation-scan.json) finds 5 jobs with a relation: the 4 degenerate ones and
    b20-r3-n2048 c=23 with d = (16, 3, 9). In the latter, every half-box pair sharing a label has first
    coordinate T = 8, a layer the enumeration never reaches: collection stops at 2048 labels inside the c1 = 7
    layer, and 2167 vectors precede c1 = 8. So its recorded duplicate_skips of 0 is correct, and the own rebuild
    agrees. The zero is chance plus layer position, not a builder defect.
  - >-
    analysis-main.json and analysis.json differ in one leaf only, /stage ('main' vs 'final'). This is consistent
    with an empty replication block.
  - >-
    Hook interaction: the repository's checkpoint PreToolUse hook classified the background J3 recount as an
    experiment run, and its own script errored (scripts/checkpoint.sh line 297). The hook's own instruction to
    prefix CHECKPOINT_SKIP=<reason> was followed for the recount, the check.py re-runs and the diagnostics, with
    reasons stating each is an audit of recorded sets, not an experiment run. No .resume checkpoint was written
    and no run launcher was used.
  - >-
    The vendored uv CPython 3.11.15 lacks PyYAML. Any future replay contract that names an interpreter should
    also name the manifest-writing dependency, or the replay cannot start. This is infrastructure, recorded so
    TASK-20261029-1bcf80 can see it.
