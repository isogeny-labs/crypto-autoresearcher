    - J1 under CPython 3.11.15 reproduces byte for byte raw-result.json, analysis-main.json, analysis.json, flags.json, selftest.json, design.json and toy-rep-jobs.jsonl, plus stdout/stderr and check.py stdout/stderr, for analyze-main, analyze-final, selftest and census-toy-rep.
