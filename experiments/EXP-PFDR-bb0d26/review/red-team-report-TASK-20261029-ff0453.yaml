      per_cell_note: >-
        M is rounded to 8 significant digits; the recorded M is in analysis.json. mde_abs_kappa_minus_1_at_absz_gt_4
        = 4 sqrt(1.05 V) / M. true_delta_read_non_null_ge95pct = 0.05 + 1.645 sd, with sd the larger of the V-based
        and the interval-based sd (normal approximation).

    # ---------------------------------------------------------------- Q2 correlation
    Q2_correlation:
      answer: >-
        Shared curve sets induce no measurable correlation, because base points and null sets are seeded per
        (cell, curve) and the matched comparison cancels curve-level variation. Neither the tail check nor the
        calibration gate becomes a non-test. Separately, an omnibus statistic that was not preregistered shows the
        log-GAP z-scores more dispersed than N(0,1); see O3. That is not a correlation effect.
      measured_correlation: >-
        Per-curve standardized residuals were correlated between every pair of powered cells at the same bits over
        their shared curves: 91, 105 and 105 pairs. Log-GAP arm mean rho: -0.001 (bits 20), +0.016 (bits 24), -0.010
        (bits 28). A/A arm (replicate 0 against 1..19) mean rho: -0.017, -0.018, -0.010. The pair Fisher z scaled by
        sqrt(n_shared - 3) has mean +0.016 and sd 0.958 (log-GAP) and mean -0.104 and sd 0.964 (A/A), as expected
        with no shared component. Recorded in rt_analysis.json shared_curve_correlation.
      tail_check: >-
        Under independence, E[max |z|] over 44 cells is 2.46 and P(max |z| >= 3.13) is 0.073. P(at least one |z| > 3)
        is 0.111, against 1 observed (b24-r1-n2048, z -3.13). With within-bits equicorrelation rho = 0.05 (above the
        estimate) these become 0.073 and 0.112. At a stress rho = 0.3 they are 0.070 and 0.104. The max-|z| and
        count-above-3 checks are unremarkable at any plausible correlation.
      calibration_gate: >-
        Simulated false-failure rate of the C4 gate: 3.9% at rho 0 (R1 says about 3%), 9.3% at rho 0.05, 15% at
        rho 0.1, 37% at rho 0.3. The gate passed, with z_cal sum of z^2 = 44.9 on 44 (p 0.44) and |mean| 0.268 (P = 0.077 under
        independence). Its power against moderate miscalibration is low: P(pass) is 0.40 if the true sd of z is
        1.3, 0.07 if 1.5, and 0.36 if the mean is shifted by 0.4. It certifies gross calibration only (objection O6).
      forty_four_independent_nulls: >-
        It is fair to treat the 44 cells as approximately independent for the tail check and the gate. They are not
        44 independent confirmations of randomness. They are 44 non-rejections, at a 5% tolerance, of one
        construction on one grid.

    # ---------------------------------------------------------------- Q3 invalid cell
    Q3_invalid_cell:
      answer: >-
        Under the frozen outcome rule the invalid cell only reduces scope: fraction_valid is 0.978, at least the 0.80
        required, and every valid cell is null, so O-NULL is reached legitimately. As a statement about the 45-cell
        grid, P1 is not observed at b20-r3-n4096. P1's own words, "every powered toy cell", are met there only
        vacuously: powered is null at that cell, because the invalid class is checked before the power test. So no
        record may say P1 holds "in every cell of the grid". The missing curves are also not missing at random (see
        degenerate_meaning).
      degenerate_meaning: >-
        In run.py gap_builder, status degenerate means the frozen half-box was exhausted before n distinct labels. T
        is chosen by vector count: T = 10 gives 4630 vectors against 4186 needed. It is not chosen by distinct-label
        count. Replaying the 4 jobs from recorded seeds (rt_degenerate_replay.py) reproduces gap_meta exactly. In each
        job the three seeded base points satisfy one primitive integer relation v.(P_1, P_2, P_3) = O, verified by
        scalar multiplication:
        c 6 v (5, 2, -14);
        c 30 v (13, 9, -8);
        c 42 v (1, -11, 5);
        c 47 v (4, -8, 3), together with its double.
        The sup-norms are 8 to 14. Because of the relation, half-box vectors collide in label, and the box holds only
        3566, 4006, 3030 and 2641 distinct labels. This is a mathematical event of the random draw, not an
        infrastructure failure. The frozen rule's "invalid, never null" is the conservative and correct reading.
      proper_gap_restriction: >-
        Every one of the 6653 ok jobs records duplicate_skips = 0. A replay of all 496 ok bits-20 jobs with r = 2 or 3
        reproduces this exactly. So no measured log-GAP carries an exposed relation. The only four improper
        (relation-bearing) log-GAPs drawn in the whole census all fell in b20-r3-n4096 and were excluded without being
        measured. Those are the instances an alternative of label structure from group structure would favour most.
        The frozen geometry predicts 4.72 relation-bearing curves: 1.50 in the invalid cell and 3.22 elsewhere. 4 and
        0 were observed. The total is consistent; P(0 elsewhere) = 0.04 and P(at least 4 in the cell) = 0.066 are
        chance-level. The tested population is proper log-GAPs (objection O2).
      descriptive_only: >-
        The 46 ok curves of b20-r3-n4096 give kappa 0.99999 (z -0.43). This is not a reading and must never be cited
        as one: the 4 missing triples are exactly the relation-bearing ones.

    # ---------------------------------------------------------------- Q4 scope
    Q4_scope_and_decision_impact:
      attacked_sentence_1: >-
        "the reading is a scoped closure of label-describable rank <= 3 log-GAP bases at the toy sizes tested"
        (decision_impact.on_positive; also DEC-20261022-a8c780 rationale, DEC-20261022-f1efde rationale, and
        H-PFDR-727bfc falsification_conditions[0]).
      attack_1: >-
        The measurement is C, the h = 2 nontrivial pair-sum (additive-energy) count of x-labels. A label set whose
        C is random-like is shown not to be label-additively structured: it is not a dense subset of a small-doubling
        label set or a label AP or GAP. The plant calibrates this. A planted-type label AP of only 2 to 47 labels
        (0.3% to 3.2% of n; rt_ap_bound.json, a scaling estimate) would already push each cell outside its recorded
        interval. "Label-describable" means having a label-defined membership test, which is a much wider class. A
        set can have random h = 2 energy and still be cut out by a non-additive predicate: multiplicative structure,
        algebraic or polynomial conditions, other coordinates or models, or structure first visible at h >= 3. The
        observation-fiber attack holds C fixed and varies the predicate class, and C does not separate describable
        from non-describable sets. The closure sentence must name the measured property.
      attacked_sentence_2: >-
        "The implicit-membership route of KN-OPEN-020 for the unknown-sharing base of IDEA-20261017-bbc53e is then not
        opened by a label predicate at these sizes."
      attack_2: >-
        (a) Wrong object. The bbc53e base is F' = {cP : P in F_0, 1 <= |c| <= c_0} with c_0 = N^gamma. It is a union
        of many rank-1 progressions on independent base points, each of length c_0, about 2 to 28 at gamma 0.05 to 0.15
        and the bbc53e sizes of 20 to 32 bits. The tested object is one fixed-origin rank <= 3 half-box of 256 to
        4096 labels. At c_0 <= 28 a single progression holds too few quadruples for any coincidence count to see
        structure inside it. Cross-progression coincidences are random under independence whatever this experiment
        found, so the tested cells neither cover nor bound F'.
        (b) Wrong breadth. KN-OPEN-020 lists high-degree interpolation descriptions, multiple constructible
        predicates, target-dependent descriptions, and implicit membership or source-recovery algorithms. An h = 2
        energy null removes none of these in general. It removes one sub-route at these sizes: a label-additive
        (small-doubling) predicate for proper log-GAP label sets.
        (c) Target dependence. Translated boxes x(Q + cP), the target-dependent form, are untested (R4).
        Each sentence states toy sizes, so this overreach is in property and object, not in size or curve. It is a
        wording correction, not a break (O1).
      closes: >-
        For x-labels (R1) of proper rank-r log-GAP half-boxes (r in {1, 2, 3}; fixed origin; one representative per
        +-c; lexicographic fill; T minimal by vector count) of n in {256, 512, 1024, 2048, 4096} labels, on generated
        prime-order ordinary curves of 20, 24 and 28 bits (main seed block 8,100,000 + c; 50 to 1440 curves per cell),
        in 44 of 45 cells, the pooled nontrivial pair-sum coincidence count matches the matched uniform-label null
        within 5%. Observed |kappa - 1| is at most 0.0414 overall, at most 0.0089 at n >= 1024 and at most 0.0024 at
        n >= 2048. A true homogeneous |kappa - 1| of at least 0.079 (weakest cell) would have been read non-null with
        95% probability. These label sets carry no label-additive structure of the kind the planted AP represents,
        beyond 2 to 47 labels (a scaling estimate). This is a closure of the label-additive (h = 2) route only.
      leaves_open:
        - "cell b20-r3-n4096 (not assessed) and improper log-GAPs with a short relation among the P_i (the only 4 drawn were excluded unmeasured)"
        - "label predicates other than additive energy: multiplicative, algebraic or polynomial, constructible, interpolation-based, source-recovery; coincidence order h >= 3"
        - "y-labels and other coordinates or curve models (Montgomery, Edwards, Jacobian, compressed encodings)"
        - "translated boxes x(Q + cP), i.e. target-dependent bases; other fills or orders; full boxes with both lifts; rank >= 4; non-GAP bases"
        - "the shared-unknown base of IDEA-20261017-bbc53e: unions of many short rank-1 progressions with c_0 = N^gamma, about 2 to 28"
        - "n < 256 or n > 4096; p outside 20 to 28 bits; any growth law in n or p (the log-kappa slope is descriptive within 256 to 4096 only)"
        - "j = 0 and j = 1728 curves, anomalous curves, cofactor curves and subgroups (excluded by the generator), and any standardized curve"
        - "exact random-set behaviour: support is at the 5% tolerance, and an exploratory omnibus test shows small cell-level deviations (O3)"
        - "KN-OPEN-020 as a whole (stays open), and any cost, exponent, attack or security consequence"

    # ---------------------------------------------------------------- Q5 cheapest control
    Q5_cheapest_falsification_control_not_run:
      control: >-
        Improper-GAP recount on the four recorded degenerate triples of b20-r3-n4096 (main block, c = 6, 30, 42, 47).
        These are the only relation-bearing log-GAPs the census drew, and the frozen rule excluded them unmeasured.
        Count C on their 3566 / 4006 / 3030 / 2641 distinct half-box labels against 20 matched-size uniform label sets
        on the same curve. Optionally, also extend the scan past T = 10 to 4096 distinct labels, as a declared variant.
        It needs a versioned protocol amendment, because it makes new counts. It costs seconds: 4 sets plus 80 null
        sets at n about 3000 on 20-bit curves.
      why_discriminating: >-
        A short relation is the most group-structured configuration a rank-3 log-GAP can take. If group structure
        leaks into label-additive structure anywhere at these sizes, these sets are where it should show. Precision
        is high: per-set relative sd of C is about 0.03% at n about 3000 and p about 2^20, so a 1% excess would sit at
        z about 30 per set. A null there lifts the proper-GAP restriction of O2 for this case; an excess there is a
        lead.
      runner_up: >-
        A replication-block re-run of the six cells with |z| > 2: b20-r1-n4096, b20-r3-n256, b24-r1-n2048,
        b24-r3-n2048, b28-r1-n256, b28-r2-n512. That is 1729 jobs at seed 8,200,000 + c, and could be extended to the
        r = 3 stratum. It tests whether the cell-level shifts behind O3 replicate in sign, which separates chance from
        a small structural deviation. The frozen census-toy-rep machinery runs it, but an amendment is needed because
        no cell was flagged.
      for_the_consequence_sentence: >-
        Before any statement about the bbc53e base, run the same kernel on its actual shape: the x-label union
        of {x(cP) : 1 <= c <= c_0} over |F_0| independent P at c_0 = N^gamma. The translated rank-1 box x(Q + cP) is
        the matching control for target dependence.

    # ---------------------------------------------------------------- Q6 claim sentences
    Q6_no_cost_exponent_attack_realcurve_security_sentence:
      result: pass
      method: >-
        A case-insensitive grep for exponent, speedup, cost, attack, secp256k1, P-256, security, asymptot,
        real-curve, standardized, deployed, cryptographic and rho, followed by a read of every hit. Files:
        specification.yaml, reports/run-20261022T1218Z/report.typ, reports/run-20261023T2211Z/report.typ,
        DEC-20261022-a8c780, DEC-20261022-f1efde, DEC-20261022-9aec2b and DEC-20261029-5554ee. Hit counts: 38, 1, 1,
        25, 15, 9 and 3.
      classification: >-
        No hit asserts a cost, exponent, attack, real-curve, security or asymptotic result from this experiment. The
        hits fall into five kinds:
        (1) negations and limitations, for example spec lines 49-51, 434-435, 565-567 and 592-601, the report's "No
        speedup, no cost against rho and no statement beyond the toy scope is claimed", and the decisions'
        limitations blocks;
        (2) the held real-curve extension described as held, in R3, R9 (including "at 256 bits the random-set mean is
        about 2^-208", an expectation for the unapproved extension, not a datum), held_extension and out_of_scope;
        (3) the conditional on_negative plan, "costed follow-up ... matched Pollard rho control ... never an attack
        claim", which was not triggered;
        (4) attributions of bbc53e's pricing, "tau = (h/(2h-1))(1 - gamma), never below 1/2 unless kappa exceeds U",
        in H-PFDR-727bfc mechanism and tradeoff_note and in DEC-20261022-a8c780 exponent_bias, each saying it asserts
        or moves no exponent;
        (5) process uses, for example "attack inputs" in DEC-20261029-5554ee.
        Both report.typ files contain no reading at all.
      fidelity_note: >-
        H-PFDR-727bfc falsification_conditions[0] calls the closure clause "(IDEA-20261017-078074, first clause,
        unadjusted)". The idea's clause reads "Every toy cell within 5%, and zero coincidences on both real curves,
        closes label-describable log-GAPs at the tested sizes". The hypothesis dropped the real-curve conjunct, which
        is legitimate under R3, and added the plant condition. So the clause is adjusted, and the label should say so
        (O5).

  # ---------------------------------------------------------------- proves_too_much
  proves_too_much:
    - object: planted label AP arm (C3)
      known_true: structured
      test: >-
        The frozen class rule was applied to the plant statistics of every powered cell, with a reviewer-seeded
        2000-resample curve-cluster bootstrap of plant_kappa.
      result: pass
      detail: >-
        44 of 44 powered cells read flagged and none read null. plant_kappa runs from 1.2885 (b20-r2-n4096) to
        1.5623. plant_z is at least 21.93 (b24-r2-n256). The lowest bootstrap 95% lower bound is 1.2877. The
        attenuated plant at a heterogeneous delta of 0.10 reads null with probability at most 0.10 (b24-r1-n256).
      where_it_could_survive: >-
        The plant is planted label structure, a label AP that does not arise from the group. It shows that the kernel
        and class rule see label-additive excess. It does not show sensitivity to the group-to-label pathway H1 is
        about (O7).
    - object: invalid cell b20-r3-n4096
      known_true: not assessable
      result: pass
      detail: >-
        analysis.json has cls invalid, powered null, planted_recovered null and replication null. The cell is
        excluded from powered_cells (44) and from calibration (n 44), and counted invalid in fraction_valid (44/45).
        DEC-20261022-9aec2b records P1 and P2 as NOT ASSESSABLE there. No record reads it as null. The 46-curve
        descriptive kappa must stay unread.
    - object: >-
        known-false sentence "O-NULL at p up to 2^28 and n up to 4096 shows that log-GAP x-labels are random on
        secp256k1 or P-256, or that the random-set law holds asymptotically"
      known_true: false
      result: pass
      detail: >-
        No record of the experiment implies it. The specification's heuristic_criterion, interpretation_limits and
        R10, the hypothesis's interpretation_limits, and the limitations of DEC-20261022-a8c780, -f1efde, -9aec2b and
        DEC-20261029-5554ee all disclaim it explicitly. The one overreach found (O1) is in property and object scope at
        toy sizes. It is not a real-curve or asymptotic statement.
    - object: A/A comparisons (C-aa-null and C-aa-curves) under the flag rule and the class rule
      known_true: no effect
      result: pass
      detail: >-
        Null replicate 0 against 1..19, per cell: 0 of 44 flagged, 0 intermediate, 44 null. kappa_aa runs from 0.9728
        to 1.0219, and z equals the recorded z_cal in every cell. Leave-one-replicate-out (j = 0..19, 880
        comparisons): 0 flagged, 2 intermediate, 878 null. |z| > 4 in 0 (0.056 expected), |z| > 3 in 4 (2.38
        expected), |z| > 2 in 45 (40.0 expected). Even against odd curves (ratio kappa_even / kappa_odd, z from the
        V-based variances, stratified bootstrap): 0 of 44 flagged and 2 intermediate (b24-r1-n256 ratio 1.111, z
        3.24; b24-r3-n256 ratio 1.051). Sum of z^2 is 40.5 on 44 (p 0.62). The flag rule fires on no A/A comparison,
        so it does not flag above the nominal rate (nominal |z| > 4: 6.3e-5 per comparison).
  proves_too_much_failure_signature_observed: none

  # ---------------------------------------------------------------- objections
  objections:
    - id: O1
      severity: must-fix wording before the evidence record
      text: >-
        The pre-registered consequence overreaches in property and object scope. "Scoped closure of
        label-describable rank <= 3 log-GAP bases" and "the implicit-membership route of KN-OPEN-020 for the
        unknown-sharing base of IDEA-20261017-bbc53e is then not opened by a label predicate" go beyond the
        measurement. The measurement is h = 2 additive energy of x-labels of proper, fixed-origin rank <= 3
        half-boxes of 256 to 4096 labels. The bbc53e base is a union of short rank-1 progressions (c_0 = N^gamma,
        about 2 to 28) and was not tested. KN-OPEN-020's implicit-membership class is wider than additive predicates.
        The same wording appears in decision_impact.on_positive, DEC-20261022-a8c780, DEC-20261022-f1efde and
        H-PFDR-727bfc falsification_conditions[0].
    - id: O2
      severity: must disclose
      text: >-
        The tested population is proper log-GAPs only. No measured set carries an exposed relation: duplicate_skips is
        0 in all 6653 ok jobs, replayed for the 496 ok bits-20 jobs with r = 2 or 3. The only four relation-bearing
        draws (sup-norm 8 to 14) made b20-r3-n4096 invalid and were never measured. These are the instances most
        favourable to the alternative, and their absence is selection, not chance missingness.
    - id: O3
      severity: must disclose (unexpected observation, AGENTS rule 8)
      text: >-
        The 44 log-GAP z-scores are over-dispersed. This test was not preregistered. Sum of z^2 = 71.43 on 44
        (p 0.0055 under independence; 0.0063 at rho 0.05; 0.046 at a stress rho of 0.3). Population sd is 1.262,
        which would fall outside the C4 band if applied to this arm. 6 cells have |z| > 2 (2.0 expected, p 0.014),
        and 6 intervals exclude 1 (2.2 expected, p 0.022). The null-vs-null arms show none of this (z_cal 44.9 on 44;
        even/odd 40.5 on 44). Per-curve variance matches the null: pooled mean t^2 is 1.113 for the log-GAP arm against
        1.147 for A/A, a difference of -0.034 with 95% CI [-0.097, 0.029]. So the excess comes from coherent cell-level
        shifts: the cross-curve term sums to 29.4 over cells. There is no trend in n (Stouffer by n: +2.27, -0.96,
        +1.54, +0.90, -1.25). There is a post hoc r = 3 tilt (Stouffer +2.69, Bonferroni over 11 strata p 0.078). The
        magnitudes are below the tolerance: |kappa - 1| is at most 0.041, and at most 0.0089 at n >= 1024. P1 is
        unaffected. The null class uses kappa and the cluster bootstrap, not z, and inflated z only makes flags
        easier. But the record must not say the labels "behave as independent uniform elements" without the 5%
        qualifier.
    - id: O4
      severity: specification fidelity (no effect on the outcome)
      text: >-
        sample_size_justification claims a flag probability above 0.95 at a true 10% excess. The flag rule's
        |kappa - 1| >= 0.10 conjunct makes it about 0.50 in every cell, and 80% needs a true effect of about 0.100 to
        0.115. O-NULL is protected anyway, because a true 10% excess reads intermediate.
    - id: O5
      severity: record fidelity
      text: >-
        H-PFDR-727bfc falsification_conditions[0] labels the closure clause "unadjusted". It drops the idea's
        real-curve conjunct and adds the plant condition.
    - id: O6
      severity: limitation
      text: >-
        The C4 calibration gate at 44 cells has low power against moderate miscalibration: P(pass) is 0.40 at a true
        sd of 1.3 and 0.36 at a mean shift of 0.4. It also tests only the null arm. The z_cal values themselves are
        well calibrated.
    - id: O7
      severity: limitation (nearby-object attack)
      text: >-
        There is no positive control in which group structure is known to produce label-additive structure. The
        planted AP is label-side structure only. The instrument is shown sensitive to label APs, not to the specific
        pathway H1 denies.

  required_controls:
    - "Before any evidence record: narrow O1's wording and disclose O2, O3 and the 44-of-45 quantifier (see recommended_limitation_wording)."
    - "Cheapest falsification control (amendment, new counts): the improper-GAP recount on the 4 recorded degenerate triples (Q5)."
    - "Replication-block re-run of the six |z| > 2 cells to discriminate O3 (amendment)."
    - "Before any statement about IDEA-20261017-bbc53e or KN-OPEN-020: x-labels of the bbc53e union-of-short-progressions base, and translated boxes x(Q + cP)."
    - "Optional: a homogeneous threshold plant (excess 0.05 to 0.10) in the weakest cells, which the recorded-count attenuated plant here only approximates; and a nearby-object positive control in which group structure is known to induce label structure (O7)."

  counterexample_or_mutation: >-
    Two mutations. (1) Observation-fiber: hold C fixed and vary the predicate class. A random-energy label set can
    still be described by a non-additive predicate, so "label-describable" is not decided by C (O1). (2)
    Subpopulation mutation: the frozen degenerate rule removes exactly the relation-bearing log-GAPs, so the
    reading is conditioned on properness (O2). No counterexample to the operational claim |kappa - 1| < 0.05 exists
    in the recorded data.

  baseline_comparison: >-
    Not applicable: no cost, exponent or attack claim is made, and C8 (Pollard rho) is declared not run with that
    reason. The hypothesis's dominated_by is "n/a (no result claimed); rho dominates any attack reading (checked
    KR-RHO-7d93f6)". It is non-null and names the checked row. Any later consequence must be priced end to end
    against: Pollard rho with negation, sqrt(pi N / 4) time and negligible memory; BSGS, sqrt(N) time and memory; and
    IDEA-20261017-bbc53e's own floor (tau >= 1/2 unless kappa >= U). Description, membership, relation, descent and
    memory costs must all be charged (KN-OPEN-020).

  heuristic_challenges:
    - >-
      H1 is explicit and numbered, but it has no rigorous bound plus classical distribution theorem behind it. Its
      rigorous_support is recalled pointers only (Shparlinski equidistribution; Ahmadi-Shparlinski 2010) plus an
      abstract-only motivation (arXiv:2510.03828). That is acceptable for an empirical toy validation, but it means
      the support is empirical_only.
    - >-
      Recalled citation check: Ahmadi-Shparlinski exists. It is "Bilinear character sums and sum-product problems on
      elliptic curves", Proc. Edinb. Math. Soc. 53(1) (2010) 1-12, doi 10.1017/S0013091508000771, on bilinear
      character sums over x(kmP) and sum-product variants on E. The hypothesis's "about p^(1/2)" threshold could not
      be confirmed from the abstract. Not load-bearing (role: scope).
    - >-
      Random-model transfer: x(cP) over a box is a structured object. The cheapest data-level exposure of a
      deviation is O3 (log-GAP z RMS 1.27 against null-vs-null 1.01). The structured sub-case most likely to deviate,
      improper GAPs, is the one excluded (O2).
    - >-
      What the quantity should have done: a label excess driven by group-additive quadruples would scale with
      their fraction, about 1/n, while the noise falls faster, so its z would grow with n. The z by n shows no such
      growth, and the log-kappa slopes are flat (|slope| at most 0.0088), as H1 predicts. The matched null and z_cal
      (Sum z^2 44.9 on 44) give the null-object control. The O3 excess shows no n-trend that would mark a structural
      law.

  cost_model_challenges:
    - "None applicable: no cost model is claimed, and none should be inferred from the coincidence counts (wall time is never a bound)."

  reduction_and_scope_challenges:
    - "The KN-OPEN-020 / IDEA-20261017-bbc53e corollary in decision_impact is not validly instantiated (O1, Q4 attack_2): wrong object shape, and wider predicate class."
    - "Scope inflation: replace \"label-describable\" with \"label-additively structured (h = 2 pair-sum energy)\" wherever the closure is stated."
    - "The 45-cell quantifier is observed at 44 cells; P1 is vacuous, not met, at b20-r3-n4096."

  proof_architecture_challenges:
    - "Observation fiber: C (h = 2 energy) does not separate label-describable from non-describable sets (O1)."
    - "Quantifier order: the degenerate rule removes, after the draw, exactly the relation-bearing instances. It is pre-registered and conservative for validity, but it conditions the reading on properness (O2)."
    - "Nearby object: no control exists in which group structure is known to induce label structure (O7)."
    - "Method ceiling: exact counts and per-cell kappa intervals at the tested cells; nothing asymptotic. The records respect this ceiling."

  resource_check:
    examined: true
    reading: >-
      The measured quantity, kappa about 1 for proper log-GAP x-labels at h = 2, is the input assumption kappa = 1
      ("matched random base") that IDEA-20261017-bbc53e's coincidence-harvest rate uses. At toy scale it licenses
      the random-label null rate for label-sum coincidence harvests from proper rank <= 3 GAP bases. With the dual
      measurement EXP-PFDR-ca5e01, it forms the label-side half of a toy two-sided sum-product measurement. No theory
      was found that turns it into a positive handle.
    spawned_ids: []

  narrowest_supported_statement: >-
    For x-labels of proper rank-r log-GAP half-boxes (r in {1, 2, 3}, fixed origin, lexicographic fill, n 256 to
    4096) on generated prime-order curves of 20, 24 and 28 bits, the nontrivial pair-sum coincidence count matches the
    matched uniform-label null within 5% in 44 of 45 toy cells (|kappa - 1| at most 0.041; at most 0.009 at
    n >= 1024). Cell b20-r3-n4096 is not assessed, and relation-bearing log-GAPs are untested.

  recommended_limitation_wording: >-
    Scope of support (H-PFDR-727bfc, EXP-PFDR-bb0d26; RUN-PFDR-4d8c71 job records, RUN-PFDR-089edc analysis.json).
    H1 is not contradicted at the preregistered tolerance: |kappa - 1| < 0.05 with curve-cluster 95% intervals
    inside [0.90, 1.10]. This holds in 44 of the 45 toy cells: generated prime-order ordinary curves of 20, 24 and
    28 bits, seed block 8,100,000 + c, 50 to 1440 curves per cell; r in {1, 2, 3}; n in {256, ..., 4096}. The
    statistic is the exact pair-sum (h = 2) coincidence count of the x-labels (R1) of proper rank-r log-GAP
    half-boxes with fixed origin and lexicographic fill. Observed |kappa - 1| is at most 0.041, and at most 0.009 at
    n >= 1024. In the weakest powered cell (b28-r1-n512, M = 3922.5), a true |kappa - 1| of at least 0.079 would
    have been read non-null with 95% probability.
    Cell b20-r3-n4096 is not assessed. 4 of its 50 seeded point triples satisfy a short integer relation (sup-norm
