  task_id: TASK-20261029-ff0453
  claim_under_review: >-
    RUN-PFDR-089edc analysis.json (stage final): outcome O-NULL, headline SUPPORT_SCOPED for H1 of H-PFDR-727bfc at
    the tested toy scope. Calibration passes (n 44, mean -0.2676, sd 0.9736), 44 cells are null, b20-r3-n4096 is
    invalid, no cell is flagged, the plant is recovered everywhere, and the replication census has 0 jobs.

  # ---------------------------------------------------------------- Q1 power
  findings:
    Q1_power:
      answer: >-
        Every powered cell was a real test, and over-dispersion is absent. The [0.90, 1.10] interval condition never
        binds: 0.05 plus the widest half-width (0.034) is below 0.10, so the |kappa - 1| < 0.05 condition decides the
        null class. The flag rule is not vacuous in any cell, since the observed deviation needed for |z| > 4 is below
        0.10 everywhere. The weakest cell by minimum detectable effect is b28-r1-n512.
      weakest_cell:
        cell: b28-r1-n512
        curves: 89
        M: 3922.5
        ci_rel_halfwidth: 0.0338
        V_over_M: 1.043
        mde_abs_kappa_minus_1_at_absz_gt_4: 0.0669
        z_at_an_observed_10pct_deviation: 5.98
        true_homogeneous_delta_read_non_null_with_95pct: 0.0786
        flag_rule_power_at_true_delta_0p10: 0.50
        true_delta_for_80pct_flag_power: 0.115
        note: >-
          The cell with the smallest M is b28-r2-n256 (M 3869.4, MDE 0.0662). Under the heterogeneous-excess stress
          test below, the weakest cell is b24-r1-n256.
      dispersion: >-
        Measured null variance against Poisson (V/M) ranges from 0.914 (b20-r2-n512) to 1.089 (b20-r3-n256).
        Per-curve variance/mean medians range from 0.875 to 1.095. That is Poisson-like, with no over-dispersion that
        could cost power. The ratio of the bootstrap-interval sd to the V-based sd ranges from 0.742 to 1.14.
      flag_rule_power_correction: >-
        The specification's sample_size_justification says a true 10% excess is flagged "with probability above
        0.95". That figure ignores the |kappa - 1| >= 0.10 conjunct of the flag rule. With the observed kappa centred
        on 1.10, the flag probability at a true 10% excess is about 0.50 in every cell, and 80% needs a true effect of
        about 0.100 to 0.115. This does not threaten O-NULL, because a true 10% excess is read intermediate rather
        than null. P(null | true 0.10) is at most 0.002 in every cell under the normal approximation.
      attenuated_plant_on_recorded_counts: >-
        A stress test resampled recorded counts only. On each curve the structured count is the recorded plant_C
        with probability q, otherwise null replicate 0, against replicates 1..19. q is set for a heterogeneous mean
        excess delta; 200 draws per cell, 1000 bootstrap resamples. At delta 0.10, P(read null) is at most 0.10
        (b24-r1-n256) and typically 0.00 to 0.02. At delta 0.075 it is up to 0.495 (b24-r1-n256). At delta 0.05 it is
        about 0.5, as the rule intends. The minimum P(flag) at delta 0.10 is 0.05 (b28-r1-n256, whose replicate-0
        baseline sits low: z_cal -1.24).
