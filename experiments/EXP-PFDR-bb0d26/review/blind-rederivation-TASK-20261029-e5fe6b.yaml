    S: sum over ok curves of gap_C (records sorted by curve index)
    M: sum over ok curves of the mean of the 20 null_C (exact rational)
    V: sum over ok curves of the sample variance of the 20 null_C, ddof = 1 (CHOICE U1)
    kappa: S / M
    z: (S - M) / sqrt(V (1 + 1/20))
    ci95: >-
      curve-cluster percentile bootstrap. 2000 resamples of the cell's curve records with replacement; kappa* =
      sum gap_C* / sum mean-null*; numpy percentile 2.5 and 97.5 (method linear); numpy PCG64 seeded per cell by
