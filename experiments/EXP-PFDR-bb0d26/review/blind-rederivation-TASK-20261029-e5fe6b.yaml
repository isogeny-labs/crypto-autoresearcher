  e_c_derivation:
    statement: >-
      For X a uniform n-subset of a fixed label universe L, |L| = l, with C(X) = sum_s binom(m_s(X), 2) and m_s the
      number of unordered pairs of distinct labels with sum s mod p:
      E[C(X)] = C(L) (n)_4 / (l)_4 exactly, where (x)_4 = x(x-1)(x-2)(x-3). For L = F_p this is exactly
      3 binom(n,4)/(p-2). For the curve label universe the random-set approximation C(L) ~ (l)_4/(8p) gives
      E[C] ~ 3 binom(n,4)/p.
    steps:
      - >-
        Disjointness. If two distinct unordered pairs {u1,u2} != {u3,u4} have u1+u2 = u3+u4 and share a label, say
        u1 = u3, then u2 = u4 and the pairs are equal. So every coincidence involves 4 distinct labels.
      - >-
        At most one split per 4-set. A 4-set {a,b,c,d} has 3 splits into two pairs. If two of them had equal sums,
        e.g. a+b = c+d and a+c = b+d, subtracting gives 2b = 2c, so b = c for odd p, which is a contradiction. Hence
        C(X) = number of 4-subsets W of X that admit an equal-sum split ("additive 4-sets").
      - >-
        Linearity. E[C(X)] = sum over additive 4-sets W of L of P(W in X), and P(W in X) = binom(l-4, n-4)/binom(l, n)
        = (n)_4/(l)_4. The number of additive 4-sets of L is C(L). So E[C(X)] = C(L) (n)_4/(l)_4, with no approximation.
      - >-
        L = F_p. For every s there are (p-1)/2 unordered pairs {u, s-u} with u != s-u, so C(F_p) = p binom((p-1)/2, 2)
        = p(p-1)(p-3)/8. Then E[C] = (n)_4/(8(p-2)) = 3 binom(n,4)/(p-2) exactly.
      - >-
        Curve label universe (density delta = l/p ~ 1/2). Write r(s) = #{(u,v) in L^2 : u+v = s}; then m_s =
        (r(s) - [s/2 in L])/2. Because sum_s r(s) = l^2 exactly, sum_s r(s)^2 = l^4/p + sum_s (r(s) - l^2/p)^2. The
        fluctuation term is O(p^2) against a main term of order p^3 when |r(s) - l^2/p| = O(sqrt p) (character-sum /
        Weil-type bound, recalled, not load-bearing because it is measured below). So C(L) = (l)_4/(8p) (1 + O(1/p)),
        and E[C] = (n)_4/(8p) (1 + O(1/p)) = 3 binom(n,4)/p (1 + O(1/p)). The density delta, and so the Hasse
        fluctuation of N, cancels at leading order.
    approximations:
      - id: A1
        what: C(L) replaced by the random-set value (l)_4/(8p)
        size: >-
          Measured exactly (FFT autocorrelation of the indicator of L, ec_check.py). C(L) 8p/(l)_4 - 1 lies in
          [1.95e-6, 3.71e-6] over all 50 curves of the 20-bit set and in [1.20e-7, 2.35e-7] over all 90 curves of the
          24-bit set. That is about 2/p, so C(L) ~ (l)_4/(8(p-2)) as for F_p. |L| = (N-1)/2 holds on all 140 curves.
          Not computed at 28 bits: an FFT of length 2^29 does not fit the 15 GB host safely. The O(1/p) argument puts
          the error near 1e-8 there.
      - id: A2
        what: 3 binom(n,4)/p written as "about n^4/(8p)" in the hypothesis text
        size: >-
          n^4/(n)_4 - 1 ~ 6/n: +2.4% at n = 256 and +0.15% at n = 4096. Text only; the design and every rule use
          3 binom(n,4)/p.
      - id: A3
        what: the per-cell formula sum over curves uses each curve's own p (formula_sum = sum_c 3 binom(n,4)/p_c)
        size: exact bookkeeping choice; the alternative of a mean p per cell would add Hasse-scale noise (~1e-3)
    exhaustive_verification: >-
      The identity E[C] = C(L)(n)_4/(l)_4 was checked by enumerating every n-subset for L the label universes of
      y^2 = x^3+2x+3 over F_43 (n = 4,5,6), y^2 = x^3+5x+7 over F_61 (n = 4,5) and y^2 = x^3+x+1 over F_31
      (n = 4..7). C(F_p) = p(p-1)(p-3)/8 and E[C] = (n)_4/(8(p-2)) were checked for p = 11, 13, 17, 23. All equal exactly
      (Fraction).
    comparison_with_measured_null_means: >-
      Per cell, M / formula_sum is given in the table column M_over_formula. Over the 44 valid cells it ranges from
      0.99511 (b28-r2-n256) to 1.00771 (b28-r3-n512). No cell is outside the R6 anomaly band [0.8, 1.25]. The
      per-curve ratio (mean of 20 null counts over that curve's formula) ranges from 0.557 to 1.519, which is
      sampling noise at mu ~ 2.6 (b28, n = 256). Against the exact expectation (no formula error) at 20 and 24 bits,
      M / sum_c E_exact,c minus 1 is within +-0.0027, and z = (M - sum E_exact)/sqrt(V/20) has mean -0.32, sd 1.26,
      max |z| 3.05 (b20-r3-n512) over the 15 cells of 20 bits, and mean 0.12, sd 0.94, max |z| 1.96 over the 15
      cells of 24 bits. The null builder's means agree with the exact uniform-subset expectation.
