  calibration:
    primary: {cells: 44, mean: -0.26757, sd_population: 0.97357, pass: true, set: 'powered and not invalid'}
    alternatives:
      - {set: 'all cells with M >= 2500, invalid cell included (its 46 ok curves)', cells: 45, mean: -0.27164, sd_population: 0.96307, pass: true}
      - {set: 'primary, V19 with ddof 0', cells: 44, mean: -0.27490, sd_population: 1.00025, pass: true}
      - {set: 'invalid included, ddof 0', cells: 45, mean: -0.27908, sd_population: 0.98946, pass: true}
    margin: >-
      The binding side is the mean: |mean| = 0.268 against 0.35, about 0.55 standard errors of a mean of 44
      independent N(0,1) values inside the band. The sd is 0.97, well inside [0.75, 1.25]. No alternative tried flips
      the gate. The sample-sd convention would give 0.985.

  plant_arm:
    result: >-
      The plant is feasible on every curve of every cell. plant_kappa >= 1.2885 and plant_z >= 21.9 in all 44
      powered valid cells (P2 holds at every powered cell), so no cell is inconclusive_plant_not_recovered. At
      b28, n = 256 the plant reaches kappa 1.54 to 1.56 because m is an integer with internal(m) >= 0.30 x a small
      null mean, and the rounding overshoots.

  underdetermined_quantities:
    - id: U1
      quantity: V, the "per-curve null sample variance" estimator
      choice: ddof = 1 (unbiased sample variance)
      alternative_and_effect: >-
        ddof = 0 scales V by 19/20 and z by sqrt(20/19) (+2.6%). Largest |z| becomes 3.213. No class changes, and the
        calibration with ddof 0 reads mean -0.275, sd 1.000 (pass).
      changes_a_class: false
    - id: U2
      quantity: bootstrap resampling unit and statistic
      choice: >-
        Single-stage curve-cluster resampling of whole curve records (gap_C with that curve's mean null_C). The null
        replicates are not re-drawn within a curve. kappa* is the ratio of resampled sums.
      alternative_and_effect: >-
        A two-stage bootstrap that also resamples the 20 replicates would widen intervals marginally (null-mean noise
        is ~1/20 of the gap noise). Not run. With the narrowest margin at 0.024 it cannot move a class.
      changes_a_class: false
    - id: U3
      quantity: percentile definition ("percentile 2.5 and 97.5")
      choice: numpy linear interpolation
      alternative_and_effect: >-
        inverted_cdf (20000 resamples, seed tag boot-v2) and nearest (2000, boot-v3) move any endpoint by at most
        0.0039 (b28-r2-n256). Classes, outcome and headline are identical.
      changes_a_class: false
    - id: U4
      quantity: bootstrap RNG and per-cell seed ("seeded per cell")
      choice: numpy PCG64; seed int(sha256('TASK-20261029-e5fe6b|boot-v1|<cell>')[:8], big); plant arm seed XOR 1; 2000 resamples
      alternative_and_effect: >-
        The producer's seed derivation is not in the text, so recorded endpoints cannot be reproduced exactly from
        it. The composition should compare ci95 with a Monte Carlo tolerance (endpoint spread across my variants is
        <= 0.004), not exactly.
      changes_a_class: false
    - id: U5
      quantity: the cell set of the calibration gate ("over powered cells")
      choice: powered cells that are not invalid (44)
      alternative_and_effect: >-
        Including the invalid cell b20-r3-n4096 (M from its 46 ok curves is far above 2500) gives mean -0.272, sd
        0.963 (pass). The text does not say whether an invalid cell's z_cal enters.
      changes_a_class: false
    - id: U6
      quantity: whether "interval inside [0.90, 1.10]" is closed or open
      choice: closed (0.90 <= lo and hi <= 1.10)
      alternative_and_effect: no endpoint is within 0.024 of the band; moot
      changes_a_class: false
    - id: U7
      quantity: M and powered status of an invalid cell
      choice: computed over its ok records for reference; class invalid comes first in the order
      alternative_and_effect: moot for the reading; matters only through U5
      changes_a_class: false
    - id: U8
      quantity: null_mean_over_formula (R6), pooled or mean of per-curve ratios
      choice: pooled, M / sum_c 3 binom(n,4)/p_c; the per-curve mean, min and max are also in cells.json
      alternative_and_effect: no cell is near the anomaly band [0.8, 1.25] under either; descriptive only
      changes_a_class: false
    - id: U9
      quantity: plant_z variance ("the same way with the planted counts")
      choice: null V with factor 1 + 1/20
      alternative_and_effect: >-
        A plant-arm variance would be larger (the plant shifts the mean), but plant_z >= 21.9 leaves a factor of about
        30 in variance before the threshold 4. Moot.
      changes_a_class: false
    - id: U10
      quantity: secondary slope, log base of "log kappa"
      choice: natural log, least squares on log2 n over valid cells; per (bits, r) slopes are within +-0.009 (cells.json)
      alternative_and_effect: not decisive
      changes_a_class: false
    - id: U11
      quantity: the invalid-cell count ("fewer ok main-census records than n_curves")
      choice: distinct ok curve indices in the main block
      alternative_and_effect: identical here (no duplicate keys)
      changes_a_class: false

  descriptive_findings_outside_the_frozen_rule:
    - id: F1
      title: cell-level over-dispersion of the log-GAP z (tail check)
      observation: >-
        Over the 44 powered valid cells the main z has mean 0.175 and population sd 1.262, with sum z^2 = 71.4 on 44
        df (chi-square upper tail 0.0055). 6 cells have |z| > 2 against 2.0 expected and 1 has |z| > 3 against 0.12
        expected. The largest |z|, 3.13 (b24-r1-n2048), compares with the spec's descriptive expected maximum of about
        2.4. Six intervals exclude 1: b20-r1-n4096, b20-r3-n256, b24-r1-n2048, b24-r3-n2048, b28-r1-n256 and
        b28-r2-n512. The same cells give z_cal sd 0.974 (sum 44.9 on 44 df, upper tail 0.44), so the null A/A is
        calibrated. Against the exact expectation instead of the measured null (20 and 24 bits, 29 cells), z_exact
        has sd 1.28 (upper tail 0.016).
      diagnosis: >-
        The per-curve variance ratio of the gap arm, sum (gap_C - m_c)^2 / (1.05 sum s2_c), averages 0.955 over
        cells (A/A arm 1.053), and the lag-1 correlation of standardized deviations in curve order averages -0.007.
        So V is not too small per curve. A t-statistic built on the empirical across-curve dispersion has sd 1.34
        (sum t^2 = 79.9, upper tail 0.0008). The excess therefore sits in cell-level means of mixed sign (mean z
        0.18). It does not repeat across bits for the same (r, n): for r1-n2048, z is 0.46, -3.13 and -0.16 at 20, 24
        and 28 bits. Possible readings are chance after look-elsewhere (several dispersion tests were run here) or a
        small effect specific to a cell. Every deviation is inside the frozen band: the largest |kappa - 1| is 0.041
        and the flag rule needs 0.10.
      bearing: >-
        No class, gate or outcome depends on it. It is reported for J5 and the composition: the null class is a +-5%
        band test, while at large n the intervals have half-widths near 1e-4, so "null" here means within 5%, not
        consistent with exactly 1. P1 is a band claim and reads as stated.
      files: [TASK-20261029-e5fe6b/tail_summary.py, TASK-20261029-e5fe6b/tail_summary.json, TASK-20261029-e5fe6b/celllevel_check.py, TASK-20261029-e5fe6b/celllevel.json, TASK-20261029-e5fe6b/dispersion_check.py, TASK-20261029-e5fe6b/dispersion.json]
    - id: F2
      title: independence of the 20 null replicates (what z_cal cannot see)
      observation: >-
        z_cal stays calibrated even if the 20 replicates of a curve are equicorrelated. The three r-cells at the same
        (bits, n, curve) carry independent null sets of the same object, so the spread of their per-curve means
        measures Var(mean) directly. The pooled ratio to s2/20 is 0.976 over 4430 dof (expected 1, SE 0.021). Per
        group it runs 0.68 to 1.30. Pairwise cell-level differences have sd 1.20 over 45 pairs, max |z| 3.64 (b20 n512,
        r1 vs r3, the same cell as F3's -3.05).
      bearing: V/20 is a valid variance for the per-curve null mean; no replicate correlation is detected.
      files: [TASK-20261029-e5fe6b/null_variance_check.py, TASK-20261029-e5fe6b/null_variance.json]
    - id: F3
      title: duplicate and degenerate log-GAP jobs against a first-order relation model
      observation: >-
        Model: for independent uniform P_i in a group of prime order N, each primitive v != 0 is a relation with
        probability 1/N, and a relation v gives about prod(2T+1-|v_i|)/2 duplicate labels. Expected counts are about
        2.6 degenerate jobs and 2.7 ok jobs with 0 < duplicate_skips <= slack. Observed: 4 degenerate jobs, all in
        b20-r3-n4096 (expected 0.74 there), and 0 ok jobs with any duplicate or infinity skip among 6653 (Poisson
        probability 0.065).
      bearing: >-
        Mild, not decisive. It does not touch J4's reading, since degenerate means invalid and ok jobs carry no
        duplicates. Passed to J2/J3, which read the code path, as a plausibility pointer.
      files: [TASK-20261029-e5fe6b/dup_expectation.py, TASK-20261029-e5fe6b/dup_expectation.out.txt]
    - id: F4
      title: even/odd curve A/A (C-aa-curves), data point for the proves-too-much control
      observation: >-
        Applying the kappa band to the even and odd halves separately, one cell has a half outside 0.05:
        b24-r1-n256, kappa_even 1.079 and kappa_odd 0.971. The largest |kappa_even - kappa_odd| over the 44 cells is
        0.108. The D ratio lies in [0.99968, 1.00009] in every valid cell.
      bearing: Owned by J5 (proves_too_much). Reported, not judged.

  limitations:
    - >-
      Blind by construction. No recorded value of analysis-main.json, analysis.json, raw-result.json or the
      coordinator prior was seen, so agreement or disagreement is for the composition to establish.
    - Bootstrap endpoints depend on a seed the specification does not fix (U4); compare with tolerance.
    - The exact C(L) check covers the 20- and 24-bit curve sets only. At 28 bits the formula is relied on, with the O(1/p) argument and the measured trend.
    - >-
      The F1 to F4 statistics are post hoc and descriptive. Several such tests were run, so their tail
      probabilities need a look-elsewhere correction and none is a decision quantity.
    - This file asserts nothing about the truth of H1 beyond the frozen toy scope, and nothing about any real curve, cost or security.

