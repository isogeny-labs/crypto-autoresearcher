        curve-cluster bootstrap ci95 with your own declared seed, z_cal from null replicate 0 against replicates
        1..19, the calibration gate, the plant statistics, every class by the specification's class rule, and the
        outcome and headline by the frozen outcome rule. Report every place where the specification text does not
        determine a quantity, and what you chose. Write your values to your own file before reading anything else.
      breaking_artifact: >-
        A class, the outcome or the headline that differs from the recorded reading; a kappa that differs beyond
        float rounding; a calibration gate that flips; or a quantity the specification cannot determine that
        changes a class.
    - id: J5
      joint: >-
        J5 interpretation, scope and cost model. Whether the O-NULL reading supports H1 at the tested toy scope
        and no further; power and over-dispersion; cross-cell correlation; the invalid cell against P1's
        quantifier; the tail; the decision_impact consequences; no cost or attack claim.
      assigned_to: TASK-20261029-ff0453
      attack_plan: >-
        From the hash-bound analysis.json and the job records: check that every powered cell has measured M >= 2500
        and an interval narrow enough that the [0.90, 1.10] band was a real test (report the widest relative
        half-width), and whether over-dispersion (null_C variance against Poisson) left any powered cell unable to
        flag a true 10% excess at |z| > 4 (report the minimum detectable |kappa - 1| per cell from the measured
        variance). Assess correlation from shared curve sets across n and r at the same bits and what it does to
        the "44 independent nulls" reading and the tail check. Decide whether the invalid cell b20-r3-n4096 leaves
        P1 not observed or merely reduces the scope, under the frozen outcome rule. Attack the decision_impact
        sentence that the implicit-membership route of KN-OPEN-020 is "not opened by a label predicate at these
        sizes": state what exactly a toy null closes and what it does not (translated boxes, other fills, n above
        4096, p above 2^28, h >= 3, y-labels). Name the cheapest falsification control that the round did not run.
        Confirm no exponent, cost, real-curve or security sentence appears in any record of the experiment.
      breaking_artifact: >-
        A powered cell whose measured variance makes the P1 band or the flag rule vacuous; a correlation structure
        that turns the tail check or the calibration gate into a non-test; or a record that states a claim beyond
        toy scope.
  blindness:
    mutual: true
    lifted_for: []
    rationale: >-
      No reviewer reads another reviewer's report or scripts in this round. The composition task reads all three
      after they are written.
  proves_too_much:
    objects:
      - >-
        The planted label AP arm (C3): a set with a known coincidence excess (internal coincidences at least 0.30 x
        the null mean). The known-true conclusion is "structured". If the pipeline's class rule, applied to the
        plant statistics of any powered cell, would read null, the instrument proves too much (it would call a known
        structured set random) and the O-NULL reading carries no information.
      - >-
        The invalid cell b20-r3-n4096 (4 degenerate jobs, 46 of 50 curves). The known-true conclusion is "not
        assessable". If any reading counts it as null, the pipeline proves too much.
      - >-
        The known-false sentence "O-NULL at p up to 2^28 and n up to 4096 shows that log-GAP x-labels are random
        on secp256k1 or P-256, or that the random-set law holds asymptotically". Any record or report whose words
        imply it fails this control.
      - >-
        The null-vs-null A/A comparison (C-aa-null) and the even/odd curve A/A (C-aa-curves). Known-true: no
        effect. If the same rule that reads the log-GAP arm would flag either A/A comparison at a rate above
        nominal, the flag rule proves too much in the other direction.
    failure_signature: >-
      The plant arm reading null in any powered cell, the invalid cell reading null, any real-curve or asymptotic
      sentence, or an A/A comparison flagged above nominal rate. Any of these blocks support.
    assigned_to: TASK-20261029-ff0453
