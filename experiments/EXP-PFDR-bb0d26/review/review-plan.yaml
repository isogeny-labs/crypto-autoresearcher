      breaking_artifact: >-
        A run count other than five, a hash mismatch, a non-zero checker exit, a seed off the frozen rule, a
        non-empty replication file or flagged cell, a degenerate cell read as null, or a report page 1 that
        misstates a run id or a value.
    - id: J3
      joint: >-
        J3 kernel spot-check. A disjoint brute-force recount of C and D on nonce-sampled jobs, covering all three
        arms (log-GAP, null, planted), every bit size, every rank, and at least four jobs with n >= 1024, equals the
        recorded counts.
      assigned_to: TASK-20261029-958053
      attack_plan: >-
        Nonce: sha256 of the full commit sha that first adds this review-plan.yaml (git log --diff-filter=A),
        unpredictable to the producer. Draw at least 12 jobs from toy-main-jobs.jsonl by that nonce, stratified so
        every bits value and every r is covered and at least 4 jobs have n >= 1024. For each, regenerate the label
