      assigned_to: TASK-20261029-958053
      attack_plan: >-
        Copy the authority-commit inputs into a fresh scratch directory outside the repository. Run each unit's
        recorded command (runs/*/command.txt) with the run directory pointed into scratch, the interpreter replaced
