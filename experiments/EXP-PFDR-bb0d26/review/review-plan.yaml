        double-and-add on y^2 = x^3 + a x + b over F_p from the job record), and the half-box fill order and
        first-nonzero-positive rule are re-implemented from the hypothesis statement. Count C (sum of binom(m_s,2)
        over s of pair sums of distinct labels) and D with the reviewer's own Python, without labelsum.c or run.py
        counting code. Compare gap_C, gap_D, every null_C / null_D entry and plant_C / plant_D. This is a recount of
        recorded sets, not a new trial.
      breaking_artifact: >-
        Any recounted C or D differing from the record on any sampled job, or a log-GAP label set that the
        reviewer's own arithmetic cannot reproduce.
    - id: J4
      joint: >-
        J4 blind re-derivation (see blind_rederivation). From the specification and hypothesis text and the job
        records alone: S, M, kappa, z and the class of every cell, z_cal and the calibration gate, fraction_valid,
        the outcome and the headline; and E[C] = 3 binom(n,4)/p for a uniform n-subset of the label universe.
      assigned_to: TASK-20261029-e5fe6b
      attack_plan: >-
        Without reading anything in blind_rederivation.blind_from, derive E[C] for a uniform n-subset of a set of
        size |L| in F_p from the counting convention, state every approximation, and compare with the per-job
        null means in the job records (ratio per cell). Then compute S = sum of gap_C and M = sum of per-curve
