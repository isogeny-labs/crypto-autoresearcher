# EXPERIMENT CONTRACT -- EXP-MLKEM-38b27d (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-38b27d
  hypothesis_id: H-MLKEM-486519
  derived_from_idea: IDEA-20261018-c8180f
  question_id: RQ-MLKEM-003
  goal_id: null
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Empirical P(beta) for Kyber-shaped primal attacks
  objective: >-
    Replace the step-function success assumption with a measured CDF and test the PV21 simulator
    on module/CBD instances.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: G6K, fpylll, PV21 simulator code (public), lattice-estimator
    parameters: (n,k) in {(32,2),(40,2)}; q=3329; CBD(2); 200 instances each; progressive
      step 1
    procedure: >-
      1) Freeze. 2) Generate instances. 3) Progressive reduction with verification. 4) Empirical
      CDF. 5) Compare with simulators.
  controls:
  - >-
    null: unstructured LWE with the same dimension, q, and CBD secret - checks module structure
    has no effect on the CDF
  - >-
    positive: Gaussian-error instances matching PV21's own experimental setting must reproduce
    their curve
  - 'A/A: the same instances with two basis-randomization seed blocks'
  independent_variables:
  - instance_family
  - ring_degree
  metrics:
    primary:
    - empirical CDF of beta*
    - window width
    secondary:
    - simulator residuals
    - expected progressive cost vs step cost
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: median beta*
    formula: PV21 simulator
    source: KN-LIT-5601
  scale_relevance:
    tier: toy
    justification: lattice dim <= 161; transfer of CDF shape conditional
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    independent_instances: 2
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 100
    maximum_memory_gb: 16
    maximum_runs: 1600
  stopping_rules:
  - censor at beta=dimension
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C2 shows window >= 6 (P1) and median within 2 of PV21 (P2); C1 difference reported; beyond
    AA1 noise floor.
  falsification_criterion: C2 window < 3 or PV21 median miss > 4.
  decision_impact:
    on_positive: Use PV21 with measured spread for expected-cost accounting in RQ-MLKEM-003.
    on_negative: Keep the step convention as empirically adequate; document the measured window.
  variable_ledger:
    independent:
    - name: instance_family
      levels:
      - module_cbd
      - unstructured_cbd_null
      - gaussian_positive
    - name: ring_degree
      levels:
      - '32'
      - '40'
    factors:
    - name: basis_seed_block
      treatment: randomized
      value: A,B
      how: basis randomization
    - name: instance_seed
      treatment: randomized
      value: '200'
      how: paired
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - module_cbd
      - unstructured_cbd_null
      differs_in:
      - instance_family
      design: one_factor
    - id: C2
      arms:
      - module_cbd vs PV21 simulator
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - module_cbd block A
      - module_cbd block B
      differs_in:
      - basis_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-c8180f.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-c8180f.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with frozen protocol hash, tool versions (fpylll/G6K/Sage commit ids), host
    and seeds
  - raw-result.json with one row per (arm, instance, seed) including verification flag
  - analysis.json with effect sizes, bootstrap CIs and the AA noise floor
  - report.md plus graph (SVG/PNG) and PDF per the research-visuals skill
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLKEM-38b27d/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-c8180f.
    - >-
      RQ-MLKEM-003's goals GOAL-MLKEM-003 and GOAL-MLKEM-004 are closed_at_budget; no open
      goal serves this question. The Coordinator must open a successor goal or rebind before
      dispatch.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
  goal_id_note: >-
