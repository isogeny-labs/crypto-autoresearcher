audit_review:
  audit_id: AUD-20261029T011541Z-d57860
  session_dir: experiments/EXP-ICPERF-e467a5/runbook-sessions/RBS-ICPERF-b7e41c
  journal_tip: 3f0019ab9d2f6a6f37313aa66f67fdb05a11cea07b113df12cadac724b6a4057
  auditor_model: claude-opus-5-5
  auditor_role: validator (Opus escalation reader for a flagged session; audit-runs step 3)
  scope: >-
    The reading half of audit-runs only. This is a screen. It is not a
    validation_report, not evidence about H-ICPERF-2f52d1, and not an
    execution proof. It does not by itself close LGN-9; the Coordinator
    decides what follows. No trial was run. No session, run, results or
    research-state file was edited or repaired. Sibling audit-review files
    from this batch were not read.
  revision_read: 3fe6e1226d5a40f9f8f1e1d30c513481e34bf3a9
  independence: >-
    This reader did not produce RBS-ICPERF-b7e41c or either execution
    recorded under that id (owners executor-codex-run-20261019-0527 and
    executor-run-icperf-e467a5-20261021).

  deterministic_audit:
    verdict: flagged
    findings:
      - experiments/EXP-ICPERF-e467a5/runbook-sessions/RBS-ICPERF-b7e41c/steps/S02-trials.attempt-1.supervisor.stderr differs from its recorded digest
    journal_entries: 7
    replayed_units: 0
    miss_probability: {'0.01': 1.0, '0.05': 1.0, '0.1': 1.0, '0.25': 1.0, '0.5': 1.0}
    tool_sha256: ce286aa92df78fa9db7d6f566fb88e848b1f33fba3bd9ced93ef6a6026625083
    meaning: >-
      No units were replayed (k=0), so (1-f)^k = 1 at every listed
      fabrication fraction and the replay gives no detection power. The
      session's only unit is invalid. The audit therefore checked integrity
      only.

  session_observation:
    final_status: stopped
    steps: {S01-probe-python: passed, S02-trials: failed}
    s02_failure: 'supervisor exit 3 (trials remain or need reconciliation), failure_class implementation_error'
    units: {total: 1, valid: 0, invalid: [price-ratio-identity]}
    unit_receipt: >-
      RUN-ICPERF-943efa execution-receipt.json status invalid_output. Detail:
      manifest.yaml fails the run schema (tools/validate_ledger.py). Missing
      code, environment, inputs, timing and result; certificate kind invalid.
      published false. returncode 0, check_returncode 0. This is the LGN-8 run
      (research/sheriff/SHF-20261028-0f3f64/findings.yaml LGN-8).
    run_artifact_digests: >-
      At HEAD, sha256 of RESULTS.md 4c0352c3..., manifest.yaml eea176ee...,
      raw-result.json 947f3c26... and execution-receipt.json 3f5c3f70...
      equal the journal seq-4 artifacts and receipt_sha256, and the receipt's
      artifact_sha256 for all 10 files.
    interpretation: >-
      Zero valid units is a count of admissible observations. It is not an
      observed value of any metric, and it is not evidence for or against the
      integer identity or H-ICPERF-2f52d1.

  specification_fidelity:
    status: flagged
    bound_hashes: >-
      At HEAD, sha256 of specification.yaml dc1824e8..., trial-plan.json
      aaae3c44..., implementation/run.py 631fbcb9..., implementation/check.py
      45e4a5a2... and runbook.yaml 229f641d... equal the runbook binds, the
      journal session_started binds and runbook_sha256.
    items:
      - specification: 'inputs c_probe_ns 370, c_state_ns 2100, c_step_ns 40, bl 21/10, states 10'
        counterpart: >-
          runbook spec_bindings pin c_probe_ns, c_state_ns, c_step_ns and
          states. bl_num and bl_den are checked only by the S02 by_trial
          raw-result assertions. run.py:16-21 hard-codes all six constants and
          does not read them from the spec. They equal the spec.
        result: implemented
      - specification: 'cells (r, A) = (1000, 2), (4000, 2), (1000, 4)'
        counterpart: >-
          None in the runbook: no spec_binding or validity assertion names r
          or A. check.py checks cell names only. run.py:22-26 hard-codes CELLS.
          The reader recomputation found that the raw-result cells equal the
          spec.
        result: finding (minor). The session cannot have verified the cell parameters.
      - specification: 'control: the (1000, 4) cell changes A and keeps the reduced price ratio'
        counterpart: >-
          None in the runbook. S02 has controls: [] and the summary has
          control_validity not_applicable. The check exists only inside run.py,
          as per-cell matches_price_ratio and aggregate ratios_agree.
        result: >-
          finding. In run.py:49-59, ic_online/bl_online simplifies to
          c_probe*c_state*bl_den/(bl_num*c_step^2), and r and A cancel. The
          control can fail only through an inexact division, which raises. It
          tests the implementation's integer arithmetic. It cannot respond to
          A. This fits the spec's stated scope ("integer identity only"), but
          it is not a discriminating control.
      - specification: 'control: the (4000, 2) cell changes r and keeps the reduced price ratio'
        counterpart: None in the runbook. The check is inside run.py, as above.
        result: finding. r cancels algebraically, the same as A in the item above.
      - specification: 'control: each probe count is compared with (r/A)/states (BSGS on a same-size table)'
        counterpart: >-
          None in the runbook. run.py:50 computes probes = r/(A*states) and
          run.py:60 computes bsgs_probes = (r//A)/states. These are the same
          quantity.
        result: >-
          finding. all_match_bsgs is true by construction on every cell where
          both divisions are exact. The comparison has no power to fail on the
          frozen cells.
      - specification: 'primary metrics price_ratio_num, price_ratio_den, ratios_agree, all_match_bsgs'
        counterpart: >-
          price_ratio_num has a runbook metric (min, max) and a replay pointer.
          ratios_agree has a runbook metric (fraction_true) and a replay
          pointer. price_ratio_den and all_match_bsgs have replay compare
          pointers only, with no runbook metric and no validity assertion.
        result: finding. Two of the four primary metrics never reach the session summary.
      - specification: secondary metric elapsed_seconds
        counterpart: None in the runbook. It is recorded in raw-result.json only.
        result: finding (minor)
      - specification: 'stopping rule: stop after the single preregistered cell; do not open a host receipt'
        counterpart: The trial plan has a single trial. S02 has on_invalid stop. There is no host-receipt step.
        result: implemented
      - specification: 'invalidation: a crash, timeout or inexact division invalidates the run'
        counterpart: >-
          S02 timeout_seconds 60, with on_failure retry on timeout. Inexact
          division is handled only by run.py div_exact, which raises and gives
          a nonzero exit.
        result: implemented (inexact division handled by the runner only)
      - specification: 'budget: maximum_runs 1, 60 s per run, 1 GB'
        counterpart: >-
          One trial run, RUN-ICPERF-943efa. Watchdog 60 s and timeout 60 s.
          memory_mb 256.
        result: >-
          implemented. Two executions were recorded under this session id.
          Only execution B launched the trial; execution A's unit is not_run
          with no receipt.
      - specification: required_artifacts manifest.yaml, raw-result.json, RESULTS.md under RUN-ICPERF-943efa
        counterpart: The trial-plan artifacts list is the same. All three are present, and their digests are bound.
        result: implemented. manifest.yaml fails the run schema (LGN-8), which is why the unit is invalid.
      - specification: 'preregistered_prediction formula: price = (370*2100*10)/(21*40*40); online times 18500/80, 74000/320, 9250/40 ns'
        counterpart: run.py price_ratio() uses bl_den as the factor 10.
        result: >-
          spec underspecification, not a value discrepancy. The factor 10 can
          be read as states or as bl_den; both are 10. The BL online times are
          given only as literals. Their model, bl_steps =
          bl_num*r/(bl_den*A*precomputation_steps) with precomputation_steps =
          states*c_state/c_step = 525, appears only in run.py.
      - specification: 'single session per runbook execution (runbook.yaml session_id: RBS-ICPERF-b7e41c)'
        counterpart: >-
          runbook.yaml fixes session_id. Two executions on branches that did
          not contain each other wrote the same session path. See
          digest_finding.
        result: finding. Main later merged the two executions into one tree.

  blind_rederivation:
    metric: >-
      Primary set from specification.yaml: price_ratio_num, price_ratio_den,
      ratios_agree, all_match_bsgs. The session summary aggregates
      price_ratio_num and ratios_agree.
    blind_from_respected: true
    blind_note: >-
      The script was written from specification.yaml before run.py, check.py
      or RESULTS.md were opened. Its only inputs are the spec, the unit's
      raw-result.json and the journal summary. run.py was read afterwards,
      for the specification_fidelity items only.
    script: experiments/EXP-ICPERF-e467a5/audits/AUD-20261029T011541Z-d57860/blind_rederive.py
    command: python3 -I experiments/EXP-ICPERF-e467a5/audits/AUD-20261029T011541Z-d57860/blind_rederive.py /home/user/crypto-autoresearcher
    valid_units: 0
    session_value: >-
      None exists. With 0 valid units, the session summary has
      price_ratio_num n=0 {min: null, max: null} and ratios_agree n=0
      {fraction_true: null}, and price-ratio-identity is excluded. There is
      no session measurement to compare against. The values below come from
      the single invalid unit's raw output. They are informational and are
      not a session measurement.
    reader_value_from_spec:
      price_ratio: 925/4
      price_reading_bl_den_equals_states_reading: true
      cells: {r1000_a2: '18500/80 = 925/4, probes 50', r4000_a2: '74000/320 = 925/4, probes 200', r1000_a4: '9250/40 = 925/4, probes 25'}
      ratios_agree: true
      all_match_bsgs: true
      exact_divisions: true
    reader_value_from_raw_output:
      price_ratio_num: 925
      price_ratio_den: 4
      reduced: true
      ratios_recomputed_from_raw_ic_and_bl_times: [925/4, 925/4, 925/4]
      probes_equal_r_over_A_over_states: [true, true, true]
      ic_online_equals_probes_times_c_probe: [true, true, true]
      raw_times_equal_spec_literals: [true, true, true]
      inputs_and_cells_equal_spec: true
    producer_value: >-
      raw-result.json and manifest.yaml both record price_ratio_num 925,
      price_ratio_den 4, ratios_agree true and all_match_bsgs true.
    agreement: >-
      The spec-derived values, the values recomputed from raw output, and
      the raw-reported and manifest values all agree. The session summary is
      null because the unit was excluded, which is consistent with 0 valid
      units.
    limits: >-
      The BL online-time denominators (80, 320, 40 ns) cannot be derived from
      the spec text, which states them as literals. The reader could only
      check that the raw times equal those literals. A wrong but consistent
      model in run.py that reproduced the same literals would not be caught.

  certificate_checks:
    status: not_applicable
    detail: >-
      This trial carries no certificate: no [k]P = Q, relation or
      decomposition. The units are total 1, valid 0, replayed 0, so the
      "two replayed, two unreplayed" sample cannot be drawn. As the closest
      available check, the reader re-verified the integer arithmetic of the
      one unreplayed (invalid) unit. It used Python stdlib fractions.Fraction
      in blind_rederive.py, which shares no code with run.py or check.py.
      All three cell ratios reduce to 925/4, and every probe count equals
      (r/A)/states. This is arithmetic on an invalid unit, not a certificate
      verification.
    units:
      - trial_id: price-ratio-identity
        replayed: false
        valid: false
        check: integer ratio and probe-count recomputation
        result: agrees with the raw fields
        code: stdlib fractions (independent of the producer)

  lean_statement_fidelity:
    status: none_recorded
    detail: audit.json has lean []. The journal summary has lean_obligations []. There is no Lean step in runbook.yaml.

  digest_finding:
    finding: steps/S02-trials.attempt-1.supervisor.stderr differs from its recorded digest
    recorded_sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    actual_sha256: 85aab13552c06bee49000ccd48c68d25430273d40edfc9490a03d011b68f651e
    classification: >-
      The file was neither written after its digest was taken nor edited by
      hand afterwards. It was spliced in at merge time. The session directory
      at HEAD combines the journal and 8 of the 9 bound files of execution B
      (2026-10-21) with the supervisor.stderr of a different execution, A
      (2026-10-19), which ran under the same session id. That file is
      byte-identical to what A wrote, and A digested it as written.
    script: experiments/EXP-ICPERF-e467a5/audits/AUD-20261029T011541Z-d57860/digest_provenance.py
    command: python3 -I experiments/EXP-ICPERF-e467a5/audits/AUD-20261029T011541Z-d57860/digest_provenance.py /home/user/crypto-autoresearcher <scratch_dir>
    evidence:
      - >-
        Two executions share session id RBS-ICPERF-b7e41c. Execution A is
        commit 93b87120f68801ce4a70e678067b33d661623117. It started at
        2026-10-19T05:31:55Z with owner executor-codex-run-20261019-0527 and
        clean preflight commit 6edd9e1e. S02 exited 2 ("impediment: the
        supervisor refused to launch"), the unit is not_run, and the journal
        tip is 2f3032f7fa3be3b894ad93871403eeff65261f7c45a39a617ac088b31d31d1b0.
        Execution B is commits ba814919aae174280b65e681fd360831759e895f and
        2d3948be7f787567cd27bc13f6e348eb8528b06b. It started at
        2026-10-21T14:26:19Z with owner executor-run-icperf-e467a5-20261021
        and preflight commit 6e27b5ac (tracked_dirty true). S02 exited 3, and
        its journal tip is 3f0019ab..., the audited tip. Neither preflight
        commit (nor 4a45df5a, B's claim commit) contains a session directory,
        and 93b87120 is not an ancestor of either. runbook.yaml fixes
        session_id, so B wrote the same path without seeing A.
      - >-
        Each execution is internally consistent as committed. All 9 digests
        recorded in A's journal match the blobs in 93b87120f6; A recorded
        supervisor.stderr as 85aab135..., 96 bytes. All 9 digests in B's
        journal match the blobs in 2d3948be7f; B recorded e3b0c442... and
        committed an empty file (blob e69de29b). Only the HEAD tree
        mismatches, and only on this file.
      - >-
        HEAD's supervisor.stderr is blob ed9fcfcdf5538271069ec541dea91567137942b6,
        the same blob A committed. Its sha256 85aab135... is the digest A's
        journal recorded.
      - >-
        The content belongs to A's exit path. In tools/experiment_execution.py
        main() at 6edd9e1e, 6e27b5ac and 4a45df5a (lines 627-633), the
        exception path prints "execution impediment: <error>" to stderr and
        returns 2. Only the non-exception path prints the JSON report to stdout
        and returns 3. B's record has exit 3 and the JSON report on stdout
        (needs_reconciliation). A's has exit 2 and an empty stdout. No single
        supervisor invocation can produce B's stdout together with this
        stderr.
      - >-
        Code path (tools/runbook.py at 644c069ae13ab37fe64f8d024352ba2cdcdbc6da,
        sha256 52c41d4e..., the tool_sha256 in both preflights): run_process
        opens the log with mode "xb", the supervisor writes it, and the file
        is closed after process.wait. attempt_files computes log digests only
        after the step handler returns, which is after the supervisor and the
        release processes have exited. No late writer reached B's committed
        file, which is empty.
      - >-
        Where the splice happened: the composite first appears in merge
        0186e97db6997dc3e049ab23154d97c743fa5dc6 (2026-10-25T11:20:37-07:00,
        "Merge main into the PR branch and keep both sides of the overlap.",
        branch codex/run-experiments-20261019). Its parents are 4162400dad
        (tree of execution A) and af671797aa (main, tree of execution B; B
        reached main via PR #2452, 1446bbcb8c). The merge base 18f0d961 has
        no session directory. The reader reproduced the merge with git
        merge-tree in a scratch --shared clone. journal.jsonl,
        environment.json, claim.stdout and release.stdout give add/add
        CONFLICTs, which 0186e97 resolved to main's side, i.e. B.
        supervisor.stderr and supervisor.stdout merge without conflict,
        because one side of each is empty against the empty base. Git
        therefore took A's non-empty stderr (ed9fcfcd) and B's non-empty
        stdout (dc5603d5), and no conflict was ever shown for
        supervisor.stderr. The composite reached main's first-parent line
        through PR #2416, merge 6b65cdcaebb277522fa88254a9165c2b545069a6
        (2026-10-25T22:22:23-07:00), and later merges kept it.
      - >-
        "Exactly one commit (93b87120f6)" is git's simplified history from
        HEAD. With --full-history, ba814919aa and 2d3948be7f also commit this
        path, as the empty file. 2d4f0120cb reverted ba814919aa on a separate
        branch.
    not_established: >-
      The repository does not record whether whoever made the merge noticed
      the add/add conflicts or the clean auto-merge of supervisor.stderr.
      Execution A's own session record (journal blob fb546f79, tip
      2f3032f7...) is no longer in the HEAD tree. It survives in history only
      and has never been audited.
    consequence: >-
      The session directory on main is not a faithful record of any single
      execution. Execution B, whose journal is the one audited, is recoverable
      intact at 2d3948be7f, where every digest holds. Choosing a remedy is the
      Coordinator's job; this reader repairs nothing.

  not_covered:
    from_audit_json: []
    added:
      - 'No metric was measured: 0 valid units, and both summary metrics have n=0 and null values.'
      - 'No replay power: 0 units replayed, so the miss probability is 1.0 at every listed fabrication fraction.'
      - 'The unit is invalid_output because manifest.yaml fails the run schema (LGN-8). The receipt has published false.'
      - 'Execution proofs: chain incomplete, verified_units 0. The docs/execution-proof-chain.md milestones are open.'
      - >-
        Controls: the runbook implements none of the three specification
        controls. Inside run.py, all three hold by algebraic construction
        whenever the divisions are exact.
      - 'price_ratio_den, all_match_bsgs and elapsed_seconds have no session summary metric.'
      - 'The BL online-time model is not stated in the specification, so the online-ratio denominators cannot be re-derived blind.'
      - >-
        Session-id collision: execution A (93b87120f6) was never audited, and
        its journal is not in the HEAD tree. tools/runbook.py audit checks
        only the journal in the tree.
      - >-
        Execution B's preflight records tracked_dirty true at 6e27b5ac. The
        bound spec, plan, run.py and check.py digests match, but the session
        records no other dirty tracked file.
      - >-
        The deterministic audit tool (ce286aa9) differs from the
        execution-time tool (52c41d4e). The reader read the execution-time
        version from git (644c069ae1) for the code-path check.

  sources_read:
    - AGENTS.md (sections Literature first, Budgets, Experiment protocol, Core rules, Review architecture, Artifact policy, Curve identity and measured bounds)
    - docs/agent-runtime-core.md
    - agents/validator.md
    - .claude/agents/validator-sweep.md
    - .claude/skills/audit-runs/SKILL.md
    - experiments/EXP-ICPERF-e467a5/audits/AUD-20261029T011541Z-d57860/audit.json
    - experiments/EXP-ICPERF-e467a5/specification.yaml
    - experiments/EXP-ICPERF-e467a5/runbook.yaml
    - experiments/EXP-ICPERF-e467a5/trial-plan.json
    - experiments/EXP-ICPERF-e467a5/runbook-sessions/RBS-ICPERF-b7e41c/journal.jsonl (HEAD and 93b87120f6 versions)
    - experiments/EXP-ICPERF-e467a5/runbook-sessions/RBS-ICPERF-b7e41c/steps/* (HEAD and 93b87120f6 versions)
    - experiments/EXP-ICPERF-e467a5/runbook-sessions/RBS-ICPERF-b7e41c/outputs/S01-probe-python/attempt-1/environment.json
    - experiments/EXP-ICPERF-e467a5/runs/RUN-ICPERF-943efa/{execution-receipt.json, manifest.yaml, raw-result.json, environment.json, command.txt, launch.json}
    - experiments/EXP-ICPERF-e467a5/implementation/run.py (after the blind re-derivation)
    - experiments/EXP-ICPERF-e467a5/implementation/check.py (after the blind re-derivation)
    - tools/runbook.py (HEAD lines 1050-1095, 1240-1420; 644c069ae1 run_process, attempt_files, _supervise)
    - tools/experiment_execution.py (HEAD lines 1035-1060; lines 319 and 627-633 at 6edd9e1e, 6e27b5ac, 4a45df5a)
    - research/sheriff/SHF-20261028-0f3f64/findings.yaml (LGN-8, LGN-9 entries)
    - experiments/EXP-XEDN-0c0182/audits/AUD-20261027T214121Z-f680a6/audit-review.yaml (first 60 lines, committed, for format only)
    - git history and blobs of the session path (log --full-history, ls-tree, merge-tree in a scratch clone)
  read_sibling_reports: false

  verdict: flagged
  escalate: true
  verdict_reason: >-
    The hash chain holds and the digest mismatch is fully explained by
    history: two same-id executions were spliced together by a merge. It is
    not fabrication and not a late write. Even so, the session directory on
    main is not the record of any single execution. Its only unit is
    invalid, nothing was replayed, and the runbook implements none of the
    specification's controls and two of its four primary metrics. This
    session supports no metric, and it should not be cited by an evidence
    review in its current form.
