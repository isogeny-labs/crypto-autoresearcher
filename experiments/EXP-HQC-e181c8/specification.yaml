# EXPERIMENT CONTRACT -- EXP-HQC-e181c8 (review_required, unapproved, zero runs).
experiment:
  id: EXP-HQC-e181c8
  hypothesis_id: H-HQC-4596b7
  derived_from_idea: IDEA-20261018-a4ea02
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: MAGE vs fresh elimination
  objective: Is the MAGE speedup realised at reduced n?
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C ISD with bit-op counters
    parameters: n in {251,509}; w ~ sqrt(n); 200 instances per cell; reuse depth 1..3
    procedure: 1. Run with/without reuse. 2. Count ops. 3. Compare to prediction.
  controls:
  - 'null: reuse disabled'
  - 'positive: maximal reuse on a code with planted repeated structure'
  - 'A/A: MAGE arm two seed blocks'
  independent_variables:
  - elimination
  - algorithm
  metrics:
    primary:
    - per-iteration ops reduction
    secondary:
    - total speedup
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: speedup
    formula: KN-LIT-7565 branching-process estimate
    source: KN-LIT-7565
  scale_relevance:
    tier: toy
    justification: 'n reduced; transfer: survival law'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 30
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - 200 instances per cell
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - solution mismatch invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Success if C1 shows >= 2^3 reduction beyond the AA1 noise floor (P1) and C3 within 1 bit
    (P2).
  falsification_criterion: Falsified if C1 reduction < 2^1 or C3 off by > 2 bits.
  decision_impact:
    on_positive: Include MAGE in the matched ISD baseline.
    on_negative: Record MAGE gains as not realised at reduced n.
  variable_ledger:
    independent:
    - name: elimination
      levels:
      - fresh
      - mage
    - name: algorithm
      levels:
      - prange
      - stern
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    comparisons:
    - id: C1
      arms:
      - prange fresh
      - prange mage
      differs_in:
      - elimination
      design: one_factor
    - id: C2
      arms:
      - prange mage
      - stern mage
      differs_in:
      - algorithm
      design: one_factor
    - id: C3
      arms:
      - measured vs predicted
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - prange mage seed-block A
      - prange mage seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-a4ea02.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-a4ea02.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - ops CSV
  - SVG
  - PDF
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
