    row: LEAD-TRF-odd-prime-ghs-cover-floor
    path: knowledge/leads/ecdlp/transfer/LEAD-TRF-odd-prime-ghs-cover-floor.yaml
    delta: Extend x-line-only genus accounting to all rational degree-two quotient classes on the same curve;
      separate geometric branch genus from twist-dependent descent. No run/evidence delta claimed.
  selection_basis: Coordinator selected the still-open ECC idea under standing authorization; ready existing
