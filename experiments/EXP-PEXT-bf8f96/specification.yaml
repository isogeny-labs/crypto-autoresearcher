  transfer_obligations:
  - map: E actual model -> f_T quartic -> conjugate compositum
    kind: coordinate_change
    source: Named E/K with origin and T
    destination: Degree2 branch polynomial with explicit maps and descent status
    preserves:
    - actual curve identity and twist via invertible rational maps
