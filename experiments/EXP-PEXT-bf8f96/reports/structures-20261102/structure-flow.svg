<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><style>text{font:17px sans-serif;fill:#18344a}.ok{fill:#eaf4ed;stroke:#39734b;stroke-width:2}.pending{fill:#fff4df;stroke:#a37119;stroke-width:2;stroke-dasharray:7 4}.edge{fill:none;stroke:#52677e;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677e"/></marker></defs><text x="25" y="30">EXP-PEXT-bf8f96: complete left cosets + literal binary-form transport</text><rect class="ok" x="25" y="75" width="275" height="95" rx="9"/><text x="40" y="105">Normalized invertible N</text><text x="40" y="135">Left coset H N, not N H</text><rect class="ok" x="365" y="75" width="265" height="95" rx="9"/><text x="380" y="105">C(N) = N^-1 sigma(N)</text><text x="380" y="135">Distinct + exact group index</text><path class="edge" d="M300,120 L365,120"/><rect class="ok" x="690" y="75" width="245" height="95" rx="9"/><text x="705" y="105">Complete coset coverage</text><text x="705" y="135">F27 fixture: 819 x 24</text><path class="edge" d="M630,120 L690,120"/><rect class="ok" x="25" y="250" width="275" height="95" rx="9"/><text x="40" y="280">G_N = F(adj(N)(X,Z))</text><text x="40" y="310">Literal leading scalar retained</text><path class="edge" d="M160,170 L160,250"/><rect class="ok" x="365" y="250" width="265" height="95" rx="9"/><text x="380" y="280">Independent coefficient replay</text><text x="380" y="310">G_N(Nv) = det(N)^4 F(v)</text><path class="edge" d="M300,295 L365,295"/><rect class="pending" x="690" y="250" width="245" height="95" rx="9"/><text x="705" y="280">Streaming curve/T cohort joins</text><text x="705" y="310">Descent + frozen launcher</text><path class="edge" d="M630,295 L690,295"/><text x="25" y="390">Solid: implemented + fixed software validation. Dashed: outstanding experiment interfaces.</text></svg>