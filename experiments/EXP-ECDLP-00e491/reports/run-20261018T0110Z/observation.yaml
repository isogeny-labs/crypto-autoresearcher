controls:
- id: exact-source-reference
  description: Exact QQ factorization and proof-enabled prime decisions alongside the source screen
  observation_ids:
  - complete-support
  matching: Same complete coefficient supports and k/minimum rules.
  limitations:
  - Unresolved source irreducibility screen is not Q-reducible.
- id: fixed-input-references
  description: Eleven archived-seed controls and seven same-seed replays
  observation_ids:
  - check-completion
  matching: Fixed g,p,root,A,B,auxiliary lists and ladder; exact source seed strings used for controls.
  limitations:
  - Only seven input cases; no independent scientific review.
patterns:
- id: screen-unresolved
  kind: exploratory_pattern
  description: Three degree-eight and 21 degree-twelve prime-eligible Q-irreducible patterns are unresolved
    by the source modular screen.
  observation_ids:
  - complete-support
  reference_ids:
  - exact-source-reference
  uncertainty: Exact finite counts, no significance test or general completeness claim about the source
    screen.
  alternative_explanations:
  - The source requires an irreducibility witness among a fixed set of finite primes; exact Q factorization
    is a different criterion.
- id: stable-endpoints
  kind: exploratory_pattern
  description: All twelve final residue counts agree within each input; intermediate paths and capped-prefix
    comparisons are separately retained.
  observation_ids:
  - fresh-variation
  reference_ids:
  - fixed-input-references
  uncertainty: Only twelve fresh seeds per input and seven fixed cases; no wider variance estimate.
  alternative_explanations:
  - Enumeration order can change intermediate discoveries while later counts coincide.
  - Small reporting prefixes can omit later differences.
limitations:
- Raw certificate kind none; builtin checking is not independent scientific review.
- No hypothesis/goal interpretation, relevance or usefulness verdict.
- The local coverage publication_verified field is hardcoded false; actual Git/hash publication has
  a separate receipt.
- Same-prefix pair counts reuse the twelve jobs and are not independent samples.
