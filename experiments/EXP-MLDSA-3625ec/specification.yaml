# EXPERIMENT CONTRACT -- EXP-MLDSA-3625ec (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-3625ec
  hypothesis_id: H-MLDSA-128680
  derived_from_idea: IDEA-20261018-73fed4
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Parity law of mask-defect leakage at toyDSA(32,2,2)
  objective: >-
    whether the parity of a mask defect sets the exponent of the signature count for key recovery
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python 3.11, NumPy; toyDSA(n,k,l): a NumPy re-implementation of FIPS 204 Algorithms
      1-8 with the ring degree n as a parameter (q = 8380417, d = 13, eta, tau, gamma1, gamma2,
      beta = tau*eta, omega as in ML-DSA-44 unless stated), cross-checked against the PQClean
      ML-DSA-44 reference at n = 256 on 1000 KAT vectors before any reduced run
    parameters: >-
      toyDSA(32,2,2), gamma1 = 2^6, eta = 1, tau = 8, beta = 8; odd eps in {0, 1, 2^-1, 2^-2};
      even eps in {0, 2^-1, 2^-2, 2^-3, 2^-4}; N grid doubling 2^10..2^24; 5 keys per seed
      block. Predicted N*: even 8.0e3/eps^2, odd 3.2e4/eps^4
    procedure: >-
      1) KAT cross-check. 2) For each key, defect shape and eps, sign until 2^24 accepted
      signatures or recovery. 3) Accumulate normal equations of z on rot(c); solve at each
      grid point. 4) Round and compare with s1. 5) N* = smallest grid point with exact recovery
      on all 5 keys. 6) Fit slopes per shape.
  controls:
  - 'null: eps = 0 exact uniform sampler, same N grid'
  - 'positive: rejection disabled (z = y + c s1 always output, ILWE regime of KN-LIT-4828)'
  - 'A/A: even defect eps = 2^-2 in two seed blocks'
  independent_variables:
  - defect_shape
  - defect_eps
  - rejection
  metrics:
    primary:
    - N* per (shape, eps)
    - fitted slope per shape
    secondary:
    - empirical gain g
    - per-coefficient error rate vs N
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: N*(shape, eps)
    formula: 16 sigma_z^2 / (tau g^2), g_odd = eps^2 B^2/(3 G^2), g_even = 2 eps B^2/(3 G^2)
    source: >-
      truncated-density mean shift derived in this record with ILWE least-squares variance
      (KN-LIT-4828)
  scale_relevance:
    tier: toy
    justification: >-
      n = 32, gamma1 = 2^6 keep N* <= 2^24; transfer through the closed-form gain, stated
      not tested
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 24
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
  - stop a cell once exact recovery holds on all 5 keys at two consecutive grid points
  - stop any arm at 2^24 signatures per key
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    P1 and P2 hold in C2, C1 shows the even defect needs fewer signatures than the odd one
    at eps = 2^-1, C3 confirms the instrument; AA1 noise floor: N* within one grid step
  falsification_criterion: >-
    odd-defect slope above -3 or even-defect slope outside [-3,-1] in C2, or any recovery
    at eps = 0
  decision_impact:
    on_positive: >-
      publish the parity law as a sampler-triage rule for GOAL-MLDSA-001: even defects are
      the dangerous class, with a signatures-per-eps table
    on_negative: >-
      record that post-rejection leakage does not follow the parity law and measure the empirical
      gain directly before any triage rule
  variable_ledger:
    independent:
    - name: defect_shape
      levels:
      - odd_linear
      - even_quadratic
    - name: defect_eps
      levels:
      - '0'
      - 2^-4
      - 2^-3
      - 2^-2
      - 2^-1
      - '1'
    - name: rejection
      levels:
      - 'on'
      - 'off'
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    - name: message_length
      treatment: fixed
      value: 32 bytes
      how: uniform random messages
    comparisons:
    - id: C1
      arms:
      - odd_linear eps 2^-1
      - even_quadratic eps 2^-1
      differs_in:
      - defect_shape
      design: one_factor
    - id: C2
      arms:
      - slope fits per shape over eps
      differs_in: []
      design: absolute
    - id: C3
      arms:
      - eps 0 rejection off
      - eps 0 rejection on
      differs_in:
      - rejection
      design: one_factor
    - id: AA1
      arms:
      - even eps 2^-2 seed-block A
      - even eps 2^-2 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-73fed4.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-73fed4.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P3
    first_recorded_in: ledger/proposals/IDEA-20261018-73fed4.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
