experiment:
  id: EXP-PFDR-aaeffc
  hypothesis_id: H-PFDR-d23587
  version: 1
  title: Complete chart-local saturation before expensive closure
  status: review_required
  source_idea: IDEA-20261029-ec08bc
  derived_from_idea: IDEA-20261029-ec08bc
  objective: In the exact prime-field encoding, do exceptional denominator components
    rather than the genuine decomposition component account for a material part of
    solving cost, so chart-local saturation is 2x cheaper than the unsaturated exact
    baseline at identical recovered solution sets? Chart-local saturation cuts complete
    chart-union solve cost by 2x against the unsaturated exact baseline with an identical
    recovered solution set.
  inputs:
    proposal: ledger/proposals/IDEA-20261029-ec08bc.yaml
    design_protocol: experiments/EXP-PFDR-aaeffc/protocol.json
    design_packet: analysis/open-ideas-design-20261101/DESIGN.md
  controls:
  - 'A/A: C-aa'
  - 'positive: certificate-check'
  - 'negative: discard-branch'
  independent_variables:
  - arm
  metrics:
    primary:
    - complete_chart_union_solve_cost
    - verified_model_count
    - exception_coverage
    secondary: []
  replication:
    seeds:
    - 20261101
    - 20261102
    - 20261103
    independent_instances: 5
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: null
    maximum_memory_gb: 16.0
    maximum_runs: 64
  stopping_rules:
  - 'fixed: exhaustive small chart census x three saturation arms, exact model equality
    first, then stop'
  invalidation_rules:
  - a row whose instrument hash differs is excluded
  - a failed control voids the cells it protects
  success_criterion: C-gain is supported when saturated cost is at most 0.5x unsaturated
    with an identical solution set and checked certificates; a gain entirely from
    discarded valid relations, or from an equation count that leaves pivot ranks unchanged,
    refutes it.
  falsification_criterion: The apparent gain is entirely due to discarded valid relations.
  required_artifacts:
  - experiments/EXP-PFDR-aaeffc/protocol.json
  - experiments/EXP-PFDR-aaeffc/runs/
  - experiments/EXP-PFDR-aaeffc/results/
  - experiments/EXP-PFDR-aaeffc/reports/
  assigned_to: executor-mechanical
  approved_by: null
