experiment:
  id: EXP-PFDR-ff5fde
  hypothesis_id: H-PFDR-afc29a
  version: 1
  title: Partial multigraded Macaulay layers instead of whole-degree expansion
  status: review_required
  source_idea: IDEA-20261029-e4edce
  derived_from_idea: IDEA-20261029-e4edce
  objective: Do source-defined partial Macaulay degree layers with valid multigrading
    lower peak matrix entries by 2x and complete solve work by 20% at equal memory,
    without increasing the UNKNOWN rate? The combined partial-layer and multigraded
    arm cuts peak entries by 2x and complete solve work by 20% with no increase in
    the UNKNOWN rate.
  inputs:
    proposal: ledger/proposals/IDEA-20261029-e4edce.yaml
    design_protocol: experiments/EXP-PFDR-ff5fde/protocol.json
    design_packet: analysis/open-ideas-design-20261101/DESIGN.md
  controls:
  - 'A/A: C-aa'
  - 'positive: full-cert'
  - 'negative: random-grading'
  independent_variables:
  - arm
  metrics:
    primary:
    - peak_matrix_entries_and_field_ops
    - actual_solving_degree
    - unknown_rate
    secondary: []
  replication:
    seeds:
    - 20261101
    - 20261102
    - 20261103
    independent_instances: 6
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: null
    maximum_memory_gb: 16.0
    maximum_runs: 64
  stopping_rules:
  - 'fixed: one source calibration instance, then the small solver corpus x four ablations
    at equal caps, then stop'
  invalidation_rules:
  - a row whose instrument hash differs is excluded
  - a failed control voids the cells it protects
  success_criterion: C-gain is supported when peak entries fall 2x, complete work
    falls 20% and the UNKNOWN rate does not rise; improvements that vanish once selection,
    retries and root extraction are charged, or a full-size required rank before success,
    refute it.
  falsification_criterion: Required source rank assumptions fail and selected matrices
    reach full size before success.
  required_artifacts:
  - experiments/EXP-PFDR-ff5fde/protocol.json
  - experiments/EXP-PFDR-ff5fde/runs/
  - experiments/EXP-PFDR-ff5fde/results/
  - experiments/EXP-PFDR-ff5fde/reports/
  assigned_to: executor-mechanical
  approved_by: null
