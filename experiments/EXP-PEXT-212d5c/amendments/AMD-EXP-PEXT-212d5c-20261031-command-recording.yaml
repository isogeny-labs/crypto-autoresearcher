  reason: The supervisor refused both trials launched on 2026-10-29 (regression RUN-PEXT-fccfb9, lean RUN-PEXT-af1b2a)
    before publishing either, because the driver wrote run.code.command as " ".join([sys.executable, *sys.argv]),
    an absolute interpreter path, while the frozen plan launches the bare word python3. Those two run directories now
    exist as immutable refused-run records, and the plan reuses their run ids.
  refused_run_record: experiments/EXP-PEXT-212d5c/reports/run-20261029T1410Z/report.md
  changes:
  - path: experiments/EXP-PEXT-212d5c/implementation/run.py
    field: run.code.command recorded in the driver manifest (plus import shlex)
    from: '" ".join([sys.executable, *sys.argv])'
    to: 'shlex.join(getattr(sys, "orig_argv", None) or [sys.executable, *sys.argv])'
    effect: Records the exact launched argv (Python 3.10 or later, sys.orig_argv), which equals shlex.join of the
      supervisor's argv, one of the three forms tools/experiment_execution.py _check_driver_facts accepts. No computation,
      seed, sample, metric or artifact content changes.
    sha256:
      from: 808481c45a14f90d8347163e82644090fc0427a4e493dddce43413c650607575
      to: 10ed4714870dba07ea99934f6241b014fa4a4df83520a1265cc33bfd72d76939
  - path: experiments/EXP-PEXT-212d5c/trial-plan.json
    field: trials[regression].run_id and its --run-id argv element
    from: RUN-PEXT-fccfb9
    to: RUN-PEXT-5d190f
  - path: experiments/EXP-PEXT-212d5c/trial-plan.json
    field: trials[lean].run_id and its --run-id argv element
    from: RUN-PEXT-af1b2a
    to: RUN-PEXT-4d23b9
