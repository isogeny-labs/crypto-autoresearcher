      from: 411d537c209a201fdeba7ca6908fc65eef3ae0856de2825e933c4210c97d2b08
      to: 1c1f9540e3b05e54a74f6fbc14cacb9470468e504a2bc9d0fa55bc1a9c27ae8c
    rebound_in:
    - coordination/goals/GOAL-PEXT-4a1d6b/batches/BATCH-21339c/dispatch_queue.json (trial_plan_sha256; handoff objective and execution binding; artifact_paths and archive record_ids of the two reassigned trials)
    - ledger/handoffs/TASK-20261024-672126.yaml (trial_plan_sha256; objective and artifact_paths run ids of the two reassigned trials)
  run_id_reassignment:
