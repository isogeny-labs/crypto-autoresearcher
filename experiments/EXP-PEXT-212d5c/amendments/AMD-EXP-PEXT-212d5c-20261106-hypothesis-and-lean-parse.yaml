      Both prior run directories are retained as immutable refused-run records;
      a run id is never reused and a run directory is never overwritten.
    retained_refused_runs:
    - experiments/EXP-PEXT-212d5c/runs/RUN-PEXT-5d190f
    - experiments/EXP-PEXT-212d5c/runs/RUN-PEXT-4d23b9
    prior_refused_runs_still_retained:
    - experiments/EXP-PEXT-212d5c/runs/RUN-PEXT-fccfb9
    - experiments/EXP-PEXT-212d5c/runs/RUN-PEXT-af1b2a
    specification_note: >-
      specification.yaml is hash-pinned and unchanged; its narrative and trial
      table still name the original run ids. The executed ids are those of the
      frozen trial plan above; load_plan compares the specification by hash only.
  approval_semantics: >-
    Retains DEC-20261024-992998 as the scientific protocol approval and both
    earlier rebindings. This additive decision prospectively supersedes only the
    execution-binding values named above (plan hypothesis binding, one Lean
    axiom-parse expression, two run ids, plan/queue/handoff hashes). It does not
    rewrite those immutable records and does not assert a fresh experiment
    approval. Approval capacity is unchanged: no new contract is created and
    the approved-unrun count does not grow.
  preserved:
  - specification and hypothesis bytes
  - every implementation source byte other than the one guarded expression in run.py
  - fourteen source paths and four input paths
  - six trial ids, the run ids and argv of construct, char2, census and analyze, check_argv, dependency order
  - seeds, sample sizes, controls, metrics, thresholds, stopping and invalidation rules
  - original lane BATCH-21339c, executor task TASK-20261024-672126 and downstream archive ownership TASK-20261024-5ab5b8
  - all four earlier refused run directories and the 2026-10-29 and 2026-11-06 reports, none edited
  scientific_protocol_unchanged: true
  run_state: >-
