# EXPERIMENT CONTRACT -- EXP-QLWE-23c885 (review_required, unapproved, zero runs).
experiment:
  id: EXP-QLWE-23c885
  hypothesis_id: H-QLWE-754c7d
  derived_from_idea: IDEA-20261018-2f024b
  question_id: RQ-QLWE-d2d713
  goal_id: GOAL-QLWE-291164
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: eDCP regime map under three alpha conventions
  objective: Which LWE regimes the eDCP route can reach given measured sieve tolerance
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath symbolic, NumPy, matplotlib
    parameters: >-
      n in {64,128,256,512,1024}; q in {n^2, n^3, n^4, 2^{sqrt n}}; alpha grid 10 points;
      3 conventions
    procedure: >-
      1. Transcribe map twice. 2. Evaluate grid. 3. Overlay tolerance. 4. Count reachable
      regimes.
  controls:
  - >-
    null/negative: plain DCP from Regev 2004's original reduction with its quadratic blow-up
    (known infeasible)
  - 'positive: noise-free LWE (alpha=0), which must map to fault rate 0'
  - 'A/A: two independent transcriptions of the parameter map evaluated on the same grid'
  independent_variables:
  - alpha_convention
  - modulus_class
  metrics:
    primary:
    - reachable regime count
    secondary:
    - convention shift factor
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: reachable count for q=poly
    formula: '0'
    source: Kuperberg needs error-free samples
  scale_relevance:
    tier: toy
    justification: 'symbolic; transfer: tolerance curve extrapolation'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 1
    maximum_memory_gb: 4
    maximum_runs: 6
  stopping_rules:
  - stop after grid
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - A/A disagreement > 5% invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C2 count is 0 for polynomial q (P1) and C1 shift >= sqrt(n) (P2), AA1
    noise floor
  falsification_criterion: C2 count >= 1 for q <= n^4 (P1 falsified)
  decision_impact:
    on_positive: >-
      Obstruction map entry for the eDCP route with explicit regime boundaries and convention
      table
    on_negative: Open a costing of the reachable regime end to end under the declared quantum
      cost model
  variable_ledger:
    independent:
    - name: alpha_convention
      levels:
      - sigma_over_q
      - sqrt2pi_sigma_over_q
      - inverse
    - name: modulus_class
      levels:
      - n2
      - n3
      - n4
      - subexp
    factors:
    - name: transcription_copy
      treatment: crossed
      value: A or B
      how: independent transcriptions
    - name: tolerance_curve_version
      treatment: fixed
      value: frozen fit
      how: hash recorded
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - sigma_over_q
      - inverse
      differs_in:
      - alpha_convention
      design: one_factor
    - id: C2
      arms:
      - reachable regime count
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - transcription A
      - transcription B
      differs_in:
      - transcription_copy
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-2f024b.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-2f024b.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
  - raw-result.json (per-trial records)
  - regime_map.csv
  - conventions.md
  - report.pdf
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-QLWE-23c885/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-2f024b.
    standing_authorization: >-
