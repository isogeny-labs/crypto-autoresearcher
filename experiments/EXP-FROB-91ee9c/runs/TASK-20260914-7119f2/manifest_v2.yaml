  protocol_deviations_summary: >-
    See implementation.md for the full list. Headline items: (1) a
    slot-dimension labelling bug (bit-count instead of true summed factor
    degree) was found and fixed mid-run for the two non-fully-split cells
    (FROB-NOLATTICE-q13n5, FROB-EQDEG-q19n5) before any reported number was
    finalised; pre-fix artifacts are preserved under work/*.pre_bugfix and
    never used in metrics.json/cost-model.json. (2) C2/C3 full control
    batteries were computed only for the FIRST eligible object curve per
    cell (an operational scope choice consistent with the success
    criterion's "at least one eligible curve" wording), and that curve
    happens to be the one with a structurally degenerate (all-empty)
    non-trivial partition lattice in FROB-SPLIT-q11n5 and FROB-EQDEG-q19n5;
    the SECOND eligible curve is the one exhibiting the non-trivial-partition
    improvement effect and carries the object-arm measurement but not the
    full C2/C3 battery within this run. (3) FROB-EXT-q13n7 did not complete
    its full instrumented pass; not_run_resource per SR-4.

