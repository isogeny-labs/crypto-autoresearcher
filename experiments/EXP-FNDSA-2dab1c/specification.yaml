# EXPERIMENT CONTRACT -- EXP-FNDSA-2dab1c (review_required, unapproved, zero runs).
experiment:
  id: EXP-FNDSA-2dab1c
  hypothesis_id: H-FNDSA-e3a891
  derived_from_idea: IDEA-20261018-9b273e
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Build-pair signature disagreement census
  objective: Measure real compiler-induced arithmetic divergence at deployed n.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C reference signer, gcc and clang, deterministic seeded RNG, Python diff tool
    parameters: n in {512, 1024}; 20 self-generated keys; 5x10^4 signatures per key per build
    procedure: >-
      1. Build variants. 2. Fix tapes. 3. Sign. 4. Compare bytes; on difference, rerun with
      node tracing to find first divergence. 5. Tabulate.
  controls:
  - 'null: strict build vs itself (A/A, run twice)'
  - 'positive: one operation forced to float32 must disagree often'
  - 'A/A: strict vs strict across two run orders'
  independent_variables:
  - build_pair
  - dimension_n
  metrics:
    primary:
    - disagreement rate with exact binomial CI
    secondary:
    - first-divergence node histogram
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: FMA disagreement rate n=512
    formula: '>= 1e-5'
    source: one-ulp boundary argument
  scale_relevance:
    tier: medium
    justification: deployed n, self-generated keys, no attack
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    - 2026101810
    - 2026101811
    - 2026101812
    - 2026101813
    - 2026101814
    - 2026101815
    - 2026101816
    - 2026101817
    - 2026101818
    - 2026101819
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 6
    maximum_memory_gb: 2
    maximum_runs: 12
  stopping_rules:
  - stop when 10^6 signatures per pair compared
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - any build failing KAT vectors invalidates that build
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    P1 holds for strict_vs_emulated and C1 shows P2, with AA1 at zero as noise floor; C2 confirms
    detection.
  falsification_criterion: C1 shows zero FMA disagreements in 10^6 signatures, or strict_vs_emulated
    disagrees.
  decision_impact:
    on_positive: >-
      Pin floating-point build flags as a nuisance factor in every FN-DSA run and report the
      measured flip rate.
    on_negative: Treat conforming builds as interchangeable for this lane.
  variable_ledger:
    independent:
    - name: build_pair
      levels:
      - strict_vs_emulated
      - strict_vs_fma_contracted
      - strict_vs_float32_planted
    - name: dimension_n
      levels:
      - '512'
      - '1024'
    factors:
    - name: run_order
      treatment: randomized
      value: two orders
      how: shuffle build execution
    - name: host_cpu
      treatment: measured
      value: recorded
      how: cpuid in manifest
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - strict_vs_fma_contracted
      - strict_vs_emulated
      differs_in:
      - build_pair
      design: one_factor
    - id: C2
      arms:
      - strict_vs_float32_planted
      - strict_vs_emulated
      differs_in:
      - build_pair
      design: one_factor
    - id: AA1
      arms:
      - strict order A
      - strict order B
      differs_in:
      - run_order
      design: aa
    crosses_map: false
  prediction_provenance:
