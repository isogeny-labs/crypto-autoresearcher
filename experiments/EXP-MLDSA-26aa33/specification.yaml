# EXPERIMENT CONTRACT -- EXP-MLDSA-26aa33 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-26aa33
  hypothesis_id: H-MLDSA-0565ce
  derived_from_idea: IDEA-20261018-94b270
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Deterministic vs hedged under simulated y leakage
  objective: the passive trace-count advantage deterministic mode gives an attacker
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Python/NumPy simulator, ML-DSA-44 shapes, fpylll finish
    parameters: >-
      ML-DSA-44; sigma in {0.5,1,2,4,8}; R repeats in {1,4,16,64}; 5 keys per seed block;
      cap 10^6 signatures
    procedure: 1) Sign. 2) Generate leakage. 3) Posterior on y, then c s1. 4) Solve and certify.
  controls:
  - 'null: leakage independent of y'
  - 'positive: sigma = 0 exact y'
  - 'A/A: hedged sigma = 4 two seed blocks'
  independent_variables:
  - signing_mode
  - noise_sigma
  metrics:
    primary:
    - signatures to recovery per mode
    secondary:
    - posterior entropy per coefficient
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: N_hedged/N_det
    formula: approximately R_opt for sigma > 1
    source: noise averaging
  scale_relevance:
    tier: medium
    justification: real sizes, simulated leakage
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop at recovery or 10^6 signatures
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: P1 in C1 and P2 in C2; AA1 noise floor within factor 1.5
  falsification_criterion: C1 ratio < 2
  decision_impact:
    on_positive: >-
      add the passive deterministic-mode penalty to the hedged-vs-deterministic attacker-model
      entry
    on_negative: record that deterministic mode has no passive penalty in this model
  variable_ledger:
    independent:
    - name: signing_mode
      levels:
      - deterministic
      - hedged
    - name: noise_sigma
      levels:
      - '0.5'
      - '1'
      - '2'
      - '4'
      - '8'
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    - name: repeat_count_R
      treatment: fixed
      value: best R per sigma chosen in a pilot
      how: frozen before main run
    comparisons:
    - id: C1
      arms:
      - deterministic sigma4
      - hedged sigma4
      differs_in:
      - signing_mode
      design: one_factor
    - id: C2
      arms:
      - ratio vs sigma
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - hedged sigma4 seed-block A
      - hedged sigma4 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-94b270.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-94b270.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLDSA-26aa33/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-94b270.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
