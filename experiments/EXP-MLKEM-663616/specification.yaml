experiment:
  id: EXP-MLKEM-663616
  hypothesis_id: H-MLKEM-954951
  derived_from_idea: IDEA-20261018-fdcbd0
  question_id: RQ-MLKEM-003
  goal_id: null
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: G6K bucket-size logging and QRAM pricing
  objective: Gap between modelled and measured Grover search-space inputs
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: G6K (patched to log buckets), Python
    parameters: dims {50,60,70,80,90}; 5 instances per shape; QRAM price {0,0.1,1}
    procedure: 1. Patch logging. 2. Run pumps. 3. Aggregate. 4. Price. 5. Compare to model.
  controls:
  - 'null/negative: random lattices of same det/dim'
  - 'positive: synthetic bucket logs drawn from the model law must give deviation < 2%'
  - 'A/A: two seeds per shape'
  independent_variables:
  - lattice_shape
  - dimension
  metrics:
    primary:
    - bucket size deviation
    - priced ratio deviation
    secondary:
    - hit count per bucket
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: deviation
    formula: '>= 15%'
    source: variance of bucket sizes
  scale_relevance:
    tier: medium
    justification: 'dims <= 90; transfer: deviation trend in dim'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 60
    maximum_memory_gb: 64
    maximum_runs: 30
  stopping_rules:
  - stop dims exceeding 2 h
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - positive control > 2% invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C2 deviation >= 15% and priced difference >= 2 bits (P1, P2), C1 shape effect reported,
    AA1 noise floor
  falsification_criterion: C2 deviation < 5% at all dims and priced difference < 0.5 bits
  decision_impact:
    on_positive: Measured bucket laws become the shared quantum-sieve input for ML-KEM and
      ML-DSA cost work
    on_negative: Model means adopted as adequate; no instrument change
  variable_ledger:
    independent:
    - name: lattice_shape
      levels:
      - kem_shape
      - dsa_shape
      - random_null
    - name: dimension
      levels:
      - '50'
      - '60'
      - '70'
      - '80'
      - '90'
    factors:
    - name: instance_seed
      treatment: randomized
      value: 2 blocks
      how: rng
    - name: qram_price
      treatment: crossed
      value: 0,0.1,1
      how: post-hoc
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - kem_shape
      - random_null
      differs_in:
      - lattice_shape
      design: one_factor
    - id: C2
      arms:
      - measured vs model deviation
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - seed A
      - seed B
      differs_in:
      - instance_seed
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-fdcbd0.yaml
    written_at: '2026-10-18'
    data_seen: []
