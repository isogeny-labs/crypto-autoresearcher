# EXPERIMENT CONTRACT -- EXP-MLDSA-d52bb2 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-d52bb2
  hypothesis_id: H-MLDSA-8cbde9
  derived_from_idea: IDEA-20261018-3e34f5
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Weak-key census at ML-DSA-44
  objective: the cost of third-party forgery under weak public keys and the recall of cheap
    pk checks
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Python FIPS 204 with key construction hooks
    parameters: ML-DSA-44; classes {honest, t1_zero, sparse_w1, sparse_w2, sparse_w3}; 20
      keys per class
    procedure: 1) KAT. 2) Construct keys. 3) Forge / recover. 4) Evaluate rules.
  controls:
  - 'null: honest keys (no forgery, rules never fire)'
  - 'positive: t1 = 0 key'
  - 'A/A: w = 2 under two seeds'
  independent_variables:
  - key_class
  metrics:
    primary:
    - forgery/recovery time
    secondary:
    - rule recall
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: sparse recovery ops
    formula: C(1024,w) 4^w
    source: exhaustive search
  scale_relevance:
    tier: crypto
    justification: real parameters
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop per cell at 20 keys or 1 CPU hour
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: P1 in C1, P2 in C2, P3 reported; AA1 noise floor within factor 1.5
  falsification_criterion: C1 no forgery or C2 off by > 16
  decision_impact:
    on_positive: propose a pk-validation note listing what cheap checks catch and what they
      miss
    on_negative: record that weak keys are not forgeable as predicted and examine verify
  variable_ledger:
    independent:
    - name: key_class
      levels:
      - honest
      - t1_zero
      - sparse_w1
      - sparse_w2
      - sparse_w3
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    comparisons:
    - id: C1
      arms:
      - t1_zero
      - honest
      differs_in:
      - key_class
      design: one_factor
    - id: C2
      arms:
      - sparse time vs w
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - sparse_w2 seed-block A
      - sparse_w2 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-3e34f5.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-3e34f5.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P3
    first_recorded_in: ledger/proposals/IDEA-20261018-3e34f5.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLDSA-d52bb2/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-3e34f5.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
