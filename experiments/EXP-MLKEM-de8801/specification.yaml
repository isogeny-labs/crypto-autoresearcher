# EXPERIMENT CONTRACT -- EXP-MLKEM-de8801 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-de8801
  hypothesis_id: H-MLKEM-cf6634
  derived_from_idea: IDEA-20261018-7b3a19
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Total-cost head-to-head of module-BKZ and scalar BKZ at matched profile slope
  objective: Decide the sign of the module-structure cost difference at the block ranks ML-KEM
    uses.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      SageMath 10 module-LLL/module-BKZ prototype with operation counters, fpylll BKZ 2.0
      with node counters
    parameters: >-
      d in {1,8,16,32}, r in {2,3}, q=3329, CBD(2); 20 instances per cell; target slope =
      that of scalar BKZ-30 output
    procedure: >-
      1) Freeze. 2) Scalar BKZ-30 defines target slope per instance. 3) Run module-BKZ with
      increasing module block rank until slope reached. 4) Count ops. 5) Ratios with bootstrap
      CI.
  controls:
  - >-
    null: unstructured lattice of the same dimension where module-BKZ is run on a fake module
    basis (block-diagonal grouping without ring structure) - the module algorithm's advantage,
    if any, must vanish
  - >-
    positive: d=1 (Z-modules) where module-BKZ equals scalar BKZ and the ratio must be 1 within
    noise
  - 'A/A: scalar BKZ run twice with different basis-randomization seed blocks'
  independent_variables:
  - reduction_algorithm
  - ring_degree
  - module_rank
  metrics:
    primary:
    - total counted ops ratio
    secondary:
    - uSVP success rate at reached profile
    - wall clock
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: log2 cost ratio at r=2
    formula: 0.292*Delta(d,2)-ish if oracle cost dominates
    source: DEP 2025/1904 blocksize law (recalled)
  scale_relevance:
    tier: toy
    justification: >-
      ring degree <= 32; transfer assumption: the fitted trend in d extrapolates to d=256
      only as a conditional statement
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    - 2026101810
    - 2026101811
    - 2026101812
    - 2026101813
    - 2026101814
    - 2026101815
    - 2026101816
    - 2026101817
    - 2026101818
    - 2026101819
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 80
    maximum_memory_gb: 8
    maximum_runs: 320
  stopping_rules:
  - stop the cell if module-BKZ fails to reach target within 50x scalar cost; record censored
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - d=1 positive control outside [0.8,1.25] invalidates counters
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C1 ratio CI lies outside [0.5,2] at r=2 (P1) and C2 shows a monotone trend in ring_degree
    (P2), above AA1 noise floor.
  falsification_criterion: C1 ratio CI lies within [0.5,2] at every d, or C2 trend is non-monotone.
  decision_impact:
    on_positive: >-
      Feed the measured cost ratio and its d-trend into the module-BKZ lane's go/no-go and
      into 353361's offset interpretation.
    on_negative: >-
      Record that module and scalar BKZ are cost-indistinguishable at small rank; module structure
      neither helps nor hurts the attacker at measurable sizes.
  variable_ledger:
    independent:
    - name: reduction_algorithm
      levels:
      - scalar_bkz
      - module_bkz
    - name: ring_degree
      levels:
      - '1'
      - '8'
      - '16'
      - '32'
    - name: module_rank
      levels:
      - '2'
      - '3'
    factors:
    - name: basis_seed_block
      treatment: randomized
      value: A,B
      how: unimodular randomization before reduction
    - name: instance_seed
      treatment: randomized
      value: '20'
      how: paired across arms
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - module_bkz
      - scalar_bkz
      differs_in:
      - reduction_algorithm
      design: one_factor
    - id: C2
      arms:
      - ratio by ring_degree
      differs_in:
      - reduction_algorithm
      - ring_degree
      design: factorial
    - id: AA1
      arms:
      - scalar_bkz block A
      - scalar_bkz block B
      differs_in:
      - basis_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-7b3a19.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-7b3a19.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with frozen protocol hash, tool versions (fpylll/G6K/Sage commit ids), host
    and seeds
  - raw-result.json with one row per (arm, instance, seed) including verification flag
  - analysis.json with effect sizes, bootstrap CIs and the AA noise floor
  - report.md plus graph (SVG/PNG) and PDF per the research-visuals skill
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
