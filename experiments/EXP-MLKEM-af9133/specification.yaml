# EXPERIMENT CONTRACT -- EXP-MLKEM-af9133 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-af9133
  hypothesis_id: H-MLKEM-9ee6bc
  derived_from_idea: IDEA-20261018-7ba702
  question_id: RQ-MLKEM-003
  goal_id: null
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Progressive overhead constant across sieve dimensions
  objective: Measure the within-call overhead core-SVP omits.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: G6K with per-step counters, Python
    parameters: d in {60,65,70,75,80,85,90}; f in {0,d4f}; step in {1,4,d}; 5 instances
    procedure: 1) Freeze. 2) Run pumps and cold sieves. 3) Compute C_prog and c. 4) Compare
      with series.
  controls:
  - 'null: a pump with step size equal to full dimension (no progression) must give C_prog
    ~ 1'
  - >-
    positive: progressive step 1 vs step 4 where the series prediction changes in a computable
    direction
  - 'A/A: default pump with two database seed blocks'
  independent_variables:
  - progression_step
  - sieve_dim
  metrics:
    primary:
    - C_prog
    - drift in bits across d
    secondary:
    - fitted c
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: C_prog
    formula: 1/(1-2^{-c})
    source: geometric series, derived before data
  scale_relevance:
    tier: medium
    justification: >-
      sieve dimensions 60-90 on a single node; transfer assumption: the per-dimension exponent
      of the measured quantity is extrapolated to beta~400-900 only as a conditional statement
      with the fit interval; no FIPS 203 security claim
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    independent_instances: 5
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 120
    maximum_memory_gb: 64
    maximum_runs: 220
  stopping_rules:
  - none beyond budget
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C2 shows C_prog in [3,8] (P1) and within 1.5x of series (P2) with drift < 1 bit; C1 null
    ~1; beyond AA1 noise floor.
  falsification_criterion: C2 C_prog outside [2,12] or prediction miss > 2x.
  decision_impact:
    on_positive: Add log2 C_prog as a measured additive term to the memory-charged ML-KEM
      estimate.
    on_negative: Flag the geometric-series overhead as unreliable and carry the measured curve
      instead.
  variable_ledger:
    independent:
    - name: progression_step
      levels:
      - '1'
      - '4'
      - full_null
    - name: sieve_dim
      levels:
      - '60'
      - '65'
      - '70'
      - '75'
      - '80'
      - '85'
      - '90'
    factors:
    - name: db_seed_block
      treatment: randomized
      value: A,B
      how: database seed
    - name: threads
      treatment: fixed
      value: '8'
      how: pinned
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - step 1
      - full_null
      differs_in:
      - progression_step
      design: one_factor
    - id: C2
      arms:
      - C_prog vs series prediction
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - step 1 block A
      - step 1 block B
      differs_in:
      - db_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-7ba702.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-7ba702.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with frozen protocol hash, tool versions (fpylll/G6K/Sage commit ids), host
    and seeds
  - raw-result.json with one row per (arm, instance, seed) including verification flag
  - analysis.json with effect sizes, bootstrap CIs and the AA noise floor
  - report.md plus graph (SVG/PNG) and PDF per the research-visuals skill
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
