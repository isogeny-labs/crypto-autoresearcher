# EXPERIMENT CONTRACT -- EXP-HQC-0fed82 (review_required, unapproved, zero runs).
experiment:
  id: EXP-HQC-0fed82
  hypothesis_id: H-HQC-5bcd4f
  derived_from_idea: IDEA-20261018-a4977e
  question_id: RQ-HQC-001
  goal_id: GOAL-HQC-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Prior-weighted Prange under sampler bias
  objective: Translate sampler bias into ISD cost.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C or NumPy Prange
    parameters: n=131 QC; bias scale s in {1,2^4,2^8} times measured; 500 instances
    procedure: 1. Bias model. 2. Instances. 3. Solve both ways. 4. Compare to KL law.
  controls:
  - 'null: unbiased sampler, both Prange variants equal'
  - 'positive: strongly biased sampler (only half positions possible)'
  - 'A/A: uniform Prange two seed blocks'
  independent_variables:
  - isd_variant
  - bias_scale
  metrics:
    primary:
    - iteration reduction
    secondary:
    - KL prediction residual
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: reduction
    formula: E_prior[P(avoid)] / E_uniform[P(avoid)]
    source: Prange success probability
  scale_relevance:
    tier: toy
    justification: 'n=131; transfer: law in KL'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 18
  stopping_rules:
  - 500 instances per cell
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - unsolved censored
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    Success if C1 at scale 2^8 within 25% of prediction (P1) and C2 shows <= 1.05x at measured
    bias (P2), beyond the AA1 noise floor.
  falsification_criterion: Falsified if C1 off by > 2x or C2 > 1.2x at measured bias.
  decision_impact:
    on_positive: Close sampler bias as an ISD concern with a quantitative bound.
    on_negative: Escalate sampler bias to an ISD cost reduction claim.
  variable_ledger:
    independent:
    - name: isd_variant
      levels:
      - uniform
      - prior_weighted
    - name: bias_scale
      levels:
      - '1'
      - 2^8
    factors:
    - name: seed_block
      treatment: randomized
      value: seed blocks A and B, disjoint master seeds
      how: >-
        two disjoint master seeds derived by SHAKE256 from a frozen label; every arm run under
        both
    comparisons:
    - id: C1
      arms:
      - uniform 2^8
      - prior_weighted 2^8
      differs_in:
      - isd_variant
      design: one_factor
    - id: C2
      arms:
      - prior_weighted 1
      - prior_weighted 2^8
      differs_in:
      - bias_scale
      design: one_factor
    - id: C3
      arms:
      - unbiased null
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - uniform 1 seed-block A
      - uniform 1 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-a4977e.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-a4977e.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with frozen parameters, seeds, code commit and tool versions
  - raw-result.json with per-trial records and verification flags
  - iterations CSV
  - SVG
  - PDF
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-HQC-0fed82/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-a4977e.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
