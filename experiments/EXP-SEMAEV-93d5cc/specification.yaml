experiment:
  id: EXP-SEMAEV-93d5cc
  hypothesis_id: H-SEMAEV-94dab2
  goal_id: GOAL-ECDLP-001
  question_id: RQ-ECDLP-002
  version: 1
  title: >-
    Matched legacy/repaired s4_expr rerun of every archived S4-consuming run
    (EXP-MTIC-001, EXP-FIB-001, RUN-ICINV-e0cd8f-m3class) with a legacy-arm
    reproduction control
  status: analyzed
  frozen: true
  approved_by: DEC-20261018-a7a0fd
  approved_at: '2026-10-18'
  execution_authorized: true
  designed_at: '2026-10-18'
  designed_under_task: TASK-20261018-c56310
  claim_tier: toy
  class: >-
    evidence-integrity measurement (matched rerun, one substituted function);
    successor in scope to the approved, unrun EXP-DTREE-b93a15, whose
    fix-only bit-exact recomputation of the MTIC/FIB runs this contract
    contains as its repaired arm. EXP-DTREE-b93a15 keeps its status.
  objective: >-
    Measure how much the pre-2026-08-13 shared s4_expr defect (x3 dropped by
    a non-simultaneous substitution) changed the archived results built on
    it, and whether each recorded conclusion changes. Every archived run
    whose code path calls s4_expr is rerun with its archived program,
    frozen instances, targets, seeds and caps, twice and concurrently: arm
    LEGACY with s4_expr from the exact recorded bytes, arm REPAIRED with the
    current s4_expr. LEGACY against the archive tests reproduction (a
    mismatch is environment drift, made visible); REPAIRED against LEGACY
    measures the defect.
  source_records:
  - CORR-20260813-d9f0fa
  - KN-OPEN-5b3a08
  - H-DTREE-8636a3
  - EXP-DTREE-b93a15
  - EXP-SEMAEV-a097b5
  - DEC-20260813-520485
  owner_request: >-
    Repository owner, 2026-10-18, lead 3 of the index-calculus leads
    follow-up; audit note docs/reports/2026-10-18-semaev-s4-factor-base-audit.md
    and coordination/remediation/DECISION-REQUEST-20261018-ic-integrity.md
    (R-1.3) on branch claude/ic-integrity-fixes-20261018 (PR #2399).
  selection:
    rule: >-
      Every archived run whose code path calls harness.semaev.s4_expr, fixed
      before any rerun output existed, by import and call-site analysis of
      run_mtic.py (s4_setup <- descent_jobs <- descent_run/run_010),
      driver/decompcost.py (_worker <- measure_s4_decomposition <-
      _run_decomp_measurement <- run_fib_004/005) and
      harness/exp_icinv_e0cd8f_m3class.py (s4_generators <-
      build_m4_singular_script <- compute_curve_m4). This is the whole
      exposed set, not a sample.
    cells:
    - {cell: icinv-m4, archived: RUN-ICINV-e0cd8f-m3class, scope: 'm4 stage only: all 138 control and 138 class curves, base and gauge twin (552 Singular calls per arm)'}
    - {cell: fib-004, archived: RUN-FIB-004, scope: 'C16-1, C16-2; 200 targets each, 20 s per-solve, 1500 s per-curve, 1800 s per-run caps'}
    - {cell: fib-005, archived: RUN-FIB-005, scope: 'C20-1, C20-2; same caps'}
    - {cell: fib-decision, archived: 'RUN-FIB-006C, RUN-FIB-007 ratio, RUN-FIB-008 gate', scope: 'driver/resume2.py logic on this arm''s RUN-FIB-004/005 and the archived S4-independent RUN-FIB-002/003/007'}
    - {cell: mtic-007, archived: RUN-MTIC-007, scope: '16-bit, 50 descent targets, 60 s per solve, 1500 s cumulative'}
    - {cell: mtic-008, archived: RUN-MTIC-008, scope: '20 and 24-bit, round-robin, same caps'}
    - {cell: mtic-010b, archived: RUN-MTIC-010b, scope: '20-bit ablation descents (B = 52, 115) and the final aggregation (K*, regime) on this arm''s RUN-MTIC-007/008 and the archived S4-independent runs'}
    excluded:
    - {run: 'RUN-MTIC-001..006, -009; RUN-FIB-001..003', reason: 'no s4_expr call on the code path (IMMUNE by import analysis); used as archived inputs where a cell reads them'}
    - {run: RUN-MTIC-010, reason: 'failed_implementation (KeyError after the descents), superseded by RUN-MTIC-010b, which reruns its full protocol and is a cell'}
    - {run: 'RUN-FIB-006, -006B', reason: 'superseded by RUN-FIB-006C (authoritative), which the fib-decision cell recomputes'}
    - {run: 'RUN-ICINV-e0cd8f-s0, -s1', reason: 'failed_infrastructure, no results'}
    - {run: 'RUN-ICINV-e0cd8f-m3class m3 stage', reason: 'uses s3_expr only'}
  arms:
    legacy:
      s4_source: experiments/EXP-SEMAEV-93d5cc/implementation/vendor/semaev_legacy_53a23952.py
      s4_source_sha256: 53a23952420f8ee724b70746eb7c872e54cbb33dc4cb24be1e88dcdcbef4817e
      note: byte-identical to harness/semaev.py at a2947025e2, 1ba846482a, 53d3fed02f and 76a48ff3d8 (the recorded commits of every exposed run)
    repaired:
      s4_source: harness/semaev.py
      s4_source_sha256: c417f1948d7df7bb1864726e169d885e4d3163cb62036393f2616ef71c630de6
    installation: >-
      arms.install assigns the consumer module's s4_expr name binding
      (run_mtic.s4_expr, harness.exp_icinv_e0cd8f_m3class.s4_expr, and
      driver.decompcost.s4_expr inside each spawn child via fib_child.solve
      and the EXP_S4RR_ARM environment variable). Nothing else is patched.
    pairing: both arms of a cell run as concurrent processes in one trial, so they share host and load
  inputs:
    archived_runs:
    - experiments/EXP-MTIC-001/runs/RUN-MTIC-007
    - experiments/EXP-MTIC-001/runs/RUN-MTIC-008
    - experiments/EXP-MTIC-001/runs/RUN-MTIC-010b
    - experiments/EXP-FIB-001/runs/RUN-FIB-004
    - experiments/EXP-FIB-001/runs/RUN-FIB-005
    - experiments/EXP-FIB-001/runs/RUN-FIB-006C
    - experiments/EXP-ICINV-e0cd8f/runs/RUN-ICINV-e0cd8f-m3class
    programs:
    - experiments/EXP-MTIC-001/code/run_mtic.py
    - experiments/EXP-FIB-001/driver/
    - harness/exp_icinv_e0cd8f_m3class.py
    environment: >-
      This container: Linux x86_64, CPython 3.13, sympy 1.14.0 (as archived),
      Singular 4.4.1 from /opt/conda-sage/envs/sage (archived 4.3.2). The
      archive ran on macOS arm64 (MTIC, FIB) and an unrecorded Linux host
      (ICINV).
  input_bindings:
    legacy_semaev: {path: experiments/EXP-SEMAEV-93d5cc/implementation/vendor/semaev_legacy_53a23952.py, sha256: 53a23952420f8ee724b70746eb7c872e54cbb33dc4cb24be1e88dcdcbef4817e}
    repaired_semaev: {path: harness/semaev.py, sha256: c417f1948d7df7bb1864726e169d885e4d3163cb62036393f2616ef71c630de6}
  controls:
  - id: CTRL-LEGACY-REPRO
    method: >-
      Legacy arm against the archive, per cell, by the frozen rules in
      implementation/compare.py::legacy_control: icinv-m4 every one of the
      552 (s4_support, singular-locus dim, degree, unit) tuples equal;
      fib-004/005 per-target (capped, basis size, basis max degree, trivial)
      equal on every target both measured, resource_exhaustion equal,
      all-capped pattern equal, n_measured within +-2; fib-decision
      correlation gate, curves passing and per-curve status equal;
      mtic-007/008 per-target tuples equal on common targets, uncapped count
      equal, n_attempted within +-2; mtic-010b regime, K* and uncensored
      counts equal per size and K* and capped pattern per ablation base.
    pass_condition: every check of the cell holds
    on_fail: >-
      The cell's REPAIRED-vs-LEGACY contrast is still reported but labelled
      drift-confounded and decides nothing; the mismatch is itself recorded
      as an observation about the archive's reproducibility.
  - id: CTRL-ARM-FINGERPRINT
    method: >-
      check.py: each arm's installed s4_expr has the pinned source sha256 and
      its frozen fingerprint on the EXP-SEMAEV-a097b5 fixture (y^2 = x^3 +
      2x + 3, F_101, abscissae 1, 3, 5, 41): legacy free symbols {x1, x2,
      x4}; repaired {x1, x2, x3, x4}, total degree 12, residue 0. For FIB
      cells every spawn child logs its arm, module and source hash.
    pass_condition: exact; a failure makes the trial invalid_output (instrument failure, not evidence)
  - id: CTRL-REEXTRACT
    method: check.py recomputes the comparison from the arm outputs and requires byte equality with raw-result.json
    pass_condition: exact
  - id: CTRL-IMMUNE-BY-IMPORT
    method: >-
      The excluded runs are classified IMMUNE by the call-site analysis
      under selection.rule; the report restates it per run.
    pass_condition: recorded
  independent_variables:
  - name: s4_arm
    levels: [legacy, repaired]
  - name: cell
    levels: [icinv-m4, fib-004, fib-005, fib-decision, mtic-007, mtic-008, mtic-010b]
  metrics:
    primary:
    - per cell, the archived / legacy / repaired values of the S4-dependent outputs extracted by compare.extract (ICINV m4 tuple distributions and per-record differences; FIB n_measured, n_capped, n_solved, median cost, basis size and degree counts, resource_exhaustion; FIB correlation and gate fields; MTIC attempted, capped, trivial-ideal, cancelled counts and T_desc medians; MTIC-010b regime and K* per accounting)
    - per cell, CTRL-LEGACY-REPRO pass/fail with its checks
    - per cell and conclusion field, changed (repaired vs archived) and changed (repaired vs legacy)
    secondary:
    - ICINV records differing between arms (count of 552)
    - wall seconds per arm (host-dependent, never a cost claim)
  conclusion_rules:
    note: >-
      The recorded conclusion of each archived run, and the field whose change
      counts as a change of that conclusion (compare.conclusion_fields). A
      conclusion changes when the repaired arm's field differs from the
      archived one; it is attributed to the defect only when CTRL-LEGACY-REPRO
      passes for that cell and the legacy arm's field equals the archived one.
    icinv-m4: >-
      RUN-ICINV-e0cd8f-m3class verdict CLASS-VARYING rests on m3 families
      only (PRIMARY_FAMILIES; EV-ICINV-8afb64 cites no m4 number). Fields: the
      set of m4 s4_support values, the set of singular-locus (dim, degree)
      values, gauge agreement of m4, and whether the class and control m4
      tuple sets are equal. A change in these changes the archived m4
      secondaries; the m3 verdict cannot change by construction and is
      restated, not rerun.
    fib-004/005: per curve, resource_exhaustion and whether every measured solve was capped
    fib-decision: correlation_gate_pass_overall, correlation_gate_curves_passing, per_curve_status, predictor_cost_gate_pass, gate_pass, RUN-FIB-008 outcome
    mtic-007/008: per size, whether every attempted solve was capped and whether the T_desc median sits at the 60 s cap
    mtic-010b: regime per accounting and K* per accounting at 16, 20 and 24 bits; K* per ablation base
  variable_ledger:
    independent:
    - name: s4_arm
      levels: [legacy, repaired]
    factors:
    - name: archived_program
      treatment: fixed
      value: the committed run_mtic.py, driver/*.py and exp_icinv_e0cd8f_m3class.py, unmodified, bound by source_sha256
      how: both arms import the same files; only the s4_expr binding differs
    - name: instances_targets_seeds
      treatment: fixed
      value: the archived frozen-instances.yaml files, target streams and seeds, and the archived ICINV curve lists
      how: read in place (copied into the arm directory with sha256 where a program needs them under --out-root)
    - name: caps
      treatment: fixed
      value: archived per-solve and cumulative wall-clock caps and the 180 s Singular timeout
      how: program constants, unchanged
    - name: other_harness_functions
      treatment: fixed
      value: current tree (build_factor_base default byte-identical to legacy, CORR-20260813-d9f0fa)
      how: same process tree for both arms
    - name: execution_environment
      treatment: fixed
      value: within a trial both arms run concurrently on one host (this container, Linux x86_64, Python 3.13, sympy 1.14.0, Singular 4.4.1)
      how: fixed between the arms of a cell; differs only between the archive (macOS arm64 for MTIC and FIB, Singular 4.3.2 for ICINV, earlier dates) and this rerun, which is what CTRL-LEGACY-REPRO exposes; affects cap-truncated counts and timing
    comparisons:
    - id: C-defect
      arms: [legacy, repaired]
      differs_in: [s4_arm]
      design: one_factor
      note: per cell; decisive only where C-aa-legacy-archive passes
    - id: C-aa-legacy-archive
      arms: [archived run, legacy arm]
      differs_in: [execution_environment]
      design: aa
      note: same function, program and inputs, different machine and time; its mismatches are the drift floor C-defect is read against
    - id: C-repaired-archive
      arms: [archived run, repaired arm]
      differs_in: [s4_arm, execution_environment]
      design: confounded
      reason: two factors change at once; reported because the owner asked for archived-vs-repaired, decides nothing alone
    crosses_map: false
    crosses_map_note: no claim moves across a map; every arm runs the archived instance as stored
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/hypotheses/H-SEMAEV-94dab2.yaml
    written_at: '2026-10-18'
    data_seen:
    - path: docs/reports/2026-10-18-semaev-s4-factor-base-audit.md (branch claude/ic-integrity-fixes-20261018, PR #2399)
      measured: repaired s4_support 439 on ICINV curves (3603, 2402) and (2646, 1291) at p = 4001
    - path: this session's launcher feasibility smoke (scratch, not cited as evidence)
      measured: on the off-set curve (17, 29) at p = 4001, legacy m4 = (227, 2, 60, false) and repaired m4 = (439, 2, 39, false), about 1 s and 4 s per Singular call
    sample_status: partially_in_sample
    overlap: two of 276 ICINV curves for s4_support; one off-set curve for the singular locus; no MTIC or FIB cell
    decisive_scope: s4_support on the 274 ICINV curves (548 records) other than (3603, 2402) and (2646, 1291); P1 is a calibration check and carries no criterion
  - prediction: P2
    first_recorded_in: ledger/hypotheses/H-SEMAEV-94dab2.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: code reading only
  - prediction: P3
    first_recorded_in: ledger/hypotheses/H-SEMAEV-94dab2.yaml
    written_at: '2026-10-18'
    data_seen:
    - path: experiments/EXP-FIB-001/runs/ and experiments/EXP-MTIC-001/runs/
      measured: the archived (legacy, other host) values the legacy arm is meant to reproduce
    sample_status: out_of_sample
    overlap: no repaired-arm value of any MTIC or FIB cell was observed before freezing (plumbing smokes printed structure only)
  heuristic_under_test: null
  preregistered_prediction:
    quantity: per-cell change of the S4-dependent outputs between arms
    formula: none (measurement); P1 and P2 of H-SEMAEV-94dab2 are calibration checks
    source: H-SEMAEV-94dab2
  scale_relevance:
    tier: toy
    justification: the archived runs are toy-tier; the rerun reproduces their scale exactly and asserts nothing beyond it
    correspondence: null
  tail_checks:
  - every ICINV record has returncode 0 or an explicit timeout entry; timeouts are counted, never imputed
  - every FIB measurement records worker_error; a non-null worker_error is reported per arm
  replication:
    seeds: archived (MTIC seeds 1, 2, 3; FIB instance seeds 1, 2 and permutation seed 20260807; ICINV seed 20260810 curve lists)
    independent_instances: as archived
    note: one execution per arm per cell; the archive is the replicate the legacy arm is compared with (C-aa-legacy-archive)
  budget:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 7
    maximum_workers: 2
    note: advisory and machine protection only; two concurrent arm processes per trial on a 4-CPU container
  stopping_rules:
  - Run the 7 trials once each in plan order; no trial is repeated under a new id unless the supervisor recorded an infrastructure failure before either arm produced output.
  - A watchdog expiry, crash or memory kill is failed_infrastructure for that trial, never evidence about the defect.
  - Stop after the seventh trial; nothing is rerun to change a CTRL-LEGACY-REPRO outcome.
  invalidation_rules:
  - CTRL-ARM-FINGERPRINT or CTRL-REEXTRACT fails (instrument failure).
  - Any archived artifact or experiment directory other than experiments/EXP-SEMAEV-93d5cc/ is written.
  - An arm imports a different s4_expr than its pinned source, or any other function is substituted.
  success_criterion: >-
    Decidable per cell from the metrics: the cell measures the defect when
    both arms complete, CTRL-ARM-FINGERPRINT and CTRL-REEXTRACT pass, and
    CTRL-LEGACY-REPRO passes; then C-defect reports whether each conclusion
    field changed. The experiment succeeds as a measurement when every cell
    is decided either way.
  falsification_criterion: >-
    Per cell (H-SEMAEV-94dab2): with CTRL-LEGACY-REPRO passing, the repaired
    arm equals the legacy arm on every S4-dependent output the cell records.
    A cell whose CTRL-LEGACY-REPRO fails decides nothing.
  decision_impact:
    on_positive: >-
      Where a cell's repaired arm changes a recorded output with the legacy
      control passing, a CORR record names the archived run, the changed
      field, archived and repaired values, and binds this experiment's run as
      the superseding numerical record; where a recorded conclusion field
      changes, the Coordinator reviews the affected hypothesis on its own
      path (no status change follows from this experiment alone).
    on_negative: >-
      Where the repaired arm equals the legacy arm with the control passing,
      the archived run is recorded as numerically unaffected by the defect in
      that scope, and CORR-20260813-d9f0fa's comparison bar is lifted for it
      by a successor CORR record.
  required_artifacts:
  - experiments/EXP-SEMAEV-93d5cc/runs/<RUN-ID>/ (manifest.yaml, raw-result.json, arm-legacy.stdout.log, arm-legacy.stderr.log, arm-repaired.stdout.log, arm-repaired.stderr.log, arms.tar.gz plus the supervisor files)
  - experiments/EXP-SEMAEV-93d5cc/reports/run-<YYYYMMDDTHHMMZ>/ (report, graph, PDF)
  - an evidence record and decision on review
  measured_vs_modeled: every number is measured or read from an archived record; nothing is modelled
  implementation:
    launcher: experiments/EXP-SEMAEV-93d5cc/implementation/launch.py
    worker: experiments/EXP-SEMAEV-93d5cc/implementation/worker.py
    arms: experiments/EXP-SEMAEV-93d5cc/implementation/arms.py
    spawn_child: experiments/EXP-SEMAEV-93d5cc/implementation/fib_child.py
    extraction: experiments/EXP-SEMAEV-93d5cc/implementation/compare.py
    checker: experiments/EXP-SEMAEV-93d5cc/implementation/check.py
    trial_plan: experiments/EXP-SEMAEV-93d5cc/trial-plan.json
  assigned_to: executor
  inference_policy: executor-implementation
