  <title id="title">Prime63 m=2 retrospective run disposition</title>
  <desc id="desc">Three separately planted positive solver calls each reached the 600 second cap and recorded timeout_censored. Measured wall times were 600.148084, 600.072356 and 600.058805 seconds, one attempt per arm. The standard supervisor found two required top-level outputs absent and recorded invalid_output. Source: RUN-ICPERF-eb0d88 execution and diagnostic receipts; EV-ICPERF-3f4a4e.</desc>
