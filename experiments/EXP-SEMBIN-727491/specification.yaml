experiment:
  id: EXP-SEMBIN-727491
  hypothesis_id: H-SEMBIN-c5432e
  version: 1
  title: Replicate the n=40, t=2, k=20 cell at 20x the z, sparse-f versus dense-f
  status: review_required
  objective: At n=40, k=20, does the sparse-f parity mixture give P=.316 (not .393)
    at 2000 z, with zero solutions whenever Tr(b/z)=1? Sparse-f P lies in [.30,.33]
    and differs from the dense-f .393 arm by more than the exact-count interval.
  inputs:
    proposal: ledger/proposals/IDEA-20261017-0e2dab.yaml
    design_protocol: experiments/EXP-SEMBIN-727491/protocol.json
    design_packet: analysis/open-ideas-design-20261031/DESIGN.md
    cells:
      instances: 2000
      replicates: 1
      warmups: 0
  controls:
  - 'A/A: C-aa'
  - 'positive: n20-exhaustive (the exhaustive n=20 pushforward reproduces its recorded
    hit profile)'
  - 'negative: curve-free (curve-free random map with P=.393 at |V|=2^20)'
  independent_variables:
  - arm
  metrics:
    primary:
    - p_sparse
    - p_dense
    - pi1_hits
    - band_violations
    secondary: []
  replication:
    seeds:
    - 20261031
    independent_instances: 2000
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: null
    maximum_memory_gb: 16.0
    maximum_runs: 10
  stopping_rules:
  - 'fixed: 2000 z per arm x two f representations, plus the n=20 and curve-free controls,
    then stop'
  invalidation_rules:
  - a row whose instrument hash differs from the frozen build is excluded and reported
  - a control that fails its expected detection voids the clean cells it was meant
    to protect
  success_criterion: C-f is supported when p_sparse in [.30,.33], p_dense in [.38,.41],
    pi1_hits=0 and <=4 band violations; sparse P outside [.30,.33] falsifies the parity
    mixture at |V|=2^20.
  falsification_criterion: 'Sparse-f P outside [.30,.33] at 2000 z: the parity mixture
    does not hold at |V|=2^20.'
  required_artifacts:
  - experiments/EXP-SEMBIN-727491/protocol.json
  - experiments/EXP-SEMBIN-727491/runs/
  - experiments/EXP-SEMBIN-727491/results/
  - experiments/EXP-SEMBIN-727491/reports/
  assigned_to: executor-mechanical
  approved_by: null
