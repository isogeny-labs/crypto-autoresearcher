  batch: PQC-100-20261018
  title: Boundary-forced masked-vs-reference rejection equivalence
  objective: whether masked ML-DSA signers evaluate signing-only predicates exactly
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C test harness linking an open masked ML-DSA implementation (pinned) and PQClean
      reference
    parameters: ML-DSA-44/65; predicates {z_bound, lowbits, hint_weight, ct0}; 10^7 forced
      cases each
    procedure: 1) Build. 2) Forcing hooks. 3) Run. 4) Compare decisions. 5) Planted bug arm.
  controls:
  - 'null: reference vs itself'
  - 'positive: planted carry bug'
  - 'A/A: two run orders'
  independent_variables:
  - implementation
  - predicate
  metrics:
    primary:
    - mismatch count
    secondary:
    - cases to first mismatch
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: planted detection
    formula: within 10^4
    source: boundary density
  scale_relevance:
    tier: crypto
    justification: real parameters
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop at 10^7 per predicate
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: P1 in C1 and C2 complete; AA1 noise floor zero changes
  falsification_criterion: C1 planted bug missed
  decision_impact:
    on_positive: publish the forced-boundary vectors as conformance tests for masked signers
    on_negative: record equivalence on these predicates and close the masked-predicate question
  variable_ledger:
    independent:
    - name: implementation
      levels:
      - reference
      - masked
      - planted_bug
    - name: predicate
      levels:
      - z_bound
      - lowbits
      - hint_weight
      - ct0
    factors:
    - name: run_order
      treatment: randomized
      value: arm order shuffled per seed block
      how: interleave arms trial by trial with a recorded permutation
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - masked
      - planted_bug
      differs_in:
      - implementation
      design: one_factor
    - id: C2
      arms:
      - mismatch table
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - masked order A
      - masked order B
      differs_in:
      - run_order
      design: aa
    crosses_map: false
  prediction_provenance:
