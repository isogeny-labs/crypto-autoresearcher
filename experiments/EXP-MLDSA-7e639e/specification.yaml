# EXPERIMENT CONTRACT -- EXP-MLDSA-7e639e (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLDSA-7e639e
  hypothesis_id: H-MLDSA-6293f2
  derived_from_idea: IDEA-20261018-417012
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Mask-sum leak in naive threshold ML-DSA
  objective: how strongly a naive threshold mask sum leaks s1 after rejection
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python/NumPy; toyDSA(n,k,l): a NumPy re-implementation of FIPS 204 Algorithms 1-8 with
      the ring degree n as a parameter (q = 8380417, d = 13, eta, tau, gamma1, gamma2, beta
      = tau*eta, omega as in ML-DSA-44 unless stated), cross-checked against the PQClean ML-DSA-44
      reference at n = 256 on 1000 KAT vectors before any reduced run
    parameters: >-
      toyDSA(64,2,2), gamma1 = 2^10, T in {1,2,3,4,8}, per-party range {gamma1/T, gamma1};
      up to 10^6 signatures; 5 keys
    procedure: >-
      1) KAT check. 2) Threshold-sum signer. 3) Regression on doubling grid. 4) Certify. 5)
      Compare gain to closed form.
  controls:
  - 'null: T = 1 uniform mask'
  - 'positive: no rejection at T = 4'
  - 'A/A: T = 3 under two seed blocks'
  independent_variables:
  - parties_T
  - per_party_range
  metrics:
    primary:
    - N*(T)
    - gain g_T
    secondary:
    - per-coefficient error
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: g_T
    formula: 1 - 2B p_T(B)/P_T(|Y| < B)
    source: truncated-density mean shift
  scale_relevance:
    tier: toy
    justification: toy gamma1; gain is shape-determined
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop per cell at 5/5 recoveries or 10^6 signatures
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: 'P1 in C2, P2 and P3 in C1, C3 reported; AA1 noise floor: N* within factor
    1.5'
  falsification_criterion: C2 gains off by > 15 percent or C1 T = 1 recovery
  decision_impact:
    on_positive: >-
      record the naive threshold leak as the baseline every threshold ML-DSA proposal is measured
      against
    on_negative: conclude rejection still hides the sum and look for the error in the gain
      model
  variable_ledger:
    independent:
    - name: parties_T
      levels:
      - '1'
      - '2'
      - '3'
      - '4'
      - '8'
    - name: per_party_range
      levels:
      - gamma1_over_T
      - gamma1
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    comparisons:
    - id: C1
      arms:
      - T 4
      - T 1
      differs_in:
      - parties_T
      design: one_factor
    - id: C2
      arms:
      - gain vs T
      differs_in: []
      design: absolute
    - id: C3
      arms:
      - T4 gamma1_over_T
      - T4 gamma1
      differs_in:
      - per_party_range
      design: one_factor
    - id: AA1
      arms:
      - T 3 seed-block A
      - T 3 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-417012.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-417012.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P3
    first_recorded_in: ledger/proposals/IDEA-20261018-417012.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with parameter set, seeds, tool versions (Python, NumPy, fpylll/G6K where
    used) and the KAT cross-check digest
  - raw-result.json with every per-trial outcome, never only aggregates
  - >-
    certificate.json: for every claimed recovery, the recovered secret compared coefficient-by-coefficient
    with the self-generated key
  - >-
    report.md plus one SVG/PDF plot of the primary metric against the independent variable
    with A/A band shaded
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLDSA-7e639e/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-417012.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
