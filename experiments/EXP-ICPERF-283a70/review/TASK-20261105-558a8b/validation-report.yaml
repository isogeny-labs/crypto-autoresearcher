    finding_PARITY-1: >-
      The audit's parity bookkeeping is a false negative. audit.json records
      recorded_python_version null in every replay and environment_drift []. The cause is
      that tools/runbook.py _recorded_python (line 2253) reads
      /run/environment/python_version, while run.py writes the version to
      /run/environment/python and /run/environment/version. The comparison that
      DEC-20261029-5554ee interpreter_parity requires (replay interpreter against the
      unit's manifest python_version, with any difference reported as environment_drift)
      therefore never ran. A real minor-version drift, 3.11.17 to 3.13.18, went unreported.
      The review plan's audit_note "no environment drift" repeats audit.json and is
      inaccurate. This is a reporting gap in the audit tool and manifest-schema join, not a
      defect in any run receipt, and no compared value is affected. Remedy, for the
      Coordinator: a field-name fix or a superseding audit note. Not repaired here.

