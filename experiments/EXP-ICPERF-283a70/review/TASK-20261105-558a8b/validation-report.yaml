  metric_recomputations:
    - id: M1-draws-not-recorded
      finding: >-
        raw-result.json records the aggregate integers and band inputs but not the 64 draws.
        A recomputation "from the recorded draws" is therefore impossible from the run
        artifacts. The draws were regenerated in scratch two ways, M2 and M3.
    - id: M2-validator-sampler-from-spec-prose
      method: >-
        Validator-written xorshift32 sampler, written from specification.yaml
        /experiment/sampler prose before run.py was opened: left/right/left shifts mod 2^32,
        step then test, stop when x mod 50 is 0, count of tests, stream continuing, seed
        untested, support_min 0 meaning count minus 1. The sum, sum of squares, sorted
        order statistics 32 and 33 (1-based), CV^2 and median ratio were computed with
        exact Fractions. This is not the plan's blind re-derivation: the validator had
        seen the expected integers in the specification.
      results:
        primary_13_17_5_support1: {sample_sum: 2943, sum_squares: 289567, order_stat_32: 28, order_stat_33: 28, median_split: false, cv_sq_num: 9871039, cv_sq_den: 8661249, median_ratio_num: 1792, median_ratio_den: 2943, cv_in_band: true, median_ratio_in_band: true, exact_match: true}
        ctl1_1_2_14_support1: {sample_sum: 2938, sum_squares: 290138, order_stat_32: 29, order_stat_33: 29, median_split: false, cv_sq_num: 9936988, cv_sq_den: 8631844, median_ratio_num: 1856, median_ratio_den: 2938, cv_in_band: true, median_ratio_in_band: true, exact_match: false}
        ctl2_13_17_5_support0: {sample_sum: 2879, sum_squares: 283745, order_stat_32: 27, order_stat_33: 27, median_split: false, cv_sq_num: 9871039, cv_sq_den: 8288641, median_ratio_num: 1728, median_ratio_den: 2879, cv_in_band: true, median_ratio_in_band: true, exact_match: false}
      primary_draws: [7, 22, 69, 52, 26, 41, 29, 16, 3, 6, 23, 8, 48, 19, 2, 127, 47, 105, 39, 60, 80, 3, 28, 211, 52, 6, 24, 81, 1, 126, 2, 10, 5, 120, 66, 3, 18, 22, 11, 118, 95, 43, 15, 10, 56, 28, 160, 24, 18, 44, 18, 11, 28, 100, 53, 11, 68, 244, 9, 28, 59, 44, 13, 28]
      ctl1_draws: [60, 106, 20, 66, 2, 85, 28, 17, 46, 31, 15, 15, 81, 37, 14, 24, 44, 9, 2, 20, 24, 42, 11, 48, 21, 18, 306, 51, 21, 53, 15, 68, 77, 29, 11, 35, 2, 1, 123, 19, 130, 2, 111, 63, 15, 4, 1, 4, 58, 87, 75, 87, 118, 145, 17, 29, 51, 5, 1, 54, 67, 15, 1, 101]
      ctl2_draws: primary_draws minus 1 elementwise (checked)
      agreement_with_recorded: exact on all 11 compared pointers for all 3 units
    - id: M3-producer-code-replay
      method: >-
        importlib load of the bound run.py (53965863...). Only sample() and moments() were
        called, in memory, with no run directory and no files written to the repository
        (see validator_side_effects).
      result: >-
        The producer draws equal the M2 draws element by element for all 3 arms (192 of 192).
        moments() equals raw-result in value and JSON type on all 11 integer and boolean
        fields, for all 3 units.
    - id: M4-derived-from-recorded-integers
      check: Band inputs and flags follow from the recorded integers alone.
      result: pass
      detail: >-
        For each unit, 64*sum_squares - sample_sum^2 equals cv_sq_num, sample_sum^2 equals
        cv_sq_den, 64*median equals median_ratio_num, and sample_sum equals
        median_ratio_den. Primary CV^2 = 9871039/8661249 = 1.13968 is inside [81/100,
        121/100]; median ratio 1792/2943 = 0.60890 is inside [3/5, 4/5]. CTL-1 gives 1.15120
        and 0.63172. CTL-2 gives 1.19091 and 0.60021. All three units are inside both bands,
        and each recorded flag equals its exact-Fraction recomputation.
    - id: M5-ctl2-algebraic-tie
      check: >-
        Code-free consistency. Support {0,...} subtracts 1 from each draw, so
        S' = S - 64, Q' = Q - 2S + 64, median' = median - 1, and cv_sq_num is invariant.
      result: pass
      detail: >-
        2943 - 64 = 2879; 289567 - 5886 + 64 = 283745; 28 - 1 = 27; cv_sq_num 9871039 for
        both. This ties the recorded CTL-2 integers to the primary integers arithmetically.
    - id: M6-band-fractions
      result: >-
        Over the primary (the summary's n 1): cv_in_band and median_ratio_in_band have
        fraction_true 1.0, equal to the recorded summary. Over all 3 units: both bands have
        fraction_true 3/3, while exact_match has fraction_true 1/3 (the primary only). The
        bands therefore do not separate the frozen sampler from either wrong sampler. The
        exact match does.

