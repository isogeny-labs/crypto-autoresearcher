    receipts, journal chain, raw/summary/report agreement, exact pass rule and exact
    equality across interpreters. The limitations below narrow what the record shows, but
    none breaks the joint or leaves it undetermined.
  limitations:
    - >-
      PARITY-1. audit.json records recorded_python_version null and environment_drift [],
      because tools/runbook.py _recorded_python reads /run/environment/python_version while
      run.py writes /run/environment/python and /run/environment/version. The
      DEC-20261029-5554ee parity comparison therefore never ran. A real drift, CPython
      3.11.17 recorded and 3.13.18 replayed, went unreported, and the review plan's "no
      environment drift" note is inaccurate. All compared pointers are ints or bools and
      equal exactly across the two interpreters, and the specification pins no minor
      version, so no value is affected. Remedy, for the Coordinator: a field-name fix or a
      superseding audit note.
    - >-
      The 64 draws are not recorded in raw-result.json. Recomputation used draws
      regenerated in scratch by a validator-written spec-prose sampler and by the
      producer's run.py functions, not recorded draws. Both agree on 192 of 192 draws.
    - >-
      The validator's spec-prose sampler is not the plan's blind re-derivation (the
      validator had seen the expected integers). The independent check remains
      TASK-20261105-6d9502.
    - >-
      The validator's replay and the audit replay share one interpreter (CPython 3.13.18,
      /usr/local/bin/python3). Only two interpreter versions are exercised.
    - >-
      One seed and one execution per arm, per the frozen stopping rule, and no execution
      proof (verified_units 0).
    - No memory measurement for any unit. Only a 256 MB ceiling is recorded, under an advisory budget.
    - >-
      No pcc claim id covers the integers. They are producer assertions, recomputed by the
      validator.
    - >-
      The PR #2776 description could not be read (GitHub API 403). Its merge commit and diff
      were checked locally.
    - >-
      The audit was run by the same session that wrote the review plan. Its deterministic
      claims were re-verified with validator code.
    - >-
      The summary and report metrics cover the primary only (n 1). The control integers
      appear only in the run directories.
