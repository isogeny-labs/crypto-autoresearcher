  verdict_rationale: >-
    None of the plan's breaking artifacts exists. The primary has exactly
    2943/289567/28, CTL-1 and CTL-2 both have exact_match false with their frozen
    integers, no unit has a median split, no band flag acts as a pass criterion, and no v1
