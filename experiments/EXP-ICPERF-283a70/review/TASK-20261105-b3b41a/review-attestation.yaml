  limitations:
    - id: L1
      text: >-
        The exact match is a single-lineage fingerprint: v1 run.py produced the
        integers, the F5 prose describes that code, v2 run.py reimplements it,
        and the control integers came from unretained design scratch code.
        Until the blind re-derivation (TASK-20261105-6d9502) matches all three
        arms, it licenses runner determinism and sensitivity to parameters and
        conventions only. It never licenses a distributional property.
    - id: L2
      text: >-
        CTL-2 is the primary with every draw reduced by one, (S-64, Q-2S+64,
        median-1), and has the same cv_sq_num 9871039. Given a primary pass it
        fails the exact match by arithmetic unless the support_min path is
        dead. It is a wiring and off-by-one control. CTL-1 is a known-outcome
        wiring control chosen from a design-time scan. Both share step(),
        draw() and moments() with the primary, so neither can detect a
        common-mode error.
    - id: L3
      text: >-
        H-ICPERF-5adc9b is unamended v1 text: "Stage 0 checks that shape", "The
        CV band is the shape control", the both_bands_hold prediction, "draws
        from the geometric law", and "a sample that matches that law". The
        evidence record must not report both_bands_hold as a confirmed shape
        prediction. The integers imply it arithmetically, and both wrong
        samplers also had it.
    - id: L4
      text: >-
        The run report (report.typ lines 36-45; data.json summary.metrics)
        labels cv_in_band and median_ratio_in_band "measured", fraction_true=1,
        n=1 (primary only), beside exact_match, and omits the controls' band
        flags. The evidence record must tabulate both band flags for all three
        units, labelled non-discriminating.
    - id: L5
      text: >-
        The spec success_criterion and falsification_criterion still name the
        band flags verbatim from v1, and metrics.primary lists them while
        metrics.descriptive_only lists them too. The evidence record must cite
        decisive_test and the DEC-20261029-0e40f3 restated pass rule as the
        decision rule.
    - id: L6
      text: >-
        There is no pcc claim for these runs. The committed pcc/ledger.jsonl at
        f7eb8ae292 has none, and execution_proofs show verified_units 0. Cite
        the integers as unverified assertions, reproduced by a self-replay
        audit and a non-blind red-team recomputation.
    - id: L7
      text: >-
        Forward scope, about the parent idea. IDEA-20261015-b41f68 claim (1)
        uses the same bands as its geometric test on real probe panels. At
        n=64 that test rejects a true geometric sample about 53% of the time
        and accepts a CV=1 lognormal 30% of the time (98% at n=4096). It cannot
        check p. The instrument pass must not be read as validating that test
        for stage 1.
    - id: L8
      text: >-
        Scope ceiling: one seed, claim tier toy, evidence strength
        preliminary. Upgrade to replicated applies only to the arithmetic
        identity, and only if the blind re-derivation matches all three arms.
        There is no evidence about geometric shape, p, any table or probe
        panel, host latency, or any IC or rho cost. The §5a band does not
        exist.
