  goal_id: GOAL-ICPERF-e6b6a4
  runs_reviewed: [RUN-ICPERF-f21eb1, RUN-ICPERF-0ef41e, RUN-ICPERF-74e9a2]
  invalidated_not_cited: [RUN-ICPERF-943efa, RUN-ICPERF-b09be8]
  snapshot:
    plan_commit: f7eb8ae292
    branch: claude/review-icperf-v2-evidence
    byte_check: >-
      git diff --quiet f7eb8ae292 over implementation/, specification.yaml,
      runs/, the hypothesis, the idea and ledger/decisions: identical.
      run.py sha256 53965863...9a38 and specification.yaml sha256
      491106df...5973 equal the trial-plan and approval bindings.
    working_tree_notes: >-
