  claim_under_review: >-
    From the review plan: 3/3 units valid; primary RUN-ICPERF-f21eb1 (seed
    20261017, p = 1/50, 64 draws) gives 2943 / 289567 / 28 with no median split,
    the exact pass condition of DEC-20261029-0e40f3; CTL-1 (shift triple
