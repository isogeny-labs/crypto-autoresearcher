  written from the verbatim sampler definition supplied in the task. State is a 32-bit unsigned
  integer starting at the seed; one step is x ^= (x<<a) mod 2^32; x ^= x>>b; x ^= (x<<c) mod 2^32.
  Each draw steps then tests, stopping at the first stepped state with x mod 50 == 0; the value is
  the test count (support from 1), or test count minus 1 for variant C. Draws chain from the
  previous stopping state; the seed is never tested. Order statistics are 1-based on the sorted
  64 values. CV^2 (denominator n) = (n*sumsq - sum^2)/sum^2; CV^2 (denominator n-1) =
  n*(n*sumsq - sum^2)/((n-1)*sum^2); median/mean = median*n/sum. Consistency check: C equals A
  with every value reduced by 1 (sum 2943-64=2879; sumsq 289567-2*2943+64=283745; same CV^2 numerator).
