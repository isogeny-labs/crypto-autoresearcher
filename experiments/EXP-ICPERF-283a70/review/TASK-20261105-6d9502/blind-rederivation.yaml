script: |
  from fractions import Fraction as F
  M=0xFFFFFFFF
  def draws(seed,a,b,c,n=64,mod=50,off=0):
      x=seed&M; out=[]
      for _ in range(n):
          t=0
          while True:
              x^=(x<<a)&M; x^=x>>b; x^=(x<<c)&M
              assert x!=0
              t+=1
              if x%mod==0: break
          out.append(t-off)
      return out,x
  def stats(v):
      n=len(v); s=sum(v); q=sum(i*i for i in v); o=sorted(v)
      num=n*q-s*s
      return dict(values=v,sample_sum=s,sum_squares=q,os32=o[31],os33=o[32],
        median_well_defined=o[31]==o[32],
        cv2_denom_n=F(num,s*s), cv2_denom_n_minus_1=F(n*num,(n-1)*s*s),
        median_over_mean=F(o[31]*n,s))
  for name,args in [("A",(13,17,5,0)),("B",(1,2,14,0)),("C",(13,17,5,1))]:
      a,b,c,off=args; v,xf=draws(20261017,a,b,c,off=off); r=stats(v)
      print(name,{k:(str(x) if isinstance(x,F) else x) for k,x in r.items()},"final_state",xf)
