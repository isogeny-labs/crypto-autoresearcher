  scripts:
    note: >-
      Embedded so the review stays checkable after the scratch directory is gone. Neither script
      is part of the producer's artifacts. Both ran under `python3 -I`.
    blind_rederive.py: |
        """Blind re-derivation for EXP-ICPERF-284bc4 from specification.yaml only
        (/experiment/inputs, /experiment/online_time_model, /experiment/bsgs_probe_count,
        /experiment/controls). Exact Fractions; no code shared with the producer.
        Usage: blind_rederive.py <experiment_dir> <runs_dir_or_replay_dir> <session_journal>
        Producer values are loaded only AFTER every value below has been computed."""
        import json, sys
        from fractions import Fraction as F
        from math import gcd
        
        # --- inputs transcribed from specification.yaml /experiment/inputs
        C_PROBE, C_STATE, C_STEP = 370, 2100, 40
        BL_NUM, BL_DEN, STATES = 21, 10, 10
        CELLS = [("r1000_a2", 1000, 2), ("r4000_a2", 4000, 2), ("r1000_a4", 1000, 4)]
        
        def red(fr):  # reduced (num, den) of a Fraction
            return (fr.numerator, fr.denominator)
        
        def exact_int(fr):
            assert fr.denominator == 1, f"inexact division {fr}"
            return fr.numerator
        
        def bsgs_max_lookups(m, states):
            """spec: Z/m, baby steps {0..states-1}, giant step subtracts states; for each
            target count table lookups up to and including the first hit; max over targets."""
            baby = set(range(states))
            worst = 0
            for t in range(m):
                x, n = t, 0
                while True:
                    n += 1                      # one lookup of x in the baby table
                    if x in baby:
                        break
                    x = (x - states) % m
                worst = max(worst, n)
            return worst
        
        def model(c_probe=C_PROBE, precomp=None):
            pre = F(STATES * C_STATE, C_STEP) if precomp is None else F(precomp)
            price = F(c_probe * C_STATE * BL_DEN, BL_NUM * C_STEP ** 2)
            out = {"precomputation_steps": exact_int(pre), "price": red(price), "cells": []}
            for name, r, A in CELLS:
                bl_steps = F(BL_NUM * r) / (BL_DEN * A * pre)
                bl_ns = bl_steps * C_STEP
                probes = F(r, A * STATES)
                ic_ns = probes * c_probe
                ratio = ic_ns / bl_ns
                out["cells"].append(dict(name=name, r=r, A=A, probes=probes, bl_steps=bl_steps,
                                         bl_online_ns=bl_ns, ic_online_ns=ic_ns, ratio=red(ratio)))
            return out
        
        primary = model()
        for c in primary["cells"]:
            for k in ("probes", "bl_steps", "bl_online_ns", "ic_online_ns"):
                c[k] = exact_int(c[k])          # spec: inexact division invalidates the primary
            c["bsgs_probes"] = bsgs_max_lookups(c["r"] // c["A"], STATES)
        mine = {
            "price_ratio": primary["price"],
            "precomputation_steps": primary["precomputation_steps"],
            "ratios_agree": all(c["ratio"] == primary["price"] for c in primary["cells"]),
            "all_match_bsgs": all(c["bsgs_probes"] == c["probes"] for c in primary["cells"]),
            "cells": primary["cells"],
        }
        neg1 = model(c_probe=371)
        neg2 = model(precomp=10)
        # NEG-2 online ratios may be inexact in bl_steps/probes: only ratio is needed
        print("BLIND price ratio:", mine["price_ratio"], "precomp:", mine["precomputation_steps"],
              "ratios_agree:", mine["ratios_agree"], "all_match_bsgs:", mine["all_match_bsgs"])
        for c in mine["cells"]:
            print("  ", c["name"], "probes", c["probes"], "bsgs", c["bsgs_probes"], "bl_steps", c["bl_steps"],
                  "bl_ns", c["bl_online_ns"], "ic_ns", c["ic_online_ns"], "ratio", c["ratio"])
        print("BLIND NEG-1 price", neg1["price"], "online", {c["name"]: c["ratio"] for c in neg1["cells"]})
        print("BLIND NEG-2 online", {c["name"]: c["ratio"] for c in neg2["cells"]})
        
        # --- only now compare with producer artifacts
        exp_dir, runs_dir, journal = sys.argv[1:4]
        plan = json.load(open(f"{exp_dir}/trial-plan.json"))
        rid = {t["id"]: t["run_id"] for t in plan["trials"]}
        ok = True
        def chk(label, a, b):
            global ok
            good = (a == b); ok &= good
            print(f"  [{'OK ' if good else 'DIFF'}] {label}: blind={a} producer={b}")
        for tid in ("price-ratio-identity", "ctl-consistency-a-change", "ctl-consistency-r-change",
                    "ctl-bsgs-enumeration", "ctl-neg-perturbed-price", "ctl-neg-precomputation-model"):
            d = json.load(open(f"{runs_dir}/{rid[tid]}/raw-result.json"))
            print("UNIT", tid, rid[tid], "dir", runs_dir)
            byname = {c["name"]: c for c in d["cells"]}
            if tid == "price-ratio-identity":
                chk("price_ratio", mine["price_ratio"], (d["price_ratio_num"], d["price_ratio_den"]))
                chk("precomputation_steps", mine["precomputation_steps"], d["precomputation_steps"])
                chk("ratios_agree", mine["ratios_agree"], d["ratios_agree"])
                chk("all_match_bsgs", mine["all_match_bsgs"], d["all_match_bsgs"])
                for c in mine["cells"]:
                    p = byname[c["name"]]
                    for k in ("probes", "bsgs_probes", "bl_steps", "bl_online_ns", "ic_online_ns"):
                        chk(f"{c['name']}.{k}", c[k], p[k])
                    chk(f"{c['name']}.ratio", c["ratio"], (p["ratio_num"], p["ratio_den"]))
            elif tid in ("ctl-consistency-a-change", "ctl-consistency-r-change"):
                want = ["r1000_a2", "r1000_a4"] if "a-change" in tid else ["r1000_a2", "r4000_a2"]
                chk("cell names", want, [c["name"] for c in d["cells"]])
                mm = {c["name"]: c for c in mine["cells"]}
                for n in want:
                    p = byname[n]
                    chk(f"{n}.ratio", mm[n]["ratio"], (p["ratio_num"], p["ratio_den"]))
                    chk(f"{n}.probes/bsgs", (mm[n]["probes"], mm[n]["bsgs_probes"]), (p["probes"], p["bsgs_probes"]))
                chk("same_reduced_ratio", True, d["same_reduced_ratio"])
            elif tid == "ctl-bsgs-enumeration":
                for c in mine["cells"]:
                    p = byname[c["name"]]
                    chk(f"{c['name']}.formula/enumerated", (c["probes"], c["bsgs_probes"]), (p["formula_probes"], p["enumerated_probes"]))
                chk("all_match", True, d["all_match"])
            elif tid == "ctl-neg-perturbed-price":
                chk("price_ratio", neg1["price"], (d["price_ratio_num"], d["price_ratio_den"]))
                chk("online_ratio", neg1["cells"][0]["ratio"], (d["online_ratio_num"], d["online_ratio_den"]))
                chk("matches_preregistered", False, d["matches_preregistered"])
            else:
                chk("online_ratio", neg2["cells"][0]["ratio"], (d["online_ratio_num"], d["online_ratio_den"]))
                chk("all NEG-2 cells same ratio", True, len({c["ratio"] for c in neg2["cells"]}) == 1)
                chk("precomputation_steps", 10, d["precomputation_steps"])
                chk("matches_preregistered", False, d["matches_preregistered"])
        # session summary
        tail = [json.loads(l) for l in open(journal)][-1]["summary"]["metrics"]
        print("SESSION SUMMARY")
        chk("summary price_ratio_num min/max", (925, 925), (tail["price_ratio_num"]["values"]["min"], tail["price_ratio_num"]["values"]["max"]))
        chk("summary price_ratio_den min/max", (4, 4), (tail["price_ratio_den"]["values"]["min"], tail["price_ratio_den"]["values"]["max"]))
        chk("summary ratios_agree", 1.0, tail["ratios_agree"]["values"]["fraction_true"])
        chk("summary all_match_bsgs", 1.0, tail["all_match_bsgs"]["values"]["fraction_true"])
        print("ALL OK" if ok else "SOME DIFF")
    cert_check.py: |
        """Certificate-style re-verification, pure integer arithmetic (no fractions module,
        no producer code). Checks every claimed number in raw-result.json for all six units
        against the frozen model, for a recorded dir and a replay dir."""
        import json, sys
        from math import gcd
        C_PROBE, C_STATE, C_STEP, BL_NUM, BL_DEN, S = 370, 2100, 40, 21, 10, 10
        def red(n, d):
            g = gcd(n, d); return (n // g, d // g)
        def bsgs_forward(m, s):
            """independent construction: giant step k marks every target (b + k*s) mod m, b<s;
            a target first marked at giant step k costs k+1 lookups; return the max over Z/m."""
            first = {}
            k = 0
            while len(first) < m:
                for b in range(s):
                    first.setdefault((b + k * s) % m, k + 1)
                k += 1
            assert len(first) == m
            return max(first.values())
        def cells(c_probe, pre_num, pre_den):
            out = {}
            for name, r, A in (("r1000_a2",1000,2),("r4000_a2",4000,2),("r1000_a4",1000,4)):
                # probes = r/(A*S);  bl_steps = BL_NUM*r*pre_den/(BL_DEN*A*pre_num);  all as num/den
                pn, pd = r, A * S
                bn, bd = BL_NUM * r * pre_den, BL_DEN * A * pre_num
                bl_ns = (bn * C_STEP, bd)
                ic_ns = (pn * c_probe, pd)
                ratio = red(ic_ns[0] * bl_ns[1], ic_ns[1] * bl_ns[0])
                out[name] = dict(probes=red(pn,pd), bl_steps=red(bn,bd), bl_ns=red(*bl_ns), ic_ns=red(*ic_ns), ratio=ratio)
            return out
        price = red(C_PROBE*C_STATE*BL_DEN, BL_NUM*C_STEP*C_STEP)
        assert price == (925, 4)
        assert (S*C_STATE) % C_STEP == 0 and S*C_STATE//C_STEP == 525
        P = cells(C_PROBE, 525, 1)
        N1 = cells(371, 525, 1)
        N2 = cells(C_PROBE, 10, 1)
        base = sys.argv[1]
        plan = json.load(open(sys.argv[2]))
        rid = {t["id"]: t["run_id"] for t in plan["trials"]}
        bad = 0
        def eq(label, got, want):
            global bad
            if got != want: bad += 1; print("  DIFF", label, got, want)
        def jf(x):  # int or {"num","den"} -> reduced pair
            return red(x["num"], x["den"]) if isinstance(x, dict) else (x, 1)
        for tid, run in rid.items():
            d = json.load(open(f"{base}/{run}/raw-result.json")); by = {c["name"]: c for c in d["cells"]}
            for name, ref in (N1 if tid == "ctl-neg-perturbed-price" else N2 if tid == "ctl-neg-precomputation-model" else P).items():
                if name not in by: continue
                c = by[name]
                if "ratio_num" in c: eq(f"{tid}.{name}.ratio", (c["ratio_num"], c["ratio_den"]), ref["ratio"])
                if "probes" in c: eq(f"{tid}.{name}.probes", jf(c["probes"]), ref["probes"])
                if "bl_steps" in c: eq(f"{tid}.{name}.bl_steps", jf(c["bl_steps"]), ref["bl_steps"])
                if "bl_online_ns" in c: eq(f"{tid}.{name}.bl_ns", jf(c["bl_online_ns"]), ref["bl_ns"])
                if "ic_online_ns" in c: eq(f"{tid}.{name}.ic_ns", jf(c["ic_online_ns"]), ref["ic_ns"])
                m = {"r1000_a2":500,"r4000_a2":2000,"r1000_a4":250}[name]
                if "bsgs_probes" in c: eq(f"{tid}.{name}.bsgs", c["bsgs_probes"], bsgs_forward(m, S))
                if "enumerated_probes" in c: eq(f"{tid}.{name}.enum", c["enumerated_probes"], bsgs_forward(m, S))
                if "formula_probes" in c: eq(f"{tid}.{name}.formula", c["formula_probes"], ref["probes"][0])
            if "price_ratio_num" in d:
                eq(f"{tid}.price", (d["price_ratio_num"], d["price_ratio_den"]), red(d["c_probe_ns"]*C_STATE*BL_DEN, BL_NUM*C_STEP*C_STEP))
            print("checked", tid, run, "(", len(d["cells"]), "cells )")
        print("pure-integer cert check on", base, "->", "ALL AGREE" if bad == 0 else f"{bad} DIFFS")
