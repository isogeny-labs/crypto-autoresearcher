# Runbook for EXP-ICPERF-284bc4 (version-2 successor of EXP-ICPERF-e467a5). New session RBS-ICPERF-8cdc92; the version-1 session RBS-ICPERF-b7e41c is terminal.
# Runs only after a committed decision names this file's sha256 (runbook_sha256).
schema: crypto.autoresearch.runbook.v1
experiment_id: EXP-ICPERF-284bc4
session_id: RBS-ICPERF-8cdc92
title: Evaluate the integer price ratio, its consistency checks and two planted negatives,
  and record each
purpose: Six deterministic trials. The primary trial computes the reduced Bernstein-Lange
  price ratio and the online ratios at three frozen (r, A) cells. Three arithmetic-consistency
  checks and two planted negative controls run beside it. The assertions decide the frozen
  success criterion (925, 4, true, true). Observations only. The n=83 host arm is not an input.
executor_tier: mechanical
