      wrong-but-consistent implementation. The disjoint-code recomputation
      from the spec's formulas agrees, but those formulas were written with
      run.py in view. Independence from the statement belongs to the blind
      re-derivation, which this task did not read.
    - >-
      L4. There is one deterministic execution, with independent_instances 1
      and no seeds, by design.
    - >-
