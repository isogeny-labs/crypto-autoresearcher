  audit_flag_classification: >-
    Pointer-coverage defect, not a value mismatch. AUD-20261105T164527Z-d5036c
    flags all 6 replays (matched 0, mismatch 6) solely because 39 of the 66
    compared rows name a pointer that neither the recorded nor the replayed
    raw-result.json contains. runbook.yaml S02-trials replay.compare is one
    11-pointer union over the five trial kinds, flattened from the
    specification's two-tier contract (/matches_preregistered and /cells for
    every unit, plus five primary-only pointers). tools/runbook.py
    replay_unit:2445 scores any pointer not found on either side as
    mismatch. The other 27 rows, the only rows carrying a value, are present
    on both sides and exactly, type-strictly equal, including /cells in all
    6 units. With /elapsed_seconds and /interpreter excluded, the whole
    documents are identical. The absences are fixed in advance by the bound
    run.py. My 18 fresh replays under CPython 3.11.18, 3.12.3 and 3.13.18
    reproduce every value. There is no fabrication signal and no value
    difference anywhere. A second, independent audit-coverage defect
    accompanies it: the audit's "no environment drift" is a false negative
    caused by a manifest key-name mismatch (python_version vs
    version/python), and the real drift 3.11.17 to 3.13.18 changes no value.
    Both defects are in the replay contract and audit tooling, not in the
    producer's data. Per PD-1 they are recorded, not repaired here, and the
    audit stays flagged as recorded.

  session_citability: >-
    Citable, scoped (same sense as DEC-20261029-5554ee citability_meaning).
    RBS-ICPERF-8cdc92 and its 6 run records may be cited as the intact record
    of one deterministic execution of the frozen stage-0 instrument. Any
    citation must disclose three things: the audit verdict is flagged, and
    the flag is the pointer-coverage defect above with zero value
    differences; the audit's own replay_results give matched 0, so
    replay-level assurance comes from this row-level classification and the
    independent replays here, not from the tool's verdict; and there is
    undetected-by-tool interpreter drift (3.11.17 recorded, 3.13.18
    replayed) that changes no value. Citable does not mean evidence for
