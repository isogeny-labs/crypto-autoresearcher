code: |
  from fractions import Fraction as F
  exact=[]
  def div(a,b,label):
      q=F(a)/F(b); exact.append((label,q.denominator==1)); return q
  def bsgs(m,s):
      table=set(range(s)); worst=0
      for t in range(m):
          n=0; j=0
          while True:
              n+=1
              if (t-j*s)%m in table: break
              j+=1
              assert j<=m
          worst=max(worst,n)
      return worst
  def derive(c_probe,c_state,c_step,bl_num,bl_den,states,cells,pre_override=None):
      pre=div(states*c_state,c_step,"pre") if pre_override is None else F(pre_override)
      price=div(c_probe*c_state*bl_den,bl_num*c_step**2,"price")
      out={"precomputation_steps":pre,"price_ratio":price,"cells":{}}
      for r,A in cells:
          bl=div(bl_num*r,bl_den*A*pre,f"bl_steps{(r,A)}"); bl_ns=bl*c_step
          pr=div(r,A*states,f"probes{(r,A)}"); ic_ns=pr*c_probe
          m=div(r,A,f"m{(r,A)}")
          out["cells"][(r,A)]=dict(bl_steps=bl,bl_online_ns=bl_ns,probes=pr,ic_online_ns=ic_ns,
              online_ratio=ic_ns/bl_ns,m=m,bsgs_probes=bsgs(int(m),states))
      return out
  cells=[(1000,2),(4000,2),(1000,4)]
  for name,kw in [("main",{}),("control_a_cprobe371",dict(c_probe=371)),("control_b_pre10",dict(pre_override=10))]:
      exact.clear()
      p=dict(c_probe=370,c_state=2100,c_step=40,bl_num=21,bl_den=10,states=10,cells=cells); p.update(kw)
      o=derive(**p)
      print("==",name); print(" pre",o["precomputation_steps"]," price",o["price_ratio"])
      for c,v in o["cells"].items(): print(" ",c,{k:str(x) for k,x in v.items()})
      print(" non-integer divisions:",[l for l,e in exact if not e])
