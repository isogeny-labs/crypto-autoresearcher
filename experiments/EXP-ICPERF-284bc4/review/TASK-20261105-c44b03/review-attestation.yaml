  verdict_basis: >-
    None of the plan's breaking artifacts is present. No path from the record
    to a latency, speedup or ranking claim was found. NEG-1 and NEG-2 can fail:
    they kill mutants M1-M4. No ranked IC-vs-rho or IC-vs-BL comparison is
