    statement in red-team-report.yaml and under the limitations below.
  limitations:
    - id: O1
      text: >-
        Computed integers are labelled "measured". runbook.yaml's metrics block
        gives price_ratio_num/den, ratios_agree, all_match_bsgs and
        matches_preregistered `label: measured`, and report.typ and data.json
        repeat it. tools/progress_metrics.py exports c_probe_ns, c_state_ns,
        c_step_ns (including NEG-1's planted 371) and price_ratio_num/den with
        physical units and no "assumed" or "planted" note. This needs a new
        correction record, not an edit to the frozen files.
    - id: O2
      text: >-
        The provenance of the prices is undisclosed. 370/2100/40 are
        IDEA-20261015-7a3c9e's n=83 inferred (c_probe, c_state) and assumed
        (c_step) prices, so 925/4 = 231.25 is numerically the idea's "231 vs
        measured 235". The pass adds no information to that comparison. 235x
        [61, 645] is an unverified assertion.
    - id: O3
      text: >-
        Only NEG-1 and NEG-2 can fail when the primary passes, and what they
        detect is an implementation that ignores its inputs. CON-1, CON-2 and
        CON-3 are deterministic duplicates of the primary's pinned cells.
        Mutants M5 (BSGS replaced by the formula, the v1 SF-1 defect), M7 (price
        ratio not computed separately), M8 (exactness rule removed) and M11 pass
        every assertion.
    - id: O4
      text: >-
        CON-3 matches the BSGS worst case against a formula that the parent
        defines as a geometric mean. The BSGS mean is 25.5/100.5/13.0 against
        50/200/25. CON-3 does not support "IC = BSGS on the quotient" at
        expected cost.
    - id: O5
      text: >-
        The BL formula is evaluated outside its regime at all three cells
        (P = 525 is at least m at two cells, and T is about 20.9, above m^(1/3)).
        bl_steps are formula values, not walk lengths. The record supports no
        toy-tier BL cost reading.
    - id: O6
      text: >-
        Integrality depends on the rounded constant 21/10. The unrounded
        1.77*1.2 = 2.124 or 1.93*1.21 = 2.335 gives an inexact division, which
        is an instrument failure, not falsification.
    - id: O7
      text: >-
        "No latency effect, no n=83 speedup" should read "no latency or n=83
        statement". The record measures neither and closes nothing there.
    - id: O8
      text: >-
        No pcc claim exists for 925/4 at HEAD. Cite it as an unverified
        assertion until pcc verifies it.
    - id: O9
      text: >-
        The exactness rule has no positive control (M8 is undetectable).
    - id: SCOPE
      text: >-
        Maximum claim: an instrument observation (sheriff B5 class
        accounting), claim tier toy as a scale label only, evidence strength
        preliminary at most. No measured bound, no cost claim, no ranking, and
        no transfer to the parent idea, n=83 or any frontier.
