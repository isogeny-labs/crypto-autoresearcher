experiment:
  id: EXP-SEMBIN-d7cd42
  hypothesis_id: H-SEMBIN-35f129
  version: 1
  title: Semaev yield is an exact first moment; Poisson link is second order
  status: review_required
  objective: Does the per-class mean equal d(V)*C(|W|+t-1,t)/N in toy cells, and does
    the crossover sensitivity read 2.9+-0.3 n per bit? The measured class mean matches
    the exact first moment within O(c/N) and the crossover sensitivity is 2.9+-0.3
    n per bit.
  inputs:
    proposal: ledger/proposals/IDEA-20261017-3db2a8.yaml
    design_protocol: experiments/EXP-SEMBIN-d7cd42/protocol.json
    design_packet: analysis/open-ideas-design-20261031/DESIGN.md
    cells:
      instances: 2
      replicates: 1
      warmups: 0
  controls:
  - 'A/A: C-aa'
  - 'positive: h4-enumeration (the Tr(u)=0 criterion reproduces the h=4 class split)'
  - 'negative: h2-curve (h=2 curve where the class factor d is 1 for every V)'
  independent_variables:
  - arm
  metrics:
    primary:
    - class_mean_ratio
    - ncross_shift
    - gap
    secondary: []
  replication:
    seeds:
    - 20261031
    independent_instances: 2
  budget:
    wall_clock_seconds_per_run: 900
    total_cpu_hours: null
    maximum_memory_gb: 16.0
    maximum_runs: 10
  stopping_rules:
  - 'fixed: Stage 0 arithmetic, Stage 1 frozen counts, Stage 2 two toy curves, then
    stop'
  invalidation_rules:
  - a row whose instrument hash differs from the frozen build is excluded and reported
  - a control that fails its expected detection voids the clean cells it was meant
    to protect
  success_criterion: C-exact is supported when the class mean matches the exact first
    moment within O(c/N), the h=2 control gives d=1, and the sensitivity is 2.9+-0.3
    n per bit; a class mean outside O(c/N) falsifies C1.
  falsification_criterion: 'A class mean differing from d(V)*C(|W|+t-1,t)/N beyond
    O(c/N): C1 is wrong.'
  required_artifacts:
  - experiments/EXP-SEMBIN-d7cd42/protocol.json
  - experiments/EXP-SEMBIN-d7cd42/runs/
  - experiments/EXP-SEMBIN-d7cd42/results/
  - experiments/EXP-SEMBIN-d7cd42/reports/
  assigned_to: executor-mechanical
  approved_by: null
