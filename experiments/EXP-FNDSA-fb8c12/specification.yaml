# EXPERIMENT CONTRACT -- EXP-FNDSA-fb8c12 (review_required, unapproved, zero runs).
experiment:
  id: EXP-FNDSA-fb8c12
  hypothesis_id: H-FNDSA-5a94a3
  derived_from_idea: IDEA-20261018-47251d
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Tower vs exact NTRUSolve output comparison
  objective: Measure whether NTRUSolve's approximate reduction changes basis quality and acceptance.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      C tower solver from a public reference implementation; SageMath exact Babai over Q;
      Python comparison
    parameters: n in {64, 256, 512, 1024}; 10^4 (f, g) per n; q = 12289
    procedure: >-
      1. Sample (f, g) with fixed seeds. 2. Solve with each arm. 3. Verify fG - gF = q. 4.
      Compare (F, G) and Gram-Schmidt profiles. 5. Apply acceptance test to both.
  controls:
  - 'null: same solver run twice (A/A) must agree bitwise'
  - 'positive: tower solver with reduction skipped at one level must show large Delta'
  - 'A/A: tower solver on two seed blocks for the population statistics'
  independent_variables:
  - solver_arm
  - dimension_n
  metrics:
    primary:
    - disagreement fraction
    - Delta distribution
    secondary:
    - acceptance flip count
    - solver time
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: disagreement fraction n=512
    formula: '>= 0.01'
    source: mechanism
  scale_relevance:
    tier: medium
    justification: deployed n for keygen only, self-generated keys
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    independent_instances: 2
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 10
    maximum_memory_gb: 8
    maximum_runs: 16
  stopping_rules:
  - stop when 10^4 keys per n compared
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - any output failing fG - gF = q invalidates that solver run
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 shows P1 and P2 at n=512, with C2 confirming detection and AA1 as
    noise floor.
  falsification_criterion: C1 records zero disagreement at all n while C2 detects the planted
    slack.
  decision_impact:
    on_positive: Index F3 margins and every sampler experiment by solver implementation.
    on_negative: Treat NTRUSolve as canonical and drop solver as a factor.
  variable_ledger:
    independent:
    - name: solver_arm
      levels:
      - tower_reference
      - exact_rational_babai
      - tower_skip_level_planted
    - name: dimension_n
      levels:
      - '64'
      - '256'
      - '512'
      - '1024'
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: half_integer_rounding
      treatment: fixed
      value: round half to even
      how: manifest
    comparisons:
    - id: C1
      arms:
      - tower_reference
      - exact_rational_babai
      differs_in:
      - solver_arm
      design: one_factor
    - id: C2
      arms:
      - tower_reference
      - tower_skip_level_planted
      differs_in:
      - solver_arm
      design: one_factor
    - id: AA1
      arms:
      - tower block A
      - tower block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-47251d.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-47251d.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
