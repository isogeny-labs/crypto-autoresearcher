  replay:
    mode: exempt
    exempt_reason: Every trial argv writes to the shared run directory by a literal path, and the instrument refuses to overwrite a finished trial, so a re-execution under the audit directory is not possible with the frozen argv. The replay is reported not_covered.
  on_invalid: stop
  on_failure:
  - when:
      timed_out: true
    class: resource_exhaustion
    action: stop
  tell_on_failure: 'The trial step stopped. Report the printed failure class and the run directory named by the plan. A timeout means the 43200 second total budget (SR-8) is spent: do not run the session again.'
- id: S08-analysis
  kind: command
  purpose: verification
  title: Aggregate the run directory with code/analyze.py
  explain: Writes controls.json and summary.json into the run directory and prints the validity flags.
  argv:
  - python3
  - experiments/EXP-SEMBIN-cb5e25/code/analyze.py
  - --run-dir
  - experiments/EXP-SEMBIN-cb5e25/runs/RUN-SEMBIN-d1204f
  timeout_seconds: 1800
  validity:
    exit_code: 0
    stdout_matches: '"flags"'
  tell_on_failure: The analysis script failed. Report this step stderr log path.
- id: S09-analysis-record
  kind: command
  purpose: verification
  title: Copy controls.json and summary.json into this step output directory and check the validity flags
  explain: Binds the analysis outputs to the journal by digest and asserts that the SR-4 and SR-5 flags are false.
  argv:
  - python3
  - -c
  - import shutil, sys; [shutil.copyfile(sys.argv[1] + '/' + n, sys.argv[2] + '/' + n) for n in ('controls.json', 'summary.json')]
  - experiments/EXP-SEMBIN-cb5e25/runs/RUN-SEMBIN-d1204f
  - '{out}'
  timeout_seconds: 60
  validity:
    exit_code: 0
    outputs:
    - path: '{out}/controls.json'
      json: true
      assertions:
      - pointer: ''
        type: object
    - path: '{out}/summary.json'
      json: true
      assertions:
      - pointer: /flags/SR-4_pc_violation
        equals: false
      - pointer: /flags/SR-5_aa_discrepancy
        equals: false
      - pointer: /flags/SR-5_fe_eq_disagreement
        equals: false
      - pointer: /decisive_count
        type: integer
  on_failure:
  - when:
      validity: false
    class: invalid_measurement
    action: stop
  tell_on_failure: A validity flag is set. SR-4 or SR-5 makes the run invalid. Report this step stderr log path and the failed assertion.
