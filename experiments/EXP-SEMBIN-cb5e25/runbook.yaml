steps:
- id: S01-probe-host
  kind: command
  purpose: probe
  title: Record the interpreter, the cores, the available memory, the load, the free disk space and the blob store setting
  explain: Writes environment.json in this step output directory with the free disk space in bytes at the experiment directory, the MemAvailable line of /proc/meminfo in kilobytes, the value of the CRYPTO_AR_BLOBSTORE environment variable, and whether the Sage executable named by fixture F-6 exists.
  argv:
  - python3
  - experiments/EXP-SEMBIN-cb5e25/compile/step_helpers.py
  - probe
  - --out
  - '{out}/environment.json'
  - --experiment-dir
  - experiments/EXP-SEMBIN-cb5e25
  - --sage
  - /opt/conda-sage/bin/sage
  - --meminfo
  - /proc/meminfo
  timeout_seconds: 60
  validity:
    exit_code: 0
    outputs:
    - path: '{out}/environment.json'
      json: true
      assertions:
      - pointer: /py
        equals: 3
      - pointer: /cpus
        type: integer
      - pointer: /disk_free
        type: integer
      - pointer: /disk_free
        min: 6442450944
      - pointer: /load
        type: number
      - pointer: /mem_kb
        type: integer
      - pointer: /mem_kb
        min: 11534336
      - pointer: /blobstore
        matches: ^(s3://|file:///)
      - pointer: /sage
        equals: true
  on_failure:
  - when:
      timed_out: true
    class: resource_exhaustion
    action: retry
    max_attempts: 2
  tell_on_failure: 'The host probe failed. One of these holds: the Sage executable is absent, the free disk space is below 6442450944 bytes, the available memory is below 11534336 kilobytes, or CRYPTO_AR_BLOBSTORE does not begin with s3:// or file:///. The session has stopped. Report this step stderr log path and the failed assertion.'
- id: S02-blobstore-round-trip
  kind: command
  purpose: probe
  title: Store a fixed small byte string in the blob store and read it back
  explain: Runs store_from_env().put and .get of tools/artifact_store.py on a fixed 40 byte string and writes blob-roundtrip.json in this step output directory with the object address, the sha256, the length and whether the bytes read back are equal to the bytes stored.
  argv:
  - python3
  - experiments/EXP-SEMBIN-cb5e25/compile/step_helpers.py
  - blob
  - --store-module
  - tools/artifact_store.py
  - --out
  - '{out}/blob-roundtrip.json'
  timeout_seconds: 120
  validity:
    exit_code: 0
    outputs:
    - path: '{out}/blob-roundtrip.json'
      json: true
      assertions:
      - pointer: /match
        equals: true
      - pointer: /sha256
        equals: dc6cf19aa8f0ece98cc3880811489e8cdeeb52eba4f6a8cdc91a231f6b617e24
      - pointer: /length
        equals: 40
      - pointer: /uri
        matches: ^(s3://|file:///)
  on_failure:
  - when:
      timed_out: true
    class: resource_exhaustion
    action: retry
    max_attempts: 2
  tell_on_failure: The blob store round trip failed or the bytes read back differ. The session has stopped before any run directory exists. Report this step stderr log path and the failed assertion.
- id: S03-create-run-dir
  kind: command
  purpose: coordination
  title: Create the one run directory that every trial of this session writes into
  explain: Creates experiments/EXP-SEMBIN-cb5e25/runs/RUN-SEMBIN-d1204f and fails if it already exists.
  argv:
  - python3
  - -c
  - import os, sys; os.makedirs(sys.argv[1], exist_ok=False)
  - experiments/EXP-SEMBIN-cb5e25/runs/RUN-SEMBIN-d1204f
  timeout_seconds: 60
  validity:
    exit_code: 0
  tell_on_failure: The run directory could not be created or already exists. The session has stopped. Report this step stderr log path.
- id: S04-copy-collision-search
  kind: command
  purpose: coordination
  title: Copy collision-search.json into the run directory before the first measurement
  explain: Copies experiments/EXP-SEMBIN-cb5e25/collision-search.json to experiments/EXP-SEMBIN-cb5e25/runs/RUN-SEMBIN-d1204f/collision-search.json without overwriting, and writes collision-copy.json in this step output directory with the sha256 of the source and of the copy.
  argv:
  - python3
  - experiments/EXP-SEMBIN-cb5e25/compile/step_helpers.py
  - copy
  - --src
  - experiments/EXP-SEMBIN-cb5e25/collision-search.json
  - --dst
  - experiments/EXP-SEMBIN-cb5e25/runs/RUN-SEMBIN-d1204f/collision-search.json
  - --out
  - '{out}/collision-copy.json'
  timeout_seconds: 60
  validity:
    exit_code: 0
    outputs:
    - path: '{out}/collision-copy.json'
      json: true
      assertions:
      - pointer: /source_sha256
        equals: 1b3d863baeda65420771563116c39d34752ddb386d8c34ca80be7bd0cb2d2e50
      - pointer: /copy_sha256
        equals: 1b3d863baeda65420771563116c39d34752ddb386d8c34ca80be7bd0cb2d2e50
  tell_on_failure: The collision search record could not be copied into the run directory. The session has stopped. Report this step stderr log path.
- id: S05-fixtures
  kind: command
  purpose: verification
  title: Run fixtures F-1 to F-8 before any trial
  explain: Runs code/fixtures.py with the protocol hash and writes fixtures.json into the run directory. It exits 0 only when every fixture passes (SR-1). The time of this step is outside the 43200 second total of SR-8 and is recorded in the session journal.
  argv:
  - python3
  - experiments/EXP-SEMBIN-cb5e25/code/fixtures.py
  - --out
  - experiments/EXP-SEMBIN-cb5e25/runs/RUN-SEMBIN-d1204f/fixtures.json
  - --protocol-sha256
  - a1b0063ed17ded481a3f5d40e71f3227a3fc71661643fd331a7ad9c76e5b8ace
  timeout_seconds: 3600
  validity:
    exit_code: 0
    stdout_matches: F-8 pass
  on_failure:
  - when:
      timed_out: true
    class: resource_exhaustion
    action: retry
    max_attempts: 2
  - when:
      exit_code: 1
    class: implementation_error
    action: stop
  tell_on_failure: A fixture failed or was not covered. SR-1 stops the run before any trial. Report this step stdout log path and run no later step.
- id: S06-fixtures-record
  kind: command
  purpose: verification
  title: Copy fixtures.json into this step output directory and check all eight verdicts
  explain: Binds the fixture verdicts to the journal by digest and asserts that F-1 to F-8 each report pass.
  argv:
  - python3
  - -c
  - import shutil, sys; shutil.copyfile(sys.argv[1], sys.argv[2])
  - experiments/EXP-SEMBIN-cb5e25/runs/RUN-SEMBIN-d1204f/fixtures.json
  - '{out}/fixtures.json'
  timeout_seconds: 60
  validity:
    exit_code: 0
    outputs:
    - path: '{out}/fixtures.json'
      json: true
      assertions:
      - pointer: /sr1_all_pass
        equals: true
      - pointer: /fixtures
        length: 8
      - pointer: /fixtures/0/id
        equals: F-1
      - pointer: /fixtures/0/verdict
        equals: pass
      - pointer: /fixtures/1/id
        equals: F-2
      - pointer: /fixtures/1/verdict
        equals: pass
      - pointer: /fixtures/2/id
        equals: F-3
      - pointer: /fixtures/2/verdict
        equals: pass
      - pointer: /fixtures/3/id
        equals: F-4
      - pointer: /fixtures/3/verdict
        equals: pass
      - pointer: /fixtures/4/id
        equals: F-5
      - pointer: /fixtures/4/verdict
        equals: pass
      - pointer: /fixtures/5/id
        equals: F-6
      - pointer: /fixtures/5/verdict
        equals: pass
      - pointer: /fixtures/6/id
        equals: F-7
      - pointer: /fixtures/6/verdict
        equals: pass
      - pointer: /fixtures/7/id
        equals: F-8
      - pointer: /fixtures/7/verdict
        equals: pass
  tell_on_failure: The recorded fixtures.json does not show eight passing fixtures. SR-1 stops the run. Report this step stderr log path.
- id: S07-trials
  kind: trials
  title: Run the 582 planned trials and the 5 wdag selection passes in plan order
  explain: Runs each code/adapter.py invocation of the frozen plan in its own supervisor run directory, followed by code/check_trial.py. All of them write their records into the one run directory of step S03. The 43200 second total of SR-8 is charged from the first trial.
  plan: experiments/EXP-SEMBIN-cb5e25/trial-plan.json
  engine: supervisor
  claim:
    ttl_minutes: 750
  timeout_seconds: 43200
  validity:
    files:
    - path: raw-result.json
      json: true
      assertions:
      - pointer: /trial_id
        equals: '{trial_id}'
  by_trial:
    m3n03__EQS4__r0:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - pointer: /experiment_id
          equals: EXP-SEMBIN-cb5e25
        - pointer: /trial_key
          equals: m3n03/EQS4/r0
        - pointer: /kind
          equals: trial
        - pointer: /cell
          equals: m3n03
        - pointer: /arm
          equals: EQS4
        - pointer: /r
          equals: 0
        - pointer: /protocol_sha256
          equals: a1b0063ed17ded481a3f5d40e71f3227a3fc71661643fd331a7ad9c76e5b8ace
        - pointer: /attack_claimed
          equals: false
        - pointer: /shared_artifact_violations
          length: 0
        - pointer: /trial_record_sha256
          type: string
    m3n03__EQS2__r0:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - pointer: /experiment_id
          equals: EXP-SEMBIN-cb5e25
        - pointer: /trial_key
          equals: m3n03/EQS2/r0
        - pointer: /kind
          equals: trial
        - pointer: /cell
          equals: m3n03
        - pointer: /arm
          equals: EQS2
        - pointer: /r
          equals: 0
        - pointer: /protocol_sha256
