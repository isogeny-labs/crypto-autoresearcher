    path: knowledge/leads/ecdlp/ic-engine/LEAD-ICE-first-fall-degree-assumptions.yaml
    related_row: knowledge/leads/ecdlp/ic-engine/LEAD-ICE-descent-closure-degree-at-scale.yaml
    delta: >-
      Moves the Nagao part of the row off "Prop. 5 unproven" onto a decidable
      instance question. Proposition 5 is true as printed by Koszul padding
      (derivations/koszul_padding_check.py), so the row's remaining Nagao
