      The descent builder, the instance sampler, the Z enumerator, the d_F^eq
      computation and the certificate emitter are written fresh under
      code/. The gf2 closure engine (closure.py, kernels.py, rankprofile.py)
      is imported, because it is the program's tested shared engine and three
      archived reviews exercised it, and it is subclassed, not used
      unmodified: SembinClosure(Closure) in code/closure.py overrides the
      constructor tables and build_M (cubic generators, large nv) and, at
      C4 >= 20000, the fixpoint loop (memory-lean streaming, same eliminations
      and the same new-row rule). The unmodified engine cannot run these cells.
      What is exercised against the unmodified engine: fixtures F-3 (archived
