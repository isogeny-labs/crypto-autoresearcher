  # ==========================================================================
  proof_search_map:
    why_present: >-
      The contract bears on a published bound and is a counterexample search,
      so it is proof-oriented (docs/inventor-protocol.md section 8). The
      audits are cheap and run before compute.
    exact_baseline_reproduction:
      audit: F-3 (archived RUN-CERTBIN-a3fc60 W_4 and M_4 outcomes), F-1 and F-2 (padding and the KN-FIND-936151 witnesses)
      status: designed, not yet run
    observation_collision_search:
      audit: >-
        Before the first run, query the shared research-kb and the local kb/
        for any measured solving degree, closure degree or GB containment on
        Nagao EQS4 with coset shifts, or on disjoint-coset factor bases (the
        paper cites [10] and [5], recalled only). Also grep crypto-repo
        research/dreg_closure_* for satisfiable or shifted variants. Record
        the queries and hits in the run directory.
      status: >-
        required before the first run, not yet performed. Performed by the
        Coordinator or the design lane before approval so that a collision can
        still reframe the contract; its record is then copied into the run
        directory as collision-search.json before the first measurement.
      what_a_collision_would_mean: >-
        A replication (reframe cheaply), or an existing counterexample or
        corroboration that changes the ranking of this run.
    quantifier_order:
      statement: >-
        Assumption 1 (operational) is FORALL instances: GB in W_4. The search
        is EXISTS an instance: GB not in W_4. Corroboration is FORALL tested
        instances under the sampling rule. No FORALL-n statement.
      status: passed as a design audit
    method_ceiling_and_nearby_object_control:
      ceiling: >-
        W_4 non-containment certifies failure for every degree-<= 4
        linear-algebra Groebner computation (DER-2), and no more: nothing on
        SAT, hybrid guessing or any solver outside the closure model, and
        nothing on cost.
      nearby_object_control: EQS2 (C-SHIFT), NULL-SHUF (C-NULL-SHUF), NULL-PROF (C-NULL)
      status: passed as a design audit
    proves_too_much:
      object: >-
        PC-TRI, where the conclusion "not contained" is provably false
        (DER-6). It must be contained at every scale (C-PC, SR-4). F-5 is the
        mirror case, where "contained" is provably false.
      status: designed

  # ==========================================================================
  required_artifacts:
    - experiments/EXP-SEMBIN-cb5e25/code/ (descent builder, sampler, Z enumerator, d_F^eq, closure driver, certificate emitter, analysis script analyze.py)
    - experiments/EXP-SEMBIN-cb5e25/code/CODE_SHA256.json (every code file that ran, with sha256, including imported engine files)
    - experiments/EXP-SEMBIN-cb5e25/runs/INDEX.json (the allocated RUN id and the artifacts it contains)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/manifest.yaml (exact commands, commit and dirty state, environment and versions, poll interval, host facts, files read under reuse_rule)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/instances.jsonl.gz (M-10 per instance, the canonical system serialisation or its artifact-store pointer, Z, redraw logs)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/closures.jsonl.gz (M-1..M-7 per instance per D with the full M-4 series)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/certificates/ (ann-certs and wdag-v1, gzipped, with .artifacts.json when over the size limits)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/fixtures.json (F-1..F-8 verdicts)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/controls.json (C-PC, C-AA-ENC, C-FE-EQ, C-FE-OUT, C-NULL, C-NULL-SHUF and C-SHIFT tables, controls reported first)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/collision-search.json (proof_search_map queries and hits, written before the first measurement)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/cost.jsonl (M-9 with poll interval)
    - experiments/EXP-SEMBIN-cb5e25/runs/<RUN-ID>/stdout.log and stderr.log
