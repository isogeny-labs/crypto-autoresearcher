      (m, n, l) = (3, 19, 7) within a 10 GB cap. It does not discharge that
      row's next action, which is unsatisfiable draws at degree 5.
    no_run_or_evidence_delta_claimed: true

  objective: >-
    Search the frozen grid of EQS4(m, R) instances (Nagao 2015/984 Definition
    8, p = 2) for an instance whose degree-4 mutant closure W_4 does not
    contain a degree-compatible Groebner basis of its ideal. Such an instance
    is a counterexample certificate to "Proposition 5 AND Assumption 1". On
    every instance, also record the smallest closure degree D_solve whose W_D
    contains the Groebner basis, together with matched EQS2, null, positive,
    A/A and field-equation-placement controls.

  why_proposition_5_alone_is_untestable:
    derivation_ref: experiments/EXP-SEMBIN-cb5e25/derivations/koszul_padding_check.py
    derivation_output: experiments/EXP-SEMBIN-cb5e25/derivations/koszul_padding_check.out
    statement: >-
      Take any two quadratics f_1, f_2 over F_2, with g_1 = f_2 + 1 and
      g_2 = f_1. Then max deg(g_i f_i) = 4 exactly, and sum g_i f_i = f_1,
      which is nonzero of degree 2 (the script checks this on the two field
      equations X_1^2 + X_1 and X_2^2 + X_2). EQS4 contains S_fe
      (paper_fulltext.md:709-713), so Definition 5 (:398-410) gives
      d_F(EQS4) <= 4 under the printed ">=" and under the equality reading.
      Proposition 5 (:719-729) therefore has no counterexample as printed. The
      refutable content of Theorem 1 at p = 2 is the conjunction with
      Assumption 1 (:416-417), which predicts that every EQS4 instance is
      solved inside degree 4. That prediction is what this contract tests.

  relation_to_existing_contracts:
    EXP-SEMBIN-4fa22c: >-
      Measures the fake d'_F (Boolean ring, Definition 6). By its S-1 it
      cannot refute Proposition 5: a Boolean-ring fall degree cannot exhibit
      d_F > 4, and the padding above shows that d_F > 4 is impossible anyway.
      This contract's decisive quantity is not a fall degree. It is Groebner
      basis containment in W_4, a solving-degree statement that tests
      Assumption 1 directly and whose failure carries a certificate. It reuses
      that contract's DC-3 (shifts are part of the instance), DC-4 (reduced
      multilinear generators) and the grevlex order. It shares no run and no
      result.
    LEAD-ICE-descent-closure-degree-at-scale: >-
      That row covers chained S_3 with one common V (EQS1/EQS2 type, Semaev
      parameterisation, l = dim V), unsatisfiable draws, refutation degree,
      measured in the crypto repo. Here the object is Nagao's disjoint-coset
      EQS4 with V_i = V + v_i, planted satisfiable R, and Groebner basis
      containment, including Nagao's fixed-k regime (m = 4, k = 2). The
      stretch cell matches that row's C1 (m, n, l) but changes the system
      (shifts) and the question (satisfiable GB containment against
      unsatisfiable refutation).
    H-SEMBIN-ce9e29: >-
      Stage-0 labels on one S_3 polynomial over F_8. Not a chain and not a
      Groebner question. Not a duplicate.

  # ==========================================================================
  declared_conventions:
    DC-1-closure: >-
      W_D is the least GF(2)-subspace of B_{<=D} (multilinear polynomials of
      total degree <= D in N Boolean variables, B = F_2[X]/(X_j^2 + X_j))
      that contains the Boolean Macaulay space M_D, the span of rho(t * f_i)
      over multilinear monomials t with deg t + deg f_i <= D (the f_i being
      the adapted generators of DC-9), and is closed
      under g -> rho(X_j * g) for every g in W_D with deg g <= D - 1. Here rho
      is the multilinear reduction. It is computed by the fixpoint iteration of
      src/crypto_autoresearcher/gf2/closure.py (W^(0) = M_D,
      W^(i+1) = W^(i) + sum_j X_j * (W^(i) cap B_{<=D-1})), the same closure as
      KN-FIND-5a8d3e and KN-FIND-c3a917. Plain M_D containment is recorded
      beside it (secondary metric M-7) but decides nothing.
    DC-2-why-boolean: >-
      The Boolean closure is computed because, by DER-1, it equals the
      full-ring closure of the generators together with S_fe, intersected with
      multilinear polynomials. That is exactly the space an F4 run with the
      field equations among its inputs can reach inside degree D (DER-2).
      C-FE-EQ checks DER-1 computationally on small cells, and agreement there
      is structurally forced.
    DC-3-shifts: >-
      Inherited from EXP-SEMBIN-4fa22c DC-3. The coset shifts are part of the
      instance. EQS4 has every v_i outside V, and the cosets V + v_i are
      pairwise disjoint. A v = 0 system is EQS2 and is reported only as the
      matched arm, never against Proposition 5.
    DC-4-generators: >-
      Inherited from EXP-SEMBIN-4fa22c DC-4. The generators are the n
      coordinate polynomials of each S_3 link after Weil descent in the
      polynomial basis, reduced mod S_fe to the multilinear representative
      (Definition 3, :262). Links S_3(X_1, X_2, U_1), ..., S_3(U_{m-3},
      X_{m-1}, U_{m-2}) are cubic. The last link S_3(U_{m-2}, X_m, x(R)) is
      quadratic, because x(R) is a constant and Frobenius squaring is F_2-linear.
    DC-5-reading-of-condition-1: >-
      The d_F value reported (M-6) is Definition 5 under the equality reading
      of condition (1): max_i deg(g_i f_i) = d, deg(sum) < d, sum != 0, with
      S_fe inside the system (true side). The printed ">=" reading is
      handled by DER-5 without compute. The decisive test does not depend on
      the reading, because both readings give d_F <= 4 (DER-4).
    DC-6-reading-of-assumption-1: >-
      "Degree of the polynomial appears in the Groebner basis computation (by
      F4)" is read as the total degree of every row formed, including
      symbolic-preprocessing multiples. That is the reading under which Lemma
      2 (:423-424) bounds matrix size by O(N^{d_F}).
    DC-7-order: >-
      Graded reverse lexicographic, variables in the order bits of X_1,
      ..., bits of X_m, then bits of U_1, ..., U_{m-2}. W_D is
      order-independent as a subspace, and DER-3 holds for every
      degree-compatible order. The order is fixed only because the engine's
      column layout uses it. C-AA-ENC permutes it.
    DC-8-groebner-basis-of-Z: >-
      The reduced grevlex Groebner basis of I(Z) in B, with field equations
      omitted. It is computed from the algebraically enumerated solution set Z
      by Buchberger-Moeller interpolation (or Sage ideal-of-points), with d_GB
      its maximum degree. For |Z| = 1, Z = {s}, it is {X_j + s_j : j = 1..N}.
    DC-9-adapted-generators: >-
      (Added in revision 2, DR-1.) The raw generators are the M = (m-1)n
      reduced multilinear descended coordinates of DC-4, in the order of the
      links. Every closure, every certificate and every exact metric is
      computed on the ADAPTED generators: the reduced row echelon form of the
      F_2-span of the raw generators, columns in descending grevlex (degree
      first, then the engine's column order), the pivot of a row being its
      grevlex-largest monomial, each pivot column cleared in all other rows,
      zero rows dropped. It is a function of the span alone. Its
      serialisation hash is system_sha256 and the hash of the raw list is
      raw_system_sha256 (both recorded per instance, formats.md section 2).
      Justification. (i) M_D of a raw list depends on the chosen basis of the
      span, because deg f_i enters the multiplier bound, so raw M_D is not
      invariant under equation recombination and A/A equality with noise floor
      0 is impossible on raw lists. (ii) DER-8 shows that for D >= 3 the
      closure W_D is the same for raw and adapted generators, because every
      raw generator has degree <= 3. So the decisive quantity (M-1 at D = 4),
      the Groebner-basis criterion DER-3 and the F4 containment statement DER-2
      are independent of this convention. (iii) The convention differs from raw
      only at D = 2 (raw cubics are not in M_2, the adapted span contains its
      lower-degree combinations such as the degree-1 element of DER-9), in the
      plain Macaulay space M-7, and in iteration 0 of M-4. At D = 2 the adapted
      W_2 is the closure of the degree-<=2 part of the span, which an F4 run
      sees only after interreduction of its inputs. D = 2 values are therefore
      descriptive under this reading and are labelled adapted in every report.
      (iv) Honest limit: this is the degree-4 closure of what an F4 run sees
      once it has interreduced its input, and for D >= 3 even without
      interreduction (DER-8). It is an upper bound on what an F4 run can reach,
      as DER-2 states, and not a model of any implementation's selection
      strategy.

  declared_derivations:
    note: >-
      These are derivation notes in the sense of docs/claims-and-verification.md:
      checkable arguments, not machine proofs. Each is re-checked by an
      independent reviewer joint before any claim rests on it. DER-1, DER-3,
      DER-6 and DER-8 also have computational checks in this contract. DER-9
      is checked on every instance by M-6.
    DER-1: >-
      For D >= 2, W_D^full(F u S_fe) cap B_{<=D} = W_D^bool(F). Argument:
      (i) for p of degree <= D, p - rho(p) lies in the span of
      t(X_j^2 + X_j) with deg <= D (repeated replacement of X_j^2 by X_j lowers
      degree), so rho(W^full) = W^full cap B. (ii) Induct along the fixpoint
      chain. Generators: rho(t f_i) = rho(rho(t) f_i), with deg rho(t) <= deg t.
      Field-equation rows map to 0. Mutant steps: rho(X_j g) = rho(X_j rho(g))
      with deg rho(g) <= D - 1. This gives rho(W^full) contained in W^bool.
      (iii) Conversely, W^bool rows rho(t f_i) and mutant images
      rho(X_j b) of b in W^bool cap W^full lie in W^full. Checked by C-FE-EQ.
    DER-2: >-
      Every polynomial produced by an F4-type computation (F4 or Buchberger
      under any selection strategy, XL, MutantXL) in which every formed row
      t * g has total degree <= D lies in W_D^full, for D >= 3 (the largest
      input degree; for D = 2 the cubic inputs are not rows of degree <= 2 and
      the statement is not made for raw inputs). Argument: the inputs lie
      in M_D. A row t * g with g already in W and t = X_{a1}...X_{ar} is
      reached by r mutant steps whose intermediates have degree
      <= deg(t g) - 1 <= D - 1. Reduction and S-polynomials are linear
      combinations. Consequence: if the Groebner basis is not in W_4, every
      such computation forms a row of degree >= 5.
    DER-3: >-
      For a degree-compatible order and I = ideal(EQS4) in B (radical, equal
      to I(Z) by the Boolean Nullstellensatz), the following are equivalent:
      (a) some Groebner basis G of I is contained in W_D; (b) d_GB <= D and
      dim W_D = dim B_{<=D} - rank(ev_{Z,D}), where ev_{Z,D} is evaluation of
      B_{<=D} on Z. (a) implies (b): reduction by G of any element of
      I cap B_{<=D} subtracts rows t * g of degree <= D, which lie in W_D, so
      I cap B_{<=D} is contained in W_D, which is contained in I; the reduced
      GB has degree <= D. (b) implies (a): the reduced GB lies in
      I cap B_{<=D} = W_D. For |Z| = 1 this reduces to dim(W_D cap B_{<=1}) = N
      with 1 not in W_D, that is, every X_j + s_j is in W_D.
    DER-4: >-
      d_F(EQS4) <= 4 under both readings of condition (1) for every instance
      with N >= 2 (Koszul padding on two field equations, the derivation
      file). Under the equality reading, d_F^eq <= 3 exactly when a nonzero
      homogeneous top syzygy exists at degree <= 3 with a nonzero lower-degree
      sum (computed as M-6). A degree-3 fall cannot come from field-equation
      multipliers alone, because l_j X_j^2 terms are non-multilinear and
      pairwise distinct across j. By DER-9 the value is in fact <= 2 on every
      EQS4 and EQS2 instance with m >= 3, so the cases d_F^eq = 3 and 4 are not
      expected to occur. M-6 still computes the exact value and records it.
    DER-5: >-
      Under the printed ">=" reading, d_F = 1 + (least degree of a nonzero
      ideal element), which is 2 on every satisfiable instance with a unique
      solution (KN-FIND-936151 section 3). Assumption 1 would then require
      every polynomial in the computation to have degree <= 2, while the
      inputs include cubics. So the ">=" reading is violated on inspection on
      every m >= 3 instance. Recorded, never used as this experiment's
      evidence. The same holds under the equality reading on any instance
      with d_F^eq = 2, and by DER-9 that is every instance with m >= 3. So
      Assumption 1 with the exact equality-reading d_F is violated on
      inspection at every instance of the grid under DC-6 (cubic input rows
      count as polynomials of the computation). This is a statement about the
      reading of Assumption 1, not an experimental result. It is the reason the
      decisive test is the operational form "degree 4 suffices", the form that
      the cost bound O((nm)^{4w}) uses via Proposition 5's d_F <= 4. If
      Assumption 1 is read as bounding only rows formed beyond the inputs, the
      inspection argument does not apply, and D_solve against d_F^eq = 2 is
      reported descriptively (S-AS1-EXACT).
    DER-6: >-
      PC-TRI is contained in W_3. Construction: f_j = X_j + s_j +
      q_j(X_1..X_{j-1}) - q_j(s) for j = 1..N, plus extra equations
      q_e(X) - q_e(s), with q random multilinear of degree <= 3, followed by
      a random invertible affine variable map phi and a random invertible
      recombination of equations. Induction: if X_i + s_i is in W_3 for every
      i < j, each monomial X_a X_b X_c - s_a s_b s_c equals
      X_a X_b (X_c + s_c) + s_c X_a (X_b + s_b) + s_c s_b (X_a + s_a), whose
      terms are reached by mutant steps from degree-1 elements with
      intermediate degree <= 2, so X_j + s_j is in W_3. phi is a
      degree-preserving automorphism of B (linear forms are idempotent in B),
      and W_3(phi(F)) = phi(W_3(F)). Hence D_solve <= 3 and |Z| = 1.
    DER-7: >-
      Without S_fe, the descended system alone still has d_F^eq <= 4 at
      m >= 3: padding on two quadratic last-link generators. So "S_fe outside"
      does not rescue a counterexample to Proposition 5 either. Recorded for
      the C-FE-OUT reading only.
    DER-8: >-
      (Added in revision 2, DR-1.) Let S be the F_2-span of the raw generators
      and S_ad the adapted basis (DC-9). Write M_D(S) for the span of
      rho(t h) over h in S and monomials t with deg t + deg h <= D.
      (a) M_D(S_ad) = M_D(S). The adapted basis has pairwise distinct leading
      monomials in a degree-compatible order, so every nonzero h in S is a sum
      of basis rows each of degree <= deg h (the largest leading monomial is
      the leading monomial of h, and a degree-compatible order makes its degree
      deg h). Hence t * h is a sum of rows t * b_i with deg t + deg b_i <= D.
      The reverse inclusion is trivial. So M_D(S_ad) is a function of S, and
      M_D(raw list) is contained in it, with equality only for raw lists that
      are themselves degree-adapted.
      (b) For D >= 3 and every raw generator of degree <= 3, W_D(raw) =
      W_D(S_ad). W_D(raw) is contained in W_D(S_ad) by (a). Conversely any h
      in S is a sum of raw generators, each a row t = 1 of M_D(raw) because
      its degree is <= 3 <= D, so h is in M_D(raw), hence in W_D(raw). For t =
      X_{a1}...X_{ar} with deg t + deg h <= D, the intermediate polynomials
      h_i = rho(X_{ai} h_{i-1}) have degree <= deg h + i - 1 <= D - 1 before
      the step, so each step is a legal mutant step, and t h is in W_D(raw).
      So M_D(S_ad) is contained in W_D(raw), and therefore W_D(S_ad) is
      contained in W_D(raw). The raw maximum degree is recorded per instance
      (raw_degree_profile) and the statement is used only for D >= it.
      (c) Covariance. Let phi be an invertible affine substitution of the
      variables. In B, a linear form l satisfies l^2 = l, so phi is a
      well-defined algebra automorphism with phi(B_{<=d}) = B_{<=d}, and it
      preserves degree. Then phi(M_D(S)) = M_D(phi(S)). The mutant step is
      covariant too: sum_j phi(X_j) * g' and sum_j X_j * g' differ only by
      affine combinations of g' itself, which already lie in W^(i). So
      phi(W^(i)) is the i-th iterate for phi(S) at every i and every D, and
      the dims-by-degree series (M-4, including iteration 0), M-1, M-2, M-3,
      M-5 and M-7 of an A/A re-encoding on adapted generators are equal to the
      source's exactly (equation recombination changes S not at all, and the
      affine map acts as phi). This is why C-AA-ENC has noise floor exactly 0.
      Computational checks: F-4 (raw against adapted final dimensions at D =
      3, 4, 5 on the 50 random mixed-degree systems) and C-AA-ENC.
    DER-9: >-
      (Added in revision 2, DR-2.) For every EQS4 or EQS2 instance with m >= 3
      the F_2-span of the n coordinate polynomials of the last link
      S_3(U_{m-2}, X_m, x_R) contains the nonzero affine form
      Tr(U_{m-2}) + Tr(X_m) + Tr(x_R^{-2} B). Proof. Put x1 = U, x2 = X, x3 =
      x_R (a nonzero constant). In characteristic 2,
      S_3 = U^2 X^2 + x_R^2 U^2 + x_R^2 X^2 + x_R U X + B. For gamma in
      F_{2^n} the functional Tr(gamma * S_3) is an F_2-linear combination of the
      coordinates. Tr(gamma U^2 X^2) = Tr(gamma^{1/2} U X), because
      Tr(a^2) = Tr(a). So the bilinear part of Tr(gamma * S_3) is
      Tr((gamma^{1/2} + gamma x_R) U X), which vanishes for gamma = x_R^{-2}.
      What remains is Tr(U^2) + Tr(X^2) + Tr(gamma B) = Tr(U) + Tr(X) +
      Tr(x_R^{-2} B). It is a nonzero function of the bits because the trace
      form is a nonzero functional of the polynomial basis. Consequences.
      (i) The span has an element of degree 1, so the adapted system and W_D for
      every D >= 1 contain a linear form that no random profile-matched null
      has (declared mismatch of NULL-PROF and NULL-SHUF, C-NULL). (ii) With
      constant multipliers g_i = c_i on the last-link coordinates (degree 2
      each in the involved rows), the sum is that degree-1 element, so
      d_F^eq <= 2 at every instance, and d_F^eq = 2 unless a degree-1 fall
      exists (two linear elements of the span with equal top forms). M-6 reports
      the exact value. (iii) The linear form eliminates one Boolean variable, so
      the effective number of free variables is N - 1 or fewer. It does not by
      itself decide containment, because W_4 must still contain the other
      linear forms X_j + s_j of the Groebner basis, which is the quantity under
      test. It does not change DER-3. (iv) Only the last link is degenerate in
      this way: the cubic term x1 x2 x3 of a link with three non-constant
      arguments prevents the cancellation. Checked computationally on every
      instance by M-6 and by the linear-forms count M-2 at D = 2.

