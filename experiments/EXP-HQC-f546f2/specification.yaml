  controls:
  - 'null: tilt = identity, IS must reduce to MC exactly'
  - >-
    positive: planted weaker decoder (one RS correction fewer) with known higher DFR, IS must
    track the change
  - 'A/A: IS under two seed blocks'
  independent_variables:
  - estimator
  - decoder
  metrics:
