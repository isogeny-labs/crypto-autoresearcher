          equals: ic-c1-dg-s2-20261106
        - pointer: /request_sha256
          equals: d58a601e3a5503bd37578105763f05c35ec6b98503faa55628781fd61f8c4bf1
  controls: []
  replay:
    mode: exempt
    exempt_reason: re-executing a trial relaunches a paid EKS job; the study replay is ecbench verify --replay-all inside analyze-c1.sh (step
      S03-verify, protocol section 7.3 step 1)
  on_invalid: stop
  on_failure:
