  engine: supervisor
  claim:
    ttl_minutes: 90
  timeout_seconds: 5100
  validity:
    files:
    - path: raw-result.json
      json: true
      assertions:
      - pointer: /schema
        equals: c1.launch.raw-result/v1
      - pointer: /attack_claimed
        equals: false
      - pointer: /experiment_id
        equals: EXP-ICPERF-127dbd
      - pointer: /hypothesis_id
        equals: H-ICPERF-4cb536
      - pointer: /task_id
        equals: TASK-20261107-f14df8
      - pointer: /approved_by
