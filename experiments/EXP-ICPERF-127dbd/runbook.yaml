- id: S03-trial-s2
  kind: trials
  title: Submit request S2 once under launch_eks.sh v3b and check the download
  explain: Trial T2 runs launch_eks.sh v3b on request-s2.json as RUN-ICPERF-efb7ef under the trial supervisor, followed by check_job.py. The wrapper locates the job
    results with locate_results.sh and records results_locator, job_uid and pod_uid in raw-result.json. This step runs only if S02-reconcile-t1 passed. Controls is
    empty because the C1 controls (incumbent-aa, rho-neg-aa, pc-fb2x) are arms inside each ecbench job, not plan trials; their gates are evaluated by the frozen analyze-c1.sh
    in step S04-verify. No step retries a launch. The declared artifacts are the files under 1 MiB; records.jsonl and plan.json of the session are bound through job/artifacts/SHA256SUMS
    and job_files in raw-result.json.
