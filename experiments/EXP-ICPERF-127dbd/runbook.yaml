- id: S04-verify
  kind: command
  purpose: verification
  title: Run the frozen analyze-c1.sh on the two downloaded sessions
  explain: Runs analyze-c1.sh once on session 1 (the reconciled S1 copy in the step output directory of S02-reconcile-t1) and session 2 (the S2 download) with the
