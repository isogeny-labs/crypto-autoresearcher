purpose: Executes protocol IC-C1-DEFERRED-GUARD-FP28-20261106 version 3 (protocol_sha256 4b7bf35f..., which carries C1-AMENDMENT-1 and C1-AMENDMENT-2; the version
  2 hash was 9844f78d..., the version 1 hash 43b1ca91...). S1 already ran once as RUN-ICPERF-8b0d47; its output is brought in by implementation/reconcile_run.sh,
