steps:
- id: S01-probe
  kind: command
  purpose: probe
  title: Check the aws CLI version, the caller identity, the pinned ecbench, the bound requests and the launcher scripts before any spend
  explain: Runs the bound probe_s01.sh once. In order it checks the first token of aws --version against aws-cli/1.46.2 (the CLI whose memory use was measured), prints
    aws sts get-caller-identity, checks the sha256 of the local pinned ecbench, recomputes the sha256 of request-s1.json and request-s2.json against protocol.json
    extensions.requests, checks the four launcher scripts against remote-pins.sha256, and prints the crypto checkout HEAD. It exits nonzero at the first mismatch,
    which stops the session before any launch. The step requires Account 104186811093 in its output; no AWS write call is made.
  argv:
  - bash
  - experiments/EXP-ICPERF-127dbd/implementation/probe_s01.sh
  - --protocol
  - experiments/EXP-ICPERF-127dbd/inputs/protocol.json
  - --inputs
  - experiments/EXP-ICPERF-127dbd/inputs
  - --ecbench
  - /tmp/claude-0/-home-user/fe537fb0-7f2e-504d-8df2-39e551cfffea/scratchpad/v6/bin-pinned/ecbench
  - --request
  - request-s1.json
  - --request
  - request-s2.json
  - --aws-cli
  - aws-cli/1.46.2
  timeout_seconds: 120
  validity:
    exit_code: 0
    stdout_matches: '"Account":\s*"104186811093"'
  on_failure:
  - when:
      timed_out: true
    class: infrastructure_error
    action: stop
  tell_on_failure: The probe stopped. Report its stderr log path and its last stdout line. Start no launch. Do not rerun or reopen this runbook session; wait for
    a Coordinator decision. If stderr names an AWS CLI MISMATCH, re-measure under the recorded procedure; do not edit the runbook.
- id: S02-reconcile-t1
  kind: command
  purpose: verification
  title: Bring in the output of the S1 job under RUN-ICPERF-8b0d47 by a read-only reconciliation that launches nothing
  explain: Runs the bound reconcile_run.sh once. It checks that the committed launcher result of RUN-ICPERF-8b0d47 has sha256 7c3d9954a561a7a0d07e498afe3ecdf5b8c53359cfa28abb578a67dc8a6d60e7,
    locates the S1 results prefix with locate_results.sh from the launcher receipt status.json (Job uid, job name, exactly one pod, only launcher/ and that pod prefix
    under the job listing), copies that prefix read-only into the step output directory, checks that job-exit.json names the located pod, the job ic-c1-dg-s1-20261106
    and the container exit code, runs the bound check_job.py on the copy, checks that SHA256SUMS lists run-summary.json at the empty-file sha256, and writes reconcile-result.json.
    Its only AWS calls are aws s3 cp from S3 and aws s3 ls. It submits no job, starts no build and writes nothing to S3 or under runs/RUN-ICPERF-8b0d47. records.jsonl
    is hashed and its newlines are counted, never parsed.
  argv:
  - bash
  - experiments/EXP-ICPERF-127dbd/implementation/reconcile_run.sh
  - --launcher-result
  - experiments/EXP-ICPERF-127dbd/runs/RUN-ICPERF-8b0d47/job/launcher/result.json
  - --launcher-result-sha256
  - 7c3d9954a561a7a0d07e498afe3ecdf5b8c53359cfa28abb578a67dc8a6d60e7
  - --request
  - experiments/EXP-ICPERF-127dbd/inputs/request-s1.json
  - --check-job
  - experiments/EXP-ICPERF-127dbd/implementation/check_job.py
  - --run-id
  - RUN-ICPERF-8b0d47
  - --trial-id
  - T1
  - --out
  - '{out}'
  timeout_seconds: 1800
  validity:
    exit_code: 0
    stdout_matches: reconcile_pass=true reconcile_exit=0
    outputs:
    - path: '{out}/reconcile-result.json'
      json: true
      assertions:
      - pointer: /schema
        equals: c1.reconcile.result/v1
