    class: invalid_measurement
    action: stop
  tell_on_failure: The launch step stopped. Report the printed status line, the run directory names under experiments/EXP-ICPERF-127dbd/runs,
    and the outcome_class in each raw-result.json that exists. Do not rerun or reopen this runbook session; wait for a Coordinator decision. Do
    not run launch_eks.sh again and do not start any other launch. Do not open records.jsonl.
