steps:
- id: S01-probe
  kind: command
  purpose: probe
  title: Check the aws CLI version, the caller identity, the pinned ecbench, the bound requests and the launcher scripts before any spend
  explain: Runs the bound probe_s01.sh once. In order it checks the first token of aws --version against aws-cli/1.46.2 (the CLI whose memory
    use was measured), prints aws sts get-caller-identity, checks the sha256 of the local pinned ecbench, recomputes the sha256 of request-s1.json
    and request-s2.json against protocol.json extensions.requests, checks the four launcher scripts against remote-pins.sha256, and prints the
    crypto checkout HEAD. It exits nonzero at the first mismatch, which stops the session before any launch. The step requires Account 104186811093
    in its output; no AWS write call is made.
  argv:
  - bash
  - experiments/EXP-ICPERF-127dbd/implementation/probe_s01.sh
  - --protocol
  - experiments/EXP-ICPERF-127dbd/inputs/protocol.json
  - --inputs
  - experiments/EXP-ICPERF-127dbd/inputs
  - --ecbench
  - /tmp/claude-0/-home-user/fe537fb0-7f2e-504d-8df2-39e551cfffea/scratchpad/v6/bin-pinned/ecbench
  - --request
  - request-s1.json
  - --request
  - request-s2.json
  - --aws-cli
  - aws-cli/1.46.2
  timeout_seconds: 120
  validity:
    exit_code: 0
    stdout_matches: '"Account":\s*"104186811093"'
  on_failure:
  - when:
      timed_out: true
    class: infrastructure_error
    action: stop
  tell_on_failure: The probe stopped. Report its stderr log path and its last stdout line. Start no launch. Do not rerun or reopen this runbook
    session; wait for a Coordinator decision. If stderr names an AWS CLI MISMATCH, re-measure under the recorded procedure; do not edit the runbook.
- id: S02-trials
  kind: trials
  title: Submit request S1 then request S2 once each and check each download
  explain: Trial T1 runs launch_eks.sh on request-s1.json and trial T2 on request-s2.json under the trial supervisor, each followed by check_job.py.
    T2 starts only if T1 is output_validated. Controls is empty because the C1 controls (incumbent-aa, rho-neg-aa, pc-fb2x) are arms inside each
    ecbench job, not plan trials; their gates are evaluated by the frozen analyze-c1.sh in step S03-verify. No step retries a launch. The declared
    artifacts are the files under 1 MiB; records.jsonl and plan.json of each session are bound through job/artifacts/SHA256SUMS and job_files
    in raw-result.json.
  plan: experiments/EXP-ICPERF-127dbd/trial-plan.json
  engine: supervisor
  claim:
    ttl_minutes: 165
  timeout_seconds: 9600
  validity:
    files:
    - path: raw-result.json
      json: true
      assertions:
      - pointer: /schema
        equals: c1.launch.raw-result/v1
      - pointer: /attack_claimed
        equals: false
      - pointer: /experiment_id
        equals: EXP-ICPERF-127dbd
      - pointer: /hypothesis_id
        equals: H-ICPERF-4cb536
      - pointer: /task_id
        equals: TASK-20261106-4b7018
      - pointer: /approved_by
        equals: DEC-20261106-c69de4
      - pointer: /trial_id
        equals: '{trial_id}'
      - pointer: /run_id
        equals: '{run_id}'
      - pointer: /submitted
        equals: true
      - pointer: /outcome_class
        equals: job_completed
      - pointer: /launch_remote_exit
        in:
        - 0
        - 26
      - pointer: /codebuild_status
        in:
        - SUCCEEDED
        - FAILED
      - pointer: /retried
        equals: false
      - pointer: /job_exit_json_present
        equals: 'yes'
      - pointer: /sha256sums_present
        equals: 'yes'
      - pointer: /job_exit_code
        in:
        - '0'
        - '42'
        - '43'
      - pointer: /results_uri
        matches: ^s3://isolab-results-104186811093-us-east-2/runs/ic-c1-dg-s[12]-20261106/[0-9a-f-]{36}/$
  by_trial:
    T1:
      files:
      - path: raw-result.json
        json: true
        assertions:
        - pointer: /job_name
          equals: ic-c1-dg-s1-20261106
        - pointer: /request_sha256
          equals: 683cc67d136ab6a2e5f1f3fbc7f6ae20ba981194f4781418340d883620b6c779
    T2:
      files:
      - path: raw-result.json
        json: true
        assertions:
