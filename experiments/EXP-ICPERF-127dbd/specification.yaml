      - {name: oracle, treatment: fixed, how: "mitm:negation_folded=1 in every IC arm of the frozen specs"}
      - {name: max_trials, treatment: fixed, how: "26479085 in the frozen specs; the decision requires censored_pairs == 0"}
      - {name: linalg_solver, treatment: fixed, how: "incremental-gauss, solver empty, solver_budget_seconds 0 (plan defaults) in the frozen specs"}
      - {name: accounting, treatment: fixed, how: "as emitted at ea8e9ef7; the band charges sqrt_solves, lookups, row_ops, legendre_symbols and target_guard_probes, and rho canonicalisations; no accounting edit inside the study"}
      - {name: curves, treatment: randomized, how: "ecbench prime_search at 28 bits from the frozen curve seeds 2026110628201/202 (S1) and 2026110628211/212 (S2)"}
      - {name: targets, treatment: randomized, how: "60 public targets per curve from target seed 2026110628203 (S1) and 2026110628213 (S2)"}
      - {name: algorithm_seed, treatment: randomized, how: "derived by ecbench from measurement seed 2026110628204 (S1) / 2026110628214 (S2) as a function of (workload, round) only, shared by all ten arms"}
      - {name: arm_label_and_position, treatment: crossed, how: "order alternate_measured: every arm in every round, interleaved"}
      - {name: warmup, treatment: fixed, how: "1 warm-up per workload, discarded from the comparisons, kept for parity"}
      - {name: host, treatment: measured, how: "node, pod and CPU recorded; counted cost does not depend on the host"}
      - {name: memory_layout_environment, treatment: measured, how: "recorded; no effect on counts"}
      - {name: spot_preemption, treatment: measured, how: "a host loss stops the session; a rerun is a new runbook session on the frozen -r2 request after a Coordinator decision"}
      - {name: analyst, treatment: fixed, how: "frozen analyze-c1.sh, sha256 66aa2ffd..., bound in this specification and the runbook"}
    comparisons:
      - id: cmp-recipe
        design: one_factor
        arms: [incumbent, candidate]
        differs_in: [recipe]
        reason: >-
          The claim is recipe-level by DEC-20261106-1d23b6 c1_route_ruling.route_A. recipe
          bundles guard placement, target source and N. No sentence attributes the effect to
          a sub-factor; attribution is descriptive, through cmp-factorial.
      - {id: cmp-guard-n407, design: one_factor, arms: [srenew-eager-n407, srenew-deferred-n407], differs_in: [guard_placement]}
      - {id: cmp-guard-n304, design: one_factor, arms: [srenew-eager-n304, candidate], differs_in: [guard_placement]}
      - id: cmp-factorial
        design: factorial
        arms: [incumbent, walk-eager-n304, srenew-eager-n407, srenew-deferred-n407, srenew-eager-n304, candidate]
        differs_in: [guard_placement, target_source, factor_base_size]
        reason: a partial factorial; the walk/deferred cells do not exist on ea8e9ef7 (route B); descriptive, decides no claim
      - {id: cmp-positive, design: one_factor, arms: [incumbent, pc-fb2x], differs_in: [factor_base_size]}
      - {id: cmp-aa-incumbent, design: aa, arms: [incumbent, incumbent-aa], differs_in: [arm_label_and_position]}
      - {id: cmp-aa-rho, design: aa, arms: [rho-neg, rho-neg-aa], differs_in: [arm_label_and_position]}
      - {id: cmp-rho-incumbent, design: one_factor, arms: [rho-neg, incumbent], differs_in: [method_family]}
      - {id: cmp-rho-candidate, design: one_factor, arms: [rho-neg, candidate], differs_in: [method_family]}
  metrics:
    primary:
      - m-s-w0
      - m-s-w01
      - m-s-w1
    secondary:
      - m-total-gae
      - m-sqrt-solves
      - m-lookups
      - m-row-ops
      - m-legendre-symbols
      - m-target-guard-probes
      - m-canonicalisations
      - m-trials
      - m-relations
      - m-repeated-targets-skipped
      - m-parity
    definition: >-
      Counted S at weight w: the charged GAE of one complete verified solve plus w times the
      priced uncharged native operations, divided by sqrt(r) (protocol metrics). Read from
      ecbench compare --weight w ops, and weighted per-arm S from the per-workload means,
      never from top-level mean_s.
    decisive:
      - >-
        Per session: U_w = max(ci95[1], ci95_bootstrap[1]) of candidate/incumbent at each
        w in {0, 0.1, 1}, from analyze-c1.sh verdict.json
    never_read:
