  controls:
    - id: CTL-AA-INCUMBENT
      kind: aa
      arms: [incumbent, incumbent-aa]
      text: >-
        Counted A/A twin. It differs only in arm label and position in the order. It must be
        record-for-record identical: ops.ratio_b_over_a 1, ci95 [1, 1], same_seeds and
        unpaired_runs 0 at w = 0, 0.1 and 1.
      runbook_assertion: runbook.yaml S03-verify /sessions/{0,1}/detail/controls/twin_incumbent_aa
    - id: CTL-AA-RHO
      kind: aa
      arms: [rho-neg, rho-neg-aa]
      text: The same A/A rule for the matched rho reference.
      runbook_assertion: runbook.yaml S03-verify /sessions/{0,1}/detail/controls/twin_rho_neg_aa
    - id: CTL-POSITIVE
      kind: positive
      arms: [incumbent, pc-fb2x]
      text: >-
        pc-fb2x (size 814, the same code path as the incumbent) must be detected as higher:
        ops.ratio_b_over_a > 1 and ci95[0] > 1 at every weight.
      runbook_assertion: runbook.yaml S03-verify /sessions/{0,1}/detail/controls/pc_fb2x
    - id: CTL-NEGATIVE
      kind: negative
      present: false
      not_applicable_reason: >-
        C1 compares the deterministic counted cost of fixed recipes on fresh instances. It is
        not a detector that searches a population for a property, so there is no null
        population. The no-difference null is represented exactly by the A/A twins, and at
        w = 0 by the equal-N guard pairs.
    - id: CHK-PARITY
      kind: implementation_check
      arms: [srenew-eager-n407, srenew-deferred-n407, srenew-eager-n304, candidate]
      text: >-
        Equal-N parity, protocol section 5 rules 1 to 4, over all 1,080 algorithm_seed pairs of
        each parity comparison per session. A failure is implementation_defect.
      runbook_assertion: runbook.yaml S03-verify /sessions/{0,1}/parity/*/ok
    - id: RUNBOOK-CONTROLS-NOTE
      kind: note
      text: >-
        runbook.yaml S02-trials declares controls: [] because these controls are arms inside
        each ecbench job, not plan trials. Their gates are evaluated by the frozen
        analyze-c1.sh in step S03-verify (RULINGS-COMPILE; PROTOCOL.md section 18).
