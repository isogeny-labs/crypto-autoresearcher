# EXPERIMENT CONTRACT -- EXP-QLWE-ce0230 (review_required, unapproved, zero runs).
experiment:
  id: EXP-QLWE-ce0230
  hypothesis_id: H-QLWE-9efea9
  derived_from_idea: IDEA-20261018-9ca075
  question_id: RQ-QLWE-9108dc
  goal_id: GOAL-QLWE-291164
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: gamma_CDW vs gamma_BKZ on random cyclotomic ideals
  objective: Where the quantum ideal-lattice pipeline's gamma crosses BKZ's
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath/PARI (bnfinit under GRH), fpylll
    parameters: phi(m) in {16,20,24,32,40,48,64} (frozen conductor list); 50 ideals each;
      BKZ-20
    procedure: >-
      1. Frozen conductor list. 2. Random ideals of small norm. 3. Simulated CDW. 4. BKZ-20.
      5. Exact lambda_1. 6. Fit log gamma vs n, solve crossover.
  controls:
  - >-
    null/negative: random lattices with identical det and dimension (no ring structure): only
    BKZ is applicable
  - >-
    positive: principal ideals with planted short generator, where the log-unit step alone
    must give gamma near 1
  - 'A/A: two ideal-sampling seed blocks'
  independent_variables:
  - solver
  - degree
  metrics:
    primary:
    - log gamma ratio per degree
    - fitted n*
    secondary:
    - Stickelberger relation length
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: n*
    formula: n* > 128
    source: asymptotic exp(O~(sqrt n)) vs BKZ-20 linear-exponent gamma
  scale_relevance:
    tier: toy
    justification: 'phi(m) <= 64; transfer: fitted curves extrapolate; crossover reported
      with CI only'
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 40
    maximum_memory_gb: 32
    maximum_runs: 21
  stopping_rules:
  - stop at first degree where bnfinit exceeds 2 h
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - positive-control failure invalidates degree
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C1 shows CDW gamma above BKZ at all degrees (P1) and C2 gives n* > 128 with CI (P2), AA1
    noise floor
  falsification_criterion: C1 shows CDW below BKZ at some degree <= 64, or C2 CI includes
    n* <= 64
  decision_impact:
    on_positive: >-
      Record measured n* as the boundary of the ideal-lattice regime in the Lane 2 obstruction
      entry
    on_negative: >-
      Structure pays already at toy size; open a follow-up asking whether any lossy projection
      carries it to RLWE
  variable_ledger:
    independent:
    - name: solver
      levels:
      - cdw_simulated
      - bkz20
    - name: degree
      levels:
      - '16'
      - '20'
      - '24'
      - '32'
      - '40'
      - '48'
      - '64'
    factors:
    - name: ideal_seed_block
      treatment: randomized
      value: 2 x 25
      how: rng
    - name: grh_assumption
      treatment: fixed
      value: assumed
      how: PARI flag recorded
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - cdw_simulated
      - bkz20
      differs_in:
      - solver
      design: one_factor
    - id: C2
      arms:
      - fitted n* from cdw_simulated
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - cdw block A
      - cdw block B
      differs_in:
      - ideal_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-9ca075.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-9ca075.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
  - raw-result.json (per-trial records)
  - gamma_curves.csv
  - crossover_fit.json
  - report.pdf
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-QLWE-ce0230/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-9ca075.
    standing_authorization: >-
