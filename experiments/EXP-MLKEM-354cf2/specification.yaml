  title: Enumeration tree size vs GSA prediction
  objective: Size of the GSA-induced error in quantum enumeration inputs
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: fpylll, NumPy
    parameters: block dims {40,48,56,64}; BKZ-30; 20 instances per shape
    procedure: 1. Reduce. 2. Enumerate with node count. 3. Predict two ways. 4. Compare.
  controls:
  - 'null/negative: random lattices'
  - >-
    positive: synthetic exact-GSA profile basis (constructed) where prediction must match
    within 0.3 bits
  - 'A/A: two basis randomisations'
  independent_variables:
  - prediction_source
  - block_dim
  metrics:
    primary:
    - log2 T deviation
    secondary:
    - per-level node distribution
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: deviation at 64
    formula: '>= 1.5 bits'
    source: GSA tail error
  scale_relevance:
    tier: medium
    justification: block dim <= 64
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 30
    maximum_memory_gb: 8
    maximum_runs: 32
  stopping_rules:
  - stop at T > 2^40
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - A/A > 0.5 bits invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C2 deviation >= 1.5 bits and C1 measured-profile error <= 0.3 bits (P1, P2), AA1 noise
    floor
  falsification_criterion: C2 deviation <= 0.3 bits
  decision_impact:
    on_positive: Quantum-enumeration inputs in both schemes' cost work use measured-profile
      predictions
    on_negative: GSA retained for enumeration inputs
  variable_ledger:
    independent:
    - name: prediction_source
      levels:
      - gsa
      - measured_profile
    - name: block_dim
      levels:
      - '40'
      - '48'
      - '56'
      - '64'
    factors:
    - name: basis_randomisation_seed
      treatment: randomized
      value: '2'
      how: unimodular
    - name: lattice_shape
      treatment: crossed
      value: kem, dsa
      how: both shapes
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - gsa
      - measured_profile
      differs_in:
      - prediction_source
      design: one_factor
    - id: C2
      arms:
      - log2 T - gsa at 64
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - seed A
      - seed B
      differs_in:
      - basis_randomisation_seed
      design: aa
    crosses_map: false
