    expected_meaning: >-
      For each p in {31,43,59,83,353}, D_minus_63 and minus_16 must be the
      quadratic characters of -63 and -16 in F_p. Euler's criterion gives
      a^((p-1)/2) modulo p; residue p-1 represents -1. This checks the stated
      arithmetic prediction, not a missing measured output.
    script_path: 'audit-review.yaml#/audit_review/blind_rederivation/script'
    script: |
      import json
      primes = (31, 43, 59, 83, 353)
      def chi(a, p):
          r = pow(a % p, (p - 1) // 2, p)
          return -1 if r == p - 1 else r
      expected = {p: {"D_minus_63": chi(-63, p), "minus_16": chi(-16, p)}
                  for p in primes}
      print(json.dumps(expected, sort_keys=True))
    script_execution: 'python3 via stdin; stdlib only; no producer imports; no trial launched.'
    independent_value:
      31: {D_minus_63: -1, minus_16: -1}
      43: {D_minus_63: 1, minus_16: -1}
      59: {D_minus_63: -1, minus_16: -1}
      83: {D_minus_63: -1, minus_16: -1}
      353: {D_minus_63: -1, minus_16: 1}
