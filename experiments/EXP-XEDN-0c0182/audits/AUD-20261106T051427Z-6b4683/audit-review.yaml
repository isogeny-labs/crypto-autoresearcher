      chains. Chain A's bytes survive only in git history (fc38e671, reachable from HEAD through
      85a3fa6d98's second parent) and in the derived report reports/run-20261026T2106Z/data.json,
      whose journal_tip 45eff20e... is absent from the HEAD journal. No superseding path, correction
