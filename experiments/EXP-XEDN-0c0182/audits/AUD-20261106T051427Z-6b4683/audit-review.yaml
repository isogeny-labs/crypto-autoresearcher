  specification_fidelity:
    summary: >-
      The runbook binds the frozen spec version and both seeds, runs the two planned trials through
      the supervisor and asserts schema, identity, primes, curve, targets digest and frozen pair count,
      and the integer type of four census counts. It asserts no control, no prediction and no
      cross-trial comparison. Controls C1 to C4, the Legendre table, the p=353 clause and every
      secondary metric exist only as raw fields, reachable by replay, which compares exactly.
    items:
      - {spec: "independent variable p in {31,43,59,83,353}", runbook: "S01 validity /primes equals [31,43,59,83,353]", status: implemented}
      - {spec: "independent variable sign arm (4 arms)", runbook: "none (driver output /pairs[].arms[], /accepted_by_arm; replay compare only)", status: no_runbook_assertion}
      - {spec: "independent variable 32 frozen pairs", runbook: "/frozen_pairs equals 32; /targets_sha256 equals 55cfa882...; binds targets.json", status: implemented}
      - {spec: "replication seeds 20261016, 20261017 / run ids", runbook: "spec_bindings /replication/seeds; by_trial /seed, /run_id, /trial_id", status: implemented}
      - {spec: "budget maximum_memory_gb 1", runbook: "spec_bindings /budget/maximum_memory_gb; trial-plan memory_mb 1024", status: implemented}
      - {spec: "budget maximum_runs 2", runbook: "none", status: no_runbook_counterpart}
      - {spec: "C1 historical p=353 control", runbook: "none (steps.controls is []; /historical_control replay compare only)", status: no_runbook_counterpart}
      - {spec: "C2 unfaithful p31-pair00 opposite-sign eligible", runbook: "none", status: no_runbook_counterpart}
      - {spec: "C3 separating power (even-order chi=-1 exists)", runbook: "none", status: no_runbook_counterpart}
      - {spec: "C4 determinism replicate between the two runs", runbook: "none; no step compares trials", status: no_runbook_counterpart}
      - {spec: "C5 check.py exits 0 on each run", runbook: "supervisor trial-plan check_argv; unit valid requires receipt output_validated (check_returncode 0)", status: implemented_by_design_not_executed}
      - {spec: "primary f1_violations_total (P1)", runbook: "metric f1_violations_total; assertion type integer", status: implemented}
      - {spec: "primary odd_order_minus_eligible_at_3mod4 (P2)", runbook: "metric; assertion type integer", status: implemented}
      - {spec: "primary faithful_nonplus_eligible_arms_at_3mod4 (P2)", runbook: "metric; assertion type integer", status: implemented}
      - {spec: "primary p353 odd_order_points_with_minus_sign_eligible vs odd_order_affine_points (P2)", runbook: "none (/per_prime replay compare only)", status: no_runbook_metric}
      - {spec: "primary Legendre table D_minus_63, minus_16 (P3)", runbook: "none (/per_prime replay compare only)", status: no_runbook_metric}
      - {spec: "secondary faithful_pairs (P4)", runbook: "metric faithful_pairs; assertion type integer", status: implemented}
      - {spec: "secondary group order / odd part / two part (P4)", runbook: "none (replay only)", status: no_runbook_metric}
      - {spec: "secondary accepted cells vs H1 (P5)", runbook: "none (/accepted_by_arm, /pairs replay only)", status: no_runbook_metric}
      - {spec: "secondary per-pair arm detail, control fields", runbook: "none (replay only)", status: no_runbook_metric}
      - {spec: "stopping rule: stop after two checker-validated trials", runbook: "supervisor engine; on_invalid stop", status: implemented}
      - {spec: "stopping rule: crash/timeout/memory kill is failed_infrastructure", runbook: "timed_out -> resource_exhaustion; receipt memory_limit_exceeded/watchdog_expired -> resource_exhaustion; nonzero driver exit -> infrastructure_error", status: implemented_with_relabel}
      - {spec: "stopping rule: no third run without amendment and new approval", runbook: "none", status: no_runbook_counterpart}
      - {spec: "invalidation: check.py non-zero", runbook: "receipt invalid_output -> unit valid false", status: implemented}
      - {spec: "invalidation: run.py exits 3 (implementation failure)", runbook: "on_failure {exit_code: 3} -> implementation_error, but matched against the supervisor's exit code", status: misbound}
      - {spec: "invalidation: targets_sha256 differs", runbook: "/targets_sha256 equals assertion", status: implemented}
      - {spec: "invalidation: deterministic field differs (C4)", runbook: "none", status: no_runbook_counterpart}
      - {spec: "required_artifacts manifest.yaml, raw-result.json per run", runbook: "validity.files manifest.yaml, raw-result.json", status: implemented}
    findings:
      - >-
        F-SPEC-1. No runbook counterpart for controls C1, C2, C3 and C4, for the P3 Legendre table, or
        for the p=353 clause of P2. The session cannot have established them; only a replay with exact
        field comparison could reach them, and nothing was replayed. Re-derived independently below.
      - >-
        F-SPEC-2. The runbook's on_failure rule {exit_code: 3} -> implementation_error is evaluated on
        the trials step's exit code, which is the supervisor's (tools/runbook.py @91a53e8dc2 lines
        1593-1599: exit 3 = "trials remain or need reconciliation"). It is not run.py's exit 3 that the
        spec's invalidation rule names. A run.py exit 3 would surface as receipt status
        infrastructure_error (experiment_execution.py @91a53e8dc2 lines 933-934: driver returncode != 0). In this session
        run.py returned 0 on both trials, so the spec's run.py-exit-3 rule did not fire.
      - >-
        F-SPEC-3. Spec budget maximum_runs 2 and the stopping rule "No third run without a protocol
        amendment and a new approval" have no runbook counterpart. run.py was executed twice per run id:
        chain A on 2026-10-26 (21:05:56Z, 21:05:58Z) and chain B on 2026-10-30 (16:05:52Z, 16:05:58Z).
        experiments/EXP-XEDN-0c0182/amendments/ is empty. Whether a re-execution of a run id counts as a
        third run is a Coordinator ruling, not this screen's.
      - >-
        F-SPEC-4 (definition gap, not a defect). The spec does not define point-level sign eligibility.
        Under the quadratic-character reading (chi(s*x) = +1) the raw results hold, and P2's p=353 clause
        holds 42 == 42. Under the t-representative reading (some 1 <= t <= t_max = 64 with s*t^2 == x),
        which the spec's t_rule suggests, the p=353 count would be 12 != 42. The raw fields match the
        character reading exactly. "faithful" is defined only in IDEA-20261016-633cb1 ("both targets of
        odd order"), not in the spec. The P5 progression base (w0, z0) is not defined anywhere in the spec.

  attempt_4_validity:
    question: Why are the fourth attempt's units valid:false although every file assertion passed, and why exit 3?
    facts:
      - >-
        Journal seq 20/21: each unit's validity list shows passed: true with no failures for
        manifest.yaml and both raw-result.json blocks, but receipt_status is invalid_output and
        failure_class invalid_measurement. tools/runbook.py @91a53e8dc2 evaluate_unit (line ~1937) sets
        valid = (receipt status == "output_validated") and no problems. File assertions cannot make a
        unit valid if the supervisor receipt is not output_validated.
      - >-
        Both execution-receipt.json files (sha256 4e8f0abe..., a617797f...): returncode 0,
        check_returncode null, status invalid_output, published false. detail: "manifest.yaml fails
        the run schema (tools/validate_ledger.py) and cannot be completed from publish-time facts:
        run.result.certificate.kind must be one of discrete_log|decomposition|none". The same text is in
        steps/S01-trials.attempt-4.supervisor.stderr (sha256 6f7f3ab9...).
      - >-
        Mechanism (tools/experiment_execution.py @91a53e8dc2 lines 931-944, 553-588): after a driver exit 0
        the supervisor completes manifest.yaml into a run envelope before it runs the checker. run.py's
        manifest is four flat lines (run_id, trial_id, seed, status: output_written). It carries no
        certificate and no attack_claimed in manifest or raw-result, so the supervisor adds no
        certificate.kind. The schema gate then fails and EnvelopeRefused is raised. check.py was never
        launched: check.stdout.log and check.stderr.log are 0 bytes and check_returncode is null in both
        runs.
      - >-
        Exit 3: steps/S01-trials.attempt-4.supervisor.stdout reports output_validated 0,
        needs_reconciliation 2, measurement_complete false. The supervisor exited 3, which
        tools/runbook.py maps to "trials remain or need reconciliation", class implementation_error. It
        is also matched by the runbook's {exit_code: 3} rule (see F-SPEC-2).
      - >-
        Chain A (2026-10-26, supervisor at commit ee2347cb) failed identically. Same refusal text,
        returncode 0, check_returncode null; supervisor.stderr and supervisor.stdout blobs are identical
        between the two chains.
      - >-
        Later record (not part of the session): manifest_v2.yaml in both run dirs (commit 1884c0c8,
        2026-10-30T21:22Z; linked dd1d525f) is an additive superseding manifest recording status failed,
        certificate.kind none, checker_returncode null. It says it does not claim checker admission.
    classification_note: >-
      This is a driver/supervisor interface failure: the driver's manifest is not completable by the
      supervisor at that revision. Under AGENTS.md core rule 5 it is not evidence about H-XEDN-5befd8.

