  blind_rederivation:
    metric: >-
      f1_violations_total (spec primary, P1), with the other P1-P3 primary quantities
      (odd_order_minus_eligible_at_3mod4, faithful_nonplus_eligible_arms_at_3mod4, the p=353
      minus-eligibility clause, the Legendre table) and C1-C3 derived the same way.
    script: experiments/EXP-XEDN-0c0182/audits/AUD-20261106T051427Z-6b4683/scripts/blind_rederive.py
    script_sha256: c17bbe9e99986ca7d462e3fa1cc1c469eaecb135e045e1bff41cb5c853d1b6ad
    output: experiments/EXP-XEDN-0c0182/audits/AUD-20261106T051427Z-6b4683/scripts/blind_rederive.out.json
    output_sha256: e2782740d81d01173254db1327152bf5858af2c921234260e9543622ab9f1cce
    command: python3 -I <script> /home/user/crypto-autoresearcher <output> (run from a scratch cwd; Python 3.13.18)
    method: >-
      From the spec's definitions only: exhaustive enumeration of (x, y) on y^2 = x^3 - x^2 + 16x over F_p,
      point order by repeated affine addition, chi by Euler's criterion. The value is computed from first
      principles, not from the producer's intermediate fields, then compared field by field with each
      unit's raw-result.json. Inputs: specification.yaml (digest-pinned), targets.json (frozen input,
      digest-pinned), IDEA-20261016-633cb1's definition of faithful.
    values:
      blind:
        f1_violations_total: 0
        odd_order_minus_eligible_at_3mod4: 0
        faithful_nonplus_eligible_arms_at_3mod4: 0
        faithful_pairs: 0
        p353_odd_order_points_with_minus_sign_eligible: 42
        p353_odd_order_affine_points: 42
        legendre_D_minus_63: {31: -1, 43: 1, 59: -1, 83: -1, 353: -1}
        legendre_minus_16: {31: -1, 43: -1, 59: -1, 83: -1, 353: 1}
        group_order: {31: 32, 43: 40, 59: 72, 83: 72, 353: 344}
        odd_part: {31: 1, 43: 5, 59: 9, 83: 9, 353: 43}
        odd_order_affine_points: {31: 0, 43: 4, 59: 8, 83: 8, 353: 42}
        even_order_points_with_nonresidue_x: {31: 16, 43: 20, 59: 36, 83: 36, 353: 172}
        alt_t_rep_reading_p353_minus_eligible: 12
      raw_result_RUN-XEDN-132272: >-
        f1_violations_total 0, odd_order_minus_eligible_at_3mod4 0, faithful_nonplus_eligible_arms_at_3mod4
        0, faithful_pairs 0. Zero differences over every compared field (top-level counts and ids,
        per_prime census and legendre at all five primes, historical_control, 32 pairs' order/faithful
        flags, 128 arm eligibilities).
      raw_result_RUN-XEDN-f4d646: same; zero differences.
      session_summary: >-
        No value. The journal seq 23 summary reports n 0, count 0, min/max null for every metric, with
        both trials in excluded_trials (units invalid). The blind value has no session summary to agree
        or disagree with; it agrees with both invalid units' raw fields.
    predictions_on_blind_values: >-
      P1 holds. P2 holds; its faithful-arm clause is vacuous (faithful_pairs 0), while its point-level
      clause is not (4, 8 and 8 odd-order points at 43, 59, 83). P3 matches the table exactly. C1, C2
      and C3 hold. These are reader recomputations on checker-unvalidated outputs. They are not a
      validation and say nothing about H-XEDN-5befd8.
    caveat: >-
      The p=353 clause depends on the point-level eligibility reading (F-SPEC-4). Under the
      t-representative reading it would read 12 != 42.

  certificate_checks:
    note: >-
      This census claims no discrete-log, relation or decomposition certificate (manifest_v2.yaml:
      certificate.kind none). Its checkable claims are point facts, and these are re-verified for both
      units. The audit replayed no unit, so "two replayed" is impossible. Both units here are unreplayed.
    script: experiments/EXP-XEDN-0c0182/audits/AUD-20261106T051427Z-6b4683/scripts/certificate_checks.py
    script_sha256: 395b61108dcc8ff3dbaf951ae4c6cba00ed6aefda58446b4e508bc71f98737fd
    output: experiments/EXP-XEDN-0c0182/audits/AUD-20261106T051427Z-6b4683/scripts/certificate_checks.out.json
    output_sha256: 5af505e1c484778cc4385c764ec15ad5bb816e85790dbb8853c60b5fa23c08e4
    independence: >-
      Own arithmetic, stdlib only, sharing no code with the producer (never read) or with
      blind_rederive.py. Group order by the character sum p + 1 + sum chi(f(x)). Odd order by
      [odd part]P = O with Jacobian double-and-add, hand-derived including the a2 term and self-tested
      by Lagrange on all 39 affine points at p=43. Exact H1 predictions with fractions.Fraction.
    results:
      - {unit: RUN-XEDN-132272, replayed: false, checks: "group_order at 5 primes agrees; f1_violation_points empty; historical (9,63),(17,183) on curve, odd order, chi(x)=chi(-x)=+1; 32/32 pairs' P/Q odd-order flags agree; h1_predicted_exact equals the exact rational on 32/32 eligible arms (260 (s,t) terms); 24 supplementary-proposal pairs (seed 20261016) all on curve, odd order, distinct x", result: verified}
      - {unit: RUN-XEDN-f4d646, replayed: false, checks: "same checks; 24 supplementary-proposal pairs (seed 20261017) all on curve, odd order, distinct x", result: verified}
      - {input: targets.json, checks: "all 64 points on curve, distinct x per pair, every arm's t_representatives equal the first four t in [1,64] with s*t^2 == x mod p, no pair has both points of odd order (faithful_pairs 0)", result: verified}
      - {check: "C4 determinism on raw outputs", result: "no differing field outside run_id, trial_id, seed, supplementary_manifest_proposal, elapsed_seconds"}
      - {check: "P5 accepted cells, one pre-committed reading (w0=y_P, z0=y_Q least non-negative residues)", result: "matches 4 of 32 eligible arms per unit; not reproduced under this reading. The spec does not define w0, z0. No other reading was tried. This is not a finding against the producer."}

