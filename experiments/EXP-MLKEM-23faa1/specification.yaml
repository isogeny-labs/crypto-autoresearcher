# EXPERIMENT CONTRACT -- EXP-MLKEM-23faa1 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-23faa1
  hypothesis_id: H-MLKEM-ad6acd
  derived_from_idea: IDEA-20261018-06ab73
  question_id: RQ-MLKEM-003
  goal_id: null
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Saturation time and memory versus database quantization
  objective: Measure the compressible part of the sieve memory constant.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: patched G6K or standalone C++ sieve, Python analysis
    parameters: d in {60,70,80}; b in {32f,16,8,6,4,2}; 5 instances; 8 threads
    procedure: >-
      1) Freeze. 2) Validate null. 3) Run sweeps. 4) Record bytes, time, false negatives.
      5) Fit.
  controls:
  - 'null: b=32 float through the patched path must equal unpatched time within noise'
  - 'positive: b=2 where the false-negative rate must explode and saturation stall'
  - 'A/A: float32 arm with two database seed blocks'
  independent_variables:
  - quant_bits
  - sieve_dim
  metrics:
    primary:
    - time ratio
    - memory ratio
    secondary:
    - false-negative rate
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: time ratio at b=6
    formula: <= 1.2
    source: preregistered
  scale_relevance:
    tier: toy
    justification: >-
      sieve dimensions 60-90 on a single node; transfer assumption: the per-dimension exponent
      of the measured quantity is extrapolated to beta~400-900 only as a conditional statement
      with the fit interval; no FIPS 203 security claim
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    independent_instances: 5
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40
    maximum_memory_gb: 32
    maximum_runs: 200
  stopping_rules:
  - stop a run at 3x float32 time; record censored
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C1 time ratio <= 1.2 (P1) and memory ratio >= 4 (P2), beyond AA1 noise floor; C2 frontier
    reported.
  falsification_criterion: C1 time ratio >= 2 at b=8 or memory ratio < 2.
  decision_impact:
    on_positive: >-
      Add the measured bytes-per-vector constant as a numbered assumption lowering memory
      cost in the ML-KEM memory-charged model.
    on_negative: Keep float storage as the memory constant; quantization is not a lever.
  variable_ledger:
    independent:
    - name: quant_bits
      levels:
      - 32f
      - '16'
      - '8'
      - '6'
      - '4'
      - '2'
    - name: sieve_dim
      levels:
      - '60'
      - '70'
      - '80'
    factors:
    - name: db_seed_block
      treatment: randomized
      value: A,B
      how: database seed
    - name: threads
      treatment: fixed
      value: '8'
      how: pinned
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - quant_bits=6
      - quant_bits=32f
      differs_in:
      - quant_bits
      design: one_factor
    - id: C2
      arms:
      - time-memory frontier
      differs_in:
      - quant_bits
      - sieve_dim
      design: factorial
    - id: AA1
      arms:
      - 32f block A
      - 32f block B
      differs_in:
      - db_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-06ab73.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-06ab73.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with frozen protocol hash, tool versions (fpylll/G6K/Sage commit ids), host
    and seeds
  - raw-result.json with one row per (arm, instance, seed) including verification flag
  - analysis.json with effect sizes, bootstrap CIs and the AA noise floor
  - report.md plus graph (SVG/PNG) and PDF per the research-visuals skill
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
