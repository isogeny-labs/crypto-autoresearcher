  inputs:
    instrument: >-
      Python with a patched pure-Python FIPS 204 implementation cross-checked against PQClean
      ML-DSA-44 KATs
    parameters: >-
      ML-DSA-44 real parameters; h in {8, 12, 16, 20, 24}; derivations {conformant, K_dropped,
      mu_dropped}; 20 keys per cell; cap 2^20 signatures per key
    procedure: "REVIEW HOLD PR2404 entry 23: Condition collision costs on actual accepted-mask equality. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-MLDSA-b675fd/specification.yaml. A corrected prospective procedure is required; the archived procedure is withdrawn from execution consideration."
  controls:
  - 'null: conformant derivation at h = 8 (must show nothing)'
  - 'positive: K-dropped at h = 8 (must recover from one signature)'
  - 'A/A: mu-dropped at h = 12 under two seed blocks'
  independent_variables:
  - derivation
  - rnd_entropy_h
  metrics:
    primary:
    - signatures to recovery
    - ExpandMask calls to recovery
    secondary:
