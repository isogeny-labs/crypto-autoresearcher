    source: birthday bound with measured kappa alignment
  scale_relevance:
    tier: crypto
    justification: >-
      real ML-DSA-44 parameters; only the RNG entropy is reduced, which is the variable under
      study
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop a cell at 20/20 recoveries or 2^20 signatures per key
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
