  falsification_criterion: "REVIEW HOLD PR2404 entry 23: Condition collision costs on actual accepted-mask equality. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-MLDSA-b675fd/specification.yaml. No hypothesis verdict follows from this static protocol correction."
