# EXPERIMENT CONTRACT -- EXP-MLKEM-efc1c8 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-efc1c8
  hypothesis_id: H-MLKEM-3de234
  derived_from_idea: IDEA-20261018-ab4e4d
  question_id: RQ-MLKEM-003
  goal_id: null
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Bytes per pair test versus sieve dimension in G6K
  objective: Give the memory-access term in RQ-MLKEM-003's full-cost model a measured slope.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: G6K with read counters on db/cdb, valgrind cachegrind, Python fits
    parameters: >-
      d in {60,65,70,75,80,85,90}; kernels bgj1, bdgl, gauss (positive, d<=70); 5 instances;
      8 threads pinned; saturation 0.9
    procedure: >-
      1) Freeze. 2) Build lattices. 3) Run each kernel with counters. 4) Cachegrind at d<=75.
      5) Fit log2 bytes/test vs d.
  controls:
  - >-
    null: same sieves with the database artificially capped below LLC size (forced cache residency)
    - slope must be ~0
  - >-
    positive: Gauss sieve (list-based, uniform access) where bytes per test growth is known
    to be large
  - 'A/A: bgj1 at each d with two database-seed blocks'
  independent_variables:
  - sieve_kernel
  - db_cap
  - sieve_dim
  metrics:
    primary:
    - bytes per pair test
    - fitted slope
    secondary:
    - LL misses
    - wall time
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: slope of log2 bytes/test
    formula: ~ (0.2075 - c_bucket) per dim if buckets spill
    source: derived before data
  scale_relevance:
    tier: medium
    justification: >-
      sieve dimensions 60-90 on a single node; transfer assumption: the per-dimension exponent
      of the measured quantity is extrapolated to beta~400-900 only as a conditional statement
      with the fit interval; no FIPS 203 security claim
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    independent_instances: 5
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 120
    maximum_memory_gb: 64
    maximum_runs: 220
  stopping_rules:
  - skip cachegrind above d=75
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C2 slope >= 0.01 with CI excluding 0 (P1) and the bandwidth/op ratio >= 2 at d=90 (P2),
    with C1 showing the capped null flat; beyond AA1 noise floor.
  falsification_criterion: C2 slope CI includes 0 for both bgj1 and bdgl.
  decision_impact:
    on_positive: >-
      Add the measured bandwidth exponent to the memory-charged ML-KEM cost model as a numbered
      assumption with its interval.
    on_negative: >-
      Record that bucketed sieves are cache-friendly to d=90; memory access adds only a constant
      at measurable sizes.
  variable_ledger:
    independent:
    - name: sieve_kernel
      levels:
      - bgj1
      - bdgl
      - gauss_positive
    - name: db_cap
      levels:
      - uncapped
      - llc_capped_null
    - name: sieve_dim
      levels:
      - '60'
      - '65'
      - '70'
      - '75'
      - '80'
      - '85'
      - '90'
    factors:
    - name: db_seed_block
      treatment: randomized
      value: A,B
      how: initial database sampling seed
    - name: threads
      treatment: fixed
      value: '8'
      how: taskset
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - bdgl uncapped
      - bdgl llc_capped_null
      differs_in:
      - db_cap
      design: one_factor
    - id: C2
      arms:
      - slope over sieve_dim
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - bgj1 block A
      - bgj1 block B
      differs_in:
      - db_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-ab4e4d.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-ab4e4d.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with frozen protocol hash, tool versions (fpylll/G6K/Sage commit ids), host
    and seeds
  - raw-result.json with one row per (arm, instance, seed) including verification flag
  - analysis.json with effect sizes, bootstrap CIs and the AA noise floor
  - report.md plus graph (SVG/PNG) and PDF per the research-visuals skill
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
