experiment:
  id: EXP-MLDSA-965398
  hypothesis_id: H-MLDSA-f674fb
  derived_from_idea: IDEA-20261018-33a760
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: t0 bit-plane corruption tolerance
  objective: how much of t0 signing actually depends on
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: Patched Python FIPS 204
    parameters: ML-DSA-44/65/87; b in {0,1,2,3,4,5,8,13}; 10^5 signatures per cell; 10 keys
    procedure: 1) KAT. 2) Corrupt. 3) Sign/verify. 4) Fit law.
  controls:
  - 'null: uncorrupted sk'
  - 'positive: random t0 (all 13 planes)'
  - 'A/A: b = 4 under two seeds'
  independent_variables:
  - corrupted_planes_b
  - parameter_set
  metrics:
    primary:
    - verify failure rate
    secondary:
    - rejection count changes
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: failure rate
    formula: n k sqrt(2/pi) sqrt(tau/6) 2^b /(2 gamma2)
    source: boundary-crossing model derived in this record
  scale_relevance:
    tier: crypto
    justification: real parameters
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 8
    maximum_memory_gb: 8
    maximum_runs: 24
  stopping_rules:
  - stop at 10^5 per cell
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - >-
    a run whose toyDSA build fails the n = 256 KAT cross-check against the PQClean reference
    is void
  - >-
    any key or signature not generated by the run itself from its recorded seed invalidates
    the run (no external keys)
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: P1 in C2 and P2 in C1; AA1 noise floor rates within binomial CI
  falsification_criterion: C2 off by factor 4
  decision_impact:
    on_positive: record the integrity tolerance alongside the t0 secrecy price curve
    on_negative: revise the boundary-crossing model
  variable_ledger:
    independent:
    - name: corrupted_planes_b
      levels:
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '8'
      - '13'
    - name: parameter_set
      levels:
      - '44'
      - '65'
      - '87'
    factors:
    - name: seed_block
      treatment: randomized
      value: 3 disjoint 64-bit seed blocks
      how: keys, messages and rnd drawn from SHAKE256(seed_block || trial index)
    comparisons:
    - id: C1
      arms:
      - b 4
      - b 0
      differs_in:
      - corrupted_planes_b
      design: one_factor
    - id: C2
      arms:
      - law fit
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - b 4 seed-block A
      - b 4 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-33a760.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
