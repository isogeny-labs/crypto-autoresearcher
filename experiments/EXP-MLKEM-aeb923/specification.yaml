# EXPERIMENT CONTRACT -- EXP-MLKEM-aeb923 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-aeb923
  hypothesis_id: H-MLKEM-d8d1cc
  derived_from_idea: IDEA-20261018-02ad4a
  question_id: RQ-MLKEM-003
  goal_id: null
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Variance-component registry for lattice measurements
  objective: The noise floor every calibration in RQ-MLKEM-003 and ML-DSA lanes must beat
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: fpylll, G6K, statsmodels
    parameters: dims {60,80,100}; 10 instances x 5 basis seeds x 2 thread counts; shapes kem,
      dsa
    procedure: 1. Generate. 2. Run nested design. 3. ANOVA. 4. MDE. 5. Injected-effect check.
  controls:
  - >-
    null/negative: identical instance, identical basis, single thread (pure determinism check:
    variance must be 0 for op counts)
  - >-
    positive: inject a known 0.5-bit cost offset in one arm; the registry's test must detect
    it at 80% power
  - 'A/A: the full design repeated on two days/hosts'
  independent_variables:
  - instrument
  - dimension
  metrics:
    primary:
    - MDE bits
    secondary:
    - variance shares
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: MDE at dim 80
    formula: '>= 0.3 bits'
    source: typical lattice-reduction variability
  scale_relevance:
    tier: medium
    justification: dims <= 100
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 80
    maximum_memory_gb: 32
    maximum_runs: 120
  stopping_rules:
  - stop when CI on each variance share < 10%
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - determinism control failure invalidates op-count metrics
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C2 MDE >= 0.3 bits with P2 share >= 40%, C1 contrasts instruments, AA1
    noise floor
  falsification_criterion: C2 MDE < 0.1 bits
  decision_impact:
    on_positive: Registry adopted; proposals with minimum_effect below MDE must enlarge samples
    on_negative: Noise is negligible; proposals proceed with current sample sizes
  variable_ledger:
    independent:
    - name: instrument
      levels:
      - bkz40_fpylll
      - g6k_pump
    - name: dimension
      levels:
      - '60'
      - '80'
      - '100'
    factors:
    - name: basis_randomisation_seed
      treatment: randomized
      value: '5'
      how: nested
    - name: thread_count
      treatment: crossed
      value: 1 or 8
      how: both
    - name: host_day
      treatment: crossed
      value: two runs
      how: repeat
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - bkz40_fpylll
      - g6k_pump
      differs_in:
      - instrument
      design: one_factor
    - id: C2
      arms:
      - MDE per cell
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - run day 1
      - run day 2
      differs_in:
      - host_day
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-02ad4a.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-02ad4a.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml (frozen protocol, tool versions, seeds, git commit)
  - raw-result.json (per-trial records)
  - variance_components.csv
  - mde_table.csv
  - report.pdf
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
