# EXPERIMENT CONTRACT -- EXP-MLKEM-f55221 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-f55221
  hypothesis_id: H-MLKEM-7d2b89
  derived_from_idea: IDEA-20261018-03bbdd
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Failure rate of compression-aware versus norm-based ciphertext filters at elevated
    DFR
  objective: Measure how much the attacker-known rounding errors improve weak-ciphertext selection.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: C (PQClean-derived reference ML-KEM with n, eta, d_u, d_v parameterized) +
      Python analysis
    parameters: >-
      n=64, k=2, q=3329, eta1=eta2=3, d_u=10, d_v=3; 20 keys; 2^30 candidates per key; filter
      2^-10 and 2^-14
    procedure: >-
      1) Calibrate base DFR. 2) Freeze. 3) Generate candidates, compute both scores. 4) Query
      simulated oracle on filtered sets. 5) Compare failure rates with Poisson CIs.
  controls:
  - >-
    null: score using dv_err from an independent random ciphertext (shuffled), keeping its
    distribution but breaking the link - ratio must be 1
  - >-
    positive: planted extra additive known shift of +q/16 on the tested coordinate where the
    gain is analytically computable and must appear
  - 'A/A: norm_score arm with two encapsulation-RNG seed blocks'
  independent_variables:
  - score_rule
  - filter_fraction
  metrics:
    primary:
    - failure rate of filtered set
    secondary:
    - queries per failure
    - coordinate correlation
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: failure-rate ratio at 2^-10
    formula: tail(q/4 - shift)/tail(q/4) averaged over the filtered dv_err distribution
    source: derived before data from the CBD convolution
  scale_relevance:
    tier: toy
    justification: >-
      elevated-DFR reduced params; transfer assumption: score efficiency ratio is governed
      by the tail model checked in P2
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    - 2026101810
    - 2026101811
    - 2026101812
    - 2026101813
    - 2026101814
    - 2026101815
    - 2026101816
    - 2026101817
    - 2026101818
    - 2026101819
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 60
    maximum_memory_gb: 8
    maximum_runs: 200
  stopping_rules:
  - stop when each arm has >= 200 failures or 2^34 queries
  invalidation_rules:
  - timeout/crash/OOM is failed_infrastructure, never negative evidence
  - >-
    any instance whose recovered secret fails the independent check (A*s+e == t mod q, CBD
    support) is discarded and logged, never counted as a success
  - >-
    protocol, seeds and analysis script frozen and hashed in manifest.yaml before the first
    timed run; any change voids the batch
  - base DFR calibration outside [2^-16, 2^-12] voids the run
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    C1 failure-rate ratio >= 2 with CI excluding 1.3 (P1) and C2 model within 1.5x (P2), beyond
    AA1 noise floor.
  falsification_criterion: C1 ratio CI includes 1.3 or lies below it, or the shuffled null
    deviates from 1.
  decision_impact:
    on_positive: >-
      Update the failure-flank cost model with the compression-aware score and re-estimate
      query counts at FIPS parameters as a conditional.
    on_negative: >-
      Record that the compression rounding terms add no boosting leverage; keep norm-based
      scoring.
  variable_ledger:
    independent:
    - name: score_rule
      levels:
      - norm_score
      - full_known_score
      - shuffled_null
      - planted_shift_positive
    - name: filter_fraction
      levels:
      - 2^-10
      - 2^-14
    factors:
    - name: encaps_seed_block
      treatment: randomized
      value: A,B
      how: seed of encapsulation randomness
    - name: key_seed
      treatment: randomized
      value: '20'
      how: paired across arms
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - full_known_score
      - norm_score
      differs_in:
      - score_rule
      design: one_factor
    - id: C2
      arms:
      - full_known_score vs analytic tail model
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - norm_score block A
      - norm_score block B
      differs_in:
      - encaps_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-03bbdd.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-03bbdd.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - >-
    manifest.yaml with frozen protocol hash, tool versions (fpylll/G6K/Sage commit ids), host
    and seeds
  - raw-result.json with one row per (arm, instance, seed) including verification flag
  - analysis.json with effect sizes, bootstrap CIs and the AA noise floor
  - report.md plus graph (SVG/PNG) and PDF per the research-visuals skill
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-MLKEM-f55221/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-03bbdd.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
      is complete and runnable; no user re-approval is required.
