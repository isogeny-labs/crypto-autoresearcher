    - 2026101817
    - 2026101818
    - 2026101819
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 60
    maximum_memory_gb: 8
    maximum_runs: 80
  stopping_rules:
  - stop when q* CIs < 0.1
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - uncertified recovery excluded
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 shows P1 and C2 shows P2, beyond the AA1 noise floor.
  falsification_criterion: C2 measured shift has opposite sign to prediction or C1 shows no
    covolume excess.
  decision_impact:
    on_positive: >-
      Use the exact covolume ratio at p = 761 to place sntrup761 with a mechanism-based correction.
    on_negative: >-
      Ring-shape differences, if any, are not explained by rotation norms; look to correlations
      or modulus splitting.
  variable_ledger:
    independent:
    - name: ring_shape
      levels:
      - x^p-x-1
      - x^n+1
    - name: ring_degree
      levels:
      - '61'
      - '73'
      - '89'
      - '101'
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: secret_distribution
      treatment: fixed
      value: fixed-weight ternary w/p = 0.38
      how: manifest
    comparisons:
    - id: C1
      arms:
      - x^p-x-1
      - x^n+1
      differs_in:
      - ring_shape
      design: one_factor
    - id: C2
      arms:
      - predicted vs measured across p
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - x^p-x-1 block A
      - x^p-x-1 block B
