  title: Rotation norm growth and transition shift
  objective: Test whether non-isometric rotations explain any ring-shape shift.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: SageMath exact Gram determinants, fpylll, detector
    parameters: >-
      p in {61, 73, 89, 101}; comparison ring x^n + 1 with n in {64, 128} and dimension-matched
      interpolation; window ranks k in 1..p; 20 instances per q
    procedure: >-
      1. Compute rotation norms and covolumes for windows. 2. Predict Delta q*. 3. Sweep q
      on both rings. 4. Measure q*. 5. Compare.
  controls:
  - 'null: matched random lattice'
  - 'positive: anticyclic ring (no growth)'
  - 'A/A: x^p - x - 1 on two seed blocks'
  independent_variables:
  - ring_shape
  - ring_degree
  metrics:
    primary:
    - covolume ratio
    - Delta log2 q*
    secondary:
    - best window rank
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: Delta log2 q*
    formula: proportional to log covolume ratio per dimension
    source: covolume argument
  scale_relevance:
    tier: toy
    justification: p <= 101; covolume part exact at p = 761
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
