# EXPERIMENT CONTRACT -- EXP-MLKEM-35b326 (review_required, unapproved, zero runs).
experiment:
  id: EXP-MLKEM-35b326
  hypothesis_id: H-MLKEM-c86be6
  derived_from_idea: IDEA-20261018-d449ce
  question_id: RQ-MLKEM-003
  goal_id: null
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Profile residuals across ML-KEM and ML-DSA shapes
  objective: Whether one simulator calibration transfers across the two schemes' lattice shapes
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: fpylll, BKZ simulators (fpylll.tools.bkz_simulator and sharp re-implementation),
      NumPy
    parameters: >-
      dims {80,120,160}; beta {20,30,40,50}; 10 instances; shapes kem (q=3329, k=2 module
      d=dim/2) and dsa (q=8380417)
    procedure: 1. Generate. 2. BKZ. 3. Simulate. 4. Residuals. 5. Controls.
  controls:
  - >-
    null/negative: random q-ary lattices with uniform secret (no short planted vector) of
    same dims
  - >-
    positive: profile of a lattice with a planted short vector of known norm at beta large
    enough to find it (residual spike expected)
  - 'A/A: same shape and beta under two basis randomisations'
  independent_variables:
  - lattice_shape
  - simulator
  metrics:
    primary:
    - head residual gap
    - MAE reduction
    secondary:
    - tail residual
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: head gap
    formula: '>= 0.5 bits'
    source: q-vector plateau length grows with log q
  scale_relevance:
    tier: medium
    justification: dims <= 160; transfer by residual stability in beta
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40
    maximum_memory_gb: 16
    maximum_runs: 48
  stopping_rules:
  - stop cells exceeding 1 h
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - A/A MAE difference > 0.1 bits invalidates
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 head gap >= 0.5 bits and C2 reduction >= 30% (P1, P2), AA1 noise floor
  falsification_criterion: C1 gap < 0.2 bits or C2 reduction < 10%
  decision_impact:
    on_positive: Shape-specific residual corrections adopted in both ML-KEM and ML-DSA calibration
      lanes
    on_negative: A single shape-agnostic simulator calibration is used for both schemes
  variable_ledger:
    independent:
    - name: lattice_shape
      levels:
      - kem_shape
      - dsa_shape
      - uniform_null
    - name: simulator
      levels:
      - cn11
      - sharp
    factors:
    - name: basis_randomisation_seed
      treatment: randomized
      value: '2'
      how: unimodular pre-transform
    - name: fplll_float_type
      treatment: fixed
      value: long double
      how: frozen
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - kem_shape
      - dsa_shape
      differs_in:
      - lattice_shape
      design: one_factor
    - id: C2
      arms:
      - cn11
      - sharp
      differs_in:
      - simulator
      design: one_factor
    - id: AA1
      arms:
      - kem seed A
      - kem seed B
      differs_in:
      - basis_randomisation_seed
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-d449ce.yaml
    written_at: '2026-10-18'
    data_seen: []
