  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Domination grinding under two WOTS encodings at w in {4,16}
  objective: >-
    Whether the encoding choice changes the per-query one-time forgery probability at equal
    signature length, and whether exact counts predict it.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python 3 + NumPy, hashlib SHAKE256, exact DP counter in Python; harness writes per-cell
      JSON
    parameters: >-
      w in {4,16}; len1 in {8,16}; constant-sum target chosen so total chain count matches
      len1+len2 of the checksum arm; 512 revealed vectors per cell; 2^22 grinding queries
      per vector; q in {1,2,4}
    procedure: "REVIEW HOLD PR2404 entry 81: WOTS checksum antichain and minimum reachable chain index. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-SLHDSA-9d3ed1/specification.yaml. A corrected prospective procedure is required; the archived procedure is withdrawn from execution consideration."
  controls:
  - >-
    null: random revealed vectors drawn uniformly from the code space rather than from signatures
    (removes signature-induced checksum skew)
  - >-
    positive: planted encoding with the checksum removed, where domination probability must
    be orders of magnitude higher
  - 'A/A: the checksum arm run under two disjoint seed blocks'
  independent_variables:
  - encoding
  - signature_count_q
  metrics:
    primary:
    - worst-quartile domination probability ratio
    - log2 measured/exact per cell
    secondary:
    - median-quartile ratio
    - digit-marginal chi-square
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: p_dom ratio checksum/constant-sum, worst quartile, q=1
    formula: "REVIEW HOLD PR2404 entry 81: WOTS checksum antichain and minimum reachable chain index. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-SLHDSA-9d3ed1/specification.yaml. The archived prediction is not an accepted cost or correctness model."
    source: combinatorial count; KN-LIT-6265 encoding definition
  scale_relevance:
    tier: toy
    justification: >-
      w and len1 reduced; transfer assumption: ratio is a property of the encoding counts,
      not of n
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    independent_instances: 3
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 4
    maximum_memory_gb: 4
    maximum_runs: 24
  stopping_rules:
  - stop when all cells reach relative SE below 5%
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - a cell whose digit marginal fails chi-square at p<0.001 is invalid
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: "REVIEW HOLD PR2404 entry 81: WOTS checksum antichain and minimum reachable chain index. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-SLHDSA-9d3ed1/specification.yaml. No success verdict is defined until a corrected prospective contract is independently reviewed."
  falsification_criterion: "REVIEW HOLD PR2404 entry 81: WOTS checksum antichain and minimum reachable chain index. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-SLHDSA-9d3ed1/specification.yaml. No hypothesis verdict follows from this static protocol correction."
  decision_impact:
    on_positive: "Blocked pending corrected prospective design and Coordinator approval; retain all hypothesis and direction statuses."
    on_negative: "Blocked pending corrected prospective design and Coordinator approval; a capped or undefined comparison is not mathematical negative evidence."
  variable_ledger:
