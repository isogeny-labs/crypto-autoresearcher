  limitations:
    - >-
      One confirmatory pass on fixed seeds; no replication on fresh instances; no
      growth arm (two powered cells, three needed); C16 underpowered; FAM is
      exhaustive in the band. A coupling growing like N^eps with eps above about
      0.13 and below 0.04 percent at 2^24 is unconstrained at 2^52 (RT-O4).
    - >-
      The planted-base gate numbers were seen in a pre-freeze smoke test on the
      same seeds, so passing it is not new evidence of sensitivity; the ladder has
      one rung, with thin margins at C16 (7 of 8) and C20 (0.156 against 0.173
      percent).
    - >-
      The superseding analysis is a non-official derived analysis, not a run with
      its own run id and execution receipt, and its reading of D1 and D2 rests on
      replacing two constants in-process. It was reviewed by no independent party.
    - >-
      Toy sizes only; the CM structure, other bases, models, charts, the signed
      convention and the floor curve are untested; coverage equal to a random base
      does not imply equal cost.

