  scoped_claim: >-
    No coverage difference between the small-x liftable-window factor base and a
    matched random base exceeding the predefined resolution delta = 0.5 percent
    was observed over the tested instances (107 prime-order curves with
    2^14 < p <= 2^25: 27 FAM members of p = 5t^2 + 19t + 19, 40 other D = -19
    crater-type curves, 40 random curves), base (the first ceil((6N)^(1/3))
    abscissae with f(x) a nonzero square, one canonical-sign point each, integral
    Weierstrass chart), counting convention (m = 3, unsigned multisets, targets
    uniform over Z_N, exact counting, 200 matched random bases per member) and
    budget (one pass, seeds 7001 to 7010). At C24 every 95 percent interval of the
    mean coverage ratio minus 1 lies inside +-0.04 percent (13 of 13 FAM members in
    the band); at C20, powered under the contract text, inside [-0.074, +0.057]
    percent; C16 is underpowered and enters no conclusion. This is a statement at
    resolution 0.5 percent for the stated arms, cells, chart, base and convention.
    It is not a statement that no effect exists, that no factor base can beat a
    random one, that the CM structure carries no usable coupling, or anything about
    cost. Evidence strength preliminary; claim tier toy. No ECDLP speed, rho
    comparison or pair-46-scale claim.

  corrected_reading_of_decision_impact: >-
    For all later citations the contract's decision_impact.on_positive is read as
    three separately sourced sentences. (i) Proved: sum_r c(r) = binomial(B+2,3)
    and coverage <= min(1, mu), so the coverage ratio to any baseline of positive
    coverage c0 is at most min(1, mu)/c0; with the Poisson baseline of heuristic H2
    this is 1.582 at mu = 1, a model-conditional estimate (CORR-20261019-a89bfa).
    (ii) Measured here: the stated mean-coverage contrasts were unresolved at
    resolution 0.5 percent (+-0.04 percent intervals at C24), unsigned m = 3, at
    the tested scope; full distributional exchangeability was not established. (iii) Not measured: decomposition cost, relation rank, linear algebra,
    CM-coupled bases, the signed convention, growth. The phrase 'candidate for
    scoped retirement of this channel' is not acted on; 'channel' means the small-x
    window base only.

