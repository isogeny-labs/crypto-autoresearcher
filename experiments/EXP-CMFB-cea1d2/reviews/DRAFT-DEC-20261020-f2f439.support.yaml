  what_changed_since_DEC_20261019_f33f3e:
    - >-
      Zero-compute superseding analysis, experiments/EXP-CMFB-cea1d2/reports/
      superseding-analysis-20261019/ (commit bfab487f36; report.pdf,
      superseding_result.json, fig_superseding.svg). The frozen analyze.py
      reproduces the recorded t8 exactly (0 differing values outside timings and
      peak_rss_bytes). With the contract-text constants (no MDE inflation
      factor; I10 against 1.4/sqrt(N)): powered cells {C20, C24}; Holm family of
      6 tests, FAM C24 0.1872 and N-B C24 0.3972, nothing rejected; I10 clean in
      9 of 9 cells (0.815 to 0.971); classification NULL_AT_RESOLUTION, same as
      recorded; growth not assessable. This is exactly the expectation recorded in
      DEC-20261019-f33f3e action 1, so the I9 determination there is not reopened.
    - >-
      CORR-20261019-a89bfa (owner review P2): the 1.582 ratio is a
      model-conditional estimate under heuristic H2 (Poisson occupancy), not a
      universal theorem. The exact facts are the identity sum_r c(r) =
      binomial(B+2,3) and the bound coverage <= min(1, mu), giving
      min(1, mu)/c0 for a specified baseline coverage c0.
    - >-
      The eight run manifests' missing result.certificate kind was repaired
      additively by the owner (experiments/EXP-CMFB-cea1d2/supersessions/,
      commit 2f1aef00a5); tools/validate_ledger.py reports no CMFB error on that
      head. No result, count or classification changed.

  rationale:
    - >-
      Why `support` is now defensible. The hypothesis is a null prediction (H1).
      The frozen rule gives NULL_AT_RESOLUTION, and it gives it under both
      powered-cell readings, now archived rather than only argued (superseding
      analysis). The instrument could have failed: the planted B+1 base was
      recovered in 7 of 8, 8 of 8 and 8 of 8 curves at +3.0, +1.2 and +0.5
      percent. At C24 every 95 percent interval is inside +-0.04 percent, 13
      times finer than delta; at C20 inside [-0.074, +0.057] percent. The
      independent recount (VAL-20261019-1b97f5, 26,331 of 26,331 bases) and the
      from-scratch rebuild leave no doubt about the counts. The four reasons
      DEC-20261019-f33f3e gave for withholding `support` are met as follows:
      (1) the claim is re-scoped below to what was measured, replacing the
      contract's 'constant-only, retire the channel'; (2) the archived analysis
      applying the contract text now exists and agrees; (3) the I9 judgment is no
      longer load-bearing because the contract-text analysis gives the same
      classification; (4) item 4, a single unreplicated pass, is NOT removed and
      is carried into the strength: it is why this is `support` at strength
      preliminary and not at replicated or strong.
    - >-
      Why not `replicate`. The rule that surprising or high-impact first
      observations take `replicate` does not apply: the outcome is the null the
      contract predicted, no ECDLP claim changes, nothing in it is surprising, and
      the only re-drawable arms (N-A, N-B) show nothing that needs a second look.
      The FAM negative sign (T below zero in all three cells; C24 -0.022 percent,
      Holm 0.094, 0.187 under the contract text) is not detected under the
      pre-registered rule, has about a 25 percent chance of being the minimum of
      nine tests under the null, and points the wrong way for an advantage. It is
      kept as an exploratory descriptive row. A fresh population (C28) is the only
      way to test it and is not commissioned.
    - >-
      What the proposed scoped support would mean. It concerns the measured
      mean-coverage contrast, without certifying full exchangeability, for this
      base, these arms, unsigned m = 3, targets uniform over Z_N, exact counting,
      200 matched random bases per member, 2^14 < p <= 2^25. It does not certify
      that no base can beat a random one (a Sidon-type base reaches +10.7 percent,
      EV-FBG-001). It does not certify anything about the CM structure: the
      tested base selects abscissae by the integer size of x and never uses the
      endomorphism, the isogeny, the canonical lift or the floor curve. It says
      nothing about the signed x-only convention, decomposition cost, relation
      rank, linear algebra, growth in N or the pair p = 5947698030651343.
    - >-
      Heuristics named, as the review rules require for a heuristic-dependent
      result. H1 concerns exchangeability, while this run measures only the stated
      mean-coverage contrasts at finite resolution; it does not prove H1. H2
      (Poisson occupancy c0 = 1 - exp(-mu) and null sd 1.4/sqrt(N)) is used only
      for the resolution derivation and the planted known effect, not for the
      measured ratios, which are taken against the measured matched random
      bases. At the tested sizes the planted excess agrees with the Poisson-law
      value within tolerance (C24 1.00525 against 1.00521), but the planted
      increment is about 12 percent below it at C16 and C20, so H2 is consistent
      with, not proved by, this run. H3 (Bateman-Horn counts) held within a factor
      2 and only affects power. Validation experiment for all three:
      EXP-CMFB-cea1d2. The coverage ratio ceiling 1.582 rests on H2 and is
      conditional (CORR-20261019-a89bfa); this decision does not use it as a
      theorem and does not rest on it.
    - >-
      Success criterion (CLAUDE.md). Measured improvement of the small-x base over
      the current index-calculus baseline (a random factor base): none. The reported intervals for the mean coverage ratio lie within 0.04 percent
      at C24 and 0.074 percent at C20; this does not prove exact equality.
      The outcome is neither an improvement nor a regression. Distance to matched
      Pollard rho: no measured value exists. The red team's analytic, unmeasured
      estimate of index calculus over rho (88 to 3400 at N = 2^24 across the 0,
      0.1 and 1 GAE band, order holding) is context only; it is not adopted, no
      cross-method ranking is made, and AGENTS.md section 5a is not triggered.
    - >-
      Roadmap. This result cannot by itself yield an exponent; it removes one
      cheap candidate (a small-x window) as a coverage lever at toy size. It is
      not a reason to spend further effort on the window family. The one
      experiment that touches the structure the question names (RC-2, a CM-coupled
      base) remains a commissioned design and is not approved here.

