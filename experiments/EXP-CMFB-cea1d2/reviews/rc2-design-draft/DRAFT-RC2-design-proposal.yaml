# =============================================================================
# DRAFT, NOT AN IDEA RECORD AND NOT APPROVED.
#
# Design proposal for RC-2 of RT-20261019-520123 (a CM-coupled factor base on the
# same coverage instrument), written for DEC-20261019-f33f3e next action 3 ("commission
# the DESIGN, not the approval"). It files nothing under ledger/, mints no IDEA or
# H or EXP id, and changes no status. The route is /propose-ideas (which would turn
# this into an IDEA-* record under RQ-CMFB-33610e) then /design-experiment. A
# contract is approved only when it has a launcher and is runnable in the turn it
# is approved (AGENTS.md "Approval is bounded by execution").
#
# THE MAIN CONTENT IS A CORRECTION TO THE SKETCH IT IMPLEMENTS. A small exploratory
# pilot (pilot/, disclosed below) raises a power concern about the red team's
# RC-2 sketch (13 FAM members at C24, prediction 1.000 +- 0.0004). Its retained
# rows stop at 2^21; extending their variance to C24 is an unverified assumption.
# The redesign remains subject to the input-domain and sampling holds below.
# =============================================================================
rc2_design_proposal:
  working_title: >-
    CM-coupled geometric base on Z_N: does the norm-5 eigenvalue of the degree-5
    endomorphism of a D = -19 curve change exact m = 3 coverage, against a generic
    geometric base and a matched random base, at C20, C22 and C24?
  under_question: RQ-CMFB-33610e
  follows: [EXP-CMFB-cea1d2, DEC-20261019-f33f3e, EV-CMFB-e3d1ec, CORR-20261019-a89bfa]
  class: measurement
  author_status: draft by the session that ran EXP-CMFB-cea1d2; review corrections pending protocol design
  review_status: review_required
  execution_authorized: false
  review_qualification: docs/reviews/pr2418-draft-correction/qualification.md
  approval_blockers:
    - Require B distinct sign classes in every matched arm; order above B alone is insufficient.
    - Match the CM and generic arms on the same eligible moduli; freeze root selection and sampling.
    - Treat randomized signs as a proxy until a curve chart mapping is validated.
    - Re-estimate power prospectively; the pilot does not establish C24 variance or a scaling law.

  why_this_experiment:
    - >-
      The one object EXP-CMFB-cea1d2 did not touch is the structure the question
      names. Its small-x base selects abscissae by the integer size of x and never
      uses the endomorphism, the isogeny, the canonical lift or the floor curve
      (EV-CMFB-e3d1ec, analysis.md Inference 6). A scoped `support` for that base
      (DRAFT-DEC-20261020-f2f439) retires nothing about the CM channel.
    - >-
      For a crater-type curve (End = Z[w], w^2 - w + 5 = 0, norm 5) of prime order
      N, w acts on G = E(F_p) as a scalar lambda with lambda^2 - lambda + 5 = 0
      mod N (for family members lambda = 2/v mod N; H-CMFB-7d4e1a part A states it,
      and the red team checked lambda^2 - lambda + 5 = 0 on one member, t = 1211).
      So an arc of the w-orbit {Q, w(Q), w^2(Q), ...} of B points has labels
      l, l*lambda, l*lambda^2, ..., a geometric progression in Z_N with a ratio of
      algebraic norm 5. Its exact m = 3 coverage is the natural CM-coupled
      measurement.

  what_the_pilot_changed:
    pilot_disclosure: >-
      Exploratory, run in this session after the frozen experiment, before any
      contract exists: pilot/rc2_pilot.py and pilot/rc2_pilot2.py, outputs in
      pilot/*.log, seeds fixed in the files, re-run once to confirm they reproduce.
      Primes N at about 2^17, 2^19 and 2^21, B = ceil((6N)^(1/3)) as in the frozen
      count.py, 8 to 12 primes per row, 30 to 40 matched random bases per prime.
      Coverage computed by the frozen count.count_coverage. These numbers were seen
      before any freeze and must be listed under pre_freeze_disclosure of any
      contract that follows. They are not evidence about the question.
    observations:
      - >-
        Per-member spread of T = coverage / mean random coverage - 1 for a
        geometric base is 0.7 to 1.7 percent (exact labels) and 0.4 to 1.0 percent
        with random signs, against a random-versus-random spread of 0.09 to 0.33
        percent (compared with the heuristic 1.4/sqrt(N)). These few rows
        do not establish a scaling law or the variance at C24.
      - >-
        The inflation is generic to the geometric structure, not CM-specific:
        ratios of norm 5 (x^2 - x + 5), norm 7, norm 11 and a random ratio all give
        sd 0.7 to 1.3 percent at 2^19 and 2^21 (pilot/rc2_pilot2.log). Means are
        within noise of zero (se 0.2 to 0.4 percent with n = 12).
      - >-
        A plausible mechanism (not tested): the multiset sums of a geometric
        progression are shift-invariant, so each additive coincidence reproduces
        about B/3 times; coincidences arrive in clusters and the count's variance
        grows by about the cluster size, a factor of order sqrt(B/3), about 10.
    consequences:
      - >-
        The red team's RC-2 sketch (13 FAM members at C24, 200 matched random bases,
        predicted ratio 1.000 +- 0.0004) has MDE = 3.61 x sd / sqrt(n) = 3.61 x 0.9
        / 3.6 = 0.9 percent, above the declared resolution of 0.5 percent. This calculation assumes the pilot spread persists at C24; it does not
        demonstrate the actual power there. The
        +-0.0004 prediction in DEC-20261019-f33f3e action 3 (marked there as
        unverified) should not be carried into a contract.
      - >-
        The red team's norm argument (chain elements collision-free only up to
        about log_5(N/36)) concerns about 8 to 20 elements out of B in the
        hundreds; it does not bear on the power or on the prediction for the whole
        arc.
      - >-
        Coverage of the base depends only on (N, labels). Members therefore need not
        be curves: any prime N with -19 a square mod N has lambda, and the number of
        members per cell is limited by compute, not by Bateman-Horn counts. This
        also makes a growth reading possible (three powered cells), which the first
        experiment could not give.

  design:
    instrument: >-
      Reuse the frozen count.py (count_coverage, histogram, base_size, random_labels)
      and the pattern of driver.py, check.py and analyze.py by copy into the new
      experiment directory, not by edit. New code only: prime sampling with a
      required root of x^2 - x + q, the geometric label generator, arm definitions.
    cells: >-
      C20, C22, C24 (2^18 < p <= 2^20 style bands, to be fixed in the contract;
      the first experiment's bands were C16 2^14..2^18, C20 2^18..2^22, C24
      2^22..2^25). Three powered cells make a slope assessable.
    members: >-
      Primes N drawn log-uniformly in the cell band, odd, with the arm's quadratic
      having a root mod N. Match A_cm5 and C_generic on the same sampled N,
      eligibility filters and sign convention; fix whether the other-norm contrasts
      use their own matched sets or a common splitting-prime intersection. Freeze
      root choice and rejection sampling before approval. Every arm must contain
      B distinct nonzero classes {+-l}; multiplicative order larger than B alone
      does not ensure this. Target n = 800
      per arm per cell (MDE about 0.13 percent at sd 1 percent; n = 3200 would reach
      about 0.06 percent). The contract fixes n from a power rule using the
      measured sd of the arm, with the pilot sd as a placeholder only.
    arms:
      A_cm5:
        ratio: root of x^2 - x + 5 mod N (norm 5, the D = -19 endomorphism w)
        role: the CM-coupled base
      B_other_norm_cm:
        ratio: roots of x^2 - x + 7 and x^2 - x + 11 mod N (other quadratic orders)
        role: controls separating the specific norm 5 / D = -19 from any small-norm quadratic ratio
      C_generic:
        ratio: uniformly random element of order above B
        role: control for the geometric-progression structure itself (shift-invariance)
      D_matched_random:
        ratio: none; B distinct classes with independent random signs (random_labels)
        role: the baseline of the instrument and of the first experiment
    sign_variants:
      S0_exact: labels exactly l*ratio^j (best case for structure; unsigned)
      S1_randomized_sign_proxy: independent pseudo-random signs on B distinct classes; an abstract proxy, not a proved model of a curve chart's deterministic canonical-sign choices. Run as a second sub-arm on the same members only after the protocol fixes this limitation.
      S2_signed: deferred (see folded_in).
    primary_contrasts:
      - T_A - T_C  (is the CM ratio different from a generic geometric ratio; isolates CM)
      - T_A against 0 at resolution delta = 0.5 percent and a secondary 0.15 percent
      - slope of T_A, T_B, T_C in log2 N over the three cells
    baseline_per_member: >-
      K matched random bases per member (K = 20 proposed, not 200: the random mean
      coverage has sd about 0.1 percent per draw, so K = 20 adds about 0.02 percent
      to T; the contract should confirm by comparing K = 20 with K = 200 on a
      subsample). T for a member is its coverage divided by the mean of its K
      random-base coverages, minus 1, as in EXP-CMFB-cea1d2.
    instrument_checks:
      - M0 exact identity, sum_r c(r) = binom(B+2,3), on every counted base (void on failure).
      - Distinct nonzero labels and B distinct sign classes, checked directly and recorded per member. Require len({min(l, N-l) for l in labels}) == B; order above B alone can admit opposite labels.
      - >-
        Planted-base sensitivity re-calibrated at the geometric spread: a planted
        B+1 base against its Poisson-law known excess, and a graded dose-response
        with k planted additive quadruples in {0, 5, 20, 80} (RC-5), so the range
        between 0.04 and 0.5 percent has more than one rung. The first experiment's
        ladder had one rung.
      - >-
        Instrument self-test that the geometric arm reproduces a hand-counted case
        at small N by literal itertools (count.brute_force_counts), as in the
        first experiment.

  pre_registered_prediction_to_fix_in_the_contract:
    note: >-
      The prior is a null. Nothing in the pilot shows a departure, and the CM
      specific part of the structure (small-norm algebraic coincidences) touches
      only about log_5(N) of B elements. The contract should state the null as
      T_A - T_C within +-0.15 percent and T_A within +-0.15 percent of 0, and say
      what each outcome means. The numbers are placeholders to be fixed from a
      power analysis on a pilot drawn with different seeds from the freeze seeds.
    outcomes:
      null: >-
        T_A - T_C inside +-0.15 percent in every powered cell and no detected
        slope: the named mean-coverage contrasts are unresolved at the stated
        resolution on the sampled moduli. This does not establish full
        distributional exchangeability. Shift-orbit clustering remains an untested
        explanation, so a null cannot establish it as the cause.
      detected_excess: >-
        T_A - T_C above +0.15 percent with Holm p below 0.05 in at least two cells
        and a non-negative slope: the first coverage lead coupled to the CM
        structure on the matched sampled moduli. CORR-20261019-a89bfa gives
        the per-instance bound min(1, mu)/c0 for positive baseline coverage c0.
        A uniform constant bound across growing N additionally requires a
        baseline lower bound; no exponent conclusion follows from these cells.
        Replication with new seeds is required before any claim.
      detected_deficit: >-
        T_A - T_C below -0.15 percent: more coincidences than a generic geometric
        base; reported as an obstruction, not chased.

  cost:
    unit: >-
      One coverage pass costs about 14 ns per triple (measured tau, 13.3 to 14.9
      ns in EXP-CMFB-cea1d2), and binom(B+2,3) is about N, so about 14 ns x N.
    per_member: 'one geometric base plus K = 20 random bases = 21 passes, about 21 x 14 ns x N; 4 geometric arms (A, B twice, C) x n = 800 members per cell, one sign variant'
    totals_estimate:   # n = 800 per arm, 4 geometric arms and K = 20, one sign variant; S1 roughly doubles it
      C20_N_about_2_pow_20: about 0.3 core-hours
      C22: about 1.3 core-hours
      C24: about 5 core-hours
      wall_on_4_cores: about 1.6 hours
    memory: >-
      About 0.8 GB per process at C24 (the first experiment measured 755 to 819 MB
      peak), so 4 workers fit in 16 GB.
    caveat: >-
      The pilot reached 2^21 only; the spread at 2^24 and therefore n are
      extrapolated. The contract should include a short measured-sd gate before
      the main cells.

  stage_2_conditional:
    description: >-
      Realise w on real curves. For 3 to 5 FAM and N-A members at C20, build the
      explicit degree-5 endomorphism (Velu from the F_p-rational 5-isogeny kernel of
      the crater curve), check [lambda]Q = w(Q) and that the orbit labels equal the
      abstract geometric progression, and recount coverage of the actual point set.
      By construction the coverage must equal the abstract one; this is a model
      check, not a new measurement.
    when: >-
      Only if stage 1 finds a departure, or if the Coordinator wants the claim
      stated for real curves. Medium implementation cost (explicit isogeny),
      negligible compute.

  folded_in_or_not:
    RC_3_signed_convention: >-
      Not folded in. With signed sums the multiplicity mean is about eight times
      larger at this B, random coverage is about 0.9997 and the headroom is about
      0.03 percent (RT-O7), so there is almost nothing to measure at B = (6N)^(1/3).
      Halving B to keep mu = 1 changes the object. A separate small contract if
      wanted; low priority.
    RC_5_dose_response: >-
      Folded in as an instrument check (above), because the first experiment's
      sensitivity ladder had one rung and this arm has a larger spread.
    RC_4_C28_growth_cell: >-
      Superseded as a growth device: with members not tied to a curve family, three
      cells give a slope. It remains the only fresh-population test of the FAM
      negative sign in the first experiment and is still not commissioned.

  overlap_check:
    H-CMFB-7d4e1a: >-
      Tests an arc of w-orbit points for the m = 2 BSGS-equivalence of the search
      cost, not m = 3 coverage; shares the identity w = [lambda]. Reuse its
      construction of lambda; do not duplicate its observable.
    H-CMFB-c5e29b: >-
      Box-count dispersion of joint x-y windows; different base and observable.
    EXP-CMFB-cea1d2: >-
      Same instrument (frozen count.py, matched random baseline, M0), different
      base. The new contract must copy, not edit, its implementation.

  what_this_cannot_show:
    - >-
      Anything about decomposition cost, relation rank, linear algebra or an
      exponent: coverage only, toy sizes only, no transfer to the 53-bit pair.
      A coverage lead has the per-instance bound min(1, mu)/c0 when c0 > 0;
      a uniform constant bound requires a separate baseline lower bound across N.
      A null is a statement at resolution about the stated mean-coverage contrasts only.
    - >-
      The real attraction of a w-orbit base (cheap point generation by a degree-5
      map instead of scalar multiplication) is a cost question, outside this
      experiment and the subject of H-CMFB-7d4e1a.

  contract_requirements_to_remember:   # for /design-experiment
    - decision_impact.on_positive and on_negative filled (the validator requires them for specifications designed on or after 2026-10-07)
    - pre_freeze_disclosure listing the pilot in pilot/ and its numbers
    - "run manifests written with result.certificate (kind none and a scoped reason) from the start; the first experiment's manifests lacked it and needed an additive repair"
    - a launcher runnable in the turn of approval; new seeds; copy not edit of the frozen implementation
    - the review round to be planned before any reviewer runs (review_plan first), with TASK cards for reviewers, to avoid the independence failures recorded for EXP-CMFB-cea1d2
    - section 5a does not apply (no cross-method comparison)

  success_criterion_note: >-
    Report distance remaining, not pass or fail. No improvement over the
    index-calculus baseline is expected; the value of the experiment is turning an
    untested channel into a measured null (with a named obstruction) or a measured
    lead. Relabelling is not an improvement.

  not_done_here:
    - no IDEA, hypothesis or experiment record was created and no id minted
    - no frozen file of EXP-CMFB-cea1d2 was touched
    - the pilot is exploratory and was not independently reviewed
    - the shift-orbit mechanism for the spread is a hypothesis, not tested
    - the explicit degree-5 endomorphism was not constructed
