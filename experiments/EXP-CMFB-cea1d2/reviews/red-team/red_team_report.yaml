      - docs/inventor-protocol.md sections 3 and 4

  claim_under_review: >-
    The recorded mechanical classification NULL_AT_RESOLUTION (RUN-CMFB-2010d3,
    t8), with C24 the only powered cell (FAM 13, N-A 16, N-B 16), read through
    specification decision_impact.on_positive as "the coverage and
    scan-efficiency channels of the small-x base for crater-type D=-19 members
    ... are constant-only (no effect) at toy size ... candidate for scoped
    retirement of this channel for RQ-CMFB-33610e", together with the report's
    framing of the I10 flag and of C20 as unpowered.

  # ---------------------------------------------------------------------------
  # Ranked objections. Severity words: record_defect (the recorded numbers or
  # text do not follow the frozen contract), scoping (the reading is broader
  # than the measurement), noted (does not change the reading).
  # ---------------------------------------------------------------------------
  objections:
    - id: RT-O1
      rank: 1
      severity: scoping
      title: >-
        The metric cannot answer the question the ledger asks ("more than a
        constant"); the answer "no" is a theorem independent of this run, so
        the null adds only "small-x window is exchangeable with random".
      evidence:
        - >-
          For every base of size B at every N, the coverage ratio against a
          matched random base is at most min(1,mu)/(1-exp(-mu)), maximised at
          mu = 1 where it equals 1.582 (H-CMFB-9b2eed interpretation_limits;
          EV-FBG-001 lines 95-101; specification what_does_not_follow, "cost
          gain by 1.582"). The experiment runs at B = ceil((6N)^(1/3)),
          i.e. mu = 1.00 to 1.08, the single most favourable operating point
          for a structured base. So no cell, at any size, could have shown an
          advantage "exceeding a constant"; the largest conceivable value is
          +58 percent.
        - >-
          RQ-CMFB-33610e asks about "advantage over a matched random base",
          decision_target "identify one whose advantage ... grows with N".
          H-CMFB-9b2eed narrows this to exact m=3 coverage; the experiment
          narrows it again to one base definition. "Constant-only" is proved by
          the ceiling, not measured by the run. The run measured exchangeability
          (value in the obstruction block below).
        - >-
          EV-FBG-001 already showed a Bose-Chowla B_3 base at coverage ratio
          1.1071 and a whole-group greedy at 1.0269, i.e. coverage headroom is
          free for designed bases; the small-x result says only that the
          small-x window is not one of them.
      proves_too_much_control: >-
        Run the step "coverage ratio equals 1 within 0.04 percent, therefore no
        factor-base advantage" unchanged on a known-false object: the
        Gaudry-Diem extension-field base (x in a subfield). EV-FBG-001 lines
        130-133 state that its 1/n! decomposition probability IS the
        conservation mean, i.e. coverage ratio 1 against a matched random
        base, yet the method beats generic bounds because the advantage lives
        in the solve. The argument goes through where its conclusion is false,
        so coverage-null cannot support any cost statement. The step that
        fails is the passage from "same multiset-sum distribution" to "same
        decomposition cost".
      narrowest_fix: >-
        Split on_positive into three separately sourced sentences: (i)
        constant-only for coverage is a theorem (ceiling 1.582), not a result
        of this run; (ii) measured: the small-x window base is exchangeable
        with a matched random base at the stated resolution; (iii) cost of
        finding decompositions, rank, and linear algebra: not measured.

    - id: RT-O2
      rank: 2
      severity: record_defect
      title: >-
        Stale constant in the analysis code (VAR_INFLATION = 3) contradicts the
        contract's "no inflation factor" and sets the powered-cell set; the
        checker repeats it, and the run report does not surface it.
      evidence:
        - >-
          specification.yaml lines 470-474 (resolution_delta.derivation): "MDE
          computed from the MEASURED per-member null standard deviations, MDE =
          3.61 * rms_j sd_j / sqrt(n) with no inflation factor, is <= 0.25
          percent (delta / 2) for EVERY arm". Lines 162-173 repeat the formula
          without a factor. Lines 463-465 give the contract's own pre-run
          expectation for C20: "MDE 0.14 to 0.18 percent".
        - >-
          analyze.py line 44 VAR_INFLATION = 3.0 and lines 218-220
          mde() = Z_MDE * sqrt(3.0) * 1.0025 * sigma / sqrt(n); check.py line
          561 recomputes cell_pow with the same 1.0025 * sqrt(3) * 3.61;
          test_cmfb.py lines 417-418 pin it ("3-fold variance"). The factor is
          not among the constants the contract lists as literals of the script
          (specification lines 571-577). Because check.py shares the factor,
          the I9 independent recomputation cannot see the departure.
        - >-
          Recomputed from the raw per-member records (members[].member_seen,
          random_seen[200], N; sd over the 200 random coverages divided by
          their mean; rms over members): contract MDE (percent) C20 FAM 0.140,
          N-A 0.154, N-B 0.141; recorded (code) MDE 0.243, 0.268, 0.245 (my
          recomputation reproduces the recorded 0.2429 / 0.2676 / 0.2446 to
          four digits, so the ratio is exactly sqrt(3)*1.0025 = 1.736). All
          three contract values are <= 0.25, n = 10 / 16 / 16 >= 8 and M_20 =
          10 >= 8, so by the contract text C20 is POWERED. C16 stays
          underpowered (contract MDE 0.76 / 0.76 / 0.89). C24 is powered either
          way (0.037 / 0.037 / 0.033 contract; 0.065 / 0.063 / 0.057 code).
        - >-
          Consequence, computed from recorded randomization p-values: powered
          cells {C24} become {C20, C24}; the Holm family goes from 3 to 6
          tests; FAM C24 Holm-adjusted p goes 0.094 to 0.187, N-B C24 0.159 to
          0.394, nothing rejects; all six arm-cell 95 percent intervals are
          inside +-0.5 percent. The mechanical classification does not change
          (NULL_AT_RESOLUTION), growth stays not assessable (2 < 3 powered
          cells), but the evidential base doubles and the recorded
          powered_cells, cells.C20.powered, mde_ok and the sentence in
          report.typ line 39 ("C20 failed the MDE condition because the N-A
          arm's MDE (0.268 percent) exceeded 0.25 percent") describe a
          quantity the contract does not define.
        - >-
          The record already carries a hint: RUN-CMFB-2010d3 raw-result
          pooling.powered = {C16: false, C20: true, C24: true} (pre-measurement
          member-count rule) next to cells.C20.powered = false.
      narrowest_fix: >-
        Do not edit frozen code or the recorded t8 result. The Coordinator
        records a superseding analysis (new record id, same raw results, MDE
        per contract text, reference 1.4/sqrt(N)) and states which of the two
        governs the classification; the reviewer sees both. Until then quote
        "C24 powered (code), C20 powered under the contract text".

    - id: RT-O3
      rank: 3
      severity: scoping
      title: >-
        The tested base does not touch the CM structure, so FAM vs N-A vs N-B
        contrasts could only be non-null through an accident of f(x) mod p; the
        result retires one base family, not the CM channels.
      evidence:
        - >-
          small_x_base (specification lines 199-204) selects abscissae by the
          integer size of x in the integral chart, for all three arms alike.
          The group-law coupling a window of integers can have is through
          rational points of the chart. I enumerated integral points of the
          d = 1 chart y^2 = x^3 - 152x + 722 for -12 <= x < 200000: exactly
          one, (7, 1). So the FAM base contains at most one point with
          Q-structure, and the CM data (b = a + 2, conductor v, degree-5 w) are
          never used to build or select a base element.
        - >-
          The CM structure is explicit and cheap at toy size. For FAM,
          pi = v*w - 1 gives, on G = ker(pi - 1), w = lambda with lambda =
          2/v mod N. Checked on the first C24 member (t = 1211, v = 1213, N =
          7354423): lambda^2 - lambda + 5 = 0 mod N holds, and ord(lambda) =
          (N-1)/54 = 136193, far above B = 354. A w-orbit/chain base is
          therefore well defined and its labels are l * lambda^j with no extra
          discrete-log work. It is in the RQ scope.methods list ("endomorphism-
          chain factor bases, isogeny pullback bases, canonical-lift (Xedni)
          relations", "small-x in Montgomery / Edwards / Hessian models; joint
          x-y windows") and none of them was run. The floor curve was not
          constructed (specification lines 73-75).
        - >-
          The family is self-similar (v/sqrt(N) -> 1/sqrt(5), exact relation
          b = a + 2 at every size), so an N-independent relative coupling would
          be visible at toy size, and it is bounded at about 0.04 percent. A
          coupling that scales with v or with B is not touched.
      narrowest_fix: >-
        Name the retired object "small-x Weierstrass-window base, m = 3,
        unsigned canonical-sign multisets, on D = -19 crater-type curves (E_0
        charts and twists)" everywhere the word "channel" appears.

    - id: RT-O4
      rank: 4
      severity: noted
      title: >-
        The null is informative at C24, not underpowered: what n = 13 could
        have seen, in statistical and in structural units; and what it cannot
        see.
      evidence:
        - >-
          FAM C24: T = -0.0224 percent; sd of T from the 200 random bases per
          member 0.0104 percent (recomputed; z = -2.16, matches recorded
          randomization p 0.031); 95 percent half-width about 0.02 percent;
          80 percent power at Holm alpha/9: 0.037 percent (contract) or 0.065
          percent (recorded). The declared delta is 0.5 percent, 8 to 13 times
          coarser than what the data resolve at C24; the report's grey band is
          25 times the C24 interval width.
        - >-
          Structural translation (my analysis, unverified by the producer):
          coverage variance is dominated by fluctuation in the number of pair-
          sum coincidences l_a + l_b = l_c + l_d, which is about P^2/(2N) with P
          = B(B+1)/2 (about 270 to 440 per member at C24, mean about 330, sd
          about 18). Each extra
          coincidence changes the coverage ratio by about -e^-mu/(1-e^-mu) *
          B/N = -0.58 B/N (about -0.002 percent at C24). Hence sigma_rel =
          0.58 * B^3 / (2 sqrt(2) N^(3/2)) = 1.235/sqrt(N) at mu = 1, against
          the contract's 1.4 and the measured 1.20 (N < 2^18) to 1.33 (N near
          2^24). Calibration by simulation at N = 4194301 (B = 294, mu = 1.02,
          own counter, not the repository's): 30 random bases give sd*sqrt(N) =
          1.268; planting k disjoint additive quadruples l_d = l_a + l_b - l_c
          gives ratio-1 = -0.051 / -0.143 / -0.233 percent for k = 10 / 30 / 60
          (+-0.014 / 0.020 / 0.019) against the formula -0.041 / -0.122 /
          -0.245. So the C24 bound |T| < 0.04 percent excludes a systematic
          surplus or deficit of more than about 20 additive pair-sum
          coincidences (about 6 percent of the random expectation) per member,
          and the declared delta = 0.5 percent corresponds to about 240.
        - >-
          What it cannot see: (a) growth, because the powered window spans 3
          bits at N = 2^22 to 2^25 (11 bits across all cells) and FAM is an
          exhaustive population (4 / 10 / 13 of 4 / 10 / 13 members in the
          band), so n cannot be enlarged without larger p and is not a sample
          size; an effect c*N^eps with c*N^eps < 0.04 percent at 2^24 is
          unconstrained at 2^52 for any eps above about 0.13 (0.04 percent *
          2^(28.4 eps) reaches 0.5 percent); (b) structure invisible to 3-sum
          collision counts (multiplicative orbits, algebraic membership
          structure); (c) the signed / x-only convention; (d) decomposition
          cost and relation rank.
        - >-
          Sensitivity ladder is one rung: the planted B+1 base validates the
          shift detector at +0.5 percent (C24 pooled 1.00525 vs known
          1.00521, SE 0.0002, 8 of 8 detected) but nothing between 0.04 and
          0.5 percent, and it raises yield rather than adding collisions at
          fixed yield (same statistic, so the detector response is the same;
          a graded dose-response is still absent). The simulation above
          supplies a three-dose curve at one size.
      narrowest_fix: >-
        State the C24 bound in both units and say that the run measured
        pair-sum-coincidence-visible structure of the small-x window to about
        +-6 percent of the random count at 2^22 to 2^25.

    - id: RT-O5
      rank: 5
      severity: record_defect
      title: >-
        I10 fires in all 9 arm-cells because the reference formula is the
        independent-balls occupancy value that the contract itself declares 2.4
        to 2.75 times too small; against the contract's 1.4/sqrt(N) every arm-
        cell is inside the band.
      evidence:
        - >-
          analyze.py lines 387-409 take form = count.sigma_rel_formula
          (count.py lines 149-155, sqrt(e^-mu(1-(1+mu)e^-mu))/((1-e^-mu)sqrt(N)),
          about 0.49/sqrt(N)). specification lines 424-430 and 1022-1027 state
          before freezing that this formula underestimates by 2.4 to 2.75 and
          that the measured sd is 2.5 to 3.0 times it; the band 0.75 to 1.33 is
          written for 1.4/sqrt(N). So the flag could not do anything but fire.
          check.py does not evaluate I10 at all (docstring lines 4-6).
        - >-
          Recomputed from raw per-member data against 1.4/sqrt(N): rms over
          members of sd*sqrt(N)/1.4 = FAM 0.892 / 0.903 / 0.935, N-A 0.853 /
          0.891 / 0.931, N-B 0.852 / 0.942 / 0.960 (C16 / C20 / C24). All nine
          inside 0.75 to 1.33. Member level: 1 of 107 outside, N-A C16 member
          N = 19081 at 0.739. The report's derived range 0.84 to 0.97
          (multiply by 0.35) agrees to within 0.02.
        - >-
          The coefficient is not constant: mean sd*sqrt(N) is 1.20 for N <
          2^18, 1.275 to 1.28 for 2^18 to 2^22, 1.32 to 1.33 above 2^22. The
          contract's 1.4 is conservative by 5 to 14 percent, which makes every
          power statement in the contract conservative, never optimistic.
        - >-
          Reading hazard, not a data signal: "I10 true in all 9 cells,
          ratios 2.39 to 2.77" can be read as an overdispersed null, which would
          threaten the randomization test and the MDE. It is not; the sd is
          what the contract predicted (up to 14 percent), and the randomization
          test uses the measured spread directly, not the formula.
        - >-
          Same defect class as RT-O2: constants carried from an earlier draft
          into frozen code that the checker shares. Those two are the only
          places I found; I did not audit the remaining implementation line by
          line.
      narrowest_fix: >-
        Record I10 as "false alarm against a stale reference; contract-formula
        ratios 0.85 to 0.96 (one member at 0.739)" in the superseding analysis
        record of RT-O2.

    - id: RT-O6
      rank: 6
      severity: noted
      title: >-
        Unexpected observation to preserve: a consistent but sub-threshold
        deficit in the CM arms, concentrated in FAM at C24.
      evidence:
        - >-
          Recorded T (percent): FAM -0.174 / -0.030 / -0.022, N-A -0.085 /
          -0.009 / -0.000, N-B -0.009 / +0.010 / +0.016 (C16 / C20 / C24). FAM
          C24 interval [-0.038, -0.006] excludes 0, randomization p 0.031, Holm
          0.094 (0.187 with six tests). Recomputed z = T/sd(T): FAM -0.82,
          -0.76, -2.16; N-B C24 +1.76. Stouffer over all 27 FAM members -2.15;
          over FAM + N-A (67 members) -1.74.
        - >-
          Post hoc, not in the pre-registered contrast set: FAM minus N-B at
          C24 = -0.0385 +- 0.0139 percent (z about -2.8); the pre-registered
          contrasts FAM-N-A and N-A-N-B at C24 have 99 percent intervals
          containing 0. The sign of a deficit means more collisions than random,
          the wrong direction for an advantage; size about 10 to 20 pair-sum
          coincidences.
        - >-
          Calibration: the smallest of the nine randomization p-values is 0.031,
          which under the null has probability 1-(1-0.031)^9 = 0.25. This is
          not a finding. The report states "no explanation computed" (line 69)
          for the C16 FAM value; at n = 4 the moving-block bootstrap has only
          two overlapping blocks (n-2), the recorded T equals the interval's
          lower end, and ci_inside_delta = true for it is not a statement about
          resolution.
      narrowest_fix: >-
        Preserve in the evidence review as an exploratory descriptive row; do
        not chase it. The only discriminator is a fresh FAM population (next
        cell up), see required_controls RC-4.

    - id: RT-O7
      rank: 7
      severity: scoping
      title: >-
        Unsigned canonical-sign multisets are not the convention of an x-only
        (Semaev) base; the real operating point has less headroom, so the 1.582
        ceiling quoted for the relation phase does not apply there.
      evidence:
        - >-
          An x-only base of B abscissae decomposes +-R as +-Q_i +-Q_j +-Q_k: 8
          sign patterns, mean yield per target 8*T/N, so mu_signed = 8 mu. At
          the experiment's B = ceil((6N)^(1/3)), mu_signed = 8 and random
          coverage is 1 - e^-8 = 0.99966; the ceiling on the ratio is 1.0003.
          mu = 1 in the signed convention is B = (6N)^(1/3)/2.
        - >-
          The experiment is the most favourable case (maximal headroom), which
          is conservative for a null; but "scan-efficiency / coverage channel
          carries a constant factor" is a statement about a convention in which
          the headroom is 1.58 and in the operative convention it is about 1.
          Specification lists signed conventions as out of scope (line 1092),
          so this is a scoping point for the retirement text, not a defect.
      narrowest_fix: >-
        Add "unsigned" to every reading and state that the operative signed
        convention was not measured.

    - id: RT-O8
      rank: 8
      severity: noted
      title: >-
        The scan-efficiency "positive control" is a code check, and the channel
        it retires has a negligible cost share.
      evidence:
        - >-
          R = S/L(S) = 2/(1 + chi-sum/S) is 2.000 for any curve up to a
          character sum, so R_pool in [1.994, 2.001] for all nine pools
          (FAM 1.9971 / 2.0004 / 2.0006, SE 0.0044 / 0.0018 / 0.0015)
          validates the implementation of L(S), and bounds a FAM-specific lift-
          density change at about 0.4 percent (3 SE), nothing more.
        - >-
          The factor-base construction phase is the scan: about W = 2B
          Euler-criterion tests (about 1000 at B = 466) plus B square roots.
          Even a perfect 2x gain there changes an end-to-end count of order
          10^5 by well under 1 percent (RT cost block). Retiring the channel
          retires nothing that mattered.
      narrowest_fix: >-
        Mark the M2 result as "implementation validated; channel immaterial".

    - id: RT-O9
      rank: 9
      severity: noted
      title: >-
        Planted-control calibration is marginal and biased low where the effect
        is largest; the gate passes on tolerance, not on accuracy.
      evidence:
        - >-
          t3 pooled planted ratio vs the Poisson-law value: C16 1.0267 vs
          1.0304 (off 0.37 percent of 3.0, tolerance 0.84), C20 1.0109 vs
          1.0125 (off 0.16, tolerance 0.17), C24 1.00525 vs 1.00521. At C16 and
          C20 the observed planted excess is about 12 percent below the
          Poisson-law value, the same pair-sum-coincidence effect as RT-O4.
          Disclosed pre-freeze (lines 1006-1035), reported honestly; it does
          not affect the C24 null but it means H2 ("Poisson to 0.03 percent")
          is a statement about mean coverage, not about increments.
      narrowest_fix: none required; keep in the evidence row.

  required_controls:
    - id: RC-1
      cost: zero new compute
      what: >-
        Superseding t8 analysis over the existing raw results with (a) the
        contract's MDE (no VAR_INFLATION), (b) I10 against 1.4/sqrt(N), (c)
        all sets of per-member z-scores tabulated. Expect: powered {C20, C24},
        NULL_AT_RESOLUTION unchanged, I10 inside the band in 9 of 9.
    - id: RC-2
      cost: one cell of t5 (about 4 minutes on 4 cores at C24 for 13 members)
      what: >-
        CM-coupled base on the same instrument: for each FAM and N-A member
        at C20 and C24, a base of B points {w^j(Q)} with labels l*lambda^j (lambda =
        2/v for FAM, (2-a+b)/(2b) mod N for N-A, verified by [lambda]Q = w(Q)
        on the curve), against the same 200 matched random bases. Written as a
        new contract. Prediction from a norm argument (unverified): every
        nonzero element of the ideal (pi - 1) of O_K has norm >= N, and a
        difference of two 3-sums of powers of w has norm <= 36*5^J, so chain
        bases are collision-free only up to J of about log_5(N/36) (about 8 to
        20 elements for N from 2^24 to 2^52), far below B = N^(1/3); beyond
        that the base is pseudo-random and the ratio should be 1.000 +-
        0.0004. A ratio outside that is the first coverage lead that is
        actually coupled to CM; a null retires the endomorphism-chain base at
        toy size with a named obstruction instead of an inherited one. This is
        the single cheapest control that could change the reading of the CM
        question.
    - id: RC-3
      cost: same as RC-2, labels already known
      what: >-
        Signed (x-only) convention: the same small-x bases with both signs of
        every point (B classes, mu_signed = 8 at the current B, or B halved to
        keep mu = 1), against random signed bases.
    - id: RC-4
      cost: about 5 core-hours with the C kernel (specification lines 752-755
        give 14.5 core-hours with numpy; pilot tau 14 ns lowers it)
      what: >-
        FAM-exhaustive C28 cell (about 24 members) as the third powered cell,
        so growth becomes assessable and the FAM C24 sign (RT-O6) is replicated
        on a fresh population. A persistent -0.022 percent would be about 8
        sigma there (sigma_T about 0.003 percent).
    - id: RC-5
      cost: minutes
      what: >-
        Graded dose-response at fixed yield on the real instrument: plant k in
        {0, 5, 20, 80} additive quadruples into real FAM bases and into random
        bases at C20 and C24; confirm the slope -0.58 B/N per coincidence. This
        converts the delta = 0.5 percent into the structural statement of RT-O4
        with the repository's own counter instead of mine.

  counterexample_or_mutation:
    description: >-
      Mutation of the claim "coverage null retires the channel": replace the
      small-x window by a base on which a cost advantage is known to exist
      while the coverage ratio is 1, the Gaudry-Diem extension-field base
      (EV-FBG-001 lines 130-133). The instrument returns NULL on it by
      construction (yield equals conservation mean), so a NULL here has zero
      power against the class of structure that matters for cost. Second
      mutation: a Bose-Chowla B_3 base returns ratio 1.107 on the same
      instrument, so the instrument is not blind to coverage-visible
      structure; the fibre over "ratio = 1" is where the missing separator
      (decomposition cost) lives.

  baseline_comparison:
    dominated_by: >-
      Not applicable to the run as recorded (no cost result is claimed:
      specification lines 1090-1093). If the null were promoted to a cost
      statement, checked against every frontier row: Pollard rho (time about
      sqrt(pi N / 2), memory O(1), no queries) dominates the small-x pair-
      table index calculus on time and memory at every priced weight; BSGS
      (time sqrt(N), memory sqrt(N)) is dominated in time only if the
      index-calculus table fits, and is not the relevant comparator; generic-
      group index calculus with a pair table (time and memory O(N^(2/3)))
      is the row this base would occupy. Closest specialised baseline for the
      measurement itself: EV-FBG-001 (six geometries, 12 curves, N <=
      2^18, null resolution +-0.5 percent, best structured base +10.7
      percent). This run extends the small-x exchangeability null to D = -19
      arms and to 2^25 at about 12 times finer resolution, and leaves the
      growth clause of the RQ open.
    five_a_status: >-
      AGENTS.md section 5a (aburan28/crypto, lines 641-668) governs
      cross-method comparisons and rankings. The run makes none, so §5a is
      not triggered by it. It is triggered the moment the Coordinator uses the
      null to rank this channel against rho or against other IC arms, and the
      table below is what that row would need. All numbers are my analytic
      arithmetic from the specification's B and T table, unmeasured, and no
      pinned calibration is claimed.
    analytic_band:
      assumptions: >-
        Generic-group index calculus, m = 3, mu = 1, coverage c = 0.632
        (best conceivable c = 1). Pair table of P = B(B+1)/2 sums; per target B
        subtractions R - Q_i and B hash lookups; B/c targets; B unknowns mod N;
        3 nonzeros per row. Rho: sqrt(pi N / 2) steps, one partition hash and
        distinguished-point test per step. Unpriced native counters: hash
        insert/lookup, Euler-criterion and square-root in the FB scan, mod-N
        multiply-adds in the linear algebra, rho partition hash and DP test.
      N_2e24:
        B: 466
        group_additions: 4.5e5
        native_hash_ops: 4.5e5
        fb_scan_native: 1.4e3
        linear_algebra_native: {sparse_3B2: 6.5e5, dense_B3_over_3: 3.4e7}
        rho_group_steps: 5.1e3
        rho_native: 5.1e3
        total_in_GAE_at_weights_0_0.1_1:
          index_calculus_sparse_LA: [4.5e5, 5.6e5, 1.6e6]
          index_calculus_dense_LA: [4.5e5, 3.9e6, 3.5e7]
          rho: [5.1e3, 5.6e3, 1.0e4]
        ratio_IC_over_rho: {sparse_LA: [88, 100, 152], dense_LA: [88, 700, 3400]}
        order_holds_across_band: true
        order: rho cheaper at every weight; with a perfect coverage-1 base the
          relation phase falls by at most 0.63, ratio about 56 at weight 0
      pair_46_size_2e52_4:
        B: 3.3e5
        relation_phase_group_additions: 2.3e11
        rho_group_steps: 1.0e8
        ratio_relation_phase_only: about 2.3e3
        memory: about 5.5e10 pair-table entries versus O(1) for rho
        growth_law: ratio about 5.5 * N^(1/6) on the relation phase alone
      reading: >-
        The distance remaining to matched rho is about two orders of magnitude
        at 2^24 and about three at the 53-bit pair on the relation phase alone,
        and the coverage constant (at most 1.58) moves it by less than the
        rounding of the model. No coverage result of any sign could change the
        order. The factor-base scan is under 0.5 percent of the count.

  heuristic_challenges:
    - id: H1
      challenge: >-
        Numbered and explicit, with a mechanism paragraph (a window selected by
        a property of the integer x is unrelated to the log labelling unless
        arithmetic of f(x) couples them), but no rigorous bound plus classical
        distribution theorem; it is an exchangeability hypothesis tested
        directly, which is acceptable. Random-model transfer: the structured
        object is a set of B labels that are discrete logs of points with small
        abscissa. The sd of coverage is dominated by pair-sum-coincidence
        counts (RT-O4), so the test is effectively a test of that count; the
        cheapest computation that exposes deviation from the random model is
        the pair-sum coincidence count itself, which is already implied by the
        coverage and by the recorded hist collisions field of three designated
        bases per member.
      status: held at the tested scope; this review found nothing that
        contradicts it
    - id: H2
      challenge: >-
        "Poisson to 0.03 percent at N >= 2^18" is a mean-coverage statement.
        The planted-increment prediction derived from it is 12 percent high at
        C16 and C20 (RT-O9). The sd constant 1.4/sqrt(N) is empirical; the
        first-principles value is 1.235/sqrt(N) (RT-O4), measured 1.20 to 1.33.
    - id: H3
      challenge: >-
        Bateman-Horn expectations 3.11 / 8.01 / 14.42 vs exact 4 / 10 / 13
        (ratios 1.28 / 1.25 / 0.90). Affects power only. Fine. The recalled
        CM facts (j(E_0) = -96^3; every curve with this j is E_0 or its twist)
        were checked here: 4A^3 + 27B^2 = 27436 and 1728 * 4A^3 / 27436 =
        -884736 = -96^3 for A = -152, B = 722; family identities N = 5v^2 - 2v
        + 4 and 4p = t^2 + 19 v^2 verified on t = 1211.
    - id: scale
      challenge: >-
        Tested 2^14 < p <= 2^25 against 2^52.4. The contract refuses transfer;
        I agree. The only transfer-friendly fact is the family's self-
        similarity (RT-O3), which supports transfer of an N-independent
        relative coupling and nothing else.

  cost_model_challenges:
    - >-
      The specification's cost_model is the experiment's compute budget (tau,
      memory, wall), not an attack cost. It is honest about that
      (what_does_not_follow line 1091). Measured wall about 16 minutes, 8
      trials, 107 members; the planned 52 minutes at tau = 40 ns was
      conservative by about 3x.
    - >-
      Omitted end-to-end phases, none claimed: factor-base construction (scan
      about 2B Euler tests plus B square roots, negligible), decomposition
      (B group additions and B lookups per target, B/c targets, plus the pair
      table: this is about 90 percent of the count), linear algebra (B unknowns
      mod N, sparse 3 nonzeros per row or dense), rank (not measured:
      EV-FBG-001 line 135 notes a rank-deficient base scores as tied here).
      Per-attempt versus total: coverage c is the per-target success
      probability; the total relation cost is per-target cost times 1/c, which
      the ceiling bounds at 1/0.632 for the random base and 1 for a perfect
      one.
    - >-
      Memory axis: the decomposition phase needs the pair table, B^2/2 entries
      (1.1e5 at 2^24, 5.5e10 at the 53-bit pair); rho needs none. A cost
      statement made without the memory axis is incomplete (section
      analytic_band).

  reduction_and_scope_challenges:
    - >-
      Chain RQ (advantage over matched random base, growth with N) to H
      (exact m = 3 coverage of one base, null) to EXP (small-x window, three
      arms, 2^14 to 2^25) to decision_impact ("retire this channel for
      RQ-CMFB-33610e"). Each step narrows; the retirement sentence does not.
      Only the third level is measured.
    - >-
      Affected-versus-safe scope: the run says nothing about pair 46, its
      floor, its crater-to-floor isogeny, its canonical lift, or any m other
      than 3. "Safe" is not asserted anywhere and must not be inferred from the
      null.
    - >-
      Reduction instantiated: none cited. The recalled theorem "End = O_K for
      j = -96^3" is used only to define arms and is checked per curve (I4).

  proof_architecture_challenges:
    - attack: nearby-object
      result: >-
        Applied to Gaudry-Diem and to Bose-Chowla (see counterexample_or_
        mutation). The argument "coverage null therefore no advantage" survives
        on the first object where its conclusion is false. That location, the
        passage from coverage to decomposition cost, is the finding.
    - attack: quantifier-order
      result: >-
        No witness is chosen after seeing outcomes: FAM is exhaustive in band,
        N-A and N-B are drawn from frozen seeds, the twist d is a deterministic
        function of p. The one post-hoc quantification in the record is the
        pre-freeze disclosure (lines 996-1035), which is disclosed.
    - attack: boundary-and-strictness
      result: >-
        The random base is embedded as the boundary through the same counting
        code; the planted base is strictly better by a known amount and is
        detected. Holds.
    - attack: method-ceiling
      result: >-
        Largest claim the metric can support under ideal tuning is a constant
        of 1.582 on the unsigned relation phase and about 1.0003 in the signed
        convention (RT-O1, RT-O7). The RQ's growth question lies above the
        ceiling of this metric.
    - attack: observation-fibre
      result: >-
        Hold coverage ratio = 1 fixed and vary the base: Gaudry-Diem bases sit
        on the same fibre with a known cost advantage. The missing separator
        is an observable for decomposition cost.

  obstruction_and_reversal:
    obstruction_block_candidate:
      quantity: >-
        T(arm, cell) = mean over members of (coverage of small-x base / mean
        coverage of 200 matched random bases) - 1
      value: >-
        FAM C24 -0.022 percent [-0.038, -0.006] (n = 13, exhaustive), N-A C24
        -0.000 [-0.024, +0.027] (n = 16), N-B C24 +0.016 [-0.001, +0.035]
        (n = 16); C20 FAM -0.030 [-0.074, +0.048] (n = 10), N-A -0.009, N-B
        +0.010 (contract-powered, RT-O2); randomization sd of T 0.010 percent
        at C24
      scope: >-
        m = 3, unsigned canonical-sign multisets, targets uniform over Z_N,
        small-x liftable window in the integral chart of E_0 (or its twist) or
        |A|,|B| <= 1000, prime-order curves, 2^22 < p <= 2^25, FAM exhaustive
      named_obstruction: >-
        Coverage ratio is bounded by 1.582 for every base (conservation
        identity), and a window of small integers carries no group-law
        structure (one integral point in the d = 1 chart up to x = 2*10^5).
      forward_guidance_open: >-
        endomorphism-chain and w-orbit bases (RC-2); isogeny-pullback bases
        through the crater-to-floor isogeny (floor not constructed); canonical-
        lift relations; other models and joint x-y windows; signed / x-only
        convention (RC-3); decomposition cost, relation rank and linear
        algebra; growth over at least 3 powered cells (RC-4).
    resource_check:
      examined: true
      reading: >-
        Which theory takes "small-x window is exchangeable with a random base
        for multiset-sum statistics" as its hypothesis? (i) The generic-group
        model: then index calculus with such a base is bounded below by
        generic-group costs and the gap to rho is N^(1/6) times a constant
        (analytic_band). That reading closes the coverage channel. (ii) A
        candidate not tested: small solutions of the modular equation S_4(x1,
        x2, x3, x_R) = 0 mod p in the box [0, W)^3. The null says the number of
        solutions is as for a random base (about W^3/p), which is the hypothesis
        a lattice-style small-root method needs; whether such a method finds
        them below B^2 time on a prime field is a cost question this run does
        not touch. This is speculation from the measurement, a candidate for the
        ranking and not evidence, and no citation is relied on.
      spawned_ids: []

  narrowest_supported_statement: >-
    On 107 prime-order curves with 2^14 < p <= 2^25, the exact m = 3 coverage of
    the unsigned canonical-sign small-x liftable-window base of size
    ceil((6N)^(1/3)) is consistent with that of 200 matched random bases per
    member: at C24, for FAM (13 of 13 members in the band), N-A and N-B, every
    95 percent interval is inside +-0.04 percent (declared resolution 0.5
    percent), and by the contract text the same holds at C20 (+-0.07 percent).
    That excludes more than about 20 extra additive pair-sum coincidences per
    member. The planted control detected +0.5 percent at 2^22 to 2^23 in 8 of
    8 curves. This says nothing about growth in N, about bases that use the
    CM structure, about the signed convention, about decomposition cost, rank
    or linear algebra, or about the 53-bit pair. Coverage-constant-only for
    any base is a theorem (ratio <= 1.582) and is not established by this run.

  next_concrete_action: >-
    Coordinator: before the evidence review closes, record a superseding
    analysis over the existing raw results (RC-1), stating that the powered set
    under the contract text is {C20, C24} and that I10 is inside the band
    against 1.4/sqrt(N), with the recorded t8 left untouched; then decide
    whether to commission RC-2, the CM-coupled (w-orbit) base, as the next
    contract. No new compute is needed for the first step.

  procedure_deviations:
    - >-
      No review_plan, task card, blindness declaration or blind re-derivation
      assignment was supplied. I read the producer's specification, code and
      raw results. Three quantities were re-derived from raw per-member
      records and from the statement alone: the MDE and sd constants (from
      member_seen / random_seen), the variance constant 1.235/sqrt(N) (from the
      coincidence argument), and its calibration (own counter, own
      simulation). The first uses the producer's records and so is a
      recomputation, not a blind re-derivation.
    - >-
      The snapshot is the producer branch head named in the request
      (c6a2f13fdb), not a Coordinator snapshot commit.
    - >-
      Output path chosen by precedent (experiments/EXP-HZM-001/reviews/red-
      team/); the Coordinator may relocate it. The id was minted from
      secrets.token_hex(3) and checked with tools/allocate_id.py --check
      (well-formed, free across 43795 identifier-bearing paths).
    - >-
      Scratch code (not durable, not evidence): scripts in the session
      scratchpad directory, rt_analysis.py (recomputation from raw members)
      and rt_sim.py (planted-quadruple simulation, N = 4194301, B = 294, 30
      random bases and 12 planted bases per dose). The formulas are given in
      RT-O4 and RT-O2, and the data keys in RT-O2, so the numbers can be
      regenerated.

  review_attestation:
    joints_owned: all (no review_plan)
    read_sibling_reports: false
    verdict: >-
      conclusion_requires_narrowing for the interpretation (RT-O1, RT-O3,
      RT-O7); record_defect for the powered-cell designation and the I10 text
      (RT-O2, RT-O5), neither of which changes the mechanical classification.
      The measured null itself holds at its stated scope and is stronger than
      its declared resolution.
    holds:
      - instrument gates and controls as recorded (M0, brute force, validity,
        labelling, planted detection 7/8, 8/8, 8/8)
      - NULL_AT_RESOLUTION as a mechanical outcome at C24, and under the
        contract text at C20 as well
      - the randomization test and bootstrap at C20 and C24
    breaks:
      - the reading "constant-only (no effect)" as a result of this run (RT-O1)
      - the reading that the CM structure was tested (RT-O3)
      - powered_cells = [C24] as the contract's definition (RT-O2)
      - I10 as an anomaly in the null sd (RT-O5)
    inconclusive:
      - whether the FAM C24 deficit is anything (RT-O6, needs RC-4)
      - growth in N (not assessable by construction)

  artifact_paths:
