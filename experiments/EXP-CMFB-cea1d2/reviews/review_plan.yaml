# review_plan for the evidence review of EXP-CMFB-cea1d2 (decision DEC-20261019-f33f3e).
#
# POST-HOC RECORD. AGENTS.md "Review architecture" requires this plan BEFORE any
# reviewer runs. The producing session dispatched the validator
# (VAL-20261019-1b97f5, TASK-20261019-bbb351) and the red team
# (RT-20261019-520123) without one, and this plan was written by the
# Coordinator AFTER both verdicts were known. Consequences, stated once here
# and again under procedure_deviations:
#   * coordinator_prior is a post-hoc statement. It is NOT an independent
#     pre-commitment and must not be read as evidence that the reviewers
#     "concurred with an unseen prior".
#   * joint ownership below is the Coordinator's assignment of each joint to
#     the reviewer whose report actually worked it; both reviewers' own
#     attestations say "all joints, no review_plan".
#   * the blind re-derivation required here was NOT performed blind.
review_plan:
  experiment_id: EXP-CMFB-cea1d2
  hypothesis_id: H-CMFB-9b2eed
  decision_id: DEC-20261019-f33f3e
  written_at: '2026-10-19'
  written_after_verdicts: true
  reviewers:
    validator: "VAL-20261019-1b97f5 (TASK-20261019-bbb351), coordination/tasks/TASK-20261019-bbb351/validation_report.yaml, verdict passed"
    red_team: "RT-20261019-520123 (task_id null; no TASK-* card), experiments/EXP-CMFB-cea1d2/reviews/red-team/red_team_report.yaml, verdict conclusion_requires_narrowing"

  claim_under_review: >-
    As the producer stated it. Hypothesis H-CMFB-9b2eed (statement): in each of
    three arms (FAM: crater-type members of p = 5t^2 + 19t + 19; N-A: other
    D = -19 crater-type curves; N-B: random prime-order curves) at
    2^14 < p <= 2^25, the small-x factor base (first B = ceil((6N)^(1/3))
    abscissae with f(x) a nonzero square, one canonical-sign point each) has
    the same exact m = 3 coverage as a matched random base, within
    delta = 0.5 percent in every powered cell; the exact mean-yield ratio is 1
    identically; and the qr_window scan-efficiency ratio computed from the
    residuosity of f(x) is 2.0 +- 0.02 on generic curves. The frozen contract's
    decision_impact.on_positive reads a NULL_AT_RESOLUTION outcome as: "the
    coverage and scan-efficiency channels of the small-x base for crater-type
    D=-19 members of this family are constant-only (no effect) at toy size ...
    Candidate for scoped retirement of this channel for RQ-CMFB-33610e after
    independent review." The producer's recorded mechanical output
    (RUN-CMFB-2010d3, t8) is classification NULL_AT_RESOLUTION with C24 the
    only powered cell. The producer's own run report
    (reports/run-20261019T0541Z/report.typ) states observations only and no
    verdict.

  coordinator_prior:
    label: >-
      POST HOC. Written after VAL-20261019-1b97f5 and RT-20261019-520123 were
      read. Not independent evidence.
    prior: >-
      The experiment was designed as a null prediction (H-CMFB-9b2eed
      "This is a null prediction"; spec preregistered_prediction T = 0). The
      expected reading, held when the contract was approved (DEC-20261015-a8509d
      "A null outcome is reported as consistent with the null at resolution
      0.5 percent, never as no effect"), was a scoped null on the small-x
      family: the small-x window selects points by a property of the integer x,
      which should be unrelated to the logarithm labelling, and any coverage
      advantage is anyway capped at constant 1.582 by the conservation theorem
      (KN-FIND-007). I expected reviewers to find the instrument sound and the
      null attainable, and to object to the reading of the null as a statement
      about the CM structure. The prior is silent on two matters that the
      reviewers then reported and that it therefore does not cover: the stale
      MDE inflation factor and the stale I10 reference in the frozen
      analysis code (discrepancies D1 and D2 of VAL-20261019-1b97f5), and the
      quantitative size of the C24 resolution relative to the declared delta.
      Nothing in this paragraph records what any session expected before the
      reviewers reported; it records what this review holds as its prior now.

  joints:
    - joint: "J1 Receipt integrity: every artifact hash, the binding of plan, specification and source hashes, manifest completeness, post-freeze change history (I1, I11), and reproducibility of all eight trials from scratch."
      assigned_to: "TASK-20261019-bbb351"
      attack_plan: >-
        Recompute the sha256 of every file named in the eight
        execution-receipt.json files; compare plan, specification and source
        hashes with the frozen bindings and with git objects at the run commit;
        diff the two specification versions around AMD-EXP-CMFB-cea1d2-20261015-schema;
        rebuild t1..t8 into a scratch directory outside the repository and
        compare raw results outside timings. Expected break point: a post-freeze
        edit of code or constants, or a nondeterministic trial.
      breaking_artifact: "a hash mismatch, a source file differing from the plan binding, or a raw-result difference after rebuild"
    - joint: "J2 Coverage counts: every one of the 26,331 m = 3 coverage values (member bases, 200 matched random bases per member, planted bases) and the exact yield identity M0."
      assigned_to: "TASK-20261019-bbb351"
      attack_plan: >-
        Write a second counter that enumerates multisets in a different order,
        regenerate the random bases from the stream recipe, self-test it
        against literal itertools enumeration, and recount all bases; cross-check
        a subset with an FFT support computation. Expected break point: a
        wrong-but-self-consistent random-base recipe shared by producer and
        reviewer.
      breaking_artifact: "any coverage mismatch, or a total differing from binomial(B+2,3)"
    - joint: "J3 Rule conformance: the recorded classification, powered-cell set, MDE, Holm family and I10 flag follow from the frozen specification text (not merely from the frozen code)."
      assigned_to: "TASK-20261019-bbb351"
      attack_plan: >-
        Recompute T, intervals, randomization p and the Holm family from the raw
        per-member coverages with code written from the specification text;
        evaluate powered(c) with the MDE formula exactly as the text states it;
        evaluate I10 against the constant the text states. Expected break point:
        a constant carried from an earlier draft into frozen code.
      breaking_artifact: "a table row, a powered flag or a flag value that differs between the text-derived and the code-derived value"
    - joint: "J4 Instrument sensitivity: the planted-relation gate and the null controls (qr_window positive and negative control, brute-force counter check, point-count identity, curve and twist validity) demonstrate that the instrument would have seen a coverage excess at the resolution the null is claimed."
      assigned_to: "TASK-20261019-bbb351"
      attack_plan: >-
        Recompute the planted detection counts, pooled ratios and tolerances from
        the raw coverages; recompute every scan pool from an independent Euler
        scan; run the 60 brute-force cases against a literal enumerator. State
        the gate margins. Expected break point: a gate that passes only on a
        tolerance that was seen before the run (the specification discloses
        this for C16 and C20).
      breaking_artifact: "a gate failing on recomputation, or a pooled planted ratio outside its tolerance"
    - joint: "J5 Interpretation breadth: what the measured null licenses. Whether 'constant-only', 'channel retired' or 'CM structure tested' follows from an exchangeability measurement of the small-x window, and which parts are theorem (conservation ceiling) rather than result."
      assigned_to: "RT-20261019-520123"
      attack_plan: >-
        Chain the research question, hypothesis, experiment and decision_impact
        sentence and mark where each step narrows; compute the largest
        coverage ratio any base could reach at the tested operating point
        (min(1, mu)/(1 - e^-mu) at mu = 1); enumerate the integral points of the
        d = 1 chart to see whether a window of small integers touches the group
        law; check that a CM-coupled base (w-orbit) is constructible with labels
        l * lambda^j. Expected break point: the retirement sentence, which
        is broader than the measured object.
      breaking_artifact: "a base named in the research question's scope.methods that the experiment never built, or a ceiling that makes the claimed 'more than a constant' a theorem independent of the run"
    - joint: "J6 Resolution and structure: what the C24 and C20 confidence intervals exclude in structural units (extra additive pair-sum coincidences per member), and what the n, the band width and the exhaustive FAM population cannot see (growth, multiplicative structure, signed convention)."
      assigned_to: "RT-20261019-520123"
      attack_plan: >-
        Translate a coverage-ratio bound into a count of l_a + l_b = l_c + l_d
        coincidences via the occupancy argument; calibrate by simulation with
        planted additive quadruples at N near 2^22; state the exponent range of a
        growth law that the 3-bit powered window leaves unconstrained at 2^52.
      breaking_artifact: "a dose-response curve whose slope disagrees with the occupancy formula, or a growth law consistent with the C24 bound and material at 2^52"
    - joint: "J7 Cross-method accounting: whether any ranking against Pollard rho or other index-calculus arms is implied, and the priced cost band if so (AGENTS.md section 5a)."
      assigned_to: "RT-20261019-520123"
      attack_plan: >-
        Price the unpriced native work (hash insert/lookup, Euler criterion and
        square root in the scan, mod-N multiply-add in linear algebra, rho
        partition hash and distinguished-point test) at 0, 0.1 and 1 GAE per
        operation for index calculus with this base and for rho; report whether
        the order holds across the band. Expected break point: a coverage null
        read as a cost statement.
      breaking_artifact: "an order of two arms that reverses inside the 0 to 1 GAE band"

  blindness:
    mutual: true
    lifted_for: []
    rationale: null
    achieved: >-
      Achieved in fact: VAL-20261019-1b97f5 attests read_sibling_reports false;
      RT-20261019-520123 states read_sibling_reports false. Neither reviewer was
      told it was reviewing against a plan (there was none). The Coordinator
      read both reports only after both existed.

  proves_too_much:
    objects:
      - "Gaudry-Diem extension-field factor base (x in a subfield): coverage ratio against a matched random base is 1 by the conservation identity, yet the method beats generic bounds because its advantage lives in the solve (EV-FBG-001 boundaries)."
      - "Bose-Chowla B_3 (Sidon) base: coverage ratio 1.1071 against a matched random base on the same instrument (EV-FBG-001, red team RT-1), i.e. the instrument is not blind to coverage-visible structure."
      - "Planted B+1 base: known coverage excess +3.04 / +1.25 / +0.52 percent at C16 / C20 / C24 (VAL C7); the instrument must detect it."
    failure_signature: >-
      The argument 'coverage ratio equals 1 within the stated resolution,
      therefore no factor-base advantage' must NOT be accepted as a cost
      statement: it goes through unchanged on the Gaudry-Diem base, where the
      conclusion is false (advantage in the solve at ratio 1), so coverage-null
      cannot carry a cost claim. Separately, the instrument must return a
      detected excess on the Bose-Chowla base and on the planted base; if it
      returned null on either, the null on the small-x window would be an
      instrument artifact. The first object tests the argument, the other two
      test the instrument.
    assigned_to: "RT-20261019-520123"

  blind_rederivation:
    required: true
    quantity: >-
      For each arm in {FAM, N-A, N-B} and each cell in {C20, C24}: the mean over
      members of (m = 3 unsigned-multiset coverage of the small-x liftable
      base of size B = smallest integer with B^3 >= 6N, divided by the mean
      coverage of 200 random bases of B distinct classes with independent
      signs) minus 1, and the minimum detectable effect of that mean computed
      from the measured null spreads.
    parameters: >-
      Instance list identified by its sha256
      38cf55093614d8f8761e392d75e17ae5f0266e50b69b7abd58d6f01c3b2fa314
      (107 members), seeds 7001 to 7010 as in the specification, delta 0.005,
      K = 200, alpha 0.05.
    blind_from:
      - experiments/EXP-CMFB-cea1d2/implementation/count.py
      - experiments/EXP-CMFB-cea1d2/implementation/curves.py
      - experiments/EXP-CMFB-cea1d2/implementation/driver.py
      - experiments/EXP-CMFB-cea1d2/implementation/analyze.py
      - experiments/EXP-CMFB-cea1d2/implementation/check.py
      - experiments/EXP-CMFB-cea1d2/reports/run-20261019T0541Z/report.typ
    assigned_to: "TASK-20261019-bbb351"
    status_post_hoc: >-
      NOT ACHIEVED. VAL-20261019-1b97f5 records that it read count.py and
      curves.py first (the specification points to count.random_labels for the
      random-base recipe), so its agreement on the recipe is not blind; the
      validator says so in its limitations. RT-20261019-520123 recomputed the MDE
      and spread constants from the producer's raw per-member records (a
      recomputation, not a blind re-derivation) and derived the variance
      constant 1.235/sqrt(N) from the coincidence argument alone, which is the
      only blind element in the round and is a different quantity. What exists is
      therefore an independent recount with independent code (strong evidence of
      the counting implementation, 26,331 of 26,331 agree) and a from-scratch
      rebuild (determinism), not a blind re-derivation of the statistic.

  procedure_deviations:
    - >-
      No review_plan existed before the reviewers ran. This plan is written
      after both verdicts and carries a post-hoc prior (see coordinator_prior).
      A prior recorded once the answer is known is not a prior. The round cannot
      be described as a pre-registered review, and the record of
      concurrence between the Coordinator's expectation and the reviewers is
      explicitly not evidence of independence.
    - >-
      Both reviewers' attestations claim all joints ("no review_plan"). This
      plan assigns J1-J4 to the validator and J5-J7 to the red team by what each
      report actually worked. Each reviewer also touched some of the other's
      joints: the red team recomputed the MDE and I10 constants from raw records
      (J3, owned here by the validator, and both reached the same numbers:
      contract MDE C20 FAM 0.140 / N-A 0.154 / N-B 0.141 percent); the validator
      commented on the sensitivity ladder (J4/J6). Two reviewers worked the same
      quantity on J3; this is the 'two reviewers on one joint' pattern the plan
      format warns against, recorded and not repaired, and it means the
      agreement on D1 and D2 is a cross-check by two readers of the same raw
      records, not by independent routes to the quantity.
    - >-
      The red team has no TASK-* card (task_id null). J5-J7 are therefore
      assigned to RT-20261019-520123 by report id, and
      tools/check_review_independence.py cannot resolve it as a task.
    - >-
      The snapshot reviewed (HEAD c6a2f13fdb) consists of producer-session
      commits ed7be5c508, 11a2df56d5 and c6a2f13fdb, not a Coordinator snapshot
      archive (VAL A1). Both reviewers worked from that head. The Coordinator's
      ledger archive for this review must record that head as the reviewed
      snapshot or state a different one.
    - >-
      The blind re-derivation (see blind_rederivation.status_post_hoc) was not
      blind.
    - >-
      The Coordinator prior was recorded after the verdicts. Where this review's
      conclusions agree with that prior they are not independent confirmation.
