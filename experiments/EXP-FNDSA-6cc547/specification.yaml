# EXPERIMENT CONTRACT -- EXP-FNDSA-6cc547 (review_required, unapproved, zero runs).
experiment:
  id: EXP-FNDSA-6cc547
  hypothesis_id: H-FNDSA-47e7e9
  derived_from_idea: IDEA-20261018-574a9f
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Hint estimator calibration on exponent hints
  objective: Decide whether the hints estimator can extrapolate exponent-leak recovery costs.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python, fpylll progressive BKZ, a public implementation of the hints framework (recalled
      availability), toy Falcon
    parameters: >-
      n in {32, 64, 128}; hint signature counts in {20, 50, 100, 200}; 10 keys per cell; BKZ
      beta 10..60
    procedure: >-
      1. Produce hints. 2. Run estimator. 3. Embed hints and run BKZ with increasing beta.
      4. Record beta_meas. 5. Compare.
  controls:
  - >-
    null: hints from an independent key (estimator predicts no gain; measured gain must be
    absent)
  - 'positive: perfect hints (exact center values)'
  - 'A/A: same cell on two seed blocks'
  independent_variables:
  - hint_type
  - hint_signature_count
  metrics:
    primary:
    - beta_pred - beta_meas
    secondary:
    - recovery rate at beta_pred
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: abs error
    formula: <= 5
    source: framework accuracy as recalled
  scale_relevance:
    tier: toy
    justification: n <= 128; the experiment exists to quantify the transfer step
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    independent_instances: 10
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40
    maximum_memory_gb: 16
    maximum_runs: 48
  stopping_rules:
  - stop a cell at beta = 60 without recovery (censored)
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - estimator crash is infrastructure
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C2 shows P1 and P2 in every cell with C1 perfect hints within +-3, beyond
    AA1 noise floor.
  falsification_criterion: >-
    C2 shows any cell error > 10 or one-sided bias, rejecting the estimator for this hint
    type.
  decision_impact:
    on_positive: Use the estimator to extrapolate F1's curve to n = 512/1024 with stated error.
    on_negative: Do not extrapolate; report toy-n curves only and build a corrected hint model.
  variable_ledger:
    independent:
    - name: hint_type
      levels:
      - exponent_bucket
      - perfect_center
      - independent_key_null
    - name: hint_signature_count
      levels:
      - '20'
      - '50'
      - '100'
      - '200'
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: estimator_version
      treatment: fixed
      value: pinned commit
      how: manifest
    comparisons:
    - id: C1
      arms:
      - exponent_bucket
      - perfect_center
      differs_in:
      - hint_type
      design: one_factor
    - id: C2
      arms:
      - exponent_bucket across counts
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - block A
      - block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-574a9f.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-574a9f.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml
  - raw-result.json
  - pred-vs-meas plot
  - PDF report
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
  approval_gate:
    state: review_required
    blockers:
    - >-
      No launcher or implementation is committed for this contract; experiments/EXP-FNDSA-6cc547/implementation/
      is empty.
    - >-
      No preapproval packet exists; python3 tools/experiment_preapproval.py --packet must
      report approvable: true before Coordinator approval.
    - No runbook or task card is compiled (experiment-director, compile mode).
    - Novelty screen not run on IDEA-20261018-574a9f.
    standing_authorization: >-
      AGENTS.md 'Standing user authorization' lets the Coordinator approve once the contract
