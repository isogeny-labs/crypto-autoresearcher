  controls:
  - 'null: |S| = 0 honest ExpandA'
  - 'positive: |S| = n, recovery by linear algebra'
  - 'A/A: |S| = n/4 under two seeds'
  independent_variables:
  - zeroed_slots
  metrics:
    primary:
    - block size to recovery
    secondary:
    - DDGR prediction
    - wall time
  heuristic_under_test: HEUR-001
  preregistered_prediction:
