    formula: "REVIEW HOLD PR2404 entry 28: Rounded public keys and zero-matrix non-identifiability. See docs/reviews/pr2404/qualification.md and findings.json; original unapproved draft at c90520a94ee40dd760d57fe33cc6231ab03a6852:experiments/EXP-MLDSA-1e2b4d/specification.yaml. The archived prediction is not an accepted cost or correctness model."
