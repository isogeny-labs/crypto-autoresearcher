experiment:
  id: EXP-FNDSA-d9c29d
  hypothesis_id: H-FNDSA-a151c7
  derived_from_idea: IDEA-20261018-7e72aa
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Covariance-error alignment for float vs float-free samplers
  objective: >-
    Decide whether the float-free sampler's deviation is key-aligned where ffSampling's is
    not.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      SageMath/NumPy, toy ffSampling port with float64, integer Gram-root perturbation sampler,
      exact rational reference
    parameters: >-
      n in {16, 32, 64}; q = 12289; root precision bits in {8, 16, 32}; 20 keys per cell;
      10^6 signatures per key for empirical check
    procedure: >-
      1. Generate keys. 2. Build each sampler. 3. Compute analytic E where available. 4. Sample
      10^6 outputs, estimate E. 5. Compute alignment and z against 1000 random subspaces.
      6. Repeat for controls.
  controls:
  - 'null: exact-rational root sampler (E = 0 up to sampling noise) and random subspaces'
  - 'positive: planted E = eps * B^T B with known eps'
  - 'A/A: same arm on two disjoint key-seed blocks'
  independent_variables:
  - sampler_arm
  - root_precision_bits
  metrics:
    primary:
    - alignment z-score
    secondary:
    - '||E||_F'
    - empirical vs analytic E discrepancy
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: alignment z at n = 32
    formula: z_int >= 3, z_ff < 2
    source: perturbation-theory argument in mechanism
  scale_relevance:
    tier: toy
    justification: n <= 64; transfer assumes residual structure independent of n, tested across
      16/32/64
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
