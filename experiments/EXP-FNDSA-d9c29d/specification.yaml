    - 2026101814
    - 2026101815
    - 2026101816
    - 2026101817
    - 2026101818
    - 2026101819
    independent_instances: 20
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 30
  stopping_rules:
  - stop if the positive control is not detected at n = 16
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - 'analytic and empirical E disagree beyond 5 sigma: implementation bug, rerun'
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 shows P1 and P2 at n = 32 and 64, above the AA1 noise floor.
  falsification_criterion: C1 gives integer-root z < 2 at both n, rejecting key-aligned residual
    geometry.
  decision_impact:
    on_positive: >-
      Prioritise a signatures-to-key run against the float-free sampler with the aligned statistic.
    on_negative: >-
      Treat float-free and float samplers as equivalent leak geometry and compare only by
      divergence size.
  variable_ledger:
    independent:
    - name: sampler_arm
      levels:
      - ffsampling_float64
      - integer_gram_root
      - exact_rational
    - name: root_precision_bits
      levels:
      - '8'
      - '16'
      - '32'
    factors:
    - name: key_seed_block
      treatment: randomized
      value: two blocks of 10 keys
      how: separate SHAKE seeds
    - name: sample_count
      treatment: fixed
      value: 10^6
      how: manifest
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - integer_gram_root
      - ffsampling_float64
      differs_in:
      - sampler_arm
      design: one_factor
    - id: C2
      arms:
      - integer_gram_root 8 bits
      - integer_gram_root 32 bits
      differs_in:
      - root_precision_bits
      design: one_factor
    - id: AA1
      arms:
      - integer_gram_root block A
      - integer_gram_root block B
      differs_in:
      - key_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
