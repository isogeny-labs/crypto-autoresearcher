# EXPERIMENT CONTRACT -- EXP-FNDSA-a7649a (review_required, unapproved, zero runs).
experiment:
  id: EXP-FNDSA-a7649a
  hypothesis_id: H-FNDSA-3af2b8
  derived_from_idea: IDEA-20261018-cc5a57
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: MLE vs moment learners on planted-defect signatures
  objective: Quantify the detection-to-recovery gap a full-likelihood learner closes.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: PyTorch surrogate, NumPy samplers, exact enumeration at n=8
    parameters: >-
      n in {8, 16, 32}; delta in {0, 1e-2, 1e-1, 0.3}; 10 keys; 20 restarts; up to 10^6 signatures
    procedure: >-
      1. Plant defect. 2. Sample. 3. Fit MLE and moment learners on growing prefixes. 4. Record
      N_theta. 5. Compute Cramer-Rao bound numerically.
  controls:
  - 'null: delta = 0 (MLE angle distribution must match random)'
  - 'positive: delta = 0.3'
  - 'A/A: same arm with two initialisation-seed blocks'
  independent_variables:
  - learner_arm
  - planted_kl
  metrics:
    primary:
    - N_theta
    secondary:
    - N_CR
    - restart success fraction
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: N_theta ratio moment/MLE
    formula: '>= 3'
    source: information argument
  scale_relevance:
    tier: toy
    justification: n <= 32; transfer only as a ratio claim
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    independent_instances: 10
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 30
    maximum_memory_gb: 8
    maximum_runs: 36
  stopping_rules:
  - censor at 10^6 signatures
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - optimiser NaN is infrastructure
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 gives P1 at n = 16 and 32 and C2 gives P2, beyond the AA1 noise floor.
  falsification_criterion: C1 shows MLE no better than the fourth-moment learner at any n.
  decision_impact:
    on_positive: Use MLE learner as the recovery instrument for the signatures-to-leak curve.
    on_negative: Keep moment learners; the cheaper instrument loses nothing.
  variable_ledger:
    independent:
    - name: learner_arm
      levels:
      - mle_surrogate
      - second_moment
      - fourth_moment
    - name: planted_kl
      levels:
      - '0'
      - 1e-2
      - 1e-1
      - '0.3'
    factors:
    - name: init_seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: restart_count
      treatment: fixed
      value: '20'
      how: manifest
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of declared seeds
      how: seeds drawn from the frozen seed list; block A and block B never overlap
    comparisons:
    - id: C1
      arms:
      - mle_surrogate
      - fourth_moment
      differs_in:
      - learner_arm
      design: one_factor
    - id: C2
      arms:
      - mle_surrogate vs CR bound
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - mle block A
      - mle block B
      differs_in:
      - init_seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-cc5a57.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-cc5a57.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
