  inputs:
    instrument: SageMath, fpylll, detector, certificate checker
    parameters: p in {61, 73, 89}; c in {1, 2, 3, 5}; rescale none/optimal; q grid; 20 instances
    procedure: 1. Generate. 2. Sweep q. 3. Reduce both embeddings. 4. Detect and certify.
      5. Fit q*.
  controls:
  - 'null: matched random lattice'
  - 'positive: c = 1 balanced'
  - 'A/A: c = 3 on two seed blocks'
  independent_variables:
  - block_ratio_c
  - rescaling
  metrics:
    primary:
    - log2 q* shift
    secondary:
    - empirical optimal scale
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: shift unrescaled
    formula: '>= 0.5 log2 r'
    source: covolume argument
  scale_relevance:
    tier: toy
    justification: 2n <= 178
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
