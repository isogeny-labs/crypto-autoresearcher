    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: C1 shows P1 and C2 shows P2, with C3 consistent across rings, beyond
    the AA1 noise floor.
  falsification_criterion: C1 finds no shift for c = 3 or 5 without rescaling.
  decision_impact:
    on_positive: Quote deployed distance with rescaling applied and record the correction.
    on_negative: Balance is irrelevant; use the balanced law directly.
  variable_ledger:
    independent:
    - name: block_ratio_c
      levels:
      - '1'
      - '2'
      - '3'
      - '5'
    - name: rescaling
      levels:
      - none
      - optimal
    factors:
    - name: seed_block
      treatment: randomized
      value: two blocks
      how: distinct seeds
    - name: ring_shape
      treatment: crossed
      value: x^p-x-1 and x^n+1
      how: full cross
    comparisons:
    - id: C1
      arms:
      - c=3 none
      - c=1 none
      differs_in:
      - block_ratio_c
      design: one_factor
    - id: C2
      arms:
      - c=3 optimal
      - c=3 none
      differs_in:
      - rescaling
      design: one_factor
    - id: C3
      arms:
      - c x rescaling x ring
      differs_in:
      - block_ratio_c
      - rescaling
      - ring_shape
      design: factorial
    - id: AA1
