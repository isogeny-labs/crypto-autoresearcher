    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 60
    maximum_memory_gb: 8
    maximum_runs: 96
  stopping_rules:
  - stop when q* CI < 0.1
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - uncertified recovery excluded
