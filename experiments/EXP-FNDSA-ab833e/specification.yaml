# EXPERIMENT CONTRACT -- EXP-FNDSA-ab833e (review_required, unapproved, zero runs).
experiment:
  id: EXP-FNDSA-ab833e
  hypothesis_id: H-FNDSA-baa8da
  derived_from_idea: IDEA-20261018-045269
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  version: 1
  status: review_required
  frozen: false
  execution_authorized: false
  evidence_eligible: false
  designed_at: '2026-10-18'
  batch: PQC-100-20261018
  title: Simulated exponent-leak learning curve on toy Falcon
  objective: >-
    Reduce uncertainty in how the signature count for key recovery depends on leak noise,
    tree level and dimension.
  what_this_is_not:
  - >-
    Not an attack on any deployed system, real key or third-party service: every instance
    is self-generated at the stated reduced scale.
  - >-
    Not approval, freezing, execution authorization, a run, or evidence. No run has been executed
    under this contract.
  - >-
    Not a security level for the standardized scheme; any reduced-scale number transfers only
    under the stated scale_relevance assumption.
  inputs:
    instrument: >-
      Python 3, NumPy, fpylll (BKZ 2.0), toy Falcon port with exact-rational verification
      of recovered keys
    parameters: >-
      n in {16, 32, 64, 128}; q = 12289; eps in {0, 0.05, 0.2, 0.4}; leak level in {all, top_half,
      leaf_only}; 10 keys per cell; signature cap 2000 per trial; BKZ block size up to 40
    procedure: >-
      1. Generate keys with fixed seeds. 2. Sign random messages through the oracle-wrapped
      sampler, logging bucket leaks. 3. After every 5 signatures run bucket MLE and embed
      hints; run BKZ-20 then BKZ-40. 4. Stop at first certified recovery (h = g/f mod q and
      a fresh signature verifies). 5. Record N*. 6. Repeat for null and positive oracles.
  controls:
  - >-
    null: leak oracle returns exponents of centers computed under an independent random key
    with the same public key format; recovery must fail up to 5x the predicted N*
  - >-
    positive: eps = 0 and full-precision center values leaked; recovery must succeed within
    a handful of signatures
  - >-
    A/A: identical configuration run on two disjoint key/seed blocks; N* ratio sets the noise
    floor
  independent_variables:
  - leak_noise_eps
  - leak_level
  - dimension_n
  metrics:
    primary:
    - N* median and IQR per cell
    secondary:
    - BKZ block size at success
    - MLE hint error variance
    - null-arm recovery count
  heuristic_under_test: HEUR-001
  preregistered_prediction:
    quantity: N* ratio eps=0.2 vs eps=0 at n=64
    formula: N*(eps)/N*(0) ~ I(0)/I(eps) with I the bucket-channel mutual information
    source: channel-capacity argument in mechanism
  scale_relevance:
    tier: toy
    justification: >-
      n <= 128 with simulated leak; transfer to 512/1024 only through the fitted slope b,
      reported with its CI
    correspondence: null
  tail_checks: []
  replication:
    seeds:
    - 2026101800
    - 2026101801
    - 2026101802
    - 2026101803
    - 2026101804
    - 2026101805
    - 2026101806
    - 2026101807
    - 2026101808
    - 2026101809
    independent_instances: 10
  budget:
    enforcement: advisory
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 40
    maximum_memory_gb: 8
    maximum_runs: 60
  stopping_rules:
  - stop a cell after 2000 signatures without recovery and record censored
  - stop the sweep if the positive control fails at n = 32
  invalidation_rules:
  - timeout/crash is failed_infrastructure, never negative evidence
  - any recovery in the null-oracle arm invalidates the whole run
  - recovered key not passing exact verification counts as failure
  - >-
    A timeout, crash, memory exhaustion or dependency failure makes the run failed_infrastructure
    and is never negative mathematical evidence (AGENTS.md rule 5).
  success_criterion: >-
    P1 holds in C1 (ratio >= 2 at n=64) and P3 holds in C3, each exceeding the AA1 noise floor.
  falsification_criterion: >-
    C1 ratio below 1.3 or C3 slope outside [0, 1.5]; either rejects the channel-capacity scaling
    model.
  decision_impact:
    on_positive: >-
      Use the fitted law to state a signatures-per-noise budget at reduced n and propose F8-style
      estimator transfer to n = 512.
    on_negative: >-
      Drop the capacity model; the leak's value is not summarised by mutual information and
      needs per-level modelling.
  variable_ledger:
    independent:
    - name: leak_noise_eps
      levels:
      - '0'
      - '0.05'
      - '0.2'
      - '0.4'
    - name: leak_level
      levels:
      - all
      - top_half
      - leaf_only
    - name: dimension_n
      levels:
      - '16'
      - '32'
      - '64'
      - '128'
    factors:
    - name: seed_block
      treatment: randomized
      value: two disjoint blocks of 5 keys
      how: keys and message streams drawn from block-specific SHAKE seeds
    - name: bkz_schedule
      treatment: fixed
      value: BKZ-20 then BKZ-40, 8 tours
      how: frozen in manifest
    comparisons:
    - id: C1
      arms:
      - eps=0.2
      - eps=0
      differs_in:
      - leak_noise_eps
      design: one_factor
    - id: C2
      arms:
      - leaf_only
      - top_half
      differs_in:
      - leak_level
      design: one_factor
    - id: C3
      arms:
      - eps=0 across n
      differs_in: []
      design: absolute
    - id: AA1
      arms:
      - eps=0 n=64 seed-block A
      - eps=0 n=64 seed-block B
      differs_in:
      - seed_block
      design: aa
    crosses_map: false
  prediction_provenance:
  - prediction: P1
    first_recorded_in: ledger/proposals/IDEA-20261018-045269.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P2
    first_recorded_in: ledger/proposals/IDEA-20261018-045269.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  - prediction: P3
    first_recorded_in: ledger/proposals/IDEA-20261018-045269.yaml
    written_at: '2026-10-18'
    data_seen: []
    sample_status: out_of_sample
    overlap: 'none: written before any run'
  required_artifacts:
  - manifest.yaml with seeds, eps grid and BKZ schedule
  - raw-result.json with per-trial N* and censoring
  - recovery certificates (f, g, verifying signature) per success
  - learning-curve plot and PDF report
  - >-
    report.md, at least one graph (SVG/PNG) and a PDF per the research-visuals skill, negative
    results included
  assigned_to: executor
  approved_by: null
