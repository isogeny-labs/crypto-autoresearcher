[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-autoresearcher"
version = "0.3.0"
description = "Runtime-neutral multi-agent harness for reproducible research across domains"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "sympy>=1.12"]

[project.optional-dependencies]
# The api_direct runtime and the eval harness. Kept optional so the ledger and
# experiment toolchain stays installable from a small, slow-moving dependency
# set -- a run record has to be reproducible years from now.
# Fast engine for tools/isogeny_dreg_search_fast.py: C-speed F_p polynomial
# arithmetic.  The reference engine and its tests run without it.
fast = ["python-flint>=0.7"]
# Fast GF(2) Macaulay engine (crypto_autoresearcher.gf2) for the CERTBIN
# experiments. Its native kernels need only a C compiler at first use.
gf2 = ["numpy>=1.26"]
# CUDA trailing-update path for crypto_autoresearcher.gf2.gpu (CuPy + NVRTC).
# Not required for the CPU OpenMP pass or the rank-only instrument.
gf2-gpu = ["numpy>=1.26", "cupy-cuda12x>=13"]
# Vectorised decomposition scan for crypto_autoresearcher.index_calculus.  The
# pure-Python path is the reference and gives identical relations and counts;
# numpy only makes the 24-32-bit sweeps affordable.
index-calculus = ["numpy>=1.24"]
# RSS watchdog for the bounded CryptoMiniSat k11 factor-base runner.
icperf-sat = ["psutil>=5.9"]
# The wide packed-tail tests execute the bounded JIT backend for p < 2^50.
icperf-wide = ["numba"]
# The integer-lattice instrument refuses versions other than these exact pins.
icperf-lattice = ["sympy==1.14.0", "fpylll==0.6.4", "cysignals"]
# PPO agent of harness/rl_isogeny (tools/rl_isogeny_search.py --agents ppo).
# The environment, the exact-rank reward meter, the random and tabular-Q agents
# and every control run on the standard library; torch is only the neural
# policy, so a run record that used it pins the version in environment.json.
rl = ["torch>=2.0"]
agent = ["langgraph>=1.0,<2", "langchain-core>=1.0,<2", "langgraph-checkpoint-sqlite>=3.0,<4"]
# Closed Research Loop v2 contracts.  Keep this optional until a later phase
# wires the controller into the base ledger-only command path.
research-loop = ["pydantic>=2,<3"]
# The local peer daemon is deliberately separate from the ledger-only install.
# It speaks Streamable HTTP over loopback and persists only rebuildable
# coordination state; FastMCP is imported lazily by the daemon factory.
campaign-mcp = ["fastmcp>=3.4.3,<4"]
capability = ["jsonschema>=4"]
dev = ["pytest>=8.0"]
# Curvesmash's shared verifier. Optional, immutable and checked by source digest
# before phases run; base ledger/experiment installs keep their existing surface.
verifier = ["llm-verifier @ git+https://github.com/Layr-Labs/llm-verifier.git@8c1f098875fae0750c29ecfd641f7c9fc53a0f41"]
# Pollard-rho distinguished-point store (RDS). Optional: scripts/rho_dp/worker.py
# falls back to the `psql` CLI when psycopg is missing (CADO EC2 smoke path).
rho-dp = ["psycopg[binary]>=3.1"]

[project.scripts]
autoresearch = "orchestration.cli:main"
autoresearch-adapter = "orchestration.adapter.cli:main"
autoresearch-agent = "orchestration.agent.cli:main"
autoresearch-eval = "orchestration.eval.cli:main"
autoresearch-campaign-mcp = "orchestration.campaign.mcp_server:main"

[tool.setuptools]
# INSTALL WITH `pip install -e .`
#
# This is a repository-resident tool, not a redistributable library: role
# contracts (AGENTS.md, agents/*.md), suites, and the ledger live at the
# repository root and are located relative to the package. A non-editable
# install puts the package in site-packages and those lookups break --
# `autoresearch doctor` detects that and says so.
packages = ["orchestration", "orchestration.adapter", "orchestration.agent",
            "orchestration.campaign", "orchestration.eval", "orchestration.executors",
            "orchestration.formal", "orchestration.knowledge", "orchestration.routing", "harness",
            "crypto_autoresearcher", "crypto_autoresearcher.index_calculus",
            "crypto_autoresearcher.gf2", "crypto_autoresearcher.gf2.gpu"]

[tool.setuptools.package-dir]
crypto_autoresearcher = "src/crypto_autoresearcher"
"crypto_autoresearcher.index_calculus" = "src/crypto_autoresearcher/index_calculus"
"crypto_autoresearcher.gf2" = "src/crypto_autoresearcher/gf2"
"crypto_autoresearcher.gf2.gpu" = "src/crypto_autoresearcher/gf2/gpu"

[tool.setuptools.package-data]
# The native GF(2) kernels are compiled from source on first use (ctypes).
"crypto_autoresearcher.gf2" = ["_kernels.c", "README.md"]
"crypto_autoresearcher.gf2.gpu" = ["*.cu", "*.md"]
# Vendored taskq.task-spec/v1 and task-result/v1 schemas (harness/taskq_bridge.py).
"harness" = ["taskq_schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
