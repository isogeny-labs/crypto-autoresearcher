notes: |
  The frozen Stage-1 files name bitmask polynomials 313 and 471 and
  report degree 8 for each. Their exact definitions and product are
  bound by binstd-x17-factorization.yaml. This target proves both
  factors irreducible over ZMod 2 using the seventeenth cyclotomic
  polynomial and orderOf(2 mod 17) = 8. It does not establish the
  normal-basis Frobenius module structure of the archived field,
  classify its invariant subspaces, or prove any empirical yield.
claim: |
  In (ZMod 2)[X], the two polynomials
  X^8 + X^5 + X^4 + X^3 + 1 and
  X^8 + X^7 + X^6 + X^4 + X^2 + X + 1
  are both irreducible.
