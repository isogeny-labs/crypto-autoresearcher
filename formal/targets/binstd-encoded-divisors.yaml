claim: |
  In the exact bitmask remainder computation defined by
  CryptoResearch.Binstd.EncodedDivisors.noSmallMonicDivisor, each of the
  archived natural numbers 131081, 313 and 471 returns true after testing
  all monic divisor masks of degree one through half its encoded degree.
  The three candidate counts are exactly 510, 30 and 30 respectively. The
