notes: |
  Model Com(m,r)=m•G+r•H over a field module with H=alpha•G, alpha nonzero,
  and injective scalar action by G. The exact audited declaration must expose
  the nonzero kernel relation, arbitrary-message alternate openings, the full
  kernel characterization, and recovery of alpha from a different-message
  collision.

  Pedersen's primary theorem already assumes the relation is unknown and
  derives it from a collision. The target rejects literal algebraic
  independence shorthand; it is not a computational binding or DLP theorem.
claim: |
  Let F be a field, V an F-module, G,H : V, and nonzero alpha : F with
  H=alpha•G. Assume a |-> a•G is injective. For Com(m,r)=m•G+r•H, prove that
  (alpha,-1) is a nonzero kernel vector and characterize the entire kernel by
  m+r*alpha=0. Prove that every opening can be changed to any requested
  message m' using r'=r+(m-m')/alpha.

  Conversely, prove that colliding openings with different messages have
  different blinders and recover alpha=(m-m')/(r'-r). Include a concrete
  ZMod 5 collision as a nonvacuity control. These are algebraic statements;
  computing alpha without an opening collision remains a computational DLP
  assumption outside the target.
proof_map:
  prerequisites:
    - "The scalar map generated by G is injective, reflecting an exact prime-order generator; concrete curve/subgroup refinement is not formalized"
    - "The relation H=alpha•G and nonzero alpha are explicit inputs; the target does not claim that an outsider can compute alpha"
    - "No adversary, runtime, success probability, generator-derivation ceremony, hiding theorem, commitment parser or DLP reduction is supplied"
