notes: |
  Formal twin of the Python certificate of KN-FIND-936151 (tools/lemma4_inside_form.py,
  tools/test_lemma4_inside_form.py, and the independent recheck.py under
  coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/).
  The Lean file encodes both N <= 3 witnesses as finite F_2 data (polynomials as
  duplicate-free exponent-vector lists), defines the equality reading of conditions
  (1)-(3) of Nagao 2015/984 Definitions 5 and 6, and proves by kernel `decide`
  (no native_decide) d_F(S) = 3 and d'_F(S) = 2 for S = {f_1, f_2} u S_fe,
  hence the exact negation of Lemma 4 in the inside form for each of the two systems
  (lemma4_inside_false_A, lemma4_inside_false_B) and, as a corollary, for the
  universally quantified statement (lemma4_inside_false).
  Per KN-FIND-936151 this asserts NOTHING about Nagao's Proposition 5, Semaev's
  Assumption 1, p >= 3, N > 3, the literal >= reading of condition (1) (under which
  the lemma is true and empty), or any elliptic curve. Cofactor domain: monomials of
  degree <= D (multilinear on the fake side), as in the Python certificate; the
  leading-form argument that this loses no cofactor is not a Lean theorem.
  Fake-side generators that reduce to zero mod S_fe are dropped (inertness); only
  reduce_fe_zero_2/3 are checked. KN-FIND-936151 is write-once and not edited; this
  receipt is referenced from docs/reports/2026-10-29-nagao-lemma4-lean/report.md.
claim: |
  Over F_2, with the equality reading of condition (1) and the field equations
  X_i^2 + X_i as generators of the true system (inside form), for each of
  A: F_2[X,Y], f_1 = X^2 Y, f_2 = X Y + X, and
  B: F_2[X_1,X_2,X_3], f_1 = X_1 X_2 + X_3, f_2 = X_1 X_3 + X_2,
  the true first fall degree of {f_1, f_2} u S_fe is 3 and its fake first fall degree
  (all products and the sum taken mod S_fe) is 2, so the statement
  d_F <= d'_F of Nagao 2015/984 Lemma 4 is false for that system, and the
  universal statement over finite F_2 systems is false.
proof_map:
  prerequisites:
    - "Nagao 2015/984 Definitions 5 and 6 (with the equality reading of condition (1)) are transcribed faithfully by the list-of-exponent-vectors model in Lemma4Witness.lean; the transcription is not a Lean theorem"
    - "cofactors with product degree <= D range over monomials of degree <= D (multilinear on the fake side): the leading-form degree-additivity argument over F_2[X_1..X_n] is not formalized"
    - "fake-side generators that reduce to zero mod S_fe contribute nothing and may be dropped (inertness, KN-FIND-936151 section 2); only the reduction of the field equations to zero is checked"
    - "the Python certificates (tools/lemma4_inside_form.py, recheck.py) and this Lean model agree because both implement the same definitions, not because a bridge theorem was proved"
