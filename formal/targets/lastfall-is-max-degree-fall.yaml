notes: |
  Caminata-Gorla Theorem 2.8, restated in THM_FALLDEG_INVARIANTS1 section 2.
  Under its explicit finiteness and degree-fall hypotheses, this theorem
  identifies d_F with the greatest degree of a fall. A finite Macaulay rank
  profile can exhibit falls at the degrees it covers. Identifying its largest
  observed fall with d_F additionally requires a checked correspondence with
  the closed spaces V_{F,i} and a bound excluding later falls.

  Specced because, unlike the HKY/HKYY bounds, its proof needs NO Groebner
  machinery. Definition 1.5 is a closure condition on a family of vector
  subspaces, d_f is a minimum over that family, and the proof of Theorem 2.8 is
  two inclusions argued directly from the definition plus finiteness of d_F.
  Mathlib carries everything that needs: MvPolynomial, Submodule, and complete
  lattices for the "smallest subspace such that" construction. That makes it
  the first statement in this lane about the invariants THEMSELVES, rather than
  about one identity in one system, that is plausibly in reach.

  The finiteness of d_F is a genuine hypothesis, not a triviality: Caminata-Gorla
  get it as a consequence of the existence of a Groebner basis. Formalize it as
  an EXPLICIT HYPOTHESIS (F has a degree fall, and d_F is finite) rather than
  reproving it, or the target drags in the machinery it was chosen to avoid.
  Reporting that hypothesis as unavoidable is an acceptable outcome.

  Do NOT formalize Theorem 3.1 alongside it. That one needs reduced Groebner
  bases, degree-compatible term orders and row-echelon Macaulay matrices, and is
  out of reach at present Mathlib cost.

  Scope: this is a theorem about an invariant, not about ECDLP. It bounds
  nothing about the Semaev systems and is not evidence toward RQ-DREG-bd6c86's
  growth question. See THM_FALLDEG_INVARIANTS1 section 3.1 for what is and is
  not settled.
claim: |
  Let k be a field, R = k[x_1, ..., x_n], and F a subset of R generating the
  ideal (F).

  For each natural number i, let V_{F,i} be the smallest k-vector subspace of R
  such that:
    - F intersected with R_{<=i} is contained in V_{F,i}; and
    - whenever f is in V_{F,i} and g is in R_{<= i - deg(f)}, the product fg is
      in V_{F,i}.

  Define the last fall degree of F as
      d_F = min{ d : f is in V_{F, max(d, deg f)} for every f in (F) }.

  For f in (F) define d_f = min{ d : f is in V_{F,d} }; note d_f >= deg(f)
  always. Say f HAS A DEGREE FALL when d_f > deg(f), and say F has a degree
  fall when some f in (F) does.

  Assume d_F is finite and that F has a degree fall. Then

      d_F = max{ d_f : f in (F) and d_f > deg(f) }.

  That is, the last fall degree is exactly the largest degree at which a degree
  fall occurs.

  Proof sketch (Caminata-Gorla, Theorem 2.8). For the inequality d_F >= sup:
  if d_f > deg(f) then f is not in V_{F,d} for any d < d_f, so d_F > d_f - 1 by
  the definition of last fall degree; finiteness of d_F turns the supremum into
  a maximum. For the reverse: set mu equal to that maximum and fix f in (F). If
  d_f > deg(f) then f is in V_{F,d_f} which is contained in V_{F,mu}, and
  mu = max(mu, deg f) because mu >= d_f > deg(f). If d_f = deg(f) then f is in
  V_{F,deg(f)} which is contained in V_{F,max(mu,deg f)}. Either way f lies in
  V_{F,max(mu,deg f)} for every f in (F), so mu belongs to the set defining d_F
  and hence d_F <= mu.
