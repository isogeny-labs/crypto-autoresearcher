notes: |
  Formalizes the integer divisibility and representative-bound core only.
  The theory note records why the source's odd-n and R=2^s hypotheses are
  replaced by an explicit negative-inverse congruence, and why the conclusion
  R*w = a (mod n) is the multiplication-form counterpart of w = a*R^-1.
  Complexity, implementation, and inverse construction remain out of scope.
claim: |
  If 0 < n < R, 0 <= a < n, 0 <= u < R, n*n' = -1 modulo R, and
  u = a*n' modulo R, then there is an integer w with a + u*n = R*w,
  0 <= w < n, and R*w = a modulo n.
