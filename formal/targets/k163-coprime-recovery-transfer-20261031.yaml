notes: |
  Conditional abstract-subgroup transfer theorem. It reuses the existing
  formal K-163 subgroup-order constant and kernel-checks that 45,641 is
  coprime to it. It does not construct or certify the missing K-163 vertical
  isogeny, algebraic dual, field of definition, exceptional-point behavior,
  endpoint subgroup bridge, transfer cost, or ECDLP advantage.
claim: |
  Let r be the standard K-163 subgroup-order constant and d = 45,641. Lean
  checks gcd(d,r)=1. For additive commutative groups E and E', additive
  homomorphisms phi:E->E' and recovery:E'->E satisfying
  recovery(phi(X))=[d]X for every X, an exact order-r generator P, and an
  r-torsion target Q, the relation phi(Q)=[k]phi(P) holds if and only if
  Q=[k]P for every integer k. Thus the supplied recovery composition is an
  injective, scalar-relation-preserving transfer on the r-torsion. When Q is
  separately known to lie in the cyclic subgroup generated by P, this is a
  discrete-log-preservation statement on that selected subgroup.
proof_map:
  depends_on:
    - endosweep-koblitz-curve-certificates.yaml
  prerequisites:
    - "The actual K-163 prime subgroup is represented by an exact order-r generator; the named theorem takes exact additive order as a hypothesis."
    - "The concrete degree-45,641 vertical point map and recovery/dual exist over the declared working field and are additive homomorphisms; Lean does not construct them."
    - "The point-level recovery composition equals multiplication by 45,641, including exceptional inputs and normalization; the theorem assumes this identity."
    - "For endpoint-to-source transfer, the opposite composition is required separately; this target proves the source-to-endpoint direction only."
