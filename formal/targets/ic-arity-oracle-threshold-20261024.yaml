notes: |
  Cost-model algebra for Semaev-style index calculus in exponents base r:
  costAll(m, beta, k) = max(max(0, 1 - beta(m-1)) + k beta, 2 beta) for an oracle
  returning every decomposition of its target, costOne with
  max(0, 1 - beta m) + beta for a one-decomposition oracle. The file proves the
  lower bounds 2/(m+1-k) (k <= 2), k/(m-1) (k <= m-1) and 1 (k >= m-1), their
  attainment, the thresholds against 1/2, the meet-in-the-middle (k >= m/2) and
  exhaustive (k = m-1) corollaries, costAll <= costOne, the one-decomposition
  bound (1+k)/m, a non-vacuity witness at (5, 1/5, 1), and one proves-too-much
  control per hypothesis H1-H4. Heuristics H1-H4 (yield, relation count, sparse
  linear algebra, oracle cost B^k) are hypotheses of the model and are named in
  the file header; nothing about curve points, measured counts or o(1) terms is
  proved. Formalises the lineage IDEA-20260803-fa9839 / IDEA-20260808-2ef5c8;
  proposed as the proof upgrade (kind cost_model -> proof) of
  LEAD-ICE-generic-oracle-arity-cost-floor, conditional on H1-H4 and a separate
  sheriff review.
claim: |
  Within the two-term cost model H1-H4, for real m >= 2, beta > 0 and k >= 0,
  the all-decompositions cost exponent is at least 2/(m+1-k) when k <= 2 and
  k <= m-2, at least k/(m-1) when k <= m-1, and at least 1 when k >= m-1, each
  bound attained; it is below 1/2 iff m > k+3 (k <= 2) or 2k < m-1 (k >= 2);
  every oracle of order k >= m/2 (meet in the middle) is strictly above 1/2 at
  every arity, and the one-decomposition exponent is never below the
  all-decompositions one and equals (1+k)/m at its optimum for 1 <= k <= m-1.
