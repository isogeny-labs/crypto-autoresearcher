notes: |
  Section 8 of the source note. At arity 2 a free all-decompositions oracle over
  an unstructured base is a pair-sum table of size B^2 (IDEA-20260830-4ab603), so
  time2(beta) = max(1 - beta, 2 beta) and mem2(beta) = 2 beta in exponents. The
  file proves time2 >= 2/3 for every beta with the unique minimiser beta = 1/3,
  mem2 = 2/3 there (so BSGS at (1/2, 1/2) dominates the time-optimal point on
  both axes), time2 > 1/2 for every beta, time2 >= 3/4 whenever mem2 <= 1/2, a
  non-vacuity witness and the H5 control. Hypotheses H1-H3 of the arity theorem
  and H5 (the table charge) are named in the header; nothing about
  implementations, curve points or finite sizes is proved.
claim: |
  For every real beta, max(1 - beta, 2 beta) >= 2/3 with equality only at
  beta = 1/3, where the memory exponent 2 beta equals 2/3; hence the time-optimal
  point (2/3, 2/3) of the free arity-2 oracle family is dominated by BSGS at
  (1/2, 1/2) on both axes, every point of the family has time exponent above 1/2,
  and a memory exponent at most 1/2 forces a time exponent at least 3/4.
