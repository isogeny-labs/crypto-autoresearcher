notes: |
  This is a numeric certificate, the sixth batch of
  CryptoResearch.Endosweep.DkExact, and it reuses that file's DkCert,
  DkCert.Statement and DkCert.statement_of_holds (imported, not redefined).
  The per-curve constants (p, t, h, n, D_K, f, the squarefree part s, the
  min_nonscalar_degree value, floor(log2 |D_K|) and the factorisation) were
  generated from dk_exact.json and factorizations.jsonl in
  research/endosweep_dk_exact_batch6_20261105 by the batch-1 generator
  research/endosweep_dk_exact_20261016/lean/gen_dk_exact_lean.py with
  --dir research/endosweep_dk_exact_batch6_20261105 --module DkExactBatch6.
  The script re-derives each number and refuses to write on a mismatch. The
  closed arithmetic is checked by `decide +kernel` (exact big-integer
  arithmetic in the kernel); the certificate nums_ed_511_mers_certificate is
  collected by exact_discriminants. A negative control with one changed digit
  fails.

  What is unconditional: p + 1 - t = h*n, t^2 - 4p = D_K*f^2, the product of
  the certificate's prime powers, the odd-exponent primes and their product s
  (the squarefree part of 4p - t^2), the D_K construction (D_K = -s with
  D_K = 1 mod 4, or D_K = -4s with -s = 2 or 3 mod 4), IsDisc (D_K < 0,
  D_K = 0 or 1 mod 4), the degree value and its 2^(L-2) bound. The one
  odd-exponent factor below 10^8 (11) is checked by the existing small-prime
  check.

  What is conditional: "D_K is fundamental" assumes the odd-exponent factors
  above 10^8, listed in `largePrimes` (a 21-digit, a 47-digit and an 86-digit
  prime), are prime. PARI isprime proved them; Lean does NOT (the same
  explicit hypothesis as NistCertificates and DkExact). The 47- and 86-digit
  split was found by this project's driver with CADO-NFS 3.0.0. Primality of
  p and n is not proved either.

  Out of scope: that t is the trace of Frobenius of the named curve, and that
  End(E) is an order of discriminant D_K f'^2 (elliptic-curve theory). The
  curves certified in NistCertificates, DkExact and DkExactBatch2 to
  DkExactBatch5 are not repeated here.
claim: |
  For the 1 curve of research/endosweep_dk_exact_batch6_20261105/dk_exact.json
  (nums/ed-511-mers), with p, t, h, n, D_K, f, s and the factorisation as
  recorded there:
    p + 1 - t = h*n;
    t^2 - 4p = D_K * f^2;
    4p - t^2 = prod p_i^e_i (the factorisation certificate);
    the odd-exponent p_i multiply to s, and D_K = -s or -4*s as
      nist.exact_discriminant computes it; D_K is a discriminant;
    min_nonscalar_degree(D_K) is the recorded value, 2^L <= |D_K| < 2^(L+1)
      and min_nonscalar_degree(D_K) >= 2^(L-2);
    and, if the listed factors above 10^8 are prime, D_K is a fundamental
      discriminant.
  Moreover |D_K| >= 2^510 and min_nonscalar_degree(D_K) >= 2^508.
