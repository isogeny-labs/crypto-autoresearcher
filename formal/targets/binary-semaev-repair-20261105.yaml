  Coefficient twist uses Frobenius. This proves raw S3 repair; it does not formalize disjoint supports, coefficient descent, localization, or the complete 3ell+1 bound.
claim: |
  Over a field of exponential characteristic 2, if x,y,u have total degree at most one, then binaryS3(x,y,u,a)-binaryS3Reduced(x,y,u,a) lies in V({X_i^2-X_i},4).
