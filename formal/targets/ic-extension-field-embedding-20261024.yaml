notes: |
  AUD-3 proof upgrade proposed for LEAD-ICP-extension-field-embedding (closed,
  kind cost_model). Under H6 (Gaudry's heuristic cost p^(2-2/n+o(1)) on
  E(F_{p^n}) with the subfield base, KR-IC-46d822) the embedded problem's
  exponent in base p is 2 - 2/n. The file proves 1/2 < 2 - 2/n for every real
  n >= 2, that no n >= 2 reaches 1/2, the value 1 at n = 2, a non-vacuity witness
  and the control that the degree hypothesis is load-bearing (n = 1 gives 0).
  H6 stays a hypothesis; nothing about Weil restriction, o(1) terms or finite
  sizes is proved. The claim text is quoted from the report section named in
  `source`.
claim: |
  For every real n >= 2, 1/2 < 2 - 2/n; equivalently there is no n >= 2 with
  2 - 2/n <= 1/2, so the embedding enlarges the problem faster than the subfield
  base helps, at every extension degree. Without the hypothesis n >= 2 the
  statement fails at n = 1.
