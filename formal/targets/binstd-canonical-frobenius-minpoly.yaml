notes: |
  The frozen n=17 file specifies normal-basis circulant / F_2-factorization
  of x^n-1 and lists factor bitmasks 3, 313, 471. This theorem applies
  Mathlib's finite-field Frobenius facts to the canonical GaloisField 2 17,
  then uses the source-bound Lean factor product. It does not identify
  that canonical field with the archived polynomial-basis runner, classify
  invariant subspaces, or verify empirical yields.
claim: |
  For the canonical field GF(2^17), the F_2-linear Frobenius map x↦x²
  has order 17, and its minimal polynomial equals the product of the
  three n=17 archived factor polynomials, bitmasks 3, 313 and 471.
