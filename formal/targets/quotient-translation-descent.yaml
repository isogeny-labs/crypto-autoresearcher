notes: |
  Minted to discharge sheriff finding L1 (SHF-20261016-3caa6f): the note's
  formal target had been committed as an unchecked `axiom` stub at
  research/THM_QUOTIENT_DESCENT1.lean, now removed. The group-law identity
  only; the identification of degree-2 maps E -> P^1 with quotients by
  [-1] o tau_S, and of "descends" with "commutes with iota_S", stay prose.
  The stub's hypothesis 2 S = 0 is unused and dropped (sheriff L2: S need not
  be 2-torsion), so the statement is stronger than the stub's.
claim: |
  In an additive commutative group E, for all S and T:
  (for every P, -(P + S) + T = -(P + T + S)) holds if and only if 2 T = 0.
  That is, translation by T commutes with the involution
  iota_S(P) = -(P + S) exactly when T is 2-torsion, whatever S is.
