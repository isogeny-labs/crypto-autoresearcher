notes: |
  Additive correction of the historical arity/oracle target. The theorem is
  confined to exact real-number max-envelope algebra. It preserves the old
  target and source bytes, distinguishes an infimum from an attained minimum,
  distinguishes optimized from pointwise half thresholds, and includes F1-F5
  plus positive and known-false controls. It contains no implemented oracle,
  curve family, probability/rank theorem, growing-arity uniformity theorem,
  transfer/descent, end-to-end cost, PFSE bridge, or ECDLP conclusion.
claim: |
  For real m >= 2, k >= 0 and beta > 0, set d=m-1-k,
  q_F=max(k,2), q_G=max(k+1,2), and H(d,q,beta)=
  max(1-d beta,q beta). The historical costs rewrite exactly to H with q_F
  and q_G. Over beta>0, H has infimum q/(d+q), uniquely at
  beta=1/(d+q), when d>0; infimum/minimum 1 exactly for
  0<beta<=1/q when d=0; and unattained infimum 1 when d<0. Its optimized
  value is below/equal/above 1/2 exactly when d is greater/equal/less than q.
  For d>q its pointwise values are below 1/2 exactly on
  1/(2d)<beta<1/(2q) and equal 1/2 exactly at the endpoints; d=q has the
  single equality beta=1/(2q); d<q is pointwise above 1/2.
  The all-return cost is pointwise no larger than the one-return cost, with
  equality exactly when k<=1 or beta<=1/m. Their optimized values are equal
  exactly when k<=1 or k>=m-1 and strictly ordered exactly when
  1<k<m-1, including equal but unattained infima above m-1.
  Under k>=m/2 the all-return cost is pointwise above 1/2, with sharp
  optimized class bounds 4/(m+2) for 2<=m<=4 and m/(2(m-1)) for m>=4;
  the one-return bound is 1/2+1/m. Boundary witnesses attain these class
  bounds, while an explicit growing-m schedule proves there is no uniform
  positive gap above 1/2. The aggregate proposition also contains the exact
  F1-F5 counterexamples/boundaries and the values F(5,1/5,1)=2/5 and
  F(3,1/4,0)=1/2, plus a named negation of blanket attainment.
