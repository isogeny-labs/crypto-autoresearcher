# Stable foundation pin; lake-manifest.json also pins every transitive dependency.
name = "CryptoResearch"
defaultTargets = ["CryptoResearch"]

[[require]]
name = "CryptoLean"
git = "https://github.com/aburan28/crypto-lean"
rev = "60952c696ded7f3da4f4517006d9af6482662487"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "cfc55fc58714a59dc06e6e79edc6d1d95140d3c2"

# `.*` is "this module AND every submodule", so a theorem file staged into
# CryptoResearch/ by the formalizer is built without anyone editing this file.
# The root module that imports them is generated: tools/rebuild_formal_root.py.
#
# NOT `.+`, which this said until the CI proof gate first ran end to end. Lake's
# `.+` is submodules WITHOUT the module itself, so CryptoResearch.olean was
# never built while `lake build` still reported success -- and AxiomAudit.lean,
# which opens with `import CryptoResearch`, could never resolve it. The audit
# that is supposed to be the lane's machine evidence had therefore never once
# run to completion. Verified against Lake v4.35.0-rc1 in a standalone package:
#   ["Lib.*"] -> Lib.olean + Lib/Sub.olean
#   ["Lib"]   -> Lib.olean only (a staged module the root does not import is skipped)
#   ["Lib.+"] -> Lib/Sub.olean only, NO Lib.olean
[[lean_lib]]
name = "CryptoResearch"
globs = ["CryptoResearch.*"]
