# Research priority and budget policy.
#
# Declared on user instruction (2026-09-04):
#   1. All ECC goals have UNLIMITED budget.
#   2. ECC goals take priority over every other goal, always.
#   3. Open ECC ideas must be designed into experiments.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for what counts as ECC. It is read by
# tools/ecc_priority.py, and through it by tools/goal_portfolio_health.py and
# tools/validate_ledger.py. Do not re-derive the set anywhere else, and do not
# infer it from an identifier prefix: several ECC areas are NOT named for
# elliptic curves (CRYPTO-001 is an ECDLP search; DREG/MONO/RELN/SDEG/SIG/ICEX
# are Semaev and index-calculus machinery), and several elliptic-sounding ones
# are not ECC. Membership below was decided by reading each area's goal titles,
# not its acronym.
#
# To change the classification, edit THIS FILE. Every consumer follows.

version: 1
declared_on: '2026-09-04'
declared_by: user instruction

# ---------------------------------------------------------------------------
# ECC areas. A goal, question, hypothesis, experiment or idea whose identifier
# carries one of these area tokens is an ECC record.
# ---------------------------------------------------------------------------
ecc_areas:
  # --- prime-field ECDLP and its index-calculus machinery ---
  - ECDLP     # prime-field ECDLP breakthrough search
  - ECDLP2M   # characteristic-2 / binary-extension ECDLP index-calculus sibling
  - OAKLEY    # RFC 2409 EC2N groups 3 and 4 -- E/F_{2^155} and E/F_{2^185}, both quintic
              # over a large subfield (155 = 5*31, 185 = 5*37): the point-decomposition
              # problem at Gaudry-Diem n = 5 on standardised, parameter-verified curves.
              # Letters-only sibling of ECDLP2M, which allocate_id.py cannot mint under
              # because its code carries a digit; records here roll up to GOAL-ECDLP2M-001.
  - CERTBIN   # the Certicom ECC2 / ECC2K binary-field challenges -- every field degree
              # PRIME (109, 131, 163, 191, 239, 359), so no subfield exists and the
              # index-calculus factor base must be a chosen F_2-subspace V: the
              # complementary object family to OAKLEY. Same letters-only reason;
              # rolls up to GOAL-ECDLP2M-001.
  - NISTBIN   # the FIPS 186-4 binary curves B-/K-{163,233,283,409,571} -- every
              # degree PRIME, so the same no-subfield class as CERTBIN, but these are
              # the standardised and long-deployed instances at the sizes the
              # challenges never reached. Same letters-only reason; rolls up to
              # GOAL-ECDLP2M-001.
  - CRYPTO    # "Reproducible cryptographically relevant ECDLP breakthrough search"
  - PATH      # tiered path toward prime-field ECDLP complexity reduction
  - ENDO      # ECDLP via endomorphisms, isogenous curves, j-invariant structure
  - ECTD      # prime-field elliptic-curve trapdoors, secret isogenies
  - PFDR      # prime-field degree-of-regularity / small-root reach
  - CMFB      # CM-structured prime-field index-calculus factor bases (RQ-CMFB-33610e)
  - ISOU      # isogeny-class search over prime fields
  # --- Semaev summation polynomials, solving degree, relations ---
  - SATIC     # SAT/Semaev correctness and measurement prerequisites
  - DREG      # boolean Semaev m=3 degree of regularity
  - SDEG      # certificate-backed Semaev solving-degree scaling law
  - SIG       # Semaev syzygy-cascade exploitability
  - MONO      # Semaev-cover monodromy / relation-rate gate
  - RELN      # factor-base decomposition probability audit
  - ICEX      # charged toy index-calculus exponent vs rho
  - ICLIFT    # index-calculus factor-base geometry and xedni lifting
  - XEDN      # function-field xedni lifting controls
  - SEMBIN    # Semaev 2015 (ePrint 2015/310) binary-field chained-S_3 algorithm:
              # the validity boundary of its Assumption 1 (d_F4 <= 4), its
              # Section 4.3 yield model, and its memory-charged crossover
              # against Pollard rho. Added 2026-09-13 on freezing the paper
              # (SRC-SEMAEV-2015-310, KN-LIT-fa346d). ECC because the target is
              # ECDLP on the FIPS 186-4 binary curves at n = 409, 571, which the
              # paper claims are theoretically broken; the area token is letters
              # only because RQ/H/EXP identifiers reject digits in the area
              # segment, so "SEM15" is not available.
  - ICPERF    # index-calculus ECDLP performance boundary: measured, phase-
              # decomposed costs (point decomposition / relation search, linear
              # algebra, descent) and a maintained algorithm library for Koblitz,
              # binary-extension and prime-field curves, against matched rho.
              # Added 2026-09-13 on user instruction (RQ-ICPERF-94c86e). ECC
              # because every cell is an ECDLP instance on an elliptic curve.
  # --- isogenies and supersingular curves ---
  - SSI       # supersingular-isogeny cryptanalysis after the SIDH break
  - SSIQ      # toward p^{1/4} on the supersingular isogeny problem
  - P13       # Wesolowski 2026 p^{1/3+o(1)} supersingular isogeny attack
  - CSIDH     # commutative supersingular isogeny Diffie-Hellman
  - SQISIGN   # isogeny-based signature
  - SCURVE    # SafeCurves parameter audits (per-curve elliptic goals)
  # --- curves over Q, rank records ---
  - ECQ       # Mordell-Weil rank over Q
  - ECRANK    # certified elliptic-curve rank records
  # --- elliptic-curve signature schemes ---
  - ECDSA
  - EDDSA
  - TECDSA    # threshold ECDSA
  # --- discrete log on elliptic-curve groups ---
  - AUXIN     # auxiliary-input discrete logarithm (Cheon-type) at deployed params
  - PAIR      # BLS12-381 / BN254 pairing-friendly curves
  # --- user-named targets, added 2026-09-06 (RQ-GRUMPY-964876, RQ-LHW-1877bb,
  #     RQ-FROB-7d8dd4). GRUMPY and LHW are generic-group ECDLP algorithms whose
  #     baseline is this program's rho/BSGS baseline on prime-order elliptic
  #     subgroups; FROB is index calculus on subfield elliptic curves. ---
  - GRUMPY    # exact average-case constant of two-grumpy-giants-and-a-baby
  - LHW       # low-storage low-Hamming-weight DLP at sqrt(binom(m, w)) time
  - FROB      # Frobenius exploitation in subfield-curve index calculus
  # --- user-named target, added 2026-09-16 (RQ-QSP-f9bbdb): quasi-subfield-
  #     polynomial factor bases (Huang-Kosters-Petit-Yeo-Yun 2020, Euler-Petit
  #     2019) as an index-calculus alternative to rho on the ECC2K-130 Koblitz
  #     curve over F_{2^131}. ECC because the target is an ECDLP instance on a
  #     named binary elliptic curve; the area token is letters-only because
  #     RQ/H/EXP identifiers reject digits, so "ECC2K130" is not available. ---
  - QSP       # quasi-subfield-polynomial index calculus at prime extension degree
  # --- user-named target, added 2026-09-20 (RQ-GFPN-c01af8): concrete,
  #     symmetrization-aware Gaudry/Diem/Joux-Vitse index calculus, oracle-
  #     assisted SDHP and odd-characteristic cover attacks on the elliptic
  #     curves over F_{p^5}, p = 2^64 - 2^32 + 1, deployed in STARK/ZK systems
  #     (EcGFp5, EcMasFp5). ECC because every cell is an ECDLP instance on a
  #     named elliptic curve; letters-only token because identifiers reject
  #     digits, so "GFP5" is not available. ---
  - GFPN      # index calculus on E/F_{p^n}, small prime n, at deployed parameters
  # --- user-named target, added 2026-09-22 (RQ-BINSTD-b6f698): index calculus
  #     against the STANDARDIZED BINARY-FIELD CURVE POPULATION as named
  #     targets -- the Certicom ECC2K/ECC2 challenge curves, the FIPS 186-4
  #     binary curves K-163..K-571 and B-163..B-571, the ANSI X9.62 c2tnb*
  #     and c2pnb* curves, and the SECG sect* curves that carry them. ECC
  #     because every target is an ECDLP instance on a named elliptic curve;
  #     the token is letters-only because RQ/H/EXP identifiers reject digits
  #     in the area segment, so "ECC2K130" and "X962" are not available.
  #     Distinct from its neighbours by POPULATION, not by method: QSP owns
  #     one factor-base family at n = 131, SEMBIN owns one paper's chained
  #     S_3 algorithm, ICPERF owns the measured phase-cost instrument, FROB
  #     owns the Frobenius mechanism at toy scale. BINSTD owns the question
  #     of which standardized curve each of those lines actually reaches,
  #     and it runs nothing at deployed parameters. ---
  - BINSTD    # index calculus against the standardized binary curve set
  # --- user-requested campaign, added 2026-10-24 (RQ-PEXT-7c3e91,
  #     GOAL-PEXT-4a1d6b, DEC-20261024-e29f4c): the structural theory of Weil
  #     restriction and GHS-type covers of E/F_{q^n} for n PRIME, in every
  #     characteristic -- genus spectra and floors by class and the invariant
  #     that governs them, at toy scale, with no attack or cost claim. ECC
  #     because every object is an elliptic curve over an extension field and
  #     the question is how its ECDLP descends. Distinct from GFPN (deployed
  #     F_{p^5} curves), ECDLP2M (binary-field index-calculus and descent
  #     cost), FROB and SEMBIN by object and claim type: this area owns the
  #     general mechanism, not any curve population or solver. Letters-only
  #     token because identifiers reject digits in the area segment. ---
  - PEXT      # prime-degree extension descent: GHS cover genus floors at prime n
  # --- user-sustained NIST/ANSI prime-field curve-selection investigation,
  #     opened 2026-10-24 under GOAL-NISTSEED-ab8949 and
  #     RQ-NISTSEED-ac8851. ECC because its object is the historical
  #     construction, acceptance and omission pattern of standardized
  #     prime-field elliptic-curve candidates. It owns no binary-field
  #     index-calculus work (NISTBIN), no deployed-key attack, and no
  #     cryptanalytic claim merely from an implementation replay. ---
  - NISTSEED  # NIST/ANSI prime-field seed/commonality reconstruction

# ---------------------------------------------------------------------------
# Considered and EXCLUDED, with the reason. Recorded so the judgement is
# reviewable and so nobody re-litigates it from the acronym alone. Move an
# entry up into `ecc_areas` to reclassify it; nothing else needs editing.
# ---------------------------------------------------------------------------
excluded_areas:
  CLGRP:  imaginary-quadratic class groups as hidden-order groups; CM-adjacent
          but not an elliptic-curve target
  QALG:   quantum mechanism search across ML-KEM, HQC and CSIDH; only the CSIDH
          third is ECC, the goal as scoped is PQC-wide
  QRE:    quantum resource estimates for RSA-2048 AND 256-bit ECDLP; half ECC,
          but the goal is a costing-pipeline reproduction, not an ECC attack
  SYMF:   symmetric-cryptanalysis frontier (hashes and block ciphers)
  KEX:    key-exchange construction, not curve-specific
  HYBRID: hybrid KEM combiners
  ROS:    ROS problem / concurrent Schnorr signatures
  WFS:    Fiat-Shamir transcript completeness
  SIMSPK: SIMON and SPECK rotation constants
  SERP:   Serpent block-cipher cryptanalysis; symmetric, not an elliptic-curve target
  TFISH:  Threefish / Skein ARX block-cipher cryptanalysis; symmetric, not an elliptic-curve target
  NGCC:   ICCS NGCC round-1 public-key, key-exchange, and hash candidates
          (119 named targets under GOAL-NGCC-6c8a52). Not an elliptic-curve
          area. The three SQIsign submissions and the isogeny NIKE NIIKE are
          NGCC targets here; attacks on the supersingular-isogeny problem
          itself stay with SQISIGN, SSI, and CSIDH.
  SNFS:   special number field sieve (finite fields / factoring)
  DIFFP:  MD5 differential paths

# ---------------------------------------------------------------------------
# Rules
# ---------------------------------------------------------------------------
budget:
  # Instruction 1. An ECC goal's campaign budget is unbounded: these fields
  # must be null. A finite value on an ECC goal is a validation error.
  ecc_unlimited: true
  unbounded_fields: [maximum_batches, total_wall_clock_seconds]
  # `max_concurrent` is NOT unbounded. It is a machine-headroom limit, not a
  # research budget, and oversizing it degrades runs rather than buying any.
  # See launch-research-harness "Concurrency".
  max_concurrent_still_bounded: true
  # What unlimited does NOT mean: it removes the batch ceiling, not the duty to
  # rank. Never dispatch a task you cannot rank ahead of doing nothing.

priority:
  # Instruction 2. ECC first, always, across every selection point.
  ecc_first: true
  applies_to:
    - launch-research-harness step 3 goal selection
    - goal_portfolio_health ordering within every bucket
    - coordinate-research-goal reranking after a checkpoint
    - which impediment to re-check first
  # A non-ECC goal is worked only when NO ECC goal offers a ranked, justified
  # task. Priority orders the queue; it never manufactures ECC work, and it
  # never licenses dispatching an unranked ECC task ahead of a ranked non-ECC
  # one that is already in flight.

idea_design:
  # Instruction 3. An open ECC idea is one whose record is `proposed` and which
  # no hypothesis or experiment references. These are ranked work, not backlog.
  ecc_open_ideas_must_be_designed: true
  worklist: python3 tools/ecc_priority.py --open-ideas
  # Designing means /design-experiment: a hypothesis plus a frozen contract.
  # It does NOT mean approving one. Approval stays a Coordinator act on a
  # committed decision, and a designed contract sits at approved_by: null.
